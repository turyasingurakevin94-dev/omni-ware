<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16203C">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>Omni-Ware Store</title>
<!-- The phone app's native layer (apps/store). Inert in a browser. It
     lives here rather than in the app's own files so a fix to it reaches
     installed phones the same way any change to this page does. -->
<script>
/* The store page inside the Android app (apps/store).

   First in <head>, and only does anything inside the app. Four jobs:

   1. Back (Android) closes what is on top -- a photo, a sheet, then the tab
      -- before it ever leaves the app, and leaving only puts it in the
      background so it reopens instantly.
   2. The status bar: the page draws to the top edge, so a strip behind the
      clock takes the colour of whatever is under it, and its icons stay
      readable against it.
   3. The bars' size: Capacitor measures them into --safe-area-inset-*,
      but a page it has not measured (some phones, after a reload) would
      read zero and slide under the clock -- so the last good measurement
      stands in until it does.
   4. Staying current without a store release: the installed app checks the
      live store.html now and then, keeps a copy of a new one on the phone,
      and switches to it the next time the app goes to the background --
      never in the middle of a trip. */
(function(){
  'use strict';
  var C = window.Capacitor;
  if(!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return;
  var P = C.Plugins || {};
  var App = P.App, Bars = P.SystemBars, WebView = P.WebView, Http = P.CapacitorHttp, FS = P.Filesystem;
  var NAVY = '#16203C';
  var root = document.documentElement;
  // The first installs carried this layer as their own native.js. On those
  // it is already running from above, and only the bars' size (3) is new.
  var legacy = !!document.querySelector('script[src="native.js"]');

  window.owHaptic = function(kind){
    var H = P.Haptics;
    if(!H) return;
    (kind === 'success' ? H.notification({ type: 'SUCCESS' }) : kind === 'warn' ? H.notification({ type: 'WARNING' }) : H.impact({ style: 'LIGHT' })).catch(function(){});
  };

  /* ---- 1. back ---- */
  // The page keeps its own stack of what is open (window.stBack): a sheet,
  // then a screen pushed over a tab, then the tab itself back to Today.
  function back(){
    if(typeof window.stBack === 'function' && window.stBack()) return;
    if(App) App.minimizeApp();
  }
  if(App && !legacy) App.addListener('backButton', back);

  /* ---- 2. the strip behind the status bar ---- */
  var strip = null, lastStyle = '';
  function paintBar(){
    if(!strip) return;
    var top = strip.offsetHeight;
    // Today's navy hero is marked data-navy-top. A pushed page opens on its
    // own dark ground -- the tap-to-go-back strip -- unless it is a page
    // whose navy hero has scrolled away under the clock.
    var page = document.querySelector('#st_pages .st-page:last-child');
    var navy = (page || document).querySelector('[data-navy-top]:not([hidden]), .cv-hero');
    var navyAtTop = !!navy && navy.getBoundingClientRect().top <= top && navy.getBoundingClientRect().bottom > top;
    var ground = page ? getComputedStyle(page).backgroundColor : '';
    var rgb = (ground.match(/\d+/g) || []).map(Number);
    var darkGround = !navyAtTop && !navy && rgb.length >= 3 && (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000 < 90;
    var auth = !!document.querySelector('.st-auth');
    // Over a header (or a page's own dark ground) the strip stays clear: the header runs up under the clock
    // in its own colours. A flat band there read as a second, empty bar on phones that keep the clock apart.
    strip.style.background = auth || navyAtTop || darkGround ? 'transparent' : 'var(--bg)';
    var style = auth || navyAtTop || darkGround || document.querySelector('.st-scrim') ? 'DARK' : 'LIGHT';
    if(style !== lastStyle && Bars){ lastStyle = style; Bars.setStyle({ style: style }).catch(function(){}); }
  }
  var queued = false;
  function soon(){ if(queued) return; queued = true; requestAnimationFrame(function(){ queued = false; paintBar(); }); }
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(insets, 800);
    setTimeout(insets, 2500);
    window.addEventListener('resize', function(){ setTimeout(insets, 300); });
    if(App) App.addListener('resume', function(){ setTimeout(insets, 300); });
    if(legacy) return;
    strip = document.createElement('div');
    strip.setAttribute('aria-hidden', 'true');
    strip.style.cssText = 'position:fixed;top:0;left:0;right:0;height:var(--safe-t, 0px);z-index:59;pointer-events:none;background:' + NAVY + ';';
    document.body.appendChild(strip);
    new MutationObserver(soon).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class'] });
    document.addEventListener('scroll', soon, { passive: true, capture: true });
    paintBar();
  });


  /* ---- 3. the bars' size ---- */
  var INSETS = 'ow-app-insets';
  function insets(){
    if(typeof C.getPlatform === 'function' && C.getPlatform() !== 'android') return;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:var(--safe-t, 0px);padding-bottom:var(--safe-b, 0px);';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe), top = parseFloat(cs.paddingTop) || 0, bottom = parseFloat(cs.paddingBottom) || 0;
    probe.remove();
    var measured = root.style.getPropertyValue('--safe-area-inset-top') !== '';
    var last = {};
    try{ last = JSON.parse(localStorage.getItem(INSETS)) || {}; }catch(_e){}
    if(measured && top > 0){
      if(last.top !== top || last.bottom !== bottom){ try{ localStorage.setItem(INSETS, JSON.stringify({ top: top, bottom: bottom, ours: false })); }catch(_e){} }
      return;
    }
    // Measured at zero: Android has laid the page out below its bars itself.
    if(measured || top > 0) return;
    // Not measured, and the page fills the whole screen -- it is under the
    // bars with nothing telling it how tall they are.
    if(!last.top && Math.abs(screen.height - window.innerHeight) > 16) return;
    root.style.setProperty('--safe-area-inset-top', (last.top || 32) + 'px');
    root.style.setProperty('--safe-area-inset-bottom', (last.bottom || 32) + 'px');
  }

  /* ---- 4. staying current ---- */
  if(legacy || !(WebView && Http && FS && App && window.crypto && crypto.subtle)) return;
  var SOURCE = 'https://omni-ware.vercel.app/store.html';
  var KEY = 'ow-store-bundle';
  var EVERY = 30 * 60 * 1000;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(_e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_e){} }
  function header(h, name){
    var k = Object.keys(h || {}).filter(function(x){ return x.toLowerCase() === name; })[0];
    return k ? h[k] : '';
  }
  function sha256(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  // A file of the bundle running now, as base64 for the Filesystem plugin.
  function fileB64(name){
    return fetch(name, { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error(name + ': ' + r.status);
      return r.blob();
    }).then(function(blob){
      return new Promise(function(ok, fail){
        var fr = new FileReader();
        fr.onload = function(){ ok(String(fr.result).split(',')[1] || ''); };
        fr.onerror = fail;
        fr.readAsDataURL(blob);
      });
    });
  }
  function current(){ return fetch('bundle.json', { cache: 'no-store' }).then(function(r){ return r.json(); }); }

  // After a switch: make the new copy the one the app opens with, and drop
  // the copies nothing points at any more.
  function settle(){
    var s = load();
    if(!s.staged) return Promise.resolve();
    return WebView.getServerBasePath().then(function(cur){
      if(!cur || cur.path !== s.staged.path) return;
      return WebView.persistServerBasePath().then(function(){
        var keep = s.staged.dir;
        s.etag = s.staged.etag;
        delete s.staged;
        save(s);
        return FS.readdir({ path: 'live', directory: 'DATA' }).then(function(r){
          return Promise.all((r.files || []).map(function(f){
            var n = typeof f === 'string' ? f : f.name;
            return n === keep.split('/').pop() ? null : FS.rmdir({ path: 'live/' + n, directory: 'DATA', recursive: true }).catch(function(){});
          }));
        }).catch(function(){});
      });
    });
  }

  function check(){
    var s = load();
    if(s.staged || Date.now() - (s.checked || 0) < EVERY) return Promise.resolve();
    s.checked = Date.now();
    save(s);
    return Promise.all([current(), Http.request({ url: SOURCE, method: 'GET', responseType: 'text',
      headers: s.etag ? { 'If-None-Match': s.etag } : {} })]).then(function(pair){
      var mine = pair[0], res = pair[1];
      if(res.status !== 200) return;
      var html = typeof res.data === 'string' ? res.data : '';
      // Half a page is worse than an old page.
      if(html.length < 100000 || html.indexOf('</html>') === -1) return;
      var etag = header(res.headers, 'etag');
      return sha256(html).then(function(hash){
        if(hash === mine.source){ s.etag = etag; save(s); return; }
        var dir = 'live/' + hash.slice(0, 16);
        var rest = (mine.files || []).filter(function(f){ return f !== 'index.html' && f !== 'bundle.json'; });
        return FS.writeFile({ path: dir + '/index.html', data: window.owAppTransform(html), directory: 'DATA', encoding: 'utf8', recursive: true })
          .then(function(){
            return rest.reduce(function(p, f){
              return p.then(function(){ return fileB64(f); })
                .then(function(b64){ return FS.writeFile({ path: dir + '/' + f, data: b64, directory: 'DATA', recursive: true }); });
            }, Promise.resolve());
          })
          .then(function(){
            return FS.writeFile({ path: dir + '/bundle.json', data: JSON.stringify({ source: hash, files: mine.files }), directory: 'DATA', encoding: 'utf8', recursive: true });
          })
          .then(function(){ return FS.getUri({ path: dir, directory: 'DATA' }); })
          .then(function(u){
            var s2 = load();
            s2.staged = { dir: dir, path: decodeURI(String(u.uri).replace(/^file:\/\//, '')), etag: etag };
            save(s2);
          });
      });
    }).catch(function(){
      // No signal, or the server is down: the copy already here carries on.
    });
  }

  App.addListener('pause', function(){
    var s = load();
    if(s.staged) WebView.setServerBasePath({ path: s.staged.path }).catch(function(){});
  });
  App.addListener('resume', function(){ check(); });
  settle().catch(function(){}).then(function(){ setTimeout(check, 5000); });
})();
</script>
<link rel="manifest" href="/manifest-store.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F7F5F2; --paper:#FFFFFF; --navy:#16203C; --navy2:#243052; --ink:#1C2233; --ink2:#5F6980; --ink3:#767F91; --ink4:#8A93A3;
  --line:#ECE8E1; --rule:#E6E3DD; --soft:#F4F2EE; --soft2:#EFECE6; --dash:#E2DED6;
  --red:#C93A30; --mint:#6FDCB0; --amber:#F5B26B; --amberInk:#95530C; --amberSoft:#FDEEE1; --amberDeep:#7A4A02;
  --green:#0F6B43; --greenSoft:#E4F4EA; --crimson:#8E2A22; --crimsonSoft:#FBE5E2; --rose:#F59A92;
  --indigo:#3A3F9B; --indigoSoft:#E4E6FA; --lilac:#9BA3F0;
  --navyInk:#B3BCD2; --navyInk2:#8D99B5;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --safe-area-inset-top:env(safe-area-inset-top,0px); --safe-area-inset-bottom:env(safe-area-inset-bottom,0px);
  /* The native layer's names for the same two bars (its strip and its probe). */
  --safe-t:var(--safe-area-inset-top); --safe-b:var(--safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font-family:inherit;color:var(--ink)}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- shell ---- */
#st_app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(132px + var(--safe-area-inset-bottom))}
.st-view{animation:stFade .25s ease-out}
@keyframes stFade{from{opacity:.4}to{opacity:1}}
.st-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;box-shadow:0 -1px 0 var(--line),0 -10px 24px rgba(22,32,60,.05);padding:10px 0 calc(12px + var(--safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:start;max-width:520px;margin:0 auto}
.st-nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink3);font-size:11px;font-weight:600;padding:0;position:relative}
.st-nav button[aria-current="page"]{color:var(--navy);font-weight:700}
.st-nav button[aria-current="page"] .icon{fill:var(--navy)}
.st-nav button[aria-current="page"] .icon .hole{stroke:#fff;fill:none}
.st-nav .st-go{justify-self:center;margin-top:-30px;width:64px;height:64px;border-radius:999px;background:var(--red);color:#fff;box-shadow:0 0 0 5px var(--bg),0 10px 24px rgba(201,58,48,.35);justify-content:center}
.st-nav .st-go .icon{width:30px;height:30px;stroke-width:2;fill:none!important}
.st-badge{position:absolute;top:-4px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.st-badge.amber{background:var(--amber);color:var(--navy)}

/* ---- navy hero ---- */
.st-hero{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;border-radius:0 0 28px 28px;padding:calc(16px + var(--safe-area-inset-top)) 16px 16px;display:flex;flex-direction:column;gap:14px}
.st-sheethead{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;padding:calc(10px + var(--safe-area-inset-top)) 18px 16px;display:flex;flex-direction:column;gap:12px}
.st-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navyInk2)}
.st-glass{border-radius:18px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.st-circle{width:40px;height:40px;border-radius:999px;border:none;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.st-circle.light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.st-body{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.st-grip{align-self:center;width:40px;height:5px;border-radius:999px;background:rgba(255,255,255,.22);flex:none}

/* ---- cards / rows ---- */
.st-card{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(22,32,60,.05),inset 0 0 0 1px var(--line)}
.st-list{padding:0 12px}
.st-row{display:flex;align-items:center;gap:10px;min-height:60px;border:none;background:none;width:100%;text-align:left;padding:8px 0;color:var(--ink)}
.st-row + .st-row{border-top:1px solid #F1EEE8}
.st-av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.st-av.round{border-radius:999px}
.st-t{font-size:14px;font-weight:700}
.st-sub{font-size:12px;color:var(--ink3)}
.st-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.st-sec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.st-sec b{font-size:15px;font-weight:700}
.st-sec span{font-size:12px;font-weight:600;color:var(--ink3)}
.st-empty{padding:28px 16px;text-align:center;color:var(--ink3);font-size:14px}
.st-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.st-dot{width:7px;height:7px;border-radius:999px;display:inline-block;flex:none}

/* ---- buttons ---- */
.st-btn{height:56px;border-radius:18px;border:none;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;flex:1}
.st-btn.red{background:var(--red);color:#fff;box-shadow:0 10px 22px rgba(201,58,48,.3)}
.st-btn.navy{background:var(--navy);color:#fff}
.st-btn.ghost{background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.st-btn.green{background:var(--green);color:#fff;box-shadow:0 10px 22px rgba(15,107,67,.3)}
.st-btn.glass{background:rgba(255,255,255,.08);color:#fff}
.st-btn[disabled],.st-btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.st-sq{width:56px;height:56px;flex:none;border-radius:18px;border:none;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;font-weight:700}
.st-foot{margin-top:auto;position:sticky;bottom:0;z-index:5;padding:14px 16px calc(18px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:inherit}
.st-foot:before{content:'';position:absolute;left:0;right:0;top:-20px;height:20px;background:linear-gradient(180deg,rgba(247,245,242,0),var(--bg));pointer-events:none}
.st-dock{position:sticky;bottom:0;z-index:5}
/* the fade above a pinned footer must never sit on the last thing above it */
.st-page :has(+ .st-foot){margin-bottom:20px}
.st-foot .row{display:flex;gap:8px}
.st-hint{display:flex;align-items:center;gap:6px;padding-left:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.st-seg{position:relative;display:grid;padding:4px;border-radius:20px;background:#EAE6DF;box-shadow:inset 0 1px 2px rgba(22,32,60,.08)}
.st-seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(22,32,60,.08),0 6px 14px rgba(22,32,60,.12),inset 0 0 0 1.5px var(--navy);transition:transform .35s cubic-bezier(.3,1.25,.5,1)}
.st-seg button{position:relative;z-index:1;border:none;background:transparent;border-radius:16px;padding:0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink2);transition:color .2s}
.st-seg button[aria-checked="true"],.st-seg button[aria-selected="true"]{color:var(--navy)}
.st-seg.dark{background:rgba(255,255,255,.07);box-shadow:none;border-radius:16px}
.st-seg.dark .thumb{border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.st-seg.dark button{color:#DDE3F0;border-radius:12px}
.st-seg.dark button[aria-selected="true"]{color:var(--navy)}
.st-pick{width:100%;border:none;background:#fff;color:var(--ink);display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.st-pick[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--navy),0 8px 18px rgba(22,32,60,.1)}
.st-pick.drop[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--crimson)}

/* ---- paper slip ---- */
.st-slip{filter:drop-shadow(0 1px 1px rgba(22,32,60,.08)) drop-shadow(0 4px 10px rgba(22,32,60,.07));margin:0 2px}
.st-slip:before,.st-slip:after{content:'';display:block;height:7px}
.st-slip:before{background:linear-gradient(45deg,transparent 50%,#fff 50%) 0 0/12px 7px repeat-x,linear-gradient(-45deg,transparent 50%,#fff 50%) 0 0/12px 7px repeat-x}
.st-slip:after{background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/12px 7px repeat-x,linear-gradient(-135deg,#fff 50%,transparent 50%) 0 0/12px 7px repeat-x}
.st-slip-in{position:relative;background:#fff;padding:2px 14px 5px;display:flex;flex-direction:column}
.st-slip.dark{filter:drop-shadow(0 6px 14px rgba(0,0,0,.28))}
.st-sl{display:grid;grid-template-columns:30px auto minmax(0,1fr);align-items:center;gap:8px;padding:6px 0}
.st-sl + .st-sl{border-top:1px dashed var(--dash)}
.st-slip-in > .st-sl:first-child .n{padding-right:92px}
.st-sl .q{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.st-sl .q small{font-family:Figtree,sans-serif;font-size:11px;font-weight:600;color:#6B7480;letter-spacing:0}
.st-sl .n{min-width:0;font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.st-sl .n .v{display:inline-block;margin-top:2px;padding:0 6px;border-radius:6px;background:var(--soft2);font-size:11px;font-weight:600;color:var(--ink2)}
.st-sl .meta{grid-column:1 / -1;display:flex;align-items:center;gap:8px;padding-top:4px}
.st-sl.struck .n{color:#8A93A3;text-decoration:line-through}
.st-tile{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.st-stamp{position:absolute;right:12px;top:-2px;transform:rotate(-8deg);padding:3px 8px 2px;border:2.5px double currentColor;border-radius:7px;mix-blend-mode:multiply;font-size:12px;font-weight:700;letter-spacing:.14em;animation:stStamp .4s cubic-bezier(.3,1.4,.5,1) both;display:flex;flex-direction:column;align-items:center;line-height:1.1;pointer-events:none}
.st-stamp small{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:0}
@keyframes stStamp{0%{transform:rotate(-8deg) scale(1.7);opacity:0}60%{transform:rotate(-8deg) scale(.94);opacity:.95}100%{transform:rotate(-8deg) scale(1);opacity:.9}}

/* ---- the two-way answer slider ---- */
.st-tri{position:relative;height:44px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px rgba(22,32,60,.08);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.st-tri .fl,.st-tri .fr{position:absolute;top:0;bottom:0;width:0}
.st-tri .fl{right:50%;background:linear-gradient(270deg,rgba(142,42,34,.08),rgba(142,42,34,.28))}
.st-tri .fr{left:50%;background:linear-gradient(90deg,rgba(15,107,67,.08),rgba(15,107,67,.28))}
.st-tri .ll,.st-tri .lr{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:13px;font-weight:700;pointer-events:none}
.st-tri .ll{left:14px;color:var(--crimson)}
.st-tri .lr{right:14px;color:var(--green)}
.st-tri .ll,.st-tri .lr{transition:left .3s,right .3s}
.st-tri[data-pos="yes"] .lr{right:62px}
.st-tri[data-pos="no"] .ll{left:62px}
.st-tri .k{position:absolute;left:50%;top:2px;width:48px;height:40px;margin-left:-24px;border:none;border-radius:999px;padding:0;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(22,32,60,.22),inset 0 1px 0 rgba(255,255,255,.2)}
.st-tri.settle .k{transition:transform .3s cubic-bezier(.3,1.3,.5,1),background .2s}
.st-tri.settle .fl,.st-tri.settle .fr{transition:width .3s cubic-bezier(.3,1.3,.5,1)}
.chevR{display:inline-block;margin-left:4px;letter-spacing:-.2em;animation:stNudgeR 1.4s ease-in-out infinite}
.chevL{display:inline-block;margin-right:4px;letter-spacing:-.2em;animation:stNudgeL 1.4s ease-in-out infinite}
@keyframes stNudgeR{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(3px)}}
@keyframes stNudgeL{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(-3px)}}

/* ---- slide to start / hand in ---- */
.st-slide{position:relative;flex:1;height:56px;border-radius:999px;background:radial-gradient(120% 140% at 10% 50%,#26335E 0%,#16203C 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 10px 22px rgba(22,32,60,.22);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.st-slide .road{position:absolute;left:60px;right:18px;top:27px;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 8px,transparent 8px 16px);animation:stRoad .6s linear infinite}
.st-slide .fill{position:absolute;left:0;top:0;bottom:0;width:56px;border-radius:999px;background:linear-gradient(90deg,rgba(201,58,48,.15),rgba(201,58,48,.55))}
.st-slide .lab{position:absolute;left:58px;right:38px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;pointer-events:none;overflow:hidden}
/* A long label wraps to two lines rather than lose a name ("Slide to hand over to Pe"). */
.st-slide .lab b{font-weight:700;min-width:0;text-align:center;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.st-slide .lab i{flex:none}
.st-slide .lab i{font-style:normal;display:inline-flex;margin-left:6px;letter-spacing:-.2em;color:var(--rose);animation:stChev 1.4s ease-in-out infinite}
.st-slide .flag{position:absolute;right:12px;top:18px;width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
.st-slide .flag:after{content:'';width:6px;height:6px;border-radius:2px;background:rgba(255,255,255,.4)}
.st-slide .k{position:absolute;left:4px;top:4px;width:48px;height:48px;border:none;border-radius:999px;padding:0;cursor:grab;touch-action:none;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(201,58,48,.5),inset 0 1px 0 rgba(255,255,255,.2);color:#fff}
.st-slide.settle .k,.st-slide.settle .fill{transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)}
.st-slide[aria-disabled="true"]{opacity:.5}
@media (max-width:400px){.st-slide .flag{display:none}.st-slide .lab{right:14px;font-size:14px}}
@keyframes stRoad{from{background-position:0 0}to{background-position:-16px 0}}
@keyframes stChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}

/* ---- pushed pages and sheets ---- */
html.st-covered #st_main{visibility:hidden}
.st-page:focus{outline:none}
.pv{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 1px}.pv span{height:20px;padding:0 7px;border-radius:6px;background:#F1EEE8;color:var(--ink2);font-size:11px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap}.pv span.last{background:#E8EBF0;color:#16203C}
.cv-hero .pv span{background:rgba(255,255,255,.1);color:#DDE3F0}.cv-hero .pv span.last{background:rgba(255,255,255,.18);color:#fff}
.hscroll{scrollbar-width:none}.hscroll.more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
.hscroll.more.less{-webkit-mask-image:linear-gradient(90deg,transparent,#000 32px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,transparent,#000 32px,#000 calc(100% - 44px),transparent)}
.hscroll.less:not(.more){-webkit-mask-image:linear-gradient(90deg,transparent,#000 32px);mask-image:linear-gradient(90deg,transparent,#000 32px)}
/* A focus ring that shows on the navy and on the paper (the report: the browser's thin ring vanished on navy). */
:focus-visible{outline:3px solid #16203C;outline-offset:2px}
.cv-hero :focus-visible,[data-navy-top] :focus-visible,.cv-job :focus-visible,.cv-nav :focus-visible,.st-slide:focus-visible,.st-slide :focus-visible,[style*="background:#16203C"] :focus-visible,[style*="background:radial-gradient"] :focus-visible{outline-color:#FFFFFF}
input:focus-visible,textarea:focus-visible{outline-offset:0}
.cv-row:has(.pv){padding-top:10px;padding-bottom:10px}.cv-tx:has(.pv){gap:3px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html.big .td-tile span{white-space:normal!important;line-height:1.1}
@media (max-width:400px){.td-ic{display:none!important}.td-tile{padding:0 12px!important}.td-ring{width:100px!important;height:100px!important}.td-ring svg{width:100px;height:100px}}
.st-page{position:fixed;inset:0;z-index:50;background:#2A3350;overflow:auto;max-width:520px;margin:0 auto;animation:stIn .32s cubic-bezier(.2,.9,.3,1)}
.st-page.flat{background:var(--bg)}
.st-page.still{animation:none}
.st-page.leaving{animation:stOut .22s cubic-bezier(.4,0,1,1) forwards;pointer-events:none;z-index:60}
@keyframes stOut{to{transform:translateY(36px);opacity:0}}
/* A phone, not a web page: no text selection on a long press, a press shows, scrolling never drags the page behind. */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
.st-page,.st-page [style*="overflow-y:auto"],.cv-body{overscroll-behavior:contain}
button,a,[data-act]{touch-action:manipulation}
button:not(:disabled):not(.k):active,a:active,label:active{transform:scale(.97);transition:transform .06s}
button{transition:transform .14s ease-out}
.st-page .card{min-height:calc(100% - 40px - var(--safe-area-inset-top));margin-top:calc(40px + var(--safe-area-inset-top));background:var(--bg);border-radius:26px 26px 0 0;overflow:hidden;overflow:clip;display:flex;flex-direction:column}
.st-page .card > .st-sheethead{padding-top:8px}
.st-page .tapback{position:absolute;left:0;right:0;top:0;height:calc(40px + var(--safe-area-inset-top));border:none;background:transparent}
@keyframes stIn{from{transform:translateY(40px);opacity:.3}}
.st-scrim{position:fixed;inset:0;z-index:60;background:rgba(10,14,28,.5);animation:stScrim .25s ease-out}
@keyframes stScrim{from{opacity:0}}
.st-sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(22px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:stUp .35s cubic-bezier(.2,.9,.3,1)}
.st-sheet .st-grip{background:#D9D4CB}
@keyframes stUp{from{transform:translateY(100%)}}

/* ---- keypad ---- */
.st-pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.st-pad button{height:clamp(44px, 6.4vh, 52px);border:none;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.06);color:#fff;font-family:var(--mono);font-size:22px;font-weight:500;transition:transform .08s ease,background .12s ease}
.st-pad button:active{transform:scale(.94);background:rgba(255,255,255,.16)}
.st-dock{background:radial-gradient(120% 90% at 20% 0%,#26335E 0%,#16203C 65%);border-radius:26px 26px 0 0;padding:12px 14px calc(18px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 30px rgba(22,32,60,.18);color:#fff}

/* ---- toast ---- */
.st-toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:90;background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;box-shadow:0 10px 24px rgba(22,32,60,.3)}
.st-toast.on{opacity:1;transform:translateX(-50%)}
/* Over an open sheet the toast sits at the top, clear of the slide and the buttons under the thumb. */
.st-toast.top{bottom:auto;top:calc(14px + var(--safe-area-inset-top));transform:translateX(-50%) translateY(-20px)}
.st-toast.top.on{transform:translateX(-50%)}
.st-toast .u{margin-left:12px;padding:6px 12px;border:none;border-radius:10px;background:rgba(255,255,255,.14);color:var(--mint);font:inherit;font-weight:700;pointer-events:auto}
.st-toast.act{pointer-events:auto;display:flex;align-items:center}

/* ---- motion ---- */
@keyframes stRingIn{from{stroke-dasharray:0 400}}
@keyframes stBlink{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes stGrow{from{transform:scaleX(0)}}
@keyframes stGrowR{from{transform:scaleX(0)}}
@keyframes stUpIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes stCard{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes stDrive{0%{left:0}100%{left:calc(100% - 22px)}}
@keyframes stDriveS{0%{left:4%}100%{left:30%}}
@keyframes stRoll{0%{transform:translateX(-6px)}50%{transform:translateX(6px)}100%{transform:translateX(-6px)}}
@keyframes stNow{0%{box-shadow:0 0 0 0 rgba(22,32,60,.5)}100%{box-shadow:0 0 0 8px rgba(22,32,60,0)}}
@keyframes stPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.55)}100%{box-shadow:0 0 0 10px rgba(245,178,107,0)}}
@keyframes stPulseL{0%{box-shadow:0 0 0 0 rgba(155,163,240,.55)}100%{box-shadow:0 0 0 10px rgba(155,163,240,0)}}
@keyframes stDot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes stShake{0%,100%{transform:rotate(-9deg)}25%{transform:rotate(-12deg)}75%{transform:rotate(-6deg)}}
@keyframes stSwing{0%{transform:rotate(-7deg)}35%{transform:rotate(1deg)}65%{transform:rotate(-3.5deg)}100%{transform:rotate(-2deg)}}
@keyframes stCaret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes stDrop{0%{transform:translateY(-60px) rotate(-12deg);opacity:0}55%{transform:translateY(3px) rotate(2deg);opacity:1}75%{transform:translateY(-3px)}100%{transform:none}}
@keyframes stBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(2px)}70%{transform:translateY(-1px)}}
@keyframes stNext{0%,100%{box-shadow:inset 0 0 0 2px #16203C,0 10px 22px rgba(22,32,60,.14)}50%{box-shadow:inset 0 0 0 2px #3A3F9B,0 10px 22px rgba(58,63,155,.22)}}
@keyframes stHint{0%,100%{transform:translateX(0)}30%{transform:translateX(10px)}60%{transform:translateX(-6px)}}
@keyframes stTruck{0%{transform:translateX(-260px)}62%{transform:translateX(6px)}72%{transform:translateX(-3px)}80%,100%{transform:translateX(0)}}
@keyframes stGate{0%,55%{transform:rotate(0)}75%{transform:rotate(100deg)}85%{transform:rotate(86deg)}100%{transform:rotate(90deg)}}
@keyframes stCrate{0%{transform:translate(-70px,-30px) scale(.4);opacity:0}60%{transform:translate(0,-8px) scale(1.08);opacity:1}100%{transform:none;opacity:1}}
@keyframes stStampBig{0%{transform:rotate(-12deg) scale(2);opacity:0}60%{transform:rotate(-12deg) scale(.92);opacity:1}100%{transform:rotate(-12deg) scale(1);opacity:.92}}
@keyframes stDust{0%{opacity:0;transform:translateX(0) scale(.5)}30%{opacity:.6}100%{opacity:0;transform:translateX(-40px) scale(1.4)}}
@keyframes stDone{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
.a-ring{animation:stRingIn .9s cubic-bezier(.3,.8,.3,1) both}
.a-blink{animation:stBlink 1.5s ease-in-out infinite}
.a-grow{transform-origin:left;animation:stGrow .8s cubic-bezier(.3,.8,.3,1) both}
.a-growr{transform-origin:right;animation:stGrowR .8s cubic-bezier(.3,.8,.3,1) both}
.a-up{animation:stUpIn .5s ease-out both}
.a-card{animation:stCard .35s cubic-bezier(.2,.9,.3,1.1) both}
.a-drive{animation:stDrive 3.6s cubic-bezier(.45,0,.2,1) .4s infinite alternate}
.a-drives{animation:stDriveS 4s cubic-bezier(.45,0,.2,1) infinite alternate}
.a-roll{animation:stRoll 3.2s ease-in-out infinite}
.a-now{animation:stNow 1.8s ease-out infinite}
.a-pulsea{animation:stPulseA 1.8s ease-out infinite}
.a-pulsel{animation:stPulseL 1.8s ease-out infinite}
.a-dot{animation:stDot 1.2s ease-in-out infinite}
.a-shake{animation:stShake .5s ease-in-out .3s both}
.a-swing{transform-origin:22px 0;animation:stSwing 1.6s cubic-bezier(.3,.7,.4,1) both}
.a-caret{animation:stCaret 1s steps(1) infinite}
.a-drop{animation:stDrop .55s cubic-bezier(.3,.9,.4,1.2) both}
.a-bounce{animation:stBounce .45s ease-out}
.a-next{animation:stNext 2.2s ease-in-out infinite}
.a-hint{animation:stHint 1.2s cubic-bezier(.4,0,.2,1) 1s 2}
.a-truck{animation:stTruck 1.5s cubic-bezier(.2,.8,.3,1) .1s both}
.a-gate{transform-origin:0 100%;animation:stGate 1.9s ease-out both}
@keyframes stGateOut{0%,55%{transform:rotate(0)}75%{transform:rotate(-100deg)}85%{transform:rotate(-86deg)}100%{transform:rotate(-90deg)}}
.a-gate{animation-name:stGateOut}
.a-crate{animation:stCrate .45s cubic-bezier(.2,.9,.3,1.25) both}
.a-stampbig{animation:stStampBig .5s cubic-bezier(.3,1.4,.5,1) 3.2s both}
.a-dust{animation:stDust .9s ease-out 1.2s both}
.a-done{animation:stDone .4s cubic-bezier(.2,.9,.3,1.3) both}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .a-gate{transform:rotate(-90deg)}
  .a-swing{transform:rotate(-2deg)}
  .a-dust{display:none}
}

/* ---- sign in ---- */
.st-auth{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 20% 10%,#2B3866 0%,#16203C 60%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:24px 22px calc(24px + var(--safe-area-inset-bottom))}
.st-auth .card{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.st-auth label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--navyInk2)}
.st-auth input{height:52px;border-radius:14px;border:none;padding:0 14px;font-size:16px;background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);outline:none}
.st-auth input:focus{box-shadow:inset 0 0 0 2px var(--mint)}
.st-auth .msg{min-height:20px;font-size:13px;color:var(--navyInk)}
.st-auth .msg.err{color:var(--rose)}
.st-search{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.st-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:#fff;font-size:16px;padding:0}
.st-search input::placeholder{color:var(--navyInk2)}
.st-switch{position:relative;width:52px;height:32px;border:none;border-radius:999px;padding:0;flex:none;transition:background .2s;background:#D9D4CB}
.st-switch[aria-checked="true"]{background:var(--green)}
.st-switch:after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 2px 4px rgba(22,32,60,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.st-switch[aria-checked="true"]:after{transform:translateX(20px)}

/* ==================================================================
   The store yard (store.html) -- on top of the shared shell above.
   ================================================================== */
.st-nav{grid-template-columns:1fr 96px 1fr}
.st-nav .st-go{margin-top:-26px;width:64px;height:64px;box-shadow:0 0 0 4px var(--bg),0 6px 20px rgba(201,58,48,.35)}
.st-nav .st-go .icon{width:26px;height:26px;stroke-width:2.2}
.st-tag{align-self:center;display:inline-flex;align-items:center;gap:6px;min-height:22px;padding:2px 10px;border-radius:999px;border:1.5px dashed #9AA1AE;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink2);text-transform:uppercase;text-align:center}
.st-tag.dark{border-color:rgba(255,255,255,.3);color:var(--navyInk)}
.st-mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.st-pill.soft{background:#F1EEE8;color:var(--ink)}
.st-tile{position:relative;height:92px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;width:100%}
.st-stack{display:flex}
.st-stack .st-av{width:22px;height:22px;font-size:11px;border:2px solid var(--bg);border-radius:999px}

.st-livedot{width:7px;height:7px;border-radius:999px;background:var(--mint);animation:stLive 2s infinite}
@keyframes stLive{0%{box-shadow:0 0 0 0 rgba(111,220,176,.6)}70%{box-shadow:0 0 0 7px rgba(111,220,176,0)}100%{box-shadow:0 0 0 0 rgba(111,220,176,0)}}
.st-waitdot{animation:stWait 2s infinite}
@keyframes stWait{0%{box-shadow:0 0 0 0 rgba(245,178,107,.6)}70%{box-shadow:0 0 0 7px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
.st-sheettop{background:#16203C;color:#fff;padding:10px 20px 16px;display:flex;flex-direction:column;gap:14px;border-radius:0 0 24px 24px}
.st-x{width:44px;height:44px;border-radius:999px;border:none;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.st-x.light{background:rgba(255,255,255,.14)}
.st-sec2{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px}
.st-sec2 b{font-size:17px;font-weight:700}
.st-sec2 span{font-family:var(--mono);font-size:13px;color:#6B7480}
.st-full{position:fixed;inset:0;z-index:50;max-width:520px;margin:0 auto;overflow:hidden;background:#16203C}
.st-full.still{animation:none}

/* the slide (canvas: red track, white knob, green when done) */
.st-slide{position:relative;height:64px;border-radius:20px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--red);box-shadow:0 10px 22px rgba(201,58,48,.3);transition:background .3s,box-shadow .3s;flex:1}
.st-slide.done{background:var(--green);box-shadow:0 10px 22px rgba(15,107,67,.3)}
.st-slide[aria-disabled="true"]{background:#B9B2A6;box-shadow:none}
.st-slide .fill{position:absolute;left:0;top:0;bottom:0;width:60px;border-radius:20px;background:rgba(0,0,0,.16)}
.st-slide .lab{position:absolute;inset:0;padding-left:60px;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:16px;font-weight:700;pointer-events:none;white-space:nowrap;overflow:hidden}
.st-slide .lab b{overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:700}
.st-slide .chev{display:flex;gap:1px;flex:none}
.st-slide .chev i{font-style:normal;animation:stChev 1.4s ease-in-out infinite}
.st-slide .chev i:nth-child(2){animation-delay:.15s}.st-slide .chev i:nth-child(3){animation-delay:.3s}
.st-slide .k{position:absolute;left:4px;top:4px;width:56px;height:56px;border:none;border-radius:16px;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.18);padding:0;cursor:grab;touch-action:none}
.st-slide.done .k{color:var(--green)}
.st-slide[aria-disabled="true"] .k{color:#9AA1AE}
.st-slide.settle .k,.st-slide.settle .fill{transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)}
.st-slide:not(.done):not([aria-disabled="true"]) .k .nud{animation:stNudge 3s ease-in-out 1s infinite;display:flex}
@keyframes stChev{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}
@keyframes stNudge{0%,70%,100%{transform:translateX(0)}80%{transform:translateX(14px)}90%{transform:translateX(0)}}

/* the pack carousel */
.pk-track{position:absolute;left:0;top:0;bottom:0;display:flex;transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.pk-track.drag{transition:none}
.pk-slide{position:relative;height:100%;flex:none;overflow:hidden}
.pk-photo{position:absolute;left:56px;right:56px;top:calc(150px + var(--safe-area-inset-top));bottom:calc(380px + var(--safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
.pk-photo img{display:block;box-sizing:border-box;max-width:100%;max-height:100%;object-fit:contain;padding:6px;border-radius:20px;background:#fff;box-shadow:0 14px 30px rgba(22,32,60,.22)}
@keyframes pkStamp{0%{transform:rotate(-12deg) scale(2.2);opacity:0}60%{transform:rotate(-12deg) scale(.92);opacity:1}100%{transform:rotate(-12deg) scale(1);opacity:.95}}
@keyframes pkFlash{0%{opacity:.55}100%{opacity:0}}
@keyframes pkBob{0%,100%{transform:translateY(0) scale(1.2)}50%{transform:translateY(-6px) scale(1.2)}}
@keyframes pkHint{0%,60%,100%{transform:translateX(0)}75%{transform:translateX(-8px)}}
@keyframes pkDrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes pkIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pkDone{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.pk-stamp{animation:pkStamp .45s cubic-bezier(.3,1.4,.5,1) both}
.pk-flash{animation:pkFlash .6s ease-out both}
.pk-bob{animation:pkBob 3.2s ease-in-out infinite;display:flex}
.pk-still{display:flex;transform:scale(1.2)}
.pk-hint{animation:pkHint 2.6s ease-in-out 1.2s 2}
.pk-drain{transform-origin:left;animation:pkDrain 5s linear both}
.pk-in{animation:pkIn .35s ease-out both}
.pk-done{animation:pkDone .55s cubic-bezier(.2,.9,.3,1.2) both}
.pk-arrow{position:absolute;top:36%;width:40px;height:56px;border:none;border-radius:14px;background:rgba(255,255,255,.5);color:var(--navy);display:flex;align-items:center;justify-content:center}
.pk-dock{position:absolute;left:12px;right:12px;bottom:calc(16px + var(--safe-area-inset-bottom));padding:16px;border-radius:28px;background:rgba(255,255,255,.95);box-shadow:0 20px 44px rgba(22,32,60,.28);display:flex;flex-direction:column;gap:14px}
.pk-big{height:68px;border:none;border-radius:20px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.pk-step{width:60px;height:60px;border:none;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}

/* receive */
.rc-tile{position:relative;width:72px;height:72px;border:none;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:box-shadow .2s,background .2s,transform .15s;overflow:visible}
.rc-tile:active{transform:scale(.95)}
.rc-tile img{max-width:52px;max-height:46px;object-fit:contain}
@keyframes rcIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rc-in{animation:rcIn .3s ease-out both}

/* map */
.mp{position:relative;overflow:hidden;border-radius:18px;background:#1B2645;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);touch-action:none}
.mp .tiles{position:absolute;left:0;top:0;transform-origin:0 0}
.mp .tiles img{position:absolute;width:256px;height:256px;filter:grayscale(1) invert(.92) hue-rotate(185deg) brightness(.82) contrast(.9);opacity:.85;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mp svg{position:absolute;inset:0;pointer-events:none}
.mp .pin{position:absolute;transform:translate(-50%,-50%);border:none;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff}
.mp .attr{position:absolute;right:6px;bottom:4px;font-size:11px;color:rgba(255,255,255,.55)}
.mp .attr a{color:inherit;text-decoration:underline}
@keyframes mpPing{0%{box-shadow:0 0 0 3px #16203C,0 0 0 5px #6FDCB0,0 0 0 5px rgba(111,220,176,.6)}70%{box-shadow:0 0 0 3px #16203C,0 0 0 5px #6FDCB0,0 0 0 14px rgba(111,220,176,0)}100%{box-shadow:0 0 0 3px #16203C,0 0 0 5px #6FDCB0,0 0 0 14px rgba(111,220,176,0)}}
.mp-ping{animation:mpPing 2s infinite}
@keyframes mpRun{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
.mp-run{animation:mpRun 1.4s linear infinite}

/* deliver */
.dv-cam{position:absolute;inset:0;background:#0B1020;overflow:hidden}
.dv-cam video,.dv-cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dv-shutter{width:84px;height:84px;border-radius:999px;border:none;background:var(--red);box-shadow:0 0 0 6px rgba(255,255,255,.9),0 12px 30px rgba(201,58,48,.5);display:flex;align-items:center;justify-content:center;color:#fff}
@keyframes dvBreathe{0%,100%{box-shadow:0 0 0 6px rgba(255,255,255,.9),0 12px 30px rgba(201,58,48,.5)}50%{box-shadow:0 0 0 9px rgba(255,255,255,.7),0 12px 36px rgba(201,58,48,.7)}}
.dv-breathe{animation:dvBreathe 2.2s ease-in-out infinite}
@keyframes dvDrop{0%{transform:translateY(-120px) rotate(-14deg);opacity:0}60%{transform:translateY(8px) rotate(-3deg);opacity:1}100%{transform:rotate(-3deg)}}
@keyframes dvSlam{0%{transform:rotate(-14deg) scale(2.4);opacity:0}55%{transform:rotate(-14deg) scale(.9);opacity:1}100%{transform:rotate(-14deg) scale(1);opacity:.92}}
@keyframes dvShake{0%,100%{transform:none}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px)}}
@keyframes dvGlow{0%,100%{opacity:.5}50%{opacity:.9}}
.dv-drop{animation:dvDrop .7s cubic-bezier(.3,.9,.4,1.1) both}
.dv-slam{animation:dvSlam .45s cubic-bezier(.3,1.4,.5,1) .75s both}
.dv-shake{animation:dvShake .3s ease-in-out 1.15s both}
.dv-glow{animation:dvGlow 3s ease-in-out infinite}
.dv-up{animation:pkIn .45s ease-out both}

/* shelf + stock */
.sh-aisle{height:64px;border:none;border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:background .2s,box-shadow .2s}
.sh-bar{height:5px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;flex:1}
.sh-bar i{display:block;height:100%;border-radius:999px;transform-origin:left;animation:stGrow .8s cubic-bezier(.3,.8,.3,1) both}
@keyframes stGrow{from{transform:scaleX(0)}}
.sk-cell{display:block;height:10px;border-radius:2px}
.sk-tab{flex:1;height:44px;border:none;border-radius:12px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}

/* count */
.ct-key{height:52px;border:none;border-radius:14px;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.ct-key:active{transform:scale(.94)}
@keyframes ctTick{0%{transform:rotate(-10deg) scale(2);opacity:0}60%{transform:rotate(-10deg) scale(.92);opacity:1}100%{transform:rotate(-10deg) scale(1);opacity:.95}}
.ct-tick{animation:ctTick .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes ctFlip{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
.ct-flip{display:inline-block;animation:ctFlip .45s ease-out both}
@keyframes ctRow{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.ct-row{animation:ctRow .35s ease-out both}
@keyframes ntDrop{0%{transform:translateY(-40px);opacity:0}100%{transform:none;opacity:1}}
.nt-drop{animation:ntDrop .5s cubic-bezier(.2,.9,.3,1.1) both}

/* glove mode */
html.big .pk-big,html.big .st-slide{height:76px}
html.big .ct-key{height:60px}
@media (prefers-reduced-motion: reduce){.pk-track{transition:none}}
.sh-aisles{scrollbar-width:none}.sh-aisles::-webkit-scrollbar{display:none}
.st-sec2 span[style*="Figtree"] span{font-family:Figtree,system-ui,sans-serif}

/* ==================================================================
   The canvas (2026-10 redesign): the full-screen pages share one navy
   top, white lists of lines, and one way to say a section.
   ================================================================== */
.cv{position:relative;min-height:100%;background:var(--bg);display:flex;flex-direction:column}
.cv-hero{flex:none;background:radial-gradient(130% 90% at 50% 0%,#2B3866 0%,#16203C 65%);border-radius:0 0 32px 32px;padding:calc(12px + var(--safe-area-inset-top)) 16px 20px;display:flex;flex-direction:column;gap:18px;color:#fff}
.cv-hero.tight{border-radius:0 0 28px 28px;padding-bottom:18px;gap:16px}
.cv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.cv-top > b{font-size:13px;font-weight:700;color:var(--navyInk)}
.cv-circ{position:relative;width:44px;height:44px;flex:none;border:none;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.cv-circ.blank{background:none}
.cv-cnt{position:absolute;top:4px;right:4px;min-width:24px;height:24px;padding:0 4px;border-radius:999px;background:var(--red);border:2px solid #16203C;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:center}
.cv-me{width:46px;height:46px;flex:none;border:none;border-radius:999px;background:#243052;box-shadow:0 0 0 2px #16203C,0 0 0 4px rgba(111,220,176,.55);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
.cv-body{flex:1;padding:18px 16px 24px;display:flex;flex-direction:column;gap:10px}
.cv-sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 4px 0;font-size:13px;font-weight:700;color:var(--ink2)}
.cv-sec span{font-size:12px;font-weight:600}
.cv-sec.first{padding-top:0}
.cv-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px}
.cv-h b{font-size:17px;font-weight:700}
.cv-h span{font-family:var(--mono);font-size:13px;color:var(--ink2)}
.cv-list{background:#fff;border-radius:22px;box-shadow:inset 0 0 0 1px var(--rule),0 4px 14px rgba(22,32,60,.05);padding:6px;display:flex;flex-direction:column;gap:2px}
.cv-row{display:flex;align-items:center;gap:12px;min-height:62px;padding:0 8px;border:none;border-radius:12px;background:transparent;width:100%;text-align:left;color:var(--ink);font:inherit}
.cv-row.tall{min-height:70px;padding:0 10px;border-radius:16px}
.cv-row.dim{opacity:.72}
.cv-row.unread{background:#FAF9F7}
.cv-ic{position:relative;width:42px;height:42px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.cv-ic.round{border-radius:999px}
.cv-ic.sq13{border-radius:13px}
.cv-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
/* Row titles and lines wrap to two lines rather than cut a name or a size short (the 360px report). */
.cv-tt{font-size:14px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cv-sb{font-size:12px;font-weight:600;color:var(--ink2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cv-chip{flex:none;height:28px;padding:0 10px;border-radius:999px;background:#E8EBF0;color:var(--navy);font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.cv-chev{flex:none;display:flex;color:#9AA1AE}
.cv-at{flex:none;font-family:var(--mono);font-size:11px;font-weight:600;color:#9AA1AE}
.cv-job{position:relative;border-radius:22px;background:radial-gradient(120% 90% at 100% 0%,#2B3866 0%,#16203C 58%);color:#fff;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 30px rgba(22,32,60,.22);overflow:hidden}
.cv-tag{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.cv-stats{display:flex;gap:6px}
.cv-stat{flex:1;min-width:0;min-height:60px;padding:6px 4px;box-sizing:border-box;border-radius:12px;background:rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cv-stat b{font-family:var(--mono);font-size:18px;font-weight:600}
.cv-stat span{font-size:11px;font-weight:600;color:var(--navyInk);text-align:center;line-height:1.2;max-width:96%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cv-white{height:58px;border:none;border-radius:999px;background:#fff;color:var(--navy);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.cv-navy{height:58px;border:none;border-radius:999px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.cv-ghost{height:58px;border:1px solid var(--rule);border-radius:999px;background:#fff;color:var(--ink);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.cv-faces{display:flex}
.cv-faces > span{width:26px;height:26px;border-radius:999px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #1E2848}
.cv-faces > span + span{margin-left:-7px}
.cv-bays{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cv-bay{position:relative;min-height:84px;gap:6px;border:none;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between;padding:10px;text-align:left;font:inherit;min-width:0}
.cv-bay .n{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1}
/* The order number in Figtree's even figures: the mono zero's slash read as a strike-through on a dark bay. */
.cv-bay .no{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.cv-bay .sb{font-size:11px;font-weight:600;opacity:.85;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cv-more{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:none;border-top:1px solid var(--soft2);background:transparent;font:inherit;font-size:13px;font-weight:700;color:var(--ink2);width:100%}
.cv-more .ch{transition:transform .2s;display:flex}
.cv-more[aria-expanded="true"] .ch{transform:rotate(180deg)}
.cv-tog{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 8px;border:none;border-radius:12px;background:transparent;font:inherit;color:var(--ink);text-align:left;width:100%}
.cv-sw{width:50px;height:30px;flex:none;border-radius:999px;background:#D8D3CA;padding:3px;transition:background .2s}
.cv-sw i{display:block;width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(22,32,60,.25);transition:transform .2s}
.cv-tog[aria-pressed="true"] .cv-sw{background:var(--green)}
.cv-tog[aria-pressed="true"] .cv-sw i{transform:translateX(20px)}
.cv-seg{display:grid;gap:4px;padding:4px;border-radius:999px;background:#F1EEE8}
.cv-seg button{height:44px;border:none;border-radius:999px;background:transparent;color:var(--ink2);font:inherit;font-size:14px;font-weight:700}
.cv-seg button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(22,32,60,.12)}
.cv-live{display:flex;align-items:center;gap:5px;color:var(--mint)}
.cv-live i{width:7px;height:7px;border-radius:999px;background:var(--mint);animation:stLive 2s infinite}
.cv-live.off{color:var(--amber)}
.cv-live.off i{background:var(--amber);animation:stWait 2s infinite}
.cv-live.wait{color:#F5B26B}.cv-live.wait i{background:#F5B26B;animation:stWait 2s infinite}
.cv-dotsep{width:3px;height:3px;border-radius:999px;background:#5F6A85;flex:none}
.cv-wait{width:8px;height:8px;border-radius:999px;background:var(--amber);animation:stWait 2s infinite}
@keyframes cvSpin{to{transform:rotate(360deg)}}
.cv-spin{animation:cvSpin 1.6s linear infinite}
@keyframes cvPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.cv-pop{animation:cvPop .55s cubic-bezier(.2,.8,.2,1)}
@keyframes cvDrop{0%{transform:translateY(-30px);opacity:0}100%{transform:none;opacity:1}}
.cv-dropin{animation:cvDrop .5s cubic-bezier(.2,.8,.2,1)}
.st-nav.cv-nav{grid-template-columns:1fr 96px 1fr;padding-top:8px}
.st-nav.cv-nav button{font-size:12px;height:52px;justify-content:center}
.st-nav.cv-nav .st-go{height:64px;margin-top:-26px;box-shadow:0 0 0 4px var(--bg),0 6px 20px rgba(201,58,48,.35)}
.st-nav.cv-nav .st-go svg{width:26px;height:26px}
.cv-fabn{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--navy);color:#fff;font-family:var(--mono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}

.cv-pm{width:44px;height:44px;flex:none;border-radius:999px;border:none;display:flex;align-items:center;justify-content:center;padding:0}
.st-tnum{width:3.2em;min-width:56px;height:46px;border-radius:12px;border:none;box-shadow:inset 0 0 0 2px #16203C;background:#fff;text-align:center;font-weight:600;color:var(--ink);outline:none;padding:0 4px;-webkit-user-select:text;user-select:text}
.st-tnum:focus{box-shadow:inset 0 0 0 2.5px #16203C,0 0 0 4px rgba(22,32,60,.12)}
.cv-num{width:72px;height:48px;border-radius:14px;border:1.5px solid #16203C;background:#fff;text-align:center;font-family:var(--mono);font-size:22px;font-weight:500;color:var(--ink);outline:none;padding:0}
.st-slide.cvdark{height:60px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:none}
.st-slide.cvdark .fill{border-radius:999px;background:rgba(201,58,48,.35);width:55px}
.st-slide.cvdark .lab{padding-left:40px;font-size:15px;color:#DDE3F0}
.st-slide.cvdark .k{left:5px;top:5px;width:50px;height:50px;border-radius:999px;background:var(--red);color:#fff;box-shadow:none}
.st-slide.cvdark[aria-disabled="true"]{background:rgba(255,255,255,.08);opacity:.55}
.st-slide.cvdark[aria-disabled="true"] .k{color:#fff}
.st-slide.cvdark.done{background:var(--green)}
.st-slide.cvdark.done .k{background:#fff;color:var(--green)}
@keyframes scLaser{0%,100%{transform:translateY(-34px)}50%{transform:translateY(34px)}}
.sc-laser{animation:scLaser 2.2s ease-in-out infinite}
@keyframes scHit{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sc-hit{animation:scHit .3s cubic-bezier(.2,.8,.2,1)}
@keyframes cvUndoRun{from{stroke-dashoffset:0}to{stroke-dashoffset:62.8}}
.cv-undorun{animation:cvUndoRun 10s linear forwards}

.st-slide.cvnavy{background:#16203C}
.st-slide.cvnavy .fill{background:rgba(201,58,48,.45)}
.st-slide.cvnavy[aria-disabled="true"]{background:#16203C}
@keyframes cvDrive{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
.cv-drive{animation:cvDrive 2.4s ease-in-out infinite alternate}
@keyframes cvPing{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.cv-ping{animation:cvPing 1.8s ease-out infinite}

async function selectAll(table, keyCol, filter){
  keyCol = keyCol || 'id';
  let rows = [], total = null;
  for (;;) {
    let q = sb.from(table).select('*', total === null ? { count: 'exact' } : undefined).eq('shop_id', S.shopId);
    if (filter) q = filter(q);
    if (rows.length) q = q.gt(keyCol, rows[rows.length - 1][keyCol]);
    const r = await q.order(keyCol, { ascending: true }).limit(1000);
    if (r.error) throw r.error;
    if (total === null) total = (typeof r.count === 'number') ? r.count : null;
    const page = r.data || [];
    rows = rows.concat(page);
    if (!page.length || (total !== null && rows.length >= total)) break;

/* ---- a road route, asked once and locked (0115: place_routes) ----
   The OpenStreetMap router answers one question per place, ever: the
   route is stored for the whole shop and nobody asks again. */
async function lockRoute(place){
  const from = yardPin(), to = placePin(place);
  if (!from || !to) throw new Error('both ends need a pin on the map first');
  const url = `https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=simplified&geometries=geojson`;
  const res = await fetch(url); if (!res.ok) throw new Error('the route service did not answer');
  const j = await res.json(), rt = j && j.routes && j.routes[0];
  if (!rt) throw new Error('no road route found');
  const coords = (rt.geometry && rt.geometry.coordinates) || [];
  const step = Math.max(1, Math.ceil(coords.length / 120));
  const line = coords.filter((_, i) => i % step === 0 || i === coords.length - 1).map(c => [Math.round(c[1] * 1e5) / 1e5, Math.round(c[0] * 1e5) / 1e5]);
  const row = { shop_id: S.shopId, from_place: canonicalPlace(D().shopPlace), to_place: canonicalPlace(place), km: Math.round(rt.distance / 100) / 10, mins: Math.round(rt.duration / 60), line };
  const { error } = await sb.from('place_routes').insert(row);
  if (error && error.code !== '23505') throw error;
  (D().routes || (D().routes = [])).push({ from: row.from_place, to: row.to_place, km: row.km, mins: row.mins, line });
  saveSnapshot();
}

// A tapped push opens what it is about: the thing itself when it is still
// here, else the list it lives in. Ids come as strings. Unknown: home.
function pushOpen(d){
  try {
    d = d || {}; const k = d.kind;
    const fresh = v => { closeSheet(true); S.view = v; S.stack = []; };
    // notify-stock-count: a blind count to accept or recount.
    if (k === 'stock_count' && d.countId) { fresh('today'); push('decide', { id: d.countId }); return; }
    // 0120: a trip is back -- count it in at the yard.
    if (k === 'trip.back') {
      const t = (D().collectionTrips || []).find(x => String(x.id) === String(d.id));
      fresh('today'); if (t) push('receive', { id: t.id }); else push('movein', {}); return;
    }
    // 0150: a trip sent or given to this person opens it; one taken off them or cancelled opens Today.
    if (k === 'trip.sent') { const t = (D().collectionTrips || []).find(x => String(x.id) === String(d.id)); fresh('today'); if (t && myTrips().includes(t)) { S.ui.rd = null; push('ride', {}); } return; }
    if (k === 'trip.taken' || k === 'trip.cancelled') { fresh('today'); return; }
    // 0156: the Manager answered an ask to let an unpaid order go on credit.
    if (k === 'credit.ask.decided') { const q = quoteById(d.id); fresh('today'); if (q && orderIsPickup(q) && loadQueue().includes(q)) push('collect', { id: q.id }); else push('load', {}); return; }
    // 0158: a delivery given to this person opens it once it is on the road with them; before that, Load.
    if (k === 'job.given') { const q = quoteById(d.orderId || d.id); fresh('today'); if (!q) return;
      if (myDrops().some(o => o.id === q.id)) push('deliver', { id: q.id }); else if (loadQueue().some(o => o.id === q.id)) push('load', {}); return; }
    // 0157: a colleague handed this person the yard (the card on Today takes it); an ask answered.
    if (k === 'store.handover') { fresh('today'); return; }
    if (k === 'store.ask.decided') { const a = (D().asks || []).find(x => String(x.id) === String(d.id)), x = a && a.kind === 'restock' && stockItems().find(i => i.key === a.ref);
      if (x) { fresh('shelf'); push('stock', { key: x.key }); } else { fresh('today'); push('ruth', {}); } return; }
    // 0131: the Manager wrote off or dismissed a loss this person reported.
    if (k === 'stock.report.decided') {
      const r = (D().reports || []).find(x => String(x.id) === String(d.id));
      const x = r && stockItems().find(i => i.key === r.key);
      fresh('shelf'); if (x) push('stock', { key: x.key }); return;
    }
    // notify-worker: an order to pack (assigned, or new in the queue) -- no kind, just orderId.
    if (!k && d.orderId) {
      const q = quoteById(d.orderId); fresh('today'); if (!q) return;
      // A tap never takes an order: only one already this person's opens to pack; else Today, where they press Pack.
      if (packQueue().some(o => o.id === q.id)) { if (orderIsMine(q)) Promise.resolve(openPack(q.id)).catch(() => {}); return; }
      if (loadQueue().some(o => o.id === q.id)) { push('load', {}); return; }
      if (myDrops().some(o => o.id === q.id)) push('deliver', { id: q.id });
    }
  } catch (e) { console.warn('pushOpen', e); }
}

    const max = () => el.offsetWidth - 64;

    const done = () => { if (el.getAttribute('aria-disabled') === 'true') return; const k = String(el.dataset.slide || ''), f = ACT['slide:' + k] || ACT['slide:' + k.split(':')[0]]; if (f) f(el); };

    <div style="display:flex;align-items:center;gap:14px"><span role="img" aria-label="${ok} of 4 checks done" style="position:relative;width:64px;height:64px;flex:none;display:block"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"></circle><circle cx="32" cy="32" r="26" fill="none" stroke="#6FDCB0" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(ok / 4 * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"></circle></svg><span class="m" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600">${ok}<span style="font-size:11px;color:var(--navyInk)">/4</span></span></span>
      <span class="cv-tx" style="gap:3px"><span style="font-size:22px;font-weight:700">${esc(day)}'s yard</span><span style="font-size:12px;font-weight:600;color:var(--navyInk)">Filled in from the day · goods only</span></span></div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:18px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)">${[[out, 'orders out'], [trips, trips === 1 ? 'trip in' : 'trips in'], [rets.length, rets.length === 1 ? 'return' : 'returns', '#6FDCB0']].map(([v, w, c], i) => `<span style="height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;${i ? 'box-shadow:-1px 0 0 rgba(255,255,255,.07)' : ''}"><span class="m" style="font-size:20px;font-weight:600;line-height:1;${c ? 'color:' + c : ''}">${v}</span><span style="font-size:11px;font-weight:600;color:var(--navyInk)">${w}</span></span>`).join('')}</div></div>
  <div style="flex:1;min-height:0;overflow-y:auto;padding:16px">
    <div class="cv-list" style="padding:4px 14px;gap:0">
      ${row(!used.length || 'warn', !used.length ? 'Every bay is empty' : `${used.length} bay${used.length === 1 ? '' : 's'} hold${used.length === 1 ? 's' : ''} an order for tomorrow`, !used.length ? 'Nothing packed is left in the yard' : 'Packed and waiting · it stays the night on its bay', `<div style="display:grid;grid-template-columns:repeat(${Math.min(slots.length, 4)},minmax(0,1fr));gap:6px;padding-top:6px">${slots.map(s => `<span class="m" style="height:40px;border-radius:12px;${s.q ? 'background:#16203C;color:#fff' : 'box-shadow:inset 0 0 0 1.5px #E6E3DD;color:#9AA1AE'};font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">${s.q ? q4(s.q) : s.n}</span>`).join('')}</div>`).replace('border-top:1px solid #EFECE6', 'border-top:none')}
      ${row(waits.length ? 'warn' : true, waits.length ? `${waits.length} thing${waits.length === 1 ? '' : 's'} wait${waits.length === 1 ? 's' : ''} on ${esc(mgr)}` : `Nothing waits on ${esc(mgr)}`, waits.length ? 'It carries to the next day' : 'Every ask is answered', waits.length ? `<div style="display:flex;flex-direction:column;gap:4px;padding-top:4px">${waits.slice(0, 3).map(w => `<span style="display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border-radius:12px;background:#FDEEE1;color:#7A4A02;font-size:12px;font-weight:700"><span style="width:22px;height:22px;border-radius:999px;background:#F6E4F1;color:#7A3268;font-size:11px;display:flex;align-items:center;justify-content:center">${mgrIni()}</span><span style="flex:1">${w.title}</span><span style="font-weight:600">carry over</span></span>`).join('')}</div>` : '')}
      ${unshelved.map(r => { const q = quoteById(r.orderId), g = (r.lines || []).filter(l => l.condition === 'good').map(l => { const it = q && (q.items || [])[l.idx]; return it ? backText(it, Number(l.qty) || 0) : l.shown || l.qty + ' ' + l.unit; }).join(', '); return row('bad', `${q ? q4(q) + "'s" : 'A'} ${esc(g)} ${/s\b/.test(g) ? 'are' : 'is'} still out`, `${esc(mgr)} raised the credit note · it goes back on the shelf`, `<button data-act="clshelf" data-id="${esc(r.id)}" style="align-self:flex-start;height:40px;padding:0 14px;border-radius:999px;border:none;background:#16203C;color:#fff;font-size:13px;font-weight:700;margin-top:4px">It's on the shelf</button>`); }).join('') || row(true, 'Returns are put away', rets.length ? `${rets.length} back on the shelf` : 'Nothing came back to shelve')}
      ${row(nextJob ? true : 'warn', nextJob ? 'The next first job is set' : 'No first job yet', nextJob ? `${esc(tripWho(nextJob) || 'A trip')} · ${esc((supplierById(nextJob.supplierId) || {}).name || 'a supplier')}` : 'It shows on Today when one is set')}
    </div></div>
  ${darkDock(`<div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px;gap:8px"><span style="font-size:14px;font-weight:700">${ok === 4 ? 'All set' : `${4 - ok} thing${4 - ok === 1 ? '' : 's'} to sort first`}</span><span style="font-size:12px;font-weight:600;color:var(--navyInk)">${esc(mgr)} sees it closed</span></div>
    <div style="display:flex">${slideHTML('clgo', ok === 4 ? 'Slide to close the yard' : 'Sort the red one first', 'chevs', { cls: 'cvdark', disabled: ok !== 4 || S.busy })}</div>`)}</div>`;
};
PAGE.close.bg = '#F7F5F2';
ACT.clshelf = t => { S.ui.cl.shelved[t.dataset.id] = Date.now(); FEEL.stamp(); render(); };
ACT['slide:clgo'] = () => { const ui = S.ui.cl; if (ui.sent) return; const waits = ruthAsks().waiting.length;
  ui.sent = { at: Date.now(), wait: true, carries: waits }; chimeDone(); render();
  heldWrite('Closing the yard', async () => { try { await sb.from('store_asks').insert({ shop_id: S.shopId, kind: 'close', ref: todayISO(), asked_by: S.user.id, asked_by_name: myName(), payload: { out: outToday(), trips: checkedInToday().length, carries: waits, shelved: Object.keys(ui.shelved) } }).then(r => { if (r.error) throw r.error; }); ui.sent.wait = false; }
    catch (e) { ui.sent = null; FEEL.no(); toast(failSay(e, '0157'), 5000); } render(); }, () => { ui.sent = null; }, 10000, true); };
function clDone(ui){
  const mate = mates()[0], nextJob = (D().collectionTrips || []).filter(t => !t.voided && ['assigned', 'open'].includes(t.status))[0];
  return sentScreen({ undo: ui.sent.wait ? 'heldundo' : null, title: 'The yard is closed', line: `${new Date(ui.sent.at).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })} · ${hm(ui.sent.at)} · by ${firstWord(myName())}`,
    body: `<div style="width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:18px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)">${[[`${bayMap().slots.filter(s => s.q).length}/${bayCount()}`, 'bays in use'], [ui.sent.carries, 'carries over', '#F5B26B'], [nextJob ? hm(msOf(nextJob.assignedAt || nextJob.createdAt)) : '—', 'first job']].map(([v, w, c], i) => `<span style="height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;${i ? 'box-shadow:-1px 0 0 rgba(255,255,255,.07)' : ''}"><span class="m" style="font-size:20px;font-weight:600;line-height:1;${c ? 'color:' + c : ''}">${v}</span><span style="font-size:11px;font-weight:600;color:var(--navyInk)">${w}</span></span>`).join('')}</div>
      <span style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--navyInk)"><span style="display:flex"><span style="width:24px;height:24px;border-radius:999px;background:#F6E4F1;color:#7A3268;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #16203C">${mgrIni()}</span>${mate ? `<span style="width:24px;height:24px;margin-left:-6px;border-radius:999px;background:${tint(mate.name)[0]};color:${tint(mate.name)[1]};font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #16203C">${ini(mate.name)}</span>` : ''}</span>${esc(managerName())}${mate ? ' and ' + esc(firstWord(mate.name)) : ''} see it closed</span>`,
    foot: `<button class="cv-white" data-act="cldone">Done for today</button>` }).replace(bigTick(sv(CV.tick, 40, 2.6)), bigTick(sv(CV.lock, 36, 2.4)));
}
ACT.cldone = () => { S.ui.cl = null; FEEL.back(); go('today'); };
</script>
