      ...(sell > 0 ? { price: sell, amount: Math.round(sell * ui.back[k]) } : {}) }; });
  S.busy = true;
  try { const r = await sendReturn(q, lines, ui.blob); ui.sent = { ...r, photo: !!ui.blob, no: 'R-' + String((D().returns || []).length).padStart(3, '0') }; chimeDone();
    undoToast('Return proposed', async () => { const { error } = await sb.rpc('withdraw_invoice_ask', { p_id: r.id }); if (error) throw error; const a = (D().returns || []).find(x => x.id === r.id); if (a) a.status = 'withdrawn'; S.ui.rt = { ...ui, sent: null }; saveSnapshot(); render(); }); }
  catch (e) { FEEL.no(); toast(failSay(e, '0124'), 5000); }
  S.busy = false; render();
};

/* ==================================================================
   RIDE -- a buying trip the Buyer sent this Store person on. One stop
   per trip (a trip is one supplier); tick each line onto the truck and
   hand it in. Paid by the Buyer: no money on this phone.
   ================================================================== */
PAGE.ride = () => {
  const ui = S.ui.rd || (S.ui.rd = { handed: null });
  const trips = ui.handed ? ui.handed.trips.map(id => (D().collectionTrips || []).find(t => t.id === id)).filter(Boolean) : myTrips();
  if (!trips.length) return goneSheet('No trip waiting for you');
  const buyer = theBuyer();
  const stops = trips.map((t, i) => { const sup = supplierById(t.supplierId), ls = tripLines(t), got = ls.filter(l => tripLineGot(l) != null).length;
    return { t, i, name: (sup && sup.name) || 'The supplier', place: (sup && sup.location) || '', ls, got, done: got === ls.length && ls.length > 0 }; });
  const allIn = stops.every(s => s.done), left = stops.reduce((n, s) => n + s.ls.length - s.got, 0), back = !!ui.handed;
  const W0 = Math.max(260, W() - 32), n = stops.length, xs = [26].concat(stops.map((_, i) => Math.round(26 + (W0 - 70) * (i + 1) / (n + .6)))), ys = [96].concat(stops.map((_, i) => i % 2 ? 66 : 34));
  const seg = (a, b, on) => `<path d="M${xs[a]} ${ys[a]} C ${(xs[a] + xs[b]) / 2} ${ys[a]}, ${(xs[a] + xs[b]) / 2} ${ys[b]}, ${xs[b]} ${ys[b]}" fill="none" stroke-width="3" stroke-linecap="round" ${on ? 'stroke="#6FDCB0"' : 'stroke="rgba(255,255,255,.3)" stroke-dasharray="4 6"'}/>`;
  const map = `<div role="img" aria-label="The shop, then ${esc(stops.map(s => s.name).join(', then '))}, then back to the shop. ${stops.filter(s => s.done).length} of ${n} loaded" style="position:relative;height:128px;border-radius:18px;overflow:hidden;background:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px) 0 0/22px 22px,#1B2649;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)">
    <svg width="${W0}" height="128" viewBox="0 0 ${W0} 128" aria-hidden="true" style="position:absolute;inset:0">${stops.map((s, i) => seg(i, i + 1, s.done)).join('')}<path d="M${xs[n]} ${ys[n]} C ${xs[n] - 40} 120, 80 122, ${xs[0]} ${ys[0]}" fill="none" stroke-width="3" stroke-linecap="round" ${back ? 'stroke="#6FDCB0"' : 'stroke="rgba(255,255,255,.3)" stroke-dasharray="4 6"'}/></svg>
    <span style="position:absolute;left:${xs[0] - 13}px;top:${ys[0] - 13}px;width:26px;height:26px;border-radius:8px;background:var(--mint);color:var(--navy);display:flex;align-items:center;justify-content:center">${ic('yard', 14, 'style="stroke-width:2.2"')}</span><span style="position:absolute;left:6px;top:${ys[0] + 15}px;font-size:10px;font-weight:700;color:var(--mint)">SHOP</span>
    ${stops.map((s, i) => { const next = !s.done && stops.slice(0, i).every(p => p.done); return `<span style="position:absolute;left:${xs[i + 1] - 13}px;top:${ys[i + 1] - 13}px;width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;${s.done ? 'background:var(--mint);color:var(--navy);box-shadow:0 0 0 4px rgba(111,220,176,.2)' : next ? 'background:var(--navy);color:var(--amber);box-shadow:inset 0 0 0 3px #F5B26B,0 0 0 4px rgba(245,178,107,.18)' : 'background:var(--navy);color:#8D99B5;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)'}">${s.done ? ic('tick', 12, 'style="stroke-width:3"') : `<i style="width:4px;height:4px;border-radius:999px;background:currentColor"></i>`}</span>
      <span class="ell" style="position:absolute;left:${xs[i + 1] - 50}px;top:${ys[i + 1] + 15}px;width:100px;text-align:center;font-size:10px;font-weight:700;color:var(--navyInk)">${esc(shortName(s.name))}</span>`; }).join('')}</div>`;
  const head = `<div style="background:radial-gradient(120% 100% at 90% 0%,#2B3866 0%,#16203C 60%);color:#fff;padding:8px 16px 14px;display:flex;flex-direction:column;gap:12px;flex:none">${grip()}
      <div style="display:flex;align-items:center;gap:12px"><span style="position:relative;width:38px;height:38px;flex:none">${av(myName(), 'me', 38)}${buyer ? `<span style="position:absolute;right:-6px;bottom:-4px;box-shadow:0 0 0 2px #16203C;border-radius:999px">${av(buyer.name, buyer.id, 20)}</span>` : ''}</span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mint)">${esc(buyer ? firstWord(buyer.name).toUpperCase() + ' SENT YOU' : 'YOU ARE SENT')}</span><span class="ell" style="font-size:17px;font-weight:700">Buying trip · ${esc(shortName(stops[0].name))}${n > 1 ? ` +${n - 1}` : ''}</span></div>
        ${buyer && telUrl(buyer.phone) ? `<a href="${telUrl(buyer.phone)}" aria-label="Call ${esc(buyer.name)}" style="width:40px;height:40px;border-radius:999px;background:rgba(111,220,176,.14);color:var(--mint);display:flex;align-items:center;justify-content:center;flex:none">${ic('phone', 16, 'style="stroke-width:2"')}</a>` : ''}${closeX()}</div>${map}</div>`;
  let body;
  if (back) {
    body = receiptHTML('TRIP HANDED IN', `${stampTime(ui.handed.at)} · ${firstWord(myName())}`,
      [['Stops', `${n} of ${n} loaded`, 'color:var(--green)'], ['Lines', stops.map(s => s.ls.map(l => `${quoteLineCount(l, l.qty).n} ${quoteLineCount(l, 1).unit}`).join(' · ')).join(' · '), "font-family:'IBM Plex Mono',monospace;font-size:12px"],
       ['For', [...new Set(trips.flatMap(t => tripOrders(t).map(q => shortName(quoteClientName(q)))))].join(' · ') || 'the shelf'], ['Money', buyer ? `with ${firstWord(buyer.name)}` : 'with the buyer', 'color:#6B7480']],
      'AT THE SHOP', 'CHECK IT IN', '#0F6B43', waitingOn('IN', 'Check it in at the shop', 'it shows on In for whoever counts it', 'background:var(--greenSoft);color:var(--green)'));
  } else {
    body = stops.map(s => `<div class="rc-in st-card" style="border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:10px;padding:0 2px"><span style="width:28px;height:28px;border-radius:999px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;${s.done ? 'background:#0F6B43;color:#fff' : s.got ? 'background:var(--amberSoft);color:var(--amberDeep)' : 'background:#F1EEE8;color:#5F6980'}">${s.i + 1}</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column"><span class="ell" style="font-size:14px;font-weight:700">${esc(s.name)}</span><span class="ell" style="font-size:11px;font-weight:600;color:#6B7480">${esc(s.place || nLines(s.ls.length))}</span></span>
        <span class="st-chip" style="height:24px;font-size:11px;${s.done ? 'background:var(--greenSoft);color:var(--green)' : 'background:#F1EEE8;color:#5F6980'}">${s.done ? 'loaded' : `${s.got} of ${s.ls.length}`}</span></div>
      ${s.ls.map((l, k) => { const on = tripLineGot(l) != null, q = quoteById(l.orderId), c = quoteLineCount(l, l.qty);
        return `<button type="button" class="rc-tile" data-act="rdtick" data-t="${esc(s.t.id)}" data-i="${k}" aria-pressed="${on}" aria-label="${esc(lineName(l).base)}, ${esc(c.n)} ${esc(c.unit)}${on ? ', on the truck' : ', tap when loaded'}" style="width:auto;height:62px;border-radius:16px;padding:0 10px 0 8px;display:flex;align-items:center;gap:10px;text-align:left;${on ? 'background:var(--greenSoft)' : 'background:#F7F5F2'}">
          <span style="width:46px;height:46px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 6px rgba(22,32,60,.08)">${art(l, 'small')}</span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span class="ell" style="font-size:14px;font-weight:700">${esc(lineName(l).base)}</span><span style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#6B7480">${q ? av(quoteClientName(q), q.id, 16) + 'for ' + esc(shortName(quoteClientName(q))) : 'for the shelf'}</span></span>
          <span class="m" style="font-size:16px;font-weight:600">${esc(c.n)} ${esc(c.unit)}</span>
          <span style="width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;${on ? 'background:#0F6B43;color:#fff' : 'background:#fff;color:transparent;box-shadow:inset 0 0 0 1.5px #C9C4BA'}">${ic('tick', 13, 'style="stroke:currentColor;stroke-width:3.4"')}</span></button>`; }).join('')}</div>`).join('')
      + `<span style="display:flex;align-items:center;gap:8px;padding:0 4px;font-size:12px;font-weight:600;color:var(--ink2)">${ic('shield', 15, 'style="stroke:#0F6B43"')}${buyer ? esc(firstWord(buyer.name)) + ' has paid' : 'Already paid'} · you load and bring it</span>`;
  }
  const foot = `<div style="display:flex;flex-direction:column;gap:8px;width:100%"><div class="row">${slideHTML('ride', allIn ? 'Slide · hand it in at the shop' : `Load ${left} more first`, 'truck', { done: back, doneLabel: 'Handed in · at the shop', disabled: S.busy || !allIn })}</div>
    ${back ? `<button data-act="home" style="height:44px;border:none;background:none;font-size:14px;font-weight:700;color:var(--navy)">Done · back to Today</button>` : ''}</div>`;
  return `<button class="tapback" data-act="back" aria-label="Back" style="height:calc(40px + var(--safe-area-inset-top))"></button>
    <div class="card" style="height:calc(100% - 40px - var(--safe-area-inset-top));min-height:0">${head}
      <div style="flex:1;min-height:0;overflow-y:auto;padding:12px 16px 8px;display:flex;flex-direction:column;gap:10px">${body}</div>
      <div style="flex:none;padding:10px 16px calc(18px + var(--safe-area-inset-bottom));display:flex">${foot}</div></div>`;
};
PAGE.ride.bg = '#2A3350';
ACT.goride = () => { FEEL.open(); S.ui.rd = null; push('ride', {}); };
ACT.rdtick = async t => {
  if (S.busy || (S.ui.rd && S.ui.rd.handed)) return;
  const tr = (D().collectionTrips || []).find(x => x.id === t.dataset.t), i = Number(t.dataset.i); if (!tr) return;
  const on = tripLineGot(tripLines(tr)[i]) == null; on ? FEEL.load() : FEEL.tick();
  // Shown at once; written a moment later, onto the row as the server has it.
  tr.lines = tripLines(tr).map((l, k) => k === i ? { ...l, gotQty: on ? Number(l.qty) || 0 : null } : l); render();
  try { await tickTripLine(tr.id, i, on); } catch (e) { toast(failSay(e), 5000); await refreshLive(); }
};
ACT['slide:ride'] = async () => {
  if (S.busy) return; const trips = myTrips(); if (!trips.length) return; S.busy = true;
  try { for (const t of trips) await handInTrip(t.id); S.ui.rd = { handed: { trips: trips.map(t => t.id), at: Date.now() } }; FEEL.hand(); }
  catch (e) { FEEL.no(); toast(failSay(e), 5000); }
  S.busy = false; render();
};
</script>
</body>
</html>
