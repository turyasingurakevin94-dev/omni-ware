function txnWho(t){ const tr = txnTrace(t); if (tr.cust) return tr.cust.name; const m = /—\s*(.+)$/.exec(t.description || ''); return m ? m[1].replace(/^INV-\d+$/, 'Invoice ' + m[1]) : (t.description || t.category || 'Receipt'); }
function txnTag(t){ const d = String(t.description || '') + ' ' + String(t.account || ''); return /airtel/i.test(d) ? 'AIRTEL' : /mtn/i.test(d) ? 'MTN' : ''; }
function onAccountToday(){ return receiptsOn(todayISO()).filter(t => txnTrace(t).onAccount); }

/* ==================================================================
   Suppliers: what we owe, bill by bill (index.html 75992 / 106378).
   ================================================================== */
function purchaseInvoiceTotal(pi){
  return (pi.items || []).reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0)
    + Math.max(0, Number(pi.transport) || 0)
    - ((pi.credits) || []).reduce((s, sc) => s + (sc && !sc.voided ? Number(sc.amount) || 0 : 0), 0);
}
function billDue(pi){ return Math.max(0, purchaseInvoiceTotal(pi) - (Number(pi.amountPaid) || 0)); }
function billLabel(pi){ return 'PINV-' + String(pi.id).padStart(4, '0'); }
function supplierById(id){ return D().suppliers.find(s => String(s.id) === String(id)) || null; }
function billSupplierName(pi){ const s = supplierById(pi.supplierId); return (s && s.name) || pi.supplierName || 'Supplier'; }
// Bills are grouped by their supplier's id, or by name when a bill carries none,
// so two suppliers without an id are never paid together.
function supplierKey(pi){ return pi.supplierId != null && pi.supplierId !== '' ? String(pi.supplierId) : 'name:' + (pi.supplierName || ''); }
function openBills(sid){ return D().bills.filter(pi => !pi.voided && billDue(pi) > 0.5 && (sid == null || supplierKey(pi) === String(sid))).sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || (a.id - b.id)); }
function billState(pi){
  const t = todayISO(), wk = isoOf(new Date(Date.now() + 6 * 864e5));
  if (!pi.dueDate) return { k: 'nodate', word: 'no date', ink: '#5F6980', bg: '#F4F2EE' };
  if (pi.dueDate < t) return { k: 'late', word: daysBetween(pi.dueDate, t) + ' d late', ink: '#8E2A22', bg: '#FBE5E2', late: daysBetween(pi.dueDate, t) };
  if (pi.dueDate <= wk) return { k: 'week', word: pi.dueDate === t ? 'today' : new Date(pi.dueDate + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' }), ink: '#7A4A02', bg: '#FDEEE1' };
  return { k: 'later', word: new Date(pi.dueDate + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }), ink: '#5F6980', bg: '#F4F2EE' };
}
function creditors(){
  return memo('creditors', '', () => {
    const by = {};
    openBills().forEach(pi => { const k = supplierKey(pi); const r = by[k] || (by[k] = { sid: k, name: billSupplierName(pi), bills: [], due: 0, worst: null }); r.bills.push(pi); r.due += billDue(pi); });
    const rank = { late: 0, week: 1, later: 2, nodate: 3 };
    return Object.values(by).map(r => { r.bills.forEach(pi => { const s = billState(pi); if (!r.worst || rank[s.k] < rank[r.worst.k] || (s.k === r.worst.k && (pi.dueDate || '') < (r.worstBill.dueDate || ''))) { r.worst = s; r.worstBill = pi; } }); return r; })
      .sort((a, b) => rank[a.worst.k] - rank[b.worst.k] || String(a.worstBill.dueDate || '9').localeCompare(String(b.worstBill.dueDate || '9')) || b.due - a.due);
  });
}
// What came into stock against a bill line (stock_log.pi_id, 0107). Null when nothing tells us.
function billCameIn(pi){
  const rows = D().stockIn; if (!rows) return null;
  const mine = rows.filter(r => String(r.pi_id) === String(pi.id) && Number(r.delta) > 0);
  if (!mine.length) return null;
  return (pi.items || []).map(it => {
    const got = mine.filter(r => String(r.product_id) === String(it.productId) && String(r.variant_idx == null ? '' : r.variant_idx) === String(it.variantIdx == null ? '' : it.variantIdx)).reduce((s, r) => s + (Number(r.delta) || 0), 0);
    return { it, got, full: got >= (Number(it.qty) || 0) - 1e-6 };
  });
}
function paidToSuppliersOn(date){ return dayTxns(date).filter(t => (t.type === 'payment') && /Stock Purchase|Supplier Payment/.test(t.category || '')); }

// Pay chosen bills, in the order picked (allocateCreditorPayment, 108281, on the bills the person ticked).
// amounts: { [billId]: part } to pay less than the whole of a bill.
async function payBills(bills, account, amounts){
  if (!can('bill.pay')) throw new Error('paying a supplier needs “Pay supplier bills” — ask the owner to switch it on.');
  const date = todayISO(), time = new Date().toTimeString().slice(0, 5);
  let cashMax = D().cashTxns.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0), written = 0;
  const done = [];
  try {
    for (const b of bills) {
      const cur = await sb.from('purchase_invoices').select('payload').eq('shop_id', S.shopId).eq('id', b.id).maybeSingle();
      if (cur.error) throw cur.error;
      if (!cur.data) throw new Error(billLabel(b) + ' is no longer in the books.');
      const payload = cur.data.payload || {};
      const fresh = rowToBill({ id: b.id, quote_id: b.quoteId, date: b.date, payload });
      const due = billDue(fresh), want = amounts && amounts[b.id] != null ? Number(amounts[b.id]) : due, pay = Math.min(due, Math.max(0, want)); if (!(pay > 0)) continue;
      const id = await issueRowId('row:cash_txn', cashMax); cashMax = Math.max(cashMax, id);
      const row = { id, shop_id: S.shopId, date, account, type: 'payment', category: 'Stock Purchase', amount: Math.round(pay), description: `Payment — ${billLabel(fresh)} — ${billSupplierName(fresh)}`, time, entered_by: S.user ? String(S.user.id) : null };
      await insertRow('cash_txns', row, ['entered_by']); written += pay;
      D().cashTxns.push(rowToTxn(row));
      const payments = (Array.isArray(payload.payments) ? payload.payments : []).concat([{ date, amount: Math.round(pay), note: '', cashTxnId: id }]);
      const up = await sb.from('purchase_invoices').update({ payload: { ...payload, payments, amountPaid: (Number(payload.amountPaid) || 0) + Math.round(pay) } }).eq('shop_id', S.shopId).eq('id', b.id);
      if (up.error) throw up.error;
      Object.assign(b, { payments, amountPaid: (Number(payload.amountPaid) || 0) + Math.round(pay) });
      done.push({ bill: b, pay: Math.round(pay) });
    }
  } catch (e) {
    if (written > 0) { e.partial = written; }
    throw e;
  } finally { S.loadedAt = Date.now(); saveSnapshot(); }
  return done;
}

/* ==================================================================
   Invoices: who got theirs, kept on the order (0117 invoice.send).
   ================================================================== */
function invoiceSends(q){ return Array.isArray(q.invoiceSends) ? q.invoiceSends : []; }
function invoiceSent(q){ const s = invoiceSends(q); return s.length ? s[s.length - 1] : null; }
function invoicedOn(q){ return custISO(q.invoicedAt || q.date); }
async function recordInvoiceSend(q, via){
  if (!can('invoice.send')) return false;
  const cur = await sb.from('saved_quotes').select('payload').eq('shop_id', S.shopId).eq('id', q.id).maybeSingle();
  if (cur.error) throw cur.error;
  const payload = (cur.data && cur.data.payload) || {};
  const sends = (Array.isArray(payload.invoiceSends) ? payload.invoiceSends : []).concat([{ at: new Date().toISOString(), by: S.user ? String(S.user.id) : null, via }]);
  const up = await sb.from('saved_quotes').update({ payload: { ...payload, invoiceSends: sends } }).eq('shop_id', S.shopId).eq('id', q.id);
  if (up.error) throw up.error;
  q.invoiceSends = sends; saveSnapshot(); return true;
}

/* ==================================================================
   Recording a customer's payment -- the Sales app's own write
   (sales.html ACT['slide:pay']), the same rows in the same order:
   a receipt per bill it pays, the bill's payments and amount_paid,
   the debt following each bill's balance, and anything left lowering
   the debt as a payment on account.
   ================================================================== */
async function recordPayment(c0, amount, method, picks){
  if (!can('payment.receive')) throw new Error('recording a payment needs “Record payments in” — ask the owner to switch it on.');
  // One write (0140 receive_payment): the debt and each bill re-read and
  // locked, a receipt per bill, the bills' payments and share of the debt,
  // the debt lowered and logged, the rest on account -- all or nothing.
  const r = await sb.rpc('receive_payment', { p_shop_id: S.shopId, p_customer_id: c0.id, p_amount: Math.round(amount), p_method: method || 'cash', p_picks: picks && picks.length ? picks.map(Number) : null, p_order_id: null });
  if (r.error) throw r.error;
  const d = r.data || {};
  (d.cashRows || []).forEach(row => { if (!txnById(row.id)) D().cashTxns.push(rowToTxn(row)); });
  S.loadedAt = Date.now(); saveSnapshot();
  return { name: c0.name, id: c0.id, phone: c0.phone || c0.phone2 || '', amount: Math.round(amount), method: d.method || method, bills: d.bills || [], before: Number(d.before) || 0, after: Number(d.after) || 0, time: d.time || new Date().toTimeString().slice(0, 5) };
}

/* ==================================================================
   Sharing a file: the app's Share plugin inside the Android app, the
   browser's where it can hand over a file, else it is saved and their
   chat opens with the line typed (sales.html custSharePdf).
   ================================================================== */
async function shareBlob(blob, name, text, phone, title){
  const C = window.Capacitor, P = C && typeof C.isNativePlatform === 'function' && C.isNativePlatform() ? (C.Plugins || {}) : null;
  if (P && P.Share && P.Filesystem) {
    try {
      const buf = new Uint8Array(await blob.arrayBuffer());
      let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      const { uri } = await P.Filesystem.writeFile({ path: name, data: btoa(bin), directory: 'CACHE' });
      await P.Share.share({ files: [uri], text, title: title || name, dialogTitle: title || 'Send' });
      return 'shared';
    } catch (e) { if (/cancel/i.test(String((e && e.message) || e))) return 'cancelled'; console.warn('native share failed', e); }
  }
  let file = null; try { file = new File([blob], name, { type: blob.type }); } catch (_e) {}
  try { if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return 'shared'; } }
  catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  window.open(waComposeUrl(phone, text), '_blank');
  toast('Saved — attach it in the WhatsApp chat and send.', 8000);
  return 'saved';
}

function ptable(x, Y, head, rows, total){

/* ---- from the Buyer (buyer_handoffs, 0125; own money and cash back, 0154) ----
   What the Buyer passes on: the cash a trip needs (trip_cash: hand it over),
   a supplier's paper bill with its photo (paper_bill: record it), a round
   paid from their own pocket (own_money: pay them back), and cash handed
   over that no round used (a done trip_cash with v 2 and no round: count it
   back). Whether a stop was own money, and its receipt, is on the trip
   (collection_trips.pay, the Buyer's 0151). Closing one sets status 'done';
   the guard stamps who and when. */
function handoffs(){ return (D().handoffs || []); }
function looseCash(){ return (D().looseCash || []); }
function handoffById(id){ return handoffs().concat(looseCash()).find(h => String(h.id) === String(id)) || null; }
// Who passed it on: the staff row whose login made it, by first name.
function handoffBy(h){ const st = (D().staff || []).find(x => x.userId && String(x.userId) === String(h.createdBy)); return st ? firstWord(st.name) : (firstWord(h.p.buyer) || 'The Buyer'); }
function handoffByFull(h){ const st = (D().staff || []).find(x => x.userId && String(x.userId) === String(h.createdBy)); return st ? st.name : (h.p.buyer || 'The Buyer'); }
// A round of stops (the Buyer's Plan the round) is one ask: "Karddia, Roto +2 · 4 stops".
function handoffSupplier(h){ if (Array.isArray(h.p.supplierIds) && h.p.supplierIds.length > 1) return (h.p.supplier || h.p.supplierIds.length + ' suppliers') + ' · ' + h.p.supplierIds.length + ' stops'; const s = supplierById(h.p.supplierId); return (s && s.name) || h.p.supplier || h.p.for || 'a supplier'; }
function handoffWhen(h){ const iso = String(h.createdAt || '').slice(0, 10); return iso === todayISO() ? hm(Date.parse(h.createdAt)) : shortDay(iso); }
// What the Buyer's phone said about a stop (0151): { own, amount, receipt: 'photo' | 'none' }.
function tripPay(t){ return t && t.pay && typeof t.pay === 'object' ? t.pay : null; }
function tripOwn(t){ const p = tripPay(t); return !!(p && p.own); }
function tripRoundOf(id){ const m = String(id || '').match(/^(TRIP-[A-Za-z0-9]+)-[0-9]+$/); return m ? m[1] : String(id || ''); }
function roundTag(id){ return 'T-' + tripRoundOf(id).replace(/^TRIP-/, '').slice(-4).toUpperCase(); }
function tripStopPaid(t){ const p = tripPay(t), a = p && Number(p.amount); return Math.round(a > 0 ? a : (t.lines || []).reduce((s, l) => s + tripLinePaid(l), 0)); }
// The stops of an own-money hand-in: the ones it names, else its round's own-money stops.
function ownStops(h){
  const trips = D().trips || [], named = Array.isArray(h.p.stops) ? h.p.stops : [];
  const fromTrip = (t, s) => ({ tripId: t ? t.id : s.tripId, t: t || null, supplierId: t ? t.supplierId : null,
    name: (t && supplierById(t.supplierId) ? supplierById(t.supplierId).name : s && s.supplier) || 'Supplier',
    amount: t && tripPay(t) ? tripStopPaid(t) : Number(s && s.amount) || 0, receipt: (t && tripPay(t) || {}).receipt || (s && s.receipt) || '' });
  const list = named.length ? named.map(s => fromTrip(trips.find(x => String(x.id) === String(s.tripId)), s))
    : trips.filter(t => h.p.round && tripRoundOf(t.id) === h.p.round && tripOwn(t)).map(t => fromTrip(t, null));

}
function ownTotal(h){ const s = ownStops(h); return s.length ? s.reduce((a, x) => a + x.amount, 0) : Math.round(Number(h.p.amount) || 0); }

}

// Close a hand-off: only its status changes (0125 guard). Throws when nothing was closed.
async function handoffDone(id){
  const r = await sb.from('buyer_handoffs').update({ status: 'done' }).eq('shop_id', S.shopId).eq('id', id).select('id'); if (r.error) throw r.error;
  if (Array.isArray(r.data) && !r.data.length) throw new Error('That needs the owner to switch it on for you');
  D().handoffs = handoffs().filter(h => String(h.id) !== String(id));
}

/* ==================================================================
   OWED — everyone who owes, by how old it is.
   ================================================================== */
function agingRing(c, size){
  const a = custAging(c), total = BANDS.reduce((s, b) => s + a.parts[b.k], 0) + a.unknown;
  const segs = BANDS.map(b => ({ n: a.parts[b.k], col: b.solid || b.col })).concat(a.unknown > 0 ? [{ n: a.unknown, col: '#C9C4BA' }] : []);
  const t = tintFor(c.id);
  return `<span style="position:relative;width:${size}px;height:${size}px;flex:none;display:block">${segRing(total ? segs : [{ n: 1, col: '#E6E3DD' }], size, 4, '', '')}<span style="position:absolute;inset:6px;border-radius:999px;background:${t[0]};color:${t[1]};font-size:${Math.round(size * .28)}px;font-weight:700;display:flex;align-items:center;justify-content:center">${esc(initials(c.name))}</span></span>`;
}
function owedRows(){
  const k = S.ui.owesSort || 'old', band = S.ui.owesBand;
  let list = debtors().slice();
  if (band) list = list.filter(c => (band === 'nodate' ? custAging(c).unknown : custAging(c).parts[band]) > 0.5);
  if (k === 'promised') list = list.filter(c => promiseFor(c.id));
  if (k === 'limit') list = list.filter(c => custLimit(c) > 0 && c.debt > custLimit(c));
  const q = String(S.ui.owesQ || '').trim().toLowerCase();
  if (q) list = D().customers.filter(c => [c.name, c.phone, c.phone2, c.location].some(v => String(v || '').toLowerCase().includes(q)));
  list.sort(k === 'big' ? (a, b) => b.debt - a.debt : (a, b) => custAging(b).oldest - custAging(a).oldest || b.debt - a.debt);
  return list;
}
function viewOwed(){
  const tot = owedTotals(), rows = owedRows(), shown = rows.slice(0, S.ui.owesMore || 40), stmtN = debtors().filter(statementDue).length;
  const notSent = D().savedQuotes.filter(q => q.invoiced && !q.voided && invoicedOn(q) === todayISO() && !invoiceSent(q)).length;
  const chip = (k, label, n) => `<button class="bx-chip" data-act="owesort" data-v="${k}" aria-pressed="${S.ui.owesSort === k}" style="border:none;height:36px;padding:0 12px;font-size:13px;${S.ui.owesSort === k ? 'background:var(--navy);color:#fff' : 'background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);font-weight:600'}">${label}${n != null ? ` <span class="m">${n}</span>` : ''}</button>`;
  const promisedN = debtors().filter(c => promiseFor(c.id)).length, overN = debtors().filter(c => custLimit(c) > 0 && c.debt > custLimit(c)).length;
  return `<div class="bx-hero" data-navy-top>
    <div style="display:flex;align-items:center;gap:10px"><span style="flex:1;font-size:26px;font-weight:700;letter-spacing:-.02em">Who owes <span class="m" style="font-size:16px;color:var(--navyInk2)">${debtors().length}</span></span><button class="bx-circle" data-act="invoices" aria-label="Invoices">${ic('doc', 20)}</button></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:12px;font-weight:600;color:var(--navyInk2)">Owed to the shop, everyone</span><span class="m" style="font-size:26px;font-weight:600">${n0(tot.all)}</span></div>
      <div role="img" aria-label="${BANDS.map(b => b.label + ' ' + n0(tot[b.k])).join(', ')}${tot.unknown > 0.5 ? ', no date ' + n0(tot.unknown) : ''}" style="display:flex;gap:3px;height:14px">${BANDS.map((b, i) => tot[b.k] > 0 ? `<i class="a-grow" style="flex:${tot[b.k]};border-radius:${i === 0 ? '999px 3px 3px 999px' : i === 3 ? '3px 999px 999px 3px' : '3px'};background:${b.col}"></i>` : '').join('')}${tot.unknown > 0.5 ? `<i style="flex:${tot.unknown};border-radius:3px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 3px,rgba(255,255,255,.08) 3px 6px)"></i>` : ''}</div>
      <div style="display:grid;grid-template-columns:repeat(${tot.unknown > 0.5 ? 5 : 4},minmax(0,1fr));gap:4px">${BANDS.concat(tot.unknown > 0.5 ? [{ k: 'nodate', label: 'no date', col: 'repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 3px,rgba(255,255,255,.08) 3px 6px)' }] : []).map(b => `<button data-act="owesband" data-v="${b.k}" aria-pressed="${S.ui.owesBand === b.k}" style="border:none;background:${S.ui.owesBand === b.k ? 'rgba(255,255,255,.12)' : 'transparent'};border-radius:10px;padding:4px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:2px"><span style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--navyInk)"><i style="width:7px;height:7px;border-radius:999px;background:${b.col}"></i>${b.label}</span><span class="m" style="font-size:13px;font-weight:600">${((b.k === 'nodate' ? tot.unknown : tot[b.k]) / 1e6).toFixed(2)}M</span></button>`).join('')}</div>
    </div>
    <label class="bx-search">${ic('search', 19, 'style="color:var(--navyInk)"')}<input id="owes_q" data-in="owesq" type="search" placeholder="Name, phone or place" value="${esc(S.ui.owesQ || '')}" aria-label="Find a customer"></label>
    <button data-act="statements" style="height:50px;border:none;border-radius:16px;background:var(--red);color:#fff;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;box-shadow:0 8px 18px rgba(201,58,48,.3)"><span aria-hidden="true" style="position:relative;width:26px;height:26px;flex:none"><i style="position:absolute;left:6px;top:0;width:18px;height:22px;border-radius:3px;background:rgba(255,255,255,.45)"></i><i style="position:absolute;left:2px;top:4px;width:18px;height:22px;border-radius:3px;background:#fff"></i></span><span style="flex:1;text-align:left;font-size:15px;font-weight:700">${stmtN ? `<span class="m">${stmtN}</span> statements ready to send` : 'Statements'}</span>${ic('chev', 18, 'style="stroke-width:2.2"')}</button>
  </div>
  <div class="bx-body">
    <div style="position:relative;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px">${chip('old', 'Oldest first')}<button class="bx-chip" data-act="invoices" style="border:none;height:36px;padding:0 12px;font-size:13px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);font-weight:600">${ic('doc', 14)}Invoices${notSent ? ` <span class="m" style="color:var(--amberInk)">${notSent}</span>` : ''}</button>${chip('big', 'Biggest')}${chip('promised', 'Promised', promisedN)}${chip('limit', 'Over limit', overN)}</div>
    ${shown.length ? `<div class="bx-card bx-list">${shown.map(c => owedRow(c)).join('')}</div>` : emptyCard(S.ui.owesQ ? 'Nobody matches' : 'Nobody owes in this list', S.ui.owesQ ? 'Try part of the name, a phone number or the area' : 'Pick another filter above')}
    ${rows.length > shown.length ? `<button class="bx-btn ghost" style="flex:none;height:48px;font-size:14px" data-act="owesmore">Show <span class="m">${Math.min(40, rows.length - shown.length)}</span> more · <span class="m">${rows.length - shown.length}</span> left</button>` : rows.length > 5 ? `<span class="bx-sub" style="text-align:center">All <span class="m">${rows.length}</span> shown</span>` : ''}
  </div>`;
}
function owedRow(c){
  const a = custAging(c), pr = promiseFor(c.id), l = lastStatement(c.id), over = custLimit(c) > 0 && c.debt > custLimit(c);
  const band = bandOf(a.oldest), bad = band.k === 'b90p';
  let sub = agingNoDate(a) ? 'no date' : `oldest <span class="m">${a.oldest}</span> days`;
  if (pr) sub += ` · <span style="color:var(--sky)">promised ${pr.amount ? '<span class="m">' + n0(pr.amount) + '</span> ' : ''}${esc(shortDay(pr.promisedOn))}</span>`;
  else if (over) sub += ` · <span style="color:var(--amberInk)">over their limit</span>`;
  else if (!l) sub += ' · no statement yet';
  else sub += ` · statement <span class="m">${daysBetween(String(l.sent_on), todayISO())}</span> d ago`;
  return `<button class="bx-row" data-act="account" data-id="${esc(c.id)}" style="min-height:68px">${agingRing(c, 46)}
    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span class="bx-t ell" style="font-size:15px">${esc(c.name)}</span><span class="bx-sub ell" style="font-weight:600;${bad ? 'color:var(--crimson)' : ''}">${sub}</span></span>
    <span class="m" style="font-size:15px;font-weight:600;${bad ? 'color:var(--crimson)' : ''}">${n0(c.debt)}</span></button>`;
}
ACT.owesort = t => { S.ui.owesSort = t.dataset.v; S.ui.owesMore = 40; FEEL.tick(); render(); };
ACT.owesband = t => { S.ui.owesBand = S.ui.owesBand === t.dataset.v ? null : t.dataset.v; FEEL.tick(); render(); };
ACT.owesmore = () => { S.ui.owesMore = (S.ui.owesMore || 40) + 40; render(); };
ACT['in:owesq'] = t => { S.ui.owesQ = t.value; S.ui.owesMore = 40; render(); };
ACT.acctall = t => { S.ui.acctAll = t.dataset.id; FEEL.tick(); render(); };
ACT.account = t => { FEEL.open(); push('account', { id: t.dataset.id }); };

/* ---- one customer: invoices, and what paid them ---- */
function payChip(p, q){
  const m = p.method || (p.cashTxnId ? acctOf(txnById(p.cashTxnId) || {}) : '');
  return `<button class="ac-pay" data-act="${p.cashTxnId ? 'payment' : 'noop'}" data-id="${esc(p.cashTxnId || '')}"><i>${ic(m === 'bank' ? 'bank' : m === 'momo' ? 'momo' : 'cash', 10, 'style="stroke-width:2.4"')}</i><span class="m">${n0(p.amount)}</span> ${m === 'momo' ? 'mobile' : esc(m || 'paid')} · ${esc(shortDay(p.date))}</button>`;
}
PAGE.account = ({ id }) => {
  const c = customerById(id); if (!c) return `<div class="card"><div class="bx-empty"><b>Not on file any more</b><br><button class="bx-btn ghost" style="flex:none;margin:12px auto 0" data-act="back">Back</button></div></div>`;
  const open = custOpen(c.id), settled = customerOrdersFor(c.id).filter(q => q.invoiced && !q.voided && balanceDue(q) <= 0).sort((a, b) => String(b.invoicedAt || b.date || '').localeCompare(String(a.invoicedAt || a.date || ''))).slice(0, 2);
  const l = lastStatement(c.id), lim = custLimit(c), pr = promiseFor(c.id);
  const scale = Math.max(c.debt, lim) * 1.15 || 1;
  const invRow = (q, done) => {
    const total = quoteTotal(q), paid = Number(q.amountPaid) || 0, left = balanceDue(q), late = invLateDays(q), age = custBillAge(q);
    const pays = (q.payments || []).filter(p => p && Number(p.amount) > 0);
    return `<div class="ac-inv">
      <span style="display:flex;align-items:baseline;gap:8px"><button data-act="invoice" data-id="${q.id}" class="m" style="border:none;background:none;padding:0;font-size:14px;font-weight:600;white-space:nowrap;${done ? 'color:var(--ink3)' : ''}">${invoiceLabel(q)}</button>${done ? `<span class="bx-chip" style="height:20px;background:var(--greenSoft);color:var(--green);font-size:10px;letter-spacing:.08em">${ic('tick', 11, 'style="stroke-width:3"')}SETTLED</span>` : ''}<span class="m" style="margin-left:auto;font-size:15px;font-weight:600;${done ? 'color:var(--ink3)' : ''}">${n0(done ? total : left)}</span></span>
      <span style="display:flex;align-items:baseline;gap:8px;margin-top:-4px;font-size:12px;font-weight:600;white-space:nowrap"><span style="color:${late && !done ? 'var(--amberInk)' : 'var(--ink3)'}">${esc(shortDay(invoicedOn(q)))}${done ? '' : late ? ` · <span class="m">${late}</span> d past terms` : ` · <span class="m">${age}</span> d`}</span><span style="margin-left:auto;color:var(--ink3)">${done ? '' : paid ? `<span class="m">${n0(paid)}</span> paid of <span class="m">${n0(total)}</span>` : 'nothing paid'}</span></span>
      <span class="ac-bar">${pays.map((p, i) => `<i class="a-grow" style="flex:${p.amount};background:${i % 2 ? '#5C6788' : '#16203C'}"></i>`).join('')}${left > 0 ? `<i style="flex:${left}"></i>` : ''}</span>
      ${pays.length ? `<span style="display:flex;gap:6px;flex-wrap:wrap">${pays.map(p => payChip(p, q)).join('')}</span>` : ''}</div>`;
  };
  return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card">
    <div class="bx-sheethead"><span class="bx-grip"></span>
      <div style="display:flex;align-items:center;gap:12px">${avatar(c.name, c.id, 44, true)}<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="ell" style="font-size:18px;font-weight:700">${esc(c.name)}</span><span class="ell" style="font-size:12px;color:var(--navyInk)">${esc([c.location, sellerOf(c) ? sellerOf(c) + '’s customer' : '', `${custTerms(c)}-day terms`].filter(Boolean).join(' · '))}</span></span>${closeBtn()}</div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px">
        <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;font-weight:600;color:var(--navyInk2)">Owes${open.length ? `, <span class="m">${open.length}</span> invoice${open.length === 1 ? '' : 's'}` : ''}</span><span class="m" style="font-size:32px;font-weight:600;letter-spacing:-.03em">${n0(c.debt)}</span></span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--navyInk)"><span>${pr ? 'promised' : 'last statement'}</span><span style="font-weight:700;color:#fff">${pr ? `${pr.amount ? '<span class="m">' + n0(pr.amount) + '</span> ' : ''}${esc(shortDay(pr.promisedOn))}` : l ? `${esc(shortDay(String(l.sent_on)))} · <span class="m">${daysBetween(String(l.sent_on), todayISO())}</span> d ago` : 'never'}</span></span>
      </div>
      ${lim > 0 ? `<div style="display:flex;flex-direction:column;gap:6px"><div role="img" aria-label="Owes ${n0(c.debt)} against a limit of ${n0(lim)}" style="position:relative;height:12px"><span style="position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.1)"></span><i class="a-grow" style="position:absolute;left:0;top:0;bottom:0;width:${(Math.min(c.debt, lim) / scale * 100).toFixed(1)}%;border-radius:999px 0 0 999px;background:#DDE3F0"></i>${c.debt > lim ? `<i class="a-grow" style="position:absolute;left:${(lim / scale * 100).toFixed(1)}%;top:0;bottom:0;width:${((c.debt - lim) / scale * 100).toFixed(1)}%;border-radius:0 999px 999px 0;background:var(--amber);animation-delay:.6s"></i>` : ''}<i style="position:absolute;left:${(lim / scale * 100).toFixed(1)}%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:2px;background:#fff"></i></div>
        <span style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--navyInk)"><span style="display:inline-flex;align-items:center;gap:5px">${ic('lock', 12)}limit <b class="m" style="color:#fff">${n0(lim)}</b> · the Manager sets it</span>${c.debt > lim ? `<span style="color:var(--amber)"><span class="m">${n0(c.debt - lim)}</span> over</span>` : `<span><span class="m">${n0(lim - c.debt)}</span> left</span>`}</span></div>` : ''}
    </div>
    <div class="bx-body">
      <div class="bx-sec"><b>Invoices, and what paid them</b><span style="display:flex;gap:10px;font-size:11px"><span style="display:inline-flex;align-items:center;gap:4px"><i style="width:8px;height:8px;border-radius:2px;background:var(--navy)"></i>paid</span><span style="display:inline-flex;align-items:center;gap:4px"><i style="width:8px;height:8px;border-radius:2px;background:var(--soft2);box-shadow:inset 0 0 0 1px #D9D4CB"></i>left</span></span></div>
      ${open.length || settled.length ? `<div class="bx-card" style="padding:0 14px">${(open.length > 8 && !(S.ui.acctAll === c.id) ? open.slice(0, 8) : open).map(q => invRow(q, false)).join('')}${open.length > 8 && S.ui.acctAll !== c.id ? `<button class="ac-more" data-act="acctall" data-id="${esc(c.id)}">${ic('down', 16)}<span>Show all <span class="m">${open.length}</span> open invoices</span><span class="m" style="margin-left:auto;color:var(--ink3)">+${n0(open.slice(8).reduce((s, q) => s + balanceDue(q), 0))}</span></button>` : ''}${settled.map(q => invRow(q, true)).join('')}</div>` : emptyCard('No invoices on file', 'What they owe came from before the invoices were kept here')}
      ${custAging(c).unknown > 0.5 ? `<span class="bx-hint">${ic('clock', 14)}<span class="m">${n0(custAging(c).unknown)}</span> of it has no date</span>` : ''}
      <button class="bx-hint" data-act="propose" data-id="${esc(c.id)}" style="border:none;background:none;justify-content:center;color:var(--ink3);width:100%">${ic('lock', 13)}Void, credit note, limit, terms — ${esc(managerName())}<span style="color:var(--navy);font-weight:700;display:inline-flex;align-items:center;gap:2px">· ask ${ic('chev', 12)}</span></button>
    </div>
    <div class="bx-foot"><div class="row"><button class="bx-sq" data-act="stmt" data-id="${esc(c.id)}" aria-label="Statement">${ic('doc', 20)}</button><button class="bx-sq" data-act="promise" data-id="${esc(c.id)}" aria-label="Record a promise to pay">${ic('flag', 20)}</button>${can('payment.receive') ? `<button class="bx-btn red" data-act="receive" data-id="${esc(c.id)}">${ic('cash', 20)}Record a payment</button>` : `<button class="bx-btn ghost" aria-disabled="true">${ic('lock', 18)}Payments: owner</button>`}</div></div>
  </div>`;
};

/* ---- one payment: where it went, written in the books ---- */
PAGE.payment = ({ id }) => {
  const t = txnById(id); if (!t) return `<div class="card"><div class="bx-empty"><b>That payment is not in the last five months of the cash book</b><br><button class="bx-btn ghost" style="flex:none;margin:12px auto 0" data-act="back">Back</button></div></div>`;
  const tr = txnTrace(t), c = tr.cust, who = whoName(t.enteredBy) || 'the owner';
  const open = c ? custOpen(c.id) : [];
  const picks = open.length ? [open[0]].concat(open.slice(1).sort((a, b) => Math.abs(balanceDue(a) - t.amount) - Math.abs(balanceDue(b) - t.amount)).slice(0, 1)) : [];
  const chosen = S.ui.payPick && open.find(q => String(q.id) === String(S.ui.payPick)) || picks[0];
  const more = Math.max(0, open.length - picks.length);
  const flow = tr.onAccount ? `<div class="ac-flow" role="img" aria-label="${n0(t.amount)} lowered the debt only; no invoice was paid">
      <svg width="100%" height="184" viewBox="0 0 358 184" aria-hidden="true" preserveAspectRatio="none">
        ${picks.map((q, i) => `<path class="ac-dash" d="M96 92 C 124 92, 122 ${26 + i * 66}, 150 ${26 + i * 66}" fill="none" stroke="${chosen === q ? '#C93A30' : '#D9D4CB'}" stroke-width="${chosen === q ? 3 : 2}" stroke-dasharray="5 5" stroke-linecap="round"/>`).join('')}
        <path class="ac-flowline" d="M96 92 C 124 92, 122 158, 150 158" fill="none" stroke="#16203C" stroke-width="10" stroke-linecap="round"/></svg>
      <span class="ac-coin">${ic(acctOf(t) === 'bank' ? 'bank' : acctOf(t) === 'momo' ? 'momo' : 'cash', 18, 'style="color:var(--mint)"')}<span class="m">${n0(t.amount)}</span></span>
      ${picks.map((q, i) => { const on = chosen === q, left = balanceDue(q); return `<button class="ac-dest" data-act="paypick" data-v="${q.id}" aria-pressed="${on}" style="top:${i * 66}px;${on ? 'background:#FDE8E4;box-shadow:inset 0 0 0 2px #C93A30' : ''}"><span style="flex:1;display:flex;flex-direction:column;gap:1px;text-align:left"><span class="m" style="font-size:13px;font-weight:600">${invoiceLabel(q)}</span><span style="font-size:11px;font-weight:600;color:var(--ink2)">${on ? 'move it here' : i === 0 ? `oldest · <span class="m">${custBillAge(q)}</span> d` : 'nearest to ' + n0(t.amount)}</span></span><span class="m" style="font-size:13px;font-weight:600">${on ? n0(Math.max(0, left - t.amount)) + ' after' : n0(left)}</span></button>`; }).join('')}
      <span class="ac-dest" style="top:132px;background:var(--amberSoft);box-shadow:inset 0 0 0 1.5px var(--amber)"><span style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:13px;font-weight:700;color:var(--amberDeep)">Their debt only</span><span style="font-size:11px;font-weight:600;color:var(--amberDeep)">${tr.debt ? `<span class="m">−${n0(tr.debt.amount)}</span>` : ''}</span></span><span class="m" style="font-size:13px;font-weight:600;color:var(--amberDeep)">−${n0(t.amount)}</span></span>
    </div>
    ${more ? `<button class="bx-pick" data-act="payfind" data-id="${t.id}" style="margin-left:150px;width:auto;height:48px">${ic('search', 16)}<span style="flex:1;display:flex;flex-direction:column"><span style="font-size:13px;font-weight:700"><span class="m">${more}</span> more open invoices</span><span style="font-size:11px;font-weight:600;color:var(--ink2)">find by number, date or amount</span></span>${ic('chev', 14)}</button>` : ''}`

// The period a statement covers: since their last one (else their oldest
// open bill), this month, or the days picked on the calendar.
function stmtPeriod(cid){
  const t = todayISO(), set = (S.ui.stmtRange || {})[cid];
  if (set) return set;
  if (S.ui.stmtMode === 'month') return { from: t.slice(0, 8) + '01', to: t };
  if (S.ui.stmtMode === 'pick' && S.ui.stmtBatchRange) return S.ui.stmtBatchRange;
  const l = lastStatement(cid); if (l) return { from: String(l.sent_on), to: t };
  const c = customerById(cid), oc = c ? custOpenCharges(c) : [];
  const first = oc.length && oc[0].date ? String(oc[0].date).slice(0, 10) : custStmtRange().from;
  return { from: first < t ? first : custStmtRange().from, to: t };
}
function stmtSheetFor(cid){
  const c = customerById(cid); if (!c) return null;
  const { from, to } = stmtPeriod(cid), st = custStmtRows(cid, from, to);
  const buckets = [['0–30', 0, 30], ['31–60', 31, 60], ['61–90', 61, 90], ['over 90', 91, Infinity]].map(([label, lo, hi]) => ({ label, lo, hi, value: 0 }));
  custOpenCharges(c).forEach(ch => { const rem = Number(ch.remaining) || 0; if (rem <= 0.5 || !ch.date) return; const age = Math.max(0, daysBetween(String(ch.date).slice(0, 10), todayISO())); const b = buckets.find(x => age >= x.lo && age <= x.hi); if (b) b.value += rem; });
  const open = custOpen(c.id);
  return { st, open, side: { who: { name: c.name, location: c.location, phone: [c.phone, c.phone2].map(x => String(x || '').trim()).filter(Boolean)[0] || '' }, account: c.id,
    openLine: open.length ? `${open.length} open ${open.length === 1 ? 'invoice' : 'invoices'}` : '', aging: buckets } };
}
function stmtQueue(){
  const t = todayISO(), skip = S.ui.stmtSkip || {};
  const sentToday = (D().statementsSent || []).filter(s => String(s.sent_on) === t);
  const done = S.ui.stmtDone || {}, due = debtors().filter(c => statementDue(c) && !skip[c.id] && !done[c.id]).sort((a, b) => custAging(b).oldest - custAging(a).oldest || b.debt - a.debt);
  const order = S.ui.stmtOrder || [];
  due.sort((a, b) => { const ia = order.indexOf(String(a.id)), ib = order.indexOf(String(b.id)); return (ia < 0 ? 1e9 : ia) - (ib < 0 ? 1e9 : ib); });
  return { due, sentToday, skipped: debtors().filter(c => skip[c.id]) };
}

    .filter(rp=> String(rp.date||'') <= asOf)

function consignmentHeld(supplierId){
  const out = new Map();
  Object.keys(data.stockLots || {}).forEach(key=>{
    (data.stockLots[key] || []).forEach(lot=>{
      if(!lot.consign || !(lot.qty > 0)) return;
      if(supplierId && lot.consign !== supplierId) return;
      const rec = out.get(lot.consign) || { supplierId: lot.consign, qty: 0, value: 0, keys: new Set() };
      rec.qty += Number(lot.qty)||0;
      rec.value += (Number(lot.qty)||0) * (Number(lot.cost)||0);
      rec.keys.add(key);
      out.set(lot.consign, rec);
    });
  });
  return [...out.values()].map(r=> ({ ...r, lines: r.keys.size }));
}
function consignmentAccrued(supplierId, asOf){
  const out = new Map();
  (data.savedQuotes||[]).forEach(q=>{
    if(!q.invoiced || q.voided) return;
    const day = String(q.invoicedAt || q.date || '').slice(0,10);
    if(asOf && day > asOf) return;
    const billed = savedQuoteTotal(q);
    const paid = Number(q.amountPaid)||0;
    const share = billed > 0 ? Math.min(1, Math.max(0, paid / billed)) : 1;
    (q.items||[]).forEach(it=>{
      (it._stockLots||[]).forEach(l=>{
        if(!l.consign) return;
        if(supplierId && l.consign !== supplierId) return;
        const rec = out.get(l.consign)
          || { supplierId: l.consign, qty: 0, value: 0, collected: 0, uncollected: 0 };
        const v = (Number(l.qty)||0) * (Number(l.cost)||0);
        rec.qty += Number(l.qty)||0;
        rec.value += v;
        rec.collected += v * share;
        rec.uncollected += v * (1 - share);
        out.set(l.consign, rec);
      });
    });
  });
  return [...out.values()];
}

function consignmentRows(asOf){
  const bySupplier = new Map();

    if(!bySupplier.has(id)) bySupplier.set(id, { supplierId: id, name: supplierName(id),
      heldQty: 0, heldValue: 0, soldQty: 0, accrued: 0, collected: 0, uncollected: 0,
      settled: 0, settlementDue: 0, owed: 0, lines: 0 });
    return bySupplier.get(id);
  };
  consignmentHeld().forEach(h=>{
    const r = touch(h.supplierId);
    r.heldQty = h.qty; r.heldValue = h.value; r.lines = h.lines;
  });
  consignmentAccrued(null, asOf).forEach(a=>{

    r.soldQty = a.qty; r.accrued = a.value;
    r.collected = a.collected; r.uncollected = a.uncollected;

  bySupplier.forEach(r=>{

  return [...bySupplier.values()]
    .filter(r=> r.heldQty > 0 || Math.abs(r.owed) > 0.5 || r.accrued > 0)
    .sort((a,b)=> (consignmentDueNow(b) - consignmentDueNow(a)) || (b.owed - a.owed));

function shelfValueForKey(key){
  const qty = Number((data.stock||{})[key])||0;
  const rows = (data.stockLots||{})[key] || [];
  const consigned = rows.filter(l=> l.consign);
  const consignedQty = consigned.reduce((n,l)=> n + (Number(l.qty)||0), 0);
  const consignedValue = consigned.reduce((n,l)=> n + (Number(l.qty)||0)*(Number(l.cost)||0), 0);
  const out = { qty, consignedQty, consignedValue,
    ownedQty: Math.max(0, qty - consignedQty), value: 0, uncostedQty: 0, unitCost: null };
  if(out.ownedQty <= 0) return out;
  const costed = rows.filter(l=> !l.consign && l.cost != null);
  const costedQty = costed.reduce((s,l)=> s + (Number(l.qty)||0), 0);
  if(costedQty <= 0){ out.uncostedQty = out.ownedQty; return out; }
  const costedValue = costed.reduce((s,l)=> s + (Number(l.qty)||0)*(Number(l.cost)||0), 0);
  out.unitCost = costedValue / costedQty;
  const priced = Math.min(out.ownedQty, costedQty);
  out.value = priced * out.unitCost;
  if(out.ownedQty > costedQty) out.uncostedQty = out.ownedQty - costedQty;
  return out;
}
function inventoryValue(){
  let value = 0, uncostedQty = 0, consignedQty = 0, consignedValue = 0;
  const keys = new Set(Object.keys(data.stock || {}).concat(Object.keys(data.stockLots || {})));
  keys.forEach(k=>{
    const r = shelfValueForKey(k);
    if(r.qty <= 0) return;
    value += r.value; uncostedQty += r.uncostedQty;
    consignedQty += r.consignedQty; consignedValue += r.consignedValue;
  });
  return { value, uncostedQty, consignedQty, consignedValue };
}

function stockValueAsAt(asOf){
  const lots = data.stockLots || {};
  const today = todayISO();
  if(!asOf || asOf >= today) return inventoryValue();
  const log = (data.stockLog||[]).slice()
    .sort((a,b)=> String(a.date||'').localeCompare(String(b.date||'')) || (a.id-b.id));
  const qtyThen = {};
  const seen = new Set();
  log.forEach(e=>{
    if(!e.key) return;
    if(String(e.date||'') <= asOf){ qtyThen[e.key] = Number(e.qtyAfter)||0; }
    else if(!seen.has(e.key) && qtyThen[e.key] === undefined){
      qtyThen[e.key] = (Number(e.qtyAfter)||0) - (Number(e.delta)||0);
    }
    seen.add(e.key);
  });
  let value = 0, uncostedQty = 0;
  const keys = new Set(Object.keys(lots).concat(Object.keys(qtyThen)));
  keys.forEach(k=>{
    const current = (lots[k]||[]);
    const currentQty = current.reduce((s,l)=> s + (Number(l.qty)||0), 0);
    const costed = current.filter(l=> l.cost != null);
    const costedQty = costed.reduce((s,l)=> s + (Number(l.qty)||0), 0);
    const costedValue = costed.reduce((s,l)=> s + (Number(l.qty)||0)*(Number(l.cost)||0), 0);
    const qty = qtyThen[k] === undefined ? currentQty : qtyThen[k];
    if(qty <= 0) return;
    if(costedQty <= 0){ uncostedQty += qty; return; }
    value += qty * (costedValue / costedQty);
  });
  return { value, uncostedQty, estimated: true };
}

function cashFlowStatement(fromISO, toISO){
  const rows = dashCashTxnsInRange(fromISO, toISO);
  const sum = (f)=> rows.filter(f).reduce((s,t)=> s + (Number(t.amount)||0), 0);
  const tradingIn = sum(cashIsTradingIncome);
  const backed = invoiceBackedCashTxnIds();
  const tradingInUninvoiced = sum(t=> cashIsTradingIncome(t) && t.quoteId == null && !backed.has(t.id));
  const operatingOut = sum(cashIsOperatingExpense);
  const stockOut = sum(t=> cashIsMoneyOut(t)
    && (t.category === 'Stock Purchase' || t.category === 'Supplier Payment'));
  const debtCollected = sum(cashIsDebtCollection);
  const cashFound = sum(cashIsCashOverage);
  const operating = tradingIn + debtCollected + cashFound - operatingOut - stockOut;
  const borrowed = sum(t=> cashIsMoneyIn(t) && t.category === 'Loan Received');
  const ownerIn = sum(t=> cashIsMoneyIn(t) && t.category === 'Owner Investment');
  const ownerOut = sum(cashIsOwnerWithdrawal);
  const repaid = sum(t=> cashIsMoneyOut(t) && t.category === 'Loan Repayment');
  const financing = borrowed + ownerIn - repaid - ownerOut;
  const equipmentOut = sum(t=> cashIsMoneyOut(t) && t.category === 'Equipment purchase');
  const assetSaleIn = sum(t=> cashIsMoneyIn(t) && t.category === 'Asset Sale');
  const investing = assetSaleIn - equipmentOut;
  const netMovement = rows.reduce((s,t)=> s + (cashIsMoneyIn(t) ? 1 : -1) * (Number(t.amount)||0), 0);
  return {
    from: fromISO, to: toISO,
    tradingIn, tradingInUninvoiced, debtCollected, cashFound, operatingOut, stockOut, operating,
    equipmentOut, assetSaleIn, investing,
    borrowed, ownerIn, ownerOut, repaid, financing,
    netMovement,
    unclassified: netMovement - (operating + investing + financing),
  };
}
function loanDuePosition(loan, asOfISO){
  const asOf = asOfISO || todayISO();
  const nowMonth = String(asOf).slice(0,7);
  const rows = loanSchedule(loan);
  const past = [];
  let askedBefore = 0, askedByNow = 0, thisMonth = 0, next = null;
  rows.forEach((r, i)=>{
    if(r.date <= asOf){
      askedByNow += r.payment;
      const nextDue = loanDueDate(loan, i+1);
      const graceEnds = nextDue ? nextDue.toISOString().slice(0,10) : r.date;
      if(graceEnds <= asOf){ askedBefore += r.payment; past.push(r); }
    }
    else if(!next){ next = r; }
    if(r.month === nowMonth) thisMonth += r.payment;
  });
  const paid = loanRepayments(loan)
    .filter(rp=> !rp.date || String(rp.date) <= asOf)
    .reduce((s,rp)=> s + Math.max(0, Number(rp.amount)||0), 0);
  const applied = loanApplied(loan, asOf);
  const payoff = Math.max(0, applied.balance + applied.accruedUnpaid + (applied.feesUnpaid||0));
  const settled = payoff < 1;
  const overdue = Math.max(0, askedBefore - paid);
  const dueNow = Math.min(Math.max(0, askedByNow - paid), payoff);
  const status = settled ? 'settled'
    : overdue > 0 ? 'overdue'
    : dueNow > 0 ? 'due'
    : 'upcoming';
  return {
    status, dueNow, overdue, thisMonth, paid, payoff,
    instalmentsBehind: (()=>{
      let acc = 0, behind = 0;
      past.forEach(r=>{ acc += r.payment; if(acc - paid > 0.5) behind++; });
      return behind;
    })(),
    next: next ? { month: next.month, payment: next.payment } : null,
    month: nowMonth,
  };
}
const CASH_NOT_OPEX = {
  'Stock Purchase': 'inventory — costed through COGS when sold',
  'Customer Refund': 'returns money for a sale — the credit note already took it out of revenue',
  'Supplier Payment': 'settles a payable already costed',
  'Loan Repayment': 'settles borrowing — interest comes from the loan itself',
  'Equipment purchase': 'capital — reaches the accounts as depreciation',
  'Capital Withdrawal': 'the owner\'s money leaving — equity, not a cost of trading',
  'Owner Withdrawal': 'the owner\'s money leaving — equity, not a cost of trading',
  'Account Transfer': 'the shop\'s own money moving between its own tills',
};
const CASH_NOT_REVENUE = {
  'Loan Received': 'borrowing — a liability, not income',
  'Supplier Refund': 'money back on a bill — the supplier credit already cut its cost',
  'Owner Investment': 'equity — the owner\'s money, not earnings',
  'Debt Collection': 'settles a receivable — the sale was already booked',
  'Debt Payment': 'settles a receivable — the sale was already booked',
  'Asset Sale': 'investing returning — the gain or loss comes from the register',
  'Account Transfer': 'the shop\'s own money arriving from another of its tills',
  'Cash Overage': 'a counting correction — the short/over line carries it, not revenue',
};
const cashHas = (map, cat)=> Object.prototype.hasOwnProperty.call(map, String(cat==null?'':cat));
function cashIsMoneyOut(t){ return t.type==='payment' || t.type==='expense' || t.type==='out'; }
function cashIsMoneyIn(t){ return t.type==='receipt' || t.type==='in'; }
function cashIsOperatingExpense(t){
  return cashIsMoneyOut(t) && !cashHas(CASH_NOT_OPEX, t.category);
}
function cashIsTradingIncome(t){
  return cashIsMoneyIn(t) && !cashHas(CASH_NOT_REVENUE, t.category);
}
function cashIsDebtCollection(t){
  return cashIsMoneyIn(t) && (t.category === 'Debt Collection' || t.category === 'Debt Payment');
}
const CASH_OWNER_WITHDRAWAL = ['Capital Withdrawal', 'Owner Withdrawal'];
function cashIsOwnerWithdrawal(t){
  return cashIsMoneyOut(t) && CASH_OWNER_WITHDRAWAL.indexOf(String(t.category==null?'':t.category)) !== -1;
}
const CASH_SHORTAGE_CATEGORY = 'Cash Shortage';
const CASH_OVERAGE_CATEGORY = 'Cash Overage';
const CASH_VARIANCE_LINE = 'Cash short / over';
function cashIsCashShortage(t){
  return cashIsMoneyOut(t) && String(t.category==null?'':t.category) === CASH_SHORTAGE_CATEGORY;
}
function cashIsCashOverage(t){
  return cashIsMoneyIn(t) && String(t.category==null?'':t.category) === CASH_OVERAGE_CATEGORY;
}
function cashOpexRows(rows){
  const out = {};
  rows.filter(cashIsOperatingExpense).forEach(t=>{
    const k = cashIsCashShortage(t) ? CASH_VARIANCE_LINE : (t.category || 'Uncategorised');
    out[k] = (out[k]||0) + (Number(t.amount)||0);
  });
  rows.filter(cashIsCashOverage).forEach(t=>{
    out[CASH_VARIANCE_LINE] = (out[CASH_VARIANCE_LINE]||0) - (Number(t.amount)||0);
  });
  if(Math.abs(out[CASH_VARIANCE_LINE] || 0) < 0.5) delete out[CASH_VARIANCE_LINE];
  return out;
}
function dueCostBetween(d, fromISO, toISO){
  const amount = Number(d && d.amount) || 0;
  if(!amount) return 0;
  return amount * monthChargeFraction(String(d.period||''), fromISO, toISO);

function dueCostRows(fromISO, toISO){

    const kind = DUE_KINDS[d && d.kind];
    if(!kind) return;
    const cost = dueCostBetween(d, fromISO, toISO);

    out[kind.cashCategory] = (out[kind.cashCategory]||0) + cost;
  });
  return out;

  if (r === 'pick' && S.ui.repFrom && S.ui.repTo) return { from: S.ui.repFrom, to: S.ui.repTo, label: 'Pick' };

}

function repCashFlow(){

async function writeDayFull(date, change, task, what){
  const cur = await sb.from('cash_days').select('*').eq('shop_id', S.shopId).eq('date', date).maybeSingle();
  if (cur.error) throw cur.error;
  let rec;
  if (cur.data) rec = { opening: cur.data.opening || { cash: 0, momo: 0, bank: 0 }, actual: cur.data.actual || { cash: null, momo: null, bank: null }, openingSet: !!cur.data.opening_set, closedAt: cur.data.closed_at || null, closedBy: cur.data.closed_by || null };
  else { const d = dayRecord(date); rec = { opening: { ...d.opening }, actual: { cash: null, momo: null, bank: null }, openingSet: false, closedAt: null, closedBy: null }; }
  const before = JSON.parse(JSON.stringify(rec));
  change(rec);
  const row = cashDayRow(date, rec);
  const r = cur.data ? await sb.from('cash_days').update({ opening: row.opening, opening_set: row.opening_set, actual: row.actual, closed_at: row.closed_at, closed_by: row.closed_by }).eq('shop_id', S.shopId).eq('date', date)
    : await sb.from('cash_days').insert(row);
  if (r.error) throw r.error;
  D().cashDays[date] = { ...rec, onServer: true }; booksChanged();
  if (task) logDecision(task, what, { ref: { table: 'cash_days', id: date }, before, after: rec });
}

  return `<label class="bx-pick" style="height:54px;padding:0 14px;box-shadow:inset 0 0 0 1.5px ${a.photo ? 'var(--green)' : '#D9D4CB'};cursor:pointer"><span class="bx-av" style="width:34px;height:34px;border-radius:10px;background:${a.photo ? 'var(--greenSoft)' : 'var(--soft)'};color:${a.photo ? 'var(--green)' : 'var(--ink2)'}">${ic(a.photo ? 'tick' : 'cam', 18)}</span><span style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:14px;font-weight:700">${a.photo ? 'Photo kept' : esc(words[0])}</span><span class="bx-sub">${esc(a.photoBusy ? 'sending it…' : words[1])}</span></span><input type="file" accept="image/*" capture="environment" data-ch="photo" style="display:none"></label>`;
}
ACT['ch:photo'] = async t => {
  const f = t.files && t.files[0]; if (!f) return; const a = topArgs();
  a.photoBusy = true; render();
  try { const ext = /png/.test(f.type) ? 'png' : 'jpg', path = `${S.shopId}/${(crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2))}.${ext}`;
    const { error } = await sb.storage.from('bill-photos').upload(path, f, { contentType: f.type || 'image/jpeg' }); if (error) throw error; a.photo = path; FEEL.yes(); }
  catch (e) { toast(isNetworkError(e) ? 'No connection — the photo was not kept.' : 'The photo was not kept: ' + (e.message || e)); }
  a.photoBusy = false; render();
};

/* ---- an expense (cash.expense): index.html cbRecSave, money out ---- */
const EXP_CATS = [['fuel', 'Fuel', 'Fuel'], ['truck', 'Transport', 'Transport'], ['home', 'Rent', 'Rent'], ['bolt', 'Power', 'Utilities'], ['water', 'Water', 'Utilities'], ['phone', 'Airtime', 'Utilities'], ['hand', 'Casual', 'Other Expense'], ['plus', 'Other', 'Other Expense']];
function monthSpent(category){ const m = monthISO(); return D().cashTxns.filter(t => t.type !== 'receipt' && t.type !== 'in' && t.category === category && String(t.date).slice(0, 7) === m).reduce((s, t) => s + t.amount, 0); }
PAGE.expense = a => {
  a.acct = a.acct || 'cash'; a.cat = a.cat || 'Fuel';
  const c = EXP_CATS.find(x => x[1] === a.cat) || EXP_CATS[0], category = a.cat === 'Other' ? (a.otherCat || 'Other Expense') : c[2];
  const rent = a.cat === 'Rent', amt = a.amt || 0, others = (D().presets.expenseCategories || []).filter(x => !['Stock Purchase', 'Supplier Payment', 'Rent', 'Salaries & Wages', 'Cash Shortage', 'Fuel', 'Transport', 'Utilities', 'Agent Commission', 'Capital Withdrawal'].includes(x));
  return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card">
    ${amountHead('Money out', 'An expense', a, `
      <div role="radiogroup" aria-label="What it was for" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">${EXP_CATS.map(([icn, w]) => `<button class="tr-cat" role="radio" aria-checked="${a.cat === w}" data-act="pickcat" data-v="${w}" style="height:76px;border-radius:16px;gap:6px"><span class="bx-av" style="width:30px;height:30px;border-radius:9px;${a.cat === w ? 'background:transparent;color:#fff' : 'background:var(--amberSoft);color:var(--amberDeep)'}">${ic(icn, a.cat === w ? 22 : 17)}</span><span style="font-size:12px">${w}</span></button>`).join('')}</div>
      ${a.cat === 'Other' && others.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap">${['Other Expense'].concat(others).map(x => `<button class="bx-chip" data-act="othercat" data-v="${esc(x)}" style="border:none;height:32px;padding:0 12px;${(a.otherCat || 'Other Expense') === x ? 'background:var(--navy);color:#fff' : 'background:var(--soft);color:var(--ink)'}">${esc(x)}</button>`).join('')}</div>` : ''}
      ${rent ? `<button class="bx-pick" data-act="payroll" style="background:var(--amberFaint);box-shadow:inset 0 0 0 1px #F5D3AE">${ic('home', 18, 'style="color:var(--amberDeep)"')}<span style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:14px;font-weight:700;color:var(--amberDeep)">Rent is paid from Wages and rent</span><span class="bx-sub">so each month is paid once, against its agreement</span></span>${ic('chev', 14)}</button>` : `
      <label style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)"><span style="font-size:13px;font-weight:600;color:var(--ink3)">For</span><input data-in="note" data-k="note" aria-label="What it was for" value="${esc(a.note || '')}" placeholder="${esc(c[1] === 'Casual' ? 'Casual labour — who, for what' : 'Who it was paid to, what for')}" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:14px;font-weight:600;color:var(--ink)"></label>
      ${photoBtn(a, ['Photo of the receipt', 'kept with the line, for the owner’s log'])}`}`)}
    </div>
    ${rent ? '' : `<div class="bx-dock">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:13px;font-weight:600;color:#B3BCD2">Paid from</span><span style="font-size:12px;color:var(--navyInk2)">${esc(a.cat === 'Other' ? category : c[1])} this month <b class="m" style="color:#fff">${n0(monthSpent(category))}</b></span></div>
      ${acctPicker('pickacct', a.acct, -amt, { needs: true, label: 'Paid from' })}
      ${slideHTML('expense', amt ? 'Slide to record ' + n0(amt) : 'Type the amount', 'arrow', { amber: true, disabled: !(amt > 0) || afterAcct(a.acct, -amt) < 0 })}
      ${logLine(`Goes in the cash book as ${category} · the owner sees it in the log`)}</div>`}
  </div>`;
};
ACT.othercat = t => { topArgs().otherCat = t.dataset.v; FEEL.tick(); render(); };
ACT['slide:expense'] = async () => {
  const a = topArgs(); if (!needTask('cash.expense')) return render();
  const c = EXP_CATS.find(x => x[1] === a.cat) || EXP_CATS[0], category = a.cat === 'Other' ? (a.otherCat || 'Other Expense') : c[2];

  const what = [c[2] !== c[1] && a.cat !== 'Other' ? c[1] : '', (a.note || '').trim()].filter(Boolean).join(' — ') || category;
  try { S.busy = true;
    const id = await addCash({ account: a.acct, type: 'payment', category, amount: amt, description: what, photo: a.photo });
    booksChanged(); logDecision('cash.expense', `${category} ${n0(amt)} from ${ACCT_WORD[a.acct]} — ${what}`, { amount: amt, ref: { table: 'cash_txns', id } });
    FEEL.stamp(); toast(`${category} ${n0(amt)} is in the cash book`); pop(); }
  catch (e) { await afterFail(e); } finally { S.busy = false; }
};

/* ---- other money in (cash.income, loan.edit): a loan, the owner, other ---- */
PAGE.income = a => {
  a.acct = a.acct || 'bank'; a.kind = a.kind || 'loan';
  const amt = a.amt || 0, months = a.months || 12, rate = a.rate == null ? 20 : a.rate, fees = a.fees || 0;
  const tmp = { id: 0, lender: a.lender || '', principal: amt, ratePct: rate, method: 'reducing_balance', termMonths: months, startedOn: todayISO(), fees, roundTo: 1000, frequency: 'monthly', feePerInstallment: 0, repayments: [] };
  let monthly = 0, first = null; try { const sch = CB().loanSchedule(tmp); monthly = sch.length ? sch[0].payment : 0; first = sch.length ? sch[0].date : null; } catch (_e) {}
  const kinds = [['loan', 'loan', 'A loan'], ['owner', 'people', 'The owner'], ['other', 'plus', 'Other']];

      <div role="radiogroup" aria-label="Where it came from" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${kinds.map(([k, icn, w]) => `<button class="tr-cat" role="radio" aria-checked="${a.kind === k}" data-act="incomekind" data-v="${k}" style="height:76px;border-radius:16px;gap:6px"><span class="bx-av" style="width:30px;height:30px;border-radius:9px;${a.kind === k ? 'background:transparent;color:#fff' : 'background:var(--greenSoft);color:var(--green)'}">${ic(icn, a.kind === k ? 22 : 17)}</span><span style="font-size:12px">${w}</span></button>`).join('')}</div>
      ${a.kind === 'loan' ? `<div class="bx-card" style="padding:12px 14px;display:flex;flex-direction:column;gap:6px">
        <span style="display:flex;align-items:center;gap:10px"><span class="bx-av" style="width:38px;height:38px;background:var(--crimsonSoft);color:var(--crimson)">${ic('loan', 19)}</span><span style="flex:1;display:flex;flex-direction:column;gap:1px"><span class="bx-t">A loan is money we owe back</span><span class="bx-sub">it opens a loan to repay${canLoan ? '' : ' — needs “Loans”'}</span></span></span>
        <label class="tr-kv"><span>Lender</span><input data-in="note" data-k="lender" value="${esc(a.lender || '')}" placeholder="Bank, SACCO, a person"></label>
        <label class="tr-kv"><span>Interest a year</span><span style="display:inline-flex;align-items:center;gap:4px"><input data-ch="loanrate" inputmode="decimal" value="${rate}" style="width:48px"><b>%</b></span></label>
        <div class="tr-kv"><span>Repay</span><span style="display:inline-flex;align-items:center;gap:8px"><button class="tr-step" data-act="loanmonths" data-v="-1" aria-label="Fewer months">−</button><b class="m">${months}</b> months<button class="tr-step" data-act="loanmonths" data-v="1" aria-label="More months">+</button></span></div>
        <label class="tr-kv"><span>Fees they kept</span><input data-ch="loanfees" inputmode="numeric" value="${fees ? n0(fees) : ''}" placeholder="0" style="width:110px;font-family:var(--mono)"></label>
        <div class="tr-kv"><span>Each month</span><span class="m">${monthly ? n0(monthly) : '—'}</span></div>
        <div class="tr-kv"><span>First payment</span><span>${first ? esc(dShort(first)) : '—'}</span></div></div>`
      : `<label style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)"><span style="font-size:13px;font-weight:600;color:var(--ink3)">From</span><input data-in="note" data-k="note" value="${esc(a.note || '')}" placeholder="${a.kind === 'owner' ? 'The owner, for…' : 'Who paid it, what for'}" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:14px;font-weight:600;color:var(--ink)"></label>`}`)}
    </div>
    <div class="bx-dock">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#B3BCD2"><span>Came into</span>${a.kind === 'loan' && fees ? `<span>after fees <b class="m" style="color:#fff">${n0(net)}</b></span>` : ''}</div>
      ${acctPicker('pickacct', a.acct, net, { label: 'Came into' })}
      ${slideHTML('income', amt ? 'Slide to record ' + n0(amt) : 'Type the amount', 'in', { mint: true, disabled: !(amt > 0) || (a.kind === 'loan' && (!canLoan || !(a.lender || '').trim() || net <= 0)) })}
      ${logLine(a.kind === 'loan' ? 'Booked as Loan Received · opens the loan · in the owner’s log' : `Booked as ${a.kind === 'owner' ? 'Owner Investment' : 'Other Income'} · in the owner’s log`)}</div>
  </div>`;
};
ACT.incomekind = t => { topArgs().kind = t.dataset.v; FEEL.tick(); render(); };
ACT['ch:loanrate'] = t => { topArgs().rate = Math.max(0, Number(String(t.value).replace(/[^0-9.]/g, '')) || 0); render(); };
ACT['ch:loanfees'] = t => { topArgs().fees = parseMoney(t.value) || 0; render(); };
ACT.loanmonths = t => { const a = topArgs(); a.months = Math.max(1, Math.min(120, (a.months || 12) + Number(t.dataset.v))); FEEL.tick(); render(); };
ACT['slide:income'] = async () => {
  const a = topArgs(), amt = Math.round(a.amt || 0); if (!(amt > 0)) return;
  if (!needTask(a.kind === 'loan' ? 'loan.edit' : 'cash.income')) return render();
  try { S.busy = true;
    if (a.kind === 'loan') {
      // One write (0141 receive_loan): the cash line net of fees, the loan, the owner's log.
      const lender = (a.lender || '').trim(), fees = Math.round(a.fees || 0);
      const r = await sb.rpc('receive_loan', { p_shop_id: S.shopId, p_row: { lender, principal: amt, ratePct: a.rate == null ? 20 : a.rate, termMonths: a.months || 12, fees }, p_account: a.acct });
      if (r.error) throw r.error;
      const d = r.data || {}; (d.cashRows || []).forEach(row => { if (!txnById(row.id)) D().cashTxns.push(rowToTxn(row)); });
      if (d.loan) D().loans.push(rowToLoan(d.loan)); booksChanged();
      FEEL.kaching(); toast(`The loan from ${lender} is in, and open to repay`);
    } else {
      const category = a.kind === 'owner' ? 'Owner Investment' : 'Other Income';
      const id = await addCash({ account: a.acct, type: 'receipt', category, amount: amt, description: (a.note || '').trim() || category });
      booksChanged(); logDecision('cash.income', `${category} ${n0(amt)} into ${ACCT_WORD[a.acct]}`, { amount: amt, ref: { table: 'cash_txns', id } });
      FEEL.kaching(); toast(`${n0(amt)} is in the cash book`);
    }
    pop(); }
  catch (e) { await afterFail(e); } finally { S.busy = false; }
};

/* ---- move money (cash.transfer): index.html transferBetweenAccounts ---- */
const XFER_PRESETS = [['Banked the cash', 'cash', 'bank'], ['MoMo to bank', 'momo', 'bank'], ['Float', 'cash', 'momo']];
PAGE.transfer = a => {
  a.from = a.from || 'cash'; a.to = a.to || 'bank';
  const amt = a.amt || 0, hand = inHandNow(), tot = ACCOUNTS.reduce((s, x) => s + (hand[x.key] || 0), 0);
  const pot = (k, delta, role) => `<button data-act="xferpot" data-v="${role}" style="border:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 2px var(--navy),0 8px 18px rgba(22,32,60,.1);color:var(--ink)"><span class="bx-av" style="width:38px;height:38px;background:#EEF0F6;color:var(--navy)">${ic(ACCT_LOOK[k].icon, 19)}</span><span style="font-size:13px;font-weight:700">${ACCT_WORD[k]}</span><span class="m" style="font-size:11px;font-weight:600;color:var(--ink3)">${n0(hand[k] || 0)}</span><span class="m" style="font-size:15px;font-weight:600;${hand[k] + delta < 0 ? 'color:var(--crimson)' : ''}">${n0((hand[k] || 0) + delta)}</span></button>`;
  return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card">
    ${amountHead('Move money', `${ACCT_WORD[a.from]} to ${ACCT_WORD[a.to].toLowerCase().replace('mobile money', 'mobile money')}`, a, `
      <div role="img" aria-label="${n0(amt)} from ${ACCT_WORD[a.from]} to ${ACCT_WORD[a.to]}" style="display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);align-items:center">
        ${pot(a.from, -amt, 'from')}
        <button data-act="xferswap" aria-label="Swap the direction" style="border:none;background:transparent;height:40px;color:var(--navy)"><svg width="70" height="40" viewBox="0 0 70 40" aria-hidden="true"><path d="M4 20h56" stroke="#16203C" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path><path d="M52 12l10 8-10 8" fill="none" stroke="#16203C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        ${pot(a.to, amt, 'to')}
      </div>
      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">${XFER_PRESETS.map(([w, f, t2]) => `<button class="bx-chip" data-act="xferpreset" data-f="${f}" data-t="${t2}" data-w="${esc(w)}" style="border:none;height:32px;padding:0 12px;${a.from === f && a.to === t2 ? 'background:var(--navy);color:#fff' : 'background:var(--soft);color:var(--ink)'}">${w}</button>`).join('')}</div>
      ${photoBtn(a, ['Photo of the deposit slip', 'the bank’s stamp is the proof'])}`)}
    </div>
    <div class="bx-dock">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#B3BCD2"><span>Nothing comes in or goes out</span><span>in hand stays <b class="m" style="color:#fff">${n0(tot)}</b></span></div>
      ${slideHTML('transfer', amt ? 'Slide to move ' + n0(amt) : 'Type the amount', 'swap', { amber: true, disabled: !(amt > 0) || (hand[a.from] || 0) < amt })}
      ${logLine('Two lines in the cash book, one out and one in · the owner’s log')}</div>
  </div>`;
};
ACT.xferswap = () => { const a = topArgs(); [a.from, a.to] = [a.to, a.from]; FEEL.tick(); render(); };
ACT.xferpot = t => { const a = topArgs(), keys = ACCOUNTS.map(x => x.key), role = t.dataset.v, other = role === 'from' ? a.to : a.from; let i = keys.indexOf(a[role]); do { i = (i + 1) % 3; } while (keys[i] === other); a[role] = keys[i]; FEEL.tick(); render(); };
ACT.xferpreset = t => { const a = topArgs(); a.from = t.dataset.f; a.to = t.dataset.t; a.note = t.dataset.w; FEEL.tick(); render(); };
ACT['slide:transfer'] = async () => {
  const a = topArgs(), amt = Math.round(a.amt || 0); if (!(amt > 0) || a.from === a.to) return;
  if (!needTask('cash.transfer')) return render();
  try { S.busy = true;
    const outId = await issueRowId('row:cash_txn', cashMax()), inId = await issueRowId('row:cash_txn', Math.max(cashMax(), outId));
    const label = `${ACCT_WORD[a.from]} → ${ACCT_WORD[a.to]}`, desc = a.note ? `${label} — ${a.note}` : label, date = todayISO(), time = nowHM(), by = S.user ? String(S.user.id) : null;
    const rows = [{ id: outId, account: a.from, type: 'payment', transfer_id: inId }, { id: inId, account: a.to, type: 'receipt', transfer_id: outId, ...(a.photo ? { photo: a.photo } : {}) }]
      .map(r => ({ shop_id: S.shopId, date, category: ACCOUNT_TRANSFER, amount: amt, description: desc, time, quote_id: null, entered_by: by, ...r }));
    const r = await sb.from('cash_txns').insert(rows); if (r.error) throw r.error;
    rows.forEach(x => D().cashTxns.push(rowToTxn(x))); booksChanged();
    logDecision('cash.transfer', `Moved ${n0(amt)}: ${label}`, { amount: amt, ref: { table: 'cash_txns', id: outId } });
    FEEL.go(); toast(`${n0(amt)} moved: ${label}`); pop(); }
  catch (e) { await afterFail(e); } finally { S.busy = false; }
};

/* ==================================================================
   CORRECT A PAYMENT (payment.edit) — move it to the invoice it was
   for, or put its amount, account or day right. The cash line keeps
   its number; the invoices, the debt ledger and the debt follow it.
   ================================================================== */
function payLink(t){
  const tr = txnTrace(t);
  if (tr.inv.length) return { kind: 'inv', q: tr.inv[0].q, p: tr.inv[0].p, cust: tr.cust };
  return { kind: 'acct', line: tr.debt, cust: tr.cust };
}
PAGE.payedit = a => {
  const t = txnById(a.id); if (!t) return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card"><div class="bx-empty" style="padding-top:28vh"><b>That payment is not in the cash book any more</b><br><button class="bx-btn ghost" style="flex:none;margin:0 auto" data-act="back">Back</button></div></div>`;
  const L = payLink(t), c = L.cust;
  if (a.to === undefined) a.to = L.kind === 'inv' ? String(L.q.id) : null;
  if (a.amt == null) a.amt = t.amount; if (!a.acct) a.acct = acctOf(t); if (!a.date) a.date = t.date;
  const B = a.to ? D().savedQuotes.find(q => String(q.id) === String(a.to)) : null;
  const sameInv = L.kind === 'inv' && B && String(B.id) === String(L.q.id);
  const leftB = B ? balanceDue(B) + (sameInv ? Number(L.p.amount) || 0 : 0) : 0;
  const changed = { inv: (L.kind === 'inv' ? String(L.q.id) : null) !== (a.to || null), amt: Math.round(a.amt) !== Math.round(t.amount), acct: a.acct !== acctOf(t), date: a.date !== t.date };
  const any = changed.inv || changed.amt || changed.acct || changed.date;
  const tooBig = B && a.amt > leftB + 0.5, closed = (D().cashDays[t.date] || {}).closedAt || (D().cashDays[a.date] || {}).closedAt;
  const nowBox = L.kind === 'inv' ? `<span class="m" style="font-size:14px;font-weight:600">${invoiceLabel(L.q)}</span><span style="font-size:11px;font-weight:600;color:var(--ink3)">${n0(balanceDue(L.q) + (Number(L.p.amount) || 0))} → ${n0(balanceDue(L.q))}</span>` : `<span style="font-size:14px;font-weight:700;color:var(--amberInk)">Their debt only</span><span style="font-size:11px;font-weight:600;color:var(--ink3)">no invoice paid</span>`;
  const afterBox = B ? `<span class="m" style="font-size:14px;font-weight:600">${invoiceLabel(B)}</span><span style="font-size:11px;font-weight:600;color:var(--ink3)">${n0(leftB)} → ${n0(Math.max(0, leftB - a.amt))}</span>` : `<span style="font-size:14px;font-weight:700;color:var(--amberInk)">Their debt only</span><span style="font-size:11px;font-weight:600;color:var(--ink3)">on account</span>`;
  const row = (icon, title, sub, flag, act, extra) => `<${act ? `button data-act="${act}"` : 'div'} class="bx-row" ${extra || ''}><span class="bx-av" style="width:38px;height:38px;${flag ? 'background:#FDE8E4;color:var(--red)' : 'background:var(--soft);color:var(--ink2)'}">${ic(icon, 19)}</span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="bx-t">${title}</span><span class="bx-sub">${sub}</span></span>${flag ? '<span class="bx-chip" style="background:#FDE8E4;color:var(--red)">changed</span>' : ''}${act ? ic('chev', 14, 'style="color:#A9A398"') : ''}</${act ? 'button' : 'div'}>`;

ACT.payeditsave = async () => {
  const a = topArgs(), t = txnById(a.id); if (!t || !needTask('payment.edit')) return;
  const L = payLink(t), c = L.cust; if (!c) { toast('No customer on this payment — the owner corrects it'); return; }
  const a0 = Math.round(t.amount), a1 = Math.round(a.amt), toId = a.to || null;
  try { S.busy = true; render();
    const date = todayISO(); let logMax = D().customers.reduce((m, x) => (x.debtLog || []).reduce((mm, l) => Math.max(mm, Number(l.id) || 0), m), 0);
    const addLine = async (row) => { const id = await issueRowId('row:debt_log', logMax); logMax = Math.max(logMax, id); await insertRow('customer_debt_log', { id, shop_id: S.shopId, customer_id: c.id, date, ...row }, ['cash_txn_id', 'quote_id']); };
    const before = { cash: { amount: t.amount, account: t.account, date: t.date, quote_id: t.quoteId }, link: L.kind === 'inv' ? invoiceLabel(L.q) : 'on account' };
    // 1. Off the invoice it was on.
    if (L.kind === 'inv') {
      const { row, q } = await rereadQuote(L.q.id), payload = row.payload || {};
      const payments = (payload.payments || []).filter(p => String(p.cashTxnId) !== String(t.id));
      const paid = Math.max(0, (Number(row.amount_paid) || 0) - a0);
      q.amountPaid = paid; const desired = Math.max(0, quoteTotal(q) - paid);
      if (!(toId && String(toId) === String(L.q.id))) {
        const up = await sb.from('saved_quotes').update({ amount_paid: paid, payload: { ...payload, payments, debtCharged: desired } }).eq('shop_id', S.shopId).eq('id', L.q.id); if (up.error) throw up.error;
        await addLine({ type: 'charge', amount: a0, note: `Auto-sync — ${invoiceLabel(q)} (payment moved)`, quote_id: q.id, cash_txn_id: null });
      }
    }
    // 2. Onto the invoice it was for, or back on account.
    if (toId) {
      const { row, q } = await rereadQuote(toId), payload = row.payload || {};
      let payments = (payload.payments || []).filter(p => String(p.cashTxnId) !== String(t.id));
      const base = (Number(row.amount_paid) || 0) - (String(toId) === String(L.kind === 'inv' ? L.q.id : '') ? a0 : 0);
      const old = (payload.payments || []).find(p => String(p.cashTxnId) === String(t.id));
      payments = payments.concat([{ ...(old || {}), date: a.date, amount: a1, note: old ? old.note || '' : '', cashTxnId: t.id, method: a.acct, id: old && old.id ? old.id : payNextPaymentId(payments) }]);
      const paid = base + a1; q.amountPaid = paid;
      if (paid > quoteTotal(q) + 0.5) throw new Error(`that is more than is left on ${invoiceLabel(q)}.`);
      const up = await sb.from('saved_quotes').update({ amount_paid: paid, payload: { ...payload, payments, debtCharged: Math.max(0, quoteTotal(q) - paid), customerId: c.id } }).eq('shop_id', S.shopId).eq('id', toId); if (up.error) throw up.error;
      if (L.kind === 'acct' && L.line) {
        const ul = await sb.from('customer_debt_log').update({ quote_id: Number(toId), amount: a1, note: `Payment — ${invoiceLabel(q)}` }).eq('shop_id', S.shopId).eq('id', L.line.id); if (ul.error) throw ul.error;
      } else if (L.kind === 'inv' && String(toId) === String(L.q.id)) {
        if (a1 !== a0) await addLine({ type: a1 > a0 ? 'payment' : 'charge', amount: Math.abs(a1 - a0), note: `Auto-sync — ${invoiceLabel(q)} (payment corrected)`, quote_id: q.id, cash_txn_id: null });
      } else await addLine({ type: 'payment', amount: a1, note: `Auto-sync — ${invoiceLabel(q)}`, quote_id: q.id, cash_txn_id: null });
    } else if (L.kind === 'acct' && L.line) {
      const ul = await sb.from('customer_debt_log').update({ amount: a1 }).eq('shop_id', S.shopId).eq('id', L.line.id); if (ul.error) throw ul.error;
    } else await addLine({ type: 'payment', amount: a1, note: '', quote_id: null, cash_txn_id: t.id });
    // 3. The debt: lower by what the payment grew, higher by what it shrank.
    if (a1 !== a0) {
      const fresh = await sb.from('customers').select('debt').eq('shop_id', S.shopId).eq('id', c.id).maybeSingle(); if (fresh.error) throw fresh.error;
      const debt = Math.max(0, (Number(fresh.data && fresh.data.debt) || 0) - (a1 - a0));
      const cu = await sb.from('customers').update({ debt }).eq('shop_id', S.shopId).eq('id', c.id); if (cu.error) throw cu.error;
    }
    // 4. The cash line itself, the same number.
    const B = toId ? D().savedQuotes.find(q => String(q.id) === String(toId)) : null;
    const cu2 = await sb.from('cash_txns').update({ amount: a1, account: a.acct, date: a.date, quote_id: toId ? Number(toId) : null, description: B ? `Payment — ${invoiceLabel(B)}` : `Payment — ${c.name}` }).eq('shop_id', S.shopId).eq('id', t.id);
    if (cu2.error) throw cu2.error;
    logDecision('payment.edit', `Corrected ${poss(c.name)} ${n0(a0)}: ${before.link} → ${B ? invoiceLabel(B) : 'on account'}${a1 !== a0 ? `, ${n0(a0)} → ${n0(a1)}` : ''}${a.acct !== acctOf(t) ? `, ${acctOf(t)} → ${a.acct}` : ''}${a.date !== t.date ? `, ${t.date} → ${a.date}` : ''}`, { amount: a1, ref: { table: 'cash_txns', id: t.id }, before, after: { amount: a1, account: a.acct, date: a.date, quote_id: toId } });

    await loadAll(); FEEL.stamp(); toast('The payment is corrected'); S.stack = S.stack.filter(p => p.type !== 'payedit' && p.type !== 'find'); render();
  } catch (e) { await afterFail(e); } finally { S.busy = false; }
};
