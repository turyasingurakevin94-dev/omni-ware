  const amt = Math.round(a.amt || 0);
  const row = ({ l, pos, perf }) => { const pct = Math.round(perf.progressPct), on = x && l === x.l, left = CB().loanOutstanding(l), monthly = (CB().loanSchedule(l)[0] || {}).payment || 0;
    return `<button data-act="loanpick" data-v="${l.id}" style="width:100%;border:none;background:none;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid #F1EEE8;${on ? 'box-shadow:inset 3px 0 0 var(--navy);padding-left:10px' : ''}">
      <span style="display:flex;align-items:center;gap:10px"><span class="bx-av" style="width:38px;height:38px;background:var(--crimsonSoft);color:var(--crimson)">${ic('loan', 19)}</span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="bx-t ell">${esc(l.lender || 'A loan')}</span><span class="bx-sub">${l.ratePct ? `<span class="m">${l.ratePct}</span>% · ` : 'no interest · '}<span class="m">${n0(monthly)}</span> a ${esc((l.frequency || 'monthly').replace('ly', '').replace('fortnight', 'fortnight'))}</span></span><span style="display:flex;flex-direction:column;align-items:flex-end"><span class="m" style="font-size:15px;font-weight:600">${n0(left)}</span><span style="font-size:11px;font-weight:600;color:var(--ink3)">left of <span class="m">${n0(l.principal)}</span></span></span></span>
      <span role="img" aria-label="${pct}% repaid" style="height:8px;border-radius:999px;background:var(--crimsonSoft);overflow:hidden"><i class="a-grow" style="display:block;height:100%;width:${pct}%;background:var(--green)"></i></span>
      <span style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink3)"><span><span class="m" style="color:var(--green)">${pct}%</span> repaid${pos.overdue > 0 ? ` · <span style="color:var(--crimson)"><span class="m">${n0(pos.overdue)}</span> behind</span>` : ''}</span><span>next <b class="m" style="color:var(--ink)">${pos.next ? n0(pos.next.payment) + ' · ' + esc(dShort(pos.next.date).replace(/^\w+ /, '')) : 'any time'}</b></span></span></button>`; };
  return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card">
    <div class="bx-body" style="padding-top:8px"><span class="bx-grip" style="background:#D9D4CB"></span>
      ${sheetHead('Money we borrowed', 'Loans and assets')}
      ${loansAssetsTabs('loans')}
      ${loans.length ? `<div class="bx-card" style="padding:0 14px">${loans.map(row).join('')}</div>` : emptyCard('No loans', 'A loan received opens here, to repay')}
      <button class="bx-btn ghost" style="height:52px;font-size:14px" data-act="newloan">${ic('plus', 18)}A new loan received</button>
    </div>
    ${x ? `<div class="bx-dock">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:13px;font-weight:600;color:#B3BCD2">Repay ${esc(firstWord(x.l.lender))}${x.pos.next ? ' · ' + esc(dShort(x.pos.next.date).replace(/^\w+ /, '').replace(/ \d+$/, '')) : ''}</span><input data-ch="loanamt" inputmode="numeric" value="${n0(amt)}" aria-label="Amount to repay" style="width:140px;border:none;outline:none;background:transparent;text-align:right;color:#fff;font-family:var(--mono);font-size:20px;font-weight:600"></div>
      <div style="display:flex;gap:6px">${[['This instalment', nextAmt], ['All of it', Math.round(x.pos.payoff)]].filter(([, v]) => v > 0).map(([w, v]) => `<button class="bx-chip" data-act="loanq" data-v="${v}" style="border:none;height:30px;padding:0 12px;${amt === v ? 'background:#fff;color:var(--navy)' : 'background:rgba(255,255,255,.07);color:#DDE3F0'}">${w}</button>`).join('')}</div>
      ${acctPicker('pickacct', a.acct, -amt, { needs: true, label: 'Repay from' })}
      ${slideHTML('loanrepay', amt ? 'Slide to repay ' + n0(amt) : 'Type the amount', 'arrow', { amber: true, disabled: !(amt > 0) || afterAcct(a.acct, -amt) < 0 || !can('loan.edit') })}
      ${logLine('Lowers the loan and books the interest part · the owner’s log')}</div>` : ''}
  </div>`;
};
ACT.loanpick = t => { const a = topArgs(); a.lid = t.dataset.v; a.amt = null; FEEL.tick(); render(); };
ACT['ch:loanamt'] = t => { topArgs().amt = parseMoney(t.value) || 0; render(); };
ACT.loanq = t => { topArgs().amt = Number(t.dataset.v); FEEL.tick(); render(); };
ACT.newloan = () => { if (!needTask('loan.edit')) return; FEEL.open(); push('income', { kind: 'loan', acct: 'bank' }); };
ACT['slide:loanrepay'] = async () => {
  const a = topArgs(), l = (D().loans || []).find(x => String(x.id) === String(a.lid)), amt = Math.round(a.amt || 0); if (!l || !(amt > 0) || !needTask('loan.edit')) return render();
  try { S.busy = true;
    // One write (0141 repay_loan): the Loan Repayment line, the repayment on the loan, the owner's log.
    const r = await sb.rpc('repay_loan', { p_shop_id: S.shopId, p_loan_id: Number(l.id), p_amount: amt, p_account: a.acct });
    if (r.error) throw r.error;
    const d = r.data || {}; (d.cashRows || []).forEach(row => { if (!txnById(row.id)) D().cashTxns.push(rowToTxn(row)); });
    if (d.loan) Object.assign(l, rowToLoan(d.loan)); booksChanged();
    FEEL.stamp(); toast(`${n0(amt)} repaid to ${l.lender}`); a.amt = null; render(); }
  catch (e) { toast(failWord(e), 7000); } finally { S.busy = false; }
};

PAGE.assets = a => {
  const list = CB().liveFixedAssets().filter(x => !x.disposedOn).map(x => ({ x, nbv: Math.round(CB().assetNBVAt(x, todayISO())) }));
  const sel = list.find(y => String(y.x.id) === String(a.aid));
  a.how = a.how || 'sold'; a.acct = a.acct || 'cash';
  const proceeds = a.how === 'sold' ? Math.round(a.amt || 0) : 0, gain = sel ? proceeds - sel.nbv : 0;
  const yr = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }) : '';
  return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card">
    <div class="bx-body" style="padding-top:8px"><span class="bx-grip" style="background:#D9D4CB"></span>
      ${sheetHead('What the shop owns', 'Loans and assets')}
      ${loansAssetsTabs('assets')}
      ${list.length ? `<div class="bx-card bx-list">${list.map(({ x, nbv }) => `<div class="bx-row" style="align-items:flex-start;flex-direction:column;gap:6px;${sel && sel.x === x ? 'box-shadow:inset 3px 0 0 var(--navy);padding-left:10px' : ''}">
          <span style="display:flex;align-items:center;gap:10px;width:100%"><span class="bx-av" style="width:38px;height:38px;background:#E4E6FA;color:#3A3F9B">${ic(/vehicle|truck|car|van|motor/i.test(x.category + ' ' + x.name) ? 'truck' : /scale/i.test(x.name) ? 'scale' : /rack|shel/i.test(x.name) ? 'rack' : /comput|laptop|register|phone/i.test(x.name + ' ' + x.category) ? 'pc' : 'asset', 19)}</span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="bx-t ell">${esc(x.name)}</span><span class="bx-sub">bought ${esc(yr(x.acquiredOn))}</span></span><span style="display:flex;flex-direction:column;align-items:flex-end"><span class="m" style="font-size:15px;font-weight:600">${n0(nbv)}</span><span style="font-size:11px;font-weight:600;color:var(--ink3)">of <span class="m">${n0(x.cost)}</span> paid</span></span></span>
          <span role="img" aria-label="Worth ${n0(nbv)} of ${n0(x.cost)} paid" style="width:100%;height:6px;border-radius:999px;background:var(--soft);overflow:hidden"><i class="a-grow" style="display:block;height:100%;width:${x.cost ? (nbv / x.cost * 100).toFixed(0) : 0}%;background:#3A3F9B"></i></span>
          <span style="display:flex;width:100%;justify-content:flex-end"><button class="bx-chip" data-act="assetpick" data-v="${x.id}" style="border:none;height:28px;padding:0 12px;${sel && sel.x === x ? 'background:var(--navy);color:#fff' : 'background:var(--soft);color:var(--ink)'}">Sell or write off</button></span></div>`).join('')}</div>` : emptyCard('No assets on the books', 'A truck, a scale, racks — record one when it is bought')}
      <button class="bx-btn ghost" style="height:52px;font-size:14px" data-act="assetbuy">${ic('plus', 18)}Record an asset bought</button>
    </div>
    ${sel ? `<div class="bx-dock">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#B3BCD2"><span>${esc(sel.x.name)}</span><span>on the books at <b class="m" style="color:#fff">${n0(sel.nbv)}</b></span></div>
      <div style="display:flex;gap:6px">${[['sold', 'Sold'], ['gone', 'Thrown away'], ['stolen', 'Stolen']].map(([k, w]) => `<button class="bx-chip" data-act="assethow" data-v="${k}" style="border:none;height:32px;padding:0 12px;${a.how === k ? 'background:#fff;color:var(--navy)' : 'background:rgba(255,255,255,.07);color:#DDE3F0'}">${w}</button>`).join('')}</div>
      ${a.how === 'sold' ? `<label style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"><span style="font-size:13px;font-weight:600;color:#B3BCD2">Sold for</span><input data-ch="assetamt" inputmode="numeric" value="${proceeds ? n0(proceeds) : ''}" placeholder="0" style="width:150px;border:none;outline:none;background:transparent;text-align:right;color:#fff;font-family:var(--mono);font-size:22px;font-weight:600"></label>${acctPicker('pickacct', a.acct, proceeds, { label: 'Into' })}` : ''}
      <span style="font-size:12px;font-weight:600;color:${gain >= 0 ? 'var(--mint)' : 'var(--rose)'}">${a.how === 'sold' ? (gain >= 0 ? 'a gain of ' : 'a loss of ') + n0(Math.abs(gain)) + ' on the books' : 'a loss of ' + n0(sel.nbv) + ' on the books'}</span>
      ${slideHTML('assetsell', a.how === 'sold' ? 'Slide to record the sale' : 'Slide to write it off', 'arrow', { amber: true, disabled: (a.how === 'sold' && !(proceeds > 0)) || !can('asset.edit') })}</div>` : ''}
  </div>`;
};
ACT.assets = () => { FEEL.open(); push('assets', {}); };
ACT.assetpick = t => { const a = topArgs(); a.aid = a.aid === t.dataset.v ? null : t.dataset.v; a.amt = null; FEEL.tick(); render(); };
ACT.assethow = t => { topArgs().how = t.dataset.v; FEEL.tick(); render(); };
ACT['ch:assetamt'] = t => { topArgs().amt = parseMoney(t.value) || 0; render(); };
ACT['slide:assetsell'] = async () => {
  const a = topArgs(), x = (D().fixedAssets || []).find(y => String(y.id) === String(a.aid)); if (!x || !needTask('asset.edit')) return render();
  const proceeds = a.how === 'sold' ? Math.round(a.amt || 0) : 0, nbv = Math.round(CB().assetNBVAt(x, todayISO()));
  try { S.busy = true;
    // One write (0141 dispose_asset): the Asset Sale line when sold, the asset off the books, the owner's log.
    const r = await sb.rpc('dispose_asset', { p_shop_id: S.shopId, p_asset_id: Number(x.id), p_how: a.how || 'sold', p_proceeds: proceeds, p_account: a.acct, p_nbv: nbv });
    if (r.error) throw r.error;
    const d = r.data || {}; (d.cashRows || []).forEach(row => { if (!txnById(row.id)) D().cashTxns.push(rowToTxn(row)); });
    if (d.asset) Object.assign(x, rowToAsset(d.asset)); booksChanged();
    FEEL.stamp(); toast(a.how === 'sold' ? `${x.name} sold · ${proceeds - nbv >= 0 ? 'gain' : 'loss'} ${n0(Math.abs(proceeds - nbv))}` : `${x.name} is off the books`); a.aid = null; render(); }
  catch (e) { toast(failWord(e), 7000); } finally { S.busy = false; }
};

/* ---- an asset bought (asset.edit): index.html fa_save ---- */
const ASSET_CATS = [['truck', 'Vehicle'], ['gen', 'Machine'], ['rack', 'Racks'], ['pc', 'Computer']];
PAGE.assetbuy = a => {
  a.cat = a.cat || 'Machine'; a.years = a.years || 5; a.acct = a.acct || 'bank';
  const cost = Math.round(a.amt || 0), per = a.years ? Math.round(cost / a.years) : 0;
  const pts = Array.from({ length: a.years + 1 }, (_, i) => `${(20 + i * (300 / a.years)).toFixed(0)},${(14 + i * (80 / a.years)).toFixed(0)}`).join(' ');
  return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card">
    <div class="bx-body" style="padding-top:8px"><span class="bx-grip" style="background:#D9D4CB"></span>
      ${sheetHead('Assets', 'An asset bought', { icon: ic('asset', 20), tint: '#E4E6FA', ink: '#3A3F9B' })}
      ${moneyInput('f_amt', 'amt', cost, { label: 'What it cost' })}
      <div role="radiogroup" aria-label="What it is" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">${ASSET_CATS.map(([icn, w]) => `<button class="tr-cat" role="radio" aria-checked="${a.cat === w}" data-act="pickcat" data-v="${w}">${ic(icn, 18)}<span>${w}</span></button>`).join('')}</div>
      <div class="bx-card" style="padding:2px 14px">
        <label class="tr-kv"><span>Name</span><input data-in="note" data-k="name" value="${esc(a.name || '')}" placeholder="Generator · 5 kVA" style="width:190px"></label>
        <label class="tr-kv"><span>From</span><input data-in="note" data-k="from" value="${esc(a.from || '')}" placeholder="who sold it" style="width:190px"></label>
        <div class="tr-kv"><span>Bought</span><span>${esc(dShort(todayISO()))}</span></div>
        <div class="tr-kv"><span>Lasts about</span><span style="display:inline-flex;align-items:center;gap:8px"><button class="tr-step" data-act="assetyears" data-v="-1" aria-label="Less">−</button><b class="m">${a.years}</b> year${a.years === 1 ? '' : 's'}<button class="tr-step" data-act="assetyears" data-v="1" aria-label="More">+</button></span></div>
      </div>
      <div class="bx-card" style="padding:12px 14px;display:flex;align-items:center;gap:12px">
        <svg role="img" aria-label="Worth ${n0(cost)} now, 0 after ${a.years} years, losing ${n0(per)} a year" width="150" height="104" viewBox="0 0 340 104" preserveAspectRatio="none" style="flex:none"><polygon points="${pts} 320,94 20,94" fill="#E4E6FA"/><polyline points="${pts}" fill="none" stroke="#3A3F9B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="14" r="7" fill="#3A3F9B"/></svg>
        <span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-size:12px;font-weight:600;color:var(--ink3)">loses each year</span><span class="m" style="font-size:18px;font-weight:600">${n0(per)}</span><span style="font-size:11px;font-weight:600;color:var(--ink3)">worth <span class="m">0</span> in ${esc(new Date(Date.now() + a.years * 365.25 * 864e5).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }))}</span></span>
      </div>
      ${photoBtn(a, ['Photo of the receipt', 'kept with the asset'])}
    </div>
    <div class="bx-dock">
      <span style="font-size:12px;font-weight:700;color:#B3BCD2">Paid from</span>
      ${acctPicker('pickacct', a.acct, -cost, { needs: true, label: 'Paid from' })}
      ${slideHTML('assetbuy', cost ? 'Slide to record ' + n0(cost) : 'Type what it cost', 'arrow', { amber: true, disabled: !(cost > 0) || !(a.name || '').trim() || afterAcct(a.acct, -cost) < 0 || !can('asset.edit') })}
      ${logLine(`Joins the assets at ${n0(cost)} · the owner’s log`)}</div>
  </div>`;
};
ACT.assetbuy = () => { if (!needTask('asset.edit')) return; FEEL.open(); push('assetbuy', {}); };
ACT.assetyears = t => { const a = topArgs(); a.years = Math.max(1, Math.min(30, (a.years || 5) + Number(t.dataset.v))); FEEL.tick(); render(); };
ACT['slide:assetbuy'] = async () => {
  const a = topArgs(), cost = Math.round(a.amt || 0), name = (a.name || '').trim(); if (!(cost > 0) || !name || !needTask('asset.edit')) return render();
  try { S.busy = true;
    // One write (0141 buy_asset): the Equipment purchase line (with the receipt's photo), the asset, the owner's log.
    const r = await sb.rpc('buy_asset', { p_shop_id: S.shopId, p_row: { name, category: a.cat, cost, years: a.years || 5, from: a.from || '' }, p_account: a.acct, p_photo: a.photo || null });
    if (r.error) throw r.error;
    const d = r.data || {}; (d.cashRows || []).forEach(row => { if (!txnById(row.id)) D().cashTxns.push(rowToTxn(row)); });
    if (d.asset) D().fixedAssets.push(rowToAsset(d.asset)); booksChanged();
    FEEL.stamp(); toast(`${name} is on the books at ${n0(cost)}`); pop(); }
  catch (e) { toast(failWord(e), 7000); } finally { S.busy = false; }
};

/* ---- Today's strip: where the money stands, one tap to all of it ---- */
// What "We owe" is made of, so it reads against Bills' own "we owe": the
// supplier bills (the same open bills), then what else the books owe.
function weOweParts(p){
  const cons = CB().consignmentOwedTotal();
  return [['bills', p.suppliers - cons], ['consignors', cons], ['loans', p.loans]].filter(r => r[1] > 0.5);
}
function moneyStrip(){
  let p, parts; try { p = moneyPosition(); parts = weOweParts(p); } catch (e) { console.warn(e); return ''; }
  const extra = parts.some(r => r[0] !== 'bills');
  return `<button data-act="position" aria-label="Money position: in hand ${shortM(p.inHand)}, owed to us ${shortM(p.owedUs)}, we owe ${shortM(p.owe)}${extra ? ': ' + parts.map(r => r[0] + ' ' + shortM(r[1])).join(', ') : ''}" class="bx-card" style="border:none;width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;color:var(--ink);text-align:left">
    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
      <span style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink2)"><span>In hand <b class="m" style="color:var(--ink)">${shortM(p.inHand)}</b></span><span>Owed to us <b class="m" style="color:var(--green)">${shortM(p.owedUs)}</b></span><span>We owe <b class="m" style="color:var(--crimson)">${shortM(p.owe)}</b></span></span>
      <span style="display:flex;height:8px;gap:2px;border-radius:999px;overflow:hidden"><i class="a-grow" style="flex:${Math.max(0, p.inHand)};background:var(--navy)"></i><i class="a-grow" style="flex:${p.owedUs};background:var(--mint)"></i><i class="a-grow" style="flex:${p.owe};background:#E5483D;opacity:.85"></i></span>
      ${extra ? `<span style="font-size:11px;font-weight:600;color:var(--ink3);text-align:right">we owe = ${parts.map(r => `${r[0]} <b class="m" style="color:var(--ink2)">${shortM(r[1])}</b>`).join(' + ')}</span>` : ''}</span>
    <span style="display:flex;flex-direction:column;align-items:flex-end;flex:none"><span style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ink3)">NET</span><span class="m" style="font-size:15px;font-weight:600;color:${p.net >= 0 ? 'var(--green)' : 'var(--crimson)'}">${p.net >= 0 ? '+' : '−'}${shortM(Math.abs(p.net))}</span></span>
    ${ic('chev', 14, 'style="color:#A9A398"')}</button>`;
}

// A refresh as soon as there is signal again.
window.addEventListener('online', () => { if (S.started && quiet()) loadAll().then(() => { if (quiet()) render(); }).catch(() => {}); });

boot();
</script>
</body>
</html>
