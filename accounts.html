<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16203C">
<title>Omni-Ware Accounts</title>
<!-- The phone app's native layer (apps/accounts). Inert in a browser. It
     lives here rather than in the app's own files so a fix to it reaches
     installed phones the same way any change to this page does. -->
<script>
/* The accounts page inside the Android app (apps/accounts).

   First in <head>, and only does anything inside the app. Four jobs:

   1. Back (Android) closes what is on top -- a photo, a sheet, then the tab
      -- before it ever leaves the app, and leaving only puts it in the
      background so it reopens instantly.
   2. The status bar: the page draws to the top edge, so a strip behind the
      clock takes the colour of whatever is under it, and its icons stay
      readable against it.
   3. The bars' size: Capacitor measures them into --safe-area-inset-*,
      but a page it has not measured (some phones, after a reload) would
      read zero and slide under the clock -- so the last good measurement
      stands in until it does.
   4. Staying current without a store release: the installed app checks the
      live accounts.html now and then, keeps a copy of a new one on the phone,
      and switches to it the next time the app goes to the background --
      never in the middle of a count. */
(function(){
  'use strict';
  var C = window.Capacitor;
  if(!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return;
  var P = C.Plugins || {};
  var App = P.App, Bars = P.SystemBars, WebView = P.WebView, Http = P.CapacitorHttp, FS = P.Filesystem;
  var NAVY = '#16203C';
  var root = document.documentElement;
  // The first installs carried this layer as their own native.js. On those
  // it is already running from above, and only the bars' size (3) is new.
  var legacy = !!document.querySelector('script[src="native.js"]');

  window.owHaptic = function(kind){
    var H = P.Haptics;
    if(!H) return;
    (kind === 'success' ? H.notification({ type: 'SUCCESS' }) : kind === 'warn' ? H.notification({ type: 'WARNING' }) : H.impact({ style: 'LIGHT' })).catch(function(){});
  };

  /* ---- 1. back ---- */
  // The page keeps its own stack of what is open (window.bxBack): a sheet,
  // then a screen pushed over a tab, then the tab itself back to Today.
  function back(){
    if(typeof window.bxBack === 'function' && window.bxBack()) return;
    if(App) App.minimizeApp();
  }
  if(App && !legacy) App.addListener('backButton', back);

  /* ---- 2. the strip behind the status bar ---- */
  var strip = null, lastStyle = '';
  function paintBar(){
    if(!strip) return;
    var top = strip.offsetHeight;
    // Today's navy hero is marked data-navy-top. A pushed page opens on its
    // own dark ground -- the tap-to-go-back strip -- unless it is a page
    // whose navy hero has scrolled away under the clock.
    var page = document.querySelector('#bx_pages .bx-page:last-child');
    var navy = (page || document).querySelector('[data-navy-top]:not([hidden])');
    var navyAtTop = !!navy && navy.getBoundingClientRect().top <= top && navy.getBoundingClientRect().bottom > top;
    var ground = page ? getComputedStyle(page).backgroundColor : '';
    var rgb = (ground.match(/\d+/g) || []).map(Number);
    var darkGround = !navyAtTop && !navy && rgb.length >= 3 && (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000 < 90;
    var auth = !!document.querySelector('.bx-auth');
    strip.style.background = auth || navyAtTop ? NAVY : darkGround ? ground : 'var(--bg)';
    var style = auth || navyAtTop || darkGround || document.querySelector('.bx-scrim') ? 'DARK' : 'LIGHT';
    if(style !== lastStyle && Bars){ lastStyle = style; Bars.setStyle({ style: style }).catch(function(){}); }
  }
  var queued = false;
  function soon(){ if(queued) return; queued = true; requestAnimationFrame(function(){ queued = false; paintBar(); }); }
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(insets, 800);
    setTimeout(insets, 2500);
    window.addEventListener('resize', function(){ setTimeout(insets, 300); });
    if(App) App.addListener('resume', function(){ setTimeout(insets, 300); });
    if(legacy) return;
    strip = document.createElement('div');
    strip.setAttribute('aria-hidden', 'true');
    strip.style.cssText = 'position:fixed;top:0;left:0;right:0;height:var(--safe-t, 0px);z-index:59;pointer-events:none;background:' + NAVY + ';';
    document.body.appendChild(strip);
    new MutationObserver(soon).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class'] });
    document.addEventListener('scroll', soon, { passive: true, capture: true });
    paintBar();
  });


  /* ---- 3. the bars' size ---- */
  var INSETS = 'ow-app-insets';
  function insets(){
    if(typeof C.getPlatform === 'function' && C.getPlatform() !== 'android') return;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:var(--safe-t, 0px);padding-bottom:var(--safe-b, 0px);';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe), top = parseFloat(cs.paddingTop) || 0, bottom = parseFloat(cs.paddingBottom) || 0;
    probe.remove();
    var measured = root.style.getPropertyValue('--safe-area-inset-top') !== '';
    var last = {};
    try{ last = JSON.parse(localStorage.getItem(INSETS)) || {}; }catch(_e){}
    if(measured && top > 0){
      if(last.top !== top || last.bottom !== bottom){ try{ localStorage.setItem(INSETS, JSON.stringify({ top: top, bottom: bottom, ours: false })); }catch(_e){} }
      return;
    }
    // Measured at zero: Android has laid the page out below its bars itself.
    if(measured || top > 0) return;
    // Not measured, and the page fills the whole screen -- it is under the
    // bars with nothing telling it how tall they are.
    if(!last.top && Math.abs(screen.height - window.innerHeight) > 16) return;
    root.style.setProperty('--safe-area-inset-top', (last.top || 32) + 'px');
    root.style.setProperty('--safe-area-inset-bottom', (last.bottom || 32) + 'px');
  }

  /* ---- 4. staying current ---- */
  if(legacy || !(WebView && Http && FS && App && window.crypto && crypto.subtle)) return;
  var SOURCE = 'https://omni-ware.vercel.app/accounts.html';
  var KEY = 'ow-accounts-bundle';
  var EVERY = 30 * 60 * 1000;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(_e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_e){} }
  function header(h, name){
    var k = Object.keys(h || {}).filter(function(x){ return x.toLowerCase() === name; })[0];
    return k ? h[k] : '';
  }
  function sha256(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  // A file of the bundle running now, as base64 for the Filesystem plugin.
  function fileB64(name){
    return fetch(name, { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error(name + ': ' + r.status);
      return r.blob();
    }).then(function(blob){
      return new Promise(function(ok, fail){
        var fr = new FileReader();
        fr.onload = function(){ ok(String(fr.result).split(',')[1] || ''); };
        fr.onerror = fail;
        fr.readAsDataURL(blob);
      });
    });
  }
  function current(){ return fetch('bundle.json', { cache: 'no-store' }).then(function(r){ return r.json(); }); }

  // After a switch: make the new copy the one the app opens with, and drop
  // the copies nothing points at any more.
  function settle(){
    var s = load();
    if(!s.staged) return Promise.resolve();
    return WebView.getServerBasePath().then(function(cur){
      if(!cur || cur.path !== s.staged.path) return;
      return WebView.persistServerBasePath().then(function(){
        var keep = s.staged.dir;
        s.etag = s.staged.etag;
        delete s.staged;
        save(s);
        return FS.readdir({ path: 'live', directory: 'DATA' }).then(function(r){
          return Promise.all((r.files || []).map(function(f){
            var n = typeof f === 'string' ? f : f.name;
            return n === keep.split('/').pop() ? null : FS.rmdir({ path: 'live/' + n, directory: 'DATA', recursive: true }).catch(function(){});
          }));
        }).catch(function(){});
      });
    });
  }

  function check(){
    var s = load();
    if(s.staged || Date.now() - (s.checked || 0) < EVERY) return Promise.resolve();
    s.checked = Date.now();
    save(s);
    return Promise.all([current(), Http.request({ url: SOURCE, method: 'GET', responseType: 'text',
      headers: s.etag ? { 'If-None-Match': s.etag } : {} })]).then(function(pair){
      var mine = pair[0], res = pair[1];
      if(res.status !== 200) return;
      var html = typeof res.data === 'string' ? res.data : '';
      // Half a page is worse than an old page.
      if(html.length < 100000 || html.indexOf('</html>') === -1) return;
      var etag = header(res.headers, 'etag');
      return sha256(html).then(function(hash){
        if(hash === mine.source){ s.etag = etag; save(s); return; }
        var dir = 'live/' + hash.slice(0, 16);
        var rest = (mine.files || []).filter(function(f){ return f !== 'index.html' && f !== 'bundle.json'; });
        return FS.writeFile({ path: dir + '/index.html', data: window.owAppTransform(html), directory: 'DATA', encoding: 'utf8', recursive: true })
          .then(function(){
            return rest.reduce(function(p, f){
              return p.then(function(){ return fileB64(f); })
                .then(function(b64){ return FS.writeFile({ path: dir + '/' + f, data: b64, directory: 'DATA', recursive: true }); });
            }, Promise.resolve());
          })
          .then(function(){
            return FS.writeFile({ path: dir + '/bundle.json', data: JSON.stringify({ source: hash, files: mine.files }), directory: 'DATA', encoding: 'utf8', recursive: true });
          })
          .then(function(){ return FS.getUri({ path: dir, directory: 'DATA' }); })
          .then(function(u){
            var s2 = load();
            s2.staged = { dir: dir, path: decodeURI(String(u.uri).replace(/^file:\/\//, '')), etag: etag };
            save(s2);
          });
      });
    }).catch(function(){
      // No signal, or the server is down: the copy already here carries on.
    });
  }

  App.addListener('pause', function(){
    var s = load();
    if(s.staged) WebView.setServerBasePath({ path: s.staged.path }).catch(function(){});
  });
  App.addListener('resume', function(){ check(); });
  settle().catch(function(){}).then(function(){ setTimeout(check, 5000); });
})();
</script>
<link rel="manifest" href="/manifest-accounts.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F7F5F2; --paper:#FFFFFF; --navy:#16203C; --navy2:#243052; --ink:#1C2233; --ink2:#5F6980; --ink3:#767F91; --ink4:#8A93A3;
  --line:#ECE8E1; --rule:#E6E3DD; --soft:#F4F2EE; --soft2:#EFECE6; --dash:#E2DED6;
  --red:#C93A30; --mint:#6FDCB0; --amber:#F5B26B; --amberInk:#95530C; --amberSoft:#FDEEE1; --amberDeep:#7A4A02;
  --green:#0F6B43; --greenSoft:#E4F4EA; --crimson:#8E2A22; --crimsonSoft:#FBE5E2; --rose:#F59A92;
  --indigo:#3A3F9B; --indigoSoft:#E4E6FA; --lilac:#9BA3F0;
  --navyInk:#B3BCD2; --navyInk2:#8D99B5;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --safe-area-inset-top:env(safe-area-inset-top,0px); --safe-area-inset-bottom:env(safe-area-inset-bottom,0px);
  /* The native layer's names for the same two bars (its strip and its probe). */
  --safe-t:var(--safe-area-inset-top); --safe-b:var(--safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
html.big #bx_app,html.big .bx-page,html.big .bx-sheet{zoom:1.12}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font-family:inherit;color:var(--ink)}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- shell ---- */
#bx_app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(100px + var(--safe-area-inset-bottom))}
.bx-view{animation:bxFade .25s ease-out}
@keyframes bxFade{from{opacity:.4}to{opacity:1}}
.bx-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;box-shadow:0 -1px 0 var(--line),0 -10px 24px rgba(22,32,60,.05);padding:10px 0 calc(12px + var(--safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:start;max-width:520px;margin:0 auto}
.bx-nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink3);font-size:11px;font-weight:600;padding:0;position:relative}
.bx-nav button[aria-current="page"]{color:var(--navy);font-weight:700}
.bx-nav button[aria-current="page"] .icon{fill:var(--navy)}
.bx-nav button[aria-current="page"] .icon .hole{stroke:#fff;fill:none}
.bx-nav .bx-go{justify-self:center;margin-top:-30px;width:64px;height:64px;border-radius:999px;background:var(--red);color:#fff;box-shadow:0 0 0 5px var(--bg),0 10px 24px rgba(201,58,48,.35);justify-content:center}
.bx-nav .bx-go .icon{width:30px;height:30px;stroke-width:2;fill:none!important}
.bx-badge{position:absolute;top:-4px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.bx-badge.amber{background:var(--amber);color:var(--navy)}

/* ---- navy hero ---- */
.bx-hero{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;border-radius:0 0 28px 28px;padding:calc(16px + var(--safe-area-inset-top)) 16px 16px;display:flex;flex-direction:column;gap:14px}
.bx-sheethead{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;padding:calc(10px + var(--safe-area-inset-top)) 18px 16px;display:flex;flex-direction:column;gap:12px}
.bx-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navyInk2)}
.bx-glass{border-radius:18px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bx-circle{width:40px;height:40px;border-radius:999px;border:none;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.bx-circle.light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.bx-body{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.bx-grip{align-self:center;width:40px;height:5px;border-radius:999px;background:rgba(255,255,255,.22);flex:none}

/* ---- cards / rows ---- */
.bx-card{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(22,32,60,.05),inset 0 0 0 1px var(--line)}
.bx-list{padding:0 12px}
.bx-row{display:flex;align-items:center;gap:10px;min-height:60px;border:none;background:none;width:100%;text-align:left;padding:8px 0;color:var(--ink)}
.bx-row + .bx-row{border-top:1px solid #F1EEE8}
.bx-av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.bx-av.round{border-radius:999px}
.bx-t{font-size:14px;font-weight:700}
.bx-sub{font-size:12px;color:var(--ink3)}
.bx-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.bx-sec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.bx-sec b{font-size:15px;font-weight:700}
.bx-sec span{font-size:12px;font-weight:600;color:var(--ink3)}
.bx-empty{padding:28px 16px;text-align:center;color:var(--ink3);font-size:14px}
.bx-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.bx-dot{width:7px;height:7px;border-radius:999px;display:inline-block;flex:none}

/* ---- buttons ---- */
.bx-btn{height:56px;border-radius:18px;border:none;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;flex:1}
.bx-btn.red{background:var(--red);color:#fff;box-shadow:0 10px 22px rgba(201,58,48,.3)}
.bx-btn.navy{background:var(--navy);color:#fff}
.bx-btn.ghost{background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.bx-btn.green{background:var(--green);color:#fff;box-shadow:0 10px 22px rgba(15,107,67,.3)}
.bx-btn.glass{background:rgba(255,255,255,.08);color:#fff}
.bx-btn[disabled],.bx-btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.bx-sq{width:56px;height:56px;flex:none;border-radius:18px;border:none;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;font-weight:700}
.bx-foot{margin-top:auto;position:sticky;bottom:0;z-index:5;padding:14px 16px calc(18px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:inherit}
.bx-foot:before{content:'';position:absolute;left:0;right:0;top:-20px;height:20px;background:linear-gradient(180deg,rgba(247,245,242,0),var(--bg));pointer-events:none}
.bx-dock{position:sticky;bottom:0;z-index:5}
/* the fade above a pinned footer must never sit on the last thing above it */
.bx-page :has(+ .bx-foot){margin-bottom:20px}
.bx-foot .row{display:flex;gap:8px}
.bx-hint{display:flex;align-items:center;gap:6px;padding-left:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.bx-seg{position:relative;display:grid;padding:4px;border-radius:20px;background:#EAE6DF;box-shadow:inset 0 1px 2px rgba(22,32,60,.08)}
.bx-seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(22,32,60,.08),0 6px 14px rgba(22,32,60,.12),inset 0 0 0 1.5px var(--navy);transition:transform .35s cubic-bezier(.3,1.25,.5,1)}
.bx-seg button{position:relative;z-index:1;border:none;background:transparent;border-radius:16px;padding:0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink2);transition:color .2s}
.bx-seg button[aria-checked="true"],.bx-seg button[aria-selected="true"]{color:var(--navy)}
.bx-seg.dark{background:rgba(255,255,255,.07);box-shadow:none;border-radius:16px}
.bx-seg.dark .thumb{border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.bx-seg.dark button{color:#DDE3F0;border-radius:12px}
.bx-seg.dark button[aria-selected="true"]{color:var(--navy)}
.bx-pick{width:100%;border:none;background:#fff;color:var(--ink);display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.bx-pick[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--navy),0 8px 18px rgba(22,32,60,.1)}
.bx-pick.drop[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--crimson)}

/* ---- paper slip ---- */
.bx-slip{filter:drop-shadow(0 1px 1px rgba(22,32,60,.08)) drop-shadow(0 4px 10px rgba(22,32,60,.07));margin:0 2px}
.bx-slip:before,.bx-slip:after{content:'';display:block;height:7px}
.bx-slip:before{background:linear-gradient(45deg,transparent 50%,#fff 50%) 0 0/12px 7px repeat-x,linear-gradient(-45deg,transparent 50%,#fff 50%) 0 0/12px 7px repeat-x}
.bx-slip:after{background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/12px 7px repeat-x,linear-gradient(-135deg,#fff 50%,transparent 50%) 0 0/12px 7px repeat-x}
.bx-slip-in{position:relative;background:#fff;padding:2px 14px 5px;display:flex;flex-direction:column}
.bx-slip.dark{filter:drop-shadow(0 6px 14px rgba(0,0,0,.28))}
.bx-sl{display:grid;grid-template-columns:30px auto minmax(0,1fr);align-items:center;gap:8px;padding:6px 0}
.bx-sl + .bx-sl{border-top:1px dashed var(--dash)}
.bx-slip-in > .bx-sl:first-child .n{padding-right:92px}
.bx-sl .q{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.bx-sl .q small{font-family:Figtree,sans-serif;font-size:11px;font-weight:600;color:#6B7480;letter-spacing:0}
.bx-sl .n{min-width:0;font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.bx-sl .n .v{display:inline-block;margin-top:2px;padding:0 6px;border-radius:6px;background:var(--soft2);font-size:11px;font-weight:600;color:var(--ink2)}
.bx-sl .meta{grid-column:1 / -1;display:flex;align-items:center;gap:8px;padding-top:4px}
.bx-sl.struck .n{color:#8A93A3;text-decoration:line-through}
.bx-tile{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.bx-stamp{position:absolute;right:12px;top:-2px;transform:rotate(-8deg);padding:3px 8px 2px;border:2.5px double currentColor;border-radius:7px;mix-blend-mode:multiply;font-size:12px;font-weight:700;letter-spacing:.14em;animation:bxStamp .4s cubic-bezier(.3,1.4,.5,1) both;display:flex;flex-direction:column;align-items:center;line-height:1.1;pointer-events:none}
.bx-stamp small{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:0}
@keyframes bxStamp{0%{transform:rotate(-8deg) scale(1.7);opacity:0}60%{transform:rotate(-8deg) scale(.94);opacity:.95}100%{transform:rotate(-8deg) scale(1);opacity:.9}}

/* ---- the two-way answer slider ---- */
.bx-tri{position:relative;height:44px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px rgba(22,32,60,.08);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.bx-tri .fl,.bx-tri .fr{position:absolute;top:0;bottom:0;width:0}
.bx-tri .fl{right:50%;background:linear-gradient(270deg,rgba(142,42,34,.08),rgba(142,42,34,.28))}
.bx-tri .fr{left:50%;background:linear-gradient(90deg,rgba(15,107,67,.08),rgba(15,107,67,.28))}
.bx-tri .ll,.bx-tri .lr{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:13px;font-weight:700;pointer-events:none}
.bx-tri .ll{left:14px;color:var(--crimson)}
.bx-tri .lr{right:14px;color:var(--green)}
.bx-tri .ll,.bx-tri .lr{transition:left .3s,right .3s}
.bx-tri[data-pos="yes"] .lr{right:62px}
.bx-tri[data-pos="no"] .ll{left:62px}
.bx-tri .k{position:absolute;left:50%;top:2px;width:48px;height:40px;margin-left:-24px;border:none;border-radius:999px;padding:0;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(22,32,60,.22),inset 0 1px 0 rgba(255,255,255,.2)}
.bx-tri.settle .k{transition:transform .3s cubic-bezier(.3,1.3,.5,1),background .2s}
.bx-tri.settle .fl,.bx-tri.settle .fr{transition:width .3s cubic-bezier(.3,1.3,.5,1)}
.chevR{display:inline-block;margin-left:4px;letter-spacing:-.2em;animation:bxNudgeR 1.4s ease-in-out infinite}
.chevL{display:inline-block;margin-right:4px;letter-spacing:-.2em;animation:bxNudgeL 1.4s ease-in-out infinite}
@keyframes bxNudgeR{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(3px)}}
@keyframes bxNudgeL{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(-3px)}}

/* ---- slide to start / hand in ---- */
.bx-slide{position:relative;flex:1;height:56px;border-radius:999px;background:radial-gradient(120% 140% at 10% 50%,#26335E 0%,#16203C 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 10px 22px rgba(22,32,60,.22);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.bx-slide .road{position:absolute;left:60px;right:18px;top:27px;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 8px,transparent 8px 16px);animation:bxRoad .6s linear infinite}
.bx-slide .fill{position:absolute;left:0;top:0;bottom:0;width:56px;border-radius:999px;background:linear-gradient(90deg,rgba(201,58,48,.15),rgba(201,58,48,.55))}
.bx-slide .lab{position:absolute;left:58px;right:38px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;white-space:nowrap;pointer-events:none;overflow:hidden}
.bx-slide .lab b{font-weight:700;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bx-slide .lab i{flex:none}
.bx-slide .lab i{font-style:normal;display:inline-flex;margin-left:6px;letter-spacing:-.2em;color:var(--rose);animation:bxChev 1.4s ease-in-out infinite}
.bx-slide .flag{position:absolute;right:12px;top:18px;width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
.bx-slide .flag:after{content:'';width:6px;height:6px;border-radius:2px;background:rgba(255,255,255,.4)}
.bx-slide .k{position:absolute;left:4px;top:4px;width:48px;height:48px;border:none;border-radius:999px;padding:0;cursor:grab;touch-action:none;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(201,58,48,.5),inset 0 1px 0 rgba(255,255,255,.2);color:#fff}
.bx-slide.settle .k,.bx-slide.settle .fill{transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)}
.bx-slide[aria-disabled="true"]{opacity:.5}
@media (max-width:400px){.bx-slide .flag{display:none}.bx-slide .lab{right:14px;font-size:14px}}
@keyframes bxRoad{from{background-position:0 0}to{background-position:-16px 0}}
@keyframes bxChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}

/* ---- pushed pages and sheets ---- */
.bx-page{position:fixed;inset:0;z-index:50;background:#2A3350;overflow:auto;max-width:520px;margin:0 auto;animation:bxIn .32s cubic-bezier(.2,.9,.3,1)}
.bx-page.flat{background:var(--bg)}
.bx-page.still{animation:none}
.bx-page .card{min-height:calc(100% - 40px - var(--safe-area-inset-top));margin-top:calc(40px + var(--safe-area-inset-top));background:var(--bg);border-radius:26px 26px 0 0;overflow:hidden;overflow:clip;display:flex;flex-direction:column}
.bx-page .card > .bx-sheethead{padding-top:8px}
.bx-page .tapback{position:absolute;left:0;right:0;top:0;height:calc(40px + var(--safe-area-inset-top));border:none;background:transparent}
@keyframes bxIn{from{transform:translateY(40px);opacity:.3}}
.bx-scrim{position:fixed;inset:0;z-index:60;background:rgba(10,14,28,.5);animation:bxScrim .25s ease-out}
@keyframes bxScrim{from{opacity:0}}
.bx-sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(22px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:bxUp .35s cubic-bezier(.2,.9,.3,1)}
.bx-sheet .bx-grip{background:#D9D4CB}
@keyframes bxUp{from{transform:translateY(100%)}}

/* ---- keypad ---- */
.bx-pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.bx-pad button{height:clamp(44px, 6.4vh, 52px);border:none;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.06);color:#fff;font-family:var(--mono);font-size:22px;font-weight:500;transition:transform .08s ease,background .12s ease}
.bx-pad button:active{transform:scale(.94);background:rgba(255,255,255,.16)}
.bx-dock{background:radial-gradient(120% 90% at 20% 0%,#26335E 0%,#16203C 65%);border-radius:26px 26px 0 0;padding:12px 14px calc(18px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 30px rgba(22,32,60,.18);color:#fff}

/* ---- toast ---- */
.bx-toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:90;background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;box-shadow:0 10px 24px rgba(22,32,60,.3)}
.bx-toast.on{opacity:1;transform:translateX(-50%)}

/* ---- motion ---- */
@keyframes bxRingIn{from{stroke-dasharray:0 400}}
@keyframes bxBlink{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes bxGrow{from{transform:scaleX(0)}}
@keyframes bxGrowR{from{transform:scaleX(0)}}
@keyframes bxUpIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bxCard{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bxDrive{0%{left:0}100%{left:calc(100% - 22px)}}
@keyframes bxDriveS{0%{left:4%}100%{left:30%}}
@keyframes bxRoll{0%{transform:translateX(-6px)}50%{transform:translateX(6px)}100%{transform:translateX(-6px)}}
@keyframes bxNow{0%{box-shadow:0 0 0 0 rgba(22,32,60,.5)}100%{box-shadow:0 0 0 8px rgba(22,32,60,0)}}
@keyframes bxPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.55)}100%{box-shadow:0 0 0 10px rgba(245,178,107,0)}}
@keyframes bxPulseL{0%{box-shadow:0 0 0 0 rgba(155,163,240,.55)}100%{box-shadow:0 0 0 10px rgba(155,163,240,0)}}
@keyframes bxDot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes bxShake{0%,100%{transform:rotate(-9deg)}25%{transform:rotate(-12deg)}75%{transform:rotate(-6deg)}}
@keyframes bxSwing{0%{transform:rotate(-7deg)}35%{transform:rotate(1deg)}65%{transform:rotate(-3.5deg)}100%{transform:rotate(-2deg)}}
@keyframes bxCaret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes bxDrop{0%{transform:translateY(-60px) rotate(-12deg);opacity:0}55%{transform:translateY(3px) rotate(2deg);opacity:1}75%{transform:translateY(-3px)}100%{transform:none}}
@keyframes bxBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(2px)}70%{transform:translateY(-1px)}}
@keyframes bxNext{0%,100%{box-shadow:inset 0 0 0 2px #16203C,0 10px 22px rgba(22,32,60,.14)}50%{box-shadow:inset 0 0 0 2px #3A3F9B,0 10px 22px rgba(58,63,155,.22)}}
@keyframes bxHint{0%,100%{transform:translateX(0)}30%{transform:translateX(10px)}60%{transform:translateX(-6px)}}
@keyframes bxTruck{0%{transform:translateX(-260px)}62%{transform:translateX(6px)}72%{transform:translateX(-3px)}80%,100%{transform:translateX(0)}}
@keyframes bxGate{0%,55%{transform:rotate(0)}75%{transform:rotate(100deg)}85%{transform:rotate(86deg)}100%{transform:rotate(90deg)}}
@keyframes bxCrate{0%{transform:translate(-70px,-30px) scale(.4);opacity:0}60%{transform:translate(0,-8px) scale(1.08);opacity:1}100%{transform:none;opacity:1}}
@keyframes bxStampBig{0%{transform:rotate(-12deg) scale(2);opacity:0}60%{transform:rotate(-12deg) scale(.92);opacity:1}100%{transform:rotate(-12deg) scale(1);opacity:.92}}
@keyframes bxDust{0%{opacity:0;transform:translateX(0) scale(.5)}30%{opacity:.6}100%{opacity:0;transform:translateX(-40px) scale(1.4)}}
@keyframes bxDone{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
.a-ring{animation:bxRingIn .9s cubic-bezier(.3,.8,.3,1) both}
.a-blink{animation:bxBlink 1.5s ease-in-out infinite}
.a-grow{transform-origin:left;animation:bxGrow .8s cubic-bezier(.3,.8,.3,1) both}
.a-growr{transform-origin:right;animation:bxGrowR .8s cubic-bezier(.3,.8,.3,1) both}
.a-up{animation:bxUpIn .5s ease-out both}
.a-card{animation:bxCard .35s cubic-bezier(.2,.9,.3,1.1) both}
.a-drive{animation:bxDrive 3.6s cubic-bezier(.45,0,.2,1) .4s infinite alternate}
.a-drives{animation:bxDriveS 4s cubic-bezier(.45,0,.2,1) infinite alternate}
.a-roll{animation:bxRoll 3.2s ease-in-out infinite}
.a-now{animation:bxNow 1.8s ease-out infinite}
.a-pulsea{animation:bxPulseA 1.8s ease-out infinite}
.a-pulsel{animation:bxPulseL 1.8s ease-out infinite}
.a-dot{animation:bxDot 1.2s ease-in-out infinite}
.a-shake{animation:bxShake .5s ease-in-out .3s both}
.a-swing{transform-origin:22px 0;animation:bxSwing 1.6s cubic-bezier(.3,.7,.4,1) both}
.a-caret{animation:bxCaret 1s steps(1) infinite}
.a-drop{animation:bxDrop .55s cubic-bezier(.3,.9,.4,1.2) both}
.a-bounce{animation:bxBounce .45s ease-out}
.a-next{animation:bxNext 2.2s ease-in-out infinite}
.a-hint{animation:bxHint 1.2s cubic-bezier(.4,0,.2,1) 1s 2}
.a-truck{animation:bxTruck 1.5s cubic-bezier(.2,.8,.3,1) .1s both}
.a-gate{transform-origin:0 100%;animation:bxGate 1.9s ease-out both}
@keyframes bxGateOut{0%,55%{transform:rotate(0)}75%{transform:rotate(-100deg)}85%{transform:rotate(-86deg)}100%{transform:rotate(-90deg)}}
.a-gate{animation-name:bxGateOut}
.a-crate{animation:bxCrate .45s cubic-bezier(.2,.9,.3,1.25) both}
.a-stampbig{animation:bxStampBig .5s cubic-bezier(.3,1.4,.5,1) 3.2s both}
.a-dust{animation:bxDust .9s ease-out 1.2s both}
.a-done{animation:bxDone .4s cubic-bezier(.2,.9,.3,1.3) both}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .a-gate{transform:rotate(-90deg)}
  .a-swing{transform:rotate(-2deg)}
  .a-dust{display:none}
}

/* ---- sign in ---- */
.bx-auth{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 20% 10%,#2B3866 0%,#16203C 60%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:24px 22px calc(24px + var(--safe-area-inset-bottom))}
.bx-auth .card{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bx-auth label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--navyInk2)}
.bx-auth input{height:52px;border-radius:14px;border:none;padding:0 14px;font-size:16px;background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);outline:none}
.bx-auth input:focus{box-shadow:inset 0 0 0 2px var(--mint)}
.bx-auth .msg{min-height:20px;font-size:13px;color:var(--navyInk)}
.bx-auth .msg.err{color:var(--rose)}
.bx-search{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.bx-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:#fff;font-size:16px;padding:0}
.bx-search input::placeholder{color:var(--navyInk2)}
.bx-switch{position:relative;width:52px;height:32px;border:none;border-radius:999px;padding:0;flex:none;transition:background .2s;background:#D9D4CB}
.bx-switch[aria-checked="true"]{background:var(--green)}
.bx-switch:after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 2px 4px rgba(22,32,60,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.bx-switch[aria-checked="true"]:after{transform:translateX(20px)}
/* ==================================================================
   ACCOUNTS — the pieces only the books need.
   ================================================================== */
:root{ --amberFaint:#FFF8EF; --sky:#1A5A8A; --skySoft:#DCEAF8; --plum:#7A3268; --plumSoft:#F6E4F1; }
.bx-nav .bx-go{background:var(--navy);box-shadow:0 0 0 5px var(--bg),0 10px 24px rgba(22,32,60,.3)}
.bx-nav .bx-go .icon{stroke-width:2.6}
.bx-badge.navy{background:var(--navy)}
.bx-foot > .bx-btn,.bx-foot > a.bx-btn,.bx-dock > .bx-btn,.bx-dock > a.bx-btn{flex:none}
.bx-page .card > .bx-dock{margin-top:auto}
.bx-btn{white-space:nowrap;min-width:0}
.ac-billpaid .bx-btn,.ac-paid .bx-btn,.ac-closed .bx-btn{font-size:15px}
.ac-more{width:100%;border:none;background:transparent;display:flex;align-items:center;gap:8px;min-height:48px;padding:0;border-top:1px solid #F1EEE8;font-size:13px;font-weight:700;color:var(--navy)}
.bx-slide{flex:none}
.row > .bx-slide{flex:1}
.bx-slide.mint .k{background:var(--mint);color:var(--navy);box-shadow:0 6px 14px rgba(111,220,176,.45)}
.bx-slide.mint .fill{background:linear-gradient(90deg,rgba(111,220,176,.12),rgba(111,220,176,.45))}
.bx-slide.mint .lab i{color:var(--mint)}
.bx-slide.amber{background:rgba(245,178,107,.12);box-shadow:inset 0 0 0 1px rgba(245,178,107,.3)}
.bx-slide.amber .k{background:var(--amber);color:var(--navy);box-shadow:0 6px 16px rgba(245,178,107,.4)}
.bx-slide.amber .fill{background:rgba(245,178,107,.22)}
.bx-slide.amber .lab{color:var(--amber)}
.bx-slide.amber .lab i{color:var(--amber)}
.bx-slide.amber .road,.bx-slide.amber .flag{display:none}
.bx-slide.amber[aria-disabled="true"]{opacity:1;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bx-slide.amber[aria-disabled="true"] .k{background:rgba(255,255,255,.12);color:#5C6788;box-shadow:none}
.bx-slide.amber[aria-disabled="true"] .lab{color:#5C6788}

/* ---- counting: a till, a phone and a bank statement ---- */
.ac-navycard{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 24px rgba(22,32,60,.18)}
.ac-count{width:128px;height:34px;border:none;outline:none;border-radius:10px;background:#fff;box-shadow:none;color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;letter-spacing:-.02em;text-align:center;padding:0 8px}
.ac-count:focus{box-shadow:inset 0 0 0 2px var(--amber)}
.ac-count::placeholder{color:var(--ink4);font-family:Figtree,sans-serif;font-size:13px;font-weight:600}
.ac-count:disabled{opacity:.6}
.ac-note{position:absolute;width:118px;height:54px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:14px;font-weight:600;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.ac-note.ghost{width:auto;height:40px;gap:6px;background:transparent;color:var(--rose);box-shadow:inset 0 0 0 1.5px rgba(245,154,146,.6);border-radius:6px;transform:rotate(var(--r,0deg))}
.ac-note.ghost b{font-size:14px}
@keyframes acFloat{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-4px) rotate(var(--r,0deg))}}
.a-float{animation:acFloat 3.2s ease-in-out infinite}

/* ---- paper lines ---- */
.ac-sl{width:100%;border:none;background:transparent;color:var(--ink);display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--dash);text-align:left}
.ac-sliphead{display:flex;justify-content:space-between;align-items:center;padding:6px 0 8px;border-bottom:1.5px solid var(--ink);font-size:11px;font-weight:700;letter-spacing:.12em}
.ac-sliptotal{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0 4px;border-top:1.5px solid var(--ink);font-size:13px;font-weight:700}
.ac-sliptotal .m{font-size:17px;font-weight:600}
.ac-kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;font-size:13px;font-weight:600;border-bottom:1px dashed var(--dash)}
.ac-kv > span:first-child{color:var(--ink3)}
.ac-tag{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:5px;font-size:9px;font-weight:700;letter-spacing:.06em}
.ac-tag.mtn{background:var(--skySoft);color:var(--sky)}
.ac-tag.airtel{background:var(--plumSoft);color:var(--plum)}
.ac-stamp{position:absolute;right:14px;top:40px;transform:rotate(-12deg);padding:5px 9px 4px;border:3px double var(--green);border-radius:9px;color:var(--green);background:rgba(228,244,234,.55);display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;animation:bxStamp .45s cubic-bezier(.3,1.3,.5,1) both}
.ac-stamp b{font-size:13px;font-weight:700;letter-spacing:.16em;line-height:1;padding-left:.16em}
.ac-stamp small{font-size:7px;font-weight:700;letter-spacing:.1em}
.ac-stamp.big{top:44px;right:18px;animation:acStampBig .45s cubic-bezier(.3,1.3,.5,1) 2.2s both}
.ac-stamp.big b{font-size:17px;letter-spacing:.18em}
.ac-stamp.big small{font-size:8px}
@keyframes acStampBig{0%{transform:rotate(-12deg) scale(2.2);opacity:0}55%{transform:rotate(-12deg) scale(.92);opacity:1}100%{transform:rotate(-12deg) scale(1);opacity:.92}}

/* ---- the day closed: the scale settles level ---- */
.ac-closed{position:relative;min-height:100%;color:#fff;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#26335E 0%,#16203C 60%)}
.ac-wob{transform-origin:150px 30px;transform-box:view-box;animation:acWob 2s cubic-bezier(.3,.6,.4,1) .2s both}
.ac-panl,.ac-panr{position:absolute;top:40px;width:96px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--navyInk2)}
.ac-panl{left:6px;animation:acPanL 2s cubic-bezier(.3,.6,.4,1) .2s both}
.ac-panr{right:6px;animation:acPanR 2s cubic-bezier(.3,.6,.4,1) .2s both}
.ac-panl i,.ac-panr i{width:100%;height:9px;border-radius:0 0 999px 999px;background:#DDE3F0}
.ac-level{position:absolute;left:90px;top:132px;width:120px;height:16px;border-radius:999px;background:#0E1630;box-shadow:inset 0 0 0 1.5px rgba(111,220,176,.45);display:flex;align-items:center;justify-content:center}
.ac-level:before,.ac-level:after{content:'';position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:rgba(111,220,176,.5);margin-left:-12px}

     cash_txns          a customer's payment in; a count's Cash Shortage

     customer_debt_log  the payment line against a customer's debt.
     customers          the debt, down only, as a payment lands.

     statements_sent    the record that a statement went.
     cash_days          the count, and the close.
     purchase_invoices  a bill's payments.

  out += `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for (let id = 1; id < objs.length; id++) out += String(offsets[id]).padStart(10, '0') + ' 00000 n \n';
  out += `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  const bytes = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xff;
  return bytes;
}

/* The plan for an amount: which bills it pays and what they owe after.
   picks = null spreads it oldest first; an array of quote ids pays those
   bills in that order and nothing else (the owner's invoice picker). The
   "after" follows the write below step by step, so the figure on screen
   is the figure the books will hold. */
function payPlan(c, amount, picks){
  let left = Math.max(0, Math.round(Number(amount) || 0));
  const open = outstandingInvoices(c.id), debt0 = Number(c.debt) || 0;
  const sumDue = open.reduce((s, q) => s + balanceDue(q), 0);
  const loose = Math.max(0, debt0 - sumDue);
  const isPicked = q => !picks || picks.some(id => String(id) === String(q.id));
  let order = open;
  if (picks) { const picked = picks.map(id => open.find(q => String(q.id) === String(id))).filter(Boolean); order = picked.concat(open.filter(q => !picked.includes(q))); }
  const bills = order.map((q, i) => { const picked = isPicked(q), due = balanceDue(q), pay = picked ? Math.min(left, due) : 0; left -= pay; return { q, due, pay, picked, n: picked ? i + 1 : 0, o: open.indexOf(q) }; });
  let debt = debt0;
  bills.forEach(b => {
    if (!(b.pay > 0)) return;
    const desired = Math.max(0, quoteTotal(b.q) - (Number(b.q.amountPaid) || 0) - b.pay), after = Math.max(0, debt + desired - (Number(b.q.debtCharged) || 0));
    if (after < debt) debt = after;
  });
  const over = Math.max(0, left - debt);
  return { bills, rest: left, loose, over, after: Math.max(0, debt - left), all: Math.max(debt0, sumDue + loose), oldest: open.length ? balanceDue(open[0]) : 0 };
}

async function selectAll(table, keyCol, since){

  let rows = [], total = null;
  for (;;) {
    let q = sb.from(table).select('*', total === null ? { count: 'exact' } : undefined).eq('shop_id', S.shopId);
    if (since) q = q.gte(since[0], since[1]);
    if (rows.length) q = q.gt(keyCol, rows[rows.length - 1][keyCol]);

/* ==================================================================
   The cash book, carried over from index.html line for line: a day
   opens with what the day before ended with (a count beats a sum), and
   Book says = opening + in − out. Each function names its original.
   ================================================================== */
const ACCOUNTS = [{ key: 'cash', label: 'Cash', short: 'Cash' }, { key: 'momo', label: 'Mobile money', short: 'Mobile' }, { key: 'bank', label: 'Bank', short: 'Bank' }];
const CASH_SHORTAGE_CATEGORY = 'Cash Shortage';
const CASH_OVERAGE_CATEGORY = 'Cash Overage';
// index.html 117045: rows written before the momo fix carry the provider's
// name; they are mapped on the way in, and the unknown falls to cash.
const CASH_ACCOUNT_KEYS = new Set(ACCOUNTS.map(a => a.key));
function normaliseCashAccount(account){
  const raw = String(account == null ? '' : account).trim();
  if (CASH_ACCOUNT_KEYS.has(raw)) return raw;
  const lower = raw.toLowerCase();
  if (/momo|mobile money|airtel|mtn/.test(lower)) return 'momo';
  if (/bank/.test(lower)) return 'bank';
  if (/cash/.test(lower)) return 'cash';
  return 'cash';
}
function acctOf(t){ return normaliseCashAccount(t.account); }
function dayTxns(date){ return memo('dayTx', date, () => D().cashTxns.filter(t => t.date === date)); }
// index.html 119774
function cbAccountTotals(date, account){
  const rows = dayTxns(date).filter(t => acctOf(t) === account);
  const totalReceipts = rows.filter(t => t.type === 'receipt' || t.type === 'in').reduce((s, t) => s + t.amount, 0);
  const totalPayments = rows.filter(t => t.type === 'payment' || t.type === 'out').reduce((s, t) => s + t.amount, 0);
  const totalExpenses = rows.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  return { totalReceipts, totalPayments, totalExpenses };
}
// index.html 117110
function previousCashDate(date){
  const dates = new Set(Object.keys(D().cashDays || {}));
  D().cashTxns.forEach(t => { if (t.date) dates.add(t.date); });
  let best = null;
  dates.forEach(d => { if (d < date && (best === null || d > best)) best = d; });
  return best;
}
// index.html 117120
function cbClosingFor(date, account){
  const rec = (D().cashDays || {})[date];
  const opening = (rec && rec.opening && Number(rec.opening[account])) || 0;
  const { totalReceipts, totalPayments, totalExpenses } = cbAccountTotals(date, account);
  return opening + totalReceipts - totalPayments - totalExpenses;
}
// index.html 117132
function carriedOpening(date){
  const prev = previousCashDate(date);
  if (!prev) return null;
  const prevRec = (D().cashDays || {})[prev] || {};
  const values = {}, counted = {};
  ACCOUNTS.forEach(a => {
    const actual = prevRec.actual ? prevRec.actual[a.key] : null;
    const wasCounted = actual !== null && actual !== undefined && actual !== '';
    counted[a.key] = wasCounted;
    values[a.key] = wasCounted ? Number(actual) : cbClosingFor(prev, a.key);
  });

}
// index.html 117146, without writing: a day nobody has opened reads as
// the carried opening, unconfirmed, nothing counted.
function dayRecord(date){
  const rec = (D().cashDays || {})[date];
  if (rec) return rec;
  const carried = carriedOpening(date);
  return { opening: carried ? { ...carried.values } : { cash: 0, momo: 0, bank: 0 }, actual: { cash: null, momo: null, bank: null }, openingSet: false, closedAt: null, closedBy: null, onServer: false };
}
// index.html 117344
function cbDayPosition(date){
  const rec = dayRecord(date);
  const accounts = ACCOUNTS.map(a => {
    const { totalReceipts, totalPayments, totalExpenses } = cbAccountTotals(date, a.key);
    const carried = rec.openingSet ? null : carriedOpening(date);
    const opening = carried ? (Number(carried.values[a.key]) || 0) : (Number(rec.opening[a.key]) || 0);
    const out = totalPayments + totalExpenses;
    const closing = opening + totalReceipts - out;
    const raw = rec.actual ? rec.actual[a.key] : null;
    const counted = (raw === null || raw === undefined || raw === '') ? null : Number(raw);
    return { key: a.key, label: a.label, short: a.short, opening, in: totalReceipts, out, payments: totalPayments, expenses: totalExpenses, closing, counted,
      variance: counted === null ? null : counted - closing };
  });
  const sum = f => accounts.reduce((s, x) => s + f(x), 0);
  return { date, rec, accounts, opening: sum(x => x.opening), in: sum(x => x.in), out: sum(x => x.out), closing: sum(x => x.closing),
    countedAccounts: accounts.filter(x => x.counted !== null).length, agree: accounts.filter(x => x.counted !== null && Math.abs(x.variance) < 1).length,
    closed: !!rec.closedAt };
}

// The row the owner's app writes (index.html 45838), opening untouched.
function cashDayRow(date, rec){ return { shop_id: S.shopId, date, opening: rec.opening, actual: rec.actual, opening_set: !!rec.openingSet, closed_at: rec.closedAt || null, closed_by: rec.closedBy || null }; }

let dayQueue = Promise.resolve();
function writeDay(date, change){

async function writeDayNow(date, change){
  // Re-read first: the owner's count or close on another screen wins.

  if (cur.error) throw cur.error;

  else { const d = dayRecord(date); rec = { opening: { ...d.opening }, actual: { cash: null, momo: null, bank: null }, openingSet: false, closedAt: null, closedBy: null }; }
  change(rec);
  const row = cashDayRow(date, rec);
  const r = cur.data ? await sb.from('cash_days').update({ actual: row.actual, closed_at: row.closed_at, closed_by: row.closed_by }).eq('shop_id', S.shopId).eq('date', date)
    : await sb.from('cash_days').insert(row);

// index.html 117924
async function closeDay(date){

  // a receipt that landed a minute ago would close a day that does not agree.
  try { await loadAll(); } catch (e) { toast(failWord(e), 6000); return false; }
  const pos = cbDayPosition(date);
  if (pos.closed) return true;
  if (pos.countedAccounts < pos.accounts.length) { toast('Count every account first'); return false; }
  if (pos.accounts.some(a => Math.abs(a.variance) >= 1)) { toast('An account does not agree yet — find or book the difference first'); return false; }
  if (!can('day.close')) { toast('Closing needs “Close the day” — ask the owner to switch it on'); return false; }
  try { await writeDay(date, rec => { rec.closedAt = new Date().toISOString(); rec.closedBy = S.user ? String(S.user.id) : null; }); return true; }

}
// index.html 119844: what nobody can trace goes in as Cash Shortage / Overage.
async function bookVariance(date, key){

  if (!a || a.counted === null) { toast('Count it first'); return false; }
  const variance = Math.round(a.variance);
  if (Math.abs(variance) < 1) { toast('The count already agrees with the book'); return false; }
  if (!can('variance.book')) { toast('Booking it needs “Book a short or over” — ask the owner'); return false; }
  const short = variance < 0, amount = Math.abs(variance);
  try {
    const max = D().cashTxns.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0);
    const id = await issueRowId('row:cash_txn', max);
    const row = { id, shop_id: S.shopId, date, account: key, type: short ? 'payment' : 'receipt', category: short ? CASH_SHORTAGE_CATEGORY : CASH_OVERAGE_CATEGORY,
      amount, description: `${short ? 'Short' : 'Over'} on the count of ${date}`, time: new Date().toTimeString().slice(0, 5), entered_by: S.user ? String(S.user.id) : null };
    await insertRow('cash_txns', row, ['entered_by']);

/* ==================================================================

   ================================================================== */
const BANDS = [
  { k: 'b30', label: 'under 30', lo: 0, hi: 29, col: '#6FDCB0', ink: '#0F6B43' },
  { k: 'b60', label: '30–60', lo: 30, hi: 59, col: '#F5B26B', ink: '#95530C' },
  { k: 'b90', label: '60–90', lo: 60, hi: 89, col: '#E5483D', ink: '#8E2A22' },
  { k: 'b90p', label: 'over 90', lo: 90, hi: Infinity, col: 'repeating-linear-gradient(135deg,#E5483D 0 3px,#8E2A22 3px 6px)', solid: '#8E2A22', ink: '#8E2A22' },
];
function bandOf(age){ return BANDS.find(b => age >= b.lo && age <= b.hi) || BANDS[0]; }
function custAging(c){
  return memo('aging', c.id, () => {
    const parts = { b30: 0, b60: 0, b90: 0, b90p: 0 }; let oldest = 0, known = 0;
    custOpenCharges(c).forEach(ch => { const age = ch.date ? Math.max(0, daysBetween(String(ch.date).slice(0, 10), todayISO())) : 0; parts[bandOf(age).k] += ch.remaining; known += ch.remaining; if (age > oldest) oldest = age; });
    // What the log cannot place (a debt from before the log) is named, not dropped.
    const unknown = Math.max(0, (Number(c.debt) || 0) - known);
    return { parts, oldest, unknown };
  });
}
function debtors(){ return memo('debtors', '', () => D().customers.filter(c => (Number(c.debt) || 0) > 0.5)); }
function owedTotals(){
  return memo('owedTot', '', () => {
    const t = { b30: 0, b60: 0, b90: 0, b90p: 0, unknown: 0, all: 0 };
    debtors().forEach(c => { const a = custAging(c); BANDS.forEach(b => { t[b.k] += a.parts[b.k]; }); t.unknown += a.unknown; t.all += Number(c.debt) || 0; });
    return t;
  });
}
function lastStatement(cid){ return (D().statementsSent || []).filter(s => String(s.customer_id) === String(cid)).sort((a, b) => String(b.sent_on).localeCompare(String(a.sent_on)))[0] || null; }
function promiseFor(cid){ const t = todayISO(); return (D().promises || []).filter(p => String(p.customerId) === String(cid) && p.promisedOn >= t).sort((a, b) => a.promisedOn.localeCompare(b.promisedOn))[0] || null; }
// index.html invTermsOf 72584 / cbDueOfInvoice 117950
function invTerms(q){ const t = Number(q.termsDays); return t > 0 ? t : (Number(D().presetChaseAfterDays) || 0); }
function invDue(q){ const t = invTerms(q), s = custISO(q.invoicedAt || q.date); if (!t || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + t); return isoOf(d); }
function invLateDays(q){ const due = invDue(q); return due && due < todayISO() ? daysBetween(due, todayISO()) : 0; }
// A statement is due when they owe and none went in 30 days (the rule the owner confirms).
const STMT_EVERY = 30;
function statementDue(c){ const l = lastStatement(c.id); return (Number(c.debt) || 0) > 0.5 && (!l || daysBetween(String(l.sent_on), todayISO()) >= STMT_EVERY); }

/* ==================================================================
   Money in: every receipt, by account, and what each one paid.
   ================================================================== */
function receiptsOn(date){ return dayTxns(date).filter(t => t.type === 'receipt' || t.type === 'in'); }
function txnById(id){ return D().cashTxns.find(t => String(t.id) === String(id)) || null; }
// The invoice payment a receipt became, and the debt line, by its cash_txn id.
function txnTrace(t){
  return memo('trace', t.id, () => {
    const inv = [];
    D().savedQuotes.forEach(q => (q.payments || []).forEach(p => { if (p && String(p.cashTxnId) === String(t.id)) inv.push({ q, p }); }));
    let debt = null, cust = null;
    D().customers.forEach(c => (c.debtLog || []).forEach(l => { if (l.cashTxnId != null && String(l.cashTxnId) === String(t.id)) { debt = l; cust = c; } }));
    if (!cust && inv.length) cust = inv[0].q.customerId != null ? customerById(inv[0].q.customerId) : null;
    if (!cust && t.quoteId != null) { const q = D().savedQuotes.find(x => String(x.id) === String(t.quoteId)); if (q && q.customerId != null) cust = customerById(q.customerId); }
    const isDebt = /Debt Payment|Customer Payment|Invoice Payment/.test(t.category || '');
    return { inv, debt, cust, onAccount: isDebt && !inv.length && t.quoteId == null && !!debt };
  });
}
function txnWho(t){ const tr = txnTrace(t); if (tr.cust) return tr.cust.name; const m = /—\s*(.+)$/.exec(t.description || ''); return m ? m[1].replace(/^INV-\d+$/, 'Invoice ' + m[1]) : (t.description || t.category || 'Receipt'); }
function txnTag(t){ const d = String(t.description || '') + ' ' + String(t.account || ''); return /airtel/i.test(d) ? 'AIRTEL' : /mtn/i.test(d) ? 'MTN' : ''; }
function onAccountToday(){ return receiptsOn(todayISO()).filter(t => txnTrace(t).onAccount); }

/* ==================================================================
   Suppliers: what we owe, bill by bill (index.html 75992 / 106378).
   ================================================================== */
function purchaseInvoiceTotal(pi){
  return (pi.items || []).reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0)
    + Math.max(0, Number(pi.transport) || 0)
    - ((pi.credits) || []).reduce((s, sc) => s + (sc && !sc.voided ? Number(sc.amount) || 0 : 0), 0);
}
function billDue(pi){ return Math.max(0, purchaseInvoiceTotal(pi) - (Number(pi.amountPaid) || 0)); }
function billLabel(pi){ return 'PINV-' + String(pi.id).padStart(4, '0'); }
function supplierById(id){ return D().suppliers.find(s => String(s.id) === String(id)) || null; }
function billSupplierName(pi){ const s = supplierById(pi.supplierId); return (s && s.name) || pi.supplierName || 'Supplier'; }
// Bills are grouped by their supplier's id, or by name when a bill carries none,
// so two suppliers without an id are never paid together.
function supplierKey(pi){ return pi.supplierId != null && pi.supplierId !== '' ? String(pi.supplierId) : 'name:' + (pi.supplierName || ''); }
function openBills(sid){ return D().bills.filter(pi => !pi.voided && billDue(pi) > 0.5 && (sid == null || supplierKey(pi) === String(sid))).sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || (a.id - b.id)); }
function billState(pi){
  const t = todayISO(), wk = isoOf(new Date(Date.now() + 6 * 864e5));
  if (!pi.dueDate) return { k: 'nodate', word: 'no date', ink: '#5F6980', bg: '#F4F2EE' };
  if (pi.dueDate < t) return { k: 'late', word: daysBetween(pi.dueDate, t) + ' d late', ink: '#8E2A22', bg: '#FBE5E2', late: daysBetween(pi.dueDate, t) };
  if (pi.dueDate <= wk) return { k: 'week', word: pi.dueDate === t ? 'today' : new Date(pi.dueDate + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' }), ink: '#7A4A02', bg: '#FDEEE1' };
  return { k: 'later', word: new Date(pi.dueDate + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }), ink: '#5F6980', bg: '#F4F2EE' };
}
function creditors(){
  return memo('creditors', '', () => {
    const by = {};
    openBills().forEach(pi => { const k = supplierKey(pi); const r = by[k] || (by[k] = { sid: k, name: billSupplierName(pi), bills: [], due: 0, worst: null }); r.bills.push(pi); r.due += billDue(pi); });
    const rank = { late: 0, week: 1, later: 2, nodate: 3 };
    return Object.values(by).map(r => { r.bills.forEach(pi => { const s = billState(pi); if (!r.worst || rank[s.k] < rank[r.worst.k] || (s.k === r.worst.k && (pi.dueDate || '') < (r.worstBill.dueDate || ''))) { r.worst = s; r.worstBill = pi; } }); return r; })
      .sort((a, b) => rank[a.worst.k] - rank[b.worst.k] || String(a.worstBill.dueDate || '9').localeCompare(String(b.worstBill.dueDate || '9')) || b.due - a.due);
  });
}
// What came into stock against a bill line (stock_log.pi_id, 0107). Null when nothing tells us.
function billCameIn(pi){
  const rows = D().stockIn; if (!rows) return null;
  const mine = rows.filter(r => String(r.pi_id) === String(pi.id) && Number(r.delta) > 0);
  if (!mine.length) return null;
  return (pi.items || []).map(it => {
    const got = mine.filter(r => String(r.product_id) === String(it.productId) && String(r.variant_idx == null ? '' : r.variant_idx) === String(it.variantIdx == null ? '' : it.variantIdx)).reduce((s, r) => s + (Number(r.delta) || 0), 0);
    return { it, got, full: got >= (Number(it.qty) || 0) - 1e-6 };
  });
}
function paidToSuppliersOn(date){ return dayTxns(date).filter(t => (t.type === 'payment') && /Stock Purchase|Supplier Payment/.test(t.category || '')); }

// Pay chosen bills, in the order picked (allocateCreditorPayment, 108281, on the bills the person ticked).
// amounts: { [billId]: part } to pay less than the whole of a bill.
async function payBills(bills, account, amounts){
  if (!can('bill.pay')) throw new Error('paying a supplier needs “Pay supplier bills” — ask the owner to switch it on.');
  const date = todayISO(), time = new Date().toTimeString().slice(0, 5);
  let cashMax = D().cashTxns.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0), written = 0;
  const done = [];
  try {
    for (const b of bills) {
      const cur = await sb.from('purchase_invoices').select('payload').eq('shop_id', S.shopId).eq('id', b.id).maybeSingle();
      if (cur.error) throw cur.error;
      if (!cur.data) throw new Error(billLabel(b) + ' is no longer in the books.');
      const payload = cur.data.payload || {};
      const fresh = rowToBill({ id: b.id, quote_id: b.quoteId, date: b.date, payload });
      const due = billDue(fresh), want = amounts && amounts[b.id] != null ? Number(amounts[b.id]) : due, pay = Math.min(due, Math.max(0, want)); if (!(pay > 0)) continue;
      const id = await issueRowId('row:cash_txn', cashMax); cashMax = Math.max(cashMax, id);
      const row = { id, shop_id: S.shopId, date, account, type: 'payment', category: 'Stock Purchase', amount: Math.round(pay), description: `Payment — ${billLabel(fresh)} — ${billSupplierName(fresh)}`, time, entered_by: S.user ? String(S.user.id) : null };
      await insertRow('cash_txns', row, ['entered_by']); written += pay;
      D().cashTxns.push(rowToTxn(row));
      const payments = (Array.isArray(payload.payments) ? payload.payments : []).concat([{ date, amount: Math.round(pay), note: '', cashTxnId: id }]);
      const up = await sb.from('purchase_invoices').update({ payload: { ...payload, payments, amountPaid: (Number(payload.amountPaid) || 0) + Math.round(pay) } }).eq('shop_id', S.shopId).eq('id', b.id);
      if (up.error) throw up.error;
      Object.assign(b, { payments, amountPaid: (Number(payload.amountPaid) || 0) + Math.round(pay) });
      done.push({ bill: b, pay: Math.round(pay) });
    }
  } catch (e) {
    if (written > 0) { e.partial = written; }
    throw e;
  } finally { S.loadedAt = Date.now(); saveSnapshot(); }
  return done;
}

function invoiceSent(q){ const s = invoiceSends(q); return s.length ? s[s.length - 1] : null; }

/* ==================================================================
   Recording a customer's payment -- the Sales app's own write
   (sales.html ACT['slide:pay']), the same rows in the same order:
   a receipt per bill it pays, the bill's payments and amount_paid,
   the debt following each bill's balance, and anything left lowering
   the debt as a payment on account.
   ================================================================== */
async function recordPayment(c0, amount, method, picks){
  if (!can('payment.receive')) throw new Error('recording a payment needs “Record payments in” — ask the owner to switch it on.');
  const date = todayISO(), time = new Date().toTimeString().slice(0, 5);
  const done = []; let written = 0;
  try {
    const fresh = await sb.from('customers').select('debt').eq('shop_id', S.shopId).eq('id', c0.id).maybeSingle();
    if (fresh.error) throw fresh.error;
    let debt = Number(fresh.data && fresh.data.debt) || 0; const debt0 = debt;
    const plan = payPlan({ ...c0, debt }, amount, picks);
    const ctx = { date, time, method, cashMax: D().cashTxns.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0) };
    let logMax = D().customers.reduce((m, c) => (c.debtLog || []).reduce((mm, l) => Math.max(mm, Number(l.id) || 0), m), 0);
    const logRow = async (row) => {
      const id = await issueRowId('row:debt_log', logMax); logMax = Math.max(logMax, id);
      await insertRow('customer_debt_log', { id, shop_id: S.shopId, customer_id: c0.id, date, type: 'payment', ...row }, ['cash_txn_id', 'quote_id']);
    };
    for (const b of plan.bills) {
      if (!(b.pay > 0)) continue;
      const cur = await sb.from('saved_quotes').select('amount_paid, payload').eq('shop_id', S.shopId).eq('id', b.q.id).maybeSingle();
      if (cur.error) throw cur.error;
      const payload = (cur.data && cur.data.payload) || {};
      const q = rowToQuote({ ...b.q, id: b.q.id, invoiced: true, amount_paid: cur.data ? cur.data.amount_paid : b.q.amountPaid, payload });
      q.invoicedAt = b.q.invoicedAt; q.date = b.q.date;
      const pay = Math.min(b.pay, balanceDue(q)); if (!(pay > 0)) continue;
      const label = invoiceLabel(q), dueNow = balanceDue(q);
      const cashTxnId = await payCashRow(ctx, pay, 'Debt Payment', `Payment — ${label}`, q.id); written += pay;
      const prior = Array.isArray(payload.payments) ? payload.payments : [];
      const payments = prior.concat([{ date, amount: pay, note: '', cashTxnId, method, id: payNextPaymentId(prior) }]);
      const amountPaid = (Number(q.amountPaid) || 0) + pay;
      const desired = Math.max(0, quoteTotal(q) - amountPaid), current = Number(payload.debtCharged) || 0;
      const before = debt, after = Math.max(0, before + (desired - current)), applied = after - before;
      const up = await sb.from('saved_quotes').update({ amount_paid: amountPaid, payload: { ...payload, payments, debtCharged: applied > 0 ? current : desired, customerId: c0.id } }).eq('shop_id', S.shopId).eq('id', q.id);
      if (up.error) throw up.error;
      if (applied < 0) {
        await logRow({ amount: -applied, note: `Auto-sync — ${label}`, quote_id: q.id, cash_txn_id: null });
        const cu = await sb.from('customers').update({ debt: after }).eq('shop_id', S.shopId).eq('id', c0.id); if (cu.error) throw cu.error;
        debt = after;
      }
      done.push({ quoteId: q.id, label, pay, cleared: pay >= dueNow, left: Math.max(0, dueNow - pay), total: quoteTotal(q) });
    }
    const rest = amount - done.reduce((s, d) => s + d.pay, 0);
    if (rest > 0) {
      const before = debt, after = Math.max(0, before - rest);
      const cashTxnId = await payCashRow(ctx, rest, 'Debt Payment', `Payment — ${c0.name}`, null); written += rest;
      if (before !== after) {
        const cu = await sb.from('customers').update({ debt: after }).eq('shop_id', S.shopId).eq('id', c0.id); if (cu.error) throw cu.error;
        await logRow({ amount: before - after, note: '', cash_txn_id: cashTxnId, quote_id: null });
        debt = after;
      }
      done.push({ label: 'On account', pay: rest, cleared: after === 0, left: after, onAccount: true });
    }
    return { name: c0.name, id: c0.id, phone: c0.phone || c0.phone2 || '', amount, method, bills: done, before: debt0, after: debt, time };
  } catch (e) { e.partial = written; throw e; }
}

/* ==================================================================
   Sharing a file: the app's Share plugin inside the Android app, the
   browser's where it can hand over a file, else it is saved and their
   chat opens with the line typed (sales.html custSharePdf).
   ================================================================== */
async function shareBlob(blob, name, text, phone, title){
  const C = window.Capacitor, P = C && typeof C.isNativePlatform === 'function' && C.isNativePlatform() ? (C.Plugins || {}) : null;
  if (P && P.Share && P.Filesystem) {
    try {
      const buf = new Uint8Array(await blob.arrayBuffer());
      let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      const { uri } = await P.Filesystem.writeFile({ path: name, data: btoa(bin), directory: 'CACHE' });
      await P.Share.share({ files: [uri], text, title: title || name, dialogTitle: title || 'Send' });
      return 'shared';
    } catch (e) { if (/cancel/i.test(String((e && e.message) || e))) return 'cancelled'; console.warn('native share failed', e); }
  }
  let file = null; try { file = new File([blob], name, { type: blob.type }); } catch (_e) {}
  try { if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return 'shared'; } }
  catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  window.open(waComposeUrl(phone, text), '_blank');
  toast('Saved — attach it in the WhatsApp chat and send.', 8000);
  return 'saved';
}

/* ==================================================================
   Pictures: a statement, an invoice and the two end-of-day summaries
   painted onto a canvas -- the way the app already paints a customer
   brief -- so WhatsApp shows them in the chat without opening a file.
   Every figure on them comes from the same functions as the screens.
   ================================================================== */
const PX = 2;   // drawn at twice the 540-wide design, so text is crisp on any phone
async function fontsReady(){ try { if (document.fonts) await Promise.all(['600 16px Figtree', '700 16px Figtree', '600 16px "IBM Plex Mono"'].map(f => document.fonts.load(f))); } catch (_e) {} }
function pc(h){ const c = document.createElement('canvas'); c.width = 540 * PX; c.height = Math.ceil(h * PX); const x = c.getContext('2d'); x.scale(PX, PX); x.textBaseline = 'alphabetic'; return { c, x }; }
const FIG = 'Figtree, system-ui, sans-serif', MONO = '"IBM Plex Mono", ui-monospace, monospace';
function pt(x, s, X, Y, o){
  o = o || {};
  x.font = `${o.w || 600} ${o.size || 14}px ${o.mono ? MONO : FIG}`;
  x.fillStyle = o.col || '#1C2233'; x.textAlign = o.align || 'left';
  let str = String(s);
  if (o.max) { while (str.length > 1 && x.measureText(str).width > o.max) str = str.slice(0, -2) + '…'; }
  if (o.ls && x.letterSpacing !== undefined) x.letterSpacing = o.ls + 'px';
  x.fillText(str, X, Y);
  if (x.letterSpacing !== undefined) x.letterSpacing = '0px';
}
function prr(x, X, Y, w, h, r, fill){ x.beginPath(); if (x.roundRect) x.roundRect(X, Y, w, h, r); else x.rect(X, Y, w, h); x.fillStyle = fill; x.fill(); }
function pline(x, X1, Y, X2, col, w, dash){ x.beginPath(); x.setLineDash(dash || []); x.moveTo(X1, Y); x.lineTo(X2, Y); x.strokeStyle = col; x.lineWidth = w || 1; x.stroke(); x.setLineDash([]); }
function pnavy(x, Y, h){ const g = x.createRadialGradient(80, Y, 10, 80, Y, 520); g.addColorStop(0, '#2B3A6B'); g.addColorStop(.6, '#16203C'); g.addColorStop(1, '#16203C'); x.fillStyle = g; x.fillRect(0, Y, 540, h); }
function pmark(x, X, Y){ prr(x, X, Y, 34, 34, 9, '#FFFFFF'); pt(x, 'OW', X + 17, Y + 22, { w: 700, size: 13, col: '#16203C', align: 'center' }); }
function pbands(x, X, Y, w, h, parts){
  const tot = parts.reduce((s, p) => s + p.v, 0) || 1; let at = X;
  parts.filter(p => p.v > 0).forEach(p => { const pw = Math.max(3, p.v / tot * w - 3); prr(x, at, Y, pw, h, 3, p.col); at += pw + 3; });
}
function pfoot(x, H, left, right){ pline(x, 30, H - 44, 510, '#ECE8E1', 1); pt(x, left, 30, H - 20, { size: 12, col: '#767F91' }); pt(x, right, 510, H - 20, { size: 12, col: '#767F91', align: 'right' }); }
function blobOf(c){ return new Promise(ok => c.toBlob(b => ok(b), 'image/png')); }
const BAND_SOLID = { b30: '#6FDCB0', b60: '#F5B26B', b90: '#E5483D', b90p: '#8E2A22' };

// A four-column table: name (with a small coloured mark), then three figures.
function ptable(x, Y, head, rows, total){
  const C = [30, 300, 400, 510];
  pt(x, head[0], C[0], Y, { size: 11, w: 700, col: '#5F6980', ls: 1 });
  head.slice(1).forEach((h, i) => pt(x, h, C[i + 1], Y, { size: 11, w: 700, col: '#5F6980', align: 'right', ls: 1 }));
  Y += 10; pline(x, 30, Y, 510, '#1C2233', 1.5);
  rows.forEach((r, i) => {
    Y += 44;
    if (r.tag) { prr(x, 30, Y - 28, 24, 24, r.round ? 12 : 7, r.tag[0]); pt(x, r.ini, 42, Y - 12, { size: 9, w: 700, col: r.tag[1], align: 'center' }); }
    pt(x, r.name, 62, Y - 16, { size: 14, w: 700, max: 168 });
    if (r.sub) pt(x, r.sub, 62, Y, { size: 11, w: 600, col: r.subCol || '#767F91', max: 168 });
    r.figs.forEach((f, j) => pt(x, f.v ? n0(f.v) : '—', C[j + 1], Y - 8, { mono: true, size: j === 2 ? 15 : 14, w: j === 2 ? 600 : 500, col: f.v ? (f.col || '#1C2233') : '#C9C4BA', align: 'right' }));
    if (i < rows.length - 1) pline(x, 30, Y + 12, 510, '#ECE8E1', 1);
  });
  if (total) {
    Y += 22; pline(x, 30, Y, 510, '#1C2233', 1.5); Y += 30;
    pt(x, total.label, 30, Y, { size: 14, w: 700 });
    total.figs.forEach((f, j) => pt(x, n0(f.v), C[j + 1], Y, { mono: true, size: 15, w: 600, col: f.col || '#1C2233', align: 'right' }));
  }
  return Y;
}

async function paintDebtors(){
  await fontsReady();
  const s = summaryDebtors(), H = 230 + 44 * (s.rows.length + (s.others ? 1 : 0)) + 140;
  const { c, x } = pc(H);

function summaryCreditors(){

  const all = Object.values(bySup).filter(r => r.balance > 0.5 || r.paid > 0 || r.added > 0).map(r => {
    const open = r.bills.filter(pi => billDue(pi) > 0.5);

    return { ...r, state: st };
  }).sort((a, b) => rank[a.state.k] - rank[b.state.k] || b.balance - a.balance);

}

async function boot(){

  let user = (!ue && u && u.user) ? u.user : null;
  if (!user) {
    const { data: sess } = await sb.auth.getSession();
    const sid = sess && sess.session && sess.session.user && sess.session.user.id;
    const snap = sid ? loadSnapshot(sid) : null;
    if (isNetworkError(ue) && snap) {
      S.user = sess.session.user; Object.assign(S, { shopId: snap.shopId, shopName: snap.shopName, role: snap.role, tasks: snap.tasks || [], data: snap.data, loadedAt: snap.at });
      hideAuth(); start(); toast('Offline — showing what you last saw'); return;
    }
    await authScreen();
    ({ data: u } = await sb.auth.getUser()); user = u && u.user;
    if (!user) return;
  } else if (initialLinkType === 'invite' || initialLinkType === 'recovery') {
    await setPasswordScreen();
  }
  S.user = user;
  const { data: ms, error } = await sb.from('shop_members').select('shop_id, role, shops(name)').eq('user_id', user.id);
  if (error) {

    if (isNetworkError(error) && snap) { Object.assign(S, { shopId: snap.shopId, shopName: snap.shopName, role: snap.role, tasks: snap.tasks || [], data: snap.data, loadedAt: snap.at }); hideAuth(); start(); toast('Offline — showing what you last saw'); return; }
    toast('Could not reach the shop: ' + error.message, 6000); return;
  }
  const rows = ms || [];
  // An accounts membership first; an owner, admin or manager may open the desk too.
  const pick = rows.find(m => m.role === 'accounts') || rows.find(m => ['owner', 'admin', 'manager'].includes(m.role));
  if (!pick) { authScreen('denied'); return; }
  S.shopId = pick.shop_id; S.role = pick.role; S.shopName = (pick.shops && pick.shops.name) || 'The shop';
  hideAuth();
  const snap = loadSnapshot(user.id);

function owedRows(){
  const k = S.ui.owesSort || 'old', band = S.ui.owesBand;

  list.sort(k === 'big' ? (a, b) => b.debt - a.debt : (a, b) => custAging(b).oldest - custAging(a).oldest || b.debt - a.debt);

}

  return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card">
    <div class="bx-sheethead"><span class="bx-grip"></span>
