        <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;font-weight:600;color:var(--navyInk2)">Owes${open.length ? `, <span class="m">${open.length}</span> invoice${open.length === 1 ? '' : 's'}` : ''}</span><span class="m" style="font-size:32px;font-weight:600;letter-spacing:-.03em">${n0(c.debt)}</span></span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--navyInk)"><span>${pr ? 'promised' : 'last statement'}</span><span style="font-weight:700;color:#fff">${pr ? `${pr.amount ? '<span class="m">' + n0(pr.amount) + '</span> ' : ''}${esc(shortDay(pr.promisedOn))}` : l ? `${esc(shortDay(String(l.sent_on)))} · <span class="m">${daysBetween(String(l.sent_on), todayISO())}</span> d ago` : 'never'}</span></span>
      </div>
      ${lim > 0 ? `<div style="display:flex;flex-direction:column;gap:6px"><div role="img" aria-label="Owes ${n0(c.debt)} against a limit of ${n0(lim)}" style="position:relative;height:12px"><span style="position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.1)"></span><i class="a-grow" style="position:absolute;left:0;top:0;bottom:0;width:${(Math.min(c.debt, lim) / scale * 100).toFixed(1)}%;border-radius:999px 0 0 999px;background:#DDE3F0"></i>${c.debt > lim ? `<i class="a-grow" style="position:absolute;left:${(lim / scale * 100).toFixed(1)}%;top:0;bottom:0;width:${((c.debt - lim) / scale * 100).toFixed(1)}%;border-radius:0 999px 999px 0;background:var(--amber);animation-delay:.6s"></i>` : ''}<i style="position:absolute;left:${(lim / scale * 100).toFixed(1)}%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:2px;background:#fff"></i></div>
        <span style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--navyInk)"><span style="display:inline-flex;align-items:center;gap:5px">${ic('lock', 12)}limit <b class="m" style="color:#fff">${n0(lim)}</b> · owner sets it</span>${c.debt > lim ? `<span style="color:var(--amber)"><span class="m">${n0(c.debt - lim)}</span> over</span>` : `<span><span class="m">${n0(lim - c.debt)}</span> left</span>`}</span></div>` : ''}
    </div>
    <div class="bx-body">
      <div class="bx-sec"><b>Invoices, and what paid them</b><span style="display:flex;gap:10px;font-size:11px"><span style="display:inline-flex;align-items:center;gap:4px"><i style="width:8px;height:8px;border-radius:2px;background:var(--navy)"></i>paid</span><span style="display:inline-flex;align-items:center;gap:4px"><i style="width:8px;height:8px;border-radius:2px;background:var(--soft2);box-shadow:inset 0 0 0 1px #D9D4CB"></i>left</span></span></div>
      ${open.length || settled.length ? `<div class="bx-card" style="padding:0 14px">${(open.length > 8 && !(S.ui.acctAll === c.id) ? open.slice(0, 8) : open).map(q => invRow(q, false)).join('')}${open.length > 8 && S.ui.acctAll !== c.id ? `<button class="ac-more" data-act="acctall" data-id="${esc(c.id)}">${ic('down', 16)}<span>Show all <span class="m">${open.length}</span> open invoices</span><span class="m" style="margin-left:auto;color:var(--ink3)">+${n0(open.slice(8).reduce((s, q) => s + balanceDue(q), 0))}</span></button>` : ''}${settled.map(q => invRow(q, true)).join('')}</div>` : emptyCard('No invoices on file', 'What they owe came from before the invoices were kept here')}
      ${custAging(c).unknown > 0.5 ? `<span class="bx-hint">${ic('clock', 14)}<span class="m">${n0(custAging(c).unknown)}</span> of it is from before the invoices were kept</span>` : ''}
      <span class="bx-hint" style="justify-content:center;color:var(--ink3)">${ic('lock', 13)}Void, credit note, limit, terms — owner</span>
    </div>
    <div class="bx-foot"><div class="row"><button class="bx-btn ghost" style="flex:none;padding:0 16px" data-act="stmt" data-id="${esc(c.id)}">${ic('doc', 18)}Statement</button>${can('payment.receive') ? `<button class="bx-btn red" data-act="receive" data-id="${esc(c.id)}">${ic('cash', 20)}Record a payment</button>` : `<button class="bx-btn ghost" aria-disabled="true">${ic('lock', 18)}Payments: owner</button>`}</div></div>
  </div>`;
};

/* ---- one payment: where it went, written in the books ---- */
PAGE.payment = ({ id }) => {
  const t = txnById(id); if (!t) return `<div class="card"><div class="bx-empty"><b>That payment is not in the last five months of the cash book</b><br><button class="bx-btn ghost" style="flex:none;margin:12px auto 0" data-act="back">Back</button></div></div>`;
  const tr = txnTrace(t), c = tr.cust, who = whoName(t.enteredBy) || 'the owner';
  const open = c ? custOpen(c.id) : [];
  const picks = open.length ? [open[0]].concat(open.slice(1).sort((a, b) => Math.abs(balanceDue(a) - t.amount) - Math.abs(balanceDue(b) - t.amount)).slice(0, 1)) : [];
  const chosen = S.ui.payPick && open.find(q => String(q.id) === String(S.ui.payPick)) || picks[0];
  const more = Math.max(0, open.length - picks.length);
  const flow = tr.onAccount ? `<div class="ac-flow" role="img" aria-label="${n0(t.amount)} lowered the debt only; no invoice was paid">
      <svg width="100%" height="184" viewBox="0 0 358 184" aria-hidden="true" preserveAspectRatio="none">
        ${picks.map((q, i) => `<path class="ac-dash" d="M96 92 C 124 92, 122 ${26 + i * 66}, 150 ${26 + i * 66}" fill="none" stroke="${chosen === q ? '#C93A30' : '#D9D4CB'}" stroke-width="${chosen === q ? 3 : 2}" stroke-dasharray="5 5" stroke-linecap="round"/>`).join('')}
        <path class="ac-flowline" d="M96 92 C 124 92, 122 158, 150 158" fill="none" stroke="#16203C" stroke-width="10" stroke-linecap="round"/></svg>
      <span class="ac-coin">${ic(acctOf(t) === 'bank' ? 'bank' : acctOf(t) === 'momo' ? 'momo' : 'cash', 18, 'style="color:var(--mint)"')}<span class="m">${n0(t.amount)}</span></span>
      ${picks.map((q, i) => { const on = chosen === q, left = balanceDue(q); return `<button class="ac-dest" data-act="paypick" data-v="${q.id}" aria-pressed="${on}" style="top:${i * 66}px;${on ? 'background:#FDE8E4;box-shadow:inset 0 0 0 2px #C93A30' : ''}"><span style="flex:1;display:flex;flex-direction:column;gap:1px;text-align:left"><span class="m" style="font-size:13px;font-weight:600">${invoiceLabel(q)}</span><span style="font-size:11px;font-weight:600;color:var(--ink2)">${on ? 'ask to put it here' : i === 0 ? `oldest · <span class="m">${custBillAge(q)}</span> d` : 'nearest to ' + n0(t.amount)}</span></span><span class="m" style="font-size:13px;font-weight:600">${on ? n0(Math.max(0, left - t.amount)) + ' after' : n0(left)}</span></button>`; }).join('')}
      <span class="ac-dest" style="top:132px;background:var(--amberSoft);box-shadow:inset 0 0 0 1.5px var(--amber)"><span style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:13px;font-weight:700;color:var(--amberDeep)">Their debt only</span><span style="font-size:11px;font-weight:600;color:var(--amberDeep)">${tr.debt ? `<span class="m">−${n0(tr.debt.amount)}</span>` : ''}</span></span><span class="m" style="font-size:13px;font-weight:600;color:var(--amberDeep)">−${n0(t.amount)}</span></span>
    </div>
    ${more ? `<button class="bx-pick" data-act="payfind" data-id="${t.id}" style="margin-left:150px;width:auto;height:48px">${ic('search', 16)}<span style="flex:1;display:flex;flex-direction:column"><span style="font-size:13px;font-weight:700"><span class="m">${more}</span> more open invoices</span><span style="font-size:11px;font-weight:600;color:var(--ink2)">find by number, date or amount</span></span>${ic('chev', 14)}</button>` : ''}`
    : tr.inv.length ? `<div class="bx-card" style="padding:4px 14px">${tr.inv.map(({ q, p }) => { const left = balanceDue(q); return `<div class="ac-inv"><span style="display:flex;align-items:baseline;gap:8px"><span class="m" style="font-size:14px;font-weight:600">${invoiceLabel(q)}</span><span style="font-size:12px;color:var(--ink3)">${esc(shortDay(invoicedOn(q)))}</span><span style="margin-left:auto" class="m">${n0(p.amount)}</span></span><span class="ac-bar"><i class="a-grow" style="flex:${Math.max(0, quoteTotal(q) - left - p.amount)};background:#5C6788"></i><i class="a-grow" style="flex:${p.amount};background:#16203C"></i>${left > 0 ? `<i style="flex:${left}"></i>` : ''}</span><span style="font-size:12px;font-weight:700;color:${left > 0 ? 'var(--ink2)' : 'var(--green)'}">${left > 0 ? `<span class="m">${n0(left)}</span> left on it` : 'cleared it'}</span></div>`; }).join('')}</div>`
    : `<div class="bx-card" style="padding:14px" class="bx-sub">${esc(t.category || 'Receipt')} — not a customer’s invoice payment.</div>`;
  const ask = tr.onAccount && chosen ? `${c ? c.name : 'A customer'}’s ${n0(t.amount)} (${acctWord(t)}, ${shortDay(t.date)}, taken by ${who}) paid no invoice. Please put it on ${invoiceLabel(chosen)}.` : '';
  return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card">
    <div class="bx-body" style="padding-top:8px"><span class="bx-grip" style="background:#D9D4CB"></span>
      <div style="display:flex;align-items:center;gap:10px">${c ? avatar(c.name, c.id, 42, true) : `<span class="bx-av round" style="background:var(--soft2)">${ic('cash', 18)}</span>`}<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span class="bx-eyebrow" style="color:var(--ink3)">One payment</span><span class="ell" style="font-size:17px;font-weight:700">${esc(c ? c.name : txnWho(t))}</span></span>${closeBtn(true)}</div>
      <div class="bx-slip"><div class="bx-slip-in">
        <div class="ac-sliphead"><span>RECEIPT · ${esc(acctWord(t).toUpperCase())}</span><span class="m" style="font-size:24px;letter-spacing:-.02em">${n0(t.amount)}</span></div>
        <div class="ac-kv"><span>When</span><span>${esc(dayLabel(t.date))} · <span class="m">${esc(t.time || '')}</span></span></div>
        <div class="ac-kv"><span>Taken by</span><span>${esc(who)}</span></div>
        <div class="ac-kv" style="border-bottom:none"><span>Booked as</span><span>${esc(t.category || '')}</span></div>
      </div></div>
      <div class="bx-sec"><b>Where it went</b><span style="${tr.onAccount ? 'color:var(--amberInk)' : ''}">${tr.onAccount ? 'paid no invoice · tap where it belongs' : tr.inv.length ? `${tr.inv.length} invoice${tr.inv.length === 1 ? '' : 's'}` : ''}</span></div>
      ${flow}
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <span class="ac-w"><span>CASH BOOK ${ic('tick', 13, 'style="color:var(--green);stroke-width:3"')}</span><b class="m">+${n0(t.amount)}</b><small>${esc(acctWord(t))} · line <span class="m">#${t.id}</span></small></span>
        <span class="ac-w" ${tr.debt ? '' : 'style="background:var(--soft)"'}><span>DEBT LEDGER ${tr.debt ? ic('tick', 13, 'style="color:var(--green);stroke-width:3"') : '—'}</span><b class="m">${tr.debt ? '−' + n0(tr.debt.amount) : '—'}</b><small>${c ? `now <span class="m">${n0(c.debt)}</span>` : ''}</small></span>
        <span class="ac-w" style="${tr.inv.length ? '' : 'background:var(--amberFaint);box-shadow:inset 0 0 0 1px #F5D3AE;color:var(--amberDeep)'}"><span>INVOICE ${tr.inv.length ? ic('tick', 13, 'style="color:var(--green);stroke-width:3"') : '—'}</span><b>${tr.inv.length ? tr.inv.map(x => invoiceLabel(x.q)).join(', ') : 'none'}</b><small>${tr.inv.length ? '' : 'still open'}</small></span>
      </div>
    </div>
    <div class="bx-foot">
      <span class="bx-hint" style="justify-content:center;color:var(--ink3)">${ic('lock', 13)}A recorded payment changes only by the owner’s hand</span>
      ${ask ? `<a class="bx-btn red" href="${esc(waComposeUrl(D().presetOwnerPhone, ask))}" target="_blank" rel="noopener">${ic('wa', 20)}Ask the owner to put it on ${invoiceLabel(chosen)}</a>` : `<button class="bx-btn ghost" data-act="back">Done</button>`}
    </div>
  </div>`;
};
ACT.payment = t => { if (!t.dataset.id) return; S.ui.payPick = null; FEEL.open(); push('payment', { id: t.dataset.id }); };
ACT.paypick = t => { S.ui.payPick = t.dataset.v; FEEL.tick(); render(); };
ACT.payfind = t => { FEEL.open(); push('find', { id: t.dataset.id }); };

PAGE.find = ({ id }) => {
  const t = txnById(id), tr = t ? txnTrace(t) : null, c = tr && tr.cust; if (!c) return `<div class="card"><div class="bx-empty"><b>No customer on this payment</b><br><button class="bx-btn ghost" style="flex:none;margin:12px auto 0" data-act="back">Back</button></div></div>`;
  const sort = S.ui.findSort || 'old', q = String(S.ui.findQ || '').trim().toLowerCase().replace(/^inv-?/, '').replace(/,/g, '');
  let open = custOpen(c.id).slice();
  if (q) open = open.filter(x => String(x.id).includes(q) || String(Math.round(balanceDue(x))).includes(q) || shortDay(invoicedOn(x)).toLowerCase().includes(q) || invoicedOn(x).includes(q));
  if (sort === 'near') open.sort((a, b) => Math.abs(balanceDue(a) - t.amount) - Math.abs(balanceDue(b) - t.amount));
  else if (sort === 'big') open.sort((a, b) => balanceDue(b) - balanceDue(a));
  const all = custOpen(c.id), max = Math.max(1, ...all.map(balanceDue));
  const pick = all.find(x => String(x.id) === String(S.ui.payPick)) || all[0];
  const shown = open.slice(0, S.ui.findMore || 30);
  const ask = pick ? `${c.name}’s ${n0(t.amount)} (${acctWord(t)}, ${shortDay(t.date)}) paid no invoice. Please put it on ${invoiceLabel(pick)}.` : '';
  return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card">
    <div style="background:#fff;padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line)"><span class="bx-grip" style="background:#D9D4CB"></span>
      <div style="display:flex;align-items:center;gap:10px"><span style="width:44px;height:44px;border-radius:14px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none">${ic('cash', 14, 'style="color:var(--mint)"')}<span class="m" style="font-size:10px;font-weight:600">${t.amount >= 1e6 ? (t.amount / 1e6).toFixed(1) + 'M' : Math.round(t.amount / 1000) + 'K'}</span></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:17px;font-weight:700">Which invoice was it for?</span><span class="bx-sub ell">${esc(c.name)} · <span class="m">${all.length}</span> open · <span class="m">${n0(c.debt)}</span></span></span>${closeBtn(true)}</div>
      <label style="display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--soft)">${ic('search', 18, 'style="color:var(--ink2)"')}<input id="find_q" data-in="findq" type="search" placeholder="Number, date or amount" value="${esc(S.ui.findQ || '')}" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px"></label>
      <div role="radiogroup" aria-label="Sort" style="display:flex;gap:6px">${[['old', 'Oldest first'], ['near', 'Nearest ' + n0(t.amount)], ['big', 'Biggest']].map(([k, w]) => `<button role="radio" aria-checked="${sort === k}" data-act="findsort" data-v="${k}" class="bx-chip" style="border:none;height:34px;font-size:13px;${sort === k ? 'background:var(--navy);color:#fff' : 'background:var(--soft);color:var(--ink);font-weight:600'}">${esc(w)}</button>`).join('')}</div>
    </div>
    <div class="bx-body">
      ${shown.length ? `<div class="bx-card" style="padding:0 12px">${shown.map(x => { const on = pick === x, left = balanceDue(x), after = left - t.amount;
        return `<button class="bx-row" role="radio" aria-checked="${on}" data-act="findpick" data-v="${x.id}" style="display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px">
          <span style="width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px ${on ? 'var(--red)' : '#D9D4CB'}">${on ? '<i style="width:10px;height:10px;border-radius:999px;background:var(--red)"></i>' : ''}</span>
          <span style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="display:flex;gap:6px;align-items:baseline"><span class="m" style="font-size:14px;font-weight:600">${invoiceLabel(x)}</span><span class="bx-sub" style="font-weight:600">${esc(shortDay(invoicedOn(x)))} · <span class="m">${custBillAge(x)}</span> d</span></span><span style="height:4px;border-radius:999px;background:var(--soft2);overflow:hidden"><i style="display:block;height:100%;width:${(left / max * 100).toFixed(0)}%;background:${on ? 'var(--red)' : custBillAge(x) > 15 ? 'var(--amber)' : 'var(--mint)'}"></i></span></span>
          <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="m" style="font-size:14px;font-weight:600">${n0(left)}</span><span style="font-size:11px;font-weight:700;color:${after <= 0 ? 'var(--green)' : on ? 'var(--red)' : 'var(--ink4)'}">${after <= 0 ? 'clears it' : n0(after) + ' left'}</span></span></button>`; }).join('')}</div>` : emptyCard('No open invoice matches', 'Try the number without INV, a date or the amount')}
      ${open.length > shown.length ? `<button class="bx-btn ghost" style="flex:none;height:46px;font-size:14px" data-act="findmore"><span class="m">${open.length - shown.length}</span> more · show them</button>` : ''}
    </div>
    ${pick ? `<div class="bx-dock"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--navyInk)"><span>${invoiceLabel(pick)} after</span><span><span class="m" style="text-decoration:line-through;color:var(--navyInk2)">${n0(balanceDue(pick))}</span> → <b class="m" style="color:${balanceDue(pick) - t.amount <= 0 ? 'var(--mint)' : '#fff'}">${n0(Math.max(0, balanceDue(pick) - t.amount))}</b></span></div>
      <a class="bx-btn red" href="${esc(waComposeUrl(D().presetOwnerPhone, ask))}" target="_blank" rel="noopener">${ic('wa', 20)}Ask the owner: put it on ${invoiceLabel(pick)}</a></div>` : ''}
  </div>`;
};
ACT['in:findq'] = t => { S.ui.findQ = t.value; render(); };
ACT.findsort = t => { S.ui.findSort = t.dataset.v; FEEL.tick(); render(); };
ACT.findpick = t => { S.ui.payPick = t.dataset.v; FEEL.tick(); render(); };
ACT.findmore = () => { S.ui.findMore = (S.ui.findMore || 30) + 30; render(); };

/* ==================================================================
   RECORD A PAYMENT — they choose the invoices (the owner's picker),
   the Sales app's write.
   ================================================================== */
ACT.receive = t => {
  if (!can('payment.receive')) { toast('Recording payments needs “Record payments in” — ask the owner to switch it on', 5000); return; }
  FEEL.open(); closeSheet(true);
  const id = t.dataset.id;
  push('receive', id ? { id, picks: null, amt: null, method: 'cash', receipt: true } : { pick: true });
};
PAGE.receive = a => {
  if (a.pick) {
    const q = String(S.ui.rcvQ || '').trim().toLowerCase();
    const list = (q ? D().customers.filter(c => [c.name, c.phone, c.phone2, c.location].some(v => String(v || '').toLowerCase().includes(q))) : debtors().slice().sort((x, y) => y.debt - x.debt)).slice(0, 40);

// A one-page PDF around the painted picture, for those who want a file.
async function pngToPdf(blob){
  const img = await createImageBitmap(blob), cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;

  const jpg = new Uint8Array(await (await new Promise(ok => cv.toBlob(ok, 'image/jpeg', .92))).arrayBuffer());
  const PW = 595.28, PH = Math.max(PW, PW * img.height / img.width);

  const add = p => { const b = typeof p === 'string' ? enc.encode(p) : p; parts.push(b); len += b.length; };

      </div>
      <div style="position:relative">
        ${b.photo && b.photo.path ? `<button class="ac-photo" data-act="billphoto" data-v="${b.id}" aria-label="Photo of their paper bill. Tap to open"><i style="height:4px;width:70%;background:var(--indigo)"></i><i></i><i style="width:80%"></i><i></i><span>${ic('cam', 10, 'style="stroke-width:2.2"')}photo</span></button>` : ''}
        <div class="bx-slip"><div class="bx-slip-in" style="padding:6px 16px 4px">
          <div style="display:flex;flex-direction:column;gap:2px;padding:0 ${b.photo ? 66 : 0}px 8px 0;border-bottom:1.5px solid var(--ink)"><span style="font-size:11px;font-weight:700;letter-spacing:.12em">THEIR BILL · <span class="m">${esc(billRef(b))}</span></span><span style="font-size:12px;color:var(--ink3)">${esc(b.date ? new Date(String(b.date).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '')}${who ? ' · bought by ' + esc(who) : ''}${b.supplierRef ? ' · ' + esc(billLabel(b)) : ''}</span></div>
          ${rows.map((r, i) => { const q = Number(r.it.qty) || 0, pct = r.got == null ? 0 : Math.min(1, r.got / (q || 1)); return `<div class="ac-it" style="${i === rows.length - 1 ? 'border-bottom:none' : ''}"><span class="ell" style="font-size:14px;font-weight:600"><span class="m">${n0(q)}</span> × ${esc(r.it.productName || 'Item')}</span><span class="m" style="font-size:14px;font-weight:600">${n0(q * (Number(r.it.price) || 0))}</span>
            <span class="ac-rc" style="color:${r.full === true ? 'var(--green)' : r.full === false ? 'var(--amberInk)' : 'var(--ink4)'}"><span class="trk"><i class="a-grow" style="width:${(pct * 100).toFixed(0)}%;animation-delay:${.3 + i * .15}s"></i></span><span style="display:inline-flex;align-items:center;gap:3px">${r.full === true ? ic('tick', 11, 'style="stroke-width:3.2"') : ''}${r.got == null ? 'no stock record' : `<span class="m">${n0(r.got)}</span> of <span class="m">${n0(q)}</span> came in`}</span></span></div>`; }).join('')}
          ${Number(b.transport) > 0 ? `<div class="ac-it" style="border-bottom:none;border-top:1px dashed var(--dash)"><span style="font-size:13px;font-weight:600;color:var(--ink2)">Transport</span><span class="m" style="font-size:13px">${n0(b.transport)}</span></div>` : ''}
          <div style="display:flex;align-items:baseline;justify-content:space-between;padding:9px 0 8px;border-top:1.5px solid var(--ink)"><span style="display:flex;flex-direction:column;gap:1px"><span style="font-size:13px;font-weight:700">Bill total</span><span style="font-size:11px;color:var(--ink3)">paid so far <span class="m">${n0(b.amountPaid)}</span></span></span><span class="m" style="font-size:18px;font-weight:600">${n0(purchaseInvoiceTotal(b))}</span></div>
          ${allIn ? `<span class="ac-match" style="color:var(--green);background:rgba(228,244,234,.6)"><b>MATCHES</b><small>INTO STOCK${inDate ? ' ' + esc(new Date(inDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }).toUpperCase()) : ''}</small></span>` : anyShort ? `<span class="ac-match" style="color:var(--amberInk);background:rgba(253,238,225,.7)"><b>SHORT</b><small>CHECK BEFORE PAYING</small></span>` : ''}
        </div></div>
      </div>
      ${(b.payments || []).length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;padding:0 2px">${b.payments.map(p => `<span class="bx-chip" style="background:#EEF0F6;color:var(--navy)">${ic('tick', 11, 'style="stroke-width:3"')}<span class="m">${n0(p.amount)}</span> ${esc(shortDay(p.date))}</span>`).join('')}</div>` : ''}
    </div>
    ${left > 0.5 ? `<div class="ac-paydock">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <label style="display:flex;align-items:baseline;gap:6px;min-width:0"><span class="m" style="font-size:13px;font-weight:600;color:var(--navyInk2)">UGX</span><input class="ac-amt" id="bill_amt" data-in="billamt" inputmode="numeric" aria-label="Amount to pay" value="${n0(amt)}" ${a.mode === 'all' ? 'readonly' : ''}></label>
        <span class="ac-allpart"><button aria-pressed="${a.mode === 'all'}" data-act="billmode" data-v="all">All</button><button aria-pressed="${a.mode === 'part'}" data-act="billmode" data-v="part">Part</button></span>
      </div>
      ${payFromHTML(a, amt, 'billfrom')}
      ${can('bill.pay') ? slideHTML('billone', a.busy ? 'Paying…' : amt > 0 ? `Slide to pay ${n0(amt)}` : 'Type an amount', 'arrow', { disabled: a.busy || !(amt > 0) || inHandBy()[a.from] < amt, amber: true }) : lockedNote('bill.pay')}
    </div>` : `<div class="bx-foot"><span class="bx-chip" style="align-self:center;height:32px;background:var(--greenSoft);color:var(--green)">${ic('tick', 14, 'style="stroke-width:3"')}Paid in full</span></div>`}
  </div>`;
};
ACT.bill = t => { FEEL.open(); push('bill', { id: Number(t.dataset.v) }); };
ACT.billmode = t => { const a = topArgs(); a.mode = t.dataset.v; if (a.mode === 'part' && !a.amt) { const b = D().bills.find(x => Number(x.id) === Number(a.id)); a.amt = Math.round(billDue(b) / 2); } FEEL.tick(); render(); if (a.mode === 'part') { const el = document.getElementById('bill_amt'); if (el) { el.focus(); el.select(); } } };
ACT['in:billamt'] = t => { const a = topArgs(); a.amt = parseMoney(t.value); clearTimeout(ACT._billT); ACT._billT = setTimeout(render, 450); };
ACT['slide:billone'] = async () => {
  const a = topArgs(), b = D().bills.find(x => Number(x.id) === Number(a.id)); if (!b || a.busy) return;
  const amt = a.mode === 'all' ? billDue(b) : Math.min(billDue(b), Number(a.amt) || 0);
  if (!(amt > 0)) return;
  a.sid = supplierKey(b);
  await payAndConfirm(a, [b], { [b.id]: amt });
};
ACT.billphoto = async t => {
  const b = D().bills.find(x => Number(x.id) === Number(t.dataset.v)); if (!b || !b.photo) return;
  try { const { data, error } = await sb.storage.from('bill-photos').createSignedUrl(b.photo.path, 3600); if (error) throw error; window.open(data.signedUrl, '_blank'); }
  catch (e) { toast(isNetworkError(e) ? 'No connection — the photo needs signal.' : 'Could not open the photo: ' + (e.message || e)); }
};

/* ==================================================================
   YOU — the keys this login holds, the ones proposed, the owner's locks.
   ================================================================== */
const OWNER_KEEPS = ['Edit or void a payment', 'Void an invoice, credit notes', 'Credit limits and terms', 'Opening balance, reopen a day', 'Restore a backup', 'Costs and margins'];
PAGE.me = () => {
  const keys = Object.keys(TASK_WORDS), mine = keys.filter(k => can(k)), prop = keys.filter(k => !can(k));
  const nm = myName(), owner = S.role === 'owner' || S.role === 'admin';
  const ring = [];
  const slots = mine.length + prop.length, spread = Math.min(30, 120 / Math.max(1, slots));
  [...mine.map(k => ['key', k]), ...prop.map(k => ['ghost', k]), ['lock', '']].forEach(([kind], i, arr) => {
    const ang = (i - (arr.length - 1) / 2) * spread, x = 177 + (i - (arr.length - 1) / 2) * 26, y = 30 + Math.abs(ang) * .15;
    if (kind === 'key') ring.push(`<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${(-ang).toFixed(0)})"><circle cx="0" cy="12" r="9" fill="#6FDCB0"/><circle cx="0" cy="12" r="3.5" fill="#16203C"/><rect x="-2.5" y="20" width="5" height="42" rx="2" fill="#6FDCB0"/><rect x="2" y="50" width="8" height="4" rx="1" fill="#6FDCB0"/><rect x="2" y="57" width="6" height="4" rx="1" fill="#6FDCB0"/></g>`);
    else if (kind === 'ghost') ring.push(`<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${(-ang).toFixed(0)})" fill="none" stroke="#DDE3F0" stroke-width="1.8" stroke-dasharray="3 3"><circle cx="0" cy="12" r="9"/><path d="M0 21v40M0 48h7M0 55h9"/></g>`);
    else ring.push(`<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${(-ang).toFixed(0)})"><rect x="-11" y="16" width="22" height="18" rx="4" fill="#5C6788"/><path d="M-6 16v-5a6 6 0 0 1 12 0v5" fill="none" stroke="#5C6788" stroke-width="3"/><circle cx="0" cy="25" r="2.5" fill="#16203C"/></g>`);
  });
  const k = (word, code, style) => `<span class="ac-key" style="${style}"><span style="display:flex;flex-direction:column;gap:2px"><span>${esc(word)}</span>${code ? `<span class="m" style="font-size:10px;font-weight:500;color:var(--ink2)">${esc(code)}</span>` : ''}</span></span>`;
  return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card">
    <div class="bx-sheethead"><span class="bx-grip"></span>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:48px;height:48px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--mint);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none">${esc(initials(nm))}</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="ell" style="font-size:18px;font-weight:700">${esc(nm)}</span><span style="font-size:12px;color:var(--navyInk);display:inline-flex;align-items:center;gap:5px"><i class="bx-dot" style="background:var(--mint)"></i>${esc(S.role === 'accounts' ? 'Accounts' : S.role ? S.role[0].toUpperCase() + S.role.slice(1) : '')} login · ${esc(S.shopName)}</span></span>${closeBtn()}</div>
      <svg role="img" aria-label="Your key ring: ${mine.length} keys you hold, ${prop.length} proposed, the owner keeps ${OWNER_KEEPS.length} locks" viewBox="0 0 354 112" style="width:100%;height:112px"><g class="ac-swing"><circle cx="177" cy="22" r="16" fill="none" stroke="#DDE3F0" stroke-width="3"/>${ring.join('')}</g></svg>
      <span style="display:flex;justify-content:center;gap:14px;font-size:11px;font-weight:600;color:var(--navyInk)"><span style="display:inline-flex;align-items:center;gap:5px"><i class="bx-dot" style="width:9px;height:9px;background:var(--mint)"></i>yours</span><span style="display:inline-flex;align-items:center;gap:5px"><i class="bx-dot" style="width:9px;height:9px;box-shadow:inset 0 0 0 1.5px #DDE3F0"></i>proposed</span><span style="display:inline-flex;align-items:center;gap:5px"><i style="width:9px;height:9px;border-radius:2px;background:#5C6788"></i>owner keeps</span></span>
    </div>
    <div class="bx-body">
      <span class="ac-h"><i class="bx-dot" style="width:10px;height:10px;background:var(--green)"></i>Yours${owner ? ' — every key, as ' + esc(S.role) : ''}<span class="m">${mine.length + 2}</span></span>
      <div class="ac-keys">${k('See all the books', '', 'background:var(--greenSoft);color:var(--green)')}<button class="ac-key" data-act="backup" style="border:none;background:var(--greenSoft);color:var(--green);text-align:left">${ic('download', 16)}Download a backup</button>${mine.map(x => k(TASK_WORDS[x], x, 'background:var(--greenSoft);color:var(--green)')).join('')}</div>
      ${prop.length ? `<span class="ac-h" style="padding-top:4px"><i class="bx-dot" style="width:10px;height:10px;box-shadow:inset 0 0 0 2px var(--ink)"></i>Proposed for accounts<span class="m">${prop.length} task${prop.length === 1 ? '' : 's'}</span></span>
      <div class="ac-keys">${prop.map(x => k(TASK_WORDS[x], x, 'background:#fff;box-shadow:inset 0 0 0 1.5px var(--navyInk)')).join('')}</div>
      <span class="bx-hint">${ic('lock', 14)}The owner turns these on — migration 0117 in the Supabase SQL editor</span>` : ''}
      <span class="ac-h" style="padding-top:4px">${ic('lock', 14)}Owner keeps<span class="m">${OWNER_KEEPS.length}</span></span>
      <div class="ac-keys">${OWNER_KEEPS.map(x => k(x, '', 'background:var(--soft2);color:var(--ink2)')).join('')}</div>
      <div class="bx-card bx-list" style="margin-top:4px">${[['sound', 'Sounds & buzz', 'the till, the stamp, the chime', 'sound'], ['big', 'Big text', 'easier to read at the counter', 'big']].map(([key, w, sub, icn], i) => `<div style="display:flex;align-items:center;gap:12px;min-height:58px;${i ? 'border-top:1px solid #F1EEE8' : ''}"><span style="width:32px;height:32px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none">${ic(icn, 17)}</span><span style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:14px;font-weight:700">${w}</span><span class="bx-sub">${sub}</span></span><button class="bx-switch" role="switch" aria-checked="${!!S.prefs[key]}" aria-label="${w}" data-act="pref" data-k="${key}"></button></div>`).join('')}</div>
    </div>
    <div class="bx-foot"><div class="row"><button class="bx-btn ghost" style="height:52px;font-size:15px" data-act="signout">${ic('out', 18)}Sign out</button></div></div>
  </div>`;
};
ACT.pref = t => { const key = t.dataset.k; S.prefs[key] = !S.prefs[key]; savePrefs(); applyPrefs(); if (key === 'sound' && S.prefs.sound) FEEL.yes(); render(); };
ACT.signout = async () => { try { await sb.auth.signOut(); } catch (_e) {} location.reload(); };
ACT.backup = async () => {
  try {
    const blob = new Blob([JSON.stringify({ shop: S.shopName, at: new Date().toISOString(), data: S.data }, null, 1)], { type: 'application/json' });
    const name = `omni-ware-books-${todayISO()}.json`, C = window.Capacitor;
    if (C && C.isNativePlatform && C.isNativePlatform()) { await shareBlob(blob, name, `Books backup · ${S.shopName}`, '', 'Books backup'); return; }
    const url = URL.createObjectURL(blob), el = document.createElement('a'); el.href = url; el.download = name; document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Backup saved to Downloads');
  } catch (e) { toast('Could not make the backup: ' + (e.message || e)); }
};

// A refresh as soon as there is signal again.
window.addEventListener('online', () => { if (S.started && quiet()) loadAll().then(() => { if (quiet()) render(); }).catch(() => {}); });

boot();
</script>
</body>
</html>
