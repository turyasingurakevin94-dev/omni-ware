name: Build worker view APK

on:
  push:
    branches: [main]
    paths:
      - 'worker.html'
      - 'shared-worker.js'
      - 'sw.js'
      - 'worker-www/**'
      - 'manifest-worker.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'android/**'
      - '.github/workflows/build-worker-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Before the install, since the suite needs no dependencies -- so a
      # failure here costs seconds rather than a whole toolchain setup.
      # The APK ships worker-www/, and one of these checks is that it still
      # matches the root files it is copied from; building a drifted or
      # unparseable app and handing someone the artifact is the outcome
      # worth preventing.
      - name: Run tests
        run: npm test

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniware-worker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
