name: Build agent app (Android + iPhone)

# The agent app is agent.html inside a native shell (apps/agent). Every
# change to either is built for both phones, so a broken shell is caught
# here and not on an agent's phone. Android hands back an installable
# debug APK; iPhone builds for the simulator, which proves the project
# compiles -- a phone install needs the Apple signing set up in
# apps/agent/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'agent.html'
      - 'apps/agent/**'
      - '.github/workflows/build-agent-app.yml'
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build www from agent.html
        run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: apps/agent/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: omniware-agent-debug-apk
          path: apps/agent/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build www from agent.html
        run: npm run build
      - run: npx cap sync ios
      - name: Build for the simulator (no signing)
        working-directory: apps/agent/ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
