name: Build buyer app (Android)

# The buyer app is the new Buyer app (buyer.html at the root, built from
# src/apps/buyer; switched 2026-11-11, docs/rebuild.md) inside a native shell
# (apps/buyer). Every change to either is built, and Android hands back an
# installable debug APK under the run's Artifacts. Installed phones then keep
# current by the page's own live update (src/native/update.ts).

on:
  push:
    branches: [main]
    paths:
      - 'buyer.html'
      - 'buyer-demo.js'
      - 'src/**'
      - 'apps/buyer/**'
      - '.github/workflows/build-buyer-app.yml'
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/buyer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build www from the built buyer.html
        run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: apps/buyer/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: omniware-buyer-debug-apk
          path: apps/buyer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
