name: Build store app (Android)

# The store app is the new Store app (store.html at the root, built from
# src/apps/store, with its area files store-<area>.js; switched 2026-11-12,
# docs/rebuild.md) inside a native shell (apps/store). Every change to either
# is built, and Android hands back an installable debug APK under the run's
# Artifacts. Installed phones then keep current by the page's own live update
# (src/native/update.ts).

on:
  push:
    branches: [main, claude/store-app]
    paths:
      - 'store.html'
      - 'store-*.js'
      - 'src/**'
      - 'apps/store/**'
      - '.github/workflows/build-store-app.yml'
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build www from the built store.html
        run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: apps/store/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: omniware-store-debug-apk
          path: apps/store/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
