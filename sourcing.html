<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16203C">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>Omni-Ware Sourcing</title>
<!-- The phone app's native layer (apps/sourcing). Inert in a browser. It
     lives here rather than in the app's own files so a fix to it reaches
     installed phones the same way any change to this page does. -->
<script>
/* The Sourcing page inside the Android app (apps/sourcing).

   First in <head>, and only does anything inside the app. Four jobs:

   1. Back (Android) closes what is on top -- a photo, a sheet, then the tab
      -- before it ever leaves the app, and leaving only puts it in the
      background so it reopens instantly.
   2. The status bar: the page draws to the top edge, so a strip behind the
      clock takes the colour of whatever is under it, and its icons stay
      readable against it.
   3. The bars' size: Capacitor measures them into --safe-area-inset-*,
      but a page it has not measured (some phones, after a reload) would
      read zero and slide under the clock -- so the last good measurement
      stands in until it does.
   4. Staying current without a store release: the installed app checks the
      live sourcing.html now and then, keeps a copy of a new one on the phone,
      and switches to it the next time the app goes to the background --
      never in the middle of a visit. */
(function(){
  'use strict';
  var C = window.Capacitor;
  if(!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return;
  var P = C.Plugins || {};
  var App = P.App, Bars = P.SystemBars, WebView = P.WebView, Http = P.CapacitorHttp, FS = P.Filesystem;
  var NAVY = '#16203C';
  var root = document.documentElement;
  // The first installs carried this layer as their own native.js. On those
  // it is already running from above, and only the bars' size (3) is new.
  var legacy = !!document.querySelector('script[src="native.js"]');

  window.owHaptic = function(kind){
    var H = P.Haptics;
    if(!H) return;
    (kind === 'success' ? H.notification({ type: 'SUCCESS' }) : kind === 'warn' ? H.notification({ type: 'WARNING' }) : H.impact({ style: 'LIGHT' })).catch(function(){});
  };

  /* ---- 1. back ---- */
  // The page keeps its own stack of what is open (window.bxBack): a sheet,
  // then a screen pushed over a tab, then the tab itself back to Today.
  function back(){
    if(typeof window.bxBack === 'function' && window.bxBack()) return;
    if(App) App.minimizeApp();
  }
  if(App && !legacy) App.addListener('backButton', back);

  /* ---- 2. the strip behind the status bar ---- */
  var strip = null, lastStyle = '';
  function paintBar(){
    if(!strip) return;
    var top = strip.offsetHeight;
    // Today's navy hero is marked data-navy-top. A pushed page opens on its
    // own dark ground -- the tap-to-go-back strip -- unless it is a page
    // whose navy hero has scrolled away under the clock.
    var page = document.querySelector('#bx_pages .bx-page:last-child');
    var navy = (page || document).querySelector('[data-navy-top]:not([hidden])');
    var navyAtTop = !!navy && navy.getBoundingClientRect().top <= top && navy.getBoundingClientRect().bottom > top;
    var ground = page ? getComputedStyle(page).backgroundColor : '';
    var rgb = (ground.match(/\d+/g) || []).map(Number);
    var darkGround = !navyAtTop && !navy && rgb.length >= 3 && (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000 < 90;
    var auth = !!document.querySelector('.bx-auth');
    strip.style.background = auth || navyAtTop ? NAVY : darkGround ? ground : 'var(--bg)';
    var style = auth || navyAtTop || darkGround || document.querySelector('.bx-scrim') ? 'DARK' : 'LIGHT';
    if(style !== lastStyle && Bars){ lastStyle = style; Bars.setStyle({ style: style }).catch(function(){}); }
  }
  var queued = false;
  function soon(){ if(queued) return; queued = true; requestAnimationFrame(function(){ queued = false; paintBar(); }); }
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(insets, 800);
    setTimeout(insets, 2500);
    window.addEventListener('resize', function(){ setTimeout(insets, 300); });
    if(App) App.addListener('resume', function(){ setTimeout(insets, 300); });
    if(legacy) return;
    strip = document.createElement('div');
    strip.setAttribute('aria-hidden', 'true');
    strip.style.cssText = 'position:fixed;top:0;left:0;right:0;height:var(--safe-t, 0px);z-index:59;pointer-events:none;background:' + NAVY + ';';
    document.body.appendChild(strip);
    new MutationObserver(soon).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class'] });
    document.addEventListener('scroll', soon, { passive: true, capture: true });
    paintBar();
  });


  /* ---- 3. the bars' size ---- */
  var INSETS = 'ow-app-insets';
  function insets(){
    if(typeof C.getPlatform === 'function' && C.getPlatform() !== 'android') return;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:var(--safe-t, 0px);padding-bottom:var(--safe-b, 0px);';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe), top = parseFloat(cs.paddingTop) || 0, bottom = parseFloat(cs.paddingBottom) || 0;
    probe.remove();
    var measured = root.style.getPropertyValue('--safe-area-inset-top') !== '';
    // Some phones (older Android, no edge-to-edge) lay the page out below
    // the status bar themselves yet still report its height: the page is
    // already clear of the clock, so reserving the height again leaves an
    // empty band. Judged with no keyboard up, which also shortens the page.
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
    if(top > 0 && !typing){
      var gap = screen.height - window.innerHeight, below = gap >= top - 2;
      if(below) root.style.setProperty('--safe-t', '0px');
      if(below && bottom > 0 && gap >= top + bottom - 2) root.style.setProperty('--safe-b', '0px');
      if(below) return;
    }
    var last = {};
    try{ last = JSON.parse(localStorage.getItem(INSETS)) || {}; }catch(_e){}
    if(measured && top > 0){
      if(last.top !== top || last.bottom !== bottom){ try{ localStorage.setItem(INSETS, JSON.stringify({ top: top, bottom: bottom, ours: false })); }catch(_e){} }
      return;
    }
    // Measured at zero: Android has laid the page out below its bars itself.
    if(measured || top > 0) return;
    // Not measured, and the page fills the whole screen -- it is under the
    // bars with nothing telling it how tall they are.
    if(!last.top && Math.abs(screen.height - window.innerHeight) > 16) return;
    root.style.setProperty('--safe-area-inset-top', (last.top || 32) + 'px');
    root.style.setProperty('--safe-area-inset-bottom', (last.bottom || 32) + 'px');
  }

  /* ---- 4. staying current ---- */
  if(legacy || !(WebView && Http && FS && App && window.crypto && crypto.subtle)) return;
  var SOURCE = 'https://omni-ware.vercel.app/sourcing.html';
  var KEY = 'ow-sourcing-bundle';
  var EVERY = 30 * 60 * 1000;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(_e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_e){} }
  function header(h, name){
    var k = Object.keys(h || {}).filter(function(x){ return x.toLowerCase() === name; })[0];
    return k ? h[k] : '';
  }
  function sha256(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  // A file of the bundle running now, as base64 for the Filesystem plugin.
  function fileB64(name){
    return fetch(name, { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error(name + ': ' + r.status);
      return r.blob();
    }).then(function(blob){
      return new Promise(function(ok, fail){
        var fr = new FileReader();
        fr.onload = function(){ ok(String(fr.result).split(',')[1] || ''); };
        fr.onerror = fail;
        fr.readAsDataURL(blob);
      });
    });
  }
  function current(){ return fetch('bundle.json', { cache: 'no-store' }).then(function(r){ return r.json(); }); }

  // After a switch: make the new copy the one the app opens with, and drop
  // the copies nothing points at any more.
  function settle(){
    var s = load();
    if(!s.staged) return Promise.resolve();
    return WebView.getServerBasePath().then(function(cur){
      if(!cur || cur.path !== s.staged.path) return;
      return WebView.persistServerBasePath().then(function(){
        var keep = s.staged.dir;
        s.etag = s.staged.etag;
        delete s.staged;
        save(s);
        return FS.readdir({ path: 'live', directory: 'DATA' }).then(function(r){
          return Promise.all((r.files || []).map(function(f){
            var n = typeof f === 'string' ? f : f.name;
            return n === keep.split('/').pop() ? null : FS.rmdir({ path: 'live/' + n, directory: 'DATA', recursive: true }).catch(function(){});
          }));
        }).catch(function(){});
      });
    });
  }

  function check(){
    var s = load();
    if(s.staged || Date.now() - (s.checked || 0) < EVERY) return Promise.resolve();
    s.checked = Date.now();
    save(s);
    return Promise.all([current(), Http.request({ url: SOURCE, method: 'GET', responseType: 'text',
      headers: s.etag ? { 'If-None-Match': s.etag } : {} })]).then(function(pair){
      var mine = pair[0], res = pair[1];
      if(res.status !== 200) return;
      var html = typeof res.data === 'string' ? res.data : '';
      // Half a page is worse than an old page.
      if(html.length < 100000 || html.indexOf('</html>') === -1) return;
      var etag = header(res.headers, 'etag');
      return sha256(html).then(function(hash){
        if(hash === mine.source){ s.etag = etag; save(s); return; }
        var dir = 'live/' + hash.slice(0, 16);
        var rest = (mine.files || []).filter(function(f){ return f !== 'index.html' && f !== 'bundle.json'; });
        return FS.writeFile({ path: dir + '/index.html', data: window.owAppTransform(html), directory: 'DATA', encoding: 'utf8', recursive: true })
          .then(function(){
            return rest.reduce(function(p, f){
              return p.then(function(){ return fileB64(f); })
                .then(function(b64){ return FS.writeFile({ path: dir + '/' + f, data: b64, directory: 'DATA', recursive: true }); });
            }, Promise.resolve());
          })
          .then(function(){
            return FS.writeFile({ path: dir + '/bundle.json', data: JSON.stringify({ source: hash, files: mine.files }), directory: 'DATA', encoding: 'utf8', recursive: true });
          })
          .then(function(){ return FS.getUri({ path: dir, directory: 'DATA' }); })
          .then(function(u){
            var s2 = load();
            s2.staged = { dir: dir, path: decodeURI(String(u.uri).replace(/^file:\/\//, '')), etag: etag };
            save(s2);
          });
      });
    }).catch(function(){
      // No signal, or the server is down: the copy already here carries on.
    });
  }

  App.addListener('pause', function(){
    var s = load();
    if(s.staged) WebView.setServerBasePath({ path: s.staged.path }).catch(function(){});
  });
  App.addListener('resume', function(){ check(); });
  settle().catch(function(){}).then(function(){ setTimeout(check, 5000); });
})();
</script>

<!-- The faces load without holding the page up: media="print" keeps the
     sheet off the critical path and onload swaps it in once it lands. A
     phone in a Kikuubo basement on one bar never waits on a font. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ================= THE SOURCING APP =================
   The agent app's design system (agent.html :root), the owner's choice
   for this app: navy carries money and state, white carries work, one
   red button is the move, every number in the mono face. The screens
   carry their own styles inline, exactly as the canvas drew them. */
:root{
  --ow-navy:#16203C; --ow-navy-2:#243052; --ow-navy-3:#2A3350;
  --ow-steel-050:#F7F5F2; --ow-steel-100:#E0DCD4; --ow-paper:#FFFFFF; --ow-tile:#F1EEE8;
  --ow-oxide:#C93A30; --ow-oxide-deep:#A82D24; --ow-oxide-soft:#FDE8E4;
  --ow-verdigris:#0F6B43; --ow-verdigris-soft:#E4F4EA; --ow-amber:#95530C; --ow-amber-soft:#FDEEE1; --ow-amber-ink:#7A4A02;
  --ow-crimson:#8E2A22; --ow-crimson-soft:#FBE5E2; --ow-mint:#6FDCB0; --ow-on-navy:#B3BCD2;
  --ow-ink-900:#1C2233; --ow-ink-600:#5F6980; --ow-ink-400:#6B7480; --ow-rule:#E6E3DD; --ow-dash:#C9C4BA;
  --bg: var(--ow-steel-050);
  --safe-t: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --safe-b: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg);color:var(--ow-ink-900);font-family:Figtree,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;}
a{color:inherit;text-decoration:none;}
a:hover{color:inherit;}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--ow-oxide);outline-offset:2px;}
#sx_app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;position:relative;background:var(--bg);}
/* The board fills the phone; its own scrolling parts scroll, and a board
   drawn taller than the phone scrolls whole above the tab bar. */
.sx-screen{position:absolute;inset:0;padding-top:var(--safe-t);overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sx-screen > div:first-child{min-height:100%;}
.sx-fail{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:var(--ow-ink-600);font-size:14px;}
.sx-fail b{color:var(--ow-ink-900);font-size:17px;}
.sx-fail button{height:48px;padding:0 18px;border:none;border-radius:14px;background:var(--ow-navy);color:#fff;font-weight:700;font-size:15px;cursor:pointer;}
@keyframes sxWant{0%,100%{box-shadow:0 0 0 0 rgba(201,58,48,0)}30%{box-shadow:0 0 0 3px rgba(201,58,48,.55)}}
.sx-want{animation:sxWant .9s ease 2}
.sx-kb-hide{visibility:hidden!important;pointer-events:none!important;}
.sx-toast{position:fixed;left:50%;bottom:calc(104px + var(--safe-b));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:80;max-width:min(92vw,480px);
  padding:12px 16px;border-radius:14px;background:var(--ow-navy);color:#fff;font-size:14px;font-weight:600;line-height:1.35;box-shadow:0 6px 20px rgba(27,36,56,.18);transition:opacity .2s,transform .2s;}
.sx-toast.on{opacity:1;transform:translate(-50%,0);}
/* Sign in: the navy ground, one white card. */
.bx-auth{position:fixed;inset:0;z-index:90;background:var(--ow-navy);display:flex;align-items:center;justify-content:center;padding:24px;}
.bx-auth .card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;color:#fff;}
.bx-auth .mark{width:56px;height:56px;border-radius:18px;background:var(--ow-oxide);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(201,58,48,.35);}
.bx-auth .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ow-mint);}
.bx-auth h1{margin:6px 0 0;font-size:28px;letter-spacing:-.02em;}
.bx-auth p{margin:0;color:var(--ow-on-navy);font-size:14px;line-height:1.5;}
.bx-auth label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ow-on-navy);}
.bx-auth input{height:52px;border-radius:14px;border:none;padding:0 14px;font-size:16px;background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.bx-auth .msg{min-height:18px;font-size:13px;color:var(--ow-on-navy);}
.bx-auth .msg.err{color:#F5B26B;}
.sx-btn{height:52px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;}
.sx-btn.red{background:var(--ow-oxide);color:#fff;}
.sx-btn.ghost{background:rgba(255,255,255,.1);color:#fff;}
.sx-btn.link{height:40px;background:transparent;color:var(--ow-on-navy);font-weight:600;font-size:14px;}
.sx-btn[disabled]{opacity:.5;}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}}

@keyframes AddItem-cIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
[data-screen="AddItem"] .c-in{animation:AddItem-cIn .5s cubic-bezier(.2,.9,.3,1) both}

@keyframes Asks-aSlide{0%{opacity:0;transform:translateY(-10px) rotate(-2deg)}100%{opacity:1;transform:rotate(-1deg)}}
@keyframes Asks-aDrop{0%,40%{transform:translateY(0)}100%{transform:translateY(4px)}}
@keyframes Asks-aNew{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
[data-screen="Asks"] .a-slide{animation:Asks-aSlide .55s cubic-bezier(.2,.9,.3,1) both}
[data-screen="Asks"] .a-drop{animation:Asks-aDrop 1.2s ease-in-out infinite alternate}
[data-screen="Asks"] .a-new{animation:Asks-aNew .5s cubic-bezier(.2,.9,.3,1.3) .5s both}
@media (prefers-reduced-motion: reduce){[data-screen="Asks"] .a-slide,[data-screen="Asks"] .a-drop,[data-screen="Asks"] .a-new{animation:none}}
@keyframes AsksDropped-dGrow{from{transform:scaleY(0)}}
@keyframes AsksDropped-dNew{0%,100%{opacity:1}50%{opacity:.4}}
[data-screen="AsksDropped"] .d-grow{transform-origin:bottom;animation:AsksDropped-dGrow .7s cubic-bezier(.3,.8,.3,1) both}
[data-screen="AsksDropped"] .d-new{animation:AsksDropped-dNew 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){[data-screen="AsksDropped"] .d-grow,[data-screen="AsksDropped"] .d-new{animation:none}}
@keyframes AtShop-sIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes AtShop-sHint{0%,60%,100%{transform:translateX(0) rotate(0)}70%{transform:translateX(-16px) rotate(-1.5deg)}85%{transform:translateX(16px) rotate(1.5deg)}}
@keyframes AtShop-sChip{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
[data-screen="AtShop"] .s-in{animation:AtShop-sIn .35s cubic-bezier(.2,.9,.3,1) both}
[data-screen="AtShop"] .s-hint{animation:AtShop-sHint 2.4s ease-in-out .8s 1 both}
[data-screen="AtShop"] .s-chip{animation:AtShop-sChip .35s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes AtShop-rUp{from{opacity:0;transform:translateY(46px) scale(.96)}to{opacity:1;transform:none}}
[data-screen="AtShop"] .r-up{animation:AtShop-rUp .42s cubic-bezier(.2,.9,.3,1) both}
@media (prefers-reduced-motion: reduce){[data-screen="AtShop"] .s-in,[data-screen="AtShop"] .s-hint,[data-screen="AtShop"] .s-chip,[data-screen="AtShop"] .r-up{animation:none}}
[data-screen="AtShop"] input:focus{outline:none}
[data-screen="AtShop"] input::placeholder{color:#B9B2A6}
[data-screen="AtShop"] .s-tray{scrollbar-width:none}
[data-screen="AtShop"] .s-tray::-webkit-scrollbar{display:none}
@keyframes Decide-gNeedle{from{transform:rotate(-90deg)}}

@media (prefers-reduced-motion: reduce){[data-screen="Decide"] .g-needle,[data-screen="Decide"] .g-band,[data-screen="Decide"] .g-up,[data-screen="Decide"] .g-bar,[data-screen="Decide"] .g-pulse{animation:none}}
@keyframes Dropped-dStamp{0%{transform:rotate(-8deg) scale(1.8);opacity:0}60%{transform:rotate(-8deg) scale(.94);opacity:.95}100%{transform:rotate(-8deg) scale(1);opacity:.88}}
[data-screen="Dropped"] .d-stamp{animation:Dropped-dStamp .5s cubic-bezier(.3,1.4,.5,1) .4s both}

[data-screen="Hunt"] .n-in{animation:Hunt-nIn .5s cubic-bezier(.2,.8,.2,1) both}

<script>
/* ==================================================================
   Omni-Ware Sourcing — finding new items and new suppliers, on a phone.

   The person who takes a request from "somebody asked" to "it is on the
   shelf and everybody who asked has been told": asked, looking, found,
   priced, listed. Out in the market they meet suppliers, log a price
   ladder, snap a rival's tag; at the shop's desk they keep the supplier
   price list right, confirming today's share of prices oldest first.

   One self-contained page like buyer.html: the same Supabase project and
   the same rows the owner's console reads and writes. Every rule that
   moves a request is the console's own, carried over from index.html and
   sourcing-console.js and named beside it.

   The screens ARE the canvas the owner approved ("Sourcing — phone"):
   each board's markup is carried here as it was drawn, read by the same
   small template runtime the Sourcing console uses ({{holes}}, <sc-for>,
   <sc-if>), and its logic reads the shop's own records instead of the
   sample. So the screen cannot drift from the design.

   What a Sourcing login writes, and nothing else (0126_sourcing.sql):
     sourcing_leads  requests: asked, looking, found, priced, listed,
                     dropped (never deleted), the suppliers found and
                     their price ladders, rival prices seen for it.
     follow_ups      everybody who asked, and that they were told.
     suppliers       add and edit (supplier.edit).
     prices          the supplier price list (price.list) and today's
                     share confirmed (price.confirm).
     rival_prices    what other shops charge for what we sell.
     products        a new item at the shop's default markup, and its
                     details -- never its markup: that is the Manager's.
     product_links   what it goes with.
     agent_feed_pins a new item on every agent's Feed (agent push nudges).
     agent_requests  an agent's stock request, taken.
     decision_log    one line for the owner per decision, never a queue.
   ================================================================== */
'use strict';

const OW_ENV = (function () {
  const PRODUCTION = { name: 'production', url: 'https://hgywjaifdmgrcnwxstxg.supabase.co', anon: 'sb_publishable_KsUIBYzuZRdoPsqP4T2ULw__AsCEhzV' };
  const STAGING = { name: 'staging', url: 'https://lmmyzhqdxixjnkkkgnnu.supabase.co', anon: 'sb_publishable_K7A4jZC6RSgFtyiSfV2P_w_oh8crHa5' };
  const PRODUCTION_HOSTS = ['omni-ware.vercel.app', 'omni-ware-preview.turyasingurakevin94.workers.dev'];
  if (typeof window !== 'undefined' && window.Capacitor) return PRODUCTION;
  const host = ((typeof location !== 'undefined' && location.hostname) || '').toLowerCase();
  return PRODUCTION_HOSTS.indexOf(host) === -1 ? STAGING : PRODUCTION;
})();
const sb = window.supabase.createClient(OW_ENV.url, OW_ENV.anon);

/* ---------------- The template runtime ----------------
   The same interpreter as sourcing-console.js (owsvBuild / owsvMorph),
   carried over whole: a board's markup with its {{holes}}, <sc-for> and
   <sc-if> is filled from one renderVals() object, and each render MORPHS
   the live DOM into the new tree, so a field being typed in keeps its
   focus and caret and a scrolled list keeps its place. */
const SRV_EVENTS = {
  onclick: 'click', ondoubleclick: 'dblclick', onpointerdown: 'pointerdown', onpointermove: 'pointermove',

function findLeadByText(text, exceptId){
  const tokens = searchTokens(text);
  if (!tokens.length) return null;
  const scored = D().leads.filter(l => l.id !== exceptId).map(l => {
    const hay = searchTokens(l.name);
    if (!hay.length) return { l, hit: 0 };
    const hit = tokens.filter(t => hay.some(h => h.includes(t) || t.includes(h))).length;
    return { l, hit: hit / tokens.length };
  }).filter(x => x.hit >= 0.6);
  if (!scored.length) return null;
  scored.sort((a, b) => (b.hit - a.hit) || ((a.l.voided ? 1 : 0) - (b.l.voided ? 1 : 0)));

  // ask follows it rather than bringing the joined-away one back.
  let hit = scored[0].l;
  for (let hops = 0; hit && hit.voided && hops < 5; hops++) {
    const m = /^Joined .*\((.+)\)$/.exec(hit.droppedReason || '');
    const next = m && leadById(m[1]);

    hit = next;
  }

// the owner (sourcing.lead). Never while a save is going.
async function huntsFromCatalogue(){
  if (!S.data || S.busy || huntsFromCatalogue.on || !hasTask('sourcing.lead')) return 0;
  huntsFromCatalogue.on = true; S.busy = true; S.busyAt = Date.now();
  let moved = 0;
  try {
    for (const l0 of openLeads()) {
      const p = leadCatalogueProduct(l0);
      if (!p) continue;
      const ev = l0.status === 'priced' ? [] : leadCatalogueEvidence(l0, p);
      if (String(l0.productId || '') === String(p.id) && !ev.length) continue;
      const l = JSON.parse(JSON.stringify(l0));
      l.productId = p.id;
      ev.forEach(e => {
        const c = candidateFor(l, supplierById(e.sid), {});
        if (candidateHasPrice(c) || !e.tiers.length) return;
        Object.assign(c, { tiers: e.tiers, quotedAt: e.at || new Date().toISOString(), unit: c.unit || e.unit, packUnit: c.packUnit || e.packUnit, packQty: Number(c.packQty) || e.packQty,
          fromBooks: e.how === 'price' ? { priceId: e.priceId } : { orderId: e.orderId } });
        if (e.how === 'price') c.priceRowId = e.priceId;
      });
      const to = !ev.length ? null : ev.some(e => e.tiers.length) && leadFacts(l).price ? 'priced' : 'sourced';
      const from = l.status;
      if (to && STAGES.indexOf(to) > STAGES.indexOf(from) && !stageGateBlock(l, to)) { l.status = to; l.stageEnteredAt = Date.now(); }
      if (JSON.stringify(l) === JSON.stringify(l0)) continue;
      await saveLead(l);
      if (l.status !== from) {
        moved++;
        const who = ev.map(e => firstWord((supplierById(e.sid) || {}).name)).filter(Boolean).slice(0, 2).join(', ');
        await logDecision('sourcing.lead', `“${l.name}” is ${p.name} in the catalogue — ${who} ${ev.some(e => e.how === 'bought') ? 'sold it to us' : 'has it'}; moved to ${STAGE_WORD[l.status]}`,
          { ref: { table: 'sourcing_leads', id: l.id }, before: { status: from, productId: l0.productId || null }, after: { status: l.status, productId: p.id, suppliers: ev.map(e => e.sid) } });
      }
    }
  } catch (e) { console.warn('huntsFromCatalogue', e); }
  finally { S.busy = false; huntsFromCatalogue.on = false; }
  if (moved) toast(`${plural(moved, 'hunt')} found in the catalogue — moved on`);

}

// Today's next jobs: one per hunt (its next step), people to tell, today's

function nextJobs(){

  const late = (l) => { const days = leadDaysInStage(l), limit = lim[l.status] || 0; return { days, limit, over: limit ? Math.max(0, days - limit) : 0 }; };
  openLeads().forEach(l => {
    const h = huntSteps(l), k = h.next; if (k < 0) return;
    const step = h.steps[k], people = leadDistinctAskers(l), t = late(l), sx = h.sx;
    const waiting = plural(people, 'client') + ' waiting';
    if (k === 1) {
      const kw = knownWord(h.known), seller = h.known.sellers[0];
      if (h.staged) jobs.push({ kind: 'record', score: 90 + people * 5 + t.over * 3, verb: 'Add who has it for', obj: l.name, sub: `marked ${STAGE_WORD[l.status]}, no supplier recorded` + (kw ? ' · ' + kw : ''), href: 'Quote', sx, word: 'Add', ...t, lead: l });
      else if (seller) jobs.push({ kind: 'ask', score: 100 + people * 10 + t.over * 5, verb: `Ask ${firstWord(seller.sup.name)} about`, obj: l.name, sub: `${kw} · ${waiting}`, href: 'AskSuppliers', sx, word: 'Ask', ...t, lead: l, seller });
      else jobs.push({ kind: 'ask', score: 100 + people * 10 + t.over * 5, verb: 'Ask suppliers for', obj: l.name, sub: waiting + (h.known.stock > 0 ? ` · ${n0(h.known.stock)} in stock` : ' · no supplier asked yet'), href: 'AskSuppliers', sx, word: 'Ask', ...t, lead: l });
    }
    else if (k === 2) {
      const since = Math.max(0, ...leadSuppliers(l).map(c => msOf(c.askedAt)).filter(Boolean));
      if (since && daysSince(new Date(since).toISOString()) >= 2) jobs.push({ kind: 'chase', score: 40 + people * 3 + t.over * 3, verb: 'Chase replies for', obj: l.name, sub: `${plural(h.asked, 'supplier')} asked ${agoWord(new Date(since).toISOString())} · no price yet`, href: 'Hunt', sx, word: 'Open', ...t, lead: l });
    } else if (k === 3) {
      const word = { 'See the verdict': 'Decide', 'Get a sample': 'Sample', 'The sample': 'Sample', 'Drop it': 'Drop' }[step.word] || 'Open';
      const verb = step.title === 'Decide: stock it?' ? 'Decide: stock' : step.title + ':';
      jobs.push({ kind: 'decide', score: 55 + people * 3 + t.over * 3, verb, obj: l.name + (step.title === 'Decide: stock it?' ? '?' : ''), sub: `${plural(h.priced, 'quote')} in · ${waiting}`, href: step.href, sx, word, ...t, lead: l });
    }
    else if (k === 4 || k === 5) jobs.push({ kind: 'list', score: 60 + people * 3 + t.over * 3, verb: k === 4 ? 'Price' : 'Put in the catalogue:', obj: l.name, sub: waiting, href: step.href, sx, word: k === 4 ? 'Price' : 'List', ...t, lead: l });
  });
  d.leads.filter(l => !l.voided && l.status === 'listed' && daysSince(l.graduatedAt) <= 30).forEach(l => {
    const t = leadTold(l); if (t.left <= 0) return;
    const who = leadAskers(l).map(a => firstWord(a.name)).slice(0, 2).join(', ');
    jobs.push({ kind: 'tell', score: 80 + t.left * 5, verb: `Tell ${t.left} it's on the shelf`, obj: '', sub: l.name + (who ? ' · ' + who : ''), href: 'TellAsked', sx: JSON.stringify({ leadId: l.id }), word: 'Tell', lead: l });
  });
  const share = todaysShare();
  if (share.left > 0) {
    const oldest = share.today.filter(x => !x.done).map(x => x.age).reduce((a, b) => a === null || b === null ? null : Math.max(a, b), 0);
    jobs.push({ kind: 'prices', score: 70, verb: `Confirm ${share.left} more ${share.left === 1 ? 'price' : 'prices'}`, obj: '', sub: oldest === null ? 'one has no date' : `oldest ${oldest}d`, href: 'Prices', sx: '{}', word: 'Check', share });
  }
  const lapsing = {};
  openLeads().filter(l => l.status === 'sourced' || l.status === 'priced').forEach(l => leadSuppliers(l).forEach(c => {
    if (!candidateHasPrice(c) || c.noStock || !c.supplierId || !supplierById(c.supplierId)) return;
    const left = quoteLeft(c); if (left > 1) return;
    const k = String(c.supplierId); (lapsing[k] = lapsing[k] || []).push({ l, left });
  }));
  Object.keys(lapsing).forEach(sid => {
    const xs = lapsing[sid].sort((a, b) => a.left - b.left), s = supplierById(sid), first = xs[0];
    const when = first.left < 0 ? 'lapsed' : first.left === 0 ? 'lapses today' : 'lapses tomorrow';
    jobs.push({ kind: 'lapse', score: 75 - first.left * 5, verb: `Re-check ${firstWord(s.name)}'s ${xs.length > 1 ? xs.length + ' quotes' : 'quote'}`, obj: '', sub: first.l.name, warn: when, href: 'Supplier', sx: JSON.stringify({ supplierId: s.id }), word: 'Ask' });
  });
  // The Buyer's fixes to a supplier's details (buyer_handoffs sourcing_fix).
  if (typeof fixesOpen === 'function') fixesOpen().forEach(h => {
    const sup = supplierById(fixSupplierId(h)); if (!sup) return;
    const n = fixCount(h);

      href: 'Supplier', sx: JSON.stringify({ supplierId: sup.id, handoffId: h.id }), word: 'Check' });
  });
  return jobs.sort((a, b) => b.score - a.score);
}
// What was done today, for the day bar: prices confirmed, quotes logged,
// suppliers asked, clients told, items listed.
function doneToday(){
  const d = D(), today = todayISO(), me = S.user && S.user.id, on = (t) => !!t && isoOf(t) === today;
  const prices = d.log.filter(x => x.task === 'price.confirm' && on(x.at) && (!me || x.by === me)).length;
  let quotes = 0, asked = 0;
  d.leads.forEach(l => leadSuppliers(l).forEach(c => { if (on(c.quotedAt) && candidateHasPrice(c)) quotes++; else if (on(c.askedAt)) asked++; }));
  const told = d.followUps.reduce((n, f) => n + (f.contacts || []).filter(c => on(c.at)).length, 0);
  const listed = d.leads.filter(l => on(l.graduatedAt)).length;
  return [['prices', prices, prices === 1 ? 'price' : 'prices'], ['quotes', quotes, quotes === 1 ? 'quote' : 'quotes'], ['asked', asked, 'asked'], ['told', told, 'told'], ['listed', listed, 'listed']].filter(x => x[1] > 0);
}
// product.edit: a product's own details -- never its markup (the guard
// on products refuses that, and the Manager sets it).
async function saveProductDetails(p, patch){
  const before = { name: p.name, category: p.category, image: p.image };
  const row = {};
  if (patch.name != null) { const n = String(patch.name).trim(); if (!n) throw new Error('The item needs a name'); row.name = n; }
  if (patch.category != null) row.category = String(patch.category).trim() || null;
  if (patch.image !== undefined) row.image = patch.image || null;
  if (!Object.keys(row).length) return p;
  const { error } = await sb.from('products').update(row).eq('shop_id', S.shopId).eq('id', p.id);

  if (row.name) p.name = row.name;

}

async function boot(){
  S.prefs = loadPrefs();

  let user = (!ue && u && u.user) ? u.user : null;
  if (!user) {
    const { data: sess } = await sb.auth.getSession();
    const sid = sess && sess.session && sess.session.user && sess.session.user.id;
    const snap = sid ? loadSnapshot(sid) : null;
    if (isNetworkError(ue) && snap) {

      hideAuth(); start(); toast('Offline — showing what you last saw'); return;
    }
    await authScreen();
    ({ data: u } = await sb.auth.getUser()); user = u && u.user;
    if (!user) return;
  } else if (initialLinkType === 'invite' || initialLinkType === 'recovery') {
    await setPasswordScreen();
  }
  S.user = user;
  const { data: ms, error } = await sb.from('shop_members').select('shop_id, role, shops(name)').eq('user_id', user.id);
  if (error) {
    const snap = loadSnapshot(user.id);
    if (isNetworkError(error) && snap) { Object.assign(S, { shopId: snap.shopId, shopName: snap.shopName, role: snap.role, tasks: snap.tasks || [], data: snap.data, loadedAt: snap.at }); hideAuth(); start(); toast('Offline — showing what you last saw'); return; }
    toast('Could not reach the shop: ' + error.message, 6000); return;
  }
  const rows = ms || [];
  // A Sourcing membership first; the owner and admins may open it too.
  const pick = rows.find(m => m.role === 'sourcing') || rows.find(m => ['owner', 'admin'].includes(m.role));
  if (!pick) { authScreen('denied'); return; }
  S.shopId = pick.shop_id; S.role = pick.role; S.shopName = (pick.shops && pick.shops.name) || 'The shop';
  hideAuth();
  try { const { data: rt } = await sb.from('role_tasks').select('task').eq('role', S.role); S.tasks = (rt || []).map(r => r.task); } catch (_e) {}
  const snap = loadSnapshot(user.id);
  if (snap && snap.shopId === S.shopId) { S.data = snap.data; S.loadedAt = snap.at; start(); }
  else splash(`<b>Opening the books…</b><span>${esc(S.shopName)}</span>`);
  try { await loadAll(); if (!S.started) start(); else A.redraw(); huntsFromCatalogue(); }
  catch (e) {
    if (S.data) toast(isNetworkError(e) ? 'Offline — showing what you last saw' : 'Could not refresh: ' + e.message, 5000);
    else splash(`<b>Could not open the books</b><span>${esc(e.message || e)}</span><button type="button" onclick="location.reload()">Try again</button>`);
  }
}

  if (/^permission/.test(e)) return 'notifications are off for this app in the phone’s settings';

/* ---- AddItem ---- */
/* Into the catalogue: the found item becomes a product -- its name,
   aisle, the pack it comes in, what it goes with -- at the shop's default
   markup, and the Manager is told. The board "Into the catalogue — pack,
   aisle, goes with; the Manager is told". */

// The supplier and rung the item is bought at (the same pick as Price it:
// the cheapest price for the quantity asked).
function addItemPick(l){
  const q = Math.max(1, leadDemandQty(l));
  let best = null;
  leadSuppliers(l).filter(candidateHasPrice).forEach(c => {
    const tiers = candidateTiers(c); if (!tiers.length) return;
    const cost = candidateUnitPriceAt(c, q) || tiers[0].price;
    const rung = tiers.filter(t => q >= t.minQty).pop() || tiers[0];
    if (!best || cost < best.cost) best = { c, cost, rung, tiers, q };
  });
  return best;
}
// A request for something we already sell (a dropped line) adds the
// suppliers to that product (listLead does the same).
function addItemExisting(l){
  if (l.status !== 'listed' && l.productId && productById(l.productId)) return productById(l.productId);
  const r = (l.requests || []).find(x => x.productId && productById(x.productId));
  return r ? productById(r.productId) : null;
}
const ADDITEM_ICONS = [
  [/roof/i, 'M3 12l9-7 9 7M5 10.5V19h14v-8.5'],
  [/plumb/i, 'M4 8h10v8H4zM14 11h6'],
  [/fix|fasten|nail|screw/i, 'M12 3v4M8 20h8M9 7h6l-1 13h-4z'],
];
function addItemIcon(cat){ const hit = ADDITEM_ICONS.find(([re]) => re.test(cat)); return hit ? hit[1] : itemIconPath(cat); }
// The cheapest supplier cost of a product we sell, at its own rule.
function addItemSellOf(p){
  const costs = D().prices.filter(r => String(r.productId) === String(p.id) && r.variantIdx == null).map(priceRowCost).filter(c => c > 0);
  return costs.length ? sellAt(Math.min(...costs), effectiveMarkupRule(p, null, 'wholesale')) : 0;
}

/* ---- v2 c helpers ---- */
/* Group C's helpers for the v2 Stock it?, Price it, Into the catalogue,
   Tell them and Drop screens. Each reads the books; none writes. */
// A unit in words: "piece", "pieces"; a pack word made plural.
function cUnitWord(u, n){
  u = String(u || 'pc').trim().toLowerCase();
  const one = ({ pc: 'piece', pcs: 'piece', piece: 'piece', m: 'metre', kg: 'kg', l: 'litre', ltr: 'litre' })[u] || u;
  return n === 1 || one === 'kg' ? one : cPluralWord(one);
}
function cPluralWord(w){ w = String(w || ''); return !w ? w : /(s|x|z|ch|sh)$/.test(w) ? w + 'es' : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : w + 's'; }
// The packing of a supplier's quote or a price row: smallest unit and the
// pack it comes in, if one was given.
function cPackOf(x){
  const unit = String((x && x.unit) || 'pc'), packQty = Number(x && x.packQty) || 0, packUnit = String((x && x.packUnit) || '').trim();
  return { unit, one: cUnitWord(unit, 1), packQty, packUnit: packQty && packUnit ? packUnit : '', has: !!(packQty && packUnit) };
}
// The standard's packing sentence: "100 pieces in a bag".
function cPackSentence(pk){ return pk && pk.has ? `${n0(pk.packQty)} ${cUnitWord(pk.unit, pk.packQty)} in a ${pk.packUnit}` : ''; }
// A product's own pack: its cheapest supplier row on the price list.
function cProductPack(p){
  const rows = p ? D().prices.filter(r => String(r.productId) === String(p.id) && r.variantIdx == null) : [];
  const priced = rows.filter(r => priceRowCost(r) > 0).sort((a, b) => priceRowCost(a) - priceRowCost(b));
  const r = priced[0] || rows[0] || null;
  return { row: r, cost: r ? priceRowCost(r) : 0, ...cPackOf(r) };
}
// What is on the shelf of a product we sell (the stock table, live).
function cStockOf(p){
  const n = p ? Number(D().stock[stockKey(p.id, null)]) || 0 : 0;
  const pk = cProductPack(p);
  const word = n <= 0 ? 'out of stock' : n <= 10 ? `low · ${n0(n)} left` : `${n0(n)} ${cUnitWord(pk.unit, n)}`;
  return { n, word, ink: n <= 0 ? '#8E2A22' : n <= 10 ? '#95530C' : '#0F6B43' };
}
// Bought together: on how many of the orders that carry p each other
// product sat too (saved_quotes, not voided). Read at view time, never stored.
function cBoughtWith(p){
  const out = new Map(); let total = 0;
  if (!p) return { total, rows: [] };
  D().quotes.forEach(q => {
    if (q.voided) return;
    const ids = [...new Set((q.items || []).map(it => it && it.productId).filter(Boolean).map(String))];
    if (!ids.includes(String(p.id))) return;
    total++;
    ids.forEach(id => { if (id !== String(p.id)) out.set(id, (out.get(id) || 0) + 1); });
  });
  const rows = [...out.entries()].map(([id, n]) => ({ p: productById(id), n })).filter(x => x.p).sort((a, b) => b.n - a.n);
  return { total, rows };
}
// The Manager, by name (decision-rights: the Manager sets prices and markups).
function cManager(){
  const st = D().staff.find(s => /manager/i.test(s.role || ''));
  const name = st ? st.name : managerName();
  return { name, first: st ? firstWord(st.name) : 'the Manager', First: st ? firstWord(st.name) : 'The Manager', ini: st ? initials(st.name) : 'M' };
}
// How sure the verdict is: the evidence in, against what makes it solid
// (three quotes, three rival prices, five clients).
function cSure(priced, rivals, askers){
  const p = Math.min(3, priced), r = Math.min(3, rivals), c = Math.min(5, askers);
  const pct = Math.round((p + r + c) / 11 * 100);
  return { pct, word: pct >= 80 ? 'high' : pct >= 50 ? 'medium' : 'low', p, r, c };
}

/* ---- Announce ---- */
/* Tell the team it's on sale: a pin on every agent's Feed (agent-nudge
   pushes a new pin), and the salespeople who asked reached by WhatsApp
   with the words written -- push to staff phones comes with 0120, and the
   sales desk's "New in" card is PROPOSED, so neither is claimed here. */

function annLead(props){
  const named = props && props.leadId ? leadById(props.leadId) : null;
  if (named && named.status === 'listed' && !named.voided) return named;
  return D().leads.filter(l => !l.voided && l.status === 'listed').sort((a, b) => msOf(b.graduatedAt) - msOf(a.graduatedAt))[0] || null;
}
// The price it sells at: cheapest supplier row at effectiveMarkupRule.
function annSell(l){
  const p = l && productById(l.productId);
  const rows = p ? D().prices.filter(r => String(r.productId) === String(p.id) && r.variantIdx == null && priceRowCost(r) > 0) : [];
  const best = rows.slice().sort((a, b) => priceRowCost(a) - priceRowCost(b))[0] || null;
  const cost = best ? priceRowCost(best) : 0;
  return { p, best, sell: cost ? sellAt(cost, effectiveMarkupRule(p, null, 'wholesale')) : 0, unit: (best && best.unit) || 'pc' };
}
// The salespeople who asked: Sales requests carrying who took them (by /
// salesName), matched to staff. Each with the clients they asked for.
function annSalesFolk(l){
  const out = [];
  (l.requests || []).forEach(r => {
    if (r.withdrawn || !['sales', 'sales_button', 'sourcing.ask'].includes(String(r.source || '').toLowerCase())) return;
    if (!r.by && !r.salesName) return;
    const st = D().staff.find(s => (r.by && s.userId && s.userId === r.by) || (r.salesName && normName(s.name) === normName(r.salesName)));
    const key = st ? 'st:' + st.id : 'n:' + normName(r.salesName || r.by);
    let x = out.find(o => o.key === key);
    if (!x) { x = { key, name: st ? st.name : (r.salesName || 'Sales'), phone: st ? st.phone : '', clients: [] }; out.push(x); }
    const who = askerName(r); if (who && !x.clients.includes(who)) x.clients.push(who);
  });
  return out;
}
// Already announced? The owner's log line this screen writes says so.
function annLogged(p){ return p ? D().log.find(x => x.task === 'product.edit' && x.ref && String(x.ref.id) === String(p.id) && x.after && x.after.announced) || null : null; }
function annUnitWord(u){ u = String(u || 'pc').trim().toLowerCase(); return ({ pc: 'piece', pcs: 'piece', piece: 'piece', m: 'metre' })[u] || u; }

SCREENS.Announce = {
  // Folded into TellAsked (the v2 "On the shelf. Tell them."): the name is
  // kept so every link to it still opens, and draws the same screen.
  get markup(){ return SCREENS.TellAsked.markup; },
  get Component(){ return SCREENS.TellAsked.Component; },
};


/* ---- AskSuppliers ---- */
/* Who has it? -- one message to every supplier picked (the board "Who has
   it? — one message to every supplier picked"). Suppliers on file are
   ranked by what they already sell: the words of the item's name against
   the names of the products they have price rows for (sourcing-console.js
   supHits). Nothing sends itself: each supplier's WhatsApp opens with the
   words written, one tap each, and each one opened is recorded on the
   request as a supplier asked (askedAt); the first moves it Asked → Looking. */

// sourcing-console.js 333: words(), the same split.
function askSupWords(s){ return String(s || '').toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 2); }
// The request this screen asks about: the one named, else the top open
// request still being looked for (most people, then the oldest).
function askSupLead(props){
  const named = props && props.leadId ? leadById(props.leadId) : null;
  if (named) return named;
  const open = openLeads().filter(l => l.status === 'asked' || l.status === 'looking');
  open.sort((a, b) => leadDistinctAskers(b) - leadDistinctAskers(a) || leadDemandQty(b) - leadDemandQty(a) || leadFirstAskedAt(a) - leadFirstAskedAt(b));
  return open[0] || null;
}
// A round number above n, for the "how many" choices.
function askSupNice(n){ if (n <= 10) return 10; const step = n <= 50 ? 10 : n <= 200 ? 50 : 100; return Math.ceil(n / step) * step; }
// The next round number strictly above n: 1 → 10 → 50, 22 → 50 → 100.
function askSupNext(n){ const r = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000]; return r.find(x => x > n) || Math.ceil(n * 2 / 1000) * 1000; }
// Every supplier on file, ranked for this item (sourcing-console.js sups / supHits).
function askSupRank(l){
  const d = D(), want = askSupWords(l.name);
  const known = new Set(leadKnown(l).sellers.map(x => String(x.sup.id)));
  const importers = new Set();
  d.leads.forEach(x => leadSuppliers(x).forEach(c => { if ((c.role === 'importer' || c.role === 'both') && c.supplierId) importers.add(String(c.supplierId)); }));
  const onLead = {}; leadSuppliers(l).forEach(c => { if (c.supplierId) onLead[String(c.supplierId)] = c; });
  return d.suppliers.filter(s => s && s.name).map(s => {
    const rows = d.prices.filter(p => String(p.supplierId) === String(s.id));
    const prods = [...new Set(rows.map(p => String(p.productId)))].map(productById).filter(Boolean);
    const hitProds = prods.filter(p => askSupWords(p.name).some(w => want.includes(w)));
    const hit = [...new Set(hitProds.flatMap(p => askSupWords(p.name)).filter(w => want.includes(w)))].slice(0, 3);
    const cats = {}; hitProds.forEach(p => { const c = String(p.category || '').trim().toLowerCase(); if (c) cats[c] = (cats[c] || 0) + 1; });
    return { s, rows: rows.length, prods, hitProds, hit, cats, importer: importers.has(String(s.id)), cand: onLead[String(s.id)] || null, sells: known.has(String(s.id)) };
  }).sort((a, b) => (b.sells ? 1 : 0) - (a.sells ? 1 : 0) || b.hit.length - a.hit.length || (b.importer && b.hit.length ? 1 : 0) - (a.importer && a.hit.length ? 1 : 0) || b.rows - a.rows || a.s.name.localeCompare(b.s.name));
}
// Who is ticked to start with: of the five shown, those who sell it or
// something like it -- an importer only when they carry the line -- and
// not one who already answered. Today's "Ask the N" counts the same list.
function askSupOff(x){ return !!(x.cand && (candidateHasPrice(x.cand) || x.cand.cantAt || x.cand.noStock)); }
function askSupDefaults(l, ranked){
  ranked = ranked || askSupRank(l);
  const anyHit = ranked.some(x => x.hit.length || x.sells);
  const shown = ranked.slice(0, 5);
  return (anyHit ? shown.filter(x => x.hit.length || x.sells) : shown.slice(0, 3)).filter(x => !askSupOff(x) && !(x.cand && x.cand.askedAt));
}

/* ---- Asks ---- */
/* Asks -- from Sales, agents, chats and dropped lines: the inbox of
   requests nobody has started on, the "dropped at Checking, same as the
   hunt for X" join card first, and agents' open stock asks to take. */

// Where a request came from, drawn as the tile the board gives each source.
const ASKS_ICON = {
  Sales: ['#FDEEE1', '#95530C', 'M3 12V4h8l10 10-8 8zM14 9l-4 6M6.1 8.5a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0-2.8 0'],
  Agents: ['#E4F4EA', '#0F6B43', 'M4 5h16v11H9l-5 4z'],
  Chats: ['#DCEAF8', '#1A5A8A', 'M4 5h16v11H9l-5 4zM8 10.5h.01M12 10.5h.01M16 10.5h.01'],
  Orders: ['#FBE5E2', '#8E2A22', 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6'],
  You: ['#F1EEE8', '#5F6980', 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8M4 21a8 8 0 0 1 16 0'],
};
function asksTile(kind){ const t = ASKS_ICON[kind] || ASKS_ICON.You; return { style: `width: 40px; height: 40px; flex: none; border-radius: 12px; background: ${t[0]}; color: ${t[1]}; display: flex; align-items: center; justify-content: center`, path: t[2] }; }
function asksLastReq(l){ const rs = (l.requests || []).filter(r => !r.withdrawn); return rs.slice().sort((a, b) => msOf(b.at) - msOf(a.at))[0] || {}; }
function asksQtyWord(r){ return r && Number(r.qty) ? ` · ${n0(r.qty)} ${r.unit || 'pc'}` : ''; }
// The line under a request's name: who passed it on, for whom.
function asksSubOf(l, r){
  const kind = sourceOf(r)[0], who = askerName(r);
  if (kind === 'Sales') return `Sales: “we don’t sell it” · ${who}${asksQtyWord(r)}`;
  if (kind === 'Agents') { const a = r.agentId && agentById(r.agentId); return `${a ? 'Agent ' + a.name + '’s' : 'An agent’s'} stock ask · for ${firstWord(who)}${r.note ? ', ' + r.note : ''}`; }
  if (kind === 'Chats') return `${r.source === 'quote' ? 'Quote search' : 'From a chat'} · ${who}${asksQtyWord(r)}`;
  if (kind === 'Orders') return `Dropped at Checking · ${who}${r.orderId ? ' · Q-' + r.orderId : ''}`;
  const ch = { counter: 'At the counter', phone: 'Phone', whatsapp: 'WhatsApp', quote: 'On a quote' }[r.channel] || 'You took it';
  return `${ch} · ${who}${asksQtyWord(r)}`;
}
function asksAskerKey(r){ return r.customerId ? 'c' + r.customerId : phoneDigits(r.phone) ? 'p' + phoneDigits(r.phone) : 'n' + askerName(r).toLowerCase(); }
// A line dropped at Checking that names the same thing as another open
// hunt (index.html findSourcingLeadByText), unless it was kept apart.
function asksJoinPair(){
  const pairs = [];
  openLeads().forEach(l => {
    const dr = (l.requests || []).find(r => r.source === 'dropped' && !r.withdrawn);
    if (!dr) return;
    const meta = (l.candidates || []).find(c => c && c.kind === 'meta') || {};
    const m = findLeadByText(l.name, l.id);
    if (!m || m.voided || m.status === 'listed') return;
    if (meta.keepApart && meta.keepApart.from === m.id) return;
    pairs.push({ gone: l, keep: m, r: dr });
  });
  return pairs.sort((a, b) => msOf(b.r.at) - msOf(a.r.at))[0] || null;
}

/* Shared by Today, New chances, Capture, Search and You (the v2 canvas):

/* From orders -- every line dropped at Checking becomes a request by
   itself: what was lost, why, and which of those nobody is hunting yet. */

// The dropped lines: each request with source 'dropped' (the database
// makes them at Checking), with its order (saved_quotes by orderId).
function adDropped(){
  const out = [];
  D().leads.forEach(l => (l.requests || []).forEach(r => {
    if (r.source !== 'dropped' || r.withdrawn) return;
    const q = r.orderId != null ? D().quotes.find(x => String(x.id) === String(r.orderId)) : null;
    const line = q && (q.droppedLines || []).find(x => (r.productId && x.productId === r.productId) || normName(x.productName) === normName(l.name));
    const at = msOf(r.at) || (line && msOf(line.droppedAt)) || msOf(l.createdAt);
    const each = Number(r.sellPrice) || (line && Number(line.sellPrice)) || 0, qty = Number(r.qty) || (line && Number(line.qty)) || 0;
    out.push({ l, r, q, at, each, qty, value: each && qty ? each * qty : 0, reason: String(r.reason || (line && line.reason) || 'Nobody has it') });
  }));
  return out;
}
// The suppliers the Buyer asked for this order and who could not
// (payload.supplierConfirms, any answer but 'confirmed').
function adTried(q){
  return Object.entries((q && q.supplierConfirms) || {}).filter(([, rec]) => rec && rec.state && rec.state !== 'confirmed' && rec.state !== 'pending')
    .map(([sid, rec]) => { const s = supplierById(sid); return { sid, name: s ? s.name : sid, rec }; });
}
function adReasonKey(w){ return /dear|price|expens/i.test(w) ? 'Too dear' : /client|customer|said no|cancel/i.test(w) ? 'Client said no' : 'Nobody has it'; }
function adState(l){
  const n = leadSuppliers(l).filter(candidateHasPrice).length, f = leadFacts(l);
  const pill = (bg, ink) => `justify-self: end; height: 24px; padding: 0 9px; border-radius: 999px; background: ${bg}; color: ${ink}; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap`;
  if (l.voided) return ['Dropped', pill('#F1EEE8', '#5F6980')];
  if (l.status === 'listed') return ['On the shelf', pill('#E4F4EA', '#0F6B43')];
  if (l.status === 'priced') return ['Priced', pill('#E4F4EA', '#0F6B43')];
  // Found with no price yet is not "Found · 0 quotes": it waits on a quote.
  if (l.status === 'sourced' || f.supplier || f.importer) return n ? ['Found · ' + plural(n, 'quote'), pill('#E4F4EA', '#0F6B43')] : ['Found · no price yet', pill('#FDEEE1', '#95530C')];
  if (l.status === 'looking') return ['Looking · ' + leadDaysInStage(l) + 'd', pill('#FDEEE1', '#95530C')];
  return ['not hunted yet', pill('#FBE5E2', '#8E2A22')];
}

/* ---- AtShop ---- */
/* At a shop -- every item asked in one tap each (the board "At a shop —
   every item asked in one tap each", swipe-card stack). One stop of the
   market run (mrRun / mrItemsFor in MarketRun.js): a hunt (do they have
   it?), a quote to re-check, a price from today's share, or a rival's tag.
   Each card is written the moment it is answered:
     hunt / anyone  yes + ladder -> candidateFor(lead, supplier): tiers in
                    pieces (minQty) at a price per piece, quotedAt, then
                    saveLead and moveLead forward to Found (sourced);
                    no -> the candidate carries noStock: true, askedAt.
     recheck        same -> quotedAt reset (the console's "Still valid");
                    new figure -> new tiers; no -> noStock, askedAt.
     price          same -> confirmPrice(row, null, 'in person');
                    new figure -> confirmPrice(row, tiers, 'in person');
                    can't supply -> the row is marked out of stock today.
     rival          a key line -> addRivalPrice (tag, in stock); a hunt ->
                    the hunt's own research row (kind 'rival'), as the
                    console keeps them; not on their shelf -> nothing is
                    written, the plan on the phone remembers it was asked. */
function atsUnitsFor(it){
  let base = 'pc';
  const packs = [];
  const add = (u, n) => { u = String(u || '').trim(); n = Number(n) || 0; if (u && n > 1 && !packs.some(p => p[0] === u)) packs.push([u, n]); };
  const fromCand = (c) => { if (!c) return; if (c.unit) base = c.unit; add(c.packUnit, c.packQty); (c.ladder || []).forEach(r => add(r.unit, r.n)); };
  if (it.cand) fromCand(it.cand);
  else if (it.lead) fromCand(leadBestCand(it.lead));
  if (it.row) { base = it.row.unit || base; add(it.row.packUnit, it.row.packQty || it.row.piecesPerUnit); }
  if (it.product) D().prices.filter(p => p.productId === it.product.id).forEach(p => { if (p.unit) base = p.unit; add(p.packUnit, p.packQty || p.piecesPerUnit); });
  const out = [[base, 1]].concat(packs);
  ['bundle', 'carton'].forEach(u => { if (out.length < 3 && !out.some(x => x[0] === u) && u !== base) out.push([u, null]); });
  return out;
}
function atsNum(v){ return Number(String(v == null ? '' : v).replace(/[^0-9.]/g, '')) || 0; }
function atsGrad(name){ const t = tintFor(name); return `linear-gradient(160deg, ${t[0]}, ${t[1]})`; }

/* ---- v2 group E helpers ---- */
/* The v2 run, the stop and the item page (the v2 boards "Plan the run",
   "At a shop" and "An item on the shelf"). Read from the same records the
   run is built from (mrRun / mrItemsFor); nothing here writes. */

// The samples to pick up at a supplier: a hunt at Found whose best price is
// theirs and has no sample yet, or one whose sample was started here today
// (leadMeta(l).sample, the Sample screen's record).
function eSamplesAt(sup){
  if (!sup) return [];
  const out = [];
  openLeads().forEach(l => {
    if (l.status !== 'sourced') return;
    const c = mrCandAt(l, sup);
    if (!c || c.noStock || !candidateHasPrice(c) || leadBestCand(l) !== c) return;
    const sm = leadResearch(l).meta.sample;
    if (sm && !(mrIsToday(sm.at) && String(sm.supplierId) === String(sup.id))) return;
    out.push({ key: 'S:' + l.id, lead: l, cand: c, got: !!sm });
  });
  return out;
}
// A hunt priced today on the Quote screen from this stop drops out of the
// run's list (it has a price now); it is kept here as answered, so the
// stop's count does not shrink under the person standing in the shop.
function eQuotedHere(st){
  if (!st || st.type !== 'sup') return [];
  const sup = supplierById(st.id);
  if (!sup) return [];
  const have = new Set(st.items.map(i => i.key));
  return D().leads.filter(l => !l.voided && !have.has('L:' + l.id)).map(l => {
    const c = mrCandAt(l, sup);
    if (!c || c.noStock || !mrIsToday(c.quotedAt) || mrIsToday(c.askedAt) || !candidateHasPrice(c)) return null;
    return { key: 'L:' + l.id, kind: 'hunt', lead: l, cand: c, name: l.name, answered: { no: false, val: short((candidateTiers(c)[0] || {}).price) } };
  }).filter(Boolean);
}
// What one stop holds: its items, the samples to bring back, how far along.
function eStop(st){
  const items = st ? st.items.concat(eQuotedHere(st)) : [];
  const samples = st && st.type === 'sup' ? eSamplesAt(supplierById(st.id)) : [];
  const total = items.length + samples.length;
  const done = items.filter(i => i.answered).length + samples.filter(s => s.got).length;
  return { items, samples, total, done };
}
// An answered item's figure, in full (money is never shortened): the price
// confirmed, the quote renewed or the tag read today.
function eAnswerWord(it, st){
  if (it.kind === 'price') { const r = D().prices.find(p => String(p.id) === String(it.row.id)) || it.row; return n0(priceRowCost(r)); }
  if (it.kind === 'rival') {
    const R = normName(st.name);
    const seen = it.lead ? leadResearch(leadById(it.lead.id) || it.lead).rivals.find(r => normName(r.name) === R && mrIsToday(r.seenAt))
      : D().rivals.find(r => r.productId === it.product.id && (r.variantIdx == null ? null : r.variantIdx) === it.variantIdx && normName(r.rival) === R && r.seenOn === todayISO());
    return seen ? n0(seen.price) : 'seen';
  }
  const l = leadById(it.lead.id) || it.lead, sup = st.type === 'sup' ? supplierById(st.id) : null;
  const c = sup ? mrCandAt(l, sup) : it.cand, t = c ? candidateTiers(c)[0] : null;
  return t ? n0(t.price) : 'asked';
}
// "a piece", "a carton": the unit a price is for, in words.
function eUnitWord(u){ u = String(u || 'pc').trim().toLowerCase(); return ({ pc: 'piece', pcs: 'piece', piece: 'piece', m: 'metre', kg: 'kg' })[u] || u; }
function ePlural(n, u){ const w = eUnitWord(u); return Number(n) === 1 ? w : w === 'box' ? 'boxes' : /s$/.test(w) ? w : w + 's'; }
// How long ago a price was checked, and whether that is old.
function eAge(days){
  const stale = priceStaleDays();
  if (days == null) return { word: 'never checked', old: true };
  return { word: days === 0 ? 'checked today' : days === 1 ? 'checked yesterday' : `checked ${days} days ago`, old: days > stale };
}

/* ---- Decide ---- */
/* Stock it? -- the console's verdict, then how we hold it (the board
   "Stock it? — the console's verdict, then how we hold it"). The score is
   exactly leadVerdict (sourcing-console.js 1269-1293, carried in the
   shell): Demand 25, Margin 25, Price vs rivals 20, Competition 10,
   Supply 10, Cash payback 10; 70 Stock it, 55 a small first batch, 40
   special order only, else don't stock; no price, not enough to decide.
   The hold chosen, with a quantity worked from what was asked, is kept on
   the request (leadMeta(l).hold = { kind, qty, at, score }). */

// The request: the one named, else the top open request found or priced.
function decideLead(props){
  const named = props && props.leadId ? leadById(props.leadId) : null;
  if (named) return named;
  const open = openLeads().filter(l => l.status === 'sourced' || l.status === 'priced');
  open.sort((a, b) => leadDistinctAskers(b) - leadDistinctAskers(a) || leadDemandQty(b) - leadDemandQty(a) || leadFirstAskedAt(a) - leadFirstAskedAt(b));
  return open[0] || openLeads()[0] || null;
}
// How many to hold, worked from demand: a small batch is what was asked,
// rounded up to whole packs and never under the least a supplier sells;
// stocking it is twice that; a special order is exactly what was asked.
function decideQtys(l){
  const q = leadDemandQty(l), cands = leadSuppliers(l).filter(candidateHasPrice);
  const packC = cands.find(c => Number(c.packQty) > 0) || leadSuppliers(l).find(c => Number(c.packQty) > 0);
  const pack = packC ? Number(packC.packQty) : 0;
  const moq = cands.length ? Math.min(...cands.map(c => (candidateTiers(c)[0] || {}).minQty || 1)) : 1;
  if (!(q > 0)) return { q: 0, pack, small: null, stock: null, special: null };
  const up = (x) => pack ? Math.ceil(x / pack) * pack : x <= 10 ? x : Math.ceil(x / 5) * 5;
  const small = Math.max(up(q), moq);
  return { q, pack, small, stock: Math.max(up(small * 2), moq), special: q };
}
// The cash out for a quantity: the cheapest supplier at that quantity, with their trip.
function decideCash(l, qty){
  let best = null;
  leadSuppliers(l).filter(candidateHasPrice).forEach(c => { const u = candidateUnitPriceAt(c, qty); if (u == null) return;
    const cost = u * qty + (Number(c.transport) || 0); if (!best || cost < best.cost) best = { c, cost }; });
  return best;
}

  Component: class extends SrvLogic {
    constructor(props) {
      super(props);
      const l = this.lead();
      this.state = { reason: l ? (l.voided ? l.droppedReason : (props && props.reason) || this.suggest(l)) : '', asking: null };
    }
    // The request asked for, else the open hunt longest over its time.
    lead() {
      if (this.props.leadId) return leadById(this.props.leadId);
      const open = openLeads().slice().sort((a, b) => (leadOver(b) - leadOver(a)) || leadDaysInStage(b) - leadDaysInStage(a));
      return open[0] || null;
    }
    // The reason the records point to (the verdict's own minimum-order test).
    suggest(l) {
      const v = leadVerdict(l), sups = leadSuppliers(l);
      if (!sups.some(candidateHasPrice)) return 'No supplier found';
      if (v.minBlock) return 'Minimum order too big';
      const rivals = leadResearch(l).rivals.map(r => Number(r.price) || 0).filter(x => x > 0);
      if (rivals.length && v.cost && Math.min(...rivals) <= v.cost) return 'Rivals sell it cheaper';
      return '';
    }
    // Something on the shelf with a name like it: the offer to make instead.
    offerFor(l) {
      const hit = findProductsByText(l.name, 6).find(p => p.id !== l.productId && (D().stock[p.id] || 0) > 0);
      if (!hit) return null;
      const rows = D().prices.filter(r => r.productId === hit.id && r.variantIdx == null && priceRowCost(r) > 0);
      const cost = rows.length ? Math.min(...rows.map(priceRowCost)) : 0;
      const sell = cost ? sellAt(cost, effectiveMarkupRule(hit, null, 'wholesale')) : 0;
      return { p: hit, qty: D().stock[hit.id] || 0, unit: (rows[0] && rows[0].unit) || 'pc', sell };
    }
    renderVals() {
      const l = this.lead();
      if (!l) return { none: true, has: false, title: 'Drop the hunt?', sub: '', noneWord: this.props.leadId ? 'This request is not on file any more' : 'No open hunts to drop' };
      const d = D(), dropped = !!l.voided, reason = this.state.reason;
      const q = leadDemandQty(l), sups = leadSuppliers(l);
      const unit = sups.map(c => c.unit).find(Boolean) || (l.requests || []).map(r => r.unit).find(Boolean) || 'pc';
      // Who we asked: each supplier on the hunt and what came back.
      let can = 0;
      const asked = sups.map(c => {
        const tiers = candidateTiers(c), at = candidateUnitPriceAt(c, q || 1);
        let word, pill;
        if (c.cant || c.cantAt || c.noStock || c.answer === 'cant') { word = 'can’t supply'; pill = 'background: #FBE5E2; color: #A82D24'; }
        else if (at != null) { word = n0(at) + ' a ' + cUnitWord(unit, 1); pill = 'background: #E4F4EA; color: #0F6B43'; can++; }
        else if (tiers.length) { word = `min ${n0(tiers[0].minQty)} ${unit}`; pill = 'background: #FBE5E2; color: #A82D24'; }
        else if (c.askedAt) { word = 'no answer'; pill = 'background: #F1EEE8; color: #5F6980'; }
        else { word = 'not asked'; pill = 'background: #F1EEE8; color: #5F6980'; }
        const nm = candName(c) || 'Unnamed supplier';
        return { name: nm, ini: initials(nm), ava: avStyle(c.supplierId || nm, 30) + '; font-size: 10px', word, pill };
      });
      // Why, in the board's words; saved as the app's own reasons.
      const LABEL = { 'No supplier found': 'Nobody has it', 'Rivals sell it cheaper': 'Too dear to sell', 'Minimum order too big': 'Order too big', 'Asker went elsewhere': 'Clients went elsewhere' };
      const WHY = { 'No supplier found': 'no supplier in town has it', 'Rivals sell it cheaper': 'it would cost more than it sells for', 'Minimum order too big': 'suppliers only sell it in big lots', 'Asker went elsewhere': 'you found it elsewhere', 'Sample failed': 'the sample did not pass our check' };
      const list = ['No supplier found', 'Rivals sell it cheaper', 'Minimum order too big', 'Asker went elsewhere'];
      if (reason && !list.includes(reason)) list.push(reason);
      const reasons = list.map(w => {
        const on = w === reason;
        return { label: LABEL[w] || w, on: on ? 'true' : 'false',
          pick: () => { if (dropped) { FEEL.no(); toast('It was dropped already'); return; } FEEL.tick(); this.setState({ reason: w }); },
          style: 'height: 46px; border-radius: 14px; font-size: 13px; font-weight: 700; text-align: center; ' + (on ? 'background: #16203C; color: #FFFFFF' : 'background: #FFFFFF; color: #1C2233; box-shadow: 0 0 0 1px rgba(28,34,51,.1)') + (dropped && !on ? '; opacity: .45' : '') };
      });
      const off = this.offerFor(l);
      const askers = leadAskers(l);
      const shop = S.shopName || 'the shop';
      const why = WHY[l.droppedReason || reason] || String(l.droppedReason || reason || 'we could not get it for now').toLowerCase();
      const words = (a) => `Hello ${firstWord(a.name)}, we couldn’t find the ${l.name} you asked for: ${why}.`
        + (off && off.sell ? ` We have ${off.p.name} on the shelf at ${n0(off.sell)}. Shall we put one on your order?` : ' We have kept your request, and we will tell you if it comes in.')
        + ` — ${shop}`;
      // Told = a follow-up contact on this request since it was dropped.
      const since = msOf(l.droppedAt);
      const fuOf = (a) => a.customerId ? d.followUps.find(f => f.leadId === l.id && String(f.customerId) === String(a.customerId)) : null;
      const rows = askers.map(a => {
        const cust = a.customerId ? customerById(a.customerId) : null;
        const phone = a.phone || (cust && cust.phone) || '';
        const f = fuOf(a);
        return { a, phone, told: !!(dropped && f && (f.contacts || []).some(c => msOf(c.at) >= since)) };
      });
      const ask = this.state.asking != null ? rows.find(r => r.a.key === this.state.asking) : null;
      const nxt = ask ? rows.find(r => r.a.key !== ask.a.key && !r.told && r.phone) : null;
      const open = (r) => { FEEL.open(); openWA(r.phone, words(r.a)); this.setState({ asking: r.a.key }); };
      const people = rows.map((r, i) => ({ name: r.a.name, ini: initials(r.a.name), ava: avStyle(r.a.key, 36) + '; font-size: 12px',
        sub: (r.a.qty ? n0(r.a.qty) + ' ' + unit + ' · ' : '') + sourceOf(r.a.reqs[0])[0] + (r.a.customerId ? '' : ' · not on file'),
        line: 'display: flex; align-items: center; gap: 12px; min-height: 60px' + (i ? '; box-shadow: inset 0 1px 0 #F0ECE6' : ''),
        told: r.told, canTell: !r.told && !!r.phone, noPhone: !r.told && !r.phone, tell: () => open(r) }));
      const toldN = rows.filter(r => r.told).length;
      const drop = () => !reason ? (FEEL.no(), toast('Pick why first.')) : guarded('drop', async () => {
        await dropLead(l, reason);
        FEEL.yes(); toast(`“${l.name}” dropped — kept on file. Now tell who asked.`);
      });
      const n = askers.length;
      const days = dropped ? daysSince(l.droppedAt) : daysSince(leadFirstAskedAt(l));
      const first = askers[0];
      return {
        none: false, has: true, title: dropped ? 'Dropped, kept on file' : 'Drop the hunt?',
        sub: [l.name, dropped ? 'dropped ' + (agoWord(l.droppedAt) || '') : plural(days, 'day'), plural(n, 'client')].filter(Boolean).join(' · '),
        asked, noneAsked: !sups.length,
        canWord: sups.length ? `${can} of ${sups.length} can` : '',
        canInk: `font-size: 12px; font-weight: 700; color: ${can ? '#0F6B43' : '#8E2A22'}`,
        reasons,
        hasOffer: !!(off && off.sell), offer: off ? { name: off.p.name, qty: n0(off.qty), price: n0(off.sell), photo: photoStyle(off.p.image, 'background: linear-gradient(160deg, #9ED8B7, #1E9D57)'), noPhoto: !off.p.image, icon: itemIconPath(off.p.name) } : {},
        msgHead: dropped ? (n ? `Told ${toldN} of ${n} · one tap each` : 'Nobody asked by name') : n ? `What the ${n === 1 ? 'client' : n + ' clients'} get` : 'Nobody to tell',
        msgBox: 'padding: 12px 14px; border-radius: 16px; display: flex; flex-direction: column; gap: 8px; animation-delay: .15s; background: ' + (dropped && n && toldN === n ? '#E4F4EA' : '#EEF0F5'),
        msgInk: 'color: ' + (dropped && n && toldN === n ? '#0F6B43' : '#3B4566'),
        faces: askers.slice(0, 3).map((a, i) => ({ ini: initials(a.name), style: avStyle(a.key, 24) + '; font-size: 8px' + (i ? '; margin-left: -6px; box-shadow: 0 0 0 2px #FFFFFF' : '') })),
        msg: first ? words(first) : words({ name: 'there' }),
        dropped, notDropped: !dropped, drop, people,
        dropWord: n ? `Drop it · tell the ${n === 1 ? 'client' : n + ' clients'}` : 'Drop it', noReason: !reason,
        busy: S.busy, asking: !!ask, askTitle: ask ? `Did the message go to ${ask.a.name}?` : '', askNoFile: !!(ask && !ask.a.customerId),
        yesWord: nxt ? 'Yes, sent · next' : 'Yes, sent',
        notSent: () => { FEEL.back(); this.setState({ asking: null }); },
        yes: () => {
          if (!ask) return;
          if (nxt) open(nxt); else this.setState({ asking: null });
          if (!ask.a.customerId) { FEEL.yes(); toast(`${ask.a.name} sent — not a client on file`); return; }
          guarded('told', async () => {

            await recordFollowUpContact(fu, 'dropped: ' + (l.droppedReason || reason), null);
            FEEL.yes(); toast(`${firstWord(ask.a.name)} told it is not now.`);
          });
        },
      };
    }
  },
};

/* ---- HuntDropped ---- */
/* A dropped line, picked up -- the order and the line Checking dropped,
   the suppliers the Buyer already tried, and "who else has it?". */

function hdDroppedReq(l){ return (l && (l.requests || []).find(r => r.source === 'dropped' && !r.withdrawn)) || null; }
// The default: the newest line dropped at Checking that is still open.
function hdDefaultLead(){
  return openLeads().map(l => ({ l, r: hdDroppedReq(l) })).filter(x => x.r).sort((a, b) => msOf(b.r.at) - msOf(a.r.at)).map(x => x.l)[0] || null;
}
// Words of the item name against what each supplier prices (prices rows)
// and their own name and notes: who on file is likeliest to have it.
function hdWords(s){ return searchTokens(String(s || '').replace(/[·”"“,()\/]/g, ' ')).filter(w => w.length > 2 && !/^\d+(mm|m|kg)?$/.test(w)); }
function hdRankSuppliers(l, triedIds, onHunt){
  const want = hdWords(l.name);
  return D().suppliers.map(s => {
    const rows = D().prices.filter(p => String(p.supplierId) === String(s.id));
    const names = rows.map(p => priceRowName(p));
    let best = 0, bestName = '';
    names.forEach(n => { const hay = hdWords(n); const hit = want.filter(w => hay.some(h => h.includes(w) || w.includes(h))).length; if (hit > best) { best = hit; bestName = n; } });
    const own = hdWords(s.name + ' ' + (s.notes || ''));
    const ownHit = want.filter(w => own.some(h => h.includes(w) || w.includes(h))).length;
    const exact = l.productId || (l.requests || []).some(r => r.productId) ? rows.some(p => (l.requests || []).some(r => r.productId && r.productId === p.productId)) : false;
    const score = (exact ? 100 : 0) + best * 10 + ownHit * 6 + Math.min(3, rows.length) * 0.1;
    const why = exact ? 'on file · prices this item' : best ? 'on file · prices ' + bestName : ownHit ? 'on file · the name fits' : rows.length ? 'on file · prices ' + plural(rows.length, 'item') : 'on file';
    return { s, score, why, tried: triedIds.has(String(s.id)), on: onHunt.get(String(s.id)) || null };
  }).sort((a, b) => (a.tried - b.tried) || (b.score - a.score) || a.s.name.localeCompare(b.s.name));
}

/* One item -- the board "One item — its details and every price for it,
   put right here" (round 3; product.edit, price.list). What it sells for
   (the Manager's markup, shown and never set here), every supplier price
   on one line against what we sell at and the rivals' tags, and each
   price put right where it stands: still right, a new figure, or can't
   supply. Edit details changes the product's own name, aisle and photo. */
function itemProduct(props){
  if (props && props.productId) return productById(props.productId);
  const counts = {}; D().prices.forEach(p => { counts[p.productId] = (counts[p.productId] || 0) + 1; });
  const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  return top ? productById(top) : D().products[0] || null;
}

/* ---- Landed ---- */
/* New item landed -- on the shelf: the product a hunt became, how long
   it took, who asked and what it sells at, then tell them and the team
   (the 'Landed' sound: a new pattern awaiting the owner's yes or no, so it
   plays here and nowhere else). */

// The request this screen celebrates: the one named, else the most
// recently listed (status 'listed', latest graduatedAt), else none.
function landedLead(props){
  const named = props && props.leadId ? leadById(props.leadId) : null;
  if (named && named.status === 'listed' && !named.voided) return named;
  return D().leads.filter(l => !l.voided && l.status === 'listed').sort((a, b) => msOf(b.graduatedAt) - msOf(a.graduatedAt))[0] || null;
}
// What it sells at: the cheapest supplier price row for the product, at
// effectiveMarkupRule (variant -> product -> the shop's default; the
// Manager's to set) -- index.html graduateSourcingLead's own sum.
function landedSell(l){
  const p = l && productById(l.productId);
  const rows = p ? D().prices.filter(r => String(r.productId) === String(p.id) && r.variantIdx == null && priceRowCost(r) > 0) : [];
  const best = rows.slice().sort((a, b) => priceRowCost(a) - priceRowCost(b))[0] || null;
  const cost = best ? priceRowCost(best) : 0;
  const rule = p ? effectiveMarkupRule(p, null, 'wholesale') : null;
  const sups = [];
  rows.forEach(r => { const s = supplierById(r.supplierId); if (s && !sups.some(x => x.id === s.id)) sups.push(s); });
  return { p, rows, best, cost, rule, sell: cost ? sellAt(cost, rule) : 0, sups };
}
// Told: derived from follow_ups contacts made after it was listed, never a
// stored stage (canvas note p2) -- the same test as Today's "Told".
function landedTold(l, a){
  if (!a.customerId) return false;
  return D().followUps.some(f => f.leadId === l.id && String(f.customerId) === String(a.customerId) && (f.contacts || []).some(c => msOf(c.at) >= msOf(l.graduatedAt)));
}
function landedUnitWord(u){ u = String(u || 'pc').trim().toLowerCase(); return ({ pc: 'piece', pcs: 'piece', piece: 'piece', m: 'metre', kg: 'kg' })[u] || u; }
// The sales desk who asked: requests from Sales carrying who took them.
function landedSalesFolk(l){
  const out = [];
  (l.requests || []).forEach(r => {
    if (r.withdrawn || !['sales', 'sales_button', 'sourcing.ask'].includes(String(r.source || '').toLowerCase())) return;
    if (!r.by && !r.salesName) return;
    const st = D().staff.find(s => (r.by && s.userId && s.userId === r.by) || (r.salesName && normName(s.name) === normName(r.salesName)));
    const key = st ? 'st:' + st.id : 'n:' + normName(r.salesName || r.by);
    if (!out.some(x => x.key === key)) out.push({ key, staff: st, name: st ? st.name : (r.salesName || 'Sales'), phone: st ? st.phone : '' });
  });
  return out;
}

SCREENS.Landed = {
