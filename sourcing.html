// The day's run: every stop, by area, in the plan's order.
function mrRun(){
  const plan = mrPlanLoad();
  const skip = plan.skip || {};
  const stops = [];
  D().suppliers.forEach(s => {
    const st = { type: 'sup', id: s.id, key: 's:' + s.id, name: s.name, area: String(s.location || '').trim() || 'No area', sup: s };
    st.items = mrItemsFor(st);
    st.own = st.items.filter(i => i.kind !== 'anyone');
    if (st.own.length) stops.push(st);
  });
  mrRivalNames().forEach(r => {
    const st = { type: 'rival', id: r.name, key: 'r:' + normName(r.name), name: r.name, area: r.area || 'Rivals' };
    st.items = mrItemsFor(st);
    st.own = st.items;
    if (st.own.length) stops.push(st);
  });
  stops.forEach(st => {
    (skip[st.key] || []).forEach(k => { const it = st.items.find(i => i.key === k); if (it && !it.answered) it.answered = { no: true, val: 'none', skipped: true }; });
    st.left = st.items.filter(i => !i.answered).length;
    st.ownLeft = st.own.filter(i => !i.answered).length;
    st.done = st.left === 0;
    st.importer = st.type === 'sup' && openLeads().some(l => { const c = mrCandAt(l, st.sup); return c && (c.role === 'importer' || c.role === 'both'); });
  });
  // One area per place: "city market" and "City Market " are the same market, named
  // as most of its suppliers write it, first letter up.
  const areaKey = (n) => String(n || '').trim().replace(/\s+/g, ' ').toLowerCase();
  const spell = {};
  stops.forEach(st => { const k = areaKey(st.area); (spell[k] = spell[k] || {})[st.area.trim()] = ((spell[k] || {})[st.area.trim()] || 0) + 1; });
  const areaName = (k) => { const w = Object.entries(spell[k]).sort((a, b) => b[1] - a[1] || (/^[A-Z]/.test(b[0]) - /^[A-Z]/.test(a[0])))[0][0]; return w.charAt(0).toUpperCase() + w.slice(1); };
  stops.forEach(st => { st.area = areaName(areaKey(st.area)); });
  const areaMap = {};
  stops.forEach(st => { (areaMap[st.area] || (areaMap[st.area] = [])).push(st); });
  const areas = Object.keys(areaMap).map(name => ({ name, stops: areaMap[name] }))
    .map(a => ({ ...a, sups: a.stops.filter(x => x.type === 'sup'), asks: a.stops.filter(x => x.type === 'sup').reduce((s, x) => s + x.own.length, 0) }))
    // Where the most suppliers are, then the most to ask there; a rivals-only area last.
    .sort((a, b) => (a.name === 'No area') - (b.name === 'No area') || b.sups.length - a.sups.length || b.asks - a.asks || b.stops.length - a.stops.length || a.name.localeCompare(b.name));

  const order = plan.order || [], off = new Set(plan.off || []);
  const pos = (st) => { const i = order.indexOf(st.key); return i < 0 ? 1e6 : i; };
  const list = area ? area.stops.slice().sort((a, b) => pos(a) - pos(b) || (a.type === 'rival') - (b.type === 'rival') || b.own.length - a.own.length || a.name.localeCompare(b.name)) : [];
  list.forEach(st => { st.off = off.has(st.key); });
  const active = list.filter(st => !st.off);

}
function mrSkip(stopKey, itemKey){
  const p = mrPlanLoad(); p.skip = p.skip || {};
  p.skip[stopKey] = (p.skip[stopKey] || []).filter(k => k !== itemKey).concat([itemKey]);

}

/* ---- v2 group D helpers ---- */
/* Prices, Fix, Suppliers, Supplier, Twins and NewSupplier (Sourcing v2).
   Read from the price list and the owner's log; every write goes through
   savePrice / saveLead / logDecision or the 0145 RPCs. */
const D_UNIT = { pc: ['piece', 'pieces'], pcs: ['piece', 'pieces'], piece: ['piece', 'pieces'], m: ['metre', 'metres'], kg: ['kg', 'kg'], l: ['litre', 'litres'], litre: ['litre', 'litres'],
  dozen: ['dozen', 'dozens'], pair: ['pair', 'pairs'], set: ['set', 'sets'], sheet: ['sheet', 'sheets'], roll: ['roll', 'rolls'], bag: ['bag', 'bags'], length: ['length', 'lengths'] };
function dUnit(u, many){ const k = String(u || 'pc').trim().toLowerCase(); const w = D_UNIT[k] || [k, /s$/.test(k) ? k : k + 's']; return many ? w[1] : w[0]; }
function dHasPack(r){ return !!r && Number(r.packQty) > 0 && !!String(r.packUnit || '').trim(); }
// The standard's packing words: "12 pieces in a box".
function dPackWord(r){ return dHasPack(r) ? `${n0(r.packQty)} ${dUnit(r.unit, Number(r.packQty) !== 1)} in a ${String(r.packUnit).trim()}` : ''; }
function dAgeWord(a){ return a === null ? 'no date' : a === 0 ? 'today' : a === 1 ? 'yesterday' : a + ' days'; }
// Fresh, old soon (the last quarter before the owner's stale days), or old.
function dAgeKind(r){ const a = priceAgeDays(r), st = priceStaleDays(); if (a === null || a > st) return 'old'; return a > st - Math.max(2, Math.round(st / 4)) ? 'soon' : 'fresh'; }
function dListRows(){ return D().prices.filter(r => productById(r.productId) && supplierById(r.supplierId)); }
function dHealth(){ const c = { fresh: 0, soon: 0, old: 0 }; dListRows().forEach(r => { c[dAgeKind(r)]++; }); c.total = c.fresh + c.soon + c.old; return c; }
function dStem(w){ return w.length > 3 ? w.replace(/(es|s)$/, '') : w; }
function dWords(t){ return String(t || '').toLowerCase().split(/[^a-z]+/).filter(w => w.length >= 4).map(dStem); }
function dMedian(xs){ const s = xs.slice().sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function dVi(x){ return x == null || x === '' ? null : Number(x); }

/* ---- prices that look wrong ----
   A supplier's price far above everyone else's for the same item (over 6x
   the middle of the other suppliers' prices and what we paid on landed
   orders): most often a box price saved as a piece price. A pack size that
   brings it back beside the others is the likely fix. "No, it's right" is
   a price.list line in the owner's log, and that row is not asked again. */
const D_PACKS = [6, 10, 12, 20, 24, 25, 36, 48, 50, 100, 144, 200, 500, 1000];
function dKeptAsIs(r){ return D().log.some(x => x.task === 'price.list' && x.ref && x.ref.table === 'prices' && String(x.ref.id) === String(r.id) && x.after && x.after.keptAsIs); }
function dWrongPrices(){
  const rows = dListRows().filter(r => priceRowCost(r) > 0 && !r.outOfStock);
  const out = [];
  rows.forEach(r => {
    if (dKeptAsIs(r)) return;
    const vi = dVi(r.variantIdx), cost = priceRowCost(r);
    const others = rows.filter(o => o !== r && String(o.productId) === String(r.productId) && dVi(o.variantIdx) === vi && String(o.supplierId) !== String(r.supplierId))
      .map(o => ({ who: (supplierById(o.supplierId) || {}).name || String(o.supplierId), p: priceRowCost(o), row: o }));
    const paid = [];
    D().quotes.forEach(q => { if (q.voided) return; (q.items || []).forEach(it => { if (it && String(it.productId) === String(r.productId) && dVi(it.variantIdx) === vi && Number(it.receivedPrice) > 0 && lineLanded(it)) paid.push(Number(it.receivedPrice)); }); });
    const cmp = others.map(o => o.p).concat(paid);
    if (!cmp.length) return;
    const med = dMedian(cmp);
    if (!(med > 0) || cost <= 6 * med) return;
    const pick = (sizes) => { let b = null; sizes.filter(n => n > 1).forEach(n => { const each = cost / n, off = Math.abs(Math.log(each / med)); if (off < Math.log(1.6) && (!b || off < b.off - 1e-9)) b = { n, each, off }; }); return b; };
    const best = pick([Number(r.packQty) || 0].concat(others.map(o => Number(o.row.packQty) || 0))) || pick(D_PACKS);
    let unit = '';
    if (best) { const o = others.find(x => Number(x.row.packQty) === best.n && String(x.row.packUnit || '').trim()); unit = String(r.packUnit || '').trim() || (o ? String(o.row.packUnit).trim() : '') || 'box'; }
    out.push({ r, cost, med, times: cost / med, others, paid, fix: best ? { n: best.n, each: best.each, unit } : null });
  });
  return out.sort((a, b) => b.times - a.times);
}
// "Yes, it's a box price": the row becomes a pack price, each rung in pieces.
async function dSaveAsPack(r, fx){
  const was = priceRowTiers(r), sup = supplierById(r.supplierId), cost = priceRowCost(r);
  const tiers = was.map(t => ({ minQty: Math.max(1, t.minQty) * fx.n, price: Math.round(t.price / fx.n * 100) / 100 }));
  const d = deriveWholesaleRetail(tiers, fx.n);
  await savePrice({ ...r, tiers, wholesale: d.wholesale, retail: d.retail, packUnit: fx.unit, packQty: fx.n, unit: r.unit || 'pc' });
  await logDecision('price.list', `${priceRowName(r)} at ${sup ? sup.name : r.supplierId}: ${n0(cost)} is a ${fx.unit} of ${fx.n} → ${n0(tiers[0].price)} a ${dUnit(r.unit)}`,
    { amount: tiers[0].price, ref: { table: 'prices', id: r.id }, before: { tiers: was, packUnit: r.packUnit || '', packQty: Number(r.packQty) || 0 }, after: { tiers, packUnit: fx.unit, packQty: fx.n, boxPrice: true } });
}
async function dKeepPrice(r){
  const sup = supplierById(r.supplierId), cost = priceRowCost(r);
  await logDecision('price.list', `${priceRowName(r)} at ${sup ? sup.name : r.supplierId}: ${n0(cost)} checked — it is right`, { amount: cost, ref: { table: 'prices', id: r.id }, after: { keptAsIs: true } });
}
// Packing on a price row: what a pack is and how many pieces are in it.
async function dSetPacking(r, unit, n){
  const tiers = priceRowTiers(r), sup = supplierById(r.supplierId), d = deriveWholesaleRetail(tiers, n);
  await savePrice({ ...r, tiers, wholesale: d.wholesale, retail: d.retail, packUnit: unit, packQty: n, unit: r.unit || 'pc' });
  await logDecision('price.list', `${priceRowName(r)} at ${sup ? sup.name : r.supplierId}: packing ${n0(n)} ${dUnit(r.unit, n !== 1)} in a ${unit}`,
    { ref: { table: 'prices', id: r.id }, before: { packUnit: r.packUnit || '', packQty: Number(r.packQty) || 0 }, after: { packUnit: unit, packQty: n } });
}

/* ---- suppliers that look like one ----
   The same phone, or names that match once case, punctuation and a plural
   are set aside ("Steel" and "Steels"). A pair kept apart ("Not the
   same", a supplier.edit line in the owner's log) is not shown again. */
function dSupKey(name){ return String(name || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean).map(dStem).join(' '); }
function dPhones(s){ return [s.phone, s.phone2].map(phoneDigits).filter(p => p.length >= 11); }
function dKeptApart(a, b){
  const A2 = String(a), B2 = String(b);
  return D().log.some(x => {
    if (x.task !== 'supplier.edit') return false;
    const ids = (x.after && Array.isArray(x.after.keptApart) && x.after.keptApart) || (x.ref && Array.isArray(x.ref.ids) && /^Kept apart/.test(x.what || '') && x.ref.ids) || null;
    return !!ids && ids.map(String).includes(A2) && ids.map(String).includes(B2);
  });
}
function dTwinWhy(a, b){
  const why = [], pb = dPhones(b);
  const ka = dSupKey(a.name), kb = dSupKey(b.name);
  if (ka && ka === kb) why.push(normName(a.name) === normName(b.name) ? 'same name' : 'names match');
  if (dPhones(a).some(p => pb.includes(p))) why.push('same phone');
  return why;
}
function dIdNum(s){ return Number(String(s.id).replace(/\D/g, '')) || 0; }
function dSupCounts(sid){
  const id = String(sid), d = D();
  const prices = d.prices.filter(p => String(p.supplierId) === id).length;
  let quotes = 0, hunts = 0;
  d.leads.forEach(l => { if (l.voided) return; const mine = leadSuppliers(l).filter(c => String(c.supplierId) === id); if (mine.length) hunts++; quotes += mine.filter(candidateHasPrice).length; });
  const orders = d.quotes.filter(q => !q.voided && (q.items || []).some(it => it && String(it.supplierId) === id)).length;
  return { prices, quotes, hunts, orders };
}
function dBusy(c){ return c.prices + c.quotes + c.hunts + c.orders; }
// Keep the busier one; with a tie, the one on file first.
function dKeepOrder(a, b){
  const ba = dBusy(dSupCounts(a.id)), bb = dBusy(dSupCounts(b.id));
  if (ba !== bb) return ba > bb ? [a, b] : [b, a];
  return dIdNum(a) <= dIdNum(b) ? [a, b] : [b, a];
}
function dTwins(){
  const s = D().suppliers, out = [];
  for (let i = 0; i < s.length; i++) for (let j = i + 1; j < s.length; j++) {
    const why = dTwinWhy(s[i], s[j]);
    if (!why.length || dKeptApart(s[i].id, s[j].id)) continue;
    const [keep, fold] = dKeepOrder(s[i], s[j]);
    out.push({ a: keep, b: fold, why });
  }
  return out;
}

/* ---- what a supplier sells ----
   The shop's own aisles (product categories), most used first; a
   supplier's are the aisles of the items they price, then the tags kept on
   them ("Sells: roofing, paint" in their notes, as Kind and Card are). */
function dSellTags(){
  const n = {};
  D().products.forEach(p => { const c = String(p.category || '').trim().toLowerCase(); if (c) n[c] = (n[c] || 0) + 1; });
  return Object.keys(n).sort((a, b) => n[b] - n[a] || a.localeCompare(b));
}
function dNoteTags(notes){ const m = String(notes || '').split('\n').map(x => /^\s*Sells:\s*(.*)$/i.exec(x)).find(Boolean); return m ? m[1].split(',').map(x => x.trim().toLowerCase()).filter(Boolean) : []; }
function dWithTags(notes, tags){ const keep = String(notes || '').split('\n').filter(x => !/^\s*Sells:/i.test(x) && x.trim() !== ''); return keep.concat(tags.length ? ['Sells: ' + tags.join(', ')] : []).join('\n'); }
function dSupSells(s){
  const n = {};
  D().prices.filter(r => String(r.supplierId) === String(s.id)).forEach(r => { const p = productById(r.productId); const c = String((p && p.category) || '').trim().toLowerCase(); if (c) n[c] = (n[c] || 0) + 1; });
  const out = Object.keys(n).sort((a, b) => n[b] - n[a] || a.localeCompare(b));
  dNoteTags(s.notes).forEach(t => { if (!out.includes(t)) out.push(t); });
  return out;
}
// Open hunts in the line of these tags: a word of the tag, or of an item
// we sell in that aisle, is in the hunt's name (or the hunt's item is in it).
function dHuntsForTags(tags, sid){
  if (!tags.length) return [];
  const words = new Set();
  tags.forEach(t => {
    dWords(t).forEach(w => words.add(w));
    D().products.filter(p => String(p.category || '').trim().toLowerCase() === t).forEach(p => dWords(p.name).forEach(w => words.add(w)));
  });
  return openLeads().filter(l => {
    if (sid && leadSuppliers(l).some(c => String(c.supplierId) === String(sid))) return false;
    const p = l.productId ? productById(l.productId) : null;
    if (p && tags.includes(String(p.category || '').trim().toLowerCase())) return true;
    return dWords(l.name).some(w => words.has(w));
  }).sort((a, b) => leadDistinctAskers(b) - leadDistinctAskers(a) || leadFirstAskedAt(a) - leadFirstAskedAt(b));
}
// Already on file? A name that matches once tidied, or the same phone.
function dLookAlike(name, phone, exceptId){
  const k = dSupKey(name), ph = phoneDigits(phone);
  return D().suppliers.filter(s => String(s.id) !== String(exceptId || '')).map(s => {
    const why = [];
    if (k && dSupKey(s.name) === k) why.push('name');
    if (ph.length >= 11 && dPhones(s).includes(ph)) why.push('phone');
    return { s, why };
  }).filter(x => x.why.length)[0] || null;
}

  }
  return other.concat(kind ? ['Kind: ' + kind] : [], card ? ['Card: ' + card] : []).join('\n');

/* ---- PriceIt ---- */
/* Price it: what a found item will sell at -- cost, whose markup applies,
   and where that lands against the market. The board "Price it — sells at
   the shop's 25% until the Manager sets a markup (suggesting one:
   PROPOSED)". Sourcing never sets a markup: SELLS AT is always the rule
   in force; the slider only keeps a suggestion for the Manager. */

// The supplier and rung the item would be bought at: the cheapest price
// for what the askers want (candidateUnitPriceAt at the asked quantity),
// or the supplier the caller chose.
function priceItPick(l, candId){
  const q = Math.max(1, leadDemandQty(l));
  let best = null;
  leadSuppliers(l).filter(candidateHasPrice).forEach(c => {
    const tiers = candidatePieceTiers(c); if (!tiers.length) return;
    const cost = candidateUnitPriceAt(c, q) || tiers[0].price;
    const rung = tiers.filter(t => q >= t.minQty).pop() || tiers[0];
    const x = { c, cost, rung, q };
    if (candId && c.id === candId) best = { ...x, chosen: true };
    else if (!(best && best.chosen) && (!best || cost < best.cost)) best = x;
  });
  return best;
}
// What the askers said they would pay: a stated top price, or the price
// on the order line a dropped request came from. The lowest of them.
function priceItCap(l){
  const caps = (l.requests || []).filter(r => !r.withdrawn).map(r => Number(r.maxPrice) || (r.source === 'dropped' ? Number(r.sellPrice) || 0 : 0)).filter(v => v > 0);
  return caps.length ? Math.min(...caps) : 0;
}
function priceItProduct(l){
  if (l.productId && productById(l.productId)) return productById(l.productId);
  const r = (l.requests || []).find(x => x.productId && productById(x.productId));
  return r ? productById(r.productId) : null;
}

      <span style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #DCD6CC"></span>
      <span style="font-size: 15px; font-weight: 700; color: #3B4566">{{ newQ }}</span>
      <sc-for list="{{ rungs }}" as="g"><label style="display: flex; align-items: baseline; gap: 10px; padding: 4px 0; box-shadow: inset 0 -2px 0 #16203C"><sc-if value="{{ g.many }}"><span class="m" style="flex: none; font-size: 13px; color: #5F6980">{{ g.qty }}</span></sc-if><input type="text" inputmode="numeric" value="{{ g.draft }}" onInput="{{ g.type }}" aria-label="{{ g.inputLabel }}" class="m" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 40px; font-weight: 500; letter-spacing: -.04em; color: #1C2233; padding: 0"><span style="flex: none; font-size: 15px; font-weight: 600; color: #5F6980">{{ newUnit }}</span></label></sc-for>

  Component: class extends SrvLogic {
    constructor(props) { super(props); this.state = { how: {}, editing: null, drafts: {} }; }
    renderVals() {
      const s = this.state, d = D();
      const share = todaysShare();
      const per = share.perDay;
      const HOW = { wa: 'whatsapp', call: 'phone', shop: 'in person' };
      const HOWS = [['wa', 'WhatsApp'], ['call', 'Called'], ['shop', 'At the shop']];
      // The log line that confirmed a row today: who, and what it was before.
      const lineFor = (r) => d.log.find(x => x.task === 'price.confirm' && x.ref && String(x.ref.id) === String(r.id) && isoOf(x.at) === todayISO()) || null;
      // Today's share, one card a supplier: one message asks about all of theirs.
      const groups = [];
      share.today.forEach(x => {
        const sid = String(x.r.supplierId);
        let g = groups.find(y => y.sid === sid);
        if (!g) { g = { sid, sup: supplierById(sid), rows: [] }; groups.push(g); }
        g.rows.push(x);
      });
      // A supplier with a row still to check comes first, the oldest first.
      const oldestOf = (g) => Math.max(...g.rows.filter(x => !x.done).map(x => x.age == null ? 1e6 : x.age), -1);
      groups.sort((a, b) => oldestOf(b) - oldestOf(a));
      const setPer = (n) => {
        if (!(n >= 1) || n === per) return;
        guarded('set prices a day', async () => {
          const { data, error } = await sb.rpc('set_prices_per_day', { p_shop_id: S.shopId, p_per_day: n });
          if (error) throw new Error(error.message || String(error));
          const v = Number(data && data.perDay) || n;
          D().presets.priceReview = { ...(D().presets.priceReview || {}), perDay: v };
          saveSnapshot();
          FEEL.tick(); toast(`${plural(v, 'price')} a day — in the owner’s log`);
        });
      };
      const sups = groups.map(g => {
        const sup = g.sup, name = sup ? sup.name : g.sid, t = tintFor(g.sid);
        const how = s.how[g.sid], open = g.rows.filter(x => !x.done), all = !open.length;
        const oldest = Math.max(...open.map(x => x.age == null ? -1 : x.age), -1);
        const msg = `Hello ${name}, ${signWord()}. Are these prices still right?\n` + open.map(x => `• ${priceRowName(x.r)}: ${n0(priceRowCost(x.r))} a ${dUnit(x.r.unit)}` + (dHasPack(x.r) ? ` (${dPackWord(x.r)})` : '')).join('\n') + '\nPlease tell me any new price, with the packing. Thank you.';
        return {
          sx: JSON.stringify({ supplierId: g.sid }), name, ini: initials(name), bg: t[0], fg: t[1],
          sub: plural(g.rows.length, 'price') + (open.length > 1 ? ' · one message asks for all' : '') + (open.length ? ' · oldest ' + (oldest < 0 ? 'has no date' : oldest + ' days') : ''),
          pill: all ? 'Checked ✓' : how ? 'answer each' : 'how will you check?', pillBg: all ? '#E4F4EA' : '#FDF1DC', pillFg: all ? '#0F6B43' : '#7A4A02',
          open: !all, howLabel: 'How you check ' + name,
          hows: HOWS.map(([k, label]) => ({ label, on: how === k ? 'true' : 'false', bg: how === k ? '#16203C' : '#F4F1EC', fg: how === k ? '#FFFFFF' : '#3B4566',
            pick: () => {
              FEEL.tick();
              if (k === 'wa') { if (!sup || !phoneDigits(sup.phone)) { toast(`No phone on file for ${name} — check another way`); return; } openWA(sup.phone, msg); }
              this.setState({ how: { ...this.state.how, [g.sid]: k } });
            } })),
          items: g.rows.map(x => {
            const r = x.r, rname = priceRowName(r), cost = priceRowCost(r), line = x.done ? lineFor(r) : null;
            const bt = line && line.before && line.before.tiers, at = line && line.after && line.after.tiers;
            const moved = !!(line && (bt && at ? JSON.stringify(bt) !== JSON.stringify(at) : /→/.test(line.what || '')));
            const was = moved && bt && bt[0] ? Number(bt[0].price) : null, shift = was != null && was !== cost;
            const who = x.who || { by: '?', name: 'someone', phone: false }, wt = tintFor(who.name);
            const waiting = !x.done && !how;
            const need = () => { FEEL.no(); toast(`How will you check ${name}? WhatsApp, Called or At the shop`); };
            return { n: rname, p: n0(shift ? was : cost), newP: shift ? '→ ' + n0(cost) : '', strike: shift ? 'line-through' : 'none', oldCol: shift ? '#767F91' : '#1C2233',
              unit: 'a ' + dUnit(r.unit), age: x.done ? 'checked today' : dAgeWord(x.age), pack: dHasPack(r) ? dPackWord(r) : 'packing not set', packCol: dHasPack(r) ? '#6B4A1A' : '#8E2A22',
              open: !x.done, done: !!x.done, waiting: waiting ? 'true' : null,
              btnBg: waiting ? '#F4F1EC' : '#FFFFFF', btnFg: waiting ? '#767F91' : '#1C2233', btnSh: waiting ? 'none' : '0 0 0 1px rgba(28,34,51,.14)',
              why: `How will you check ${name}? Pick WhatsApp, Called or At the shop first`, sameLabel: `${rname} is still ${n0(cost)}`, chgLabel: `A new price for ${rname}`,
              same: () => {
                if (waiting) { need(); return; }
                guarded('confirm a price', async () => {
                  await confirmPrice(r, null, HOW[how]);
                  FEEL.yes(); toast(`${rname} at ${name}: still ${n0(cost)} — in the owner’s log`);
                });
              },
              chg: () => { if (waiting) { need(); return; } FEEL.tick(); this.setState({ editing: r.id, editHow: HOW[how], drafts: {} }); },
              badge: moved ? 'new price' : '✓ same', badgeBg: moved ? '#FDEEE1' : '#E4F4EA', badgeFg: moved ? '#7A4A02' : '#0F6B43',
              by: who.by, avBg: wt[0], avFg: wt[1],
              doneLabel: `${rname}: ${moved ? 'new price ' + n0(cost) : 'still right'}, checked by ${who.name}${who.phone ? ' by phone' : ''}` };
          }),
        };
      });

      // The new figure, in a sheet: each rung of the ladder, the move, the packing kept.
      const er = s.editing != null ? d.prices.find(r => String(r.id) === String(s.editing)) : null;
      let sheet = { newOpen: false };
      if (er) {
        const rname = priceRowName(er), cost = priceRowCost(er), rungs = priceRowTiers(er), dr = s.drafts || {};
        const first = dr[0] != null && dr[0] !== '' ? Number(dr[0]) : cost, diff = first - cost;
        const sup = supplierById(er.supplierId);
        sheet = {
          newOpen: true, newQ: `${rname} · was ${n0(cost)}`, newUnit: 'a ' + dUnit(er.unit),
          rungs: rungs.map((t, k) => ({ many: rungs.length > 1, qty: n0(t.minQty) + '+',
            draft: dr[k] != null ? String(dr[k]) : String(t.price),
            inputLabel: 'New price for ' + rname + (rungs.length > 1 ? ', ' + t.minQty + ' or more' : ''),
            type: (e) => { const v = e && e.target ? e.target.value : ''; this.setState({ drafts: { ...this.state.drafts, [k]: v } }); } })),
          move: !(first > 0) ? 'Type the new price' : diff > 0 ? `Up ${n0(diff)}` : diff < 0 ? `Down ${n0(-diff)}` : 'The same as before',
          moveCol: diff > 0 ? '#A82D24' : diff < 0 ? '#0F6B43' : '#5F6980',
          newPack: (dHasPack(er) ? dPackWord(er) : 'packing not set') + ' · same packing',
          saveWord: first > 0 ? 'Save ' + n0(first) : 'Save',
          cancel: () => { FEEL.back(); this.setState({ editing: null, drafts: {} }); },
          saveNew: () => {
            const dr2 = this.state.drafts || {};
            const tiers = rungs.map((t, k) => ({ minQty: t.minQty, price: dr2[k] != null && dr2[k] !== '' ? Number(dr2[k]) : t.price }));
            if (tiers.some(t => !(t.price > 0))) { FEEL.no(); toast('Each step needs a figure above 0'); return; }
            guarded('save a new figure', async () => {
              await confirmPrice(er, tiers, this.state.editHow || 'in person');
              this.state = { ...this.state, editing: null, drafts: {} };
              FEEL.yes(); toast(`${rname} at ${sup ? sup.name : 'the supplier'}: ${n0(cost)} → ${n0(tiers[0].price)} — in the owner’s log`);
            });
          },
        };
      }
      const h = dHealth(), wrong = dWrongPrices();
      return {
        nav: navVals(), ...sheet,
        per, done: share.done, perLabel: `${per} prices checked a day`,
        less: () => setPer(per - 1), more: () => setPer(per + 1),
        ring: 'conic-gradient(#6FDCB0 0 ' + Math.min(100, Math.round(share.done / Math.max(1, per) * 100)) + '%, rgba(255,255,255,.12) 0)',
        ringLabel: `${share.done} of ${per} prices checked today`,
        total: n0(h.total), freshN: h.fresh, soonN: h.soon, oldN: h.old,
        healthLabel: `${h.fresh} fresh, ${h.soon} getting old, ${h.old} old`,
        orderWord: 'oldest first', nextWord: share.next.length ? `${plural(share.next.length, 'more price')} due after today` : '', hasNext: share.next.length > 0 && sups.length > 0,
        sups, noToday: !sups.length, staleDays: share.staleDays,
        hasWrong: wrong.length > 0, wrongWord: plural(wrong.length, 'price looks', 'prices look') + ' wrong',
        wrongSub: wrong.some(x => x.fix) ? 'a box price saved as a piece price · fix them' : 'far above the others · check them',
      };
    }
  },
};

/* A supplier answered -- log the price ladder (the board "A supplier
   answered — log the price ladder"). Each step is a quantity and a price
   in the unit they quoted (a piece, a bundle of 10, a carton of 50…); it is
   kept on the supplier's row of the request the console's way, in base
   pieces: tiers [{ minQty, price, unit, n }] (index.html candidateTiers),
   with the pack, how soon, transport, how long it holds and whether they
   make it or bring it in. Saving moves the request forward through the
   console's gates (Looking → Found → Priced), never past what it shows. */

const QUOTE_UNITS = ['pc', 'bundle', 'carton', 'bag'];
const QUOTE_PACKS = ['', 'bundle', 'carton', 'bag', 'box', 'roll'];
const QUOTE_HOLDS = [3, 7, 14, 30];
const QUOTE_ROLES = ['supplier', 'importer', 'both'];
function quoteDigits(v){ const n = Number(String(v == null ? '' : v).replace(/[^0-9.]/g, '')); return isFinite(n) && n > 0 ? n : 0; }
// The request: the one named, else the top open request with a supplier waiting.
function quoteLead(props){
  const named = props && props.leadId ? leadById(props.leadId) : null;
  if (named) return named;
  const open = openLeads().filter(l => l.status !== 'priced');
  open.sort((a, b) => (leadSuppliers(b).some(c => c.askedAt && !candidateHasPrice(c)) ? 1 : 0) - (leadSuppliers(a).some(c => c.askedAt && !candidateHasPrice(c)) ? 1 : 0)
    || leadDistinctAskers(b) - leadDistinctAskers(a) || leadFirstAskedAt(a) - leadFirstAskedAt(b));
  return open[0] || null;
}
// Which supplier answered: the one named, else the one asked most lately
// who has not quoted, else the first on the request.
function quoteCand(l, props, st){
  const cands = leadSuppliers(l);
  if (st.candId) return cands.find(c => c.id === st.candId) || null;
  if (props.candId) { const c = cands.find(x => x.id === props.candId); if (c) return c; }
  if (props.supplierId) return cands.find(c => String(c.supplierId) === String(props.supplierId)) || null;
  if (st.supplierId) return null;
  const waiting = cands.filter(c => c.askedAt && !candidateHasPrice(c)).sort((a, b) => msOf(b.askedAt) - msOf(a.askedAt));
  // Only one who was asked and has not answered; anyone else is picked by hand.
  return waiting.length === 1 ? waiting[0] : null;
}
// A ladder step from a stored tier (base pieces) and back.
function quoteStepsOf(c){
  const t = c ? candidateTiers(c) : [];
  if (!t.length) return [{ q: '1', unit: 'pc', n: '', p: '' }];
  return t.map(x => { const n = Number(x.n) > 0 && x.unit && x.unit !== 'pc' ? Number(x.n) : 1;
    return { q: String(Math.max(1, Math.round(x.minQty / n))), unit: n > 1 ? x.unit : 'pc', n: n > 1 ? String(n) : '', p: String(Math.round(x.price * n)) }; });
}
function quoteTiersOf(steps){
  return steps.map(s => { const n = s.unit === 'pc' ? 1 : quoteDigits(s.n); const q = quoteDigits(s.q) || 1, p = quoteDigits(s.p);
    return n && p ? { minQty: q * n, price: p / n, unit: s.unit, n } : null; }).filter(Boolean).sort((a, b) => a.minQty - b.minQty);
}
function quotePerPieceAt(tiers, qty){ let best = null, bm = -1; tiers.forEach(t => { if (qty >= t.minQty && t.minQty > bm) { best = t.price; bm = t.minQty; } }); return best; }

/* ---- RunDone ---- */
/* Run done -- what came back, what moved (the board "Run done — what came
   back, what moved"). Worked out from today's real writes only: hunts'
   candidates asked today (askedAt / quotedAt), today's prices you
   confirmed in person (decision_log price.confirm), rival prices seen
   today, rows marked can't supply today, and suppliers added today
   (decision_log supplier.edit). Nothing here is kept on the phone. */
function rdToday(){
  const me = S.user && S.user.id, today = todayISO();
  const times = [], shops = new Map();
  const shop = (key, name, area) => { if (!shops.has(key)) shops.set(key, { name, area }); };
  let got = 0, good = 0, cant = 0, tags = 0;
  const moved = [];
  D().leads.forEach(l => {
    let touched = null;
    leadSuppliers(l).forEach(c => {
      if (!mrIsToday(c.askedAt)) return;
      times.push(msOf(c.askedAt));
      const sup = c.supplierId && supplierById(c.supplierId);
      shop('s:' + (c.supplierId || normName(c.supplierName)), candName(c), sup ? sup.location : '');
      if (c.noStock) cant++;
      else if (c.runKind === 'recheck' && !c.runNew) good++;
      else if (candidateHasPrice(c)) got++;
      if (c.leadWas && (!touched || msOf(c.runAt) < msOf(touched.runAt))) touched = c;
    });
    leadResearch(l).rivals.forEach(r => { if (mrIsToday(r.seenAt)) { tags++; times.push(msOf(r.seenAt)); shop('r:' + normName(r.name), r.name, r.area || ''); } });
    if (touched && !l.voided && STAGES.indexOf(l.status) > STAGES.indexOf(touched.leadWas)) moved.push({ l, from: touched.leadWas });
  });
  D().log.forEach(g => {
    if (!mrIsToday(g.at) || g.by !== me) return;
    if (g.task === 'price.confirm' && g.after && g.after.how !== 'phone') {
      const row = D().prices.find(p => g.ref && String(p.id) === String(g.ref.id));
      const was = g.before && g.before.tiers && g.before.tiers[0] ? Number(g.before.tiers[0].price) : null;
      const now = g.after.tiers && g.after.tiers[0] ? Number(g.after.tiers[0].price) : null;
      if (was != null && now != null && was !== now) got++; else good++;
      times.push(msOf(g.at));
      if (row) { const sup = supplierById(row.supplierId); shop('s:' + row.supplierId, sup ? sup.name : row.supplierId, sup ? sup.location : ''); }
    }
  });
  D().prices.forEach(p => { if (p.outOfStock && p.outOfStockSince === today) { cant++; const sup = supplierById(p.supplierId); shop('s:' + p.supplierId, sup ? sup.name : p.supplierId, sup ? sup.location : ''); } });
  D().rivals.forEach(r => { if (r.seenOn === today && r.price > 0) { tags++; shop('r:' + normName(r.rival), r.rival, ''); } });
  // A supplier added today says so in the owner's log (supplier.edit).
  const newSups = [];
  D().log.forEach(g => { if (mrIsToday(g.at) && g.task === 'supplier.edit' && g.by === me && /new|add|met/i.test(g.what || '')) { const s = g.ref && supplierById(g.ref.id); const n = s ? s.name : ''; if (n && !newSups.includes(n)) newSups.push(n); } });
  // Samples bought today ride in the hunt (leadMeta sample: PROPOSED).
  let sampleCash = 0;
  D().leads.forEach(l => { const m = leadResearch(l).meta; if (m && m.sample && mrIsToday(m.sample.at) && Number(m.sample.cost) > 0) sampleCash += Number(m.sample.cost); });
  const t = times.filter(Boolean).sort((a, b) => a - b);
  return { got, good, cant, tags, newSups, moved, sampleCash, shops: [...shops.values()], from: t[0] || 0, to: t[t.length - 1] || 0 };
}

/* ---- Sample ---- */
/* Sample check -- optional, inside Found (the board "Sample check —
   optional, inside Found (sample record: PROPOSED)"). There is no Sample
   stage: the check rides on the request (leadMeta(l).sample = { at, by,
   cost, checks, verdict, ... }). Each check is pass, fail or not checked.
   Sourcing does not write cash: what the sample cost is said here and in
   one line of the owner's log; Accounts records the money. */

// The checks a sample goes through, in the order drawn; a stored check
// with another key keeps its own name.
function sampleCheckDefs(l){
  const asker = leadAskers(l)[0];
  return [
    { k: 'size', label: 'Size is what they asked for', how: 'tape' },
    { k: 'finish', label: 'Finish and make hold up', how: 'by eye' },
    { k: 'pack', label: 'Packed as quoted', how: 'count' },
    { k: 'client', label: asker ? `${firstWord(asker.name)} says yes` : 'The client says yes', how: 'client' },
  ];
}
// The request: the one named, else the top open one with a sample under
// way, else the top found one.
function sampleLead(props){
  const named = props && props.leadId ? leadById(props.leadId) : null;
  if (named) return named;
  const open = openLeads();
  const rank = (a, b) => leadDistinctAskers(b) - leadDistinctAskers(a) || leadFirstAskedAt(a) - leadFirstAskedAt(b);
  const going = open.filter(l => { const s = leadMeta(JSON.parse(JSON.stringify(l))).sample; return s && !s.verdict; }).sort(rank);
  return going[0] || open.filter(l => l.status === 'sourced').sort(rank)[0] || null;
}
function sampleDigits(v){ const n = Number(String(v == null ? '' : v).replace(/[^0-9]/g, '')); return n > 0 ? n : 0; }

/* Tell the clients who asked -- one tap each: WhatsApp opens with the
   words written; a separate tap records that they were told, on their
   follow-up, with the price they heard (index.html recordFollowUpContact). */

// The listed request: the one named, else the latest listed, else none.
function tellLead(props){
  const named = props && props.leadId ? leadById(props.leadId) : null;
  if (named && named.status === 'listed' && !named.voided) return named;
  return D().leads.filter(l => !l.voided && l.status === 'listed').sort((a, b) => msOf(b.graduatedAt) - msOf(a.graduatedAt))[0] || null;
}
// The price they hear: the cheapest supplier row at effectiveMarkupRule
// (the shop's default until the Manager sets one) -- as listLead logs it.
function tellSell(l){
  const p = l && productById(l.productId);
  const rows = p ? D().prices.filter(r => String(r.productId) === String(p.id) && r.variantIdx == null && priceRowCost(r) > 0) : [];
  const best = rows.slice().sort((a, b) => priceRowCost(a) - priceRowCost(b))[0] || null;
  const cost = best ? priceRowCost(best) : 0;
  return { p, best, sell: cost ? sellAt(cost, effectiveMarkupRule(p, null, 'wholesale')) : 0, unit: (best && best.unit) || 'pc' };
}
// Their follow-up on this request: an open one first, else the latest.
function tellFollow(l, cid){
  const fs = D().followUps.filter(f => f.leadId === l.id && String(f.customerId) === String(cid));
  return fs.find(f => !f.closedAt) || fs.sort((a, b) => msOf(b.createdAt) - msOf(a.createdAt))[0] || null;
}
// Told = a contact on that follow-up after it was listed (canvas note p2).
function tellToldAt(l, f){ const c = f && (f.contacts || []).filter(c => msOf(c.at) >= msOf(l.graduatedAt)).sort((a, b) => msOf(b.at) - msOf(a.at))[0]; return c ? c.at : null; }
function tellUnitWord(u){ u = String(u || 'pc').trim().toLowerCase(); return ({ pc: 'piece', pcs: 'piece', piece: 'piece', m: 'metre' })[u] || u; }

        const short = firstWord(a.name) || a.name, total = x.sell && a.qty ? x.sell * a.qty : 0;
        return `Hello ${short}, good news — the ${name} you asked us for is now in at ${shop}.\n` +
          (x.sell ? `${n0(x.sell)} a ${unitWord}` + (a.qty ? `, so your ${n0(a.qty)} come to ${n0(total)}.` : '.') + '\n' : '') +
          'Shall we put them on an order for you?';
      };
      const nextAfter = (key) => rows.find(o => o.a.key !== key && !o.told && o.phone && (s.asking == null || o.a.key !== s.asking));
      const open = (r) => { FEEL.open(); openWA(r.phone, msgOf(r.a)); this.setState({ asking: r.a.key, sel: r.a.key }); };
      const people = rows.map((r, i) => {
        const a = r.a, total = x.sell && a.qty ? x.sell * a.qty : 0;
        return { ini: initials(a.name), name: a.name, ava: avStyle(a.key, 40) + '; font-size: 13px',
          what: [a.qty ? n0(a.qty) + ' ' + x.unit : '', total ? n0(total) : ''].filter(Boolean).join(' · ') || 'no quantity',
          when: r.told ? ' · told ' + agoWord(r.toldAt) : '',
          line: 'display: flex; align-items: center; gap: 12px; min-height: 68px' + (i ? '; box-shadow: inset 0 1px 0 #F0ECE6' : ''),
          told: r.told, canTell: !r.told && !!r.phone, noPhone: !r.told && !r.phone,
          tellWord: s.sel === a.key && s.asking == null && !r.told ? 'Tell again' : 'Tell',
          showLabel: `Show what ${a.name} gets`,
          show: () => { FEEL.tick(); this.setState({ sel: a.key }); },
          tell: () => open(r) };
      });
      const told = rows.filter(r => r.told).length, n = rows.length;
      const pre = rows.find(r => r.a.key === s.sel) || rows.find(r => !r.told && r.phone) || rows[0] || null;
      const left = rows.filter(r => !r.told && r.phone).length;
      const ask = s.asking != null ? rows.find(r => r.a.key === s.asking) : null;
      const nxt = ask ? nextAfter(ask.a.key) : null;

      // The team: agents get a pin on their Feed (agent-nudge pushes it);
      // the salespeople who asked get WhatsApp with the words written.
      const agents = D().agents.filter(a => !a.retiredAt);
      const sellers = annSalesFolk(l);
      const aOn = agents.length > 0 && s.agents !== false, sOn = sellers.length > 0 && s.sales !== false;
      const first = (nm) => firstWord(nm) || nm;
      const names = (list) => !list.length ? '' : list.length <= 3 ? list.map(a => first(a.name)).join(', ') : list.slice(0, 2).map(a => first(a.name)).join(', ') + ' and ' + (list.length - 2) + ' more';
      const logged = annLogged(p);
      const teamSent = s.sent || !!logged;
      const priceTxt = x.sell ? n0(x.sell) + ' a ' + unitWord : '';
      const goes = p ? D().links.filter(k => k.active && k.verb === 'with' && (k.fromId === p.id || k.toId === p.id)).map(k => productById(k.fromId === p.id ? k.toId : k.fromId)).filter(Boolean) : [];
      const note = `${name} is in` + (priceTxt ? ` · ${priceTxt}` : '') + '.' + (goes.length ? ` Goes with ${goes.slice(0, 2).map(g => g.name.toLowerCase()).join(' and ')}.` : '');
      const ends = new Date(Date.now() + 13 * DAY).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      const sw = (key, label, list, how, on) => ({ name: label, who: list.length ? `${names(list)} · ${how}` : (key === 'agents' ? 'No agents on the books' : 'Nobody on the sales desk asked for it'),
        on: on ? 'true' : 'false',
        toggle: () => { if (!list.length || teamSent) { FEEL.no(); toast(teamSent ? 'The team was told already' : 'Nobody to tell there'); return; } FEEL.tick(); this.setState({ [key]: !on }); },
        row: 'width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; text-align: left' + (list.length ? '' : '; opacity: .6'),
        track: 'width: 46px; height: 28px; flex: none; border-radius: 999px; position: relative; background: ' + (on ? '#0F6B43' : '#E0DCD4'),
        knob: 'position: absolute; top: 3px; left: ' + (on ? '21px' : '3px') + '; width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.2)' });
      const teams = [sw('sales', 'Sales desk', sellers, 'WhatsApp, the words written', sOn), sw('agents', 'Agents', agents, 'pinned on their Feed 14 days, with a push', aOn)];
      const teamN = (aOn ? agents.length : 0) + (sOn ? sellers.filter(x2 => x2.phone).length : 0);
      const tellTeam = () => {
        if (teamSent || !teamN || !p) { FEEL.no(); toast(!p ? 'It is not in the catalogue yet' : 'Switch on at least one group to tell'); return; }
        guarded('Tell the team', async () => {
          if (aOn) await pinForAgents(p.id, note, 14);
          const withNo = sOn ? sellers.filter(x2 => x2.phone) : [], noNo = sOn ? sellers.filter(x2 => !x2.phone) : [];
          // One salesperson who asked: their chat opens with the words written.
          if (withNo.length === 1) openWA(withNo[0].phone, `Hello ${first(withNo[0].name)}, your request was listed — ${name} is in at ${shop}` + (priceTxt ? `, ${priceTxt}` : '') + '.' + (withNo[0].clients.length ? ` ${withNo[0].clients.join(', ')} can order it now.` : ''));
          const parts = [aOn ? `pinned on the Feed of ${plural(agents.length, 'agent')} till ${ends}` : '',
            withNo.length ? `WhatsApp with the words written for ${names(withNo)} on the sales desk` : '', noNo.length ? `no number on file for ${names(noNo)}` : ''].filter(Boolean);
          await logDecision('product.edit', `Announced “${name}” — ${parts.join('; ')}`, { amount: x.sell ? Math.round(x.sell) : null, ref: { table: 'products', id: p.id },
            after: { announced: true, leadId: l.id, agents: aOn ? agents.map(a => a.id) : [], sales: sOn ? sellers.map(x2 => x2.name) : [], pinDays: aOn ? 14 : 0 } });
          FEEL.yes(); toast(aOn ? `On every agent’s Feed till ${ends}` : 'Logged for the owner');
          this.setState({ sent: true });
        });
      };
      return {
        has: true, none: !n, hasPeople: n > 0, busy: S.busy,
        emptyTitle: 'Nobody asked by name', emptyWord: 'This one was listed without anyone on file to tell.',
        title: 'On the shelf. Tell them.',
        sub: [name, x.sell ? `${n0(x.sell)} a ${unitWord}` : '', packSell ? `${n0(packSell)} a ${pk.packUnit}` : ''].filter(Boolean).join(' · '),
        photo: photoStyle((p && p.image) || l.image, 'background: linear-gradient(160deg, #5CC28A, #1E9D57)'), noPhoto: !((p && p.image) || l.image), photoLabel: 'The item',
        toldN: told, allN: n, ringLabel: `${told} of ${n} told`,
        ring: `width: 44px; height: 44px; flex: none; border-radius: 999px; background: conic-gradient(#6FDCB0 0 ${n ? Math.round(told / n * 100) : 0}%, rgba(255,255,255,.14) 0); display: flex; align-items: center; justify-content: center`,
        headline: n && told === n ? 'Everyone who asked knows' : left ? `${left} still to tell` : n ? 'Nobody left with a number' : 'Nobody asked by name',
        people, preWho: pre ? first(pre.a.name) : 'they', preMsg: pre ? msgOf(pre.a) : '',
        teams, teamDone: teamSent, teamOpen: !teamSent, teamOff: !teamN || S.busy,
        teamDoneWord: logged && !s.sent ? `Told the team ${agoWord(logged.at)}` : 'Told the team',
        teamWord: teamN ? `Tell the team · ${plural(teamN, 'person', 'people')}` : 'Nobody chosen',
        tellTeam,
        doneWord: n && told === n ? 'Done · back to Today' : 'Finish later',
        asking: !!ask, askTitle: ask ? `Did the message go to ${ask.a.name}?` : '',
        askNoFile: !!(ask && !ask.a.customerId), askNoFileWord: 'Not a client on file, so there is no follow-up to mark.',
        yesWord: nxt ? 'Yes, sent · next' : 'Yes, sent',
        notSent: () => { FEEL.back(); this.setState({ asking: null }); },
        yes: () => {
          if (!ask) return;
          // The next one's chat opens on this same tap (WhatsApp is opened
          // by a person's tap, never by a timer); this one is saved behind it.
          if (nxt) open(nxt); else this.setState({ asking: null });
          if (!ask.a.customerId) { FEEL.yes(); toast(`${ask.a.name} sent — not a client on file`); return; }
          guarded('Mark told', async () => {
            let f = ask.f && !ask.f.closedAt ? ask.f : null;
            if (!f) f = await addFollowUp(ask.a.customerId, l.id, { qty: ask.a.qty || null });
            if (!f) throw new Error('No follow-up could be made for ' + ask.a.name);
            await recordFollowUpContact(f, 'listed', x.sell ? Math.round(x.sell) : null);
            FEEL.yes(); toast(`${ask.a.name} told` + (x.sell ? ` — ${n0(x.sell)} a ${unitWord}` : ''));
          });
        },
      };
    }
  },
};


boot();
</script>
