/* ---- MarketRun ---- */
/* Market run -- the day's stops, built from open hunts (the board "Market
   run — the day's stops, built from open hunts").

   The run model below (mr*) is also what AtShop and RunDone read, so the
   three screens can never disagree about what a stop holds:

   A supplier's stop holds, from the shop's own records:
     hunt     an open hunt where they are a candidate with no price yet
     recheck  their quote on a found / priced hunt that lapses within two
              days (sourcing-console.js 1671: valid validDays || 7 from
              quotedAt, re-confirm when 2 or fewer days are left)
     price    a row of today's share of prices (todaysShare().today, not
              yet done) on their price list
     anyone   an asked / looking hunt nobody has a price for: asked at
              every shop, listed once as "Anyone with these"
   A rival's stop (a shop seen in rival_prices or a hunt's research):
     rival    a found / priced hunt with fewer than 3 rival prices
              (sourcing-console.js 1662), and the key lines (demandKeys)
              with no rival price seen before today.
   An item counts as answered when today's write is in the records: a
   candidate's askedAt today, a price confirmed (or marked can't supply)
   today, a rival price seen today. The only thing kept on the phone is
   the plan: which area, the stops' order, the stops left out, and a
   rival tag that was not on their shelf (no row is written for that). */

function mrPlanKey(){ return 'ow-sourcing-run:' + (S.shopId || '') + ':' + todayISO(); }
function mrPlanLoad(){ try { const p = JSON.parse(localStorage.getItem(mrPlanKey())); return p && typeof p === 'object' ? p : {}; } catch (_e) { return {}; } }
function mrPlanSave(p){ try { localStorage.setItem(mrPlanKey(), JSON.stringify(p)); } catch (_e) {} }
function mrIsToday(ts){ return !!ts && isoOf(ts) === todayISO(); }
function mrShort(name){ return String(name || '').split(' · ')[0].trim(); }
// sourcing-console.js quoteAgeOf / quoteValidOf: days left on a quote.
function mrQuoteLeft(c){ return (Number(c.validDays) || 7) - daysSince(c.quotedAt || c.at); }
function mrCandAt(l, sup){ return leadSuppliers(l).find(x => (x.supplierId && String(x.supplierId) === String(sup.id)) || (!x.supplierId && normName(x.supplierName) === normName(sup.name))) || null; }
function mrNobodyHasIt(l, sup){
  return (l.status === 'asked' || l.status === 'looking') && !leadSuppliers(l).some(c => candidateHasPrice(c) && !c.noStock && !(sup && c === mrCandAt(l, sup)));
}
function mrRivalNames(){
  const out = new Map();
  D().rivals.forEach(r => { const n = String(r.rival || '').trim(); if (n && !out.has(normName(n))) out.set(normName(n), { name: n, area: '' }); });
  openLeads().forEach(l => leadResearch(l).rivals.forEach(r => { const n = String(r.name || '').trim(); if (!n) return; const k = normName(n), had = out.get(k);
    if (!had) out.set(k, { name: n, area: r.area || '' }); else if (!had.area && r.area) had.area = r.area; }));
  return [...out.values()];
}
// Everything to ask at one stop, answered or not.
function mrItemsFor(stop){
  const items = [];
  if (stop.type === 'sup') {
    const sup = supplierById(stop.id);
    if (!sup) return items;
    const anyone = [];
    openLeads().forEach(l => {
      const c = mrCandAt(l, sup);
      if (c && mrIsToday(c.askedAt)) {
        const kind = c.runKind || (candidateHasPrice(c) ? 'recheck' : 'hunt');
        const it = { key: 'L:' + l.id, kind, lead: l, cand: c, name: l.name, answered: { no: !!c.noStock, val: c.noStock ? 'none' : candidateHasPrice(c) ? short((candidateTiers(c)[0] || {}).price) : '✓' } };
        (kind === 'anyone' ? anyone : items).push(it);
        return;
      }
      if (c && c.noStock) return;
      if (c && !candidateHasPrice(c)) { items.push({ key: 'L:' + l.id, kind: 'hunt', lead: l, cand: c, name: l.name, answered: null }); return; }
      if (c && (l.status === 'sourced' || l.status === 'priced') && mrQuoteLeft(c) <= 2) { items.push({ key: 'L:' + l.id, kind: 'recheck', lead: l, cand: c, name: l.name, left: mrQuoteLeft(c), answered: null }); return; }
      if (!c && mrNobodyHasIt(l, sup)) anyone.push({ key: 'L:' + l.id, kind: 'anyone', lead: l, cand: null, name: l.name, answered: null });
    });
    const share = todaysShare(), me = S.user && S.user.id;
    share.today.forEach(x => {
      if (String(x.r.supplierId) !== String(sup.id)) return;
      if (x.done) {
        const line = D().log.find(g => g.task === 'price.confirm' && g.ref && String(g.ref.id) === String(x.r.id) && mrIsToday(g.at));
        if (!line || line.by !== me || (line.after && line.after.how === 'phone')) return;
        items.push({ key: 'P:' + x.r.id, kind: 'price', row: x.r, name: priceRowName(x.r), age: 0, answered: { no: false, val: short(priceRowCost(x.r)) } });
        return;
      }
      const cant = x.r.outOfStock && x.r.outOfStockSince === todayISO();
      items.push({ key: 'P:' + x.r.id, kind: 'price', row: x.r, name: priceRowName(x.r), age: x.age, answered: cant ? { no: true, val: 'none' } : null });
    });
    return items.concat(anyone);
  }
  // A rival's shop: look only.
  const R = normName(stop.name);
  openLeads().forEach(l => {
    if (l.status !== 'sourced' && l.status !== 'priced') return;
    const rs = leadResearch(l).rivals, mine = rs.filter(r => normName(r.name) === R);
    const seen = mine.find(r => mrIsToday(r.seenAt));
    if (seen) { items.push({ key: 'L:' + l.id, kind: 'rival', lead: l, name: l.name, answered: { no: false, val: short(seen.price) } }); return; }
    if (rs.length < 3 && !mine.length) items.push({ key: 'L:' + l.id, kind: 'rival', lead: l, name: l.name, answered: null });
  });
  const before = new Set(D().rivals.filter(r => r.price > 0 && r.rival && r.seenOn !== todayISO()).map(r => stockKey(r.productId, r.variantIdx)));
  [...demandKeys()].filter(k => !before.has(k)).forEach(k => {
    const [pid, vi] = String(k).split('::'), p = productById(pid);
    if (!p) return;
    const viN = vi == null ? null : Number(vi);
    const seen = D().rivals.find(r => r.productId === pid && (r.variantIdx == null ? null : r.variantIdx) === viN && normName(r.rival) === R && r.seenOn === todayISO());
    items.push({ key: 'K:' + k, kind: 'rival', product: p, variantIdx: viN, name: productVariantLabel(p, viN), answered: seen ? { no: false, val: short(seen.price) } : null });
  });
  return items;
}
// The day's run: every stop, by area, in the plan's order.
function mrRun(){
  const plan = mrPlanLoad();
  const skip = plan.skip || {};
  const stops = [];
  D().suppliers.forEach(s => {
    const st = { type: 'sup', id: s.id, key: 's:' + s.id, name: s.name, area: String(s.location || '').trim() || 'No area', sup: s };
    st.items = mrItemsFor(st);
    st.own = st.items.filter(i => i.kind !== 'anyone');
    if (st.own.length) stops.push(st);
  });
  mrRivalNames().forEach(r => {
    const st = { type: 'rival', id: r.name, key: 'r:' + normName(r.name), name: r.name, area: r.area || 'Rivals' };
    st.items = mrItemsFor(st);
    st.own = st.items;
    if (st.own.length) stops.push(st);
  });
  stops.forEach(st => {
    (skip[st.key] || []).forEach(k => { const it = st.items.find(i => i.key === k); if (it && !it.answered) it.answered = { no: true, val: 'none', skipped: true }; });
    st.left = st.items.filter(i => !i.answered).length;
    st.ownLeft = st.own.filter(i => !i.answered).length;
    st.done = st.left === 0;
    st.importer = st.type === 'sup' && openLeads().some(l => { const c = mrCandAt(l, st.sup); return c && (c.role === 'importer' || c.role === 'both'); });
  });
  // One area per place: "city market" and "City Market " are the same market, named
  // as most of its suppliers write it, first letter up.
  const areaKey = (n) => String(n || '').trim().replace(/\s+/g, ' ').toLowerCase();
  const spell = {};
  stops.forEach(st => { const k = areaKey(st.area); (spell[k] = spell[k] || {})[st.area.trim()] = ((spell[k] || {})[st.area.trim()] || 0) + 1; });
  const areaName = (k) => { const w = Object.entries(spell[k]).sort((a, b) => b[1] - a[1] || (/^[A-Z]/.test(b[0]) - /^[A-Z]/.test(a[0])))[0][0]; return w.charAt(0).toUpperCase() + w.slice(1); };
  stops.forEach(st => { st.area = areaName(areaKey(st.area)); });
  const areaMap = {};
  stops.forEach(st => { (areaMap[st.area] || (areaMap[st.area] = [])).push(st); });
  const areas = Object.keys(areaMap).map(name => ({ name, stops: areaMap[name] }))
    .map(a => ({ ...a, sups: a.stops.filter(x => x.type === 'sup'), asks: a.stops.filter(x => x.type === 'sup').reduce((s, x) => s + x.own.length, 0) }))
    // Where the most suppliers are, then the most to ask there; a rivals-only area last.

// photo ("Card: <url>") and what kind they are ("Kind: importer"). Read

function newSupNotes(notes, kind, card) {
  const lines = String(notes || '').split('\n');
  const other = lines.filter(x => !/^\s*(Card|Kind):\s*/i.test(x) && x.trim() !== '');
  if (kind === undefined) {
    const k = lines.map(x => /^\s*Kind:\s*(\w+)/i.exec(x)).find(Boolean);
    const c = lines.map(x => /^\s*Card:\s*(\S+)/i.exec(x)).find(Boolean);
    return { kind: k ? k[1].toLowerCase() : '', card: c ? c[1] : '' };
  }
  return other.concat(kind ? ['Kind: ' + kind] : [], card ? ['Card: ' + card] : []).join('\n');
}


/* ---- PriceIt ---- */
/* Price it: what a found item will sell at -- cost, whose markup applies,
   and where that lands against the market. The board "Price it — sells at
   the shop's 25% until the Manager sets a markup (suggesting one:
   PROPOSED)". Sourcing never sets a markup: SELLS AT is always the rule
   in force; the slider only keeps a suggestion for the Manager. */

// The supplier and rung the item would be bought at: the cheapest price
// for what the askers want (candidateUnitPriceAt at the asked quantity),
// or the supplier the caller chose.
function priceItPick(l, candId){
  const q = Math.max(1, leadDemandQty(l));
  let best = null;
  leadSuppliers(l).filter(candidateHasPrice).forEach(c => {
    const tiers = candidateTiers(c); if (!tiers.length) return;
    const cost = candidateUnitPriceAt(c, q) || tiers[0].price;
    const rung = tiers.filter(t => q >= t.minQty).pop() || tiers[0];
    const x = { c, cost, rung, q };
    if (candId && c.id === candId) best = { ...x, chosen: true };
    else if (!(best && best.chosen) && (!best || cost < best.cost)) best = x;
  });
  return best;
}
// What the askers said they would pay: a stated top price, or the price
// on the order line a dropped request came from. The lowest of them.
function priceItCap(l){
  const caps = (l.requests || []).filter(r => !r.withdrawn).map(r => Number(r.maxPrice) || (r.source === 'dropped' ? Number(r.sellPrice) || 0 : 0)).filter(v => v > 0);
  return caps.length ? Math.min(...caps) : 0;
}
function priceItProduct(l){
  if (l.productId && productById(l.productId)) return productById(l.productId);
  const r = (l.requests || []).find(x => x.productId && productById(x.productId));
  return r ? productById(r.productId) : null;
}

/* A supplier answered -- log the price ladder (the board "A supplier
   answered — log the price ladder"). Each step is a quantity and a price
   in the unit they quoted (a piece, a bundle of 10, a carton of 50…); it is
   kept on the supplier's row of the request the console's way, in base
   pieces: tiers [{ minQty, price, unit, n }] (index.html candidateTiers),
   with the pack, how soon, transport, how long it holds and whether they
   make it or bring it in. Saving moves the request forward through the
   console's gates (Looking → Found → Priced), never past what it shows. */

const QUOTE_UNITS = ['pc', 'bundle', 'carton', 'bag'];
const QUOTE_PACKS = ['', 'bundle', 'carton', 'bag', 'box', 'roll'];
const QUOTE_HOLDS = [3, 7, 14, 30];
const QUOTE_ROLES = ['supplier', 'importer', 'both'];
function quoteDigits(v){ const n = Number(String(v == null ? '' : v).replace(/[^0-9.]/g, '')); return isFinite(n) && n > 0 ? n : 0; }
// The request: the one named, else the top open request with a supplier waiting.
function quoteLead(props){
  const named = props && props.leadId ? leadById(props.leadId) : null;
  if (named) return named;
  const open = openLeads().filter(l => l.status !== 'priced');
  open.sort((a, b) => (leadSuppliers(b).some(c => c.askedAt && !candidateHasPrice(c)) ? 1 : 0) - (leadSuppliers(a).some(c => c.askedAt && !candidateHasPrice(c)) ? 1 : 0)
    || leadDistinctAskers(b) - leadDistinctAskers(a) || leadFirstAskedAt(a) - leadFirstAskedAt(b));
  return open[0] || null;
}
// Which supplier answered: the one named, else the one asked most lately
// who has not quoted, else the first on the request.
function quoteCand(l, props, st){
  const cands = leadSuppliers(l);
  if (st.candId) return cands.find(c => c.id === st.candId) || null;
  if (props.candId) { const c = cands.find(x => x.id === props.candId); if (c) return c; }
  if (props.supplierId) return cands.find(c => String(c.supplierId) === String(props.supplierId)) || null;
  if (st.supplierId) return null;
  const waiting = cands.filter(c => c.askedAt && !candidateHasPrice(c)).sort((a, b) => msOf(b.askedAt) - msOf(a.askedAt));
  // Only one who was asked and has not answered; anyone else is picked by hand.
  return waiting.length === 1 ? waiting[0] : null;
}
// A ladder step from a stored tier (base pieces) and back.
function quoteStepsOf(c){
  const t = c ? candidateTiers(c) : [];
  if (!t.length) return [{ q: '1', unit: 'pc', n: '', p: '' }];
  return t.map(x => { const n = Number(x.n) > 0 && x.unit && x.unit !== 'pc' ? Number(x.n) : 1;
    return { q: String(Math.max(1, Math.round(x.minQty / n))), unit: n > 1 ? x.unit : 'pc', n: n > 1 ? String(n) : '', p: String(Math.round(x.price * n)) }; });
}
function quoteTiersOf(steps){
  return steps.map(s => { const n = s.unit === 'pc' ? 1 : quoteDigits(s.n); const q = quoteDigits(s.q) || 1, p = quoteDigits(s.p);
    return n && p ? { minQty: q * n, price: p / n, unit: s.unit, n } : null; }).filter(Boolean).sort((a, b) => a.minQty - b.minQty);
}
function quotePerPieceAt(tiers, qty){ let best = null, bm = -1; tiers.forEach(t => { if (qty >= t.minQty && t.minQty > bm) { best = t.price; bm = t.minQty; } }); return best; }

      <a href="Hunt.dc.html" data-sx="{{ sx }}" onClick="{{ save }}" style="{{ saveStyle }}">Save the quote</a>
    </div>

  Component: class extends SrvLogic {
    constructor(props) { super(props); this.state = { seeded: null, candId: null, supplierId: props && props.supplierId || null, steps: null, active: 0, gate: '' }; }
    seed(c) {

      });
      const s = this.state.steps; const i = s.findIndex(x => !quoteDigits(x.p)); this.state.active = i >= 0 ? i : s.length - 1;

    renderVals() {
      const l = quoteLead(this.props);

      const sx = JSON.stringify({ leadId: l.id });

      const supId = c ? c.supplierId : this.state.supplierId || this.props.supplierId;
      const sup = supId ? supplierById(supId) : null;

      const set = (patch) => this.setState(Object.assign({ gate: '' }, patch));
      const setStep = (i, patch) => set({ steps: st.steps.map((x, j) => j === i ? Object.assign({}, x, patch) : x) });
      const importer = c ? (c.role === 'importer' || c.role === 'both') : false;
      const role = st.role || (c && c.role) || 'supplier';

      // The ladder, drawn per the unit each step was quoted in; heights by
      // the price of one piece, so a cheaper step stands lower.
      const tiers = quoteTiersOf(steps);
      const q = leadDemandQty(l);
      const needAt = q > 0 ? quotePerPieceAt(tiers, q) : null;
      const pp = steps.map(s => { const n = s.unit === 'pc' ? 1 : quoteDigits(s.n); const p = quoteDigits(s.p); return n && p ? p / n : 0; });
      const maxPP = Math.max(0, ...pp), minPP = Math.min(...pp.filter(Boolean), maxPP);
      const needIdx = (() => { if (!(q > 0)) return -1; let bi = -1, bm = -1; steps.forEach((s, i) => { const n = s.unit === 'pc' ? 1 : quoteDigits(s.n) || 1; const m = (quoteDigits(s.q) || 1) * n; if (q >= m && m > bm && pp[i]) { bm = m; bi = i; } }); return bi; })();
      const vSteps = steps.map((s, i) => {
        const on = i === st.active, need = i === needIdx;
        const h = !pp[i] || !maxPP ? 66 : maxPP > minPP ? Math.round(56 + 44 * (pp[i] - minPP) / (maxPP - minPP)) : 100;
        const bg = on ? 'background: #FFFFFF; box-shadow: inset 0 0 0 2px #16203C; color: #1C2233' : need ? 'background: #16203C; color: #FFFFFF' : 'background: #F1EEE8; color: #1C2233';
        const unitW = s.unit === 'pc' ? '' : ' ' + s.unit + (quoteDigits(s.q) > 1 ? 's' : '');
        return { need, pv: s.p ? n0(quoteDigits(s.p)) : '', qWord: (quoteDigits(s.q) || 1) + '+' + unitW,
          priceLabel: `Price for ${quoteDigits(s.q) || 1}${unitW || ' pc'} and up, a ${s.unit === 'pc' ? 'piece' : s.unit}`,
          pick: () => { if (st.active !== i) this.setState({ active: i }); },
          onP: (e) => setStep(i, { p: String(quoteDigits(e.target.value) || '') }),
          qStyle: `font-size: 11px; font-weight: 700; color: ${need && !on ? '#B3BCD2' : '#5F6980'}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis`,
          style: `position: relative; height: ${h}px; border-radius: 10px 10px 4px 4px; ${bg}; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; box-sizing: border-box; min-width: 0; cursor: text; animation-delay: ${(i * 0.1).toFixed(1)}s` };
      });
      const ladderLabel = tiers.length ? tiers.map(t => `${n0(t.minQty)} pieces and up: ${n0(t.price)} a piece`).join('. ') + (needAt ? `. ${q} pieces fall on ${n0(needAt)}.` : '') : 'No price yet';
      const ai = Math.min(st.active, steps.length - 1);
      const units = QUOTE_UNITS.map(u => ({ word: u, on: act.unit === u ? 'true' : 'false',
        pick: () => { FEEL.tick(); setStep(ai, { unit: u, n: u === 'pc' ? '' : (act.n || (st.packUnit === u && st.packQty) || '') }); },
        style: `height: 32px; padding: 0 7px; border: none; border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 700; ${act.unit === u ? 'background: #16203C; color: #FFFFFF' : 'background: #F1EEE8; color: #1C2233'}` }));

      // Ready in: today, 2 days, a week -- and what is on file, if other.
      const leadOpts = [0, 2, 7]; if (st.lead != null && !leadOpts.includes(st.lead)) { leadOpts.push(st.lead); leadOpts.sort((a, b) => a - b); }
      const leads = leadOpts.map(d => { const on = st.lead === d;
        return { word: d === 0 ? 'today' : d === 7 ? '1 wk' : d + ' d', on: on ? 'true' : 'false', pick: () => { FEEL.tick(); set({ lead: on ? null : d }); },
          style: `height: 28px; padding: 0 ${leadOpts.length > 3 ? 5 : 8}px; border: none; border-radius: 8px; white-space: nowrap; flex: none; background: ${on ? '#16203C' : '#F1EEE8'}; font-family: 'IBM Plex Mono', monospace; font-size: ${leadOpts.length > 3 ? 11 : 12}px; font-weight: 600; color: ${on ? '#FFFFFF' : '#1C2233'}` }; });

      const holdTo = new Date(Date.now() + st.hold * DAY).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      // The money: our demand at this ladder, plus the trip.
      const forN = q > 0 ? q : (tiers[0] ? tiers[0].minQty : 1);
      const at = quotePerPieceAt(tiers, forN);
      const trans = quoteDigits(st.transport);
      const total = at ? at * forN + trans : 0;
      const rivals = leadSuppliers(l).filter(x => (!c || x.id !== c.id) && candidateHasPrice(x)).map(x => { const u = candidateUnitPriceAt(x, forN); return u ? { x, cost: u * forN + (Number(x.transport) || 0) } : null; }).filter(Boolean);
      let cmp = '', cmpStyle = 'font-size: 11px; color: #6FDCB0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis';
      if (st.gate) { cmp = st.gate; cmpStyle = cmpStyle.replace('#6FDCB0', '#F5B26B'); }
      else if (!at && tiers.length) { cmp = `their least is ${n0(tiers[0].minQty)} pc`; cmpStyle = cmpStyle.replace('#6FDCB0', '#F5B26B'); }
      else if (!at) { cmp = 'type their price on the ladder'; cmpStyle = cmpStyle.replace('#6FDCB0', '#B3BCD2'); }
      else if (!rivals.length) cmp = 'the first price for it';
      else { const best = rivals.reduce((a, b) => a.cost <= b.cost ? a : b);

        else { cmp = `${n0(total - best.cost)} more than ${firstWord(candName(best.x))}`; cmpStyle = cmpStyle.replace('#6FDCB0', '#F5B26B'); } }

      const keyTo = (fn) => () => { FEEL.tick(); setStep(ai, { p: String(fn(quoteDigits(act.p)) || '') }); };
      const who = sup ? sup.name : c ? candName(c) : '';
      const ready = !!who && tiers.length > 0;
      const save = (e) => {
        e.preventDefault(); e.stopPropagation();
        if (!who) { FEEL.no(); toast('Pick who answered first'); return; }
        if (!tiers.length) { FEEL.no(); toast('Type at least one price on the ladder'); return; }
        const bad = steps.find(s => s.unit !== 'pc' && quoteDigits(s.p) && !quoteDigits(s.n));
        if (bad) { FEEL.no(); toast(`How many pieces in one ${bad.unit}?`); return; }
        guarded('Save the quote', async () => {
          const cur = leadById(l.id) || l, l2 = JSON.parse(JSON.stringify(cur));
          let cc = c ? leadSuppliers(l2).find(x => x.id === c.id) : null;

          Object.assign(cc, { tiers, unit: 'pc', packUnit: st.packUnit || '', packQty: quoteDigits(st.packQty), leadTimeDays: st.lead, transport: trans, validDays: st.hold, role, quotedAt: new Date().toISOString() });

          const prev = S.stack[S.stack.length - 2];

        return { name: firstWord(candName(x)) || '—', mark: candidateHasPrice(x) ? ' ✓' : x.askedAt ? ' …' : '', on: on ? 'true' : 'false',

        moveLabel: next ? (gate ? `Move to ${STAGE_WORD[next]}: ${gate}` : `Move to ${STAGE_WORD[next]}`) : '', move,
        moveStyle: `flex: 1; height: 40px; border: none; border-radius: 12px; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; ${gate ? 'background: #F1EEE8; color: #6B7480' : 'background: #16203C; color: #FFFFFF'}`,

/* ---- RunDone ---- */
/* Run done -- what came back, what moved (the board "Run done — what came
   back, what moved"). Worked out from today's real writes only: hunts'
   candidates asked today (askedAt / quotedAt), today's prices you
   confirmed in person (decision_log price.confirm), rival prices seen
   today, rows marked can't supply today, and suppliers added today
   (decision_log supplier.edit). Nothing here is kept on the phone. */
function rdToday(){
  const me = S.user && S.user.id, today = todayISO();
  const times = [], shops = new Map();
  const shop = (key, name, area) => { if (!shops.has(key)) shops.set(key, { name, area }); };
  let got = 0, good = 0, cant = 0, tags = 0;
  const moved = [];
  D().leads.forEach(l => {
    let touched = null;
    leadSuppliers(l).forEach(c => {
      if (!mrIsToday(c.askedAt)) return;
      times.push(msOf(c.askedAt));
      const sup = c.supplierId && supplierById(c.supplierId);
      shop('s:' + (c.supplierId || normName(c.supplierName)), candName(c), sup ? sup.location : '');
      if (c.noStock) cant++;
      else if (c.runKind === 'recheck' && !c.runNew) good++;
      else if (candidateHasPrice(c)) got++;
      if (c.leadWas && (!touched || msOf(c.runAt) < msOf(touched.runAt))) touched = c;
    });
    leadResearch(l).rivals.forEach(r => { if (mrIsToday(r.seenAt)) { tags++; times.push(msOf(r.seenAt)); shop('r:' + normName(r.name), r.name, r.area || ''); } });
    if (touched && !l.voided && STAGES.indexOf(l.status) > STAGES.indexOf(touched.leadWas)) moved.push({ l, from: touched.leadWas });
  });
  D().log.forEach(g => {
    if (!mrIsToday(g.at) || g.by !== me) return;
    if (g.task === 'price.confirm' && g.after && g.after.how !== 'phone') {
      const row = D().prices.find(p => g.ref && String(p.id) === String(g.ref.id));
      const was = g.before && g.before.tiers && g.before.tiers[0] ? Number(g.before.tiers[0].price) : null;
      const now = g.after.tiers && g.after.tiers[0] ? Number(g.after.tiers[0].price) : null;
      if (was != null && now != null && was !== now) got++; else good++;
      times.push(msOf(g.at));
      if (row) { const sup = supplierById(row.supplierId); shop('s:' + row.supplierId, sup ? sup.name : row.supplierId, sup ? sup.location : ''); }
    }
  });
  D().prices.forEach(p => { if (p.outOfStock && p.outOfStockSince === today) { cant++; const sup = supplierById(p.supplierId); shop('s:' + p.supplierId, sup ? sup.name : p.supplierId, sup ? sup.location : ''); } });
  D().rivals.forEach(r => { if (r.seenOn === today && r.price > 0) { tags++; shop('r:' + normName(r.rival), r.rival, ''); } });
  // A supplier added today says so in the owner's log (supplier.edit).
  const newSups = [];
  D().log.forEach(g => { if (mrIsToday(g.at) && g.task === 'supplier.edit' && g.by === me && /new|add|met/i.test(g.what || '')) { const s = g.ref && supplierById(g.ref.id); const n = s ? s.name : ''; if (n && !newSups.includes(n)) newSups.push(n); } });
  // Samples bought today ride in the hunt (leadMeta sample: PROPOSED).
  let sampleCash = 0;
  D().leads.forEach(l => { const m = leadResearch(l).meta; if (m && m.sample && mrIsToday(m.sample.at) && Number(m.sample.cost) > 0) sampleCash += Number(m.sample.cost); });
  const t = times.filter(Boolean).sort((a, b) => a - b);
  return { got, good, cant, tags, newSups, moved, sampleCash, shops: [...shops.values()], from: t[0] || 0, to: t[t.length - 1] || 0 };
}

/* Sample check -- optional, inside Found (the board "Sample check —
   optional, inside Found (sample record: PROPOSED)"). There is no Sample
   stage: the check rides on the request (leadMeta(l).sample = { at, by,

   one line of the owner's log; Accounts records the money. */

// The checks a sample goes through, in the order drawn; a stored check
// with another key keeps its own name.
function sampleCheckDefs(l){
  const asker = leadAskers(l)[0];
  return [
    { k: 'size', label: 'Size is what they asked for', how: 'tape' },
    { k: 'finish', label: 'Finish and make hold up', how: 'by eye' },
    { k: 'pack', label: 'Packed as quoted', how: 'count' },
    { k: 'client', label: asker ? `${firstWord(asker.name)} says yes` : 'The client says yes', how: 'client' },
  ];
}
// The request: the one named, else the top open one with a sample under
// way, else the top found one.
function sampleLead(props){
  const named = props && props.leadId ? leadById(props.leadId) : null;
  if (named) return named;
  const open = openLeads();
  const rank = (a, b) => leadDistinctAskers(b) - leadDistinctAskers(a) || leadFirstAskedAt(a) - leadFirstAskedAt(b);
  const going = open.filter(l => { const s = leadMeta(JSON.parse(JSON.stringify(l))).sample; return s && !s.verdict; }).sort(rank);
  return going[0] || open.filter(l => l.status === 'sourced').sort(rank)[0] || null;
}
function sampleDigits(v){ const n = Number(String(v == null ? '' : v).replace(/[^0-9]/g, '')); return n > 0 ? n : 0; }

/* Tell the clients who asked -- one tap each: WhatsApp opens with the
   words written; a separate tap records that they were told, on their
   follow-up, with the price they heard (index.html recordFollowUpContact). */

// The listed request: the one named, else the latest listed, else none.
function tellLead(props){
  const named = props && props.leadId ? leadById(props.leadId) : null;
  if (named && named.status === 'listed' && !named.voided) return named;
  return D().leads.filter(l => !l.voided && l.status === 'listed').sort((a, b) => msOf(b.graduatedAt) - msOf(a.graduatedAt))[0] || null;
}
// The price they hear: the cheapest supplier row at effectiveMarkupRule
// (the shop's default until the Manager sets one) -- as listLead logs it.
function tellSell(l){
  const p = l && productById(l.productId);
  const rows = p ? D().prices.filter(r => String(r.productId) === String(p.id) && r.variantIdx == null && priceRowCost(r) > 0) : [];
  const best = rows.slice().sort((a, b) => priceRowCost(a) - priceRowCost(b))[0] || null;
  const cost = best ? priceRowCost(best) : 0;
  return { p, best, sell: cost ? sellAt(cost, effectiveMarkupRule(p, null, 'wholesale')) : 0, unit: (best && best.unit) || 'pc' };
}
// Their follow-up on this request: an open one first, else the latest.
function tellFollow(l, cid){
  const fs = D().followUps.filter(f => f.leadId === l.id && String(f.customerId) === String(cid));
  return fs.find(f => !f.closedAt) || fs.sort((a, b) => msOf(b.createdAt) - msOf(a.createdAt))[0] || null;
}
// Told = a contact on that follow-up after it was listed (canvas note p2).
function tellToldAt(l, f){ const c = f && (f.contacts || []).filter(c => msOf(c.at) >= msOf(l.graduatedAt)).sort((a, b) => msOf(b.at) - msOf(a.at))[0]; return c ? c.at : null; }
function tellUnitWord(u){ u = String(u || 'pc').trim().toLowerCase(); return ({ pc: 'piece', pcs: 'piece', piece: 'piece', m: 'metre' })[u] || u; }

    renderVals() {
      const s = this.state, l = tellLead(this.props);
      if (!l) return { has: false, none: true, hasPeople: false, title: 'On the shelf. Tell them.', sub: 'nothing listed yet', photo: photoStyle(null, 'background: linear-gradient(160deg, #5CC28A, #1E9D57)'), noPhoto: true, photoLabel: 'No photo',
        emptyTitle: 'Nothing listed yet', emptyWord: 'When a hunt goes into the catalogue, the people who asked are here to tell.', doneWord: 'Back to Today', people: [], teams: [] };
      const x = tellSell(l), p = x.p, name = p ? p.name : l.name;
      const shop = S.shopName || 'the shop', unitWord = tellUnitWord(x.unit);
      const pk = cPackOf(x.best);
      const packSell = pk.has && x.sell ? x.sell * pk.packQty : 0;
      const rows = leadAskers(l).map(a => {
        const c = a.customerId ? customerById(a.customerId) : null;
        const phone = (c && c.phone) || a.phone || '';
        const f = a.customerId ? tellFollow(l, a.customerId) : null;
        const toldAt = tellToldAt(l, f);
        return { a, phone, f, toldAt, told: !!toldAt };
      });
      const msgOf = (a) => {
        const short = firstWord(a.name) || a.name, total = x.sell && a.qty ? x.sell * a.qty : 0;
        return `Hello ${short}, good news — the ${name} you asked us for is now in at ${shop}.\n` +
          (x.sell ? `${n0(x.sell)} a ${unitWord}` + (a.qty ? `, so your ${n0(a.qty)} come to ${n0(total)}.` : '.') + '\n' : '') +
          'Shall we put them on an order for you?';
      };
      const nextAfter = (key) => rows.find(o => o.a.key !== key && !o.told && o.phone && (s.asking == null || o.a.key !== s.asking));
      const open = (r) => { FEEL.open(); openWA(r.phone, msgOf(r.a)); this.setState({ asking: r.a.key, sel: r.a.key }); };
      const people = rows.map((r, i) => {
        const a = r.a, total = x.sell && a.qty ? x.sell * a.qty : 0;
        return { ini: initials(a.name), name: a.name, ava: avStyle(a.key, 40) + '; font-size: 13px',
          what: [a.qty ? n0(a.qty) + ' ' + x.unit : '', total ? n0(total) : ''].filter(Boolean).join(' · ') || 'no quantity',
          when: r.told ? ' · told ' + agoWord(r.toldAt) : '',
          line: 'display: flex; align-items: center; gap: 12px; min-height: 68px' + (i ? '; box-shadow: inset 0 1px 0 #F0ECE6' : ''),
          told: r.told, canTell: !r.told && !!r.phone, noPhone: !r.told && !r.phone,
          tellWord: s.sel === a.key && s.asking == null && !r.told ? 'Tell again' : 'Tell',
          showLabel: `Show what ${a.name} gets`,
          show: () => { FEEL.tick(); this.setState({ sel: a.key }); },
          tell: () => open(r) };
      });
      const told = rows.filter(r => r.told).length, n = rows.length;
      const pre = rows.find(r => r.a.key === s.sel) || rows.find(r => !r.told && r.phone) || rows[0] || null;
      const left = rows.filter(r => !r.told && r.phone).length;
      const ask = s.asking != null ? rows.find(r => r.a.key === s.asking) : null;
      const nxt = ask ? nextAfter(ask.a.key) : null;

      // The team: agents get a pin on their Feed (agent-nudge pushes it);
      // the salespeople who asked get WhatsApp with the words written.
      const agents = D().agents.filter(a => !a.retiredAt);
      const sellers = annSalesFolk(l);
      const aOn = agents.length > 0 && s.agents !== false, sOn = sellers.length > 0 && s.sales !== false;
      const first = (nm) => firstWord(nm) || nm;
      const names = (list) => !list.length ? '' : list.length <= 3 ? list.map(a => first(a.name)).join(', ') : list.slice(0, 2).map(a => first(a.name)).join(', ') + ' and ' + (list.length - 2) + ' more';
      const logged = annLogged(p);
      const teamSent = s.sent || !!logged;
      const priceTxt = x.sell ? n0(x.sell) + ' a ' + unitWord : '';
      const goes = p ? D().links.filter(k => k.active && k.verb === 'with' && (k.fromId === p.id || k.toId === p.id)).map(k => productById(k.fromId === p.id ? k.toId : k.fromId)).filter(Boolean) : [];
      const note = `${name} is in` + (priceTxt ? ` · ${priceTxt}` : '') + '.' + (goes.length ? ` Goes with ${goes.slice(0, 2).map(g => g.name.toLowerCase()).join(' and ')}.` : '');
      const ends = new Date(Date.now() + 13 * DAY).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      const sw = (key, label, list, how, on) => ({ name: label, who: list.length ? `${names(list)} · ${how}` : (key === 'agents' ? 'No agents on the books' : 'Nobody on the sales desk asked for it'),
        on: on ? 'true' : 'false',
        toggle: () => { if (!list.length || teamSent) { FEEL.no(); toast(teamSent ? 'The team was told already' : 'Nobody to tell there'); return; } FEEL.tick(); this.setState({ [key]: !on }); },
        row: 'width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; text-align: left' + (list.length ? '' : '; opacity: .6'),
        track: 'width: 46px; height: 28px; flex: none; border-radius: 999px; position: relative; background: ' + (on ? '#0F6B43' : '#E0DCD4'),
        knob: 'position: absolute; top: 3px; left: ' + (on ? '21px' : '3px') + '; width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.2)' });
      const teams = [sw('sales', 'Sales desk', sellers, 'WhatsApp, the words written', sOn), sw('agents', 'Agents', agents, 'pinned on their Feed 14 days, with a push', aOn)];
      const teamN = (aOn ? agents.length : 0) + (sOn ? sellers.filter(x2 => x2.phone).length : 0);
      const tellTeam = () => {
        if (teamSent || !teamN || !p) { FEEL.no(); toast(!p ? 'It is not in the catalogue yet' : 'Switch on at least one group to tell'); return; }
        guarded('Tell the team', async () => {
          if (aOn) await pinForAgents(p.id, note, 14);
          const withNo = sOn ? sellers.filter(x2 => x2.phone) : [], noNo = sOn ? sellers.filter(x2 => !x2.phone) : [];
          // One salesperson who asked: their chat opens with the words written.
          if (withNo.length === 1) openWA(withNo[0].phone, `Hello ${first(withNo[0].name)}, your request was listed — ${name} is in at ${shop}` + (priceTxt ? `, ${priceTxt}` : '') + '.' + (withNo[0].clients.length ? ` ${withNo[0].clients.join(', ')} can order it now.` : ''));
          const parts = [aOn ? `pinned on the Feed of ${plural(agents.length, 'agent')} till ${ends}` : '',
            withNo.length ? `WhatsApp with the words written for ${names(withNo)} on the sales desk` : '', noNo.length ? `no number on file for ${names(noNo)}` : ''].filter(Boolean);
          await logDecision('product.edit', `Announced “${name}” — ${parts.join('; ')}`, { amount: x.sell ? Math.round(x.sell) : null, ref: { table: 'products', id: p.id },
            after: { announced: true, leadId: l.id, agents: aOn ? agents.map(a => a.id) : [], sales: sOn ? sellers.map(x2 => x2.name) : [], pinDays: aOn ? 14 : 0 } });
          FEEL.yes(); toast(aOn ? `On every agent’s Feed till ${ends}` : 'Logged for the owner');
          this.setState({ sent: true });
        });
      };
      return {
        has: true, none: !n, hasPeople: n > 0, busy: S.busy,
        emptyTitle: 'Nobody asked by name', emptyWord: 'This one was listed without anyone on file to tell.',
        title: 'On the shelf. Tell them.',
        sub: [name, x.sell ? `${n0(x.sell)} a ${unitWord}` : '', packSell ? `${n0(packSell)} a ${pk.packUnit}` : ''].filter(Boolean).join(' · '),
        photo: photoStyle((p && p.image) || l.image, 'background: linear-gradient(160deg, #5CC28A, #1E9D57)'), noPhoto: !((p && p.image) || l.image), photoLabel: 'The item',
        toldN: told, allN: n, ringLabel: `${told} of ${n} told`,
        ring: `width: 44px; height: 44px; flex: none; border-radius: 999px; background: conic-gradient(#6FDCB0 0 ${n ? Math.round(told / n * 100) : 0}%, rgba(255,255,255,.14) 0); display: flex; align-items: center; justify-content: center`,
        headline: n && told === n ? 'Everyone who asked knows' : left ? `${left} still to tell` : n ? 'Nobody left with a number' : 'Nobody asked by name',
        people, preWho: pre ? first(pre.a.name) : 'they', preMsg: pre ? msgOf(pre.a) : '',
        teams, teamDone: teamSent, teamOpen: !teamSent, teamOff: !teamN || S.busy,
        teamDoneWord: logged && !s.sent ? `Told the team ${agoWord(logged.at)}` : 'Told the team',
        teamWord: teamN ? `Tell the team · ${plural(teamN, 'person', 'people')}` : 'Nobody chosen',
        tellTeam,
        doneWord: n && told === n ? 'Done · back to Today' : 'Finish later',
        asking: !!ask, askTitle: ask ? `Did the message go to ${ask.a.name}?` : '',
        askNoFile: !!(ask && !ask.a.customerId), askNoFileWord: 'Not a client on file, so there is no follow-up to mark.',
        yesWord: nxt ? 'Yes, sent · next' : 'Yes, sent',
        notSent: () => { FEEL.back(); this.setState({ asking: null }); },
        yes: () => {
          if (!ask) return;
          // The next one's chat opens on this same tap (WhatsApp is opened
          // by a person's tap, never by a timer); this one is saved behind it.
          if (nxt) open(nxt); else this.setState({ asking: null });
          if (!ask.a.customerId) { FEEL.yes(); toast(`${ask.a.name} sent — not a client on file`); return; }
          guarded('Mark told', async () => {
            let f = ask.f && !ask.f.closedAt ? ask.f : null;
            if (!f) f = await addFollowUp(ask.a.customerId, l.id, { qty: ask.a.qty || null });
            if (!f) throw new Error('No follow-up could be made for ' + ask.a.name);
            await recordFollowUpContact(f, 'listed', x.sell ? Math.round(x.sell) : null);
            FEEL.yes(); toast(`${ask.a.name} told` + (x.sell ? ` — ${n0(x.sell)} a ${unitWord}` : ''));
          });
        },
      };
    }
  },
};


boot();
</script>
