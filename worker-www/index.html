<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omni-Ware Worker</title>
<link rel="manifest" href="manifest-worker.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #EEF4F1;
    --panel: #FFFFFF;
    --ink: #0F241D;
    --ink-soft: #5B7069;
    --ink-faint: #8B9A94;
    --line: #DCE6E2;
    --accent: #0E8F71;
    --accent-deep: #0A6B56;
    --accent-ink: #FFFFFF;
    --accent-tint: #E1F5EF;
    --amber: #C97A26;
    --amber-tint: #FBE9D6;
    --good: #0E8F71;
    --good-bg: #E1F5EF;
    --danger: #C0392B;
    --navy: #0F241D;
    --shadow-card: 0 1px 2px rgba(15,36,29,.04), 0 8px 20px rgba(15,36,29,.06);
    --shadow-hero: 0 10px 24px rgba(10,107,86,.24);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  /* Hides everything until boot() has loaded the worker's data --
     avoids a flash of an empty page. */
  body.app-loading .worker-view-wrap{display:none !important;}
  .icon{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;}

  .wv-eyebrow{margin:0 0 4px;color:var(--accent-deep);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
  .page-head{margin-bottom:16px;}
  .page-head h1{
    font-family:'Manrope',sans-serif;font-size:22px;font-weight:800;margin:0;color:var(--ink);
    letter-spacing:-0.2px;
  }
  .page-head p{margin:4px 0 0;color:var(--ink-soft);font-size:14px;}

  .btn{
    all:unset;box-sizing:border-box;cursor:pointer;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;
    text-align:center;
  }
  .btn-accent{background:var(--accent);color:var(--accent-ink);}
  .btn-accent:hover{background:var(--accent-deep);}
  .btn-ghost{background:var(--panel);color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}

  .empty{padding:28px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 18px;
    border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.18);
    opacity:0;transform:translateY(8px);transition:all 0.25s ease;pointer-events:none;z-index:150;
    display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  .img-zoomable{cursor:zoom-in;}
  .lightbox-overlay{
    position:fixed;inset:0;background:rgba(15,20,26,0.82);display:flex;align-items:center;
    justify-content:center;padding:40px;z-index:300;opacity:0;visibility:hidden;transition:opacity .15s ease;
  }
  .lightbox-overlay.show{opacity:1;visibility:visible;}
  .lightbox-overlay img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,0.45);}
  .lightbox-close{
    all:unset;cursor:pointer;position:fixed;top:22px;right:26px;color:#fff;display:flex;
    padding:8px;border-radius:8px;background:rgba(255,255,255,0.12);z-index:301;
  }
  .lightbox-close:hover{background:rgba(255,255,255,0.22);}
  .lightbox-close .icon{width:18px;height:18px;}

  .q-stage-thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid var(--line);background:#F3F5F7;}
  .q-stage-thumb-placeholder{
    width:44px;height:44px;border-radius:9px;flex-shrink:0;border:1px dashed var(--line);
    background:#F7F9FB;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
  }
  .q-stage-thumb-placeholder .icon{width:19px;height:19px;}

  .worker-view-wrap{width:100%;max-width:520px;margin:0 auto;padding:12px;display:flex;flex-direction:column;flex:1;min-height:0;}
  /* The header (idle "Pick & Pack" heading, or the active order's client
     name) sits outside the centered body on purpose -- it's the one thing
     that should NOT shift position as a worker swipes between items or
     moves on to their next order. Only .wv-body's content re-centers. */
  .wv-header{flex-shrink:0;padding-top:10px;}
  .wv-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .wv-greeting{margin:0;font-family:'Manrope',sans-serif;font-size:21px;font-weight:800;letter-spacing:-.2px;color:var(--ink);}
  .wv-signout-icon{
    all:unset;box-sizing:border-box;flex-shrink:0;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .wv-signout-icon .icon{width:15px;height:15px;}
  /* The active order's client name + progress renders as a filled "hero"
     card (mirrors a balance-card pattern) instead of plain text -- gives
     a worker the at-a-glance "where am I on this order" the plain title
     never did. It's still just innerHTML swapped inside the same #wv_
     activeHeader mount point, so the header stays positionally stable. */
  .wv-hero{
    background:linear-gradient(155deg, var(--accent) 0%, var(--accent-deep) 100%);
    border-radius:18px;padding:13px 16px 12px;color:#fff;box-shadow:var(--shadow-hero);
    margin:0 0 10px;
  }
  .wv-hero-label{margin:0 0 2px;font-size:10.5px;font-weight:700;color:#BFF0E1;text-transform:uppercase;letter-spacing:.07em;}
  .wv-hero-name{font-family:'Manrope',sans-serif;font-size:18px;font-weight:800;letter-spacing:-.2px;}
  .wv-hero-progress-label{margin-top:8px;font-size:12px;font-weight:600;color:#D8F4EA;}
  .wv-hero-track{height:5px;border-radius:99px;background:rgba(255,255,255,.24);margin-top:5px;overflow:hidden;}
  .wv-hero-fill{height:100%;border-radius:99px;background:#fff;transition:width .35s ease;}
  .wv-body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;}
  .wv-card{background:var(--panel);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow-card);}
  .wv-card-title{font-weight:700;margin-bottom:4px;}
  .wv-card-sub{color:var(--ink-soft);font-size:13px;margin-bottom:12px;}
  .wv-actions{display:flex;gap:10px;}
  .wv-actions .btn{flex:1;}
  /* Pending-order cards: an initial avatar + item-count pill give a worker
     more to scan at a glance than a bare name/subtitle ever did. */
  .wv-pending-card{background:var(--panel);border-radius:18px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow-card);}
  .wv-pending-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .wv-avatar{
    width:34px;height:34px;border-radius:10px;background:var(--accent-tint);color:var(--accent-deep);
    display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:13px;flex-shrink:0;
  }
  .wv-pending-name{font-family:'Manrope';font-weight:700;font-size:14px;flex:1;min-width:0;}
  .wv-count-pill{background:var(--amber-tint);color:var(--amber);font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;}
  /* Item carousel: swipe horizontally between items (native scroll-snap,
     no gesture library needed) instead of tapping next/back buttons.
     Photo, name, quantity and source all live inside one bordered card;
     the "Pick"/"Picked" badge is an actual button pinned to that card's
     top-right corner, not just the photo. Only the centered card is
     interactive -- a peeking side card just brings itself to center when
     tapped. The carousel bleeds past the page's own side padding
     (negative margin) so the focused card can be as large as the screen
     allows -- mobile-first, this is the one thing a worker looks at. */
  .wv-carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -12px;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  /* Percentage PADDING resolves against the containing block's width, not
     this element's own (wider, thanks to the negative margin above) width
     -- that came out too narrow to ever let a boundary card scroll into
     true center. Percentage flex-basis on real flex items doesn't have
     that quirk (it resolves against this container's own content box), so
     these spacers -- not scroll-snap-align targets themselves -- give the
     first/last card genuine, correctly-sized room to center into. */
  .wv-carousel::before,.wv-carousel::after{content:'';flex:0 0 6%;}
  .wv-carousel::-webkit-scrollbar{display:none;}
  /* Opacity + a light scale change on focus -- no shake-inducing transform
     recalculated mid-scroll, just a settled "this one's live" feel. */
  .wv-carousel-card{flex:0 0 88%;scroll-snap-align:center;opacity:.4;transform:scale(.96);transition:opacity .25s ease,transform .25s ease;margin-right:10px;}
  .wv-carousel-card:last-child{margin-right:0;}
  .wv-carousel-card.focused{opacity:1;transform:scale(1);}
  /* overflow:hidden here means every section below (photo, body, source)
     gets clipped to this card's own rounded corners automatically -- the
     source strip at the bottom doesn't need its own matching radius. */
  .wv-carousel-card-inner{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-card);overflow:hidden;}
  .wv-carousel-card.focused .wv-carousel-card-inner{cursor:pointer;}
  .wv-carousel-photo{width:100%;aspect-ratio:1.4;border-bottom:1.5px dotted var(--line);overflow:hidden;}
  .wv-carousel-photo .q-stage-thumb, .wv-carousel-photo .q-stage-thumb-placeholder{width:100%;height:100%;border-radius:0;border:none;}
  .wv-carousel-photo .q-stage-thumb-placeholder .icon{width:56px;height:56px;}
  .wv-carousel-badge{position:absolute;top:11px;right:11px;display:flex;align-items:center;gap:4px;padding:7px 14px;border-radius:999px;font:700 12px inherit;box-shadow:0 2px 8px rgba(15,36,29,.16);border:none;cursor:pointer;transition:background .15s ease,color .15s ease;}
  .wv-carousel-badge.pending{background:#fff;color:var(--ink-soft);}
  .wv-carousel-badge.done{background:var(--accent);color:#fff;}
  .wv-carousel-badge .icon{width:13px;height:13px;stroke-width:3;}
  .wv-carousel-body{padding:11px 16px 10px;}
  .wv-carousel-name{font-size:14.5px;font-weight:600;text-align:center;}
  .wv-carousel-qty-label{font-size:10px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;text-align:center;margin-top:5px;}
  .wv-carousel-qty{font-family:'Manrope',sans-serif;font-weight:800;font-size:21px;color:var(--ink);text-align:center;margin-top:1px;letter-spacing:-.2px;}
  .wv-carousel-source{border-top:1.5px dotted var(--line);background:var(--accent-tint);text-align:center;padding:7px 16px 8px;}
  .wv-carousel-source-label{font-size:9.5px;font-weight:700;color:var(--accent-deep);text-transform:uppercase;letter-spacing:.05em;opacity:.75;}
  .wv-carousel-source-value{font-size:12.5px;font-weight:700;color:var(--accent-deep);margin-top:1px;}
  .wv-carousel-dots{display:flex;justify-content:center;gap:6px;margin:9px 0 0;}
  .wv-carousel-dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s ease;}
  .wv-carousel-dot.focused{background:var(--accent);width:18px;border-radius:4px;}
  .wv-mark-btn{width:auto;padding:10px 26px;font-size:13.5px;display:block;margin:12px auto 0;}
</style>
</head>
<body class="app-loading">

<div class="worker-view-wrap">
  <div class="wv-header" id="wv_header">
    <div class="wv-topbar">
      <p class="wv-greeting" id="wv_greeting"></p>
      <button type="button" class="wv-signout-icon" id="wv_signout_btn" aria-label="Sign out" title="Sign out">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
    <div class="page-head" id="wv_pageHead">
      <p class="wv-eyebrow">Pick &amp; pack</p>
      <h1>Your queue</h1>
      <p>Orders assigned to you for preparation.</p>
    </div>
    <div id="wv_activeHeader" style="display:none;"></div>
  </div>
  <div class="wv-body">
    <div id="wv_enablePushWrap" class="wv-card" style="display:none;">
      <div class="wv-card-title">Turn on notifications</div>
      <div class="wv-card-sub">Get notified the moment an order is assigned to you, even if the app is closed.</div>
      <button type="button" class="btn btn-accent" id="wv_enablePushBtn">Enable notifications</button>
    </div>
    <div id="wv_pendingWrap"></div>
    <div id="wv_activeWrap"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- IMAGE LIGHTBOX -->
<div class="lightbox-overlay" id="imgLightbox">
  <button class="lightbox-close" id="imgLightboxClose" aria-label="Close">
    <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img id="imgLightboxImg" src="" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared-worker.js"></script>
<script>
// Supabase appends #...&type=invite (or type=recovery) to the redirect URL
// for invite/reset emails -- read once, before createClient() consumes the
// hash to establish the session, so ensureAuthAndShop() can tell a brand
// new worker apart from a normal returning sign-in.
const initialAuthLinkType = new URLSearchParams(location.hash.replace(/^#/, '')).get('type');

const SUPABASE_URL = 'https://hgywjaifdmgrcnwxstxg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_KsUIBYzuZRdoPsqP4T2ULw__AsCEhzV';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentShopId = null;
let currentUser = null;
let currentMemberRole = null;

document.addEventListener('click', (e)=>{
  const zoomEl = e.target.closest('.img-zoomable');
  if(zoomEl) openImageLightbox(zoomEl.src, zoomEl.alt);
});
function openImageLightbox(src, alt){
  document.getElementById('imgLightboxImg').src = src;
  document.getElementById('imgLightboxImg').alt = alt || '';
  document.getElementById('imgLightbox').classList.add('show');
}
function closeImageLightbox(){
  document.getElementById('imgLightbox').classList.remove('show');
  document.getElementById('imgLightboxImg').src = '';
}
document.getElementById('imgLightboxClose').addEventListener('click', closeImageLightbox);
document.getElementById('imgLightbox').addEventListener('mousedown', (e)=>{
  if(e.target.id==='imgLightbox') closeImageLightbox();
});
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && document.getElementById('imgLightbox').classList.contains('show')) closeImageLightbox();
});

let data = null;
let myStaff = null;
let hasPushSubscription = false;
let lastSynced = {};

// This app only ever needs a slice of the shop's data: every staff row
// (to resolve myStaff, and to list delivery-eligible candidates when
// finishing an order -- see promptAssignDelivery() in shared-worker.js),
// every agent's payment term (read-only -- see
// 0013_agents_readable_by_shop_members.sql -- so autoAssignNextOrder()
// can skip a draft order still waiting on its required prepayment), every
// supplier (for "where to get it" labels), just enough of each product to
// show a photo, and every saved quote in the shop (so a worker who
// finishes an order can see -- and get auto-assigned -- the next
// unassigned one). Stock, cash, customers, prices and purchase invoices
// are all admin-only concerns this app never touches.
async function loadWorkerData(shopId){
  const [staffR, agentsR, suppliersR, productsR, savedQuotesR] = await Promise.all([
    sb.from('staff').select('*').eq('shop_id', shopId),
    sb.from('agents').select('id, payment_term').eq('shop_id', shopId),
    sb.from('suppliers').select('*').eq('shop_id', shopId),
    sb.from('products').select('id, name, image').eq('shop_id', shopId),
    sb.from('saved_quotes').select('*').eq('shop_id', shopId),
  ]);
  [staffR, agentsR, suppliersR, productsR, savedQuotesR].forEach(r=>{ if(r.error) throw r.error; });

  return {
    staff: (staffR.data||[]).map(s=>({id:s.id, name:s.name, phone:s.phone, role:s.role, notes:s.notes, unavailable:!!s.unavailable, userId:s.user_id||null})),
    agents: (agentsR.data||[]).map(a=>({id:a.id, paymentTerm:a.payment_term||'prepay'})),
    suppliers: (suppliersR.data||[]).map(s=>({id:s.id, name:s.name, phone:s.phone, location:s.location, notes:s.notes})),
    products: (productsR.data||[]).map(p=>({id:p.id, name:p.name, image:p.image||null})),
    savedQuotes: (savedQuotesR.data||[]).map(q=>({
      id:q.id, status:q.status||'draft', invoiced:!!q.invoiced, invoicedAt:q.invoiced_at,
      invoicedTs: q.invoiced_ts ? new Date(q.invoiced_ts).getTime() : null,
      amountPaid:Number(q.amount_paid)||0, voided:!!q.voided, date:q.date,
      client:{name:'', phone:''}, items:[], savedAt:null, payments:[], customerId:null, debtCharged:0,
      ...(q.payload||{})
    })),
  };
}

// Same shape saveData() upserts in the admin app's buildSyncRows(), scoped
// down to just savedQuotes -- the only collection this app ever mutates.
function buildWorkerSyncRows(d, shopId){
  return {
    savedQuotes: d.savedQuotes.map(q=>({
      id:q.id, shop_id:shopId, client_name:(q.client&&q.client.name)||null, client_phone:(q.client&&q.client.phone)||null,
      date:q.date, status:q.status, invoiced:q.invoiced, invoiced_at:q.invoicedAt,
      invoiced_ts: q.invoicedTs ? new Date(q.invoicedTs).toISOString() : null,
      amount_paid:q.amountPaid, voided:q.voided,
      payload:{client:q.client, items:q.items, savedAt:q.savedAt, payments:q.payments, customerId:q.customerId, debtCharged:q.debtCharged, stageEnteredAt:q.stageEnteredAt, assignedWorkerId:q.assignedWorkerId, assignedDeliveryId:q.assignedDeliveryId, pickingStatus:q.pickingStatus||null, pickCursor:q.pickCursor||0, workerAcceptedAt:q.workerAcceptedAt||null}
    })),
  };
}

async function saveData(){
  const shopId = currentShopId;
  if(!data.savedQuotes) data.savedQuotes = [];
  const rows = buildWorkerSyncRows(data, shopId);
  const ops = [];
  addDiffOps(ops, 'savedQuotes', 'saved_quotes', 'id', shopId, rows.savedQuotes);
  if(!ops.length) return;

  const results = await Promise.all(ops.map(op=> op.run()));
  results.forEach((r, i)=>{ if(!(r && r.error)) ops[i].commit(); });

  const failed = results.find(r=> r && r.error);
  if(failed){
    console.error('saveData failed:', failed.error);
    toast('Sync failed — a change may not have been saved (' + failed.error.message + ')', 5000);
  }
}

document.getElementById('wv_signout_btn').addEventListener('click', signOutAndReload);

async function boot(){
  try{
    await ensureAuthAndShop();
    data = await loadWorkerData(currentShopId);
    lastSynced = { savedQuotes: keyRowsById(buildWorkerSyncRows(data, currentShopId).savedQuotes, 'id') };
  } catch(e){
    console.error('Failed to start app:', e);
    const el = ensureAuthOverlay();
    el.innerHTML = `<div style="color:#f66;font-family:sans-serif;max-width:400px;text-align:center;">Couldn't load your orders: ${(e && e.message) || e}. Reload to try again.</div>`;
    return;
  }
  myStaff = data.staff.find(s=>s.userId===currentUser.id) || null;
  if(myStaff){
    const { data: existingSub } = await sb.from('push_subscriptions').select('id').eq('staff_id', myStaff.id).eq('user_id', currentUser.id).limit(1).maybeSingle();
    hasPushSubscription = !!existingSub;
    if(isNativeApp()){
      registerNativePushListeners();
      // Reinstalling the APK (a new debug build, a signature mismatch
      // forcing uninstall/reinstall) silently mints a new FCM token, but
      // the DB still has whatever token was registered the first time the
      // user tapped "Enable notifications" -- that row going stale after a
      // reinstall is exactly why a push can stop arriving with no error
      // anywhere (FCM just accepts the send for a token nobody's listening
      // on anymore). Re-registering on every native launch once permission
      // is already granted is a silent no-op prompt-wise (checkPermissions
      // already returns granted) but keeps the stored token current.
      if(hasPushSubscription) enableNativePush();
    }
  }
  // Remove the loading class before rendering, not after -- the carousel's
  // initial scrollIntoView() (centering the focused card) is a no-op on an
  // element with no layout box, and body.app-loading forces .worker-view-wrap
  // to display:none. Rendering into a still-hidden wrap left the carousel
  // permanently stuck at scrollLeft 0 (visually left-shifted) since there's
  // no repaint afterwards that would let it retroactively center itself.
  document.body.classList.remove('app-loading');
  renderWorkerView();
}
boot();
</script>
</body>
</html>
