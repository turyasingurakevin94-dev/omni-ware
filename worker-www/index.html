<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omni-Ware Worker</title>
<link rel="manifest" href="manifest-worker.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    /* Shared Omni-ware palette -- see index.html's :root for the full
       rationale. Aliases below keep every existing token name working.

       Read walking the aisles, one hand, often in warehouse glare, so
       this surface carries the highest contrast of the four.

       One deliberate change beyond colour: --accent and --good were the
       SAME green here, which meant "the button you press" and "this line
       is done" were indistinguishable. They are now separate. */
    --ow-steel-100:#DCE0E4;
    --ow-steel-050:#E9EBED;
    --ow-paper:#FFFFFF;
    --ow-oxide:#B23A26;
    --ow-oxide-deep:#8E2C1C;
    --ow-oxide-soft:#F6E7E3;
    --ow-verdigris:#1C6B58;
    --ow-verdigris-soft:#E2EFEB;
    --ow-amber:#B0700A;
    --ow-amber-soft:#FBEFD9;
    --ow-crimson:#7F1D1A;
    --ow-ink-900:#14171B;
    --ow-ink-600:#59626B;
    --ow-ink-400:#8A939C;
    --ow-rule:#CFD5DA;

    /* This surface runs dark, and not as a style choice.
       A warehouse is lit from above and often half open to the sky; a
       white screen at arm's length washes out, and the picker cannot stop
       and shade it because both hands are occupied. Dark ground also
       costs far less battery on the OLED phones this ships to as an APK,
       across a full shift.

       Only the aliases move. Every rule in this file already reads
       through them, which is what makes flipping the whole app a
       twenty-line change rather than a rewrite. */
    --ow-night-950:#101317;   /* ground */
    --ow-night-900:#181C21;   /* raised card */
    --ow-night-800:#212730;   /* input / inset */
    --ow-night-line:#2C333B;
    --ow-night-ink:#ECEFF2;
    --ow-night-ink-soft:#9BA5AF;
    /* Lifted from #6D7883, which measured 3.8:1 on a raised card. It sets
       10px uppercase labels, so it is small text and owes the full 4.5. */
    --ow-night-ink-faint:#98A2AD;
    /* Oxide is lifted on a dark ground -- #B23A26 against #101317 is a
       muddy 3:1. This keeps the same hue and clears AA. */
    --ow-oxide-bright:#DC5C43;
    --ow-verdigris-bright:#3FA184;

    --bg: var(--ow-night-950);
    --panel: var(--ow-night-900);
    --ink: var(--ow-night-ink);
    --ink-soft: var(--ow-night-ink-soft);
    --ink-faint: var(--ow-night-ink-faint);
    --line: var(--ow-night-line);
    --accent: var(--ow-oxide-bright);
    /* On a light ground "deep" meant darker, and that worked for both jobs
       this token does: a hover state and a text colour (.wv-eyebrow,
       .wv-carousel-variant). On a dark ground the two part company --
       emphasis is LIGHTER here, and the darker oxide as text on #101317 is
       an unreadable 2.8:1. So deep lifts instead of sinks. */
    --accent-deep: #EC8068;
    /* Text sitting ON the accent, unlike the same-named token in
       index.html. It was white, which is the reflex -- and measured
       3.71:1 on the lifted oxide, a fail for 13.5px button text. A bright
       accent on a dark ground wants DARK ink, not white; this reads 5.7.
       The reflex is only correct when the accent is dark. */
    --accent-ink: #17110F;
    /* The tints are now inks laid over the dark ground rather than pale
       washes, which would glow. */
    --accent-tint: #2A1A16;
    --amber: #D9A03A;
    --amber-tint: #2A2113;
    /* Caution text on a panel, for shared-worker.js -- which is styled by
       whichever host is running it, so it can only use tokens that mean the
       same thing in both. It reached for --accent-ink, and that name means
       two different things: amber warning ink in the admin app, and the
       near-black that sits ON the accent button here. On this ground it
       measured 1.09:1, which is invisible, and it was the delivery picker's
       "Preparing for X — since N minutes ago" line. */
    --warn-ink: var(--amber);
    --good: var(--ow-verdigris-bright);
    --good-bg: #14261F;
    --danger: #E4695B;
    /* --navy was the darkest thing in a light app. On a dark ground the
       thing that must stand OUT is light, so this becomes the raised
       surface -- it is only used by the toast. */
    --navy: var(--ow-night-800);
    /* A drop shadow separates nothing on a dark ground -- dark on dark is
       invisible. What reads instead is a hairline of light along the top
       edge, the way a raised surface actually catches a ceiling lamp. The
       soft drop stays underneath for depth. */
    --shadow-card: 0 0 0 1px rgba(255,255,255,.06), 0 8px 22px rgba(0,0,0,.45);
    --shadow-hero: 0 10px 26px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  /* Hides everything until boot() has loaded the worker's data --
     avoids a flash of an empty page. */
  body.app-loading .worker-view-wrap{display:none !important;}
  .icon{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;}

  .wv-eyebrow{margin:0 0 4px;color:var(--accent-deep);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
  .page-head{margin-bottom:16px;}
  .page-head h1{
    font-family:'Manrope',sans-serif;font-size:22px;font-weight:800;margin:0;color:var(--ink);
    letter-spacing:-0.2px;
  }
  .page-head p{margin:4px 0 0;color:var(--ink-soft);font-size:14px;}

  /* 44px, the same minimum the pick card's badge already states in its own
     rule and the quantity sheet repeats in its. Padding alone left these at
     38px: Deny and Accept sit side by side and one of them hands the order
     back, and "Mark as finished" moves it on. inline-flex so the label
     centres in the taller box rather than sitting at the top of it. */
  .btn{
    all:unset;box-sizing:border-box;cursor:pointer;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;
    text-align:center;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  }
  .btn-accent{background:var(--accent);color:var(--accent-ink);}
  .btn-accent:hover{background:var(--accent-deep);}
  .btn-ghost{background:var(--panel);color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}

  .empty{padding:28px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 18px;
    border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.18);
    opacity:0;transform:translateY(8px);transition:all 0.25s ease;pointer-events:none;z-index:150;
    display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  .img-zoomable{cursor:zoom-in;}
  .lightbox-overlay{
    position:fixed;inset:0;background:rgba(15,20,26,0.82);display:flex;align-items:center;
    justify-content:center;padding:40px;z-index:300;opacity:0;visibility:hidden;transition:opacity .15s ease;
  }
  .lightbox-overlay.show{opacity:1;visibility:visible;}
  .lightbox-overlay img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,0.45);}
  .lightbox-close{
    all:unset;cursor:pointer;position:fixed;top:22px;right:26px;color:#fff;display:flex;
    padding:8px;border-radius:8px;background:rgba(255,255,255,0.12);z-index:301;
  }
  .lightbox-close:hover{background:rgba(255,255,255,0.22);}
  .lightbox-close .icon{width:18px;height:18px;}

  .q-stage-thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid var(--line);background:var(--ow-night-800);}
  .q-stage-thumb-placeholder{
    width:44px;height:44px;border-radius:9px;flex-shrink:0;border:1px dashed var(--line);
    background:var(--ow-night-800);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
  }
  .q-stage-thumb-placeholder .icon{width:19px;height:19px;}

  .worker-view-wrap{width:100%;max-width:520px;margin:0 auto;padding:12px;display:flex;flex-direction:column;flex:1;min-height:0;}
  /* The header (idle "Pick & Pack" heading, or the active order's client
     name) sits outside the centered body on purpose -- it's the one thing
     that should NOT shift position as a worker swipes between items or
     moves on to their next order. Only .wv-body's content re-centers. */
  .wv-header{flex-shrink:0;padding-top:10px;}
  .wv-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .wv-greeting{margin:0;font-family:'Manrope',sans-serif;font-size:21px;font-weight:800;letter-spacing:-.2px;color:var(--ink);}
  .wv-signout-icon{
    all:unset;box-sizing:border-box;flex-shrink:0;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .wv-signout-icon .icon{width:15px;height:15px;}
  /* 34px of disc, 44px of target. A ring rather than a bigger button: this
     sits in the top corner beside a greeting, and blowing it up to 44
     visually would make the most destructive control on the screen also the
     most prominent. The confirm in signOutAndReload is the other half --
     enlarging a target makes it easier to hit on purpose AND by accident,
     and this one ends the shift's session. */
  .wv-signout-icon{position:relative;}
  .wv-signout-icon::after{content:"";position:absolute;inset:-5px;}
  /* The active order's client name + progress renders as a filled "hero"
     card (mirrors a balance-card pattern) instead of plain text -- gives
     a worker the at-a-glance "where am I on this order" the plain title
     never did. It's still just innerHTML swapped inside the same #wv_
     activeHeader mount point, so the header stays positionally stable. */
  /* Was a filled accent gradient. On a light ground that read as a
     balance card; on a dark one it is a slab of glare in the corner of
     the eye all shift, and its 10.5px label could not clear AA on that
     fill at any alpha worth using. It is now a raised card like the rest,
     and the accent is spent on the progress fill -- the part that
     actually moves and the only thing here worth looking at twice. */
  .wv-hero{
    background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:13px 16px 12px;color:var(--ink);box-shadow:var(--shadow-card);
    margin:0 0 10px;
  }
  /* White alphas rather than a tinted literal: these sit on the accent
     gradient, so they follow the accent wherever it goes instead of
     needing to be re-picked. The previous mint literals were left over
     from the green accent and would read as a clash on any other hue. */
  .wv-hero-label{margin:0 0 2px;font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em;}
  .wv-hero-name{font-family:'Manrope',sans-serif;font-size:18px;font-weight:800;letter-spacing:-.2px;}
  .wv-hero-progress-label{margin-top:8px;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .wv-hero-track{height:5px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden;}
  .wv-hero-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease;}
  .wv-body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;}
  .wv-card{background:var(--panel);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow-card);}
  .wv-card-title{font-weight:700;margin-bottom:4px;}
  .wv-card-sub{color:var(--ink-soft);font-size:13px;margin-bottom:12px;}
  .wv-actions{display:flex;gap:10px;}
  .wv-actions .btn{flex:1;}
  /* The pending list sits above the pick card in the markup, which is right
     when there is nothing being picked -- it IS the screen then. With a pick
     open it belongs after it, so the "Now picking" header and the card it
     describes stay together. Ordered rather than moved, so both wraps keep
     their ids and neither render function has to know about the other. */
  .wv-body{display:flex;flex-direction:column;}
  #wv_enablePushWrap{order:0;}
  #wv_pendingWrap{order:1;}
  #wv_activeWrap{order:2;}
  #wv_pendingWrap.is-upnext{order:3;}
  /* Last of all, behind even the up-next strip: with a pick open, a setup
     prompt is the least urgent thing on the screen. */
  #wv_enablePushWrap.is-deferred{order:4;}
  /* Quiet on purpose: it is the only thing on this screen that is not
     asking to be acted on. No avatar, no buttons -- a line telling a picker
     what is coming so the queue is not a surprise when they finish. */
  .wv-upnext{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    margin-top:12px;padding:10px 13px;border-radius:12px;
    background:var(--panel);border:1px dashed var(--line);
  }
  .wv-upnext-label{
    font-size:9.5px;font-weight:700;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.07em;flex-shrink:0;
  }
  .wv-upnext-name{font-size:13.5px;font-weight:700;color:var(--ink-soft);min-width:0;overflow-wrap:anywhere;}
  .wv-upnext-meta{font-size:11.5px;color:var(--ink-faint);margin-left:auto;flex-shrink:0;}
  /* Pending-order cards: an initial avatar + item-count pill give a worker
     more to scan at a glance than a bare name/subtitle ever did. */
  .wv-pending-card{background:var(--panel);border-radius:18px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow-card);}
  .wv-pending-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .wv-avatar{
    width:34px;height:34px;border-radius:10px;background:var(--accent-tint);color:var(--accent-deep);
    display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:13px;flex-shrink:0;
  }
  .wv-pending-text{flex:1;min-width:0;}
  .wv-pending-name{font-family:'Manrope';font-weight:700;font-size:14px;}
  .wv-pending-meta{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
  .wv-count-pill{background:var(--amber-tint);color:var(--amber);font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;}
  /* Item carousel: swipe horizontally between items (native scroll-snap,
     no gesture library needed) instead of tapping next/back buttons.
     Photo, name, quantity and source all live inside one bordered card;
     the "Pick"/"Picked" badge is an actual button pinned to that card's
     top-right corner, not just the photo. Only the centered card is
     interactive -- a peeking side card just brings itself to center when
     tapped. The carousel bleeds past the page's own side padding
     (negative margin) so the focused card can be as large as the screen
     allows -- mobile-first, this is the one thing a worker looks at. */
  .wv-carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -12px;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  /* Percentage PADDING resolves against the containing block's width, not
     this element's own (wider, thanks to the negative margin above) width
     -- that came out too narrow to ever let a boundary card scroll into
     true center. Percentage flex-basis on real flex items doesn't have
     that quirk (it resolves against this container's own content box), so
     these spacers -- not scroll-snap-align targets themselves -- give the
     first/last card genuine, correctly-sized room to center into. */
  .wv-carousel::before,.wv-carousel::after{content:'';flex:0 0 6%;}
  .wv-carousel::-webkit-scrollbar{display:none;}
  /* Opacity + a light scale change on focus -- no shake-inducing transform
     recalculated mid-scroll, just a settled "this one's live" feel. */
  .wv-carousel-card{flex:0 0 88%;scroll-snap-align:center;opacity:.4;transform:scale(.96);transition:opacity .25s ease,transform .25s ease;margin-right:10px;}
  .wv-carousel-card:last-child{margin-right:0;}
  .wv-carousel-card.focused{opacity:1;transform:scale(1);}
  /* overflow:hidden here means every section below (photo, body, source)
     gets clipped to this card's own rounded corners automatically -- the
     source strip at the bottom doesn't need its own matching radius. */
  .wv-carousel-card-inner{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-card);overflow:hidden;}
  .wv-carousel-card.focused .wv-carousel-card-inner{cursor:pointer;}
  .wv-carousel-photo{width:100%;aspect-ratio:1.4;border-bottom:1.5px dotted var(--line);overflow:hidden;}
  .wv-carousel-photo .q-stage-thumb, .wv-carousel-photo .q-stage-thumb-placeholder{width:100%;height:100%;border-radius:0;border:none;}
  .wv-carousel-photo .q-stage-thumb-placeholder .icon{width:56px;height:56px;}
  .wv-carousel-badge{position:absolute;top:11px;right:11px;display:flex;align-items:center;gap:4px;padding:7px 14px;border-radius:999px;font:700 12px inherit;box-shadow:0 2px 8px rgba(15,36,29,.16);border:none;cursor:pointer;transition:background .15s ease,color .15s ease;}
  /* 44px minimum. This is pressed with one hand, often a dirty one, by
     someone who has not stopped walking. */
  .wv-carousel-badge{min-height:44px;min-width:78px;justify-content:center;}
  .wv-carousel-badge.pending{background:var(--ow-night-800);color:var(--ink);border:1.5px solid rgba(255,255,255,.18);}
  /* Done is verdigris, not the accent. Oxide is what you press; green is
     what is finished. Those were the same colour here before the shared
     palette landed, which made "press this" and "already picked"
     indistinguishable at a glance. */
  .wv-carousel-badge.done{background:var(--good);color:#0C1A16;}
  /* A third state, and it needs its own colour rather than a shade of one
     of the other two. Green would say the line is settled when it is not;
     the accent would say there is something left to press. Amber is the
     palette's "attention, not alarm", and this badge carries digits ("3 of
     5") rather than a word, so it also needs to be legible small. Dark ink
     on it for the same reason --accent-ink is dark: white on a bright
     colour over a dark ground does not clear AA. */
  .wv-carousel-badge.short{background:var(--amber);color:var(--accent-ink);font-variant-numeric:tabular-nums;}
  .wv-carousel-badge .icon{width:13px;height:13px;stroke-width:3;}
  .wv-carousel-body{padding:11px 16px 10px;}
  .wv-carousel-name{font-size:14.5px;font-weight:600;text-align:center;}
  .wv-carousel-variant{font-size:12.5px;font-weight:700;color:var(--accent-deep);text-align:center;margin-top:3px;}
  /* Quantity is the largest thing on this card, and deliberately larger
     than the product name. The photo already answers "which item"; the
     number is the part that costs money to get wrong, and it is read at
     arm's length. The unit rides alongside at a smaller size so the digits
     keep the weight. */
  .wv-carousel-qty-label{font-size:10px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;text-align:center;margin-top:7px;}
  .wv-carousel-qty{
    font-family:'Manrope',sans-serif;font-weight:800;font-size:40px;line-height:1.05;
    color:var(--ink);text-align:center;margin-top:1px;letter-spacing:-1.2px;
    font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;justify-content:center;gap:6px;
  }
  .wv-carousel-qty .u{font-size:15px;font-weight:700;letter-spacing:0;color:var(--ink-soft);}
  /* Where to walk is information, not an action. It was tinted with the
     accent, which put a second block of the action colour on every card
     and left nothing for the button to stand out against. Neutral now --
     the accent is spent on the one thing you press. */
  /* Padded symmetrically so the supplier stays centred on the card while the
     short-pick control occupies the bottom-left corner over it. */
  .wv-carousel-source{border-top:1.5px dotted var(--line);background:var(--bg);text-align:center;padding:8px 54px 9px;}
  .wv-carousel-source-label{font-size:9.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .wv-carousel-source-value{font-size:13.5px;font-weight:800;color:var(--ink);margin-top:1px;}
  /* Recording a short pick is a deliberate, secondary act -- the common case
     is still one tap on the badge -- so it sits in the corner diagonally
     opposite the badge rather than competing with it. An icon, because the
     card is already carrying a name, a variant, a quantity and a supplier,
     and a sentence at the foot of it was the fifth thing asking to be read.
     The meaning it loses by not being words is carried by title/aria-label
     and by the badge, which states the position in numbers either way. */
  .wv-carousel-short{
    all:unset;box-sizing:border-box;position:absolute;left:8px;bottom:8px;
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    border-radius:12px;background:transparent;cursor:pointer;color:var(--amber);
  }
  .wv-carousel-short .icon{width:21px;height:21px;}
  .wv-carousel-short:hover{background:var(--amber-tint);}
  .wv-carousel-short:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;}
  .wv-carousel-dots{display:flex;justify-content:center;gap:6px;margin:9px 0 0;}
  .wv-carousel-dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s ease;}
  .wv-carousel-dot.focused{background:var(--accent);width:18px;border-radius:4px;}
  /* fit-content rather than the base inline-flex, so `margin:auto` still
     centres it while the label centres inside the 44px box. */
  .wv-mark-btn{width:fit-content;padding:10px 26px;font-size:13.5px;display:flex;margin:12px auto 0;}
  /* Finishing an order that is going out incomplete should not look
     identical to finishing one that is not. Same button, same place, the
     colour of the thing it is reporting. */
  .wv-mark-btn.is-short{background:var(--amber);color:var(--accent-ink);}
  .wv-mark-btn.is-short:hover{background:var(--amber);filter:brightness(1.08);}
  /* The picked-quantity sheet. Every control on it clears 44px: it is used
     at the shelf, one-handed, by someone who has not put anything down. */
  .wv-qty-sheet{background:var(--panel);border-radius:16px;padding:20px;width:320px;max-width:100%;box-shadow:var(--shadow-hero);}
  .wv-qty-title{font-size:16px;font-weight:700;text-align:center;}
  .wv-qty-sub{font-size:13px;color:var(--ink-soft);text-align:center;margin-top:4px;}
  .wv-qty-stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 14px;}
  .wv-qty-step{

</style>

<body class="app-loading">

<div class="worker-view-wrap">
  <div class="wv-header" id="wv_header">
    <div class="wv-topbar">

        <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
    <div class="page-head" id="wv_pageHead">

    </div>

  </div>
  <div class="wv-body">
    <div id="wv_enablePushWrap" class="wv-card" style="display:none;">
      <div class="wv-card-title">Turn on notifications</div>

    </div>
    <div id="wv_pendingWrap"></div>
    <div id="wv_activeWrap"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- IMAGE LIGHTBOX -->
<div class="lightbox-overlay" id="imgLightbox">
  <button class="lightbox-close" id="imgLightboxClose" aria-label="Close">
    <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img id="imgLightboxImg" src="" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared-worker.js"></script>
<script>
// Supabase appends #...&type=invite (or type=recovery) to the redirect URL
// for invite/reset emails -- read once, before createClient() consumes the
// hash to establish the session, so ensureAuthAndShop() can tell a brand
// new worker apart from a normal returning sign-in.
const initialAuthLinkType = new URLSearchParams(location.hash.replace(/^#/, '')).get('type');

const SUPABASE_URL = 'https://hgywjaifdmgrcnwxstxg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_KsUIBYzuZRdoPsqP4T2ULw__AsCEhzV';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentShopId = null;
let currentUser = null;
let currentMemberRole = null;

document.addEventListener('click', (e)=>{
  const zoomEl = e.target.closest('.img-zoomable');
  if(zoomEl) openImageLightbox(zoomEl.src, zoomEl.alt);
});
function openImageLightbox(src, alt){
  document.getElementById('imgLightboxImg').src = src;
  document.getElementById('imgLightboxImg').alt = alt || '';
  document.getElementById('imgLightbox').classList.add('show');
}
function closeImageLightbox(){
  document.getElementById('imgLightbox').classList.remove('show');
  document.getElementById('imgLightboxImg').src = '';
}
document.getElementById('imgLightboxClose').addEventListener('click', closeImageLightbox);
document.getElementById('imgLightbox').addEventListener('mousedown', (e)=>{
  if(e.target.id==='imgLightbox') closeImageLightbox();
});
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && document.getElementById('imgLightbox').classList.contains('show')) closeImageLightbox();
});

let data = null;
let myStaff = null;
let hasPushSubscription = false;
let lastSynced = {};

// This app only ever needs a slice of the shop's data: every staff row
// (to resolve myStaff, and to list delivery-eligible candidates when
// finishing an order -- see promptAssignDelivery() in shared-worker.js),
// every agent's payment term (read-only -- see
// 0013_agents_readable_by_shop_members.sql -- so autoAssignNextOrder()
// can skip a draft order still waiting on its required prepayment), every
// supplier (for "where to get it" labels), just enough of each product to
// show a photo, and every saved quote in the shop (so a worker who
// finishes an order can see -- and get auto-assigned -- the next
// unassigned one). Stock, cash, customers, prices and purchase invoices
// are all admin-only concerns this app never touches.
async function loadWorkerData(shopId){
  const [staffR, agentsR, suppliersR, productsR, savedQuotesR, settingsR] = await Promise.all([
    sb.from('staff').select('*').eq('shop_id', shopId),
    sb.from('agents').select('id, payment_term').eq('shop_id', shopId),
    sb.from('suppliers').select('*').eq('shop_id', shopId),
    // variants and category are both here for the photos. resolveProductImage
    // looks at the variant's own image, then the product's, then the shared
    // one on its category -- and without these columns it could only ever
    // reach the middle step, so every finish of a product showed the same
    // generic picture and anything unphotographed showed a placeholder icon.
    // Still far short of the admin's product select -- no pricing, markups
    // or stock, none of which this app has any use for.
    sb.from('products').select('id, name, image, variants, category').eq('shop_id', shopId),
    sb.from('saved_quotes').select('*').eq('shop_id', shopId),
    // Where the category photos live. Same is_shop_member policy as every
    // table above, and maybeSingle so a shop that has never saved settings
    // reads as null rather than an error.
    sb.from('app_settings').select('presets').eq('shop_id', shopId).maybeSingle(),
  ]);
  [staffR, agentsR, suppliersR, productsR, savedQuotesR, settingsR].forEach(r=>{ if(r.error) throw r.error; });

  return {
    staff: (staffR.data||[]).map(s=>({id:s.id, name:s.name, phone:s.phone, role:s.role, notes:s.notes, unavailable:!!s.unavailable, userId:s.user_id||null})),
    agents: (agentsR.data||[]).map(a=>({id:a.id, paymentTerm:a.payment_term||'prepay'})),
    suppliers: (suppliersR.data||[]).map(s=>({id:s.id, name:s.name, phone:s.phone, location:s.location, notes:s.notes})),
    products: (productsR.data||[]).map(p=>({id:p.id, name:p.name, image:p.image||null, variants:p.variants||[], category:p.category||null})),
    // resolveProductImage guards on this being present, so an empty list
    // just means it stops at the product's own photo, exactly as before.
    presetCategories: ((settingsR.data && settingsR.data.presets) || {}).categories || [],
    savedQuotes: (savedQuotesR.data||[]).map(q=>({
      id:q.id, status:q.status||'draft', invoiced:!!q.invoiced, invoicedAt:q.invoiced_at,
      invoicedTs: q.invoiced_ts ? new Date(q.invoiced_ts).getTime() : null,
      amountPaid:Number(q.amount_paid)||0, voided:!!q.voided, date:q.date,
      client:{name:'', phone:''}, items:[], savedAt:null, payments:[], customerId:null, debtCharged:0,
      ...(q.payload||{})
    })),
  };
}

// Same shape saveData() upserts in the admin app's buildSyncRows(), scoped
// down to just savedQuotes -- the only collection this app ever mutates.
function buildWorkerSyncRows(d, shopId){
  return {
    savedQuotes: d.savedQuotes.map(q=>({
      id:q.id, shop_id:shopId, client_name:(q.client&&q.client.name)||null, client_phone:(q.client&&q.client.phone)||null,
      date:q.date, status:q.status, invoiced:q.invoiced, invoiced_at:q.invoicedAt,
      invoiced_ts: q.invoicedTs ? new Date(q.invoicedTs).toISOString() : null,
      amount_paid:q.amountPaid, voided:q.voided,
      payload:{client:q.client, items:q.items, savedAt:q.savedAt, payments:q.payments, customerId:q.customerId, debtCharged:q.debtCharged, stageEnteredAt:q.stageEnteredAt, assignedWorkerId:q.assignedWorkerId, assignedDeliveryId:q.assignedDeliveryId, pickingStatus:q.pickingStatus||null, pickCursor:q.pickCursor||0, pickingAssignedAt:q.pickingAssignedAt||null, workerAcceptedAt:q.workerAcceptedAt||null}
    })),
  };
}

// The only parts of an order this app is allowed to write. Everything else
// on the row -- money, client, the items themselves -- belongs to the admin
// app, and this one has no business sending its own idea of them back.
const WORKER_OWNED_KEYS = [
  'assignedWorkerId', 'assignedDeliveryId',
  'pickingStatus', 'pickCursor', 'pickingAssignedAt', 'workerAcceptedAt',
  'stageEnteredAt'
];

// The only status moves this app makes, keyed by where the order has to be
// for the move to mean anything: finishPreparingOrder sends a pick it has
// just completed to pending_delivery (its own guard admits draft as well as
// preparing), and autoAssignNextOrder promotes the draft it takes on next.
// Anything else arriving from here is not a move, it is a stale snapshot.
const WORKER_STATUS_MOVES = {
  preparing: ['pending_delivery'],
  draft: ['preparing', 'pending_delivery'],
};

// Pick state lives on the items, so it has to be merged onto the SERVER's
// items rather than replacing them. If the counts differ the admin has
// edited the order since this app loaded -- their version wins and the pick
// state is dropped, because matching by index across an edit would attach
// "picked" to whatever item happens to now sit at that position.
function mergePickState(serverItems, localItems){
  if(!Array.isArray(serverItems)) return localItems;
  if(!Array.isArray(localItems) || serverItems.length !== localItems.length) return serverItems;
  return serverItems.map((it, i)=>({
    ...it,
    pickStatus: localItems[i].pickStatus,
    pickedQty: localItems[i].pickedQty
  }));
}

// `data` here is a snapshot, and it can be old. startWorkerPolling refreshes
// it every WORKER_POLL_MS, but deliberately not while the app is hidden, not
// within the quiet period after a touch, not while the delivery picker is
// open, and not at all when the refresh itself fails -- which offline, in a
// stockroom, means indefinitely. Every one of those gaps is a moment a
// worker is tapping, and therefore saving.
//
// Sending the whole row back would overwrite everything the admin has done
// to it since -- a payment recorded at 10am is gone the moment an 8am
// snapshot saves at 11am, and nothing anywhere would report it.
//
// So a save re-reads the rows it is about to touch and lays only the fields
// above onto the server's current version. A read-modify-write is the wrong
// shape in general, but the alternative here is a client that silently
// reverts the shop's books to whenever its user last opened the app.
async function mergeOntoServerRows(shopId, rows){
  const { data: current, error } = await sb.from('saved_quotes')
    .select('*').eq('shop_id', shopId).in('id', rows.map(r=>r.id));
  if(error) throw error;
  const byId = new Map((current||[]).map(r=>[String(r.id), r]));
  return rows.map(local=>{
    const server = byId.get(String(local.id));
    if(!server) return local;   // not on the server at all -- nothing to preserve
    const serverPayload = server.payload || {};
    const localPayload = local.payload || {};
    const payload = {...serverPayload};
    WORKER_OWNED_KEYS.forEach(k=>{ payload[k] = localPayload[k]; });
    payload.items = mergePickState(serverPayload.items, localPayload.items);
    // status is worker-owned only in the directions this app moves it;
    // anywhere else the server's is authoritative. That was the stated rule
    // but not the code, which took local.status outright.
    //
    // So a "still preparing" that only means the poll has not come round yet
    // was written back as fact. An order the admin completed while the
    // worker was tapping -- each tap holding the next refresh off -- was
    // reopened as unfinished work on the board by that worker's next save,
    // with nothing to show why it had reappeared.
    //
    // Judged against the SERVER's status, so a real move is still written
    // through and a stale one no longer drags the order backward.
    const moves = WORKER_STATUS_MOVES[server.status] || [];
    const status = moves.includes(local.status) ? local.status : server.status;
    return {...server, status, payload};
  });
}

async function saveData(){
  const shopId = currentShopId;
  if(!data.savedQuotes) data.savedQuotes = [];
  // Held for the whole call so a background refresh can't swap `lastSynced`
  // out from under the diff this save is still committing against.
  workerSaveInFlight = true;
  try{
    const rows = buildWorkerSyncRows(data, shopId);

    // Same comparison addDiffOps() uses to decide what to send, so only the
    // rows actually about to move get re-read.
    const prev = (lastSynced && lastSynced.savedQuotes) || {};
    const changed = rows.savedQuotes.filter(r=> JSON.stringify(r) !== JSON.stringify(prev[String(r.id)]));
    if(changed.length){
      try{
        const merged = await mergeOntoServerRows(shopId, changed);
        const mergedById = new Map(merged.map(r=>[String(r.id), r]));
        rows.savedQuotes = rows.savedQuotes.map(r=> mergedById.get(String(r.id)) || r);
      }catch(err){
        // Better to send nothing than to send a stale row wholesale.
        console.error('Could not re-read orders before saving:', err);
        toast('Sync failed — check your connection and try again', 5000);
        return;
      }
    }

    const ops = [];
    // This app has no way to remove an order -- nothing here ever takes one
    // out of data.savedQuotes -- so a delete could only ever come from `data`
    // and `lastSynced` drifting apart, and it would take the shop's whole
    // order history with it. Three places assign the two together in the
    // right order to prevent exactly that (boot, the background refresh, a
    // notification tap); this makes a fourth getting it wrong survivable.
    addDiffOps(ops, 'savedQuotes', 'saved_quotes', 'id', shopId, rows.savedQuotes, {neverDelete:true});
    if(!ops.length) return;

    const results = await Promise.all(ops.map(op=> op.run()));
    results.forEach((r, i)=>{ if(!(r && r.error)) ops[i].commit(); });

    const failed = results.find(r=> r && r.error);
    if(failed){
      console.error('saveData failed:', failed.error);
      toast('Sync failed — a change may not have been saved (' + failed.error.message + ')', 5000);
    }
  } finally {
    workerSaveInFlight = false;
  }
}

/* ---------------- Background refresh ----------------
   This app used to load once and never look again, which is why a save
   merges onto the server's row (see saveData above). That kept stale data
   from destroying anything, but the worker was still LOOKING at a screen
   that could be hours old: an order cancelled, reassigned, or already
   delivered still sat there waiting to be picked.

   Deliberately quieter than the admin app's 30s -- this runs on a worker's
   phone for a whole shift, on their data. Nothing happens while the app is
   backgrounded, and returning to the foreground refreshes straight away
   rather than waiting out the interval, which is when a worker actually
   wants to see what changed. */
const WORKER_POLL_MS = 60000;
// How long after a touch to leave the screen alone. A refresh re-renders,
// and re-rendering the carousel snaps it back to the focused card -- so a
// tick that lands under a moving thumb is worse than no tick at all.
const WORKER_QUIET_MS = 4000;
let lastWorkerInteractionAt = 0;
let workerRefreshing = false;
let workerSaveInFlight = false;

['pointerdown','touchstart','input','scroll'].forEach(evt=>{
  document.addEventListener(evt, ()=>{ lastWorkerInteractionAt = Date.now(); }, true);
});

async function refreshWorkerData(opts){
  const force = !!(opts && opts.force);
  // A refresh mid-save would swap `lastSynced` out from under the diff that
  // save is still committing against.
  if(workerRefreshing || workerSaveInFlight || !currentShopId) return;
  if(!force){
    if(document.visibilityState === 'hidden') return;
    // The delivery picker is a decision in the middle of a flow; re-rendering
    // underneath it would replace the order it is asking about.
    if(document.querySelector('.wv-assign-overlay')) return;
    if(Date.now() - lastWorkerInteractionAt < WORKER_QUIET_MS) return;
  }
  workerRefreshing = true;
  try{
    // Both built before either is assigned. addDiffOps derives its deletes
    // from lastSynced, so `data` and `lastSynced` describing different
    // states is not a stale render -- it is a delete instruction. Same
    // reason the admin app's poll is ordered this way.
    const fresh = await loadWorkerData(currentShopId);
    const freshSynced = { savedQuotes: keyRowsById(buildWorkerSyncRows(fresh, currentShopId).savedQuotes, 'id') };
    data = fresh;
    lastSynced = freshSynced;
    // An admin can edit staff too -- being marked unavailable, or having the
    // login relinked, should show up here without a restart.
    myStaff = data.staff.find(s=>s.userId===currentUser.id) || null;
  }catch(err){
    console.error('Background refresh failed:', err);
  }finally{
    workerRefreshing = false;
  }
  // Outside the try: even on a failed refresh the screen still redraws, so
  // "Requested X ago" stays honest with no signal.
  renderWorkerView();
}

function startWorkerPolling(){
  setInterval(refreshWorkerData, WORKER_POLL_MS);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') refreshWorkerData();
  });
}

document.getElementById('wv_signout_btn').addEventListener('click', signOutAndReload);

async function boot(){
  try{
    await ensureAuthAndShop();
    data = await loadWorkerData(currentShopId);
    lastSynced = { savedQuotes: keyRowsById(buildWorkerSyncRows(data, currentShopId).savedQuotes, 'id') };
  } catch(e){
    console.error('Failed to start app:', e);
    const el = ensureAuthOverlay();
    el.innerHTML = `<div style="color:#f66;font-family:sans-serif;max-width:400px;text-align:center;">Couldn't load your orders: ${(e && e.message) || e}. Reload to try again.</div>`;
    return;
  }
  myStaff = data.staff.find(s=>s.userId===currentUser.id) || null;
  if(myStaff){
    const { data: existingSub } = await sb.from('push_subscriptions').select('id').eq('staff_id', myStaff.id).eq('user_id', currentUser.id).limit(1).maybeSingle();
    hasPushSubscription = !!existingSub;
    if(isNativeApp()){
      registerNativePushListeners();
      // Reinstalling the APK (a new debug build, a signature mismatch
      // forcing uninstall/reinstall) silently mints a new FCM token, but
      // the DB still has whatever token was registered the first time the
      // user tapped "Enable notifications" -- that row going stale after a
      // reinstall is exactly why a push can stop arriving with no error
      // anywhere (FCM just accepts the send for a token nobody's listening
      // on anymore). Re-registering on every native launch once permission
      // is already granted is a silent no-op prompt-wise (checkPermissions
      // already returns granted) but keeps the stored token current.
      if(hasPushSubscription) enableNativePush();
    }
  }
  // Remove the loading class before rendering, not after -- the carousel's
  // initial scrollIntoView() (centering the focused card) is a no-op on an
  // element with no layout box, and body.app-loading forces .worker-view-wrap
  // to display:none. Rendering into a still-hidden wrap left the carousel
  // permanently stuck at scrollLeft 0 (visually left-shifted) since there's
  // no repaint afterwards that would let it retroactively center itself.
  document.body.classList.remove('app-loading');
  renderWorkerView();
  // Replaces the old bare setInterval(renderWorkerView) -- the refresh
  // re-renders too, so this keeps "Requested X ago" accurate as before AND
  // the orders themselves current.
  startWorkerPolling();
}
boot();
</script>
