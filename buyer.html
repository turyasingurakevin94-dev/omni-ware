<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16203C">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>Omni-Ware Buyer</title>
<!-- The phone app's native layer (apps/buyer). Inert in a browser. It
     lives here rather than in the app's own files so a fix to it reaches
     installed phones the same way any change to this page does. -->
<script>
/* The buyer page inside the Android app (apps/buyer).

   First in <head>, and only does anything inside the app. Four jobs:

   1. Back (Android) closes what is on top -- a photo, a sheet, then the tab
      -- before it ever leaves the app, and leaving only puts it in the
      background so it reopens instantly.
   2. The status bar: the page draws to the top edge, so a strip behind the
      clock takes the colour of whatever is under it, and its icons stay
      readable against it.
   3. The bars' size: Capacitor measures them into --safe-area-inset-*,
      but a page it has not measured (some phones, after a reload) would
      read zero and slide under the clock -- so the last good measurement
      stands in until it does.
   4. Staying current without a store release: the installed app checks the
      live buyer.html now and then, keeps a copy of a new one on the phone,
      and switches to it the next time the app goes to the background --
      never in the middle of a trip. */
(function(){
  'use strict';
  var C = window.Capacitor;
  if(!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return;
  var P = C.Plugins || {};
  var App = P.App, Bars = P.SystemBars, WebView = P.WebView, Http = P.CapacitorHttp, FS = P.Filesystem;
  var NAVY = '#16203C';
  var root = document.documentElement;
  // The first installs carried this layer as their own native.js. On those
  // it is already running from above, and only the bars' size (3) is new.
  var legacy = !!document.querySelector('script[src="native.js"]');

  window.owHaptic = function(kind){
    var H = P.Haptics;
    if(!H) return;
    (kind === 'success' ? H.notification({ type: 'SUCCESS' }) : kind === 'warn' ? H.notification({ type: 'WARNING' }) : H.impact({ style: 'LIGHT' })).catch(function(){});
  };

  /* ---- 1. back ---- */
  // The page keeps its own stack of what is open (window.bxBack): a sheet,
  // then a screen pushed over a tab, then the tab itself back to Today.
  function back(){
    if(typeof window.bxBack === 'function' && window.bxBack()) return;
    if(App) App.minimizeApp();
  }
  if(App && !legacy) App.addListener('backButton', back);

  /* ---- 2. the strip behind the status bar ---- */
  var strip = null, lastStyle = '';
  function paintBar(){
    if(!strip) return;
    var top = strip.offsetHeight;
    // Today's navy hero is marked data-navy-top. A pushed page opens on its
    // own dark ground -- the tap-to-go-back strip -- unless it is a page
    // whose navy hero has scrolled away under the clock.
    var page = document.querySelector('#bx_pages .bx-page:last-child');
    var navy = (page || document).querySelector('[data-navy-top]:not([hidden])');
    var navyAtTop = !!navy && navy.getBoundingClientRect().top <= top && navy.getBoundingClientRect().bottom > top;
    var ground = page ? getComputedStyle(page).backgroundColor : '';
    var rgb = (ground.match(/\d+/g) || []).map(Number);
    var darkGround = !navyAtTop && !navy && rgb.length >= 3 && (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000 < 90;
    var auth = !!document.querySelector('.bx-auth');
    strip.style.background = auth || navyAtTop ? NAVY : darkGround ? ground : 'var(--bg)';
    var style = auth || navyAtTop || darkGround || document.querySelector('.bx-scrim') ? 'DARK' : 'LIGHT';
    if(style !== lastStyle && Bars){ lastStyle = style; Bars.setStyle({ style: style }).catch(function(){}); }
  }
  var queued = false;
  function soon(){ if(queued) return; queued = true; requestAnimationFrame(function(){ queued = false; paintBar(); }); }
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(insets, 800);
    setTimeout(insets, 2500);
    window.addEventListener('resize', function(){ setTimeout(insets, 300); });
    if(App) App.addListener('resume', function(){ setTimeout(insets, 300); });
    if(legacy) return;
    strip = document.createElement('div');
    strip.setAttribute('aria-hidden', 'true');
    strip.style.cssText = 'position:fixed;top:0;left:0;right:0;height:var(--safe-t, 0px);z-index:59;pointer-events:none;background:' + NAVY + ';';
    document.body.appendChild(strip);
    new MutationObserver(soon).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class'] });
    document.addEventListener('scroll', soon, { passive: true, capture: true });
    paintBar();
  });


  /* ---- 3. the bars' size ---- */
  var INSETS = 'ow-app-insets';
  function insets(){
    if(typeof C.getPlatform === 'function' && C.getPlatform() !== 'android') return;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:var(--safe-t, 0px);padding-bottom:var(--safe-b, 0px);';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe), top = parseFloat(cs.paddingTop) || 0, bottom = parseFloat(cs.paddingBottom) || 0;
    probe.remove();
    var measured = root.style.getPropertyValue('--safe-area-inset-top') !== '';
    var last = {};
    try{ last = JSON.parse(localStorage.getItem(INSETS)) || {}; }catch(_e){}
    if(measured && top > 0){
      if(last.top !== top || last.bottom !== bottom){ try{ localStorage.setItem(INSETS, JSON.stringify({ top: top, bottom: bottom, ours: false })); }catch(_e){} }
      return;
    }
    // Measured at zero: Android has laid the page out below its bars itself.
    if(measured || top > 0) return;
    // Not measured, and the page fills the whole screen -- it is under the
    // bars with nothing telling it how tall they are.
    if(!last.top && Math.abs(screen.height - window.innerHeight) > 16) return;
    root.style.setProperty('--safe-area-inset-top', (last.top || 32) + 'px');
    root.style.setProperty('--safe-area-inset-bottom', (last.bottom || 32) + 'px');
  }

  /* ---- 4. staying current ---- */
  if(legacy || !(WebView && Http && FS && App && window.crypto && crypto.subtle)) return;
  var SOURCE = 'https://omni-ware.vercel.app/buyer.html';
  var KEY = 'ow-buyer-bundle';
  var EVERY = 30 * 60 * 1000;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(_e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_e){} }
  function header(h, name){
    var k = Object.keys(h || {}).filter(function(x){ return x.toLowerCase() === name; })[0];
    return k ? h[k] : '';
  }
  function sha256(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  // A file of the bundle running now, as base64 for the Filesystem plugin.
  function fileB64(name){
    return fetch(name, { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error(name + ': ' + r.status);
      return r.blob();
    }).then(function(blob){
      return new Promise(function(ok, fail){
        var fr = new FileReader();
        fr.onload = function(){ ok(String(fr.result).split(',')[1] || ''); };
        fr.onerror = fail;
        fr.readAsDataURL(blob);
      });
    });
  }
  function current(){ return fetch('bundle.json', { cache: 'no-store' }).then(function(r){ return r.json(); }); }

  // After a switch: make the new copy the one the app opens with, and drop
  // the copies nothing points at any more.
  function settle(){
    var s = load();
    if(!s.staged) return Promise.resolve();
    return WebView.getServerBasePath().then(function(cur){
      if(!cur || cur.path !== s.staged.path) return;
      return WebView.persistServerBasePath().then(function(){
        var keep = s.staged.dir;
        s.etag = s.staged.etag;
        delete s.staged;
        save(s);
        return FS.readdir({ path: 'live', directory: 'DATA' }).then(function(r){
          return Promise.all((r.files || []).map(function(f){
            var n = typeof f === 'string' ? f : f.name;
            return n === keep.split('/').pop() ? null : FS.rmdir({ path: 'live/' + n, directory: 'DATA', recursive: true }).catch(function(){});
          }));
        }).catch(function(){});
      });
    });
  }

  function check(){
    var s = load();
    if(s.staged || Date.now() - (s.checked || 0) < EVERY) return Promise.resolve();
    s.checked = Date.now();
    save(s);
    return Promise.all([current(), Http.request({ url: SOURCE, method: 'GET', responseType: 'text',
      headers: s.etag ? { 'If-None-Match': s.etag } : {} })]).then(function(pair){
      var mine = pair[0], res = pair[1];
      if(res.status !== 200) return;
      var html = typeof res.data === 'string' ? res.data : '';
      // Half a page is worse than an old page.
      if(html.length < 100000 || html.indexOf('</html>') === -1) return;
      var etag = header(res.headers, 'etag');
      return sha256(html).then(function(hash){
        if(hash === mine.source){ s.etag = etag; save(s); return; }
        var dir = 'live/' + hash.slice(0, 16);
        var rest = (mine.files || []).filter(function(f){ return f !== 'index.html' && f !== 'bundle.json'; });
        return FS.writeFile({ path: dir + '/index.html', data: window.owAppTransform(html), directory: 'DATA', encoding: 'utf8', recursive: true })
          .then(function(){
            return rest.reduce(function(p, f){
              return p.then(function(){ return fileB64(f); })
                .then(function(b64){ return FS.writeFile({ path: dir + '/' + f, data: b64, directory: 'DATA', recursive: true }); });
            }, Promise.resolve());
          })
          .then(function(){
            return FS.writeFile({ path: dir + '/bundle.json', data: JSON.stringify({ source: hash, files: mine.files }), directory: 'DATA', encoding: 'utf8', recursive: true });
          })
          .then(function(){ return FS.getUri({ path: dir, directory: 'DATA' }); })
          .then(function(u){
            var s2 = load();
            s2.staged = { dir: dir, path: decodeURI(String(u.uri).replace(/^file:\/\//, '')), etag: etag };
            save(s2);
          });
      });
    }).catch(function(){
      // No signal, or the server is down: the copy already here carries on.
    });
  }

  App.addListener('pause', function(){
    var s = load();
    if(s.staged) WebView.setServerBasePath({ path: s.staged.path }).catch(function(){});
  });
  App.addListener('resume', function(){ check(); });
  settle().catch(function(){}).then(function(){ setTimeout(check, 5000); });
})();
</script>
<link rel="manifest" href="/manifest-buyer.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F7F5F2; --paper:#FFFFFF; --navy:#16203C; --navy2:#243052; --ink:#1C2233; --ink2:#5F6980; --ink3:#767F91; --ink4:#8A93A3;
  --line:#ECE8E1; --rule:#E6E3DD; --soft:#F4F2EE; --soft2:#EFECE6; --dash:#E2DED6;
  --red:#C93A30; --mint:#6FDCB0; --amber:#F5B26B; --amberInk:#95530C; --amberSoft:#FDEEE1; --amberDeep:#7A4A02;
  --green:#0F6B43; --greenSoft:#E4F4EA; --crimson:#8E2A22; --crimsonSoft:#FBE5E2; --rose:#F59A92;
  --indigo:#3A3F9B; --indigoSoft:#E4E6FA; --lilac:#9BA3F0;
  --navyInk:#B3BCD2; --navyInk2:#8D99B5;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --safe-area-inset-top:env(safe-area-inset-top,0px); --safe-area-inset-bottom:env(safe-area-inset-bottom,0px);
  /* The native layer's names for the same two bars (its strip and its probe). */
  --safe-t:var(--safe-area-inset-top); --safe-b:var(--safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
html.big #bx_app,html.big .bx-page,html.big .bx-sheet{zoom:1.12}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font-family:inherit;color:var(--ink)}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- shell ---- */
#bx_app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(100px + var(--safe-area-inset-bottom))}
.bx-view{animation:bxFade .25s ease-out}
@keyframes bxFade{from{opacity:.4}to{opacity:1}}
.bx-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;box-shadow:0 -1px 0 var(--line),0 -10px 24px rgba(22,32,60,.05);padding:10px 0 calc(12px + var(--safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:start;max-width:520px;margin:0 auto}
.bx-nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink3);font-size:11px;font-weight:600;padding:0;position:relative}
.bx-nav button[aria-current="page"]{color:var(--navy);font-weight:700}
.bx-nav button[aria-current="page"] .icon{fill:var(--navy)}
.bx-nav button[aria-current="page"] .icon .hole{stroke:#fff;fill:none}
.bx-nav .bx-go{justify-self:center;margin-top:-30px;width:64px;height:64px;border-radius:999px;background:var(--red);color:#fff;box-shadow:0 0 0 5px var(--bg),0 10px 24px rgba(201,58,48,.35);justify-content:center}
.bx-nav .bx-go .icon{width:30px;height:30px;stroke-width:2;fill:none!important}
.bx-badge{position:absolute;top:-4px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.bx-badge.amber{background:var(--amber);color:var(--navy)}

/* ---- navy hero ---- */
.bx-hero{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;border-radius:0 0 28px 28px;padding:calc(16px + var(--safe-area-inset-top)) 16px 16px;display:flex;flex-direction:column;gap:14px}
.bx-sheethead{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;padding:calc(10px + var(--safe-area-inset-top)) 18px 16px;display:flex;flex-direction:column;gap:12px}
.bx-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navyInk2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:350px){.bx-eyebrow{letter-spacing:.1em}}
.bx-glass{border-radius:18px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bx-circle{width:40px;height:40px;border-radius:999px;border:none;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.bx-circle.light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.bx-body{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.bx-grip{align-self:center;width:40px;height:5px;border-radius:999px;background:rgba(255,255,255,.22);flex:none}

/* ---- cards / rows ---- */
.bx-card{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(22,32,60,.05),inset 0 0 0 1px var(--line)}
.bx-list{padding:0 12px}
.bx-row{display:flex;align-items:center;gap:10px;min-height:60px;border:none;background:none;width:100%;text-align:left;padding:8px 0;color:var(--ink)}
.bx-row + .bx-row{border-top:1px solid #F1EEE8}
.bx-av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.bx-av.round{border-radius:999px}
.bx-t{font-size:14px;font-weight:700}
.bx-sub{font-size:12px;color:var(--ink3)}
.bx-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.bx-sec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.bx-sec b{font-size:15px;font-weight:700}
.bx-sec span{font-size:12px;font-weight:600;color:var(--ink3)}
.bx-empty{padding:28px 16px;text-align:center;color:var(--ink3);font-size:14px}
.bx-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.bx-dot{width:7px;height:7px;border-radius:999px;display:inline-block;flex:none}

/* ---- buttons ---- */
.bx-btn{height:56px;border-radius:18px;border:none;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;flex:1}
.bx-btn.red{background:var(--red);color:#fff;box-shadow:0 10px 22px rgba(201,58,48,.3)}
.bx-btn.navy{background:var(--navy);color:#fff}
.bx-btn.ghost{background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.bx-btn.green{background:var(--green);color:#fff;box-shadow:0 10px 22px rgba(15,107,67,.3)}
.bx-btn.glass{background:rgba(255,255,255,.08);color:#fff}
.bx-btn[disabled],.bx-btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.bx-sq{width:56px;height:56px;flex:none;border-radius:18px;border:none;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;font-weight:700}
.bx-foot{margin-top:auto;position:sticky;bottom:0;z-index:5;padding:14px 16px calc(18px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:inherit}
.bx-foot:before{content:'';position:absolute;left:0;right:0;top:-32px;height:32px;background:linear-gradient(180deg,rgba(247,245,242,0),var(--bg) 85%);pointer-events:none}
.bx-dock{position:sticky;bottom:0;z-index:5}
/* the fade above a pinned footer must never sit on the last thing above it */
.bx-page :has(+ .bx-foot){margin-bottom:20px}
.bx-foot .row{display:flex;gap:8px}
.bx-hint{display:flex;align-items:center;gap:6px;padding-left:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.bx-seg{position:relative;display:grid;padding:4px;border-radius:20px;background:#EAE6DF;box-shadow:inset 0 1px 2px rgba(22,32,60,.08)}
.bx-seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(22,32,60,.08),0 6px 14px rgba(22,32,60,.12),inset 0 0 0 1.5px var(--navy);transition:transform .35s cubic-bezier(.3,1.25,.5,1)}
.bx-seg button{position:relative;z-index:1;border:none;background:transparent;border-radius:16px;padding:0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink2);transition:color .2s}
.bx-seg button[aria-checked="true"],.bx-seg button[aria-selected="true"]{color:var(--navy)}
.bx-seg.dark{background:rgba(255,255,255,.07);box-shadow:none;border-radius:16px}
.bx-seg.dark .thumb{border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.bx-seg.dark button{color:#DDE3F0;border-radius:12px}
.bx-seg.dark button[aria-selected="true"]{color:var(--navy)}
.bx-pick{width:100%;border:none;background:#fff;color:var(--ink);display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.bx-pick[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--navy),0 8px 18px rgba(22,32,60,.1)}
.bx-pick.drop[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--crimson)}

/* ---- paper slip ---- */
.bx-slip{filter:drop-shadow(0 1px 1px rgba(22,32,60,.08)) drop-shadow(0 4px 10px rgba(22,32,60,.07));margin:0 2px}
.bx-slip:before,.bx-slip:after{content:'';display:block;height:7px}
.bx-slip:before{background:linear-gradient(45deg,transparent 50%,#fff 50%) 0 0/12px 7px repeat-x,linear-gradient(-45deg,transparent 50%,#fff 50%) 0 0/12px 7px repeat-x}
.bx-slip:after{background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/12px 7px repeat-x,linear-gradient(-135deg,#fff 50%,transparent 50%) 0 0/12px 7px repeat-x}
.bx-slip-in{position:relative;background:#fff;padding:2px 14px 5px;display:flex;flex-direction:column}
.bx-slip.dark{filter:drop-shadow(0 6px 14px rgba(0,0,0,.28))}
.bx-sl{display:grid;grid-template-columns:30px auto minmax(0,1fr);align-items:center;gap:8px;padding:6px 0}
.bx-sl + .bx-sl{border-top:1px dashed var(--dash)}
.bx-slip-in > .bx-sl:first-child .n{padding-right:92px}
.bx-sl .q{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.bx-sl .q small{font-family:Figtree,sans-serif;font-size:11px;font-weight:600;color:#6B7480;letter-spacing:0}
.bx-sl .n{min-width:0;font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.bx-sl .n .v{display:inline-block;margin-top:2px;padding:0 6px;border-radius:6px;background:var(--soft2);font-size:11px;font-weight:600;color:var(--ink2)}
.bx-sl .meta{grid-column:1 / -1;display:flex;align-items:center;gap:8px;padding-top:4px}
.bx-sl.struck .n{color:#8A93A3;text-decoration:line-through}
.bx-why{grid-column:1 / -1;display:flex;gap:6px;margin:0 -4px}
.bx-why button{display:flex;align-items:center;gap:6px;min-height:36px;border:none;border-radius:9px;font-size:11px;font-weight:700;text-align:left}
.bx-why .w{flex:1;min-width:0;padding:0 8px;background:var(--indigoSoft);color:var(--indigo)}
.bx-why span.w{display:flex;align-items:center;gap:6px;min-height:36px;border-radius:9px;font-size:11px;font-weight:700}

<body>
<div id="bx_app"><div id="bx_main"><div class="bx-empty" style="padding-top:40vh"><b>Omni-Ware Buyer</b>Opening…</div></div></div>
<div id="bx_pages"></div>
<div id="bx_sheet"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
/* ==================================================================
   Omni-Ware Buyer — the buying desk on a phone.

   The person who checks orders with suppliers, plans the collection
   trips and rides them. One self-contained page like sales.html: the
   same Supabase project and the same rows the owner's app reads and
   writes. Every rule that moves an order or a trip is the owner's own,
   carried over from index.html / shared-worker.js and named beside it.

   What a Buyer login writes, and nothing else (0114_buyer_role.sql):
     saved_quotes      a supplier's answer (supplierConfirms), when they
                       were asked, switching a line to another supplier
                       or our shelf, dropping a line in Checking with a
                       reason, a new price a supplier gave, and the order
                       leaving Checking when the last supplier says yes.
     collection_trips  making a trip from the buying list, taking one,
                       what came back and what was paid, handing it in.
   Checking a trip in, supplier bills, paying and the price registry stay
   the owner's. Selling prices and margins are never drawn here.
   ================================================================== */
'use strict';

const OW_ENV = (function () {
  const PRODUCTION = { name: 'production', url: 'https://hgywjaifdmgrcnwxstxg.supabase.co', anon: 'sb_publishable_KsUIBYzuZRdoPsqP4T2ULw__AsCEhzV' };
  const STAGING = { name: 'staging', url: 'https://lmmyzhqdxixjnkkkgnnu.supabase.co', anon: 'sb_publishable_K7A4jZC6RSgFtyiSfV2P_w_oh8crHa5' };
  const PRODUCTION_HOSTS = ['omni-ware.vercel.app', 'omni-ware-preview.turyasingurakevin94.workers.dev'];
  if (typeof window !== 'undefined' && window.Capacitor) return PRODUCTION;
  const host = ((typeof location !== 'undefined' && location.hostname) || '').toLowerCase();
  return PRODUCTION_HOSTS.indexOf(host) === -1 ? STAGING : PRODUCTION;
})();
const sb = window.supabase.createClient(OW_ENV.url, OW_ENV.anon);
/* 0165 gave receive_payment one more argument (p_over: change or deposit,
   only when money is paid over what is owed). It is sent only when there is
   something to say, so a payment still goes through on a database that has
   not had 0165 yet; a payment over what is owed there says what to run. */
(function owPaymentArgs(){
  if (typeof sb.rpc !== 'function') return;
  const rpc = sb.rpc.bind(sb);
  sb.rpc = async (fn, args, o) => {
    if (fn === 'ow_patch_order' && args) {
      const r = await rpc(fn, args, o);
      if (!(r && r.error && (r.error.code === 'PGRST202' || /Could not find the function/i.test(String(r.error.message || ''))))) return r;
      // Before 0165: the order read fresh, only the keys asked for changed, written back.
      const got = await sb.from('saved_quotes').select('*').eq('shop_id', args.p_shop_id).eq('id', args.p_id).maybeSingle();
      if (got.error) return { data: null, error: got.error };
      if (!got.data) return { data: null, error: { message: 'This order is no longer in the books.' } };
      const payload = { ...(got.data.payload || {}), ...(args.p_patch || {}) }; (args.p_drop || []).forEach(k => { delete payload[k]; });
      const row = { payload };
      if (args.p_client_name != null) row.client_name = args.p_client_name;
      if (args.p_client_phone != null) row.client_phone = args.p_client_phone;
      if (args.p_status != null) row.status = args.p_status;
      const up = await sb.from('saved_quotes').update(row).eq('shop_id', args.p_shop_id).eq('id', args.p_id).select('*').maybeSingle();
      return up.error ? { data: null, error: up.error } : { data: up.data || { ...got.data, ...row }, error: null };
    }
    if (fn !== 'receive_payment' || !args) return rpc(fn, args, o);
    const a = { ...args }; ['p_over', 'p_ref'].forEach(k => { if (a[k] == null) delete a[k]; });
    const r = await rpc(fn, a, o);
    if (r && r.error && a.p_over && (r.error.code === 'PGRST202' || /Could not find the function/i.test(String(r.error.message || ''))))
      return { ...r, error: { ...r.error, message: 'Paying more than is owed needs one server update first: the owner runs supabase/migrations/0165_sales_money_holds_together.sql. Take only what is owed for now.' } };
    return r;
  };
})();

/* ---------------- small helpers ---------------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function n0(n){ return Math.round(Number(n) || 0).toLocaleString('en-US'); }
function signed(n){ n = Math.round(Number(n) || 0); return (n > 0 ? '+' : n < 0 ? '−' : '±') + n0(Math.abs(n)); }
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function isoOf(ts){ if (!ts) return ''; const d = new Date(typeof ts === 'string' && /^\d+$/.test(ts) ? Number(ts) : ts); if (isNaN(d)) return String(ts).slice(0, 10); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function msOf(ts){ if (ts == null || ts === '') return 0; if (typeof ts === 'number') return ts; const n = Date.parse(ts); return isNaN(n) ? (Number(ts) || 0) : n; }

async function selectAll(table, keyCol, filter){
  keyCol = keyCol || 'id';
  let rows = [], total = null;
  for (;;) {
    let q = sb.from(table).select('*', total === null ? { count: 'exact' } : undefined).eq('shop_id', S.shopId);
    if (filter) q = filter(q);
    if (rows.length) q = q.gt(keyCol, rows[rows.length - 1][keyCol]);
    const r = await q.order(keyCol, { ascending: true }).limit(1000);
    if (r.error) throw r.error;
    if (total === null) total = (typeof r.count === 'number') ? r.count : null;
    const page = r.data || [];
    rows = rows.concat(page);
    if (!page.length || (total !== null && rows.length >= total)) break;
  }
  return rows;
}

function shopScoped(base){

}

/* ---- pushes to this phone (0120: push_outbox, sent by push-send) ----

   fresh figures. Inside the installed app only. */
/* Push needs an install that carries the shop's Firebase file: the
   builds from versionCode 2 on. An older install still runs this page
   (its live update fetches it), but its native side has no Firebase,
   and asking it for a token closes the app. So the page asks the
   install first, and an old one is told to install the new app. */
async function pushInstalled(){
  try { const A = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App; const i = A && await A.getInfo(); return !!i && Number(i.build) >= 2; }
  catch (_e) { return false; }
}
function phonePush(){
  const C = window.Capacitor, P = C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.PushNotifications;
  if (!P || phonePush.on || !S.user || !S.shopId) return; phonePush.on = true;
  P.addListener('registration', async t => {
    try {
      const { data: st } = await sb.from('staff').select('id').eq('shop_id', S.shopId).eq('user_id', S.user.id).maybeSingle();
      const { error } = await sb.from('push_subscriptions').upsert({ shop_id: S.shopId, staff_id: st ? st.id : null, user_id: S.user.id, fcm_token: t.value }, { onConflict: 'fcm_token' });
      // owPushReady: this phone is signed up (the Manager's "Push to your phone" reads it).
      if (error) { window.owPushError = 'save: ' + error.message; render(); } else { window.owPushReady = true; window.owPushError = null; render(); }
    } catch (e) { window.owPushError = 'save: ' + (e && e.message || e); render(); }
  });

  P.addListener('registrationError', e => { window.owPushError = 'register: ' + ((e && e.error) || e); render(); });
  P.addListener('pushNotificationActionPerformed', a => { const d = (a && a.notification && a.notification.data) || {}; loadAll().then(() => { pushOpen(d); render(); }).catch(() => {}); });
  (async () => {
    try {
      if (!(await pushInstalled())) { window.owPushError = 'install: this phone has the older app'; render(); return; }
      let perm = await P.checkPermissions();
      if (perm.receive !== 'granted' && perm.receive !== 'denied') perm = await P.requestPermissions();
      if (perm.receive === 'granted') await P.register(); else { window.owPushError = 'permission: ' + perm.receive; render(); }
    } catch (e) { window.owPushError = 'register: ' + (e && e.message || e); render(); }
  })();
}
/* A tap on a push opens what it is about (push-send: data = { kind, ...ref },
   every value a string). Not found any more: the list it lives in. */
function pushOpen(d){
  try {
    if (!d || !S.data) return;
    const id = String(d.orderId || d.id || ''), at = (type, args) => { S.stack = [{ type, args: args || {} }]; closeSheet(); };
    if (d.kind === 'order.buying') {
      const q = quoteById(id), run = q && runsToGo().find(r => r.lines.some(l => l.order && String(l.order.id) === String(q.id)));
      if (run) at('plan', { sid: run.supplierId }); else if (q) at('order', { id: Number(q.id) }); else at('plan', {});
    } else if (d.kind === 'trip.cash.ready') {
      const h = (D().handoffs || []).find(x => String(x.id) === String(d.id));
      at('plan', h && h.payload && h.payload.supplierId ? { sid: h.payload.supplierId } : {});
    } else if (d.kind === 'restock.held' || d.kind === 'restock.released' || d.kind === 'store.restock') at('restock', { picked: null });
    // 0150: a trip sent or given to you opens it; one taken off you or cancelled opens Trips.
    else if (d.kind === 'trip.sent') { const t = tripById(id); if (t && tripIsLive(t)) at('trip', { id: t.id }); else at('trips', {}); }
    else if (d.kind === 'trip.taken' || d.kind === 'trip.cancelled') at('trips', {});
    // 0158: the Manager said no to a carton's shelf part: the order, else the plan.
    else if (d.kind === 'carton.refused') { const q = quoteById(d.orderId); if (q) at('order', { id: Number(q.id) }); else at('plan', {}); }
    else if (d.kind === 'supplier.answered') { const q = quoteById(id); if (q) at('order', { id: Number(q.id) }); else at('plan', {}); }
    // Sourcing found a supplier for a line the client waits for (0144).
    else if (d.kind === 'sourcing.found') { const q = quoteById(id), it = q && (q.items || []).find(x => x && x.clientWaits && !x.supplierId); if (q && it) at('findsup', { id: Number(q.id), lineId: it.lineId }); else if (q) at('order', { id: Number(q.id) }); else go('check'); }
  } catch (e) { console.warn(e); }
}

function pushWhy(){

  if (/^permission/.test(e)) return 'notifications are off for this app in the phone’s settings';

/* ---------------- navigation ---------------- */
function go(view){ S.view = view; S.stack = []; S.ui.slideAsk = null; closeSheet(true); toastOff(); render(); window.scrollTo(0, 0); }
function toastOff(){ clearTimeout(toastTimer); const el = document.getElementById('bx_toast'); if (el) el.classList.remove('on'); }
function push(type, args){
  args = args || {}; S.ui.slideAsk = null;
  const same = S.stack.findIndex(p => p.type === type && ['sid', 'id'].every(k => String(p.args[k] == null ? '' : p.args[k]) === String(args[k] == null ? '' : args[k])));
  if (same >= 0) { S.stack = S.stack.slice(0, same + 1); S.stack[same] = { type, args: { ...S.stack[same].args, ...args } }; render(); return; }
  S.stack.push({ type, args }); render(); const p = document.querySelector('.bx-page:last-of-type'); if (p) p.scrollTop = 0; }
function pop(){ S.stack.pop(); S.ui.slideAsk = null; render(); }
function replaceTop(type, args){ S.stack[S.stack.length - 1] = { type, args: args || {} }; S.ui.slideAsk = null; render(); }
function topArgs(){ return S.stack.length ? S.stack[S.stack.length - 1].args : {}; }
window.bxBack = function(){
  if (S.sheet) { closeSheet(); return true; }
  if (S.stack.length) { pop(); return true; }
  if (S.view !== 'today') { go('today'); return true; }
  return false;
};
function openSheet(type, args){ S.sheet = { type, args: args || {} }; renderSheet(); }
function closeSheet(silent){ S.sheet = null; if (!silent) renderSheet(); }

function navHTML(){
  const cur = v => S.view === v && !S.stack.length ? 'aria-current="page"' : '';
  // Check counts what is fixed on Check (a problem); Asking counts who is still to ask. One order is never counted twice.
  const toCheck = checkOrders().filter(o => o.no > 0).length, asking = flowNow().toAsk.length;
  return `<nav class="bx-nav" aria-label="Buyer">
    <button data-act="tab" data-v="today" ${cur('today')}>${ic('today', 24)}Today</button>
    <button data-act="tab" data-v="check" ${cur('check')}>${ic('check', 24)}${toCheck ? `<span class="bx-badge">${toCheck}</span>` : ''}Orders</button>
    <button class="bx-go" data-act="plan" aria-label="Plan a trip">${ic('truck', 30, 'class="icon a-roll"')}</button>
    <button data-act="tab" data-v="asking" ${cur('asking')}>${ic('asking', 24)}${asking ? `<span class="bx-badge amber">${asking}</span>` : ''}Replies</button>
    <button data-act="tab" data-v="suppliers" ${cur('suppliers')}>${ic('store', 24)}Suppliers</button></nav>`;
}
function render(){
  if (!S.data) return;
  const main = document.getElementById('bx_main');
  const V = { today: viewToday, check: viewCheck, asking: viewAsking, suppliers: viewSuppliers }[S.view] || viewToday;
  const keepFocus = document.activeElement && document.activeElement.id;
  main.innerHTML = `<div class="bx-view">${V()}</div>${navHTML()}`;
  const pages = document.getElementById('bx_pages');
  const prev = [...pages.children].map(el => ({ type: el.dataset.type, top: el.scrollTop }));
  pages.innerHTML = S.stack.map((p, i) => {
    const f = PAGE[p.type], same = prev[i] && prev[i].type === p.type;
    let body = '';
    try { body = f ? f(p.args) : ''; } catch (e) { console.error(e); body = `<div class="card"><div class="bx-empty"><b>This page could not be drawn</b>${esc(e.message)}<br><br><button class="bx-btn ghost" style="flex:none;margin:0 auto" data-act="back">Back</button></div></div>`; }
    return `<div class="bx-page${f && f.flat ? ' flat' : ''}${same ? ' still' : ''}" data-depth="${i}" data-type="${p.type}"${f && f.bg ? ` style="background:${f.bg}"` : ''}>${body}</div>`;
  }).join('');
  [...pages.children].forEach((el, i) => { if (prev[i] && prev[i].type === el.dataset.type) el.scrollTop = prev[i].top; });
  document.body.style.overflow = S.stack.length ? 'hidden' : '';
  pages.classList.toggle('on', S.stack.length > 0);
  if (keepFocus) { const el = document.getElementById(keepFocus); if (el && el.focus) { el.focus(); if (el.setSelectionRange && el.value != null) { const n = el.value.length; try { el.setSelectionRange(n, n); } catch (_e) {} } } }
  afterRender();
}
function renderSheet(){
  const host = document.getElementById('bx_sheet');
  if (!S.sheet) { host.innerHTML = ''; return; }
  const f = SHEET[S.sheet.type];
  host.innerHTML = `<div class="bx-scrim" data-act="closesheet"></div><div class="bx-sheet" role="dialog"><span class="bx-grip"></span>${f ? f(S.sheet.args) : ''}</div>`;
  afterRender();
}
const PAGE = {}, SHEET = {}, ACT = {}, AFTER = [];
function afterRender(){ AFTER.forEach(f => { try { f(); } catch (e) { console.warn(e); } }); bindTri(); bindSlides(); bindSwipes(); }

document.addEventListener('click', e => {
  // Beside a page on a wide screen: a tap closes the page, never the app below.
  if (e.target.id === 'bx_pages') { FEEL.back(); pop(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'tab') { if (S.view !== t.dataset.v || S.stack.length) FEEL.tick(); go(t.dataset.v); return; }
  if (a === 'back') { pop(); return; }
  if (a === 'closeall') { FEEL.back(); S.stack = []; closeSheet(); render(); return; }
  if (a === 'closesheet') { closeSheet(); return; }
  // A link that leaves the app (WhatsApp, a call) must go in the tap
  // itself; the act alongside it only records that it happened.
  if (ACT[a]) { if (!t.hasAttribute('data-keep')) e.preventDefault(); ACT[a](t, e); }
});
document.addEventListener('input', e => { const t = e.target.closest('[data-in]'); if (t && ACT['in:' + t.dataset.in]) ACT['in:' + t.dataset.in](t, e); });

/* ---------------- shared pieces ---------------- */
function greeting(){ const h = new Date().getHours(); return h < 5 ? 'Working late' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
// The name to greet by: the staff row's, else the login's profile name; a login handle is no name.
function greetName(){ const st = myStaff(), m = (S.user && S.user.user_metadata && (S.user.user_metadata.name || S.user.user_metadata.full_name)) || '';
  return [st && st.name, m].map(n => personName(n)).find(n => n && n !== 'You') || ''; }
// A ring of coloured arcs, each a share of the whole, with a label inside.
function segRing(segs, size, stroke, inner, label){
  const total = segs.reduce((s, x) => s + x.n, 0) || 1, r = (size - stroke) / 2;
  let at = 0;
  const arcs = segs.filter(x => x.n > 0).map(x => { const len = x.n / total * 100, gap = segs.filter(y => y.n > 0).length > 1 ? 1.2 : 0;
    const s = `<circle class="a-ring${x.blink ? ' a-blink' : ''}" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${x.col}" stroke-width="${stroke}" pathLength="100" stroke-dasharray="${Math.max(0.01, len - gap).toFixed(2)} ${(100 - len + gap).toFixed(2)}" stroke-dashoffset="${(-at).toFixed(2)}"/>`; at += len; return s; }).join('');
  return `<span role="img" aria-label="${esc(label || '')}" style="position:relative;width:${size}px;height:${size}px;flex:none;display:block"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="${stroke}"/>${arcs}</svg><span style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">${inner || ''}</span></span>`;
}
function pctRing(pct, size, stroke, col, inner, label, track){
  const r = (size - stroke) / 2, p = Math.max(0, Math.min(1, pct)) * 100;
  return `<span role="img" aria-label="${esc(label || '')}" style="position:relative;width:${size}px;height:${size}px;flex:none;display:block"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track || 'rgba(255,255,255,.12)'}" stroke-width="${stroke}"/><circle class="a-ring" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" pathLength="100" stroke-dasharray="${p.toFixed(1)} 100"/></svg><span style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">${inner || ''}</span></span>`;
}
// The cross closes every page opened on top of the tab; a tap above the sheet steps back one.
function closeBtn(light){ return `<button class="bx-circle${light ? ' light' : ''}" data-act="closeall" aria-label="Close">${ic('close', 16, 'style="stroke-width:2.2"')}</button>`; }
function waBtn(href, label, extraAct){ return `<a class="bx-btn red" href="${esc(href)}" target="_blank" rel="noopener"${extraAct ? ` data-act="${extraAct.act}" data-keep ${extraAct.attrs || ''}` : ''}>${ic('wa', 20)}${esc(label)}</a>`; }
function callBtn(phone, name, cls){ const u = telUrl(phone); return u ? `<a class="${cls || 'bx-sq'}" href="${u}" aria-label="Call ${esc(name)}">${ic('phone', 20)}</a>` : `<span class="${cls || 'bx-sq'}" aria-label="No number for ${esc(name)}" style="opacity:.35">${ic('phone', 20)}</span>`; }
function callSmall(phone, name){ const u = telUrl(phone); return `<a ${u ? `href="${u}"` : 'aria-disabled="true"'} aria-label="Call ${esc(name)}" style="width:36px;height:36px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;${u ? '' : 'opacity:.35'}">${ic('phone', 16)}</a>`; }
function emptyCard(title, sub){ return `<div class="bx-card"><div class="bx-empty"><b>${esc(title)}</b>${esc(sub || '')}</div></div>`; }

/* ---------------- the two-way answer slider ----------------
   Right is "they have it", left is "they don't", the middle is still
   asking. The knob clicks as it crosses into each zone and lands with
   the answer's own sound. Arrow keys move it one zone at a time. */
function triHTML(q, g){
  const a = g.a, waiting = (S.answering || {})[Number(q.id) + '|' + String(g.supplierId)];
  const pos = waiting || (a.k === 'yes' ? 'yes' : a.k === 'no' ? 'no' : 'mid');
  const name = supplierName(g.supplierId);
  return `<div class="bx-tri settle" data-tri="${q.id}|${esc(g.supplierId)}" data-pos="${pos}">
    <span class="fl" aria-hidden="true"></span><span class="fr" aria-hidden="true"></span>
    <button type="button" class="ll" data-act="tritap" data-to="no" aria-label="${esc(supplierShort(g.supplierId))} has a problem" style="opacity:${pos === 'no' ? 1 : pos === 'yes' ? .35 : .8}"><span class="chevL">‹‹</span>Problem</button>
    <button type="button" class="lr" data-act="tritap" data-to="yes" aria-label="${esc(supplierShort(g.supplierId))} confirmed" style="opacity:${pos === 'yes' ? 1 : pos === 'no' ? .35 : .8}">Confirmed<span class="chevR">››</span></button>
    <button type="button" class="k" aria-label="${esc(name)}: ${pos === 'yes' ? 'confirmed' : pos === 'no' ? 'problem' : a.k === 'new' ? 'not asked yet' : 'asking'}. Slide right to confirm, left for a problem, or use the arrow keys"></button>
  </div>`;
}
const TRI_LOOK = { yes: ['#0F6B43', '#fff', ICON.tick, 3], no: ['#8E2A22', '#fff', ICON.bang, 2.6], mid: ['#F5B26B', '#16203C', ICON.clock, 2.2] };
function paintTri(el, x, max, drag){
  const zone = x > max * 0.6 ? 'yes' : x < -max * 0.6 ? 'no' : 'mid', look = TRI_LOOK[zone];
  const k = el.querySelector('.k');
  k.style.transform = `translateX(${x.toFixed(1)}px)`; k.style.background = look[0]; k.style.color = look[1];
  if (k.dataset.zone !== zone) { k.dataset.zone = zone; k.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${look[3]}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${look[2]}</svg>`; }
  el.querySelector('.fr').style.width = Math.max(0, x).toFixed(1) + 'px';
  el.querySelector('.fl').style.width = Math.max(0, -x).toFixed(1) + 'px';
  el.classList.toggle('settle', !drag);
  return zone;
}
function bindTri(){
  document.querySelectorAll('[data-tri]').forEach(el => {
    if (el._bound) return; el._bound = true;
    const k = el.querySelector('.k');
    const max = () => (el.offsetWidth - 52) / 2;
    const posX = p => p === 'yes' ? max() : p === 'no' ? -max() : 0;
    paintTri(el, posX(el.dataset.pos), max(), false);
    let sx = 0, x0 = 0, x = 0, zone = null, drag = false;
    const commit = el._commit = to => {
      const from = el.dataset.pos; if (to === from) { paintTri(el, posX(from), max(), false); return; }
      el.dataset.pos = to; paintTri(el, posX(to), max(), false);
      (to === 'yes' ? FEEL.yes : to === 'no' ? FEEL.no : FEEL.ask)();
      const [qid, sid] = el.dataset.tri.split('|');
      ACT.answer(qid, sid, to);
    };
    k.addEventListener('pointerdown', e => { drag = true; S.dragging = true; sx = e.clientX; x0 = x = posX(el.dataset.pos); zone = paintTri(el, x, max(), true); try { k.setPointerCapture(e.pointerId); } catch (_e) {} });
    k.addEventListener('pointermove', e => { if (!drag) return; x = Math.max(-max(), Math.min(max(), x0 + (e.clientX - sx))); const z = paintTri(el, x, max(), true); if (z !== zone) { zone = z; FEEL.tick(); } });
    const end = () => { if (!drag) return; drag = false; S.dragging = false; const moved = Math.abs(x - x0) > 6; commit(moved ? zone : 'mid'); if (S.renderAfterDrag) { S.renderAfterDrag = false; render(); } };
    k.addEventListener('pointerup', end); k.addEventListener('pointercancel', end);
    k.addEventListener('keydown', e => {
      const order = ['no', 'mid', 'yes'], i = order.indexOf(el.dataset.pos);
      const to = e.key === 'ArrowRight' ? order[Math.min(2, i + 1)] : e.key === 'ArrowLeft' ? order[Math.max(0, i - 1)] : null;
      if (to) { e.preventDefault(); commit(to); }
    });
  });
}

// A tap on Confirmed or Problem does what the slide does.
ACT.tritap = t => { const el = t.closest('[data-tri]'); if (el && el._commit) el._commit(t.dataset.to); };

/* ---------------- slide to start / hand in ---------------- */
// A tap on a slide asks first: one question, Not yet or the yes.
function slideHTML(id, label, icon, opts){
  opts = opts || {};
  if (opts.ask && S.ui.slideAsk === id && !opts.disabled) return `<div role="group" aria-label="${esc(opts.ask)}" class="a-card" style="flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;box-sizing:border-box;border-radius:20px;background:var(--navy);color:#fff">
    <span style="flex:1 0 100%;min-width:0;padding:0 6px;font-size:15px;font-weight:700">${esc(opts.ask)}</span>
    <button data-act="slideno" style="flex:1;height:44px;padding:0 14px;border:none;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-weight:700">Not yet</button>
    <button data-act="slideyes" data-k="${esc(id)}" style="flex:1;height:44px;padding:0 16px;border:none;border-radius:999px;background:var(--mint);color:#0B3D27;font-size:14px;font-weight:700">${esc(opts.yes || 'Yes')}</button></div>`;
  return `<div class="bx-slide settle" data-slide="${id}" ${opts.ask ? 'data-ask="1"' : ''} ${opts.disabled ? 'aria-disabled="true"' : ''}>
    <span class="road" aria-hidden="true"></span><span class="fill" aria-hidden="true"></span>
    <span class="lab" aria-hidden="true"><b>${esc(label)}</b><i>›››</i></span><span class="flag" aria-hidden="true"></span>
    <button type="button" class="k" aria-label="${esc(label)}. Drag right, or press Enter">${ic(icon || 'truck', 24, 'style="stroke-width:2"')}</button></div>`;
}
function bindSlides(){
  document.querySelectorAll('[data-slide]').forEach(el => {
    if (el._bound) return; el._bound = true;
    const k = el.querySelector('.k'), fill = el.querySelector('.fill'), lab = el.querySelector('.lab');
    let sx = 0, x = 0, drag = false, step = 0;
    const max = () => el.offsetWidth - 56;
    const paint = () => { k.style.transform = `translateX(${x.toFixed(1)}px)`; fill.style.width = (x + 56).toFixed(1) + 'px'; lab.style.opacity = Math.max(0, 1 - x / max() * 1.6).toFixed(2); };
    const done = () => { if (el.getAttribute('aria-disabled') === 'true') return; const k = String(el.dataset.slide || ''), f = ACT['slide:' + k] || ACT['slide:' + k.split(':')[0]]; if (f) f(el); };
    k.addEventListener('pointerdown', e => { if (el.getAttribute('aria-disabled') === 'true') return; drag = true; S.dragging = true; sx = e.clientX; x = 0; step = 0; el.classList.remove('settle'); try { k.setPointerCapture(e.pointerId); } catch (_e) {} });
    k.addEventListener('pointermove', e => { if (!drag) return; x = Math.max(0, Math.min(max(), e.clientX - sx)); const s = Math.floor(x / max() * 4); if (s !== step) { step = s; if (s > 0) FEEL.tick(); } paint(); });
    const end = () => { if (!drag) return; drag = false; S.dragging = false; el.classList.add('settle'); if (x >= max() * 0.86) { x = max(); paint(); setTimeout(done, 120); } else { if (x > 8) FEEL.back(); else if (el.dataset.ask) { FEEL.tick(); S.ui.slideAsk = el.dataset.slide; render(); return; } x = 0; paint(); } };
    // A tap anywhere on the road asks the same question.
    el.addEventListener('click', e => { if (e.target.closest('.k') || !el.dataset.ask || el.getAttribute('aria-disabled') === 'true') return; FEEL.tick(); S.ui.slideAsk = el.dataset.slide; render(); });
    k.addEventListener('pointerup', end); k.addEventListener('pointercancel', end);
    k.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); x = max(); paint(); done(); } });
  });
}

ACT.slideno = () => { FEEL.back(); S.ui.slideAsk = null; render(); };
ACT.slideyes = t => { const k = String(t.dataset.k || ''), f = ACT['slide:' + k] || ACT['slide:' + k.split(':')[0]]; S.ui.slideAsk = null; if (f) f(t); };

  const tripTile = oneRound ? tile(`data-act="trip" data-id="${esc(rCur.id)}"`, `Your trip: ${rDone} of ${oneRound.length} stops done, you are at ${supplierName(rCur.supplierId)}`, `<span aria-hidden="true" style="display:flex;align-items:center;gap:3px;width:100%">${tripTop}</span>`, `${rDone} of ${oneRound.length} stops`, 'done', .12)

        <span style="font-size:13px;color:var(--navyInk);display:flex;align-items:center;gap:6px;white-space:nowrap">${esc(d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }))}<span style="width:3px;height:3px;border-radius:999px;background:#5C6788"></span><span style="display:inline-flex;align-items:center;gap:5px;color:var(--mint)"><span class="bx-dot" style="background:var(--mint)"></span>Buying desk</span></span>

      <button class="bx-circle" style="width:44px;height:44px;background:rgba(255,255,255,.08)" data-act="findall" aria-label="Find a supplier or an item">${ic('search', 20)}</button>
      <button data-act="me" aria-label="You${full.lines ? ': ' + full.pct + '% came in full this month' : ''}. Open your profile" style="position:relative;width:46px;height:46px;border:none;background:none;padding:0">${pctRing(full.lines ? full.pct / 100 : 0, 46, 3, '#6FDCB0', '')}<span style="position:absolute;inset:6px;border-radius:999px;background:var(--indigoSoft);color:var(--indigo);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">${esc(initials(myName()))}</span></button>
    </div>

/* ==================================================================
   Writing an order. Always onto the row as the server has it now, so a
   second phone's answer is never overwritten by this one's old copy:
   re-read, apply the one change through the owner's own rule, write
   back only the keys this app touches.
   ================================================================== */
const ORDER_KEYS = ['items', 'supplierConfirms', 'droppedLines', 'stageEnteredAt', 'stageLog', 'shopConfirmedAt', 'shopConfirmedTerms', 'pickingStatus'];
async function changeOrder(id, fn){
  const r = await sb.from('saved_quotes').select('*').eq('shop_id', S.shopId).eq('id', id).maybeSingle();
  if (r.error) throw r.error;
  if (!r.data) throw new Error('that order is no longer on the books');
  const row = r.data, q = rowToQuote(row), before = q.status;
  const out = fn(q);
  if (out === false) return null;
  // 0165: only these keys go to the server, merged there (ow_patch_order) —
  // a whole payload written back could drop a payment taken meanwhile.
  const was = row.payload || {}, patch = {}, drop = [];
  ORDER_KEYS.forEach(k => { if (q[k] === undefined || q[k] === null && was[k] === undefined) { if (k in was) drop.push(k); } else patch[k] = q[k]; });
  const status = q.status !== before ? q.status : null;
  // The row as the database kept it: the Checking gate (0119) may have
  // held the move and put the order back in Checking (gateHeldMove), and
  // a phone that only believed its own patch said "moved" when it had not.
  const u = await sb.rpc('ow_patch_order', { p_shop_id: S.shopId, p_id: Number(id), p_patch: patch, p_client_name: null, p_client_phone: null, p_drop: drop.length ? drop : null, p_status: status });
  if (u.error) throw u.error;
  const fresh = rowToQuote(u.data || { ...row, ...(status ? { status } : {}), payload: { ...was, ...patch } });
  const i = D().savedQuotes.findIndex(x => Number(x.id) === Number(id));
  if (i >= 0) D().savedQuotes[i] = fresh; else D().savedQuotes.push(fresh);
  saveSnapshot();
  const held = q.status !== before && fresh.status === before && fresh.gateHeldMove ? fresh.gateHeldMove : null;
  if (held && out && typeof out === 'object') out.moved = false;
  return { q: fresh, out, moved: fresh.status !== before, held };
}
/* ==================================================================
   Answers from the supplier app (0132). A supplier answers in

   done here too, on every read, through setOrderSupplierConfirm, with the
   console's own tests (index.html foldSupplierAnswers): the order is

   recorded for them, and the order is the one they saw (terms). Folding
   twice is harmless: the second finds the newer record and stops.

const APP_SAID = { confirmed: 'Said have all', short: 'Said some short', none: 'Said none' };
let appFolding = false;
const appFolded = new Set();
async function readAppAnswers(){
  if (appFolding) return;
  appFolding = true;
  try {
    const r = await sb.from('supplier_answers').select('id, order_id, supplier_id, state, terms, changes, note, at')
      .eq('shop_id', S.shopId).gte('at', new Date(Date.now() - 14 * 86400000).toISOString()).order('at');
    if (r.error || !r.data || !r.data.length) return;   // no 0132 yet, or nothing said
    const latest = new Map();
    r.data.forEach(a => latest.set(String(a.order_id) + '|' + String(a.supplier_id), a));
    let folded = 0, moved = null, heldBy = null;
    for (const a of latest.values()) {
      if (appFolded.has(a.id)) continue;
      const sid = String(a.supplier_id), at = Date.parse(a.at);
      const fits = q => q && !q.voided && q.status === 'draft'
        && orderSupplierGroups(q).some(g => String(g.supplierId) === sid)
        && !((((q.supplierConfirms || {})[sid] || {}).at || 0) >= at)
        && a.terms === orderSupplierTerms(q, sid);
      // Weighed on this phone's copy first, so a settled answer costs no read.
      if (!fits(D().savedQuotes.find(x => String(x.id) === String(a.order_id)))) { appFolded.add(a.id); continue; }
      const note = APP_SAID[a.state] ? APP_SAID[a.state] + (a.note ? `: “${a.note}”` : '') : (a.note || '');
      try {
        const res = await changeOrder(Number(a.order_id), q => !fits(q) ? false
          : setOrderSupplierConfirm(q, sid, a.state === 'confirmed' ? 'confirmed' : 'problem', note,
            { by: 'supplier', at, short: a.state === 'short' ? a.changes : null }));
        appFolded.add(a.id);

    for (const { row, t } of ready) {
      const lines = tripLines(t).map(l => { const g = tripLineGot(l); return g != null && g < l.qty && l.gotPrice != null && Number(l.gotPrice) === Number(l.expectedPrice) ? { ...l, gotPrice: null } : l; });

function myMonthFull(){
  const me = myStaff(), mStart = todayISO().slice(0, 7);
  const mine = me ? (D().collectionTrips || []).filter(t => !t.voided && String(t.assignedWorkerId) === String(me.id) && (t.status === 'collected' || t.status === 'confirmed') && isoOf(t.collectedAt).slice(0, 7) === mStart) : [];
  const lines = mine.reduce((a, t) => a.concat(tripLines(t)), []);
  const fullN = lines.filter(l => tripLineGot(l) != null && tripLineGot(l) >= l.qty).length;
  return { trips: mine, lines: lines.length, full: fullN, pct: lines.length ? Math.round(fullN / lines.length * 100) : 0 };
}

function newUuid(){

}
async function passOn(kind, forRole, ref, payload){
  const row = { id: newUuid(), shop_id: S.shopId, kind, for_role: forRole, ref: ref == null ? null : String(ref), payload: payload || {}, ...(S.user ? { created_by: S.user.id } : {}) };
  const r = await sb.from('buyer_handoffs').insert(row);
  if (r.error) throw r.error;
  (D().handoffs ||= []).push(rowToHandoff({ ...row, status: 'open', created_at: new Date().toISOString() })); saveSnapshot();
  return row;
}
function rowToRestock(r){ return { id: r.id, productId: r.product_id, variantIdx: r.variant_idx == null ? null : Number(r.variant_idx), qty: Number(r.qty) || 0, unit: r.unit || '', supplierId: r.supplier_id, price: r.price == null ? null : Number(r.price), status: r.status, tripId: r.trip_id || null, createdBy: r.created_by, createdAt: r.created_at, heldBy: r.held_by || null, heldAt: r.held_at || null, forLine: r.for_line || null }; }
function rowToHandoff(h){ return { id: h.id, kind: h.kind, forRole: h.for_role, ref: h.ref, payload: h.payload || {}, status: h.status, createdBy: h.created_by, createdAt: h.created_at, doneAt: h.done_at, cashBack: h.cash_back == null ? null : h.cash_back }; }
function handoffsFor(kind, ref){ return (D().handoffs || []).filter(h => h.kind === kind && (ref == null || String(h.ref) === String(ref)) && h.status !== 'withdrawn'); }

const STAGE = {

  problem: { word: 'Problem', ink: '#8E2A22', bg: '#FBEAE7', dot: '#C93A30', bar: '#E5483D' },
  out: { word: 'Out', ink: '#2E3388', bg: '#EEEFFC', dot: '#3A3F9B', bar: '#A9B0F5' },
  back: { word: 'Back', ink: '#0B5560', bg: '#E3F3F5', dot: '#0E6470', bar: '#6BCFD9' },

// A supplier's answer on one order, as one of the six words. A yes the

function stageOf(a){ return a.k === 'yes' ? 'confirmed' : a.k === 'no' ? 'problem' : a.k === 'asking' ? 'asked' : 'toask'; }

  const ids = openOrdersFor(sid).filter(x => stageOf(x.g.a) === 'toask').map(x => x.q.id);
  try { for (const id of ids) await changeOrder(id, q => { if (q.status !== 'draft') return false; markOrderSupplierAsked(q, sid, how); }); }
  catch (e) { toast(isNetworkError(e) ? 'No signal to mark it asked · try again with signal' : 'Not marked as asked: ' + e.message); return; }
  // A call or a visit has its answer there and then: ask for it now.
  if (how === 'call' || how === 'person') { openSheet('said', { sid, ids, how }); render(); return; }
  render(); toast((how === 'wa' ? 'Asked ' : ASK_HOW[how].replace(/^\w/, c => c.toUpperCase()) + ' · ') + supplierShort(sid) + (how === 'wa' ? ' · the clock starts now' : ''));
};
SHEET.said = (s) => {
  const sh = supplierShort(s.sid), n = (s.ids || []).length;
  const tile = (v, label, icon, bg, ink, ring) => `<button data-act="saidsay" data-v="${v}" style="height:76px;border:none;border-radius:16px;background:${bg};box-shadow:inset 0 0 0 1.5px ${ring};color:${ink};font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px">${icon}${label}</button>`;
  return `<div style="display:flex;flex-direction:column;gap:4px;padding:0 2px"><span style="font-size:18px;font-weight:700">What did ${esc(sh)} say?</span><span style="font-size:13px;color:var(--ink3)">${s.how === 'call' ? 'On the call' : 'In person'}${n > 1 ? ' · for all ' + n + ' orders' : ''} · nothing to wait for</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${tile('yes', 'Has it · same price', ic('tick', 22, 'style="stroke-width:2.8"'), 'var(--greenSoft)', 'var(--green)', 'rgba(15,107,67,.35)')}${tile('price', 'Price changed', '<span class="m" style="font-size:20px;line-height:22px">±</span>', 'var(--amberSoft)', 'var(--amberDeep)', 'rgba(149,83,12,.35)')}${tile('no', 'Doesn’t have it', ic('outc', 22, 'style="stroke-width:2.4"'), 'var(--crimsonSoft)', 'var(--crimson)', 'rgba(142,42,34,.35)')}</div>
    <button class="bx-btn ghost" data-act="closesheet">They will tell me later</button>`;
};
ACT.saidsay = async t => {
  const s = S.sheet && S.sheet.args; if (!s) return; const v = t.dataset.v, ids = s.ids || []; closeSheet();
  if (v === 'yes') { FEEL.yes(); ids.forEach(id => ACT.answer(id, s.sid, 'yes')); render(); return; }
  if (v === 'price') { const q = quoteById(ids[0]), g = q && orderSupplierGroups(q).find(x => String(x.supplierId) === String(s.sid)); FEEL.open(); if (g) push('price', { id: ids[0], sid: s.sid, lineId: g.lines[0].lineId }); return; }
  FEEL.no(); let first = null; for (const id of ids) { const res = await ACT.answer(id, s.sid, 'no'); if (res && first == null) first = id; } if (first != null) push('problem', { id: first, sid: s.sid });
};
// A phone for a supplier with none on file: on Asking and on their own page.
function phoneFieldHTML(sid, id){
  return `<label style="display:flex;flex-direction:column;gap:6px"><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#7A4A02">${ic('phone', 13)}No phone saved for ${esc(supplierShort(sid))}</span>
        <span style="display:flex;gap:8px"><input id="${esc(id)}" type="tel" inputmode="tel" placeholder="07__ ___ ___" aria-label="${esc(supplierName(sid))}'s phone" style="flex:1;min-width:0;height:48px;box-sizing:border-box;border:none;border-radius:14px;padding:0 14px;background:#fff;box-shadow:inset 0 0 0 1.5px #F5B26B,0 0 0 4px rgba(245,178,107,.15);font-family:var(--mono);font-size:16px"><button data-act="savephone" data-sid="${esc(sid)}" data-input="${esc(id)}" style="height:48px;padding:0 16px;border:none;border-radius:14px;background:var(--navy);color:#fff;font-size:13px;font-weight:700">Save</button></span></label>`;
}
ACT.savephone = async t => {
  const sid = t.dataset.sid, el = document.getElementById(t.dataset.input || 'bx_ph_' + sid), v = String(el ? el.value : '').trim();
  if (phoneDigits(v).length < 9) { toast('That number looks short — key in the whole number'); return; }
  const ph = localPhones(); ph[String(sid)] = v; try { localStorage.setItem(PHONES_KEY(), JSON.stringify(ph)); } catch (_e) {}
  FEEL.yes(); render();
  try { await passOn('sourcing_fix', 'sourcing', sid, { supplierId: sid, supplier: supplierName(sid), how: 'phone', fixes: [{ tab: 'sup', item: 'The supplier', field: 'phone', label: 'PHONE', was: '', now: v }] }); toast('Saved on this phone · ' + whoShort('sourcing') + ' adds it to the books'); }
  catch (_e) { toast('Saved on this phone · it did not reach ' + whoShort('sourcing') + ' yet'); }
};


// Supplier names that look like one supplier twice, or a client on the
// supplier list. Sourcing keeps the list (supplier.edit); the buyer flags.
function nameKey(n){ return String(n || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => (w.length > 2 || /\d/.test(w)) && !['ltd', 'limited', 'industry', 'industries', 'enterprises', 'shop', 'the', 'and', 'company', 'general'].includes(w)); }
function nearWord(a, b){ if (a === b) return true; if (Math.abs(a.length - b.length) > 1 || a.length < 4) return false; let i = 0; while (i < a.length && a[i] === b[i]) i++; const r = (x, y) => x.slice(i + 1) === y.slice(i + 1) || x.slice(i + 1) === y.slice(i) || x.slice(i) === y.slice(i + 1) || x.slice(i + 2) === y.slice(i + 2) && x[i] === y[i + 1] && x[i + 1] === y[i]; return r(a, b); }
function supplierTidy(){
  const sups = D().suppliers, out = [], seen = new Set();
  sups.forEach((a, i) => sups.slice(i + 1).forEach(b => { const ka = nameKey(a.name), kb = nameKey(b.name); if (!ka.length || !kb.length) return;
    const [sh, lo] = ka.length <= kb.length ? [ka, kb] : [kb, ka];
    if (sh.every(x => lo.some(y => nearWord(x, y)))) { out.push({ k: 'twin', a, b }); seen.add(a.id); seen.add(b.id); } }));
  // One phone number on two supplier records.
  sups.forEach((a, i) => sups.slice(i + 1).forEach(b => { if (seen.has(a.id) && seen.has(b.id)) return; const pa = contactPhones(a).map(phoneDigits).filter(d => d.length >= 9), pb = contactPhones(b).map(phoneDigits); if (pa.some(d => pb.includes(d))) { out.push({ k: 'phone', a, b }); seen.add(a.id); seen.add(b.id); } }));
  const clients = new Set(D().savedQuotes.map(q => String(quoteClientName(q)).trim().toLowerCase()).filter(n => n && n !== 'unnamed client' && n.length > 3));
  sups.forEach(a => { if (clients.has(String(a.name).trim().toLowerCase())) out.push({ k: 'client', a }); });
  return out.filter(x => !handoffsFor('sourcing_fix', x.a.id).some(h => h.payload && h.payload.tidy));
}
function tidyCardHTML(){
  const list = supplierTidy(), told = S.ui.tidyTold || [];
  if (!list.length && !told.length) return '';
  const rows = list.length ? list : told, sq = (sid, round, client) => { const tt = client ? ['#F4F2EE', '#4D566B'] : tintFor(sid); return `<span class="bx-av${round ? ' round' : ''}" style="width:26px;height:26px;border-radius:${round ? '999px' : '8px'};font-size:9px;background:${tt[0]};color:${tt[1]}">`; };
  const why = x => x.k === 'twin' ? ['names alike', 'var(--amberSoft)', 'var(--amberInk)'] : x.k === 'phone' ? ['same phone', 'var(--amberSoft)', 'var(--amberInk)'] : ['also a client', 'var(--crimsonSoft)', 'var(--crimson)'];
  const sw = whoShort('sourcing');
  return `<div role="group" aria-label="May be the same: ${rows.length} flag${rows.length === 1 ? '' : 's'}, all shown. ${esc(sw)} in Sourcing merges or removes them" style="display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px rgba(20,27,46,.06)">
    <span style="display:flex;align-items:center;gap:8px"><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--amberInk)">MAY BE THE SAME · ${rows.length}</span><span style="font-size:12px;font-weight:600;color:var(--ink3)">${esc(sw)} (Sourcing) merges or removes them</span></span>
      ${list.length ? `<button data-act="tidyall" ${S.busy ? 'aria-disabled="true"' : ''} style="flex:none;height:36px;padding:0 12px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700">Tell ${esc(sw)}</button>` : `<span style="flex:none;height:36px;padding:0 12px;border-radius:12px;background:var(--greenSoft);color:var(--green);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center">With ${esc(sw)} ✓</span>`}</span>
    ${rows.map(x => { const w = why(x); return `<span style="display:flex;align-items:center;gap:8px;min-height:40px;border-top:1px solid #F1EEE8;padding-top:8px">
      <span style="display:flex;align-items:center;flex:none">${sq(x.a.id)}${esc(initials(x.a.name))}</span><span style="width:18px;text-align:center;font-size:13px;font-weight:800;color:var(--amberInk)">≈</span>${x.b ? sq(x.b.id) + esc(initials(x.b.name)) : sq('', true, true) + esc(initials(x.a.name))}</span></span>
      <span class="ell" style="flex:1;min-width:0;font-size:12.5px;font-weight:700">${esc(x.a.name)} · ${x.b ? esc(x.b.name) : 'a client too'}</span>
      <span style="flex:none;height:22px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;background:${w[1]};color:${w[2]}">${w[0]}</span></span>`; }).join('')}
  </div>`;
}
ACT.tidyall = async () => {
  const list = supplierTidy(); if (!list.length || S.busy) return;
  S.busy = true; render();
  try {
    for (const x of list) await passOn('sourcing_fix', 'sourcing', x.a.id, { supplierId: x.a.id, supplier: x.a.name, how: 'saw', tidy: true, fixes: [x.b ? { tab: 'sup', item: 'The supplier', field: 'name', label: x.k === 'phone' ? 'SAME PHONE AS' : 'SAME AS', was: x.a.name, now: x.b.name } : { tab: 'sup', item: 'The supplier', field: 'name', label: 'A CLIENT, NOT A SUPPLIER', was: x.a.name, now: '' }] });
    S.ui.tidyTold = list; S.busy = false; FEEL.yes();
  } catch (e) { S.busy = false; toast(isNetworkError(e) ? 'No connection — not sent. Try again with signal.' : 'Not sent: ' + (e.message || e), 5000); }
  render();
};

// A price older than a month is worth asking about while they're asked.
function askPriceAge(){ return Math.min(priceStaleDays(), 30); }

// A hold reason in days: "0.2 months" reads as nothing on a phone.
function holdWords(reason){ return String(reason || '').replace(/(\d+(?:\.\d+)?)\s*months?\b/gi, (m, n) => { const v = Number(n); return v >= 2 && Number.isInteger(v) ? m : Math.max(1, Math.round(v * 30)) + ' days'; }); }
// The same item from the same supplier already wanted for orders: To ask
// or To plan. A shelf buy rides the same trip, so it is one purchase.
function sameBuyFor(pid, vi, sid){
  const out = [], k = stockKey(pid, vi == null ? null : vi);
  checkOrders().forEach(o => o.groups.forEach(g => { if (String(g.supplierId) !== String(sid)) return; g.lines.forEach(it => { if (stockKey(it.productId, it.variantIdx == null ? null : it.variantIdx) !== k) return; const c = quoteLineCount(it, it.qty); out.push({ who: shortName(quoteClientName(o.q)), n: c.n, unit: c.unit, st: g.a.k === 'yes' ? 'confirmed' : stageOf(g.a) }); }); }));
  return out;
}
// Who a stop's lines are for, the shelf last.
function runClients(run){ const out = []; (run.lines || []).forEach(l => { const n = l.order === RESTOCK_ORDER ? 'the shelf' : shortName(quoteClientName(l.order)); if (!out.includes(n)) out.push(n); }); return out.sort((a, b) => (a === 'the shelf') - (b === 'the shelf')); }
function restockKind(r){
  if (r.hold) return 'held';
  if (!Object.prototype.hasOwnProperty.call(D().stock || {}, r.key) && r.rate > 0) return 'nocount';
  if (r.rate * 7 < 1 && !r.below) return 'slow';
  if (r.need <= 0) return 'coming';
  if (!r.best) return 'noprice';
  return 'buy';
}

// Answers kept on the phone go out as soon as there is signal again.
window.addEventListener('online', () => { Object.keys(S.tripDraft || {}).forEach(id => flushTrip(id).then(() => render()).catch(() => {})); });

boot();
</script>
