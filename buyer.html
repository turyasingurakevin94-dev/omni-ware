<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16203C">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>Omni-Ware Buyer</title>
<!-- The phone app's native layer (apps/buyer). Inert in a browser. It
     lives here rather than in the app's own files so a fix to it reaches
     installed phones the same way any change to this page does. -->
<script>
/* The buyer page inside the Android app (apps/buyer).

   First in <head>, and only does anything inside the app. Four jobs:

   1. Back (Android) closes what is on top -- a photo, a sheet, then the tab
      -- before it ever leaves the app, and leaving only puts it in the
      background so it reopens instantly.
   2. The status bar: the page draws to the top edge, so a strip behind the
      clock takes the colour of whatever is under it, and its icons stay
      readable against it.
   3. The bars' size: Capacitor measures them into --safe-area-inset-*,
      but a page it has not measured (some phones, after a reload) would
      read zero and slide under the clock -- so the last good measurement
      stands in until it does.
   4. Staying current without a store release: the installed app checks the
      live buyer.html now and then, keeps a copy of a new one on the phone,
      and switches to it the next time the app goes to the background --
      never in the middle of a trip. */
(function(){
  'use strict';
  var C = window.Capacitor;
  if(!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return;
  var P = C.Plugins || {};
  var App = P.App, Bars = P.SystemBars, WebView = P.WebView, Http = P.CapacitorHttp, FS = P.Filesystem;
  var NAVY = '#16203C';
  var root = document.documentElement;
  // The first installs carried this layer as their own native.js. On those
  // it is already running from above, and only the bars' size (3) is new.
  var legacy = !!document.querySelector('script[src="native.js"]');

  window.owHaptic = function(kind){
    var H = P.Haptics;
    if(!H) return;
    (kind === 'success' ? H.notification({ type: 'SUCCESS' }) : kind === 'warn' ? H.notification({ type: 'WARNING' }) : H.impact({ style: 'LIGHT' })).catch(function(){});
  };

  /* ---- 1. back ---- */
  // The page keeps its own stack of what is open (window.bxBack): a sheet,
  // then a screen pushed over a tab, then the tab itself back to Today.
  function back(){
    if(typeof window.bxBack === 'function' && window.bxBack()) return;
    if(App) App.minimizeApp();
  }
  if(App && !legacy) App.addListener('backButton', back);

  /* ---- 2. the strip behind the status bar ---- */
  var strip = null, lastStyle = '';
  function paintBar(){
    if(!strip) return;
    var top = strip.offsetHeight;
    // Today's navy hero is marked data-navy-top. A pushed page opens on its
    // own dark ground -- the tap-to-go-back strip -- unless it is a page
    // whose navy hero has scrolled away under the clock.
    var page = document.querySelector('#bx_pages .bx-page:last-child');
    var navy = (page || document).querySelector('[data-navy-top]:not([hidden])');
    var navyAtTop = !!navy && navy.getBoundingClientRect().top <= top && navy.getBoundingClientRect().bottom > top;
    var ground = page ? getComputedStyle(page).backgroundColor : '';
    var rgb = (ground.match(/\d+/g) || []).map(Number);
    var darkGround = !navyAtTop && !navy && rgb.length >= 3 && (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000 < 90;
    var auth = !!document.querySelector('.bx-auth');
    strip.style.background = auth || navyAtTop ? NAVY : darkGround ? ground : 'var(--bg)';
    var style = auth || navyAtTop || darkGround || document.querySelector('.bx-scrim') ? 'DARK' : 'LIGHT';
    if(style !== lastStyle && Bars){ lastStyle = style; Bars.setStyle({ style: style }).catch(function(){}); }
  }
  var queued = false;
  function soon(){ if(queued) return; queued = true; requestAnimationFrame(function(){ queued = false; paintBar(); }); }
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(insets, 800);
    setTimeout(insets, 2500);
    window.addEventListener('resize', function(){ setTimeout(insets, 300); });
    if(App) App.addListener('resume', function(){ setTimeout(insets, 300); });
    if(legacy) return;
    strip = document.createElement('div');
    strip.setAttribute('aria-hidden', 'true');
    strip.style.cssText = 'position:fixed;top:0;left:0;right:0;height:var(--safe-t, 0px);z-index:59;pointer-events:none;background:' + NAVY + ';';
    document.body.appendChild(strip);
    new MutationObserver(soon).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class'] });
    document.addEventListener('scroll', soon, { passive: true, capture: true });
    paintBar();
  });


  /* ---- 3. the bars' size ---- */
  var INSETS = 'ow-app-insets';
  function insets(){
    if(typeof C.getPlatform === 'function' && C.getPlatform() !== 'android') return;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:var(--safe-t, 0px);padding-bottom:var(--safe-b, 0px);';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe), top = parseFloat(cs.paddingTop) || 0, bottom = parseFloat(cs.paddingBottom) || 0;
    probe.remove();
    var measured = root.style.getPropertyValue('--safe-area-inset-top') !== '';
    var last = {};
    try{ last = JSON.parse(localStorage.getItem(INSETS)) || {}; }catch(_e){}
    if(measured && top > 0){
      if(last.top !== top || last.bottom !== bottom){ try{ localStorage.setItem(INSETS, JSON.stringify({ top: top, bottom: bottom, ours: false })); }catch(_e){} }
      return;
    }
    // Measured at zero: Android has laid the page out below its bars itself.
    if(measured || top > 0) return;
    // Not measured, and the page fills the whole screen -- it is under the
    // bars with nothing telling it how tall they are.
    if(!last.top && Math.abs(screen.height - window.innerHeight) > 16) return;
    root.style.setProperty('--safe-area-inset-top', (last.top || 32) + 'px');
    root.style.setProperty('--safe-area-inset-bottom', (last.bottom || 32) + 'px');
  }

  /* ---- 4. staying current ---- */
  if(legacy || !(WebView && Http && FS && App && window.crypto && crypto.subtle)) return;
  var SOURCE = 'https://omni-ware.vercel.app/buyer.html';
  var KEY = 'ow-buyer-bundle';
  var EVERY = 30 * 60 * 1000;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(_e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_e){} }
  function header(h, name){
    var k = Object.keys(h || {}).filter(function(x){ return x.toLowerCase() === name; })[0];
    return k ? h[k] : '';
  }
  function sha256(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  // A file of the bundle running now, as base64 for the Filesystem plugin.
  function fileB64(name){
    return fetch(name, { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error(name + ': ' + r.status);
      return r.blob();
    }).then(function(blob){
      return new Promise(function(ok, fail){
        var fr = new FileReader();
        fr.onload = function(){ ok(String(fr.result).split(',')[1] || ''); };
        fr.onerror = fail;
        fr.readAsDataURL(blob);
      });
    });
  }
  function current(){ return fetch('bundle.json', { cache: 'no-store' }).then(function(r){ return r.json(); }); }

  // After a switch: make the new copy the one the app opens with, and drop
  // the copies nothing points at any more.
  function settle(){
    var s = load();
    if(!s.staged) return Promise.resolve();
    return WebView.getServerBasePath().then(function(cur){
      if(!cur || cur.path !== s.staged.path) return;
      return WebView.persistServerBasePath().then(function(){
        var keep = s.staged.dir;
        s.etag = s.staged.etag;
        delete s.staged;
        save(s);
        return FS.readdir({ path: 'live', directory: 'DATA' }).then(function(r){
          return Promise.all((r.files || []).map(function(f){
            var n = typeof f === 'string' ? f : f.name;
            return n === keep.split('/').pop() ? null : FS.rmdir({ path: 'live/' + n, directory: 'DATA', recursive: true }).catch(function(){});
          }));
        }).catch(function(){});
      });
    });
  }

  function check(){
    var s = load();
    if(s.staged || Date.now() - (s.checked || 0) < EVERY) return Promise.resolve();
    s.checked = Date.now();
    save(s);
    return Promise.all([current(), Http.request({ url: SOURCE, method: 'GET', responseType: 'text',
      headers: s.etag ? { 'If-None-Match': s.etag } : {} })]).then(function(pair){
      var mine = pair[0], res = pair[1];
      if(res.status !== 200) return;
      var html = typeof res.data === 'string' ? res.data : '';
      // Half a page is worse than an old page.
      if(html.length < 100000 || html.indexOf('</html>') === -1) return;
      var etag = header(res.headers, 'etag');
      return sha256(html).then(function(hash){
        if(hash === mine.source){ s.etag = etag; save(s); return; }
        var dir = 'live/' + hash.slice(0, 16);
        var rest = (mine.files || []).filter(function(f){ return f !== 'index.html' && f !== 'bundle.json'; });
        return FS.writeFile({ path: dir + '/index.html', data: window.owAppTransform(html), directory: 'DATA', encoding: 'utf8', recursive: true })
          .then(function(){
            return rest.reduce(function(p, f){
              return p.then(function(){ return fileB64(f); })
                .then(function(b64){ return FS.writeFile({ path: dir + '/' + f, data: b64, directory: 'DATA', recursive: true }); });
            }, Promise.resolve());
          })
          .then(function(){
            return FS.writeFile({ path: dir + '/bundle.json', data: JSON.stringify({ source: hash, files: mine.files }), directory: 'DATA', encoding: 'utf8', recursive: true });
          })
          .then(function(){ return FS.getUri({ path: dir, directory: 'DATA' }); })
          .then(function(u){
            var s2 = load();
            s2.staged = { dir: dir, path: decodeURI(String(u.uri).replace(/^file:\/\//, '')), etag: etag };
            save(s2);
          });
      });
    }).catch(function(){
      // No signal, or the server is down: the copy already here carries on.
    });
  }

  App.addListener('pause', function(){
    var s = load();
    if(s.staged) WebView.setServerBasePath({ path: s.staged.path }).catch(function(){});
  });
  App.addListener('resume', function(){ check(); });
  settle().catch(function(){}).then(function(){ setTimeout(check, 5000); });
})();
</script>
<link rel="manifest" href="/manifest-buyer.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F5F3EF; --paper:#FFFFFF; --navy:#16203C; --navy2:#243052; --ink:#1C2233; --ink2:#5F6980; --ink3:#767F91; --ink4:#8A93A3;
  --line:#ECE8E1; --rule:#E6E3DD; --soft:#F4F2EE; --soft2:#EFECE6; --dash:#E2DED6;
  --red:#C93A30; --mint:#6FDCB0; --amber:#F5B26B; --amberInk:#95530C; --amberSoft:#FDEEE1; --amberDeep:#7A4A02;
  --green:#0F6B43; --greenSoft:#E4F4EA; --crimson:#8E2A22; --crimsonSoft:#FBE5E2; --rose:#F59A92;
  --indigo:#3A3F9B; --indigoSoft:#E4E6FA; --lilac:#9BA3F0;
  --navyInk:#B3BCD2; --navyInk2:#8D99B5;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --safe-area-inset-top:env(safe-area-inset-top,0px); --safe-area-inset-bottom:env(safe-area-inset-bottom,0px);
  /* The native layer's names for the same two bars (its strip and its probe). */
  --safe-t:var(--safe-area-inset-top); --safe-b:var(--safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
html.big #bx_app,html.big .bx-page,html.big .bx-sheet{zoom:1.12}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font-family:inherit;color:var(--ink)}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- shell ---- */
#bx_app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(100px + var(--safe-area-inset-bottom))}
.bx-view{animation:bxFade .25s ease-out}
@keyframes bxFade{from{opacity:.4}to{opacity:1}}
.bx-nav{position:fixed;left:14px;right:14px;bottom:calc(14px + var(--safe-area-inset-bottom));z-index:40;height:66px;border-radius:24px;background:#121A33;box-shadow:0 16px 34px -10px rgba(18,26,51,.55),inset 0 1px 0 rgba(255,255,255,.06);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;max-width:492px;margin:0 auto}
.bx-nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8D99B5;font-size:10.5px;font-weight:600;padding:0;position:relative}
.bx-nav button[aria-current="page"]{color:#fff;font-weight:700}
.bx-nav button[aria-current="page"]:after{content:"";position:absolute;bottom:-7px;width:4px;height:4px;border-radius:999px;background:#6FDCB0}
.bx-nav button[aria-current="page"] .icon{fill:rgba(255,255,255,.16)}
.bx-nav button[aria-current="page"] .icon .hole{stroke:#121A33;fill:none}
.bx-nav .bx-go{justify-self:center;margin-top:-30px;width:58px;height:58px;border-radius:20px;background:linear-gradient(180deg,#E0524A,#C13529);color:#fff;box-shadow:0 0 0 5px var(--bg),0 14px 26px -8px rgba(193,53,41,.7),inset 0 1px 0 rgba(255,255,255,.22);justify-content:center}
.bx-nav .bx-go .icon{width:27px;height:27px;stroke-width:2;fill:none!important}
.bx-badge{position:absolute;top:-6px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#E0524A;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #121A33}
.bx-badge.amber{background:var(--amber);color:var(--navy)}

/* ---- navy hero ---- */
.bx-hero{background:radial-gradient(130% 100% at 0% 0%,#2B3A78 0%,#16203C 55%,#10172D 100%);color:#fff;border-radius:0 0 32px 32px;padding:calc(20px + var(--safe-area-inset-top)) 20px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 18px 40px -18px rgba(16,23,45,.6)}
.bx-sheethead{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;padding:calc(10px + var(--safe-area-inset-top)) 18px 16px;display:flex;flex-direction:column;gap:12px}
.bx-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navyInk2)}
.bx-glass{border-radius:18px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bx-circle{width:40px;height:40px;border-radius:999px;border:none;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.bx-circle.light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.bx-body{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.bx-grip{align-self:center;width:40px;height:5px;border-radius:999px;background:rgba(255,255,255,.22);flex:none}

/* ---- cards / rows ---- */
.bx-card{background:#fff;border-radius:22px;box-shadow:0 0 0 1px rgba(20,27,46,.05),0 10px 28px -14px rgba(20,27,46,.16)}
/* one flow, one word: the premium pieces */
.bx-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;flex:none}
.bx-unit{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:7px;background:#F5F3EF;color:#6B7488;vertical-align:1px}
.bx-glass5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-radius:20px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);overflow:hidden}
.bx-glassbtn{width:44px;height:44px;border-radius:15px;border:none;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.bx-jobcard{display:flex;align-items:center;gap:12px;width:100%;border:none;text-align:left;color:var(--ink);background:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 0 0 1px rgba(20,27,46,.05),0 10px 28px -14px rgba(20,27,46,.16);overflow:hidden}
.bx-jobrow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;border:none;background:none;text-align:left;color:var(--ink);padding:10px 16px}
.bx-jobrow + .bx-jobrow{box-shadow:inset 0 1px 0 #F0EDE7}
.bx-cta{flex:1 0 auto;height:52px;border:none;border-radius:16px;background:linear-gradient(180deg,#D8463B,#C13529);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;box-shadow:0 12px 24px -10px rgba(193,53,41,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.bx-cta.green{background:linear-gradient(180deg,#16804F,#0F6B43);box-shadow:0 12px 24px -10px rgba(15,107,67,.7),inset 0 1px 0 rgba(255,255,255,.16)}
.bx-cta.navy{background:linear-gradient(180deg,#24305A,#16203C);box-shadow:0 12px 24px -12px rgba(22,32,60,.7),inset 0 1px 0 rgba(255,255,255,.1)}
.bx-cta[aria-disabled="true"]{opacity:.45}
.bx-sqbtn{width:50px;height:50px;border:none;border-radius:16px;background:#F5F3EF;box-shadow:inset 0 0 0 1px #E6E2DA;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.bx-hatch{height:52px;border-radius:18px;background:repeating-linear-gradient(135deg,#F7F5F1 0 6px,#F1EEE8 6px 12px);box-shadow:inset 0 0 0 1px #E6E2DA;color:#6B7488;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.bx-ans{height:50px;border:none;border-radius:16px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.bx-ans.no{background:#FBEAE7;color:#8E2A22;box-shadow:inset 0 0 0 1px rgba(142,42,34,.15)}
.bx-ans.yes{background:linear-gradient(180deg,#16804F,#0F6B43);color:#fff;box-shadow:0 10px 20px -10px rgba(15,107,67,.7),inset 0 1px 0 rgba(255,255,255,.16)}
.bx-list{padding:0 12px}
.bx-row{display:flex;align-items:center;gap:10px;min-height:60px;border:none;background:none;width:100%;text-align:left;padding:8px 0;color:var(--ink)}
.bx-row + .bx-row{border-top:1px solid #F1EEE8}
.bx-av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.bx-av.round{border-radius:999px}
.bx-t{font-size:14px;font-weight:700}
.bx-sub{font-size:12px;color:var(--ink3)}
.bx-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.bx-sec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.bx-sec b{font-size:15px;font-weight:700}
.bx-sec span{font-size:12px;font-weight:600;color:var(--ink3)}
.bx-empty{padding:28px 16px;text-align:center;color:var(--ink3);font-size:14px}
.bx-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.bx-dot{width:7px;height:7px;border-radius:999px;display:inline-block;flex:none}

/* ---- buttons ---- */
.bx-btn{height:56px;border-radius:18px;border:none;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;flex:1}
.bx-btn.red{background:var(--red);color:#fff;box-shadow:0 10px 22px rgba(201,58,48,.3)}
.bx-btn.navy{background:var(--navy);color:#fff}
.bx-btn.ghost{background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.bx-btn.green{background:var(--green);color:#fff;box-shadow:0 10px 22px rgba(15,107,67,.3)}
.bx-btn.glass{background:rgba(255,255,255,.08);color:#fff}
.bx-btn[disabled],.bx-btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.bx-sq{width:56px;height:56px;flex:none;border-radius:18px;border:none;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;font-weight:700}
.bx-foot{margin-top:auto;position:sticky;bottom:0;z-index:5;padding:14px 16px calc(18px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:inherit}
.bx-foot:before{content:'';position:absolute;left:0;right:0;top:-20px;height:20px;background:linear-gradient(180deg,rgba(247,245,242,0),var(--bg));pointer-events:none}
.bx-dock{position:sticky;bottom:0;z-index:5}
/* the fade above a pinned footer must never sit on the last thing above it */
.bx-page :has(+ .bx-foot){margin-bottom:20px}
.bx-foot .row{display:flex;gap:8px}
.bx-hint{display:flex;align-items:center;gap:6px;padding-left:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.bx-seg{position:relative;display:grid;padding:4px;border-radius:20px;background:#EAE6DF;box-shadow:inset 0 1px 2px rgba(22,32,60,.08)}
.bx-seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(22,32,60,.08),0 6px 14px rgba(22,32,60,.12),inset 0 0 0 1.5px var(--navy);transition:transform .35s cubic-bezier(.3,1.25,.5,1)}

/* ==================================================================
   Omni-Ware Buyer — the buying desk on a phone.

   The person who checks orders with suppliers, plans the collection

function n0(n){ return Math.round(Number(n) || 0).toLocaleString('en-US'); }

async function selectAll(table, keyCol, filter){
  keyCol = keyCol || 'id';
  let rows = [], total = null;
  for (;;) {
    let q = sb.from(table).select('*', total === null ? { count: 'exact' } : undefined).eq('shop_id', S.shopId);
    if (filter) q = filter(q);
    if (rows.length) q = q.gt(keyCol, rows[rows.length - 1][keyCol]);
    const r = await q.order(keyCol, { ascending: true }).limit(1000);
    if (r.error) throw r.error;
    if (total === null) total = (typeof r.count === 'number') ? r.count : null;
    const page = r.data || [];
    rows = rows.concat(page);
    if (!page.length || (total !== null && rows.length >= total)) break;
  }
  return rows;
}

   over the copy on the phone, instead of the whole order history on every
   tick (the audit measured 2 MB a tick on a shop of 1,500 orders). The
   whole history is read once, at boot and when the app comes back after
   half a minute away. */
function liveQuoteFilter(q){ return q.or('status.neq.completed,invoiced.eq.false,voided.eq.true,invoiced_ts.gte.' + new Date(Date.now() - 2 * 864e5).toISOString()); }
function mergeQuotes(rows){
  const list = D().savedQuotes || [], at = new Map(list.map((q, i) => [Number(q.id), i]));
  rows.forEach(r => { const q = rowToQuote(r), i = at.get(Number(q.id)); if (i == null) list.push(q); else list[i] = q; });
  D().savedQuotes = list;
}
// Only the newest read lands: one that left before a write on this phone
// (a hand-in) must not put the trip back the way it was.
async function refreshLive(){
  const seq = refreshLive.seq = (refreshLive.seq || 0) + 1;
  try {
    const [quotes, trips, handoffs, restock] = await Promise.all([selectAll('saved_quotes', 'id', liveQuoteFilter), selectAll('collection_trips').catch(() => null), selectAll('buyer_handoffs').catch(() => null), selectAll('restock_buys').catch(() => null)]);
    if (seq !== refreshLive.seq) return;
    mergeQuotes(quotes);
    if (trips) S.data.collectionTrips = trips.map(rowToTrip);
    if (handoffs) S.data.handoffs = handoffs.map(rowToHandoff);
    if (restock) S.data.restockBuys = restock.map(rowToRestock);
    S.loadedAt = Date.now(); saveSnapshot(); if (!S.dragging) render();
    readAppAnswers();
  } catch (e) { if (!isNetworkError(e)) console.warn(e); }
}
function snapKey(){ return 'ow-buyer-snap:' + (S.user && S.user.id); }
function saveSnapshot(){ try { localStorage.setItem(snapKey(), JSON.stringify({ shopId: S.shopId, shopName: S.shopName, role: S.role, at: S.loadedAt, data: S.data })); } catch (_e) {} }
function loadSnapshot(userId){ try { const s = JSON.parse(localStorage.getItem('ow-buyer-snap:' + userId)); return s && s.data ? s : null; } catch (_e) { return null; } }

// 59761 / 59808 / 59818 / 59828 / 59839: a quantity in the unit it was chosen in.
function quoteLinePack(it){

  if (qtyIn === 'pack') {
    if (!(qty > 0)) return null;
    const packs = Math.round(qty / packQty * 1e6) / 1e6;
    return { packs, loose: 0, packQty, packUnit, unit, whole: true, chosen: true, text: `${n(packs)} ${packUnit}`, short: `${n(packs)} ${packUnit}` };
  }
  if (!(qty >= packQty)) return null;
  const packs = Math.floor(qty / packQty), loose = Math.round((qty - packs * packQty) * 1e6) / 1e6;

    text: [`${n(packs)} ${packUnit}`, loose ? `${n(loose)} ${unit}` : null].filter(Boolean).join(' + '),

}

/* ---- what our shelf can spare (index.html ofShelfFor / ofShelfSpoken) ----

   guess here would promise goods that are not there. */
// What is on the shelf to sell (rule A, the same in Sales, Store and the
// Buyer): the books' count less what the invoices of live orders will take.
// An order past Checking, not invoiced, voided or cancelled, takes every
// line that comes off the shelf when it is invoiced -- off our stock, or
// bought in and received (ow_line_received) -- in the shelf's own unit

  if (packed && said === cmpUnitKey(packed.packUnit)) return Number(l.packQty) > 0 && cmpUnitKey(l.packUnit) === said ? Number(l.packQty) : Number(packed.packQty);

/* ==================================================================
   Writing an order. Always onto the row as the server has it now, so a
   second phone's answer is never overwritten by this one's old copy:
   re-read, apply the one change through the owner's own rule, write
   back only the keys this app touches.
   ================================================================== */
const ORDER_KEYS = ['items', 'supplierConfirms', 'droppedLines', 'stageEnteredAt', 'stageLog', 'shopConfirmedAt', 'shopConfirmedTerms', 'pickingStatus'];
async function changeOrder(id, fn){
  const r = await sb.from('saved_quotes').select('*').eq('shop_id', S.shopId).eq('id', id).maybeSingle();
  if (r.error) throw r.error;
  if (!r.data) throw new Error('that order is no longer on the books');
  const row = r.data, q = rowToQuote(row), before = q.status;
  const out = fn(q);
  if (out === false) return null;
  const payload = { ...(row.payload || {}) };
  ORDER_KEYS.forEach(k => { if (q[k] === undefined || q[k] === null && payload[k] === undefined) delete payload[k]; else payload[k] = q[k]; });
  const patch = { payload };
  if (q.status !== before) patch.status = q.status;
  // The row as the database kept it: the Checking gate (0119) may have
  // held the move and put the order back in Checking (gateHeldMove), and
  // a phone that only believed its own patch said "moved" when it had not.
  const u = await sb.from('saved_quotes').update(patch).eq('shop_id', S.shopId).eq('id', id).select('*').maybeSingle();
  if (u.error) throw u.error;
  const fresh = rowToQuote(u.data || { ...row, ...patch });
  const i = D().savedQuotes.findIndex(x => Number(x.id) === Number(id));
  if (i >= 0) D().savedQuotes[i] = fresh; else D().savedQuotes.push(fresh);
  saveSnapshot();
  const held = q.status !== before && fresh.status === before && fresh.gateHeldMove ? fresh.gateHeldMove : null;
  if (held && out && typeof out === 'object') out.moved = false;
  return { q: fresh, out, moved: fresh.status !== before, held };
}
/* ==================================================================

   console's own tests (index.html foldSupplierAnswers): the order is
   still in Checking, the supplier still has lines on it, nothing newer was
   recorded for them, and the order is the one they saw (terms). Folding
   twice is harmless: the second finds the newer record and stops.

const APP_SAID = { confirmed: 'Said have all', short: 'Said some short', none: 'Said none' };
let appFolding = false;
const appFolded = new Set();
async function readAppAnswers(){
  if (appFolding) return;
  appFolding = true;
  try {
    const r = await sb.from('supplier_answers').select('id, order_id, supplier_id, state, terms, changes, note, at')
      .eq('shop_id', S.shopId).gte('at', new Date(Date.now() - 14 * 86400000).toISOString()).order('at');
    if (r.error || !r.data || !r.data.length) return;   // no 0132 yet, or nothing said
    const latest = new Map();
    r.data.forEach(a => latest.set(String(a.order_id) + '|' + String(a.supplier_id), a));
    let folded = 0, moved = null, heldBy = null;
    for (const a of latest.values()) {
      if (appFolded.has(a.id)) continue;
      const sid = String(a.supplier_id), at = Date.parse(a.at);
      const fits = q => q && !q.voided && q.status === 'draft'
        && orderSupplierGroups(q).some(g => String(g.supplierId) === sid)
        && !((((q.supplierConfirms || {})[sid] || {}).at || 0) >= at)
        && a.terms === orderSupplierTerms(q, sid);
      // Weighed on this phone's copy first, so a settled answer costs no read.
      if (!fits(D().savedQuotes.find(x => String(x.id) === String(a.order_id)))) { appFolded.add(a.id); continue; }
      const note = APP_SAID[a.state] ? APP_SAID[a.state] + (a.note ? `: “${a.note}”` : '') : (a.note || '');
      try {
        const res = await changeOrder(Number(a.order_id), q => !fits(q) ? false

            { by: 'supplier', at, short: a.state === 'short' ? a.changes : null }));
        appFolded.add(a.id);

function bindSwipes(){

    let sx = 0, dx = 0, cap = false, down = false, z = 0;
    el.addEventListener('pointerdown', e => { const b = e.target.closest('button'); if (b && b.dataset.act !== 'tprice') return; down = true; cap = false; sx = e.clientX; dx = 0; z = 0; });

      if (!cap && Math.abs(dx) > 8) { cap = true; S.dragging = true; try { el.setPointerCapture(e.pointerId); } catch (_e) {} el.style.transition = 'none'; }
      if (!cap) return;
      const w = el.offsetWidth; dx = Math.max(-w * .45, Math.min(w * .45, dx));
      el.style.transform = `translateX(${dx.toFixed(1)}px)`;
      under.style.background = dx > 0 ? 'linear-gradient(90deg,#BFE8D2,#E4F4EA)' : dx < 0 ? 'linear-gradient(270deg,#F7D3AE,#FDEEE1)' : 'transparent';
      const nz = dx > w * .3 ? 1 : dx < -w * .3 ? -1 : 0; if (nz !== z) { z = nz; if (z) FEEL.tick(); }
    });
    const end = () => {
      if (!down) return; down = false; if (!cap) return; S.dragging = false;
      // A swipe that started on the name must not also open the price sheet.
      const eat = ev => { ev.stopPropagation(); ev.preventDefault(); }; el.addEventListener('click', eat, { capture: true, once: true }); setTimeout(() => el.removeEventListener('click', eat, { capture: true }), 400);
      el.style.transition = 'transform .3s cubic-bezier(.3,1.3,.5,1)'; el.style.transform = '';
      const [, i] = el.dataset.swipe.split('|'), fake = { dataset: { i } };
      if (z > 0) ACT.tall(fake); else if (z < 0) ACT.tshort(fake); else under.style.background = 'transparent';
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  });
}

/* ==================================================================
   WHO DECIDES WHAT (docs/decision-rights.md). Nothing day-to-day waits
   for the owner: each hand-off names the role that takes it, and the
   person in that role when the staff list says who it is.
   ================================================================== */
const ROLE_WORD = { manager: 'Manager', accounts: 'Accounts', sourcing: 'Sourcing', store: 'Store', sales: 'Sales' };
function personFor(role){ const s = (D().staff || []).find(x => !x.unavailable && String(x.role || '').toLowerCase().includes(role)); return s ? firstWord(s.name) : ''; }
function whoShort(role){ return personFor(role) || ('the ' + ROLE_WORD[role]); }
function whoRole(role){ const n = personFor(role); return n ? n + ' · ' + ROLE_WORD[role] : ROLE_WORD[role]; }
function whoIni(role){ const s = (D().staff || []).find(x => !x.unavailable && String(x.role || '').toLowerCase().includes(role)); return s ? initials(s.name) : ROLE_WORD[role].slice(0, 2).toUpperCase(); }
function sellerOf(q){ const s = q && q.takenBy ? (D().staff || []).find(x => x.userId && String(x.userId) === String(q.takenBy)) : null; return s ? firstWord(s.name) : 'Sales'; }

/* ---- what waits for the Manager on an order (decision-rights §3) ----
   A price Sales set under the shop's price (or with no margin rule, or no
   cost) is marked on its line (priceNote, sales.html priceNoteFor) and
   waits until the Manager's priceReview is on it. A credit hold is the
   Manager's payload.creditCheck. An agent's change or cancel is the
   Manager's too. The buyer sees that they wait, never the margins. */
const PRICE_WAIT_NOTES = ['under', 'nomargin', 'nocost'];
function priceWaits(q){
  return (q.items || []).filter(it => it && PRICE_WAIT_NOTES.includes(it.priceNote) && !(it.priceReview && it.priceReview.state));
}
// Mirrors ow_gate_reason (0136): a plain hold, or "cash first" while the
// order is still unpaid. The goods total is only summed here, never drawn.
function creditHolds(q){ const d = q && q.creditCheck && q.creditCheck.decision; return d === 'hold' || (d === 'cash' && (q.items || []).reduce((t, it) => t + (Number(it.qty) || 0) * (Number(it.sellPrice) || 0), 0) - (Number(q.amountPaid) || 0) > 0); }
function managerWaits(q){ return priceWaits(q).length + (creditHolds(q) ? 1 : 0) + (agentOrderOnHold(q) ? 1 : 0); }
// A line nobody sells must be decided: found, dropped off the bill, or the
// client agrees to wait for it (billed only when it comes).
function noneOpen(q){ return (q.items || []).filter(it => it && !it.supplierId && !it.clientWaits); }

/* ---- why this supplier: a tie on price goes to the best score ----
   Price first. Inside the tie band (2% unless the owner set another,
   presets.supplierTieBand) the highest score wins. The score is the
   supplier's own record in this shop, and the buyer's own picks for the
   item, so a pick made today counts tomorrow. The weights are the
   owner's policy numbers (presets.supplierScore). */
const SCORE_PARTS = [['filled', 'Orders they fill', 30, '#0E6470'], ['reply', 'How fast they reply', 20, '#5FC4CF'], ['fresh', 'Prices up to date', 20, '#9BA3F0'], ['full', 'Came in full on trips', 15, '#6FDCB0'], ['owed', 'Nothing overdue', 15, '#3A3F9B']];
function scoreWeights(){ const w = (D().presetSupplierScore && typeof D().presetSupplierScore === 'object') ? D().presetSupplierScore : {}; return SCORE_PARTS.map(p => [p[0], p[1], Number(w[p[0]]) >= 0 && w[p[0]] !== undefined && w[p[0]] !== '' ? Number(w[p[0]]) : p[2], p[3]]); }
function tieBand(){ const b = Number(D().presetSupplierTieBand); return b >= 0 && D().presetSupplierTieBand != null ? b : 2; }
const _scoreMemo = new Map();
function supplierRecord(sid){
  const k = String(sid) + '|' + S.loadedAt;
  if (_scoreMemo.has(k)) return _scoreMemo.get(k);
  let yes = 0, no = 0; const waits = [];
  liveOrders().forEach(q => { const r = (q.supplierConfirms || {})[String(sid)]; if (!r) return;
    if (r.state === 'confirmed') yes++; else if (r.state === 'problem') no++;
    if (r.askedAt && r.at && r.at > r.askedAt) waits.push((r.at - r.askedAt) / 60000); });
  waits.sort((a, b) => a - b);
  const med = waits.length ? waits[waits.length >> 1] : null;
  const rows = D().prices.filter(r => String(r.supplierId) === String(sid)), lim = priceStaleDays();
  const fresh = rows.length ? rows.filter(r => { const a = priceAgeDays(r.date); return a != null && a <= lim; }).length / rows.length * 100 : null;
  let lines = 0, full = 0;
  (D().collectionTrips || []).filter(t => !t.voided && String(t.supplierId) === String(sid) && ['collected', 'confirmed'].includes(t.status)).forEach(t => tripLines(t).forEach(l => { const g = tripLineGot(l); if (g == null) return; lines++; if (g >= Number(l.qty)) full++; }));
  const rec = {
    filled: yes + no ? yes / (yes + no) * 100 : null,
    reply: med == null ? null : Math.max(10, Math.min(100, 100 - (med - 15) * (80 / 165))),
    replyMins: med, fresh, full: lines ? full / lines * 100 : null, answers: yes + no, trips: lines
  };
  _scoreMemo.set(k, rec);
  return rec;
}
// The buyer's own past picks no longer count: they made one supplier win
// by habit. What we owe them, against their terms, counts instead.
function supplierScore(sid){
  const rec = supplierRecord(sid), W = scoreWeights();
  const v = { filled: rec.filled, reply: rec.reply, fresh: rec.fresh, full: rec.full, owed: owedScore(sid) };
  // A part with no record yet scores the middle, so a new supplier is neither punished nor favoured.
  Object.keys(v).forEach(k => { if (v[k] == null) v[k] = 50; });
  const wsum = W.reduce((t, w) => t + w[2], 0) || 1;
  return { v, rec, total: W.reduce((t, w) => t + w[2] * v[w[0]], 0) / wsum };
}
// The reason on each line, in words: price first; on a tie, what sets the
// better supplier apart. "better" names a supplier worth switching to.
function pickReason(it){
  const rows = lineRank(it).rows;
  if (!rows.length) return { text: 'Not on the price list yet', tie: false };
  if (rows.length === 1) return { text: 'Only ' + supplierShort(rows[0].supplierId) + ' sells it', tie: false };
  const cur = rows.find(r => String(r.supplierId) === String(it.supplierId)), band = tieBand();
  if (!cur) return { text: supplierShort(rows[0].supplierId) + ' is cheapest', tie: false };
  // A tie is only ever among the cheapest: a dearer pair close to each other is no tie.
  const p0 = rows[0].purchasePrice, cheapest = rows.filter(r => r.purchasePrice <= p0 * (1 + band / 100));
  const tied = cheapest.includes(cur) ? cheapest.filter(r => r !== cur) : [];
  if (tied.length) {
    const A = supplierFacts(cur.supplierId, it), best = tied.map(r => supplierFacts(r.supplierId, it)).sort((a, b) => b.s.total - a.s.total)[0];
    if (best.s.total > A.s.total + 2) { const e = edgeWords(best, A); return { text: 'Same price at ' + supplierShort(best.sid) + (e.length ? ', ' + e[0] : ''), tie: true, better: best.sid }; }
    const e = edgeWords(A, best); return { text: 'Tie on price · ' + (e[0] || 'about the same record'), tie: true };
  }
  if (cheapest.includes(cur)) return { text: 'Cheapest of ' + rows.length + ', by ' + Math.max(1, Math.round((rows[1].purchasePrice - cur.purchasePrice) / (cur.purchasePrice || 1) * 100)) + '%', tie: false };
  return { text: supplierShort(rows[0].supplierId) + ' is ' + Math.max(1, Math.round((cur.purchasePrice - rows[0].purchasePrice) / (rows[0].purchasePrice || 1) * 100)) + '% cheaper', tie: false, better: rows[0].supplierId };
}

// Nobody has it: drop it off the order and the bill, or the client waits.
ACT.nonedrop = async t => {
  const id = Number(t.dataset.id), lineId = t.dataset.line; if (S.busy) return;
  S.busy = true;
  try {
    const res = await changeOrder(id, q => {
      if (q.status !== 'draft' || (q.items || []).length < 2) return false;
      const idx = q.items.findIndex(x => String(x.lineId) === String(lineId)), it = q.items[idx];
      if (!it || it.supplierId) return false;
      q.items.splice(idx, 1);
      q.droppedLines = (q.droppedLines || []).concat([{ ...ofDroppedRecord(it, idx), reason: 'Nobody has it', droppedAt: Date.now(), ...(S.user ? { by: S.user.id } : {}) }]);
      return { moved: orderDraftReady(q) && orderLeaveDraft(q) };
    });
    S.busy = false;
    if (!res) { toast((quoteById(id) || {}).items && quoteById(id).items.length < 2 ? 'It is the only line — the order would be empty' : 'That line has already changed'); render(); return; }
    FEEL.no(); toast('Dropped · off the order and the bill · ' + sellerOf(res.q) + ' is told');
    if (res.out.moved) movedToast(res.q); else if (res.held) heldToast(res.q, res.held);
    render();
  } catch (e) { S.busy = false; toast(failWord(e), 5000); render(); }
};
ACT.nonewait = async t => {
  const id = Number(t.dataset.id), lineId = t.dataset.line, undo = t.dataset.undo === '1'; if (S.busy) return;

  try {
    const res = await changeOrder(id, q => {
      if (q.status !== 'draft') return false;
      const it = (q.items || []).find(x => String(x.lineId) === String(lineId)); if (!it || it.supplierId) return false;
      if (undo) delete it.clientWaits; else it.clientWaits = { at: Date.now(), ...(S.user ? { by: S.user.id } : {}) };
      return { moved: !undo && orderDraftReady(q) && orderLeaveDraft(q) };

    if (!res) { toast('That line has already changed'); render(); return; }

    if (res.out.moved) movedToast(res.q); else if (res.held) heldToast(res.q, res.held);

};

function newUuid(){

async function passOn(kind, forRole, ref, payload){
  const row = { id: newUuid(), shop_id: S.shopId, kind, for_role: forRole, ref: ref == null ? null : String(ref), payload: payload || {}, ...(S.user ? { created_by: S.user.id } : {}) };

// Sold off our own shelf in the last 30 days, per item.
function shelfSales30(){

  D().savedQuotes.forEach(q => { if (q.voided || q.status === 'draft' || createdMs(q) < since) return;
    (q.items || []).forEach(it => { if (!it || it.supplierId !== '__stock__') return; const k = stockKey(it.productId, it.variantIdx == null ? null : it.variantIdx); by.set(k, (by.get(k) || 0) + (Number(it.qty) || 0)); }); });

function restockRows(){
  const sales = shelfSales30(), cover = restockCover(), open = restockOpen(), rows = [], keys = new Set(sales.keys());
  Object.keys(D().presetReorderRules || {}).forEach(k => keys.add(k));
  keys.forEach(key => {
    const i = key.indexOf('::'), pid = i < 0 ? key : key.slice(0, i), vi = i < 0 ? null : Number(key.slice(i + 2)), p = productById(pid); if (!p) return;
    const rule = restockRule(key), lineCover = rule && rule.coverDays ? rule.coverDays : cover, floor = (rule && rule.minUnits) || 0;
    const rate = (sales.get(key) || 0) / 30, qty = shelfAvailable(pid, vi), held = heldForOrders(pid, vi);
    if (!(rate > 0) && !(floor > 0)) return;
    const plain = Math.max(1, Math.ceil(lineCover * rate - qty), floor ? Math.ceil(floor - qty) : 0);
    const best = rankedPurchaseRowsAtQty(pid, vi, plain).find(r => r.purchasePrice != null) || null;
    const sup = best && supplierById(best.supplierId), lead = sup && sup.deliveryDays != null ? Math.max(1, sup.deliveryDays) : 1;

    if (!(short > 0)) return;

    const name = productVariantLabel(p, vi), left = rate > 0 ? qty / rate : null;
    const row = { key, pid, vi, name, qty, held, rate, left, lead, floor, below: floor > 0 && qty < floor, best, need: Math.max(0, short - coming), coming, hold: restockHold(key) };

}

/* ==================================================================
   ONE FLOW, ONE WORD (canvas "Buyer — one flow, one word").
   Every screen says the same six words for where a supplier stands:
     To ask → Asked → Confirmed | Problem → Out → Back
   and every count comes from flowNow(), so Today, Trips, Asking and
   Suppliers never disagree.
   ================================================================== */
const STAGE = {
  toask: { word: 'To ask', ink: '#4D566B', bg: '#EEECE7', dot: '', bar: '#C3CBE0' },
  asked: { word: 'Asked', ink: '#7A4A02', bg: '#FDEEE1', dot: '#E09A4E', bar: '#F5B26B' },
  confirmed: { word: 'Confirmed', ink: '#0F6B43', bg: '#E9F6EE', dot: '#0F6B43', bar: '#6FDCB0' },
  problem: { word: 'Problem', ink: '#8E2A22', bg: '#FBEAE7', dot: '#C93A30', bar: '#E5483D' },
  out: { word: 'Out', ink: '#2E3388', bg: '#EEEFFC', dot: '#3A3F9B', bar: '#A9B0F5' },
  back: { word: 'Back', ink: '#0B5560', bg: '#E3F3F5', dot: '#0E6470', bar: '#6BCFD9' },

// A supplier's answer on one order, as one of the six words. A yes the
// order has changed under is asked again.
function stageOf(a){ return a.k === 'yes' ? 'confirmed' : a.k === 'no' ? 'problem' : a.k === 'asking' ? 'asked' : 'toask'; }
function stageDot(k, size){ const s = STAGE[k]; size = size || 6; return `<span aria-hidden="true" style="width:${size}px;height:${size}px;border-radius:999px;flex:none;${s.dot ? 'background:' + s.dot : 'box-shadow:inset 0 0 0 1.5px ' + s.ink}"></span>`; }
function stagePill(k, text, caps){ const s = STAGE[k]; return `<span class="bx-pill" style="background:${s.bg};color:${s.ink}${caps ? ';letter-spacing:.12em;font-size:10.5px;font-weight:800' : ''}">${stageDot(k)}${esc(text || (caps ? s.word.toUpperCase() : s.word))}</span>`; }
function flowNow(){
  const ask = askingSuppliers();
  const toAsk = ask.filter(r => r.orders.some(o => stageOf(o.g.a) === 'toask'));
  const asked = ask.filter(r => !toAsk.includes(r));
  const runs = runsToGo();
  const live = (D().collectionTrips || []).filter(t => tripIsLive(t));
  const out = live.filter(t => ['open', 'assigned', 'collecting'].includes(t.status)).sort((a, b) => msOf(a.createdAt) - msOf(b.createdAt));
  const back = live.filter(t => t.status === 'collected').sort((a, b) => msOf(b.collectedAt) - msOf(a.collectedAt));
  return { toAsk, asked, runs, out, back, cash: runs.reduce((s, r) => s + r.total, 0) };
}
// The words that apply to one supplier right now, most urgent first.
function supplierStages(sid, f){
  f = f || flowNow(); const k = String(sid), out = [];
  if (f.toAsk.some(r => String(r.supplierId) === k)) out.push('toask');
  if (f.asked.some(r => String(r.supplierId) === k)) out.push('asked');
  if (f.back.some(t => String(t.supplierId) === k)) out.push('back');
  if (f.out.some(t => String(t.supplierId) === k)) out.push('out');
  if (f.runs.some(r => String(r.supplierId) === k)) out.push('confirmed');
  return out;
}

// The jobs, most urgent first: your own trip, goods back, a problem
// holding an order, suppliers to ask, suppliers kept waiting, the next stop.
function flowJobs(f){
  const jobs = [];
  (D().collectionTrips || []).filter(t => tripIsLive(t) && ['collecting', 'assigned'].includes(t.status) && tripIsMine(t)).forEach(t => jobs.push({ k: 'mine', t }));
  f.back.forEach(t => jobs.push({ k: 'back', t }));
  checkOrders().filter(o => o.no > 0).forEach(o => jobs.push({ k: 'problem', o }));
  f.toAsk.forEach(r => jobs.push({ k: 'toask', r }));
  f.asked.forEach(r => jobs.push({ k: 'asked', r }));
  if (f.runs[0] && !jobs.some(j => j.k === 'mine' && j.t.status === 'collecting')) jobs.push({ k: 'run', run: f.runs[0] });
  return jobs;
}

      <span style="display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600"><span class="ell" style="color:${red ? '#8E2A22' : '#7A4A02'}">${r.left == null ? 'under its ' + n0(r.floor) + ' floor' : Math.floor(r.left) + ' day' + (Math.floor(r.left) === 1 ? '' : 's') + ' · ' + n0(r.qty) + ' free' + (r.held > 0 ? ' · ' + n0(r.held) + ' held for orders' : '') + ' · ' + pace}${r.below && r.left != null ? ' · under its floor' : ''}</span><span class="m" style="flex:none">${esc(c.n)} ${esc(c.unit)} · ${n0(r.need * r.best.purchasePrice)}</span></span>
    </div>`; };
  const quiet = (r, sub, chip) => `<div class="bx-jobrow" style="cursor:default"><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:14.5px;font-weight:700;line-height:1.35">${nameHTML2(r)}</span><span style="font-size:12px;font-weight:600;color:#6B7488;line-height:1.35">${sub}</span></span>${chip}</div>`;
  const mgr = whoShort('manager');
  return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card" style="background:#F5F3EF">
    <div class="bx-sheethead" style="gap:16px;background:radial-gradient(130% 100% at 0% 0%,#2B3A78 0%,#16203C 55%,#10172D 100%)"><span class="bx-grip"></span>
      <div style="display:flex;align-items:center;gap:12px"><span style="flex:1;display:flex;flex-direction:column;gap:4px">${eyebrow('WHAT TO BUY · THE SHELF')}<span style="font-size:22px;font-weight:800;letter-spacing:-.02em">Refill before it runs out</span></span>${closeBtn()}</div>
      <span style="display:flex;align-items:flex-end;justify-content:space-between"><span style="display:flex;flex-direction:column;gap:3px">${eyebrow('CASH FOR YOUR PICKS')}<span style="font-size:13px;font-weight:600;color:#C3CBE0">${picked.length} line${picked.length === 1 ? '' : 's'}</span></span><span class="m" style="font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1">${n0(total)}</span></span>
      <span role="img" aria-label="${picked.length} lines picked, ${n0(total)} in all" style="display:flex;gap:4px;height:8px">${picked.length ? picked.map(r => `<i class="a-grow" style="flex:${Math.max(1, r.need * r.best.purchasePrice)};border-radius:999px;background:${r.left != null && r.left <= r.lead ? '#F59A92' : '#F5B26B'}"></i>`).join('') : '<i style="flex:1;border-radius:999px;background:rgba(255,255,255,.12)"></i>'}</span>
    </div>
    <div class="bx-body" style="padding-top:18px">
      ${buy.length ? `<div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px"><b style="font-size:15px">Runs out first</b><span style="display:flex;gap:12px;font-size:11px;font-weight:600;color:#6B7488"><span style="display:inline-flex;align-items:center;gap:5px"><i style="width:14px;height:5px;border-radius:999px;background:#E09A4E"></i>days left</span><span style="display:inline-flex;align-items:center;gap:5px"><i style="width:2px;height:11px;border-radius:2px;background:#16203C"></i>refill lands</span></span></div>${buy.map(card).join('')}` : emptyCard('The shelf is fine', 'Nothing runs out before a refill could land.')}
      ${nocount.map(r => `<div class="bx-jobrow" style="border-radius:22px;background:repeating-linear-gradient(135deg,#F7F5F1 0 8px,#F2EFE9 8px 16px);box-shadow:inset 0 0 0 1px #E6E2DA;cursor:default"><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:14.5px;font-weight:700;line-height:1.35">${nameHTML2(r)}</span><span style="font-size:12px;font-weight:600;color:#6B7488">Sells ${r.rate >= 1 ? n0(Math.round(r.rate)) + ' a day' : n0(Math.max(1, Math.round(r.rate * 7))) + ' a week'} · no shelf count yet</span></span><span class="bx-pill" style="background:#fff;color:#4D566B">${esc(whoShort('store'))} counts</span></div>`).join('')}
      ${slow.length ? `<span style="display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;font-size:13px;font-weight:700;color:#6B7488">${slow.length} hidden · under one a week</span>` : ''}
      ${held.length || noPrice.length || coming.length ? `<b style="font-size:15px;padding:2px 4px 0">Not to buy now</b><div class="bx-jobcard" style="flex-direction:column;align-items:stretch;padding:0">
        ${held.map(r => quiet(r, `<span style="color:#2E3388">${esc(r.hold.by === 'you' ? 'The owner' : mgr)}: ${esc(String(r.hold.reason))}</span>`, `<span class="bx-pill" style="background:#EEEFFC;color:#2E3388;letter-spacing:.1em;font-size:10.5px;font-weight:800">${ic('lock', 11, 'style="stroke-width:2.6"')}HELD</span>`)).join('')}
        ${coming.map(r => quiet(r, n0(r.coming) + ' already bought · on its way', stagePill('out', 'coming'))).join('')}
        ${noPrice.map(r => quiet(r, 'nobody on the price list · ' + esc(whoShort('sourcing')) + ' finds one', '<span class="bx-pill" style="background:#F5F3EF;color:#6B7488">no price</span>')).join('')}
      </div>` : ''}
    </div>
    <div class="bx-foot" style="background:linear-gradient(180deg,rgba(245,243,239,0) 0%,#F5F3EF 32%)"><span class="bx-hint">${ic('bell', 13, 'style="stroke:#3A3F9B;stroke-width:2.2"')}${esc(whoRole('manager'))} sees what you buy · it rides your next trip</span><div class="row"><button class="bx-cta" data-act="rsgo" ${picked.length && !S.busy ? '' : 'aria-disabled="true"'}>${picked.length ? 'Add ' + picked.length + ' to the buying list' : 'Pick what to buy'}</button></div></div>
  </div>`;
};
PAGE.restock.bg = '#F5F3EF';

// Answers kept on the phone go out as soon as there is signal again.
window.addEventListener('online', () => { Object.keys(S.tripDraft || {}).forEach(id => flushTrip(id).then(() => render()).catch(() => {})); });

boot();
</script>
</body>
</html>
