    <div class="ax-lp-cats">${cats.map(c=> aisleTileHTML(c, promoted)).join('')}
      <button type="button" class="ax-lpc all" data-go-all><span class="ic">${PH.grid}</span><span class="t"><span class="nm">All aisles</span><span class="n">${findCategories().length} · ${fmtNum(catalog.length)}</span></span></button></div>
    ${sells.length ? `${sold ? head(PH.flame, 'You sell most', sells.recent ? '<small class="ax-lp-win">last 30 days</small>' : '', 'hot') : head(PH.star, 'Earn extra on these', `<b class="ax-lp-n">${sells.length}</b>`, 'bonus')}
      <div class="ax-lp-row">${sells.map((x, i)=> sellCardHTML(x, i, top, promoted)).join('')}</div>
      ${sold ? '' : `<div class="ax-lp-ghost"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span>Your best sellers land here</span>${PH.flame}</div>`}` : ''}`;
}
function shelfPrice(it, mode){
  const pq = Number(it.packQty) || 0;
  const mult = mode === 'pack' && pq > 0 ? pq : 1;
  const floor = Number(it.floorPrice) || 0, our = Number(it.ourPrice) || 0;
  return (our > floor ? our : floor) * mult;
}
function defaultUnit(it){
  const key = feedItemKey(it.productId, it.variantIdx);
  return Number(it.packQty) > 0 && it.packUnit ? (unitChoice.get(key) || 'pack') : 'unit';
}
function renderUsual(){
  const wrap = document.getElementById('ag_usualWrap');
  const more = document.getElementById('ag_moreWrap');
  const q = orderQuery();
  renderOrderResults();
  if(q){ wrap.innerHTML = ''; more.innerHTML = ''; return; }
  const { orders, regs } = clientUsuals(chosenClient);
  let top = '';
  const missingUsual = regs.filter(r=> lineFor(cart, r.productId, r.variantIdx) < 0);
  if(regs.length && !missingUsual.length){
    // All of it is in: the card folds to one line, out of the order's way.
    top = `<div class="ax-uc-in">${PH.checkCircle} <span>${esc(possessive(firstWord(chosenClient.name)))} usual is in</span></div>`;
  } else if(regs.length){
    // Up to four tiles, one tap each: in (a tick, how often they buy it)
    // or still to add (dark, with the usual quantity). One button for the
    // rest only when more than one is missing.
    const shown = regs.slice(0, 4);
    const missing = missingUsual;
    const allTotal = missing.reduce((s, r)=>{
      const it = catalogEntry(r.productId, r.variantIdx);
      return s + (usualQty(r.qtys) || 1) * (r.lastRate > 0 ? r.lastRate : (it ? shelfPrice(it, 'unit') : 0));
    }, 0);
    const inN = regs.length - missing.length;
    if(regs.length === 1){
      // One item cannot fill a row of tiles: it gets the whole width, its
      // full name, the usual quantity and what it comes to.
      const r = regs[0], it = catalogEntry(r.productId, r.variantIdx);
      const qty = usualQty(r.qtys) || 1;
      const amount = qty * (r.lastRate > 0 ? r.lastRate : (it ? shelfPrice(it, 'unit') : 0));
      const every = r.orders >= orders.length;
      top = `<div class="ax-uc one">
        <div class="ax-uc-h"><span class="ic">${PH.again}</span>
          <span class="b"><span class="n">${esc(possessive(firstWord(chosenClient.name)))} usual</span></span>
          <span class="fq">${PH.repeat}${every ? 'every order' : `${r.orders} of ${orders.length} orders`}</span></div>
        <button type="button" class="ax-uc-one" data-usual="${esc(r.key)}" style="${aisleTint(itemCategory(it || r))}" aria-label="Add ${esc(r.name)}, ${esc(usualLabel(r, it))}">
          <span class="im">${itemThumbHTML(it || r)}</span>
          <span class="b"><span class="nm">${esc(r.name)}</span><span class="q">×${esc(usualLabel(r, it))}${amount > 0 ? ` · ${fmtNum(amount)}` : ''}</span></span>
          <span class="add">${PH.plus}</span></button>
      </div>`;
    } else top = `<div class="ax-uc">
      <div class="ax-uc-h"><span class="ic">${PH.again}</span>
        <span class="b"><span class="n">${esc(possessive(firstWord(chosenClient.name)))} usual</span>
          <span class="sg" aria-hidden="true">${regs.map(r=> `<i${lineFor(cart, r.productId, r.variantIdx) >= 0 ? ' class="on"' : ''}></i>`).join('')}</span></span>
        <span class="k" aria-label="${inN} of ${regs.length} in">${inN}/${regs.length}</span></div>
      <div class="ax-uc-g">${shown.map(r=>{
        const it = catalogEntry(r.productId, r.variantIdx);
        const isIn = lineFor(cart, r.productId, r.variantIdx) >= 0;
        const every = r.orders >= orders.length;
        return `<button type="button" class="ax-uct${isIn ? ' in' : ''}" data-usual="${esc(r.key)}" style="${aisleTint(itemCategory(it || r))}" aria-label="${isIn ? `${esc(r.name)} is in the order` : `Add ${esc(r.name)}, ${esc(usualLabel(r, it))}`}">
          <span class="bd">${isIn ? PH.check : PH.plus}</span>
          <span class="im">${itemThumbHTML(it || r)}</span>
          <span class="nm">${esc(shortName(r.name, 2))}</span>
          <span class="f">${isIn ? (every ? 'every order' : `${r.orders} of ${orders.length}`) : `×${esc(usualLabel(r, it))}`}</span>
        </button>`;
      }).join('')}</div>
      ${missing.length > 1 ? `<button type="button" class="ax-uc-all" data-usual-all>Add ${missing.length === regs.length ? 'all ' : 'the other '}${missing.length}${allTotal > 0 ? `<span>${fmtNum(allTotal)}</span>` : ''}</button>` : ''}
    </div>`;
    // Before anything is in, the usual is rarely the whole screen's worth:
    // the aisles and what you sell most follow it.
    if(!cart.length) top += launchpadHTML();
  } else if(!cart.length){
    top = launchpadHTML();
  }
  wrap.innerHTML = top;
  // Once there is an order, the aisles are a row of chips under it --
  // after what usually goes with the line just added, while it is short.
  more.innerHTML = (cart.length && cart.length < 3 && catalog.length ? oftenWithHTML(cart[cart.length - 1]) : '')
    + (cart.length && catalog.length
    ? `<div class="ax-lp-chips">${topCategories(6).map(c=> `<button type="button" data-go-cat="${esc(c)}" style="${aisleTint(c)}">${categoryIconSVG(c)}${esc(c)}</button>`).join('')}<button type="button" data-go-all>${AX_ICON.grid}All</button></div>` : '');
}
/* What is bought with an item: across this client's orders when they have
   bought it twice or more, else across all of yours -- each with how
   many of those orders had it, and a + to add it. */
function oftenWith(anchor, n){
  const key = feedItemKey(anchor.productId, anchor.variantIdx);
  const inCart = new Set(cart.map(it=> feedItemKey(it.productId, it.variantIdx)));
  const scan = (orders)=>{
    const withIt = orders.filter(o=> !o.voided && (o.items||[]).some(li=> feedItemKey(li.productId, li.variantIdx) === key));
    const by = new Map();
    withIt.forEach(o=> new Set((o.items||[]).map(li=> feedItemKey(li.productId, li.variantIdx))).forEach(k=>{
      if(k !== key && !inCart.has(k)) by.set(k, (by.get(k)||0) + 1);
    }));
    const rows = [...by.entries()].sort((a,b)=> b[1]-a[1])
      .map(([k, c])=>{ const [p, v] = k.split('::'); const it = catalogEntry(p, v === '' ? null : Number(v)); return it ? { it, n: c } : null; })
      .filter(Boolean);
    return { of: withIt.length, rows };
  };
  let got = chosenClient ? scan(myOrders.filter(o=> String(o.agentClientId) === String(chosenClient.id))) : null, mine = true;
  if(!got || got.of < 2 || !got.rows.length){ got = scan(myOrders); mine = false; }
  return { of: got.of, rows: got.rows.slice(0, n), mine };
}
function oftenWithHTML(anchor){
  const w = oftenWith(anchor, 3);
  if(!w.rows.length) return '';
  return `<div class="ax-ow">
    <div class="ax-lp-h ow">${PH.link} <span>Often with ${esc(shortName(anchor.name, 2))}</span><small class="ax-lp-win">in ${w.mine && chosenClient ? `${esc(possessive(firstWord(chosenClient.name)))}` : 'your'} orders</small></div>
    ${w.rows.map(({ it, n })=>{
      const key = feedItemKey(it.productId, it.variantIdx);
      const mode = defaultUnit(it);
      const per = String(mode === 'pack' ? it.packUnit : (it.unit || 'each')).toLowerCase();
      return `<div class="ax-ow-r" style="${aisleTint(itemCategory(it))}">
        <span class="sq">${itemThumbHTML(it)}</span>
        <span class="b"><span class="nm">${esc(it.name)}${it.variantLabel ? ` · ${esc(it.variantLabel)}` : ''}</span>
          <span class="hb"><span class="tr"><i style="width:${Math.max(8, Math.round(100 * n / Math.max(1, w.of)))}%"></i></span><b>${n}/${w.of}</b></span></span>
        <span class="p"><b>${fmtNum(shelfPrice(it, mode))}</b><small>per ${esc(per)}</small></span>
        <button type="button" data-lp-add="${esc(key)}" aria-label="Add ${esc(it.name)}">${PH.plus}</button>
      </div>`;
    }).join('')}
  </div>`;
}

function goToAisle(cat){

async function onOrderStartClick(e){
  const cat = e.target.closest('[data-go-cat]');
  if(cat){ goToAisle(cat.dataset.goCat); return; }
  if(e.target.closest('[data-go-all]')){ switchTab('find'); openCategorySheet(); return; }
  if(e.target.closest('[data-res-all]')){
    const s = document.getElementById('ag_browse_search');
    const q = orderQuery();
    switchTab('find');
    if(s){ s.value = q; document.getElementById('ag_browse_search_clear').hidden = !q; renderFind(); }
    return;
  }
  const pick = e.target.closest('[data-res-pick]');
  if(pick){ openVariantSheet(pick.dataset.resPick); return; }
  const row = e.target.closest('.ax-res-r');
  if(row){
    const item = catalogEntry(row.dataset.pid, row.dataset.vidx === '' ? null : Number(row.dataset.vidx));
    if(!item) return;
    const add = e.target.closest('[data-res-add]');
    if(add){
      const from = add.getBoundingClientRect();
      const line = await addCatalogLine(item, { unit: defaultUnit(item), displayQty: 1 });
      renderOrder();
      if(line) dropIntoOrder(item, from);
      return;
    }
    const step = e.target.closest('[data-res-step]');
    if(step){
      const idx = lineFor(cart, item.productId, item.variantIdx);
      if(idx < 0) return;
      const it = cart[idx];
      const next = Math.round(Number(it.displayQty != null ? it.displayQty : it.qty) || 0) + Number(step.dataset.resStep);
      if(next <= 0){ cart.splice(idx, 1); if(openLineIdx === idx) openLineIdx = -1; updateCartBadge(); saveQuoteDraft(); }
      else setLineQty(it, next);
      renderOrder();
      if(Number(step.dataset.resStep) > 0) bumpOrderBar();
    }
    return;
  }
  const lp = e.target.closest('[data-lp-add]');
  if(lp){
    const [p, v] = lp.dataset.lpAdd.split('::');
    const item = catalogEntry(p, v === '' ? null : Number(v));
    if(!item) return;
    const from = lp.getBoundingClientRect();
    const line = await addCatalogLine(item, { unit: defaultUnit(item), displayQty: 1 });
    renderOrder();
    if(line) dropIntoOrder(item, from);
    return;
  }
  if(!chosenClient) return;
  const { regs } = clientUsuals(chosenClient);
  if(e.target.closest('[data-usual-all]')){
    const missing = regs.filter(r=> lineFor(cart, r.productId, r.variantIdx) < 0);
    if(!catalog.length) await ensureBrowseDataLoaded();
    for(const r of missing) await addRegular(r);
    renderOrder();
    bumpOrderBar();
    return;
  }
  const b = e.target.closest('[data-usual]');
  if(!b) return;
  const r = regs.find(x=> x.key === b.dataset.usual);
  if(!r) return;
  const idx = lineFor(cart, r.productId, r.variantIdx);
  if(idx >= 0){ openLineIdx = idx; renderCart(); return; }
  const from = b.getBoundingClientRect();
  const line = await addRegular(r);
  renderOrder();
  if(line) dropIntoOrder(catalogEntry(r.productId, r.variantIdx) || r, from);
}
['ag_usualWrap', 'ag_moreWrap', 'ag_orderResults'].forEach(id=> document.getElementById(id).addEventListener('click', onOrderStartClick));
// A regular is remembered in base units. Shown in packs when it is a
// whole number of them, because "2 ctn" is how it was bought.
async function addRegular(r){
  const it = catalogEntry(r.productId, r.variantIdx);
  if(!it){ toast('That product is no longer in the shop’s catalogue'); return null; }
  const qty = usualQty(r.qtys) || 1;
  const pq = Number(it.packQty) || 0;
  const usePack = pq > 0 && qty % pq === 0;
  return addCatalogLine(it, { unit: usePack ? 'pack' : 'unit', displayQty: usePack ? qty / pq : qty,
    priceBase: r.lastRate > 0 ? r.lastRate : null, quiet: true });
}
async function orderUsual(client){
  goToClientBasket(client);
  const regs = clientUsuals(client).regs.filter(r=> lineFor(cart, r.productId, r.variantIdx) < 0);
  switchTab('order');
  if(!regs.length) return;
  if(!catalog.length) await ensureBrowseDataLoaded();
  for(const r of regs) await addRegular(r);
  if(currentView === 'order'){ renderOrder(); bumpOrderBar(); }

/* The last price this client was charged for an item, per base unit --
   the first suggestion under the price, because a client who paid that
   last time expects it again. */
function lastRateFor(client, productId, variantIdx){
  if(!client) return 0;
  let best = null;
  myOrders.forEach(o=>{
    if(o.voided || String(o.agentClientId) !== String(client.id)) return;
    const d = orderDate(o) || '';
    (o.items||[]).forEach(it=>{
      if(String(it.productId) !== String(productId) || String(it.variantIdx==null?'':it.variantIdx) !== String(variantIdx==null?'':variantIdx)) return;
      if(!agentLinePriced(it)) return;
      if(!best || d >= best.d) best = { d, rate: Number(it.agentSellPrice) };
    });
  });
  return best ? best.rate : 0;
}

/* ---- adding a line ----
   One price fetch, for the item's whole volume ladder, and then every
   quantity is priced locally from it -- the same rule the server applies
   again on submit, so nothing here is trusted on the way out. */
const addingKeys = new Set();
async function addCatalogLine(item, opts){
  opts = opts || {};
  const key = feedItemKey(item.productId, item.variantIdx);
  if(addingKeys.has(key)) return null;
  addingKeys.add(key);
  if(currentView === 'find') renderFind();
  let tiers = null, unit = item.unit, packUnit = item.packUnit, packQty = Number(item.packQty)||0;
  let ourPrice = Number(item.ourPrice) || 0;
  try{
    const res = await callAgentFn('agent-catalog', { action:'price', productId: item.productId, variantIdx: item.variantIdx, qty: 1 });
    if(res && res.available && Array.isArray(res.tiers) && res.tiers.length){
      tiers = res.tiers.slice().sort((a,b)=> a.minQty - b.minQty);
      unit = res.unit; packUnit = res.packUnit; packQty = Number(res.packQty)||0;
      ourPrice = Number(res.ourPrice) || ourPrice;
    }
  }catch(err){
    if(isNetworkError(err)) toast("You're offline — added at the last price on this phone", 3200);
  }finally{
    addingKeys.delete(key);
  }
  if(!tiers) tiers = [{ minQty: 1, unitPrice: Number(item.floorPrice)||0, tier: item.tier }];
  const usePack = opts.unit === 'pack' && packQty > 0;
  const displayQty = Number(opts.displayQty) > 0 ? Number(opts.displayQty) : 1;
  const qty = usePack ? displayQty * packQty : displayQty;
  const earned = tierForQty(tiers, qty);
  const floor = earned ? Number(earned.unitPrice) : (Number(item.floorPrice)||0);
  // Their last price first, then the shop's own suggestion, and never
  // below what the shop charges you unless you type it yourself.
  const last = opts.priceBase != null ? Number(opts.priceBase) : lastRateFor(chosenClient, item.productId, item.variantIdx);
  const sellBase = last > 0 ? last : (ourPrice > floor ? ourPrice : floor);
  const line = {
    productId: item.productId, variantIdx: item.variantIdx, name: item.name, variantLabel: item.variantLabel,
    qty, unit, packUnit, packQty, displayQty, displayUnit: usePack ? packUnit : unit,
    tier: earned ? earned.tier : item.tier, floorPrice: floor, agentSellPrice: sellBase, tiers, ourPrice,
    // When it went in, so a basket can say how long it has sat.
    addedAt: Date.now(),
  };
  cart.push(line);
  updateCartBadge();
  saveQuoteDraft();
  // Nothing is said about what the line earns. The line says it: an amber
  // +0 when it is sold at the shop's own price, red below it -- on the
  // card in Find and on the line in the order.
  if(currentView === 'find') renderFind();
  return line;
}
/* ---- it drops in ----
   No "Added" message. The item's picture lifts off the button that was
   tapped and drops into the order bar at the bottom, which swells as it
   lands and shows +1 -- so the eye follows the item to where it went. */
function dropTarget(){
  if(currentView === 'find'){
    const el = document.getElementById('ag_findDone');
    return el && el.getClientRects().length ? { bar: el, at: el.querySelector('.ax-av') || el } : null;
  }
  if(currentView === 'order'){
    const el = document.querySelector('#ag_dock .ax-sum');
    return el && el.getClientRects().length ? { bar: el, at: el } : null;
  }
  return null;
}
function bumpOrderBar(target){
  target = target || dropTarget();
  if(!target) return;
  const bar = target.bar;
  bar.classList.remove('ax-bump');
  void bar.offsetWidth;
  bar.classList.add('ax-bump');
  const old = bar.querySelector('.ax-plus1');
  if(old) old.remove();
  const p = document.createElement('span');
  p.className = 'ax-plus1';
  p.setAttribute('aria-hidden', 'true');
  p.textContent = '+1';
  bar.appendChild(p);
  setTimeout(()=>{ p.remove(); bar.classList.remove('ax-bump'); }, 2000);
}
function dropIntoOrder(item, from){
  if(window.owHaptic) owHaptic('tap');
  const target = dropTarget();
  if(!target) return;
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(still || !from || !(from.width > 0) || typeof document.body.animate !== 'function'){ bumpOrderBar(target); return; }
  const to = target.at.getBoundingClientRect();
  const S = 56;
  const x0 = from.left + from.width / 2 - S / 2, y0 = from.top + from.height / 2 - S / 2;
  const dx = to.left + to.width / 2 - S / 2 - x0, dy = to.top + to.height / 2 - S / 2 - y0;
  const fly = document.createElement('div');
  fly.className = 'ax-fly';
  fly.setAttribute('aria-hidden', 'true');
  fly.innerHTML = itemThumbHTML(item);
  fly.style.left = `${x0}px`;
  fly.style.top = `${y0}px`;
  document.body.appendChild(fly);
  const lift = Math.max(40, Math.min(90, Math.abs(dy) * 0.22));
  // Slow enough to follow with the eye: it pops up off the button, hangs
  // there a beat so it is seen, then falls into the bar.
  const anim = fly.animate([
    { transform: 'translate(0,0) scale(.6)', opacity: 0 },
    { transform: `translate(${dx * .06}px,${-lift}px) scale(1.15)`, opacity: 1, offset: .22 },
    { transform: `translate(${dx * .12}px,${-lift * .9}px) scale(1.1)`, opacity: 1, offset: .38 },
    { transform: `translate(${dx * .6}px,${dy * .5}px) scale(.85)`, opacity: 1, offset: .7 },
    { transform: `translate(${dx}px,${dy}px) scale(.45)`, opacity: 1, offset: .94 },
    { transform: `translate(${dx}px,${dy}px) scale(.35)`, opacity: 0 },
  ], { duration: 1150, easing: 'cubic-bezier(.45,.05,.55,.95)' });
  const land = ()=>{ fly.remove(); bumpOrderBar(dropTarget() || target); };
  anim.onfinish = land;
  anim.oncancel = land;
}

function lineUsesPack(it){
  return Number(it.packQty) > 0 && !!it.displayUnit && it.displayUnit === it.packUnit && it.packUnit !== it.unit;
}
function lineMult(it){ return lineUsesPack(it) ? Number(it.packQty) : 1; }
/* A new quantity re-reads the ladder: what the shop charges you can drop
   as the line grows, and what you charge your client stays as you set it. */
function setLineQty(it, displayQty){
  const d = Math.max(0, Math.round((Number(displayQty)||0) * 100) / 100);
  it.displayQty = d;
  it.qty = d * lineMult(it);
  if(Array.isArray(it.tiers) && it.tiers.length){
    const t = tierForQty(it.tiers, it.qty);
    if(t){ it.floorPrice = Number(t.unitPrice); it.tier = t.tier; }
  }
  saveQuoteDraft();
}
/* The next rung of the ladder, if it is a step and not a leap: within
   three times what is on the line, and genuinely cheaper. Said as the
   quantity to type, in the unit already on the line where it divides. */
function nextTierHint(it){
  if(!Array.isArray(it.tiers) || it.tiers.length < 2) return null;
  const base = Number(it.qty)||0;
  const next = it.tiers.find(t=> t.minQty > base);
  if(!next || !(Number(next.unitPrice) < Number(it.floorPrice)) || next.minQty > Math.max(base, 1) * 3) return null;
  const mult = lineMult(it);
  const display = mult > 1 && next.minQty % mult === 0 ? next.minQty / mult : null;
  return { baseQty: next.minQty, displayQty: display, unitPrice: Number(next.unitPrice) };
}
async function ensureLineTiers(it){
  if(Array.isArray(it.tiers) && it.tiers.length) return;
  try{
    const res = await callAgentFn('agent-catalog', { action:'price', productId: it.productId, variantIdx: it.variantIdx, qty: 1 });
    if(res && res.available && Array.isArray(res.tiers) && res.tiers.length){
      it.tiers = res.tiers.slice().sort((a,b)=> a.minQty - b.minQty);
      it.ourPrice = Number(res.ourPrice) || it.ourPrice || 0;
      setLineQty(it, it.displayQty != null ? it.displayQty : it.qty);
      if(currentView === 'order') renderCart();
    }
  }catch(_e){ /* the line keeps the price it was added at */ }
}

function earnChipHTML(margin, profit){
  if(margin.level === 'loss') return `<span class="ax-earn loss" title="${esc(margin.detail)}">${fmtSigned(profit)}</span>`;
  if(margin.level === 'none') return `<span class="ax-earn none" title="${esc(margin.detail)}">+0</span>`;
  return `<span class="ax-earn">${fmtSigned(profit)}</span>`;
}
/* Lines the shop refused to price when the order went in. The refusal

   the shop has priced it, the next send simply goes through. */
const blockedLines = new Map();
function lineBlock(it){ return blockedLines.get(feedItemKey(it.productId, it.variantIdx)) || null; }
function renderCart(){

          <span data-chip-big>${earnChipHTML(f.margin, f.profit)}</span>

        <div data-flag>${cartMarginFlagHTML(f.margin)}</div>

  }).join('')
  + (cart.length >= 2 ? `<button type="button" class="ax-sug" data-bundle-save style="align-self:flex-start;">${AX_ICON.bundle}Save as a bundle</button>` : '')

  + (!cart.length && !orderQuery() && !document.getElementById('ag_usualWrap').innerHTML.trim()
    ? `<div class="ax-empty">${AX_ICON.basket}<div>Nothing in this order yet.</div></div>` : '');

document.getElementById('ag_cartWrap').addEventListener('click', (e)=>{
  const head = e.target.closest('[data-line]');
  if(head){
    const i = Number(head.dataset.line);
    openLineIdx = openLineIdx === i ? -1 : i;
    renderCart();
    if(openLineIdx >= 0) ensureLineTiers(cart[openLineIdx]);
    return;
  }
  if(e.target.closest('[data-bundle-save]')){ openSaveSolutionModal(); return; }
  const gone = e.target.closest('[data-unblock-del]');
  if(gone){
    const i = Number(gone.dataset.unblockDel);
    const it = cart[i];
    if(it) blockedLines.delete(feedItemKey(it.productId, it.variantIdx));
    cart.splice(i, 1);
    if(openLineIdx === i) openLineIdx = -1; else if(openLineIdx > i) openLineIdx--;
    updateCartBadge();
    saveQuoteDraft();
    renderOrder();
    return;
  }
  const it = cart[openLineIdx];
  if(!it) return;
  const step = e.target.closest('[data-qty]');
  if(step){
    const cur = Number(it.displayQty != null ? it.displayQty : it.qty) || 0;
    setLineQty(it, Math.max(1, Math.round(cur) + Number(step.dataset.qty)));
    renderCart(); renderUsual();
    return;
  }
  const tier = e.target.closest('[data-tier]');
  if(tier){
    const base = Number(tier.dataset.tier);
    const mult = lineMult(it);
    if(mult > 1 && base % mult !== 0){
      // The rung does not land on whole packs, so the line moves to the
      // base unit rather than inventing a fraction of a carton.
      it.displayUnit = it.unit;
      setLineQty(it, base);
    } else {
      setLineQty(it, base / mult);
    }
    renderCart();
    return;
  }
  const sug = e.target.closest('[data-sug]');
  if(sug){
    it.agentSellPrice = Number(sug.dataset.sug) / lineMult(it);
    saveQuoteDraft();
    renderCart();
    return;
  }
  if(e.target.closest('[data-del]')){
    cart.splice(openLineIdx, 1);
    openLineIdx = -1;
    updateCartBadge();
    saveQuoteDraft();
    renderOrder();
  }
});
/* Typing a price updates the line's chip and the dock as you go, without
   redrawing the field under your thumb. It is kept on every keystroke,
   not when the field is left: sliding to send does not take the focus

function parseMoney(v){ return Number(String(v||'').replace(/[^\d.]/g, '')); }

function cartTotals(preview){

(function wireSlide(){
  const slide = document.getElementById('ag_slide');
  const knob = document.getElementById('ag_submit_btn');
  const fill = document.getElementById('ag_slideFill');
  let startX = 0, dx = 0, max = 0, dragging = false, moved = false;
  knob.addEventListener('pointerdown', (e)=>{
    if(knob.disabled || sendingOrder) return;
    dragging = true; moved = false; dx = 0; startX = e.clientX;
    max = slide.clientWidth - knob.offsetWidth - 10;
    knob.style.transition = 'none'; fill.style.transition = 'none'; knob.style.animation = 'none';
    try{ knob.setPointerCapture(e.pointerId); }catch(_e){}
  });
  knob.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    dx = Math.max(0, Math.min(max, e.clientX - startX));
    if(dx > 6) moved = true;
    knob.style.transform = `translateX(${dx}px)`;
    fill.style.width = `${50 + dx}px`;
  });
  const end = ()=>{
    if(!dragging) return;
    dragging = false;
    if(max > 0 && dx >= max * 0.85){
      knob.style.transform = `translateX(${max}px)`;
      fill.style.width = `${50 + max}px`;
      submitOrder();
    } else {
      resetSlide();
      if(!moved) toast('Slide the red button across to send');
    }
  };
  knob.addEventListener('pointerup', end);
  knob.addEventListener('pointercancel', end);
  // detail is 0 only for a keyboard press, never for a finger.
  knob.addEventListener('click', (e)=>{ if(e.detail === 0) submitOrder(); });
})();

async function submitOrder(){
  if(sendingOrder) return;
  if(!chosenClient){ toast('Choose or add a client first'); resetSlide(); return; }
  if(!cart.length){ toast('Add at least one item'); resetSlide(); return; }
  const deliveryMode = document.getElementById('ag_delivery_shop').checked ? 'shop_delivery' : 'agent_pickup';
  const deliveryAddress = document.getElementById('ag_delivery_address').value.trim();
  if(deliveryMode==='shop_delivery' && !deliveryAddress){ toast('Enter a delivery address'); resetSlide(); return; }

  const btn = document.getElementById('ag_submit_btn');
  btn.disabled = true;
  sendingOrder = true;
  const label = document.getElementById('ag_slideLabel');
  if(label) label.textContent = 'Sending…';
  // What was sent, kept for the screen that follows -- the basket itself
  // is emptied the moment the server has the order.
  const sent = sentSnapshot();
  // Only the submit call itself decides whether the order was placed.
  // The refresh after it is a second round trip, and a phone dropping off
  // the network right after the POST must not be told the order failed.
  let res;
  try{
    res = await callAgentFn('agent-submit-order', {
      agentClientId: chosenClient.id,
      items: cart.map(it=>({ productId: it.productId, variantIdx: it.variantIdx, qty: it.qty, agentSellPrice: it.agentSellPrice })),
      deliveryMode,
      deliveryAddress: deliveryMode==='shop_delivery' ? deliveryAddress : undefined,
      ...(deliveryMode==='shop_delivery' ? (()=>{ const i = deliveryInfo(); return {
        deliveryContact: (i.name || i.phone) ? { name: i.name || '', phone: i.phone || '' } : undefined,
        deliveryWhen: i.when || undefined }; })() : {}),
    });
  }catch(err){
    /* Not "try again" when it is the pause that refused it -- a paused
       account will refuse every retry. */
    const unpriced = /^(?:Could not price|No supplier price on file for) (.+)$/.exec(String(err && err.message || ''));
    const hit = unpriced ? cart.filter(it=> String(it.name||'').trim() === unpriced[1].trim()) : [];
    if(hit.length){
      hit.forEach(it=> blockedLines.set(feedItemKey(it.productId, it.variantIdx), 'The shop hasn’t priced this yet'));
      renderCart();
      toast(`${hit.length} item${hit.length===1?' has':'s have'} no price yet`, 0, { tone:'bad', title:'Not sent', sticky:true,
        action: { label:'Show', run: ()=>{ const el = document.querySelector('#ag_cartWrap [data-blocked]'); if(el) el.scrollIntoView({ behavior:'smooth', block:'center' }); } } });
    } else {
      const offline = "You're offline -- this order needs a live price check, so it can't submit until you're back online";
      toast(err.paused
        ? 'Your account is paused — the shop has to lift it before orders can go through'
        : isNetworkError(err) ? offline : `Could not submit order: ${err.message||err}`, err.paused ? 6000 : undefined,
        err.paused || isNetworkError(err) ? { tone:'warn' } : undefined);
    }
    return;}finally{
    sendingOrder = false;
    btn.disabled = false;
    applyPausedToCart();
  }

  // The order exists from here on. The basket is cleared before the
  // reload, so the one thing that would invite a re-send cannot survive a
  // failure below.
  resetCartAfterSubmit();
  switchTab('today');
  showSent(sent, res && res.orderId);
  try{
    await loadAgentHomeData();
    renderCurrentView();
  }catch(err){
    toast("Order submitted -- couldn't refresh your orders just now. It's waiting for you on Today.", 5000);
  }
}

function resetCartAfterSubmit(){
  // Only THIS client's basket is finished. Anyone else the agent has an
  // order in progress for still has theirs, and so does the unnamed one.
  const k = cartKey(chosenClient);
  if(k) delete carts[k];
  chosenClient = null;
  activateCartFor(null);
  document.getElementById('ag_delivery_pickup').checked = true;
  document.getElementById('ag_delivery_address').value = '';
  setDeliveryInfo(null);
  openLineIdx = -1;
  blockedLines.clear();
  updateCartBadge();
  saveQuoteDraft();
}

function updateCartBadge(){
  const n = clientsWithBaskets().length + (unnamedCart.length ? 1 : 0);
  const badge = document.getElementById('ag_quote_nav_badge');
  badge.textContent = String(n);
  badge.hidden = !n;
}

let findCategory = null, findSub = null, findFilter = { again:false, bonus:false, fresh:false }, findLimit = 40;
const unitChoice = new Map();

function openFindView(){
  const input = document.getElementById('ag_browse_search');
  input.value = '';
  document.getElementById('ag_browse_search_clear').hidden = true;
  findLimit = 40;
  renderFind();
  if(!catalog.length || !browseDataLoaded){
    document.getElementById('ag_browseGrid').innerHTML = '<div class="ax-more"><div class="ag-spinner"></div></div>';
    ensureBrowseDataLoaded().then(()=>{ if(currentView === 'find'){ if(!findCategory) findCategory = defaultFindCategory(); renderFind(); } });
  } else if(!findCategory && !anyFindFilter()){
    findCategory = defaultFindCategory();
    renderFind();
  }
}
function anyFindFilter(){ return findFilter.again || findFilter.bonus || findFilter.fresh; }
// Open on the aisle this client buys from most, then the one you sell
// from most, so the first screen is usually the right one.
function defaultFindCategory(){
  if(!catalog.length) return null;
  const pick = (orders)=>{
    const by = new Map();
    orders.forEach(o=> (o.items||[]).forEach(li=>{
      const ce = catalogEntry(li.productId, li.variantIdx);
      if(ce) by.set(itemCategory(ce), (by.get(itemCategory(ce))||0) + 1);
    }));
    return [...by.entries()].sort((a,b)=> b[1]-a[1])[0];
  };
  const mine = chosenClient ? pick((clientOrderCounts().get(chosenClient.id)||[]).filter(o=>!o.voided)) : null;
  if(mine) return mine[0];
  const all = pick(myOrders.filter(o=>!o.voided));
  if(all) return all[0];
  return findCategories()[0] || null;
}
function findCategories(){
  const named = [...new Set(catalog.map(it=>(it.category||'').trim()).filter(Boolean))];
  const hasOther = catalog.some(it=>!(it.category||'').trim());
  return hasOther ? named.concat(AGENT_OTHER_CATEGORY) : named;
}
function boughtBeforeKeys(){
  const keys = new Set();
  myOrders.forEach(o=>{
    if(o.voided) return;
    if(chosenClient && String(o.agentClientId) !== String(chosenClient.id)) return;
    (o.items||[]).forEach(li=> keys.add(feedItemKey(li.productId, li.variantIdx)));
  });
  return keys;
}
function findItems(){
  const q = document.getElementById('ag_browse_search').value.trim().toLowerCase();
  let items = catalog.slice();
  if(q){
    // A search looks at the whole shop, whatever aisle you were in.
    items = searchCatalog(document.getElementById('ag_browse_search').value).hits.map(h=> h.it);
  } else {
    if(findCategory) items = items.filter(it=> itemCategory(it) === findCategory);
    if(findCategory && findSub) items = items.filter(it=> it.subcategory === findSub);
  }
  if(findFilter.bonus){ const p = promotedMap(); items = items.filter(it=> p.has(feedItemKey(it.productId, it.variantIdx))); }
  if(findFilter.again){ const k = boughtBeforeKeys(); items = items.filter(it=> k.has(feedItemKey(it.productId, it.variantIdx))); }
  if(findFilter.fresh){ const cut = Date.now() - 30*86400000; items = items.filter(it=> it.createdAt && new Date(it.createdAt).getTime() >= cut); }
  return items;
}
function renderFind(){
  const q = document.getElementById('ag_browse_search').value.trim();
  document.getElementById('ag_browse_search').placeholder = catalog.length ? `Search ${fmtNum(catalog.length)} items` : 'Search items';
  // The aisle you are in, and the shelves inside it.
  const label = q ? 'All aisles' : findCategory || (anyFindFilter() ? 'Everything' : 'Browse');
  let subs = !q && findCategory
    ? [...new Set(catalog.filter(it=> itemCategory(it) === findCategory).map(it=> it.subcategory).filter(Boolean))] : [];
  // One shelf in an aisle is not a choice.
  if(subs.length < 2) subs = [];
  document.getElementById('ag_catRow').innerHTML = `
    <button type="button" class="ax-catpill" id="ag_catPill" aria-label="Aisle: ${esc(label)}. Change aisle">
      <span class="ic">${findCategory && !q ? categoryIconSVG(findCategory) : AX_ICON.grid}</span>${esc(label)}${AX_ICON.chevD}
    </button>
    ${subs.length ? `<span class="ax-vr"></span>${subs.map(s=> `<button type="button" class="ax-sub${findSub===s?' on':''}" data-sub="${esc(s)}" aria-pressed="${findSub===s}">${esc(s)}</button>`).join('')}` : ''}`;
  const items = findItems();
  const groups = groupCatalogItems(items);
  const noun = q ? 'found' : (findSub || findCategory || 'items');
  document.getElementById('ag_findCount').innerHTML = `<b>${groups.length}</b> ${esc(String(noun).toLowerCase())}`;
  const who = chosenClient ? firstWord(chosenClient.name) : 'you';
  document.getElementById('ag_findFilters').innerHTML = `
    <button type="button" data-flt="again" aria-pressed="${findFilter.again}" aria-label="Only what ${esc(who)} bought before" title="Bought before">${AX_ICON.again}</button>
    <button type="button" data-flt="bonus" aria-pressed="${findFilter.bonus}" aria-label="Only items with a bonus" title="Bonus items">${AX_ICON.star}</button>`;
  const grid = document.getElementById('ag_browseGrid');
  if(!catalog.length){
    grid.innerHTML = browseDataLoaded ? '<div class="ax-more ax-empty">The shop has no items listed yet.</div>' : '<div class="ax-more"><div class="ag-spinner"></div></div>';
  } else if(!groups.length){
    grid.innerHTML = `<div class="ax-more ax-empty">${q ? 'Nothing matches that search.' : 'Nothing here with those filters.'}</div>`;
  } else {
    const promoted = promotedMap();
    const before = boughtBeforeKeys();
    grid.innerHTML = groups.slice(0, findLimit).map(g=> findTileHTML(g, promoted, before)).join('')
      + (groups.length > findLimit ? `<button type="button" class="btn btn-ghost ax-more" data-more>Show ${Math.min(40, groups.length - findLimit)} more</button>` : '');
  }
  renderFindDone();
}
function findTileHTML(group, promoted, before){
  const sel = selectedVariantFor(group);
  const key = feedItemKey(sel.productId, sel.variantIdx);
  const promo = promoted.get(key);
  const pq = Number(sel.packQty) || 0;
  const mode = pq > 0 && sel.packUnit ? (unitChoice.get(key) || 'pack') : 'unit';
  const mult = mode === 'pack' ? pq : 1;
  const unitLabel = mode === 'pack' ? sel.packUnit : (sel.unit || 'each');
  const floor = Number(sel.floorPrice) || 0, our = Number(sel.ourPrice) || 0;
  const price = (our > floor ? our : floor) * mult;
  const head = our > floor ? (our - floor) * mult : 0;
  const idx = lineFor(cart, sel.productId, sel.variantIdx);
  const line = idx >= 0 ? cart[idx] : null;
  const inCluster = promo && isInCluster(sel.productId, sel.variantIdx);
  const lineF = line ? cartLineFigures(line) : null;
  const tag = line ? (lineF.margin.level === 'ok' ? `<span class="ax-pt-tag in">${AX_ICON.check}In order</span>`
      : `<span class="ax-pt-tag ${lineF.margin.level === 'loss' ? 'loss' : 'zero'}" title="${esc(lineF.margin.detail)}">${AX_ICON.check}${fmtSigned(lineF.profit)}</span>`)
    : promo ? `<span class="ax-pt-tag bonus">${esc(bonusFlagLabel(promo))} each</span>`
    : before.has(key) && chosenClient ? `<span class="ax-pt-tag buys">${esc(clientInitials(chosenClient.name))} buys</span>` : '';
  const variants = group.variants.length > 1
    ? `<button type="button" class="ax-var" data-varpick="${esc(group.productId)}" aria-label="${esc(group.name)}: ${esc(sel.variantLabel || 'choose')}. Change"><span>${esc(sel.variantLabel || '—')}</span>${AX_ICON.chevD}</button>` : '';
  const busy = addingKeys.has(key);
  const bottom = line
    ? `<div class="ax-instep">
        <button type="button" data-find-step="-1" aria-label="Fewer">${AX_ICON.minus}</button>
        <b>${esc(line.displayQty != null ? line.displayQty : line.qty)}<span>${esc(line.displayUnit || line.unit || '')}</span></b>
        <button type="button" data-find-step="1" aria-label="More">${AX_ICON.plus}</button>
      </div>`
    : `<div class="ax-pt-a">
        ${pq > 0 && sel.packUnit
          ? `<div class="ax-useg" role="group" aria-label="Unit">
              <button type="button" data-unit="unit" aria-pressed="${mode==='unit'}">${esc(sel.unit || 'pc')}</button>
              <button type="button" data-unit="pack" aria-pressed="${mode==='pack'}">${esc(sel.packUnit)}</button>
            </div>`
          : `<div class="ax-useg one"><span>per ${esc(sel.unit || 'item')}</span></div>`}
        <button type="button" class="ax-add${busy?' busy':''}" data-add aria-label="Add ${esc(group.name)}">${busy ? '<span class="ag-spinner" style="width:18px;height:18px;border-width:2px;"></span>' : AX_ICON.plus}</button>
      </div>`;
  return `<div class="ax-pt${line ? ' in' : ''}" data-pid="${esc(sel.productId)}" data-vidx="${sel.variantIdx==null?'':esc(sel.variantIdx)}">
    <button type="button" class="ax-pt-im" style="${aisleTint(itemCategory(sel))}" data-img="${esc(sel.image||'')}" aria-label="${esc(group.name)}${sel.image ? ', view photo' : ''}">
      ${itemThumbHTML(sel)}${tag}
    </button>
    ${promo ? `<button type="button" class="ax-pt-star${inCluster?' on':''}" data-star aria-pressed="${!!inCluster}" aria-label="${inCluster ? 'In your cluster' : 'Star it to earn its bonus'}">${AX_ICON.star}</button>` : ''}
    <div class="ax-pt-b">
      <span class="ax-pt-n" title="${esc(group.name)}">${esc(group.name)}</span>
      ${variants}
      <span class="ax-pt-p"><span class="v">${fmtNum(price)}</span><span class="u">/${esc(String(unitLabel).toLowerCase())}</span>${head > 0 ? `<span class="e">+${fmtNum(head)}</span>` : ''}</span>
      ${bottom}
    </div>
  </div>`;
}
document.getElementById('ag_findView').addEventListener('click', async (e)=>{
  if(e.target.closest('#ag_findBack')){ switchTab('order'); return; }
  if(e.target.closest('#ag_findDone')){ switchTab('order'); return; }
  if(e.target.closest('#ag_catPill')){ openCategorySheet(); return; }
  const sub = e.target.closest('[data-sub]');
  if(sub){ findSub = findSub === sub.dataset.sub ? null : sub.dataset.sub; findLimit = 40; renderFind(); return; }
  const flt = e.target.closest('[data-flt]');
  if(flt){ findFilter[flt.dataset.flt] = !findFilter[flt.dataset.flt]; findLimit = 40; renderFind(); return; }
  if(e.target.closest('[data-more]')){ findLimit += 40; renderFind(); return; }
  const vp = e.target.closest('[data-varpick]');
  if(vp){ openVariantSheet(vp.dataset.varpick); return; }
  const tile = e.target.closest('.ax-pt');
  if(!tile) return;
  const item = catalogEntry(tile.dataset.pid, tile.dataset.vidx === '' ? null : Number(tile.dataset.vidx));
  if(!item) return;
  const key = feedItemKey(item.productId, item.variantIdx);
  if(e.target.closest('[data-star]')){ await toggleClusterMembership(item.productId, item.variantIdx); return; }
  const unit = e.target.closest('[data-unit]');
  if(unit){ unitChoice.set(key, unit.dataset.unit); renderFind(); return; }
  if(e.target.closest('[data-add]')){
    const from = e.target.closest('[data-add]').getBoundingClientRect();
    const pq = Number(item.packQty) || 0;
    const mode = pq > 0 && item.packUnit ? (unitChoice.get(key) || 'pack') : 'unit';
    const line = await addCatalogLine(item, { unit: mode, displayQty: 1 });
    if(line) dropIntoOrder(item, from);
    return;
  }
  const step = e.target.closest('[data-find-step]');
  if(step){
    const idx = lineFor(cart, item.productId, item.variantIdx);
    if(idx < 0) return;
    const it = cart[idx];
    const next = Math.round(Number(it.displayQty != null ? it.displayQty : it.qty) || 0) + Number(step.dataset.findStep);
    if(next <= 0){ cart.splice(idx, 1); if(openLineIdx === idx) openLineIdx = -1; updateCartBadge(); saveQuoteDraft(); }
    else setLineQty(it, next);
    renderFind();
    if(Number(step.dataset.findStep) > 0) bumpOrderBar();
    return;
  }
  const img = e.target.closest('[data-img]');
  if(img && img.dataset.img){ openImageLightbox(img.dataset.img); }
});

/* ---- picking a size ----
   One item, many sizes: "6* / Coarse / 3/4"". The labels are split on
   their slashes into rows -- size, thread, length -- so a choice is three
   taps on short buttons instead of a scroll down a long list. A
   combination the shop does not stock is drawn dashed; tapping it jumps to
   the nearest one it does. Labels that do not split evenly stay one row. */
function variantDims(variants){
  // " / " between parts; a bare slash only where it is not a fraction --
  // the 3/4 in 3/4" is a length, not two choices.
  const spaced = variants.some(v=> / \/ /.test(v.variantLabel || ''));
  const cut = spaced ? /\s+\/\s+/ : /(?<!\d)\/|\/(?!\d)/;
  const parts = variants.map(v=> String(v.variantLabel || '—').split(cut).map(x=> x.trim()));
  const n = parts[0].length;
  if(n >= 2 && n <= 4 && parts.every(p=> p.length === n && p.every(Boolean))){
    const values = Array.from({ length: n }, (_, d)=> [...new Set(parts.map(p=> p[d]))]);
    if(values.every(v=> v.length < variants.length)) return { parts, values };
  }
  const whole = variants.map(v=> [String(v.variantLabel || '—')]);
  return { parts: whole, values: [whole.map(p=> p[0])] };
}
function openVariantSheet(productId, opts){
  opts = opts || {};
  const group = groupCatalogItems(catalog.filter(it=> String(it.productId) === String(productId)))[0];
  if(!group) return;
  const { parts, values } = variantDims(group.variants);
  let sel = selectedVariantFor(group);
  // The card behind follows whatever was picked.
  const sheet = openSheet('', { label: `Choose ${group.name}`, white:true,
    onClose: ()=>{ if(currentView === 'find') renderFind(); if(currentView === 'order') renderOrder(); } });
  function paint(){
    const at = group.variants.indexOf(sel);
    const cur = parts[at];
    const key = feedItemKey(sel.productId, sel.variantIdx);
    const pq = Number(sel.packQty) || 0;
    const mode = pq > 0 && sel.packUnit ? (unitChoice.get(key) || 'pack') : 'unit';
    const mult = mode === 'pack' ? pq : 1;
    const floor = Number(sel.floorPrice) || 0, our = Number(sel.ourPrice) || 0;
    const price = (our > floor ? our : floor) * mult;
    const unitLabel = mode === 'pack' ? sel.packUnit : (sel.unit || 'each');
    const inOrder = lineFor(cart, sel.productId, sel.variantIdx) >= 0;
    sheet.el.innerHTML = `<button type="button" class="ax-grab" data-close aria-label="Close"></button>
      <div class="ax-vs">
        <div class="ax-vs-h"><span class="ax-th" style="${aisleTint(itemCategory(sel))}">${itemThumbHTML(sel)}</span>
          <span class="b"><span class="n">${esc(group.name)}</span><span class="p">${fmtNum(price)} <small>/${esc(String(unitLabel).toLowerCase())}</small></span></span>
          <button type="button" class="ax-iconbtn" data-close aria-label="Close">${AX_ICON.x}</button></div>
        ${values.map((vals, d)=> `<div class="ax-vs-row" role="group">${vals.map(v=>{
          const on = cur[d] === v;
          const fits = parts.some(p=> p[d] === v && p.every((x, i)=> i === d || x === cur[i]));
          return `<button type="button" class="ax-vs-c${on ? ' on' : fits ? '' : ' far'}" data-d="${d}" data-v="${esc(v)}" aria-pressed="${on}">${esc(v)}</button>`;
        }).join('')}</div>`).join('')}
        <div class="ax-vs-foot">
          ${pq > 0 && sel.packUnit ? `<div class="ax-useg" role="group" aria-label="Unit">
              <button type="button" data-vs-unit="unit" aria-pressed="${mode==='unit'}">${esc(sel.unit || 'pc')}</button>
              <button type="button" data-vs-unit="pack" aria-pressed="${mode==='pack'}">${esc(sel.packUnit)}</button></div>` : ''}
          ${inOrder ? `<button type="button" class="btn btn-dark" data-close>${AX_ICON.check}In order</button>`
            : `<button type="button" class="btn btn-accent" data-vs-add>Add <b>${fmtNum(price)}</b></button>`}
        </div>
      </div>`;
  }
  sheet.el.addEventListener('click', async (e)=>{
    const c = e.target.closest('[data-d]');
    if(c){
      const d = Number(c.dataset.d), v = c.dataset.v;
      const cur = parts[group.variants.indexOf(sel)];
      const want = cur.slice(); want[d] = v;
      let i = parts.findIndex(p=> p.every((x, k)=> x === want[k]));
      if(i < 0){
        // The nearest stocked combination that keeps what was just tapped.
        let best = -1, score = -1;
        parts.forEach((p, k)=>{
          if(p[d] !== v) return;
          const sc = p.filter((x, m)=> x === want[m]).length;
          if(sc > score){ score = sc; best = k; }
        });
        i = best;
      }
      if(i >= 0){
        sel = group.variants[i];
        browseSelectedVariant.set(group.productId, sel.variantIdx == null ? '' : String(sel.variantIdx));
      }
      paint();
      return;
    }
    const u = e.target.closest('[data-vs-unit]');
    if(u){ unitChoice.set(feedItemKey(sel.productId, sel.variantIdx), u.dataset.vsUnit); paint(); return; }
    const add = e.target.closest('[data-vs-add]');
    if(add){
      const from = add.getBoundingClientRect();
      const key = feedItemKey(sel.productId, sel.variantIdx);
      const pq = Number(sel.packQty) || 0;
      const mode = pq > 0 && sel.packUnit ? (unitChoice.get(key) || 'pack') : 'unit';
      add.disabled = true;
      sheet.close();
      const line = await addCatalogLine(sel, { unit: mode, displayQty: 1 });
      if(line) dropIntoOrder(sel, from);
      if(currentView === 'find') renderFind();
      if(currentView === 'order') renderOrder();
    }
  });
  paint();
}

      <div class="ax-lp-h">${PH.grid} <span>Aisles</span><b class="ax-cat-n">${cats.length}</b></div>
      <div class="ax-catgrid">${cats.map(c=>{
        const inAisle = catalog.filter(it=> itemCategory(it) === c);

/* ---- bundles: an agent's own saved sets of items ----
   Each one shows what is in it before it is opened: its aisles as a
   stack of icons, the items as chips, what it comes to and what it pays
   you, and how many of your orders it has been in. One button adds all
   of it. */
// A quantity said the way it is bought: "2 ctn" when it is whole cartons.
function itemQtyLabel(it, qty){
  const q = Number(qty) || 0;
  const pq = Number(it && it.packQty) || 0;
  if(pq > 0 && it.packUnit && q % pq === 0) return `${fmtNum(q / pq)} ${String(it.packUnit).toLowerCase()}`;
  return `${fmtNum(q)} ${String((it && it.unit) || 'pc').toLowerCase()}`;
}
function bundleLines(tpl){
  return (Array.isArray(tpl && tpl.line_items) ? tpl.line_items : []).map(li=> ({
    li, qty: Number(li.qty) || 1,
    it: catalogEntry(li.productId, li.variantIdx == null || li.variantIdx === '' ? null : Number(li.variantIdx)),
  }));
}
// What it comes to at today's shelf price, and what you make on it --
// never a stored price, which is the rule the bundles table was built on.
function bundleFigures(tpl){
  let total = 0, yours = 0, gone = 0;
  bundleLines(tpl).forEach(({ it, qty })=>{
    if(!it){ gone++; return; }
    const floor = Number(it.floorPrice) || 0, our = Number(it.ourPrice) || 0;
    total += (our > floor ? our : floor) * qty;
    yours += Math.max(0, our - floor) * qty;
  });
  return { total, yours, gone };
}
// How many of your orders had every item of it.
function bundleUses(tpl){
  const keys = bundleLines(tpl).map(x=> feedItemKey(x.li.productId, x.li.variantIdx == null || x.li.variantIdx === '' ? null : x.li.variantIdx));
  if(!keys.length) return 0;
  return myOrders.filter(o=>{
    if(o.voided) return false;
    const has = new Set((o.items||[]).map(li=> feedItemKey(li.productId, li.variantIdx)));
    return keys.every(k=> has.has(k));
  }).length;
}
function aisleStackHTML(cats, more){
  return `<span class="ax-stk" aria-hidden="true">${cats.map((c, i)=> `<i style="${aisleTint(c)}z-index:${i + 1}">${categoryIconSVG(c)}</i>`).join('')}${more > 0 ? `<i class="more">+${more}</i>` : ''}</span>`;
}
function bundleCardHTML(tpl){
  const lines = bundleLines(tpl).filter(x=> x.it);
  const n = bundleLines(tpl).length;
  const f = bundleFigures(tpl);
  const used = bundleUses(tpl);
  const cats = lines.map(x=> itemCategory(x.it));
  const chips = lines.slice(0, 3).map(({ it, qty })=>
    `<span class="ch" style="${aisleTint(itemCategory(it))}">${categoryIconSVG(itemCategory(it))} <span>${esc(shortName(it.name, 2))}</span> <b>×${fmtNum(Number(it.packQty) > 0 && qty % Number(it.packQty) === 0 ? qty / Number(it.packQty) : qty)}</b></span>`).join('');
  return `<div class="ax-bd">
    <div class="ax-bd-h">${aisleStackHTML(cats.slice(0, 3), cats.length - 3)}
      <span class="b"><span class="nm">${esc(tpl.name)}</span><span class="s"><b>${n}</b> item${n===1?'':'s'} · ${used ? `in <b>${used}</b> order${used===1?'':'s'}` : 'not used yet'}</span></span>
      <span class="r"><b>${fmtNum(f.total)}</b>${f.yours > 0 ? `<span class="y">+${fmtNum(f.yours)}</span>` : ''}</span></div>
    ${chips ? `<div class="ax-bd-c">${chips} ${lines.length > 3 ? `<span class="ch more">+${lines.length - 3}</span>` : ''}</div>` : ''}
    ${f.gone ? `<div class="ax-bd-gone">${AX_ICON.warn}${f.gone} no longer in the shop</div>` : ''}
    <div class="ax-bd-a">${n - f.gone > 0 ? `<button type="button" class="go" data-solution-id="${esc(tpl.id)}">${PH.plus}Add all <b>${n - f.gone}</b></button>` : `<span class="none">Nothing in it is sold now</span>`}
      <button type="button" class="ed" data-bundle-edit="${esc(tpl.id)}" aria-label="Edit ${esc(tpl.name)}">${AX_ICON.pencil}</button></div>
  </div>`;
}

/* Rename it, take items out, or delete it. */
function openBundleEdit(tpl, onDone){
  let items = (Array.isArray(tpl.line_items) ? tpl.line_items : []).slice();
  const rows = ()=> items.map((li, i)=>{
    const it = catalogEntry(li.productId, li.variantIdx == null || li.variantIdx === '' ? null : Number(li.variantIdx));
    return `<div class="ax-bs-li" style="${aisleTint(it ? itemCategory(it) : '')}"><span class="sq">${categoryIconSVG(it ? itemCategory(it) : '')}</span><span class="nm">${esc(it ? it.name : 'No longer in the shop')}</span><span class="q">${it ? esc(itemQtyLabel(it, li.qty)) : ''}</span>
      <button type="button" class="x" data-rm="${i}" aria-label="Take it out">${AX_ICON.x}</button></div>`;
  }).join('');
  const sheet = openSheet(`<button type="button" class="ax-grab" data-close aria-label="Close"></button>
    <div class="ax-sheet-title"><h3>Edit bundle</h3><button type="button" class="ax-iconbtn" data-close aria-label="Close">${AX_ICON.x}</button></div>
    <div class="ax-form">
      <label class="ax-field ax-bs-name">${PH.stack}<input type="text" data-name value="${esc(tpl.name)}" aria-label="Bundle name"></label>
      <div class="ax-bs-pv" data-rows>${rows()}</div>
      <button type="button" class="btn btn-dark btn-block" data-save>Save changes</button>
      <button type="button" class="ax-bs-del" data-del>${AX_ICON.trash}Delete this bundle</button>
    </div>`, { label:'Edit bundle' });
  sheet.el.addEventListener('click', async (e)=>{
    const rm = e.target.closest('[data-rm]');
    if(rm){ items.splice(Number(rm.dataset.rm), 1); sheet.el.querySelector('[data-rows]').innerHTML = rows(); return; }
    const save = e.target.closest('[data-save]'), del = e.target.closest('[data-del]');
    if(!save && !del) return;
    const btn = save || del;
    if(btn.disabled) return;
    btn.disabled = true;
    try{
      if(del || !items.length){
        const { error } = await sb.from('solution_templates').delete().eq('id', tpl.id);
        if(error) throw error;
        solutionTemplates = solutionTemplates.filter(s=> s !== tpl);
        toast('Bundle deleted');
      } else {
        const name = sheet.el.querySelector('[data-name]').value.trim() || tpl.name;
        const { data, error } = await sb.from('solution_templates').update({ name, line_items: items }).eq('id', tpl.id).select().single();
        if(error) throw error;
        Object.assign(tpl, data || { name, line_items: items });
        toast('Bundle saved');
      }
      sheet.close();
      if(onDone) onDone();
    }catch(err){
      btn.disabled = false;
      toast(`Could not save: ${err.message||err}`);
    }
  });
}
async function loadSolutionIntoCart(tpl){
  const lineItems = Array.isArray(tpl.line_items) ? tpl.line_items : [];
  if(!lineItems.length){ toast('This bundle has no items'); return; }
  toast('Adding items…');
  let added = 0;
  for(const li of lineItems){
    const it = catalogEntry(li.productId, li.variantIdx==null ? null : Number(li.variantIdx));
    if(!it) continue;
    const line = await addCatalogLine(it, { unit:'unit', displayQty: Number(li.qty)||1, quiet:true });
    if(line) added++;
  }
  toast(added ? `Added ${added} item${added===1?'':'s'}` : 'Could not add this bundle — its items may no longer be listed');
  switchTab('order');
}

/* ================= THE SHOP, TO REACH =================
   Its name, phone and address, as the shop typed them for its own
   receipts. Agents cannot read the shop's settings, so agent-catalog
   hands over just these three. Kept on the phone so an agent with no
   signal can still ring it. An empty object means none on file -- and
   every Shop button stays hidden rather than dialling nothing. */
let shopInfo = null;
try{ const v = JSON.parse(localStorage.getItem('agentShopInfo') || 'null'); if(v && typeof v === 'object') shopInfo = v; }catch(_e){}
let shopInfoAsked = null;
function ensureShopInfo(){
  if(shopInfoAsked) return shopInfoAsked;
  shopInfoAsked = callAgentFn('agent-catalog', { action: 'shop' }).then(r=>{
    const sh = (r && r.shop) || {};
    shopInfo = { name: sh.name || '', phone: sh.phone || '', address: sh.address || '', pin: sh.pin && Number.isFinite(Number(sh.pin.lat)) ? { lat: Number(sh.pin.lat), lng: Number(sh.pin.lng) } : null };
    try{ localStorage.setItem('agentShopInfo', JSON.stringify(shopInfo)); }catch(_e){}
    return shopInfo;
  }).catch(()=>{ if(shopInfo == null) shopInfo = {}; shopInfoAsked = null; return shopInfo; });
  return shopInfoAsked;
}
const waNumber = (p)=> String(p || '').replace(/[^\d]/g, '').replace(/^0(?=7)/, '256');

function orderClient(o){
  return agentClients.find(x=> String(x.id) === String(o.agentClientId)) || { id: o.agentClientId, name: 'Client' };
}

/* ---- Shop: call or WhatsApp it ----
   Most often about one order -- "did you get it?" -- so the order is
   named and the message is already written. */
function openShopSheet(orderId){
  const o = orderId != null ? myOrders.find(x=> String(x.id) === String(orderId)) : null;
  const sh = shopInfo || {};
  const c = o ? orderClient(o) : null;
  const n = o ? (o.items || []).length : 0;
  const texts = o ? {
    got: `Hi, I've just sent order #${o.id} for ${c.name} (${n} item${n === 1 ? '' : 's'}). Please confirm you've got it.`,
    other: `Hi, about order #${o.id} for ${c.name}: `,
  } : { other: 'Hi, ' };
  let why = o ? 'got' : 'other';
  const sheet = openSheet(`<button type="button" class="ax-grab" data-close aria-label="Close"></button>
    <div class="ax-shop">
      <div class="ax-shop-h"><span class="ic">${AX_ICON.store}</span>
        <span class="b"><span class="n">${esc(sh.name || 'The shop')}</span><span class="s m">${esc(sh.phone || '')}</span></span>
        <button type="button" class="ax-iconbtn" data-close aria-label="Close">${AX_ICON.x}</button></div>
      ${o ? `<div class="ax-about">${avHTML(c, 'sm')}<span class="b"><span class="n">About order #${esc(o.id)}</span><span class="s m">${esc(c.name)} · ${n} item${n === 1 ? '' : 's'} · ${fmtNum(orderTotal(o))}</span></span></div>
        <div class="ax-seg2" role="group" aria-label="What about">
          <button type="button" data-why="got" aria-pressed="true">Did you get it?</button>
          <button type="button" data-why="other" aria-pressed="false">Something else</button>
        </div>` : ''}
      <div class="ax-chatbg"><label class="ax-bub"><textarea rows="3" data-msg aria-label="Message to the shop">${esc(texts[why])}</textarea></label></div>
      <div class="ax-row2 ax-shop-go">
        <a class="btn btn-dark" href="tel:${esc(sh.phone || '')}">${AX_ICON.phone}Call</a>
        <button type="button" class="btn ax-wa" data-wa>${AX_ICON.whatsapp}WhatsApp</button>
      </div>
    </div>`, { label: 'The shop', white: true, kind: 'shop' });
  const msg = sheet.el.querySelector('[data-msg]');
  sheet.el.addEventListener('click', (e)=>{
    const w = e.target.closest('[data-why]');
    if(w){
      why = w.dataset.why;
      sheet.el.querySelectorAll('[data-why]').forEach(b=> b.setAttribute('aria-pressed', String(b === w)));
      msg.value = texts[why];
      if(why === 'other'){ msg.focus(); msg.setSelectionRange(msg.value.length, msg.value.length); }
      return;
    }
    if(e.target.closest('[data-wa]')) window.open(`https://wa.me/${waNumber(sh.phone)}?text=${encodeURIComponent(msg.value.trim())}`, '_blank');
  });
  return sheet;
}

/* ---- Receipt ----
   What the client will get, shown before it goes: the same rows the image
   is drawn from, so what the shop charges never appears. While the shop is
   still checking, it says the total may change. */
function receiptFile(rows, clientName, ref){
  const canvas = drawReceiptCanvas(rows, clientName, ref);
  const filename = `quote-${String(clientName || 'client').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'client'}.png`;
  return new Promise(res=> canvas.toBlob(blob=> res({ blob, filename, file: new File([blob], filename, { type: 'image/png' }) }), 'image/png'));
}
async function sendReceipt(o, how, ready){
  const c = orderClient(o);
  const rows = orderReceiptRows(o);
  if(!rows.length) return;
  const r = ready || await receiptFile(rows, c.name, o.id);
  const text = `Here is your receipt, ${firstWord(c.name)}`;
  const done = await handOverImage(r, { save: how === 'save', title: 'Receipt', text });
  if(done === 'shared' || done === 'cancelled') return;
  // Where the phone cannot hand an image to WhatsApp, the image is saved
  // and the chat opened beside it, so attaching it is one tap.
  if(how === 'wa') window.open(`https://wa.me/${waNumber(c.phone)}?text=${encodeURIComponent(text)}`, '_blank');
  else toast(done === 'failed' ? 'Could not save the receipt' : done === 'documents' ? 'Receipt saved to your Documents' : 'Receipt saved');
}
function openReceiptSheet(orderId){
  const o = myOrders.find(x=> String(x.id) === String(orderId));
  if(!o) return null;
  const c = orderClient(o);
  const rows = orderReceiptRows(o);
  const total = rows.reduce((s,r)=> s + r.amount, 0);
  const sheet = openSheet(`<button type="button" class="ax-grab" data-close aria-label="Close"></button>
    <div class="ax-sheet-title"><h3>Receipt</h3><button type="button" class="ax-iconbtn" data-close aria-label="Close">${AX_ICON.x}</button></div>
    <div class="ax-sheet-pad">
      <div class="ax-rcpt-bg"><div class="ax-rcpt">

   Where their order is, in their words, ready to send and editable

function updateMessage(o, c){
  const st = orderStage(o);
  const said = { checking:'is being checked at the shop', pay:'is confirmed', queued:'is confirmed', packing:'is being packed',
    ready:'is packed and ready', out:'is on its way to you', done:'has been delivered', settle:'has been delivered', cancelled:'was cancelled' }[st.key] || 'is with the shop';
  const n = (o.items||[]).length;
  let text = `Hello ${firstWord(c.name)}, your order of ${n} item${n===1?'':'s'} (UGX ${fmtNum(orderTotal(o))}) ${said}.`;
  if(st.key === 'checking'){
    const k = orderCheckCount(o);
    if(k.ok) text += ` ${k.ok} of ${k.all} ${k.ok === 1 ? 'is' : 'are'} confirmed so far.`;

function openUpdateSheet(orderId){

/* ================= THANK YOU =================
   An order done is worth a moment: what it earned, where it puts the
   month, and the obvious next thing -- the same client again. */
// The month's ring filling from where it stood to where this order puts
// it -- the one picture of what finishing an order did.
function growRingSVG(from, to){
  const R = 37.5, C = 2 * Math.PI * R;
  const a = Math.min(1, Math.max(0, from)) * C, b = Math.min(1, Math.max(0, to)) * C;
  return `<svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="${R}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/>
    ${b > 0 ? `<circle class="grow" cx="42" cy="42" r="${R}" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" transform="rotate(-90 42 42)" style="--a:${a.toFixed(1)}px;--b:${b.toFixed(1)}px;" stroke-dasharray="${b.toFixed(1)} ${C.toFixed(1)}"/>` : ''}</svg>`;
}
function openThankYou(orderId){
  const o = myOrders.find(x=> String(x.id) === String(orderId));
  if(!o) return null;

  const p = monthPicture(now);
  const inThisMonth = key === p.key;
  const after = inThisMonth && p.aim > 0 ? Math.max(0, p.earned / p.aim) : null;
  const before = after != null ? Math.max(0, (p.earned - earned) / p.aim) : null;
  const streak = computeSellingStreak();

  const cad = clientCadence(c, clientOrderCounts(), now);
  const back = cad ? new Date(cad.lastDate.getTime() + Math.round(cad.avgGapDays) * 86400000) : null;
  const pct = (f)=> Math.round(Math.min(1, f) * 100);
  const confetti = Array.from({ length: 26 }, (_, i)=> `<i style="left:${(i * 37) % 100}%;animation-delay:${(i % 9) * 0.11}s;animation-duration:${2.2 + (i % 5) * 0.35}s;background:${['#6FDCB0','#F5B26B','#FFFFFF','#E8EBF0','#C93A30'][i % 5]};"></i>`).join('');

    <div class="in">

      <div class="hero">
        <span class="tick"><b>${AX_ICON.check}</b></span>
        <span class="t">Thank you, ${esc(firstWord(myAgent.name || ''))}</span>
        <span class="who">${avHTML(c, 'sm')}<span>${esc(possessive(firstWord(c.name)))} order is complete</span></span>
      </div>
      <div class="card earn">
        ${after != null ? `<span class="ring">${growRingSVG(before, after)}<b>${pct(after)}%</b></span>` : ''}
        <span class="b"><span class="v">${fmtSigned(earned)}</span>
          <span class="s">added to ${esc(monthName(key))}${after != null ? ` · ${pct(before)}% → ${pct(after)}% of goal` : ''}</span></span>
      </div>
      <div class="badges">
        ${streak >= 2 ? `<span class="card fire">${AX_ICON.flame}${streak}-week streak</span>` : ''}

      </div>
      ${back ? `<div class="card back"><span class="ic">${AX_ICON.bell}</span><span class="b"><b>${esc(firstWord(c.name))} reorders about every ${Math.round(cad.avgGapDays)} days</b>
        <span>${back > now ? `Back on Today around ${esc(back.toLocaleDateString('en-GB', { day:'numeric', month:'short' }))}` : 'Due for their next one now'}</span></span></div>` : ''}
      <span style="flex:1;"></span>

/* ================= WITHIN REACH =================
   What is not yours yet but could be this month: what the baskets would
   earn once sent, and the bonuses that land when live orders finish --
   drawn on the same ring as Today, so it reads as "the rest of the ring". */
function nearPicture(){
  const sendRows = [];
  const seen = new Set();
  const addBasket = (key, rows)=>{
    if(!rows || !rows.length || seen.has(rows)) return;
    seen.add(rows);
    const profit = rows.reduce((s,it)=>{ const f = cartLineFigures(it); return s + (f.profit > 0 ? f.profit : 0); }, 0);
    const client = key == null ? null : agentClients.find(c=> String(c.id) === String(key)) || null;
    if(profit > 0) sendRows.push({ key, client, count: rows.length, profit });
  };
  Object.keys(carts).forEach(k=> addBasket(k, carts[k]));
  addBasket(null, unnamedCart);
  const key = currentMonthKey();
  const bonusRows = monthEarnings(key).orders.filter(o=> o.status !== 'completed' && !o.voided)
    .map(o=> ({ o, bonus: orderEarnings(o).bonus })).filter(x=> x.bonus > 0);
  return { sendRows, bonusRows,
    toSend: sendRows.reduce((s,r)=> s + r.profit, 0), bonus: bonusRows.reduce((s,r)=> s + r.bonus, 0) };
}
function openNearSheet(){
  closeSheetsOfKind('near');
  const sheet = openSheet('', { label:'Within reach', kind:'near', full:true, refresh: ()=> paint() });
  function paint(){
    const p = monthPicture(new Date());
    const n = nearPicture();
    const near = n.toSend + n.bonus;
    const aim = p.aim > 0 ? p.aim : Math.max(1, p.earned + near);
    const ring = ringSVG(112, 12, [
      { frac: p.earned / aim, color:'#FFFFFF', round:true },
      { frac: n.toSend / aim, color:'#F5B26B' },
      { frac: n.bonus / aim, color:'#6FDCB0' },
    ], 'rgba(255,255,255,.10)');
    const row = (av, name, pill, v, attrs)=> `<button type="button" class="ax-nrow" ${attrs}>${av} <span class="b"><span class="n">${esc(name)}</span>${pill}</span><span class="v m">+${fmtNum(v)}</span>${AX_ICON.chevR}</button>`;
    const sendList = n.sendRows.map(r=> row(r.client ? avHTML(r.client) : `<span class="ax-av">?</span>`, r.client ? r.client.name : 'Not yet named',
      `<span class="ax-pill warn sm">Basket · ${r.count} item${r.count === 1 ? '' : 's'}</span>`, r.profit, `data-basket="${esc(r.key == null ? '' : r.key)}"`)).join('');
    const bonusList = n.bonusRows.map(({ o, bonus })=>{
      const st = orderStage(o);
      return row(avHTML(orderClient(o)), orderClient(o).name, orderBadgeHTML(o, st), bonus, `data-track="${esc(o.id)}"`);
    }).join('');
    const nOrders = n.sendRows.length + n.bonusRows.length;
    sheet.el.innerHTML = `
      <div class="ax-sheet-top">
        <button type="button" class="ax-grab" data-close aria-label="Close"></button>
        <div class="ax-sheet-h" style="justify-content:space-between;"><span class="n">Within reach</span>
          <button type="button" class="ax-iconbtn on-navy" data-close aria-label="Close">${AX_ICON.x}</button></div>
        <div class="ax-near">
          <span class="ax-ring sm">${ring}<span class="ax-ring-c">${p.aim > 0 ? `<span class="p">${Math.round(Math.min(9.99, (p.earned + near) / p.aim) * 100)}%</span><span class="d">if all land</span>` : `<span class="p">${esc(fmtCompactUGX(p.earned + near))}</span>`}</span></span>
          <span class="b"><span class="v m">+${fmtNum(near)}</span><span class="s">not yours yet · ${nOrders} order${nOrders === 1 ? '' : 's'}</span>
            <span class="ax-key"><span><i style="background:#fff;"></i>Yours <b class="m">${esc(fmtCompactUGX(p.earned))}</b></span><span><i style="background:#F5B26B;"></i>To send</span><span><i style="background:#6FDCB0;"></i>Bonus</span></span></span>
        </div>

      <div class="ax-sheet-pad">
        ${n.sendRows.length ? `<div class="ax-grp"><i style="background:#F5B26B;"></i><span>Send it</span><b class="m">+${fmtNum(n.toSend)}</b></div><div class="ax-card ax-list">${sendList}</div>` : ''}
        ${n.bonusRows.length ? `<div class="ax-grp"><i style="background:#6FDCB0;"></i><span>Bonus when it finishes</span><b class="m">+${fmtNum(n.bonus)}</b></div><div class="ax-card ax-list">${bonusList}</div>` : ''}

  });
  paint();

}

/* ================= STANDING =================
   Where you are among the shop's agents this month (places, never their

function openStandingSheet(){
  closeSheetsOfKind('standing');
  const sheet = openSheet('', { label:'Standing', kind:'standing', full:true, refresh: ()=> paint() });
  function paint(){
    const lb = leaderboard && leaderboard.you && leaderboard.totalAgents >= 2 ? leaderboard : null;
    const streak = computeSellingStreak();
    const key = currentMonthKey();
    const podium = lb ? (lb.top || []).slice(0, 5).map((a, i)=> `<span class="col${a.isYou ? ' you' : ''}"><span class="nm">${esc(a.isYou ? 'You' : a.displayName)}</span><span class="bar" style="height:${100 - i * 12}px;">${esc(a.rank)}</span></span>`).join('') : '';
    const youInTop = lb && (lb.top || []).some(a=> a.isYou);
    const gap = lb && lb.you.gapToNext != null ? Number(lb.you.gapToNext) : null;
    // Eight weeks, oldest first; this week dashed until it has a sale.
    const weeks = [];
    const done = new Set(myOrders.filter(o=> !o.voided && o.status === 'completed' && orderDate(o)).map(o=> weekKey(new Date(orderDate(o) + 'T00:00:00'))));
    const start = weekStart(new Date());
    for(let i = 7; i >= 0; i--){ const d = new Date(start); d.setDate(d.getDate() - i * 7); weeks.push(d); }

    const wk = weeks.map((d, i)=>{
      const on = done.has(weekKey(d));

      const lab = now ? 'now' : d.getMonth() !== prevMonth ? d.toLocaleDateString('en-GB', { month:'short', day:'numeric' }) : String(d.getDate());

      return `<span class="w${on ? ' on' : ''}${now && !on ? ' now' : ''}"><i>${AX_ICON.flame}</i><em>${esc(lab)}</em></span>`;

      </div>

        ${lb ? (gap != null && gap > 0
          ? `<div class="ax-card ax-togo"><span class="ic">${AX_ICON.trend}</span><span class="b"><span class="v m">${fmtNum(gap)}</span><span class="s">more earned puts you at #${esc(lb.you.rank - 1)}</span></span>

          : lb.you.rank === 1 ? `<div class="ax-card ax-togo"><span class="ic gold">${AX_ICON.trophy}</span><span class="b"><span class="v">Top this month</span><span class="s">keep it there</span></span></div>` : '') : ''}

        </div>

  }
  sheet.el.addEventListener('click', (e)=>{ if(e.target.closest('[data-sell]')){ sheet.close(); switchTab('order'); } });

function orderReceiptRows(o){
  const goods = orderShopGoods(o);
  const charges = (o.charges||[]).map(ch=> ({ qty: '1', name: ch.label || 'Delivery', variant: '', rate: chargeValue(ch, goods), amount: chargeValue(ch, goods) }))

    const amount = (Number(it.agentSellPrice)||0) * (Number(it.qty)||0);
    const dq = it.displayQty != null ? it.displayQty : Number(it.qty)||0;
    return { qty: `${dq} ${it.displayUnit || it.unit || ''}`.trim(), name: it.productName || it.name || '', variant: it.variantLabel || '',
      rate: dq > 0 ? amount / dq : 0, amount };
  }).concat(charges);
}

/* ---- the receipt the client sees ----
   Drawn on a canvas from the rows alone -- never from the screen -- so
   what the shop charges you has no path onto it. A PNG, because that is
   what goes into WhatsApp. */
function drawReceiptCanvas(rows, clientName, ref){
  const rowH = 40, headerH = 122, footerH = 90;
  const w = 640, h = headerH + rows.length*rowH + 70 + footerH;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const sans = (wt, px)=> `${wt} ${px}px Figtree, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif`;
  const mono = (wt, px)=> `${wt} ${px}px 'IBM Plex Mono', ui-monospace, monospace`;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#16203C'; ctx.fillRect(0,0,w,8);
  ctx.fillStyle = '#1C2233'; ctx.font = sans(700, 22);
  ctx.fillText(myAgent.name || 'Omni-Ware', 32, 52);
  ctx.fillStyle = '#5F6980'; ctx.font = sans(600, 13);
  ctx.fillText(ref != null ? `Quotation · #${ref}` : 'Quotation', 32, 72);
  ctx.textAlign = 'right';
  ctx.fillText(new Date().toLocaleDateString('en-UG', { day:'numeric', month:'short', year:'numeric' }), w-32, 52);
  ctx.fillText(`For: ${clientName || 'Client'}`, w-32, 72);
  ctx.textAlign = 'left';
  ctx.strokeStyle = '#E6E3DD'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(32,92); ctx.lineTo(w-32,92); ctx.stroke();
  let y = 122;
  ctx.fillStyle = '#6B7480'; ctx.font = sans(700, 11);
  ctx.fillText('QTY', 32, y); ctx.fillText('ITEM', 120, y);
  ctx.textAlign = 'right'; ctx.fillText('RATE', w-190, y); ctx.fillText('AMOUNT', w-32, y); ctx.textAlign = 'left';
  y += 14;
  ctx.beginPath(); ctx.moveTo(32,y); ctx.lineTo(w-32,y); ctx.stroke();
  let total = 0;
  rows.forEach(r=>{
    total += r.amount;
    y += rowH;
    ctx.fillStyle = '#1C2233'; ctx.font = mono(600, 13);
    ctx.fillText(r.qty, 32, y);
    ctx.font = sans(700, 13.5);
    ctx.fillText(r.name.length > 34 ? r.name.slice(0, 33) + '…' : r.name, 120, y);
    if(r.variant){ ctx.font = sans(500, 11.5); ctx.fillStyle = '#5F6980'; ctx.fillText(r.variant, 120, y+16); }
    ctx.fillStyle = '#1C2233'; ctx.font = mono(600, 13);
    ctx.textAlign = 'right'; ctx.fillText(fmtAmount(r.rate), w-190, y); ctx.fillText(fmtAmount(r.amount), w-32, y); ctx.textAlign = 'left';
    ctx.strokeStyle = '#EFECE6';
    ctx.beginPath(); ctx.moveTo(32,y+22); ctx.lineTo(w-32,y+22); ctx.stroke();
  });
  y += 50;
  ctx.strokeStyle = '#1C2233'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(32,y); ctx.lineTo(w-32,y); ctx.stroke();
  y += 30;
  ctx.fillStyle = '#1C2233'; ctx.font = sans(700, 14); ctx.fillText('TOTAL', 32, y);
  ctx.textAlign = 'right'; ctx.font = mono(600, 18); ctx.fillText('UGX ' + fmtAmount(total), w-32, y); ctx.textAlign = 'left';
  y += 44;
  ctx.fillStyle = '#6B7480'; ctx.font = sans(500, 11.5);
  ctx.fillText('Thank you for your business.', 32, y);
  return canvas;
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}
/* Handing a picture on -- to WhatsApp, Status, anywhere -- or keeping it.
   A browser shares it with the phone's own share sheet, or downloads it.
   Inside the phone app neither works: a WebView has no share sheet and
   ignores a download, so a button there did nothing at all. The app
   writes the picture to the phone and hands it to the share sheet
   through its Share plugin instead; an app installed before that plugin
   keeps the picture in Documents rather than losing it.
   Called straight from the tap, with the picture already drawn, so the
   browser still counts the share as the tap's own. Says what happened:
   shared, cancelled, documents, downloaded or failed. */
function nativePlugins(){
  const C = window.Capacitor;
  return C && typeof C.isNativePlatform === 'function' && C.isNativePlatform() ? (C.Plugins || {}) : null;
}
function blobBase64(blob){
  return new Promise((ok, fail)=>{
    const fr = new FileReader();
    fr.onload = ()=> ok(String(fr.result).split(',')[1] || '');
    fr.onerror = ()=> fail(fr.error);
    fr.readAsDataURL(blob);
  });
}
async function handOverImage(r, opts){
  opts = opts || {};
  const P = nativePlugins();
  if(P){
    if(!P.Filesystem) return 'failed';
    try{
      const data = await blobBase64(r.blob);
      if(P.Share && !opts.save){
        const { uri } = await P.Filesystem.writeFile({ path: r.filename, data, directory: 'CACHE' });
        try{ await P.Share.share({ files: [uri], text: opts.text || undefined, title: opts.title || undefined, dialogTitle: opts.title || 'Share' }); return 'shared'; }
        catch(err){ return /cancel/i.test(String((err && err.message) || err)) ? 'cancelled' : 'failed'; }
      }
      await P.Filesystem.writeFile({ path: r.filename, data, directory: 'DOCUMENTS', recursive: true });
      return 'documents';
    }catch(err){ console.warn('Could not hand the picture over:', err); return 'failed'; }
  }
  if(!opts.save && navigator.canShare && navigator.canShare({ files: [r.file] })){
    const share = { files: [r.file] };
    if(opts.text) share.text = opts.text;
    if(opts.title) share.title = opts.title;
    try{ await navigator.share(share); return 'shared'; }
    catch(err){ if(err && err.name === 'AbortError') return 'cancelled'; }
  }
  downloadBlob(r.blob, r.filename);
  return 'downloaded';
}
/* ================= CLIENTS ================= */
let clientFilter = 'all';
/* Where a client stands, as one coloured line and a ring: late, due,
   an order on the way, or how long until they are due. */
function clientStatus(c, counts, today, liveBy){
  const live = liveBy.get(String(c.id));
  const orders = (counts.get(c.id)||[]).filter(o=> !o.voided);
  const cad = clientCadence(c, counts, today);
  if(live){
    const st = orderStage(live);
    const words = { checking:'Shop is checking', pay:'Waiting for your payment', queued:'Confirmed', packing:'Being packed',
      ready:'Ready to collect', out:'On the way', settle:'Settle with the shop' }[st.key] || st.title;
    return { rank: 2, cls: st.needs ? 'late' : 'live', text: words, icon: AX_ICON[st.needs === 'pay' ? 'cash' : st.key === 'out' ? 'truck' : st.key === 'ready' ? 'store' : 'box'], frac: 0, tone:'' };
  }
  if(!orders.length) return { rank: 5, cls:'', text:'New', frac: 0, tone:'' };
  if(!cad) return { rank: 4, cls:'', text:`Ordered ${daysAgoLabel(clientStats(orders).lastAt).toLowerCase()}`, frac: 0, tone:'' };
  const gap = lateBy(cad);
  const frac = cad.daysSince / Math.max(1, cad.avgGapDays);
  if(cad.daysSince >= 60) return { rank: 6, cls:'', text:`Quiet · ${Math.round(cad.daysSince)} days`, frac: 1, tone:'', quiet:true };
  if(gap > 0) return { rank: 0, cls:'late', text:`${gap} day${gap===1?'':'s'} late`, frac: 1, tone:'late', late: gap, due:true };
  if(gap === 0) return { rank: 1, cls:'due', text:'Due today', frac: 1, tone:'due', due:true };
  return { rank: 3, cls:'', text:`in ${-gap} day${gap===-1?'':'s'}`, frac, tone: frac >= 0.8 ? 'due' : '', soon: -gap };
}
