    + ((myInquiries||[]).length ? chip('asked', `${AX_ICON.chat}Asked${askedN ? ` <b>${askedN}</b>` : ''}`) : '')
    + (quietN ? chip('quiet', `<span class="dot q"></span>Quiet <b>${quietN}</b>`) : '');
  renderInquiries();
  renderQuietClients(document.getElementById('ag_clientListSearch').value.trim());

  const wrap = document.getElementById('ag_clientsListWrap');
  const q = document.getElementById('ag_clientListSearch').value.trim().toLowerCase();
  if(clientFilter === 'asked'){ wrap.innerHTML = ''; return; }
  let rows = all.filter(x=> clientMatchesQuery(x.c, q));
  if(clientFilter === 'due') rows = rows.filter(x=> x.s.due);
  if(clientFilter === 'quiet') rows = rows.filter(x=> x.s.quiet);
  rows.sort((a,b)=> a.s.rank - b.s.rank || (b.s.late||0) - (a.s.late||0) || (a.s.soon||0) - (b.s.soon||0)
    || String(b.stats.lastAt||'').localeCompare(String(a.stats.lastAt||'')) || String(a.c.name||'').localeCompare(String(b.c.name||'')));
  const add = q && !agentClients.some(c=> String(c.name||'').trim().toLowerCase() === q)
    ? `<button type="button" class="ax-cr add" data-client-add><span class="ax-av">${AX_ICON.plus}</span><span class="b"><span class="nm">Add &ldquo;${esc(document.getElementById('ag_clientListSearch').value.trim())}&rdquo;</span><span class="st">New client</span></span></button>` : '';
  if(!agentClients.length){
    wrap.innerHTML = `<button type="button" class="ax-cr add" data-client-add><span class="ax-av">${AX_ICON.plus}</span><span class="b"><span class="nm">Add your first client</span><span class="st">Name and phone</span></span></button>`;
    return;
  }
  wrap.innerHTML = add + rows.map(({ c, s, stats })=>
    `<button type="button" class="ax-cr" data-client-open="${esc(c.id)}">
      ${ringAvHTML(c, s.frac, s.tone)}
      <span class="b"><span class="nm" title="${esc(c.name)}">${esc(c.name)}</span><span class="st ${s.cls}">${s.icon || ''}${esc(s.text)}</span></span>
      ${stats.earned > 0 ? `<span class="v">${esc(fmtCompactUGX(stats.earned))}</span>` : ''}
    </button>`).join('') + (!rows.length && !add ? `<div class="ax-empty">No client matches &ldquo;${esc(q)}&rdquo;.</div>` : '');
}

/* Requests from the agent's shop link. Answered on WhatsApp, ticked off
   when handled -- and a tick can be taken back, so a mis-tap never loses
   a lead. */
function renderInquiries(){
  const wrap = document.getElementById('ag_inquiriesWrap');
  if(!wrap) return;
  const { open, list } = inquiriesForDisplay();
  const asked = clientFilter === 'asked';
  const rows = asked ? list : (clientFilter === 'all' ? open.slice(0, 2) : []);
  if(!rows.length){ wrap.innerHTML = asked ? '<div class="ax-empty">Nobody has asked through your link yet.</div>' : ''; return; }
  wrap.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;">
    <div class="ax-sec"><h2 style="font-size:15px;">Asked through your link</h2>${open.length ? `<span class="n ag-inquiry-count">${open.length}</span>` : ''}</div>
    ${rows.map(inq=>{
    const product = inquiryProductLabel(inq);
    const phone = String(inq.customer_phone||'').replace(/[^\d+]/g,'');
    const handled = !!inq.handled_at;
    const text = `Hello ${firstWord(inq.customer_name||'')}, thanks for asking. How can I help?`;
    return `<div class="ag-inquiry-card${handled?' handled':''}" data-inq="${esc(inq.id)}">
      <div class="ag-inquiry-top">
        <span class="ax-nx-ic">${AX_ICON.chat}</span>
        <span class="ag-inquiry-who"><span class="ag-inquiry-name">${esc(inq.customer_name||'Someone')}</span>
          <span class="ag-inquiry-meta">${esc(inquiryAgoLabel(inq.created_at))}${product ? ' · ' + esc(product) : ''}</span></span>
        <button type="button" class="ag-inquiry-done" data-inq="${esc(inq.id)}" aria-pressed="${handled}" aria-label="${handled ? 'Undo' : 'Done'}">${AX_ICON.check}</button>
      </div>
      <div class="ax-bubble">${inq.message ? esc(inq.message) : 'No details given — just asked to be contacted.'}</div>
      ${phone ? `<div class="ag-inquiry-acts">
        <a class="btn btn-dark" href="https://wa.me/${esc(phone.replace(/^\+/, ''))}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">${AX_ICON.chat}Reply</a>
        <a class="btn btn-ghost" href="tel:${esc(phone)}" aria-label="Call ${esc(inq.customer_name||'')}">${AX_ICON.phone}Call</a>
      </div>` : ''}
    </div>`;
  }).join('')}</div>`;
  wrap.querySelectorAll('.ag-inquiry-done').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleInquiryHandled(Number(btn.dataset.inq)));
  });
}

/* ================= ONE CLIENT ================= */
function openClientSheet(clientId){
  const id = String(clientId);
  const sheet = openSheet('', { label:'Client', kind:'client', full:true, refresh: ()=> paint() });
  function paint(){
    const c = agentClients.find(x=> String(x.id) === id);
    if(!c){ sheet.close(); return; }
    const counts = clientOrderCounts(), today = new Date();
    const orders = (counts.get(c.id) || []).filter(o=> !o.voided);
    const stats = clientStats(orders);
    const cad = clientCadence(c, counts, today);
    const liveBy = new Map(liveOrders().filter(o=> String(o.agentClientId) === id).map(o=> [id, o]));
    const s = clientStatus(c, counts, today, liveBy);
    const regs = clientRegulars(orders).slice(0, 5);
    const phone = String(c.phone||'').replace(/[^\d]/g, '');
    let rhythm;
    if(cad){
      const ll = lateLabel(cad);
      const dueOn = new Date(cad.lastDate.getTime() + Math.round(cad.avgGapDays) * 86400000);
      rhythm = `<div class="ax-rhythm">
        <div class="h"><span>Orders every ${Math.round(cad.avgGapDays)} days</span><b class="${ll.tone==='warn' ? '' : 'good'}">${esc(ll.text)}</b></div>
        ${dayBlocksHTML(cad)}
        <div class="ax-days-l"><span style="flex:1;">${esc(dateShort(cad.lastDateKey))}</span><span style="flex:1;text-align:center;">due ${esc(dueOn.toLocaleDateString('en-GB',{day:'numeric',month:'short'}))}</span><span style="flex:1;text-align:right;">today</span></div>
      </div>`;
    } else {
      rhythm = `<div class="ax-rhythm"><div class="h"><span>${stats.count ? `Ordered once · ${esc(dateShort(stats.lastAt))}` : 'No orders yet'}</span><b class="good">${stats.count ? 'rhythm after 2 orders' : ''}</b></div></div>`;
    }
    const sorted = orders.slice().sort((a,b)=> String(orderDate(b)||'').localeCompare(String(orderDate(a)||''))).slice(0, 6);
    sheet.el.innerHTML = `
      <div class="ax-sheet-top">
        <button type="button" class="ax-grab" data-close aria-label="Close"></button>
        <div class="ax-sheet-h">${ringAvHTML(c, s.frac, s.tone)}
          <span class="b"><span class="n" title="${esc(c.name)}">${esc(c.name)}</span><span class="s">${esc([c.location, c.phone].filter(Boolean).join(' · ') || 'No phone on file')}</span></span>
          ${c.phone ? `<a class="ax-iconbtn on-navy" href="tel:${esc(c.phone)}" aria-label="Call ${esc(c.name)}">${AX_ICON.phone}</a>` : ''}
          ${phone ? `<a class="ax-iconbtn on-navy" href="https://wa.me/${esc(phone)}" target="_blank" rel="noopener" aria-label="Message on WhatsApp">${AX_ICON.chat}</a>` : ''}
        </div>
        ${rhythm}
        <div class="ax-stats">
          <div><span class="k">Yours so far</span><span class="v good">${fmtCompactUGX(stats.earned)}</span></div>
          <div><span class="k">Typical order</span><span class="v">${stats.count ? fmtCompactUGX(Math.round(medianOf(orders.map(orderTotal)))) : '—'}</span></div>
          <div><span class="k">Orders</span><span class="v">${stats.count}</span></div>
        </div>
      </div>
      <div class="ax-sheet-pad">
        ${regs.length ? `<div class="ax-sec"><h2 style="font-size:15px;">Their usual</h2></div>
        <div class="ax-card" style="padding:4px 14px;">${regs.map(r=>{
          const it = catalogEntry(r.productId, r.variantIdx);
          const qty = usualQty(r.qtys);
          const share = stats.count ? Math.min(1, r.orders / stats.count) : 0;
          return `<button type="button" class="ax-ur" data-regular="${esc(r.key)}" aria-label="Add ${esc(r.name)} to their order">
            <span class="ax-th">${itemThumbHTML(it || { name: r.name })}</span>
            <span class="b"><span class="nm">${esc(r.name)}</span>
              <span class="ax-freq"><span class="bar"><i style="width:${Math.round(share*100)}%;"></i></span>${r.orders >= stats.count ? 'every order' : `${r.orders} of ${stats.count}`}</span></span>
            <span class="q">${fmtNum(qty)}<span>${esc(r.unit||'')}</span></span>
          </button>`;
        }).join('')}</div>` : ''}
        ${sorted.length ? `<div class="ax-sec"><h2 style="font-size:15px;">Orders</h2><span class="n">${stats.count}</span></div>
        <div class="ax-card" style="padding:4px 14px;">${sorted.map(o=>{
          const d = orderDate(o);
          const dt = d ? new Date(d+'T00:00:00') : null;
          const e = orderEarnings(o);
          const earned = e.margin + (o.status === 'completed' ? e.bonus : 0);
          const st = orderStage(o);
          return `<button type="button" class="ax-po${st.needs ? ' needs' : ''}" data-track="${esc(o.id)}">
            <span class="ax-date"><b>${dt ? dt.getDate() : '—'}</b><span>${dt ? esc(dt.toLocaleDateString('en-GB',{month:'short'})) : ''}</span></span>
            <span class="b"><span class="t">${fmtNum(orderTotal(o))}</span>${earned ? `<span class="e">${fmtSigned(earned)} yours</span>` : ''}</span>
            ${orderBadgeHTML(o, st)}
          </button>`;
        }).join('')}</div>` : ''}
        <div style="height:64px;"></div>
      </div>
      <div class="ax-cta-dock"><button type="button" class="btn btn-dark btn-block" data-start>${regs.length ? 'Order their usual' : 'Start an order'}${AX_ICON.chevR}</button></div>`;
  }
  sheet.el.addEventListener('click', async (e)=>{
    const c = agentClients.find(x=> String(x.id) === id);
    if(!c) return;
    const t = e.target.closest('[data-track]');
    if(t){ openTrackSheet(t.dataset.track); return; }
    if(e.target.closest('[data-start]')){
      sheet.close();
      closeSheetsOfKind('client');
      const orders = (clientOrderCounts().get(c.id) || []).filter(o=> !o.voided);
      if(clientRegulars(orders).length) orderUsual(c);
      else { goToClientBasket(c); switchTab('order'); }
      return;
    }
    const reg = e.target.closest('[data-regular]');
    if(reg){
      const r = clientRegulars((clientOrderCounts().get(c.id) || []).filter(o=> !o.voided)).find(x=> x.key === reg.dataset.regular);
      if(!r) return;
      goToClientBasket(c);
      if(lineFor(cart, r.productId, r.variantIdx) < 0){
        if(!catalog.length) await ensureBrowseDataLoaded();
        await addRegular(r);
      }
      closeSheetsOfKind('client');
      switchTab('order');
    }
  });
  paint();
  return sheet;
}

/* ================= MONEY =================
   The month, what makes it up, how it compares, what is waiting to be
   claimed, where you stand -- and, at the foot, who you are signed in as. */
let moneyMonth = null;
function openMoneySheet(month){
  moneyMonth = month || currentMonthKey();
  closeSheetsOfKind('money');
  const sheet = openSheet('', { label:'Your money', kind:'money', full:true, refresh: ()=> paint() });
  function paint(){
    const key = moneyMonth;
    const thisMonth = key === currentMonthKey();
    const { margin, bonus, total, orders } = monthEarnings(key);
    const target = Number(myGoals && myGoals.monthly_target) || 0;
    const parts = Math.max(1, Math.abs(margin) + Math.abs(bonus));
    // Six months, anchored to today; the selected one is dark.
    const months = [];
    for(let i = TREND_MONTHS - 1; i >= 0; i--) months.push(shiftMonth(currentMonthKey(), -i));
    const stats = months.map(m=> monthEarnings(m));
    const max = Math.max(...stats.map(x=> x.total), target, 1);
    const H = 100;
    const bars = months.map((m,i)=>{
      const empty = !stats[i].orders.length;
      const h = Math.max(3, Math.round(Math.max(0, stats[i].total) / max * H));
      return `<button type="button" class="ax-bar${m===key?' sel':''}" data-month="${esc(m)}" aria-pressed="${m===key}" aria-label="${esc(monthLabel(m))}, ${empty ? 'no orders' : esc(fmtUGX(stats[i].total))}">
        <span class="v">${empty ? '—' : esc(fmtCompactUGX(stats[i].total))}</span>${empty ? '<span class="none"></span>' : `<span class="b" style="height:${h}px;"></span>`}</button>`;
    }).join('');
    const tline = target > 0 ? `<div class="ax-tline" style="bottom:${Math.round(target / max * H) + 18}px;"><span>goal ${esc(fmtCompactUGX(target))}</span></div>` : '';
    const claimCard = (m, amt)=>{
      const claim = findClaim(m);
      const right = !claim ? `<button type="button" class="btn btn-accent" data-claim="${esc(m)}">Claim</button>`
        : claim.status === 'paid' ? `<span class="ax-pill good">${AX_ICON.check}Paid</span>` : `<span class="ax-pill soft">${AX_ICON.clock}Claimed</span>`;
      return `<div class="ax-card ax-claim"><span class="ic">${AX_ICON.cash}</span>
        <span class="b"><span class="k">${esc(monthName(m))} bonus</span><span class="v">${fmtNum(amt)}</span></span>${right}</div>`;
    };
    const claimMonths = [];
    if(!thisMonth && bonus > 0) claimMonths.push([key, bonus]);
    if(thisMonth){
      for(let k = 1; k <= 3; k++){
        const m = shiftMonth(key, -k), b = monthEarnings(m).bonus;
        if(b > 0 && !findClaim(m)) claimMonths.push([m, b]);
      }
    }
    // Where you stand: rank among agents (never their money), and the
    // nearest milestone as a ring.
    const lb = leaderboard && leaderboard.you && leaderboard.totalAgents >= 2 ? leaderboard : null;
    const streak = computeSellingStreak();
    const all = computeAchievements();
    const next = all.filter(a=> !a.unlocked).map(a=> ({ ...a, frac: a.target ? a.current / a.target : 0 })).sort((a,b)=> b.frac - a.frac)[0] || null;
    const podium = lb ? Array.from({ length: Math.min(6, lb.totalAgents) }, (_, i)=>{
      const rank = i + 1;
      return `<i class="${rank === lb.you.rank ? 'you' : ''}" style="height:${Math.max(18, 100 - i * 14)}%;"></i>`;
    }).join('') : '';
    const standing = `<div class="ax-standing">
      <div class="ax-card">${lb
        ? `<span class="ax-rank"><b>#${esc(lb.you.rank)}</b><span>of ${esc(lb.totalAgents)}</span></span><span class="ax-podium" aria-hidden="true">${podium}</span>`
        : `<span class="ax-rank"><b>${esc(computeAgentStats().completedOrders)}</b><span>orders done</span></span>`}
        ${streak >= 2 ? `<span class="ax-streak">${AX_ICON.flame}${streak} weeks running</span>` : ''}</div>
      <div class="ax-card ax-mile">${next ? `<span class="ring">${ringSVG(56, 6, [{ frac: Math.min(1, next.frac), color:'#0F6B43', round:true }], '#F1EEE8')}<span class="ic">${ACHIEVEMENT_ICONS[next.id] || ACHIEVEMENT_ICONS.first_sale}</span></span>
        <span class="b"><span class="v">${esc(milestoneKind(next) === 'money' ? fmtCompactUGX(next.current) : next.current)}/${esc(milestoneTargetLabel(next))}</span><span class="k">${esc(milestoneUnit(next))}</span></span>`
        : `<span class="b"><span class="v">All 9</span><span class="k">milestones</span></span>`}</div>
    </div>`;
    const sortedOrders = orders.slice().sort((a,b)=> String(orderDate(b)||'').localeCompare(String(orderDate(a)||'')));
    sheet.el.innerHTML = `
      <div class="ax-sheet-top">
        <button type="button" class="ax-grab" data-close aria-label="Close"></button>
        <div class="ax-sheet-h" style="justify-content:space-between;">
          <span class="ax-mnav">
            <button type="button" class="ax-iconbtn on-navy" data-mnav="-1" aria-label="Previous month">${AX_ICON.chevL}</button>
            <span>${esc(monthName(key))}</span>
            <button type="button" class="ax-iconbtn on-navy" data-mnav="1" aria-label="Next month"${thisMonth ? ' disabled style="opacity:.3;"' : ''}>${AX_ICON.chevR}</button>
          </span>
          <button type="button" class="ax-iconbtn on-navy" data-close aria-label="Close">${AX_ICON.x}</button>
        </div>
        <div class="ax-big"><span class="k">Yours ${thisMonth ? 'this month' : 'in ' + esc(monthName(key))}</span><span class="v">${fmtNum(total)}</span></div>
        ${thisMonth ? `<button type="button" class="ax-goalbtn" data-goal>${target ? `goal <b>${fmtNum(target)}</b>` : 'Set a goal'}${AX_ICON.pencil}</button>` : ''}
        <div class="ax-split">
          <div class="ax-split-bar" aria-hidden="true"><i class="mg" style="width:${Math.round(Math.max(0, margin) / parts * 100)}%;"></i><i class="bn" style="width:${Math.round(Math.max(0, bonus) / parts * 100)}%;"></i></div>
          <div class="ax-split-l"><span><i style="background:#fff;"></i>Margin <b>${fmtNum(margin)}</b></span><span><i style="background:#F5B26B;"></i>Bonus <b>${fmtNum(bonus)}</b></span></div>
        </div>
      </div>
      <div class="ax-sheet-pad">
        <div class="ax-card" style="padding:12px 14px;">
          <div class="ax-bars">${tline}${bars}</div>
          <div class="ax-bars-x">${months.map(m=> `<span class="${m===key?'sel':''}">${esc(monthName(m).slice(0,3))}</span>`).join('')}</div>
          ${!months.includes(key) ? `<p class="ax-said" style="margin:8px 0 0;">${esc(monthLabel(key))} is before this window.</p>` : ''}
        </div>
        ${claimMonths.map(([m,b])=> claimCard(m, b)).join('')}
        ${standing}
        ${orders.length ? `<button type="button" class="ax-sharemonth" data-sharemonth="${esc(key)}"><span class="ic">${AX_ICON.share}</span><span class="b"><span class="t">Share my ${esc(monthName(key))}</span><span class="s">A picture for your WhatsApp Status</span></span>${AX_ICON.chevR}</button>` : ''}
        ${sortedOrders.length ? `<div class="ax-card" style="padding:4px 14px;">${sortedOrders.slice(0, 12).map(o=>{
          const c = agentClients.find(x=> String(x.id) === String(o.agentClientId));
          const e = orderEarnings(o);
          const counted = o.status === 'completed';
          const st = orderStage(o);
          return `<button type="button" class="ax-mo ax-po${st.needs ? ' needs' : ''}" data-track="${esc(o.id)}"><span class="b"><span class="nm">${esc(c ? c.name : 'Client')}</span><span class="s">${esc(dateShort(orderDate(o)))} · <span class="v-in">${fmtSigned(e.margin + (counted ? e.bonus : 0))}</span>${!counted && e.bonus ? ` +${fmtNum(e.bonus)} bonus when done` : ''}</span></span>
            ${orderBadgeHTML(o, st)}</button>`;
        }).join('')}</div>` : `<div class="ax-empty">No orders in ${esc(monthName(key))}.</div>`}
      </div>`;
  }
  sheet.el.addEventListener('click', (e)=>{
    const nav = e.target.closest('[data-mnav]');
    if(nav){
      const nextKey = shiftMonth(moneyMonth, Number(nav.dataset.mnav));
      if(nextKey > currentMonthKey()) return;
      moneyMonth = nextKey; paint(); return;
    }
    const bar = e.target.closest('[data-month]');
    if(bar){ moneyMonth = bar.dataset.month; paint(); return; }
    if(e.target.closest('[data-goal]')){ openGoalSheet({ edit: true }); return; }
    const claim = e.target.closest('[data-claim]');
    if(claim){ submitClaim(claim.dataset.claim, claim); return; }
    const t = e.target.closest('[data-track]');
    if(t){ openTrackSheet(t.dataset.track); return; }
  });
  paint();
  if(!feedClaimsLoaded) loadMyClaims().then(()=>{ feedClaimsLoaded = true; if(sheet.el.isConnected) paint(); });
  ensureLeaderboardLoaded();
  return sheet;
}
// The terms that govern every order this agent places. Only the shop
// sets them, and an unknown one is admitted rather than guessed at --
// telling a prepay agent they pay on delivery would be worse than silence.
function termCardHTML(){
  const term = PAYMENT_TERM_COPY[myAgent.paymentTerm];
  if(!term){
    const ask = 'Ask the shop how your orders are settled';
    return `<div class="ax-termc" id="ag_termCard"><span class="ic">${AX_ICON.cash}</span><span class="b"><span class="n">${ask}</span></span></div>`;
  }
  const prepay = myAgent.paymentTerm === 'prepay';
  return `<div class="ax-termc${prepay ? ' warn' : ''}" id="ag_termCard"><span class="ic">${term.icon}</span>
    <span class="b"><span class="n">${prepay ? 'Prepay' : 'Pay on delivery'}</span><span class="s">${esc(term.title)} · set by the shop</span></span></div>`;
}
// What this phone holds, and how old it is. It is the only copy when there
// is no signal, and signing out deletes it, so it sits beside the button.
function renderSyncCard(){
  const card = document.getElementById('ag_syncCard');
  if(!card) return;
  const line = card.querySelector('[data-sync]');
  const cached = ownCachedSnapshot();
  const when = cached && cached.savedAt ? inquiryAgoLabel(cached.savedAt) : '';
  const stale = isOffline || dataLooksSuspect;
  card.classList.toggle('warn', stale);
  if(!cached){
    line.textContent = 'Nothing is saved on this phone yet';
    return;
  }
  line.textContent = stale ? `Working from the copy saved ${when}` : `Saved on this phone ${when}`;
}
async function submitClaim(monthKey, btn){
  if(btn) btn.disabled = true;
  try{
    const res = await callAgentFn('agent-claim-commission', { month: monthKey });
    myClaims = myClaims.filter(c=>c.month!==monthKey).concat([res.claim]);
    refreshOpenSheets();
    if(currentView === 'today') renderNext();
    toast('Claim submitted');
  }catch(err){
    toast(isNetworkError(err) ? "You're offline -- couldn't submit this claim" : `Could not submit claim: ${err.message||err}`);
    if(btn) btn.disabled = false;
  }
}

/* ---- the goal ----
   A number the agent picks for themselves. The shop never reads it, and
   the sheet says so, because an honest number is the only useful one.
   With a goal set, the sheet is about getting there: how far along, ahead
   of or behind the month's pace, the day he crosses it at the pace he is
   on, and which clients' next orders would close the gap. Changing the
   number is one tap on it. */
function goalFigures(now, goal){
  const key = currentMonthKey();
  const cur = monthEarnings(key);
  const target = Math.max(0, Number(goal) || 0);
  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const day = now.getDate();
  const earned = cur.total;
  const left = Math.max(0, target - earned);
  // His pace so far against the pace the goal asks for, both per day.
  const pace = Math.max(0, earned) / day;
  const need = target / dim;
  const ahead = need > 0 ? Math.round((earned - need * day) / need) : 0;
  const finishDay = left <= 0 ? day : pace > 0 ? day + left / pace : Infinity;
  return { key, cur, target, dim, day, earned, left, pace, ahead, finishDay, days: dim - day };
}
// The clients whose own rhythm brings them back before the month ends,
// soonest first, until their usual orders cover what is left.
function goalGapClients(left, now, daysLeft){
  const counts = clientOrderCounts();
  const rows = [];
  agentClients.forEach(c=>{
    const cad = clientCadence(c, counts, now);
    if(!cad || !(cad.avgMargin > 0) || cad.daysSince >= 60) return;
    const dueIn = cad.avgGapDays - cad.daysSince;
    if(dueIn > daysLeft) return;
    rows.push({ client: c, cad, earn: Math.round(cad.avgMargin), dueIn });
  });
  rows.sort((a,b)=> a.dueIn - b.dueIn);
  const pick = [];
  let sum = 0;
  for(const r of rows){
    if(sum >= left || pick.length >= 4) break;
    pick.push(r);
    sum += r.earn;
  }
  return { pick, sum };
}
// One plain screen: what is earned against the goal, one sentence on
// where the month is heading, the goal itself as a field with two picks
// from his own numbers, and the clients due back who would add to it.
// A new number is kept the moment he picks a chip or leaves the field.
function openGoalSheet(opts){
  closeSheetsOfKind('goal');
  const key = currentMonthKey();
  const prev = shiftMonth(key, -1);
  const prevTotal = monthEarnings(prev).total;
  const round = (n)=> Math.max(10000, Math.round(n / 10000) * 10000);
  const g0 = goalFigures(new Date(), 0);
  const paceEnd = (g)=> g.earned + g.pace * g.days;
  // Two picks, both his own numbers: where today's pace ends the month,
  // and what last month came to. No history, no picks.
  const presets = [];
  if(g0.earned > 0) presets.push({ l: 'Your pace', v: round(paceEnd(g0)) });
  if(prevTotal > 0 && !presets.some(p=> p.v === round(prevTotal))) presets.push({ l: monthName(prev), v: round(prevTotal) });
  let saved = Number(myGoals && myGoals.monthly_target) || 0;
  let value = saved;
  const sheet = openSheet(`<div class="ax-sheet-top">
      <button type="button" class="ax-grab" data-close aria-label="Close"></button>
      <div class="ax-sheet-h" style="justify-content:space-between;">
        <span class="ax-ghead"><b>${esc(monthName(key))}</b><small data-left></small></span>
        <button type="button" class="ax-iconbtn on-navy" data-close aria-label="Close">${AX_ICON.x}</button>
      </div>
      <div class="ax-gnow"><span class="v m" data-earned></span><span class="of" data-of></span></div>
      <div class="ax-gbar" data-bar role="img"><i></i></div>
      <div class="ax-gsay" data-say></div>
    </div>
    <div class="ax-sheet-pad">
      <div class="ax-card ax-gset">
        <label class="ax-gfield"><span class="k">Your goal</span>
          <span class="in"><span class="cur">UGX</span><input type="text" inputmode="numeric" id="ag_goalInput" class="m" autocomplete="off" placeholder="Type a goal" aria-label="Your goal for ${esc(monthName(key))}"><span class="pen" aria-hidden="true">${AX_ICON.pencil}</span></span></label>
        ${presets.length ? `<div class="ax-gchips">${presets.map((p,i)=>
          `<button type="button" data-preset="${i}" aria-pressed="false"><span class="l">${esc(p.l)}</span><span class="v m">${esc(fmtCompactUGX(p.v))}</span></button>`).join('')}</div>` : ''}
      </div>
      <div data-below></div>
    </div>`, { label:'Your goal', kind:'goal', full:true, refresh: ()=> paint() });
  const input = document.getElementById('ag_goalInput');
  function paint(){
    const now = new Date();
    const g = goalFigures(now, value);
    const reached = g.target > 0 && g.left <= 0;
    sheet.el.querySelector('[data-left]').textContent = g.days > 0 ? `${g.days} day${g.days === 1 ? '' : 's'} left` : 'Last day';
    sheet.el.querySelector('[data-earned]').textContent = fmtNum(g.earned);
    sheet.el.querySelector('[data-of]').textContent = g.target > 0 ? `of ${fmtNum(g.target)} goal` : 'earned this month';
    const pct = g.target > 0 ? Math.max(0, Math.min(100, g.earned / g.target * 100)) : 0;
    const bar = sheet.el.querySelector('[data-bar]');
    bar.classList.toggle('done', reached);
    bar.setAttribute('aria-label', g.target > 0 ? `${Math.floor(pct)}% of your goal` : 'No goal set');
    bar.firstElementChild.style.width = `${pct.toFixed(1)}%`;
    const say = !(g.target > 0) ? { tone:'', text: 'Set a goal below' }
      : reached ? { tone:'good', text: `Goal reached · +${fmtNum(g.earned - g.target)} over` }
      : g.finishDay <= g.dim ? { tone:'good', text: `On track · you reach it around ${monthName(g.key).slice(0,3)} ${Math.ceil(g.finishDay)}` }
      : g.pace > 0 ? { tone:'warn', text: `At this pace: about ${fmtNum(round(paceEnd(g)))} by the ${g.dim}${g.dim === 31 ? 'st' : 'th'}` }
      : { tone:'warn', text: 'Nothing earned yet this month' };
    const sayEl = sheet.el.querySelector('[data-say]');
    sayEl.className = `ax-gsay ${say.tone}`;
    sayEl.textContent = say.text;
    sheet.el.querySelectorAll('[data-preset]').forEach(b=>{
      const on = presets[Number(b.dataset.preset)].v === value;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    // Who is due back and what their usual order adds -- the way to move
    // the number, one tap from ordering it.
    let due = '';
    if(!reached){
      const { pick } = goalGapClients(g.target > 0 ? g.left : Infinity, now, g.days);
      if(pick.length) due = `<div class="ax-card ax-gdue"><div class="h">Due back soon</div><div class="ax-grows">${pick.slice(0, 3).map(r=>{
          const ll = lateLabel(r.cad);
          return `<button type="button" class="ax-grow" data-usual="${esc(r.client.id)}">
            ${ringAvHTML(r.client, Math.min(1, r.cad.daysSince / Math.max(1, r.cad.avgGapDays)), ll.tone === 'warn' ? 'late' : ll.tone === 'good' ? 'due' : '')}
            <span class="b"><span class="n" title="${esc(r.client.name)}">${esc(r.client.name)}</span><span class="s ${ll.tone}">${esc(ll.text)}</span></span>
            <span class="v">+${fmtNum(r.earn)}</span><span class="go">${AX_ICON.chevR}</span></button>`;
        }).join('')}</div></div>`;
    }
    sheet.el.querySelector('[data-below]').innerHTML = due;
  }
  async function keep(){
    if(!(value > 0) || value === saved) return;
    const v = value;
    try{
      await saveAgentGoal(v, goalPerDay(v, new Date()));
      saved = v;
      openSheets.forEach(s=>{ if(s !== sheet && s.refresh) s.refresh(); });
      if(currentView === 'today') renderTodayHero();
      toast('Goal set');
    }catch(err){
      toast("Couldn't save that just now -- try again in a moment");
    }
  }
  input.value = value > 0 ? fmtNum(value) : '';
  paint();
  input.addEventListener('input', ()=>{
    value = Number(String(input.value).replace(/[^\d]/g, '')) || 0;
    input.value = value > 0 ? fmtNum(value) : '';
    try{ input.setSelectionRange(input.value.length, input.value.length); }catch(_e){}
    paint();
  });
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') input.blur(); });
  input.addEventListener('change', keep);
  sheet.el.addEventListener('click', (e)=>{
    const p = e.target.closest('[data-preset]');
    if(p){
      value = presets[Number(p.dataset.preset)].v;
      input.value = fmtNum(value);
      paint();
      keep();
      return;
    }
    const u = e.target.closest('[data-usual]');
    if(u){
      const c = agentClients.find(x=> String(x.id) === u.dataset.usual);
      if(!c) return;
      closeSheetsOfKind('money');
      sheet.close();
      orderUsual(c);
    }
  });
  if((opts && opts.edit) || !(saved > 0)) setTimeout(()=>{ if(input.isConnected){ input.focus(); input.select(); } }, 60);
  return sheet;
}

/* ================= STAYING LIVE =================
   "Live" on Today means it. Everything is re-read when the app comes back
   to the front and every couple of minutes while it is open. On top of
   that, while something is actually changing -- an order the shop is
   checking or waiting on payment, or an order's own page open -- just the
   orders still moving are re-read every few seconds, so a supplier's yes
   lands as a tick while the agent is looking, with nothing to pull or
   reload. What changed is said once, in a word, and the tick pops in. */
let lastRefreshAt = Date.now();
let lastLiveAt = Date.now();
const LIVE_FAST_MS = 12000;
async function refreshLive(){
  if(isOffline || !currentShopId) return;
  lastRefreshAt = lastLiveAt = Date.now();
  try{
    const before = myOrders.slice();
    await loadAgentHomeData();
    saveOfflineCache();
    noteOrderNews(before, myOrders);
    ensureShoutouts(true);
    if(currentView === 'today' || currentView === 'clients') renderCurrentView();
    else refreshOpenSheets();
  }catch(_e){ /* the next tick tries again */ }
}
// Lines that have just been ticked, so their tick can pop in rather than
// simply be there: keyed order|product|variant, kept for a few seconds.
const freshTicks = new Map();
function lineKey(o, it){ return `${o.id}|${it.productId}|${it.variantIdx == null ? '' : it.variantIdx}`; }
function tickIsFresh(o, it){ const at = freshTicks.get(lineKey(o, it)); return !!at && Date.now() - at < 5000; }
function noteOrderNews(before, after){
  const was = new Map(before.map(o=> [String(o.id), o]));
  const ticked = [], moved = [];
  after.forEach(n=>{
    const o = was.get(String(n.id));
    if(!o || o.voided) return;
    (n.items || []).forEach(it=>{
      const prev = (o.items || []).find(x=> String(x.productId) === String(it.productId) && String(x.variantIdx == null ? '' : x.variantIdx) === String(it.variantIdx == null ? '' : it.variantIdx));
      if(lineCheck(n, it).state === 'ok' && (!prev || lineCheck(o, prev).state !== 'ok')){
        freshTicks.set(lineKey(n, it), Date.now());
        ticked.push({ n, it });
      }
    });
    const a = orderStage(o), b = orderStage(n);
    if(a.key !== b.key) moved.push({ n, st: b });
  });
  if(moved.length){
    const { n, st } = moved[0];
    const c = agentClients.find(x=> String(x.id) === String(n.agentClientId));
    toast(`${c ? firstWord(c.name) : 'Order #' + n.id}: ${st.key === 'pay' ? 'checked — ready to pay' : st.title.toLowerCase()}`, 3200, { tone: st.tone === 'warn' ? 'warn' : 'good' });
  } else if(ticked.length){
    toast(ticked.length === 1 ? `${shortName(ticked[0].it.productName || ticked[0].it.name || 'Item', 3)} confirmed` : `${ticked.length} items confirmed`, 2600, { tone: 'good' });
  }
}
// Only the orders still moving, and only their rows -- a handful of rows
// rather than the whole account.
async function refreshLiveOrders(){
  const ids = liveOrders().map(o=> o.id);
  if(!ids.length || isOffline || !currentShopId) return;
  lastLiveAt = Date.now();
  try{
    const { data, error } = await sb.from('saved_quotes').select('*').eq('shop_id', currentShopId).in('id', ids);
    if(error || !Array.isArray(data)) return;
    const fresh = new Map(data.map(r=> [String(r.id), mapOrderRow(r)]));
    const before = myOrders.slice();
    let changed = false;
    myOrders = myOrders.map(o=>{
      const n = fresh.get(String(o.id));
      if(!n || JSON.stringify(n) === JSON.stringify(o)) return o;
      changed = true;
      return n;
    });
    if(!changed) return;
    saveOfflineCache();
    noteOrderNews(before, myOrders);
    if(currentView === 'today') renderToday();
    refreshOpenSheets();
  }catch(_e){ /* the next tick tries again */ }
}
// Something worth watching closely: an order the shop is still checking
// or waiting on, or an order (or a stage of them) open on screen.
function liveIsBusy(){
  if(openSheets.some(s=> s.kind === 'track' || s.kind === 'stage')) return true;
  return liveOrders().some(o=>{ const k = orderStage(o).key; return k === 'checking' || k === 'pay' || k === 'queued'; });
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && Date.now() - lastRefreshAt > 30000) refreshLive();
});
setInterval(()=>{
  if(document.hidden) return;
  if(Date.now() - lastRefreshAt > 110000){ refreshLive(); return; }
  if(liveIsBusy() && Date.now() - lastLiveAt > LIVE_FAST_MS) refreshLiveOrders();
}, 4000);

async function boot(){
  updateOfflineBanner();
  try{
    await ensureAgentAuth();
  }catch(e){
    console.error('Failed to start app:', e);
    const el = ensureAuthOverlay();
    el.innerHTML = `<div style="color:#f66;font-family:inherit;max-width:400px;text-align:center;padding:0 20px;">Couldn't load your account: ${esc((e && e.message) || e)}. Reload to try again.</div>`;
    return;
  }
  /* Applied only when the row was actually read: a cached boot carries
     whatever was true at the last sign-in, and a stale PAUSED would lock a
     working agent out with no way to disprove it. */
  setAgentPaused(!bootedFromCache && myAgent && myAgent.paused);
  try{
    await loadAgentHomeData();
    // Not awaited: a goal is motivational, and failing to fetch one must
    // not send the agent down the cached-snapshot path.
    loadAgentGoals().then(()=>{ if(currentView === 'today') renderTodayHero(); });
    saveOfflineCache();
    // GUARD 3 -- a fetch without errors is still not proof the data is
    // real. Only a load that was not flagged suspect clears these.
    if(!dataLooksSuspect){
      isOffline = false;
      bootedFromCache = false;
    } else {
      bootedFromCache = true;
    }
    updateOfflineBanner();
  }catch(e){
    console.error('Failed to load home data, falling back to cached snapshot:', e);
    const cached = ownCachedSnapshot();
    if(cached){
      agentClients = cached.agentClients || [];
      myOrders = cached.myOrders || [];
      catalog = cached.catalog || [];
      promotions = cached.promotions || [];
      cluster = cached.cluster || [];
      solutionTemplates = cached.solutionTemplates || [];
      clusterWaitDays = cached.clusterWaitDays != null ? cached.clusterWaitDays : null;
      browseDataLoaded = catalog.length > 0;
      bootedFromCache = true;
    }
    isOffline = true;
    updateOfflineBanner();
  }
  restoreQuoteDraft();
  updateCartBadge();
  let savedTab = null;
  try{ savedTab = localStorage.getItem('agentLastTab'); }catch(_e){}
  // A tapped notification opens here with ?open=<where it points>; the
  // old ?open=feed is Today now.
  const openParam = new URLSearchParams(location.search).get('open');
  switchTab(openParam ? 'today' : TABS.includes(savedTab) ? savedTab : 'today');
  document.body.classList.remove('app-loading');
  if(openParam && openParam !== 'feed' && openParam !== 'today') routePush(openParam);
  startAgentPush();
  setTimeout(maybeCelebrateGoal, 1200);
}
/* ================= CHANGING AN ORDER =================
   Where the order has got to decides what can still be done to it, and
   the sheet shows that as the six steps with three spans under them:
   up to paying it is the agent's to change, once paid (or once the shop
   has started) they ask the shop, and once it is done it is a return.
   The server holds the same line (agent-change-order,
   agent-submit-order's replaceOrderId) -- this only draws it. */
const CANCEL_REASONS = ['Client changed their mind', 'Wrong items or quantities', 'Taking too long', 'Something else'];
function changeZone(o){
  if(!o || o.voided || o.agentCancel || o.status === 'completed') return 'none';
  if(o.status === 'draft' && o.agentPaymentStatus !== 'paid' && !(Number(o.amountPaid) > 0)) return 'free';
  return 'ask';
}
function changeAskOpen(o){
  const c = o && o.agentChange;
  return c && c.state === 'asked' ? c : null;
}
// What is left of the credit an order carries -- agent-change-order's
// own sum, so the screen and the server agree about it.
function creditLeftOf(o){
  const c = o && o.agentCredit;
  if(!c) return 0;
  const used = (Array.isArray(c.used) ? c.used : []).reduce((s,u)=> s + (Number(u.amount)||0), 0);
  return Math.max(0, Math.round((Number(c.amount)||0) - used));
}
function agentCreditLeft(exceptId){
  return myOrders.reduce((s,o)=> String(o.id) === String(exceptId) ? s : s + creditLeftOf(o), 0);
}
function changeLineKey(x){
  return `${x && x.productId}::${x == null || x.variantIdx == null ? '' : x.variantIdx}`;
}
/* A line bought by the pack moves a pack at a time, and says so. */
function lineStep(it){
  const dq = Number(it && it.displayQty);
  return dq > 0 && it.displayUnit ? Math.max(1, Math.round((Number(it.qty) || 0) / dq)) : 1;
}
function itemLabel(it){
  const ce = catalogEntry(it.productId, it.variantIdx);
  return `${it.productName || it.name || (ce && ce.name) || 'Item'}${ce && ce.variantLabel ? ` · ${ce.variantLabel}` : ''}`;
}

/* The six steps, and the three spans under them. */
function changeZonesHTML(o){
  const steps = orderSteps(o);
  const st = orderStage(o);
  const here = orderStepIndex(o, st);
  const prepay = !!(myAgent && myAgent.paymentTerm === 'prepay');
  const spans = prepay ? [3, 2, 1] : [2, 2, 2];
  const kinds = ['free', 'ask', 'ret'];
  const zoneOf = (i)=> i < spans[0] ? 'free' : i < spans[0] + spans[1] ? 'ask' : 'ret';
  const tiles = steps.map((s, i)=>{
    const on = i === here, done = i < here;
    return `<span class="ax-zn-s${on ? ' on' : ''}${done ? ' done' : ''} ${zoneOf(i)}"><span class="t">${done ? AX_ICON.check : AX_ICON[s.icon] || AX_ICON.check}</span><span class="l">${esc(s.label)}</span></span>`;
  }).join('');
  const words = { free:'Change freely', ask:'Ask the shop', ret:'Return' };
  const brackets = kinds.map((k, i)=> `<span class="ax-zn-b ${k}" style="grid-column:span ${spans[i]};"><i></i>${words[k]}</span>`).join('');
  return `<div class="ax-zn"><div class="ax-zn-r">${tiles}</div><div class="ax-zn-r">${brackets}</div></div>`;
}
function changeHeadHTML(o, title){
  const c = orderClient(o);
  return `<div class="ax-chh"><span class="b"><span class="k">ORDER #${esc(o.id)} · ${esc(String(c.name || '').toUpperCase())}</span><span class="t">${esc(title)}</span></span>
    <button type="button" class="ax-iconbtn" data-close aria-label="Close">${AX_ICON.x}</button></div>`;
}

/* The way in, from the order's Change button. Before paying there are
   two things to do; after, there is only asking. */
function openChangeSheet(orderId){
  const o = myOrders.find(x=> String(x.id) === String(orderId));
  if(!o) return null;
  const zone = changeZone(o);
  if(zone === 'ask') return openAskSheet(o.id);
  if(zone !== 'free'){ toast('This order can no longer be changed'); return null; }
  const sheet = openSheet(`<button type="button" class="ax-grab" data-close aria-label="Close"></button>
    <div class="ax-sheet-pad">
      ${changeHeadHTML(o, 'Change this order')}
      ${changeZonesHTML(o)}
      <div class="ax-card ax-chlist">
        <button type="button" class="ax-chrow" data-edit><span class="ic">${AX_ICON.pencil}</span>
          <span class="b"><span class="t">Edit items</span><span class="s">Add, remove or change quantities</span></span>${AX_ICON.chevR}</button>
        <button type="button" class="ax-chrow bad" data-cancel><span class="ic">${AX_ICON.x}</span>
          <span class="b"><span class="t">Cancel order</span><span class="s">Nothing is paid yet, so there is no charge</span></span>${AX_ICON.chevR}</button>
      </div>
    </div>`, { label: 'Change this order', white: true, kind: 'change' });
  sheet.el.addEventListener('click', (e)=>{
    if(e.target.closest('[data-edit]')){ sheet.close(); openEditItemsSheet(o.id); }
    else if(e.target.closest('[data-cancel]')){ sheet.close(); openCancelSheet(o.id); }
  });
  return sheet;
}

/* ---- cancel, before paying ---- */
function openCancelSheet(orderId){
  const o = myOrders.find(x=> String(x.id) === String(orderId));
  if(!o) return null;
  const e = orderEarnings(o);
  let reason = CANCEL_REASONS[0], busy = false;
  const sheet = openSheet('', { label: 'Cancel this order', white: true, kind: 'change' });
  const paint = ()=>{
    sheet.el.innerHTML = `<button type="button" class="ax-grab" data-close aria-label="Close"></button>
      <div class="ax-sheet-pad">
        ${changeHeadHTML(o, 'Cancel this order?')}
        <div class="ax-card ax-chfig">
          <span><span class="k">Order</span><span class="v m">${fmtNum(orderTotal(o))}</span></span>
          <span><span class="k">Paid</span><span class="v m good">0</span></span>
          <span><span class="k">You lose</span><span class="v m bad">${fmtNum(Math.max(0, e.margin))}</span></span>
        </div>
        <span class="ax-chlab">REASON · SHARED WITH THE SHOP</span>
        <div class="ax-card ax-chlist" role="radiogroup" aria-label="Why">
          ${CANCEL_REASONS.map(r=> `<button type="button" class="ax-radio" role="radio" aria-checked="${r === reason}" data-reason="${esc(r)}"><i></i>${esc(r)}</button>`).join('')}
        </div>
        <div class="ax-row2">
          <button type="button" class="btn ax-keep" data-close>Keep order</button>
          <button type="button" class="btn ax-kill" data-go${busy ? ' disabled' : ''}>${busy ? 'Cancelling…' : 'Cancel order'}</button>
        </div>
      </div>`;
  };
  sheet.el.addEventListener('click', async (ev)=>{
    const r = ev.target.closest('[data-reason]');
    if(r){ reason = r.dataset.reason; paint(); return; }
    if(!ev.target.closest('[data-go]') || busy) return;
    busy = true; paint();
    try{
      await callAgentFn('agent-change-order', { orderId: o.id, action: 'cancel', reason });
      sheet.close();
      toast('Order cancelled — the shop has been told', 4000, { tone:'good' });
      await loadAgentHomeData();
      renderCurrentView();
      refreshOpenSheets();
    }catch(err){
      busy = false; paint();
      toast(`Could not cancel: ${err.message || err}`, 5000, { tone:'bad' });
    }
  });
  paint();
  return sheet;
}

/* ---- edit the items, before paying ----
   Each line as it stands, with a stepper. A line taken to nothing is
   struck through and can be brought back; a line changed is marked for
   the shop to check again; a line not touched keeps its supplier's yes.
   Sent as a resubmission, priced by the server like any order. */
function openEditItemsSheet(orderId){
  const o = myOrders.find(x=> String(x.id) === String(orderId));
  if(!o) return null;
  const client = orderClient(o);
  // `shop` is what the shop charges the agent for one, so `price - shop`
  // is the agent's own cut -- shown live, since it lands in their earnings.
  const lines = (o.items||[]).map(it=> ({ productId: it.productId, variantIdx: it.variantIdx == null ? null : it.variantIdx,
    name: itemLabel(it), unit: it.displayUnit || it.unit || '', step: lineStep(it), was: Number(it.qty)||0, qty: Number(it.qty)||0,
    price: Number(it.agentSellPrice)||0, shop: Number(it.sellPrice)||0, fresh: false, src: it }));
  let query = '', busy = false, findFocused = false;
  const sheet = openSheet('', { label: 'Edit items', full: true, kind: 'change' });
  const state = (l)=> l.fresh ? 'new' : l.qty === 0 ? 'removed' : l.qty !== l.was ? 'changed' : 'same';
  const typing = ()=> findFocused || !!query.trim();
  const signed = (n)=> `${n < 0 ? '−' : ''}${fmtNum(Math.abs(n))}`;
  const priceHTML = (l, i)=>{
    const known = l.shop > 0;
    const each = l.price - l.shop, total = each * l.qty;
    const tone = !known ? '' : each < 0 ? 'bad' : each === 0 ? '' : 'good';
    const chip = !known ? '' : each < 0 ? `${signed(total)} loss` : each === 0 ? 'Nothing to you' : `+${fmtNum(total)} yours`;
    const last = Math.round(lastRateFor(client, l.productId, l.variantIdx));
    const list = Math.round(Number(l.src && l.src.ourPrice) || 0);
    const sug = (v, k)=> v > 0 ? `<button type="button" class="ax-sug${Math.round(l.price) === v ? ' on' : ''}" data-setprice="${i}:${v}">${k} <b class="m">${fmtNum(v)}</b></button>` : '';
    return `<div class="ax-edpr${tone === 'bad' ? ' loss' : ''}">
        <label class="ax-edpr-f">
          <span class="h"><span class="k">Your price, each${l.unit ? ` ${esc(l.unit)}` : ''}</span>${chip ? `<span class="ax-edearn ${tone}">${chip}</span>` : ''}</span>
          <span class="in"><span class="cur">UGX</span><input type="text" inputmode="numeric" class="m" data-price="${i}" value="${fmtNum(l.price)}" aria-label="Your price for each ${esc(l.unit || 'one')} of ${esc(l.name)}"><span class="pen" aria-hidden="true">${AX_ICON.pencil}</span></span>
        </label>
        ${known ? `<div class="ax-edleg"><span>Shop gets <b class="m">${fmtNum(l.shop)}</b></span><span class="${each < 0 ? 'bad' : 'good'}">${each < 0 ? 'From your pocket' : 'You keep'} <b class="m">${each < 0 ? '' : '+'}${signed(each)}</b></span></div>` : ''}
        ${last > 0 || list > 0 ? `<div class="ax-sugs">${sug(last, `${esc(String(client.name || 'Client').split(/\s+/)[0])} paid last`)}${list !== last ? sug(list, "Shop's list") : ''}</div>` : ''}
      </div>`;
  };
  const paint = ()=>{
    const was = orderTotal(o);
    const now = lines.reduce((s,l)=> s + l.qty * l.price, 0);
    const earnWas = orderEarnings(o).margin;
    const earnNow = lines.reduce((s,l)=> s + l.qty * (l.price - l.shop), 0);
    const recheck = lines.filter(l=> state(l) === 'changed' || state(l) === 'new').length;
    const changed = lines.some(l=> state(l) !== 'same');
    const left = lines.filter(l=> l.qty > 0).length;
    const q = query.trim().toLowerCase();
    const taken = new Set(lines.map(changeLineKey));
    const hits = q.length >= 2 ? catalog.filter(c=> !taken.has(changeLineKey(c)) && `${c.name} ${c.variantLabel||''}`.toLowerCase().includes(q)).slice(0, 6) : [];
    const tag = { changed:`<span class="ax-tag warn">${AX_ICON.clock}Re-check</span>`, new:`<span class="ax-tag warn">${AX_ICON.plus}New</span>`,
      removed:`<span class="ax-tag bad">Removed</span>`, same:'' };
    const was2 = (a, b)=> a !== b ? `<s class="m">${signed(a)}</s>` : '';
    sheet.el.classList.toggle('ax-ed-typing', typing());
    sheet.el.innerHTML = `<div class="ax-sheet-pad ax-ed">
        <div class="ax-chh"><button type="button" class="ax-iconbtn" data-close aria-label="Back">${AX_ICON.chevL}</button>
          <span class="b"><span class="k">ORDER #${esc(o.id)} · ${esc(String(client.name||'').toUpperCase())}</span><span class="t">Edit items</span></span></div>
        <div class="ax-card ax-chlist">
          ${lines.map((l, i)=>{
            const st = state(l);
            const ce = catalogEntry(l.productId, l.variantIdx);
            return `<div class="ax-edl${st === 'removed' ? ' gone' : ''}${l.fresh ? ' fresh' : ''}"><div class="ax-edl-r"><span class="ax-th">${itemThumbHTML(ce || l.src || { name: l.name })}</span>
              <span class="b"><span class="nm">${esc(l.name)}</span><span class="ax-edq">${tag[st]}${l.fresh ? '' : ` <span class="m">${fmtNum(l.qty * l.price || l.was * l.price)}</span>`}</span></span>
              ${st === 'removed'
                ? `<button type="button" class="ax-undo" data-undo="${i}">${AX_ICON.again}Undo</button>`
                : `<span class="ax-step"><button type="button" data-dec="${i}" aria-label="One fewer">${AX_ICON.minus}</button><input type="number" inputmode="numeric" min="0" data-qty="${i}" value="${l.qty / l.step}" aria-label="Quantity of ${esc(l.name)}">${l.step > 1 ? `<span class="u">${esc(l.unit)}</span>` : ''}<button type="button" data-inc="${i}" aria-label="One more">${AX_ICON.plus}</button></span>`}
              </div>${l.fresh ? priceHTML(l, i) : ''}
            </div>`;
          }).join('')}
          <label class="ax-edadd"><span class="ic">${AX_ICON.plus}</span><input type="search" data-find value="${esc(query)}" placeholder="Add an item" aria-label="Add an item"></label>
          ${hits.map(c=>{
            const last = lastRateFor(client, c.productId, c.variantIdx);
            return `<button type="button" class="ax-edhit" data-add="${esc(changeLineKey(c))}"><span class="ax-th">${itemThumbHTML(c)}</span><span class="b"><span class="nm">${esc(c.name)}${c.variantLabel ? ` · ${esc(c.variantLabel)}` : ''}</span><span class="s m">you pay ${fmtNum(c.floorPrice)}${last > 0 ? ` · last ${fmtNum(last)}` : ''}</span></span><span class="go">${AX_ICON.plus}</span></button>`;
          }).join('')}
        </div>
        <div class="ax-ednote">${AX_ICON.clip}Lines you don't touch stay confirmed</div>
      </div>
      ${left ? `<div class="ax-eddock">
        <div class="ax-edfig">
          <span><span class="k">Client pays</span>${was2(was, now)}<b class="m">${fmtNum(now)}</b></span>
          <span class="${earnNow < 0 ? 'bad' : 'good'}"><span class="k">You earn</span>${was2(earnWas, earnNow)}<b class="m">${signed(earnNow)}</b></span>
          <span class="${recheck ? 'warn' : ''}"><span class="k">Shop checks</span><b class="m">${recheck} line${recheck === 1 ? '' : 's'}</b></span>
        </div>
        <button type="button" class="btn btn-dark btn-block ax-gobtn" data-send${!changed || busy ? ' disabled' : ''}>${AX_ICON.send}${busy ? 'Sending…' : changed ? 'Send changes to the shop' : 'Change something to send'}</button>
      </div>` : `<div class="ax-eddock">
        <div class="ax-edzero"><span class="ring" aria-hidden="true"><b class="m">0</b></span>
          <span class="b"><span class="t">Nothing left in this order</span><span class="s m"><s>${fmtNum(was)}</s> → 0</span></span></div>
        <div class="ax-edtwo">
          <button type="button" class="btn btn-dark ax-gobtn" data-addfocus>${AX_ICON.plus}Add an item</button>
          <button type="button" class="btn ax-gobtn ax-killo" data-tocancel>${AX_ICON.trash}Cancel order</button>
        </div>
      </div>`}`;
  };
  const refocus = (sel)=>{ const f = sheet.el.querySelector(sel); if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); } };
  const setQty = (i, v)=>{ const l = lines[i]; if(!l) return; l.qty = Math.max(0, Math.floor(Number(v) || 0)) * l.step; if(l.fresh && l.qty === 0) lines.splice(i, 1); paint(); };
  sheet.el.addEventListener('click', async (ev)=>{
    const b = ev.target.closest('[data-dec],[data-inc],[data-undo],[data-add],[data-setprice],[data-addfocus],[data-send],[data-tocancel]');
    if(!b) return;
    if(b.dataset.dec != null){ const i = Number(b.dataset.dec); setQty(i, lines[i].qty / lines[i].step - 1); return; }
    if(b.dataset.inc != null){ const i = Number(b.dataset.inc); setQty(i, lines[i].qty / lines[i].step + 1); return; }
    if(b.dataset.undo != null){ const l = lines[Number(b.dataset.undo)]; l.qty = l.was; paint(); return; }
    if(b.dataset.setprice != null){ const [i, v] = b.dataset.setprice.split(':').map(Number); if(lines[i]){ lines[i].price = v; paint(); } return; }
    if(b.dataset.addfocus != null){ const f = sheet.el.querySelector('[data-find]'); if(f){ f.scrollIntoView({ block:'center' }); f.focus(); } return; }
    if(b.dataset.add != null){
      const c = catalog.find(x=> changeLineKey(x) === b.dataset.add);
      if(c){
        const price = lastRateFor(client, c.productId, c.variantIdx) || Number(c.ourPrice) || Number(c.floorPrice) || 0;
        lines.push({ productId: c.productId, variantIdx: c.variantIdx == null ? null : c.variantIdx, name: itemLabel(c), unit: c.unit || '', step: 1, was: 0, qty: 1,
          price, shop: Number(c.floorPrice) || 0, fresh: true, src: c });
        query = '';
      }
      paint(); return;
    }
    if(b.dataset.tocancel != null){ sheet.close(); openCancelSheet(o.id); return; }
    if(busy) return;
    busy = true; paint();
    try{
      const res = await callAgentFn('agent-submit-order', {
        replaceOrderId: o.id, agentClientId: o.agentClientId,
        items: lines.filter(l=> l.qty > 0).map(l=> ({ productId: l.productId, variantIdx: l.variantIdx, qty: l.qty, agentSellPrice: l.price })),
        deliveryMode: o.deliveryMode || 'agent_pickup',
        deliveryAddress: o.deliveryMode === 'shop_delivery' ? (o.deliveryAddress || '') : undefined,
        deliveryContact: o.deliveryMode === 'shop_delivery' && o.deliveryContact ? o.deliveryContact : undefined,
        deliveryWhen: o.deliveryMode === 'shop_delivery' && o.deliveryWhen ? o.deliveryWhen : undefined,
      });
      sheet.close();
      const n = lines.filter(l=> state(l) === 'changed' || state(l) === 'new').length;
      toast(res && res.unchanged ? 'Nothing had changed' : n ? `Changes sent — ${n} line${n === 1 ? '' : 's'} back to the shop to check` : 'Changes sent to the shop', 4000, { tone:'good' });
      await loadAgentHomeData();
      renderCurrentView();
      refreshOpenSheets();
    }catch(err){
      busy = false; paint();
      toast(`Could not send the changes: ${err.message || err}`, 5000, { tone:'bad' });
    }
  });
  sheet.el.addEventListener('change', (ev)=>{ if(ev.target.matches('[data-qty]')) setQty(Number(ev.target.dataset.qty), ev.target.value); });
  sheet.el.addEventListener('input', (ev)=>{
    if(ev.target.matches('[data-price]')){
      const i = Number(ev.target.dataset.price);
      if(lines[i]){ lines[i].price = Number(String(ev.target.value).replace(/[^0-9]/g, '')) || 0; paint(); refocus(`[data-price="${i}"]`); }
      return;
    }
    if(!ev.target.matches('[data-find]')) return;
    query = ev.target.value;
    paint();
    refocus('[data-find]');
  });
  // While the agent is looking for an item the keyboard is up, and the
  // dock would sit on top of the results -- so it steps aside.
  sheet.el.addEventListener('focusin', (ev)=>{ if(ev.target.matches('[data-find]')){ findFocused = true; sheet.el.classList.add('ax-ed-typing'); } });
  sheet.el.addEventListener('focusout', (ev)=>{
    if(!ev.target.matches('[data-find]')) return;
    setTimeout(()=>{
      const a = document.activeElement;
      findFocused = !!(a && sheet.el.contains(a) && a.matches('[data-find]'));
      sheet.el.classList.toggle('ax-ed-typing', typing());
    }, 0);
  });
  paint();
  return sheet;
}

/* ---- ask the shop, once paid or started ----
   Fewer of a line, or none of anything. More is a new order: the shop
   has packed or bought for this one, and topping it up would unpick
   that. What an agreed ask takes off a paid order comes back as credit,
   spent on the next one by itself (openPaySheet). */
function openAskSheet(orderId){
  const o = myOrders.find(x=> String(x.id) === String(orderId));
  if(!o) return null;
  const paid = Number(o.amountPaid) > 0 || o.agentPaymentStatus === 'paid';
  const lines = (o.items||[]).map(it=> ({ productId: it.productId, variantIdx: it.variantIdx == null ? null : it.variantIdx,
    name: itemLabel(it), unit: it.displayUnit || it.unit || '', step: lineStep(it), was: Number(it.qty)||0, qty: Number(it.qty)||0, sell: Number(it.sellPrice)||0, src: it }));
  let mode = 'fewer', note = '', busy = false;
  const sheet = openSheet('', { label: 'Ask the shop to change', white: true, kind: 'change' });
  const paint = ()=>{
    const back = mode === 'cancel'
      ? lines.reduce((s,l)=> s + l.was * l.sell, 0)
      : lines.reduce((s,l)=> s + (l.was - l.qty) * l.sell, 0);
    const asking = mode === 'cancel' || lines.some(l=> l.qty < l.was);
    const st = orderStage(o);
    sheet.el.innerHTML = `<button type="button" class="ax-grab" data-close aria-label="Close"></button>
      <div class="ax-sheet-pad">
        ${changeHeadHTML(o, 'Ask the shop to change')}
        ${changeZonesHTML(o)}
        <div class="ax-chwhy">${AX_ICON.lock}${paid ? `Paid and ${st.key === 'packing' ? 'being packed' : 'with the shop'}, so the shop decides` : 'The shop has started on it, so they decide'}</div>
        <div class="ax-seg2" role="group" aria-label="What you are asking">
          <button type="button" data-mode="fewer" aria-pressed="${mode === 'fewer'}">${AX_ICON.minus}Fewer</button>
          <button type="button" data-mode="cancel" aria-pressed="${mode === 'cancel'}">${AX_ICON.x}Cancel it</button>
        </div>
        ${mode === 'fewer' ? `<div class="ax-card ax-chlist">${lines.map((l, i)=> `<div class="ax-edl${l.qty < l.was ? ' cut' : ''}"><span class="ax-th">${itemThumbHTML(catalogEntry(l.productId, l.variantIdx) || l.src)}</span>
            <span class="b"><span class="nm">${esc(l.name)}</span><span class="ax-edq">${l.qty < l.was ? `<span class="ax-tag warn"><s class="m">${l.was / l.step}</s>${AX_ICON.chevR}<b class="m">${l.qty / l.step}</b></span>` : `<span class="m">${l.was / l.step} ${esc(l.unit)} now</span>`}</span></span>
            <span class="ax-step"><button type="button" data-dec="${i}" aria-label="One fewer"${l.qty <= 0 ? ' disabled' : ''}>${AX_ICON.minus}</button><span class="m n">${l.qty / l.step}</span><button type="button" data-inc="${i}" aria-label="One more"${l.qty >= l.was ? ' disabled' : ''}>${AX_ICON.plus}</button></span>
          </div>`).join('')}</div>
          <button type="button" class="ax-newo" data-more>${AX_ICON.basket}Need more? Start a new order${AX_ICON.chevR}</button>` : ''}
        <label class="ax-card ax-chmsg"><span class="ax-chlab">MESSAGE TO THE SHOP</span><textarea rows="2" data-note placeholder="Why, in a line — it helps them say yes">${esc(note)}</textarea></label>
        ${paid && back > 0 ? `<div class="ax-chcredit"><span class="ic">${AX_ICON.again}</span><span class="b"><span class="t">If they agree, <b class="m">${fmtNum(back)}</b> comes back as credit</span><span class="s">used by itself on your next order</span></span></div>` : ''}
        <button type="button" class="btn btn-dark btn-block ax-gobtn" data-send${!asking || busy ? ' disabled' : ''}>${AX_ICON.send}${busy ? 'Sending…' : 'Send request'}</button>
      </div>`;
  };
  sheet.el.addEventListener('click', async (ev)=>{
    const b = ev.target.closest('[data-mode],[data-dec],[data-inc],[data-more],[data-send]');
    if(!b) return;
    if(b.dataset.mode){ mode = b.dataset.mode; paint(); return; }
    if(b.dataset.dec != null){ const l = lines[Number(b.dataset.dec)]; l.qty = Math.max(0, l.qty - l.step); paint(); return; }
    if(b.dataset.inc != null){ const l = lines[Number(b.dataset.inc)]; l.qty = Math.min(l.was, l.qty + l.step); paint(); return; }
    if(b.dataset.more != null){
      const c = agentClients.find(x=> String(x.id) === String(o.agentClientId));
      closeSheetsOfKind('change'); closeSheetsOfKind('track');
      if(c) goToClientBasket(c);
      switchTab('order');
      return;
    }
    if(busy) return;
    busy = true; paint();
    try{
      await callAgentFn('agent-change-order', { orderId: o.id, action: 'ask', cancel: mode === 'cancel', note,
        lines: mode === 'cancel' ? [] : lines.filter(l=> l.qty < l.was).map(l=> ({ productId: l.productId, variantIdx: l.variantIdx, to: l.qty })) });
      sheet.close();
      toast('Sent — the shop decides, and you will see it here', 4000, { tone:'good' });
      await loadAgentHomeData();
      renderCurrentView();
      refreshOpenSheets();
    }catch(err){
      busy = false; paint();
      toast(`Could not send the request: ${err.message || err}`, 5000, { tone:'bad' });
    }
  });
  sheet.el.addEventListener('input', (ev)=>{ if(ev.target.matches('[data-note]')) note = ev.target.value; });
  paint();
  return sheet;
}

/* What the agent asked, on the order itself: waiting, or how it went. */
function askStatusHTML(o){
  const c = o.agentChange;
  if(!c || c.state === 'withdrawn') return '';
  const lines = c.lines || [];
  const what = c.cancel ? 'Cancel the order' : lines.map(l=> `${l.from} → ${l.to} · ${esc(ofShortName(l.name))}`).join(', ');
  if(c.state === 'asked'){
    const done = lines.filter(l=> l.decision).length;
    return `<div class="ax-askst wait"><span class="ic">${AX_ICON.clock}</span>
      <span class="b"><span class="t">You asked: ${what}</span><span class="s">${done ? `${done} of ${lines.length} answered · ` : ''}Waiting for the shop</span></span>
      <button type="button" class="ax-undo" data-withdraw>Withdraw</button></div>`;
  }
  const agreed = lines.filter(l=> l.decision === 'agreed');
  const credit = creditLeftOf(o) + ((o.agentCredit && Array.isArray(o.agentCredit.used)) ? o.agentCredit.used.reduce((s,u)=> s + (Number(u.amount)||0), 0) : 0);
  if(agreed.length){
    return `<div class="ax-askst good"><span class="ic">${AX_ICON.check}</span>
      <span class="b"><span class="t">The shop agreed${agreed.length < lines.length ? ` to ${agreed.length} of ${lines.length}` : ''}</span><span class="s">${credit ? `<b class="m">${fmtNum(credit)}</b> to your credit` : 'The order is changed'}</span></span></div>`;
  }
  return `<div class="ax-askst"><span class="ic">${AX_ICON.x}</span><span class="b"><span class="t">The shop kept it as it was</span><span class="s">${what}</span></span></div>`;
}
function ofShortName(n){

async function withdrawAsk(o){

/* Credit first, then the phone for whatever it does not cover. */
async function useCreditOn(o){

/* ================= PAYING THE SHOP =================
   Money is its own moment, so it has its own sheet rather than a panel
   among the order's cards. The order shows only what is due and one
   Pay now; the sheet takes it from there: what is owed and why, the way
   to pay, then the phone prompt, the counter ticket, the receipt, or
   what went wrong -- each a state of the same sheet, so the agent never
   loses the amount they are paying.

   Credit an agreed change left behind is used first, by itself
   (useCreditOn); the phone or the counter is asked only for the rest. */
const PAY_NETS = {
  mtn: { name: 'MTN Mobile Money', short: 'MTN', logo: 'MTN', pin: 'MoMo' },
  airtel: { name: 'Airtel Money', short: 'Airtel', logo: 'airtel', pin: 'Airtel Money' },
};
// How long the phone prompt stays open, as the networks hold it.
const PAY_WAIT_MS = 2 * 60 * 1000;
const PAY_SHIELD = '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg>';
const PAY_HANDSET = '<svg class="icon" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2M9.5 9.5h5M9.5 12h3"/></svg>';

/* The nine digits after +256, however the number was typed. */
function payLocal(phone){
  let d = String(phone || '').replace(/\D/g, '');
  if(d.startsWith('256')) d = d.slice(3);
  else if(d.startsWith('0')) d = d.slice(1);
  return d.slice(0, 9);
}
/* Which network a line is on, from its prefix: MTN 76-79, Airtel 70,
   74, 75. Null for anything that is not a whole Ugandan mobile number. */
function payNetOf(phone){
  const l = payLocal(phone);
  if(!/^7\d{8}$/.test(l)) return null;
  const p = l.slice(0, 2);
  return ['76', '77', '78', '79'].includes(p) ? 'mtn' : ['70', '74', '75'].includes(p) ? 'airtel' : null;
}
function payPhoneShow(local){
  const l = String(local || '');
  return [l.slice(0, 3), l.slice(3, 6), l.slice(6)].filter(Boolean).join(' ');
}
/* What the sheet says about the money: what the kept lines cost, what
   the dropped ones would have, anything already paid, the credit that
   goes first and what is left after it. */
function payFigures(o){
  const items = o.items || [], dropped = o.droppedLines || [];
  const sum = (xs)=> xs.reduce((s, it)=> s + (Number(it.sellPrice) || 0) * (Number(it.qty) || 0), 0);
  const owed = orderOwedAmount(o);
  const credit = Math.min(agentCreditLeft(o.id), owed);
  return {
    kept: Math.round(sum(items)), gone: Math.round(sum(dropped)), goneName: dropped.length ? (dropped[0].productName || 'An item') : '',
    goneCount: dropped.length, items: items.length, all: items.length + dropped.length,
    paidSoFar: owed > 0 ? Math.round(Number(o.amountPaid) || 0) : 0,
    owed, credit, rest: owed - credit,
  };
}

/* On the order: what is due, and one way into the sheet. */
function payDockHTML(o, owed, credit){
  const use = Math.min(Number(credit) || 0, owed);
  return `<div class="ax-ps-dock">
    <span class="b"><span class="k">${o.status === 'completed' ? 'TO SETTLE WITH THE SHOP' : 'DUE TO THE SHOP'}</span>
      <span class="v"><i>UGX</i><b class="m">${fmtNum(owed)}</b></span>
      ${use > 0 ? `<span class="c">${AX_ICON.again}${fmtNum(use)} of it from your credit</span>` : ''}</span>
    <button type="button" class="ax-ps-go" data-paynow>Pay now${AX_ICON.chevR}</button>
  </div>`;
}

          <div class="cut" aria-hidden="true"><i></i><i></i></div>

  function declinedHTML(o){

  function payLeft(){
    const ms = Math.max(0, PAY_WAIT_MS - (Date.now() - ps.sentAt));
    const s = Math.ceil(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} left`;
  }
  function paint(){
    const o = cur();
    if(!o){ sheet.close(); return; }

    sheet.el.dataset.step = ps.step;
    sheet.el.innerHTML = ps.step === 'waiting' ? waitingHTML(o) : ps.step === 'counter' ? counterHTML(o)
      : ps.step === 'paid' ? paidHTML(o) : ps.step === 'declined' ? declinedHTML(o) : chooseHTML(o);

    paint();
    loadAgentHomeData().then(()=>{ renderCurrentView(); refreshOpenSheets(); }).catch(()=>{});
  }
  async function startPrompt(){
    const o = cur();

  async function poll(pid){
    ps.polling = true; ps.pollId = pid;

      await new Promise(r=> setTimeout(r, 3000));
      if(!ps.polling || ps.pollId !== pid || !sheet.el.isConnected) return;
      let res = null;
      try{ res = await callAgentFn('check-momo-payment-status', { paymentId: pid }); }catch(_e){ /* a flaky line while waiting: ask again */ }
      if(!ps.polling || ps.pollId !== pid) return;
      const status = res && res.status;
      if(status === 'successful'){ finish(ps.method, ps.amount); return; }
      if(status === 'failed' || status === 'cancelled' || status === 'timeout' || Date.now() - ps.sentAt > PAY_WAIT_MS + 30000){
        ps.polling = false; ps.late = status !== 'failed' && status !== 'cancelled';
        ps.step = 'declined'; paint();

  // The one button on the first state: credit first, by itself, then the

    ps.error = '';
    if(momo){
      const net = payNetOf(ps.phone);
      if(!/^7\d{8}$/.test(ps.phone)){ ps.error = 'Enter the 9 digits after +256, like 772 123 456'; paint(); return; }
      if(net && net !== ps.method){ ps.error = `That is ${PAY_NETS[net].short === 'MTN' ? 'an MTN' : 'an Airtel'} line — choose ${PAY_NETS[net].name}, or use a ${PAY_NETS[ps.method].short} number`; paint(); return; }
    }

    try{
      if(f.credit > 0 && agentCreditLeft(o.id) > 0){
        const used = await useCreditOn(o);
        if(!(used.owed > 0)){ finish('credit', used.credited); return; }
      }

      if(!momo){ ps.amount = left; ps.step = 'counter'; ps.busy = false; paint(); return; }
      await startPrompt();
    }catch(err){
      ps.busy = false;
      ps.error = isNetworkError(err) ? 'You are offline — paying needs a connection' : String(err.message || err);

    }
  }
  async function resend(){

    catch(err){ ps.busy = false; ps.step = 'choose'; ps.error = String(err.message || err); paint(); }
  }
  function shareReceipt(o){
    const via = ps.via === 'cash' ? 'cash at the counter' : ps.via === 'credit' ? 'credit' : `${PAY_NETS[ps.via].short} +256 ${payPhoneShow(ps.phone)}`;
    const text = `Paid UGX ${fmtNum(ps.amount)} to ${(shopInfo && shopInfo.name) || 'the shop'} for order #${o.id} (${orderClient(o).name}) by ${via}${ps.paymentId ? `, ref ${String(ps.paymentId).slice(0, 8).toUpperCase()}` : ''}.`;

    if(!e.target.matches('[data-phone]')) return;
    ps.phone = payLocal(e.target.value);
    const net = payNetOf(ps.phone), tag = sheet.el.querySelector('[data-net]');
    if(tag){
      tag.className = `net ${net === ps.method ? 'ok' : net ? 'warn' : 'off'}`;
      tag.innerHTML = net ? (net === ps.method ? AX_ICON.check : '') + PAY_NETS[net].short : 'Number?';
    }
  });
  paint();
  if(shopInfo == null) ensureShopInfo().then(()=>{ if(sheet.el.isConnected) paint(); });
  return sheet;
}

function nativePush(){
  const C = window.Capacitor;
  return C && typeof C.isNativePlatform === 'function' && C.isNativePlatform() && C.Plugins && C.Plugins.PushNotifications
    ? C.Plugins.PushNotifications : null;
}
function agentPushSupported(){ return !!nativePush() || agentWebPushSupported(); }
function agentPushState(){
  if(!nativePush()) return agentWebPushState();
  let on = false, denied = false;
  try{
    on = localStorage.getItem(agentLocalKey('agentPushOn')) === '1';
    denied = localStorage.getItem(agentLocalKey('agentPushDenied')) === '1';
  }catch(_e){}
  return on ? 'on' : denied ? 'denied' : 'off';
}
// The phone's token, stored against this agent so agent-nudge can reach
// it. Tokens change now and then, so this runs on every start too.
async function saveNativeToken(token){
  const C = window.Capacitor;
  const { error } = await sb.from('agent_push_subscriptions').upsert({
    shop_id: currentShopId, agent_id: myAgent.id, user_id: currentUser.id,
    platform: C.getPlatform(), push_token: token,
  }, { onConflict: 'push_token' });
  if(error) throw error;
}
function nativeToken(P){
  return new Promise((ok, fail)=>{
    let done = false;
    const end = (fn, v)=>{ if(done) return; done = true; fn(v); };
    P.addListener('registration', (t)=> end(ok, t.value));
    P.addListener('registrationError', (e)=> end(fail, new Error((e && e.error) || 'the phone did not register')));
    P.register().catch((e)=> end(fail, e));
    setTimeout(()=> end(fail, new Error('the phone took too long to answer')), 20000);
  });
}
async function enableAgentPush(){
  const P = nativePush();
  if(!P) return enableAgentWebPush();
  try{
    let perm = await P.checkPermissions();
    if(perm.receive !== 'granted') perm = await P.requestPermissions();
    if(perm.receive !== 'granted'){
      try{ localStorage.setItem(agentLocalKey('agentPushDenied'), '1'); }catch(_e){}
      toast('Notifications stay off. You can allow them in your phone’s settings');
      return false;
    }
    await saveNativeToken(await nativeToken(P));
    try{
      localStorage.setItem(agentLocalKey('agentPushOn'), '1');
      localStorage.removeItem(agentLocalKey('agentPushDenied'));
    }catch(_e){}
    if(window.owHaptic) owHaptic('success');
    toast('Notifications on. We’ll cheer you on', 4000, { tone:'good' });
    return true;
  }catch(err){
    toast(`Could not turn notifications on: ${err.message || err}`);
    return false;
  }
}

/* A tap lands where the notification points: the goal, an order, a
   client's usual, an item, or Today. Data may still be loading when the
   app was opened by the tap, so it waits for it. */
function routePush(open){
  const go = ()=>{
    const [what, a, b] = String(open || 'today').split(':');
    if(what === 'goal'){ switchTab('today'); openGoalSheet(); return; }
    if(what === 'order' && a){ switchTab('today'); openTrackSheet(a); return; }
    if(what === 'client' && a){
      const c = agentClients.find(x=> String(x.id) === a);
      if(c){ orderUsual(c); return; }
    }
    if(what === 'item' && a && catalog.some(it=> String(it.productId) === a)){
      switchTab('order');
      // The variant whose price moved, when it is still on sale.
      if(b && catalog.some(it=> String(it.productId) === a && String(it.variantIdx) === b)) browseSelectedVariant.set(a, b);
      openVariantSheet(a);
      return;
    }
    switchTab('today');
  };
  let tries = 0;
  const wait = ()=>{
    if(myAgent && !document.body.classList.contains('app-loading')){ go(); return; }
    if(++tries < 40) setTimeout(wait, 250);
  };
  wait();
}
let pushStarted = false;
async function startAgentPush(){
  const P = nativePush();
  if(!P || pushStarted) return;
  pushStarted = true;
  P.addListener('pushNotificationActionPerformed', (a)=> routePush(a && a.notification && a.notification.data && a.notification.data.open));
  // In the foreground the phone does not show it, so the app does.
  P.addListener('pushNotificationReceived', (n)=>{
    if(window.owHaptic) owHaptic('tap');
    toast(`${n.title || ''}${n.body ? ` — ${n.body}` : ''}`, 6000, { tone:'good' });
  });
  try{
    if(window.Capacitor.getPlatform() === 'android'){
      await P.createChannel({ id:'ow_agent', name:'Omni-Ware Agent', description:'Your clients, your wins and prices that move your money', importance: 4, visibility: 1, vibration: true });
    }
    if(agentPushState() === 'on'){
      const perm = await P.checkPermissions();
      if(perm.receive === 'granted') await saveNativeToken(await nativeToken(P));
      else try{ localStorage.removeItem(agentLocalKey('agentPushOn')); }catch(_e){}
    }
  }catch(err){ console.warn('push: could not refresh this phone', err); }
}

/* "Send me a test": one real notification through the whole chain --
   the server, Firebase or Apple, this phone -- and, when it does not
   come, the one thing that is missing, in words. */
const PUSH_WHY = {
  signed_out: 'You are signed out on the server. Sign out and back in.',
  not_registered: 'This phone is not registered. Turn notifications on again.',
  token_expired: 'This phone’s registration ran out. Turn notifications on again.',
  no_token: 'This phone is not registered. Turn notifications on again.',
  no_firebase_key: 'The server has no Firebase key yet. Ask the shop to add it.',
  no_apns_key: 'The server has no Apple key yet. Ask the shop to add it.',
  no_vapid_key: 'The server has no browser key yet. Ask the shop to add it.',
  old_server: 'The server is still on the old version. Ask the shop to update it.',
  offline: 'Could not reach the server. Check the connection and try again.',
  no_answer: 'The server did not answer. Its notification function needs redeploying.',
};
async function sendTestPush(){
  let data = null;
  try{
    // A broken deploy never answers at all; twenty seconds is plenty.
    const r = await Promise.race([
      sb.functions.invoke('agent-nudge', { body: { action: 'test' } }),
      new Promise((ok)=> setTimeout(()=> ok({ timedOut: true }), 20000)),
    ]);
    if(r.timedOut) return { ok: false, why: 'no_answer' };
    data = r.data;
    if(r.error){
      try{ data = await r.error.context.json(); }catch(_e){ data = null; }
      if(data && data.error === 'Unknown action') return { ok: false, why: 'old_server' };
      if(!data || !data.why) return { ok: false, why: 'offline' };
    }
  }catch(_e){ return { ok: false, why: 'offline' }; }
  if(!data) return { ok: false, why: 'offline' };
  if(data.ok) return { ok: true, why: '' };
  const C = window.Capacitor;
  const here = nativePush() ? C.getPlatform() : 'web';
  const phones = data.phones || [];
  const mine = phones.find(p=> p.platform === here) || phones[0];
  const why = data.why || (mine && mine.why) || 'offline';
  if(why === 'not_registered' || why === 'token_expired' || why === 'no_token'){
    try{ localStorage.removeItem(agentLocalKey('agentPushOn')); }catch(_e){}
  }
  return { ok: false, why };
}
