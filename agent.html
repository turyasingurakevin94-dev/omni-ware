/* Requests from the agent's shop link. Answered on WhatsApp, ticked off
   when handled -- and a tick can be taken back, so a mis-tap never loses
   a lead. */
function renderInquiries(){
  const wrap = document.getElementById('ag_inquiriesWrap');
  if(!wrap) return;
  const { open, list } = inquiriesForDisplay();
  const asked = clientFilter === 'asked';
  const rows = asked ? list : (clientFilter === 'all' ? open.slice(0, 2) : []);
  if(!rows.length){ wrap.innerHTML = asked ? '<div class="ax-empty">Nobody has asked through your link yet.</div>' : ''; return; }
  wrap.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;">
    <div class="ax-sec"><h2 style="font-size:15px;">Asked through your link</h2>${open.length ? `<span class="n ag-inquiry-count">${open.length}</span>` : ''}</div>
    ${rows.map(inq=>{
    const product = inquiryProductLabel(inq);
    const phone = String(inq.customer_phone||'').replace(/[^\d+]/g,'');
    const handled = !!inq.handled_at;
    const text = `Hello ${firstWord(inq.customer_name||'')}, thanks for asking. How can I help?`;
    return `<div class="ag-inquiry-card${handled?' handled':''}" data-inq="${esc(inq.id)}">
      <div class="ag-inquiry-top">
        <span class="ax-nx-ic">${AX_ICON.chat}</span>
        <span class="ag-inquiry-who"><span class="ag-inquiry-name">${esc(inq.customer_name||'Someone')}</span>
          <span class="ag-inquiry-meta">${esc(inquiryAgoLabel(inq.created_at))}${product ? ' · ' + esc(product) : ''}</span></span>
        <button type="button" class="ag-inquiry-done" data-inq="${esc(inq.id)}" aria-pressed="${handled}" aria-label="${handled ? 'Undo' : 'Done'}">${AX_ICON.check}</button>
      </div>
      <div class="ax-bubble">${inq.message ? esc(inq.message) : 'No details given — just asked to be contacted.'}</div>
      ${phone ? `<div class="ag-inquiry-acts">
        <a class="btn btn-dark" href="https://wa.me/${esc(phone.replace(/^\+/, ''))}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">${AX_ICON.chat}Reply</a>
        <a class="btn btn-ghost" href="tel:${esc(phone)}" aria-label="Call ${esc(inq.customer_name||'')}">${AX_ICON.phone}Call</a>
      </div>` : ''}
    </div>`;
  }).join('')}</div>`;
  wrap.querySelectorAll('.ag-inquiry-done').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleInquiryHandled(Number(btn.dataset.inq)));
  });
}

/* ================= ONE CLIENT ================= */
function openClientSheet(clientId){
  const id = String(clientId);
  const sheet = openSheet('', { label:'Client', kind:'client', full:true, refresh: ()=> paint() });
  function paint(){
    const c = agentClients.find(x=> String(x.id) === id);
    if(!c){ sheet.close(); return; }
    const counts = clientOrderCounts(), today = new Date();
    const orders = (counts.get(c.id) || []).filter(o=> !o.voided);
    const stats = clientStats(orders);
    const cad = clientCadence(c, counts, today);
    const liveBy = new Map(liveOrders().filter(o=> String(o.agentClientId) === id).map(o=> [id, o]));
    const s = clientStatus(c, counts, today, liveBy);
    const regs = clientRegulars(orders).slice(0, 5);
    const phone = String(c.phone||'').replace(/[^\d]/g, '');
    let rhythm;
    if(cad){
      const ll = lateLabel(cad);
      const dueOn = new Date(cad.lastDate.getTime() + Math.round(cad.avgGapDays) * 86400000);
      rhythm = `<div class="ax-rhythm">
        <div class="h"><span>Orders every ${Math.round(cad.avgGapDays)} days</span><b class="${ll.tone==='warn' ? '' : 'good'}">${esc(ll.text)}</b></div>
        ${dayBlocksHTML(cad)}
        <div class="ax-days-l"><span style="flex:1;">${esc(dateShort(cad.lastDateKey))}</span><span style="flex:1;text-align:center;">due ${esc(dueOn.toLocaleDateString('en-GB',{day:'numeric',month:'short'}))}</span><span style="flex:1;text-align:right;">today</span></div>
      </div>`;
    } else {
      rhythm = `<div class="ax-rhythm"><div class="h"><span>${stats.count ? `Ordered once · ${esc(dateShort(stats.lastAt))}` : 'No orders yet'}</span><b class="good">${stats.count ? 'rhythm after 2 orders' : ''}</b></div></div>`;
    }
    const sorted = orders.slice().sort((a,b)=> String(orderDate(b)||'').localeCompare(String(orderDate(a)||''))).slice(0, 6);
    sheet.el.innerHTML = `
      <div class="ax-sheet-top">
        <button type="button" class="ax-grab" data-close aria-label="Close"></button>
        <div class="ax-sheet-h">${ringAvHTML(c, s.frac, s.tone)}
          <span class="b"><span class="n" title="${esc(c.name)}">${esc(c.name)}</span><span class="s">${esc([c.location, c.phone].filter(Boolean).join(' · ') || 'No phone on file')}</span></span>
          ${c.phone ? `<a class="ax-iconbtn on-navy" href="tel:${esc(c.phone)}" aria-label="Call ${esc(c.name)}">${AX_ICON.phone}</a>` : ''}
          ${phone ? `<a class="ax-iconbtn on-navy" href="https://wa.me/${esc(phone)}" target="_blank" rel="noopener" aria-label="Message on WhatsApp">${AX_ICON.chat}</a>` : ''}
        </div>
        ${rhythm}
        <div class="ax-stats">
          <div><span class="k">Yours so far</span><span class="v good">${fmtCompactUGX(stats.earned)}</span></div>
          <div><span class="k">Typical order</span><span class="v">${stats.count ? fmtCompactUGX(Math.round(medianOf(orders.map(orderTotal)))) : '—'}</span></div>
          <div><span class="k">Orders</span><span class="v">${stats.count}</span></div>
        </div>
      </div>
      <div class="ax-sheet-pad">
        ${regs.length ? `<div class="ax-sec"><h2 style="font-size:15px;">Their usual</h2></div>
        <div class="ax-card" style="padding:4px 14px;">${regs.map(r=>{
          const it = catalogEntry(r.productId, r.variantIdx);
          const qty = usualQty(r.qtys);
          const share = stats.count ? Math.min(1, r.orders / stats.count) : 0;
          return `<button type="button" class="ax-ur" data-regular="${esc(r.key)}" aria-label="Add ${esc(r.name)} to their order">
            <span class="ax-th">${itemThumbHTML(it || { name: r.name })}</span>
            <span class="b"><span class="nm">${esc(r.name)}</span>
              <span class="ax-freq"><span class="bar"><i style="width:${Math.round(share*100)}%;"></i></span>${r.orders >= stats.count ? 'every order' : `${r.orders} of ${stats.count}`}</span></span>
            <span class="q">${fmtNum(qty)}<span>${esc(r.unit||'')}</span></span>
          </button>`;
        }).join('')}</div>` : ''}
        ${sorted.length ? `<div class="ax-sec"><h2 style="font-size:15px;">Orders</h2><span class="n">${stats.count}</span></div>
        <div class="ax-card" style="padding:4px 14px;">${sorted.map(o=>{
          const d = orderDate(o);
          const dt = d ? new Date(d+'T00:00:00') : null;
          const e = orderEarnings(o);
          const earned = e.margin + (o.status === 'completed' ? e.bonus : 0);
          return `<button type="button" class="ax-po" data-track="${esc(o.id)}">
            <span class="ax-date"><b>${dt ? dt.getDate() : '—'}</b><span>${dt ? esc(dt.toLocaleDateString('en-GB',{month:'short'})) : ''}</span></span>
            <span class="b"><span class="t">${fmtNum(orderTotal(o))}</span><span class="s">${esc(orderStage(o).title)}</span></span>
            ${earned ? `<span class="e">${fmtSigned(earned)}</span>` : ''}
          </button>`;
        }).join('')}</div>` : ''}
        <div style="height:64px;"></div>
      </div>
      <div class="ax-cta-dock"><button type="button" class="btn btn-dark btn-block" data-start>${regs.length ? 'Order their usual' : 'Start an order'}${AX_ICON.chevR}</button></div>`;
  }
  sheet.el.addEventListener('click', async (e)=>{
    const c = agentClients.find(x=> String(x.id) === id);
    if(!c) return;
    const t = e.target.closest('[data-track]');
    if(t){ openTrackSheet(t.dataset.track); return; }
    if(e.target.closest('[data-start]')){
      sheet.close();
      closeSheetsOfKind('client');
      const orders = (clientOrderCounts().get(c.id) || []).filter(o=> !o.voided);
      if(clientRegulars(orders).length) orderUsual(c);
      else { goToClientBasket(c); switchTab('order'); }
      return;
    }
    const reg = e.target.closest('[data-regular]');
    if(reg){
      const r = clientRegulars((clientOrderCounts().get(c.id) || []).filter(o=> !o.voided)).find(x=> x.key === reg.dataset.regular);
      if(!r) return;
      goToClientBasket(c);
      if(lineFor(cart, r.productId, r.variantIdx) < 0){
        if(!catalog.length) await ensureBrowseDataLoaded();
        await addRegular(r);
      }
      closeSheetsOfKind('client');
      switchTab('order');
    }
  });
  paint();
  return sheet;
}

/* ================= MONEY =================
   The month, what makes it up, how it compares, what is waiting to be
   claimed, where you stand -- and, at the foot, who you are signed in as. */
let moneyMonth = null;
function openMoneySheet(month){
  moneyMonth = month || currentMonthKey();
  closeSheetsOfKind('money');
  const sheet = openSheet('', { label:'Your money', kind:'money', full:true, refresh: ()=> paint() });
  function paint(){
    const key = moneyMonth;
    const thisMonth = key === currentMonthKey();
    const { margin, bonus, total, orders } = monthEarnings(key);
    const target = Number(myGoals && myGoals.monthly_target) || 0;
    const parts = Math.max(1, Math.abs(margin) + Math.abs(bonus));
    // Six months, anchored to today; the selected one is dark.
    const months = [];
    for(let i = TREND_MONTHS - 1; i >= 0; i--) months.push(shiftMonth(currentMonthKey(), -i));
    const stats = months.map(m=> monthEarnings(m));
    const max = Math.max(...stats.map(x=> x.total), target, 1);
    const H = 100;
    const bars = months.map((m,i)=>{
      const empty = !stats[i].orders.length;
      const h = Math.max(3, Math.round(Math.max(0, stats[i].total) / max * H));
      return `<button type="button" class="ax-bar${m===key?' sel':''}" data-month="${esc(m)}" aria-pressed="${m===key}" aria-label="${esc(monthLabel(m))}, ${empty ? 'no orders' : esc(fmtUGX(stats[i].total))}">
        <span class="v">${empty ? '—' : esc(fmtCompactUGX(stats[i].total))}</span>${empty ? '<span class="none"></span>' : `<span class="b" style="height:${h}px;"></span>`}</button>`;
    }).join('');
    const tline = target > 0 ? `<div class="ax-tline" style="bottom:${Math.round(target / max * H) + 18}px;"><span>goal ${esc(fmtCompactUGX(target))}</span></div>` : '';
    const claimCard = (m, amt)=>{
      const claim = findClaim(m);
      const right = !claim ? `<button type="button" class="btn btn-accent" data-claim="${esc(m)}">Claim</button>`
        : claim.status === 'paid' ? `<span class="ax-pill good">${AX_ICON.check}Paid</span>` : `<span class="ax-pill soft">${AX_ICON.clock}Claimed</span>`;
      return `<div class="ax-card ax-claim"><span class="ic">${AX_ICON.cash}</span>
        <span class="b"><span class="k">${esc(monthName(m))} bonus</span><span class="v">${fmtNum(amt)}</span></span>${right}</div>`;
    };
    const claimMonths = [];
    if(!thisMonth && bonus > 0) claimMonths.push([key, bonus]);
    if(thisMonth){
      for(let k = 1; k <= 3; k++){
        const m = shiftMonth(key, -k), b = monthEarnings(m).bonus;
        if(b > 0 && !findClaim(m)) claimMonths.push([m, b]);
      }
    }
    // Where you stand: rank among agents (never their money), and the
    // nearest milestone as a ring.
    const lb = leaderboard && leaderboard.you && leaderboard.totalAgents >= 2 ? leaderboard : null;
    const streak = computeSellingStreak();
    const all = computeAchievements();
    const next = all.filter(a=> !a.unlocked).map(a=> ({ ...a, frac: a.target ? a.current / a.target : 0 })).sort((a,b)=> b.frac - a.frac)[0] || null;
    const podium = lb ? Array.from({ length: Math.min(6, lb.totalAgents) }, (_, i)=>{
      const rank = i + 1;
      return `<i class="${rank === lb.you.rank ? 'you' : ''}" style="height:${Math.max(18, 100 - i * 14)}%;"></i>`;
    }).join('') : '';
    const standing = `<div class="ax-standing">
      <div class="ax-card">${lb
        ? `<span class="ax-rank"><b>#${esc(lb.you.rank)}</b><span>of ${esc(lb.totalAgents)}</span></span><span class="ax-podium" aria-hidden="true">${podium}</span>`
        : `<span class="ax-rank"><b>${esc(computeAgentStats().completedOrders)}</b><span>orders done</span></span>`}
        ${streak >= 2 ? `<span class="ax-streak">${AX_ICON.flame}${streak} weeks running</span>` : ''}</div>
      <div class="ax-card ax-mile">${next ? `<span class="ring">${ringSVG(56, 6, [{ frac: Math.min(1, next.frac), color:'#0F6B43', round:true }], '#F1EEE8')}<span class="ic">${ACHIEVEMENT_ICONS[next.id] || ACHIEVEMENT_ICONS.first_sale}</span></span>
        <span class="b"><span class="v">${esc(milestoneKind(next) === 'money' ? fmtCompactUGX(next.current) : next.current)}/${esc(milestoneTargetLabel(next))}</span><span class="k">${esc(milestoneUnit(next))}</span></span>`
        : `<span class="b"><span class="v">All 9</span><span class="k">milestones</span></span>`}</div>
    </div>`;
    const sortedOrders = orders.slice().sort((a,b)=> String(orderDate(b)||'').localeCompare(String(orderDate(a)||'')));
    sheet.el.innerHTML = `
      <div class="ax-sheet-top">
        <button type="button" class="ax-grab" data-close aria-label="Close"></button>
        <div class="ax-sheet-h" style="justify-content:space-between;">
          <span class="ax-mnav">
            <button type="button" class="ax-iconbtn on-navy" data-mnav="-1" aria-label="Previous month">${AX_ICON.chevL}</button>
            <span>${esc(monthName(key))}</span>
            <button type="button" class="ax-iconbtn on-navy" data-mnav="1" aria-label="Next month"${thisMonth ? ' disabled style="opacity:.3;"' : ''}>${AX_ICON.chevR}</button>
          </span>
          <button type="button" class="ax-iconbtn on-navy" data-close aria-label="Close">${AX_ICON.x}</button>
        </div>
        <div class="ax-big"><span class="k">Yours ${thisMonth ? 'this month' : 'in ' + esc(monthName(key))}</span><span class="v">${fmtNum(total)}</span></div>
        ${thisMonth ? `<button type="button" class="ax-goalbtn" data-goal>${target ? `goal <b>${fmtNum(target)}</b>` : 'Set a goal'}${AX_ICON.pencil}</button>` : ''}
        <div class="ax-split">
          <div class="ax-split-bar" aria-hidden="true"><i class="mg" style="width:${Math.round(Math.max(0, margin) / parts * 100)}%;"></i><i class="bn" style="width:${Math.round(Math.max(0, bonus) / parts * 100)}%;"></i></div>
          <div class="ax-split-l"><span><i style="background:#fff;"></i>Margin <b>${fmtNum(margin)}</b></span><span><i style="background:#F5B26B;"></i>Bonus <b>${fmtNum(bonus)}</b></span></div>
        </div>
      </div>
      <div class="ax-sheet-pad">
        <div class="ax-card" style="padding:12px 14px;">
          <div class="ax-bars">${tline}${bars}</div>
          <div class="ax-bars-x">${months.map(m=> `<span class="${m===key?'sel':''}">${esc(monthName(m).slice(0,3))}</span>`).join('')}</div>
          ${!months.includes(key) ? `<p class="ax-said" style="margin:8px 0 0;">${esc(monthLabel(key))} is before this window.</p>` : ''}
        </div>
        ${claimMonths.map(([m,b])=> claimCard(m, b)).join('')}
        ${standing}
        ${sortedOrders.length ? `<div class="ax-card" style="padding:4px 14px;">${sortedOrders.slice(0, 12).map(o=>{
          const c = agentClients.find(x=> String(x.id) === String(o.agentClientId));
          const e = orderEarnings(o);
          const counted = o.status === 'completed';
          return `<button type="button" class="ax-mo ax-po" data-track="${esc(o.id)}"><span class="b"><span class="nm">${esc(c ? c.name : 'Client')}</span><span class="s">${esc(dateShort(orderDate(o)))} · ${esc(orderStage(o).title)}</span></span>
            <span class="v">${fmtSigned(e.margin + (counted ? e.bonus : 0))}${!counted && e.bonus ? `<small>+${fmtNum(e.bonus)} bonus when done</small>` : ''}</span></button>`;
        }).join('')}</div>` : `<div class="ax-empty">No orders in ${esc(monthName(key))}.</div>`}
        ${termCardHTML()}
        <div class="ax-card ax-acct ag-sync-card" id="ag_syncCard">
          <span class="ax-av lg" style="background:var(--navy);color:#fff;">${esc(agentInitials())}</span>
          <span class="b"><span class="nm">${esc(myAgent.name || '')}</span>
            <span class="s">${esc([myAgent.phone, myAgent.email].filter(Boolean).join(' · ') || 'No phone or email on file')}</span>
            <span class="s"><i></i><span data-sync></span></span></span>
          <button type="button" class="btn btn-ghost" id="ag_signout_btn">${AX_ICON.out}Sign out</button>
        </div>
      </div>`;
    renderSyncCard();
  }
  sheet.el.addEventListener('click', (e)=>{
    const nav = e.target.closest('[data-mnav]');
    if(nav){
      const nextKey = shiftMonth(moneyMonth, Number(nav.dataset.mnav));
      if(nextKey > currentMonthKey()) return;
      moneyMonth = nextKey; paint(); return;
    }
    const bar = e.target.closest('[data-month]');
    if(bar){ moneyMonth = bar.dataset.month; paint(); return; }
    if(e.target.closest('[data-goal]')){ openGoalSheet({ edit: true }); return; }
    const claim = e.target.closest('[data-claim]');
    if(claim){ submitClaim(claim.dataset.claim, claim); return; }
    const t = e.target.closest('[data-track]');
    if(t){ openTrackSheet(t.dataset.track); return; }
    if(e.target.closest('#ag_signout_btn')) confirmSignOut();
  });
  paint();
  if(!feedClaimsLoaded) loadMyClaims().then(()=>{ feedClaimsLoaded = true; if(sheet.el.isConnected) paint(); });
  ensureLeaderboardLoaded();
  return sheet;
}
// The terms that govern every order this agent places. Only the shop
// sets them, and an unknown one is admitted rather than guessed at --
// telling a prepay agent they pay on delivery would be worse than silence.
function termCardHTML(){
  const term = PAYMENT_TERM_COPY[myAgent.paymentTerm];
  if(!term){
    return `<div class="ax-card ax-term" id="ag_termCard"><span class="b"><span class="t">Ask the shop how your orders are settled.</span></span></div>`;
  }
  return `<div class="ax-card ax-term" id="ag_termCard"><span class="ic">${term.icon}</span>
    <span class="b"><span class="t">${esc(term.title)}</span><span class="s">Only the shop can change this.</span></span></div>`;
}
// What this phone holds, and how old it is. It is the only copy when there
// is no signal, and signing out deletes it, so it sits beside the button.
function renderSyncCard(){
  const card = document.getElementById('ag_syncCard');
  if(!card) return;
  const line = card.querySelector('[data-sync]');
  const cached = ownCachedSnapshot();
  const when = cached && cached.savedAt ? inquiryAgoLabel(cached.savedAt) : '';
  const stale = isOffline || dataLooksSuspect;
  card.classList.toggle('warn', stale);
  if(!cached){
    line.textContent = 'Nothing is saved on this phone yet';
    return;
  }
  line.textContent = stale ? `Working from the copy saved ${when}` : `Saved on this phone ${when}`;
}
async function submitClaim(monthKey, btn){
  if(btn) btn.disabled = true;
  try{
    const res = await callAgentFn('agent-claim-commission', { month: monthKey });
    myClaims = myClaims.filter(c=>c.month!==monthKey).concat([res.claim]);
    refreshOpenSheets();
    if(currentView === 'today') renderNext();
    toast('Claim submitted');
  }catch(err){
    toast(isNetworkError(err) ? "You're offline -- couldn't submit this claim" : `Could not submit claim: ${err.message||err}`);
    if(btn) btn.disabled = false;
  }
}

/* ---- the goal ----
   A number the agent picks for themselves. The shop never reads it, and
   the sheet says so, because an honest number is the only useful one.
   With a goal set, the sheet is about getting there: how far along, ahead
   of or behind the month's pace, the day he crosses it at the pace he is
   on, and which clients' next orders would close the gap. Changing the
   number is one tap on it. */
function goalFigures(now, goal){
  const key = currentMonthKey();
  const cur = monthEarnings(key);
  const target = Math.max(0, Number(goal) || 0);
  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const day = now.getDate();
  const earned = cur.total;
  const left = Math.max(0, target - earned);
  // His pace so far against the pace the goal asks for, both per day.
  const pace = Math.max(0, earned) / day;
  const need = target / dim;
  const ahead = need > 0 ? Math.round((earned - need * day) / need) : 0;
  const finishDay = left <= 0 ? day : pace > 0 ? day + left / pace : Infinity;
  return { key, cur, target, dim, day, earned, left, pace, ahead, finishDay, days: dim - day };
}
// What he had earned by the end of each day of the month so far.
function goalDailyRun(orders, day){
  const per = new Array(day + 1).fill(0);
  orders.forEach(o=>{
    const d = Number(String(orderDate(o) || '').slice(8, 10));
    if(!(d >= 1 && d <= day)) return;
    const e = orderEarnings(o);
    per[d] += e.margin + (o.status === 'completed' ? e.bonus : 0);
  });
  const run = [];
  let s = 0;
  for(let d = 1; d <= day; d++){ s += per[d]; run.push(s); }
  return run;
}
// The clients whose own rhythm brings them back before the month ends,
// soonest first, until their usual orders cover what is left.
function goalGapClients(left, now, daysLeft){
  const counts = clientOrderCounts();
  const rows = [];
  agentClients.forEach(c=>{
    const cad = clientCadence(c, counts, now);
    if(!cad || !(cad.avgMargin > 0) || cad.daysSince >= 60) return;
    const dueIn = cad.avgGapDays - cad.daysSince;
    if(dueIn > daysLeft) return;
    rows.push({ client: c, cad, earn: Math.round(cad.avgMargin), dueIn });
  });
  rows.sort((a,b)=> a.dueIn - b.dueIn);
  const pick = [];
  let sum = 0;
  for(const r of rows){
    if(sum >= left || pick.length >= 4) break;
    pick.push(r);
    sum += r.earn;
  }
  return { pick, sum };
}
// Three quarters of a circle, open at the bottom: white is what is yours.
function goalGaugeSVG(frac){
  const cx = 120, cy = 118, r = 96, c = 2 * Math.PI * r, arc = c * 0.75;
  const on = Math.max(0, Math.min(1, frac)) * arc;
  return `<svg width="240" height="200" viewBox="0 0 240 200" aria-hidden="true">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${arc.toFixed(1)} ${c.toFixed(1)}" transform="rotate(135 ${cx} ${cy})"/>
    ${on > 0 ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-dasharray="${on.toFixed(1)} ${c.toFixed(1)}" transform="rotate(135 ${cx} ${cy})"/>` : ''}
  </svg>`;
}
// The month so far as a climbing line, the goal as a dashed line across
// it, and where today's pace lands: the day it crosses the goal, or what
// the month ends on if it never does.
function goalChartHTML(g){
  const CW = 326, CH = 132, top = 12, bot = CH - 6;
  const run = goalDailyRun(g.cur.orders, g.day);
  let endDay = null, endVal = null, flag = '', flagTone = 'good';
  if(g.left > 0 && g.pace > 0){
    if(g.finishDay <= g.dim){ endDay = g.finishDay; endVal = g.target; flag = `${Math.ceil(g.finishDay)} ${monthName(g.key).slice(0,3)}`; }
    else { endDay = g.dim; endVal = g.earned + g.pace * g.days; flag = `≈ ${fmtCompactUGX(endVal)}`; flagTone = 'warn'; }
  }
  const hit = g.target > 0 && g.left <= 0 ? run.findIndex(v=> v >= g.target) : -1;
  if(hit >= 0){ endDay = hit + 1; endVal = g.target; flag = `${hit + 1} ${monthName(g.key).slice(0,3)}`; }
  const ymax = Math.max(g.target, endVal || 0, ...run, 1) * 1.12;
  const X = (d)=> (d - 1) / Math.max(1, g.dim - 1) * CW;
  const Y = (v)=> bot - Math.max(0, v) / ymax * (bot - top);
  const pts = [];
  let prev = 0;
  run.forEach((v, i)=>{ pts.push([X(i + 1), Y(prev)], [X(i + 1), Y(v)]); prev = v; });
  const line = pts.map(([x,y])=> `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const area = `M${X(1).toFixed(1)},${Y(0).toFixed(1)} ` + pts.map(([x,y])=> `L${x.toFixed(1)},${y.toFixed(1)}`).join(' ') + ` L${X(g.day).toFixed(1)},${Y(0).toFixed(1)} Z`;
  const gy = Y(g.target), nowY = Y(run[run.length - 1] || 0);
  const proj = endDay && hit < 0 ? `<line x1="${X(g.day).toFixed(1)}" y1="${nowY.toFixed(1)}" x2="${X(endDay).toFixed(1)}" y2="${Y(endVal).toFixed(1)}" class="proj ${flagTone}"/>` : '';
  const pct = (v, of)=> `${(v / of * 100).toFixed(2)}%`;
  return `<div class="ax-gplot">
      <svg viewBox="0 0 ${CW} ${CH}" aria-hidden="true">
        <line x1="0" y1="${Y(0).toFixed(1)}" x2="${CW}" y2="${Y(0).toFixed(1)}" class="base"/>
        ${g.target > 0 ? `<line x1="0" y1="${gy.toFixed(1)}" x2="${CW - 34}" y2="${gy.toFixed(1)}" class="goal"/>` : ''}
        <path d="${area}" class="area"/>
        <polyline points="${line}" class="run"/>
        ${proj}
        <circle cx="${X(g.day).toFixed(1)}" cy="${nowY.toFixed(1)}" r="5" class="now"/>
        ${endDay ? `<circle cx="${X(endDay).toFixed(1)}" cy="${Y(endVal).toFixed(1)}" r="6" class="end ${flagTone}"/>` : ''}
      </svg>
      ${flag ? `<span class="flag ${flagTone}" style="left:${pct(Math.min(X(endDay), CW - 40), CW)};top:${pct(Y(endVal), CH)};">${AX_ICON.flag}${esc(flag)}</span>` : ''}
      ${g.target > 0 ? `<span class="gl" style="top:${pct(gy, CH)};">${esc(fmtCompactUGX(g.target))}</span>` : ''}
    </div>
    <div class="ax-gplot-x"><span>1</span><span class="t" style="left:${pct(X(g.day), CW)};">today</span><span class="e">${g.dim}</span></div>`;
}
// One sheet for both: the goal figure under the gauge is the field you
// type into, the chips under it are suggestions from his own months, and
// everything below redraws as the number changes. A new number is kept
// the moment he picks a chip or leaves the field.
function openGoalSheet(opts){
  closeSheetsOfKind('goal');
  const key = currentMonthKey();
  const best = fxBestMonth();
  const bestTotal = best ? Math.max(0, best.total) : 0;
  const prev = shiftMonth(key, -1);
  const prevTotal = monthEarnings(prev).total;
  const base = Math.max(prevTotal, bestTotal, monthEarnings(key).total);
  const round = (n)=> Math.max(10000, Math.round(n / 10000) * 10000);
  // No history, no suggestions: a made-up figure would only anchor him.
  const presets = base > 0 ? [
    prevTotal > 0 ? { l: monthName(prev).slice(0, 3), v: round(prevTotal) } : null,
    best && best.key !== prev && bestTotal > prevTotal ? { l: 'Best', icon: AX_ICON.trophy, v: round(bestTotal) } : null,
    { l: 'Push', icon: AX_ICON.flame, v: round(base * 1.35) },
  ].filter(Boolean) : [];
  let saved = Number(myGoals && myGoals.monthly_target) || 0;
  let value = saved;
  const sheet = openSheet(`<div class="ax-sheet-top">
      <button type="button" class="ax-grab" data-close aria-label="Close"></button>
      <div class="ax-sheet-h" style="justify-content:space-between;">
        <span class="ax-gmonth">${esc(monthName(key))} <span aria-label="Only you see this">${AX_ICON.lock}</span></span>
        <button type="button" class="ax-iconbtn on-navy" data-close aria-label="Close">${AX_ICON.x}</button>
      </div>
      <div class="ax-gauge"><span data-gauge></span>
        <span class="c"><span class="v" data-earned></span>
          <label class="ax-gin">of<input type="text" inputmode="numeric" id="ag_goalInput" autocomplete="off" placeholder="goal" aria-label="Your goal for ${esc(monthName(key))}">${AX_ICON.pencil}</label></span>
        <span class="ax-gpill" data-pill></span>
      </div>
      ${presets.length ? `<div class="ax-gchips" style="grid-template-columns:repeat(${presets.length},1fr);">${presets.map((p,i)=>
        `<button type="button" data-preset="${i}" aria-pressed="false"><span class="l">${p.icon || ''}${esc(p.l)}</span><span class="v">${esc(fmtCompactUGX(p.v))}</span></button>`).join('')}</div>` : ''}
    </div>
    <div class="ax-sheet-pad" data-below></div>`, { label:'Your goal', kind:'goal', full:true, refresh: ()=> paint() });
  const input = document.getElementById('ag_goalInput');
  const fit = ()=>{ input.style.width = `${Math.max(5, input.value.length) + 0.5}ch`; };
  function paint(){
    const now = new Date();
    const g = goalFigures(now, value);
    sheet.el.querySelector('[data-gauge]').innerHTML = goalGaugeSVG(g.target > 0 ? g.earned / g.target : 0);
    sheet.el.querySelector('[data-earned]').textContent = fmtNum(g.earned);
    const pill = !(g.target > 0) ? { tone:'', icon: AX_ICON.flag, text: 'Set a goal' }
      : g.left <= 0 ? { tone:'good', icon: AX_ICON.check, text: 'Goal reached' }
      : g.ahead >= 1 ? { tone:'good', icon: AX_ICON.trend, text: `${g.ahead} day${g.ahead===1?'':'s'} ahead` }
      : g.ahead <= -1 ? { tone:'warn', icon: AX_ICON.clock, text: `${-g.ahead} day${g.ahead===-1?'':'s'} behind` }
      : { tone:'', icon: AX_ICON.check, text: 'On pace' };
    const pillEl = sheet.el.querySelector('[data-pill]');
    pillEl.className = `ax-gpill ${pill.tone}`;
    pillEl.innerHTML = `${pill.icon}${esc(pill.text)}`;
    sheet.el.querySelectorAll('[data-preset]').forEach(b=>{
      const on = presets[Number(b.dataset.preset)].v === value;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    let gap = '';
    if(g.target > 0 && g.left <= 0){
      gap = `<div class="ax-card ax-gwon"><span class="ic">${AX_ICON.check}</span>
        <span class="b"><b>+${fmtNum(g.earned - g.target)}</b><small>over your goal</small></span>
        <button type="button" class="btn btn-dark" data-goal-edit>Raise it</button></div>`;
    } else if(g.target > 0){
      const { pick, sum } = goalGapClients(g.left, now, g.days);
      const covered = pick.length && sum >= g.left;
      const perDay = g.days > 0 ? Math.ceil(g.left / g.days) : g.left;
      gap = `<div class="ax-card ax-ggap${pick.length ? ' has-rows' : ''}">
        <div class="h"><span><b>${fmtNum(g.left)}</b>to go</span>
          ${covered ? `<span class="ok">${AX_ICON.check}${pick.length} order${pick.length===1?'':'s'} cover it</span>`
            : `<span><b class="good">${fmtNum(perDay)}</b>${g.days > 0 ? 'a day' : 'today'}</span>`}</div>
        ${pick.length ? `<div class="ax-gseg" aria-hidden="true">${pick.map(r=> `<i class="${avTint(r.client.id)}" style="flex:${r.earn};"></i>`).join('')}${covered ? '' : `<i class="rest" style="flex:${g.left - sum};"></i>`}</div>
        <div class="ax-grows">${pick.map(r=>{
          const ll = lateLabel(r.cad);
          return `<button type="button" class="ax-grow" data-usual="${esc(r.client.id)}">
            ${ringAvHTML(r.client, Math.min(1, r.cad.daysSince / Math.max(1, r.cad.avgGapDays)), ll.tone === 'warn' ? 'late' : ll.tone === 'good' ? 'due' : '')}
            <span class="b"><span class="n" title="${esc(r.client.name)}">${esc(r.client.name)}</span><span class="s ${ll.tone}">${esc(ll.text)}</span></span>
            <span class="v">+${fmtNum(r.earn)}</span><span class="go">${AX_ICON.chevR}</span></button>`;
        }).join('')}</div>` : ''}
      </div>`;
    }
    // Nothing earned and no goal yet: a flat line would only say so twice.
    const chart = g.target > 0 || g.earned > 0 ? `<div class="ax-card ax-gchart">${goalChartHTML(g)}</div>` : '';
    sheet.el.querySelector('[data-below]').innerHTML = chart + gap;
  }
  async function keep(){
    if(!(value > 0) || value === saved) return;
    const v = value;
    try{
      await saveAgentGoal(v, goalPerDay(v, new Date()));
      saved = v;
      openSheets.forEach(s=>{ if(s !== sheet && s.refresh) s.refresh(); });
      if(currentView === 'today') renderTodayHero();
      toast('Goal set');
    }catch(err){
      toast("Couldn't save that just now -- try again in a moment");
    }
  }
  input.value = value > 0 ? fmtNum(value) : '';
  fit();
  paint();
  input.addEventListener('input', ()=>{
    value = Number(String(input.value).replace(/[^\d]/g, '')) || 0;
    input.value = value > 0 ? fmtNum(value) : '';
    fit();
    try{ input.setSelectionRange(input.value.length, input.value.length); }catch(_e){}
    paint();
  });
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') input.blur(); });
  input.addEventListener('change', keep);
  sheet.el.addEventListener('click', (e)=>{
    const p = e.target.closest('[data-preset]');
    if(p){
      value = presets[Number(p.dataset.preset)].v;
      input.value = fmtNum(value);
      fit();
      paint();
      keep();
      return;
    }
    if(e.target.closest('[data-goal-edit]')){ input.focus(); input.select(); return; }
    const u = e.target.closest('[data-usual]');
    if(u){
      const c = agentClients.find(x=> String(x.id) === u.dataset.usual);
      if(!c) return;
      closeSheetsOfKind('money');
      sheet.close();
      orderUsual(c);
    }
  });
  if((opts && opts.edit) || !(saved > 0)) setTimeout(()=>{ if(input.isConnected){ input.focus(); input.select(); } }, 60);
  return sheet;
}

/* Sign out deletes the copy this phone is holding, and signing back in
   needs a connection -- so offline, the sheet says exactly that. */
function confirmSignOut(){
  const offline = isOffline;
  const sheet = openSheet(`<button type="button" class="ax-grab" data-close aria-label="Close"></button>
    <div class="ax-sheet-title"><h3>Sign out?</h3></div>
    <div class="ax-form">
      <p class="ax-confirm">${offline
        ? `<b>You are offline.</b> Signing out now clears the copy saved on this phone, and signing back in needs a connection — you would not be able to use the app until you have one.`
        : `This clears the orders and clients saved on this phone. You will need a connection to sign back in.`}</p>
      <div class="ax-row2">
        <button type="button" class="btn btn-ghost" id="ag_signout_cancel">Stay signed in</button>
        <button type="button" class="btn btn-danger" id="ag_signout_confirm">Sign out</button>
      </div>
    </div>`, { label:'Sign out', white:true });
  document.getElementById('ag_signout_cancel').addEventListener('click', ()=> sheet.close());
  document.getElementById('ag_signout_confirm').addEventListener('click', ()=>{ sheet.close(); signOutAndReload(); });
}

// makeActive:false adds a client without making them the one the order
// in hand is for -- saving a contact you just met should not park the
// basket you are building for someone else.
function openNewClientPanel(prefillName, onDone, { makeActive = true } = {}){
  const sheet = openSheet(`<button type="button" class="ax-grab" data-close aria-label="Close"></button>
    <div class="ax-sheet-title"><h3>New client</h3><button type="button" class="ax-iconbtn" data-close aria-label="Close">${AX_ICON.x}</button></div>
    <div class="ax-form">
      <label class="ax-field">${AX_ICON.user}<input id="ag_nc_name" type="text" value="${esc(prefillName||'')}" placeholder="Name" aria-label="Name"></label>
      <label class="ax-field">${AX_ICON.phone}<input id="ag_nc_phone" type="tel" placeholder="Phone" aria-label="Phone"></label>
      <label class="ax-field">${AX_ICON.pin}<input id="ag_nc_location" type="text" placeholder="Where (optional)" aria-label="Location"></label>
      <button type="button" class="btn btn-dark btn-block" id="ag_nc_save_btn">Save client</button>
    </div>`, { label:'New client', white:true });
  setTimeout(()=> document.getElementById(prefillName ? 'ag_nc_phone' : 'ag_nc_name').focus(), 60);
  const saveClientBtn = document.getElementById('ag_nc_save_btn');
  saveClientBtn.addEventListener('click', async ()=>{
    if(saveClientBtn.disabled) return;
    const name = document.getElementById('ag_nc_name').value.trim();
    if(!name){ toast('Enter a name'); return; }
    const phone = document.getElementById('ag_nc_phone').value.trim();
    const location = document.getElementById('ag_nc_location').value.trim();
    // Nothing but this guard stops a double tap inserting the same client
    // twice -- agent_clients has no unique key on name or phone.
    saveClientBtn.disabled = true;
    saveClientBtn.textContent = 'Saving…';
    const { data: inserted, error } = await sb.from('agent_clients')
      .insert({ shop_id: currentShopId, agent_id: myAgent.id, name, phone: phone||null, location: location||null })
      .select().single();
    if(error){
      toast(isNetworkError(error) ? "You're offline -- couldn't save this client" : `Could not save client: ${error.message}`);
      saveClientBtn.disabled = false;
      saveClientBtn.textContent = 'Save client';
      return;
    }
    agentClients.push(inserted);
    saveOfflineCache();
    sheet.close();
    if(makeActive) goToClientBasket(inserted);
    if(onDone) onDone(inserted);
  });
}

/* ================= STAYING LIVE =================
   "Live" on Today means it: the orders are re-read whenever the app comes
   back to the front, and every couple of minutes while it is open, so a
   line the shop has just confirmed shows up without anybody pulling. */
let lastRefreshAt = Date.now();
async function refreshLive(){
  if(isOffline || !currentShopId) return;
  lastRefreshAt = Date.now();
  try{
    await loadAgentHomeData();
    saveOfflineCache();
    if(currentView === 'today' || currentView === 'clients') renderCurrentView();
    else refreshOpenSheets();
  }catch(_e){ /* the next tick tries again */ }
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && Date.now() - lastRefreshAt > 30000) refreshLive();
});
setInterval(()=>{ if(!document.hidden && Date.now() - lastRefreshAt > 110000) refreshLive(); }, 30000);

async function boot(){
  updateOfflineBanner();
  try{
    await ensureAgentAuth();
  }catch(e){
    console.error('Failed to start app:', e);
    const el = ensureAuthOverlay();
    el.innerHTML = `<div style="color:#f66;font-family:inherit;max-width:400px;text-align:center;padding:0 20px;">Couldn't load your account: ${esc((e && e.message) || e)}. Reload to try again.</div>`;
    return;
  }
  /* Applied only when the row was actually read: a cached boot carries
     whatever was true at the last sign-in, and a stale PAUSED would lock a
     working agent out with no way to disprove it. */
  setAgentPaused(!bootedFromCache && myAgent && myAgent.paused);
  try{
    await loadAgentHomeData();
    // Not awaited: a goal is motivational, and failing to fetch one must
    // not send the agent down the cached-snapshot path.
    loadAgentGoals().then(()=>{ if(currentView === 'today') renderTodayHero(); });
    saveOfflineCache();
    // GUARD 3 -- a fetch without errors is still not proof the data is
    // real. Only a load that was not flagged suspect clears these.
    if(!dataLooksSuspect){
      isOffline = false;
      bootedFromCache = false;
    } else {
      bootedFromCache = true;
    }
    updateOfflineBanner();
  }catch(e){
    console.error('Failed to load home data, falling back to cached snapshot:', e);
    const cached = ownCachedSnapshot();
    if(cached){
      agentClients = cached.agentClients || [];
      myOrders = cached.myOrders || [];
      catalog = cached.catalog || [];
      promotions = cached.promotions || [];
      cluster = cached.cluster || [];
      solutionTemplates = cached.solutionTemplates || [];
      clusterWaitDays = cached.clusterWaitDays != null ? cached.clusterWaitDays : null;
      browseDataLoaded = catalog.length > 0;
      bootedFromCache = true;
    }
    isOffline = true;
    updateOfflineBanner();
  }
  restoreQuoteDraft();
  updateCartBadge();
  let savedTab = null;
  try{ savedTab = localStorage.getItem('agentLastTab'); }catch(_e){}
  // A tapped notification opens here with ?open=feed, which is Today now.
  const openParam = new URLSearchParams(location.search).get('open');
  switchTab(openParam ? 'today' : TABS.includes(savedTab) ? savedTab : 'today');
  document.body.classList.remove('app-loading');
}
boot();
