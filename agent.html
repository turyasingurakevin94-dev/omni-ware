/* ---------------- Which Supabase project this copy talks to ----------
 *
 * There is no build step in this project -- these are single HTML files
 * served exactly as they sit in the repo -- so the project cannot be
 * injected at deploy time. It is chosen at run time, from the host the
 * page was opened on. That is what lets the redesign branch and main
 * carry the SAME file: the host decides which database it reaches, not
 * the checkout, so there is never a line here to resolve when the two
 * merge.
 *
 * The list names the PRODUCTION hosts and everything else falls to
 * staging, never the other way round. A list of staging hosts would mean
 * any host nobody thought of -- a fresh preview URL, a renamed project,
 * an old bookmark -- landing on the real books and writing to them. This
 * way an unrecognised host reads the empty copy and the strip in the
 * corner says so.
 *
 * Until BOTH halves are filled in -- a staging project to point at and at
 * least one production host to tell apart from it -- every host gets
 * production. A half-finished switch is the dangerous one: name the
 * staging project without naming the real site and the real site becomes
 * "everything else". So it stays inert until it is whole, and this block
 * cannot change what the live site does before then.
 */
const OW_ENV = (function () {
  const PRODUCTION = {
    name: 'production',
    url: 'https://hgywjaifdmgrcnwxstxg.supabase.co',
    anon: 'sb_publishable_KsUIBYzuZRdoPsqP4T2ULw__AsCEhzV',
  };
  // Fill both in once the staging Supabase project exists, and commit the
  // same values on every branch.
  const STAGING = {
    name: 'staging',
    url: 'https://lmmyzhqdxixjnkkkgnnu.supabase.co',
    anon: 'sb_publishable_K7A4jZC6RSgFtyiSfV2P_w_oh8crHa5',
  };
  // The hosts that ARE the real shop. Add one the day it starts serving
  // the live site, and not before.
  const PRODUCTION_HOSTS = ['omni-ware.vercel.app', 'omni-ware-preview.turyasingurakevin94.workers.dev'];

  function chosen() {
    if (!STAGING.url || !PRODUCTION_HOSTS.length) return PRODUCTION;
    // The Android shell serves the bundle from localhost, so the hostname
    // says nothing about which database it wants. A shipped APK is the
    // real shop; a staging APK would be a separate build.
    if (typeof window !== 'undefined' && window.Capacitor) return PRODUCTION;
    const host = ((typeof location !== 'undefined' && location.hostname) || '').toLowerCase();
    return PRODUCTION_HOSTS.indexOf(host) === -1 ? STAGING : PRODUCTION;
  }

  const env = chosen();
  if (env.name === 'staging') {
    // Small, fixed, and never in the way of a tap: the point is that
    // nobody spends ten minutes entering real figures into the copy.
    //
    // 899 and not the top of the stack. The drawn dropdown at 900 has to
    // stay the highest layer in the app -- a menu opening behind the
    // modal that owns it is a real bug, and dropdown-menu.test.js pins
    // it -- so the strip goes under that and above everything else.
    const mark = function () {
      if (!document.body || document.getElementById('ow-env-mark')) return;
      const el = document.createElement('div');
      el.id = 'ow-env-mark';
      el.textContent = 'STAGING — test data, not the real books';
      el.style.cssText = 'position:fixed;left:0;bottom:0;z-index:899;'
        + 'pointer-events:none;background:#C93A30;color:#fff;'
        + 'font:600 11px/1.1 system-ui,-apple-system,sans-serif;'
        + 'padding:5px 9px;border-radius:0 6px 0 0';
      document.body.appendChild(el);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mark);
    else mark();
  }
  return env;
})();
const SUPABASE_URL = OW_ENV.url;
const SUPABASE_ANON_KEY = OW_ENV.anon;
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null, currentShopId = null, myAgent = null;
let agentClients = [], myOrders = [], catalog = [], myInquiries = [];
let cart = [], chosenClient = null;

/* ---- One basket per client, not one basket -------------------------
 * An agent works several shops in a morning and often quotes the same one
 * across repeat visits. The app modelled that as a single cart with a
 * single chosen client -- an e-commerce checkout, when the job is a quote
 * in progress per customer.
 *
 * That was not only the wrong metaphor, it produced wrong orders. Tapping
 * "Change" cleared the client and KEPT the items, so a basket built for
 * Namuli Hardware silently became Mukasa Stores' order. Nothing warned,
 * nothing cleared.
 *
 * `cart` stays the active basket, so the 50-odd places that read it are
 * untouched. `carts` holds one per client behind it and they are swapped
 * on selection. Nothing bleeds between customers, and a basket survives
 * being left to go and serve someone else.
 */
let carts = Object.create(null);
const cartKey = (client) => client ? String(client.id) : null;
/* The basket built before anybody was named. Held here rather than in
   `carts`, which is keyed by client id and written out as such -- but
   held all the same, so it can be parked and come back like any other.
   Without somewhere to put it, switching to another client's quote could
   only either carry it along or destroy it. */
let unnamedCart = [];
// Park the active basket against whoever it belongs to.
function stashActiveCart(){
  const k = cartKey(chosenClient);
  if(k) carts[k] = cart;
  else unnamedCart = cart;
}
// Make this client's basket the active one, creating an empty one if they
// have never been quoted before. The array is stored by reference, so
// every later cart.push() lands in the right client's basket.
function activateCartFor(client){
  const k = cartKey(client);
  if(!k){ cart = unnamedCart; return; }
  if(!carts[k]) carts[k] = [];
  cart = carts[k];
}
/* What becomes of the basket in hand at the moment a client is finally
   named.
 *
 * Items added before anyone was chosen have nowhere to be parked --
 * cartKey(null) is null, so stashActiveCart() cannot store them and
 * activateCartFor() then swapped `cart` for the newly chosen client's
 * empty basket. The items an agent had just built up in front of a
 * customer simply vanished, and choosing the client is the very step
 * that did it.
 *
 * Naming a client IS the act of saying who those items are for, so they
 * move across. Appended to whatever that client already had rather than
 * replacing it: a basket parked for them earlier is theirs too, and
 * throwing either side away is the fault being fixed. */
function adoptedCartFor(hadClient, inHand, clientRows){
  const hand = inHand || [], mine = clientRows || [];
  // Switching BETWEEN clients: the basket in hand already had an owner
  // and stashActiveCart has parked it with them. Nothing to adopt.
  if(hadClient) return { rows: mine, adopted: 0, joined: 0 };
  if(!hand.length) return { rows: mine, adopted: 0, joined: 0 };
  return { rows: mine.concat(hand), adopted: hand.length, joined: mine.length };
}
/* Every quote in progress, as the switcher shows them: who it is for,
   how much is in it, and which one is open.
 *
 * "1 other quote in progress" told an agent a quote existed without
 * saying whose, so the only way to find it was to guess a name into the
 * picker. A list of names is the difference between knowing something is
 * there and being able to reach it.
 *
 * A client whose basket is parked but whose record has since gone is
 * still listed, under their id -- a basket you cannot see is a basket you
 * cannot empty, and it would sit there counting against the total for
 * ever. */
function quoteBasketSummaries(clients, cartsByClient, activeClientId, unnamedRows){
  const byId = new Map((clients||[]).map(c=> [String(c.id), c]));
  const out = [];
  /* The open order is always listed, even with nothing in it yet. This
     row is now the only place the customer's name appears, so an empty
     basket that showed no tab would leave an agent adding items with
     nothing on screen saying who they are for.

     Other people's empty baskets are still left out: selecting a client
     is how you look at one, so browsing three customers leaves empty
     baskets behind each time, and listing those would claim orders in
     progress that do not exist. */
  const loose = (unnamedRows||[]).length;
  if(loose || activeClientId == null){
    out.push({ key: null, name: 'Not yet named', count: loose,
      active: activeClientId == null, unnamed: true });
  }
  Object.keys(cartsByClient||{}).forEach(k=>{
    const rows = cartsByClient[k] || [];
    const active = String(k) === String(activeClientId);
    if(!rows.length && !active) return;
    const c = byId.get(String(k));
    out.push({ key: String(k), name: c ? c.name : 'Client no longer on file',
      count: rows.length, active, unnamed: false, missing: !c });
  });
  // The one being worked on first, then by name -- an agent looking for
  // Sarah scans for Sarah, and the open one is where the eye starts.
  return out.sort((a,b)=>
    (a.active === b.active ? String(a.name).localeCompare(String(b.name)) : (a.active ? -1 : 1)));
}
/* Counting the OTHER baskets used to be the whole of what an agent was
   told -- "1 other quote in progress", a number with no name on it. The
   switcher lists them instead, so the count is gone rather than left
   sitting here looking like something the screen still reads. */
function clientsWithBaskets(){
  return Object.keys(carts).filter(k => (carts[k]||[]).length > 0);
}

/* ================= OFFLINE RESILIENCE =================
   Scope: read-only screens keep working (from a cached snapshot) when
   connectivity drops, and a dropped connection never dead-ends the app
   at a hard error screen. Deliberately NOT an offline write queue --
   every write in this app (submitting an order, saving a solution, ...)
   flows through server-side price/availability checks that don't exist
   locally (agent-catalog re-resolves the live floor price on every
   quote line), so a queued write made offline could only ever be
   submitted against numbers that might no longer be true by the time
   it actually reaches the server. That's a materially bigger feature
   with its own conflict-resolution design, not a natural extension of
   this one. */
let isOffline = typeof navigator !== 'undefined' && navigator.onLine === false;
let bootedFromCache = false;
// Set when a read came back empty but the last good snapshot had rows.
// That's almost always an expired/mid-refresh token or an RLS mismatch
// rather than a genuinely emptied account, so it's tracked separately
// from isOffline -- the two need different banner wording, and this one
// must never be reported as a clean successful load.
let dataLooksSuspect = false;
const OFFLINE_CACHE_KEY = 'agentOfflineCache';

// navigator.onLine only reflects "does the OS have a network interface
// up" -- a phone can say "online" over wifi with no real internet.
// Browsers surface the useful signal as the shape of the fetch failure
// itself, so that's what actually gates the offline fallback paths
// below; the online/offline events just keep the banner honest between
// attempts.
function isNetworkError(err){
  if(typeof navigator !== 'undefined' && navigator.onLine === false) return true;
  const msg = String((err && err.message) || err || '').toLowerCase();
  return msg.includes('failed to fetch') || msg.includes('networkerror') || msg.includes('load failed') || msg.includes('network request failed');
}

// GUARD 1 -- the cache is the only copy of an agent's data that survives a
// bad read, so it must never be overwritten by one. A snapshot that lost
// every row of something the stored snapshot still has is far more likely
// a silently-empty response (expired JWT, RLS mismatch, wrong shop_id --
// all of which PostgREST returns as a perfectly ordinary `data: []`) than
// a real account reset. Writing that over the good copy is what turned a
// momentary auth blip into what looked like permanent data loss.
function wouldWipeCachedData(prev){
  if(!prev) return false;
  const wipes = (fresh, stored) => (stored||[]).length > 0 && (fresh||[]).length === 0;
  return wipes(myOrders, prev.myOrders)
    || wipes(agentClients, prev.agentClients)
    || wipes(catalog, prev.catalog)
    // Requests are never deleted, so an empty read where the snapshot has
    // rows can only be a blip. Guarded here but deliberately NOT in
    // readLostRows: their load is non-fatal by design, and escalating a
    // secondary dataset's hiccup into the whole-screen "showing your last
    // saved data" warning would contradict that.
    || wipes(myInquiries, prev.myInquiries);
}
// `trusted` means the caller has already established that this snapshot is
// real rather than a blip -- currently only loadAgentHomeData, after a read
// that came back on a token it had just renewed. Everywhere else keeps the
// guard, because everywhere else an empty read is unexplained.
function saveOfflineCache(trusted){
  try{
    // The wipe-guard protects OUR OWN cached rows from being replaced by an
    // empty read. A snapshot belonging to a different login gets no such
    // protection -- it must be overwritten, or the previous agent's data
    // would outlive their session on this device.
    if(!trusted && wouldWipeCachedData(ownCachedSnapshot())){
      console.warn('Skipped offline-cache write: the fresh snapshot is empty where the stored one has rows.');
      return;
    }
    localStorage.setItem(OFFLINE_CACHE_KEY, JSON.stringify({
      savedAt: new Date().toISOString(),
      userId: currentUser && currentUser.id,
      myAgent, currentShopId, agentClients, myOrders, myInquiries, catalog, promotions,
      // cluster/solutionTemplates/clusterWaitDays are read-only reference
      // data exactly like the rest of this snapshot -- omitting them would
      // mean an agent's saved Solutions and cluster picks silently vanish
      // from Sell while offline, not just go stale, which reads as data
      // loss rather than a connectivity notice.
      cluster, solutionTemplates, clusterWaitDays,
    }));
  }catch(_e){ /* storage full/unavailable -- just skip caching this time */ }
}
function loadOfflineCache(){
  try{ return JSON.parse(localStorage.getItem(OFFLINE_CACHE_KEY) || 'null'); }
  catch(_e){ return null; }
}
// The snapshot ONLY if it belongs to the login currently signed in.
//
// The cache lives under one key per browser, not one per agent, so a
// second agent signing into the same device inherits whatever the first
// one left behind. That was survivable while a fresh empty read simply
// overwrote it -- but the guards added to stop orders vanishing made it
// stick: saveOfflineCache() now refuses to overwrite rows with nothing,
// and loadAgentHomeData() restores from cache when a read comes back
// empty. A brand-new agent with no clients of their own therefore gets
// shown the previous agent's roster. An agent's client list is private
// to them by design (0012_sales_agents.sql), so that's a data leak
// between agents, not a staleness bug.
//
// Ownership is keyed on the auth user id rather than the agent id: it's
// the one identifier that exists before the agents row is looked up, so
// the same check works on the offline-resume path in ensureAgentAuth().
function cacheBelongsTo(cached, userId){
  return !!(cached && userId && cached.userId && String(cached.userId) === String(userId));
}
function ownCachedSnapshot(){
  const cached = loadOfflineCache();
  return cacheBelongsTo(cached, currentUser && currentUser.id) ? cached : null;
}
function clearOfflineCache(){
  try{ localStorage.removeItem(OFFLINE_CACHE_KEY); }catch(_e){}
}

function updateOfflineBanner(){
  const show = isOffline || dataLooksSuspect;
  document.getElementById('ag_offlineBanner').style.display = show ? 'flex' : 'none';
  document.body.classList.toggle('ag-offline', show);
  if(typeof renderLivePill === 'function') renderLivePill();
  // Two different problems, two different messages -- telling an agent
  // they're offline when they aren't just sends them to check their wifi.
  if(show){
    document.getElementById('ag_offlineBannerText').textContent = (dataLooksSuspect && !isOffline)
      ? "Couldn't confirm your latest orders just now -- showing your last saved data. Reopen the app in a moment to retry."
      : "You're offline -- showing your last saved data. New actions won't go through until you're back online.";
  }
}
window.addEventListener('online', async ()=>{
  if(!bootedFromCache){ isOffline = false; updateOfflineBanner(); return; }
  // The browser's 'online' event only means the OS network interface came
  // back -- not that Supabase itself is actually reachable (same caveat
  // isNetworkError() has to work around the other way). So the banner
  // deliberately stays up through this attempt and only clears once a
  // real fetch actually succeeds, not just because this event fired;
  // clearing it early would tell an agent they're back online while the
  // app is still quietly stuck on stale data.
  try{
    await loadAgentHomeData();
    // ensureCatalogLoaded() guards on catalog.length, not browseDataLoaded
    // -- since the cached catalog already has items, clearing only the
    // wrong flag would make this a no-op and leave Sell's catalog,
    // cluster picks, and Solutions silently stale after "reconnecting".
    // Clearing catalog forces ensureBrowseDataLoaded() to actually
    // re-fetch everything it owns (catalog, promotions, cluster,
    // solutionTemplates) instead of trusting the stale snapshot.
    catalog = [];
    browseDataLoaded = false;
    await ensureBrowseDataLoaded();
    saveOfflineCache();
    // Same rule as boot()'s GUARD 3 -- reconnecting doesn't make a
    // suspect read trustworthy, so "data refreshed" is only claimed when
    // the rows actually came back.
    if(dataLooksSuspect){
      updateOfflineBanner();
      return;
    }
    bootedFromCache = false;
    isOffline = false;
    updateOfflineBanner();
    renderCurrentView();
    toast('Back online -- data refreshed');
  }catch(_e){ /* still not actually reachable; leave the banner up and retry on the next reconnect or app action */ }
});
window.addEventListener('offline', ()=>{ isOffline = true; updateOfflineBanner(); });

// A quote is often built over several minutes while walking a shop floor
// or standing with a client -- a stray reload (or the OS killing the tab
// in the background) shouldn't throw away items already added. Every
// mutation below persists the in-progress draft; boot() restores it
// before the agent ever sees an empty cart. Cleared once the order is
// actually submitted (resetCartAfterSubmit) since there's nothing left
// to resume at that point.

const QUOTE_DRAFT_KEY = 'agentQuoteDraft';
// Restoring one field at a time (selectClient, dispatching the delivery
// radio's change event) reuses the same code paths a real edit does --
// including their saveQuoteDraft() calls. Left unguarded, the first field
// restored would immediately re-save the draft with every *other* field
// still at its pre-restore default, clobbering the very draft being read.
let restoringQuoteDraft = false;
function saveQuoteDraft(){
  if(restoringQuoteDraft) return;
  const deliveryMode = document.getElementById('ag_delivery_shop').checked ? 'shop_delivery' : 'agent_pickup';
  const deliveryAddress = document.getElementById('ag_delivery_address').value;
  try{
    // Park the active basket first, or whatever is in hand is written
    // under the previous client's key and lost on reload.
    stashActiveCart();
    localStorage.setItem(QUOTE_DRAFT_KEY, JSON.stringify({
      userId: currentUser && currentUser.id,
      carts, chosenClientId: chosenClient ? chosenClient.id : null, deliveryMode, deliveryAddress,
      /* The unnamed basket, which has no client id to be filed under and
         so is not in `carts`. stashActiveCart above has just parked it
         here, whether or not it is the active one, so this is written the
         same way whichever quote the agent happens to be looking at.
         The reading side has always handled this shape. */
      cart: unnamedCart.slice(),
    }));
  }catch(_e){ /* storage full/unavailable -- the draft just won't survive a reload this time */ }
}
function clearQuoteDraft(){
  try{ localStorage.removeItem(QUOTE_DRAFT_KEY); }catch(_e){}
}
// The same rule cacheBelongsTo() applies to the offline snapshot, and for
// the same reason: agents share phones, and an agent's clients are private
// to them by design (0012_sales_agents.sql). The draft holds baskets, the
// chosen client and a typed delivery address, so restoring one that isn't
// yours puts another agent's client roster and a customer's home address
// on your screen.
//
// A draft written before this stamp existed cannot be shown to belong to
// anybody, so it is dropped rather than handed to whoever opens the app
// next. That costs at most one in-progress quote, once, when this ships --
// set against handing one agent's work to another. Unlike the offline
// snapshot this is unsaved work that exists nowhere else, which is an
// argument for keeping it, not for guessing whose it is.
function draftBelongsTo(draft, userId){
  return !!(draft && userId && draft.userId && String(draft.userId) === String(userId));
}
function restoreQuoteDraft(){
  let draft;
  try{ draft = JSON.parse(localStorage.getItem(QUOTE_DRAFT_KEY) || 'null'); }catch(_e){ draft = null; }
  if(!draft) return;
  // Dropped, not merely ignored: left in place it would be re-saved under
  // this login's own stamp the moment they touch a basket, laundering the
  // previous agent's work into theirs.
  if(!draftBelongsTo(draft, currentUser && currentUser.id)){ clearQuoteDraft(); return; }
  restoringQuoteDraft = true;
  try{
    if(draft.carts && typeof draft.carts === 'object'){
      Object.keys(draft.carts).forEach(k=>{
        if(Array.isArray(draft.carts[k]) && draft.carts[k].length) carts[k] = draft.carts[k];
      });
    }
    if(draft.chosenClientId!=null){
      const client = agentClients.find(c=>String(c.id)===String(draft.chosenClientId));
      if(client){
        /* A draft written before baskets were per-client holds a single
           `cart` and no `carts` at all. It belonged to whoever was chosen
           at the time, so it is adopted into that client's basket rather
           than dropped -- an agent mid-quote when the app updates does not
           lose their work.

           Gated on the ABSENCE of `carts`, because in a current draft
           `cart` is the unnamed basket and belongs to nobody. Without
           that, a client whose own basket happened to be empty would
           silently inherit whatever was waiting to be claimed. */
        if(!draft.carts && Array.isArray(draft.cart) && draft.cart.length && !carts[String(client.id)]){
          carts[String(client.id)] = draft.cart;
        }
        selectClient(client);
      }
    }
    /* The unnamed basket comes back whether or not a client was chosen:
       an agent can have one waiting to be claimed while looking at
       somebody else's quote. Set after the branch above, so a legacy
       draft that adopted its loose items into a client does not then put
       the same items back in the unnamed basket as well. */
    if(Array.isArray(draft.cart) && draft.cart.length && !unnamedCart.length){
      unnamedCart = draft.cart;
      if(!chosenClient) cart = unnamedCart;
    }
    if(draft.deliveryMode==='shop_delivery'){
      document.getElementById('ag_delivery_shop').checked = true;
      document.getElementById('ag_delivery_shop').dispatchEvent(new Event('change'));
    }
    if(draft.deliveryAddress) document.getElementById('ag_delivery_address').value = draft.deliveryAddress;
  } finally {
    restoringQuoteDraft = false;
  }
}

// Agents are deliberately NOT shop_members (see 0012_sales_agents.sql) --
// there's no shop_members row to look up here at all, unlike the admin/
// worker apps' ensureAuthAndShop(). This looks up the agents table
// directly by user_id instead.
async function ensureAgentAuth(){
  // Calling getUser() directly here (rather than through getAuthedUser(),
  // which folds every failure into a plain null) is what lets the offline
  // fallback below tell "not logged in" apart from "couldn't reach the
  // auth server right now" -- getSession() only reads the session already
  // persisted in localStorage, so it's the one check that still works
  // with no connection. A returning agent who's offline with a still-
  // valid local session and a cached identity from a previous successful
  // boot can resume straight into the app; a login form would just be a
  // dead end they could never actually submit.
  const { data: userData, error: userErr } = await sb.auth.getUser();
  let user = (!userErr && userData && userData.user) ? userData.user : null;
  if(!user){
    const cached = loadOfflineCache();
    const { data: sessionData } = await sb.auth.getSession();
    const sessionUserId = sessionData && sessionData.session && sessionData.session.user && sessionData.session.user.id;
    // Only resume from a snapshot this very login left behind. Without the
    // check, an offline boot on a shared device would restore whoever used
    // the app here last -- their identity, their clients, their orders.
    if(isNetworkError(userErr) && cached && cached.myAgent && cacheBelongsTo(cached, sessionUserId)){
      if(sessionData && sessionData.session){
        currentUser = sessionData.session.user;
        currentShopId = cached.currentShopId;
        myAgent = cached.myAgent;
        isOffline = true;
        bootedFromCache = true;
        hideAuthOverlay();
        return;
      }
    }
    await showLoginScreen();
    user = await getAuthedUser();
    if(!user) throw new Error('Sign-in did not complete');
  } else if(initialAuthLinkType==='invite' || initialAuthLinkType==='recovery'){
    await showSetPasswordScreen();
  }
  currentUser = user;

  // Deliberately not maybeSingle(): agents are rostered per shop, by hand,
  // and nothing stops the same login being invited into two of them. The
  // moment that happens maybeSingle() rejects with a raw PostgREST error
  // ("JSON object requested, multiple (or no) rows returned"), which
  // reaches the agent as an unexplained failure to start with no hint of
  // the cause. Selecting the rows instead lets each case say what actually
  // went wrong.
  //
  // Note this deliberately does NOT quietly pick one of them: currentShopId
  // scopes every subsequent read in the app, so landing on the wrong shop
  // would show the agent an empty, fully-successful-looking account -- the
  // exact "my data was deleted" failure the offline-cache guards were added
  // to stop. Better to refuse to start and say why.
  const { data: agentRows, error } = await sb.from('agents').select('*').eq('user_id', user.id);
  if(error){
    // Same idea one step later: the agents-table lookup itself is what
    // just failed to reach the network, not an actual "no such agent".
    const cached = loadOfflineCache();
    if(isNetworkError(error) && cached && cached.myAgent && cacheBelongsTo(cached, user.id)){
      currentShopId = cached.currentShopId;
      myAgent = cached.myAgent;
      isOffline = true;
      bootedFromCache = true;
      hideAuthOverlay();
      return;
    }
    throw error;
  }
  if(!agentRows || !agentRows.length){
    throw new Error("This login isn't linked to an agent account. Ask the shop to send you an invite.");
  }
  if(agentRows.length > 1){
    throw new Error(`This login is linked to ${agentRows.length} different shops, so the app can't tell which one to open. Ask the shop to remove the duplicate agent account.`);
  }
  const agentRow = agentRows[0];
  // A retired agent (0028) still has a row -- their id stays reserved so
  // it can't be reused -- but current_agent_id() no longer resolves for
  // them, so every policy is closed and every read would come back empty.
  // Blocking here is what stops that landing as a fully-loaded app with
  // no orders, no clients and no earnings: the exact "my data was
  // deleted" screen this whole line of work exists to prevent.
  if(agentRow.retired_at){
    throw new Error("This agent account has been retired, so it can't be used to sign in. Contact the shop if that's not right.");
  }
  currentShopId = agentRow.shop_id;
  // The monitor should show an agent's phone the moment it gets in.
  owSessionBeat(true);
  /* Paused is NOT retired and must not be treated like it. Retiring
     closes current_agent_id(), so every policy shuts and the app would
     load empty -- which is why the block above refuses to start at all.
     A pause leaves all of that open on purpose: the agent keeps their
     clients, orders, earnings and catalogue, and only new orders stop.
     So they sign in normally and the app tells them what has changed.

     Read here because select('*') already has it -- the agent knows
     before building a basket, not after being refused one. */
  myAgent = { id: agentRow.id, name: agentRow.name, phone: agentRow.phone, email: agentRow.email,
    paymentTerm: agentRow.payment_term, paused: !!agentRow.unavailable };
  hideAuthOverlay();
}

/* Whether the shop has paused this agent. Kept off `myAgent` as the
   source of truth for the UI so a cached boot can decline to apply it --
   see setAgentPaused below. */
let agentPaused = false;
/* The server is the authority on this, and a cached snapshot is not the
   server. Applying a stale `paused` from the offline cache would lock a
   working agent out of the one thing the app is for, with no way to
   disprove it until they got signal back; letting a stale ACTIVE stand
   costs them one refused submit, which now explains itself. So the
   pessimistic direction is the one that needs a live read. */
function setAgentPaused(on){
  agentPaused = !!on;
  const banner = document.getElementById('ag_pausedBanner');
  if(banner) banner.style.display = agentPaused ? 'flex' : 'none';
  applyPausedToCart();
}
// The basket is deliberately NOT cleared. Their work survives the pause
// and is still there when the shop lifts it.
function applyPausedToCart(){
  const btn = document.getElementById('ag_submit_btn');
  if(!btn) return;
  btn.disabled = agentPaused;
  const label = document.getElementById('ag_slideLabel');
  if(label && agentPaused) label.textContent = 'Orders are paused';
  // The note sits above the slider, outside it, so the slider's own track
  // is left alone.
  const slide = document.getElementById('ag_slide') || btn;
  let note = document.getElementById('ag_submit_blocked');
  if(agentPaused && !note){
    note = document.createElement('div');
    note.className = 'ag-submit-blocked';
    note.id = 'ag_submit_blocked';
    note.textContent = 'The shop has paused your account, so this order can’t be sent yet. It will stay in your basket until they lift it.';
    slide.parentNode.insertBefore(note, slide);
  } else if(!agentPaused && note){
    note.remove();
  }
  if(!agentPaused && typeof renderDock === 'function' && typeof sendingOrder !== 'undefined' && !sendingOrder) renderDock();
}

async function callAgentFn(name, body){
  const { data, error } = await sb.functions.invoke(name, { body: { shopId: currentShopId, ...body } });
  if(error){
    // On a non-2xx response, supabase-js only gives us a generic
    // "Edge Function returned a non-2xx status code" in error.message --
    // the function's own { error: "..." } body (the actually useful part)
    // is on error.context, the raw Response, and has to be read separately.
    let msg = error.message;
    /* The whole body, not just its message. A function that says WHY it
       refused -- `paused: true` -- can only be acted on if the flag
       survives the throw, and this used to keep the string and drop
       everything around it, so every refusal arrived looking the same as
       every other. */
    let body = null;
    try{
      if(error.context && typeof error.context.json === 'function'){
        body = await error.context.json();
        if(body && body.error) msg = body.error;
      }
    }catch(_e){ /* keep the generic message if the body isn't JSON */ }
    const err = new Error(msg);
    err.body = body;
    /* A pause is an account state, so it is applied the moment the server
       reports one -- an agent who was working when the shop paused them
       finds out here, not at the next sign-in. */
    if(body && body.paused){ err.paused = true; setAgentPaused(true); }
    throw err;
  }
  if(data && data.error) throw new Error(data.error);
  /* A call that SUCCEEDS is proof they are not paused: the server checks
     on every submit, so getting through means the pause was lifted. That
     is what clears the banner without making them sign in again. */
  if(name === 'agent-submit-order' && agentPaused) setAgentPaused(false);
  return data;
}

function mapOrderRow(q){
  const payload = q.payload || {};
  return {
    id: q.id, status: q.status, voided: !!q.voided,
    items: payload.items || [],
    // The order's own date, set once at creation. payload.savedAt is
    // rewritten on every save, so it moves an order between months --
    // which is why earnings and the claim both key on this instead.
    date: q.date || null,
    savedAt: payload.savedAt || null,
    agentClientId: payload.agentClientId || null,
    deliveryMode: payload.deliveryMode || null,
    agentPaymentStatus: payload.agentPaymentStatus || 'unpaid',
    assignedWorkerId: payload.assignedWorkerId || null,
    assignedDeliveryId: payload.assignedDeliveryId || null,
    amountPaid: Number(q.amount_paid) || 0,
    /* The shop's check of the lines (see agentOrderTerms): when it was
       confirmed, the signature of the lines it confirmed, and the lines it
       could not supply -- kept so the track can strike them through rather
       than let them silently vanish. */
    shopConfirmedAt: payload.shopConfirmedAt || null,
    shopConfirmedTerms: payload.shopConfirmedTerms || null,
    droppedLines: Array.isArray(payload.droppedLines) ? payload.droppedLines : [],
    /* Before the shop signs the whole order off, each supplier says yes
       line by line (supplierConfirms, keyed by supplier), so the track
       can tick items off one at a time instead of all at once. The stage
       log is when each step was reached, for the times under the steps. */
    supplierConfirms: payload.supplierConfirms || null,
    stageLog: Array.isArray(payload.stageLog) ? payload.stageLog : [],
    payments: Array.isArray(payload.payments) ? payload.payments : [],
    createdAt: payload.createdAt || null,
    /* The agent changing their mind (agent-change-order): a cancel
       before paying, an ask once paid and how the shop answered it, the
       last edit, and the credit an agreed change left. */
    deliveryAddress: payload.deliveryAddress || null,
    /* Delivery: who takes it in and when, the shop's charges on it (a
       delivery fee), and -- once the shop marks it delivered -- who
       received it, when, and the photo it added. */
    deliveryContact: payload.deliveryContact || null,
    deliveryWhen: payload.deliveryWhen || null,
    charges: Array.isArray(payload.charges) ? payload.charges : [],
    delivered: payload.deliveredAt || payload.deliveredTo ? { to: payload.deliveredTo || null, at: payload.deliveredAt || null, photo: payload.deliveredPhoto || null } : null,
    agentCancel: payload.agentCancel || null,
    agentChange: payload.agentChange || null,
    agentEdit: payload.agentEdit || null,
    agentCredit: payload.agentCredit || null,
  };
}

async function fetchAgentHomeRows(){
  const [{ data: clientsData, error: clientsErr }, { data: ordersData, error: ordersErr },
         { data: inquiriesData, error: inquiriesErr }, { data: meData, error: meErr }] = await Promise.all([
    sb.from('agent_clients').select('*').eq('shop_id', currentShopId).order('name'),
    sb.from('saved_quotes').select('*').eq('shop_id', currentShopId),
    // Catalogue requests. 0025 created the policy for these and nothing ever
    // read them: a customer filled in "what do you need?" on the public page
    // and it went straight into a table no screen looked at. The agent got a
    // name and a phone number with no idea what was wanted.
    sb.from('catalogue_inquiries').select('*').eq('shop_id', currentShopId)
      .order('created_at', { ascending: false }).limit(50),
    /* The agent's own row, off the "agent views own row" policy (0012).
       This is how a LIFTED pause is noticed: the submit button is
       disabled while paused, so the successful-call path that clears the
       flag can never be reached from inside the app -- without this an
       agent would stay visibly paused until they signed in again, long
       after the shop had let them go.

       Folded into the existing Promise.all rather than added after it,
       so it costs no extra round trip. */
    sb.from('agents').select('unavailable').eq('shop_id', currentShopId).limit(1),
  ]);
  if(clientsErr) throw clientsErr;
  if(ordersErr) throw ordersErr;
  // Deliberately NOT fatal. Requests are a bonus on top of the client list;
  // failing the whole screen over them would turn a missing extra into a
  // dead app.
  if(inquiriesErr) console.warn('Could not load catalogue requests:', inquiriesErr.message);
  // Same rule, and it matters more here: refusing to show an agent their
  // orders because the pause check failed would be a worse outage than
  // the pause. Absent means "leave the flag as it was", not "active".
  if(meErr) console.warn('Could not re-check account status:', meErr.message);
  return { clients: clientsData || [], orders: ordersData || [], inquiries: inquiriesData || [],
    me: (!meErr && meData && meData.length) ? meData[0] : null };
}
// GUARD 2 -- an RLS denial and an expired/mid-refresh token both come back
// from PostgREST as an ordinary empty result set, indistinguishable from
// "this agent genuinely has no orders yet". Believing that on the first
// try is what made a token blip look like every order had been deleted.
// When a read comes back empty but the last good snapshot had rows, force
// a token refresh and ask once more; only a second empty answer on a
// provably fresh session is treated as real.
function readLostRows(rows, cached){
  if(!cached) return false;
  const lost = (fresh, stored) => (stored||[]).length > 0 && (fresh||[]).length === 0;
  return lost(rows.orders, cached.myOrders) || lost(rows.clients, cached.agentClients);
}
async function loadAgentHomeData(){
  // Own snapshot only -- restoring "lost" rows from a cache belonging to a
  // different agent is how a new agent ended up holding someone else's
  // client roster.
  const cached = ownCachedSnapshot();
  let rows = await fetchAgentHomeRows();
  // Whether the token was successfully renewed before the second attempt.
  // This is the whole difference between "empty because the session was
  // stale" and "empty because the rows are actually gone", and not tracking
  // it is what let this guard trap an agent forever: a shop legitimately
  // deleting all of an agent's orders left every subsequent load looking
  // exactly like a blip, so the app served the pre-deletion snapshot from
  // cache on every refresh, with no way out. Orders that no longer existed
  // kept showing, and anything genuinely new -- a catalogue request that
  // arrived afterwards -- could never appear, because this branch returns
  // before the fresh rows are assigned.
  let sessionProvenFresh = false;
  if(readLostRows(rows, cached)){
    try{
      const { data: refreshed, error: refreshErr } = await sb.auth.refreshSession();
      if(!refreshErr && refreshed && refreshed.session){
        sessionProvenFresh = true;
        rows = await fetchAgentHomeRows();
      }
    }catch(_e){ /* refresh unavailable -- fall through to the cache below */ }
  }
  if(readLostRows(rows, cached) && !sessionProvenFresh){
    // Empty, and we could NOT prove the session was good -- so the empty
    // is unexplained. Keep showing the last known-good data rather than a
    // convincing-looking empty account, and let the banner say so.
    console.warn('Read returned no rows where the cached snapshot has them, on a session we could not renew -- keeping cached data.');
    dataLooksSuspect = true;
    agentClients = cached.agentClients || [];
    myOrders = cached.myOrders || [];
    myInquiries = cached.myInquiries || [];
    return;
  }
  dataLooksSuspect = false;
  agentClients = rows.clients;
  myOrders = rows.orders.map(mapOrderRow);
  myInquiries = rows.inquiries;
  /* A live read of their own row, so lifting a pause reaches them on the
     next refresh instead of the next sign-in. Only when the row actually
     came back: `me` is null when the check failed, and treating that as
     "not paused" would clear a real pause on a network wobble. */
  if(rows.me) setAgentPaused(!!rows.me.unavailable);
  // Trusted because it came back on a token we had just renewed. Without
  // saying so, wouldWipeCachedData would refuse to write a snapshot that
  // empties something -- leaving the stale rows on the device to reappear
  // the next time the app opened offline.
  if(sessionProvenFresh) saveOfflineCache(true);
}

/* ================= FEED =================
   One card at a time, full screen, swipe up for the next -- the shape
   people already know from their phones, filled with the only things
   worth an agent's thumb: a bonus item that pays HIM, a client whose
   rhythm says they are due, the add-on a recent sale is missing, his own
   goal, a win, one lesson. Then it ends. "All caught up" is a card of its
   own, because a feed that never stops is time he is not spending with
   customers.

   Everything here is DERIVED from what the app already holds -- the
   catalogue, the shop's promotions, his cluster, his orders, his clients'
   own buying rhythm, his goal -- and nothing is invented. A figure that
   needs history he does not have yet is not drawn at all.

   What he does with a card is remembered on this device (the same
   per-login key the dismissed opportunities use): "Not for me" hides that
   item for 30 days and lowers its aisle; acting on a card lifts its
   aisle. His sales do the rest -- the aisles he actually earns in rank
   first. */

const FEED_NOT_ME_DAYS = 30;
const FEED_MAX_MONEY_CARDS = 8;

function feedPrefs(){
  try{
    const p = JSON.parse(localStorage.getItem(agentLocalKey('agentFeedPrefs')) || '{}');
    return { notMe: p.notMe || {}, acted: p.acted || {}, lessons: p.lessons || {}, about: p.about || null };
  }catch(_e){ return { notMe:{}, acted:{}, lessons:{}, about:null }; }
}
function saveFeedPrefs(p){
  try{ localStorage.setItem(agentLocalKey('agentFeedPrefs'), JSON.stringify(p)); }catch(_e){}
  feedPushPrefsSoon();
}

/* The same preferences, on the server (0102), so a new phone starts from
   what this agent has already taught the feed. The phone's copy is the
   working copy; the server's is merged in once per session and written
   back a moment after each change. Merging keeps the LATER of any two
   "Not for me"s, the larger of two act counts, every finished lesson, and
   a yes/no about the profile card only where this phone has none. */
function mergeFeedPrefs(local, remote){
  const out = { notMe: { ...(remote.notMe||{}) }, acted: { ...(remote.acted||{}) },
    lessons: { ...(remote.lessons||{}) }, about: local.about || remote.about || null };
  Object.entries(local.notMe||{}).forEach(([k,v])=>{ out.notMe[k] = Math.max(Number(out.notMe[k])||0, Number(v)||0); });
  Object.entries(local.acted||{}).forEach(([k,v])=>{ out.acted[k] = Math.max(Number(out.acted[k])||0, Number(v)||0); });
  Object.entries(local.lessons||{}).forEach(([k,v])=>{ out.lessons[k] = Math.max(Number(out.lessons[k])||0, Number(v)||0); });
  return out;
}
let feedPrefsSynced = false, feedPrefsTimer = null;
async function feedSyncPrefs(){
  if(feedPrefsSynced || !myAgent || !currentShopId) return;
  try{
    const { data, error } = await sb.from('agent_feed_prefs').select('prefs')
      .eq('shop_id', currentShopId).eq('agent_id', myAgent.id).maybeSingle();
    if(error) throw error;
    feedPrefsSynced = true;
    const merged = mergeFeedPrefs(feedPrefs(), (data && data.prefs) || {});
    try{ localStorage.setItem(agentLocalKey('agentFeedPrefs'), JSON.stringify(merged)); }catch(_e){}
    feedPushPrefsSoon();
  }catch(_e){ /* offline, or the table is not there yet: the phone's copy carries on */ }
}
function feedPushPrefsSoon(){
  if(!feedPrefsSynced) return;
  clearTimeout(feedPrefsTimer);
  feedPrefsTimer = setTimeout(async ()=>{
    try{
      await sb.from('agent_feed_prefs').upsert({ shop_id: currentShopId, agent_id: myAgent.id,
        prefs: feedPrefs(), updated_at: new Date().toISOString() }, { onConflict: 'shop_id,agent_id' });
    }catch(_e){ /* the next change tries again */ }
  }, 1500);
}

/* What he did with a card, for the shop's Feed studio. Fire and forget:
   a lost event costs the owner one row of a chart, and waiting on it
   would cost the agent a tap that feels slow. "Shown" is written once a
   card per day, however often he scrolls past it. */
function feedLog(card, action){
  if(!card || !myAgent || !currentShopId) return;
  const item = card.item || (card.matches && card.matches[0]) || null;
  const row = { shop_id: currentShopId, agent_id: myAgent.id, card_kind: card.kind, action,
    item_key: card.itemKey || (item ? feedItemKey(item.productId, item.variantIdx) : ''),
    client_id: card.client ? String(card.client.id) : null };
  try{ sb.from('agent_feed_events').insert(row).then(()=>{}, ()=>{}); }catch(_e){}
}
const feedShownToday = new Set();
function feedLogShown(card){
  const day = new Date().toISOString().slice(0,10);
  const key = `${day}|${card.key}`;
  if(feedShownToday.has(key)) return;
  feedShownToday.add(key);
  let seen = {};
  try{ seen = JSON.parse(localStorage.getItem(agentLocalKey('agentFeedShown')) || '{}'); }catch(_e){}
  if(seen[key]) return;
  // Only today's keys are kept; yesterday's would just grow the store.
  Object.keys(seen).forEach(k=>{ if(!k.startsWith(day)) delete seen[k]; });
  seen[key] = 1;
  try{ localStorage.setItem(agentLocalKey('agentFeedShown'), JSON.stringify(seen)); }catch(_e){}
  if(['hello','done'].includes(card.kind)) return;
  feedLog(card, 'shown');
}

/* Notifications (0103, agent-nudge). The phone is asked once, from a
   button he pressed -- never on load -- and the answer is stored against
   his own login. What gets sent, and when, is decided on the server:
   only in working hours, a few a day at most, each moment once. */
function agentWebPushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function agentWebPushState(){
  if(!agentWebPushSupported()) return 'unsupported';
  if(Notification.permission === 'denied') return 'denied';
  let on = false;
  try{ on = localStorage.getItem(agentLocalKey('agentPushOn')) === '1'; }catch(_e){}
  return on && Notification.permission === 'granted' ? 'on' : 'off';
}
function urlB64ToBytes(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c=> c.charCodeAt(0)));
}
async function enableAgentWebPush(){
  if(!agentWebPushSupported()){ toast('This phone cannot show notifications from the browser'); return false; }
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('Notifications stay off -- you can turn them on in the browser settings'); return false; }
    const reg = await navigator.serviceWorker.register('/agent-sw.js', { scope: '/agent.html' });
    await navigator.serviceWorker.ready;
    const { data: cfg, error: cfgErr } = await sb.functions.invoke('agent-nudge', { body: { action: 'config' } });
    if(cfgErr || !cfg || !cfg.publicKey) throw new Error('the shop has not finished setting notifications up');
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(cfg.publicKey) });
    const j = sub.toJSON();
    const { error } = await sb.from('agent_push_subscriptions').upsert({
      shop_id: currentShopId, agent_id: myAgent.id, user_id: currentUser.id,
      endpoint: j.endpoint, p256dh: j.keys.p256dh, auth_key: j.keys.auth,
    }, { onConflict: 'endpoint' });
    if(error) throw error;
    try{ localStorage.setItem(agentLocalKey('agentPushOn'), '1'); }catch(_e){}
    toast("Notifications on -- you'll hear when something is worth a tap");
    return true;
  }catch(err){
    toast(`Could not turn notifications on: ${err.message || err}`);
    return false;
  }
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', (e)=>{
    if(e.data && e.data.type === 'open') routePush(e.data.open);
  });
}

/* Items the shop has put in front of its agents (0102), live until their
   end date. Read once a session; a failed read just means no pinned card. */
let feedPins = [], feedPinsLoaded = false;
async function feedEnsurePins(){
  if(feedPinsLoaded) return;
  try{
    const { data, error } = await sb.from('agent_feed_pins').select('*').eq('shop_id', currentShopId);
    if(error) throw error;
    const today = new Date().toISOString().slice(0,10);
    feedPins = (data||[]).filter(p=> !p.ends_on || p.ends_on >= today);
    feedPinsLoaded = true;
  }catch(_e){ /* no pins shown rather than a broken feed */ }
}

function feedItemKey(productId, variantIdx){
  return `${productId}::${variantIdx==null?'':variantIdx}`;
}

/* What ONE sale of an item puts in his pocket: the room between his cost
   and the shop's suggested price, plus the bonus if the shop is running
   one on it. A percentage bonus is taken on the suggested price, the same
   base the earnings screen quotes it against. */
function feedEarnEach(it, promo){
  const floor = Number(it && it.floorPrice) || 0;
  const our = Number(it && it.ourPrice) || 0;
  const margin = Math.max(0, our - floor);
  let bonus = 0;
  if(promo){
    const v = Number(promo.bonusValue) || 0;
    bonus = promo.bonusType === 'fixed' ? v : Math.round((our || floor) * v / 100);
  }
  return { margin, bonus, total: margin + bonus };
}

/* His taste, from his own sales: which aisles he earns in, what he has
   sold and how often, the weekday his orders land on, and whether his
   bigger baskets pay. */
function feedTaste(orders, catalogItems){
  const live = (orders||[]).filter(o=>!o.voided);
  const byCat = new Map(), sold = new Map(), dayCount = [0,0,0,0,0,0,0];
  let total = 0;
  const lookup = new Map((catalogItems||[]).map(it=>[feedItemKey(it.productId, it.variantIdx), it]));
  const multi = [], single = [];
  live.forEach(o=>{
    const d = orderDate(o);
    if(d) dayCount[new Date(d+'T00:00:00').getDay()]++;
    const lines = o.items || [];
    const earn = orderEarnings(o).margin;
    (lines.length >= 2 ? multi : single).push(earn);
    lines.forEach(li=>{
      const key = feedItemKey(li.productId, li.variantIdx);
      sold.set(key, (sold.get(key)||0) + 1);
      const ce = lookup.get(key);
      const cat = ce ? itemCategory(ce) : AGENT_OTHER_CATEGORY;
      const m = agentLinePriced(li)
        ? Math.max(0, (Number(li.agentSellPrice) - (Number(li.sellPrice)||0)) * (Number(li.qty)||0)) : 0;
      byCat.set(cat, (byCat.get(cat)||0) + m);
      total += m;
    });
  });
  const share = new Map();
  byCat.forEach((v,k)=> share.set(k, total > 0 ? v/total : 0));
  const topCat = [...byCat.entries()].sort((a,b)=>b[1]-a[1])[0] || null;
  let bestDay = -1, bestDayN = 0;
  dayCount.forEach((n,i)=>{ if(n > bestDayN){ bestDay = i; bestDayN = n; } });
  const avg = (xs)=> xs.length ? xs.reduce((s,x)=>s+x,0)/xs.length : 0;
  return {
    orders: live.length, share, sold, topCat: topCat ? topCat[0] : null,
    topCatShare: topCat && total > 0 ? topCat[1]/total : 0,
    bestDay, bestDayShare: live.length ? bestDayN / live.length : 0,
    multiAvg: avg(multi), singleAvg: avg(single), multiN: multi.length, singleN: single.length,
  };
}

/* Which of his clients have bought this item before, the longest-waiting
   first -- the people a card about it is worth sending to. */
function feedBuyersOf(productId, variantIdx){
  const key = feedItemKey(productId, variantIdx);
  const last = new Map();
  myOrders.filter(o=>!o.voided && o.agentClientId).forEach(o=>{
    if(!(o.items||[]).some(li=>feedItemKey(li.productId, li.variantIdx)===key)) return;
    const d = orderDate(o) || '';
    const prev = last.get(String(o.agentClientId));
    if(!prev || d > prev) last.set(String(o.agentClientId), d);
  });
  return [...last.entries()]
    .map(([id, d])=>({ client: agentClients.find(c=>String(c.id)===id), last: d }))
    .filter(x=>x.client)
    .sort((a,b)=> String(a.last).localeCompare(String(b.last)));
}

/* Items bought together in his own orders. An add-on card needs a pair
   seen at least twice -- once is a coincidence. */
function feedPairs(orders){
  const pairs = new Map();
  (orders||[]).filter(o=>!o.voided).forEach(o=>{
    const keys = [...new Set((o.items||[]).map(li=>feedItemKey(li.productId, li.variantIdx)))];
    keys.forEach(a=> keys.forEach(b=>{
      if(a===b) return;
      if(!pairs.has(a)) pairs.set(a, new Map());
      pairs.get(a).set(b, (pairs.get(a).get(b)||0) + 1);
    }));
  });
  return pairs;
}

function feedDaysLeft(endsAt){
  if(!endsAt) return null;
  const days = Math.ceil((new Date(endsAt+'T00:00:00Z') - Date.now()) / 86400000);
  return days >= 0 ? days : null;
}

/* What a catalogue request is about: the item it was sent from, or --
   when it came in as words -- the catalogue items those words name. */
function feedInquiryMatch(q){
  let item = null;
  if(q.product_id) item = catalogEntry(q.product_id, q.variant_idx==null || q.variant_idx==='' ? null : Number(q.variant_idx));
  let matches = [];
  if(!item && q.message){
    const words = String(q.message).toLowerCase().match(/[a-z0-9]{4,}/g) || [];
    if(words.length){
      matches = catalog.map(it=>{
        const name = `${it.name} ${it.variantLabel||''} ${it.category||''}`.toLowerCase();
        return { it, hits: words.filter(w=> name.includes(w)).length };
      }).filter(x=>x.hits > 0).sort((a,b)=> b.hits - a.hits).slice(0, 3).map(x=>x.it);
    }
  }
  return { item, matches };
}

/* Money that is already his and waits on one move: a finished month's
   bonus nobody has claimed, an order at the counter with his name on it,
   and a prepaid order the shop will not start until he pays. */
let feedClaimsLoaded = false;
async function feedEnsureClaims(){
  if(feedClaimsLoaded) return;
  try{
    const { data, error } = await sb.from('agent_commission_claims').select('*')
      .eq('shop_id', currentShopId).eq('agent_id', myAgent.id);
    if(error) throw error;
    myClaims = data || [];
    feedClaimsLoaded = true;
  }catch(_e){ /* the claim row is left out rather than guessed */ }
}
function feedMoneyWaiting(now){
  const rows = [];
  if(feedClaimsLoaded){
    const cur = currentMonthKey();
    for(let k = 1; k <= 3; k++){
      const m = shiftMonth(cur, -k);
      const bonus = monthEarnings(m).bonus;
      if(bonus > 0 && !findClaim(m)) rows.push({ kind:'claim', month: m, amount: bonus, earn: bonus });
    }
  }
  myOrders.filter(o=>!o.voided && o.status==='pending_delivery' && o.deliveryMode==='agent_pickup').forEach(o=>{
    rows.push({ kind:'pickup', order: o, client: agentClients.find(c=>String(c.id)===String(o.agentClientId)) || null,
      amount: orderTotal(o), earn: orderEarnings(o).margin });
  });
  if(myAgent && myAgent.paymentTerm === 'prepay'){
    myOrders.filter(o=>!o.voided && o.status==='draft' && o.agentPaymentStatus!=='paid' && orderShopChecked(o)).forEach(o=>{
      const shopTotal = (o.items||[]).reduce((s,it)=> s + (Number(it.sellPrice)||0) * (Number(it.qty)||0), 0);
      rows.push({ kind:'prepay', order: o, client: agentClients.find(c=>String(c.id)===String(o.agentClientId)) || null,
        amount: Math.max(0, shopTotal - (Number(o.amountPaid)||0)), earn: orderEarnings(o).margin });
    });
  }
  return rows.sort((a,b)=> b.earn - a.earn);
}

/* The whole feed, ranked. Money cards compete on what one sale pays him,
   weighted by how much of his living that aisle already is and by what
   he has done with cards like it; the rest have fixed places so the feed
   never becomes a wall of products. */
function buildFeedCards(now){
  now = now || new Date();
  const prefs = feedPrefs();
  const hidden = (key)=>{
    const t = prefs.notMe[key];
    return t && (Date.now() - t) < FEED_NOT_ME_DAYS * 86400000;
  };
  const taste = feedTaste(myOrders, catalog);
  // "Not for me" on an item lowers its whole aisle a little, for as long
  // as the item itself stays hidden.
  const notMeByCat = new Map();
  Object.keys(prefs.notMe).forEach(k=>{
    if(!hidden(k) || k.indexOf('::') < 0) return;
    const [pid, vi] = k.split('::');
    const ce = catalogEntry(pid, vi===''?null:Number(vi));
    if(ce) notMeByCat.set(itemCategory(ce), (notMeByCat.get(itemCategory(ce))||0) + 1);
  });
  const lift = (cat)=>{
    const s = taste.share.get(cat) || 0;
    const acted = Number(prefs.acted[cat]) || 0;
    const notMe = notMeByCat.get(cat) || 0;
    return (0.6 + s * 1.4) * (1 + Math.min(acted, 5) * 0.12) * Math.pow(0.8, Math.min(notMe, 4));
  };
  const money = [];

  // Bonus items: only ones he can earn on today.
  promotions.forEach(p=>{
    const it = catalogEntry(p.productId, p.variantIdx);
    if(!it) return;
    const key = feedItemKey(it.productId, it.variantIdx);
    if(hidden(key)) return;
    const earn = feedEarnEach(it, p);
    if(!(earn.total > 0)) return;
    const soldN = taste.sold.get(key) || 0;
    money.push({
      kind:'bonus', key: `bonus:${key}`, itemKey: key, item: it, promo: p, earn,
      soldN, buyers: feedBuyersOf(it.productId, it.variantIdx).slice(0, 4),
      daysLeft: feedDaysLeft(p.endsAt), inCluster: isInCluster(it.productId, it.variantIdx),
      wait: clusterEligibility(it.productId, it.variantIdx),
      score: earn.total * lift(itemCategory(it)) * (soldN ? 1.3 : 1),
    });
  });

  // Clients whose own rhythm says they are due, with what they always buy.
  const counts = clientOrderCounts();
  agentClients.forEach(c=>{
    const cad = clientCadence(c, counts, now);
    if(!cad || cad.daysSince < cad.avgGapDays || cad.daysSince >= 60) return;
    const key = `due:${c.id}:${cad.lastDateKey}`;
    if(hidden(key)) return;
    const regulars = clientRegulars(counts.get(c.id)||[]).slice(0, 3)
      .map(r=>({ r, it: catalogEntry(r.productId, r.variantIdx) })).filter(x=>x.it);
    money.push({
      kind:'due', key, client: c, cad, regulars,
      earn: { total: Math.round(cad.avgMargin) },
      score: cad.avgMargin * (cad.daysSince >= cad.avgGapDays * 1.5 ? 1.3 : 1.1),
    });
  });

  // The add-on a recent sale is missing: bought together at least twice
  // in his own orders, absent from a sale in the last 14 days.
  const pairs = feedPairs(myOrders);
  const cutoff = new Date(now.getTime() - 14*86400000).toISOString().slice(0,10);
  const seenAddon = new Set();
  myOrders.filter(o=>!o.voided && o.agentClientId && (orderDate(o)||'') >= cutoff)
    .sort((a,b)=> String(orderDate(b)).localeCompare(String(orderDate(a))))
    .forEach(o=>{
      const client = agentClients.find(c=>String(c.id)===String(o.agentClientId));
      if(!client) return;
      const have = new Set((o.items||[]).map(li=>feedItemKey(li.productId, li.variantIdx)));
      (o.items||[]).forEach(li=>{
        const a = feedItemKey(li.productId, li.variantIdx);
        (pairs.get(a) || new Map()).forEach((n, b)=>{
          if(n < 2 || have.has(b)) return;
          const key = `addon:${client.id}:${b}`;
          if(seenAddon.has(key) || hidden(key) || hidden(b)) return;
          const [pid, vi] = b.split('::');
          const it = catalogEntry(pid, vi===''?null:Number(vi));
          const base = catalogEntry(li.productId, li.variantIdx);
          if(!it || !base) return;
          const promo = promotedMap().get(b);
          const earn = feedEarnEach(it, promo);
          seenAddon.add(key);
          money.push({ kind:'addon', key, itemKey: b, item: it, base, client, together: n, promo, earn,
            score: Math.max(earn.total, 1) * lift(itemCategory(it)) * 1.2 });
        });
      });
    });

  // Buying a few more would drop his cost to the next tier. Only for
  // things a client buys again and again (a regular), only when the
  // usual order sits under the tier line, and only when crossing it pays
  // HIM more than the usual order does.
  agentClients.forEach(c=>{
    const regs = clientRegulars(counts.get(c.id)||[]);
    regs.forEach(r=>{
      const it = catalogEntry(r.productId, r.variantIdx);
      if(!it || it.bestTierMinQty == null) return;
      const tierQty = Number(it.bestTierMinQty), tierCost = Number(it.bestTierPrice) || 0;
      const floor = Number(it.floorPrice) || 0, our = Number(it.ourPrice) || 0;
      const usual = usualQty(r.qtys);
      // A step he can ask for, not a leap: past three times the usual
      // order it stops being an upsell and becomes a different customer.
      if(!(usual > 0) || usual >= tierQty || tierQty > usual * 3 || !(tierCost > 0) || tierCost >= floor || our <= 0) return;
      const nowEarn = usual * Math.max(0, our - floor);
      const tierEarn = tierQty * Math.max(0, our - tierCost);
      if(tierEarn <= nowEarn) return;
      const key = `bulk:${c.id}:${feedItemKey(it.productId, it.variantIdx)}`;
      if(hidden(key)) return;
      money.push({ kind:'bulk', key, item: it, client: c, usual, tierQty, tierCost, nowEarn, tierEarn,
        earn: { total: tierEarn - nowEarn },
        score: (tierEarn - nowEarn) * lift(itemCategory(it)) * 1.1 });
    });
  });

  money.sort((a,b)=> b.score - a.score);
  const picks = money.slice(0, FEED_MAX_MONEY_CARDS);

  const cards = [{ kind:'hello', key:'hello', picks }];

  // Warm leads first: someone asked, on his own catalogue page, and every
  // hour unanswered makes them likelier to buy somewhere else.
  (myInquiries||[]).filter(q=>!q.handled_at)
    .sort((a,b)=> String(b.created_at||'').localeCompare(String(a.created_at||'')))
    .slice(0, 3)
    .forEach(q=> cards.push({ kind:'ask', key:`ask:${q.id}`, inq: q, ...feedInquiryMatch(q) }));

  // Money already his, waiting on one move from him.
  const waiting = feedMoneyWaiting(now);
  if(waiting.length) cards.push({ kind:'waiting', key:'waiting', rows: waiting });

  // What the shop has pinned: the owner's own word, so it comes before
  // anything the feed worked out for itself.
  const promotedNow = promotedMap();
  (typeof feedPins !== 'undefined' ? feedPins : []).forEach(pin=>{
    const it = catalogEntry(pin.product_id, pin.variant_idx === '' || pin.variant_idx == null ? null : Number(pin.variant_idx));
    if(!it) return;
    const itemKey = feedItemKey(it.productId, it.variantIdx);
    const key = `pin:${pin.id}`;
    if(hidden(key)) return;
    const promo = promotedNow.get(itemKey);
    cards.push({ kind:'pin', key, pin, itemKey, item: it, promo, earn: feedEarnEach(it, promo),
      buyers: feedBuyersOf(it.productId, it.variantIdx).slice(0, 4),
      inCluster: isInCluster(it.productId, it.variantIdx) });
  });
  const extras = [];

  const achievements = computeAchievements();
  const seen = seenAchievementIds();
  const fresh = achievements.filter(a=>a.unlocked && !seen.has(a.id));
  const next = achievements.filter(a=>!a.unlocked).sort((a,b)=> (b.current/b.target) - (a.current/a.target))[0] || null;
  if(fresh.length) extras.push({ at: 2, card: { kind:'win', key:`win:${fresh.map(a=>a.id).join(',')}`, fresh, next } });

  if(taste.orders >= 6 && prefs.about !== 'no') extras.push({ at: 3, card: { kind:'about', key:'about', taste } });
  extras.push({ at: 4, card: { kind:'goal', key:'goal', picks } });

  // Where he stands this month, when there is a board to stand on.
  const lb = (typeof leaderboard !== 'undefined') ? leaderboard : null;
  if(lb && lb.you && lb.totalAgents >= 2){
    let lastRank = null;
    try{ lastRank = Number(localStorage.getItem(agentLocalKey('agentFeedLastRank'))) || null; }catch(_e){}
    const orders = Number(lb.you.completedOrders)||0;
    const typical = orders ? (Number(lb.you.amount)||0) / orders : 0;
    extras.push({ at: 5, card: { kind:'rank', key:`rank:${lb.period}:${lb.you.rank}`, lb,
      movedUp: lastRank != null && lb.you.rank < lastRank, typical } });
  }

  const lesson = feedLesson(taste, prefs);
  if(lesson) extras.push({ at: 5, card: { kind:'lesson', key:`lesson:${lesson.id}`, lesson } });

  const body = picks.slice();
  extras.sort((a,b)=>a.at-b.at).forEach(x=> body.splice(Math.min(x.at, body.length), 0, x.card));
  cards.push(...body);
  cards.push({ kind:'done', key:'done', picks });
  return cards;
}

/* One lesson at a time, chosen from HIS numbers, and only when his
   numbers make the case -- a lesson he has already learned is not shown. */
function feedLesson(taste, prefs){
  const lessons = [];
  if(taste.multiN >= 3 && taste.singleN >= 3 && taste.multiAvg > taste.singleAvg * 1.2){
    lessons.push({ title:'Ask for the add-on', id:'addon',
      them: Math.round(taste.multiAvg), you: Math.round(taste.singleAvg),
      themL:'2+ items', youL:'1 item',
      say:'Great &mdash; shall I add what goes with it? Saves you a second trip.',
      gain: Math.round(taste.multiAvg - taste.singleAvg) });
  }
  const promoCount = promotions.length;
  const clusterCount = cluster.length;
  if(promoCount >= 2 && clusterCount < promoCount){
    lessons.push({ title:'Star the bonus items', id:'cluster',
      them: promoCount, you: clusterCount, themL:'on bonus', youL:'in your cluster',
      say:'A bonus only pays on items in your cluster. Star them before you sell.',
      gain: 0 });
  }
  return lessons.find(l=> !prefs.lessons[l.id]) || null;
}


// "1 box", "10 boxes" -- a count is read aloud, so it has to sound right.
function fdUnits(n, unit){
  const u = String(unit||'unit').trim();
  if(Number(n) === 1 || /s$/i.test(u)) return `${n} ${u}`;
  return `${n} ${/(x|ch|sh)$/i.test(u) ? u + 'es' : u + 's'}`;
}

function clientCadence(c, counts, today){
  const orders = (counts.get(c.id)||[]).filter(o=>!o.voided && orderDate(o)).slice()
    .sort((a,b)=> String(orderDate(a)).localeCompare(String(orderDate(b))));
  const days = [...new Set(orders.map(o=> orderDate(o)))]; // a rhythm is between visits: two orders on one day are one, not "every 0 days"
  if(days.length < 2) return null; const dates = days.map(d=> new Date(d+'T00:00:00'));
  let gapSum = 0;
  for(let i=1;i<dates.length;i++) gapSum += (dates[i]-dates[i-1]) / 86400000;
  const avgGapDays = gapSum / (dates.length - 1);
  const lastDate = dates[dates.length-1];
  return {
    orders, avgGapDays, lastDate,
    lastDateKey: days[days.length-1],
    daysSince: (today - lastDate) / 86400000,
    avgMargin: orders.reduce((s,o)=>s+orderEarnings(o).margin,0) / days.length,
    avgOrder: orders.reduce((s,o)=>s+orderTotal(o),0) / days.length,
  };
}


// Dismissals are local to the device on purpose for v1 -- there's no
// opportunities table yet to write a "dismissed" status into, and most
// keys self-clear anyway (a reorder_due/dormant_client key embeds the
// client's last-order date, so it stops matching the moment they order
// again; unpaid_order stops being generated at all once the payment
// choice modal marks it paid).
// Keyed on the auth user id, not the agent id. Agent ids are only unique
// WITHIN a shop (AG0001 exists in every shop that has agents), so two
// logins sharing a device would otherwise share each other's dismissals
// and unlocked achievements -- the same class of cross-agent bleed the
// offline snapshot had, just with cosmetic state instead of client data.
function agentLocalKey(prefix){
  return `${prefix}_${(currentUser && currentUser.id) || (myAgent && myAgent.id) || 'anon'}`;
}

/* ---- Home: selling streak + achievement badges ----------------------
   Entirely self-referential (an agent's own history against their own
   past), computed client-side from data the agent already loads for
   Home/Earnings -- no new table, no cross-agent visibility. A
   leaderboard would need a service-role Edge Function to safely expose
   other agents' figures, which is a real privacy decision on its own
   and deliberately out of scope here. */
function weekStart(d){
  const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (dt.getDay()+6)%7; // days since Monday
  dt.setDate(dt.getDate()-day);
  return dt;
}
function weekKey(d){ return weekStart(d).toISOString().slice(0,10); }

// Consecutive weeks with at least one completed sale, counted back from
// today. The current week never breaks the streak just because it
// hasn't happened yet -- counting starts from last week until today's
// week has its own completed order.
function computeSellingStreak(){
  const dates = myOrders.filter(o=>!o.voided && o.status==='completed' && orderDate(o)).map(o=>new Date(orderDate(o)+'T00:00:00'));
  if(!dates.length) return 0;
  const activeWeeks = new Set(dates.map(weekKey));
  let cursor = weekStart(new Date());
  if(!activeWeeks.has(weekKey(cursor))) cursor.setDate(cursor.getDate()-7);
  let streak = 0;
  while(activeWeeks.has(weekKey(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-7);
  }
  return streak;
}

function computeAgentStats(){
  const completed = myOrders.filter(o=>!o.voided && o.status==='completed');
  const counts = clientOrderCounts();
  const repeatClients = agentClients.filter(c=>(counts.get(c.id)||[]).filter(o=>!o.voided).length > 1).length;
  const lifetimeEarnings = completed.reduce((sum,o)=> sum + orderEarnings(o).total, 0);
  return { completedOrders: completed.length, repeatClients, streakWeeks: computeSellingStreak(), lifetimeEarnings };
}

// What a monthly figure means for the days he has left. Shown rather than
// asked for, so the two columns stay consistent whichever way he thinks.
function goalPerDay(monthly, now){
  const days = fxDaysLeftInMonth(now || new Date());
  const earned = monthEarnings(currentMonthKey()).total;
  const left = Math.max(0, Number(monthly||0) - earned);
  return days > 0 ? Math.ceil(left / days) : 0;
}

// Days left in the month INCLUDING none of today -- what he has left to
// work with, so "22,000 a day" is a number he can still act on.
function fxDaysLeftInMonth(now){
  const end = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  return Math.max(0, end - now.getDate());
}
function fxBestMonth(){
  const by = new Map();
  myOrders.filter(o=>!o.voided && o.date).forEach(o=>{
    const k = String(o.date).slice(0,7);
    by.set(k, (by.get(k)||0) + orderEarnings(o).margin + (o.status==='completed' ? orderEarnings(o).bonus : 0));
  });
  const cur = currentMonthKey();
  let best = null;
  by.forEach((v,k)=>{ if(k !== cur && (!best || v > best.total)) best = { key:k, total:v }; });
  return best;
}

/* ================= EARNINGS ================= */
function currentMonthKey(){
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
}

// Two independent commission streams (see the design notes in
// 0012_sales_agents.sql / agent-submit-order): the agent's own margin,
// entirely their own business, and a supplier-funded bonus that only
// exists for items that were already in their cluster at sale time.
// Voided orders never happened as far as either stream is concerned.
// Whether this line carries a price the agent actually set.
//
// The admin's item picker writes sellPrice and has no agentSellPrice to
// write (index.html, "data.quote.items.push"), so a line the shop adds to
// an agent's order after the fact arrives without one. Coercing that
// absence to 0 made the line's margin (0 - sellPrice) * qty: the agent's
// earnings FELL by the full shop value of a line they never priced and
// never agreed to -- on their own earnings screen and, through the same
// formula in agent-leaderboard, on their public rank.
//
// Selling below the shop price is a real thing an agent can choose to do
// and stays negative. Not having priced a line at all is not the same
// thing, and must not be counted as the worst possible sale.
//
// Non-numeric fails the same way it fails absence, which also keeps NaN
// out of a total that feeds a league table.
function agentLinePriced(it){
  return !!it && it.agentSellPrice !== null && it.agentSellPrice !== undefined
    && it.agentSellPrice !== '' && Number.isFinite(Number(it.agentSellPrice));
}
function orderEarnings(o){
  let margin = 0, bonus = 0;
  (o.items||[]).forEach(it=>{
    if(agentLinePriced(it)){
      margin += (Number(it.agentSellPrice) - (Number(it.sellPrice)||0)) * (Number(it.qty)||0);
    }
    bonus += Number(it.bonusCommission)||0;
  });
  return { margin, bonus, total: margin + bonus };
}

// Margin and bonus are different money and do not qualify the same way.
//
// Margin is the agent's own, collected straight from their client and
// never touching the shop's books, so an order still out for delivery
// counts -- that is what they are owed by their customer.
//
// The bonus is the SHOP's money, paid out on a claim, and the shop only
// owes it on a sale that actually completed. Counting it earlier meant the
// claim button offered a figure that included drafts and in-flight orders,
// which agent-claim-commission would then decline to pay -- the agent
// seeing one number and receiving a smaller one, with no way to tell why.
//
// Both keyed on the order's date rather than payload.savedAt, which is
// rewritten on every save and so silently moved orders between months.
function monthEarnings(monthKey){
  let margin = 0, bonus = 0;
  const orders = myOrders.filter(o=>!o.voided && o.date && String(o.date).startsWith(monthKey));
  orders.forEach(o=>{
    const e = orderEarnings(o);
    margin += e.margin;
    if(o.status === 'completed') bonus += e.bonus;
  });
  return { margin, bonus, total: margin + bonus, orders };
}

function shiftMonth(monthKey, delta){

}
function monthLabel(monthKey){
  const [y, m] = monthKey.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('en-UG', { month:'long', year:'numeric' });

function monthName(monthKey){
  const [y, m] = monthKey.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('en-UG', { month:'long' });
}

// A compact figure for the chart columns -- six exact UGX amounts will not
// fit across a phone. The exact number for whichever month is selected sits
// in the wallet card directly above, so this trades precision for being
// able to compare six months at a glance.
function fmtCompactUGX(n){
  const v = Math.round(Number(n)||0);
  if(v < 1000) return String(v);
  const k = v/1000;
  if(k < 999.5) return Math.round(k) + 'k';
  const m = v/1000000;
  return (m < 9.95 ? m.toFixed(1).replace(/\.0$/,'') : String(Math.round(m))) + 'M';
}

// The last six months, and this screen's month picker: tapping a column
// loads that month into the wallet above and the order list below. The six
// months stay anchored to today -- only the marker moves -- so the shape of
// your half-year does not shift under you while you page through it.
//
// It was a 64px sparkline: no figures, no scale, and no marker for the
// month being inspected. Paging to April changed every other thing on the
// screen and left the chart showing the same six anonymous months.
const TREND_MONTHS = 6;

/* ================= ACCOUNT + sub-screens ================= */
function orderTotal(o){
  // What the client pays: the agent's prices, and any charge the shop
  // put on the order (a delivery fee), passed on as it is.
  return (o.items||[]).reduce((s,it)=> s + (Number(it.agentSellPrice)||0) * (Number(it.qty)||0), 0) + orderChargesAmount(o);
}
function clientOrderCounts(){
  const m = new Map();
  myOrders.forEach(o=>{
    if(!o.agentClientId) return;
    if(!m.has(o.agentClientId)) m.set(o.agentClientId, []);
    m.get(o.agentClientId).push(o);
  });
  return m;
}
// Day granularity, because an order carries a date and not a time. Feeding
// a date-only value to inquiryAgoLabel produced "13 hours ago" for an order
// placed today -- a precision the record does not have, measured from
// midnight rather than from when anything happened.
function daysAgoLabel(dateStr){
  if(!dateStr) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '';
  const days = Math.round((today - d) / 86400000);
  if(days <= 0) return 'Today';
  if(days === 1) return 'Yesterday';
  if(days < 30) return `${days} days ago`;
  const months = Math.round(days/30);
  return months < 12 ? `${months} month${months===1?'':'s'} ago` : 'Over a year ago';
}

// A client's record at a glance, from orders already loaded.
//
// Voided orders are excluded throughout. The row used to count them --
// `orders.length` straight off clientOrderCounts(), which filters nothing
// -- so a cancelled order still read as business this client had done,
// while every other screen in the app already discounted it.
function clientStats(orders){
  const live = (orders||[]).filter(o=>!o.voided);
  const dates = live.map(orderDate).filter(Boolean).sort();
  return {
    count: live.length,
    spent: live.reduce((s,o)=> s + orderTotal(o), 0),
    // Same completed-only rule the wallet and the account screen use: a
    // bonus is not earned until the order is finished.
    earned: live.filter(o=>o.status==='completed').reduce((s,o)=> s + orderEarnings(o).total, 0),
    lastAt: dates.length ? dates[dates.length-1] : null,
  };
}

// Names of whoever's assigned to an in-progress order, resolved via the
// agent_staff_names RPC (agents have no direct RLS access to `staff` --
// see 0015_agent_staff_names.sql) and cached here so re-renders (e.g.
// switching Ongoing/Completed) don't refetch.
let orderStaffNames = new Map();
async function ensureOrderStaffNamesLoaded(){
  const ids = new Set();
  myOrders.forEach(o=>{
    if(o.voided || o.status==='completed') return;
    if(o.assignedWorkerId) ids.add(o.assignedWorkerId);
    if(o.assignedDeliveryId && o.assignedDeliveryId!=='__agent__') ids.add(o.assignedDeliveryId);
  });
  const missing = [...ids].filter(id=>!orderStaffNames.has(id));
  if(!missing.length) return;
  try{
    const { data, error } = await sb.rpc('agent_staff_names', { p_shop_id: currentShopId, p_staff_ids: missing });
    if(error) throw error;
    (data||[]).forEach(row=> orderStaffNames.set(row.id, row.name));
  }catch(err){ /* names just stay generic ("being prepared") if this fails */ }
}

// When the order actually happened.
//
// The row used to show payload.savedAt, which is rewritten on every save --
// so an order placed in June but touched in July displayed, sorted and
// grouped as July while Earnings still counted it in June. Two screens
// disagreeing about the same order. `date` is set once at creation, which
// is why earnings and the claim already key on it.
function orderDate(o){
  return (o && o.date) || (o && o.savedAt ? String(o.savedAt).slice(0,10) : null);
}
