// Pre-fills the create-catalogue form, so whatever comes out has to pass
// the same check the form applies moments later -- otherwise an agent is
// shown a default their own form rejects, with nothing saying why.
//
// Two ways the old version could produce one: the pattern needs at least
// three characters (first and last must be alphanumeric), so a short name
// like "Jo" failed outright; and it stripped separators BEFORE slicing to
// 40, so a cut landing on one put a trailing dash straight back.
function suggestSlug(name){
  const base = String(name||'').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-')
    .slice(0,40)              // length first...
    .replace(/^-+|-+$/g,'');  // ...then tidy whatever the cut exposed
  if(base.length >= 3) return base;
  return base ? `${base}-catalogue` : 'agent';
}

// Same rapid-double-tap hazard the Solutions save button had: without a
// guard, two taps before the first insert resolves fire two inserts.
// The (shop_id, agent_id) primary key stops that from ever creating two
// rows, but the second insert would still surface as a confusing "that
// link is already taken" -- on a link the agent themselves just took.
let creatingCatalogue = false;
async function createMyCatalogue(){
  if(creatingCatalogue) return;
  const input = document.getElementById('ag_catalogue_slug');
  const slug = input.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'');
  if(!/^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$/.test(slug)){ toast('Enter a link using letters, numbers and dashes (at least 3 characters)'); return; }

    if(String(err.code)==='23505'){ toast('That link is already taken -- try a different one'); }
    else{ toast(isNetworkError(err) ? "You're offline -- couldn't create your catalogue" : `Could not create your catalogue: ${err.message||err}`); }
  } finally {

  }
}

// "X asked about Y, 2 hours ago" -- coarse on purpose. The only decision it
// supports is whether to call now, and nobody makes that on minutes.
function inquiryAgoLabel(iso){
  if(!iso) return '';
  const mins = Math.floor((Date.now() - new Date(iso).getTime())/60000);
  if(isNaN(mins) || mins < 0) return '';
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins} min ago`;
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return `${hrs} hour${hrs===1?'':'s'} ago`;
  const days = Math.floor(hrs/24);
  if(days < 30) return `${days} day${days===1?'':'s'} ago`;
  return new Date(iso).toLocaleDateString();
}
// The product the request was about, if it can still be named. The inquiry
// stores an id, not a name, and the catalogue may not be loaded on this
// screen -- so this is a bonus line, never a blank one.
function inquiryProductLabel(inq){
  if(!inq.product_id) return '';
  const p = (catalog||[]).find(x=> x.productId===inq.product_id
    && String(x.variantIdx==null?'':x.variantIdx) === String(inq.variant_idx==null?'':inq.variant_idx));
  if(!p) return '';
  return p.name + (p.variantLabel ? ' · ' + p.variantLabel : '');
}
// Outstanding first, newest first within each. Handled ones stay on the
// list rather than disappearing -- a mis-tap on Done would otherwise lose
// a lead with no way back -- but they sit below, dimmed, and are the first
// to fall off the cap.
function inquiriesForDisplay(){
  const rows = (myInquiries||[]).slice();
  const byNewest = (a,b)=> String(b.created_at||'').localeCompare(String(a.created_at||''));
  const open = rows.filter(r=>!r.handled_at).sort(byNewest);
  const done = rows.filter(r=>r.handled_at).sort(byNewest);
  return { open, done, list: open.concat(done).slice(0, 20) };
}

// Flips a request between outstanding and handled. Applied locally first so
// the list responds immediately -- this is a phone, often on a bad
// connection -- and put back if the write is refused, rather than leaving
// the screen claiming something the server never accepted.
async function toggleInquiryHandled(id){
  const inq = (myInquiries||[]).find(x=>x.id===id);
  if(!inq) return;
  const previous = inq.handled_at || null;
  const next = previous ? null : new Date().toISOString();
  inq.handled_at = next;
  renderInquiries();
  const { error } = await sb.from('catalogue_inquiries')
    .update({ handled_at: next })
    .eq('shop_id', currentShopId).eq('id', id);
  if(error){
    inq.handled_at = previous;
    renderInquiries();
    toast('Could not save that — check your connection');
    return;
  }
  saveOfflineCache();
}

// Search a client the way an agent would look for one: by name, or by the
// number they have in their phone.
function clientMatchesQuery(c, q){
  if(!q) return true;
  return `${c.name||''} ${c.phone||''} ${c.location||''}`.toLowerCase().includes(q);
}


// Counted once per ORDER, not once per line: a product on two lines of
// the same order is still one order that included it.
function clientRegulars(orders){
  const live = (orders||[]).filter(o=>!o.voided);
  const byKey = new Map();
  live.forEach(o=>{
    const seenHere = new Set();
    const d = orderDate(o) || '';
    (o.items||[]).forEach(it=>{
      const key = `${it.productId}::${it.variantIdx==null?'':it.variantIdx}`;
      if(!byKey.has(key)) byKey.set(key, {
        key, productId: it.productId, variantIdx: it.variantIdx==null?null:it.variantIdx,
        name: it.productName || it.name || '', orders:0, qtys:[],
        lastDate:'', lastRate:0, lastUnitEarn:0, unit: it.unit || '',
      });
      const r = byKey.get(key);
      if(!seenHere.has(key)){ seenHere.add(key); r.orders++; }
      const qty = Number(it.qty)||0;
      if(qty > 0) r.qtys.push(qty);
      // Ties go to the later line, so the newest price wins on a day with
      // two orders on it.
      if(d >= r.lastDate){
        r.lastDate = d;
        r.lastRate = Number(it.agentSellPrice)||0;
        r.lastUnitEarn = (Number(it.agentSellPrice)||0) - (Number(it.sellPrice)||0);
        r.unit = it.unit || r.unit;
      }
    });
  });
  /* "Always buy" has to mean more than once, or the heading is a lie on
     every client who has ordered a single time. A client with one order
     therefore has no regulars at all, which is correct: one order is not
     a pattern, and the order itself is on the screen directly below. */
  return [...byKey.values()]
    .filter(r=>r.orders >= 2)
    .sort((a,b)=> b.orders - a.orders
      || String(b.lastDate).localeCompare(String(a.lastDate))
      || String(a.name).localeCompare(String(b.name)));
}

/* The MEDIAN, not the mean, everywhere this screen says "usually" or
   "typical": one bulk order should not move "usually 4" to "usually 11"
   for the twenty ordinary ones around it, and one big job should not
   make a client's typical order twice what they normally spend. The mean
   is the right average for a TOTAL -- what he has earned off them -- and
   that is the only place this screen uses one. */
function medianOf(nums){
  const v = (nums||[]).filter(n=>Number.isFinite(n)).sort((a,b)=>a-b);
  if(!v.length) return 0;
  const mid = Math.floor(v.length/2);
  return v.length % 2 ? v[mid] : (v[mid-1] + v[mid]) / 2;
}
function usualQty(qtys){
  return Math.round(medianOf(qtys));
}

let promotions = [], cluster = [];
// Shop-configured wait period before a cluster item's bonus goes live --
// only known once ensureBrowseDataLoaded() has actually fetched it, hence
// starting null rather than a guessed default (see clusterEligibility()).
let clusterWaitDays = null;
let browseDataLoaded = false;

function isInCluster(productId, variantIdx){
  const vi = variantIdx==null ? '' : String(variantIdx);
  return cluster.some(c=>c.product_id===productId && String(c.variant_idx||'')===vi);
}

// Tells an agent, for an item already in their cluster, whether a sale of
// it right now would actually earn its bonus -- and if not, exactly how
// many days until it would. Mirrors agent-submit-order's own eligibility
// check exactly (added_at + clusterWaitDays), but this copy never gates
// anything itself; it's purely explanatory. Returns null if the item
// isn't in the cluster at all, or clusterWaitDays hasn't loaded yet.
function clusterEligibility(productId, variantIdx){
  if(clusterWaitDays==null) return null;
  const vi = variantIdx==null ? '' : String(variantIdx);
  const entry = cluster.find(c=>c.product_id===productId && String(c.variant_idx||'')===vi);
  if(!entry) return null;
  const waitMs = clusterWaitDays * 24*60*60*1000;
  const elapsedMs = Date.now() - new Date(entry.added_at).getTime();
  if(elapsedMs >= waitMs) return { eligible: true, daysLeft: 0 };
  return { eligible: false, daysLeft: Math.max(1, Math.ceil((waitMs - elapsedMs) / (24*60*60*1000))) };
}

    clusterWaitDays = promoRes.clusterWaitDays!=null ? Number(promoRes.clusterWaitDays) : null;

  }
}

function aisleLook(name){
  const n = String(name || '').toLowerCase();
  return AISLE_ICONS.find(a=> a.test.test(n)) || AISLE_FALLBACK;
}
// The aisle's tint as two custom properties, for a tile that wants its
// own colour: --ai the line, --ai-s the soft square behind it.
function aisleTint(name){
  const a = aisleLook(name);
  return `--ai:${a.ink};--ai-s:${a.soft};`;
}

// The aisle an item belongs to. A product with no category, or one whose
// category is only whitespace, is not homeless -- it is in Other. This
// matters more since the All-products list went: without an Other tile an
// uncategorised product could not be reached at all except by searching
// for it by name, which is exactly the knowledge a browsing agent lacks.
const AGENT_OTHER_CATEGORY = 'Other';
function itemCategory(it){
  return (it && it.category || '').trim() || AGENT_OTHER_CATEGORY;
}

/* ---- Main grid: variants merged into one card per product ------------
   catalog is flat -- one entry per (productId, variantIdx) -- so two
   variants of the same product used to render as two near-identical
   grid tiles (see the Mulper Hinges Soft/Normal duplication this was
   built to fix). Grouped here, with a chip row standing in for the
   second tile. Order Again and Sponsored stay on the old flat
   browseCardHTML below -- narrower rows where a merged card doesn't
   obviously help, and not what was actually asked for. ---- */
function groupCatalogItems(items){
  const order = [], map = new Map();
  items.forEach(it=>{
    if(!map.has(it.productId)){ map.set(it.productId, { productId: it.productId, name: it.name, variants: [] }); order.push(it.productId); }
    map.get(it.productId).variants.push(it);
  });
  return order.map(pid=>map.get(pid));
}
// productId -> the variantIdx (stringified, '' for null) last picked via
// its chip row. Deliberately module-level, not reset on every render, so
// switching a chip then scrolling/filtering doesn't silently snap back
// to the first variant.
let browseSelectedVariant = new Map();
function selectedVariantFor(group){
  const key = browseSelectedVariant.get(group.productId);
  const found = key!=null ? group.variants.find(v=>String(v.variantIdx==null?'':v.variantIdx)===key) : null;
  return found || group.variants[0];
}

// Keyed per item (not a single flag) so tapping one star doesn't block a
// legitimate rapid tap on a different one -- only guards against the
// same item's own request still being in flight. The primary key on
// agent_clusters already stops a real duplicate row from a race, but
// without this a fast double-tap still surfaces that as a raw "duplicate
// key" error instead of the toggle just quietly working once.
const clusterTogglesInFlight = new Set();
async function toggleClusterMembership(productId, variantIdx){
  const viStr = variantIdx==null ? '' : String(variantIdx);
  const key = `${productId}::${viStr}`;
  if(clusterTogglesInFlight.has(key)) return;
  clusterTogglesInFlight.add(key);
  const already = isInCluster(productId, variantIdx);
  try{
    if(already){
      const { error } = await sb.from('agent_clusters').delete()
        .eq('shop_id', currentShopId).eq('agent_id', myAgent.id).eq('product_id', productId).eq('variant_idx', viStr);
      if(error) throw error;
      cluster = cluster.filter(c=>!(c.product_id===productId && String(c.variant_idx||'')===viStr));
      toast('Removed from your cluster');
    } else {
      const { data: inserted, error } = await sb.from('agent_clusters')
        .insert({ shop_id: currentShopId, agent_id: myAgent.id, product_id: productId, variant_idx: viStr })
        .select().single();
      if(error) throw error;
      cluster.push(inserted);
      toast(clusterWaitDays>0
        ? `Added -- bonus unlocks in ${clusterWaitDays} day${clusterWaitDays===1?'':'s'}`
        : 'Added -- sell it to start earning the bonus');
    }
    if(currentView === 'find') renderFind();
    else if(currentView === 'today') renderNext();
  }catch(err){
    toast(isNetworkError(err) ? "You're offline -- couldn't update your cluster" : `Could not update your cluster: ${err.message||err}`);
  } finally {
    clusterTogglesInFlight.delete(key);
  }
}

// Finds the breakpoint a given (base-unit) quantity actually earns -- the
// highest minQty at or below it. Mirrors the server's own tieredUnitPrice()
// resolution rule; safe to do purely client-side because every tier in
// `tiers` already carries its final agent-facing floor price, not a raw
// cost an agent shouldn't be able to derive markup/discount from.
function tierForQty(tiers, qty){
  let best = null;
  (tiers||[]).forEach(t=>{ if(qty>=t.minQty && (!best || t.minQty>=best.minQty)) best = t; });
  return best || (tiers && tiers[0]) || null;
}


// Full-size view of the product photo, dismissed by tapping anywhere on
// it -- same pattern as every other overlay in this app, just without a
// card wrapper since the image itself is the entire content.
function openImageLightbox(src){
  const el = document.createElement('div');
  el.className = 'ag-lightbox';
  el.innerHTML = `<img src="${esc(src)}" alt="">`;
  document.body.appendChild(el);
  el.addEventListener('click', ()=> document.body.removeChild(el));
}

/* ================= QUOTE + client + delivery + submit ================= */
// Shared by renderCart(), the live-typing patch, and the client-view/
// download render -- one place computes rate/amount/profit per line so
// the three surfaces can never quietly disagree with each other.
/* What a line's price means against the floor -- what the shop charges
   the agent for it, at the tier this quantity earned.

   Two different things used to be one. `noMargin` was
   `agentSellPrice <= floorPrice`, so selling AT the floor and selling
   BELOW it both read "No margin set":

     at the floor   zero margin, and a real choice -- selling at cost to
                    win a customer or clear a slow line. The agent keeps
                    nothing, and knows it.
     below it       a LOSS. The agent owes the shop the floor whatever
                    they charge their client, so the difference comes
                    out of their own pocket.

   The second is the one worth interrupting for, and it was hidden behind
   the wording of the first. Computed here alone, because the same rule
   was also written out by hand in renderCart's markup and again in the
   live-typing patch, and three copies of a rule is how they drift. */
function cartLineMargin(sellPerBase, floorPrice, baseQty){
  const sell = Number(sellPerBase)||0;
  const floor = Number(floorPrice)||0;
  const qty = Number(baseQty)||0;
  if(sell > floor) return { level:'ok', label:'', detail:'' };
  if(sell === floor){
    return {
      level:'none', label:'No margin set',
      detail:`You are charging exactly the ${fmtUGX(floor)} the shop charges you, so you keep nothing on this line.`,
    };
  }
  const short = (floor - sell) * qty;
  return {
    level:'loss', label:`At a loss — ${fmtUGX(short)}`,
    detail:`You owe the shop ${fmtUGX(floor)} for each one whatever you charge, so charging ${fmtUGX(sell)} costs you ${fmtUGX(short)} on this line.`,
  };
}
// The chip shown against a line. Empty when the line is making money.
function cartMarginFlagHTML(margin){
  if(margin.level==='ok') return '';
  return `<span class="ag-margin-flag${margin.level==='loss'?' loss':''}" title="${esc(margin.detail)}">${ICON_WARN}${esc(margin.label)}</span>`;
}
function cartLineFigures(it){
  const baseQty = Number(it.qty)||0;
  const agentSellPrice = Number(it.agentSellPrice)||0;
  const floorPrice = Number(it.floorPrice)||0;
  const amount = agentSellPrice * baseQty;
  const displayQty = it.displayQty!=null ? it.displayQty : baseQty;
  const displayUnit = it.displayUnit || it.unit || '';
  const rate = displayQty>0 ? amount/displayQty : 0;
  const profit = (agentSellPrice - floorPrice) * baseQty;
  const margin = cartLineMargin(agentSellPrice, floorPrice, baseQty);
  // Kept: half a dozen callers read it, and "not making money on this
  // line" is still exactly what they want. `margin.level` is what tells
  // the two kinds apart.
  const noMargin = margin.level !== 'ok';
  return { baseQty, amount, displayQty, displayUnit, rate, profit, noMargin, margin };
}

/* ---- Client picking ---- */
/* The first LETTER of each of the first two words -- not the first
   CHARACTER, which is what every copy of this in the app used to take.

   This shop tells two people of the same name apart by qualifying it:
   "Feko (Ambrose)" and "Feko (Rebbeca)", "Bahco - Jose", "Reagan -
   Stuart" and "Ronald - 7th Street". Character zero of the second word
   is then a bracket or a hyphen, so the avatar read "F(", "B-", "R-" --
   punctuation where initials belong, on 11 of 99 customers. Worse, both
   Fekos came out "F(" and both R-names "R-": the one mark on the row
   whose job is telling two clients apart was identical on precisely the
   pairs it exists for.

   Digits count as letters here, because "Ronald - 7th Street" is
   distinguished by its 7 and "R7" says which Ronald.

   Byte-for-byte the admin app's nameInitials(). The two apps do not
   share a script, so this is a copy -- but it is the ONLY copy in this
   file, and everything here that letters an avatar goes through it. */
function nameInitials(name){
  const letters = String(name||'').trim().split(/\s+/)
    .map(w=> (w.match(/[A-Za-z0-9]/)||[''])[0]).filter(Boolean);
  if(!letters.length) return '?';
  return (letters[0] + (letters[1]||'')).toUpperCase();
}
function clientInitials(name){ return nameInitials(name); }

function selectClient(client){
  if(!client) return;
  /* Taken before anything is swapped. With nobody chosen yet this is the
     unowned basket, which is the one that used to be lost here. */
  const hadClient = !!cartKey(chosenClient);
  const inHand = hadClient ? [] : cart.slice();
  // Park whatever is in hand against the client it was built for BEFORE
  // switching, or it follows the agent to the next customer.
  if(cartKey(chosenClient) !== cartKey(client)) stashActiveCart();
  chosenClient = client;
  activateCartFor(client);
  /* `cart` is now this client's own array, held by reference in `carts`.
     Refilled in place rather than reassigned, so the two do not drift
     apart and later pushes still land in the right basket. */
  const merged = adoptedCartFor(hadClient, inHand, cart);
  if(merged.adopted){
    cart.length = 0;
    merged.rows.forEach(r=> cart.push(r));
    /* They have an owner now. Left in the unnamed basket as well they
       would show up twice -- once under this client and once still
       waiting to be claimed. */
    unnamedCart = [];
    const n = merged.adopted;
    toast(merged.joined
      ? `${n} item${n===1?'':'s'} added to ${client.name}'s basket, which already had ${merged.joined}`
      : `${n} item${n===1?'':'s'} moved to ${client.name}`);
  }
  openLineIdx = -1;
  afterClientChosen(client);
}

/* A client keeps one tint everywhere: picked from their id, so the same
   shop is the same colour on Today, in the order strip and on its sheet. */
function avTint(id){
  const s = String(id == null ? '' : id);
  let h = 0;
  for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return 't' + (h % 5);
}
function avHTML(client, cls){
  return `<span class="ax-av ${cls||''} ${avTint(client && client.id)}">${esc(clientInitials(client && client.name))}</span>`;
}
/* An avatar inside a ring that fills as their usual gap runs out --
   amber once they are past it. A glance down the client list shows who
   is due without a single word. */
function ringAvHTML(client, frac, tone){
  const r = 20, c = 2 * Math.PI * r;
  const on = Math.max(0, Math.min(1, Number(frac)||0)) * c;
  const col = tone === 'late' ? 'var(--warn)' : tone === 'due' ? 'var(--good)' : '#9AA1AE';
  return `<span class="ax-ringav">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--line)" stroke-width="3"/>
      ${on > 0 ? `<circle cx="22" cy="22" r="${r}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${on.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 22 22)"/>` : ''}
    </svg>
    ${avHTML(client)}
  </span>`;
}
function itemThumbHTML(it){
  if(it && it.image) return `<img src="${esc(it.image)}" alt="" loading="lazy">`;
  return categoryIconSVG(itemCategory(it || {}));
}
function shortName(name, words){
  return String(name||'').trim().split(/\s+/).slice(0, words || 2).join(' ');
}
function fmtSigned(n){
  const v = Math.round(Number(n)||0);
  return (v < 0 ? '−' : '+') + fmtNum(Math.abs(v));
}
function dateShort(d){
  if(!d) return '';
  const dt = new Date(String(d).slice(0,10) + 'T00:00:00');
  return isNaN(dt) ? '' : dt.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}

/* ================= NAVIGATION ================= */
// Two tabs and the button between them. Order and Find are full screens
// of their own, so the tab bar steps aside while you are in them -- the
// way out is the X that started it.
const TABS = ['today','clients'];
const VIEW_IDS = { today:'ag_todayView', clients:'ag_clientsView', order:'ag_orderView', find:'ag_findView' };
let lastMainTab = 'today';
let currentView = 'today';

function showOnlyView(id){
  Object.values(VIEW_IDS).forEach(v=>{
    const el = document.getElementById(v);
    if(el) el.hidden = v !== id;
  });
}
function switchTab(tab){
  // Names the older screens used, still reachable from a notification or
  // a saved preference written before this layout.
  if(tab === 'feed' || tab === 'home') tab = 'today';
  if(tab === 'customers') tab = 'clients';
  if(tab === 'sell' || tab === 'quote') tab = 'order';
  if(tab === 'earnings' || tab === 'account' || tab === 'standing'){ openMoneySheet(); return; }
  if(!VIEW_IDS[tab]) tab = 'today';
  showOnlyView(VIEW_IDS[tab]);
  currentView = tab;
  const bar = document.getElementById('ag_tabbar');
  bar.hidden = tab === 'order' || tab === 'find';
  bar.querySelectorAll('.ax-tab').forEach(b=> b.classList.toggle('active', b.dataset.tab === tab));
  if(TABS.includes(tab)){
    lastMainTab = tab;
    try{ localStorage.setItem('agentLastTab', tab); }catch(_e){}
  }
  window.scrollTo(0, 0);
  if(tab === 'today') renderToday();
  if(tab === 'clients'){ document.getElementById('ag_clientListSearch').value = ''; renderClientsListScreen(); }
  if(tab === 'order') openOrderView();
  if(tab === 'find') openFindView();
}
function renderCurrentView(){
  if(currentView === 'today') renderToday();
  else if(currentView === 'clients') renderClientsListScreen();
  else if(currentView === 'order') renderOrder();
  else if(currentView === 'find') renderFind();
  refreshOpenSheets();
}
document.getElementById('ag_tabbar').addEventListener('click', (e)=>{
  const tab = e.target.closest('.ax-tab');
  if(tab){ switchTab(tab.dataset.tab); return; }
  if(e.target.closest('#ag_plusBtn')) switchTab('order');
});

/* ---- sheets ----
   One way to bring something up over the screen and one way to put it
   away: tap outside it, the X, or Escape. */
const openSheets = [];
/* ---- messages ----
   Three kinds, and each looks like what it means. Done: a navy pill with
   a mint tick that goes by itself. Heads up: an amber pill. Stopped: a
   red card just above the bottom bar, where the thumb is, that stays until
   it is closed or its button is used. Most callers pass only the words,
   so the kind is read from them; a caller that knows better says so. */
function toastTone(msg){
  const s = String(msg || '');
  if(/could ?not|couldn['’]t|can['’]t|cannot|failed/i.test(s)) return 'bad';
  if(/offline|paused|^enter |^choose |^add (at least|items)|^put in|^slide |already taken|no longer|has no items|stay off/i.test(s)) return 'warn';
  return 'good';
}
// How far up the screen the bottom bars reach, so a red card sits on top
// of them instead of under a thumb's worth of navy.
function toastBottomClear(){
  let clear = 16;
  ['ag_dock', 'ag_findDone', 'ag_tabbar'].forEach(id=>{
    const el = document.getElementById(id);
    // Fixed bars have no offsetParent, so visibility is read from the box.
    if(!el || !el.getClientRects().length) return;
    const r = el.getBoundingClientRect();
    if(r.height > 0 && r.top < window.innerHeight) clear = Math.max(clear, window.innerHeight - r.top + 12);
  });
  return clear;
}
function toast(msg, duration, opts){
  opts = opts || {};
  const t = document.getElementById('toast');
  const tone = opts.tone || toastTone(msg);
  clearTimeout(toast._h);
  const text = String(msg || '');
  // A message can be raised while the app is still starting, before the
  // icon set below it exists.
  let I;
  try{ I = AX_ICON; }catch(_e){ I = { bang:'!', warn:'!', check:'', x:'×' }; }
  t.className = `toast ${tone}`;
  t.setAttribute('role', tone === 'bad' ? 'alert' : 'status');
  if(tone === 'bad'){
    // "Could not save: no signal" reads as a headline and its reason.
    const cut = text.indexOf(': ');
    const title = opts.title || (cut > 0 ? text.slice(0, cut) : text);
    const detail = opts.title ? text : (cut > 0 ? text.slice(cut + 2) : '');
    t.style.bottom = `calc(${toastBottomClear()}px + var(--safe-b))`;
    t.innerHTML = `<span class="ic">${I.bang}</span>
      <span class="b"><b>${esc(title)}</b>${detail ? `<span>${esc(detail)}</span>` : ''}</span>
      ${opts.action ? `<button type="button" class="act" data-toast-act>${esc(opts.action.label)}</button>` : ''}
      <button type="button" class="x" data-toast-x aria-label="Close">${I.x}</button>`;
    toast._act = opts.action ? opts.action.run : null;
  } else {
    t.style.bottom = '';
    t.innerHTML = `<span class="ic">${tone === 'warn' ? I.warn : I.check}</span><span class="tx">${esc(text)}</span>`;
    toast._act = null;
  }
  void t.offsetWidth;
  t.classList.add('show');
  const ms = tone === 'bad' ? (opts.sticky ? 0 : Math.max(duration || 0, 8000)) : (duration || 2400);
  if(ms) toast._h = setTimeout(()=> t.classList.remove('show'), ms);
}
document.getElementById('toast').addEventListener('click', (e)=>{
  const t = document.getElementById('toast');
  if(e.target.closest('[data-toast-act]')){
    const run = toast._act;
    t.classList.remove('show');
    if(run) run();
    return;
  }
  if(e.target.closest('[data-toast-x]')) t.classList.remove('show');
});

// A step reads as done only once it is. The money step is "Pay shop" --
// what you still have to do, and to whom -- until it is paid; read as
// "Paid" ahead of time it told agents (and their clients) that money had
// moved when it had not.
function stepLabel(s, done){
  return s.icon === 'cash' && !done ? 'Pay shop' : s.label;
}

// A sheet about one thing -- an order, a client, your money, your goal --
// is a page of its own and rises to fill the screen (opts.full), so the
// screen behind is only a sliver of edge, never half a hero competing
// with it. Quick asks stay as short as their question.
function openSheet(html, opts){
  opts = opts || {};
  const scrim = document.createElement('div');
  scrim.className = 'ax-scrim';
  scrim.innerHTML = `<div class="ax-sheet${opts.white ? ' white' : ''}${opts.full ? ' full' : ''}" role="dialog" aria-modal="true" aria-label="${esc(opts.label||'')}">${html}</div>`;
  document.body.appendChild(scrim);
  document.body.classList.add('ax-locked');
  const sheet = { el: scrim.querySelector('.ax-sheet'), scrim, kind: opts.kind || '', refresh: opts.refresh || null,
    close(){
      if(!scrim.parentNode) return;
      scrim.remove();
      const i = openSheets.indexOf(sheet);
      if(i >= 0) openSheets.splice(i, 1);
      if(!openSheets.length) document.body.classList.remove('ax-locked');
      // Back on the page: a goal milestone crossed, else (after a first
      // order) the moment to ask about notifications.
      if(!openSheets.length) setTimeout(afterSheetsClosed, 500);
      if(opts.onClose) opts.onClose();
    } };
  scrim.addEventListener('click', (e)=>{ if(e.target === scrim) sheet.close(); });
  sheet.el.addEventListener('click', (e)=>{ if(e.target.closest('[data-close]')) sheet.close(); });
  openSheets.push(sheet);
  sheetDrag(sheet);
  return sheet;
}
/* Pull down to close, the way a phone's own sheets go: from the handle
   and header at any time, or from anywhere once what is under the finger
   is scrolled to its top. Past a third of its height, or a quick flick,
   it goes; short of that it springs back. Fields keep their own drags. */
function sheetDrag(sheet){
  const el = sheet.el, scrim = sheet.scrim;
  let y0 = 0, x0 = 0, t0 = 0, dy = 0, on = false, decided = false;
  const scrolledInside = (n)=>{
    for(; n && n.nodeType === 1; n = n.parentNode){ if(n.scrollTop > 0) return true; if(n === el) break; }
    return false;
  };
  el.addEventListener('touchstart', (e)=>{
    on = false;
    if(e.touches.length !== 1 || e.target.closest('input, textarea, select, [contenteditable]')) return;
    const t = e.touches[0];
    on = t.clientY - el.getBoundingClientRect().top < 72 || !scrolledInside(e.target);
    y0 = t.clientY; x0 = t.clientX; t0 = Date.now(); dy = 0; decided = false;
  }, { passive: true });
  el.addEventListener('touchmove', (e)=>{
    if(!on) return;
    const t = e.touches[0], my = t.clientY - y0, mx = t.clientX - x0;
    if(!decided){
      if(Math.abs(my) < 6 && Math.abs(mx) < 6) return;
      decided = true;
      if(my <= 0 || Math.abs(mx) > Math.abs(my)){ on = false; return; }
      el.style.animation = 'none';
      el.style.transition = 'none';
    }
    e.preventDefault();
    dy = Math.max(0, my);
    el.style.transform = `translateY(${dy}px)`;
    scrim.style.backgroundColor = `rgba(12,19,38,${(0.72 * Math.max(0, 1 - dy / el.offsetHeight)).toFixed(3)})`;
  }, { passive: false });
  const end = ()=>{
    if(!on || !decided){ on = false; return; }
    on = false;
    const flick = dy / Math.max(1, Date.now() - t0) > 0.6 && dy > 40;
    el.style.transition = 'transform .22s cubic-bezier(.2,.8,.2,1)';
    if(dy > el.offsetHeight / 3 || flick){
      el.style.transform = 'translateY(100%)';
      scrim.style.transition = 'background-color .22s';
      scrim.style.backgroundColor = 'rgba(12,19,38,0)';
      setTimeout(()=> sheet.close(), 200);
    } else {
      el.style.transform = '';
      scrim.style.backgroundColor = '';
    }
  };
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
}
function closeSheetsOfKind(kind){
  openSheets.slice().forEach(s=>{ if(s.kind === kind) s.close(); });
}
function refreshOpenSheets(){
  openSheets.forEach(s=>{ if(s.refresh) s.refresh(); });
}
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && openSheets.length) openSheets[openSheets.length - 1].close();
});

/* ================= WHERE AN ORDER HAS GOT TO =================
   One answer per order, used by every screen that mentions one -- the
   tiles on Today, the client list, and the track itself -- so no two
   places can disagree about where it is. */
function agentOrderTerms(q){
  return (q.items||[]).map(it=> [
    it.productId, (it.variantIdx === null || it.variantIdx === undefined) ? '' : it.variantIdx,
    Number(it.qty)||0, Math.round(Number(it.sellPrice)||0)
  ].join(':')).join('|');
}
/* Whether the lines have been checked. Either the shop signed them off
   (its signature of the lines it confirmed -- edit a line and it no
   longer matches), or every line has had its own yes from whoever
   supplies it (lineSupplierCheck), which is the check itself: the agent
   watched each line tick, and the moment the last one does, it is
   checked and Pay opens. The shop's app and the payment function apply
   the same rule (agentOrderSuppliersConfirmed). Past Draft it has been
   checked by definition. */
function orderShopChecked(o){
  if(!o) return false;
  if(o.status !== 'draft') return true;
  if(o.shopConfirmedAt && o.shopConfirmedTerms === agentOrderTerms(o)) return true;
  const items = o.items || [];
  return items.length > 0 && items.every(it=> lineSupplierCheck(o, it).state === 'ok');
}
function staffName(id){
  return id && id !== '__agent__' ? (orderStaffNames.get(id) || null) : null;
}
function orderStage(o){
  const prepay = !!(myAgent && myAgent.paymentTerm === 'prepay');
  const owed = orderOwedAmount(o);
  const pickup = o.deliveryMode === 'agent_pickup';
  if(o.agentCancel) return { key:'cancelled', title:'Cancelled', sub: o.voided ? 'You cancelled this order' : 'You cancelled it · the shop closes it', group:null, tone:'warn' };
  if(o.voided) return { key:'cancelled', title:'Cancelled', sub:'The shop cancelled this order', group:null, tone:'warn' };
  if(o.status === 'draft'){
    if(!orderShopChecked(o)){
      const k = orderCheckCount(o);
      return { key:'checking', title:'Checking', group:'sent',
        sub: `${k.ok} of ${k.all} confirmed with the supplier` };
    }
    if(prepay && o.agentPaymentStatus !== 'paid' && owed > 0){
      const kept = (o.items||[]).length, all = kept + (o.droppedLines||[]).length;
      return { key:'pay', title:'Pay now', sub:`${kept} of ${all} confirmed · packing starts after`, group:'sent', tone:'warn', needs:'pay' };
    }
    return { key:'queued', title:'Confirmed', sub:'Packing starts next', group:'sent' };
  }
  if(o.status === 'awaiting_goods') return { key:'packing', title:'Packing', sub:'The shop is bringing some items in', group:'packing' };
  if(o.status === 'preparing'){
    const n = staffName(o.assignedWorkerId);
    return { key:'packing', title:'Packing', sub: n ? `${n} is packing it` : 'Being packed now', group:'packing' };
  }
  if(o.status === 'pending_delivery'){
    if(pickup) return { key:'ready', title:'Ready', sub:'Waiting at the shop for you', group:'out', tone:'good', needs:'collect' };
    const n = staffName(o.assignedDeliveryId);
    return { key:'out', title:'On the way', sub: n ? `${n} is delivering` : 'Out for delivery', group:'out' };
  }
  if(o.status === 'completed'){
    if(!prepay && owed > 0) return { key:'settle', title:'Settle up', sub:`${fmtNum(owed)} owed to the shop`, group:null, tone:'warn', needs:'pay' };
    return { key:'done', title:'Done', sub: pickup ? 'Collected' : 'Delivered', group:'done' };
  }
  return { key:'checking', title:'Checking', sub:'The shop confirms each item', group:'sent' };
}
// The six steps, in the order this agent lives them. A prepay agent pays
// between the check and the packing; everyone else settles at the end.
function orderSteps(o){
  const prepay = !!(myAgent && myAgent.paymentTerm === 'prepay');
  const pickup = o.deliveryMode === 'agent_pickup';
  const ready = { label: pickup ? 'Ready' : 'On way', icon: pickup ? 'store' : 'truck' };
  return prepay
    ? [{label:'Sent',icon:'send'},{label:'Checked',icon:'check'},{label:'Paid',icon:'cash'},{label:'Packing',icon:'box'},ready,{label:'Done',icon:'flag'}]
    : [{label:'Sent',icon:'send'},{label:'Checked',icon:'check'},{label:'Packing',icon:'box'},ready,{label:'Done',icon:'flag'},{label:'Paid',icon:'cash'}];
}
function orderStepIndex(o, st){
  const prepay = !!(myAgent && myAgent.paymentTerm === 'prepay');
  const map = prepay
    ? { checking:1, pay:2, queued:3, packing:3, ready:4, out:4, done:6 }
    : { checking:1, queued:2, packing:2, ready:3, out:3, settle:5, done:6 };
  return map[st.key] != null ? map[st.key] : -1;
}
// What the shop is still owed for this order: the lines it kept, less
// anything already paid against it.
function orderOwedAmount(o){
  // Goods at the shop's price plus its charges (a delivery fee).
  if(!o || o.agentPaymentStatus === 'paid') return 0;
  const total = orderShopGoods(o) + orderChargesAmount(o);
  return Math.max(0, Math.round(total - (Number(o.amountPaid)||0)));
}
/* ---- each line, before the whole order is signed off ----
   The shop rings each supplier once, about every line that supplier is on
   (supplierConfirms in the shop's app), so a line is ticked the moment its
   supplier says yes rather than when the last one does. Off the shop's own
   shelf there is nobody to ring, so those are ticked from the start. A yes
   counts only for the terms it was given -- the shop's own rule
   (orderSupplierConfirmState) -- so an edit since puts the tick back. */
function supplierLineTerms(o, sid){
  return (o.items||[]).filter(it=> String(it && it.supplierId) === String(sid)).map(it=> [
    it.productId, it.variantIdx == null ? '' : it.variantIdx, Number(it.qty) || 0, Math.round(Number(it.price) || 0)
  ].join(':')).join('|');
}
function lineCheck(o, it){
  const c = lineSupplierCheck(o, it);
  return c.state !== 'ok' && orderShopChecked(o) ? { state:'ok' } : c;
}
function lineSupplierCheck(o, it){
  const sid = it && it.supplierId;
  if(sid === '__stock__') return { state:'ok' };
  if(!sid) return { state:'wait' };
  const rec = ((o && o.supplierConfirms) || {})[String(sid)] || {};
  if(rec.state === 'confirmed' && rec.terms === supplierLineTerms(o, sid)) return { state:'ok', at: rec.at || null };
  if(rec.state === 'problem') return { state:'problem' };
  if(rec.askedAt) return { state:'asking' };
  return { state:'wait' };
}
function orderCheckCount(o){
  const items = (o && o.items) || [];
  return { ok: items.filter(it=> lineCheck(o, it).state === 'ok').length, items: items.length, all: items.length + ((o && o.droppedLines) || []).length };
}

/* ---- when each step happened ----
   Today reads as a time, this week as a day, older as a date: the
   question is "how long has it sat there", and that is the grain it is
   answered in. */
function toMs(v){
  if(v == null || v === '') return null;
  const n = typeof v === 'number' ? v : Date.parse(v);
  return isNaN(n) ? null : n;
}
function dayShort(v){
  const ms = toMs(typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v + 'T00:00:00' : v);
  if(ms == null) return '';
  const d = new Date(ms), now = new Date();
  const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  if(days === 0) return 'today';
  if(days > 0 && days < 7) return d.toLocaleDateString('en-GB', { weekday:'short' });
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}
function whenShort(v){
  const ms = toMs(v);
  if(ms == null) return '';
  const d = new Date(ms);
  return dayShort(ms) === 'today' ? `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}` : dayShort(ms);
}
// Keyed by each step's icon, which is the one thing a step keeps whether
// the agent pays first or last and whether it is picked up or delivered.
function orderStepTimes(o){
  const at = {};
  (o.stageLog || []).forEach(e=>{ if(e && e.status && at[e.status] == null) at[e.status] = toMs(e.at); });
  // When it was sent, to the minute, where the server recorded it
  // (createdAt); older orders carry only their day.
  const sent = o.createdAt ? whenShort(o.createdAt) : dayShort(orderDate(o));
  const pays = o.payments || [];
  return {
    send: sent,
    check: o.shopConfirmedAt ? whenShort(o.shopConfirmedAt) : '',
    cash: o.agentPaymentStatus === 'paid' && pays.length ? dayShort(pays[pays.length - 1].date) : '',
    box: whenShort(at.preparing || at.awaiting_goods),
    store: whenShort(at.pending_delivery), truck: whenShort(at.pending_delivery),
    flag: whenShort(at.completed),
  };
}
/* The six steps as tiles: done ones carry when they happened, the one
   it is on now is lit, the rest wait faintly. Named underneath in the
   words of the order screen -- the money step says "Pay shop" until it
   is paid. */
function stepTilesHTML(o, st){
  const steps = orderSteps(o), at = orderStepIndex(o, st), times = orderStepTimes(o);
  const all = at >= steps.length;
  const tiles = steps.map((s,i)=>{
    const done = i < at || all;
    if(done) return `<span class="ax-stp done">${AX_ICON[s.icon === 'check' ? 'clip' : s.icon]}${times[s.icon] ? `<em class="m">${esc(times[s.icon])}</em>` : `<em>${AX_ICON.check}</em>`}</span>`;
    if(i === at) return `<span class="ax-stp now${st.tone === 'warn' ? ' warn' : ''}">${AX_ICON[s.icon === 'check' ? 'clip' : s.icon]}<em>now</em></span>`;
    return `<span class="ax-stp">${AX_ICON[s.icon === 'check' ? 'clip' : s.icon]}</span>`;
  }).join('');
  const labels = steps.map((s,i)=> `<span class="${i === at ? `on${st.tone === 'warn' ? ' warn' : ''}` : i < at || all ? 'done' : ''}">${esc(stepLabel(s, i < at || all))}</span>`).join('');
  return `<div class="ax-steps" role="img" aria-label="${esc(st.title)}: step ${Math.min(at + 1, steps.length)} of ${steps.length}"><div class="r">${tiles}</div><div class="l">${labels}</div></div>`;
}
/* The same six on a light card, small: ticked circles behind, the one it
   is on in its colour and named in bold, the rest faint. Read the way the
   order's own screen reads, so no key is needed. */
function stepDotsHTML(o, st){
  const steps = orderSteps(o), at = orderStepIndex(o, st);
  const all = at >= steps.length;
  return `<div class="ax-dots6" aria-hidden="true">${steps.map((s,i)=>{
    const done = i < at || all;
    const cls = done ? 'done' : i === at ? `now ${st.tone === 'warn' ? 'warn' : st.tone === 'good' ? 'good' : ''}` : '';
    return `<span class="${cls}"><i>${done ? AX_ICON.check : AX_ICON[s.icon === 'check' ? 'clip' : s.icon]}</i><em>${esc(stepLabel(s, done))}</em></span>`;
  }).join('')}</div>`;
}

/* The month as a ring. White is what is yours already; the faint mint
   after it is what is within reach -- baskets not yet sent, bonuses
   that land when an order completes. The figure in the middle is how far
   along the goal you are. */
function monthPicture(now){
  const key = currentMonthKey();
  const m = monthEarnings(key);
  const target = Number(myGoals && myGoals.monthly_target) || 0;
  const best = target ? null : fxBestMonth();
  const aim = target || (best ? best.total : 0);
  let near = 0;
  new Set(Object.values(carts).concat([unnamedCart, cart])).forEach(rows=>{
    (rows||[]).forEach(it=>{ const f = cartLineFigures(it); if(f.profit > 0) near += f.profit; });
  });
  m.orders.forEach(o=>{ if(o.status !== 'completed') near += orderEarnings(o).bonus; });
  return { key, earned: m.total, margin: m.margin, bonus: m.bonus, aim, target, best, near, days: fxDaysLeftInMonth(now) };
}
function ringSVG(size, stroke, parts, track){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, mid = size / 2;
  let at = 0;
  const arcs = parts.map(p=>{
    const len = Math.max(0, Math.min(1 - at, p.frac)) * c;
    const s = len > 0 ? `<circle cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke="${p.color}"${p.opacity ? ` stroke-opacity="${p.opacity}"` : ''} stroke-width="${stroke}"${p.round ? ' stroke-linecap="round"' : ''} stroke-dasharray="${len.toFixed(1)} ${c.toFixed(1)}" stroke-dashoffset="${(-at * c).toFixed(1)}" transform="rotate(-90 ${mid} ${mid})"/>` : '';
    at += Math.max(0, p.frac);
    return s;
  });
  // Drawn back to front so the rounded cap of what is earned sits over
  // the reach arc that follows it.
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>${arcs.slice().reverse().join('')}</svg>`;
}
function greeting(now){
  const h = now.getHours();
  return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
}
/* The header, kept to a quarter of the screen so the next move shows
   without scrolling: what is yours this month (the figure -- the money),
   how far along the goal on one thin bar (the goal), and below them only
   the doors with something behind them -- what is within reach once there
   is any, where you stand once that says something. Initials open you. */
function renderTodayHero(){
  const now = new Date();
  const p = monthPicture(now);
  document.getElementById('ag_hello').textContent = `${greeting(now)}${myAgent && myAgent.name ? ', ' + firstWord(myAgent.name) : ''}`;
  const btn = document.getElementById('ag_ringBtn');
  const frac = p.aim > 0 ? p.earned / p.aim : 0;
  const nearFrac = p.aim > 0 ? p.near / p.aim : 0;
  const pct = (f)=> `${(Math.max(0, Math.min(1, f)) * 100).toFixed(1)}%`;
  const days = `${p.days} day${p.days===1?'':'s'} left`;
  btn.setAttribute('aria-label', p.aim > 0
    ? `Your goal: ${Math.round(frac*100)} percent of ${fmtNum(p.aim)}, ${days}`
    : 'Set a goal');
  const hit = p.target > 0 && p.earned >= p.target;
  btn.classList.toggle('hit', hit);
  if(hit) btn.setAttribute('aria-label', `${monthName(p.key)} goal hit: ${fmtNum(p.earned)} of ${fmtNum(p.target)}, ${fmtNum(p.earned - p.target)} over`);
  btn.innerHTML = hit
    ? `<span class="t" aria-hidden="true"><i class="won" style="flex:${Math.round(p.target)};"></i>${p.earned > p.target ? `<i class="over" style="flex:${Math.max(Math.round(p.earned - p.target), Math.round(p.target * 0.02))};"></i>` : ''}</span>
       <span class="l"><span class="won">${AX_ICON.trophy}Goal hit${p.earned > p.target ? ` · <b class="m">+${esc(fmtCompactUGX(p.earned - p.target))}</b> over` : ''}</span><span>${days}${AX_ICON.chevR}</span></span>`
    : p.aim > 0
    ? `<span class="t" aria-hidden="true"><i style="width:${pct(frac)};"></i><i class="near" style="width:${pct(Math.min(nearFrac, 1 - Math.min(1, frac)))};"></i></span>
       <span class="l"><span><b class="m">${Math.round(frac * 100)}%</b> of ${p.target ? 'your' : 'your best,'} <span class="m">${esc(fmtCompactUGX(p.aim))}</span>${p.target ? ' goal' : ''}</span><span>${days}${AX_ICON.chevR}</span></span>`
    : `<span class="l"><span class="set">${AX_ICON.flag}Set a goal for ${esc(monthName(p.key))}</span><span>${days}${AX_ICON.chevR}</span></span>`;
  const money = document.getElementById('ag_moneyBtn');
  money.setAttribute('aria-label', `${fmtNum(p.earned)} yours in ${monthName(p.key)}. Open your money.`);
  money.innerHTML = `<span class="l">Yours &middot; ${esc(monthName(p.key))}${AX_ICON.chevR}</span>
    <span class="v m"><small>UGX</small>${fmtNum(p.earned)}</span>`;
  const streak = computeSellingStreak();
  const lb = leaderboard && leaderboard.you && leaderboard.totalAgents >= 2 ? leaderboard : null;
  // Second of two is not a standing worth a headline; a streak of one
  // week is not a streak. Either is still one tap away on Money.
  const rank = lb && lb.totalAgents >= 3 ? lb : null;
  const doors = [];
  if(p.near > 0) doors.push(`<button type="button" data-hero="near" aria-label="${esc(fmtCompactUGX(p.near))} more within reach"><span class="ic near">${AX_ICON.trend}</span>
      <span class="b"><span class="v m mint">+${esc(fmtCompactUGX(p.near))}</span><span class="s">within reach</span></span>${AX_ICON.chevR}</button>`);
  if(rank || streak >= 2) doors.push(`<button type="button" data-hero="standing" aria-label="Your standing"><span class="ic fire">${AX_ICON.flame}</span>
      <span class="b">${rank ? `<span class="v">#${esc(rank.you.rank)} <small>of ${esc(rank.totalAgents)}</small></span>` : `<span class="v">${streak} wk</span>`}
        <span class="s">${rank ? 'this month' : `${streak}-week streak`}</span></span>${AX_ICON.chevR}</button>`);
  const glass = document.getElementById('ag_glass');
  glass.hidden = !doors.length;
  glass.style.gridTemplateColumns = `repeat(${Math.max(1, doors.length)},minmax(0,1fr))`;
  glass.innerHTML = doors.join('');
}

/* Every order still moving, counted by where it is, and the ones that
   are waiting on YOU named underneath. */
const MOVE_GROUPS = [
  { key:'sent', label:'Sent', icon:'send' },
  { key:'packing', label:'Packing', icon:'box' },
  { key:'out', label:'Out', icon:'truck' },
];
function renderMove(){
  const live = liveOrders();
  const staged = live.map(o=> ({ o, st: orderStage(o) }));
  const month = currentMonthKey();
  const doneN = myOrders.filter(o=> !o.voided && o.status === 'completed' && String(orderDate(o)||'').startsWith(month)).length;
  document.getElementById('ag_moveCount').textContent = `${live.length} live · ${doneN} done`;
  const baskets = quoteBasketSummaries(agentClients, carts, chosenClient ? chosenClient.id : null, unnamedCart).filter(b=> b.count > 0);
  // Who is in each, as faces: the count says how many, the faces say who.
  const faces = (clients)=> clients.length
    ? `<span class="ax-faces dots">${clients.slice(0, 3).map(c=> `<i class="${avTint(c.id)}"></i>`).join('')}${clients.length > 3 ? `<small>+${clients.length - 3}</small>` : ''}</span>` : '';
  // A badge says how many of it need you.
  const tile = (key, label, icon, n, dot, cls, who, need)=>
    `<button type="button" class="ax-tile${cls ? ' ' + cls : ''}${n ? '' : ' zero'}" data-move="${key}" aria-label="${n} ${esc(label)}${need ? `, ${need} need you` : ''}">
      ${need ? `<span class="need ${dot}">${need}</span>` : dot ? `<span class="dot ${dot}"></span>` : ''}
      <span class="t">${AX_ICON[icon]}<b>${n}</b></span><span class="l">${esc(label)}</span>${faces(who || [])}
    </button>`;
  const inGroup = (g)=> staged.filter(x=> x.st.group === g);
  const clientOf = (o)=> agentClients.find(x=> String(x.id) === String(o.agentClientId)) || { id: o.agentClientId, name: 'Client' };
  const basketWho = baskets.filter(b=> !b.unnamed).map(b=> agentClients.find(c=> String(c.id) === String(b.key))).filter(Boolean);
  const cold = baskets.filter(b=> !b.active && (calDaysAgo(basketTouched(basketRowsFor(b))) || 0) >= 14);
  const late = inGroup('packing').filter(x=> (calDaysAgo(stageSince(x.o, x.st)) || 0) >= 2);
  const tiles = tile('basket', baskets.length === 1 ? 'Basket' : 'Baskets', 'basket', baskets.length, cold.length ? 'cold' : '', 'basket', basketWho, cold.length)
    + MOVE_GROUPS.map(g=>{
      const rows = inGroup(g.key);
      const pay = rows.filter(x=> x.st.needs === 'pay').length, collect = rows.filter(x=> x.st.needs === 'collect').length;
      const lateN = g.key === 'packing' ? late.length : 0;
      const dot = pay ? 'warn' : collect ? 'good' : lateN ? 'bad' : '';
      return tile(g.key, g.label, g.icon, rows.length, dot, '', rows.map(x=> clientOf(x.o)), pay || collect || lateN);
    }).join('');
  const needs = staged.concat(myOrders.filter(o=> !o.voided && o.status === 'completed').map(o=> ({ o, st: orderStage(o) })))
    .filter(x=> x.st.needs)
    .sort((a,b)=> (a.st.needs === 'collect' ? 1 : 0) - (b.st.needs === 'collect' ? 1 : 0));
  // What needs doing, by kind, each with what it is worth and one
  // button -- the same at one order as at forty.
  const pays = needs.filter(x=> x.st.needs === 'pay'), coll = needs.filter(x=> x.st.needs === 'collect');
  const oldest = pays.map(x=> stageSince(x.o, x.st)).filter(v=> v != null).sort((a,b)=> a-b)[0];
  const kind = (k, icon, tone, label, n, sub, cta)=> n ? `<button type="button" class="ax-nk" data-need="${k}"><span class="ic ${tone}">${icon}</span>
    <span class="b"><span class="n">${label}</span><span class="s">${sub}</span></span><b class="c ${tone}">${n}</b><span class="go">${cta}</span></button>` : '';
  const kinds = kind('pay', PH.coins, 'warn', 'Pay the shop', pays.length, `${fmtNum(pays.reduce((s,x)=> s + orderOwedAmount(x.o), 0))}${oldest ? ` · oldest ${esc(busyAge(oldest))}` : ''}`, 'Pay')
    + kind('collect', PH.store, 'good', 'Ready to collect', coll.length, fmtNum(coll.reduce((s,x)=> s + orderTotal(x.o), 0)), 'Codes')
    + kind('late', PH.hourglass, 'bad', 'Packing 2+ days', late.length, 'ask the shop in one message', 'Ask')
    + kind('cold', PH.basket, 'cold', 'Baskets gone cold', cold.length, `${fmtNum(cold.reduce((s,b)=> s + basketTotal(basketRowsFor(b)), 0))} untouched 2+ weeks`, 'Clear');
  const n = pays.length + coll.length + late.length + cold.length;
  document.getElementById('ag_move').innerHTML = `<div class="ax-tiles busy">${tiles}</div>`;
  const nd = document.getElementById('ag_moveNeeds');
  nd.hidden = !n;
  nd.innerHTML = `<div class="ax-nk-h"><i></i><span>Needs you</span><b>${n}</b></div>${kinds}`;
}
['ag_move', 'ag_moveNeeds'].forEach(id=> document.getElementById(id).addEventListener('click', onMoveClick));
function onMoveClick(e){
  const t = e.target.closest('[data-track]');
  if(t){ openTrackSheet(t.dataset.track); return; }
  const nk = e.target.closest('[data-need]');
  if(nk){ ({ pay: ()=> openStageSheet('sent'), collect: ()=> openStageSheet('out'), late: ()=> openStageSheet('packing'), cold: ()=> openBasketsSheet() })[nk.dataset.need](); return; }
  const m = e.target.closest('[data-move]');
  if(!m) return;
  const key = m.dataset.move;
  if(key === 'basket'){
    const n = quoteBasketSummaries(agentClients, carts, chosenClient ? chosenClient.id : null, unnamedCart).filter(b=> b.count > 0).length;
    if(n) openBasketsSheet(); else switchTab('order');
    return;
  }
  // Each stage opens its own list, even when there is only one order.
  openStageSheet(key);
}

/* Where an order is, as a badge that looks like what it means wherever

   the agent's money, green when it is ready to collect, blue while the
   shop has it, quiet grey once it is done. An order waiting on you is

const STAGE_BADGE = {
  checking:{ icon:'clip', cls:'shop' }, queued:{ icon:'check', cls:'shop' }, packing:{ icon:'box', cls:'shop' },
  out:{ icon:'truck', cls:'shop' }, ready:{ icon:'store', cls:'go' }, pay:{ icon:'cash', cls:'pay' },
  settle:{ icon:'cash', cls:'pay' }, done:{ icon:'check', cls:'done' }, cancelled:{ icon:'x', cls:'off' },
};
function orderBadgeHTML(o, st){

  const b = STAGE_BADGE[st.key] || STAGE_BADGE.checking;
  const label = st.needs === 'pay' ? `${st.key === 'settle' ? 'Settle' : 'Pay'} ${fmtCompactUGX(orderOwedAmount(o))}`

/* ---- Next move ----
   The feed's own ranking (buildFeedCards), as a ranked list rather than a
   row of cards to swipe: the best play large -- who, why, what it earns,
   one button -- then every other play underneath as one line each, so
   the whole of it is seen at once. Each says what kind it is by its
   coloured mark: a client due on their rhythm, someone who asked on your
   shop link, a bonus worth pushing, an add-on, a bigger quantity. */
let nextCards = [];
function playEarn(c){
  if(c.kind === 'bulk') return Number(c.earn && c.earn.total) || 0;
  if(c.kind === 'claim') return Number(c.row && c.row.amount) || 0;
  return Number(c.earn && c.earn.total) || 0;
}
function renderNext(){
  let cards = [];
  try{ cards = buildFeedCards(new Date()); }catch(err){ console.warn('Next move could not be worked out:', err); cards = []; }
  const asks = cards.filter(c=> c.kind === 'ask');
  const picks = cards.filter(c=> ['due','bonus','addon','bulk','pin'].includes(c.kind));
  const waiting = cards.find(c=> c.kind === 'waiting');
  const claims = waiting ? waiting.rows.filter(r=> r.kind === 'claim').map(r=> ({ kind:'claim', key:`claim:${r.month}`, row: r })) : [];
  const wins = cards.filter(c=> c.kind === 'win');
  // The best money play leads; anyone waiting on a reply comes straight
  // after it, then claims, the other plays, and milestones last -- a
  // milestone is worth seeing, not worth the top of the page.
  nextCards = picks.slice(0, 1).concat(asks, claims, picks.slice(1), wins).slice(0, 8);
  const wrap = document.getElementById('ag_next');
  const sum = document.getElementById('ag_nextDots');
  if(!nextCards.length){
    sum.innerHTML = '';
    wrap.innerHTML = `<div class="ax-card ax-plays-none"><span class="ic">${AX_ICON.spark}</span>
      <span class="t">You're all caught up</span>
      <button type="button" class="btn btn-dark" data-nx-new>Start an order</button></div>`;
    return;
  }
  const total = nextCards.reduce((s,c)=> s + Math.max(0, playEarn(c)), 0);
  sum.innerHTML = `<span class="ax-plays-sum">${nextCards.length} play${nextCards.length === 1 ? '' : 's'}${total > 0 ? `<b class="m">· +${esc(fmtCompactUGX(total))}</b>` : ''}</span>`;
  const rest = nextCards.slice(1);
  const kinds = {};
  rest.forEach(c=>{ const k = playKind(c).group; kinds[k] = (kinds[k] || 0) + 1; });
  wrap.innerHTML = nextCardHTML(nextCards[0], 0, nextCards.length)
    + (rest.length ? `<div class="ax-plays-h"><span>Then</span><span class="ax-plays-k">${Object.keys(kinds).map(k=> `<span class="${k}">${AX_ICON[PLAY_GROUPS[k]]}${kinds[k]}</span>`).join('')}</span></div>
      <div class="ax-card ax-plays-list">${rest.map((c,i)=> playRowHTML(c, i + 1)).join('')}</div>` : '');
  // "Shown" for the shop's feed figures: once a play is actually on
  // screen, once a day, however often it is scrolled past.
  if('IntersectionObserver' in window){
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        if(!en.isIntersecting) return;
        const c = nextCards[Number(en.target.dataset.nx)];
        if(c) feedLogShown(c);
      });
    }, { threshold: 0.6 });
    wrap.querySelectorAll('[data-nx]').forEach(el=> io.observe(el));
  }
}
// What kind of play it is, as a coloured mark: one look says "a client
// is due" or "someone asked" without reading the line.
const PLAY_GROUPS = { ask:'chat', due:'clock', bonus:'star', more:'plus', done:'check' };
function playKind(c){
  if(c.kind === 'ask') return { group:'ask', icon:'chat' };
  if(c.kind === 'due') return { group:'due', icon:'clock' };
  if(c.kind === 'bonus') return { group:'bonus', icon:'star' };
  if(c.kind === 'claim') return { group:'done', icon:'cash' };

}
/* A client's rhythm as a dial: the inner ring is their usual gap, filling
   as the days pass; once they are past it, an amber arc wraps beyond it
   by the days they are late. */
function rhythmDialHTML(c, size){
  const cad = c.cad, gap = Math.max(1, cad.avgGapDays), since = Math.max(0, cad.daysSince);
  const S = size || 84, mid = S / 2, r1 = S * 0.357, r2 = S * 0.44, sw = S * 0.06;
  const c1 = 2 * Math.PI * r1, c2 = 2 * Math.PI * r2;
  const inner = Math.min(1, since / gap) * c1;
  const late = Math.min(1, Math.max(0, since - gap) / gap) * c2;
  return `<span class="ax-dial" style="width:${S}px;height:${S}px;" aria-hidden="true"><svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">
      <circle cx="${mid}" cy="${mid}" r="${r1}" fill="none" stroke="currentColor" stroke-opacity=".14" stroke-width="${sw}"/>
      ${inner > 0 ? `<circle cx="${mid}" cy="${mid}" r="${r1}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${inner.toFixed(1)} ${c1.toFixed(1)}" transform="rotate(-90 ${mid} ${mid})"/>` : ''}
      ${late > 0 ? `<circle cx="${mid}" cy="${mid}" r="${r2}" fill="none" stroke="#F5B26B" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${late.toFixed(1)} ${c2.toFixed(1)}" transform="rotate(-90 ${mid} ${mid})"/>` : ''}
    </svg>${avHTML(c.client)}</span>`;
}

/* Day blocks: one per day since their last order, grey inside their own
   rhythm, amber for each day past it. Long rhythms are scaled down to
   fit -- the proportion is the message, not the count. */
function dayBlocksHTML(cad){
  const gap = Math.max(1, Math.round(cad.avgGapDays));
  const since = Math.max(0, Math.floor(cad.daysSince));
  const MAX = 26;
  const total = Math.max(gap, since);
  const scale = total > MAX ? MAX / total : 1;
  let lab;
  if(since >= gap){
    const grey = Math.max(1, Math.round(gap * scale));
    const late = since > gap ? Math.max(1, Math.round((since - gap) * scale)) : 0;
    const row = '<span></span>'.repeat(grey) + '<i></i>' + '<span class="late"></span>'.repeat(late);
    lab = `<span style="flex:${grey};">every ${gap} days</span>${late ? `<span class="late" style="flex:${late};">+${since - gap}</span>` : ''}`;
    return `<div class="ax-days"><div class="ax-days-r" aria-hidden="true">${row}</div><div class="ax-days-l">${lab}</div></div>`;
  }
  const done = Math.round(since * scale), ahead = Math.max(1, Math.round((gap - since) * scale));
  const row = '<span></span>'.repeat(done) + '<span class="ahead"></span>'.repeat(ahead) + '<i></i>';
  lab = `${done ? `<span style="flex:${done};">${since} day${since===1?'':'s'}</span>` : ''}<span class="ahead" style="flex:${ahead};">due in ${gap - since}</span>`;
  return `<div class="ax-days"><div class="ax-days-r" aria-hidden="true">${row}</div><div class="ax-days-l">${lab}</div></div>`;
}
// Whole days on both sides, so the label and the blocks never disagree
// by one.
function lateBy(cad){ return Math.floor(cad.daysSince) - Math.round(cad.avgGapDays); }
function lateLabel(cad){
  const g = lateBy(cad);
  if(g > 0) return { text: `${g} day${g===1?'':'s'} late`, tone:'warn' };
  if(g === 0) return { text: 'Due today', tone:'good' };
  return { text: `Due in ${-g} day${g===-1?'':'s'}`, tone:'soft' };
}

document.getElementById('ag_next').addEventListener('click', async (e)=>{
  if(e.target.closest('[data-nx-new]')){ switchTab('order'); return; }

  const card = nextCards[Number(btn.closest('[data-nx]').dataset.nx)];

  const act = btn.dataset.nxAct;
  const LOG = { usual:'acted', reply:'acted', add:'quoted', star:'cluster' };
  if(LOG[act]) feedLog(card, LOG[act]);
  if(act === 'usual'){ feedRemember(card, 'acted'); orderUsual(card.client); return; }
  if(act === 'claim'){ openMoneySheet(card.row.month); return; }
  if(act === 'win'){ markAchievementsSeen(card.fresh.map(a=> a.id)); renderNext(); return; }
  if(act === 'reply'){ replyToInquiry(card.inq, card.item || (card.matches && card.matches[0])); return; }

  if(act === 'star'){ await toggleClusterMembership(card.item.productId, card.item.variantIdx); renderNext(); return; }
  if(act === 'add'){
    feedRemember(card, 'acted');
    if(card.client) goToClientBasket(card.client);

function recentClients(limit){
  const counts = clientOrderCounts();
  return agentClients.map(c=>({ c, last: clientStats(counts.get(c.id)||[]).lastAt || '' }))
    .sort((a,b)=> String(b.last).localeCompare(String(a.last)) || String(a.c.name||'').localeCompare(String(b.c.name||'')))
    .slice(0, limit || agentClients.length).map(x=> x.c);

  if(cad) return { text: `Every ${Math.max(1, Math.round(cad.avgGapDays))} days · ${n}`, tone: 'reg' };

   is parked with whoever it belongs to. Naming a client for the unnamed
   basket is the one gesture that hands items over, and that is
   selectClient. */

  if(!client) return;

          <span class="b"><span class="nm">${esc(c ? c.name : 'Not yet named')}</span><span class="s">${b.count} item${b.count===1?'':'s'}${total > 0 ? ` · ${fmtNum(total)}` : ''}</span></span>
          <span class="go">Resume${PH.arrowR}</span></button>`;
      }).join('')}` : '';
    const all = (query ? agentClients.filter(c=> clientMatchesQuery(c, query)) : agentClients.slice())
      .map(c=> ({ c, st: clientStatus(c, counts, today, liveBy), cad: clientCadence(c, counts, today) }));
    const isNow = (c)=> chosenClient && String(chosenClient.id) === String(c.id);
    all.sort((a,b)=> (isNow(b.c) - isNow(a.c)) || (a.st.rank - b.st.rank)
      || ((a.st.soon||0) - (b.st.soon||0)) || String(a.c.name||'').localeCompare(String(b.c.name||'')));
    const rows = all.slice(0, 40).map(({ c, st, cad })=>{
      const waiting = (carts[String(c.id)]||[]).length;

        : waiting ? `${waiting} item${waiting===1?'':'s'} waiting`
        : st.soon ? `Due in ${st.soon} day${st.soon===1?'':'s'}` : st.text;
      const subCls = st.quiet ? 'quiet' : (st.cls === 'late' || st.due || waiting) && !now ? 'warn' : '';
      const right = now ? `<span class="now">${PH.checkCircle}Now</span>`
        : st.cls === 'live' ? `<span class="live">${st.icon || ''}</span>` : pickRing(st, cad);
      return `<button type="button" class="ax-pickrow${now ? ' now' : ''}" data-pick="${esc(c.id)}">${avHTML(c)}<span class="b"><span class="nm">${esc(c.name)}</span><span class="s ${subCls}">${esc(sub)}</span></span>${right}</button>`;
    }).join('');
    const add = query && !agentClients.some(c=> String(c.name||'').trim().toLowerCase() === query)
      ? `<button type="button" class="ax-pickrow" data-pick-new><span class="ax-av" style="background:var(--tile);color:var(--ink);">${AX_ICON.plus}</span><span class="b"><span class="nm">Add &ldquo;${esc(String(q).trim())}&rdquo;</span><span class="s">New client</span></span></button>` : '';
    const list = add + (rows ? `${!query ? `<div class="ax-cp-h">${PH.clock} <span>Who's due</span><b>${agentClients.length}</b></div>` : ''}${rows}` : '');
    sheet.el.querySelector('[data-list]').innerHTML = openHTML + (list || (query
      ? `<div class="ax-cp-none">${AX_ICON.search}Nobody called &ldquo;${esc(String(q).trim())}&rdquo;</div>`
      : `<div class="ax-cp-ghost"><span class="ax-cp-ghost-avs" aria-hidden="true"><i></i><i></i><i></i></span><span>The people you sell to gather here</span></div>`));
  };
  const sheet = openSheet(`<button type="button" class="ax-grab" data-close aria-label="Close"></button>
    <div class="ax-sheet-title"><h3>Who's buying?</h3><button type="button" class="ax-iconbtn" data-close aria-label="Close">${AX_ICON.x}</button></div>
    <div class="ax-form">
      <label class="ax-field ax-cp-q">${PH.search}<input type="search" data-q placeholder="Name or phone" autocomplete="off"></label>
      <div class="ax-cp-list" data-list></div>
      <button type="button" class="ax-cp-new" data-pick-new>${PH.userPlus}New client</button>
    </div>`, { label:"Who's buying?" });
  const input = sheet.el.querySelector('[data-q]');
  input.addEventListener('input', ()=> paint(input.value));
  sheet.el.addEventListener('click', (e)=>{
    if(e.target.closest('[data-pick-unnamed]')){ sheet.close(); switchToUnnamed(); return; }
    const row = e.target.closest('[data-pick]');
    if(row){
      const c = agentClients.find(x=> String(x.id) === row.dataset.pick);
      sheet.close();
      if(!c) return;
      // The one already open: their own sheet, which is what tapping the
      // name used to do.
      if(chosenClient && String(chosenClient.id) === String(c.id)){ openClientSheet(c.id); return; }
      goToClientBasket(c);
      return;
    }
    if(e.target.closest('[data-pick-new]')){
      const typed = input.value.trim();
      sheet.close();
      openNewClientPanel(typed, ()=>{ if(currentView === 'order') renderOrder(); });
    }
  });
  paint('');
}

/* ---- starting an order ----
   The box at the top is a real box: type and the matches appear right
   here, each with its own +. Under it, what this client needs first: a
   regular gets their usual as tiles, one tap each or all at once; someone
   new gets the aisles and what you sell most. Once lines are in, the
   aisles shrink to a row of chips under them. */
function lineFor(rows, productId, variantIdx){
  return (rows||[]).findIndex(it=> String(it.productId) === String(productId)
    && String(it.variantIdx==null?'':it.variantIdx) === String(variantIdx==null?'':variantIdx));
}
function orderQuery(){
  const el = document.getElementById('ag_orderQ');
  return el ? el.value.trim() : '';
}
// The usual quantity, said the way it was bought: "2 ctn" when it is a
// whole number of cartons, else in pieces.
function usualLabel(r, it){
  const qty = usualQty(r.qtys) || 1;
  const pq = Number(it && it.packQty) || 0;
  if(pq > 0 && it.packUnit && qty % pq === 0) return `${fmtNum(qty / pq)} ${String(it.packUnit).toLowerCase()}`;
  return `${fmtNum(qty)} ${String((it && it.unit) || r.unit || 'pc').toLowerCase()}`;
}
function clientUsuals(client){
  if(!client) return { orders: [], regs: [] };
  const orders = (clientOrderCounts().get(client.id) || []).filter(o=> !o.voided);
  return { orders, regs: clientRegulars(orders).slice(0, 6) };
}
// The aisles worth a tile: the ones you sell from most, then the shop's
// own order.
function topCategories(n){
  const by = new Map();
  myOrders.forEach(o=>{
    if(o.voided) return;
    (o.items||[]).forEach(li=>{
      const ce = catalogEntry(li.productId, li.variantIdx);
      if(ce) by.set(itemCategory(ce), (by.get(itemCategory(ce))||0) + 1);
    });
  });
  return findCategories().slice().sort((a,b)=> (by.get(b)||0) - (by.get(a)||0)).slice(0, n);
}
// What this agent sells most across every client, with how many orders
// each has been in -- else, before a first sale, what earns a bonus
// (sold 0, so the screen can tell the two apart).
function sellMostItems(n){
  const since = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
  const tally = (recentOnly)=>{
    const by = new Map();
    myOrders.forEach(o=>{
      if(o.voided) return;
      if(recentOnly && !(String(orderDate(o) || '') >= since)) return;
      (o.items||[]).forEach(li=>{
        const k = feedItemKey(li.productId, li.variantIdx);
        by.set(k, (by.get(k)||0) + 1);
      });
    });
    return [...by.entries()].sort((a,b)=> b[1]-a[1])
      .map(([k, sold])=>{ const [p, v] = k.split('::'); const it = catalogEntry(p, v === '' ? null : Number(v)); return it ? { it, sold } : null; })
      .filter(Boolean);
  };
  // The last 30 days when you have sold in them -- what moves now -- and
  // every order before that otherwise.
  let items = tally(true), recent = items.length > 0;
  if(!recent) items = tally(false);
  if(!items.length){
    const promoted = promotedMap();
    items = catalog.filter(it=> promoted.has(feedItemKey(it.productId, it.variantIdx))).map(it=> ({ it, sold: 0 }));
  }
  const out = items.slice(0, n);
  out.recent = recent;
  return out;
}
/* An aisle as a tile: its icon on its own tint, the name, how much is in
   it, and a star with how many earn a bonus there. */
function aisleTileHTML(c, promoted){
  const inAisle = catalog.filter(it=> itemCategory(it) === c);
  const bonus = inAisle.filter(it=> promoted.has(feedItemKey(it.productId, it.variantIdx))).length;
  return `<button type="button" class="ax-lpc" data-go-cat="${esc(c)}" style="${aisleTint(c)}">
    ${bonus ? `<span class="bn">${PH.star}${bonus}</span>` : ''}
    <span class="ic">${categoryIconSVG(c)}</span>
    <span class="t"><span class="nm">${esc(c)}</span><span class="n">${fmtNum(inAisle.length)} item${inAisle.length===1?'':'s'}</span></span></button>`;
}
/* One of what you sell most: big art, its rank, how often it sells as a
   bar against your best seller, what you make on one, the price, a +.
   Before a first sale the same card carries the bonus instead. */
function sellCardHTML(x, i, top, promoted){
  const it = x.it, key = feedItemKey(it.productId, it.variantIdx);
  const mode = defaultUnit(it);
  const pq = Number(it.packQty) || 0;
  const mult = mode === 'pack' && pq > 0 ? pq : 1;
  const floor = Number(it.floorPrice) || 0, our = Number(it.ourPrice) || 0;
  const yours = our > floor ? (our - floor) * mult : 0;
  const promo = promoted.get(key);
  const per = String(mode === 'pack' ? it.packUnit : (it.unit || 'each')).toLowerCase();
  const isIn = lineFor(cart, it.productId, it.variantIdx) >= 0;
  const cat = itemCategory(it);
  return `<div class="ax-lpi${x.sold ? '' : ' bonus'}" style="${aisleTint(cat)}">
    <span class="im">${itemThumbHTML(it)}${x.sold ? `<span class="rk${i === 0 ? ' gold' : ''}">${i + 1}</span>` : ''}${promo && x.sold ? `<span class="bn">${PH.star}${esc(bonusFlagLabel(promo))}</span>` : ''}</span>
    <span class="bd">
      <span class="nm">${esc(it.name)}${it.variantLabel ? ` · ${esc(it.variantLabel)}` : ''}</span>
      ${x.sold ? `<span class="hb"><span class="tr"><i style="width:${Math.max(8, Math.round(100 * x.sold / Math.max(1, top)))}%"></i></span><b>${x.sold}×</b></span>` : ''}
      ${!x.sold && promo ? `<span class="yb">${PH.star}<b>${esc(bonusFlagLabel(promo))}</b> each</span>`
        : yours > 0 ? `<span class="yo">+${fmtNum(yours)} yours</span>` : ''}
      <span class="r"><span class="p"><b>${fmtNum(shelfPrice(it, mode))}</b><small>per ${esc(per)}</small></span>
        ${isIn ? `<span class="in">${PH.check}</span>`
          : `<button type="button" data-lp-add="${esc(key)}" aria-label="Add ${esc(it.name)}">${PH.plus}</button>`}</span>
    </span>
  </div>`;
}
/* Someone new: the aisles you sell from most, then what you sell most.
   On a first day the second row is what earns extra, with a place kept
   for the best sellers still to come. Before the shop's list arrives,
   the shape of both -- never a blank. */
function launchpadHTML(){
  const head = (ic, t, r, tone)=> `<div class="ax-lp-h${tone ? ' ' + tone : ''}">${ic} <span>${t}</span>${r || ''}</div>`;

    const card = `<span class="ax-sk-card"><i class="ax-sk art"></i><span class="sb"><i class="ax-sk ln"></i><i class="ax-sk ln s"></i><span class="ft"><i class="ax-sk ln p"></i><i class="ax-sk dot"></i></span></span></span>`;
    return `${head(PH.grid, 'Aisles', `<span class="ax-lp-load"><i class="ax-spin"></i>Getting the shop list</span>`)}
      <div class="ax-lp-cats" aria-hidden="true">${tile.repeat(6)}</div>

  }
