// agent_clusters already stops a real duplicate row from a race, but
// without this a fast double-tap still surfaces that as a raw "duplicate
// key" error instead of the toggle just quietly working once.
const clusterTogglesInFlight = new Set();
async function toggleClusterMembership(productId, variantIdx){
  const viStr = variantIdx==null ? '' : String(variantIdx);
  const key = `${productId}::${viStr}`;
  if(clusterTogglesInFlight.has(key)) return;
  clusterTogglesInFlight.add(key);
  const already = isInCluster(productId, variantIdx);
  try{
    if(already){
      const { error } = await sb.from('agent_clusters').delete()
        .eq('shop_id', currentShopId).eq('agent_id', myAgent.id).eq('product_id', productId).eq('variant_idx', viStr);
      if(error) throw error;
      cluster = cluster.filter(c=>!(c.product_id===productId && String(c.variant_idx||'')===viStr));
      toast('Removed from your cluster');
    } else {
      const { data: inserted, error } = await sb.from('agent_clusters')
        .insert({ shop_id: currentShopId, agent_id: myAgent.id, product_id: productId, variant_idx: viStr })
        .select().single();
      if(error) throw error;
      cluster.push(inserted);
      toast(clusterWaitDays>0
        ? `Added -- bonus unlocks in ${clusterWaitDays} day${clusterWaitDays===1?'':'s'}`
        : 'Added -- sell it to start earning the bonus');
    }
    if(currentView === 'find') renderFind();
    else if(currentView === 'today') renderNext();
  }catch(err){
    toast(isNetworkError(err) ? "You're offline -- couldn't update your cluster" : `Could not update your cluster: ${err.message||err}`);
  } finally {
    clusterTogglesInFlight.delete(key);
  }
}

// Finds the breakpoint a given (base-unit) quantity actually earns -- the
// highest minQty at or below it. Mirrors the server's own tieredUnitPrice()
// resolution rule; safe to do purely client-side because every tier in
// `tiers` already carries its final agent-facing floor price, not a raw
// cost an agent shouldn't be able to derive markup/discount from.
function tierForQty(tiers, qty){
  let best = null;
  (tiers||[]).forEach(t=>{ if(qty>=t.minQty && (!best || t.minQty>=best.minQty)) best = t; });
  return best || (tiers && tiers[0]) || null;
}

/* ================= QUOTE + client + delivery + submit ================= */
// Shared by renderCart(), the live-typing patch, and the client-view/
// download render -- one place computes rate/amount/profit per line so
// the three surfaces can never quietly disagree with each other.
/* What a line's price means against the floor -- what the shop charges
   the agent for it, at the tier this quantity earned.

   Two different things used to be one. `noMargin` was
   `agentSellPrice <= floorPrice`, so selling AT the floor and selling
   BELOW it both read "No margin set":

     at the floor   zero margin, and a real choice -- selling at cost to
                    win a customer or clear a slow line. The agent keeps
                    nothing, and knows it.
     below it       a LOSS. The agent owes the shop the floor whatever
                    they charge their client, so the difference comes
                    out of their own pocket.

   The second is the one worth interrupting for, and it was hidden behind
   the wording of the first. Computed here alone, because the same rule
   was also written out by hand in renderCart's markup and again in the
   live-typing patch, and three copies of a rule is how they drift. */
function cartLineMargin(sellPerBase, floorPrice, baseQty){
  const sell = Number(sellPerBase)||0;
  const floor = Number(floorPrice)||0;
  const qty = Number(baseQty)||0;
  if(sell > floor) return { level:'ok', label:'', detail:'' };
  if(sell === floor){
    return {
      level:'none', label:'No margin set',
      detail:`You are charging exactly the ${fmtUGX(floor)} the shop charges you, so you keep nothing on this line.`,
    };
  }
  const short = (floor - sell) * qty;
  return {
    level:'loss', label:`At a loss — ${fmtUGX(short)}`,
    detail:`You owe the shop ${fmtUGX(floor)} for each one whatever you charge, so charging ${fmtUGX(sell)} costs you ${fmtUGX(short)} on this line.`,
  };
}
// The chip shown against a line. Empty when the line is making money.
function cartMarginFlagHTML(margin){
  if(margin.level==='ok') return '';
  return `<span class="ag-margin-flag${margin.level==='loss'?' loss':''}" title="${esc(margin.detail)}">${ICON_WARN}${esc(margin.label)}</span>`;
}
function cartLineFigures(it){
  const baseQty = Number(it.qty)||0;
  const agentSellPrice = Number(it.agentSellPrice)||0;
  const floorPrice = Number(it.floorPrice)||0;
  const amount = agentSellPrice * baseQty;
  const displayQty = it.displayQty!=null ? it.displayQty : baseQty;
  const displayUnit = it.displayUnit || it.unit || '';
  const rate = displayQty>0 ? amount/displayQty : 0;
  const profit = (agentSellPrice - floorPrice) * baseQty;
  const margin = cartLineMargin(agentSellPrice, floorPrice, baseQty);
  // Kept: half a dozen callers read it, and "not making money on this
  // line" is still exactly what they want. `margin.level` is what tells
  // the two kinds apart.
  const noMargin = margin.level !== 'ok';
  return { baseQty, amount, displayQty, displayUnit, rate, profit, noMargin, margin };
}

/* ---- Client picking ---- */
/* The first LETTER of each of the first two words -- not the first
   CHARACTER, which is what every copy of this in the app used to take.

   This shop tells two people of the same name apart by qualifying it:
   "Feko (Ambrose)" and "Feko (Rebbeca)", "Bahco - Jose", "Reagan -
   Stuart" and "Ronald - 7th Street". Character zero of the second word
   is then a bracket or a hyphen, so the avatar read "F(", "B-", "R-" --
   punctuation where initials belong, on 11 of 99 customers. Worse, both
   Fekos came out "F(" and both R-names "R-": the one mark on the row
   whose job is telling two clients apart was identical on precisely the
   pairs it exists for.

   Digits count as letters here, because "Ronald - 7th Street" is
   distinguished by its 7 and "R7" says which Ronald.

   Byte-for-byte the admin app's nameInitials(). The two apps do not
   share a script, so this is a copy -- but it is the ONLY copy in this
   file, and everything here that letters an avatar goes through it. */
function nameInitials(name){
  const letters = String(name||'').trim().split(/\s+/)
    .map(w=> (w.match(/[A-Za-z0-9]/)||[''])[0]).filter(Boolean);
  if(!letters.length) return '?';
  return (letters[0] + (letters[1]||'')).toUpperCase();
}
function clientInitials(name){ return nameInitials(name); }

function selectClient(client){
  if(!client) return;
  /* Taken before anything is swapped. With nobody chosen yet this is the
     unowned basket, which is the one that used to be lost here. */
  const hadClient = !!cartKey(chosenClient);
  const inHand = hadClient ? [] : cart.slice();
  // Park whatever is in hand against the client it was built for BEFORE
  // switching, or it follows the agent to the next customer.
  if(cartKey(chosenClient) !== cartKey(client)) stashActiveCart();
  chosenClient = client;
  activateCartFor(client);
  /* `cart` is now this client's own array, held by reference in `carts`.
     Refilled in place rather than reassigned, so the two do not drift
     apart and later pushes still land in the right basket. */
  const merged = adoptedCartFor(hadClient, inHand, cart);
  if(merged.adopted){
    cart.length = 0;
    merged.rows.forEach(r=> cart.push(r));
    /* They have an owner now. Left in the unnamed basket as well they
       would show up twice -- once under this client and once still
       waiting to be claimed. */
    unnamedCart = [];
    const n = merged.adopted;
    toast(merged.joined
      ? `${n} item${n===1?'':'s'} added to ${client.name}'s basket, which already had ${merged.joined}`
      : `${n} item${n===1?'':'s'} moved to ${client.name}`);
  }
  openLineIdx = -1;
  afterClientChosen(client);
}

/* A client keeps one tint everywhere: picked from their id, so the same
   shop is the same colour on Today, in the order strip and on its sheet. */
function avTint(id){
  const s = String(id == null ? '' : id);
  let h = 0;
  for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return 't' + (h % 5);
}
function avHTML(client, cls){
  return `<span class="ax-av ${cls||''} ${avTint(client && client.id)}">${esc(clientInitials(client && client.name))}</span>`;
}
/* An avatar inside a ring that fills as their usual gap runs out --
   amber once they are past it. A glance down the client list shows who
   is due without a single word. */
function ringAvHTML(client, frac, tone){
  const r = 20, c = 2 * Math.PI * r;
  const on = Math.max(0, Math.min(1, Number(frac)||0)) * c;
  const col = tone === 'late' ? 'var(--warn)' : tone === 'due' ? 'var(--good)' : '#9AA1AE';
  return `<span class="ax-ringav">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--line)" stroke-width="3"/>
      ${on > 0 ? `<circle cx="22" cy="22" r="${r}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${on.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 22 22)"/>` : ''}
    </svg>
    ${avHTML(client)}
  </span>`;
}
function itemThumbHTML(it){
  if(it && it.image) return `<img src="${esc(it.image)}" alt="" loading="lazy">`;

function shortName(name, words){

function fmtSigned(n){
  const v = Math.round(Number(n)||0);
  return (v < 0 ? '−' : '+') + fmtNum(Math.abs(v));
}
function dateShort(d){
  if(!d) return '';

}

/* ---- sheets ----
   One way to bring something up over the screen and one way to put it
   away: tap outside it, the X, or Escape. */
const openSheets = [];
// A sheet about one thing -- an order, a client, your money, your goal --
// is a page of its own and rises to fill the screen (opts.full), so the
// screen behind is only a sliver of edge, never half a hero competing
// with it. Quick asks stay as short as their question.
function openSheet(html, opts){
  opts = opts || {};
  const scrim = document.createElement('div');
  scrim.className = 'ax-scrim';
  scrim.innerHTML = `<div class="ax-sheet${opts.white ? ' white' : ''}${opts.full ? ' full' : ''}" role="dialog" aria-modal="true" aria-label="${esc(opts.label||'')}">${html}</div>`;
  document.body.appendChild(scrim);
  document.body.classList.add('ax-locked');
  const sheet = { el: scrim.querySelector('.ax-sheet'), scrim, kind: opts.kind || '', refresh: opts.refresh || null,
    close(){
      if(!scrim.parentNode) return;
      scrim.remove();
      const i = openSheets.indexOf(sheet);
      if(i >= 0) openSheets.splice(i, 1);
      if(!openSheets.length) document.body.classList.remove('ax-locked');
      if(opts.onClose) opts.onClose();
    } };
  scrim.addEventListener('click', (e)=>{ if(e.target === scrim) sheet.close(); });
  sheet.el.addEventListener('click', (e)=>{ if(e.target.closest('[data-close]')) sheet.close(); });
  openSheets.push(sheet);
  return sheet;
}
function closeSheetsOfKind(kind){
  openSheets.slice().forEach(s=>{ if(s.kind === kind) s.close(); });
}
function refreshOpenSheets(){
  openSheets.forEach(s=>{ if(s.refresh) s.refresh(); });
}
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && openSheets.length) openSheets[openSheets.length - 1].close();
});

/* ================= WHERE AN ORDER HAS GOT TO =================
   One answer per order, used by every screen that mentions one -- the
   tiles on Today, the client list, and the track itself -- so no two
   places can disagree about where it is. */
function agentOrderTerms(q){
  return (q.items||[]).map(it=> [
    it.productId, (it.variantIdx === null || it.variantIdx === undefined) ? '' : it.variantIdx,
    Number(it.qty)||0, Math.round(Number(it.sellPrice)||0)
  ].join(':')).join('|');
}
/* Whether the shop has been through the lines. A draft carries the
   shop's signature of the lines it confirmed; if a line changed since,
   the signature no longer matches and it is being checked again. Past
   Draft it has been checked by definition. */
function orderShopChecked(o){
  if(!o) return false;
  if(o.status !== 'draft') return true;
  return !!(o.shopConfirmedAt && o.shopConfirmedTerms === agentOrderTerms(o));
}
function staffName(id){
  return id && id !== '__agent__' ? (orderStaffNames.get(id) || null) : null;
}
function orderStage(o){
  const prepay = !!(myAgent && myAgent.paymentTerm === 'prepay');
  const owed = orderOwedAmount(o);
  const pickup = o.deliveryMode === 'agent_pickup';
  if(o.voided) return { key:'cancelled', title:'Cancelled', sub:'The shop cancelled this order', group:null, tone:'warn' };
  if(o.status === 'draft'){
    if(!orderShopChecked(o)) return { key:'checking', title:'Checking', sub:'The shop confirms each item', group:'sent' };
    if(prepay && o.agentPaymentStatus !== 'paid' && owed > 0){
      const kept = (o.items||[]).length, all = kept + (o.droppedLines||[]).length;
      return { key:'pay', title:'Pay now', sub:`${kept} of ${all} confirmed · packing starts after`, group:'sent', tone:'warn', needs:'pay' };
    }
    return { key:'queued', title:'Confirmed', sub:'Packing starts next', group:'sent' };
  }
  if(o.status === 'awaiting_goods') return { key:'packing', title:'Packing', sub:'The shop is bringing some items in', group:'packing' };
  if(o.status === 'preparing'){
    const n = staffName(o.assignedWorkerId);
    return { key:'packing', title:'Packing', sub: n ? `${n} is packing it` : 'Being packed now', group:'packing' };
  }
  if(o.status === 'pending_delivery'){
    if(pickup) return { key:'ready', title:'Ready', sub:'Waiting at the shop for you', group:'out', tone:'good', needs:'collect' };
    const n = staffName(o.assignedDeliveryId);
    return { key:'out', title:'On the way', sub: n ? `${n} is delivering` : 'Out for delivery', group:'out' };
  }
  if(o.status === 'completed'){
    if(!prepay && owed > 0) return { key:'settle', title:'Settle up', sub:`${fmtNum(owed)} owed to the shop`, group:null, tone:'warn', needs:'pay' };
    return { key:'done', title:'Done', sub: pickup ? 'Collected' : 'Delivered', group:'done' };
  }
  return { key:'checking', title:'Checking', sub:'The shop confirms each item', group:'sent' };
}
// The six steps, in the order this agent lives them. A prepay agent pays
// between the check and the packing; everyone else settles at the end.
function orderSteps(o){
  const prepay = !!(myAgent && myAgent.paymentTerm === 'prepay');
  const pickup = o.deliveryMode === 'agent_pickup';
  const ready = { label: pickup ? 'Ready' : 'On way', icon: pickup ? 'store' : 'truck' };
  return prepay
    ? [{label:'Sent',icon:'send'},{label:'Checked',icon:'check'},{label:'Paid',icon:'cash'},{label:'Packing',icon:'box'},ready,{label:'Done',icon:'flag'}]
    : [{label:'Sent',icon:'send'},{label:'Checked',icon:'check'},{label:'Packing',icon:'box'},ready,{label:'Done',icon:'flag'},{label:'Paid',icon:'cash'}];
}
function orderStepIndex(o, st){
  const prepay = !!(myAgent && myAgent.paymentTerm === 'prepay');
  const map = prepay
    ? { checking:1, pay:2, queued:3, packing:3, ready:4, out:4, done:6 }
    : { checking:1, queued:2, packing:2, ready:3, out:3, settle:5, done:6 };
  return map[st.key] != null ? map[st.key] : -1;
}
// What the shop is still owed for this order: the lines it kept, less
// anything already paid against it.
function orderOwedAmount(o){
  if(!o || o.agentPaymentStatus === 'paid') return 0;
  const total = (o.items||[]).reduce((s,it)=> s + (Number(it.sellPrice)||0) * (Number(it.qty)||0), 0);
  return Math.max(0, Math.round(total - (Number(o.amountPaid)||0)));
}
function liveOrders(){
  return myOrders.filter(o=> !o.voided && o.status !== 'completed');
}

/* The month as a ring. White is what is yours already; the faint mint
   after it is what is within reach -- baskets not yet sent, bonuses
   that land when an order completes. The figure in the middle is how far
   along the goal you are. */
function monthPicture(now){
  const key = currentMonthKey();
  const m = monthEarnings(key);
  const target = Number(myGoals && myGoals.monthly_target) || 0;
  const best = target ? null : fxBestMonth();
  const aim = target || (best ? best.total : 0);
  let near = 0;
  new Set(Object.values(carts).concat([unnamedCart, cart])).forEach(rows=>{
    (rows||[]).forEach(it=>{ const f = cartLineFigures(it); if(f.profit > 0) near += f.profit; });
  });
  m.orders.forEach(o=>{ if(o.status !== 'completed') near += orderEarnings(o).bonus; });
  return { key, earned: m.total, margin: m.margin, bonus: m.bonus, aim, target, best, near, days: fxDaysLeftInMonth(now) };
}
function ringSVG(size, stroke, parts, track){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, mid = size / 2;
  let at = 0;
  const arcs = parts.map(p=>{
    const len = Math.max(0, Math.min(1 - at, p.frac)) * c;
    const s = len > 0 ? `<circle cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke="${p.color}"${p.opacity ? ` stroke-opacity="${p.opacity}"` : ''} stroke-width="${stroke}"${p.round ? ' stroke-linecap="round"' : ''} stroke-dasharray="${len.toFixed(1)} ${c.toFixed(1)}" stroke-dashoffset="${(-at * c).toFixed(1)}" transform="rotate(-90 ${mid} ${mid})"/>` : '';
    at += Math.max(0, p.frac);
    return s;
  });
  // Drawn back to front so the rounded cap of what is earned sits over
  // the reach arc that follows it.
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>${arcs.slice().reverse().join('')}</svg>`;
}

  }).join('');

    ? `<button type="button" class="ax-needrow" data-move="needs"><span class="nm" style="color:var(--ink-soft);">+${needs.length - 4} more waiting on you</span>${AX_ICON.chevR}</button>` : '';

/* Day blocks: one per day since their last order, grey inside their own
   rhythm, amber for each day past it. Long rhythms are scaled down to
   fit -- the proportion is the message, not the count. */
function dayBlocksHTML(cad){
  const gap = Math.max(1, Math.round(cad.avgGapDays));
  const since = Math.max(0, Math.floor(cad.daysSince));
  const MAX = 26;
  const total = Math.max(gap, since);
  const scale = total > MAX ? MAX / total : 1;
  let lab;
  if(since >= gap){
    const grey = Math.max(1, Math.round(gap * scale));
    const late = since > gap ? Math.max(1, Math.round((since - gap) * scale)) : 0;
    const row = '<span></span>'.repeat(grey) + '<i></i>' + '<span class="late"></span>'.repeat(late);
    lab = `<span style="flex:${grey};">every ${gap} days</span>${late ? `<span class="late" style="flex:${late};">+${since - gap}</span>` : ''}`;
    return `<div class="ax-days"><div class="ax-days-r" aria-hidden="true">${row}</div><div class="ax-days-l">${lab}</div></div>`;
  }
  const done = Math.round(since * scale), ahead = Math.max(1, Math.round((gap - since) * scale));
  const row = '<span></span>'.repeat(done) + '<span class="ahead"></span>'.repeat(ahead) + '<i></i>';
  lab = `${done ? `<span style="flex:${done};">${since} day${since===1?'':'s'}</span>` : ''}<span class="ahead" style="flex:${ahead};">due in ${gap - since}</span>`;
  return `<div class="ax-days"><div class="ax-days-r" aria-hidden="true">${row}</div><div class="ax-days-l">${lab}</div></div>`;
}
// Whole days on both sides, so the label and the blocks never disagree

function lateLabel(cad){

  return { text: `Due in ${-g} day${g===-1?'':'s'}`, tone:'soft' };
}

document.getElementById('ag_next').addEventListener('click', async (e)=>{

  if(act === 'star'){ await toggleClusterMembership(card.item.productId, card.item.variantIdx); renderNext(); return; }
  if(act === 'add'){
    feedRemember(card, 'acted');
    if(card.client) goToClientBasket(card.client);

    .sort((a,b)=> String(b.last).localeCompare(String(a.last)) || String(a.c.name||'').localeCompare(String(b.c.name||'')))
    .slice(0, limit || agentClients.length).map(x=> x.c);

/* The strip along the top of the order: whose order this is, then the
   other orders in progress (dashed, with how many items are waiting),
   then the people you serve most. One tap moves between them. */
function renderClientStrip(){
  const wrap = document.getElementById('ag_clientStrip');
  const baskets = quoteBasketSummaries(agentClients, carts, chosenClient ? chosenClient.id : null, unnamedCart);
  const parked = baskets.filter(b=> !b.active && b.count > 0);
  const seen = new Set(parked.map(b=> String(b.key)));
  if(chosenClient) seen.add(String(chosenClient.id));

    ? `<button type="button" class="ax-who" data-strip="me" title="${esc(chosenClient.name)}">${avHTML(chosenClient)}<span class="nm">${esc(chosenClient.name)}</span></button>
       <button type="button" class="ax-ob new" data-strip="pick" aria-label="Another client">${AX_ICON.plus}</button>`
    : `<button type="button" class="ax-who empty" data-strip="pick">${AX_ICON.user}<span class="nm">Who's this for?</span></button>`;

  }).join('');

    `<button type="button" class="ax-ob ${avTint(c.id)}" data-strip="${esc(c.id)}" aria-label="${esc(c.name)}">${esc(clientInitials(c.name))}</button>`).join('');
  wrap.innerHTML = who + parkedHTML + recentHTML;
}
document.getElementById('ag_clientStrip').addEventListener('click', (e)=>{

/* Moving between orders in progress only ever MOVES: the basket in hand
   is parked with whoever it belongs to. Naming a client for the unnamed
   basket is the one gesture that hands items over, and that is
   selectClient. */
function goToClientBasket(client){
  if(!client) return;
  if(!chosenClient){ selectClient(client); return; }
  if(String(chosenClient.id) === String(client.id)) return;
  stashActiveCart();
  chosenClient = client;
  activateCartFor(client);
  openLineIdx = -1;
  afterClientChosen(client);
}
function switchToUnnamed(){
  if(!chosenClient) return;
  stashActiveCart();
  chosenClient = null;
  activateCartFor(null);
  openLineIdx = -1;
  saveQuoteDraft();
  updateCartBadge();
  if(currentView === 'order') renderOrder();
}
function afterClientChosen(client){

}

function openClientPicker(){
  const paint = (q)=>{
    const query = String(q||'').trim().toLowerCase();
    const counts = clientOrderCounts(), today = new Date();

    liveOrders().forEach(o=>{ if(o.agentClientId && !liveBy.has(String(o.agentClientId))) liveBy.set(String(o.agentClientId), o); });
    const list = (query ? agentClients.filter(c=> clientMatchesQuery(c, query)) : recentClients()).slice(0, 40);
    const rows = list.map(c=>{
      const waiting = (carts[String(c.id)]||[]).length;
      // The same words the client list uses, so a name reads the same
      // wherever it is picked from.
      const st = clientStatus(c, counts, today, liveBy);
      const sub = waiting ? `<span class="s warn">${waiting} item${waiting===1?'':'s'} waiting</span>`
        : `<span class="s${st.cls === 'late' ? ' warn' : ''}">${esc(st.text)}</span>`;
      return `<button type="button" class="ax-pickrow" data-pick="${esc(c.id)}">${avHTML(c)}<span class="b"><span class="nm">${esc(c.name)}</span>${sub}</span></button>`;
    }).join('');
    const add = query && !agentClients.some(c=> String(c.name||'').trim().toLowerCase() === query)
      ? `<button type="button" class="ax-pickrow" data-pick-new><span class="ax-av" style="background:var(--tile);color:var(--ink);">${AX_ICON.plus}</span><span class="b"><span class="nm">Add &ldquo;${esc(String(q).trim())}&rdquo;</span><span class="s">New client</span></span></button>` : '';
    sheet.el.querySelector('[data-list]').innerHTML = add + rows || '<div class="ax-empty">No clients yet. Type a name to add one.</div>';
  };
  const sheet = openSheet(`<button type="button" class="ax-grab" data-close aria-label="Close"></button>
    <div class="ax-sheet-title"><h3>Who's this for?</h3><button type="button" class="ax-iconbtn" data-close aria-label="Close">${AX_ICON.x}</button></div>
    <div class="ax-form">
      <label class="ax-field">${AX_ICON.search}<input type="search" data-q placeholder="Name or phone" autocomplete="off"></label>
      <div data-list></div>
    </div>`, { label:"Who's this for?", white:true });
  const input = sheet.el.querySelector('[data-q]');
  input.addEventListener('input', ()=> paint(input.value));
  sheet.el.addEventListener('click', (e)=>{

    if(row){
      const c = agentClients.find(x=> String(x.id) === row.dataset.pick);
      sheet.close();

    }

/* ---- their usual ----
   What this client always buys, as tiles you tick off: a tick when it is
   already in the order, a plus to drop it in at their usual quantity and
   the price you last charged them. */
function lineFor(rows, productId, variantIdx){
  return (rows||[]).findIndex(it=> String(it.productId) === String(productId)
    && String(it.variantIdx==null?'':it.variantIdx) === String(variantIdx==null?'':variantIdx));
}
function renderUsual(){

  const inN = regs.filter(r=> lineFor(cart, r.productId, r.variantIdx) >= 0).length;

      return `<button type="button" class="ax-ut${isIn ? ' in' : ''}" data-usual="${esc(r.key)}" aria-label="${isIn ? `${esc(r.name)} is in the order` : `Add ${esc(r.name)}, usual ${qty}`}">
        ${it && it.image ? `<img src="${esc(it.image)}" alt="">` : categoryIconSVG(it ? itemCategory(it) : '')}
        <span class="nm">${esc(label)}</span>

document.getElementById('ag_usualWrap').addEventListener('click', async (e)=>{
  const b = e.target.closest('[data-usual]');
  if(!b || !chosenClient) return;
  const orders = (clientOrderCounts().get(chosenClient.id) || []).filter(o=> !o.voided);
  const r = clientRegulars(orders).find(x=> x.key === b.dataset.usual);

  if(idx >= 0){ openLineIdx = idx; renderCart(); return; }
  await addRegular(r);
  renderOrder();
});
// A regular is remembered in base units. Shown in packs when it is a
// whole number of them, because "2 ctn" is how it was bought.
async function addRegular(r){
  const it = catalogEntry(r.productId, r.variantIdx);
  if(!it){ toast('That product is no longer in the shop’s catalogue'); return null; }
  const qty = usualQty(r.qtys) || 1;
  const pq = Number(it.packQty) || 0;
  const usePack = pq > 0 && qty % pq === 0;
  return addCatalogLine(it, { unit: usePack ? 'pack' : 'unit', displayQty: usePack ? qty / pq : qty,
    priceBase: r.lastRate > 0 ? r.lastRate : null, quiet: true });
}
async function orderUsual(client){
  goToClientBasket(client);
  const orders = (clientOrderCounts().get(client.id) || []).filter(o=> !o.voided);
  const regs = clientRegulars(orders).slice(0, 6).filter(r=> lineFor(cart, r.productId, r.variantIdx) < 0);
  switchTab('order');
  if(!regs.length) return;
  if(!catalog.length) await ensureBrowseDataLoaded();
  toast(`Adding ${regs.length} usual item${regs.length===1?'':'s'}…`);
  for(const r of regs) await addRegular(r);
  if(currentView === 'order') renderOrder();
  toast(`${possessive(client.name)} usual is in — check the prices and slide to send`, 3500);
}

/* The last price this client was charged for an item, per base unit --
   the first suggestion under the price, because a client who paid that
   last time expects it again. */
function lastRateFor(client, productId, variantIdx){
  if(!client) return 0;
  let best = null;
  myOrders.forEach(o=>{
    if(o.voided || String(o.agentClientId) !== String(client.id)) return;
    const d = orderDate(o) || '';
    (o.items||[]).forEach(it=>{
      if(String(it.productId) !== String(productId) || String(it.variantIdx==null?'':it.variantIdx) !== String(variantIdx==null?'':variantIdx)) return;
      if(!agentLinePriced(it)) return;
      if(!best || d >= best.d) best = { d, rate: Number(it.agentSellPrice) };
    });
  });
  return best ? best.rate : 0;
}

/* ---- adding a line ----
   One price fetch, for the item's whole volume ladder, and then every
   quantity is priced locally from it -- the same rule the server applies
   again on submit, so nothing here is trusted on the way out. */
const addingKeys = new Set();
async function addCatalogLine(item, opts){
  opts = opts || {};
  const key = feedItemKey(item.productId, item.variantIdx);
  if(addingKeys.has(key)) return null;
  addingKeys.add(key);
  if(currentView === 'find') renderFind();
  let tiers = null, unit = item.unit, packUnit = item.packUnit, packQty = Number(item.packQty)||0;
  let ourPrice = Number(item.ourPrice) || 0;
  try{
    const res = await callAgentFn('agent-catalog', { action:'price', productId: item.productId, variantIdx: item.variantIdx, qty: 1 });
    if(res && res.available && Array.isArray(res.tiers) && res.tiers.length){
      tiers = res.tiers.slice().sort((a,b)=> a.minQty - b.minQty);
      unit = res.unit; packUnit = res.packUnit; packQty = Number(res.packQty)||0;
      ourPrice = Number(res.ourPrice) || ourPrice;
    }
  }catch(err){
    if(isNetworkError(err)) toast("You're offline — added at the last price on this phone", 3200);
  }finally{
    addingKeys.delete(key);
  }
  if(!tiers) tiers = [{ minQty: 1, unitPrice: Number(item.floorPrice)||0, tier: item.tier }];
  const usePack = opts.unit === 'pack' && packQty > 0;
  const displayQty = Number(opts.displayQty) > 0 ? Number(opts.displayQty) : 1;
  const qty = usePack ? displayQty * packQty : displayQty;
  const earned = tierForQty(tiers, qty);
  const floor = earned ? Number(earned.unitPrice) : (Number(item.floorPrice)||0);
  // Their last price first, then the shop's own suggestion, and never
  // below what the shop charges you unless you type it yourself.
  const last = opts.priceBase != null ? Number(opts.priceBase) : lastRateFor(chosenClient, item.productId, item.variantIdx);
  const sellBase = last > 0 ? last : (ourPrice > floor ? ourPrice : floor);
  const line = {
    productId: item.productId, variantIdx: item.variantIdx, name: item.name, variantLabel: item.variantLabel,
    qty, unit, packUnit, packQty, displayQty, displayUnit: usePack ? packUnit : unit,
    tier: earned ? earned.tier : item.tier, floorPrice: floor, agentSellPrice: sellBase, tiers, ourPrice,
  };
  cart.push(line);
  updateCartBadge();
  saveQuoteDraft();
  if(!opts.quiet){
    const m = cartLineMargin(line.agentSellPrice, line.floorPrice, line.qty);
    if(m.level !== 'ok') toast(`Added — ${m.detail}`, 6000);
  }
  if(currentView === 'find') renderFind();
  return line;
}
function lineUsesPack(it){
  return Number(it.packQty) > 0 && !!it.displayUnit && it.displayUnit === it.packUnit && it.packUnit !== it.unit;
}
function lineMult(it){ return lineUsesPack(it) ? Number(it.packQty) : 1; }
/* A new quantity re-reads the ladder: what the shop charges you can drop
   as the line grows, and what you charge your client stays as you set it. */
function setLineQty(it, displayQty){
  const d = Math.max(0, Math.round((Number(displayQty)||0) * 100) / 100);
  it.displayQty = d;
  it.qty = d * lineMult(it);
  if(Array.isArray(it.tiers) && it.tiers.length){
    const t = tierForQty(it.tiers, it.qty);
    if(t){ it.floorPrice = Number(t.unitPrice); it.tier = t.tier; }
  }
  saveQuoteDraft();
}
/* The next rung of the ladder, if it is a step and not a leap: within
   three times what is on the line, and genuinely cheaper. Said as the
   quantity to type, in the unit already on the line where it divides. */
function nextTierHint(it){
  if(!Array.isArray(it.tiers) || it.tiers.length < 2) return null;
  const base = Number(it.qty)||0;
  const next = it.tiers.find(t=> t.minQty > base);
  if(!next || !(Number(next.unitPrice) < Number(it.floorPrice)) || next.minQty > Math.max(base, 1) * 3) return null;
  const mult = lineMult(it);
  const display = mult > 1 && next.minQty % mult === 0 ? next.minQty / mult : null;
  return { baseQty: next.minQty, displayQty: display, unitPrice: Number(next.unitPrice) };
}
async function ensureLineTiers(it){
  if(Array.isArray(it.tiers) && it.tiers.length) return;
  try{
    const res = await callAgentFn('agent-catalog', { action:'price', productId: it.productId, variantIdx: it.variantIdx, qty: 1 });
    if(res && res.available && Array.isArray(res.tiers) && res.tiers.length){
      it.tiers = res.tiers.slice().sort((a,b)=> a.minQty - b.minQty);
      it.ourPrice = Number(res.ourPrice) || it.ourPrice || 0;
      setLineQty(it, it.displayQty != null ? it.displayQty : it.qty);
      if(currentView === 'order') renderCart();
    }
  }catch(_e){ /* the line keeps the price it was added at */ }
}

function earnChipHTML(margin, profit){
  if(margin.level === 'loss') return `<span class="ax-earn loss" title="${esc(margin.detail)}">${fmtSigned(profit)}</span>`;
  if(margin.level === 'none') return `<span class="ax-earn none" title="${esc(margin.detail)}">0</span>`;
  return `<span class="ax-earn">${fmtSigned(profit)}</span>`;
}
function renderCart(){
  const wrap = document.getElementById('ag_cartWrap');
  if(!wrap) return;
  if(openLineIdx >= cart.length) openLineIdx = -1;
  wrap.innerHTML = cart.map((it, i)=>{
    const f = cartLineFigures(it);
    const ce = catalogEntry(it.productId, it.variantIdx);
    const head = `<button type="button" class="ax-line-h" data-line="${i}" aria-expanded="${i===openLineIdx}">
        <span class="ax-th">${itemThumbHTML(ce || it)}</span>
        <span class="ax-line-b">
          <span class="ag-receipt-name nm" title="${esc(it.name)}">${esc(it.name)}${it.variantLabel ? ` · ${esc(it.variantLabel)}` : ''}</span>
          <span class="q">${esc(f.displayQty)} ${esc(f.displayUnit)} × ${fmtNum(f.rate)}</span>
        </span>
        <span data-chip="${i}">${earnChipHTML(f.margin, f.profit)}</span>
      </button>`;
    if(i !== openLineIdx) return `<div class="ax-line">${head}</div>`;
    const hint = nextTierHint(it);
    const mult = lineMult(it);
    const lastBase = lastRateFor(chosenClient, it.productId, it.variantIdx);
    const shopBase = Number(it.ourPrice || (ce && ce.ourPrice)) || 0;
    const sugs = [
      lastBase > 0 ? `<button type="button" class="ax-sug" data-sug="${Math.round(lastBase*mult)}">last <b>${fmtNum(lastBase*mult)}</b></button>` : '',
      shopBase > 0 && Math.round(shopBase) !== Math.round(lastBase) ? `<button type="button" class="ax-sug" data-sug="${Math.round(shopBase*mult)}">shop <b>${fmtNum(shopBase*mult)}</b></button>` : '',
    ].join('');
    return `<div class="ax-line open">${head}
      <div class="ax-line-row">
        <div class="ax-step">
          <button type="button" data-qty="-1" aria-label="Fewer">${AX_ICON.minus}</button>
          <input type="number" inputmode="decimal" min="0" step="any" value="${esc(f.displayQty)}" data-qty-in aria-label="Quantity">
          <span class="u">${esc(f.displayUnit)}</span>
          <button type="button" data-qty="1" aria-label="More">${AX_ICON.plus}</button>
        </div>
        ${hint ? `<button type="button" class="ax-cheaper" data-tier="${hint.baseQty}" aria-label="Make it ${hint.displayQty || hint.baseQty} for a cheaper price">${AX_ICON.down}<b>${hint.displayQty || hint.baseQty}</b> cheaper</button>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <label class="ax-price${f.margin.level==='loss'?' loss':''}">
          <span class="b"><span class="k">Your price, each ${esc(f.displayUnit)}</span>
            <input type="text" inputmode="numeric" class="ag-rate-input" data-rate value="${fmtNum(f.rate)}" aria-label="Your price for each ${esc(f.displayUnit)}"></span>
          <span data-chip-big>${earnChipHTML(f.margin, f.profit)}</span>
        </label>
        <div class="ax-sugs">${sugs}<button type="button" class="ax-iconbtn ax-del" data-del aria-label="Remove ${esc(it.name)}">${AX_ICON.trash}</button></div>
        <div data-flag>${cartMarginFlagHTML(f.margin)}</div>
      </div>
    </div>`;
  }).join('')
  + (cart.length >= 2 ? `<button type="button" class="ax-sug" data-bundle-save style="align-self:flex-start;">${AX_ICON.bundle}Save as a bundle</button>` : '')
  + (!cart.length ? `<div class="ax-empty">${AX_ICON.basket}<div>Nothing in this order yet.</div></div>` : '');
  renderDock();
}
document.getElementById('ag_cartWrap').addEventListener('click', (e)=>{
  const head = e.target.closest('[data-line]');
  if(head){
    const i = Number(head.dataset.line);
    openLineIdx = openLineIdx === i ? -1 : i;
    renderCart();
    if(openLineIdx >= 0) ensureLineTiers(cart[openLineIdx]);
    return;
  }
  if(e.target.closest('[data-bundle-save]')){ openSaveSolutionModal(); return; }
  const it = cart[openLineIdx];
  if(!it) return;
  const step = e.target.closest('[data-qty]');
  if(step){
    const cur = Number(it.displayQty != null ? it.displayQty : it.qty) || 0;
    setLineQty(it, Math.max(1, Math.round(cur) + Number(step.dataset.qty)));
    renderCart(); renderUsual();
    return;
  }
  const tier = e.target.closest('[data-tier]');
  if(tier){
    const base = Number(tier.dataset.tier);
    const mult = lineMult(it);
    if(mult > 1 && base % mult !== 0){
      // The rung does not land on whole packs, so the line moves to the
      // base unit rather than inventing a fraction of a carton.
      it.displayUnit = it.unit;
      setLineQty(it, base);
    } else {
      setLineQty(it, base / mult);
    }
    renderCart();
    return;
  }
  const sug = e.target.closest('[data-sug]');
  if(sug){
    it.agentSellPrice = Number(sug.dataset.sug) / lineMult(it);
    saveQuoteDraft();
    renderCart();
    return;
  }
  if(e.target.closest('[data-del]')){
    cart.splice(openLineIdx, 1);
    openLineIdx = -1;
    updateCartBadge();
    saveQuoteDraft();
    renderOrder();
  }
});
/* Typing a price updates the line's chip and the dock as you go, without
   redrawing the field under your thumb. It is committed when you leave
   the field. */
function parseMoney(v){ return Number(String(v||'').replace(/[^\d.]/g, '')); }
document.getElementById('ag_cartWrap').addEventListener('input', (e)=>{
  const it = cart[openLineIdx];
  if(!it) return;
  if(e.target.matches('[data-rate]')){
    const entered = parseMoney(e.target.value);
    if(!(entered >= 0)) return;
    const preview = Object.assign({}, it, { agentSellPrice: entered / lineMult(it) });
    const f = cartLineFigures(preview);
    const line = e.target.closest('.ax-line');
    line.querySelector('[data-chip-big]').innerHTML = earnChipHTML(f.margin, f.profit);
    line.querySelector(`[data-chip="${openLineIdx}"]`).innerHTML = earnChipHTML(f.margin, f.profit);
    line.querySelector('.ax-price').classList.toggle('loss', f.margin.level === 'loss');
    line.querySelector('[data-flag]').innerHTML = cartMarginFlagHTML(f.margin);
    renderDock(preview);
  }
});
document.getElementById('ag_cartWrap').addEventListener('change', (e)=>{
  const it = cart[openLineIdx];
  if(!it) return;
  if(e.target.matches('[data-rate]')){
    const entered = parseMoney(e.target.value);
    if(entered >= 0) it.agentSellPrice = entered / lineMult(it);
    saveQuoteDraft();
    renderCart();
  }
  if(e.target.matches('[data-qty-in]')){
    const v = Number(e.target.value);
    if(v > 0) setLineQty(it, v);
    renderCart(); renderUsual();
  }
});

/* ---- the dock ---- */
function cartTotals(preview){
  let total = 0, profit = 0;
  cart.forEach((it, i)=>{
    const f = cartLineFigures(preview && i === openLineIdx ? preview : it);
    total += f.amount; profit += f.profit;
  });
  return { total, profit };
}
function deliveryMode(){
  return document.getElementById('ag_delivery_shop').checked ? 'shop_delivery' : 'agent_pickup';
}
// What is stopping the send, in the words the slider says it. Null when
// nothing is.
function sendBlocker(){
  if(agentPaused) return 'Orders are paused';
  if(!cart.length) return 'Add an item to send';
  if(!chosenClient) return 'Pick a client to send';
  if(deliveryMode() === 'shop_delivery' && !document.getElementById('ag_delivery_address').value.trim()) return 'Add the address to send';
  return null;
}
function renderDock(preview){
  const t = cartTotals(preview);
  document.getElementById('ag_cartTotalValue').textContent = fmtNum(t.total);
  const e = document.getElementById('ag_cartProfitValue');
  e.textContent = cart.length ? `${fmtSigned(t.profit)} yours` : '';
  e.classList.toggle('loss', t.profit < 0);
  const shop = deliveryMode() === 'shop_delivery';
  document.getElementById('ag_delivery_pickup_label').classList.toggle('on', !shop);
  document.getElementById('ag_delivery_shop_label').classList.toggle('on', shop);
  document.getElementById('ag_deliveryAddressWrap').hidden = !shop;
  if(sendingOrder) return;
  const block = sendBlocker();
  const knob = document.getElementById('ag_submit_btn');
  knob.disabled = !!block;
  document.getElementById('ag_slideLabel').textContent = block
    || `Slide to send · ${cart.length} item${cart.length===1?'':'s'}`;
  resetSlide();
}
document.querySelectorAll('input[name="ag_delivery"]').forEach(r=>{

    saveQuoteDraft();

/* ---- slide to send ----
   A slide and not a tap, because a basket can be sent from a pocket by a
   tap and cannot be by a slide. A keyboard still presses it like any
   button. */
let sendingOrder = false;
function resetSlide(){
  const knob = document.getElementById('ag_submit_btn');
  knob.style.transition = 'transform .25s';
  knob.style.transform = '';
  knob.style.animation = '';
  const fill = document.getElementById('ag_slideFill');
  fill.style.transition = 'width .25s';
  fill.style.width = '';
}
(function wireSlide(){
  const slide = document.getElementById('ag_slide');
  const knob = document.getElementById('ag_submit_btn');
  const fill = document.getElementById('ag_slideFill');
  let startX = 0, dx = 0, max = 0, dragging = false, moved = false;
  knob.addEventListener('pointerdown', (e)=>{
    if(knob.disabled || sendingOrder) return;
    dragging = true; moved = false; dx = 0; startX = e.clientX;
    max = slide.clientWidth - knob.offsetWidth - 10;
    knob.style.transition = 'none'; fill.style.transition = 'none'; knob.style.animation = 'none';
    try{ knob.setPointerCapture(e.pointerId); }catch(_e){}
  });
  knob.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    dx = Math.max(0, Math.min(max, e.clientX - startX));
    if(dx > 6) moved = true;
    knob.style.transform = `translateX(${dx}px)`;
    fill.style.width = `${50 + dx}px`;
  });
  const end = ()=>{
    if(!dragging) return;
    dragging = false;
    if(max > 0 && dx >= max * 0.85){
      knob.style.transform = `translateX(${max}px)`;
      fill.style.width = `${50 + max}px`;
      submitOrder();
    } else {
      resetSlide();
      if(!moved) toast('Slide the red button across to send');
    }
  };
  knob.addEventListener('pointerup', end);
  knob.addEventListener('pointercancel', end);
  // detail is 0 only for a keyboard press, never for a finger.
  knob.addEventListener('click', (e)=>{ if(e.detail === 0) submitOrder(); });
})();

async function submitOrder(){
  if(sendingOrder) return;
  if(!chosenClient){ toast('Choose or add a client first'); resetSlide(); return; }
  if(!cart.length){ toast('Add at least one item'); resetSlide(); return; }
  const deliveryMode = document.getElementById('ag_delivery_shop').checked ? 'shop_delivery' : 'agent_pickup';
  const deliveryAddress = document.getElementById('ag_delivery_address').value.trim();
  if(deliveryMode==='shop_delivery' && !deliveryAddress){ toast('Enter a delivery address'); resetSlide(); return; }

  const btn = document.getElementById('ag_submit_btn');
  btn.disabled = true;
  sendingOrder = true;
  const label = document.getElementById('ag_slideLabel');
  if(label) label.textContent = 'Sending…';
  // What was sent, kept for the screen that follows -- the basket itself
  // is emptied the moment the server has the order.
  const sent = sentSnapshot();
  // Only the submit call itself decides whether the order was placed.
  // The refresh after it is a second round trip, and a phone dropping off
  // the network right after the POST must not be told the order failed.
  let res;
  try{
    res = await callAgentFn('agent-submit-order', {
      agentClientId: chosenClient.id,
      items: cart.map(it=>({ productId: it.productId, variantIdx: it.variantIdx, qty: it.qty, agentSellPrice: it.agentSellPrice })),
      deliveryMode,
      deliveryAddress: deliveryMode==='shop_delivery' ? deliveryAddress : undefined,
    });
  }catch(err){
    /* Not "try again" when it is the pause that refused it -- a paused
       account will refuse every retry. */
    toast(err.paused
      ? 'Your account is paused — the shop has to lift it before orders can go through'
      : isNetworkError(err) ? "You're offline -- this order needs a live price check, so it can't submit until you're back online"
      : `Could not submit order: ${err.message||err}`, err.paused ? 6000 : undefined);
    return;}finally{
    sendingOrder = false;
    btn.disabled = false;
    applyPausedToCart();
  }

  // The order exists from here on. The basket is cleared before the
  // reload, so the one thing that would invite a re-send cannot survive a
  // failure below.
  resetCartAfterSubmit();
  switchTab('today');
  showSent(sent, res && res.orderId);
  try{
    await loadAgentHomeData();
    renderCurrentView();
  }catch(err){
    toast("Order submitted -- couldn't refresh your orders just now. It's waiting for you on Today.", 5000);
  }
}

function resetCartAfterSubmit(){
  // Only THIS client's basket is finished. Anyone else the agent has an
  // order in progress for still has theirs, and so does the unnamed one.
  const k = cartKey(chosenClient);
  if(k) delete carts[k];
  chosenClient = null;
  activateCartFor(null);
  document.getElementById('ag_delivery_pickup').checked = true;
  document.getElementById('ag_delivery_address').value = '';
  openLineIdx = -1;
  updateCartBadge();
  saveQuoteDraft();
}

}

let findCategory = null, findSub = null, findFilter = { again:false, bonus:false, fresh:false }, findLimit = 40;
const unitChoice = new Map();

function openFindView(){

    ensureBrowseDataLoaded().then(()=>{ if(currentView === 'find'){ if(!findCategory) findCategory = defaultFindCategory(); renderFind(); } });
  } else if(!findCategory && !anyFindFilter()){
    findCategory = defaultFindCategory();
    renderFind();
  }
}
function anyFindFilter(){ return findFilter.again || findFilter.bonus || findFilter.fresh; }
// Open on the aisle this client buys from most, then the one you sell
// from most, so the first screen is usually the right one.
function defaultFindCategory(){
  if(!catalog.length) return null;
  const pick = (orders)=>{
    const by = new Map();
    orders.forEach(o=> (o.items||[]).forEach(li=>{
      const ce = catalogEntry(li.productId, li.variantIdx);
      if(ce) by.set(itemCategory(ce), (by.get(itemCategory(ce))||0) + 1);
    }));
    return [...by.entries()].sort((a,b)=> b[1]-a[1])[0];
  };
  const mine = chosenClient ? pick((clientOrderCounts().get(chosenClient.id)||[]).filter(o=>!o.voided)) : null;
  if(mine) return mine[0];
  const all = pick(myOrders.filter(o=>!o.voided));
  if(all) return all[0];
  return findCategories()[0] || null;
}
function findCategories(){
  const named = [...new Set(catalog.map(it=>(it.category||'').trim()).filter(Boolean))];
  const hasOther = catalog.some(it=>!(it.category||'').trim());
  return hasOther ? named.concat(AGENT_OTHER_CATEGORY) : named;
}
function boughtBeforeKeys(){
  const keys = new Set();
  myOrders.forEach(o=>{
    if(o.voided) return;
    if(chosenClient && String(o.agentClientId) !== String(chosenClient.id)) return;
    (o.items||[]).forEach(li=> keys.add(feedItemKey(li.productId, li.variantIdx)));
  });
  return keys;
}
function findItems(){
  const q = document.getElementById('ag_browse_search').value.trim().toLowerCase();
  let items = catalog.slice();
  if(q){
    // A search looks at the whole shop, whatever aisle you were in.
    items = items.filter(it=> `${it.name||''} ${it.variantLabel||''} ${it.category||''} ${it.subcategory||''}`.toLowerCase().includes(q));
  } else {
    if(findCategory) items = items.filter(it=> itemCategory(it) === findCategory);
    if(findCategory && findSub) items = items.filter(it=> it.subcategory === findSub);
  }
  if(findFilter.bonus){ const p = promotedMap(); items = items.filter(it=> p.has(feedItemKey(it.productId, it.variantIdx))); }
  if(findFilter.again){ const k = boughtBeforeKeys(); items = items.filter(it=> k.has(feedItemKey(it.productId, it.variantIdx))); }
  if(findFilter.fresh){ const cut = Date.now() - 30*86400000; items = items.filter(it=> it.createdAt && new Date(it.createdAt).getTime() >= cut); }
  return items;
}
function renderFind(){
  const q = document.getElementById('ag_browse_search').value.trim();
  document.getElementById('ag_browse_search').placeholder = catalog.length ? `Search ${fmtNum(catalog.length)} items` : 'Search items';

  const items = findItems();

  document.getElementById('ag_findCount').innerHTML = `<b>${groups.length}</b> ${esc(String(noun).toLowerCase())}`;

    <button type="button" data-flt="bonus" aria-pressed="${findFilter.bonus}" aria-label="Only items with a bonus" title="Bonus items">${AX_ICON.star}</button>`;
  const grid = document.getElementById('ag_browseGrid');
  if(!catalog.length){
    grid.innerHTML = browseDataLoaded ? '<div class="ax-more ax-empty">The shop has no items listed yet.</div>' : '<div class="ax-more"><div class="ag-spinner"></div></div>';
  } else if(!groups.length){
    grid.innerHTML = `<div class="ax-more ax-empty">${q ? 'Nothing matches that search.' : 'Nothing here with those filters.'}</div>`;
  } else {
    const promoted = promotedMap();
    const before = boughtBeforeKeys();
    grid.innerHTML = groups.slice(0, findLimit).map(g=> findTileHTML(g, promoted, before)).join('')
      + (groups.length > findLimit ? `<button type="button" class="btn btn-ghost ax-more" data-more>Show ${Math.min(40, groups.length - findLimit)} more</button>` : '');
  }
  renderFindDone();
}
function findTileHTML(group, promoted, before){
  const sel = selectedVariantFor(group);
  const key = feedItemKey(sel.productId, sel.variantIdx);
  const promo = promoted.get(key);
  const pq = Number(sel.packQty) || 0;
  const mode = pq > 0 && sel.packUnit ? (unitChoice.get(key) || 'pack') : 'unit';
  const mult = mode === 'pack' ? pq : 1;
  const unitLabel = mode === 'pack' ? sel.packUnit : (sel.unit || 'each');
  const floor = Number(sel.floorPrice) || 0, our = Number(sel.ourPrice) || 0;
  const price = (our > floor ? our : floor) * mult;
  const head = our > floor ? (our - floor) * mult : 0;
  const idx = lineFor(cart, sel.productId, sel.variantIdx);
  const line = idx >= 0 ? cart[idx] : null;
  const inCluster = promo && isInCluster(sel.productId, sel.variantIdx);
  const tag = line ? `<span class="ax-pt-tag in">${AX_ICON.check}In order</span>`
    : promo ? `<span class="ax-pt-tag bonus">${esc(bonusFlagLabel(promo))} each</span>`
    : before.has(key) && chosenClient ? `<span class="ax-pt-tag buys">${esc(clientInitials(chosenClient.name))} buys</span>` : '';
  const variants = group.variants.length > 1
    ? `<select class="ax-var" data-var="${esc(group.productId)}" aria-label="Which ${esc(group.name)}">${group.variants.map(v=>
        `<option value="${v.variantIdx==null?'':esc(v.variantIdx)}"${v===sel?' selected':''}>${esc(v.variantLabel || '—')}</option>`).join('')}</select>` : '';
  const busy = addingKeys.has(key);
  const bottom = line
    ? `<div class="ax-instep">
        <button type="button" data-find-step="-1" aria-label="Fewer">${AX_ICON.minus}</button>
        <b>${esc(line.displayQty != null ? line.displayQty : line.qty)}<span>${esc(line.displayUnit || line.unit || '')}</span></b>
        <button type="button" data-find-step="1" aria-label="More">${AX_ICON.plus}</button>
      </div>`
    : `<div class="ax-pt-a">
        ${pq > 0 && sel.packUnit
          ? `<div class="ax-useg" role="group" aria-label="Unit">
              <button type="button" data-unit="unit" aria-pressed="${mode==='unit'}">${esc(sel.unit || 'pc')}</button>
              <button type="button" data-unit="pack" aria-pressed="${mode==='pack'}">${esc(sel.packUnit)}</button>
            </div>`
          : `<div class="ax-useg one"><span>per ${esc(sel.unit || 'item')}</span></div>`}
        <button type="button" class="ax-add${busy?' busy':''}" data-add aria-label="Add ${esc(group.name)}">${busy ? '<span class="ag-spinner" style="width:18px;height:18px;border-width:2px;"></span>' : AX_ICON.plus}</button>
      </div>`;
  return `<div class="ax-pt${line ? ' in' : ''}" data-pid="${esc(sel.productId)}" data-vidx="${sel.variantIdx==null?'':esc(sel.variantIdx)}">
    <button type="button" class="ax-pt-im" data-img="${esc(sel.image||'')}" aria-label="${esc(group.name)}${sel.image ? ', view photo' : ''}">
      ${itemThumbHTML(sel)}${tag}
    </button>
    ${promo ? `<button type="button" class="ax-pt-star${inCluster?' on':''}" data-star aria-pressed="${!!inCluster}" aria-label="${inCluster ? 'In your cluster' : 'Star it to earn its bonus'}">${AX_ICON.star}</button>` : ''}
    <div class="ax-pt-b">
      <span class="ax-pt-n" title="${esc(group.name)}">${esc(group.name)}</span>
      ${variants}
      <span class="ax-pt-p"><span class="v">${fmtNum(price)}</span><span class="u">/${esc(String(unitLabel).toLowerCase())}</span>${head > 0 ? `<span class="e">+${fmtNum(head)}</span>` : ''}</span>
      ${bottom}
    </div>
  </div>`;
}
document.getElementById('ag_findView').addEventListener('click', async (e)=>{
  if(e.target.closest('#ag_findBack')){ switchTab('order'); return; }
  if(e.target.closest('#ag_findDone')){ switchTab('order'); return; }
  if(e.target.closest('#ag_catPill')){ openCategorySheet(); return; }
  const sub = e.target.closest('[data-sub]');
  if(sub){ findSub = findSub === sub.dataset.sub ? null : sub.dataset.sub; findLimit = 40; renderFind(); return; }
  const flt = e.target.closest('[data-flt]');
  if(flt){ findFilter[flt.dataset.flt] = !findFilter[flt.dataset.flt]; findLimit = 40; renderFind(); return; }
  if(e.target.closest('[data-more]')){ findLimit += 40; renderFind(); return; }
  const tile = e.target.closest('.ax-pt');
  if(!tile) return;
  const item = catalogEntry(tile.dataset.pid, tile.dataset.vidx === '' ? null : Number(tile.dataset.vidx));
  if(!item) return;
  const key = feedItemKey(item.productId, item.variantIdx);
  if(e.target.closest('[data-star]')){ await toggleClusterMembership(item.productId, item.variantIdx); return; }
  const unit = e.target.closest('[data-unit]');
  if(unit){ unitChoice.set(key, unit.dataset.unit); renderFind(); return; }
  if(e.target.closest('[data-add]')){
    const pq = Number(item.packQty) || 0;
    const mode = pq > 0 && item.packUnit ? (unitChoice.get(key) || 'pack') : 'unit';
    await addCatalogLine(item, { unit: mode, displayQty: 1 });
    return;
  }
  const step = e.target.closest('[data-find-step]');
  if(step){
    const idx = lineFor(cart, item.productId, item.variantIdx);
    if(idx < 0) return;
    const it = cart[idx];
    const next = Math.round(Number(it.displayQty != null ? it.displayQty : it.qty) || 0) + Number(step.dataset.findStep);
    if(next <= 0){ cart.splice(idx, 1); if(openLineIdx === idx) openLineIdx = -1; updateCartBadge(); saveQuoteDraft(); }
    else setLineQty(it, next);
    renderFind();
    return;
  }
  const img = e.target.closest('[data-img]');
  if(img && img.dataset.img){ openImageLightbox(img.dataset.img); }
});

async function loadSolutionIntoCart(tpl){
  const lineItems = Array.isArray(tpl.line_items) ? tpl.line_items : [];
  if(!lineItems.length){ toast('This bundle has no items'); return; }
  toast('Adding items…');
  let added = 0;
  for(const li of lineItems){
    const it = catalogEntry(li.productId, li.variantIdx==null ? null : Number(li.variantIdx));
    if(!it) continue;
    const line = await addCatalogLine(it, { unit:'unit', displayQty: Number(li.qty)||1, quiet:true });
    if(line) added++;
  }
  toast(added ? `Added ${added} item${added===1?'':'s'}` : 'Could not add this bundle — its items may no longer be listed');
  switchTab('order');

    if(saveBtn.disabled) return;
    const name = document.getElementById('ag_solution_name').value.trim();
    if(!name){ toast('Enter a name'); return; }
    saveBtn.disabled = true;
    try{
      const line_items = cart.map(it=>({ productId: it.productId, variantIdx: it.variantIdx, qty: it.qty }));
      const { data, error } = await sb.from('solution_templates')
        .insert({ shop_id: currentShopId, agent_id: myAgent.id, name, line_items }).select().single();
      if(error) throw error;
      solutionTemplates.unshift(data);
      sheet.close();
      toast('Bundle saved');
    }catch(err){
      saveBtn.disabled = false;
      toast(`Could not save: ${err.message||err}`);
    }
  });
}

/* ================= TRACK =================
   One order: where it is on six steps, what the client gets (each line
   ticked once the shop confirms it, crossed out if the shop could not
   supply it), the money as it now stands, and the one thing to do. */
function openTrackSheet(orderId){
  const id = String(orderId);
  let payState = { provider: 'mtn', phone: (myAgent && myAgent.phone) || '', busy:false, note:null, tone:'' };
  const sheet = openSheet('', { label:'Order', kind:'track', full:true, refresh: ()=> paint(), onClose: ()=>{ payState.polling = false; } });
  function paint(){
    const o = myOrders.find(x=> String(x.id) === id);
    if(!o){ sheet.close(); return; }
    const c = agentClients.find(x=> String(x.id) === String(o.agentClientId)) || { id: o.agentClientId, name: 'Client' };
    const st = orderStage(o);
    const steps = orderSteps(o);
    const at = orderStepIndex(o, st);
    const checked = orderShopChecked(o);
    const dropped = Array.isArray(o.droppedLines) ? o.droppedLines : [];
    const total = orderTotal(o);
    const droppedTotal = dropped.reduce((s,d)=> s + (Number(d.agentSellPrice)||0) * (Number(d.qty)||0), 0);
    const e = orderEarnings(o);
    const yours = e.margin + (o.status === 'completed' ? e.bonus : 0);
    const droppedYours = dropped.reduce((s,d)=> agentLinePriced(d) ? s + (Number(d.agentSellPrice) - (Number(d.sellPrice)||0)) * (Number(d.qty)||0) : s, 0);
    const prog = at < 0 ? 0 : Math.min(1, at / (steps.length - 1));
    const track = `<div class="ax-track" aria-label="${esc(st.title)}">
      <div class="ax-track-r"><span class="bar" style="width:${(prog * 84).toFixed(1)}%;"></span>${steps.map((s,i)=>{
        const cls = i < at || at >= steps.length ? 'done' : i === at ? `now${st.tone === 'warn' ? ' warn' : ''}` : '';
        return `<span class="ax-st ${cls}"><i>${i < at || at >= steps.length ? AX_ICON.check : AX_ICON[s.icon]}</i><em>${i === at ? 'now' : ''}</em></span>`;
      }).join('')}</div>
      <div class="ax-track-l">${steps.map((s,i)=> `<span class="${i===at?'on':''}">${esc(s.label)}</span>`).join('')}</div>
    </div>`;
    const lineRow = (it, mark)=>{
      const qty = it.displayQty != null ? `${it.displayQty} ${it.displayUnit||''}` : `${fmtNum(it.qty)} ${it.unit||''}`;
      const amt = (Number(it.agentSellPrice)||0) * (Number(it.qty)||0);
      const ce = catalogEntry(it.productId, it.variantIdx);
      const markHTML = mark === 'ok' ? `<span class="ax-mk ok" aria-label="Confirmed">${AX_ICON.check}</span>`
        : mark === 'no' ? `<span class="ax-mk no" aria-label="Dropped by the shop">${AX_ICON.x}</span>`
        : `<span class="ax-mk wait" aria-label="Not checked yet"></span>`;
      return `<div class="ax-gl${mark === 'no' ? ' gone' : ''}"><span class="ax-th">${itemThumbHTML(ce || it)}</span>
        <span class="b"><span class="nm">${esc(it.productName || it.name || '')}${ce && ce.variantLabel ? ` · ${esc(ce.variantLabel)}` : ''}</span><span class="q">${esc(String(qty).trim())} · ${fmtNum(amt)}</span></span>${markHTML}</div>`;
    };
    const keptN = (o.items||[]).length, dropN = dropped.length;
    const counts = checked
      ? `<span class="cnt"><span class="ax-pill good">${AX_ICON.check}${keptN}</span>${dropN ? `<span class="ax-pill bad">${AX_ICON.x}${dropN}</span>` : ''}</span>`
      : `<span class="ax-pill soft">${AX_ICON.clock}being checked</span>`;
    const ready = st.key === 'ready' ? `<div class="ax-counter">${AX_ICON.store}<span class="b"><span class="k">Show at the counter</span><span class="v">#${esc(o.id)}</span></span></div>` : '';
    const owed = orderOwedAmount(o);
    const pay = st.needs === 'pay' ? payPanelHTML(owed, payState) : '';
    sheet.el.innerHTML = `
      <div class="ax-sheet-top">
        <button type="button" class="ax-grab" data-close aria-label="Close"></button>
        <div class="ax-sheet-h">${avHTML(c)}<span class="b"><span class="n">${esc(c.name)}</span><span class="s">#${esc(o.id)} · ${esc(dateShort(orderDate(o)))}${o.deliveryMode === 'shop_delivery' ? ' · delivery' : ' · pickup'}</span></span>
          <button type="button" class="ax-iconbtn on-navy" data-close aria-label="Close">${AX_ICON.x}</button></div>
        <div class="ax-state"><span class="ax-state-ic${st.tone === 'warn' ? ' warn' : ''}">${AX_ICON[st.key === 'pay' || st.key === 'settle' ? 'cash' : st.key === 'ready' ? 'store' : st.key === 'out' ? 'truck' : st.key === 'done' ? 'flag' : st.key === 'checking' ? 'clock' : 'box']}</span>
          <span class="b"><span class="t">${esc(st.title)}</span><span class="s">${esc(st.sub)}</span></span></div>
        ${st.key !== 'cancelled' ? track : ''}
      </div>
      <div class="ax-sheet-pad">
        ${ready}
        ${pay}
        <div class="ax-money">
          <div><span class="k">Client pays</span><span class="v">${fmtNum(total)}</span>${droppedTotal > 0 ? `<s>${fmtNum(total + droppedTotal)}</s>` : ''}</div>
          <div><span class="k">${checked ? 'Yours' : 'Yours, if all confirmed'}</span><span class="v ${yours < 0 ? 'bad' : 'good'}">${fmtSigned(yours)}</span>${droppedYours > 0 ? `<s>${fmtSigned(yours + droppedYours)}</s>` : ''}</div>
        </div>
        <div class="ax-card ax-gets">
          <div class="ax-gets-h"><span>What the client gets</span>${counts}</div>
          ${(o.items||[]).map(it=> lineRow(it, checked ? 'ok' : 'wait')).join('')}
          ${dropped.map(d=> lineRow(d, 'no')).join('')}
        </div>
        <div class="ax-acts">
          <a class="ax-act" ${c.phone ? `href="tel:${esc(c.phone)}"` : 'aria-disabled="true"'} aria-label="Call ${esc(c.name)}">${AX_ICON.phone}Call</a>
          <button type="button" class="ax-act" data-update>${AX_ICON.chat}Update</button>
          <button type="button" class="ax-act" data-receipt>${AX_ICON.receipt}Receipt</button>
        </div>
      </div>`;
  }
  sheet.el.addEventListener('click', async (e)=>{
    const o = myOrders.find(x=> String(x.id) === id);
    if(!o) return;
    const c = agentClients.find(x=> String(x.id) === String(o.agentClientId)) || { name:'Client' };
    if(e.target.closest('[data-update]')){ sendClientUpdate(o, c); return; }
    if(e.target.closest('[data-receipt]')){ shareReceipt(orderReceiptRows(o), c.name); return; }
    const prov = e.target.closest('[data-prov]');
    if(prov){ payState.provider = prov.dataset.prov; payState.note = null; paint(); return; }
    if(e.target.closest('[data-pay]')) payOrder(o, payState, paint);
  });
  sheet.el.addEventListener('input', (e)=>{ if(e.target.matches('[data-pay-phone]')) payState.phone = e.target.value; });
  paint();
  ensureOrderStaffNamesLoaded().then(()=>{ if(sheet.el.isConnected) paint(); });
  return sheet;
}
function payPanelHTML(owed, ps){

  return `<div class="ax-card ax-pay" style="padding:12px;">
    <div class="ax-prov" role="group" aria-label="How you pay">
      <button type="button" data-prov="mtn" aria-pressed="${ps.provider==='mtn'}"><span class="dot mtn"></span>MTN</button>
      <button type="button" data-prov="airtel" aria-pressed="${ps.provider==='airtel'}"><span class="dot airtel"></span>Airtel</button>

    </div>

    <div class="ax-paynote${ps.tone ? ' ' + ps.tone : ''}"${ps.note || cash ? '' : ' hidden'}>${ps.note ? ps.note : `${AX_ICON.store}<span>Hand <b class="m">${fmtNum(owed)}</b> to the shop. They mark it paid and packing starts.</span>`}</div>
    ${cash ? '' : `<button type="button" class="btn btn-accent btn-block ax-paybtn" data-pay${ps.busy ? ' disabled' : ''}>${ps.busy ? 'Waiting for approval…' : `Pay <span class="m">${fmtNum(owed)}</span>`}</button>`}
  </div>`;

/* A real MTN/Airtel "request to pay" on the agent's own phone, then a
   short poll until it is approved, refused or times out. */
async function payOrder(order, ps, paint){
  if(ps.busy) return;
  const phone = String(ps.phone||'').trim();
  if(!phone){ toast('Enter the phone number to pay from'); return; }
  ps.busy = true; ps.tone = ''; ps.note = `${AX_ICON.clock}<span>Sending the payment request…</span>`;
  paint();
  try{
    const res = await callAgentFn('agent-initiate-momo-payment', { orderId: order.id, provider: ps.provider, phone });
    ps.note = `${AX_ICON.phone}<span>Check your phone and approve the payment.</span>`;
    paint();
    ps.polling = true;
    pollMomo(res.paymentId, 30, ps, paint);
  }catch(err){
    ps.busy = false; ps.tone = 'bad';
    ps.note = `<span>Could not send the request: ${esc(err.message||err)}</span>`;
    paint();
  }
}
async function pollMomo(paymentId, attemptsLeft, ps, paint){
  if(!ps.polling) return;
  try{
    const res = await callAgentFn('check-momo-payment-status', { paymentId });
    if(res.status === 'successful'){
      ps.polling = false; ps.busy = false; ps.tone = 'good';
      ps.note = `${AX_ICON.check}<span>Payment received</span>`;
      paint();
      await loadAgentHomeData();
      renderCurrentView();
      return;
    }
    if(res.status === 'failed' || res.status === 'cancelled'){
      ps.polling = false; ps.busy = false; ps.tone = 'bad';
      ps.note = `<span>Payment ${esc(res.status)}. You can try again.</span>`;
      paint();
      return;
    }
  }catch(_e){ /* a flaky connection while polling -- keep trying */ }
  if(attemptsLeft <= 0){
    ps.polling = false; ps.busy = false; ps.tone = '';
    ps.note = `<span>Still waiting. If you approved it, it can take a moment — tap Pay to check again.</span>`;
    paint();
    return;
  }
  setTimeout(()=> pollMomo(paymentId, attemptsLeft - 1, ps, paint), 3000);
}
// A WhatsApp message to the client saying where their order is, in the
// words they would use.
function sendClientUpdate(o, c){
  const st = orderStage(o);
  const said = { checking:'is being checked at the shop', pay:'is confirmed', queued:'is confirmed', packing:'is being packed',
    ready:'is packed and ready', out:'is on its way to you', done:'has been delivered', settle:'has been delivered', cancelled:'was cancelled' }[st.key] || 'is with the shop';
  const n = (o.items||[]).length;

function orderReceiptRows(o){
  return (o.items||[]).map(it=>{
    const amount = (Number(it.agentSellPrice)||0) * (Number(it.qty)||0);
    const dq = it.displayQty != null ? it.displayQty : Number(it.qty)||0;
    return { qty: `${dq} ${it.displayUnit || it.unit || ''}`.trim(), name: it.productName || it.name || '', variant: it.variantLabel || '',
      rate: dq > 0 ? amount / dq : 0, amount };
  });

/* ---- the receipt the client sees ----
   Drawn on a canvas from the rows alone -- never from the screen -- so
   what the shop charges you has no path onto it. A PNG, because that is
   what goes into WhatsApp. */
function drawReceiptCanvas(rows, clientName){
  const rowH = 40, headerH = 122, footerH = 90;
  const w = 640, h = headerH + rows.length*rowH + 70 + footerH;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const sans = (wt, px)=> `${wt} ${px}px Figtree, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif`;
  const mono = (wt, px)=> `${wt} ${px}px 'IBM Plex Mono', ui-monospace, monospace`;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#16203C'; ctx.fillRect(0,0,w,8);
  ctx.fillStyle = '#1C2233'; ctx.font = sans(700, 22);
  ctx.fillText(myAgent.name || 'Omni-Ware', 32, 52);
  ctx.fillStyle = '#5F6980'; ctx.font = sans(600, 13);
  ctx.fillText('Quotation', 32, 72);
  ctx.textAlign = 'right';
  ctx.fillText(new Date().toLocaleDateString('en-UG', { day:'numeric', month:'short', year:'numeric' }), w-32, 52);
  ctx.fillText(`For: ${clientName || 'Client'}`, w-32, 72);
  ctx.textAlign = 'left';
  ctx.strokeStyle = '#E6E3DD'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(32,92); ctx.lineTo(w-32,92); ctx.stroke();
  let y = 122;
  ctx.fillStyle = '#6B7480'; ctx.font = sans(700, 11);
  ctx.fillText('QTY', 32, y); ctx.fillText('ITEM', 120, y);
  ctx.textAlign = 'right'; ctx.fillText('RATE', w-190, y); ctx.fillText('AMOUNT', w-32, y); ctx.textAlign = 'left';
  y += 14;
  ctx.beginPath(); ctx.moveTo(32,y); ctx.lineTo(w-32,y); ctx.stroke();
  let total = 0;
  rows.forEach(r=>{
    total += r.amount;
    y += rowH;
    ctx.fillStyle = '#1C2233'; ctx.font = mono(600, 13);
    ctx.fillText(r.qty, 32, y);
    ctx.font = sans(700, 13.5);
    ctx.fillText(r.name.length > 34 ? r.name.slice(0, 33) + '…' : r.name, 120, y);
    if(r.variant){ ctx.font = sans(500, 11.5); ctx.fillStyle = '#5F6980'; ctx.fillText(r.variant, 120, y+16); }
    ctx.fillStyle = '#1C2233'; ctx.font = mono(600, 13);
    ctx.textAlign = 'right'; ctx.fillText(fmtAmount(r.rate), w-190, y); ctx.fillText(fmtAmount(r.amount), w-32, y); ctx.textAlign = 'left';
    ctx.strokeStyle = '#EFECE6';
    ctx.beginPath(); ctx.moveTo(32,y+22); ctx.lineTo(w-32,y+22); ctx.stroke();
  });
  y += 50;
  ctx.strokeStyle = '#1C2233'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(32,y); ctx.lineTo(w-32,y); ctx.stroke();
  y += 30;
  ctx.fillStyle = '#1C2233'; ctx.font = sans(700, 14); ctx.fillText('TOTAL', 32, y);
  ctx.textAlign = 'right'; ctx.font = mono(600, 18); ctx.fillText('UGX ' + fmtAmount(total), w-32, y); ctx.textAlign = 'left';
  y += 44;
  ctx.fillStyle = '#6B7480'; ctx.font = sans(500, 11.5);
  ctx.fillText('Thank you for your business.', 32, y);
  return canvas;
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}
function shareReceipt(rows, clientName){
  if(!rows || !rows.length) return;
  const canvas = drawReceiptCanvas(rows, clientName);
  const filename = `quote-${String(clientName||'client').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'client'}.png`;
  canvas.toBlob(async blob=>{
    const file = new File([blob], filename, { type: 'image/png' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{ await navigator.share({ files: [file], title: 'Quotation', text: `Here is your quote, ${clientName}` }); return; }
      catch(err){ if(err && err.name === 'AbortError') return; }
    }
    downloadBlob(blob, filename);
    toast('Receipt downloaded');
  }, 'image/png');
}

/* ================= CLIENTS ================= */
let clientFilter = 'all';
/* Where a client stands, as one coloured line and a ring: late, due,
   an order on the way, or how long until they are due. */
function clientStatus(c, counts, today, liveBy){
  const live = liveBy.get(String(c.id));
  const orders = (counts.get(c.id)||[]).filter(o=> !o.voided);
  const cad = clientCadence(c, counts, today);
  if(live){
    const st = orderStage(live);
    const words = { checking:'Shop is checking', pay:'Waiting for your payment', queued:'Confirmed', packing:'Being packed',
      ready:'Ready to collect', out:'On the way', settle:'Settle with the shop' }[st.key] || st.title;
    return { rank: 2, cls: st.needs ? 'late' : 'live', text: words, icon: AX_ICON[st.needs === 'pay' ? 'cash' : st.key === 'out' ? 'truck' : st.key === 'ready' ? 'store' : 'box'], frac: 0, tone:'' };
  }
  if(!orders.length) return { rank: 5, cls:'', text:'New', frac: 0, tone:'' };
  if(!cad) return { rank: 4, cls:'', text:`Ordered ${daysAgoLabel(clientStats(orders).lastAt).toLowerCase()}`, frac: 0, tone:'' };
  const gap = lateBy(cad);
  const frac = cad.daysSince / Math.max(1, cad.avgGapDays);
  if(cad.daysSince >= 60) return { rank: 6, cls:'', text:`Quiet · ${Math.round(cad.daysSince)} days`, frac: 1, tone:'', quiet:true };
  if(gap > 0) return { rank: 0, cls:'late', text:`${gap} day${gap===1?'':'s'} late`, frac: 1, tone:'late', late: gap, due:true };
  if(gap === 0) return { rank: 1, cls:'due', text:'Due today', frac: 1, tone:'due', due:true };
  return { rank: 3, cls:'', text:`in ${-gap} day${gap===-1?'':'s'}`, frac, tone: frac >= 0.8 ? 'due' : '', soon: -gap };
}
function renderClientsListScreen(){

  const dueN = all.filter(x=> x.s.due).length, quietN = all.filter(x=> x.s.quiet).length;

    + ((myInquiries||[]).length ? chip('asked', `${AX_ICON.chat}Asked${askedN ? ` <b>${askedN}</b>` : ''}`) : '')
    + (quietN ? chip('quiet', `<span class="dot q"></span>Quiet <b>${quietN}</b>`) : '');
  renderInquiries();

  const wrap = document.getElementById('ag_clientsListWrap');
  const q = document.getElementById('ag_clientListSearch').value.trim().toLowerCase();
  if(clientFilter === 'asked'){ wrap.innerHTML = ''; return; }
  let rows = all.filter(x=> clientMatchesQuery(x.c, q));
  if(clientFilter === 'due') rows = rows.filter(x=> x.s.due);
  if(clientFilter === 'quiet') rows = rows.filter(x=> x.s.quiet);
  rows.sort((a,b)=> a.s.rank - b.s.rank || (b.s.late||0) - (a.s.late||0) || (a.s.soon||0) - (b.s.soon||0)
    || String(b.stats.lastAt||'').localeCompare(String(a.stats.lastAt||'')) || String(a.c.name||'').localeCompare(String(b.c.name||'')));
  const add = q && !agentClients.some(c=> String(c.name||'').trim().toLowerCase() === q)
    ? `<button type="button" class="ax-cr add" data-client-add><span class="ax-av">${AX_ICON.plus}</span><span class="b"><span class="nm">Add &ldquo;${esc(document.getElementById('ag_clientListSearch').value.trim())}&rdquo;</span><span class="st">New client</span></span></button>` : '';
  if(!agentClients.length){
    wrap.innerHTML = `<button type="button" class="ax-cr add" data-client-add><span class="ax-av">${AX_ICON.plus}</span><span class="b"><span class="nm">Add your first client</span><span class="st">Name and phone</span></span></button>`;
    return;
  }
  wrap.innerHTML = add + rows.map(({ c, s, stats })=>
    `<button type="button" class="ax-cr" data-client-open="${esc(c.id)}">
      ${ringAvHTML(c, s.frac, s.tone)}
      <span class="b"><span class="nm" title="${esc(c.name)}">${esc(c.name)}</span><span class="st ${s.cls}">${s.icon || ''}${esc(s.text)}</span></span>
      ${stats.earned > 0 ? `<span class="v">${esc(fmtCompactUGX(stats.earned))}</span>` : ''}
    </button>`).join('') + (!rows.length && !add ? `<div class="ax-empty">No client matches &ldquo;${esc(q)}&rdquo;.</div>` : '');
}
