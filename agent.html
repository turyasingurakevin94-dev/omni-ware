  .ag-spinner{width:28px;height:28px;border-radius:999px;border:3px solid var(--line);border-top-color:var(--accent);animation:ag-spin .8s linear infinite;margin:0 auto;}
  @keyframes ag-spin{to{transform:rotate(360deg)}}
  /* ---- it drops in ---- */
  .ax-fly{position:fixed;z-index:95;width:56px;height:56px;box-sizing:border-box;border-radius:12px;background:#fff;border:2px solid var(--navy);
    box-shadow:0 10px 24px rgba(22,32,60,.3);overflow:hidden;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--ink-soft);will-change:transform;}
  .ax-fly img{width:100%;height:100%;object-fit:cover;}
  .ax-fly .icon,.ax-fly svg{width:26px;height:26px;}
  @keyframes axBump{0%{transform:scale(1)}25%{transform:scale(1.06,1.18)}50%{transform:scale(.97,.93)}70%{transform:scale(1.02,1.04)}85%{transform:scale(.995)}100%{transform:scale(1)}}
  @keyframes axPlus1{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:translateY(0)}70%{opacity:1;transform:translateY(-4px)}100%{opacity:0;transform:translateY(-12px)}}
  .ax-bump{animation:axBump .8s ease-out;transform-origin:50% 100%;}
  .ax-sum{position:relative;}
  .ax-plus1{position:absolute;top:-14px;left:36px;height:24px;padding:0 9px;border-radius:999px;background:var(--mint);color:var(--navy);
    font-family:var(--font-money);font-size:12px;font-weight:600;display:flex;align-items:center;pointer-events:none;animation:axPlus1 1.9s ease-out forwards;}
  .ax-sum .ax-plus1{left:auto;right:0;top:-22px;}
  @media (prefers-reduced-motion: reduce){ .ag-spinner{animation:none;} }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }

  .ag-lightbox{position:fixed;inset:0;z-index:90;background:rgba(10,14,26,.92);display:flex;align-items:center;justify-content:center;padding:20px;}
  .ag-lightbox img{max-width:100%;max-height:100%;border-radius:12px;}

  .toast{
    position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%) translateY(-16px) scale(.96);z-index:100;
    max-width:calc(100% - 32px);width:max-content;box-sizing:border-box;display:flex;align-items:center;gap:10px;
    min-height:44px;padding:8px 18px 8px 8px;border-radius:24px;font-size:14px;font-weight:600;line-height:1.3;
    background:var(--navy);color:#fff;box-shadow:0 10px 28px rgba(22,32,60,.25);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
  .toast .ic{width:28px;height:28px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--mint);color:var(--navy);}
  .toast .ic .icon{width:15px;height:15px;stroke-width:3;}
  .toast.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid #F3D3B0;font-weight:700;box-shadow:0 10px 28px rgba(149,83,12,.18);}
  .toast.warn .ic{background:var(--warn);color:#fff;}
  .toast.warn .ic .icon{stroke-width:2.4;}
  .toast.bad{
    top:auto;bottom:calc(110px + var(--safe-b));transform:translateX(-50%) translateY(16px) scale(.96);width:calc(100% - 24px);max-width:496px;
    padding:12px 8px 12px 14px;border-radius:20px;background:var(--panel);color:var(--ink);border:1.5px solid #E8B4AE;box-shadow:0 10px 28px rgba(142,42,34,.16);
  }
  .toast.bad.show{transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto;}
  .toast.bad .ic{width:36px;height:36px;background:var(--bad);color:#fff;}
  .toast.bad .ic .icon{width:18px;height:18px;stroke-width:2.8;}
  .toast.bad .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .toast.bad .b b{font-size:14px;font-weight:700;color:var(--bad);}
  .toast.bad .b span{font-size:13px;font-weight:500;color:var(--ink-soft);}
  .toast.bad .act{all:unset;box-sizing:border-box;cursor:pointer;height:40px;padding:0 14px;border-radius:12px;background:var(--bad);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;}
  .toast.bad .x{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
  .toast.bad .x .icon{width:16px;height:16px;stroke-width:2.2;}

  /* ================= THE TRACK, AS DRAWN =================
     The six steps as named tiles with the time each was reached; the
     order's state as one big lit tile; each line ticked as its supplier
     answers. */
  .ax-state{gap:14px;}
  .ax-state-ic{width:56px;height:56px;border-radius:18px;}
  .ax-state-ic .icon{width:28px;height:28px;stroke-width:1.9;}
  .ax-state-ic.now{background:var(--mint);color:var(--navy);animation:axGlow 2s infinite;}
  .ax-state-ic.warn{background:#F5B26B;color:var(--navy);animation:axGlowW 2s infinite;}
  .ax-state-ic.done{background:#fff;color:var(--navy);}
  .ax-state-ic.off{background:rgba(255,255,255,.1);color:var(--on-navy);}
  .ax-state .t{font-size:28px;line-height:1;letter-spacing:-.02em;}
  .ax-state .s{font-weight:600;}
  @keyframes axGlow{0%{box-shadow:0 0 0 0 rgba(111,220,176,.55)}70%{box-shadow:0 0 0 9px rgba(111,220,176,0)}100%{box-shadow:0 0 0 0 rgba(111,220,176,0)}}
  @keyframes axGlowW{0%{box-shadow:0 0 0 0 rgba(245,178,107,.55)}70%{box-shadow:0 0 0 9px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
  .ax-steps{display:flex;flex-direction:column;gap:7px;}
  .ax-steps .r,.ax-steps .l{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;}
  .ax-stp{height:52px;border-radius:12px;box-sizing:border-box;border:1.5px solid rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8D99B5;}
  .ax-stp .icon{width:16px;height:16px;stroke-width:2;}
  .ax-stp em{font-style:normal;font-size:11px;font-weight:700;line-height:1;display:flex;}
  .ax-stp em .icon{width:11px;height:11px;stroke-width:3;}
  .ax-stp.done{border:none;background:rgba(255,255,255,.14);color:#fff;}
  .ax-stp.done em.m{font-family:var(--font-money);font-weight:500;font-variant-numeric:tabular-nums;}
  .ax-stp.now{border:none;background:var(--mint);color:var(--navy);}
  .ax-stp.now.warn{background:#F5B26B;}
  .ax-steps .l{font-size:11px;font-weight:600;text-align:center;color:#8D99B5;}
  .ax-steps .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-steps .l .done{color:var(--on-navy);}
  .ax-steps .l .on{color:var(--mint);font-weight:700;}
  .ax-steps .l .on.warn{color:#F5B26B;}
  .ax-sheet-h .s.m{font-family:var(--font-money);font-size:12px;}
  .ax-shopbtn{all:unset;box-sizing:border-box;cursor:pointer;flex:none;height:40px;padding:0 12px 0 10px;border-radius:999px;background:rgba(111,220,176,.14);color:var(--mint);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;}
  .ax-shopbtn .icon{width:16px;height:16px;}
  .ax-money{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:none;border:none;border-radius:0;overflow:visible;}
  .ax-money > div{border:1px solid var(--line);border-radius:16px;}
  .ax-money > div.maybe{border:1.5px dashed var(--good);}
  .ax-money > div.maybe .k{color:var(--good);}
  .ax-money > div.yours{background:var(--good-bg);border-color:transparent;}
  .ax-money > div.yours .k{color:var(--good);}
  .ax-money .k{font-size:12px;color:var(--ink-soft);}
  .ax-pill.sm{height:24px;padding:0 8px;font-size:12px;gap:4px;}
  .ax-pill.sm .icon{width:11px;height:11px;stroke-width:3.2;}
  details.ax-gets{padding:2px 14px;}
  details.ax-gets > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:52px;}
  details.ax-gets > summary::-webkit-details-marker{display:none;}
  details.ax-gets > summary .h{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--ink-soft);}
  details.ax-gets > summary .cnt{display:flex;gap:5px;}
  details.ax-gets[open] > summary{border-bottom:1px solid var(--line);}
  details.ax-gets[open] > summary .ax-stack,details.ax-gets[open] > summary .shut,details.ax-gets:not([open]) > summary .opn{display:none;}
  details.ax-gets .ax-gl:first-of-type{border-top:none;}
  .ax-stack.sq span{width:30px;height:30px;border-radius:9px;}
  .ax-stack span.gone{opacity:.5;}
  .ax-chev{width:28px;height:28px;flex:none;border-radius:999px;background:var(--tile);display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .ax-chev .icon{width:14px;height:14px;stroke-width:2.4;transition:transform .2s;}
  details[open] > summary .ax-chev .icon{transform:rotate(180deg);}
  .ax-gl .t{font-size:11px;font-weight:700;color:var(--ink-faint);flex:none;}
  .ax-gl .t.m{font-family:var(--font-money);font-weight:500;}
  .ax-gl .t.warn{color:var(--warn-ink);}
  .ax-mk.spin{border:2.5px solid #F5B26B;border-top-color:transparent;animation:axSpin 1s linear infinite;box-sizing:border-box;}
  .ax-mk.prob{background:var(--warn-bg);color:var(--warn-ink);}
  .ax-mk.no{background:var(--bad);color:#fff;}
  @keyframes axSpin{to{transform:rotate(360deg)}}
  .ax-lock{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--dash);}
  .ax-lock .ic{width:36px;height:36px;flex:none;border-radius:10px;background:var(--tile);color:var(--ink-faint);display:flex;align-items:center;justify-content:center;}
  .ax-lock .ic .icon{width:18px;height:18px;}
  .ax-lock .b{flex:1;display:flex;flex-direction:column;gap:1px;}
  .ax-lock .t{font-size:14px;font-weight:700;color:var(--ink-soft);}
  .ax-lock .s{font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ax-counter{background:var(--panel);border:2px solid var(--good);color:var(--ink);gap:12px;padding:12px 14px;}
  .ax-counter .ic{width:44px;height:44px;flex:none;border-radius:12px;background:var(--good-bg);color:var(--good);display:flex;align-items:center;justify-content:center;}
  .ax-counter .ic .icon{width:22px;height:22px;}
  .ax-counter .k{color:var(--good);}
  .ax-counter .v{font-size:26px;letter-spacing:.04em;line-height:1;}
  .ax-counter .w{font-size:12px;font-weight:600;color:var(--ink-soft);text-align:right;}
  .ax-foot{display:flex;flex-direction:column;gap:8px;}
  .ax-sheet.full .ax-foot{margin-top:auto;}
  .ax-sheet.full .ax-foot .ax-acts{margin-top:0;}
  .ax-finish{background:var(--navy);color:#fff;height:56px;font-size:16px;}
  .ax-finish .icon{color:var(--mint);width:20px;height:20px;stroke-width:2.6;}

  /* The six steps, small, on a light card. */
  .ax-dots6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:4px 0 2px;}
  .ax-dots6 span{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;}
  .ax-dots6 i{width:28px;height:28px;border-radius:999px;box-sizing:border-box;border:1.5px dashed #CFCAC1;color:#B5B0A6;display:flex;align-items:center;justify-content:center;}
  .ax-dots6 i .icon{width:13px;height:13px;stroke-width:2;}
  .ax-dots6 em{font-style:normal;font-size:11px;font-weight:600;color:#9AA1AE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .ax-dots6 .done i{border:none;background:var(--navy);color:#fff;}
  .ax-dots6 .done i .icon{stroke-width:3;width:12px;height:12px;}
  .ax-dots6 .done em{color:var(--ink-soft);}
  .ax-dots6 .now i{border:2px solid var(--navy);background:#E8EBF0;color:var(--navy);}
  .ax-dots6 .now em{color:var(--ink);font-weight:700;}
  .ax-dots6 .now.warn i{border-color:var(--warn-ink);background:var(--warn-bg);color:var(--warn-ink);}
  .ax-dots6 .now.warn em{color:var(--warn-ink);}
  .ax-dots6 .now.good i{border-color:var(--good);background:var(--good-bg);color:var(--good);}
  .ax-dots6 .now.good em{color:var(--good);}

  /* ================= TODAY'S HEADER, PREMIUM =================
     A greeting, the ring (your goal) beside the figure (your money), and a
     glass bar of two doors: what is within reach, where you stand. */
  .ax-hero{border-radius:0 0 28px 28px;padding:calc(14px + var(--safe-t)) 20px 18px;gap:16px;}
  .ax-hello{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .ax-hello .g{font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-hero-day{gap:8px;font-size:12px;color:var(--on-navy);}
  .ax-hero-day .sep{color:#5F6A85;}
  .ax-live{padding:0;background:none;color:var(--mint);gap:5px;}
  .ax-live.off{color:#F5B26B;}
  .ax-me{width:46px;height:46px;background:#243052;font-size:15px;box-shadow:0 0 0 2px var(--navy),0 0 0 4px rgba(111,220,176,.55);}
  .ax-ring{display:block;}
  .ax-yours{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:44px;}
  .ax-yours .l{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--on-navy);}
  .ax-yours .l .icon{width:14px;height:14px;opacity:.7;stroke-width:2.4;}
  .ax-yours .v{display:flex;align-items:baseline;gap:8px;font-size:38px;font-weight:600;letter-spacing:-.04em;line-height:1;}
  .ax-yours .v small{font-family:var(--font-sans);font-size:14px;font-weight:700;color:#8D99B5;letter-spacing:0;}
  .ax-goalbar{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:9px;min-height:44px;justify-content:center;}
  .ax-goalbar .t{display:flex;height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;}
  .ax-goalbar .t i{display:block;height:100%;min-width:8px;border-radius:999px;background:#fff;transition:width .4s cubic-bezier(.2,.8,.2,1);}
  .ax-goalbar .t i.near{min-width:0;border-radius:0 999px 999px 0;background:rgba(111,220,176,.45);}
  .ax-goalbar .l{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--on-navy);}
  .ax-goalbar .l > span{display:flex;align-items:center;gap:5px;}
  .ax-goalbar .l b{color:#fff;font-weight:600;}
  .ax-goalbar .l .icon{width:14px;height:14px;opacity:.7;stroke-width:2.4;}
  .ax-goalbar .set{color:var(--mint);font-weight:700;}
  .ax-goalbar .set .icon{opacity:1;}
  .ax-glass[hidden]{display:none;}
  .ax-glass{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-radius:18px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden;}
  .ax-glass button{all:unset;box-sizing:border-box;cursor:pointer;min-height:56px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;min-width:0;}
  .ax-glass button + button{border-left:1px solid rgba(255,255,255,.08);}
  .ax-glass .ic{width:36px;height:36px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .ax-glass .ic .icon{width:18px;height:18px;stroke-width:2.2;}
  .ax-glass .ic.near{background:rgba(111,220,176,.14);color:var(--mint);}
  .ax-glass .ic.fire{background:rgba(245,178,107,.14);color:#F5B26B;}
  .ax-glass .ic.fire .icon{fill:currentColor;stroke-width:1.6;}
  .ax-glass .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-glass .v{font-size:16px;font-weight:700;white-space:nowrap;}
  .ax-glass .v.m{font-family:var(--font-money);font-weight:600;}
  .ax-glass .v.mint{color:var(--mint);}
  .ax-glass .v small{font-size:12px;font-weight:600;color:var(--on-navy);}
  .ax-glass .s{font-size:11px;font-weight:600;color:var(--on-navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-glass > button > .icon{width:14px;height:14px;color:#5F6A85;stroke-width:2.4;flex:none;}
  .ax-tile{height:auto;min-height:64px;padding:8px 2px;gap:3px;}
  .ax-faces{display:flex;margin-top:2px;}
  .ax-av.xs{width:24px;height:24px;font-size:11px;letter-spacing:-.04em;border:2px solid var(--bg);box-sizing:border-box;}
  .ax-faces .ax-av.xs + .ax-av.xs{margin-left:-6px;}
  .ax-av.xs.more{background:var(--tile);color:var(--ink-soft);}
  .ax-tile.basket .ax-av.xs{border-color:var(--panel);}

  /* ready: how far, and what else waits there */
  .ax-where{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .ax-where .map{position:relative;height:66px;}
  .ax-where .map svg{display:block;width:100%;height:66px;}
  .ax-where .pin{position:absolute;left:50%;top:6px;transform:translateX(-30%);}
  .ax-where .pin i{width:34px;height:34px;border-radius:999px 999px 999px 4px;transform:rotate(-45deg);background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 12px rgba(201,58,48,.35);}
  .ax-where .pin i .icon{width:18px;height:18px;color:#fff;transform:rotate(45deg);}
  .ax-where .far{position:absolute;left:12px;bottom:8px;height:22px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.92);font-size:11px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:4px;}
  .ax-where .far .icon{width:12px;height:12px;}
  .ax-where button.far{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;left:8px;bottom:4px;height:30px;padding:0 10px;border-radius:999px;background:#fff;font-size:12px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:5px;box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .ax-where .r{display:flex;align-items:center;gap:10px;padding:10px 12px;}
  .ax-where .r .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .ax-where .r .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-where .r .s{font-size:12px;font-weight:600;color:var(--good);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-where .go{flex:none;height:44px;padding:0 12px;border-radius:999px;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;text-decoration:none;}
  .ax-where .go .icon{width:15px;height:15px;}
  .ax-also{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-radius:16px;background:#FFF6E9;box-shadow:inset 0 0 0 1px #F5D9B0;}
  .ax-also .ic{width:36px;height:36px;flex:none;border-radius:12px;background:#fff;color:var(--warn-ink);display:flex;align-items:center;justify-content:center;}
  .ax-also .ic .icon{width:20px;height:20px;}
  .ax-also .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .ax-also .n{font-size:14px;font-weight:700;}
  .ax-also .s{font-size:12px;font-weight:600;color:#7A4E14;}
  .ax-also > .icon{width:16px;height:16px;color:var(--warn-ink);}

  /* ================= A STAGE, AT VOLUME ================= */
  .ax-bz-top{padding:0 0 16px;gap:0;border-radius:26px 26px 0 0;}
  .ax-bz-top .ax-grab{height:20px;}
  .ax-bz-h{display:flex;align-items:center;gap:12px;padding:0 16px;color:#fff;}
  .ax-bz-h .ic{width:48px;height:48px;flex:none;border-radius:15px;display:flex;align-items:center;justify-content:center;color:var(--navy);}
  .ax-bz-h .ic .icon{width:26px;height:26px;}
  .ax-bz-h .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .ax-bz-h .t{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1;}
  .ax-bz-h .t b{font-family:var(--font-money);font-weight:600;}
  .ax-bz-h .s{font-family:var(--font-money);font-size:12px;font-weight:600;color:var(--on-navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-bz-bar{display:flex;gap:3px;padding:14px 16px 0;}
  .ax-bz-bar i{height:10px;border-radius:999px;}
  .ax-bz-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 16px 0;}
  .ax-bz-chips::-webkit-scrollbar{display:none;}
  .ax-bz-chips button{all:unset;box-sizing:border-box;cursor:pointer;flex:none;height:44px;padding:0 12px 0 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#E6E9F2;
    font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .ax-bz-chips button.on{background:#fff;color:var(--navy);}
  .ax-bz-chips button i{width:8px;height:8px;border-radius:999px;}
  .ax-bz-chips button b{font-family:var(--font-money);font-weight:600;opacity:.8;}
  .ax-bz-q{display:flex;gap:8px;}
  .ax-bz-q label{flex:1;min-width:0;height:44px;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:9px;padding:0 12px;}
  .ax-bz-q label .icon{width:18px;height:18px;color:var(--ink-soft);}
  .ax-bz-q input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;color:var(--ink);}
  .ax-bz-q button{all:unset;box-sizing:border-box;cursor:pointer;flex:none;height:44px;padding:0 12px;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);
    display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;}
  .ax-bz-q button .icon{width:16px;height:16px;}
  .ax-bg{display:flex;flex-direction:column;gap:8px;}
  .ax-bg-h{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 2px;}
  .ax-bg-h > i{width:10px;height:10px;flex:none;border-radius:999px;}
  .ax-bg-h .l{font-size:14px;font-weight:700;}
  .ax-bg-h .n{flex:1;font-family:var(--font-money);font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ax-bg-sum{font-family:var(--font-money);font-size:13px;font-weight:600;}
  .ax-bg-tot{height:32px;padding:0 11px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .ax-bg-tot .icon{width:14px;height:14px;color:#F5B26B;}
  .ax-bg-tot b{font-family:var(--font-money);font-weight:600;}
  .ax-bg-act{all:unset;box-sizing:border-box;cursor:pointer;height:44px;padding:0 12px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .ax-bg-act .icon{width:15px;height:15px;color:var(--mint);}
  .ax-bg-act.ask{background:var(--good-bg);color:var(--good);}
  .ax-bg-act.ask .icon{color:var(--good);}
  .ax-bg-list{background:var(--panel);border-radius:18px;box-shadow:0 1px 2px rgba(22,32,60,.05),inset 0 0 0 1px var(--line);padding:0 12px;display:flex;flex-direction:column;}
  .ax-br{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:58px;width:100%;}
  .ax-br + .ax-br{border-top:1px solid var(--tile);}
  .ax-br .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-br .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-br .s{font-family:var(--font-money);font-size:11px;color:var(--ink-faint);white-space:nowrap;}
  .ax-av.ring{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--warn);}
  .ax-br .age{flex:none;height:22px;padding:0 7px;border-radius:999px;background:var(--tile);color:var(--ink-soft);font-family:var(--font-money);font-size:11px;font-weight:600;display:flex;align-items:center;}
  .ax-br .age.warn{background:var(--warn-bg);color:var(--warn-ink);}
  .ax-br .age.late{background:var(--bad-bg);color:var(--bad);}
  .ax-br .v{flex:none;font-family:var(--font-money);font-size:13px;font-weight:600;text-align:right;}
  .ax-br > .icon{width:14px;height:14px;color:#9AA1AE;flex:none;}
  .ax-br .go{flex:none;height:36px;padding:0 12px;border-radius:999px;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;}
  .ax-br .go.pay{background:var(--warn-bg);color:var(--warn-ink);}
  .ax-br .code{flex:none;height:26px;padding:0 8px;border-radius:8px;background:var(--navy);color:var(--mint);font-family:var(--font-money);font-size:12px;font-weight:600;display:flex;align-items:center;}
  .ax-bg-more{all:unset;box-sizing:border-box;cursor:pointer;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;border-top:1px solid var(--tile);}
  .ax-bg-more .icon{width:14px;height:14px;}
  .ax-cold{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 12px;border-radius:18px;border:1.5px dashed #CFCAC0;box-sizing:border-box;}
  .ax-cold .b{flex:1;display:flex;flex-direction:column;gap:2px;}
  .ax-cold .b b{font-size:14px;}
  .ax-cold .b span{font-family:var(--font-money);font-size:11px;color:var(--ink-faint);}
  .ax-cold button{all:unset;box-sizing:border-box;cursor:pointer;height:44px;padding:0 12px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .ax-cold button .icon{width:15px;height:15px;}
  .ax-codes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .ax-codes .cd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:16px;background:var(--navy);color:#fff;}
  .ax-codes .cd b{font-family:var(--font-money);font-size:22px;font-weight:600;color:var(--mint);letter-spacing:-.02em;}
  .ax-codes .cd small{font-size:11px;font-weight:600;color:var(--on-navy);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-codes .cd .ax-av.xs{border-color:var(--navy);}

  /* ================= SENT, AS A MOMENT ================= */
  .ax-sent2{position:fixed;inset:0;z-index:70;background:var(--navy);color:#fff;overflow:hidden;cursor:pointer;animation:axFade .15s ease-out;}
  .ax-sent2.out{opacity:0;transition:opacity .2s;}
  .ax-sent2 .trail{position:absolute;inset:0;width:100%;height:100%;}
  .ax-sent2 .trail path{fill:none;stroke:var(--mint);stroke-width:2;stroke-dasharray:100;stroke-linecap:round;vector-effect:non-scaling-stroke;animation:axTrail 3.4s ease-out both;}
  .ax-sent2 .plane{position:absolute;left:calc(50% - 28px);top:36%;width:56px;height:56px;border-radius:18px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(0,0,0,.35);animation:axPlane 3.4s cubic-bezier(.45,.05,.4,1) both;}
  .ax-sent2 .plane .icon{width:28px;height:28px;}
  .ax-sent2 .mid{position:absolute;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:0 20px;}
  .ax-sent2 .tick{position:relative;width:96px;height:96px;}
  .ax-sent2 .tick i{position:absolute;inset:0;border-radius:999px;border:3px solid var(--mint);animation:axRingOut 3.4s ease-out both;}
  .ax-sent2 .tick b{position:absolute;inset:0;border-radius:999px;background:var(--mint);color:var(--navy);display:flex;align-items:center;justify-content:center;animation:axPop 3.4s ease-out both;}
  .ax-sent2 .tick b .icon{width:46px;height:46px;stroke-width:2.8;}
  .ax-sent2 .up{display:flex;flex-direction:column;align-items:center;gap:12px;animation:axRise 3.4s ease-out both;}

  .ax-li.warn .dot{background:var(--warn);}
  .ax-out{color:var(--bad);height:52px;}

  /* A tick that has just landed pops in; the order says it is live. */
  .ax-mk.ok.pop{animation:axTickPop .7s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 0 0 0 rgba(15,107,67,.4);}
  @keyframes axTickPop{0%{transform:scale(0)}60%{transform:scale(1.25);box-shadow:0 0 0 8px rgba(15,107,67,0)}100%{transform:scale(1)}}
  .ax-livedot{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-family:var(--font-sans);font-size:11px;font-weight:700;color:var(--mint);}
  .ax-livedot i{width:6px;height:6px;border-radius:999px;background:var(--mint);animation:axPulse 2s infinite;}
  .ax-livedot.off{color:#F5B26B;}
  .ax-livedot.off i{background:#F5B26B;animation:none;}

  /* ================= NEXT MOVE, AS A RANKED LIST =================
     The best play large on navy; the rest one line each, marked by kind. */
  .ax-plays{padding:10px 16px 4px;display:flex;flex-direction:column;gap:10px;}
  .ax-plays-sum{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;background:var(--good-bg);color:var(--good);font-size:12px;font-weight:700;}
  .ax-plays-sum b{font-weight:600;}
  .ax-plays-none{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;text-align:center;}
  .ax-plays-none .ic{width:44px;height:44px;border-radius:999px;background:var(--tile);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
  .ax-plays-none .t{font-size:15px;font-weight:700;}
  .ax-play{position:relative;border-radius:22px;background:radial-gradient(120% 90% at 100% 0%,#2B3866 0%,var(--navy) 58%);color:#fff;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 30px rgba(22,32,60,.22);overflow:hidden;}
  .ax-hero-top2{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .ax-hero-top2 .n{font-size:12px;font-weight:600;color:#8D99B5;}
  .ax-ptag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#DDE3F0;font-size:12px;font-weight:700;}
  .ax-ptag .icon{width:13px;height:13px;stroke-width:2.4;}
  .ax-ptag.warn{background:rgba(245,178,107,.16);color:#F5B26B;}
  .ax-ptag.good{background:rgba(111,220,176,.16);color:var(--mint);}
  .ax-play-who{display:flex;align-items:center;gap:14px;min-width:0;}
  .ax-play-who .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .ax-play-who .n{font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-play-who .sub{font-size:13px;font-weight:600;color:var(--on-navy);}
  .ax-play-who .sub.warn{color:#F5B26B;}
  .ax-play-who .big{font-size:12px;font-weight:600;color:var(--on-navy);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .ax-play-who .big b{font-size:22px;font-weight:600;letter-spacing:-.02em;}
  .ax-play-who .big b.warn{color:#F5B26B;}
  .ax-play-who .big b.good{color:var(--mint);font-family:var(--font-sans);font-size:18px;font-weight:700;}
  .ax-play-who .key{display:flex;gap:10px;font-size:11px;font-weight:600;color:var(--on-navy);}
  .ax-play-who .key span{display:flex;align-items:center;gap:5px;}
  .ax-play-who .key i{width:8px;height:8px;border-radius:999px;background:#fff;}
  .ax-play-who .key i.late{background:#F5B26B;}
  .ax-dial{position:relative;flex:none;display:block;color:#fff;}
  .ax-dial svg{position:absolute;inset:0;}
  .ax-dial .ax-av{position:absolute;inset:20%;width:auto;height:auto;font-size:16px;}
  .ax-play-usual{display:flex;gap:6px;}
  .ax-play-usual > span{flex:1;min-width:0;height:62px;border-radius:12px;background:rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#DDE3F0;overflow:hidden;}
  .ax-play-usual > span .icon,.ax-play-usual > span svg{width:20px;height:20px;}
  .ax-play-usual > span img{width:26px;height:26px;border-radius:6px;object-fit:cover;}
  .ax-play-usual b{font-size:12px;font-weight:500;color:#fff;white-space:nowrap;}
  .ax-play-usual.one > span{flex-direction:row;justify-content:flex-start;gap:10px;padding:0 12px;height:52px;}
  .ax-play-usual.one b:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-sans);font-weight:600;}
  .ax-play-next{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);font-size:12px;font-weight:600;color:var(--on-navy);}
  .ax-play-next b{color:#fff;font-weight:600;}
  .ax-stack.av .ax-av{border:2px solid var(--navy);}
  .ax-stack.av .ax-av + .ax-av{margin-left:-8px;}
  .ax-bubble.dark{background:rgba(255,255,255,.08);color:#fff;}
  .ax-play-foot{display:flex;align-items:center;gap:10px;}
  .ax-play-foot .e{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .ax-play-foot .e .k{font-size:11px;font-weight:600;color:var(--on-navy);}
  .ax-play-foot .e .v{font-size:22px;font-weight:600;color:var(--mint);letter-spacing:-.02em;}
  .ax-play-call{all:unset;box-sizing:border-box;cursor:pointer;width:48px;height:48px;flex:none;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;}
  .ax-play-call .icon{width:19px;height:19px;}
  .ax-play-go{all:unset;box-sizing:border-box;cursor:pointer;flex:none;height:48px;padding:0 16px;border-radius:14px;background:#fff;color:var(--navy);font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .ax-play-go .icon{width:16px;height:16px;stroke-width:2.4;}
  .ax-plays-h{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 0;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .ax-plays-k{display:flex;gap:8px;}
  .ax-plays-k > span{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;}
  .ax-plays-k .icon{width:12px;height:12px;stroke-width:2.4;}
  .ax-plays-k .ask{color:#1A5A8A;} .ax-plays-k .due{color:var(--good);} .ax-plays-k .bonus{color:var(--warn-ink);} .ax-plays-k .more,.ax-plays-k .done{color:var(--ink-soft);}
  .ax-plays-list{padding:0 14px;border-radius:18px;}
  .ax-prow{display:flex;align-items:center;gap:12px;min-height:66px;}
  .ax-prow + .ax-prow{border-top:1px solid var(--tile);}
  .ax-prow .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .ax-prow .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-prow .n i{font-style:normal;font-weight:600;color:var(--ink-faint);}
  .ax-prow .s{font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-prow .s.warn{color:var(--warn-ink);} .ax-prow .s.good{color:var(--good);}
  .ax-ptile{width:42px;height:42px;flex:none;border-radius:12px;background:var(--tile);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .ax-ptile .icon,.ax-ptile svg{width:20px;height:20px;}
  .ax-ptile img{width:100%;height:100%;object-fit:cover;}
  .ax-ptile.ask{background:#E3EEFB;color:#1A5A8A;}
  .ax-ptile.bonus{background:var(--warn-bg);color:var(--warn-ink);}
  .ax-ptile.more{background:var(--good-bg);color:var(--good);}
  .ax-ptile.done{background:var(--good-bg);color:var(--good);}
  .ax-ptile.lg{width:56px;height:56px;border-radius:16px;}
  .ax-ptile.lg .icon,.ax-ptile.lg svg{width:26px;height:26px;}
  .ax-ptile svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .ax-pdial .ax-dial{color:var(--ink-soft);}
  .ax-pdial.good .ax-dial{color:var(--good);}
  .ax-pdial .ax-dial .ax-av{font-size:11px;letter-spacing:-.04em;}
  .ax-pbtn{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;flex:none;border-radius:12px;background:var(--tile);color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .ax-pbtn.dark{background:var(--navy);color:#fff;}
  .ax-pbtn .icon{width:17px;height:17px;stroke-width:2.2;}
  .ax-prow .ax-earn{padding:5px 8px;}

  /* An order's status as a badge that looks like what it means. */
  .ax-badge{flex:none;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}
  .ax-badge .icon{width:14px;height:14px;stroke-width:2.2;}
  .ax-badge.pay{background:var(--warn);color:#fff;font-family:var(--font-sans);}
  .ax-badge.go{background:var(--good);color:#fff;}
  .ax-badge.shop{background:#E3EEFB;color:#1A5A8A;}
  .ax-badge.done{background:var(--tile);color:var(--ink-faint);}
  .ax-badge.off{background:var(--bad-bg);color:var(--bad);}
  .ax-po.needs,.ax-pickrow.needs{position:relative;}
  .ax-po.needs::before,.ax-pickrow.needs::before{content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--warn);}
  .ax-po .b .e{font-family:var(--font-money);font-size:12px;font-weight:600;color:var(--good);}
  .ax-mo .s .v-in{font-family:var(--font-money);color:var(--good);}

  /* Changing an order: the six steps with what each span still allows,
     the sheets that do it, and what was asked, on the order itself. */
  .ax-chh{display:flex;align-items:flex-start;gap:10px;}
  .ax-chh .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .ax-chh .k{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-chh .t{font-size:21px;font-weight:700;letter-spacing:-.01em;}
  .ax-ed .ax-chh{align-items:center;}
  .ax-ed .ax-chh .t{font-size:19px;}
  .ax-zn{display:flex;flex-direction:column;gap:10px;padding:14px 12px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);}
  .ax-zn-r{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;}
  .ax-zn-s{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
  .ax-zn-s .t{width:100%;height:38px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .ax-zn-s .t .icon{width:15px;height:15px;stroke-width:2.2;}
  .ax-zn-s .l{font-size:11px;font-weight:600;color:var(--ink-faint);white-space:nowrap;}
  .ax-zn-s.free .t{color:var(--good);} .ax-zn-s.ask .t{color:var(--warn);} .ax-zn-s.ret .t{color:var(--ink-faint);}
  .ax-zn-s.done .t{color:var(--ink-faint);}
  .ax-zn-s.on .l{font-weight:700;color:var(--ink);}
  .ax-zn-s.on.free .t{background:var(--good);color:#fff;box-shadow:0 0 0 3px var(--good-bg);}
  .ax-zn-s.on.ask .t{background:var(--warn);color:#fff;box-shadow:0 0 0 3px var(--warn-bg);}
  .ax-zn-b{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;text-align:center;white-space:nowrap;}
  .ax-zn-b i{display:block;height:3px;border-radius:999px;background:currentColor;opacity:.85;}
  .ax-zn-b.free{color:var(--good);} .ax-zn-b.ask{color:var(--warn);} .ax-zn-b.ret{color:var(--ink-faint);}
  .ax-chlist{overflow:hidden;display:flex;flex-direction:column;}
  .ax-chrow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;min-height:68px;padding:0 14px;border-bottom:1px solid var(--tile);color:var(--ink);}
  .ax-chrow:last-child{border-bottom:0;}
  .ax-chrow .ic{width:40px;height:40px;flex:none;border-radius:12px;background:var(--tile);display:flex;align-items:center;justify-content:center;}
  .ax-chrow .ic .icon{width:19px;height:19px;}
  .ax-chrow .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-chrow .t{font-size:15px;font-weight:700;}
  .ax-chrow .s{font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ax-chrow > .icon{width:17px;height:17px;color:var(--dash);}
  .ax-chrow.bad{color:var(--bad);} .ax-chrow.bad .ic{background:var(--bad-bg);}
  .ax-chfig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden;}
  .ax-chfig > span{padding:12px;display:flex;flex-direction:column;gap:3px;}
  .ax-chfig > span + span{border-left:1px solid var(--tile);}
  .ax-chfig.plain > span{padding:0;}
  .ax-chfig.plain > span + span{border-left:0;}
  .ax-chfig .r{align-items:flex-end;}
  .ax-chfig .k{font-size:11px;font-weight:600;color:var(--ink-faint);}
  .ax-chfig .v{font-size:15px;font-weight:600;}
  .ax-chfig .v.good{color:var(--good);} .ax-chfig .v.bad{color:var(--bad);} .ax-chfig .v.warn{color:var(--warn);}
  .ax-chfig .v.was{color:var(--ink-faint);text-decoration:line-through;}
  .ax-chlab{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-faint);padding:4px 2px 0;}
  .ax-radio{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-bottom:1px solid var(--tile);font-size:14px;font-weight:600;color:var(--ink-soft);}
  .ax-radio:last-child{border-bottom:0;}
  .ax-radio i{width:20px;height:20px;flex:none;border-radius:999px;border:2px solid var(--dash);box-sizing:border-box;}
  .ax-radio[aria-checked="true"]{color:var(--ink);font-weight:700;}
  .ax-radio[aria-checked="true"] i{border:6px solid var(--navy);}
  .ax-keep{background:var(--panel);border:1px solid var(--line);color:var(--ink);height:52px;}
  .ax-kill{background:var(--bad);color:#fff;height:52px;}
  .ax-gobtn{height:54px;font-size:15px;font-weight:700;}
  .ax-gobtn .icon{width:17px;height:17px;}
  .ax-edl{display:flex;flex-direction:column;gap:12px;padding:12px 14px;border-bottom:1px solid var(--tile);}
  .ax-edl-r{display:flex;align-items:center;gap:12px;}
  .ax-edl.gone{opacity:.5;}
  .ax-edl.gone .nm{text-decoration:line-through;}
  .ax-edl .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .ax-edl .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-edl .ax-edq{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;color:var(--ink-faint);}
  .ax-edl .ax-step{background:var(--panel);border:1px solid var(--line);flex:none;}
  .ax-edl .ax-step input{width:40px;}
  .ax-step .n{min-width:34px;text-align:center;font-size:14px;font-weight:600;}
  .ax-step button:disabled{opacity:.3;cursor:default;}
  .ax-tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;}
  .ax-tag .icon{width:11px;height:11px;stroke-width:2.4;}
  .ax-tag.warn{background:var(--warn-bg);color:var(--warn);}
  .ax-tag.bad{background:var(--bad-bg);color:var(--bad);}
  .ax-tag s{color:var(--ink-faint);font-weight:600;}
  .ax-undo{all:unset;box-sizing:border-box;cursor:pointer;flex:none;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .ax-undo .icon{width:14px;height:14px;stroke-width:2.2;}
  .ax-edadd{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:56px;}
  .ax-edadd .ic{width:40px;height:40px;flex:none;border-radius:10px;border:1.5px dashed var(--dash);display:flex;align-items:center;justify-content:center;}
  .ax-edadd .ic .icon{width:17px;height:17px;stroke-width:2.4;}
  .ax-edadd input{all:unset;flex:1;min-width:0;height:44px;font-size:14px;font-weight:700;color:var(--ink);}
  .ax-edhit{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 14px;border-top:1px solid var(--tile);}
  .ax-edhit{min-height:64px;}
  .ax-edhit .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .ax-edhit .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-edhit .s{font-size:12px;color:var(--ink-soft);}
  .ax-edhit .go{width:40px;height:40px;flex:none;border-radius:999px;background:var(--good-bg);color:var(--good);display:flex;align-items:center;justify-content:center;}
  .ax-edhit .go .icon{width:18px;height:18px;stroke-width:2.6;}
  .ax-ednote{display:flex;align-items:center;gap:8px;padding:0 4px;font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ax-ednote .icon{width:15px;height:15px;color:var(--good);}
  .ax-eddock{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:14px 16px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-up);}
  .ax-chwhy{display:flex;align-items:center;gap:10px;padding:0 2px;font-size:13px;font-weight:600;color:var(--warn-ink);}
  .ax-chwhy .icon{width:16px;height:16px;color:var(--warn);stroke-width:2.2;}
  .ax-seg2 button .icon{width:15px;height:15px;stroke-width:2.2;margin-right:6px;}
  .ax-newo{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .ax-newo .icon{width:16px;height:16px;}
  .ax-newo .icon:last-child{margin-left:auto;width:14px;height:14px;}
  .ax-chmsg{display:flex;flex-direction:column;gap:6px;padding:12px 14px;}
  .ax-chmsg .ax-chlab{padding:0;font-size:11px;}
  .ax-chmsg textarea{all:unset;box-sizing:border-box;width:100%;font-size:14px;line-height:1.45;color:var(--ink);white-space:pre-wrap;field-sizing:content;min-height:2.9em;}
  .ax-chcredit,.ax-askst{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--tile);}
  .ax-chcredit{background:var(--good-bg);}
  .ax-chcredit .ic,.ax-askst .ic{width:34px;height:34px;flex:none;border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;}
  .ax-chcredit .ic{color:var(--good);}
  .ax-chcredit .ic .icon,.ax-askst .ic .icon{width:17px;height:17px;stroke-width:2.2;}
  .ax-chcredit .b,.ax-askst .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .ax-chcredit .t{font-size:13px;font-weight:700;color:var(--good);}
  .ax-chcredit .s{font-size:12px;font-weight:600;color:#3F6B57;}
  .ax-askst .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-askst .s{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .ax-askst.wait{background:var(--warn-bg);}
  .ax-askst.wait .ic{color:var(--warn);}
  .ax-askst.wait .t{color:var(--warn-ink);}
  .ax-askst.good{background:var(--good-bg);}
  .ax-askst.good .ic{color:var(--good);}
  .ax-askst.good .t{color:var(--good);}

  /* Paying the shop: what is due on the order, and the sheet that takes
     the money -- choosing, the phone prompt, the counter ticket, the
     receipt and what went wrong. Its own sheet, so it can never be
     mistaken for one more card on the order. */
  .ax-ps-dock{position:sticky;bottom:10px;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-radius:22px;background:var(--navy);color:#fff;box-shadow:0 14px 34px rgba(22,32,60,.35);}

  .ax-nt-seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--tile);}
  .ax-nt-seg button{all:unset;box-sizing:border-box;cursor:pointer;flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;text-align:center;transition:background .15s,color .15s;}

  .ax-nt-row{display:flex;flex-direction:column;gap:10px;padding:12px 14px;}

  .ax-nt-row .r{display:flex;align-items:center;gap:12px;}
  .ax-nt-row .ic{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .ax-nt-row .ic .icon{width:20px;height:20px;}

  .ax-nt-row .ic.blue{background:#DCE6F8;color:#1A4A8A;}
  .ax-nt-row .ic.indigo{background:#E2E6FA;color:#3346A8;}

  .ax-nt-row .ic.soft{background:var(--tile);color:var(--ink-soft);}
  .ax-nt-row .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-nt-row .n{font-size:15px;font-weight:700;}
  .ax-nt-row .s{font-size:13px;color:var(--ink-soft);}
  .ax-nt-sw{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:56px;height:44px;display:flex;align-items:center;justify-content:flex-end;}
  .ax-nt-sw i{position:relative;width:52px;height:32px;border-radius:999px;background:var(--dash);transition:background .15s;}
  .ax-nt-sw i::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s;}

  .ax-nt-times{display:flex;gap:8px;padding-left:52px;}
  .ax-nt-times button{all:unset;box-sizing:border-box;cursor:pointer;height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:700;display:flex;align-items:center;}
  .ax-nt-times button[aria-checked="true"]{border-color:var(--navy);background:var(--navy);color:#fff;}
  .ax-nt-rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .ax-nt-rules > span{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:var(--navy);}

  .ax-ask{display:flex;flex-direction:column;gap:18px;padding:4px 20px 4px;text-align:center;}

  .ax-ask-stack i:nth-child(2){left:11px;right:11px;top:14px;height:68px;background:rgba(255,255,255,.18);}
  .ax-ask-stack .card{position:absolute;left:0;right:0;top:30px;border-radius:20px;background:#fff;color:var(--ink);padding:12px 14px;display:flex;gap:12px;text-align:left;box-shadow:0 10px 24px rgba(0,0,0,.25);animation:axAskIn .5s .15s cubic-bezier(.2,.8,.2,1) both;}
  .ax-ask-stack .app{width:36px;height:36px;flex:none;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;}

  .ax-ask-stack .b{min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-ask-stack .b b{font-size:15px;font-weight:800;}
  .ax-ask-stack .b span{font-size:13px;color:var(--ink-soft);}

  .ax-ask-tags .good{background:rgba(111,220,176,.18);color:#6FDCB0;}
  .ax-ask-tags .fun{background:rgba(245,178,107,.18);color:#F5B26B;}

  /* ================= GOAL MILESTONES =================
     A quarter, half and three quarters get a moment; the goal itself gets
     the big one. Navy like the thank-you, gold for the win. */
  .ax-goalbar.hit .t{background:transparent;gap:2px;}
  .ax-goalbar.hit .t i.won{min-width:0;border-radius:999px 2px 2px 999px;background:var(--mint);}
  .ax-goalbar.hit .t i.over{min-width:0;border-radius:2px 999px 999px 2px;background:#F5B26B;}
  .ax-goalbar.hit .t i.won:last-child{border-radius:999px;}
  .ax-goalbar .l .won{color:var(--mint);font-weight:700;}
  .ax-goalbar .l .won .icon{opacity:1;color:#F5B26B;width:16px;height:16px;}
  .ax-goalbar .l .won b{color:#F5B26B;}

  .ax-goalwin{position:fixed;inset:0;z-index:73;background:var(--navy);color:#fff;overflow-y:auto;animation:axFade .2s ease-out;}
  .ax-goalwin.out{opacity:0;transition:opacity .2s;}
  .ax-goalwin .in{position:relative;max-width:520px;min-height:100%;margin:0 auto;box-sizing:border-box;padding:calc(14px + var(--safe-t)) 20px calc(24px + var(--safe-b));display:flex;flex-direction:column;gap:16px;}
  .ax-goalwin .top{display:flex;justify-content:space-between;align-items:center;}
  .ax-goalwin .tag{display:flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-navy);}
  .ax-goalwin .head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:axGwUp .5s ease-out .5s both;}
  .ax-goalwin h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
  .ax-goalwin .who{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 4px;border-radius:999px;background:rgba(255,255,255,.08);font-size:14px;font-weight:600;}
  .ax-goalwin .who .ax-av{width:30px;height:30px;font-size:11px;}
  .ax-goalwin .grow-space{flex:1;}
  .ax-goalwin .go{all:unset;box-sizing:border-box;cursor:pointer;height:58px;border-radius:16px;background:#fff;color:var(--navy);font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;}
  .ax-goalwin .go .icon{width:18px;height:18px;stroke-width:2.4;}
  .ax-goalwin .go .m{font-family:var(--font-money);font-weight:600;}
  .ax-goalwin .later{all:unset;box-sizing:border-box;cursor:pointer;height:48px;margin-top:-6px;border-radius:14px;color:var(--on-navy);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;}
  .ax-goalwin .later .icon{width:18px;height:18px;}
  @keyframes axGwUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  @keyframes axGwBurst{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes axGwRay{0%{opacity:0;transform:scale(.4)}40%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
  @keyframes axGwArc{from{stroke-dasharray:0 603.2}}
  /* the step */
  .ax-goalwin .arc{position:relative;align-self:center;width:240px;height:214px;}
  .ax-goalwin .arc svg{display:block;}
  .ax-goalwin .arc .grow{animation:axGwArc 1s ease-out both;}
  .ax-goalwin .arc .burst{animation:axGwBurst .6s cubic-bezier(.2,.8,.2,1) .8s both;}
  .ax-goalwin .arc .rays{animation:axGwRay 1.4s ease-out .9s both;}
  .ax-goalwin .arc .mid{position:absolute;inset:0;padding-top:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .ax-goalwin .arc .mid b{font-size:50px;font-weight:600;letter-spacing:-.05em;line-height:1;}
  .ax-goalwin .arc .mid span{font-size:13px;color:var(--on-navy);}
  .ax-goalwin .track{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:14px 6px 12px;border-radius:20px;background:rgba(255,255,255,.06);}
  .ax-goalwin .track .rail,.ax-goalwin .track .fill{position:absolute;left:12.5%;top:31px;height:4px;border-radius:999px;}
  .ax-goalwin .track .rail{right:12.5%;background:rgba(255,255,255,.12);}
  .ax-goalwin .track .fill{background:var(--mint);}
  .ax-goalwin .track > span{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .ax-goalwin .track .n{width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#F5B26B;color:var(--navy);box-shadow:0 0 0 6px rgba(245,178,107,.2);}
  .ax-goalwin .track .n .icon{width:18px;height:18px;stroke-width:2.8;}
  .ax-goalwin .track .n.done{background:var(--mint);box-shadow:none;}
  .ax-goalwin .track .n.next{background:var(--navy);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);color:var(--on-navy);}
  .ax-goalwin .track .n.next .icon{width:16px;height:16px;stroke-width:2.2;}
  .ax-goalwin .track b{font-size:14px;}
  .ax-goalwin .track .s{font-size:12px;font-weight:600;color:var(--on-navy);}
  .ax-goalwin .track .now b,.ax-goalwin .track .now .s{color:#F5B26B;font-weight:700;}
  .ax-goalwin .gap{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 12px 12px 14px;border-radius:18px;background:rgba(255,255,255,.06);}
  .ax-goalwin .gap .faces{display:flex;flex:none;}
  .ax-goalwin .gap .faces .ax-av{width:34px;height:34px;font-size:11px;box-shadow:0 0 0 2px #1E2846;}
  .ax-goalwin .gap .faces .ax-av + .ax-av{margin-left:-8px;}
  .ax-goalwin .gap .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:600;color:var(--on-navy);}
  .ax-goalwin .gap .b b{font-size:14px;font-weight:700;color:#fff;}
  .ax-goalwin .gap .v{font-size:15px;font-weight:600;color:var(--mint);}
  .ax-goalwin .gap > .icon{width:14px;height:14px;color:#5F6A85;stroke-width:2.4;}
  /* the goal */
  .ax-goalwin .cf{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .ax-goalwin .cf i{position:absolute;width:8px;height:12px;border-radius:2px;opacity:0;animation:axConf 2.8s ease-in both;}
  .ax-goalwin .medal{position:relative;align-self:center;width:176px;height:176px;margin-top:-8px;}
  .ax-goalwin .medal .sun{position:absolute;inset:0;width:176px;height:176px;fill:none;animation:axGwSpin 24s linear infinite;}
  @keyframes axGwSpin{to{transform:rotate(360deg)}}
  .ax-goalwin .medal .cup{position:absolute;left:30px;top:30px;width:116px;height:116px;border-radius:999px;background:#F5B26B;color:var(--navy);box-shadow:0 0 0 8px rgba(245,178,107,.18),inset 0 0 0 6px #E39A4C;display:flex;align-items:center;justify-content:center;animation:axGwPop .8s cubic-bezier(.2,.8,.2,1) .2s both;}
  .ax-goalwin .medal .cup .icon{width:56px;height:56px;stroke-width:2;}
  @keyframes axGwPop{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:none}}
  .ax-goalwin .eye{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#F5B26B;}
  .ax-goalwin.done h2{font-size:34px;}
  .ax-goalwin .big{font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1.1;color:var(--mint);}
  .ax-goalwin .pill{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:rgba(111,220,176,.16);color:var(--mint);font-size:13px;font-weight:700;}
  .ax-goalwin .pill .icon{width:15px;height:15px;}
  .ax-goalwin .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;animation:axGwUp .5s ease-out .8s both;}
  .ax-goalwin .stats > span{height:64px;border-radius:16px;background:rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--on-navy);}
  .ax-goalwin .stats b{font-size:20px;font-weight:600;color:#fff;}
  .ax-goalwin .stats .gold{background:rgba(245,178,107,.12);color:#F5B26B;}
  .ax-goalwin .stats .gold b{color:#F5B26B;}
  .ax-goalwin .who-got{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:rgba(255,255,255,.06);animation:axGwUp .5s ease-out 1s both;}
  .ax-goalwin .who-got .k{font-size:13px;font-weight:700;color:var(--on-navy);}
  .ax-goalwin .who-got .bar{display:flex;height:14px;gap:3px;}
  .ax-goalwin .who-got .bar i{min-width:6px;border-radius:4px;}
  .ax-goalwin .who-got .bar i:first-child{border-radius:999px 4px 4px 999px;}
  .ax-goalwin .who-got .bar i:last-child{border-radius:4px 999px 999px 4px;}
  .ax-goalwin .who-got .bar i:only-child{border-radius:999px;}
  .ax-goalwin .who-got .legend{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;font-size:12px;font-weight:600;}
  .ax-goalwin .who-got .legend span{display:flex;align-items:center;gap:6px;}
  .ax-goalwin .who-got .legend i{width:8px;height:8px;border-radius:999px;}
  .ax-goalwin .who-got .legend b{font-weight:600;color:var(--on-navy);}
  @media (prefers-reduced-motion: reduce){ .ax-goalwin *, .ax-goalwin{animation:none !important;} .ax-goalwin .cf{display:none;} }

  /* ================= DELIVERY =================
     One sheet for where, who and when; the dock shows them in one line;
     the order shows where it is going, who is driving, and who took it. */
  .ax-delsum{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;}
  .ax-delsum[hidden]{display:none;}
  .ax-delsum > .icon{width:20px;height:20px;flex:none;color:var(--mint);}
  .ax-delsum.empty > .icon{color:#F5B26B;}
  .ax-delsum .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .ax-delsum .a{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-delsum.empty .a{color:#F5B26B;}
  .ax-delsum .s{font-size:12px;font-weight:600;color:var(--on-navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-delsum > .icon:last-child{width:16px;height:16px;color:var(--on-navy);}

  .ax-del{gap:14px;}
  .ax-del-h{display:flex;align-items:center;gap:12px;}
  .ax-del-h .ic{width:48px;height:48px;flex:none;border-radius:14px;background:var(--navy);color:var(--mint);display:flex;align-items:center;justify-content:center;}
  .ax-del-h .ic .icon{width:24px;height:24px;}
  .ax-del-h .b{display:flex;flex-direction:column;gap:2px;}
  .ax-del-h .t{font-size:20px;font-weight:800;}
  .ax-del-h .s{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .ax-del-f{overflow:hidden;border-radius:18px;}
  .ax-del-f .r{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;box-sizing:border-box;}
  .ax-del-f .r + .r{border-top:1px solid var(--tile);}
  .ax-del-f .ic{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--tile);color:var(--ink-soft);}
  .ax-del-f .ic.good{background:var(--good-bg);color:var(--good);}
  .ax-del-f .ic.av{background:none;}
  .ax-del-f .ic .icon{width:20px;height:20px;}
  .ax-del-f .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-del-f .ax-del-k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-soft);}
  .ax-del-f .tag{height:20px;padding:0 7px;border-radius:999px;background:var(--good-bg);color:var(--good);font-size:11px;display:flex;align-items:center;}
  .ax-del-f input{border:none;outline:none;padding:4px 0;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:transparent;min-width:0;width:100%;}
  .ax-del-f .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;}
  .ax-del-f .two input{border-bottom:1px dashed var(--line);}
  .ax-del-f .pen{color:var(--ink-faint);display:flex;}
  .ax-del-f .pen .icon{width:16px;height:16px;}
  .ax-del-f .r:focus-within{background:#FBFAF8;}
  .ax-del-when{display:flex;flex-direction:column;gap:8px;}
  .ax-del-when .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .ax-del-when [role="radiogroup"]{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .ax-del-when button{all:unset;box-sizing:border-box;cursor:pointer;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
  .ax-del-when button b{font-size:14px;}
  .ax-del-when button span{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .ax-del-when button[aria-checked="true"]{border:2px solid var(--navy);background:var(--navy);color:#fff;}
  .ax-del-when button[aria-checked="true"] span{color:var(--on-navy);}
  .ax-del-fee{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--bg);}
  .ax-del-fee .b{flex:1;display:flex;flex-direction:column;gap:2px;}
  .ax-del-fee .t{font-size:14px;font-weight:700;}

// Deliberately self-contained rather than loading shared-worker.js -- that
// file's top-level code wires event listeners against worker-view DOM
// elements (#wv_enablePushBtn etc.) that don't exist on this page, which
// would throw and abort the whole script before anything else in it ran.
// The handful of generic helpers below (esc/toast/auth overlay/login
// screen) are intentionally small, bounded duplication rather than risk
// coupling this page to a file two other already-shipped apps depend on.

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// "Nakato's order", "Moses' order". A name already ending in s takes the
// bare apostrophe. Always applied to the RAW name and escaped afterwards --
// esc() turns an apostrophe into &#39;, so escaping first would leave the
// name ending in a semicolon and the rule would never match.
function possessive(name){
  const n = String(name??'').trim();
  if(!n) return '';
  return /s$/i.test(n) ? `${n}'` : `${n}'s`;
}


function fmtUGX(n){ return 'UGX ' + Math.round(Number(n)||0).toLocaleString('en-UG'); }
// The same figure without the unit, for the places that already say UGX
// once -- repeating it on every line of a hero is noise.
function fmtNum(n){ return Math.round(Number(n)||0).toLocaleString('en-UG'); }
// Per-unit product price shown while browsing, without a currency prefix --
// every surface that shows this already repeats it on more than one line
// (a headline price plus a "buy more" hint), and the layouts involved
// (2-column grid cards, a compact search-suggestions dropdown) are tight
// enough that the extra characters push things into an awkward wrap. The
// unit's shown separately right where it's needed instead.
function fmtAmount(n){ return Math.round(Number(n)||0).toLocaleString('en-UG'); }

// The default look is re-applied on every call, not just on creation.
// showLoginScreen paints its own ground over it, and the screens that can
// follow -- set a password, the fatal-error notice -- reuse this element;
// without the reset they inherited the sign-in screen's layout with their
// own inline styles landing half-applied on top.
function ensureAuthOverlay(){
  let el = document.getElementById('authOverlay');
  if(!el){
    el = document.createElement('div');
    el.id = 'authOverlay';
    document.body.appendChild(el);
  }
  el.className = '';
  el.style.cssText = 'position:fixed;inset:0;background:#12151A;color:#eee;display:flex;align-items:center;justify-content:center;z-index:99999;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;';
  return el;
}
function hideAuthOverlay(){
  const el = document.getElementById('authOverlay');
  if(el) el.remove();
}

async function getAuthedUser(){
  const { data, error } = await sb.auth.getUser();
  if(error || !data || !data.user) return null;
  return data.user;
}

   sheet is the ground here, not the trim.

   Corrugated iron again, the material every hardware shop in Kampala
   sells and is roofed with, but raked over on a diagonal rather than
   standing upright -- a sheet leaning against a wall rather than nailed
   to a roof.

function showLoginScreen(){
  return new Promise((resolve)=>{
    injectAgentAuthStyles();
    const el = ensureAuthOverlay();
    el.className = 'ag-auth';
    el.style.cssText = 'position:fixed;inset:0;z-index:99999;';
    el.innerHTML = `
      <div class="aa-shell">
        <div class="aa-head">
          <p class="aa-mark">Omni-Ware · Agent</p>
          <h2 class="aa-pitch">Your customers. Your prices. Your cut.</h2>
          <p class="aa-sub">Quote from the live price book, send the order straight through, and watch what you have earned.</p>
        </div>
        <div class="aa-card">
          <div class="aa-field">
            <label for="auth_email">Email</label>
            <input id="auth_email" type="email" autocomplete="username" inputmode="email" placeholder="you@example.com">
          </div>
          <div class="aa-field">
            <label for="auth_password">Password</label>
            <input id="auth_password" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
          <div class="aa-status" id="auth_status" role="status" aria-live="polite"></div>
          <button id="auth_signin_btn" class="aa-primary">Sign in</button>
          <button id="auth_forgot_btn" type="button" class="aa-ghost">Forgot password?</button>
        </div>
        <p class="aa-help">Agents are invited by the shop. If you have no account yet, ask them to send you one.</p>
      </div>`;
    const statusEl = el.querySelector('#auth_status');
    const setStatus = (msg, kind)=>{
      statusEl.textContent = msg;
      statusEl.style.color = kind==='ok' ? '#0F6B43' : kind==='busy' ? '#767F91' : '#C93A30';
    };
    ['auth_email','auth_password'].forEach(id=>{
      el.querySelector('#'+id).addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){ e.preventDefault(); el.querySelector('#auth_signin_btn').click(); }
      });
    });
    el.querySelector('#auth_signin_btn').addEventListener('click', async ()=>{
      const email = el.querySelector('#auth_email').value.trim();
      const password = el.querySelector('#auth_password').value;
      if(!email || !password){ setStatus('Enter an email and password', 'err'); return; }
      const btn = el.querySelector('#auth_signin_btn');
      btn.disabled = true;
      setStatus('Signing in…', 'busy');
      const { error } = await sb.auth.signInWithPassword({email, password});
      btn.disabled = false;
      if(error){ setStatus(error.message, 'err'); return; }
      const user = await getAuthedUser();
      if(!user){ setStatus('Sign-in did not complete, try again.', 'err'); return; }
      setStatus('Signed in…', 'ok');
      resolve();
    });
    el.querySelector('#auth_forgot_btn').addEventListener('click', async ()=>{
      const email = (el.querySelector('#auth_email').value||'').trim();
      if(!email){ setStatus('Enter your email above first, then tap "Forgot password?"', 'err'); return; }
      setStatus('Sending reset link…', 'busy');
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.Capacitor ? 'https://omni-ware.vercel.app/agent.html' : location.origin + location.pathname });
      setStatus(error ? error.message : 'Check your email for a password reset link.', error ? 'err' : 'ok');
    });
  });
}

      const { error } = await sb.auth.updateUser({ password: pw1 });
      if(error){ errEl.textContent = error.message; return; }
      resolve();
    });
  });
}

/* ================= WHO IS SIGNED IN =================================

   The agent app is deliberately self-contained -- it does not load
   shared-worker.js -- so it carries its own copy of this. owDeviceId and
   owDeviceLabel are lifted VERBATIM from that file and a test compares
   them byte for byte, because a label that parses user agents two
   different ways in two apps is a monitor that quietly disagrees with
   itself about what a device is.

   An agent is an outside salesperson holding a login to somebody else's
   shop, which is exactly the account an owner most wants to see.
*/
const OW_DEVICE_KEY = 'owDeviceId';
let owFallbackDeviceId = null;
function owDeviceId(){
  let id = null;
  try { id = localStorage.getItem(OW_DEVICE_KEY); } catch(e){ /* storage refused */ }
  if(id) return id;
  id = 'dev_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  try { localStorage.setItem(OW_DEVICE_KEY, id); }
  catch(e){
    if(!owFallbackDeviceId) owFallbackDeviceId = id;
    return owFallbackDeviceId;
  }
  return id;
}

function owDeviceLabel(ua){
  const s = String(ua || '');
  const browser = /Edg\//.test(s) ? 'Edge'
    : /OPR\/|Opera/.test(s) ? 'Opera'
    : /Chrome\//.test(s) ? 'Chrome'
    : /Firefox\//.test(s) ? 'Firefox'
    : /Safari\//.test(s) ? 'Safari'
    : '';
  const os = /Android/.test(s) ? 'Android'
    : /iPhone/.test(s) ? 'iPhone'
    : /iPad/.test(s) ? 'iPad'
    : /Windows/.test(s) ? 'Windows'
    : /Mac OS X/.test(s) ? 'Mac'
    : /Linux/.test(s) ? 'Linux'
    : '';
  if(browser && os) return `${browser} on ${os}`;
  return browser || os || 'Unknown device';
}

let owSessionLastBeat = 0;
const OW_SESSION_BEAT_MS = 120000;

async function owTouchSession(force){
  if(!currentUser || !currentShopId) return false;
  const now = Date.now();
  if(!force && now - owSessionLastBeat < OW_SESSION_BEAT_MS) return false;
  owSessionLastBeat = now;
  try {
    const { data: mine } = await sb.from('login_sessions')
      .select('id, revoked_at')
      .eq('shop_id', currentShopId).eq('user_id', currentUser.id)
      .eq('device_id', owDeviceId()).eq('app', 'agent')
      .maybeSingle();
    if(mine && mine.revoked_at) return true;
    const stamp = new Date().toISOString();
    if(mine){
      await sb.from('login_sessions').update({ last_seen_at: stamp }).eq('id', mine.id);
    } else {
      await sb.from('login_sessions').insert({
        shop_id: currentShopId, user_id: currentUser.id, device_id: owDeviceId(),
        app: 'agent', label: owDeviceLabel(navigator.userAgent),
        started_at: stamp, last_seen_at: stamp,
      });
    }
  } catch(e){
    // An agent who cannot be monitored must still be able to sell.
    console.error('login session heartbeat failed', e);
  }
  return false;
}

async function owSessionBeat(force){
  if(await owTouchSession(force)){
    alert('This device has been signed out by the shop.');
    await signOutAndReload();
  }
}
// Its own rhythm, since this app has no shared poll to ride.
setInterval(()=>{ if(!document.hidden) owSessionBeat(); }, 60000);

async function signOutAndReload(){
  // Drop the snapshot on the way out. Ownership is checked on every read
  // anyway, but leaving one agent's clients and orders sitting in a shared
  // device's storage after they've signed out serves no purpose.
  clearOfflineCache();
  // Same for the quote draft, which holds baskets and a customer's typed
  // delivery address. Also checked on read, also no reason to leave behind.
  clearQuoteDraft();
  await sb.auth.signOut();
  location.reload();
}
