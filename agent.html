<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16203C">
<title>Omni-Ware Agent</title>
<!-- The phone app's native layer (apps/agent). Inert in a browser. It
     lives here rather than in the app's own files so a fix to it reaches
     installed phones the same way any change to this page does. -->
<script>
/* The agent page inside the Android and iPhone app.

   First in <head>, and only does anything inside the app. Four jobs:

   1. Back (Android) closes what is on top -- a photo, a sheet, then the tab
      -- before it ever leaves the app, and leaving only puts it in the
      background so it reopens instantly.
   2. The status bar: the page draws to the top edge, so a strip behind the
      clock takes the colour of whatever is under it, and its icons stay
      readable against it.
   3. The bars' size: Capacitor measures them into --safe-area-inset-*,
      but a page it has not measured (some phones, after a reload) would
      read zero and slide under the clock -- so the last good measurement
      stands in until it does.
   4. Staying current without a store release: the installed app checks the
      live agent.html now and then, keeps a copy of a new one on the phone,
      and switches to it the next time the app goes to the background --
      never in the middle of an order. */
(function(){
  'use strict';
  var C = window.Capacitor;
  if(!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return;
  var P = C.Plugins || {};
  var App = P.App, Bars = P.SystemBars, WebView = P.WebView, Http = P.CapacitorHttp, FS = P.Filesystem;
  var NAVY = '#16203C';
  var root = document.documentElement;
  // The first installs carried this layer as their own native.js. On those
  // it is already running from above, and only the bars' size (3) is new.
  var legacy = !!document.querySelector('script[src="native.js"]');
  // A light tap when something lands in the basket, a firm one when an
  // order is sent or paid. Silent on a build without the plugin.
  window.owHaptic = function(kind){
    var H = P.Haptics;
    if(!H) return;
    (kind === 'success' ? H.notification({ type: 'SUCCESS' }) : H.impact({ style: 'LIGHT' })).catch(function(){});
  };

  /* ---- 1. back ---- */
  function back(){
    var tap = document.querySelector('.ag-lightbox') || document.querySelector('.ax-thanks [data-ty-close]') || document.querySelector('.ax-goalwin [data-gw-close]') || document.querySelector('.ax-sent2');
    if(tap){ tap.click(); return; }
    if(typeof openSheets !== 'undefined' && openSheets.length){ openSheets[openSheets.length - 1].close(); return; }
    if(typeof currentView !== 'undefined' && currentView !== 'today' && typeof switchTab === 'function' && !document.querySelector('.ag-auth')){ switchTab('today'); return; }
    if(App) App.minimizeApp();
  }
  if(App && !legacy) App.addListener('backButton', back);

  /* ---- 2. the strip behind the status bar ---- */
  var strip = null, lastStyle = '';
  function paintBar(){
    if(!strip) return;
    var hero = document.querySelector('#ag_todayView:not([hidden]) .ax-hero');
    var top = strip.offsetHeight;
    var onNavy = !!document.querySelector('.ag-auth, .ax-sent2, .ax-thanks, .ag-lightbox')
      || (hero && hero.getBoundingClientRect().bottom > top);
    strip.style.background = onNavy ? NAVY : 'var(--bg)';
    // Scrims dim the strip with the page, so the icons stay light then too.
    var style = onNavy || document.querySelector('.ax-scrim') ? 'DARK' : 'LIGHT';
    if(style !== lastStyle && Bars){ lastStyle = style; Bars.setStyle({ style: style }).catch(function(){}); }
  }
  var queued = false;
  function soon(){ if(queued) return; queued = true; requestAnimationFrame(function(){ queued = false; paintBar(); }); }
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(insets, 800);
    setTimeout(insets, 2500);
    window.addEventListener('resize', function(){ setTimeout(insets, 300); });
    if(App) App.addListener('resume', function(){ setTimeout(insets, 300); });
    if(legacy) return;
    strip = document.createElement('div');
    strip.setAttribute('aria-hidden', 'true');
    strip.style.cssText = 'position:fixed;top:0;left:0;right:0;height:var(--safe-t, 0px);z-index:59;pointer-events:none;background:' + NAVY + ';';
    document.body.appendChild(strip);
    new MutationObserver(soon).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class'] });
    window.addEventListener('scroll', soon, { passive: true });
    paintBar();
  });


  /* ---- 3. the bars' size ---- */
  var INSETS = 'ow-app-insets';
  function insets(){
    if(typeof C.getPlatform === 'function' && C.getPlatform() !== 'android') return;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:var(--safe-t, 0px);padding-bottom:var(--safe-b, 0px);';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe), top = parseFloat(cs.paddingTop) || 0, bottom = parseFloat(cs.paddingBottom) || 0;
    probe.remove();
    var measured = root.style.getPropertyValue('--safe-area-inset-top') !== '';
    var last = {};
    try{ last = JSON.parse(localStorage.getItem(INSETS)) || {}; }catch(_e){}
    if(measured && top > 0){
      if(last.top !== top || last.bottom !== bottom){ try{ localStorage.setItem(INSETS, JSON.stringify({ top: top, bottom: bottom, ours: false })); }catch(_e){} }
      return;
    }
    // Measured at zero: Android has laid the page out below its bars itself.
    if(measured || top > 0) return;
    // Not measured, and the page fills the whole screen -- it is under the
    // bars with nothing telling it how tall they are.
    if(!last.top && Math.abs(screen.height - window.innerHeight) > 16) return;
    root.style.setProperty('--safe-area-inset-top', (last.top || 32) + 'px');
    root.style.setProperty('--safe-area-inset-bottom', (last.bottom || 32) + 'px');
  }

  /* ---- 4. staying current ---- */
  if(legacy || !(WebView && Http && FS && App && window.crypto && crypto.subtle)) return;
  var SOURCE = 'https://omni-ware.vercel.app/agent.html';
  var KEY = 'ow-app-bundle';
  var EVERY = 30 * 60 * 1000;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(_e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_e){} }
  function header(h, name){
    var k = Object.keys(h || {}).filter(function(x){ return x.toLowerCase() === name; })[0];
    return k ? h[k] : '';
  }
  function sha256(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  // A file of the bundle running now, as base64 for the Filesystem plugin.
  function fileB64(name){
    return fetch(name, { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error(name + ': ' + r.status);
      return r.blob();
    }).then(function(blob){
      return new Promise(function(ok, fail){
        var fr = new FileReader();
        fr.onload = function(){ ok(String(fr.result).split(',')[1] || ''); };
        fr.onerror = fail;
        fr.readAsDataURL(blob);
      });
    });
  }
  function current(){ return fetch('bundle.json', { cache: 'no-store' }).then(function(r){ return r.json(); }); }

  // After a switch: make the new copy the one the app opens with, and drop
  // the copies nothing points at any more.
  function settle(){
    var s = load();
    if(!s.staged) return Promise.resolve();
    return WebView.getServerBasePath().then(function(cur){
      if(!cur || cur.path !== s.staged.path) return;
      return WebView.persistServerBasePath().then(function(){
        var keep = s.staged.dir;
        s.etag = s.staged.etag;
        delete s.staged;
        save(s);
        return FS.readdir({ path: 'live', directory: 'DATA' }).then(function(r){
          return Promise.all((r.files || []).map(function(f){
            var n = typeof f === 'string' ? f : f.name;
            return n === keep.split('/').pop() ? null : FS.rmdir({ path: 'live/' + n, directory: 'DATA', recursive: true }).catch(function(){});
          }));
        }).catch(function(){});
      });
    });
  }

  function check(){
    var s = load();
    if(s.staged || Date.now() - (s.checked || 0) < EVERY) return Promise.resolve();
    s.checked = Date.now();
    save(s);
    return Promise.all([current(), Http.request({ url: SOURCE, method: 'GET', responseType: 'text',
      headers: s.etag ? { 'If-None-Match': s.etag } : {} })]).then(function(pair){
      var mine = pair[0], res = pair[1];
      if(res.status !== 200) return;
      var html = typeof res.data === 'string' ? res.data : '';
      // Half a page is worse than an old page.
      if(html.length < 100000 || html.indexOf('</html>') === -1) return;
      var etag = header(res.headers, 'etag');
      return sha256(html).then(function(hash){
        if(hash === mine.source){ s.etag = etag; save(s); return; }
        var dir = 'live/' + hash.slice(0, 16);
        var rest = (mine.files || []).filter(function(f){ return f !== 'index.html' && f !== 'bundle.json'; });
        return FS.writeFile({ path: dir + '/index.html', data: window.owAppTransform(html), directory: 'DATA', encoding: 'utf8', recursive: true })
          .then(function(){
            return rest.reduce(function(p, f){
              return p.then(function(){ return fileB64(f); })
                .then(function(b64){ return FS.writeFile({ path: dir + '/' + f, data: b64, directory: 'DATA', recursive: true }); });
            }, Promise.resolve());
          })
          .then(function(){
            return FS.writeFile({ path: dir + '/bundle.json', data: JSON.stringify({ source: hash, files: mine.files }), directory: 'DATA', encoding: 'utf8', recursive: true });
          })
          .then(function(){ return FS.getUri({ path: dir, directory: 'DATA' }); })
          .then(function(u){
            var s2 = load();
            s2.staged = { dir: dir, path: decodeURI(String(u.uri).replace(/^file:\/\//, '')), etag: etag };
            save(s2);
          });
      });
    }).catch(function(){
      // No signal, or the server is down: the copy already here carries on.
    });
  }

  App.addListener('pause', function(){
    var s = load();
    if(s.staged) WebView.setServerBasePath({ path: s.staged.path }).catch(function(){});
  });
  App.addListener('resume', function(){ check(); });
  settle().catch(function(){}).then(function(){ setTimeout(check, 5000); });
})();
</script>
<link rel="manifest" href="/manifest-agent.json">
<!-- The faces load without holding the page up. media="print" keeps the
     sheet off the critical path and onload swaps it in once it lands; on a
     dead connection it never lands and the system stack carries on. An
     agent standing in a customer's yard on one bar must never watch a
     blank screen wait for a font. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* ================= THE AGENT APP =================
     Three places and three sheets. Today answers "where is everything",
     Order is the whole sale on one screen, Clients is who to see. Track,
     Client and Money slide up over whichever of those you are on, so the
     way back is always the thing you were looking at.

     Navy carries money and state, white carries work, one red button is
     the move. Every number is set in the mono face so columns of money
     line up without a table. */
  :root{
    --ow-navy:#16203C;
    --ow-navy-2:#243052;
    --ow-navy-3:#2A3350;
    --ow-steel-050:#F7F5F2;
    --ow-steel-100:#E0DCD4;
    --ow-paper:#FFFFFF;
    --ow-tile:#F1EEE8;
    --ow-oxide:#C93A30;
    --ow-oxide-deep:#A82D24;
    --ow-oxide-soft:#FDE8E4;
    --ow-verdigris:#0F6B43;
    --ow-verdigris-soft:#E4F4EA;
    --ow-amber:#95530C;
    --ow-amber-soft:#FDEEE1;
    --ow-amber-ink:#7A4A02;
    --ow-crimson:#8E2A22;
    --ow-crimson-soft:#FBE5E2;
    --ow-mint:#6FDCB0;
    --ow-on-navy:#B3BCD2;
    --ow-ink-900:#1C2233;
    --ow-ink-600:#5F6980;
    /* Captions on white only. On the warm ground it falls to 4.3:1, so
       anything sitting on --bg takes --ink-soft instead. */
    --ow-ink-400:#6B7480;
    --ow-rule:#E6E3DD;
    --ow-dash:#C9C4BA;

    --bg: var(--ow-steel-050);
    --panel: var(--ow-paper);
    --tile: var(--ow-tile);
    --ink: var(--ow-ink-900);
    --ink-soft: var(--ow-ink-600);
    --ink-faint: var(--ow-ink-400);
    --line: var(--ow-rule);
    --dash: var(--ow-dash);
    --navy: var(--ow-navy);
    --navy-2: var(--ow-navy-2);
    --navy-3: var(--ow-navy-3);
    --on-navy: var(--ow-on-navy);
    --mint: var(--ow-mint);
    --accent: var(--ow-oxide);
    --accent-dark: var(--ow-oxide-deep);
    --accent-soft: var(--ow-oxide-soft);
    --good: var(--ow-verdigris);
    --good-bg: var(--ow-verdigris-soft);
    --warn: var(--ow-amber);
    --warn-bg: var(--ow-amber-soft);
    --warn-ink: var(--ow-amber-ink);
    --bad: var(--ow-crimson);
    --bad-bg: var(--ow-crimson-soft);
    --bonus: var(--ow-amber);
    --font-sans: 'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-money: 'IBM Plex Mono',ui-monospace,'SF Mono','Roboto Mono',Menlo,monospace;
    --shadow: 0 6px 20px rgba(27,36,56,.18);
    --shadow-up: 0 -8px 24px rgba(22,32,60,.18);
    /* The phone's own bars. In the Android app Capacitor measures them into
       --safe-area-inset-*; a browser or the iPhone app reports them through
       env(). Zero on a desktop browser. */
    --safe-t: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    --safe-b: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));

    /* Avatar tints: identity, never state. Picked by the client's id so a
       person keeps their colour across every screen. */
    /* an aisle tint, set per tile by aisleTint(); these are the untinted look */
    --ai: var(--ink-soft); --ai-s: var(--tile);
    --av-0-bg:#DCEAF8; --av-0-fg:#1A5A8A;
    --av-1-bg:#F6E4F1; --av-1-fg:#7A3268;
    --av-2-bg:#DDF1EE; --av-2-fg:#0E5E57;
    --av-3-bg:#E4E6FA; --av-3-fg:#3A3F9B;
    --av-4-bg:#E8EBF0; --av-4-fg:#3D4A5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;
    min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }
  body.app-loading .agent-shell{display:none !important;}
  body.ax-locked{overflow:hidden;}
  button{font-family:inherit;color:inherit;}
  a{color:inherit;text-decoration:none;}
  .icon{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .m{font-family:var(--font-money);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .ax-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .agent-shell{max-width:520px;margin:0 auto;position:relative;min-height:100vh;}
  .ax-view{padding-top:var(--safe-t);padding-bottom:calc(104px + var(--safe-b));}
  #ag_todayView{padding-top:0;}
  .ax-view[hidden]{display:none;}

  /* ---- generic pieces ---- */
  .btn{
    all:unset;box-sizing:border-box;cursor:pointer;padding:13px 18px;border-radius:14px;font-size:15px;font-weight:700;
    text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;
  }
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:active{background:var(--accent-dark);}
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:var(--bad);color:#fff;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.45;cursor:default;}
  .btn .icon{width:18px;height:18px;}

  .ax-iconbtn{
    all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;flex:none;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .ax-iconbtn.on-navy{background:rgba(255,255,255,.1);border:none;color:#fff;}
  .ax-iconbtn .icon{width:20px;height:20px;}

  .ax-av{
    width:40px;height:40px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;background:var(--av-4-bg);color:var(--av-4-fg);
  }
  .ax-av.sm{width:32px;height:32px;font-size:12px;}
  .ax-av.lg{width:52px;height:52px;font-size:17px;}
  .ax-av.t0{background:var(--av-0-bg);color:var(--av-0-fg);}
  .ax-av.t1{background:var(--av-1-bg);color:var(--av-1-fg);}
  .ax-av.t2{background:var(--av-2-bg);color:var(--av-2-fg);}
  .ax-av.t3{background:var(--av-3-bg);color:var(--av-3-fg);}
  .ax-av.t4{background:var(--av-4-bg);color:var(--av-4-fg);}
  .ax-ringav{position:relative;width:44px;height:44px;flex:none;}
  .ax-ringav svg{position:absolute;inset:0;}
  .ax-ringav .ax-av{position:absolute;inset:5px;width:auto;height:auto;font-size:13px;}

  .ax-pill{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;}
  .ax-pill.good{background:var(--good-bg);color:var(--good);}
  .ax-pill.warn{background:var(--warn-bg);color:var(--warn-ink);}
  .ax-pill.bad{background:var(--bad-bg);color:var(--bad);}
  .ax-pill.soft{background:var(--tile);color:var(--ink-soft);}
  .ax-pill .icon{width:14px;height:14px;stroke-width:2.2;}
  .ax-earn{font-family:var(--font-money);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--good);background:var(--good-bg);padding:5px 8px;border-radius:8px;white-space:nowrap;}
  .ax-earn.none{color:var(--warn-ink);background:var(--warn-bg);}
  .ax-earn.loss{color:var(--bad);background:var(--bad-bg);}

  .ax-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;}
  .ax-sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px;}
  .ax-sec h2{margin:0;font-size:17px;font-weight:700;}
  .ax-sec .n{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .ax-empty{padding:22px 16px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .ax-gap{height:12px;}

  /* ---- banners ---- */
  .ag-offline-banner,.ag-paused-banner{
    display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;font-weight:600;line-height:1.35;
  }
  .ag-offline-banner{background:var(--warn-bg);color:var(--ink);}
  .ag-offline-banner .icon{color:var(--bonus);}
  .ag-paused-banner{background:var(--navy);color:#fff;}
  .ag-paused-banner .icon{color:var(--mint);}

  /* ---- the tab bar: Today, the one red button, Clients ---- */
  .ax-tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);
    display:grid;grid-template-columns:1fr 96px 1fr;align-items:start;padding:8px 0 calc(8px + var(--safe-b));
    max-width:520px;margin:0 auto;
  }
  .ax-tabbar[hidden]{display:none;}
  .ax-tab{
    all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    min-height:52px;padding:0 8px;color:var(--ink-soft);font-size:12px;font-weight:600;position:relative;
  }
  .ax-tab .icon{width:24px;height:24px;}
  .ax-tab.active{color:var(--ink);font-weight:700;}
  .ax-tab.active .icon{fill:currentColor;}
  .ax-tab.active .icon .nf{fill:none;}
  .ax-plus{
    all:unset;box-sizing:border-box;cursor:pointer;justify-self:center;margin-top:-26px;width:64px;height:64px;border-radius:999px;
    background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(201,58,48,.35);border:4px solid var(--bg);position:relative;
  }
  .ax-plus .icon{width:28px;height:28px;stroke-width:2.4;}
  .ax-plus .badge{
    position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--navy);
    color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);
  }
  .ax-plus .badge[hidden]{display:none;}

  /* ================= TODAY ================= */
  .ax-hero{background:var(--navy);border-radius:0 0 28px 28px;padding:calc(18px + var(--safe-t)) 20px 26px;display:flex;flex-direction:column;gap:18px;color:#fff;}
  .ax-hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .ax-hero-day{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;}
  .ax-live{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:600;color:var(--on-navy);}
  .ax-live i{width:7px;height:7px;border-radius:999px;background:var(--mint);animation:axPulse 2s infinite;}
  .ax-live.off i{background:#F5B26B;animation:none;}
  @keyframes axPulse{0%{box-shadow:0 0 0 0 rgba(111,220,176,.6)}70%{box-shadow:0 0 0 7px rgba(111,220,176,0)}100%{box-shadow:0 0 0 0 rgba(111,220,176,0)}}
  .ax-me{
    all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;border-radius:999px;background:var(--navy-2);color:#fff;
    font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .ax-ring-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:20px;width:100%;}

  .ax-faces.dots{align-items:center;}

  .ax-faces.dots i.t1{background:var(--av-1-bg);}

  .ax-faces.dots i.t3{background:var(--av-3-bg);}

  .ax-nk-h{display:flex;align-items:center;gap:8px;padding:6px 4px 0;font-size:17px;font-weight:700;}

  .ax-nk-h b{font-family:var(--font-money);font-size:13px;font-weight:600;color:var(--ink-faint);}
  .ax-nk-h i{flex:none;}
  .ax-nk{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:60px;padding:0 8px 0 10px;border-radius:16px;background:var(--panel);
    box-shadow:0 1px 2px rgba(22,32,60,.05),inset 0 0 0 1px var(--line);}

  /* Day blocks: one block a day since their last order. Grey for the days

    display:flex;align-items:center;justify-content:center;touch-action:none;animation:axNudge 1.6s ease-in-out infinite;
  }
  .ag-knob .icon{width:22px;height:22px;stroke-width:2.4;color:#fff;}
  .ag-knob[disabled]{background:#59627A;animation:none;cursor:default;}
  .ax-slide.busy .ag-knob{animation:none;}
  @keyframes axNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
  .ag-submit-blocked{font-size:12px;font-weight:600;color:var(--on-navy);text-align:center;}

  /* ================= FIND ================= */
  .ax-find{padding:14px 16px calc(110px + var(--safe-b));display:flex;flex-direction:column;gap:12px;}
  .ax-find-top{display:flex;align-items:center;gap:8px;}
  .ax-find-q{flex:1;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);}
  .ax-find-q input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;color:var(--ink);}
  .ax-find-q input::-webkit-search-cancel-button{-webkit-appearance:none;}
  .ax-find-x{all:unset;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
  .ax-find-x[hidden]{display:none;}
  .ax-cats{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;}
  .ax-cats::-webkit-scrollbar{display:none;}
  .ax-catpill{
    all:unset;box-sizing:border-box;cursor:pointer;flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 6px;
    border-radius:999px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;
  }
  .ax-catpill .ic{width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;}
  .ax-catpill .ic .icon{width:18px;height:18px;}
  .ax-catpill .icon.ch{width:16px;height:16px;stroke-width:2.2;}
  .ax-vr{width:1px;height:24px;background:var(--ow-steel-100);flex:none;}
  .ax-sub{
    all:unset;box-sizing:border-box;cursor:pointer;flex:none;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-soft);font-size:13px;font-weight:600;display:flex;align-items:center;
  }
  .ax-sub.on{border:2px solid var(--ink);color:var(--ink);font-weight:700;}
  .ax-find-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .ax-find-meta .c{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .ax-find-meta .c b{font-family:var(--font-money);color:var(--ink);font-weight:600;}
  .ax-flt{display:flex;gap:6px;}
  .ax-flt button{
    all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }
  .ax-flt button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;}
  .ax-flt .icon{width:18px;height:18px;}
  .ax-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .ax-pt{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;}
  .ax-pt.in{border:2px solid var(--ink);}
  .ax-pt-im{all:unset;box-sizing:border-box;height:88px;background:linear-gradient(150deg,var(--ai-s) 0%,#fff 170%);display:flex;align-items:center;justify-content:center;position:relative;color:var(--ai);cursor:zoom-in;}
  .ax-pt-im img{width:100%;height:100%;object-fit:cover;}
  .ax-pt-im .icon{width:40px;height:40px;stroke-width:1.5;}
  .ax-pt-tag{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;}
  .ax-pt-tag.in{background:var(--ink);color:#fff;}
  .ax-pt-tag.zero{background:var(--warn-bg);color:var(--warn-ink);font-family:var(--font-money);}
  .ax-pt-tag.loss{background:var(--bad-bg);color:var(--bad);font-family:var(--font-money);}
  .ax-pt-tag.bonus{background:var(--warn-bg);color:var(--warn-ink);}
  .ax-pt-tag.buys{background:var(--panel);color:var(--ink);}
  .ax-pt-tag .icon{width:12px;height:12px;stroke-width:2.4;}
  .ax-pt-star{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;top:2px;right:2px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
  .ax-pt-star .icon{width:20px;height:20px;}
  .ax-pt-star.on{color:var(--warn);}
  .ax-pt-star.on .icon{fill:currentColor;}
  .ax-pt-b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .ax-pt-n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-pt-p{display:flex;align-items:baseline;gap:4px;}
  .ax-pt-p .v{font-family:var(--font-money);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;letter-spacing:-.02em;}
  .ax-pt-p .u{font-size:11px;font-weight:600;color:var(--ink-faint);}
  .ax-pt-p .e{margin-left:auto;font-family:var(--font-money);font-size:11px;font-weight:600;color:var(--good);}
  .ax-var{
    all:unset;box-sizing:border-box;cursor:pointer;width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    font-size:12px;font-weight:600;color:var(--ink);padding:0 8px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:4px;
  }
  .ax-var span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ax-var .icon{width:15px;height:15px;flex:none;color:var(--ink-soft);}
  .ax-vs{padding:0 18px 4px;display:flex;flex-direction:column;gap:16px;}
  .ax-vs-h{display:flex;align-items:center;gap:14px;}
  .ax-vs-h .ax-th{width:64px;height:64px;border-radius:14px;}
  .ax-vs-h .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .ax-vs-h .n{font-size:18px;font-weight:700;}
  .ax-vs-h .p{font-family:var(--font-money);font-size:15px;font-weight:600;}
  .ax-vs-h .p small{font-size:12px;color:var(--ink-faint);font-weight:500;}
  .ax-vs-row{display:flex;flex-wrap:wrap;gap:8px;}
  .ax-vs-c{all:unset;box-sizing:border-box;cursor:pointer;height:44px;min-width:56px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);
    font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .ax-vs-c.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .ax-vs-c.far{border-style:dashed;border-color:#D8D3CA;color:#A3A9B5;}
  .ax-vs-foot{display:flex;align-items:center;gap:10px;padding-top:4px;}
  .ax-vs-foot .ax-useg{flex:none;width:132px;}
  .ax-vs-foot .btn{flex:1;height:52px;font-size:16px;}
  .ax-vs-foot .btn b{font-family:var(--font-money);font-weight:600;margin-left:6px;}
  .ax-pt-a{display:flex;align-items:center;gap:6px;margin-top:auto;}
  .ax-useg{flex:1;display:flex;padding:3px;border-radius:12px;background:var(--tile);min-width:0;}
  .ax-useg button{
    all:unset;box-sizing:border-box;cursor:pointer;flex:1;height:38px;border-radius:9px;text-align:center;font-size:12px;font-weight:600;color:var(--ink-faint);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ax-useg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(27,36,56,.12);font-weight:700;color:var(--ink);}
  .ax-useg.one{background:transparent;justify-content:flex-start;}
  .ax-useg.one span{font-size:12px;font-weight:600;color:var(--ink-faint);padding-left:4px;align-self:center;}
  .ax-add{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;flex:none;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;}
  .ax-add .icon{width:18px;height:18px;stroke-width:2.4;}
  .ax-add.busy{opacity:.5;}
  .ax-instep{display:flex;align-items:center;justify-content:space-between;height:44px;border-radius:999px;background:var(--ink);color:#fff;padding:0 3px;width:100%;}
  .ax-instep button{all:unset;box-sizing:border-box;cursor:pointer;width:38px;height:38px;border-radius:999px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}
  .ax-instep button .icon{width:16px;height:16px;stroke-width:2.4;}
  .ax-instep b{font-family:var(--font-money);font-size:15px;font-weight:600;}
  .ax-instep b span{font-family:var(--font-sans);font-size:11px;color:var(--on-navy);margin-left:3px;}
  .ax-more{grid-column:1/-1;}
  .ax-fade{position:fixed;left:0;right:0;bottom:0;height:120px;background:linear-gradient(180deg,rgba(247,245,242,0),var(--bg) 45%);pointer-events:none;z-index:20;}
  .ax-done{
    all:unset;box-sizing:border-box;cursor:pointer;position:fixed;left:16px;right:16px;bottom:calc(20px + var(--safe-b));z-index:30;max-width:488px;margin:0 auto;
    display:flex;align-items:center;gap:10px;height:60px;padding:0 8px;border-radius:999px;background:var(--navy);color:#fff;box-shadow:var(--shadow);
  }
  .ax-done .ax-av{width:44px;height:44px;}
  .ax-done .b{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0;}
  .ax-done .b .t{font-family:var(--font-money);font-size:16px;font-weight:600;}
  .ax-done .b .e{font-family:var(--font-money);font-size:12px;font-weight:600;color:var(--mint);}
  .ax-done .go{height:44px;padding:0 18px;border-radius:999px;background:#fff;color:var(--navy);font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;}
  .ax-done .go .icon{width:16px;height:16px;stroke-width:2.2;}

  /* ================= SHEETS =================
     Everything that is about ONE thing -- an order, a client, your money --
     comes up over the screen you were on rather than replacing it. */
  .ax-scrim{position:fixed;inset:0;z-index:60;background:rgba(12,19,38,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:axFade .18s ease-out;}
  .ax-sheet{
    width:100%;max-width:520px;max-height:calc(100vh - 44px - var(--safe-t));overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;
    padding-bottom:calc(20px + var(--safe-b));animation:axUp .24s cubic-bezier(.2,.8,.2,1);
  }
  .ax-sheet.white{background:var(--panel);}
  .ax-sheet.full{height:calc(100vh - 24px - var(--safe-t));height:calc(100dvh - 24px - var(--safe-t));max-height:none;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.35);}
  .ax-sheet.full > *{flex-shrink:0;}
  .ax-sheet.full > .ax-sheet-pad{flex:1 0 auto;}
  .ax-sheet.full .ax-acts{margin-top:auto;}
  @keyframes axUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes axFade{from{opacity:0}to{opacity:1}}
  .ax-grab{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;height:24px;position:relative;}
  .ax-grab::before{content:'';position:absolute;left:50%;top:10px;width:40px;height:5px;margin-left:-20px;border-radius:999px;background:var(--dash);}
  .ax-sheet-top{background:var(--navy);color:#fff;border-radius:26px 26px 22px 22px;padding:0 18px 20px;display:flex;flex-direction:column;gap:16px;}
  .ax-sheet-top .ax-grab::before{background:rgba(255,255,255,.25);}
  .ax-sheet-h{display:flex;align-items:center;gap:12px;min-width:0;}
  .ax-sheet-h .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-sheet-h .n{font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ax-sheet-h .s{font-size:13px;color:var(--on-navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ax-sheet-pad{padding:16px;display:flex;flex-direction:column;gap:12px;}
  .ax-sheet-title{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 4px;}
  .ax-sheet-title h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;}

  /* ---- Track ---- */
  .ax-state{display:flex;align-items:center;gap:12px;}
  .ax-state-ic{width:48px;height:48px;flex:none;border-radius:14px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:var(--mint);}
  .ax-state-ic.warn{background:rgba(245,178,107,.16);color:#F5B26B;}
  .ax-state-ic .icon{width:24px;height:24px;}
  .ax-state .b{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .ax-state .t{font-size:22px;font-weight:700;letter-spacing:-.01em;}
  .ax-state .s{font-size:13px;color:var(--on-navy);}
  .ax-track{display:flex;flex-direction:column;gap:6px;}
  .ax-track-r{display:grid;grid-template-columns:repeat(6,1fr);align-items:center;position:relative;}
  .ax-track-r::before{content:'';position:absolute;left:8%;right:8%;top:15px;height:2px;background:rgba(255,255,255,.14);}
  .ax-track-r .bar{position:absolute;left:8%;top:15px;height:2px;background:var(--mint);}
  .ax-st{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:1;}
  .ax-st i{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--navy-2);color:var(--on-navy);border:2px solid var(--navy);}
  .ax-st i .icon{width:15px;height:15px;stroke-width:2.2;}
  .ax-st.done i{background:var(--mint);color:var(--navy);}
  .ax-st.now i{background:#fff;color:var(--navy);box-shadow:0 0 0 4px rgba(111,220,176,.35);}
  .ax-st.now.warn i{box-shadow:0 0 0 4px rgba(245,178,107,.4);}
  .ax-st.skip i{background:transparent;border:2px dashed rgba(255,255,255,.25);}
  .ax-st em{font-style:normal;font-size:11px;font-weight:600;color:var(--on-navy);height:13px;}
  .ax-track-l{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;font-size:11px;font-weight:600;color:var(--on-navy);}
  .ax-track-l .on{color:#fff;font-weight:700;}
  .ax-money{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:16px;overflow:hidden;border:1px solid var(--line);}
  .ax-money > div{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:3px;}
  .ax-money .k{font-size:11px;font-weight:700;color:var(--ink-faint);}
  .ax-money .v{font-family:var(--font-money);font-size:18px;font-weight:600;letter-spacing:-.02em;}
  .ax-money .v.good{color:var(--good);}
  .ax-money .v.bad{color:var(--bad);}
  .ax-money s{font-family:var(--font-money);font-size:12px;color:var(--ink-faint);}
  .ax-gets{padding:4px 14px;}
  .ax-gets-h{display:flex;align-items:center;justify-content:space-between;padding:10px 0 4px;}
  .ax-gets-h span{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .ax-gets-h .cnt{display:flex;gap:6px;}
  .ax-gl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .ax-gl:first-of-type{border-top:none;}
  .ax-gl .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-gl .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ax-gl .q{font-family:var(--font-money);font-size:12px;color:var(--ink-soft);}
  .ax-gl.gone .nm,.ax-gl.gone .q{text-decoration:line-through;color:var(--ink-faint);}
  .ax-mk{width:26px;height:26px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;}
  .ax-mk.wait{border:2px dashed var(--dash);}
  .ax-mk.ok{background:var(--good);color:#fff;}
  .ax-mk.no{background:var(--bad-bg);color:var(--bad);}
  .ax-mk .icon{width:14px;height:14px;stroke-width:3;}
  .ax-acts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;}
  .ax-act{
    all:unset;box-sizing:border-box;cursor:pointer;height:56px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink);
  }
  .ax-act .icon{width:20px;height:20px;}
  .ax-act[aria-disabled="true"]{opacity:.4;pointer-events:none;}
  .ax-counter{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--good-bg);color:var(--good);}
  .ax-counter .icon{width:28px;height:28px;}
  .ax-counter .b{flex:1;display:flex;flex-direction:column;gap:2px;}
  .ax-counter .k{font-size:12px;font-weight:700;}
  .ax-counter .v{font-family:var(--font-money);font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--ink);}
    all:unset;box-sizing:border-box;cursor:pointer;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink-soft);
  }

  /* ---- Sent ---- */
  .ax-sent{position:fixed;inset:0;z-index:70;background:var(--navy);color:#fff;display:flex;flex-direction:column;overflow-y:auto;animation:axFade .2s ease-out;}
  .ax-sent-in{max-width:520px;width:100%;margin:0 auto;padding:calc(16px + var(--safe-t)) 20px calc(24px + var(--safe-b));display:flex;flex-direction:column;gap:22px;flex:1;}
  .ax-sent-top{display:flex;justify-content:space-between;}
  .ax-sent-hero{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-top:8px;}
  .ax-sent-ok{width:84px;height:84px;border-radius:999px;background:var(--mint);color:var(--navy);display:flex;align-items:center;justify-content:center;animation:axPop .4s cubic-bezier(.2,1.4,.4,1);}
  .ax-sent-ok .icon{width:40px;height:40px;stroke-width:2.6;}
  @keyframes axPop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  .ax-sent-hero .t{font-size:30px;font-weight:700;letter-spacing:-.02em;}
  .ax-sent-who{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;background:rgba(255,255,255,.08);}
  .ax-sent-who .nm{font-size:14px;font-weight:700;}
  .ax-sent-who .v{font-family:var(--font-money);font-size:14px;color:var(--on-navy);}
  .ax-next{background:rgba(255,255,255,.06);border-radius:20px;padding:16px;display:flex;flex-direction:column;}
  .ax-next .h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--on-navy);margin-bottom:12px;}
  .ax-ns{display:flex;align-items:center;gap:12px;}
  .ax-ns i{width:40px;height:40px;flex:none;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:var(--on-navy);}
  .ax-ns i .icon{width:20px;height:20px;}
  .ax-ns.now i{background:var(--mint);color:var(--navy);}
  .ax-ns .b{flex:1;display:flex;flex-direction:column;gap:2px;}
  .ax-ns .t{font-size:15px;font-weight:600;}
  .ax-ns .s{font-size:12px;font-weight:600;color:var(--on-navy);}
  .ax-ns.now .s{color:var(--mint);}
  .ax-ns-gap{width:2px;height:14px;margin-left:19px;background:rgba(255,255,255,.14);}
  .ax-alert{all:unset;box-sizing:border-box;cursor:pointer;align-self:flex-start;display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;background:rgba(111,220,176,.16);color:var(--mint);font-size:12px;font-weight:700;}
  .ax-alert .icon{width:14px;height:14px;}
  .ax-sent-earn{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .ax-sent-earn .v{font-family:var(--font-money);font-size:28px;font-weight:600;color:var(--mint);}
  .ax-sent-earn .k{font-size:12px;font-weight:600;color:var(--on-navy);}
  .ax-sent .btn-light{background:#fff;color:var(--navy);}

  /* ================= CLIENTS ================= */
  .ax-page-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 8px;}
  .ax-page-h h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px;}
  .ax-page-h h1 span{font-family:var(--font-money);font-size:16px;font-weight:500;color:var(--ink-soft);}
  .ax-link{
    all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700;
  }
  .ax-link .icon{width:17px;height:17px;}
  .ax-clients{padding:0 16px;display:flex;flex-direction:column;gap:10px;}
  .ax-cq{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);}
  .ax-cq input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;color:var(--ink);}
  .ax-fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;}
  .ax-fchips::-webkit-scrollbar{display:none;}
  .ax-fchips button{
    all:unset;box-sizing:border-box;cursor:pointer;flex:none;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
    font-size:13px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:6px;
  }
  .ax-fchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;}
  .ax-fchips .dot{width:8px;height:8px;border-radius:999px;background:var(--warn);}
  .ax-fchips .dot.q{background:var(--dash);}
  .ax-fchips b{font-family:var(--font-money);font-weight:600;}
  .ax-fchips .icon{width:15px;height:15px;}
  .ax-sec .ag-inquiry-count{color:var(--warn);font-weight:600;}
  .ag-inquiry-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;}
  .ag-inquiry-card.handled{opacity:.6;}
  .ag-inquiry-top{display:flex;align-items:center;gap:10px;}
  .ag-inquiry-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ag-inquiry-name{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ag-inquiry-meta{font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ag-inquiry-acts{display:flex;gap:8px;}
  .ag-inquiry-acts .btn{min-height:44px;padding:0 14px;font-size:14px;flex:1;}
  .ag-inquiry-done{
    all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }
  .ag-inquiry-done .icon{width:18px;height:18px;stroke-width:2.2;}
  .ag-inquiry-card.handled .ag-inquiry-done{background:var(--good);border-color:var(--good);color:#fff;}
  .ax-cr{
    all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--panel);
    border:1px solid var(--line);width:100%;
  }
  .ax-cr .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-cr .nm{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ax-cr .st{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;color:var(--ink-faint);}
  .ax-cr .st.late{color:var(--warn);}
  .ax-cr .st.due{color:var(--good);}
  .ax-cr .st.live{color:#1A5A8A;}
  .ax-cr .st .icon{width:13px;height:13px;stroke-width:2.2;}
  .ax-cr .v{font-family:var(--font-money);font-size:14px;font-weight:600;color:var(--good);}
  .ax-cr.add{border-style:dashed;}
  .ax-cr.add .ax-av{background:var(--tile);color:var(--ink);}

  /* ---- Client sheet ---- */
  .ax-rhythm{background:rgba(255,255,255,.06);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .ax-rhythm .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:600;color:var(--on-navy);}
  .ax-rhythm .h b{color:#F5B26B;font-weight:700;}
  .ax-rhythm .h b.good{color:var(--mint);}
  .ax-rhythm .ax-days-r span{background:rgba(255,255,255,.18);}
  .ax-rhythm .ax-days-r span.late{background:#F5B26B;}
  .ax-rhythm .ax-days-r span.due{background:var(--mint);}
  .ax-rhythm .ax-days-r span.ahead{background:transparent;border-color:rgba(255,255,255,.18);}
  .ax-rhythm .ax-days-r i{background:#fff;}
  .ax-rhythm .ax-days-l{color:var(--on-navy);}
  .ax-rhythm .ax-days-l .late{color:#F5B26B;}
  .ax-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.1);border-radius:14px;overflow:hidden;}
  .ax-stats > div{background:var(--navy);padding:10px 8px;display:flex;flex-direction:column;gap:2px;text-align:center;}
  .ax-stats .k{font-size:11px;font-weight:600;color:var(--on-navy);}
  .ax-stats .v{font-family:var(--font-money);font-size:17px;font-weight:600;}
  .ax-stats .v.good{color:var(--mint);}
  .ax-ur{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;}
  .ax-ur:first-of-type{border-top:none;}
  .ax-ur .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .ax-ur .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ax-freq{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink-faint);}
  .ax-freq .bar{flex:1;max-width:90px;height:5px;border-radius:999px;background:var(--tile);overflow:hidden;}
  .ax-freq .bar i{display:block;height:100%;background:var(--good);border-radius:999px;}
  .ax-ur .q{font-family:var(--font-money);font-size:14px;font-weight:600;}
  .ax-ur .q span{font-family:var(--font-sans);font-size:12px;color:var(--ink-soft);margin-left:3px;}
  .ax-po{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;}
  .ax-po:first-of-type{border-top:none;}
  .ax-date{width:44px;height:44px;flex:none;border-radius:12px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;}
  .ax-date b{font-family:var(--font-money);font-size:16px;font-weight:600;}
  .ax-date span{font-size:11px;font-weight:600;color:var(--ink-faint);}
  .ax-po .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-po .t{font-family:var(--font-money);font-size:15px;font-weight:600;}
  .ax-po .s{font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ax-po .e{font-family:var(--font-money);font-size:13px;font-weight:600;color:var(--good);}
  .ax-cta-dock{position:sticky;bottom:0;padding:12px 16px calc(12px + var(--safe-b));background:linear-gradient(180deg,rgba(247,245,242,0),var(--bg) 30%);}

  /* ---- Money ---- */
  .ax-mnav{display:flex;align-items:center;gap:4px;}
  .ax-mnav span{font-size:15px;font-weight:700;min-width:90px;text-align:center;}
  .ax-big{display:flex;flex-direction:column;gap:6px;}
  .ax-big .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--on-navy);}
  .ax-big .v{font-family:var(--font-money);font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1;}
  .ax-goalbtn{all:unset;box-sizing:border-box;cursor:pointer;align-self:flex-start;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600;color:var(--on-navy);}
  .ax-goalbtn b{font-family:var(--font-money);color:#fff;font-weight:600;}
  .ax-goalbtn .icon{width:15px;height:15px;}
  .ax-split{display:flex;flex-direction:column;gap:8px;}
  .ax-split-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.1);}
  .ax-split-bar i{display:block;height:100%;}
  .ax-split-bar .mg{background:#fff;}
  .ax-split-bar .bn{background:#F5B26B;}
  .ax-split-l{display:flex;gap:16px;font-size:12px;font-weight:600;color:var(--on-navy);}
  .ax-split-l span{display:flex;align-items:center;gap:6px;}
  .ax-split-l i{width:8px;height:8px;border-radius:999px;}
  .ax-split-l b{font-family:var(--font-money);color:#fff;font-weight:600;}
  .ax-bars{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:140px;padding-top:20px;}
  .ax-bar{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-height:44px;}
  .ax-bar .v{font-family:var(--font-money);font-size:11px;font-weight:600;color:var(--ink-faint);}
  .ax-bar .b{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:#D5D9E2;}
  .ax-bar .none{width:100%;max-width:34px;height:2px;background:var(--dash);}
  .ax-bar.sel .b{background:var(--navy);}
  .ax-bar.sel .v{color:var(--ink);}
  .ax-bars-x{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;text-align:center;font-size:11px;font-weight:600;color:var(--ink-faint);margin-top:6px;}
  .ax-bars-x .sel{color:var(--ink);font-weight:700;}
  .ax-tline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--accent);pointer-events:none;}
  .ax-tline span{position:absolute;right:0;top:-18px;font-family:var(--font-money);font-size:11px;font-weight:600;color:var(--accent);background:var(--panel);padding:0 4px;}
  .ax-claim{display:flex;align-items:center;gap:12px;padding:12px 14px;}
  .ax-claim .ic{width:40px;height:40px;border-radius:12px;background:var(--warn-bg);color:var(--warn);display:flex;align-items:center;justify-content:center;flex:none;}
  .ax-claim .b{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .ax-claim .k{font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ax-claim .v{font-family:var(--font-money);font-size:18px;font-weight:600;}
  .ax-claim .btn{min-height:44px;padding:0 16px;font-size:14px;}
  .ax-claim .done{font-size:12px;font-weight:700;}
  .ax-standing{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ax-standing > div{padding:14px;display:flex;flex-direction:column;gap:8px;}
  .ax-rank{display:flex;align-items:baseline;gap:6px;}
  .ax-rank b{font-family:var(--font-money);font-size:32px;font-weight:600;letter-spacing:-.03em;}
  .ax-rank span{font-size:13px;font-weight:600;color:var(--ink-faint);}
  .ax-podium{display:flex;align-items:flex-end;gap:4px;height:34px;}
  .ax-podium i{flex:1;border-radius:4px 4px 0 0;background:var(--tile);}
  .ax-podium i.you{background:var(--accent);}
  .ax-streak{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--warn);}
  .ax-streak .icon{width:14px;height:14px;}
  .ax-mile{display:flex;align-items:center;gap:12px;}
  .ax-mile .ring{position:relative;width:56px;height:56px;flex:none;}
  .ax-mile .ring .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .ax-mile .ring .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .ax-mile .b{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .ax-mile .v{font-family:var(--font-money);font-size:16px;font-weight:600;}
  .ax-mile .k{font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ax-mo{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .ax-mo:first-of-type{border-top:none;}
  .ax-mo .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-mo .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ax-mo .s{font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ax-mo .v{font-family:var(--font-money);font-size:14px;font-weight:600;color:var(--good);text-align:right;}
  .ax-mo .v small{display:block;font-size:11px;color:var(--ink-faint);font-weight:500;}
  .ax-acct{display:flex;align-items:center;gap:12px;padding:12px 14px;}
  .ax-acct .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .ax-acct .nm{font-size:15px;font-weight:700;}
  .ax-acct .s{font-size:12px;font-weight:600;color:var(--ink-faint);display:flex;align-items:center;gap:6px;}
  .ax-acct .s i{width:8px;height:8px;border-radius:999px;background:var(--good);}
  .ag-sync-card.warn{border-color:var(--warn);background:var(--warn-bg);}
  .ag-sync-card.warn .s i{background:var(--warn);}
  .ax-acct .btn{min-height:44px;padding:0 14px;font-size:13px;}
  .ax-term{display:flex;align-items:center;gap:12px;padding:12px 14px;}
  .ax-term .ic{width:40px;height:40px;border-radius:12px;background:var(--tile);display:flex;align-items:center;justify-content:center;flex:none;}
  .ax-term .b{display:flex;flex-direction:column;gap:2px;}
  .ax-term .t{font-size:14px;font-weight:700;}
  .ax-term .s{font-size:12px;font-weight:600;color:var(--ink-faint);}

  /* ---- form sheets: new client, goal, shop link, confirm ---- */
  .ax-form{padding:8px 20px 4px;display:flex;flex-direction:column;gap:12px;}
  .ax-field{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);}
  .ax-field .icon{color:var(--ink-soft);}
  .ax-field input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;color:var(--ink);}
  .ax-said{font-size:13px;line-height:1.45;color:var(--ink-soft);margin:0;}
  .ax-said b{color:var(--ink);font-family:var(--font-money);font-weight:600;}
  .ax-ghead{display:flex;flex-direction:column;gap:2px;}
  .ax-ghead b{font-size:20px;font-weight:800;}
  .ax-ghead small{font-size:13px;font-weight:600;color:var(--on-navy);}
  .ax-gnow{display:flex;flex-direction:column;gap:4px;margin-top:4px;}
  .ax-gnow .v{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1;}
  .ax-gnow .of{font-size:15px;font-weight:600;color:var(--on-navy);}
  .ax-gbar{height:14px;margin-top:16px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;}
  .ax-gbar i{display:block;height:100%;min-width:14px;border-radius:999px;background:#fff;transition:width .3s;}
  .ax-gbar.done i{background:var(--mint);}
  .ax-gsay{margin-top:14px;font-size:15px;font-weight:700;color:var(--on-navy);}
  .ax-gsay.good{color:var(--mint);}
  .ax-gsay.warn{color:#F5B26B;}
  .ax-gset{padding:16px;display:flex;flex-direction:column;gap:12px;}
  .ax-gfield{display:flex;flex-direction:column;gap:8px;cursor:text;}
  .ax-gfield .k{font-size:15px;font-weight:800;}
  .ax-gfield .in{display:flex;align-items:center;gap:8px;height:56px;padding:0 6px 0 14px;box-sizing:border-box;border-radius:14px;border:2px solid var(--navy);background:var(--panel);}
  .ax-gfield .in:focus-within{box-shadow:0 0 0 4px rgba(22,32,60,.14);}
  .ax-gfield .cur{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .ax-gfield input{all:unset;flex:1;min-width:0;height:44px;font-size:22px;font-weight:600;color:var(--ink);}
  .ax-gfield .pen{width:44px;height:44px;flex:none;border-radius:10px;background:var(--tile);color:var(--navy);display:flex;align-items:center;justify-content:center;}
  .ax-gfield .pen .icon{width:18px;height:18px;stroke-width:2.2;}
  .ax-gchips{display:flex;gap:8px;}
  .ax-gchips button{all:unset;box-sizing:border-box;cursor:pointer;flex:1;height:48px;border-radius:999px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;gap:6px;}
  .ax-gchips .l{font-size:14px;font-weight:600;color:var(--ink-soft);}
  .ax-gchips .v{font-size:14px;font-weight:600;color:var(--ink);}
  .ax-gchips button.on{background:var(--navy);border-color:var(--navy);}
  .ax-gchips button.on .l,.ax-gchips button.on .v{color:#fff;}
  .ax-gdue{padding:16px 16px 4px;display:flex;flex-direction:column;gap:6px;}
  .ax-gdue .h{font-size:15px;font-weight:800;}
  .ax-grows{display:flex;flex-direction:column;}
  .ax-grow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:58px;width:100%;}
  .ax-grow + .ax-grow{border-top:1px solid var(--tile);}
  .ax-grow .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-grow .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-grow .s{font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ax-grow .s.warn{color:var(--warn);font-weight:700;}
  .ax-grow .s.good{color:var(--good);font-weight:700;}
  .ax-grow .v{font-family:var(--font-money);font-size:15px;font-weight:600;color:var(--good);}
  .ax-grow .go{width:36px;height:36px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
  .ax-grow .go .icon{width:16px;height:16px;stroke-width:2.4;}
  .ax-cp-list{display:flex;flex-direction:column;gap:8px;}
  .ax-cp-h{display:flex;align-items:center;gap:8px;padding:6px 2px 0;font-size:14px;font-weight:700;}
  .ax-cp-h span{flex:1;}
  .ax-cp-h .icon{width:18px;height:18px;color:var(--ink-soft);}
  .ax-cp-h.open .icon{color:var(--warn);}
  .ax-cp-q{height:48px;}
  .ax-cp-q .icon{width:19px;height:19px;}
  .ax-cp-h b{font-family:var(--font-money);font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ax-cp-open{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:64px;padding:0 10px 0 12px;border-radius:18px;
    background:linear-gradient(150deg,#FFF8EE,#FDEBD3);box-shadow:inset 0 0 0 1px #F5D9B0;color:var(--ink);}
  .ax-cp-open .ax-av{width:38px;height:38px;font-size:12px;box-shadow:0 0 0 2px #FFF8EE,0 0 0 3.5px var(--warn);}
  .ax-cp-open .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-cp-open .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-cp-open .s{font-family:var(--font-money);font-size:12px;font-weight:600;color:var(--warn-ink);}
  .ax-cp-open .go{flex:none;height:40px;padding:0 14px;border-radius:999px;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .ax-cp-open .go .icon{width:14px;height:14px;}
  .ax-pickrow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:0 12px 0 10px;width:100%;min-height:60px;
    border-radius:16px;background:var(--panel);box-shadow:0 1px 2px rgba(22,32,60,.05),inset 0 0 0 1px var(--line);}
  .ax-pickrow.now{box-shadow:0 1px 2px rgba(22,32,60,.05),inset 0 0 0 1.5px var(--good);}
  .ax-pickrow .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-pickrow .nm{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ax-pickrow .s{font-size:12px;font-weight:600;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-pickrow .s.warn{color:var(--warn-ink);}
  .ax-pickrow .s.quiet{color:var(--bad,#8E2A22);}

  .ax-cp-ring b{position:relative;font-family:var(--font-money);font-size:11px;letter-spacing:-.03em;font-weight:600;color:var(--ink);}
  .ax-cp-none{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;font-size:14px;font-weight:600;color:var(--ink-faint);}
  .ax-cp-none .icon{width:18px;height:18px;}
  .ax-cp-ghost{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 14px;border-radius:16px;border:1.5px dashed #CFCAC0;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .ax-cp-ghost-avs{display:flex;}

  .ax-cp-ghost-avs i + i{transform:translateX(-8px);}

  .ax-cp-new{all:unset;box-sizing:border-box;cursor:pointer;position:sticky;bottom:8px;height:56px;border-radius:999px;background:var(--navy);color:#fff;
    font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(22,32,60,.22);margin-top:4px;}
  .ax-cp-new .icon{width:20px;height:20px;}
  .ax-linkbox{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:var(--tile);font-family:var(--font-money);font-size:13px;word-break:break-all;}
  .ax-confirm{font-size:14px;line-height:1.5;color:var(--ink-soft);margin:0;}

  .ax-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  /* browse the shop: four ways in, then every aisle */
  .ax-bt{display:flex;flex-direction:column;gap:2px;}
  .ax-bt h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;}
  .ax-bt .s{font-size:12px;font-weight:600;color:var(--ink-faint);}
  .ax-bt .s b{font-family:var(--font-money);font-weight:600;}
  .ax-bsearch{all:unset;box-sizing:border-box;cursor:text;height:48px;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);
    display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--ink-faint);font-size:14px;font-weight:500;}
  .ax-bsearch .icon{width:19px;height:19px;color:var(--ink-soft);}
  .ax-catgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .ax-cat{
    all:unset;box-sizing:border-box;cursor:pointer;position:relative;height:112px;border-radius:18px;background:var(--panel);
    box-shadow:0 1px 2px rgba(22,32,60,.06),inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px;min-width:0;
  }
  .ax-cat.on{background:linear-gradient(160deg,#243052,var(--navy));color:#fff;box-shadow:0 10px 24px rgba(22,32,60,.28);}
  .ax-cat .ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--ai-s) 0%,#fff 140%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);display:flex;align-items:center;justify-content:center;color:var(--ai);}
  .ax-cat .ic .icon{width:28px;height:28px;}
  .ax-cat.on .ic{background:rgba(111,220,176,.16);box-shadow:none;color:var(--mint);}
  .ax-cat .t{display:flex;flex-direction:column;gap:1px;min-width:0;width:100%;}
  .ax-cat .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ax-cat .n{font-family:var(--font-money);font-size:11px;color:var(--ink-faint);}

  .ax-cat .bn{position:absolute;top:8px;right:8px;height:18px;padding:0 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);font-size:11px;font-weight:700;display:flex;align-items:center;gap:3px;}
  .ax-cat .bn .icon{width:10px;height:10px;color:var(--warn);}
  .ax-quick{display:flex;flex-wrap:wrap;gap:8px;}
  .ax-q{
    all:unset;box-sizing:border-box;cursor:pointer;flex:none;height:44px;border-radius:999px;padding:0 6px 0 5px;
    display:flex;align-items:center;gap:7px;
  }
  .ax-q .ic{width:34px;height:34px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;}
  .ax-q .ic .icon{width:18px;height:18px;}
  .ax-q .nm{font-size:13px;font-weight:700;white-space:nowrap;}
  .ax-q .n{min-width:24px;height:24px;padding:0 7px;box-sizing:border-box;border-radius:999px;background:rgba(255,255,255,.7);font-family:var(--font-money);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .ax-q.navy{background:#E3E6EE;color:var(--ink);}

  .ax-q.amber{background:#FDEBD3;color:#7A4A02;}
  .ax-q.amber .ic{color:var(--warn);}
  .ax-q.green{background:#DDF1E6;color:var(--good);}
  .ax-q.green .ic{color:var(--good);}
  .ax-q.violet{background:#ECE7F7;color:#3E2F6E;}
  .ax-q.violet .ic{color:#5B4B8A;}
  .ax-q.on{box-shadow:inset 0 0 0 2px currentColor;}
  .ax-cat-n{font-family:var(--font-money);font-size:12px;font-weight:600;color:var(--ink-faint);}

  /* bundles: each one as what is in it */
  .ax-stk{display:flex;align-items:center;flex:none;}
  .ax-stk i{position:relative;width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(145deg,var(--ai-s) 0%,#fff 150%);color:var(--ai);
    box-shadow:0 0 0 2.5px var(--panel),0 2px 6px rgba(22,32,60,.10);display:flex;align-items:center;justify-content:center;}
  .ax-stk i + i{margin-left:-10px;}
  .ax-stk i .icon{width:23px;height:23px;}
  .ax-stk i.more{z-index:9;background:var(--navy);color:#fff;font-family:var(--font-money);font-style:normal;font-size:12px;font-weight:600;}
  .ax-bd{background:var(--panel);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;
    box-shadow:0 1px 2px rgba(22,32,60,.05),0 8px 20px rgba(22,32,60,.06),inset 0 0 0 1px var(--line);}
  .ax-bd-h{display:flex;align-items:center;gap:12px;}
  .ax-bd-h .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ax-bd-h .nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-bd-h .s{font-size:12px;font-weight:600;color:var(--ink-faint);white-space:nowrap;}
  .ax-bd-h .s b,.ax-bd-a .go b{font-family:var(--font-money);font-weight:600;}
  .ax-bd-h .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .ax-bd-h .r > b{font-family:var(--font-money);font-size:14px;font-weight:600;}
  .ax-bd-h .y{height:20px;padding:0 7px;border-radius:999px;background:var(--good-bg);color:var(--good);font-family:var(--font-money);font-size:11px;font-weight:600;display:flex;align-items:center;}
  .ax-bd-c{display:flex;gap:6px;overflow:hidden;}
  .ax-bd-c .ch{flex:none;height:28px;padding:0 9px 0 6px;border-radius:999px;background:var(--bg);font-size:12px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .ax-bd-c .ch .icon{width:15px;height:15px;color:var(--ai);}
  .ax-bd-c .ch b{font-family:var(--font-money);font-weight:600;color:var(--ink);}
  .ax-bd-c .ch.more{padding:0 9px;font-family:var(--font-money);}
  .ax-bd-gone{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--warn-ink);}
  .ax-bd-gone .icon{width:15px;height:15px;}
  .ax-bd-a{display:flex;gap:8px;}
  .ax-bd-a .go{all:unset;box-sizing:border-box;cursor:pointer;flex:1;height:44px;border-radius:14px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;}
  .ax-bd-a .go .icon{width:16px;height:16px;}
  .ax-bd-a .none{flex:1;height:44px;border-radius:14px;background:var(--tile);color:var(--ink-faint);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .ax-bd-a .ed{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;flex:none;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .ax-bd-a .ed .icon{width:18px;height:18px;}
  .ax-bd-ghost{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-radius:16px;border:1.5px dashed #CFCAC0;box-sizing:border-box;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .ax-bd-ghost .icon{width:20px;height:20px;color:#9AA1AE;}
  .ax-bs-pv{background:var(--panel);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;
    box-shadow:0 1px 2px rgba(22,32,60,.05),0 8px 20px rgba(22,32,60,.06),inset 0 0 0 1px var(--line);}
  .ax-bs-top{display:flex;align-items:center;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--tile);}

  .ax-bs-top .b{flex:1;display:flex;flex-direction:column;gap:2px;}
  .ax-bs-top .s{font-size:13px;font-weight:600;color:var(--ink-faint);}
  .ax-bs-top .s b{font-family:var(--font-money);font-weight:600;}
  .ax-bs-top .t{font-family:var(--font-money);font-size:18px;font-weight:600;letter-spacing:-.02em;}
  .ax-bs-li{display:flex;align-items:center;gap:10px;min-height:40px;}
  .ax-bs-li .sq{width:32px;height:32px;flex:none;border-radius:10px;background:linear-gradient(145deg,var(--ai-s) 0%,#fff 150%);color:var(--ai);display:flex;align-items:center;justify-content:center;}
  .ax-bs-li .sq .icon{width:19px;height:19px;}
  .ax-bs-li .nm{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ax-bs-li .q{font-family:var(--font-money);font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .ax-bs-li .x{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
  .ax-bs-li .x .icon{width:16px;height:16px;}
  .ax-bs-more{font-size:12px;font-weight:600;color:var(--ink-faint);padding-left:42px;}
  .ax-bs-name{height:56px;}
  .ax-bs-name:focus-within{box-shadow:inset 0 0 0 2px var(--ink);border-color:transparent;}
  .ax-bs-name .icon{width:20px;height:20px;color:#5B4B8A;}
  .ax-bs-ideas{display:flex;gap:6px;flex-wrap:wrap;}
  .ax-bs-ideas button{all:unset;box-sizing:border-box;cursor:pointer;height:44px;padding:0 14px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;}
  .ax-bs-save{all:unset;box-sizing:border-box;cursor:pointer;height:56px;border-radius:999px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(22,32,60,.22);margin-top:4px;}

  .ax-bs-save .icon{width:20px;height:20px;}
