/* ================= GOAL MILESTONES, CELEBRATED =================
   The goal is what an agent looks at while hunting for sales, so crossing
   a quarter, half or three quarters of it gets a moment of its own, and
   hitting it gets the big one. Each plays once, on this phone, the next
   time the screen is free -- after the order that did it is sent or
   completed and its sheet is closed. Only a goal the agent set counts:
   "your best month" is a yardstick, not a promise.

   A new month or a new goal starts quietly from where the agent already
   is -- nothing earlier is replayed -- except a goal already hit, which is
   worth seeing once. */
const GOAL_STEPS = [25, 50, 75, 100];
const GOAL_STEP_TITLE = { 25: 'A quarter of the way', 50: 'Halfway there', 75: 'Three quarters done' };

// The month's orders in the order they happened, earning as
// monthEarnings counts it, and the order that took the total over
// each milestone.
function goalTimeline(key, target){
  const orders = myOrders.filter(o=> !o.voided && o.date && String(o.date).startsWith(key)).slice()
    .sort((a, b)=> String(a.date).localeCompare(String(b.date)) || String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));
  let sum = 0;
  const at = {};
  for(const o of orders){
    const e = orderEarnings(o);
    const before = sum;
    sum += e.margin + (o.status === 'completed' ? e.bonus : 0);
    GOAL_STEPS.forEach(m=>{ if(!at[m] && target > 0 && sum >= target * m / 100) at[m] = { order: o, before }; });
  }
  return { at, orders, total: sum };
}
function goalStepReached(earned, target){
  return target > 0 ? (GOAL_STEPS.filter(s=> earned >= target * s / 100).pop() || 0) : 0;
}
function goalWinKey(monthKey){ return agentLocalKey(`agentGoalWin:${monthKey}`); }
function goalWinDue(){
  const p = monthPicture(new Date());
  if(!(p.target > 0)) return null;
  const m = goalStepReached(p.earned, p.target);
  let seen = null;
  try{ seen = JSON.parse(localStorage.getItem(goalWinKey(p.key)) || 'null'); }catch(_e){}
  const save = (mm)=>{ try{ localStorage.setItem(goalWinKey(p.key), JSON.stringify({ t: p.target, m: mm })); }catch(_e){} };
  if(!seen || seen.t !== p.target){
    if(!seen && m === 100) return { p, m, save };
    save(m);
    return null;
  }
  return m > seen.m ? { p, m, save } : null;
}
function maybeCelebrateGoal(){
  if(!myAgent || openSheets.length || document.body.classList.contains('app-loading')
    || document.querySelector('.ax-sent2, .ax-thanks, .ax-goalwin, .ag-auth')) return false;
  const due = goalWinDue();
  if(!due) return false;
  due.save(due.m);
  if(due.m === 100) openGoalDone(due.p);
  else openGoalStep(due.p, due.m);
  return true;
}
// Whatever was on screen has gone: a milestone first, else the one-time
// notifications ask.
function afterSheetsClosed(){
  if(maybeCelebrateGoal()) return;
  if(pushAskDue) maybeAskForPush();
}

function goalDay(o){
  const [y, m, d] = String(o && o.date || '').slice(0, 10).split('-').map(Number);
  return y ? new Date(y, m - 1, d) : null;
}
function goalDayLabel(o){
  const d = goalDay(o);
  if(!d) return '';
  const t = new Date();
  return d.toDateString() === t.toDateString() ? 'Today' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
// A point on the 270° arc the goal sheet uses, centre (120,118), r 96.
function goalArcPoint(f){
  const a = (135 + 270 * f) * Math.PI / 180;
  return [120 + 96 * Math.cos(a), 118 + 96 * Math.sin(a)];
}
function goalOverlay(cls, label, html){
  const el = document.createElement('div');
  el.className = `ax-goalwin ${cls}`;
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.setAttribute('aria-label', label);
  el.innerHTML = html;
  document.body.appendChild(el);
  if(window.owHaptic) owHaptic('success');
  const close = ()=>{
    if(!el.parentNode) return;
    el.classList.add('out');
    setTimeout(()=>{ el.remove(); afterSheetsClosed(); }, 200);
  };
  el.addEventListener('click', (e)=>{ if(e.target.closest('[data-gw-close]')) close(); });
  const onKey = (e)=>{ if(e.key === 'Escape' && el.parentNode){ close(); document.removeEventListener('keydown', onKey); } };
  document.addEventListener('keydown', onKey);
  const focus = el.querySelector('[data-gw-main]');
  if(focus) setTimeout(()=> focus.focus({ preventScroll: true }), 50);
  return { el, close };
}

/* ---- a quarter, half, three quarters ---- */
function openGoalStep(p, m){
  const name = myAgent && myAgent.name ? firstWord(myAgent.name) : '';
  const tl = goalTimeline(p.key, p.target);
  const hit = tl.at[m];
  const frac = Math.max(0, Math.min(1, p.earned / p.target));
  const before = hit ? Math.max(0, Math.min(frac, hit.before / p.target)) : Math.max(0, m / 100 - 0.03);
  const L = 452.4;
  const [bx, by] = goalArcPoint(m / 100);
  const [fx, fy] = goalArcPoint(1);
  const rays = [0, 45, 90, 135, 180, 225, 270, 315].map(d=>{
    const a = d * Math.PI / 180;
    return `M${(bx + 26 * Math.cos(a)).toFixed(1)} ${(by + 26 * Math.sin(a)).toFixed(1)}L${(bx + 35 * Math.cos(a)).toFixed(1)} ${(by + 35 * Math.sin(a)).toFixed(1)}`;
  }).join('');
  const notches = GOAL_STEPS.filter(s=> s < m).map(s=>{ const [x, y] = goalArcPoint(s / 100); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#16203C"/>`; }).join('');
  const c = hit ? orderClient(hit.order) : null;
  const left = Math.max(0, p.target - p.earned);
  const { pick, sum } = goalGapClients(left, new Date(), p.days);
  const two = pick.slice(0, 3);
  const finishes = two.length && sum >= left;
  const node = (s)=>{
    if(s === 100) return `<span role="listitem"><span class="n next">${AX_ICON.flag}</span><b>Goal</b><span class="s m">${esc(fmtCompactUGX(left))} to go</span></span>`;
    const label = s === 25 ? '¼' : s === 50 ? '½' : '¾';
    if(s === m) return `<span role="listitem" class="now"><span class="n">${GOAL_STAR}</span><b>${label}</b><span class="s">${esc(goalDayLabel(hit && hit.order) || 'Today')}</span></span>`;
    if(s < m) return `<span role="listitem"><span class="n done">${AX_ICON.check}</span><b>${label}</b><span class="s">${esc(goalDayLabel(tl.at[s] && tl.at[s].order))}</span></span>`;
    return `<span role="listitem"><span class="n next"></span><b>${label}</b><span class="s"></span></span>`;
  };
  return goalOverlay('step', `${GOAL_STEP_TITLE[m]}: ${m} percent of your goal`, `
    <div class="in">
      <div class="top"><span class="tag">${esc(monthName(p.key))} goal</span>
        <button type="button" class="ax-iconbtn on-navy" data-gw-close aria-label="Close">${AX_ICON.x}</button></div>
      <div class="arc">
        <svg width="240" height="214" viewBox="0 0 240 214" role="img" aria-label="${Math.floor(frac * 100)} percent of ${esc(fmtNum(p.target))}">
          <circle cx="120" cy="118" r="96" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${L} 603.2" transform="rotate(135 120 118)"/>
          <circle class="grow" cx="120" cy="118" r="96" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-dasharray="${(before * L).toFixed(1)} 603.2" transform="rotate(135 120 118)"/>
          <circle cx="120" cy="118" r="96" fill="none" stroke="#6FDCB0" stroke-width="16" stroke-dasharray="${((frac - before) * L).toFixed(1)} 603.2" stroke-dashoffset="${(-before * L).toFixed(1)}" transform="rotate(135 120 118)"/>
          ${notches}
          <circle cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="11" fill="#16203C" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
          <g class="rays" style="transform-origin:${bx.toFixed(1)}px ${by.toFixed(1)}px"><path d="${rays}" stroke="#F5B26B" stroke-width="3" stroke-linecap="round"/></g>
          <g class="burst" style="transform-origin:${bx.toFixed(1)}px ${by.toFixed(1)}px">
            <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="20" fill="#6FDCB0" fill-opacity=".22"/>
            <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="13" fill="#6FDCB0"/>
            <path d="M${(bx - 5.5).toFixed(1)} ${(by + .3).toFixed(1)}l3.8 3.8 7.4-7.6" fill="none" stroke="#16203C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
        <span class="mid"><b class="m">${Math.floor(frac * 100)}%</b><span class="m">${esc(fmtNum(p.earned))} / ${esc(fmtNum(p.target))}</span></span>
      </div>
      <div class="head">
        <h2>${esc(GOAL_STEP_TITLE[m])}${name ? `, ${esc(name)}` : ''}</h2>
        ${c ? `<span class="who">${avHTML(c, 'sm')}<span>${esc(possessive(firstWord(c.name || 'Your client')))} order took you over</span></span>` : ''}
      </div>
      <div class="track" role="list" aria-label="Milestones"><i class="rail"></i><i class="fill" style="width:${GOAL_STEPS.indexOf(m) * 25}%"></i>${GOAL_STEPS.map(node).join('')}</div>
      ${two.length ? `<button type="button" class="gap" data-gw-goal>
          <span class="faces">${two.map(r=> avHTML(r.client, 'sm')).join('')}</span>
          <span class="b"><b>${finishes ? (two.length === 1 ? 'One usual order finishes it' : `${two.length} usual orders finish it`) : `${two.length} client${two.length === 1 ? '' : 's'} due back`}</b>
            <span>Due before the month ends</span></span>
          <span class="v m">+${esc(fmtNum(sum))}</span>${AX_ICON.chevR}</button>` : ''}
      <span class="grow-space"></span>
      <button type="button" class="go" data-gw-close data-gw-main>Keep going${AX_ICON.chevR}</button>
    </div>`).el.addEventListener('click', (e)=>{
      if(!e.target.closest('[data-gw-goal]')) return;
      const el = e.target.closest('.ax-goalwin');
      el.remove();
      openGoalSheet();
    });
}
const GOAL_STAR = '<svg class="icon" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';

/* ---- the goal itself ---- */
function openGoalDone(p){
  const name = myAgent && myAgent.name ? firstWord(myAgent.name) : '';
  const tl = goalTimeline(p.key, p.target);
  const hitDay = goalDay(tl.at[100] && tl.at[100].order) || new Date();
  const dim = new Date(hitDay.getFullYear(), hitDay.getMonth() + 1, 0).getDate();
  const early = dim - hitDay.getDate();
  const byClient = new Map();
  tl.orders.forEach(o=>{
    const e = orderEarnings(o);
    const k = String(o.agentClientId != null ? o.agentClientId : (o.payload && o.payload.agentClientId) || '');
    const cur = byClient.get(k) || { c: orderClient(o), v: 0 };
    cur.v += e.margin + (o.status === 'completed' ? e.bonus : 0);
    byClient.set(k, cur);
  });
  const ranked = [...byClient.values()].filter(r=> r.v > 0).sort((a, b)=> b.v - a.v);
  const top = ranked.slice(0, 2);
  const rest = ranked.slice(2);
  const restV = rest.reduce((s, r)=> s + r.v, 0);
  const parts = top.map((r, i)=> ({ l: firstWord(r.c && r.c.name || 'Client'), v: r.v, col: i ? '#E9B8DC' : '#9DB8F2' }))
    .concat(restV > 0 ? [{ l: `${rest.length} more`, v: restV, col: 'rgba(255,255,255,.32)' }] : []);
  const lb = leaderboard && leaderboard.you && leaderboard.totalAgents >= 3 ? leaderboard : null;
  const streak = computeSellingStreak();
  const g = goalFigures(new Date(), p.target);
  const r10 = (n)=> Math.max(10000, Math.round(n / 10000) * 10000);
  const higher = r10(Math.max(p.earned * 1.1, Math.min(g.earned + g.pace * g.days, p.target * 1.3)));
  const confetti = Array.from({ length: 22 }, (_, i)=> `<i style="left:${(i * 41) % 100}%;top:${(i * 23) % 40}%;animation-delay:${(i % 8) * 0.09}s;animation-duration:${2.4 + (i % 5) * 0.3}s;background:${['#F5B26B','#6FDCB0','#FFFFFF','#E9B8DC','#9DB8F2'][i % 5]};"></i>`).join('');
  const ov = goalOverlay('done', `${monthName(p.key)} goal hit`, `
    <div class="cf" aria-hidden="true">${confetti}</div>
    <div class="in">
      <div class="top"><span></span><button type="button" class="ax-iconbtn on-navy" data-gw-close aria-label="Close">${AX_ICON.x}</button></div>
      <div class="medal" aria-hidden="true"><svg class="sun" viewBox="0 0 176 176"><path d="M88 4v22M88 150v22M4 88h22M150 88h22M28.6 28.6l15.6 15.6M131.8 131.8l15.6 15.6M147.4 28.6l-15.6 15.6M44.2 131.8l-15.6 15.6" stroke="#F5B26B" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/></svg>
        <span class="cup">${AX_ICON.trophy}</span></div>
      <div class="head">
        <span class="eye">${esc(monthName(p.key))} goal · done</span>
        <h2>You did it${name ? `, ${esc(name)}` : ''}!</h2>
        <span class="big m">${esc(fmtNum(p.earned))}</span>
        <span class="pill">${AX_ICON.trend}${early > 0 ? `${early} day${early === 1 ? '' : 's'} early` : 'Right on time'}</span>
      </div>
      <div class="stats">
        <span><b class="m">${tl.orders.length}</b><span>order${tl.orders.length === 1 ? '' : 's'}</span></span>
        <span><b class="m">${byClient.size}</b><span>client${byClient.size === 1 ? '' : 's'}</span></span>
        ${lb ? `<span class="gold"><b class="m">#${esc(lb.you.rank)}</b><span>of ${esc(lb.totalAgents)}</span></span>`
          : `<span class="gold"><b class="m">${streak}</b><span>wk streak</span></span>`}
      </div>
      ${parts.length ? `<div class="who-got">
        <span class="k">Who got you here</span>
        <span class="bar" role="img" aria-label="${esc(parts.map(x=> `${x.l} ${fmtNum(x.v)}`).join(', '))}">${parts.map(x=> `<i style="flex:${Math.round(x.v)};background:${x.col};"></i>`).join('')}</span>
        <span class="legend">${parts.map(x=> `<span><i style="background:${x.col};"></i>${esc(x.l)} <b class="m">${esc(fmtCompactUGX(x.v))}</b></span>`).join('')}</span>
      </div>` : ''}
      <span class="grow-space"></span>
      <button type="button" class="go" data-gw-higher data-gw-main>${AX_ICON.flag}Aim higher: <span class="m">${esc(fmtNum(higher))}</span></button>
      <button type="button" class="later" data-gw-close data-sharemonth>${AX_ICON.share}Share my month</button>
    </div>`);
  ov.el.addEventListener('click', async (e)=>{
    const b = e.target.closest('[data-gw-higher]');
    if(!b || b.disabled) return;
    b.disabled = true;
    try{
      await saveAgentGoal(higher, goalPerDay(higher, new Date()));
      ov.close();
      if(currentView === 'today') renderTodayHero();
      toast(`New goal: ${fmtNum(higher)}`, 3500, { tone: 'good' });
    }catch(_err){
      b.disabled = false;
      toast("Couldn't save that just now. Try again in a moment");
    }
  });
  return ov;
}

/* ================= DELIVERY TO THE CLIENT =================
   Choosing Delivery opens one sheet that is already filled in: where (the
   client's saved location), who takes it in and their phone (the driver
   calls them), and when. The shop's own delivery charge -- its "Delivery"
   service under What you charge for -- is shown before sending and rides
   on the order as a charge, owed with the goods and passed on to the
   client. Out for delivery, the order shows the driver with a Call button
   and one tap to tell the client; delivered, it shows who received it,
   when, and the photo the shop added. */
let shopDeliveryFee = null;   // { label, type, value } from agent-catalog, or null
const DELIVERY_WHEN = [
  { k: 'today_pm', d: 'Today', t: 'afternoon' },
  { k: 'tomorrow_am', d: 'Tomorrow', t: 'morning' },
  { k: 'tomorrow_pm', d: 'Tomorrow', t: 'afternoon' },
];
const DEL_ICON = {
  truck: '<svg class="icon" viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  pin: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 21s7-6.5 7-11.5A7 7 0 1 0 5 9.5C5 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>',
  camera: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
};
function deliveryWhenLabel(k){
  const w = DELIVERY_WHEN.find(x=> x.k === k);
  return w ? `${w.d} ${w.t}` : '';
}
// A charge against the goods at the shop's price -- the shop's own rule
// (chargeAmount in the shop's app): percent of the goods, else whole
// shillings, nothing at or below zero.
function chargeValue(ch, goods){
  const v = Number(ch && ch.value) || 0;
  if(!(v > 0)) return 0;
  return ch.type === 'percent' ? Math.round((Number(goods) || 0) * v / 100) : Math.round(v);
}
function orderShopGoods(o){
  return (o.items || []).reduce((s, it)=> s + (Number(it.sellPrice) || 0) * (Number(it.qty) || 0), 0);
}
function orderChargesAmount(o){
  const goods = orderShopGoods(o);
  return (o.charges || []).reduce((s, ch)=> s + chargeValue(ch, goods), 0);
}
function cartShopGoods(){
  return cart.reduce((s, it)=>{ const f = cartLineFigures(it); return s + (f.amount - f.profit); }, 0);
}
function cartDeliveryFee(){
  return deliveryMode() === 'shop_delivery' && shopDeliveryFee ? chargeValue(shopDeliveryFee, cartShopGoods()) : 0;
}

// Who takes it in and when, for the basket being built. The address
// itself stays in the dock's field, where the draft already keeps it.
function deliveryInfoKey(){ return agentLocalKey('agentDeliveryInfo'); }
function deliveryInfo(){
  try{ return JSON.parse(localStorage.getItem(deliveryInfoKey()) || 'null') || {}; }catch(_e){ return {}; }
}
function setDeliveryInfo(v){
  try{ if(v) localStorage.setItem(deliveryInfoKey(), JSON.stringify(v)); else localStorage.removeItem(deliveryInfoKey()); }catch(_e){}
}

function renderDeliverySum(){
  const el = document.getElementById('ag_deliverySum');
  if(!el) return;
  const shop = deliveryMode() === 'shop_delivery';
  el.hidden = !shop;

  const addr = document.getElementById('ag_delivery_address').value.trim();
  const info = deliveryInfo();
  const fee = cartDeliveryFee();

  el.innerHTML = `${DEL_ICON.pin}<span class="b"><span class="a">${addr ? esc(addr) : 'Where to?'}</span>
    <span class="s">${[info.when ? deliveryWhenLabel(info.when) : '', fee ? `+${fmtNum(fee)} delivery` : '', info.name || ''].filter(Boolean).map(esc).join(' · ') || 'Tap to add where it goes'}</span></span>${AX_ICON.chevR}`;
}

  const sheet = openSheet('', { label: 'The shop delivers', kind: 'delivery', white: true });

              <span class="two"><input type="text" data-f="name" value="${esc(name)}" placeholder="Name" autocomplete="off" aria-label="Who receives it">

        </div>

    else if(f === 'phone') phone = e.target.value;

  sheet.el.addEventListener('click', (e)=>{

    if(!e.target.closest('[data-done]')) return;

    addrIn.value = a;
    setDeliveryInfo({ name: name.trim(), phone: phone.trim(), when });
    rememberClientDelivery(c, a, phone.trim());
    saveQuoteDraft();
    renderDock();
    sheet.close();
  });
  paint();
  setTimeout(()=>{ const i = sheet.el.querySelector('[data-f="addr"]'); if(i && !addr) i.focus(); }, 60);
  return sheet;
}
// A new address (or a phone the client never had) is kept on the client,
// so next time it is already there. Best effort: the order does not wait.
async function rememberClientDelivery(c, addr, phone){
  if(!c || c.id == null) return;
  const patch = {};
  if(addr && addr !== String(c.location || '').trim()) patch.location = addr;
  if(phone && !String(c.phone || '').trim()) patch.phone = phone;
  if(!Object.keys(patch).length) return;
  Object.assign(c, patch);
  const local = agentClients.find(x=> String(x.id) === String(c.id));
  if(local && local !== c) Object.assign(local, patch);
  try{
    await sb.from('agent_clients').update(patch).eq('shop_id', currentShopId).eq('id', c.id);
  }catch(_e){}
}

/* ---- on the order: where it is going, who is driving, who took it ---- */
const driverCache = new Map();   // orderId -> { name, phone } | null
async function ensureDeliveryDriver(o){
  const k = String(o.id);
  if(driverCache.has(k)) return driverCache.get(k);
  driverCache.set(k, null);
  try{
    const { data } = await sb.rpc('agent_delivery_driver', { p_shop_id: currentShopId, p_order_id: Number(o.id) });
    const d = Array.isArray(data) && data[0] ? { name: data[0].name || '', phone: data[0].phone || '' } : null;
    driverCache.set(k, d);
    return d;
  }catch(_e){ return null; }
}
const proofPhotoCache = new Map();  // path -> signed url
async function ensureProofPhoto(path){
  if(!path) return null;
  if(proofPhotoCache.has(path)) return proofPhotoCache.get(path);
  proofPhotoCache.set(path, null);
  try{
    const { data } = await sb.storage.from('delivery-photos').createSignedUrl(path, 3600);
    const url = data && data.signedUrl || null;
    proofPhotoCache.set(path, url);
    return url;
  }catch(_e){ return null; }
}

let shoutouts = null;

const SHOUT_HEART = '<svg class="icon" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M12 20.5s-7.5-4.4-9.3-9.2C1.4 7.8 3.6 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.6 3.3 4.3 6.8-1.8 4.8-9.3 9.2-9.3 9.2z"/></svg>';
async function ensureShoutouts(force){
  if(!currentShopId || isOffline) return shoutouts;
  if(!force && shoutouts && Date.now() - shoutoutsAt < 60000) return shoutouts;
  shoutoutsAt = Date.now();
  try{
    let q = sb.from('agent_shoutouts').select('id, reason, message, created_at, thanked_at, put_away_at')
      .eq('shop_id', currentShopId).is('put_away_at', null)
      .gte('created_at', new Date(Date.now() - 14 * 864e5).toISOString())

function shoutWhen(iso){

// "2½×", "4×": halves while it is small enough for a half to matter.
function timesLabel(r){

function quietRegulars(today){
  const counts = clientOrderCounts();
  const live = new Set(liveOrders().map(o=> String(o.agentClientId)));
  const hi = saidHiAll();
  return agentClients.map(c=>{
    if(live.has(String(c.id))) return null;
    const cad = clientCadence(c, counts, today || new Date());
    if(!cad) return null;
    const gap = Math.max(1, cad.avgGapDays), now = Math.floor(cad.daysSince), ratio = cad.daysSince / gap;
    // Twice their own rhythm and a fortnight at least: a weekly client
    // two days late is not gone. Past half a year they are not quiet but
    // gone, and that is a different conversation.
    if(ratio < 2 || now < 14 || now > 180) return null;
    let said = hi[String(c.id)] || null;
    if(said && said.last !== cad.lastDateKey){ saidHiSet(c.id, null); said = null; }
    const saidDays = said ? Math.floor((Date.now() - said.at) / 864e5) : null;
    return { c, cad, gap: Math.round(gap), now, ratio, earn: Math.max(0, cad.avgMargin || 0), said, saidDays,
      remind: said && !said.reminded && saidDays >= 3 };

/* ================= MY MONTH, AS A PICTURE =================
   A card for WhatsApp Status: the month climbing, the goal it passed, the
   orders and clients behind it. What the agent earned stays OFF the card
   unless they turn it on -- their clients see the wins, not their money.
   The preview IS the image (the same canvas), so what is shown is what
   goes out. */
const MC_W = 300, MC_H = 533, MC_SCALE = 3.6;   // 1080 x 1919, a phone's Status
function monthStory(key){
  const { total, orders } = monthEarnings(key);
  const [y, m] = key.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const isNow = key === currentMonthKey();
  const upTo = isNow ? new Date().getDate() : days;
  const target = Number(myGoals && myGoals.monthly_target) || 0;
  // The month as it was earned, day by day -- the same money as
  // monthEarnings: margin on every order, bonus once it completed.
  const perDay = new Array(days + 1).fill(0);
  orders.forEach(o=>{
    const d = Number(String(o.date).slice(8, 10)) || 1;
    const e = orderEarnings(o);
    perDay[Math.min(days, d)] += e.margin + (o.status === 'completed' ? e.bonus : 0);
  });
  const cum = [];
  let run = 0, crossDay = null;
  for(let d = 1; d <= upTo; d++){ run += perDay[d]; cum.push(run); if(target > 0 && crossDay == null && run >= target) crossDay = d; }
  const done = orders.filter(o=> o.status === 'completed');
  const lb = isNow && leaderboard && leaderboard.you && leaderboard.totalAgents >= 2 ? leaderboard : null;
  return { key, y, m, days, upTo, isNow, total, target, cum, crossDay, early: crossDay != null ? days - crossDay : null,
    delivered: done.length, clients: new Set(done.map(o=> String(o.agentClientId))).size,
    orders: orders.length, rank: lb ? { you: lb.you.rank, of: lb.totalAgents } : null,
    streak: isNow ? computeSellingStreak() : 0,
    sellDays: new Set(orders.map(o=> String(o.date))).size };
}

  rr(R - 28, 16, 28, 28, 8); ctx.fillStyle = '#B23A26'; ctx.fill();

    : s.target > 0 ? (s.isNow ? `${s.days - s.upTo} days to go` : 'this month') : (s.delivered ? 'delivered this month' : 'this month');
  ctx.fillStyle = '#FFFFFF'; ctx.font = sans(800, 24); ctx.fillText(head, L + 78, yy + 28);
  ctx.fillStyle = hit ? '#F5B26B' : '#6FDCB0'; ctx.font = sans(700, 14); ctx.fillText(sub, L + 78, yy + 48);
  yy += 84;
  if(showMoney){
    ctx.fillStyle = '#8D99B5'; ctx.font = sans(700, 12); ctx.fillText('UGX', L, yy + 22);
    ctx.fillStyle = '#FFFFFF'; ctx.font = mono(600, 28); ctx.fillText(fmtNum(s.total), L + 34, yy + 24);
    ctx.fillStyle = '#B3BCD2'; ctx.font = sans(600, 12); ctx.fillText('earned this month', L, yy + 42);
    yy += 54;
  }
  // The month climbing
  // The chart takes whatever the headline and the tiles leave.
  const tilesTop = MC_H - 56 - 16 - (56 * 2 + 8);
  const cw = R - L, top = yy + 14, base = tilesTop - 18, ch = base - top;
  const peak = Math.max(1, s.target * 1.12, ...s.cum);
  const xOf = (d)=> L + (d - 1) / Math.max(1, s.days - 1) * cw;
  const yOf = (v)=> base - Math.max(0, v) / peak * (ch - 8);
  if(s.target > 0){
    ctx.setLineDash([5, 4]); ctx.strokeStyle = 'rgba(245,178,107,.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(L, yOf(s.target)); ctx.lineTo(R, yOf(s.target)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#F5B26B'; ctx.font = sans(700, 11); ctx.textAlign = 'right'; ctx.fillText('goal', R, yOf(s.target) - 6); ctx.textAlign = 'left';
  }
  if(s.cum.length){
    ctx.beginPath(); ctx.moveTo(xOf(1), base);
    s.cum.forEach((v, i)=> ctx.lineTo(xOf(i + 1), yOf(v)));
    ctx.lineTo(xOf(s.cum.length), base); ctx.closePath();
    ctx.fillStyle = 'rgba(111,220,176,.14)'; ctx.fill();
    ctx.beginPath(); s.cum.forEach((v, i)=> i ? ctx.lineTo(xOf(i + 1), yOf(v)) : ctx.moveTo(xOf(1), yOf(v)));
    ctx.strokeStyle = '#6FDCB0'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, base + .5); ctx.lineTo(R, base + .5); ctx.stroke();
  if(hit){
    const cx = xOf(s.crossDay), cy = yOf(s.cum[s.crossDay - 1]);
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fillStyle = '#F5B26B'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#16203C'; ctx.stroke();
    ctx.fillStyle = '#FFFFFF'; ctx.font = sans(700, 11); ctx.textAlign = 'center';
    ctx.fillText(`${s.crossDay} ${monthName(s.key).slice(0, 3)}`, Math.min(R - 20, Math.max(L + 20, cx)), Math.min(base - 4, cy + 22)); ctx.textAlign = 'left';
  }
  yy = tilesTop;
  // Four tiles
  const tiles = [
    { v: String(s.delivered), k: 'orders delivered' },
    { v: String(s.clients), k: s.clients === 1 ? 'happy client' : 'happy clients' },
    s.rank ? { v: `#${s.rank.you}`, k: `of ${s.rank.of} agents`, warm: true } : { v: String(s.sellDays), k: s.sellDays === 1 ? 'day selling' : 'days selling' },
    s.streak >= 2 ? { v: String(s.streak), k: 'week streak' } : { v: String(s.orders), k: s.orders === 1 ? 'order sent' : 'orders sent' },
  ];
  const tw = (cw - 8) / 2, th = 56;
  tiles.forEach((t, i)=>{
    const x = L + (i % 2) * (tw + 8), ty = yy + Math.floor(i / 2) * (th + 8);
    rr(x, ty, tw, th, 14); ctx.fillStyle = t.warm ? 'rgba(245,178,107,.14)' : 'rgba(255,255,255,.07)'; ctx.fill();
    ctx.fillStyle = t.warm ? '#F5B26B' : '#FFFFFF'; ctx.font = mono(600, 22); ctx.fillText(t.v, x + 12, ty + 30);
    ctx.fillStyle = t.warm ? '#F5B26B' : '#B3BCD2'; ctx.font = sans(600, 12); ctx.fillText(t.k, x + 12, ty + 47);
  });
  // Who: the agent, so a client seeing it knows who to call
  const fy = MC_H - 56;
  ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.beginPath(); ctx.moveTo(L, fy); ctx.lineTo(R, fy); ctx.stroke();
  ctx.beginPath(); ctx.arc(L + 17, fy + 29, 17, 0, Math.PI * 2); ctx.fillStyle = '#243052'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(111,220,176,.55)'; ctx.stroke();
  ctx.fillStyle = '#FFFFFF'; ctx.font = sans(700, 12); ctx.textAlign = 'center'; ctx.fillText(agentInitials(), L + 17, fy + 33); ctx.textAlign = 'left';
  const name = (myAgent && myAgent.name) || '';
  ctx.font = sans(800, 13); ctx.fillText(name.length > 30 ? name.slice(0, 29) + '…' : name, L + 44, fy + 25);
  const shop = (shopInfo && shopInfo.name) || '';
  // 0772 000 111, the way it is said, whatever way it was stored.
  const digits = String((myAgent && myAgent.phone) || '').replace(/\D/g, '');
  const local = digits.length === 12 && digits.startsWith('256') ? '0' + digits.slice(3) : digits;
  const phone = local.length === 10 ? `${local.slice(0, 4)} ${local.slice(4, 7)} ${local.slice(7)}` : String((myAgent && myAgent.phone) || '');
  ctx.fillStyle = '#B3BCD2'; ctx.font = sans(600, 11);
  const line = [shop, phone].filter(Boolean).join(' · ');
  ctx.fillText(line.length > 44 ? line.slice(0, 43) + '…' : line, L + 44, fy + 41);
  return cv;
}

/* ================= AT VOLUME =================
   Thirty orders in a stage cannot be thirty big cards. Past a handful a
   stage reads as a list to work through: its count and what it is worth
   on top, a bar showing how it splits, the urgent part first and oldest
   first within it, a few rows of each part with the rest folded, and one
   button that deals with a whole part at once -- pay, ask the shop, show
   every counter code. Today, likewise, stops naming orders and names
   what needs doing. */
const BUSY_AT = 4;
function busyAge(ms){
  if(ms == null) return '';
  const m = (Date.now() - ms) / 60000;
  if(m < 60) return `${Math.max(1, Math.round(m))}m`;
  const h = m / 60;
  return h < 24 ? `${Math.round(h)}h` : `${Math.floor(h / 24)}d`;
}
function calDaysAgo(ms){
  if(ms == null) return null;
  const d = new Date(ms), n = new Date();
  return Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
}
// Since when it has sat where it is: confirmed (waiting on your money),
// packing started, ready or out, else sent.
function stageSince(o, st){
  const at = {};
  (o.stageLog || []).forEach(e=>{ if(e && e.status && at[e.status] == null) at[e.status] = toMs(e.at); });
  const sent = toMs(o.createdAt) || toMs(orderDate(o) ? orderDate(o) + 'T00:00:00' : null);
  if(st.needs === 'pay') return toMs(o.shopConfirmedAt) || sent;
  if(st.group === 'packing') return at.preparing || at.awaiting_goods || sent;
  if(st.group === 'out') return at.pending_delivery || sent;
  return sent;
}
// Hours after which a wait is worth a colour, by stage.
const BUSY_WAIT = { sent:[3, 24], packing:[24, 48], out:[4, 24] };
function busyTone(key, ms){
  if(ms == null) return '';
  const h = (Date.now() - ms) / 3600000, w = BUSY_WAIT[key] || [24, 48];
  return h >= w[1] ? 'late' : h >= w[0] ? 'warn' : '';
}
function busyParts(key, rows){
  if(key === 'sent') return [
    { id:'pay', label:'Pay the shop', chip:'Pay shop', color:'#F5B26B', rows: rows.filter(x=> x.st.needs === 'pay'), act:'pay' },
    { id:'check', label:'The shop is checking', chip:'Checking', color:'#8DA2D6', rows: rows.filter(x=> x.st.key === 'checking') },
    { id:'paid', label:'Paid, packing next', chip:'Paid, waiting', color:'#6FDCB0', rows: rows.filter(x=> x.st.key === 'queued') },
  ];
  if(key === 'packing'){
    const d = (x)=> calDaysAgo(x.since) || 0;
    return [
      { id:'late', label:'Waiting 2+ days', chip:'2+ days', color:'#F08A7E', rows: rows.filter(x=> d(x) >= 2), act:'ask' },
      { id:'yday', label:'Since yesterday', color:'#F5B26B', rows: rows.filter(x=> d(x) === 1) },
      { id:'today', label:'Today', color:'#6FDCB0', rows: rows.filter(x=> d(x) <= 0) },
    ];
  }
  return [
    { id:'ready', label:'Ready to collect', color:'#6FDCB0', rows: rows.filter(x=> x.st.key === 'ready'), act:'codes' },
    { id:'way', label:'On the way', color:'#8DA2D6', rows: rows.filter(x=> x.st.key === 'out') },
  ];
}
const BUSY_PAGES = {
  sent:    { title:'Sent', icon: ()=> PH.plane, tone:'#F5B26B', worth:'with the shop' },
  packing: { title:'Packing', icon: ()=> PH.box, tone:'#8DA2D6', worth:'being packed' },

};
function busyRowHTML(key, part, x){

function openBusyStage(key){
  const page = BUSY_PAGES[key];

  const sheet = openSheet('', { label: page.title, kind:'stage', full:true, refresh: ()=> paint() });
  // Sent also holds a finished order still owed to the shop: it waits on
  // your money like the rest of Pay the shop.
  const rowsNow = ()=> liveOrders().concat(key === 'sent' ? myOrders.filter(o=> !o.voided && o.status === 'completed') : [])
    .map(o=>{ const st = orderStage(o); return { o, st, since: stageSince(o, st) }; })
    .filter(x=> x.st.group === key || (key === 'sent' && x.st.key === 'settle'));

  }
  function paint(){

    const firstId = (parts.find(p=> p.rows.length) || {}).id;
    const chips = parts.filter(p=> p.rows.length).map(p=> `<button type="button" class="${state.only === p.id || (!state.only && p.id === firstId) ? 'on' : ''}" data-only="${p.id}" aria-pressed="${state.only === p.id}"><i style="background:${p.color};"></i>${esc(p.chip || p.label)} <b>${p.rows.length}</b></button>`).join('');
    sheet.el.innerHTML = `
      <div class="ax-sheet-top ax-bz-top">
        <button type="button" class="ax-grab" data-close aria-label="Close"></button>
        <div class="ax-bz-h"><span class="ic" style="background:${page.tone};">${page.icon()}</span>
          <span class="b"><span class="t">${esc(page.title)} <b style="color:${page.tone};">${rows.length}</b></span><span class="s">${fmtNum(total)} ${esc(page.worth)}</span></span>
          <button type="button" class="ax-iconbtn on-navy" data-close aria-label="Close">${AX_ICON.x}</button></div>
        <div class="ax-bz-bar" aria-hidden="true">${bar}</div>
        <div class="ax-bz-chips">${chips}</div>
      </div>
      <div class="ax-sheet-pad">
        ${rows.length > BUSY_AT ? `<div class="ax-bz-q"><label>${PH.search}<input type="search" data-q placeholder="Client or order #" value="${esc(state.q)}" aria-label="Find a client or order"></label>
          <button type="button" data-sort>${PH.sort}${state.newest ? 'Newest first' : 'Oldest first'}</button></div>` : ''}
        <div data-list>${listHTML(parts)}</div>
      </div>`;
    const q = sheet.el.querySelector('[data-q]');
    if(q) q.addEventListener('input', ()=>{ state.q = q.value; sheet.el.querySelector('[data-list]').innerHTML = listHTML(busyParts(key, rowsNow())); });
  }
  sheet.el.addEventListener('click', (e)=>{
    const only = e.target.closest('[data-only]');

    if(e.target.closest('[data-ask]')){ askShopAbout(busyParts(key, rowsNow()).find(p=> p.act === 'ask').rows.map(x=> x.o)); return; }
    if(e.target.closest('[data-codes]')){ openCodesSheet(busyParts(key, rowsNow()).find(p=> p.act === 'codes').rows.map(x=> x.o)); return; }
    const t = e.target.closest('[data-track]');

/* ---- Ready: how far the shop is, and what else waits there ----
   Where the shop is comes from its own map pin (agent-catalog hands it
   over with the address); where you are is asked once, only when you
   ask "how far" or have already allowed it. Minutes on foot for a short
   walk, by boda beyond it. The other orders ready at the same counter
   are one trip, so they are offered together. */
let agentHere = null;
function haversineKm(a, b){
  const r = (x)=> x * Math.PI / 180, R = 6371;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function shopTravel(){
  const pin = shopInfo && shopInfo.pin;
  if(!agentHere || !pin) return null;
  const km = haversineKm(agentHere, pin);
  const walk = km <= 2;
  return { km, walk, mins: Math.max(1, Math.round(walk ? km / 4.8 * 60 : km / 22 * 60 + 3)) };
}
function askWhereIAm(then){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition((p)=>{ agentHere = { lat: p.coords.latitude, lng: p.coords.longitude, at: Date.now() }; if(then) then(); },
    ()=>{}, { maximumAge: 300000, timeout: 10000 });
}
// Only if the phone has already said yes -- never a prompt on opening.
function maybeKnowWhereIAm(then){
  if(agentHere && Date.now() - agentHere.at < 300000) return;
  if(navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({ name: 'geolocation' }).then((r)=>{ if(r.state === 'granted') askWhereIAm(then); }).catch(()=>{});
  }
}
function directionsUrl(){
  const sh = shopInfo || {};
  const dest = sh.pin ? `${sh.pin.lat},${sh.pin.lng}` : [sh.name, sh.address].filter(Boolean).join(', ');
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}`;
}

/* ================= FINDING ANY ITEM =================
   The box used to find an item only when what was typed sat, letter for
   letter and in the same order, inside its name. "sheet 28" missed Iron
   sheet G28; "cemnt" found nothing; "4 inch nails" missed Wire nails 4";
   "mabaati", what clients actually say, missed every sheet in the shop.

   Now every word is looked for on its own, in any order and in part, a
   word one letter out still counts, sizes are read the way people say
   them, a number in front is the quantity, and the names the shop has
   approved count as names. What the client buys comes first. */
const FIND_PACK_WORDS = new Set(['bag','bags','ctn','ctns','carton','cartons','pc','pcs','piece','pieces','box','boxes','pkt','pkts','packet','packets','roll','rolls','tin','tins','bundle','bundles','sheet_unit']);
function normFind(s){
  return String(s == null ? '' : s).toLowerCase()
    .replace(/[″“”]/g, '"').replace(/''/g, '"')
    .replace(/½/g, '.5').replace(/¼/g, '.25').replace(/¾/g, '.75')
    .replace(/(\d)\s*(?:inches|inch|in)\b/g, '$1"')
    .replace(/(\d)\s*(?:kilograms?|kilos?|kgs?)\b/g, '$1kg')
    .replace(/(\d)\s*(?:millimet(?:er|re)s?|mm)\b/g, '$1mm')
    .replace(/(\d)\s*(?:metres?|meters?|mtrs?|m)\b/g, '$1m')
    .replace(/(\d)\s*(?:litres?|liters?|ltrs?|l)\b/g, '$1l')
    .replace(/\bgauge\s*(\d+)/g, 'g$1').replace(/\bg\s+(\d{2})\b/g, 'g$1')
    .replace(/[^a-z0-9".\/\s]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function findStem(w){ return w.length > 4 && w.endsWith('es') ? w.slice(0, -2) : w.length > 3 && w.endsWith('s') ? w.slice(0, -1) : w; }
// What was typed, read: a quantity in front, the size words, the rest.
function readFindQuery(raw){
  const norm = normFind(raw);
  let words = norm ? norm.split(' ') : [];
  let qty = null, packWord = '';
  const lead = words[0] && /^x?(\d{1,4})x?$/.exec(words[0]);
  if(lead && words.length > 1 && !/^\d/.test(words[1]) && !/"|kg|mm|m$|l$/.test(words[0])){
    qty = Number(lead[1]);
    words = words.slice(1);
    if(words.length > 1 && FIND_PACK_WORDS.has(words[0])){ packWord = words[0]; words = words.slice(1); }
    if(words[0] === 'of' && words.length > 1) words = words.slice(1);
  }
  const sized = words.filter(w=> /\d/.test(w) && /["a-z]/.test(w));
  return { raw: String(raw || '').trim(), norm, words, qty: qty > 0 ? qty : null, packWord, sized,
    reread: !!qty || sized.some(w=> !String(raw || '').toLowerCase().includes(w)) };
}
// One edit is a typo -- a wrong, missing, extra or swapped letter -- and
// two in a long word. Stops early past the limit.
function findDistance(a, b, max){
  if(Math.abs(a.length - b.length) > max) return max + 1;
  const d = [];
  for(let i = 0; i <= a.length; i++){ d.push([i]); }
  for(let j = 1; j <= b.length; j++) d[0][j] = j;
  for(let i = 1; i <= a.length; i++){
    let best = 9e9;
    for(let j = 1; j <= b.length; j++){
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      let v = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if(i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, d[i - 2][j - 2] + 1);
      d[i][j] = v;
      if(v < best) best = v;
    }
    if(best > max) return max + 1;
  }
  return d[a.length][b.length];
}
// Names the shop approved, and the ones this agent taught and is waiting on.
function myTaughtNames(){
  try{ return JSON.parse(localStorage.getItem(agentLocalKey('taughtNames')) || '{}') || {}; }catch(_e){ return {}; }
}
function rememberTaughtName(word, key){
  try{
    const m = myTaughtNames();
    m[word] = key;
    localStorage.setItem(agentLocalKey('taughtNames'), JSON.stringify(m));
  }catch(_e){}
  findHayCache = new WeakMap();
}
let findHayCache = new WeakMap();
function findHay(it){
  let h = findHayCache.get(it);
  if(h) return h;
  const taught = myTaughtNames(), key = feedItemKey(it.productId, it.variantIdx);
  const aliases = (Array.isArray(it.aliases) ? it.aliases : []).concat(Object.keys(taught).filter(w=> taught[w] === key || taught[w] === `${it.productId}::*`));
  h = {

// How well one typed word fits one word of the item: 3 the same word, 2.8

function findWordFit(q, w, fuzzy){

  const sized = /\d/.test(q);
  if(sized && /["a-z]/.test(q)) return 0; // 4" is 4", never 40"
  if(w.startsWith(q) && q.length >= (sized ? 1 : 2)) return 2.4;
  if(sized ? w.includes(q) && /^[a-z]*\d/.test(w) : (q.length >= 3 && w.includes(q))) return 2;
  if(fuzzy && !sized && q.length >= 4){
    const max = q.length >= 7 ? 2 : 1;

    for(const w of h.name){ const f = findWordFit(q, w, fuzzy); if(f > best){ best = f; hit = w; via = 'name'; } }
    for(const w of h.place){ const f = findWordFit(q, w, fuzzy) * .6; if(f > best){ best = f; hit = w; via = 'place'; } }
    if(!best) return null;
    if(best <= 1 && via !== 'alias') typo = { typed: q, meant: hit };
    if(via === 'alias' && best >= 3) alias = hit;
    score += best;

}
// What this client and this agent lean on, for ranking.
function findLeanings(){

  const sold = new Map();

function searchCatalog(raw, opts){
  opts = opts || {};

  const out = { read, hits: [], typo: null, alias: null };
  if(!read.words.length) return out;
  const lean = findLeanings();
  const run = (fuzzy)=> catalog.map(it=>{
    const m = findScoreItem(it, read.words, fuzzy);
    if(!m) return null;
    const k = feedItemKey(it.productId, it.variantIdx);
    let s = m.score;
    if(lean.usual.has(k)) s += 6;
    if(lean.sold.has(k)) s += Math.min(2, Math.log2(1 + lean.sold.get(k)));
    if(lean.promo.has(k)) s += .5;
    if(it.onShelf === false) s -= .5;
    return { it, score: s, typo: m.typo, alias: m.alias, usual: lean.usual.get(k) || null, promo: lean.promo.get(k) || null };
  }).filter(Boolean);
  let hits = run(false);
  // "28 sheet" is Iron sheet G28, not 28 sheets: a number in front is the
  // quantity only when, read as part of the name, it finds nothing.
  if(read.qty){
    const words = [String(read.qty)].concat(read.packWord ? [read.packWord] : [], read.words);

}
// What a set of items has in common, said as a shopper would.
function findCommonName(items){

// "Wire nails 4"" and "Wire nails 3"" are one thing in sizes: the name

const FIND_SIZE_RE = /\s*(?:\b\d+(?:\.\d+)?\s*(?:"|''|″|inch(?:es)?|in\b|mm\b|cm\b|m\b|kg\b|g\b|l\b|ltr\b|litres?\b)|\b[gG]\s?\d{2}\b|\b\d+(?:\.\d+)?\s*\/\s*\d+\s*"?|[½¼¾]")\s*/g;
function findBaseName(name){

}
function findSizeLabel(it){

// Hits as rows: a product's variants, or a family of products that differ
// only by size, become one row with the sizes as chips.
function findRows(hits){
  const rows = [], byKey = new Map();
  // How many items share each name-without-size, aisle by aisle.
  const famSize = new Map();
  catalog.forEach(it=>{ const f = `${itemCategory(it)}::${findBaseName(it.name).toLowerCase()}`; famSize.set(f, (famSize.get(f) || 0) + 1); });
  hits.forEach(h=>{
    const it = h.it;
    const base = findBaseName(it.name);
    const fam = `${itemCategory(it)}::${base.toLowerCase()}`;
    const key = it.variantLabel ? `p::${it.productId}` : (base && base.length < String(it.name).trim().length && (famSize.get(fam) || 0) > 1 ? `f::${fam}` : `p::${it.productId}`);
    let row = byKey.get(key);
    if(!row){
      row = { key, name: key.startsWith('f::') || it.variantLabel ? (base || it.name) : it.name, aisle: itemCategory(it), hits: [], best: h };
      byKey.set(key, row);
      rows.push(row);
    }
    row.hits.push(h);
  });
  // A family of one is just that item, under its own name.
  rows.forEach(r=>{
    // Every size the shop has, not only the ones the words matched, so
    // the chips read as the full shelf.
    const first = r.hits[0].it;
    const siblings = r.key.startsWith('p::') && first.variantLabel
      ? catalog.filter(it=> it.productId === first.productId)
      : r.key.startsWith('f::')
        ? catalog.filter(it=> itemCategory(it) === r.aisle && findBaseName(it.name).toLowerCase() === r.key.slice(r.key.indexOf('::', 3) + 2))

  if(!m) return 9e9;
  return m[2] ? Number(m[1]) / Number(m[2]) : Number(m[1]);
}

function findLatelyAdded(n){

      <button type="button" class="go" data-fd-ask-send>Send to the shop</button>`}
    </div>
    <button type="button" class="ax-fd-teach" data-fd-teach>${PH.translate} <span>The shop has it under another name? <b>Teach “${esc(q)}”</b></span>${AX_ICON.chevR}</button>`;
}
function renderOrderResults(){
  const box = document.getElementById('ag_orderResults');
  const q = orderQuery();
  if(!q){
    const recent = findFocus ? findRecentHTML() : '';
    box.hidden = !recent;
    box.innerHTML = recent;
    document.getElementById('ag_orderView') && document.getElementById('ag_orderView').classList.toggle('ax-fd-focus', !!recent);
    return;
  }
  const ov = document.getElementById('ag_orderView');
  if(ov) ov.classList.remove('ax-fd-focus');
  box.hidden = false;
  if(!catalog.length){ box.innerHTML = `<div class="ax-more"><div class="ag-spinner"></div></div>`; return; }
  if(findAisleFor !== q){ findAisle = null; findAisleFor = q; }
  const r = searchCatalog(q, { exact: findExactQ === q });
  if(!r.hits.length){ box.innerHTML = findNoneHTML(q, r.read); return; }
  if(findQtyFor !== q){ findQtyN = r.read.qty; findQtyFor = q; }
  const qty = r.read.qty ? (findQtyN || r.read.qty) : null;
  const notes = [findReadHTML(r.read)];
  if(r.typo) notes.push(`<div class="ax-fd-note warn">${PH.textAa} <span>Showing <b>${esc(r.typo.meant)}</b> · you typed “${esc(r.typo.typed)}”</span><button type="button" data-fd-exact>search “${esc(r.typo.typed)}”</button></div>`);
  if(r.alias){
    const taught = Object.prototype.hasOwnProperty.call(myTaughtNames(), r.alias.word) && !r.hits.some(h=> h.alias && (h.it.aliases || []).map(normFind).includes(r.alias.word));
    notes.push(`<div class="ax-fd-alias"><span class="ic">${PH.translate}</span><span class="b"><b><span class="w">${esc(r.alias.word)}</span> = ${esc(r.alias.means)}</b><small>${taught ? 'taught by you · waiting for the shop' : 'a name clients use · set by the shop'}</small></span></div>`);
  }
  const rows = findRows(r.hits);
  const top = qty ? findQtyHTML(r.hits[0], qty) : findUsualHTML(r.hits);
  const rest = qty ? findRows(r.hits.slice(1)) : rows;
  box.innerHTML = notes.join('') + top + findGroupsHTML(rest, r, qty)
    + (rows.length > 25 ? `<button type="button" class="ax-sug ax-res-all" data-res-all>See all ${rows.length} in the shop${AX_ICON.chevR}</button>` : '');
}
async function onFindClick(e){
  const q = orderQuery();
  const keep = (fn)=>{ if(q) rememberFindSearch(q); return fn; };
  if(e.target.closest('[data-res-add], [data-usual], [data-res-step="1"]')){ keep(); return; }
  const recent = e.target.closest('[data-fd-q]');
  if(recent){ const el = document.getElementById('ag_orderQ'); el.value = recent.dataset.fdQ; document.getElementById('ag_orderQClear').hidden = false; renderUsual(); return; }
  if(e.target.closest('[data-fd-clear]')){ clearFindSearches(); renderOrderResults(); return; }
  const aisle = e.target.closest('[data-fd-aisle]');
  if(aisle){ findAisle = aisle.dataset.fdAisle || null; renderOrderResults(); return; }
  if(e.target.closest('[data-fd-exact]')){ findExactQ = q; renderOrderResults(); return; }
  const size = e.target.closest('[data-fd-size]');
  if(size){
    keep();
    const [p, v] = size.dataset.fdSize.split('::');
    const it = catalogEntry(p, v === '' ? null : Number(v));
    if(!it) return;
    const idx = lineFor(cart, it.productId, it.variantIdx);
    if(idx >= 0){ setLineQty(cart[idx], Math.round(Number(cart[idx].displayQty != null ? cart[idx].displayQty : cart[idx].qty) || 0) + 1); renderOrder(); bumpOrderBar(); return; }
    const from = size.getBoundingClientRect();
    const line = await addCatalogLine(it, { unit: defaultUnit(it), displayQty: 1 });
    renderOrder();
    if(line) dropIntoOrder(it, from);
    return;
  }
  const qn = e.target.closest('[data-fd-qn]');
  if(qn){ findQtyN = Math.max(1, (findQtyN || 1) + Number(qn.dataset.fdQn)); renderOrderResults(); return; }
  const qadd = e.target.closest('[data-fd-qty-add], [data-fd-addn]');
  if(qadd){
    keep();
    const host = qadd.closest('[data-pid]');
    const it = host && catalogEntry(host.dataset.pid, host.dataset.vidx === '' ? null : Number(host.dataset.vidx));
    if(!it) return;
    const n = qadd.dataset.fdAddn ? Number(qadd.dataset.fdAddn) : (findQtyN || 1);
    const unit = qadd.dataset.unit || (findQtyPackWanted(it) ? 'pack' : defaultUnit(it));
    const from = qadd.getBoundingClientRect();
    const idx = lineFor(cart, it.productId, it.variantIdx);
    if(idx >= 0){ setLineQty(cart[idx], n); renderOrder(); bumpOrderBar(); return; }
    const line = await addCatalogLine(it, { unit, displayQty: n });
    renderOrder();
    if(line) dropIntoOrder(it, from);
    return;
  }
  const when = e.target.closest('[data-fd-ask-when]');
  if(when){ findAskWanted = when.dataset.fdAskWhen; renderOrderResults(); return; }
  if(e.target.closest('[data-fd-ask-send]')){ sendStockRequest(q); return; }
  if(e.target.closest('[data-fd-teach]')){ openTeachSheet(q); return; }
}
document.getElementById('ag_orderResults').addEventListener('click', onFindClick);
document.getElementById('ag_orderResults').addEventListener('input', (e)=>{
  if(e.target.matches('[data-fd-ask-qty]')) findAskQty = Math.max(1, Math.round(Number(e.target.value) || 1));
});
// The box, focused and empty, offers what was searched and added lately.
// A tap on the panel keeps the box focused, so the panel stays put.
(function(){
  const el = document.getElementById('ag_orderQ');
  el.addEventListener('focus', ()=>{ findFocus = true; if(!orderQuery()) renderOrderResults(); });
  el.addEventListener('blur', ()=> setTimeout(()=>{ if(document.activeElement === el) return; findFocus = false; if(!orderQuery()) renderOrderResults(); }, 120));
  el.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') rememberFindSearch(orderQuery()); });
  document.getElementById('ag_orderResults').addEventListener('pointerdown', (e)=>{
    if(!orderQuery() && findFocus && !e.target.closest('input')) e.preventDefault();
  });
})();

/* ---- asking the shop, teaching it a word ---- */
async function sendStockRequest(q){
  const words = String(q || '').trim();
  if(!words) return;
  const row = { shop_id: currentShopId, agent_id: myAgent.id, kind: 'stock', words: words.slice(0, 200),
    qty: findAskQty || null, wanted: findAskWanted, agent_client_id: chosenClient ? String(chosenClient.id) : null,
    client_name: chosenClient ? String(chosenClient.name || '').slice(0, 120) : null };
  const { error } = await sb.from('agent_requests').insert(row);
  if(error){
    toast(/agent_requests/.test(String(error.message)) ? 'Could not send: the shop has not switched requests on yet' : `Could not send: ${error.message}`);
    return;
  }
  findAskSent = words.toLowerCase();
  toast('Sent to the shop');
  renderOrderResults();
}
function openTeachSheet(word){
  word = normFind(word);
  if(!word) return null;
  let picked = null, q = '';
  const sheet = openSheet('', { label: 'Teach a word', kind: 'teach', white: true });
  function candidates(){
    if(q) return searchCatalog(q).hits.slice(0, 6).map(h=> h.it);
    return findClosest(readFindQuery(word), 6);
  }
  function paint(){
    const list = candidates();
    sheet.el.innerHTML = `<button type="button" class="ax-grab" data-close aria-label="Close"></button>
      <div class="ax-teach">
        <div class="hd"><span class="ic">${PH.translate}</span><b>What does “${esc(word)}” mean?</b><small>Tap the item. Once the shop says yes, every agent finds it by this word.</small></div>
        <label class="ax-teach-q">${PH.search}<input type="search" data-teach-q value="${esc(q)}" placeholder="Find the item it means" aria-label="Find the item it means"></label>
        <div class="grid">${list.map(it=>{
          const k = feedItemKey(it.productId, it.variantIdx);
          return `<button type="button" class="${picked === k ? 'on' : ''}" data-teach-pick="${esc(k)}"><span class="ax-th" style="${aisleTint(itemCategory(it))}">${itemThumbHTML(it)}</span><span class="nm">${esc(it.name)}${it.variantLabel ? ' · ' + esc(it.variantLabel) : ''}</span>${picked === k ? `<i>${PH.checkCircle}</i>` : ''}</button>`;
        }).join('') || `<div class="ax-empty">${AX_ICON.search}Type what it is above</div>`}</div>
        <button type="button" class="go" data-teach-send${picked ? '' : ' disabled'}>${PH.chat} ${picked ? `“${esc(word)}” = ${esc(findPickedName(picked))} · send to shop` : 'Pick the item it means'}</button>
      </div>`;
    const inp = sheet.el.querySelector('[data-teach-q]');
    inp.addEventListener('input', ()=>{ q = inp.value; const at = inp.selectionStart; paint(); const n = sheet.el.querySelector('[data-teach-q]'); n.focus(); n.setSelectionRange(at, at); });
  }
  sheet.el.addEventListener('click', async (e)=>{
    const p = e.target.closest('[data-teach-pick]');
    if(p){ picked = p.dataset.teachPick; paint(); return; }
    if(e.target.closest('[data-teach-send]') && picked){
      const [pid, vi] = picked.split('::');
      const { error } = await sb.from('agent_requests').insert({ shop_id: currentShopId, agent_id: myAgent.id, kind: 'name',
        words: word.slice(0, 60), product_id: pid, variant_idx: vi === '' ? null : vi });
      if(error){ toast(/agent_requests/.test(String(error.message)) ? 'Could not send: the shop has not switched requests on yet' : `Could not send: ${error.message}`); return; }
      // Works for you straight away; for everyone once the shop agrees.
      rememberTaughtName(word, picked);
      sheet.close();
      toast(`Sent · “${word}” works for you now`);
      renderOrderResults();
    }
  });
  paint();
  return sheet;
}
function findPickedName(key){
  const [p, v] = String(key || '').split('::');
  const it = catalogEntry(p, v === '' || v == null ? null : Number(v));
  return it ? `${it.name}${it.variantLabel ? ' · ' + it.variantLabel : ''}` : '';
}

boot();
</script>
