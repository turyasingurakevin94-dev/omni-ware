<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16203C">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>Omni-Ware Manager</title>
<!-- The phone app's native layer (apps/manager). Inert in a browser. It
     lives here rather than in the app's own files so a fix to it reaches
     installed phones the same way any change to this page does. -->
<script>
/* The manager page inside the Android app (apps/manager).

   First in <head>, and only does anything inside the app. Four jobs:

   1. Back (Android) closes what is on top -- a photo, a sheet, then the tab
      -- before it ever leaves the app, and leaving only puts it in the
      background so it reopens instantly.
   2. The status bar: the page draws to the top edge, so a strip behind the
      clock takes the colour of whatever is under it, and its icons stay
      readable against it.
   3. The bars' size: Capacitor measures them into --safe-area-inset-*,
      but a page it has not measured (some phones, after a reload) would
      read zero and slide under the clock -- so the last good measurement
      stands in until it does.
   4. Staying current without a store release: the installed app checks the
      live manager.html now and then, keeps a copy of a new one on the phone,
      and switches to it the next time the app goes to the background --
      never in the middle of a hand-over. */
(function(){
  'use strict';
  var C = window.Capacitor;
  if(!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return;
  var P = C.Plugins || {};
  var App = P.App, Bars = P.SystemBars, WebView = P.WebView, Http = P.CapacitorHttp, FS = P.Filesystem;
  var NAVY = '#16203C';
  var root = document.documentElement;
  // The first installs carried this layer as their own native.js. On those
  // it is already running from above, and only the bars' size (3) is new.
  var legacy = !!document.querySelector('script[src="native.js"]');

  window.owHaptic = function(kind){
    var H = P.Haptics;
    if(!H) return;
    (kind === 'success' ? H.notification({ type: 'SUCCESS' }) : kind === 'warn' ? H.notification({ type: 'WARNING' }) : H.impact({ style: 'LIGHT' })).catch(function(){});
  };

  /* ---- 1. back ---- */
  // The page keeps its own stack of what is open (window.bxBack): a sheet,
  // then a screen pushed over a tab, then the tab itself back to Today.
  function back(){
    if(typeof window.bxBack === 'function' && window.bxBack()) return;
    if(App) App.minimizeApp();
  }
  if(App && !legacy) App.addListener('backButton', back);

  /* ---- 2. the strip behind the status bar ---- */
  var strip = null, lastStyle = '';
  function paintBar(){
    if(!strip) return;
    var top = strip.offsetHeight;
    // Today's navy hero is marked data-navy-top. A pushed page opens on its
    // own dark ground -- the tap-to-go-back strip -- unless it is a page
    // whose navy hero has scrolled away under the clock.
    var page = document.querySelector('#bx_pages .bx-page:last-child');
    var navy = (page || document).querySelector('[data-navy-top]:not([hidden])');
    var navyAtTop = !!navy && navy.getBoundingClientRect().top <= top && navy.getBoundingClientRect().bottom > top;
    var ground = page ? getComputedStyle(page).backgroundColor : '';
    var rgb = (ground.match(/\d+/g) || []).map(Number);
    var darkGround = !navyAtTop && !navy && rgb.length >= 3 && (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000 < 90;
    var auth = !!document.querySelector('.bx-auth');
    strip.style.background = auth || navyAtTop ? NAVY : darkGround ? ground : 'var(--bg)';
    var style = auth || navyAtTop || darkGround || document.querySelector('.bx-scrim') ? 'DARK' : 'LIGHT';
    if(style !== lastStyle && Bars){ lastStyle = style; Bars.setStyle({ style: style }).catch(function(){}); }
  }
  var queued = false;
  function soon(){ if(queued) return; queued = true; requestAnimationFrame(function(){ queued = false; paintBar(); }); }
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(insets, 800);
    setTimeout(insets, 2500);
    window.addEventListener('resize', function(){ setTimeout(insets, 300); });
    if(App) App.addListener('resume', function(){ setTimeout(insets, 300); });
    if(legacy) return;
    strip = document.createElement('div');
    strip.setAttribute('aria-hidden', 'true');
    strip.style.cssText = 'position:fixed;top:0;left:0;right:0;height:var(--safe-t, 0px);z-index:59;pointer-events:none;background:' + NAVY + ';';
    document.body.appendChild(strip);
    new MutationObserver(soon).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class'] });
    document.addEventListener('scroll', soon, { passive: true, capture: true });
    paintBar();
  });


  /* ---- 3. the bars' size ---- */
  var INSETS = 'ow-app-insets';
  function insets(){
    if(typeof C.getPlatform === 'function' && C.getPlatform() !== 'android') return;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:var(--safe-t, 0px);padding-bottom:var(--safe-b, 0px);';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe), top = parseFloat(cs.paddingTop) || 0, bottom = parseFloat(cs.paddingBottom) || 0;
    probe.remove();
    var measured = root.style.getPropertyValue('--safe-area-inset-top') !== '';
    var last = {};
    try{ last = JSON.parse(localStorage.getItem(INSETS)) || {}; }catch(_e){}
    if(measured && top > 0){
      if(last.top !== top || last.bottom !== bottom){ try{ localStorage.setItem(INSETS, JSON.stringify({ top: top, bottom: bottom, ours: false })); }catch(_e){} }
      return;
    }
    // Measured at zero: Android has laid the page out below its bars itself.
    if(measured || top > 0) return;
    // Not measured, and the page fills the whole screen -- it is under the
    // bars with nothing telling it how tall they are.
    if(!last.top && Math.abs(screen.height - window.innerHeight) > 16) return;
    root.style.setProperty('--safe-area-inset-top', (last.top || 32) + 'px');
    root.style.setProperty('--safe-area-inset-bottom', (last.bottom || 32) + 'px');
  }

  /* ---- 4. staying current ---- */
  if(legacy || !(WebView && Http && FS && App && window.crypto && crypto.subtle)) return;
  var SOURCE = 'https://omni-ware.vercel.app/manager.html';
  var KEY = 'ow-manager-bundle';
  // A check is one small request (a 304 when nothing changed), so it can be often.
  var EVERY = 3 * 60 * 1000;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(_e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_e){} }
  function header(h, name){
    var k = Object.keys(h || {}).filter(function(x){ return x.toLowerCase() === name; })[0];
    return k ? h[k] : '';
  }
  function sha256(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  // A file of the bundle running now, as base64 for the Filesystem plugin.
  function fileB64(name){
    return fetch(name, { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error(name + ': ' + r.status);
      return r.blob();
    }).then(function(blob){
      return new Promise(function(ok, fail){
        var fr = new FileReader();
        fr.onload = function(){ ok(String(fr.result).split(',')[1] || ''); };
        fr.onerror = fail;
        fr.readAsDataURL(blob);
      });
    });
  }
  function current(){ return fetch('bundle.json', { cache: 'no-store' }).then(function(r){ return r.json(); }); }

  // After a switch: make the new copy the one the app opens with, and drop
  // the copies nothing points at any more.
  function settle(){
    var s = load();
    if(!s.staged) return Promise.resolve();
    return WebView.getServerBasePath().then(function(cur){
      if(!cur || cur.path !== s.staged.path) return;
      return WebView.persistServerBasePath().then(function(){
        var keep = s.staged.dir;
        s.etag = s.staged.etag;
        delete s.staged;
        save(s);
        return FS.readdir({ path: 'live', directory: 'DATA' }).then(function(r){
          return Promise.all((r.files || []).map(function(f){
            var n = typeof f === 'string' ? f : f.name;
            return n === keep.split('/').pop() ? null : FS.rmdir({ path: 'live/' + n, directory: 'DATA', recursive: true }).catch(function(){});
          }));
        }).catch(function(){});
      });
    });
  }

  function check(){
    var s = load();
    if(s.staged || Date.now() - (s.checked || 0) < EVERY) return Promise.resolve();
    s.checked = Date.now();
    save(s);
    return Promise.all([current(), Http.request({ url: SOURCE, method: 'GET', responseType: 'text',
      headers: s.etag ? { 'If-None-Match': s.etag } : {} })]).then(function(pair){
      var mine = pair[0], res = pair[1];
      if(res.status !== 200) return;
      var html = typeof res.data === 'string' ? res.data : '';
      // Half a page is worse than an old page.
      if(html.length < 100000 || html.indexOf('</html>') === -1) return;
      var etag = header(res.headers, 'etag');
      return sha256(html).then(function(hash){
        if(hash === mine.source){ s.etag = etag; save(s); return; }
        var dir = 'live/' + hash.slice(0, 16);
        var rest = (mine.files || []).filter(function(f){ return f !== 'index.html' && f !== 'bundle.json'; });
        return FS.writeFile({ path: dir + '/index.html', data: window.owAppTransform(html), directory: 'DATA', encoding: 'utf8', recursive: true })
          .then(function(){
            return rest.reduce(function(p, f){
              return p.then(function(){ return fileB64(f); })
                .then(function(b64){ return FS.writeFile({ path: dir + '/' + f, data: b64, directory: 'DATA', recursive: true }); });
            }, Promise.resolve());
          })
          .then(function(){
            return FS.writeFile({ path: dir + '/bundle.json', data: JSON.stringify({ source: hash, files: mine.files }), directory: 'DATA', encoding: 'utf8', recursive: true });
          })
          .then(function(){ return FS.getUri({ path: dir, directory: 'DATA' }); })
          .then(function(u){
            var s2 = load();
            s2.staged = { dir: dir, path: decodeURI(String(u.uri).replace(/^file:\/\//, '')), etag: etag };
            save(s2);
          });
      });
    }).catch(function(){
      // No signal, or the server is down: the copy already here carries on.
    });
  }

  App.addListener('pause', function(){
    var s = load();
    if(s.staged) WebView.setServerBasePath({ path: s.staged.path }).catch(function(){});
  });
  App.addListener('resume', function(){ check(); });
  settle().catch(function(){}).then(function(){ setTimeout(check, 5000); });
})();
</script>
<link rel="manifest" href="/manifest-manager.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F7F5F2; --paper:#FFFFFF; --navy:#16203C; --navy2:#243052; --ink:#1C2233; --ink2:#5F6980; --ink3:#767F91; --ink4:#8A93A3;
  --line:#ECE8E1; --rule:#E6E3DD; --soft:#F4F2EE; --soft2:#EFECE6; --dash:#E2DED6;
  --red:#C93A30; --mint:#6FDCB0; --amber:#F5B26B; --amberInk:#95530C; --amberSoft:#FDEEE1; --amberDeep:#7A4A02;
  --green:#0F6B43; --greenSoft:#E4F4EA; --crimson:#8E2A22; --crimsonSoft:#FBE5E2; --rose:#F59A92;
  --indigo:#3A3F9B; --indigoSoft:#E4E6FA; --lilac:#9BA3F0;
  --navyInk:#B3BCD2; --navyInk2:#8D99B5;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --safe-area-inset-top:env(safe-area-inset-top,0px); --safe-area-inset-bottom:env(safe-area-inset-bottom,0px);
  /* The native layer's names for the same two bars (its strip and its probe). */
  --safe-t:var(--safe-area-inset-top); --safe-b:var(--safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
html.big #bx_app,html.big .bx-page,html.big .bx-sheet{zoom:1.12}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font-family:inherit;color:var(--ink)}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- shell ---- */
#bx_app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(100px + var(--safe-area-inset-bottom))}
.bx-view{animation:bxFade .25s ease-out}
@keyframes bxFade{from{opacity:.4}to{opacity:1}}
.bx-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;box-shadow:0 -1px 0 var(--line),0 -10px 24px rgba(22,32,60,.05);padding:10px 0 calc(12px + var(--safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:start;max-width:520px;margin:0 auto}
.bx-nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink3);font-size:11px;font-weight:600;padding:0;position:relative}
.bx-nav button[aria-current="page"]{color:var(--navy);font-weight:700}
.bx-nav button[aria-current="page"] .icon{fill:var(--navy)}
.bx-nav button[aria-current="page"] .icon .hole{stroke:#fff;fill:none}
.bx-nav .bx-go{justify-self:center;margin-top:-30px;width:64px;height:64px;border-radius:999px;background:var(--red);color:#fff;box-shadow:0 0 0 5px var(--bg),0 10px 24px rgba(201,58,48,.35);justify-content:center}
.bx-nav .bx-go .icon{width:30px;height:30px;stroke-width:2;fill:none!important}
.bx-badge{position:absolute;top:-4px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.bx-badge.amber{background:var(--amber);color:var(--navy)}

/* ---- navy hero ---- */
.bx-hero{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;border-radius:0 0 28px 28px;padding:calc(16px + var(--safe-area-inset-top)) 16px 16px;display:flex;flex-direction:column;gap:14px}
.bx-sheethead{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;padding:calc(10px + var(--safe-area-inset-top)) 18px 16px;display:flex;flex-direction:column;gap:12px}
.bx-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navyInk2)}
.bx-glass{border-radius:18px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bx-circle{width:40px;height:40px;border-radius:999px;border:none;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.bx-circle.light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.bx-body{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.bx-grip{align-self:center;width:40px;height:5px;border-radius:999px;background:rgba(255,255,255,.22);flex:none}

/* ---- cards / rows ---- */
.bx-card{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(22,32,60,.05),inset 0 0 0 1px var(--line)}
.bx-list{padding:0 12px}
.bx-row{display:flex;align-items:center;gap:10px;min-height:60px;border:none;background:none;width:100%;text-align:left;padding:8px 0;color:var(--ink)}
.bx-row + .bx-row{border-top:1px solid #F1EEE8}
.bx-av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.bx-av.round{border-radius:999px}
.bx-t{font-size:14px;font-weight:700}
.bx-sub{font-size:12px;color:var(--ink3)}
.bx-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.bx-sec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.bx-sec b{font-size:15px;font-weight:700}
.bx-sec span{font-size:12px;font-weight:600;color:var(--ink3)}
.bx-empty{padding:28px 16px;text-align:center;color:var(--ink3);font-size:14px}
.bx-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.bx-dot{width:7px;height:7px;border-radius:999px;display:inline-block;flex:none}

/* ---- buttons ---- */
.bx-btn{height:56px;border-radius:18px;border:none;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;flex:1}
.bx-btn.red{background:var(--red);color:#fff;box-shadow:0 10px 22px rgba(201,58,48,.3)}
.bx-btn.navy{background:var(--navy);color:#fff}
.bx-btn.ghost{background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.bx-btn.green{background:var(--green);color:#fff;box-shadow:0 10px 22px rgba(15,107,67,.3)}
.bx-btn.glass{background:rgba(255,255,255,.08);color:#fff}
.bx-btn[disabled],.bx-btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.bx-sq{width:56px;height:56px;flex:none;border-radius:18px;border:none;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;font-weight:700}
.bx-foot{margin-top:auto;position:sticky;bottom:0;z-index:5;padding:14px 16px calc(18px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:inherit}
.bx-foot:before{content:'';position:absolute;left:0;right:0;top:-20px;height:20px;background:linear-gradient(180deg,rgba(247,245,242,0),var(--bg));pointer-events:none}
.bx-dock{position:sticky;bottom:0;z-index:5}
/* the fade above a pinned footer must never sit on the last thing above it */
.bx-page :has(+ .bx-foot){margin-bottom:20px}
.bx-foot .row{display:flex;gap:8px}
.bx-foot > .bx-btn,.bx-foot > .bx-slide,.bx-foot > .mx-yesno{flex:none}
.bx-hint{display:flex;align-items:center;gap:6px;padding-left:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.bx-seg{position:relative;display:grid;padding:4px;border-radius:20px;background:#EAE6DF;box-shadow:inset 0 1px 2px rgba(22,32,60,.08)}
.bx-seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(22,32,60,.08),0 6px 14px rgba(22,32,60,.12),inset 0 0 0 1.5px var(--navy);transition:transform .35s cubic-bezier(.3,1.25,.5,1)}
.bx-seg button{position:relative;z-index:1;border:none;background:transparent;border-radius:16px;padding:0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink2);transition:color .2s}
.bx-seg button[aria-checked="true"],.bx-seg button[aria-selected="true"]{color:var(--navy)}
.bx-seg.dark{background:rgba(255,255,255,.07);box-shadow:none;border-radius:16px}
.bx-seg.dark .thumb{border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.bx-seg.dark button{color:#DDE3F0;border-radius:12px}
.bx-seg.dark button[aria-selected="true"]{color:var(--navy)}
.bx-pick{width:100%;border:none;background:#fff;color:var(--ink);display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.bx-pick[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--navy),0 8px 18px rgba(22,32,60,.1)}
.bx-pick.drop[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--crimson)}

/* ---- paper slip ---- */
.bx-slip{filter:drop-shadow(0 1px 1px rgba(22,32,60,.08)) drop-shadow(0 4px 10px rgba(22,32,60,.07));margin:0 2px}
.bx-slip:before,.bx-slip:after{content:'';display:block;height:7px}
.bx-slip:before{background:linear-gradient(45deg,transparent 50%,#fff 50%) 0 0/12px 7px repeat-x,linear-gradient(-45deg,transparent 50%,#fff 50%) 0 0/12px 7px repeat-x}
.bx-slip:after{background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/12px 7px repeat-x,linear-gradient(-135deg,#fff 50%,transparent 50%) 0 0/12px 7px repeat-x}
.bx-slip-in{position:relative;background:#fff;padding:2px 14px 5px;display:flex;flex-direction:column}
.bx-slip.dark{filter:drop-shadow(0 6px 14px rgba(0,0,0,.28))}
.bx-sl{display:grid;grid-template-columns:30px auto minmax(0,1fr);align-items:center;gap:8px;padding:6px 0}
.bx-sl + .bx-sl{border-top:1px dashed var(--dash)}
.bx-slip-in > .bx-sl:first-child .n{padding-right:92px}
.bx-sl .q{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.bx-sl .q small{font-family:Figtree,sans-serif;font-size:11px;font-weight:600;color:#6B7480;letter-spacing:0}
.bx-sl .n{min-width:0;font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.bx-sl .n .v{display:inline-block;margin-top:2px;padding:0 6px;border-radius:6px;background:var(--soft2);font-size:11px;font-weight:600;color:var(--ink2)}
.bx-sl .meta{grid-column:1 / -1;display:flex;align-items:center;gap:8px;padding-top:4px}
.bx-sl.struck .n{color:#8A93A3;text-decoration:line-through}
.bx-tile{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.bx-stamp{position:absolute;right:12px;top:-2px;transform:rotate(-8deg);padding:3px 8px 2px;border:2.5px double currentColor;border-radius:7px;mix-blend-mode:multiply;font-size:12px;font-weight:700;letter-spacing:.14em;animation:bxStamp .4s cubic-bezier(.3,1.4,.5,1) both;display:flex;flex-direction:column;align-items:center;line-height:1.1;pointer-events:none}
.bx-stamp small{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:0}
@keyframes bxStamp{0%{transform:rotate(-8deg) scale(1.7);opacity:0}60%{transform:rotate(-8deg) scale(.94);opacity:.95}100%{transform:rotate(-8deg) scale(1);opacity:.9}}

/* ---- the two-way answer slider ---- */
.bx-tri{position:relative;height:44px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px rgba(22,32,60,.08);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.bx-tri .fl,.bx-tri .fr{position:absolute;top:0;bottom:0;width:0}
.bx-tri .fl{right:50%;background:linear-gradient(270deg,rgba(142,42,34,.08),rgba(142,42,34,.28))}
.bx-tri .fr{left:50%;background:linear-gradient(90deg,rgba(15,107,67,.08),rgba(15,107,67,.28))}
.bx-tri .ll,.bx-tri .lr{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:13px;font-weight:700;pointer-events:none}
.bx-tri .ll{left:14px;color:var(--crimson)}
.bx-tri .lr{right:14px;color:var(--green)}
.bx-tri .ll,.bx-tri .lr{transition:left .3s,right .3s}
.bx-tri[data-pos="yes"] .lr{right:62px}
.bx-tri[data-pos="no"] .ll{left:62px}
.bx-tri .k{position:absolute;left:50%;top:2px;width:48px;height:40px;margin-left:-24px;border:none;border-radius:999px;padding:0;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(22,32,60,.22),inset 0 1px 0 rgba(255,255,255,.2)}
.bx-tri.settle .k{transition:transform .3s cubic-bezier(.3,1.3,.5,1),background .2s}
.bx-tri.settle .fl,.bx-tri.settle .fr{transition:width .3s cubic-bezier(.3,1.3,.5,1)}
.chevR{display:inline-block;margin-left:4px;letter-spacing:-.2em;animation:bxNudgeR 1.4s ease-in-out infinite}
.chevL{display:inline-block;margin-right:4px;letter-spacing:-.2em;animation:bxNudgeL 1.4s ease-in-out infinite}
@keyframes bxNudgeR{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(3px)}}
@keyframes bxNudgeL{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(-3px)}}

/* ---- slide to start / hand in ---- */
.bx-slide{position:relative;flex:1;height:56px;border-radius:999px;background:radial-gradient(120% 140% at 10% 50%,#26335E 0%,#16203C 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 10px 22px rgba(22,32,60,.22);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.bx-slide .road{position:absolute;left:60px;right:18px;top:27px;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 8px,transparent 8px 16px);animation:bxRoad .6s linear infinite}
.bx-slide .fill{position:absolute;left:0;top:0;bottom:0;width:56px;border-radius:999px;background:linear-gradient(90deg,rgba(201,58,48,.15),rgba(201,58,48,.55))}
.bx-slide .lab{position:absolute;left:58px;right:38px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;white-space:nowrap;pointer-events:none;overflow:hidden}
.bx-slide .lab b{font-weight:700;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bx-slide .lab i{flex:none}
.bx-slide .lab i{font-style:normal;display:inline-flex;margin-left:6px;letter-spacing:-.2em;color:var(--rose);animation:bxChev 1.4s ease-in-out infinite}
.bx-slide .flag{position:absolute;right:12px;top:18px;width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
.bx-slide .flag:after{content:'';width:6px;height:6px;border-radius:2px;background:rgba(255,255,255,.4)}
.bx-slide .k{position:absolute;left:4px;top:4px;width:48px;height:48px;border:none;border-radius:999px;padding:0;cursor:grab;touch-action:none;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(201,58,48,.5),inset 0 1px 0 rgba(255,255,255,.2);color:#fff}
.bx-slide.settle .k,.bx-slide.settle .fill{transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)}
.bx-slide[aria-disabled="true"]{opacity:.5}
@media (max-width:400px){.bx-slide .flag{display:none}.bx-slide .lab{right:14px;font-size:14px}}
@keyframes bxRoad{from{background-position:0 0}to{background-position:-16px 0}}
@keyframes bxChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}

/* ---- pushed pages and sheets ---- */
.bx-page{position:fixed;inset:0;z-index:50;background:#2A3350;overflow:auto;max-width:520px;margin:0 auto;animation:bxIn .32s cubic-bezier(.2,.9,.3,1)}
.bx-page.flat{background:var(--bg)}
.bx-page.still{animation:none}
.bx-page .card{min-height:calc(100% - 40px - var(--safe-area-inset-top));margin-top:calc(40px + var(--safe-area-inset-top));background:var(--bg);border-radius:26px 26px 0 0;overflow:hidden;overflow:clip;display:flex;flex-direction:column}
.bx-page .card > .bx-sheethead{padding-top:8px}
.bx-page .tapback{position:absolute;left:0;right:0;top:0;height:calc(40px + var(--safe-area-inset-top));border:none;background:transparent}
@keyframes bxIn{from{transform:translateY(40px);opacity:.3}}
.bx-scrim{position:fixed;inset:0;z-index:60;background:rgba(10,14,28,.5);animation:bxScrim .25s ease-out}
@keyframes bxScrim{from{opacity:0}}
.bx-sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(22px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:bxUp .35s cubic-bezier(.2,.9,.3,1)}
.bx-sheet .bx-grip{background:#D9D4CB}
@keyframes bxUp{from{transform:translateY(100%)}}

/* ---- keypad ---- */
.bx-pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.bx-pad button{height:clamp(44px, 6.4vh, 52px);border:none;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.06);color:#fff;font-family:var(--mono);font-size:22px;font-weight:500;transition:transform .08s ease,background .12s ease}
.bx-pad button:active{transform:scale(.94);background:rgba(255,255,255,.16)}
.bx-dock{background:radial-gradient(120% 90% at 20% 0%,#26335E 0%,#16203C 65%);border-radius:26px 26px 0 0;padding:12px 14px calc(18px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 30px rgba(22,32,60,.18);color:#fff}

/* ---- toast ---- */
.bx-toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:90;background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;box-shadow:0 10px 24px rgba(22,32,60,.3)}
.bx-toast.on{opacity:1;transform:translateX(-50%)}

/* ---- motion ---- */
@keyframes bxRingIn{from{stroke-dasharray:0 400}}
@keyframes bxBlink{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes bxGrow{from{transform:scaleX(0)}}
@keyframes bxGrowR{from{transform:scaleX(0)}}
@keyframes bxUpIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bxCard{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bxDrive{0%{left:0}100%{left:calc(100% - 22px)}}
@keyframes bxDriveS{0%{left:4%}100%{left:30%}}
@keyframes bxRoll{0%{transform:translateX(-6px)}50%{transform:translateX(6px)}100%{transform:translateX(-6px)}}
@keyframes bxNow{0%{box-shadow:0 0 0 0 rgba(22,32,60,.5)}100%{box-shadow:0 0 0 8px rgba(22,32,60,0)}}
@keyframes bxPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.55)}100%{box-shadow:0 0 0 10px rgba(245,178,107,0)}}
@keyframes bxPulseL{0%{box-shadow:0 0 0 0 rgba(155,163,240,.55)}100%{box-shadow:0 0 0 10px rgba(155,163,240,0)}}
@keyframes bxDot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes bxShake{0%,100%{transform:rotate(-9deg)}25%{transform:rotate(-12deg)}75%{transform:rotate(-6deg)}}
@keyframes bxSwing{0%{transform:rotate(-7deg)}35%{transform:rotate(1deg)}65%{transform:rotate(-3.5deg)}100%{transform:rotate(-2deg)}}
@keyframes bxCaret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes bxDrop{0%{transform:translateY(-60px) rotate(-12deg);opacity:0}55%{transform:translateY(3px) rotate(2deg);opacity:1}75%{transform:translateY(-3px)}100%{transform:none}}
@keyframes bxBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(2px)}70%{transform:translateY(-1px)}}
@keyframes bxNext{0%,100%{box-shadow:inset 0 0 0 2px #16203C,0 10px 22px rgba(22,32,60,.14)}50%{box-shadow:inset 0 0 0 2px #3A3F9B,0 10px 22px rgba(58,63,155,.22)}}
@keyframes bxHint{0%,100%{transform:translateX(0)}30%{transform:translateX(10px)}60%{transform:translateX(-6px)}}
@keyframes bxTruck{0%{transform:translateX(-260px)}62%{transform:translateX(6px)}72%{transform:translateX(-3px)}80%,100%{transform:translateX(0)}}
@keyframes bxGate{0%,55%{transform:rotate(0)}75%{transform:rotate(100deg)}85%{transform:rotate(86deg)}100%{transform:rotate(90deg)}}
@keyframes bxCrate{0%{transform:translate(-70px,-30px) scale(.4);opacity:0}60%{transform:translate(0,-8px) scale(1.08);opacity:1}100%{transform:none;opacity:1}}
@keyframes bxStampBig{0%{transform:rotate(-12deg) scale(2);opacity:0}60%{transform:rotate(-12deg) scale(.92);opacity:1}100%{transform:rotate(-12deg) scale(1);opacity:.92}}
@keyframes bxDust{0%{opacity:0;transform:translateX(0) scale(.5)}30%{opacity:.6}100%{opacity:0;transform:translateX(-40px) scale(1.4)}}
@keyframes bxDone{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
.a-ring{animation:bxRingIn .9s cubic-bezier(.3,.8,.3,1) both}
.a-blink{animation:bxBlink 1.5s ease-in-out infinite}
.a-grow{transform-origin:left;animation:bxGrow .8s cubic-bezier(.3,.8,.3,1) both}
.a-growr{transform-origin:right;animation:bxGrowR .8s cubic-bezier(.3,.8,.3,1) both}
.a-up{animation:bxUpIn .5s ease-out both}
.a-card{animation:bxCard .35s cubic-bezier(.2,.9,.3,1.1) both}
.a-drive{animation:bxDrive 3.6s cubic-bezier(.45,0,.2,1) .4s infinite alternate}
.a-drives{animation:bxDriveS 4s cubic-bezier(.45,0,.2,1) infinite alternate}
.a-roll{animation:bxRoll 3.2s ease-in-out infinite}
.a-now{animation:bxNow 1.8s ease-out infinite}
.a-pulsea{animation:bxPulseA 1.8s ease-out infinite}
.a-pulsel{animation:bxPulseL 1.8s ease-out infinite}
.a-dot{animation:bxDot 1.2s ease-in-out infinite}
.a-shake{animation:bxShake .5s ease-in-out .3s both}
.a-swing{transform-origin:22px 0;animation:bxSwing 1.6s cubic-bezier(.3,.7,.4,1) both}
.a-caret{animation:bxCaret 1s steps(1) infinite}
.a-drop{animation:bxDrop .55s cubic-bezier(.3,.9,.4,1.2) both}
.a-bounce{animation:bxBounce .45s ease-out}
.a-next{animation:bxNext 2.2s ease-in-out infinite}
.a-hint{animation:bxHint 1.2s cubic-bezier(.4,0,.2,1) 1s 2}
.a-truck{animation:bxTruck 1.5s cubic-bezier(.2,.8,.3,1) .1s both}
.a-gate{transform-origin:0 100%;animation:bxGate 1.9s ease-out both}
@keyframes bxGateOut{0%,55%{transform:rotate(0)}75%{transform:rotate(-100deg)}85%{transform:rotate(-86deg)}100%{transform:rotate(-90deg)}}
.a-gate{animation-name:bxGateOut}
.a-crate{animation:bxCrate .45s cubic-bezier(.2,.9,.3,1.25) both}
.a-stampbig{animation:bxStampBig .5s cubic-bezier(.3,1.4,.5,1) 3.2s both}
.a-dust{animation:bxDust .9s ease-out 1.2s both}
.a-done{animation:bxDone .4s cubic-bezier(.2,.9,.3,1.3) both}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .a-gate{transform:rotate(-90deg)}
  .a-swing{transform:rotate(-2deg)}
  .a-dust{display:none}
}

/* ---- sign in ---- */
.bx-auth{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 20% 10%,#2B3866 0%,#16203C 60%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:24px 22px calc(24px + var(--safe-area-inset-bottom))}
.bx-auth .card{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bx-auth label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--navyInk2)}
.bx-auth input{height:52px;border-radius:14px;border:none;padding:0 14px;font-size:16px;background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);outline:none}
.bx-auth input:focus{box-shadow:inset 0 0 0 2px var(--mint)}
.bx-auth .msg{min-height:20px;font-size:13px;color:var(--navyInk)}
.bx-auth .msg.err{color:var(--rose)}
.bx-search{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.bx-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:#fff;font-size:16px;padding:0}
.bx-search input::placeholder{color:var(--navyInk2)}
.bx-switch{position:relative;width:52px;height:32px;border:none;border-radius:999px;padding:0;flex:none;transition:background .2s;background:#D9D4CB}
.bx-switch[aria-checked="true"]{background:var(--green)}
.bx-switch:after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 2px 4px rgba(22,32,60,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.bx-switch[aria-checked="true"]:after{transform:translateX(20px)}

/* ==================================================================
   The manager's own pieces, on top of the shared desk look above.
   ================================================================== */
:root{ --sky:#1A5A8A; --skySoft:#DCEAF8; --teal:#0E6470; --tealSoft:#DDF1F3; --violet:#5D3FA0; --violetSoft:#ECE6FA; --slate:#3E4C63; --slateSoft:#E3E8EF; --plum:#7A3268; --plumSoft:#F6E4F1; }
.mx-prop{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;border:1px dashed #9AA1AE;color:var(--ink2);font-size:9px;font-weight:700;letter-spacing:.08em;white-space:nowrap;flex:none}
.mx-prop.dark{border-color:rgba(255,255,255,.45);color:#DDE3F0}
.mx-lock{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--soft2);font-size:12px;font-weight:600;color:var(--ink2);line-height:1.35}
.mx-top{display:flex;align-items:center;gap:12px}
.mx-top .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mx-hi{font-size:20px;font-weight:700;letter-spacing:-.01em}
.mx-date{font-size:13px;color:var(--navyInk);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mx-date i{width:3px;height:3px;border-radius:999px;background:#5C6788}
.mx-me{width:44px;height:44px;border-radius:999px;border:none;background:transparent;box-shadow:inset 0 0 0 2px var(--mint);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.mx-goal{display:flex;align-items:center;gap:16px;border:none;background:none;color:#fff;padding:0;text-align:left;width:100%}
.mx-goal .fig{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mx-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navyInk2)}
.mx-big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.mx-legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;font-weight:600;color:var(--navyInk)}
/* Manager round 1: legend chips (M1-Today-GoalLegend), the "to price" pill (M1-Today-SoldToday) */
.mx-lchips{display:flex;flex-wrap:wrap;gap:6px}
.mx-lchip{position:relative;height:30px;padding:0 10px;border:0;border-radius:999px;background:rgba(255,255,255,.08);color:#DDE3F0;font-family:inherit;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.mx-lchip::after{content:'';position:absolute;inset:-7px -2px}
.mx-lchip i{width:8px;height:8px;border-radius:999px;flex:none}
.mx-lchip.nl{box-shadow:inset 0 0 0 1px rgba(245,178,107,.55);color:#F5D2A8}
.mx-lchip.ns{background:#fff;color:var(--navy)}
.mx-lchip.ns i,.mx-nsdot{display:inline-block;border-radius:999px;background:repeating-linear-gradient(135deg,#5F6980 0 2px,#D9D4CB 2px 4px)}
.mx-lchip .icon{width:12px;height:12px}
#ce_phone[aria-invalid="true"]{color:var(--crimson)!important;background:#FFF6F4!important;box-shadow:inset 0 0 0 2px #C93A30!important}
.mx-below{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;background:#C93A30;color:#fff;font-size:10px;font-weight:700;white-space:nowrap}
.mx-toprice{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--plumSoft);color:var(--plum);font-size:11px;font-weight:700;white-space:nowrap}
.mx-toprice .icon{width:12px;height:12px}
.mx-goods{font-size:11px;font-weight:600;color:var(--navyInk2)}
.mx-legend span{display:inline-flex;align-items:center;gap:4px}
.mx-legend i{width:8px;height:8px;border-radius:999px;display:inline-block}
.mx-day{display:flex;flex-direction:column;gap:8px;padding:12px;border:none;width:100%;color:#fff;text-align:left}
.mx-day .two{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mx-day .two > span{display:flex;flex-direction:column;gap:2px}
.mx-day .l{font-size:11px;font-weight:700;color:var(--navyInk2)}
.mx-day .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;letter-spacing:-.02em}
.mx-bar{position:relative;display:flex;height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.mx-bar.light{background:#F1EEE8}
.mx-bar i{display:block;height:100%}

/* the stages strip */
.mx-pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:end}
.mx-pipe > span{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.mx-pipe .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
.mx-pipe .col{width:100%;border-radius:6px 6px 3px 3px;background:var(--navy);transform-origin:bottom;animation:mxCol .7s cubic-bezier(.3,.8,.3,1) both}
.mx-pipe .w{font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mx-pipe .st{height:16px;min-width:16px;padding:0 5px;border-radius:999px;background:var(--crimson);color:#fff;font-family:var(--mono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.mx-pipe .st.none{background:transparent}
@keyframes mxCol{from{transform:scaleY(0)}}

/* person rings */
.mx-ppl{display:grid;gap:8px}
.mx-pcard{border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 12px;border-radius:18px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);min-width:0}
.mx-pcard.one{flex-direction:row;gap:16px;padding:12px 16px;justify-content:flex-start;text-align:left}
.mx-pcard.behind{background:rgba(245,178,107,.1);box-shadow:inset 0 0 0 1.5px rgba(245,178,107,.5)}
.mx-pcard .nm{font-size:13px;font-weight:700;white-space:nowrap}
.mx-pcard .of{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--navyInk);white-space:nowrap}
.mx-delta{height:22px;padding:0 8px;border-radius:999px;font-family:var(--mono);font-size:11px;font-weight:600;display:inline-flex;align-items:center;flex:none;background:rgba(111,220,176,.14);color:var(--mint)}
.mx-delta.behind{background:var(--amber);color:var(--navy)}
.mx-delta.none{background:rgba(255,255,255,.08);color:var(--navyInk);font-family:Figtree,sans-serif}
.mx-prow{display:flex;align-items:center;gap:10px;min-height:52px;border:none;background:none;color:#fff;width:100%;text-align:left;padding:4px 0}
.mx-prow + .mx-prow,.mx-more{border-top:1px solid rgba(255,255,255,.07)}
.mx-more{display:flex;align-items:center;gap:8px;min-height:40px;font-size:12px;font-weight:700;color:var(--navyInk);border-left:none;border-right:none;border-bottom:none;background:none;width:100%;padding:0}
.mx-av{border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}

/* store: load rings and the shelf */
.mx-shelf{display:flex;gap:2px}
.mx-shelf i{width:10px;height:6px;border-radius:2px;background:var(--navy)}
.mx-shelf i.late{background:#E5483D}
.mx-shelf i.free{background:transparent;box-shadow:inset 0 0 0 1.5px #D9D4CB}
.mx-pack{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border:none;border-top:1px solid #F1EEE8;background:none;width:100%;text-align:left;color:var(--ink)}
.mx-pill{align-self:flex-start;max-width:100%;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.mx-pill .w{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mx-pill .m{flex:none}
.mx-pill.bad{background:var(--crimsonSoft);color:var(--crimson)}
.mx-pill.ok{background:var(--greenSoft);color:var(--green)}
.mx-pill.mid{background:var(--amberSoft);color:var(--amberDeep)}
.mx-pill.idle{background:var(--soft2);color:var(--ink2)}
.mx-act{height:36px;padding:0 12px;border-radius:12px;border:none;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;flex:none}
.mx-act.navy{background:var(--navy);color:#fff;box-shadow:0 6px 14px rgba(22,32,60,.2)}
.mx-act.mint{background:var(--greenSoft);color:var(--green);box-shadow:inset 0 0 0 1px #BFE6D0}
.mx-act.soft{background:var(--soft);color:var(--ink)}

/* stuck rows */
.mx-srow{display:flex;align-items:center;gap:10px;min-height:62px;padding:6px 0}
.mx-srow + .mx-srow,.mx-fold{border-top:1px solid #F1EEE8}
.mx-srow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;border:none;background:none;padding:0;text-align:left;color:var(--ink)}
.mx-over{width:64px;flex:none;display:flex;gap:1px;height:5px}
.mx-over i{display:block;height:100%}
.mx-sq{width:38px;height:38px;flex:none;border-radius:12px;border:none;display:flex;align-items:center;justify-content:center}
.mx-sq.navy{background:var(--navy);color:#fff}
.mx-sq.soft{background:var(--soft);color:var(--ink)}
.mx-fold{display:flex;align-items:center;gap:10px;min-height:42px;border-left:none;border-right:none;border-bottom:none;background:none;width:100%;padding:0;color:var(--ink2);font-size:13px;font-weight:700;text-align:left}
.mx-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.mx-chips::-webkit-scrollbar{display:none}
.mx-chip{flex:none;height:36px;padding:0 13px;border:none;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.mx-chip[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:none;font-weight:700}
.mx-chip.area{height:34px;padding:0 12px;background:var(--soft2);box-shadow:none;font-size:12px}
.mx-chip.area[aria-pressed="true"]{background:var(--ink)}
.mx-chip .n{font-family:var(--mono);font-variant-numeric:tabular-nums;opacity:.7}

/* money */
.mx-crow{display:flex;align-items:center;gap:12px;min-height:70px;border:none;background:none;width:100%;text-align:left;color:var(--ink);padding:6px 0}
.mx-crow + .mx-crow{border-top:1px solid #F1EEE8}
.mx-face{position:relative;flex:none}
.mx-face .who{position:absolute;right:-6px;bottom:-4px;width:20px;height:20px;border-radius:999px;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.mx-bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));font-size:11px;font-weight:600;color:var(--navyInk)}
.mx-bands span{display:flex;flex-direction:column}
.mx-bands b{font-family:var(--mono);font-size:13px}
/* Money, option B (Round 3) */
.mx-bands button{display:flex;flex-direction:column;align-items:flex-start;border:none;background:none;padding:0;color:inherit;font-size:11px;font-weight:600;text-align:left;min-width:0;white-space:nowrap}
.mx-sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mx-side{border:none;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;color:#fff;min-width:0;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);opacity:.75}
.mx-side[aria-selected="true"]{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);opacity:1}
.mx-side .k{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em}
.mx-side .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;letter-spacing:-.03em;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mx-side .sp{display:flex;gap:2px;height:6px;width:100%;align-items:stretch}
.mx-side .sp i{display:block;border-radius:2px}
.mx-week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:68px}
.mx-week > span{display:flex;flex-direction:column;align-items:center;gap:4px}
.mx-week .pair{display:flex;align-items:flex-end;gap:2px;height:48px}
.mx-week .pair i{display:block;width:10px;border-radius:3px 3px 1px 1px;transform-origin:bottom}
.mx-crow.two{flex-direction:column;align-items:stretch;gap:8px;padding:12px 0}
.mx-crow.two .top{display:flex;align-items:center;gap:12px}
.mx-track{position:relative;display:block;height:6px;margin:0 2px 0 54px;border-radius:999px}
.mx-track .tick{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--navy)}
.mx-track .dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:999px;box-shadow:0 0 0 2px #fff}
.mx-inrow{display:flex;align-items:center;gap:12px;min-height:62px;border:none;background:none;width:100%;text-align:left;color:var(--ink);padding:6px 0}
.mx-inrow + .mx-inrow{border-top:1px solid #F1EEE8}
/* delivered history (Round 3) */
.mx-dtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:3px;border-radius:999px;background:rgba(255,255,255,.08)}
.mx-dtabs button{height:36px;border:none;border-radius:999px;background:transparent;color:var(--navyInk);font-size:13px;font-weight:700;white-space:nowrap}
.mx-dtabs button[aria-selected="true"]{background:#fff;color:var(--navy)}
.mx-dbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:92px}
.mx-dbars button{height:92px;border:none;padding:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
/* take a payment: the record button, the stamp and the Undo window (Round 3) */
.mx-ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:3px;border-radius:16px;background:#EFECE6}
.mx-ways button{height:42px;border:none;border-radius:13px;background:transparent;color:var(--ink2);font-size:13px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-ways button[aria-checked="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(22,32,60,.12)}
.mx-recstamp{padding:10px 18px;border:3px double var(--green);border-radius:10px;color:var(--green);font-size:18px;font-weight:700;letter-spacing:.18em;transform:rotate(-4deg);animation:mxRec .5s cubic-bezier(.3,1.3,.5,1) both}
@keyframes mxRec{0%{transform:scale(1.6) rotate(-8deg);opacity:0}60%{transform:scale(.95) rotate(-4deg);opacity:1}100%{transform:rotate(-4deg);opacity:1}}
.mx-undo{position:fixed;left:16px;right:16px;bottom:calc(24px + var(--safe-area-inset-bottom));z-index:55;max-width:488px;margin:0 auto;border-radius:16px;background:var(--navy);color:#fff;overflow:hidden;box-shadow:0 12px 26px rgba(14,20,40,.3)}
.mx-undo .row{display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;min-height:54px}
.mx-undo button{height:38px;padding:0 16px;border:none;border-radius:999px;background:rgba(255,255,255,.1);color:var(--mint);font-size:13px;font-weight:700}
.mx-undo .drain{display:block;height:3px;background:var(--mint);animation-name:mxDrain;animation-timing-function:linear;animation-fill-mode:both}
@keyframes mxDrain{from{width:100%}to{width:0}}
@media (prefers-reduced-motion: reduce){.mx-recstamp{animation:none}}
.mx-way{width:38px;height:38px;flex:none;border-radius:12px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* approvals: one decision at a time */
.mx-tabs3{display:grid;gap:6px}
.mx-tab3{border:none;min-width:0;height:46px;padding:0 8px;border-radius:14px;display:flex;align-items:center;gap:7px;color:#fff;background:rgba(255,255,255,.05);text-align:left}
.mx-tab3[aria-selected="true"]{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.mx-stack{position:relative;padding:0 16px;margin-top:-34px}
.mx-stack:before,.mx-stack:after{content:'';position:absolute;height:40px;border-radius:20px}
.mx-stack:before{left:30px;right:30px;top:10px;background:#E9E5DE}
.mx-stack:after{left:23px;right:23px;top:5px;background:#F0EDE7}
.mx-decide{position:relative;z-index:1;background:#fff;border-radius:22px;box-shadow:0 2px 4px rgba(22,32,60,.06),0 14px 32px rgba(22,32,60,.12),inset 0 0 0 1px var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;animation:mxIn .4s cubic-bezier(.3,.9,.3,1) both}
@keyframes mxIn{from{opacity:0;transform:translateX(24px)}}
.mx-gauge{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:16px;background:#F7F5F2}
.mx-gauge.bad{background:var(--crimsonSoft)}
.mx-gtrack{position:relative;height:14px;border-radius:999px;background:#EFECE6}
.mx-gtrack i{position:absolute;top:0;bottom:0}
.mx-dots{display:flex;align-items:center;gap:4px}
.mx-dots i{width:14px;height:14px;border-radius:999px;display:inline-block}
.mx-hint{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--greenSoft);font-size:13px;font-weight:600;color:#0B4F31;line-height:1.35}
.mx-3btn{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.mx-3btn button{height:54px;border:none;border-radius:16px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mx-stampw{flex:none;padding:4px 10px 3px;border:3px double currentColor;border-radius:9px;font-size:14px;font-weight:700;letter-spacing:.16em;transform:rotate(-10deg);animation:bxStamp .45s cubic-bezier(.3,1.4,.5,1) both}

/* nudge */
.mx-nudge-ppl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 2px}
.mx-nudge-ppl button{flex:none;width:62px;border:none;background:transparent;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.mx-reason{border:none;width:100%;min-height:56px;padding:8px 12px;border-radius:14px;display:flex;align-items:center;gap:12px;color:#fff;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);text-align:left}
.mx-reason[aria-checked="true"]{background:rgba(111,220,176,.12);box-shadow:inset 0 0 0 1.5px var(--mint)}
.mx-bubble{padding:12px 14px;border-radius:4px 16px 16px 16px;background:#DCF8C6;color:var(--ink);font-size:14px;line-height:1.45;white-space:pre-line;border:none;width:100%;font-family:inherit;resize:none;min-height:88px;outline:none}
.mx-yesno{position:relative;height:60px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.mx-yesno .fl,.mx-yesno .fr{position:absolute;top:0;bottom:0;width:0;opacity:.3}
.mx-yesno .fl{right:50%;background:var(--navy)}
.mx-yesno .fr{left:50%;background:var(--red)}
.mx-yesno .ll,.mx-yesno .lr{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:1px;pointer-events:none;transition:color .2s}
.mx-yesno .ll{left:16px;align-items:flex-start;color:var(--ink)}
.mx-yesno .lr{right:16px;align-items:flex-end;color:#A82D24}
.mx-yesno .ll b,.mx-yesno .lr b{font-size:15px;font-weight:700}
.mx-yesno .ll .m,.mx-yesno .lr .m{font-size:11px;font-weight:600}
.mx-yesno.l .ll,.mx-yesno.r .lr{color:#fff}
.mx-yesno .k{position:absolute;top:4px;left:calc(50% - 26px);width:52px;height:52px;border:none;border-radius:14px;padding:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;box-shadow:0 2px 8px rgba(22,32,60,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.mx-yesno.settle .k,.mx-yesno.settle .fl,.mx-yesno.settle .fr{transition:transform .32s cubic-bezier(.3,1.3,.5,1),width .32s cubic-bezier(.3,1.3,.5,1),opacity .2s}
.mx-navysheet{background:radial-gradient(120% 70% at 20% 0%,#26335E 0%,#16203C 55%);color:#fff}
.mx-navysheet .bx-grip{background:rgba(255,255,255,.22)}

/* team win */
.mx-win{position:fixed;inset:0;z-index:80;background:#16203C;color:#fff;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:calc(24px + var(--safe-area-inset-top)) 20px calc(24px + var(--safe-area-inset-bottom))}
.mx-win .glow{position:absolute;left:50%;top:40px;width:380px;height:380px;margin-left:-190px;border-radius:999px;background:radial-gradient(circle,rgba(111,220,176,.22) 0%,rgba(111,220,176,0) 62%);animation:mxGlow 3s ease-in-out 2s infinite;pointer-events:none}
@keyframes mxGlow{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes mxSeg{from{stroke-dasharray:0 100}}
@keyframes mxWinStamp{0%,62%{transform:rotate(-12deg) scale(2.2);opacity:0}74%{transform:rotate(-12deg) scale(.92);opacity:1}84%{transform:rotate(-12deg) scale(1.04)}100%{transform:rotate(-12deg) scale(1);opacity:1}}
@keyframes mxTile{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.mx-win .tile{position:absolute;left:50%;top:50%;width:9px;height:14px;border-radius:2px;opacity:0;animation:mxTile 1.6s cubic-bezier(.2,.7,.4,1) 1.75s both}
.mx-win .seg{animation:mxSeg 1s cubic-bezier(.4,0,.2,1) both}
.mx-win .wstamp{position:absolute;right:-28px;bottom:8px;padding:6px 12px 5px;border:3px double var(--mint);border-radius:10px;color:var(--mint);background:rgba(22,32,60,.85);display:flex;flex-direction:column;align-items:center;gap:1px;animation:mxWinStamp 2.6s cubic-bezier(.3,1.3,.5,1) both}
@media (prefers-reduced-motion: reduce){.mx-win .tile{display:none}}
/* A big button says its words on one line; a small phone gets a size down, not a wrap. */
.bx-btn{white-space:nowrap}
/* The smallest phones (320-360 wide): the same screens, a little tighter. */
@media (max-width:360px){
  .bx-btn{font-size:15px;padding:0 12px;gap:6px}
  .mx-pipe{gap:3px}
  .mx-pipe .w{font-size:10px}
  .mx-pack{grid-template-columns:48px minmax(0,1fr) auto;gap:10px}
  .mx-pack .mx-packed,.mx-shelfwrap{display:none!important}
  .mx-drivegrid{grid-template-columns:minmax(0,1fr)!important}
  .mx-tabs3:has(> :nth-child(4)){grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .mx-tabs3 > :nth-child(4){display:none}
  .mx-pack .mx-act{width:36px;padding:0;justify-content:center}
  .mx-pack .mx-act .t{display:none}
}
/* ---- round 3 · orders: search, one order's controls, an order taken twice ---- */
.bx-nav .bx-gow{justify-self:center;margin-top:-30px;color:#A82D24;font-weight:700}
.bx-nav .bx-gow .bx-go{margin-top:0;display:flex;align-items:center;justify-content:center}
.ob-shead{background:radial-gradient(70% 80% at 100% 0%,rgba(111,220,176,.11) 0%,rgba(111,220,176,0) 70%),radial-gradient(120% 90% at 18% 20%,#2B3868 0%,#16203C 62%);color:#fff;border-radius:0 0 28px 28px;padding:calc(14px + var(--safe-area-inset-top)) 16px 14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;z-index:6}
.ob-sbox{flex:1;min-width:0;height:46px;border-radius:14px;background:#fff;color:#767F91;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;box-shadow:0 8px 18px rgba(0,0,0,.22)}
.ob-sbox input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);padding:0;-webkit-appearance:none;appearance:none}
.ob-sbox input::placeholder{color:#8D99B5}
.ob-sbox input::-webkit-search-cancel-button{display:none}
.ob-sbox button{flex:none;width:32px;height:32px;border:none;border-radius:999px;background:#EFECE6;color:#5F6980;display:flex;align-items:center;justify-content:center}
.ob-sbox button[hidden]{display:none}
.ob-tabs{display:flex;gap:6px;overflow-x:auto}
.ob-tabs button{flex:none;height:34px;padding:0 12px;border:none;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.08);color:#B3BCD2}
.ob-tabs button[aria-selected="true"]{background:#fff;color:var(--navy)}
.ob-tabs .m{opacity:.7}
.ob-scope{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:600;color:#B3BCD2}
.ob-scope span{height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;gap:5px}
.ob-scope .mint{background:rgba(111,220,176,.14);color:var(--mint)}
.ob-lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:0 4px}
.ob-mark{background:#FFE7A8;color:inherit;border-radius:3px;padding:0 1px}
.ob-orow,.ob-rrow{width:100%;border:none;background:transparent;color:var(--ink);display:flex;align-items:center;gap:12px;min-height:64px;padding:0;text-align:left}
.ob-rrow{min-height:58px;padding:0 8px}
.ob-orow + .ob-orow,.ob-rrow + .ob-rrow{border-top:1px solid #F1EEE8}
.ob-rico{width:34px;height:34px;flex:none;border-radius:999px;background:#F1EEE8;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.ob-chip{height:20px;padding:0 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;flex:none;white-space:nowrap}
.ob-ccard{width:100%;border:none;padding:12px 14px;display:flex;align-items:center;gap:12px;color:var(--ink);text-align:left}
.ob-jump{border:none;height:96px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;color:var(--ink);min-width:0}
.ob-more{height:44px;border:none;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.ob-own{height:22px;padding:0 9px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;font-size:12px;white-space:nowrap}
.ob-track{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start}
.ob-track .ln,.ob-track .fill{position:absolute;left:10%;top:11px;height:3px;border-radius:999px}
.ob-track .ln{right:10%;background:#EFECE6}
.ob-track .fill{background:var(--green)}
.ob-track .st{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}

<script>
/* ==================================================================
   Omni-Ware Manager — the team's day on a phone.

   The person who runs the team day to day: the salespeople, the buyer,
   the packers and the drivers. One self-contained page like sales.html
   and buyer.html: the same Supabase project, the same rows the owner's
   app reads. Every figure is derived from the books; every rule that
   prices an order, ages a debt or moves a job is the owner's own,
   carried over from sales.html / index.html / shared-worker.js and
   named beside it.

   What a Manager login writes (0116_manager_role.sql), and nothing else:
     saved_quotes      a packing job handed to another packer, a delivery
                       to another driver, the yes / hold / cash-first on
                       an order held for credit (payload.creditCheck),
                       and a payment recorded against a customer's bill.
     collection_trips  a buying trip given to another buyer.
     cash_txns, customer_debt_log, customers
                       a customer's payment -- a receipt, the payment
                       line, and their debt lowered by it.
   A nudge is a WhatsApp message the manager sends themselves.
   Costs, margins, the books, backups, credit limits and terms,
   invoicing and voiding, prices and pay stay the owner's, and are never
   drawn here.
   ================================================================== */
'use strict';

const OW_ENV = (function () {
  const PRODUCTION = { name: 'production', url: 'https://hgywjaifdmgrcnwxstxg.supabase.co', anon: 'sb_publishable_KsUIBYzuZRdoPsqP4T2ULw__AsCEhzV' };
  const STAGING = { name: 'staging', url: 'https://lmmyzhqdxixjnkkkgnnu.supabase.co', anon: 'sb_publishable_K7A4jZC6RSgFtyiSfV2P_w_oh8crHa5' };
  const PRODUCTION_HOSTS = ['omni-ware.vercel.app', 'omni-ware-preview.turyasingurakevin94.workers.dev'];
  if (typeof window !== 'undefined' && window.Capacitor) return PRODUCTION;
  const host = ((typeof location !== 'undefined' && location.hostname) || '').toLowerCase();
  return PRODUCTION_HOSTS.indexOf(host) === -1 ? STAGING : PRODUCTION;
})();
const sb = window.supabase.createClient(OW_ENV.url, OW_ENV.anon);
/* 0165 gave receive_payment one more argument (p_over: change or deposit,
   only when money is paid over what is owed). It is sent only when there is
   something to say, so a payment still goes through on a database that has
   not had 0165 yet; a payment over what is owed there says what to run. */
(function owPaymentArgs(){
  if (typeof sb.rpc !== 'function') return;
  const rpc = sb.rpc.bind(sb);
  sb.rpc = async (fn, args, o) => {
    if (fn === 'ow_patch_order' && args) {
      const r = await rpc(fn, args, o);
      if (!(r && r.error && (r.error.code === 'PGRST202' || /Could not find the function/i.test(String(r.error.message || ''))))) return r;
      // Before 0165: the order read fresh, only the keys asked for changed, written back.
      const got = await sb.from('saved_quotes').select('*').eq('shop_id', args.p_shop_id).eq('id', args.p_id).maybeSingle();
      if (got.error) return { data: null, error: got.error };
      if (!got.data) return { data: null, error: { message: 'This order is no longer in the books.' } };
      const payload = { ...(got.data.payload || {}), ...(args.p_patch || {}) }; (args.p_drop || []).forEach(k => { delete payload[k]; });
      const row = { payload };
      if (args.p_client_name != null) row.client_name = args.p_client_name;
      if (args.p_client_phone != null) row.client_phone = args.p_client_phone;
      if (args.p_status != null) row.status = args.p_status;
      const up = await sb.from('saved_quotes').update(row).eq('shop_id', args.p_shop_id).eq('id', args.p_id).select('*').maybeSingle();
      return up.error ? { data: null, error: up.error } : { data: up.data || { ...got.data, ...row }, error: null };
    }
    if (fn !== 'receive_payment' || !args) return rpc(fn, args, o);
    const a = { ...args }; ['p_over', 'p_ref', 'p_date', 'p_label'].forEach(k => { if (a[k] == null) delete a[k]; });
    const r = await rpc(fn, a, o);
    if (r && r.error && a.p_over && (r.error.code === 'PGRST202' || /Could not find the function/i.test(String(r.error.message || ''))))
      return { ...r, error: { ...r.error, message: 'Paying more than is owed needs one server update first: the owner runs supabase/migrations/0165_sales_money_holds_together.sql. Take only what is owed for now.' } };
    return r;
  };
})();

/* ---------------- small helpers ---------------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function n0(n){ return Math.round(Number(n) || 0).toLocaleString('en-US'); }
// One order number everywhere the Manager reads it: #0543 (glossary, Store R6 · WORD-09).
function orderNo(id){ return '#' + String(id).padStart(4, '0'); }
function signed(n){ n = Math.round(Number(n) || 0); return (n > 0 ? '+' : n < 0 ? '−' : '±') + n0(Math.abs(n)); }
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function isoOf(ts){ if (!ts) return ''; const d = new Date(typeof ts === 'string' && /^\d+$/.test(ts) ? Number(ts) : ts); if (isNaN(d)) return String(ts).slice(0, 10); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function msOf(ts){ if (ts == null || ts === '') return 0; if (typeof ts === 'number') return ts; const n = Date.parse(ts); return isNaN(n) ? (Number(ts) || 0) : n; }

const PREFS_KEY = 'ow-manager-prefs';

function buzz(p){
  if (!S.prefs.sound) return;
  try {
    if (window.owHaptic) { window.owHaptic(Array.isArray(p) && p.length >= 3 ? (p[0] >= 40 ? 'warn' : 'success') : 'light'); return; }
    if (navigator.vibrate) navigator.vibrate(p);

}
function sfx(kind){
  if (!S.prefs.sound) return;

    };
    if (kind === 'tick') tone(1800, 0, 0.03, 0.05, 'triangle');
    else if (kind === 'open') { tone(900, 0, 0.09, 0.05, 'triangle', 1400); }
    else if (kind === 'yes') { tone(130, 0, 0.12, 0.35, 'sine', 60); tone(1046, 0.05, 0.25, 0.14); tone(1568, 0.13, 0.45, 0.12); }
    else if (kind === 'no') { tone(140, 0, 0.14, 0.4, 'sine', 55); tone(220, 0.05, 0.22, 0.08, 'square', 150); tone(165, 0.18, 0.26, 0.07, 'square', 110); }
    else if (kind === 'ask') tone(660, 0, 0.12, 0.07, 'triangle', 520);
    else if (kind === 'back') tone(500, 0, 0.14, 0.06, 'triangle', 300);
    else if (kind === 'load') { tone(180, 0.18, 0.16, 0.45, 'sine', 55); tone(900, 0.2, 0.06, 0.05, 'triangle'); }
    else if (kind === 'short') { tone(150, 0.18, 0.14, 0.4, 'sine', 60); tone(120, 0.36, 0.14, 0.3, 'sine', 50); }
    else if (kind === 'stamp') { tone(110, 0, 0.12, 0.4, 'sine', 50); tone(2400, 0, 0.03, 0.03, 'square'); }
    else if (kind === 'go') { tone(70, 0, 0.5, 0.12, 'sawtooth', 140); tone(105, 0.05, 0.5, 0.06, 'sawtooth', 210); tone(880, 0.45, 0.3, 0.1); tone(1320, 0.55, 0.4, 0.08); }

async function selectAll(table, keyCol, filter){
  keyCol = keyCol || 'id';
  let rows = [], total = null;
  for (;;) {
    let q = sb.from(table).select('*', total === null ? { count: 'exact' } : undefined).eq('shop_id', S.shopId);
    if (filter) q = filter(q);
    if (rows.length) q = q.gt(keyCol, rows[rows.length - 1][keyCol]);
    const r = await q.order(keyCol, { ascending: true }).limit(1000);
    if (r.error) throw r.error;
    if (total === null) total = (typeof r.count === 'number') ? r.count : null;
    const page = r.data || [];
    rows = rows.concat(page);
    if (!page.length || (total !== null && rows.length >= total)) break;
  }
  return rows;
}

/* ---- sales.html: how a payment spreads over the bills ---- */
function payPlan(c, amount, picks){
  let left = Math.max(0, Math.round(Number(amount) || 0));
  const open = outstandingInvoices(c.id), debt0 = Number(c.debt) || 0;
  const sumDue = open.reduce((s, q) => s + balanceDue(q), 0);
  const loose = Math.max(0, debt0 - sumDue);
  const isPicked = q => !picks || picks.some(id => String(id) === String(q.id));
  let order = open;
  if (picks) { const picked = picks.map(id => open.find(q => String(q.id) === String(id))).filter(Boolean); order = picked.concat(open.filter(q => !picked.includes(q))); }
  const bills = order.map((q, i) => { const picked = isPicked(q), due = balanceDue(q), pay = picked ? Math.min(left, due) : 0; left -= pay; return { q, due, pay, picked, n: picked ? i + 1 : 0, o: open.indexOf(q) }; });
  let debt = debt0;
  bills.forEach(b => {
    if (!(b.pay > 0)) return;
    const desired = Math.max(0, quoteTotal(b.q) - (Number(b.q.amountPaid) || 0) - b.pay), after = Math.max(0, debt + desired - (Number(b.q.debtCharged) || 0));
    if (after < debt) debt = after;
  });
  const over = Math.max(0, left - Math.max(0, debt));   // a deposit already held is not more owed
  return { bills, rest: left, loose, over, after: Math.max(0, debt - left), all: Math.max(debt0, sumDue + loose), oldest: open.length ? balanceDue(open[0]) : 0 };
}

/* Who has the order now, and why it is still there -- in a few words. */
function holderOf(q){
  const T = team();

  if (q.status === 'awaiting_goods') { const tr = tripsForOrder(q)[0]; return { job: 'buying', staff: tr ? staffById(tr.assignedWorkerId) : (T.buyers[0] || null), trip: tr || null }; }
  if (q.status === 'preparing') return { job: 'packing', staff: staffById(q.assignedWorkerId) };

    const asked = open.filter(g => confirmState(q, g.supplierId).askedAt).length;
    if (no) return { w: no + ' line' + (no > 1 ? 's' : '') + ' not found', bad: true };

    if (q.pickingStatus === 'done') return { w: 'packed · not sent out' };

// Time in each stage, from the order's own stage log.
function stageTimes(q){
  const log = (Array.isArray(q.stageLog) ? q.stageLog : []).filter(e => e && e.status).map(e => ({ status: e.status, at: Number(e.at) || msOf(e.at) })).sort((a, b) => a.at - b.at);

  // passed: only the one it is in, timed from when it entered it.
