const BANDS = [{ w: 'under 7', to: 8, col: '#6FDCB0', ink: '#0F6B43', soft: '#E4F4EA', dot: '#0F6B43' }, { w: '8–21', to: 22, col: '#F5B26B', ink: '#95530C', soft: '#FDF1E2', dot: '#D98A2B' }, { w: '22–30', to: 31, col: '#E5483D', ink: '#8E2A22', soft: '#FBE4E1', dot: '#E5483D' }, { w: 'over 30', to: Infinity, col: '#F59A92', ink: '#8E2A22', soft: '#F7D5D1', dot: '#8E2A22', hatch: true }];
// Where a band ends on a 0-40 day track, so every age track in the app is drawn to one scale.
const AGE_SCALE = 40;
function agePct(days){ return Math.max(0, Math.min(100, (Number(days) || 0) / AGE_SCALE * 100)); }
function ageBand(age){ return BANDS.findIndex(b => age < b.to); }
/* accounts.html custOpenCharges / custAging, the one rule for how old a
   debt is (Manager, Sales and Accounts age it the same way): FIFO over the
   debt log, a payment paying its own bill first; a charge is as old as its
   date. What the log does not place -- a debt from before the log, or a
   charge with no date -- is "no date": its own grey part, never aged and
   never counted as new. The bands are this desk's own. */
// index.html 98936: what is still open, charge by charge, after payments (a payment naming a bill pays that bill first).
function custOpenCharges(c){
  const log = (c.debtLog || []).slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.id - b.id));
  const open = []; let credit = 0;
  log.forEach(e => {
    const amt = Number(e.amount) || 0;
    if (e.type === 'charge') { const take = Math.min(credit, amt); credit -= take; open.push({ date: e.date, remaining: amt - take, quoteId: e.quoteId }); }
    else if (e.type === 'payment') {
      let rem = amt;
      if (e.quoteId != null) for (const ch of open) { if (rem <= 0) break; if (ch.quoteId == null || String(ch.quoteId) !== String(e.quoteId)) continue; const take = Math.min(ch.remaining, rem); ch.remaining -= take; rem -= take; }
      for (const ch of open) { if (rem <= 0) break; const take = Math.min(ch.remaining, rem); ch.remaining -= take; rem -= take; }
      if (rem > 0) credit += rem;
    }
  });
  return open.filter(ch => ch.remaining > 0.5);
}
/* MGR-DATA-02 (M1-Debtor-AddsUp): what a customer owes comes from the
   books, by ow_customer_balance's rule (0169, round-1-check.sql query 4):
   the opening lines -- debt-log lines that name no order (the old book; a
   charge adds, anything else takes off, so a deposit kept is one of them)
   -- plus each invoiced, not voided order's total less what was paid on it.
   customers.debt is the stored figure: where it disagrees, the screens say
   so (custAddsUp) and Accounts checks it. */
// (A line naming an order this phone does not hold can't be checked against it: it stands as the record.)
function custOpeningLines(c){ return ((c && c.debtLog) || []).filter(l => l.quoteId == null || !quoteById(l.quoteId)); }
// The old book only (lines naming no order): what the screens call the opening balance. A line
// naming an order this phone does not hold is in the balance but listed under its own number.
function custOldBook(c){ return Math.round(((c && c.debtLog) || []).filter(l => l.quoteId == null).reduce((s, l) => s + (l.type === 'charge' ? 1 : -1) * (Number(l.amount) || 0), 0)); }
function custOpening(c){ return Math.round(custOpeningLines(c).reduce((s, l) => s + (l.type === 'charge' ? 1 : -1) * (Number(l.amount) || 0), 0)); }
// The invoiced orders that carry this customer's id (the server's rule names no order by name only).
function custBills(c){ return c ? (IX().byCust.get(String(c.id)) || []).filter(q => q.invoiced && !q.voided) : []; }
function custBillDue(q){ return Math.max(0, Math.round(quoteTotal(q)) - Math.round(Number(q.amountPaid) || 0)); }
function custBalance(c){ return c ? custOpening(c) + custBills(c).reduce((s, q) => s + custBillDue(q), 0) : 0; }
/* The stored balance against the books (Sales' R1AddsUp, both ways): null
   when they agree. */
function custAddsUp(c){
  if (!c) return null;
  const debt = Math.round(Number(c.debt) || 0), opening = custOpening(c), bills = custBills(c).reduce((s, q) => s + custBillDue(q), 0), bal = opening + bills;
  return Math.abs(debt - bal) >= 1 ? { debt, opening, bills, bal, gap: debt - bal } : null;
}
// A row's words for what is open: "Opening balance", "#0390" or "4 bills".
function custBillsWord(c){
  const ch = custOwedCharges(c), bills = ch.filter(x => x.quoteId != null);
  if (!bills.length) return ch.length ? 'Opening balance' : 'nothing open';
  return bills.length === 1 ? orderNo(bills[0].quoteId) : bills.length + ' bills';
}
function custOldBooksOnly(c){ const ch = custOwedCharges(c); return ch.length > 0 && ch.every(x => x.quoteId == null); }
/* When the stored balance does not add up, the debt log cannot age it
   (Eddy: stored 0, #0390 due): the charges come from the books instead --
   the opening lines FIFO, oldest first; each open bill as old as its
   invoice; a deposit left over pays the oldest bills first, as the next
   invoice uses it. An opening line with no date is "no date". */
function custBookCharges(c){
  if (!c) return [];
  const log = custOpeningLines(c).slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.id - b.id));
  const open = []; let credit = 0;
  const pay = (list, amt) => { let rem = amt; for (const ch of list) { if (rem <= 0) break; const take = Math.min(ch.remaining, rem); ch.remaining -= take; rem -= take; } return rem; };
  log.forEach(e => {
    const amt = Number(e.amount) || 0;
    if (e.type === 'charge') { const take = Math.min(credit, amt); credit -= take; open.push({ date: e.date, remaining: amt - take, quoteId: null, opening: true }); }
    else { const rem = pay(open, amt); if (rem > 0) credit += rem; }
  });
  const bills = custBills(c).map(q => ({ date: custISO(q.invoicedAt || q.date) || null, remaining: custBillDue(q), quoteId: q.id }))
    .sort((a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999')) || a.quoteId - b.quoteId);
  if (credit > 0) pay(bills, credit);
  return open.concat(bills).filter(ch => ch.remaining > 0.5).sort((a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999')));
}
function chargeAge(ch){ return ch && ch.date ? Math.max(0, daysBetween(String(ch.date).slice(0, 10), todayISO())) : null; }
// accounts.html's bands, the ones custAging fills: its "over 30" is b60 + b90 + b90p.
const AGE_BANDS = [{ k: 'b30', lo: 0, hi: 29 }, { k: 'b60', lo: 30, hi: 59 }, { k: 'b90', lo: 60, hi: 89 }, { k: 'b90p', lo: 90, hi: Infinity }];
function bandOf(age){ return AGE_BANDS.find(b => age >= b.lo && age <= b.hi) || AGE_BANDS[0]; }
function custAging(c){
  return memo('aging', c.id, () => {
    const parts = { b30: 0, b60: 0, b90: 0, b90p: 0 }; let oldest = 0, known = 0;
    // A charge with no date cannot be aged: it stays in "no date" with what the log does not cover, never counted as new.
    custOpenCharges(c).forEach(ch => { if (!ch.date) return; const age = Math.max(0, daysBetween(String(ch.date).slice(0, 10), todayISO())); parts[bandOf(age).k] += ch.remaining; known += ch.remaining; if (age > oldest) oldest = age; });
    // What the log cannot place (a debt from before the log, or a charge with no date) is named "no date", not dropped.
    const unknown = Math.max(0, (Number(c.debt) || 0) - known);
    return { parts, oldest, unknown };
  });
}
// Nothing of it carries a date: the whole debt is "no date".
function custUndated(c){ return c.debt > 0.5 && custAging(c).unknown >= c.debt - 0.5; }
/* MGR-DATA-02: what this desk draws -- the debt log's charges while the
   stored balance adds up (custAging, word for word), the books' when it
   does not (custBookCharges); "no date" is what the dated charges leave of
   custBalance. */
// The log ages it while it holds the whole balance: the stored figure adds up and the log's open charges are all of it.
function custUsesLog(c){ return !custAddsUp(c) && Math.abs(custOpenCharges(c).reduce((t, ch) => t + ch.remaining, 0) - custBalance(c)) < 1; }
function custOwedCharges(c){ return custUsesLog(c) ? custOpenCharges(c) : custBookCharges(c); }
function custOwedAging(c){
  if (custUsesLog(c)) return custAging(c);
  return memo('oaging', c.id, () => {
    const parts = { b30: 0, b60: 0, b90: 0, b90p: 0 }; let oldest = 0, known = 0;
    custBookCharges(c).forEach(ch => { if (!ch.date) return; const age = Math.max(0, daysBetween(String(ch.date).slice(0, 10), todayISO())); parts[bandOf(age).k] += ch.remaining; known += ch.remaining; if (age > oldest) oldest = age; });
    return { parts, oldest, unknown: Math.max(0, custBalance(c) - known) };
  });
}
function custOwedUndated(c){ const b = custBalance(c); return b > 0.5 && custOwedAging(c).unknown >= b - 0.5; }
/* Who owes the shop, from the books (custBalance): a stored 0 over a bill
   still due is listed (Eddy), and so is a stored debt the books don't
   hold -- at the books' figure, marked "Doesn't add up" -- until Accounts
   checks it. */
function debtors(){ return D().customers.map(c => ({ c, bal: custBalance(c) })).filter(d => d.bal > 0.5 || (Number(d.c.debt) > 0.5 && custAddsUp(d.c))).map(d => ({ c: d.c, bal: d.bal, age: custOwedAging(d.c).oldest })).sort((a, b) => b.age - a.age || b.bal - a.bal); }
// Owing over 30 days as this desk's age bar draws it: the open bills past 30 days.
function overBand(c){ return custOwedCharges(c).reduce((s2, ch) => { const a2 = chargeAge(ch); return s2 + (a2 != null && ageBand(a2) === BANDS.length - 1 ? ch.remaining : 0); }, 0); }
// Owing over 30 days: the part of each debt aged 30 days or more (accounts.html's "over 30").
function over30(c){ const p = custOwedAging(c).parts; return p.b60 + p.b90 + p.b90p; }
// This desk's own bands (days and weeks), filled from the same open charges; "no date" is its own part.
function debtBands(list){
  const out = BANDS.map(() => 0); out.unknown = 0;
  list.forEach(({ c }) => { custOwedCharges(c).forEach(ch => { const age = chargeAge(ch); if (age != null) out[Math.max(0, ageBand(age))] += ch.remaining; }); out.unknown += custOwedAging(c).unknown; });
  return out;
}

  return qs.length ? staffByUser(takenBy(qs[0])) : null;

/* A promise, kept or broken, derived from the payments after it was made
   (0089: never stored, always worked out). */
function promiseState(p, c){
  const paid = (c.debtLog || []).filter(l => l.type === 'payment' && l.date >= p.madeOn && l.date <= p.promisedOn).reduce((s, l) => s + l.amount, 0);
  if (p.amount == null ? paid > 0 : paid >= p.amount) return 'kept';
  return p.promisedOn < todayISO() ? 'broken' : 'open';
}
function promisesFor(c){ return (D().promises || []).filter(p => String(p.customerId) === String(c.id)).sort((a, b) => String(a.promisedOn).localeCompare(String(b.promisedOn))); }
// How many days after a bill they usually pay, from their paid invoices.
function paysInDays(c){
  const paid = customerOrdersFor(c.id).filter(q => q.invoiced && !q.voided && balanceDue(q) === 0 && (q.payments || []).length);
  const d = paid.map(q => { const last = (q.payments || []).reduce((m, p) => p.date > m ? p.date : m, ''); return last ? daysBetween(custISO(q.invoicedAt || q.date), last) : null; }).filter(x => x != null && x >= 0);
  return d.length ? Math.round(d.reduce((s, x) => s + x, 0) / d.length) : null;
}

/* ---- the credit hold (proposed: presets.creditHold, set by the owner) ----
   An order in Checking waits for a manager's yes when the customer would
   go over their credit limit with it, or has owed past the hold line. */
function holdDays(){ const h = D().presetCreditHold; return h && Number(h.days) > 0 ? Number(h.days) : 21; }
function holdIsOn(){ return !!(D().presetCreditHold && D().presetCreditHold.on !== false); }
function creditCase(q){
  if (!q || q.status !== 'draft' || q.voided) return null;
  const c = customerById(q.customerId); if (!c) return null;
  const amt = Math.max(0, orderTotal(q) - (Number(q.amountPaid) || 0)), limit = custLimit(c), withIt = c.debt + amt;
  const over = limit > 0 && withIt > limit, age = c.debt > 0 ? custOldestAge(c) : 0, old = age > holdDays();
  // SAL-016 (0167): on credit with no limit set, credit is the Manager's yes whatever the amount.
  const noLimit = !(limit > 0) && !!q.credit && Number(q.credit.pct) > 0;
  if (!over && !old && !noLimit) return null;
  return { q, c, amt, limit, withIt, over, old, noLimit, age, decision: q.creditCheck || null };
}
function heldOrders(){ return liveOrders().map(creditCase).filter(Boolean).sort((a, b) => createdMs(a.q) - createdMs(b.q)); }
function heldWaiting(){ return heldOrders().filter(x => !x.decision || x.decision.decision === 'hold'); }

/* ==================================================================
   Writing. Always onto the row as the server has it now, so another
   phone's change is never overwritten by this one's old copy: re-read,
   apply the one change through the owner's own rule, write back only
   the keys this desk touches.
   ================================================================== */
const PACK_KEYS = ['items', 'assignedWorkerId', 'pickingStatus', 'pickCursor', 'pickingAssignedAt', 'workerAcceptedAt', 'pickShortfallAckAt', 'pickingDoneAt'];
/* 0165: only the keys this desk touches go to the server, merged there
   (ow_patch_order) — a whole payload written back could drop a payment
   taken on another phone in between. Returns the row as it was saved. */
async function patchOrder(id, row, q, keys, status){
  const patch = {}, drop = [];
  keys.forEach(k => { if (q[k] === undefined) { if (row.payload && k in row.payload) drop.push(k); } else patch[k] = q[k]; });
  const r = await sb.rpc('ow_patch_order', { p_shop_id: S.shopId, p_id: Number(id), p_patch: patch, p_client_name: null, p_client_phone: null, p_drop: drop.length ? drop : null, p_status: status == null ? null : status });
  if (r.error) throw r.error;
  return r.data || { ...row, status: status == null ? row.status : status, payload: { ...(row.payload || {}), ...patch } };
}
async function changeOrder(id, fn, keys){
  const r = await sb.from('saved_quotes').select('*').eq('shop_id', S.shopId).eq('id', id).maybeSingle();
  if (r.error) throw r.error;
  if (!r.data) throw new Error('that order is no longer on the books');
  const row = r.data, q = rowToQuote(row);
  const out = fn(q);
  if (out === false) return null;
  const fresh = rowToQuote(await patchOrder(id, row, q, keys));
  const i = D().savedQuotes.findIndex(x => Number(x.id) === Number(id));
  if (i >= 0) D().savedQuotes[i] = fresh; else D().savedQuotes.push(fresh);
  saveSnapshot();
  return { q: fresh, out };
}
async function giveTrip(tripId, staffId){
  const now = new Date().toISOString();
  const r = await sb.from('collection_trips').select('*').eq('shop_id', S.shopId).eq('id', tripId).maybeSingle();
  if (r.error) throw r.error;
  if (!r.data || r.data.voided || !['open', 'assigned'].includes(r.data.status)) throw new Error('that trip is already out or done');
  const patch = { assigned_worker_id: staffById(staffId).id, status: 'assigned', assigned_at: now, accepted_at: null };
  const u = await sb.from('collection_trips').update(patch).eq('shop_id', S.shopId).eq('id', tripId);
  if (u.error) throw u.error;
  const t = rowToTrip({ ...r.data, ...patch }), i = D().collectionTrips.findIndex(x => x.id === tripId);
  if (i >= 0) D().collectionTrips[i] = t; else D().collectionTrips.push(t);
  saveSnapshot();
  return t;
}

/* ---- pushes to this phone (0120: push_outbox, sent by push-send) ----
   Asked once, quietly, as the app starts: Android's own "allow
   notifications" is the only thing that shows. The phone is this login's
   (user_id), with its staff row when it has one. A tap opens the app on
   fresh figures. Inside the installed app only. */
/* Push needs an install that carries the shop's Firebase file: the
   builds from versionCode 2 on. An older install still runs this page
   (its live update fetches it), but its native side has no Firebase,
   and asking it for a token closes the app. So the page asks the
   install first, and an old one is told to install the new app. */
async function pushInstalled(){
  try { const A = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App; const i = A && await A.getInfo(); return !!i && Number(i.build) >= 2; }
  catch (_e) { return false; }
}
function phonePush(){
  const C = window.Capacitor, P = C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.PushNotifications;
  if (!P || phonePush.on || !S.user || !S.shopId) return; phonePush.on = true;
  P.addListener('registration', async t => {
    try {
      const { data: st } = await sb.from('staff').select('id').eq('shop_id', S.shopId).eq('user_id', S.user.id).maybeSingle();
      const { error } = await sb.from('push_subscriptions').upsert({ shop_id: S.shopId, staff_id: st ? st.id : null, user_id: S.user.id, fcm_token: t.value }, { onConflict: 'fcm_token' });
      // owPushReady: this phone is signed up (the Manager's "Push to your phone" reads it).
      if (error) { window.owPushError = 'save: ' + error.message; render(); } else { window.owPushReady = true; window.owPushError = null; render(); }
    } catch (e) { window.owPushError = 'save: ' + (e && e.message || e); render(); }
  });
  // No token: a phone without Google Play services, or Firebase not in this build.
  P.addListener('registrationError', e => { window.owPushError = 'register: ' + ((e && e.error) || e); render(); });
  P.addListener('pushNotificationActionPerformed', a => { const d = (a && a.notification && a.notification.data) || {}; loadAll().then(() => { pushOpen(d); render(); }).catch(() => {}); });
  (async () => {
    try {
      if (!(await pushInstalled())) { window.owPushError = 'install: this phone has the older app'; render(); return; }
      let perm = await P.checkPermissions();
      if (perm.receive !== 'granted' && perm.receive !== 'denied') perm = await P.requestPermissions();
      if (perm.receive === 'granted') await P.register(); else { window.owPushError = 'permission: ' + perm.receive; render(); }
    } catch (e) { window.owPushError = 'register: ' + (e && e.message || e); render(); }
  })();
}
/* A tapped push opens what it is about (push-send: data = { kind, ...ref },
   every value a string). Everything the Manager decides sits under Decide
   now, so Back lands there; a thing already decided or gone opens Decide
   (or the list it lives in). An unknown kind leaves the app on Today. */
function pushOpen(d){
  try {
    const k = String((d && d.kind) || ''), id = String((d && d.id) || '');
    const same = x => String(x) === id;
    const open = (type, args) => { if (S.win) closeWin(); if (S.sheet) closeSheet(); go('today'); push('decide'); if (type) push(type, args); };
    if (k === 'price.waits') {
      const x = priceCases().find(y => same(y.q.id));
      if (!x) { open(); return; }
      S.ui.pline = 0; S.ui.psetting = null;
      // A counter sale (0120: payload counter / counterSale): the customer waits at the counter.
      if (x.q.counter || x.q.counterSale) { open(); S.ui.counterDone = null; openSheet('counter', { id: Number(x.q.id) }); return; }
      open(x.lines.some(l => l.kind === 'under') ? 'price' : 'pricenew', { id });
      return;
    }
    // The Store's "on credit?" (and a hold on a cash-only customer's order) opens the ask itself.
    if (k === 'credit.ask' || k === 'credit.hold') {
      if (creditAsks().some(y => same(y.q.id))) { if (S.ui.ck) delete S.ui.ck[Number(id)]; open('creditask', { id }); return; }
      if (k === 'credit.ask') { open(); return; }
      const i = caseList().findIndex(y => same(y.q.id)); if (i >= 0) S.ui.hold = i; open('approvals'); return;
    }
    // The Buyer asks for a carton's shelf part (0151, ref { table: 'restock_buys', id, line }).
    if (k === 'carton.ask') { open('restock', { focus: id }); return; }
    if (k === 'pick.short') { if (shortPicks().some(y => same(y.q.id))) { S.ui.spPick = null; S.ui.spDone = null; open('shortpick', { id }); } else open(); return; }
    if (k === 'agent.change' || k === 'agent.cancel') { if (agentAsks().some(y => same(y.q.id))) { S.ui.agKeep = null; open('agentask', { id }); } else open(); return; }
    if (k === 'order.delivered') { open('invoices'); return; }
    // 0139: the hourly run could not invoice it; open what clears it.
    if (k === 'invoice.held') {
      const c = String(d.code || '');
      if (c === 'OWTPC' || c === 'OWPRC') { pushOpen({ ...d, kind: 'price.waits' }); return; }
      if (c === 'OWSHP') { pushOpen({ ...d, kind: 'pick.short' }); return; }
      open('invoices'); return;
    }
    if (k === 'trip.difference') { if (tripDiffs().some(y => String(y.t.id) === id)) open('tripcount', { id }); else open(); return; }
    // The Buyer's yard note (d.id is the buyer_handoffs id): its trip, where the note sits.
    if (k === 'trip.yard_note') {

      return;
    }
    if (k === 'stock.report') { if (S.ui.wo && openReports().some(r => same(r.id))) S.ui.wo[id] = true; open('writeoff'); return; }
    if (k === 'invoice.ask') {
      const ask = openAsks('credit').concat(openAsks('void')).find(y => same(y.id));
      if (!ask) { open(); return; }
      if (ask.kind === 'void') { S.ui.vdWhy = null; open('void', { id }); } else open('return', { id });
      return;
    }
  } catch (e) { console.warn('push open', e); }
}

function bindSlides(){
  document.querySelectorAll('[data-slide]').forEach(el => {
    if (el._bound) return; el._bound = true;
    const k = el.querySelector('.k'), fill = el.querySelector('.fill'), lab = el.querySelector('.lab');
    let sx = 0, x = 0, drag = false, step = 0;
    const max = () => el.offsetWidth - 56;
    const paint = () => { k.style.transform = `translateX(${x.toFixed(1)}px)`; fill.style.width = (x + 56).toFixed(1) + 'px'; lab.style.opacity = Math.max(0, 1 - x / max() * 1.6).toFixed(2); };
    const done = () => { if (el.getAttribute('aria-disabled') === 'true') return; const k = String(el.dataset.slide || ''), f = ACT['slide:' + k] || ACT['slide:' + k.split(':')[0]]; if (f) f(el); };
    k.addEventListener('pointerdown', e => { if (el.getAttribute('aria-disabled') === 'true') return; drag = true; S.dragging = true; sx = e.clientX; x = 0; step = 0; el.classList.remove('settle'); try { k.setPointerCapture(e.pointerId); } catch (_e) {} });
    k.addEventListener('pointermove', e => { if (!drag) return; x = Math.max(0, Math.min(max(), e.clientX - sx)); const s = Math.floor(x / max() * 4); if (s !== step) { step = s; if (s > 0) FEEL.tick(); } paint(); });
    const end = () => { if (!drag) return; drag = false; S.dragging = false; el.classList.add('settle'); if (x >= max() * 0.86) { x = max(); paint(); setTimeout(done, 120); } else { if (x > 8) FEEL.back(); x = 0; paint(); } };
    k.addEventListener('pointerup', end); k.addEventListener('pointercancel', end);
    k.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); x = max(); paint(); done(); } });
  });
}

  const held = stuck.filter(q => !obUnheld(q)), nobody = stuck.filter(obUnheld);

  extra.slice(0, NY_STUCK_ROWS).forEach(q => out.push({ k: 'stuck', q }));
  if (extra.length > NY_STUCK_ROWS) out.push({ k: 'morestuck', n: extra.length - NY_STUCK_ROWS, count: extra.length - NY_STUCK_ROWS });

      <span class="mx-act soft" style="height:34px;border-radius:999px">Compare</span></button>`; }

    if (n.k === 'held') return `<button class="bx-row" data-act="push" data-p="approvals">

  return `<div class="bx-hero" data-navy-top>

        ${m.tg ? `<span style="display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--navyInk2)"><span>of <span class="m" style="color:#DDE3F0">${n0(m.tg.aim)}</span></span><span style="color:${behind ? 'var(--amber)' : 'var(--mint)'}">${m.tg.reached ? 'goal reached' : (behind ? '' : '+') + short(Math.abs(m.tg.ahead)) + (behind ? ' behind pace' : ' ahead of pace')}</span></span>` : `<span style="font-size:12px;font-weight:600;color:var(--navyInk2)">no shop goal yet</span>`}

      ${day.soldV ? `<span class="mx-bar"><i class="a-grow" style="width:${Math.min(100, Math.round(day.inV / day.soldV * 100))}%;background:var(--mint);border-radius:999px"></i></span><span style="font-size:11px;font-weight:600;color:var(--navyInk2)">money in = <span class="m" style="color:var(--mint)">${Math.round(day.inV / day.soldV * 100)}%</span> of what was sold</span>` : ''}</button>

/* ---------------- the team's day: sold vs money in, by person ---------------- */
PAGE.teamday = () => {
  const t = todayISO(), day = todayMoney(), T = team();
  const todayIds = new Set(day.sold.map(q => Number(q.id)));
  const onToday = sum(day.rec.filter(x => x.quoteId != null && todayIds.has(Number(x.quoteId))), x => x.amount);
  const oldBills = day.inV - onToday, notYet = Math.max(0, day.soldV - onToday);
  const rows = T.sales.map(s => { const sold = s.userId ? takenOn(s.userId, t) : [], soldV = sumTotal(sold), inV = s.userId ? sum(moneyInBy(s.userId, t, t), x => x.amount) : 0; return { s, sold, soldV, inV }; });
  const max = Math.max(1, ...rows.map(r => Math.max(r.soldV, r.inV)));
  // The shop's whole day, 7 to 7, stretched for anything earlier or later;
  // the hours still to come are drawn empty rather than left off.
  const hours = []; const nowH = new Date().getHours();
  const seen = day.sold.map(q => new Date(createdMs(q)).getHours()).concat(day.rec.map(x => Number(String(x.time || '').split(':')[0])).filter(h => h >= 0 && h < 24));
  for (let h = Math.min(7, nowH, ...seen); h <= Math.max(19, nowH, ...seen); h++) hours.push(h);
  const soldH = h => sum(day.sold.filter(q => new Date(createdMs(q)).getHours() === h), q => orderTotal(q));
  const inH = h => sum(day.rec.filter(x => Number(String(x.time || '').split(':')[0]) === h), x => x.amount);
  const hmax = Math.max(1, ...hours.map(h => Math.max(soldH(h), inH(h))));
  const busiest = hours.reduce((b, h) => soldH(h) > soldH(b) ? h : b, hours[0]);
  return `<button class="tapback" data-act="back" aria-label="Back"></button><div class="card">
    <div class="bx-sheethead" style="gap:16px"><span class="bx-grip"></span>
      <div style="display:flex;align-items:center;gap:10px"><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span class="bx-eyebrow">${esc(new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase())} · ${esc(hm(Date.now()))}</span><span style="font-size:20px;font-weight:700">The team's day</span></span>${closeBtn()}</div>
      <div class="bx-glass" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-radius:16px">
        <span style="padding:12px;display:flex;flex-direction:column;gap:4px"><span style="font-size:11px;font-weight:700;color:var(--navyInk2)">Sold · <span class="m">${day.sold.length}</span> ${pl(day.sold.length, 'order')}</span><span class="m" style="font-size:22px;font-weight:600">${n0(day.soldV)}</span></span>
        <span style="padding:12px;display:flex;flex-direction:column;gap:4px;border-left:1px solid rgba(255,255,255,.07)"><span style="font-size:11px;font-weight:700;color:var(--navyInk2)">Money in · <span class="m">${day.rec.length}</span> ${pl(day.rec.length, 'payment')}</span><span class="m" style="font-size:22px;font-weight:600;color:var(--mint)">${n0(day.inV)}</span></span></div>
      <div style="display:flex;flex-direction:column;gap:7px"><span style="display:flex;height:12px;gap:2px;border-radius:999px;overflow:hidden">${onToday ? `<i class="a-grow" style="flex:${onToday};background:var(--mint)"></i>` : ''}${oldBills > 0 ? `<i class="a-grow" style="flex:${oldBills};background:#2F8F6A"></i>` : ''}${notYet ? `<i style="flex:${notYet};background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 4px,rgba(255,255,255,.16) 4px 7px)"></i>` : ''}${!onToday && !(oldBills > 0) && !notYet ? '<i style="flex:1;background:rgba(255,255,255,.08)"></i>' : ''}</span>
        <span style="display:grid;grid-template-columns:1fr 1fr 1fr;font-size:11px;font-weight:600;color:var(--navyInk)"><span style="display:flex;flex-direction:column"><b class="m" style="color:var(--mint);font-size:13px">${short(onToday)}</b>paid on today's sales</span><span style="display:flex;flex-direction:column;text-align:center"><b class="m" style="color:#fff;font-size:13px">${short(Math.max(0, oldBills))}</b>old bills paid</span><span style="display:flex;flex-direction:column;text-align:right"><b class="m" style="color:#fff;font-size:13px">${short(notYet)}</b>sold, not yet paid</span></span></div>
    </div>
    <div class="bx-body">
      <div class="bx-card" style="padding:14px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;justify-content:space-between"><b style="font-size:13px">Who sold, who collected</b><span style="display:flex;gap:10px;font-size:11px;font-weight:600;color:var(--ink3)"><span style="display:inline-flex;align-items:center;gap:4px"><i style="width:8px;height:8px;border-radius:2px;background:var(--navy)"></i>sold</span><span style="display:inline-flex;align-items:center;gap:4px"><i style="width:8px;height:8px;border-radius:2px;background:var(--green)"></i>money in</span></span></div>
        ${rows.length ? rows.map((r, i) => { const p = r.soldV ? r.inV / r.soldV : 0, good = p >= .6;
          return `<button data-act="push" data-p="person" data-id="${r.s.id}" style="display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:none;background:none;padding:${i ? '12px 0 0' : '0'};${i ? 'border-top:1px solid #F1EEE8;' : ''}text-align:left;color:var(--ink)">${pav(r.s, 34)}
            <span style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span class="ell">${esc(firstWord(r.s.name))}</span><span class="m" style="font-size:12px">${n0(r.soldV)}</span></span>
              <span class="mx-bar light" style="height:7px"><i class="a-grow" style="width:${(r.soldV / max * 100).toFixed(1)}%;background:var(--navy);border-radius:999px"></i></span>
              <span class="mx-bar light" style="height:7px"><i class="a-grow" style="width:${(r.inV / max * 100).toFixed(1)}%;background:var(--green);border-radius:999px"></i></span>
              <span style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)"><span><span class="m">${r.sold.length}</span> ${pl(r.sold.length, 'order')}</span><span class="m" style="color:var(--green);font-weight:600">${n0(r.inV)}</span></span></span>
            <span class="m" style="width:46px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;${r.soldV ? (good ? 'background:var(--greenSoft);color:var(--green)' : 'background:var(--amberSoft);color:var(--amberInk)') : 'background:var(--soft2);color:var(--ink3)'}">${r.soldV ? pct(p) : '—'}</span></button>`; }).join('')
          : `<div class="bx-empty" style="padding:12px"><b>No salespeople yet</b>A staff row with the sales job and a login shows here.</div>`}
      </div>
      <div class="bx-card" style="padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;justify-content:space-between"><b style="font-size:13px">Through the day</b><span style="font-size:11px;font-weight:600;color:var(--ink3)">each hour</span></div>
        <div role="img" aria-label="Sales and money in for each hour. Busiest hour ${busiest}:00." style="height:78px;display:grid;grid-template-columns:repeat(${hours.length},minmax(0,1fr));gap:3px;align-items:end">${hours.map((h, i) => h > nowH ? `<span style="height:2px;border-radius:1px;background:var(--soft2)"></span>` : `<span style="display:flex;gap:1px;align-items:flex-end;height:100%"><i class="a-up" style="animation-delay:${i * .04}s;flex:1;height:${Math.max(2, Math.round(soldH(h) / hmax * 76))}px;border-radius:3px 3px 1px 1px;background:var(--navy)"></i><i class="a-up" style="animation-delay:${i * .04}s;flex:1;height:${Math.max(2, Math.round(inH(h) / hmax * 76))}px;border-radius:3px 3px 1px 1px;background:var(--green)"></i></span>`).join('')}</div>
        <div class="m" style="display:grid;grid-template-columns:repeat(${hours.length},minmax(0,1fr));gap:3px;font-size:10px;color:var(--ink3);text-align:center;white-space:nowrap">${hours.map((h, i) => `<span style="${h === nowH ? 'color:var(--amberInk);font-weight:600' : h === busiest && soldH(h) ? 'color:var(--ink);font-weight:600' : ''}">${h === nowH ? 'now' : (i % 2 === 0 && Math.abs(h - nowH) > 1) || (h === busiest && soldH(h)) ? (h > 12 ? h - 12 : h) + (h < 12 ? 'a' : 'p') : ''}</span>`).join('')}</div>
      </div>
      <span class="bx-hint" style="font-size:11px;color:var(--ink3)">${ic('eye', 13)}Who sold = who took it in the Sales app · money in = who recorded it</span>
    </div></div>`;
};

/* ==================================================================
   THE TEAM — each salesperson's pace, and the floor: buying, packing,
   delivery, who holds what and who is free.
   ================================================================== */
function personMonth(s){
  const g = s.userId ? personGoal(s.userId) : null;

/* Manager round 1: what a line on the slip says, at a glance.
   below cost (MGR-DATA-04): red pill, the loss each, a bar short of the cost tick;
   given away (MGR-DATA-09): green "Given away · reason"; a 0 nobody answered; to price. */
function lineFlag(it){
  if (!(Number(it.qty) > 0)) return null;
  if (lineGivenAway(it)) return 'given';
  if (lineFreeOpen(it)) return 'zero';
  if (lineBelowCost(it)) return 'below';
  if (linePriceToConfirm(it)) return 'toprice';
  return null;
}
// The flagged lines first, so the four on the slip are the ones that need a look.
function slipLines(lines){ const rank = it => ({ below: 0, zero: 1, toprice: 2, given: 3 })[lineFlag(it)] ?? 9; return lines.map((it, i) => ({ it, i })).sort((a, b) => rank(a.it) - rank(b.it) || a.i - b.i).map(x => x.it); }
function slipSummaryHTML(lines){
  const n = k => lines.filter(it => lineFlag(it) === k).length, below = n('below'), given = n('given'), zero = n('zero'), tp = n('toprice');
  const parts = [];
  if (below) parts.push(`<span style="color:var(--crimson)"><span class="m">${below}</span> ${pl(below, 'line')} below cost</span>`);
  if (zero) parts.push(`<span style="color:var(--crimson)"><span class="m">${zero}</span> at 0</span>`);
  if (given) parts.push(`<span style="color:var(--green)"><span class="m">${given}</span> given away</span>`);
  if (tp) parts.push(`<span style="color:var(--plum)"><span class="m">${tp}</span> to price</span>`);
  return parts.length ? `<span class="ell" style="flex:1;min-width:0;text-align:right;font-size:11px;font-weight:600">${parts.join(' · ')}</span>` : '<span style="flex:1"></span>';
}
function belowBarHTML(p, cost){

          ${pctRing(Math.min(1, x.age / 30), 70, 7, x.age <= custTerms(c) ? '#0F6B43' : x.old ? '#E5483D' : '#F5B26B', `<span class="m" style="font-size:18px;font-weight:600;color:${x.old ? 'var(--crimson)' : 'var(--ink)'}">${x.age}d</span>`, `Oldest bill ${x.age} days; the hold line is ${holdDays()} days`, '#EFECE6').replace('</svg>', `<line x1="35" y1="0" x2="35" y2="12" stroke="#1C2233" stroke-width="2.5" stroke-linecap="round" transform="rotate(${(holdDays() / 30 * 360).toFixed(0)} 35 35)"/></svg>`)}

ACT.hpick = t => { S.ui.hold = Number(t.dataset.i); S.ui.holdAnim = true; FEEL.tick(); render(); S.ui.holdAnim = false; };
ACT.hnext = () => { const list = caseList(); const i = S.ui.hold || 0; const nx = [1, 2, 3, 4].map(k => (i + k) % list.length).find(k => !S.ui.decided[list[k].q.id]); S.ui.hold = nx == null ? (i + 1) % list.length : nx; S.ui.holdAnim = true; FEEL.tick(); render(); S.ui.holdAnim = false; };
ACT.hdecide = async t => {
  if (S.busy) return;
  const list = caseList(), x = list[Math.min(S.ui.hold || 0, list.length - 1)]; if (!x) return;
  const v = t.dataset.v; S.busy = true;
  try {
    const res = await changeOrder(x.q.id, q => { if (q.status !== 'draft') return false; q.creditCheck = { decision: v, by: S.user ? S.user.id : null, byName: myName(), at: Date.now(), over: x.over, ageDays: x.age, limit: x.limit, withIt: x.withIt }; }, ['creditCheck']);
    if (!res) throw new Error('that order has already left Checking');
    S.ui.decided[x.q.id] = { release: 'RELEASED', cash: 'ASKED', hold: 'HELD' }[v];
    (v === 'release' ? FEEL.yes : v === 'hold' ? FEEL.no : FEEL.stamp)();
  } catch (e) { toast(failWord(e), 5000); }
  S.busy = false; render();
};

/* ---------------- the Store asks "let it go on credit?" (Round 4, CreditAsk) ----------------
   The Store, loading an unpaid order for a cash-only customer (no limit,
   no terms), asks the Manager. The ask rides on the order the way
   Approvals' answer does: payload.creditAsk = { at, by, byName, carrier }
   written by the Store's app; the answer is creditCheck (as Approvals
   writes it, with ask: true) and creditAsk.answer. A credit hold on a
   cash-only customer's order is the same question and opens here too.
   "Let it go on credit" sets the customer's limit and terms with the
   customer edit's own write (credit.set; 0122's customers guard logs it)
   and releases the order as Approvals does; "Cash first" keeps it held
   until paid, as Approvals' cash first. Both can be undone. */
function custCashOnly(c){ return !!c && !custLimit(c) && !(Number(c.termsDays) > 0); }
function creditAskOf(q){ const a = q && q.creditAsk; return a && typeof a === 'object' && a.at && !a.answer ? a : null; }
function askCase(q, c, ask){
  const amt = Math.max(0, orderTotal(q) - (Number(q.amountPaid) || 0)), orders = customerOrdersFor(c.id).filter(o => !o.voided && !o.cancelledAt);
  return { q, c, ask, amt, at: ask ? (Date.parse(ask.at) || Number(ask.at) || createdMs(q)) : createdMs(q),
    asker: ask ? (staffByUser(ask.by) || (ask.byName ? { name: ask.byName, id: 'ask:' + ask.byName } : null)) : null,
    orders: orders.length, isNew: !orders.some(o => o.invoiced) };
}
function creditAsks(){
  const out = [], seen = new Set();
  liveOrders().filter(q => !q.invoiced && creditAskOf(q)).forEach(q => { const c = customerById(q.customerId); if (c) { seen.add(Number(q.id)); out.push(askCase(q, c, creditAskOf(q))); } });
  heldWaiting().filter(x => custCashOnly(x.c) && !seen.has(Number(x.q.id))).forEach(x => out.push(askCase(x.q, x.c, null)));
  return out.sort((a, b) => a.at - b.at);
}
// Who carries it: the Store's word on the ask, else the order's carrier or driver.
function askTruck(x){ const a = x.ask || {}, cr = a.carrier || x.q.carrier || null, s = staffById(x.q.assignedDeliveryId), nm = (cr && cr.name) || (s && s.name) || ''; return nm ? firstWord(nm) + '’s truck' : 'The truck'; }
function askClock(mins){ return mins < 60 ? Math.floor(mins) + ':' + String(Math.floor((mins % 1) * 60)).padStart(2, '0') : ageWords(mins); }
const NICE_LIMITS = [100e3, 250e3, 500e3, 750e3, 1e6, 1.5e6, 2e6, 2.5e6, 3e6, 4e6, 5e6, 7.5e6, 10e6, 15e6, 20e6, 25e6, 30e6, 40e6, 50e6, 75e6, 100e6];
function niceUp(v){ return NICE_LIMITS.find(n => n >= v) || Math.ceil(v / 1e7) * 1e7; }
function limitChoices(need){ const a = niceUp(Math.max(1, need)), b = niceUp(Math.max(a + 1, need * 1.25)); return [a, b, niceUp(Math.max(b + 1, need * 2))]; }
// The card at the top of Decide now: someone is standing there.
function creditAskCardHTML(x){

  return `<button class="a-card" data-act="push" data-p="creditask" data-id="${x.q.id}" aria-label="${esc(`${x.ask ? 'Loading now: ' + who + ' asks' : 'Held: asks'} to let ${x.c.name}'s ${n0(x.amt)} order go on credit. ${x.isNew ? 'New customer, ' : ''}cash only. Asked ${ageWords(mins)} ago`)}" style="display:flex;flex-direction:column;gap:10px;padding:12px;border:none;border-radius:18px;background:#FDE8E4;box-shadow:inset 0 0 0 1.5px #F2B7AE,0 10px 24px -12px rgba(201,58,48,.45);text-align:left;color:var(--ink)">
    <span style="display:flex;align-items:center;gap:10px;width:100%">${pctRing(Math.min(1, mins / 15), 42, 3, '#C93A30', `<span class="m" style="font-size:10px;font-weight:600;color:var(--crimson)">${askClock(mins)}</span>`, '', '#F6CFC8')}
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span class="ell" style="font-size:11px;font-weight:700;letter-spacing:.1em;color:#A82D24">${x.ask ? 'LOADING NOW · ' + esc(who.toUpperCase()) + ' ASKS' : 'HELD IN ' + esc(stageOf(x.q).label.toUpperCase()) + ' · CASH ONLY'}</span><span class="ell" style="font-size:14px;font-weight:700">${esc(x.c.name)} · on credit?</span></span>
      <span class="m" style="font-size:13px;font-weight:600">${n0(x.amt)}</span></span>
    <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%">${x.isNew ? '<span style="height:22px;padding:0 8px;border-radius:999px;background:#0E6470;color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;display:inline-flex;align-items:center">NEW</span>' : ''}
      <span style="height:22px;padding:0 8px;border-radius:999px;background:#fff;color:#7A4A02;font-size:11px;font-weight:700;display:inline-flex;align-items:center;box-shadow:inset 0 0 0 1px #F5B26B">no limit · cash only</span>
      <span style="height:22px;padding:0 8px;border-radius:999px;background:#fff;color:var(--slate);font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px">${x.isNew ? '<span class="m">1st</span> order' : `<span class="m">${x.orders}</span> orders`}</span>
      ${x.ask ? `<span style="margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#A82D24">${ic('truck', 14)}truck waits</span>` : ''}</span></button>`;
}
PAGE.creditask = a => {
  const id = Number(a.id), d = (S.ui.ckDone || (S.ui.ckDone = {}))[id];
  let x = creditAsks().find(y => Number(y.q.id) === id);

/* The limit and terms, written as the customer edit writes them (ceWrite:

   change). Both are written as given, so "none" and 7 days stay exactly
   what the Manager chose, and Undo puts back exactly what was there. */
async function ckWriteCredit(c, limit, terms){
  const patch = { credit_limit: limit || null, terms_days: terms == null ? null : Number(terms) };
  const u = await sb.from('customers').update(patch).eq('shop_id', S.shopId).eq('id', c.id); if (u.error) throw u.error;
  c.creditLimit = patch.credit_limit; c.termsDays = patch.terms_days; saveSnapshot();
}
// The answer, on the order: creditCheck as Approvals writes it, and the Store's ask closed.
async function answerAsk(id, decision, extra){

  const res = await changeOrder(id, q => { if (q.invoiced || q.voided) return false;
    q.creditCheck = { decision, by, byName: myName(), at: now, ask: true, ...extra };
    if (q.creditAsk && typeof q.creditAsk === 'object') q.creditAsk = { ...q.creditAsk, answer: { decision: decision === 'release' ? 'credit' : 'cash', by, byName: myName(), at: new Date(now).toISOString(), ...extra } }; }, ['creditCheck', 'creditAsk']);

}

const PAY_METHODS = [['cash', 'Cash', 'cash'], ['mobile', 'Mobile money', 'phone'], ['bank', 'Bank', 'store']];
/* What a payment clears, oldest bill first, from the same bills the debtor
   sheet draws (custOpenCharges, the debt log). Matching savedQuotes to the
   customer missed bills the log holds -- a bill shown on the debtor sheet
   then read "no open bills" here, and "Oldest bill" fell back to the whole
   debt. receive_payment spreads the money oldest first the same way. */
function payClears(c, amount){
  let left = Math.max(0, Math.round(Number(amount) || 0));
  // MGR-DATA-02: the bills this desk draws (custOwedCharges), an opening balance named as one.
  const bills = custOwedCharges(c).map(ch => { const q = ch.quoteId != null ? quoteById(ch.quoteId) : null, due = Math.round(ch.remaining), pay = Math.min(left, due); left -= pay;
    return { label: q ? invoiceLabel(q) : ch.quoteId != null ? 'INV-' + String(ch.quoteId).padStart(4, '0') : 'Opening balance', quoteId: ch.quoteId, date: ch.date, age: chargeAge(ch), due, pay }; });
  return { bills, rest: left };
}
function payOldest(c){ const open = custOwedCharges(c); return open.length ? Math.round(open[0].remaining) : Math.round(custBalance(c)); }
/* MGR-DATA-11 (M1-PayDate): the day it was paid. A day before the order

      if (!(v > 0)) throw new Error('there is no price to set');
      if (cost && v < cost) throw new Error('that is below the cost, ' + n0(cost));
      if (how !== 'approve') it.sellPrice = v;
      it.priceReview = { state: how === 'approve' ? 'approved' : 'changed', price: v, was, qty: Number(it.qty), by: S.user ? S.user.id : null, byName: myName(), at: new Date().toISOString() };

function bindYesNo(){

  });
}

ACT.gaset = t => { const st = gaState(Number(t.dataset.id)), i = t.dataset.i, an = st.ans[i] || {}; st.ans[i] = an.k === t.dataset.k ? {} : { k: t.dataset.k, why: an.why, text: an.text }; FEEL.tick(); gaRender(); };
ACT.gawhy = t => { const st = gaState(Number(t.dataset.id)), an = st.ans[t.dataset.i] || (st.ans[t.dataset.i] = { k: 'free' }); an.k = 'free'; an.why = t.dataset.v; FEEL.tick(); gaRender(); };

/* Write the answers on the lines (re-read first; a line that moved since is

/* MGR-DATA-15 (M1-SmallInvoice): a bill under 1,000 is a second look

const SMALL_BILL = 1000, SI_WAIT = 10000;
function smallBill(q){ if (!q) return null; const t = Math.round(orderTotal(q)); return t < SMALL_BILL ? t : null; }
// A usual order: the middle total of the last 60 invoices.
function usualOrder(){

}
PAGE.smallinv = a => {

  else body = `<div class="si-card"><b>${ic('bang', 16)}Only <span class="m">${n0(tot)}</span>&nbsp;· check it</b><span role="img" aria-label="${n0(tot)} against the shop's usual order of ${n0(usual)}" style="display:flex;flex-direction:column;gap:4px"><span class="si-bar"><i style="width:${Math.max(6 / 3, Math.min(100, tot / usual * 100)).toFixed(1)}%;min-width:6px"></i></span><span style="display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--amberDeep)"><span class="m">${n0(tot)}</span><span>a usual order${usualOrder() ? ' · <span class="m">' + n0(usualOrder()) + '</span>' : ''}</span></span></span></div>

    : held ? `<div class="mx-undo" role="status"><div class="row"><span style="flex:1;font-size:13px;font-weight:600;text-align:left">Invoiced ${orderNo(q.id)}</span><span class="m" style="font-size:12px;color:var(--navyInk2)">${Math.max(1, Math.ceil((SI_WAIT - gone) / 1000))} s</span><button data-act="siundo">${ic('back', 14, 'style="stroke-width:2.4"')}Undo</button></div><span class="drain" style="animation-duration:${SI_WAIT}ms;animation-delay:-${gone}ms"></span></div>`
    : sending ? `<button class="bx-btn red" disabled>Sending…</button>`

ACT.sibill = t => {

/* The void itself (sales.html's order): the why on the order, the void --
   with its money through void_with_money when something was paid -- the
   goods back on the shelf, the supplier bills voided, the ask closed. */
async function voidAskWrite(ask, money){
  const askId = String(ask.id), why = S.ui.vdWhy || 'twice', back = (VOID_WHY.find(w => w[0] === why) || [])[2];
  {
    const r = await sb.from('saved_quotes').select('*').eq('shop_id', S.shopId).eq('id', ask.quoteId).maybeSingle(); if (r.error) throw r.error;
    const row = r.data, q = rowToQuote(row); if (!q.invoiced || q.voided) throw new Error('that invoice is not live');
    q.voidedBy = { by: S.user ? S.user.id : null, byName: myName(), at: new Date().toISOString(), why, askId: ask.id };
    q.docLog = (q.docLog || []).concat([{ at: new Date().toISOString(), kind: 'voided', what: 'Voided · ' + why }]).slice(-60);
    if (!money && (Number(row.amount_paid) || 0) > 0) throw new Error('money was paid on it since — choose a refund or a deposit');
    // 0169: the void and its money in one write first, so a refused write leaves the order as it was; the why follows.
    if (money) { await vmWrite(q.id, money); await patchOrder(q.id, row, q, ['voidedBy', 'docLog']).catch(e => console.warn('void why', e)); }
    else { await patchOrder(q.id, row, q, ['voidedBy', 'docLog']); const u = await sb.from('saved_quotes').update({ voided: true }).eq('shop_id', S.shopId).eq('id', q.id); if (u.error) throw u.error; }
    // 0165: the server takes the invoice's share off what they owe as it is voided.
    S.ui.vdLower = q.customerId != null && q.customerId !== '' ? Math.round(Number(q.debtCharged) || 0) : 0;
    // Back on the shelf: exactly what the invoice took off it (_stockTaken,
    // 0119), never the line's quantity -- a line that came straight from a
    // supplier, or a short pick, was never all on the shelf.
    if (back) { const lines = (q.items || []).filter(it => it.productId && Number(it._stockTaken) > 0).map(it => ({ key: stockKey(it.productId, it.variantIdx), productId: it.productId, variantIdx: it.variantIdx == null ? null : it.variantIdx, name: it.productName || 'Item', delta: Number(it._stockTaken), cost: Number(it.price) || null }));
      if (lines.length) await callFn('manager_stock_move', { p_shop_id: S.shopId, p_lines: lines, p_type: 'reversal', p_note: `Voided — ${invoiceLabel(q)}`, p_task: 'invoice.void' }); }
    await callFn('void_sale_bills', { p_shop_id: S.shopId, p_quote_id: q.id }).catch(e => { throw new Error('Voided, but the supplier bills for it could not be voided — ' + (e.message || e) + '. Tell Accounts.'); });
    await callFn('decide_invoice_ask', { p_id: ask.id, p_status: 'accepted' }).catch(e => { throw new Error('Voided, but the ask could not be closed — ' + (e.message || e) + '. Open it again.'); });
    // 0122's saved_quotes guard writes the owner's log line for a void itself.
    ask.status = 'accepted'; S.ui.vdDone = askId; FEEL.stamp(); loadAll().then(render).catch(() => {});
  }
}

function agentAsks(){
  return liveOrders().filter(q => !q.invoiced && (q.agentCancel && !q.agentCancel.closed || (q.agentChange && q.agentChange.state === 'asked' && (q.agentChange.lines || []).some(l => l && !l.decision))))
    .map(q => ({ q, cancel: !!q.agentCancel && !q.agentCancel.agreed, lines: (q.agentChange && q.agentChange.state === 'asked' ? (q.agentChange.lines || []).filter(l => l && !l.decision) : []), agent: q.originAgentName || (q.client && q.client.name) || 'Agent' }));
}
function agentKey(x){ return String(x && x.productId) + '::' + (x == null || x.variantIdx == null ? '' : String(x.variantIdx)); }
PAGE.agentask = a => {

/* ---------------- the Buyer's restock list: "not yet" ----------------
   Restock buying is the Buyer's (buy.restock, 0125): the lines it plans
   land in restock_buys, and the Manager may hold one (restock.hold, 0136
   hold_restock_buy). The Buyer is pushed for each hold and each release. */
function restockLines(){ return (D().restockLines || []).filter(r => r.status === 'planned' || r.status === 'held'); }
function restockBuyer(){ const r = restockLines()[0], s = r && staffByUser(r.createdBy); return s ? s.name : 'The buyer'; }

/* ---- a carton far bigger than the sale (Round 4, RestockHold; 0151) ----
   The supplier sells only whole cartons and the shelf part is over ten
   times what the order needs: the Buyer adds the shelf part to
   restock_buys as 'held', with no held_by and for_line '<order id>:<line
   id>', and the Manager is pushed (carton.ask). Approve lets it go
   (hold_restock_buy(id, false): 'planned'); Refuse cancels it, and the
   Buyer buys only what the order needs. On a database without 0151 there
   is no for_line, and a held line is the ordinary "not yet". */
function cartonAsks(){ return restockLines().filter(r => r.status === 'held' && r.forLine && !r.heldBy && !(S.ui.ctn && S.ui.ctn[r.id])); }

/* One write for a customer's fields, the way every edit and its undo goes.

async function ceWrite(c, vals, undo){
  const was = ceStart(c), patch = {}, det = {};
  if (vals.name !== undefined && vals.name && vals.name !== was.name) { patch.name = vals.name; det.name = [was.name, vals.name]; }
  if (vals.phone !== undefined && vals.phone !== was.phone) { patch.phone = vals.phone; det.phone = [was.phone, vals.phone]; }
  if (vals.area !== undefined && vals.area !== was.area) { patch.location = vals.area; det.location = [was.area, vals.area]; }
  if (vals.limit !== undefined && vals.limit !== was.limit) patch.credit_limit = vals.limit || null;
  if (vals.terms !== undefined && vals.terms !== was.terms) patch.terms_days = vals.terms;
  if (!Object.keys(patch).length) return false;
  const u = await sb.from('customers').update(patch).eq('shop_id', S.shopId).eq('id', c.id); if (u.error) throw u.error;
  if ('name' in patch) c.name = patch.name; if ('phone' in patch) c.phone = patch.phone; if ('location' in patch) c.location = patch.location;
  if ('credit_limit' in patch) c.creditLimit = patch.credit_limit; if ('terms_days' in patch) c.termsDays = patch.terms_days;
  saveSnapshot();
  const dk = Object.keys(det);
  if (dk.length) logDecision('customer.edit', `${undo ? 'Undid: ' : ''}${c.name}: ${dk.map(f => `${f === 'location' ? 'area' : f} ${det[f][0] || '—'} → ${det[f][1] || '—'}`).join('; ')}`,
    { ref: { table: 'customers', id: c.id }, before: Object.fromEntries(dk.map(f => [f, det[f][0]])), after: Object.fromEntries(dk.map(f => [f, det[f][1]])) });
  return true;
}

  if (k === 'goals') return push('teamrules', {});
  if (k === 'agents') { const x = first(agentAsks()); return x ? push('agentask', { id: x.q.id }) : push('decide', {}); }
  if (k === 'customers') return go('money');
  if (k === 'hand') return go('orders');
  return go('team');
}
ACT.door = t => { const d = DOORS.find(x => x.k === t.dataset.v); if (!d) return;
  if (d.open()) { S.ui.door = null; FEEL.open(); doorGo(d.k); return; }
  FEEL.tick(); S.ui.door = S.ui.door === d.k ? null : d.k; render(); };
ACT.pref = t => { const k = t.dataset.k; S.prefs[k] = !S.prefs[k]; savePrefs(); applyPrefs(); if (k === 'sound' && S.prefs.sound) FEEL.yes(); render(); };
// One stray tap must not throw away the books on this phone: the first tap asks.
ACT.switchshop = () => switchShop();
ACT.signout = async () => {
  if (!S.signoutSure) { S.signoutSure = true; render(); setTimeout(() => { S.signoutSure = false; if (S.stack.length) render(); }, 4000); return; }
  try { localStorage.removeItem(snapKey()); } catch (_e) {} try { await sb.auth.signOut(); } catch (_e) {} location.reload();
};

/* ---------------- the team's win ----------------
   Once per goal, the first time the team passes it: the ring closes one
   salesperson at a time, a rising note for each, the stamp lands with a
   thud, and the whole team's chord. Tapping the ring plays it again. */
function playChime(){
  if (!S.prefs.sound) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = playChime.ctx || (playChime.ctx = new AC()); if (ctx.state === 'suspended') ctx.resume();
    const t0 = ctx.currentTime + 0.05;
    const note = (f, at, len, peak, type) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type || 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0 + at); g.gain.exponentialRampToValueAtTime(peak, t0 + at + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + len); o.connect(g); g.connect(ctx.destination); o.start(t0 + at); o.stop(t0 + at + len + 0.05); };
    [[523.25, .2], [659.25, .7], [783.99, 1.2]].forEach(([f, at]) => { note(f, at, .6, .18); note(f * 2, at, .4, .05, 'sine'); });
    const th = ctx.createOscillator(), tg = ctx.createGain(); th.type = 'sine'; th.frequency.setValueAtTime(140, t0 + 1.75); th.frequency.exponentialRampToValueAtTime(50, t0 + 1.95);
    tg.gain.setValueAtTime(0.0001, t0 + 1.75); tg.gain.exponentialRampToValueAtTime(0.5, t0 + 1.76); tg.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.05); th.connect(tg); tg.connect(ctx.destination); th.start(t0 + 1.75); th.stop(t0 + 2.1);
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => note(f, 1.85 + i * 0.03, 1.6, 0.12));
  } catch (_e) {}
  buzz([20, 40, 60]);
}
function playKaching(){
  if (!S.prefs.sound) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = playChime.ctx || (playChime.ctx = new AC()); if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime + 0.02;
    [[2093, 0.08, 0.2], [2637, 0.08, 0.14], [3136, 0.16, 0.18], [4186, 0.16, 0.1]].forEach(([f, at, peak]) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + at); g.gain.exponentialRampToValueAtTime(peak, t + at + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + at + 1.2); o.connect(g); g.connect(ctx.destination); o.start(t + at); o.stop(t + at + 1.3); });
  } catch (_e) {}
}
function winKey(tg){ return 'ow-manager-win:' + S.shopId + ':' + (tg.id || '') + ':' + tg.from; }
function maybeTeamWin(){
  const tg = salesTarget(); if (!tg || !tg.reached) return;
  let seen = null; try { seen = localStorage.getItem(winKey(tg)); } catch (_e) {}
  if (seen) return;
  try { localStorage.setItem(winKey(tg), String(Date.now())); } catch (_e) {}
  showWin();
}
function showWin(){
  const m = teamMonth(), tg = m.tg; if (!tg) return;
  S.win = true;
  let host = document.getElementById('mx_win'); if (!host) { host = document.createElement('div'); host.id = 'mx_win'; document.body.appendChild(host); }
  const whole = Math.max(tg.aim, tg.actual), parts = m.people.concat(m.rest > 0 ? [{ s: null, v: m.rest }] : []).filter(p => p.v > 0);
  let at = 0;
  const segs = parts.map((p, i) => { const len = p.v / whole * 100, c = `<circle class="seg" style="animation-delay:${.2 + i * .5}s" cx="110" cy="110" r="92" fill="none" stroke="${p.s ? personCol(p.s)[2] : 'rgba(255,255,255,.35)'}" stroke-width="20" pathLength="100" stroke-dasharray="${Math.max(.01, len - .8).toFixed(2)} 100" stroke-dashoffset="${(-at).toFixed(2)}"/>`; at += len; return c; }).join('');
  const early = daysBetween(todayISO(), tg.to);
  const tiles = [[-130, -120, 220], [120, -140, -180], [-150, 30, 160], [150, 20, -240], [-90, -160, 300], [80, -170, -120], [-160, -60, 90], [165, -70, 200], [30, -180, -260], [-40, -175, 140]].map(([x, y, r], i) => `<i class="tile" style="--x:${x}px;--y:${y}px;--r:${r}deg;background:${['#8EC3F0', '#7FD3DC', '#B9A6F0', '#F5B26B', '#6FDCB0'][i % 5]}"></i>`).join('');
  const msg = `Team, we passed ${monthWord()}! ${n0(tg.actual)} sold against ${n0(tg.aim)}${early > 0 ? ' — ' + early + ' day' + (early > 1 ? 's' : '') + ' early' : ''}. Thank you ${team().all.map(s => firstWord(s.name)).join(', ')}.`;
  host.innerHTML = `<div class="mx-win" role="dialog" aria-label="The team passed the goal"><span class="glow"></span>
    <span class="bx-eyebrow" style="align-self:flex-start">${esc(new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long' }).toUpperCase())}</span>
    <button data-act="winplay" aria-label="The team ring, closed. Tap to hear it again" style="position:relative;width:220px;height:220px;border:none;background:none;padding:0;color:#fff;margin-top:20px">
      <svg width="220" height="220" viewBox="0 0 220 220" aria-hidden="true" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="110" cy="110" r="92" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="20"/>${segs}</svg>
      <span style="position:absolute;inset:34px;border-radius:999px;background:radial-gradient(circle at 40% 30%,#26335E,#1A2546);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span class="m" style="font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1">${Math.round(tg.pct * 100)}<span style="font-size:22px">%</span></span><span style="font-size:12px;font-weight:600;color:var(--navyInk2)">${early > 0 ? early + ' day' + (early > 1 ? 's' : '') + ' early' : 'goal reached'}</span></span>
      <span aria-hidden="true">${tiles}</span>
      <span class="wstamp"><span style="font-size:20px;font-weight:700;letter-spacing:.18em;line-height:1;padding-left:.18em">TEAM GOAL</span><span style="font-size:10px;font-weight:700;letter-spacing:.2em">${esc(monthWord().toUpperCase())} · DONE</span></span></button>
    <span class="a-up" style="animation-delay:2s;margin-top:18px;display:flex;align-items:baseline;gap:8px"><span class="m" style="font-size:15px;color:var(--navyInk2)">UGX</span><span class="m" style="font-size:38px;font-weight:600;letter-spacing:-.04em">${n0(tg.actual)}</span></span>
    <span class="a-up" style="animation-delay:2.1s;font-size:13px;color:var(--navyInk)">sold by the team · goal <span class="m" style="color:#fff">${n0(tg.aim)}</span></span>
    ${m.people.length ? `<div class="bx-glass a-up" style="animation-delay:2.3s;width:100%;margin-top:20px;padding:14px;display:grid;grid-template-columns:repeat(${Math.min(3, m.people.length)},minmax(0,1fr));gap:12px 8px">${m.people.map(p => { const g = p.s.userId ? personGoal(p.s.userId) : null;
      return `<span style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="position:relative">${pav(p.s, 44, '0 0 0 3px ' + personCol(p.s)[2])}${g && g.reached ? `<span style="position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:999px;background:var(--mint);color:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #16203C">${ic('tick', 11, 'style="stroke-width:3.4"')}</span>` : ''}</span><b style="font-size:13px">${esc(firstWord(p.s.name))}</b><span class="m" style="font-size:12px;color:var(--navyInk)">${short(p.v)}${g ? ` · <span style="color:${g.reached ? 'var(--mint)' : '#fff'}">${pct(g.pct)}</span>` : ''}</span></span>`; }).join('')}</div>` : ''}
    <div class="a-up" style="animation-delay:2.6s;width:100%;margin-top:auto;padding-top:20px;display:flex;gap:8px"><button class="bx-btn glass" data-act="winclose">Done</button><a class="bx-btn red" style="flex:1.6" href="${esc(waComposeUrl('', msg))}" target="_blank" rel="noopener" data-act="winshare" data-keep>${ic('wa', 20)}Tell the team</a></div></div>`;
  document.body.style.overflow = 'hidden';
  if (!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(playChime, 400);
}
function closeWin(){ S.win = false; const host = document.getElementById('mx_win'); if (host) host.innerHTML = ''; document.body.style.overflow = S.stack.length ? 'hidden' : ''; }
ACT.win = () => showWin();
ACT.winplay = () => playChime();
ACT.winclose = () => closeWin();
ACT.winshare = () => { FEEL.ask(); };

boot();
