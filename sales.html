<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16203C">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>Omni-Ware Sales</title>
<!-- The phone app's native layer (apps/sales). Inert in a browser. It
     lives here rather than in the app's own files so a fix to it reaches
     installed phones the same way any change to this page does. -->
<script>
/* The sales page inside the Android app (apps/sales).

   First in <head>, and only does anything inside the app. Four jobs:

   1. Back (Android) closes what is on top -- a photo, a sheet, then the tab
      -- before it ever leaves the app, and leaving only puts it in the
      background so it reopens instantly.
   2. The status bar: the page draws to the top edge, so a strip behind the
      clock takes the colour of whatever is under it, and its icons stay
      readable against it.
   3. The bars' size: Capacitor measures them into --safe-area-inset-*,
      but a page it has not measured (some phones, after a reload) would
      read zero and slide under the clock -- so the last good measurement
      stands in until it does.
   4. Staying current without a store release: the installed app checks the
      live sales.html now and then, keeps a copy of a new one on the phone,
      and switches to it the next time the app goes to the background --
      never in the middle of an order. */
(function(){
  'use strict';
  var C = window.Capacitor;
  if(!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return;
  var P = C.Plugins || {};
  var App = P.App, Bars = P.SystemBars, WebView = P.WebView, Http = P.CapacitorHttp, FS = P.Filesystem;
  var NAVY = '#16203C';
  var root = document.documentElement;
  // The first installs carried this layer as their own native.js. On those
  // it is already running from above, and only the bars' size (3) is new.
  var legacy = !!document.querySelector('script[src="native.js"]');

  window.owHaptic = function(kind){
    var H = P.Haptics;
    if(!H) return;
    (kind === 'success' ? H.notification({ type: 'SUCCESS' }) : H.impact({ style: 'LIGHT' })).catch(function(){});
  };

  /* ---- 1. back ---- */
  // The page keeps its own stack of what is open (window.sxBack): a sheet,
  // then a screen pushed over a tab, then the tab itself back to Today.
  function back(){
    if(typeof window.sxBack === 'function' && window.sxBack()) return;
    if(App) App.minimizeApp();
  }
  if(App && !legacy) App.addListener('backButton', back);

  /* ---- 2. the strip behind the status bar ---- */
  var strip = null, lastStyle = '';
  function paintBar(){
    if(!strip) return;
    var top = strip.offsetHeight;
    var host = document.querySelector('#sx_pages .sx-page:last-child') || document;
    var navy = host.querySelector('[data-navy-top]:not([hidden])');
    var onNavy = !!document.querySelector('.sx-auth') || (navy && navy.getBoundingClientRect().top <= top && navy.getBoundingClientRect().bottom > top);
    strip.style.background = onNavy ? NAVY : 'var(--bg)';
    var style = onNavy || document.querySelector('.sx-scrim') ? 'DARK' : 'LIGHT';
    if(style !== lastStyle && Bars){ lastStyle = style; Bars.setStyle({ style: style }).catch(function(){}); }
  }
  var queued = false;
  function soon(){ if(queued) return; queued = true; requestAnimationFrame(function(){ queued = false; paintBar(); }); }
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(insets, 800);
    setTimeout(insets, 2500);
    window.addEventListener('resize', function(){ setTimeout(insets, 300); });
    if(App) App.addListener('resume', function(){ setTimeout(insets, 300); });
    if(legacy) return;
    strip = document.createElement('div');
    strip.setAttribute('aria-hidden', 'true');
    strip.style.cssText = 'position:fixed;top:0;left:0;right:0;height:var(--safe-t, 0px);z-index:59;pointer-events:none;background:' + NAVY + ';';
    document.body.appendChild(strip);
    new MutationObserver(soon).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class'] });
    document.addEventListener('scroll', soon, { passive: true, capture: true });
    paintBar();
  });


  /* ---- 3. the bars' size ---- */
  var INSETS = 'ow-app-insets';
  function insets(){
    if(typeof C.getPlatform === 'function' && C.getPlatform() !== 'android') return;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:var(--safe-t, 0px);padding-bottom:var(--safe-b, 0px);';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe), top = parseFloat(cs.paddingTop) || 0, bottom = parseFloat(cs.paddingBottom) || 0;
    probe.remove();
    var measured = root.style.getPropertyValue('--safe-area-inset-top') !== '';
    var last = {};
    try{ last = JSON.parse(localStorage.getItem(INSETS)) || {}; }catch(_e){}
    if(measured && top > 0){
      if(last.top !== top || last.bottom !== bottom){ try{ localStorage.setItem(INSETS, JSON.stringify({ top: top, bottom: bottom, ours: false })); }catch(_e){} }
      return;
    }
    // Measured at zero: Android has laid the page out below its bars itself.
    if(measured || top > 0) return;
    // Not measured, and the page fills the whole screen -- it is under the
    // bars with nothing telling it how tall they are.
    if(!last.top && Math.abs(screen.height - window.innerHeight) > 16) return;
    root.style.setProperty('--safe-area-inset-top', (last.top || 32) + 'px');
    root.style.setProperty('--safe-area-inset-bottom', (last.bottom || 32) + 'px');
  }

  /* ---- 4. staying current ---- */
  if(legacy || !(WebView && Http && FS && App && window.crypto && crypto.subtle)) return;
  var SOURCE = 'https://omni-ware.vercel.app/sales.html';
  var KEY = 'ow-sales-bundle';
  var EVERY = 30 * 60 * 1000;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(_e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_e){} }
  function header(h, name){
    var k = Object.keys(h || {}).filter(function(x){ return x.toLowerCase() === name; })[0];
    return k ? h[k] : '';
  }
  function sha256(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  // A file of the bundle running now, as base64 for the Filesystem plugin.
  function fileB64(name){
    return fetch(name, { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error(name + ': ' + r.status);
      return r.blob();
    }).then(function(blob){
      return new Promise(function(ok, fail){
        var fr = new FileReader();
        fr.onload = function(){ ok(String(fr.result).split(',')[1] || ''); };
        fr.onerror = fail;
        fr.readAsDataURL(blob);
      });
    });
  }
  function current(){ return fetch('bundle.json', { cache: 'no-store' }).then(function(r){ return r.json(); }); }

  // After a switch: make the new copy the one the app opens with, and drop
  // the copies nothing points at any more.
  function settle(){
    var s = load();
    if(!s.staged) return Promise.resolve();
    return WebView.getServerBasePath().then(function(cur){
      if(!cur || cur.path !== s.staged.path) return;
      return WebView.persistServerBasePath().then(function(){
        var keep = s.staged.dir;
        s.etag = s.staged.etag;
        delete s.staged;
        save(s);
        return FS.readdir({ path: 'live', directory: 'DATA' }).then(function(r){
          return Promise.all((r.files || []).map(function(f){
            var n = typeof f === 'string' ? f : f.name;
            return n === keep.split('/').pop() ? null : FS.rmdir({ path: 'live/' + n, directory: 'DATA', recursive: true }).catch(function(){});
          }));
        }).catch(function(){});
      });
    });
  }

  function check(){
    var s = load();
    if(s.staged || Date.now() - (s.checked || 0) < EVERY) return Promise.resolve();
    s.checked = Date.now();
    save(s);
    return Promise.all([current(), Http.request({ url: SOURCE, method: 'GET', responseType: 'text',
      headers: s.etag ? { 'If-None-Match': s.etag } : {} })]).then(function(pair){
      var mine = pair[0], res = pair[1];
      if(res.status !== 200) return;
      var html = typeof res.data === 'string' ? res.data : '';
      // Half a page is worse than an old page.
      if(html.length < 100000 || html.indexOf('</html>') === -1) return;
      var etag = header(res.headers, 'etag');
      return sha256(html).then(function(hash){
        if(hash === mine.source){ s.etag = etag; save(s); return; }
        var dir = 'live/' + hash.slice(0, 16);
        var rest = (mine.files || []).filter(function(f){ return f !== 'index.html' && f !== 'bundle.json'; });
        return FS.writeFile({ path: dir + '/index.html', data: window.owAppTransform(html), directory: 'DATA', encoding: 'utf8', recursive: true })
          .then(function(){
            return rest.reduce(function(p, f){
              return p.then(function(){ return fileB64(f); })
                .then(function(b64){ return FS.writeFile({ path: dir + '/' + f, data: b64, directory: 'DATA', recursive: true }); });
            }, Promise.resolve());
          })
          .then(function(){
            return FS.writeFile({ path: dir + '/bundle.json', data: JSON.stringify({ source: hash, files: mine.files }), directory: 'DATA', encoding: 'utf8', recursive: true });
          })
          .then(function(){ return FS.getUri({ path: dir, directory: 'DATA' }); })
          .then(function(u){
            var s2 = load();
            s2.staged = { dir: dir, path: decodeURI(String(u.uri).replace(/^file:\/\//, '')), etag: etag };
            save(s2);
          });
      });
    }).catch(function(){
      // No signal, or the server is down: the copy already here carries on.
    });
  }

  App.addListener('pause', function(){
    var s = load();
    if(s.staged) WebView.setServerBasePath({ path: s.staged.path }).catch(function(){});
  });
  App.addListener('resume', function(){ check(); });
  settle().catch(function(){}).then(function(){ setTimeout(check, 5000); });
})();
</script>

<!-- The faces load without holding the page up: on a dead connection the
     sheet never lands and the system stack carries on. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F7F5F2; --paper:#FFFFFF; --navy:#16203C; --navy2:#243052; --ink:#1C2233; --ink2:#5F6980; --ink3:#767F91;
  --line:#ECE8E1; --rule:#E6E3DD; --soft:#F4F2EE; --soft2:#EFECE6;
  --red:#C93A30; --mint:#6FDCB0; --amber:#F5B26B; --amberInk:#95530C; --amberSoft:#FDEEE1;
  --green:#0F6B43; --greenSoft:#E4F4EA; --crimson:#8E2A22; --crimsonSoft:#FBE5E2;
  --indigo:#3A3F9B; --indigoSoft:#E4E6FA; --sky:#1A5A8A; --skySoft:#DCEAF8; --plum:#7A3268; --plumSoft:#F6E4F1;
  --navyInk:#B3BCD2; --navyInk2:#8D99B5;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --safe-area-inset-top:env(safe-area-inset-top,0px); --safe-area-inset-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea{font-family:inherit;color:var(--ink)}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- shell ---- */
#sx_app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(96px + var(--safe-area-inset-bottom))}
.sx-view{animation:sxFade .25s ease-out}
@keyframes sxFade{from{opacity:.4}to{opacity:1}}
.sx-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#FFFFFF;box-shadow:0 -1px 0 var(--line),0 -10px 24px rgba(22,32,60,.05);padding:10px 0 calc(12px + var(--safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:start;max-width:520px;margin:0 auto}
.sx-nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink3);font-size:11px;font-weight:600;padding:0;position:relative}
.sx-nav button[aria-current="page"]{color:var(--navy);font-weight:700}
.sx-nav button[aria-current="page"] .icon{fill:var(--navy)}
.sx-nav .sx-plus{justify-self:center;margin-top:-30px;width:64px;height:64px;border-radius:999px;background:var(--red);color:#fff;box-shadow:0 0 0 5px var(--bg),0 10px 24px rgba(201,58,48,.35);justify-content:center}
.sx-nav .sx-plus .icon{width:28px;height:28px;stroke-width:2.6;fill:none!important}
.sx-badge{position:absolute;top:-4px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}

/* ---- navy hero ---- */
.sx-hero{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;border-radius:0 0 28px 28px;padding:calc(14px + var(--safe-area-inset-top)) 18px 20px;display:flex;flex-direction:column;gap:16px}
.sx-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--navyInk2)}
.sx-h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.sx-pagehead{padding:calc(14px + var(--safe-area-inset-top)) 16px 0;display:flex;align-items:center;gap:10px}
.sx-pagehead h1{flex:1;font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.sx-body{padding:14px 16px 0;display:flex;flex-direction:column;gap:12px}
.sx-glass{border-radius:16px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.sx-circle{width:40px;height:40px;border-radius:999px;border:none;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.sx-circle.light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}

/* ---- cards / rows ---- */
.sx-card{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(22,32,60,.05),inset 0 0 0 1px var(--line)}
.sx-card.pad{padding:14px}
.sx-list{padding:0 14px}
.sx-row{display:flex;align-items:center;gap:12px;min-height:60px;border:none;background:none;width:100%;text-align:left;padding:8px 0}
.sx-row + .sx-row{border-top:1px solid #F1EEE8}
.sx-av{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.sx-av.s{width:32px;height:32px;font-size:11px}
.sx-t{font-size:15px;font-weight:700}
.sx-sub{font-size:12px;color:var(--ink3)}
.sx-chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.sx-sec{display:flex;align-items:baseline;justify-content:space-between;padding:4px 4px 0}
.sx-sec b{font-size:14px;font-weight:700}
.sx-sec span{font-size:12px;font-weight:600;color:var(--ink3)}
.sx-empty{padding:28px 16px;text-align:center;color:var(--ink3);font-size:14px}
.sx-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---- buttons ---- */
.sx-btn{height:52px;border-radius:16px;border:none;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.sx-btn.red{background:var(--red);color:#fff;box-shadow:0 10px 22px rgba(201,58,48,.3)}
.sx-btn.navy{background:var(--navy);color:#fff}
.sx-btn.ghost{background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.sx-btn.green{background:var(--green);color:#fff}
.sx-btn[disabled]{opacity:.45;pointer-events:none}
.sx-pill{height:36px;padding:0 14px;border:none;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;flex:none}
.sx-pill[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:none;font-weight:700}
.sx-seg{display:flex;padding:3px;border-radius:999px;background:var(--soft2)}
.sx-seg button{height:34px;padding:0 14px;border:none;border-radius:999px;background:transparent;font-size:13px;font-weight:600;color:var(--ink2)}
.sx-seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(22,32,60,.1)}
.sx-seg.dark{background:rgba(255,255,255,.08)}
.sx-seg.dark button{color:var(--navyInk)}
.sx-seg.dark button[aria-pressed="true"]{background:#fff;color:var(--navy)}

/* ---- search ---- */
.sx-search{display:flex;align-items:center;gap:10px;height:52px;padding:0 10px 0 14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule)}
.sx-search:focus-within{box-shadow:0 0 0 2px var(--navy),0 6px 16px rgba(22,32,60,.08)}
.sx-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px;padding:0}

/* ---- paper slip ---- */
.sx-paper{filter:drop-shadow(0 1px 1px rgba(22,32,60,.08)) drop-shadow(0 6px 14px rgba(22,32,60,.08));margin:0 4px}
.sx-paper:before,.sx-paper:after{content:'';display:block;height:8px}
.sx-paper:before{background:linear-gradient(45deg,transparent 50%,#fff 50%) 0 0/12px 8px repeat-x,linear-gradient(-45deg,transparent 50%,#fff 50%) 0 0/12px 8px repeat-x}
.sx-paper:after{background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/12px 8px repeat-x,linear-gradient(-135deg,#fff 50%,transparent 50%) 0 0/12px 8px repeat-x}
.sx-paper-in{background:#fff;padding:6px 14px 4px}
.sx-paper-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.sx-paper-h .t{font-size:11px;font-weight:700;letter-spacing:.12em}
.sx-paper-f{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 0 8px;border-top:1.5px solid var(--ink)}
.sx-pl{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:9px 0}
.sx-pl + .sx-pl{border-top:1px dashed #E2DED6}
.sx-pl .q{font-family:var(--mono);font-size:13px;font-weight:600}
.sx-pl .q small{font-family:Figtree,sans-serif;font-size:12px;font-weight:600;color:#6B7480}
.sx-pl .n{font-size:14px;font-weight:600}
.sx-ptag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;white-space:nowrap}
.sx-ptag i{width:7px;height:7px;border-radius:9px;display:inline-block;flex:none}
.sx-nm{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.sx-nm .b{font-size:14px;font-weight:700;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sx-nm .v{max-width:100%;padding:1px 7px;border-radius:6px;background:var(--soft2);font-size:12px;font-weight:600;line-height:1.35;color:var(--ink2);overflow-wrap:anywhere}
.sx-pl.struck .sx-nm .b,.sx-pl.struck .sx-nm .v{text-decoration:line-through;color:#8A93A3}
.sx-rgh{display:flex;align-items:center;gap:12px;padding:12px 0 4px}
.sx-row + .sx-rgh{border-top:1px solid #F1EEE8;margin-top:2px}
.sx-row.sx-kind{border-top:none;min-height:52px;padding:6px 0}
.sx-kind-rail{width:42px;align-self:stretch;flex:none;position:relative}
.sx-kind-rail:before{content:'';position:absolute;left:20px;top:-6px;bottom:-6px;width:2px;background:var(--rule)}
.sx-kind-rail:after{content:'';position:absolute;left:16px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 2px var(--navy)}
.sx-pl.struck .q,.sx-pl.struck .n{text-decoration:line-through;color:#8A93A3}
.sx-stamp{padding:6px 12px 5px;border:3px double currentColor;border-radius:10px;opacity:.88;display:inline-flex;flex-direction:column;align-items:center;gap:1px;transform:rotate(-9deg);animation:sxStamp .5s cubic-bezier(.3,1.4,.5,1) .3s both}
.sx-stamp b{font-size:20px;letter-spacing:.2em;line-height:1;padding-left:.2em}
.sx-stamp span{font-size:9px;font-weight:700;letter-spacing:.12em}
@keyframes sxStamp{0%{transform:rotate(-9deg) scale(1.8);opacity:0}60%{transform:rotate(-9deg) scale(.94);opacity:.95}100%{transform:rotate(-9deg) scale(1);opacity:.88}}

/* ---- order draft bands ---- */
.sx-band{display:flex;flex-direction:column;gap:8px;margin:0 -8px;padding:10px 8px;border-radius:12px;border:none;text-align:left;width:calc(100% + 16px);background:#fff}
.sx-band:nth-child(even){background:#FAF8F4}
.sx-band.open{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--navy)}
.sx-band.new{animation:sxNew 1.1s cubic-bezier(.2,.9,.3,1) both}
@keyframes sxNew{0%{opacity:0;transform:translateY(-14px) scale(.97);box-shadow:0 0 0 2px var(--green)}35%{opacity:1;transform:none;box-shadow:0 0 0 2px var(--green)}100%{box-shadow:0 0 0 2px rgba(15,107,67,0)}}
.sx-band .top{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px}
.sx-qb{height:44px;border-radius:10px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.sx-qb b{font-family:var(--mono);font-size:16px;font-weight:600}
.sx-qb small{font-size:10px;font-weight:600;color:var(--navyInk)}
.sx-ctl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.sx-step{display:flex;align-items:center;height:46px;border-radius:12px;background:var(--soft)}
.sx-step button{width:36px;height:46px;border:none;background:transparent;font-size:20px;color:var(--ink2)}
.sx-step input{width:46px;text-align:center;border:none;background:transparent;font-family:var(--mono);font-size:16px;font-weight:600;outline:none;padding:0}
.sx-del{width:46px;height:46px;border:none;border-radius:12px;background:var(--crimsonSoft);color:var(--crimson);display:flex;align-items:center;justify-content:center}

/* ---- bottom sheets ---- */
.sx-scrim{position:fixed;inset:0;z-index:60;background:rgba(10,14,28,.5);animation:sxScrim .25s ease-out}
@keyframes sxScrim{from{opacity:0}}
.sx-sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(22px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sxUp .35s cubic-bezier(.2,.9,.3,1)}
.sx-sheet.navy{background:var(--navy);color:#fff}
/* A long sheet scrolls; it must never squash its rows to fit (the search box went flat). */
.sx-sheet > *{flex-shrink:0}
@keyframes sxUp{from{transform:translateY(100%)}}
.sx-handle{align-self:center;width:40px;height:5px;border-radius:999px;background:#D9D4CB;flex:none}
.sx-sheet.navy .sx-handle{background:rgba(255,255,255,.22)}

/* ---- pushed pages ---- */
.sx-page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;max-width:520px;margin:0 auto;padding-bottom:calc(120px + var(--safe-area-inset-bottom));animation:sxIn .3s cubic-bezier(.2,.9,.3,1)}
@keyframes sxIn{from{transform:translateX(24px);opacity:.3}}
.sx-dock{position:fixed;left:0;right:0;bottom:0;z-index:55;max-width:520px;margin:0 auto;background:var(--navy);color:#fff;border-radius:24px 24px 0 0;padding:8px 16px calc(20px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 24px rgba(22,32,60,.18)}

/* ---- slider ---- */
.sx-slide{position:relative;height:56px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);display:flex;align-items:center;padding:4px;touch-action:none;user-select:none}
.sx-slide .k{width:48px;height:48px;border-radius:999px;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(201,58,48,.45);position:relative;z-index:1;transition:transform .2s}
.sx-slide .l{position:absolute;left:52px;right:0;text-align:center;font-size:15px;font-weight:700;pointer-events:none}
.sx-slide.money{background:rgba(111,220,176,.12);box-shadow:inset 0 0 0 1px rgba(111,220,176,.25)}
.sx-slide.money .k{background:var(--mint);color:var(--navy);box-shadow:0 6px 16px rgba(111,220,176,.4)}
.sx-slide.money .l{color:var(--mint)}
.sx-slide[aria-disabled="true"]{opacity:.5}

/* ---- toast ---- */
.sx-toast{position:fixed;left:50%;top:calc(12px + var(--safe-area-inset-top));transform:translateX(-50%) translateY(-16px);z-index:90;background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;box-shadow:0 10px 24px rgba(22,32,60,.3)}
.sx-toast.on{opacity:1;transform:translateX(-50%)}

/* ---- motion ---- */
@keyframes sxPop{0%{transform:scale(0) rotate(-30deg);opacity:0}55%{transform:scale(1.18) rotate(4deg);opacity:1}100%{transform:none}}
@keyframes sxRing{0%{transform:scale(.85);opacity:.8}100%{transform:scale(2.3);opacity:0}}
@keyframes sxUpIn{from{opacity:0;transform:translateY(12px)}}
@keyframes sxFall{0%{transform:translate(0,-30px) rotate(0);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),620px) rotate(var(--rot));opacity:0}}
@keyframes sxBlink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sxGrow{from{transform:scaleX(0)}}
@keyframes sxDelta{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes sxCoin{0%{transform:translateY(-70px) rotate(0);opacity:0}15%{opacity:1}70%{transform:translateY(46px) rotate(200deg);opacity:1}100%{transform:translateY(52px) rotate(220deg);opacity:0}}
@keyframes sxDrawer{0%,20%{transform:translateY(0)}35%,70%{transform:translateY(16px)}85%,100%{transform:translateY(0)}}
.sx-blink{animation:sxBlink 1.5s ease-in-out infinite}
.sx-grow{transform-origin:left;animation:sxGrow .9s cubic-bezier(.3,.8,.3,1) .2s both}
.sx-upin{animation:sxUpIn .5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---- sign in ---- */
.sx-auth{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 20% 10%,#2B3866 0%,#16203C 60%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:24px 22px calc(24px + var(--safe-area-inset-bottom))}
.sx-auth .card{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sx-auth label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--navyInk2)}
.sx-auth input{height:52px;border-radius:14px;border:none;padding:0 14px;font-size:16px;background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);outline:none}
.sx-auth input:focus{box-shadow:inset 0 0 0 2px var(--mint)}
.sx-auth .msg{min-height:20px;font-size:13px;color:var(--navyInk)}
.sx-auth .msg.err{color:#F59A92}

/* ---- per-screen ---- */
/* ---- Chats (9_chats.js) ---- */
.cht-wrap{padding:calc(16px + var(--safe-area-inset-top)) 16px 0;display:flex;flex-direction:column;gap:12px}
.cht-head{display:flex;align-items:center;gap:10px}
.cht-head h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.cht-hsub{font-size:13px;color:var(--ink3)}
.cht-round{width:44px;height:44px;border:none;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.cht-search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule)}
.cht-search:focus-within{box-shadow:0 0 0 2px var(--navy)}
.cht-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px;padding:0}
.cht-tabs{display:flex;padding:4px;border-radius:999px;background:var(--soft2)}
.cht-tabs button{flex:1;height:38px;border:none;border-radius:999px;background:transparent;font-size:14px;font-weight:600;color:var(--ink2)}
.cht-tabs button[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(22,32,60,.1)}
.cht-list{padding:0 14px;border-radius:20px}
.cht-row{display:flex;gap:12px;padding:14px 0;border:none;background:none;width:100%;text-align:left}
.cht-row + .cht-row,.cht-ans + .cht-ans,.cht-ans + .cht-more,.cht-row + .cht-more{border-top:1px solid #F1EEE8}
.cht-face{border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.cht-arc{position:relative;width:46px;height:46px;flex:none}
.cht-arc .cht-face{position:absolute;inset:0}
.cht-arc svg{position:absolute;inset:0}
.cht-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cht-top{display:flex;align-items:center;gap:8px;min-width:0}
.cht-name{flex:1;font-size:15px;font-weight:700}
.cht-time{font-size:12px;color:var(--ink3);flex:none}
.cht-un{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--green);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.cht-snip{font-size:14px;color:#3A4256}
.cht-chips{display:flex;gap:6px;flex-wrap:wrap}
.cht-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink2);font-size:11px;font-weight:700;white-space:nowrap}
.cht-win i{width:22px;height:4px;border-radius:9px;background:#E2DED6;overflow:hidden;display:block}
.cht-win i b{display:block;height:100%;border-radius:9px;background:var(--green)}
.cht-win.low{background:var(--amberSoft);color:var(--amberInk)}
.cht-win.low i b{background:var(--amberInk)}
.cht-cap{font-size:13px;font-weight:700;color:var(--ink3);padding:4px 4px 0}
.cht-ans{display:flex;align-items:center;gap:12px;min-height:58px;border:none;background:none;width:100%;text-align:left;padding:8px 0}
.cht-ansl{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink3);min-width:0}
.cht-tk{display:inline-flex;flex:none;color:#8A93A3}
.cht-tk .icon{stroke-width:2.4}
.cht-tk.read{color:var(--green)}
.cht-tk.bad{color:var(--crimson);font-weight:700;font-size:12px}
.cht-ansl .cht-tk{color:var(--green)}
.cht-more{display:block;width:100%;border:none;background:none;padding:12px 0;font-size:13px;font-weight:700;color:var(--ink2);text-align:center}
.cht-empty{padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.45}
.cht-empty b{color:var(--ink);font-size:16px}
.cht-empty .sx-btn{margin-top:6px}
.cht-emico{width:52px;height:52px;border-radius:18px;background:var(--soft2);color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none}
.cht-emico.s{width:36px;height:36px;border-radius:12px;background:var(--greenSoft);color:var(--green)}
.cht-note{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--ink3);line-height:1.45;padding:0 4px}
.cht-note .icon{margin-top:2px}

/* ---- one chat ---- */
.cht-page{min-height:calc(100% + 120px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;margin-bottom:calc(-120px - var(--safe-area-inset-bottom))}
.cht-bar{position:sticky;top:0;z-index:3;background:#fff;padding:calc(10px + var(--safe-area-inset-top)) 12px 10px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 0 var(--rule)}
.cht-back{width:44px;height:44px;border:none;border-radius:999px;background:none;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.cht-who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:none;background:none;padding:0;text-align:left}
.cht-call{width:44px;height:44px;border-radius:999px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.cht-thread{flex:1;padding:14px 14px 0;display:flex;flex-direction:column;gap:8px}
.cht-day{align-self:center;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.75);font-size:12px;font-weight:600;color:var(--ink2)}
.cht-b{max-width:78%;padding:9px 12px;font-size:15px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.cht-b.in{align-self:flex-start;background:#fff;border-radius:4px 16px 16px 16px}
.cht-b.out{align-self:flex-end;background:#DDF3E5;border-radius:16px 4px 16px 16px}
.cht-b img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin:-3px -6px 4px;object-fit:cover}
.cht-bpic{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink2)}
.cht-bt{white-space:pre-wrap}
.cht-bm{align-self:flex-end;display:inline-flex;align-items:center;gap:3px;font-size:11px;color:#8A93A3}
.cht-bm .cht-tk .icon{width:14px;height:14px}
.cht-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0 calc(var(--cht-comp, 72px) + 12px)}
.cht-wants{background:#fff;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(22,32,60,.06),0 10px 24px rgba(22,32,60,.08);animation:sxUpIn .4s ease-out both}
.cht-wico{width:28px;height:28px;border-radius:9px;background:var(--greenSoft);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.cht-wl{display:flex;flex-direction:column;border-radius:14px;background:var(--bg);padding:0 12px}
.cht-wr{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 0}
.cht-wr + .cht-wr{border-top:1px solid var(--line)}
.cht-pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.cht-pills::-webkit-scrollbar{display:none}
.cht-pill{flex:none;height:38px;padding:0 14px;border:none;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;max-width:280px}
.cht-comp{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:520px;margin:0 auto;background:#fff;box-shadow:0 -1px 0 var(--rule);padding:10px 12px calc(14px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.cht-crow{display:flex;align-items:center;gap:8px}
.cht-plus{width:44px;height:44px;border-radius:999px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;color:var(--ink)}
.cht-plus.off{opacity:.4;pointer-events:none}
.cht-crow{align-items:flex-end}
.cht-field{flex:1;min-width:0;min-height:44px;border-radius:22px;background:var(--soft);display:flex;align-items:center;padding:0 16px}
.cht-field textarea{flex:1;min-width:0;border:none;outline:none;background:transparent;font:inherit;font-size:15px;line-height:20px;padding:12px 0;margin:0;resize:none;height:44px;max-height:120px;overflow-y:auto;color:var(--ink);display:block}
.cht-field textarea:disabled{color:var(--ink3)}
.cht-field:focus-within{box-shadow:inset 0 0 0 1.5px var(--green)}
.cht-send{width:44px;height:44px;border:none;border-radius:999px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;padding:0;transition:transform .15s}
.cht-send:active{transform:scale(.92)}
.cht-send[disabled]{background:#B9C4BE;pointer-events:none}
.cht-spin{width:18px;height:18px;border-radius:999px;border:2.4px solid rgba(255,255,255,.35);border-top-color:#fff;animation:chtSpin .8s linear infinite}
@keyframes chtSpin{to{transform:rotate(360deg)}}
.cht-shut{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--amberSoft);color:var(--amberInk);font-size:13px;font-weight:600}
.cht-shut.bad{background:var(--crimsonSoft);color:var(--crimson)}
.cht-shutx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cht-shutx b{font-size:13px}
.cht-shutx span{font-size:12px;font-weight:500;opacity:.85}
.cht-dial{display:flex;flex:none}
.cht-shut a{flex:none;height:30px;padding:0 12px;border-radius:999px;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.cht-picrow{display:flex;align-items:center;gap:10px;padding:6px;border-radius:14px;background:var(--bg)}
.cht-picrow img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none}
.cht-paid{background:#fff;border-radius:18px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(22,32,60,.06),0 8px 20px rgba(22,32,60,.07);animation:sxUpIn .4s ease-out both}

.cht-capi{display:flex;align-items:center;gap:6px}
.cht-capi .m{margin-left:auto;font-weight:600}
.cht-dim .cht-name{color:var(--ink2)}
.cht-dim .cht-arc svg{opacity:.35}
.cht-row,.cht-ans{min-height:64px}

/* ---- media in the thread ---- */
.cht-b.media{padding:4px 4px 6px}
.cht-b.media .cht-bm{padding:0 6px}
.cht-img{display:block;border:none;padding:0;margin:-3px -6px 4px;background:none;border-radius:12px;overflow:hidden;line-height:0}
.cht-b.media .cht-img{margin:0 0 4px}
.cht-img img{display:block;width:100%;max-width:240px;max-height:300px;object-fit:cover;border-radius:12px;margin:0}
.cht-img.stk img{width:120px;max-height:120px;object-fit:contain;background:none}
.cht-ph{width:220px;height:150px;border:none;border-radius:12px;background:#F1EEE8;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:4px}
.cht-ph[disabled]{opacity:.8}
.cht-mt{display:flex;align-items:center;gap:10px;min-width:210px;max-width:100%;padding:8px 10px 8px 8px;border:none;border-radius:12px;background:rgba(22,32,60,.05);text-align:left;color:var(--ink);margin-bottom:4px;font:inherit}
.cht-mti{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none}
.cht-mtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cht-mtx b{font-size:14px;font-weight:700}
.cht-mtx span{font-size:12px;color:var(--ink3)}
.cht-aud{display:block;width:250px;max-width:100%;height:44px;margin-bottom:2px}
.cht-vid{display:block;width:240px;max-width:100%;border-radius:12px;margin-bottom:4px;background:#000}
.cht-spin.dk{border-color:rgba(22,32,60,.15);border-top-color:var(--ink2)}
.cht-tpl{font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--green);margin-right:4px}
.cht-full{display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:14px;background:#F1EEE8}

/* ---- sending, and what did not go ---- */
.cht-b.pend{opacity:.78}
.cht-b.pend .cht-bm .icon{width:13px;height:13px}
.cht-b.fail{opacity:1;background:#fff;box-shadow:inset 0 0 0 1.5px var(--crimson)}
.cht-fail{align-self:flex-end;max-width:88%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;justify-content:flex-end;margin-top:-2px}
.cht-fx{width:18px;height:18px;border-radius:999px;background:var(--crimson);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.cht-fw{font-size:12px;font-weight:600;color:var(--crimson);flex:1 1 160px;text-align:right;line-height:1.35}
.cht-fb{display:flex;gap:6px;flex:none}
.cht-fb button,.cht-fb a{height:32px;padding:0 12px;border:none;border-radius:999px;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.cht-fb a{background:#fff;color:var(--green);box-shadow:inset 0 0 0 1px var(--rule)}
.cht-fb button.g{width:32px;padding:0;justify-content:center;background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--rule)}
button.cht-plus{border:none;padding:0}

/* ---- the + sheet ---- */
.cht-atg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cht-at{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border:none;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);text-align:left;color:var(--ink);font:inherit;cursor:pointer;min-height:104px}
.cht-at b{font-size:15px;font-weight:700;margin-top:6px}
.cht-at small{font-size:12px;color:var(--ink3)}
.cht-at.off{opacity:.45;pointer-events:none}
.cht-ati{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.cht-qr{min-height:50px;color:var(--ink)}
.cht-qr .icon{color:var(--ink3);flex:none}
.cht-prow{min-height:56px;gap:10px}
.cht-pp{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.cht-pp b{font-size:14px;font-weight:600}
.cht-pp small{font-size:11px;color:var(--ink3)}
.cht-padd{width:30px;height:30px;border-radius:999px;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.cht-prow.on .cht-padd{background:var(--green);color:#fff}

/* ---- who on the team sent it ---- */
.cht-by{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ink2);margin-right:5px;white-space:nowrap}
.cht-by.me{color:var(--green)}
.cht-byi{width:15px;height:15px;border-radius:999px;background:var(--ink3);color:#fff;font-style:normal;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cht-byi .icon{stroke:#fff;stroke-width:2.4}
.cht-ansl .cht-by{margin-right:2px}

.cu-body{gap:10px}

.cu-area{flex:none;height:34px;padding:0 12px;border:none;border-radius:999px;background:var(--soft2);color:var(--ink);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

.nw-fadd{flex:1;min-width:0;white-space:nowrap;min-height:46px;border:none;border-radius:12px;background:var(--green);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}

.nw-np{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:repeating-linear-gradient(135deg,#FEF8F2 0 6px,#FDEEE1 6px 12px);box-shadow:inset 0 0 0 1.5px var(--amber)}

.nw-shows{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}

.nw-plus{height:40px;min-width:44px;padding:0 12px;border:none;border-radius:12px;background:var(--greenSoft);color:var(--green);font-size:13px;font-weight:700;flex:none}

/* the open order, empty */

.nw-akl{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:14px;font-weight:600}

.nw-chin{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:12px;background:var(--soft);font-size:12px;font-weight:700;color:var(--ink3);min-width:0}

.nw-ff{font-size:12px;font-weight:600;color:var(--ink3);flex:0 1 auto}
.nw-ft{font-size:16px;font-weight:600;white-space:nowrap;flex:none}

.nw-sbar{display:flex;gap:3px;width:48px;height:8px;flex:none}

.nw-dk2{display:flex;align-items:center;gap:8px;min-height:34px}
.nw-pic{min-width:0;max-width:64%;height:40px;padding:0 12px 0 5px;border:none;border-radius:999px;background:rgba(255,255,255,.08);color:var(--navyInk);font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}
.nw-pic.on{background:rgba(111,220,176,.14);color:var(--mint)}

.nw-mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nw-mtot{font-size:20px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}

.nw-review{height:48px;padding:0 14px 0 16px;border:none;border-radius:14px;background:#fff;color:var(--navy);font-size:15px;font-weight:700;display:flex;align-items:center;gap:4px;flex:none}

.nw-chead .sx-eyebrow{font-size:10px;letter-spacing:.14em}
.nw-chead .sx-circle{background:rgba(255,255,255,.1)}
.nw-csearch{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-radius:16px;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18)}
