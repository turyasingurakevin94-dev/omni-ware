.nw-askh{display:flex;align-items:center;gap:10px}
.nw-cn{font-size:15px;font-weight:700}
.nw-clist .nw-cn{font-size:14px}
.nw-wait{padding:3px 8px;border-radius:999px;background:var(--amberSoft);color:var(--amberInk);font-size:11px;font-weight:700;white-space:nowrap;flex:none}
.nw-wait.late{background:var(--crimsonSoft);color:var(--crimson)}
.nw-asklines{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:var(--bg);flex:1}
.nw-asklines > span{display:flex;gap:8px;font-size:13px;min-width:0}
.nw-asklines b{width:28px;flex:none}
.nw-asktext{font-size:13px;color:var(--ink2);display:-webkit-box!important;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nw-askgo{height:42px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.nw-clist{padding:0 14px;border-radius:20px}
.nw-crow{display:flex;align-items:center;gap:12px;min-height:58px;border:none;background:none;width:100%;text-align:left;padding:8px 0;color:inherit}
.nw-crow[aria-disabled="true"]{opacity:.6}
.nw-clist > * + *{border-top:1px solid #F1EEE8}
.nw-owe{padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ink2);font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap;flex:none}
.nw-owe.mv{background:var(--skySoft,#DCEAF8);color:var(--sky,#1A5A8A);font-family:inherit;font-weight:700}.nw-owe.mv .m{font-weight:600}
.nw-owe.late{background:var(--amberSoft);color:var(--amberInk)}
.nw-due{display:flex;align-items:center;gap:8px;min-height:72px}
.nw-due .nw-crow{flex:1;min-width:0}
.nw-duer{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.nw-dw{font-size:11px;font-weight:700;white-space:nowrap}
.nw-dsub{display:flex;align-items:baseline;min-width:0}
.nw-dsub > .ell{flex:0 1 auto}
.nw-dval{flex:none;white-space:nowrap;padding-left:4px}
.nw-dval:before{content:'· '}
.nw-usualbtn{height:36px;padding:0 14px;border:none;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;font-weight:700}
.nw-dav{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.nw-carry{display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;border-radius:18px;background:var(--navy);color:#fff;text-align:left;box-shadow:0 10px 22px rgba(22,32,60,.18)}
.nw-carry .sx-sub{color:var(--navyInk)}
.nw-ey{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mint)}
.nw-drow{display:flex;align-items:center;gap:8px}
.nw-drow .nw-crow{flex:1;min-width:0}
.nw-ddel{height:40px;min-width:40px;padding:0 8px;border:none;border-radius:10px;background:var(--soft);color:var(--ink2);font-size:12px;font-weight:700;flex:none;display:flex;align-items:center;justify-content:center}
.nw-ddel.on{background:var(--crimsonSoft);color:var(--crimson)}

/* ---- switch ---- */
.nw-swsearch{height:48px;min-height:48px;flex:none;border-radius:14px}
.nw-swsearch input{font-size:15px}
.nw-dchips{display:flex;gap:8px}
.nw-dchips.scroll{overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px;scroll-snap-type:x mandatory}
.nw-dchips.scroll::-webkit-scrollbar{display:none}
.nw-dchips.scroll .nw-dchip{flex:0 0 64%;scroll-snap-align:start}
.nw-lab .m{letter-spacing:0;margin-left:4px}
.nw-dchip{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px;border:none;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.nw-dchip .nw-cn{font-size:13px}
.nw-dchip .sx-sub{font-size:11px;white-space:nowrap}
.nw-sel{min-height:56px}
.nw-sel.on{margin:0 -8px;padding:8px;width:calc(100% + 16px);border-radius:12px;background:#F2F1FC;box-shadow:inset 0 0 0 1.5px var(--indigo)}
.nw-selt{width:24px;height:24px;border-radius:999px;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.nw-owes{font-size:12px;color:var(--ink3);white-space:nowrap}
.nw-swfoot{position:sticky;bottom:calc(-22px - var(--safe-area-inset-bottom));margin:auto -16px calc(-22px - var(--safe-area-inset-bottom));background:var(--navy);color:#fff;border-radius:24px 24px 0 0;padding:14px 16px calc(22px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;z-index:2}
.nw-swfoot:empty{display:none}
.nw-swhint{text-align:center;font-size:13px;color:var(--navyInk);padding:6px 0}
.nw-swwho{display:flex;align-items:center;gap:10px}
.nw-swwho > span:last-child{flex:1;font-size:13px;color:var(--navyInk);line-height:1.35}
.nw-swwho b{color:#fff}
.nw-swmove{height:52px;border:none;border-radius:16px;background:#fff;color:var(--navy);font-size:15px;font-weight:700}
.nw-swpark{height:46px;border:none;border-radius:16px;background:rgba(255,255,255,.08);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}

/* ---- the aisles ---- */
.sx-page[data-type="aisles"],.sx-page[data-type="aisle"]{padding-bottom:0}
.nw-shtop{height:calc(40px + var(--safe-area-inset-top))}
.nw-shpanel{background:var(--bg);border-radius:26px 26px 0 0;min-height:calc(100vh - 40px);padding:10px 16px 130px;display:flex;flex-direction:column;gap:12px}
.nw-fakes{border:none;width:100%;height:48px;border-radius:14px;font-size:15px;color:var(--ink3);text-align:left}
.nw-hero{display:flex;align-items:center;gap:12px;padding:12px;border:none;border-radius:18px;background:radial-gradient(120% 120% at 0% 0%,#2B3866 0%,#16203C 65%);color:#fff;box-shadow:0 10px 22px rgba(22,32,60,.18);text-align:left;width:100%}
.nw-hero .nw-ct{gap:6px}
.nw-hh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nw-hh b{font-size:16px}
.nw-hh span{font-size:11px;font-weight:600;color:var(--navyInk2)}
.nw-hchips{display:flex;gap:5px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 78%,transparent);mask-image:linear-gradient(90deg,#000 78%,transparent)}
.nw-hc{height:24px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.08);color:#DDE3F0;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;max-width:150px;flex:none}
.nw-hc.on{background:rgba(111,220,176,.16);color:var(--mint)}
.nw-cati{display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;object-fit:cover}
.nw-agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nw-aisle{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border:none;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px var(--line),0 1px 2px rgba(27,36,56,.04);text-align:center;min-width:0}
.nw-an{font-size:13px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.nw-ac{font-size:11px;color:var(--ink3);margin-top:-6px}
.nw-scoped{display:flex;align-items:center;gap:8px;height:46px;padding:0 8px 0 12px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule)}
.nw-scoped:focus-within{box-shadow:0 0 0 2px var(--navy)}
.nw-token{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 10px;border-radius:999px;background:var(--soft2);font-size:12px;font-weight:700;flex:none;max-width:45%;overflow:hidden;white-space:nowrap}
.nw-token button{width:24px;height:24px;border:none;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.nw-scoped input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px;padding:0}
.nw-filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nw-anm{display:flex;align-items:center;gap:6px;min-width:0}
.nw-anm .sx-nm{min-width:0}
.nw-best{height:18px;padding:0 6px;border-radius:999px;background:var(--amberSoft);color:var(--amberInk);font-size:10px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.nw-aadd{width:40px;height:40px;flex:none;border:none;border-radius:12px;background:var(--greenSoft);color:var(--green);display:flex;align-items:center;justify-content:center}
.nw-aadd.on{background:var(--navy);color:var(--mint);font-size:13px}
.nw-amore{width:100%;height:48px;margin:6px 0 12px;border:none;border-radius:14px;background:var(--soft);color:var(--ink);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.nw-amore-n{color:var(--ink3);font-weight:600}

/* ---- placed ---- */
.nw-placed{position:relative;min-height:100%;overflow:hidden;color:#fff;padding:calc(64px + var(--safe-area-inset-top)) 20px 210px}
.nw-glow{position:absolute;left:50%;top:30px;width:340px;height:340px;margin-left:-170px;border-radius:999px;background:radial-gradient(circle,rgba(111,220,176,.28) 0%,rgba(111,220,176,0) 65%);pointer-events:none}
.nw-conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.nw-conf i{position:absolute;top:0}
.nw-pl{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.nw-tring{position:relative;width:84px;height:84px;flex:none}
.nw-tring i{position:absolute;border-radius:999px;border:2px solid var(--mint)}
.nw-tring .r1{inset:-14px;opacity:.3}
.nw-tring .r2{inset:-30px;opacity:.12}
.nw-tk{position:absolute;inset:0;border-radius:999px;background:var(--mint);color:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(111,220,176,.35)}
.nw-placed.fresh .nw-tk{animation:sxPop .6s cubic-bezier(.3,1.4,.5,1) both}
.nw-placed.fresh .nw-tring i{animation:nwRings .9s ease-out .35s both}
.nw-placed.fresh .u{animation:sxUpIn .5s ease-out var(--d,0s) both}
.nw-placed:not(.fresh) .sx-grow,.nw-placed:not(.fresh) .nw-arc{animation:none}
.nw-nice{margin-top:24px;font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--mint)}
.nw-plh{margin-top:2px;font-size:32px;font-weight:700;letter-spacing:-.02em}
.nw-tring + .nw-plh{margin-top:24px}
.nw-plpill{margin-top:12px;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 4px;border-radius:999px;background:rgba(255,255,255,.08);max-width:100%}
.nw-plpill > span:not(.sx-av){font-size:14px;font-weight:600}
.nw-plpill .nw-plm{font-size:13px;font-weight:500;color:var(--navyInk);white-space:nowrap;flex:none}
.nw-plpill .sx-av{width:30px;height:30px;font-size:11px}
.nw-goal{position:relative;overflow:hidden;width:100%;margin-top:22px;display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);text-align:left}
.nw-goal b{font-size:14px}
.nw-goal .nw-ring-in .m{font-size:13px;font-weight:600}
.nw-shine{position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.07),rgba(255,255,255,0));animation:nwShine 4s ease-in-out 1.4s infinite;pointer-events:none}
.nw-gs{font-size:12px;color:var(--navyInk)}
.nw-gs .w{color:#fff}
.nw-gm{font-size:12px;font-weight:600;color:var(--amber)}
.nw-gm.solo{margin-top:16px;padding:6px 12px;border-radius:999px;background:rgba(245,178,107,.12)}
.nw-track{width:100%;margin-top:22px;display:flex;flex-direction:column;gap:8px}
.nw-trk{display:flex;align-items:center;gap:5px}
.nw-tl{flex:1;height:3px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
.nw-tl i{display:block;height:100%;background:var(--mint)}
.nw-td{width:24px;height:24px;border-radius:999px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);flex:none;display:flex;align-items:center;justify-content:center}
.nw-td.done{background:rgba(111,220,176,.18);color:var(--mint);box-shadow:none}
.nw-td.now{width:32px;height:32px;background:#fff;color:var(--navy);box-shadow:none;animation:nwPulse 1.8s ease-out infinite}
.nw-tlab{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--navyInk2)}
.nw-tlab .done{color:var(--mint)}
.nw-tlab .now{color:#fff}
.nw-tnote{align-self:center;margin-top:4px;font-size:12px;color:var(--navyInk);line-height:1.4}
.nw-pcard{width:100%;margin-top:18px;display:flex;align-items:center;gap:14px;padding:10px 14px 10px 12px;border-radius:18px;background:rgba(255,255,255,.05);text-align:left}
.nw-pcard b{font-size:14px}
.nw-pcard .nw-ct > span{font-size:12px;color:var(--navyInk)}
.nw-pslip{width:44px;height:56px;flex:none;border-radius:6px;background:#fff;padding:6px 5px;display:flex;flex-direction:column;gap:3px;box-shadow:0 6px 14px rgba(0,0,0,.3);transform:rotate(-4deg)}
.nw-pslip i{height:2px;border-radius:2px;background:#D9D4CB}
.nw-pslip .r{height:3px;width:55%;background:var(--red);margin-bottom:2px}
.nw-pslip .t{margin-top:auto;height:3px;width:50%;align-self:flex-end;background:var(--navy)}
.nw-pst{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--mint);flex:none}
.nw-pcard.bad b{color:#F59A92}
.nw-retry{height:40px;padding:0 12px;border:none;border-radius:999px;background:#fff;color:var(--navy);font-size:13px;font-weight:700;flex:none}
.nw-plcta{background:transparent;box-shadow:none;padding-top:12px;gap:10px}
.nw-plcta.fresh{animation:sxUpIn .5s ease-out 1.4s both}
.nw-next{height:58px;border-radius:18px;border:none;background:var(--red);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 22px rgba(201,58,48,.35)}
.nw-plrow{display:flex;gap:8px}
.nw-plrow button{flex:1;height:52px;border-radius:16px;border:none;background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-weight:600}

.nw-chead,.nw-cbody > *{flex:none}
.nw-cbody{flex:1 0 auto}
.nw-search input::-webkit-search-cancel-button,.nw-scoped input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}

/* ---- QA polish ---- */
.nw-slot{display:contents}
.nw-more{padding:12px 10px;font-size:13px}
.nw-each{display:flex;flex-direction:column;justify-content:center;min-width:0;padding-left:6px;line-height:1.15}
.nw-each b{font-size:15px;font-weight:600}
.nw-each small{font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw-each .nw-tocchip{align-self:flex-start}
/* typing a quantity or a charge: the dock steps aside for the keyboard */
body.nw-typing .nw-dock{display:none}
.nw-chin input::placeholder{font-family:Figtree,system-ui,sans-serif;font-size:14px;font-weight:600;color:#A7A096}
.nw-band .sx-qb b.sm{font-size:13px;letter-spacing:-.04em}
.nw-band .sx-qb b.xs{font-size:11px;letter-spacing:-.05em}
/* Sell by stays on the one line: the stepper and the bin give it room (the
   quantity is already on the line's own badge), so a pack price reads whole. */
.nw-band .sx-ctl{gap:6px}
.nw-band .nw-sell{gap:2px}
.nw-band .nw-sell button{font-size:12px;gap:1px;padding:0 4px}
.nw-band .nw-sell .m{font-size:12px}
.nw-band .sx-step button{width:26px}
.nw-band .sx-step input{width:40px}
.nw-band .sx-del{width:36px}
.nw-each .nw-a{font-size:17px}
.nw-filters .sx-pill{height:40px}
.nw-mtot{font-family:var(--mono)}
.nw-mtot .nw-amb,.nw-ft .nw-amb,.nw-plm .nw-amb{font-family:Figtree,system-ui,sans-serif;font-size:.8em}
.nw-cbody.settled .nw-arc{animation:none}
/* the order under a search is set aside, not unmounted: display:none would
   restart every chip and line animation when the search closes */
#nw_rest.nw-aside{display:flex;height:0;margin:0;overflow:hidden;visibility:hidden;pointer-events:none}
@media (max-width:340px){
  .nw-big{font-size:23px}.nw-big.md{font-size:20px}.nw-big.sm{font-size:17px}.nw-big.xs{font-size:15px}
  .nw-pay button{padding:0 9px;font-size:12.5px}
  .nw-agrid,.nw-utiles{gap:6px}
}

/* ---- setting the price ---- */
.nw-pbtn{grid-column:1/-1;margin-top:6px;height:40px;border:none;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;font-weight:700;color:var(--sky);width:100%}
.nw-pbtn .m{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink2)}
.nw-band .sx-ptag{margin-top:2px}
.nw-ph{display:flex;align-items:center;gap:12px}
.nw-ph .sx-qb{width:48px;flex:none}
.nw-ph .sx-nm{flex:1}
.nw-pick{display:flex;gap:8px}
.nw-pcard{flex:1;min-width:0;border:none;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;color:var(--ink)}
.nw-pcard.on{box-shadow:inset 0 0 0 2px var(--navy)}
.nw-pcard.off{opacity:.5}
.nw-pcard .k{font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nw-pcard .v{font-size:16px;font-weight:600}
.nw-pcard .v.w{font-size:13px;font-family:Figtree,sans-serif}
.nw-pbig{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:2px 0 0}
.nw-pbig input[data-len="1"]{font-size:32px}.nw-pbig input[data-len="2"]{font-size:28px}.nw-pbig input[data-len="3"]{font-size:24px}.nw-pbig input[data-len="4"]{font-size:21px}
.nw-pbig .u{font-size:13px;font-weight:700;color:var(--ink3)}
.nw-pbig input{width:0;flex:1;max-width:230px;border:none;background:transparent;outline:none;font-family:var(--mono);font-size:38px;font-weight:600;letter-spacing:-.03em;color:var(--ink);padding:0;text-align:center;caret-color:var(--red)}
.nw-psub{text-align:center;font-size:12px;font-weight:600;color:var(--ink3);margin-top:-6px}
.nw-phint{text-align:center;font-size:12.5px;font-weight:600;min-height:17px}
.nw-phint.bad{color:var(--crimson)}.nw-phint.amb{color:var(--amberInk)}.nw-phint.sky{color:var(--sky)}
.nw-plink{border:none;background:none;height:36px;font-size:13px;font-weight:600;color:var(--ink2)}
.nw-pconf{font-family:Figtree,sans-serif;font-size:.5em;font-weight:700;letter-spacing:0;white-space:nowrap;vertical-align:middle}

/* ---- the dock, compact (canvas: order bar reduced) ---- */
.nw-dock{padding:12px 14px calc(14px + var(--safe-area-inset-bottom));gap:10px;border-radius:20px 20px 0 0}
.nw-dock .nw-big{font-size:21px}.nw-dock .nw-big.md{font-size:19px}.nw-dock .nw-big.sm{font-size:17px}.nw-dock .nw-big.xs{font-size:15px}
.nw-dock .nw-tsub{font-size:11px}
.nw-dock .nw-pay{padding:2px}
.nw-dock .nw-pay button{height:32px;padding:0 10px;font-size:12px}
.nw-dock .nw-dk2{gap:8px;min-height:0}
.nw-picb,.nw-keepb{position:relative;width:44px;height:44px;flex:none;border:none;border-radius:999px;background:rgba(255,255,255,.08);color:var(--navyInk);display:flex;align-items:center;justify-content:center}
.nw-picb.on{background:rgba(111,220,176,.16);color:var(--mint)}
.nw-picb.off{opacity:.55}
.nw-picb .tk{position:absolute;right:1px;top:1px;width:14px;height:14px;border-radius:999px;background:var(--mint);color:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--navy)}
.nw-keepb[disabled]{opacity:.35}
.nw-dk2 .sx-slide{flex:1;min-width:0;height:48px}
.nw-dk2 .sx-slide .k{width:40px;height:40px}
.nw-dk2 .sx-slide .l{left:44px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw-newav{background:transparent;box-shadow:inset 0 0 0 1.5px var(--red);color:var(--red)}
.nw-new .nw-cn{color:#A82D24}
/* each size with its shelf count; an empty one struck through */
.nw-opt{height:40px;padding:0 9px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.nw-opt .nw-os{font-size:10px;font-weight:600;color:var(--ink3)}
.nw-opt.on .nw-os{color:var(--navyInk)}
.nw-opt.none .nw-ov{text-decoration:line-through}
.nw-opt.none .nw-os{color:#B9B2A6}
.nw-asksrc{align-self:center;display:inline-flex;align-items:center;gap:7px;height:36px;margin:2px auto 0;padding:0 14px;border:none;border-radius:999px;background:none;font-size:13px;font-weight:600;color:var(--ink2)}
.nw-asksrc b{color:var(--ink)}

.nw-crrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 2px 2px;border-top:1px dashed #E2DED6;font-size:13px;font-weight:600;color:var(--ink2)}
.nw-crrow small{font-size:11px;color:var(--ink3);margin-left:4px}


/* Aisles they buy from: two tiles side by side */
.nw-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nw-tile{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:10px;padding:12px;border-radius:18px;background:radial-gradient(120% 120% at 0% 0%,#2B3866 0%,#16203C 65%);color:#fff;box-shadow:0 10px 22px rgba(22,32,60,.18);min-width:0}
.nw-tilego{position:absolute;inset:0;border:none;background:transparent;border-radius:18px;padding:0}
.nw-tilet{display:flex;align-items:center;justify-content:space-between;width:100%;pointer-events:none}
.nw-ring{position:relative;width:36px;height:36px;flex:none}
.nw-ring svg{transform:rotate(-90deg)}
.nw-ring .m{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff}
.nw-tilen{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;pointer-events:none}
.nw-tilen b{font-size:15px}
.nw-tilen span{font-size:11px;color:var(--navyInk2)}
.nw-tq{position:relative;z-index:1;align-self:flex-start;max-width:100%;box-sizing:border-box;height:32px;padding:0 9px 0 3px;border-radius:999px;background:rgba(111,220,176,.16);color:var(--mint);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;cursor:pointer}
.nw-tq i{width:26px;height:26px;flex:none;border-radius:999px;background:var(--mint);color:#16203C;display:flex;align-items:center;justify-content:center}
.nw-tq .w{color:#fff;min-width:0}
.nw-tq.on{padding:0 10px;cursor:default}
.nw-fh{display:inline-flex;align-items:center;gap:6px}
.nw-fhb{display:inline-flex;width:34px;height:6px;gap:1px;border-radius:999px;overflow:hidden;flex:none}
.nw-fhb i{background:var(--green)}.nw-fhb i.h{background:var(--amber)}
.nw-hk{color:var(--amberInk)}
.nw-pbig input.hi{color:var(--crimson,#8E2A22)}
.nw-psub b.hi{color:var(--crimson,#8E2A22)}
.nw-phint{display:flex;align-items:center;justify-content:center;gap:8px}
.nw-ptimes{height:24px;padding:0 9px;border-radius:999px;background:#FBE5E2;font-size:13px;font-weight:600;display:inline-flex;align-items:center}
.nw-pboth{display:flex;gap:8px}
.nw-pboth .sx-btn{flex:1}.nw-pboth .sx-btn.red{flex:1.3}
.sx-btn.ghostbad{background:#fff;color:#8E2A22;box-shadow:inset 0 0 0 1.5px #E7B3AD}
.nw-nearh{display:flex;align-items:center;gap:8px;padding:0 4px}
.nw-nearh b{font-size:14px}.nw-nearh span{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink3)}
.nw-nearc{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:20px;background:#fff;box-shadow:0 1px 2px rgba(22,32,60,.05),0 10px 24px rgba(22,32,60,.08),inset 0 0 0 2px #16203C}
.nw-nearc .hd{display:flex;align-items:center;gap:12px}
.nw-nearc .nm{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw-nearc mark{padding:0 2px;border-radius:4px;background:#FDEEE1;color:#95530C;box-shadow:inset 0 -2px 0 #F5B26B}
.nw-nearc .amb{color:var(--amberInk)}
.nw-nearc .sx-btn{height:44px;border-radius:12px;font-size:14px;gap:6px}
.nw-nearr{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 14px;border:none;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px #ECE8E1;font-family:inherit;text-align:left;color:var(--ink)}
.nw-nearr b{font-size:14px}.nw-nearr .nw-ct>span{font-size:12px;color:var(--ink3)}
.nw-newc{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border:1.5px dashed #C9C4BA;border-radius:18px;background:transparent;font-family:inherit;text-align:left;color:var(--ink)}
.nw-newc .ic{width:36px;height:36px;flex:none;border-radius:999px;background:#F4F2EE;color:#5F6980;display:flex;align-items:center;justify-content:center}
.nw-newc b{font-size:14px}.nw-newc .nw-ct>span{font-size:12px;color:var(--ink3)}
.nw-pay button.nolim{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;color:var(--navyInk2)}
.nw-pay button.nolim small{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#F5B26B}
.nw-pay button.nolim small i{width:6px;height:6px;border-radius:9px;background:#F5B26B}
.nw-pay button.nolim[aria-checked="true"]{color:var(--navy)}.nw-pay button.nolim[aria-checked="true"] small{color:var(--amberInk)}
/* QLineFix: a box comes whole; past the shelf, the line asks */
.sx-qb.bad{background:var(--crimsonSoft);color:var(--crimson)}.sx-qb.bad small{color:var(--crimson)}
.sx-step input.bad{color:var(--crimson);box-shadow:inset 0 0 0 2px var(--red);border-radius:10px}
.nw-dash{color:#A9AFBA}
.nw-whole{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 2px 0}
.nw-whole b{font-size:12px;font-weight:700;color:var(--crimson);margin-right:2px}
.nw-whole button{height:32px;padding:0 12px;border:none;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--navy);color:var(--navy);font-family:inherit;font-size:12px;font-weight:700;white-space:nowrap}
.nw-lshort{display:flex;flex-direction:column;gap:7px;margin:8px 0 2px;padding:10px;border-radius:12px;background:#FEF8F2;box-shadow:inset 0 0 0 1px #F6DDC2}
.nw-lshort .tr{display:flex;gap:2px;height:6px}
.nw-lshort .tr i{border-radius:999px 0 0 999px;background:var(--green)}
.nw-lshort .tr i.a{border-radius:0 999px 999px 0;background:repeating-linear-gradient(135deg,#F5B26B 0 5px,#FBD9B4 5px 10px)}
.nw-lshort .lb{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink3)}
.nw-lshort .lb b.g{color:var(--green)}.nw-lshort .lb .a{color:var(--amberInk)}
.nw-lshort .bs{display:flex;gap:6px}
.nw-lshort .bs button{flex:1;min-width:0;height:40px;border:none;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap}
.nw-lshort .bs button.p{background:var(--green);color:#fff;box-shadow:none}
/* NEW-02: the counter offers the shelf first; what isn't here becomes an order */
.nw-shortbar .lb em.hd{font-style:normal;font-weight:500;color:#A9AFBA}
.nw-ctact{display:flex;gap:8px}.nw-find.short .nw-ctact .nw-fadd{flex:1.5;width:auto;min-width:0;margin:0}.nw-ctact .nw-fsec{flex:1;min-width:0;height:52px;margin:0;white-space:nowrap}
.nw-offs{display:flex;flex-direction:column;gap:6px}
.nw-offs .nw-lab{padding:0 4px}
.nw-offr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.nw-offr .nw-ct{flex:1;min-width:0;opacity:.85}
.nw-offb{flex:none;height:34px;padding:0 12px;border:none;border-radius:999px;background:none;box-shadow:inset 0 0 0 1.5px #C9C4BA;color:var(--ink);font-family:inherit;font-size:12px;font-weight:700;white-space:nowrap}
/* SAL-22: the size asked for is out -- said, never swapped silently */
.nw-outc{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px 0 6px;border-radius:999px;background:linear-gradient(180deg,#FEF3E6,#FDEEE1);box-shadow:inset 0 0 0 1px #F6DDC2;font-size:12px;font-weight:700;color:var(--amberInk);white-space:nowrap}
.nw-outc i{width:6px;height:6px;border-radius:9px;background:var(--amber)}
.nw-outc s{color:#B98A5A}
.nw-lshort .lb em{font-style:normal;font-weight:500;color:#A9AFBA}
/* R3-03: already on the counter */
.nw-onc{display:flex;flex-direction:column;gap:7px;padding:12px;border-radius:16px;background:#FBFAF8;box-shadow:inset 0 0 0 1px #F1EEE8}
.nw-onc .lb{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;font-weight:700;color:var(--navy)}
.nw-onc .lb b{font-size:20px;letter-spacing:-.02em}
.nw-onc .lb em{font-style:normal;font-weight:600;color:var(--green)}.nw-onc .lb em.z{color:var(--crimson)}
.nw-onc .lb .a{color:var(--amberInk)}.nw-onc .lb .a b{font-size:12px}
.nw-onc .tr{display:flex;gap:3px;height:10px;padding:2px;border-radius:999px;background:#F1EEE8;box-shadow:inset 0 1px 2px rgba(22,32,60,.08)}
.nw-onc .tr i{border-radius:2px}.nw-onc .tr i:first-child{border-radius:999px 2px 2px 999px}.nw-onc .tr i:last-child{border-top-right-radius:999px;border-bottom-right-radius:999px}
.nw-onc .tr i.n{background:linear-gradient(90deg,#24305A,#16203C)}.nw-onc .tr i.g{background:var(--green)}
.nw-onc .tr i.a{background:repeating-linear-gradient(135deg,#F5B26B 0 5px,#FBD9B4 5px 10px)}
.nw-ctact .nw-fadd.navy{background:linear-gradient(180deg,#24305A,#16203C)}
.nw-find .nw-ctact .nw-fadd{flex:1.3;width:auto;min-width:0;margin:0;height:50px;border-radius:15px}
.nw-find .nw-ctact .nw-fsec{flex:1;min-width:0;height:50px;margin:0;white-space:nowrap}
/* Round 3, the premium finish of the find card (QSearchRank, CSearchOn) */
.nw-find.short,.nw-find.np{padding:16px;border-radius:22px;background:linear-gradient(180deg,#FFFFFF 0%,#FCFBF9 100%);box-shadow:0 1px 2px rgba(22,32,60,.05),0 14px 30px rgba(22,32,60,.09),inset 0 0 0 1.5px var(--amber)}
.nw-find .nw-opt.on{background:linear-gradient(180deg,#24305A,#16203C);box-shadow:0 6px 14px rgba(22,32,60,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.nw-find .nw-opt.on .nw-os{color:var(--mint)}
.nw-find .nw-opt.none:not(.on){background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule);color:#B4B9C3}
.nw-shortbar{padding:12px;border-radius:16px;background:#FBFAF8;box-shadow:inset 0 0 0 1px #F1EEE8;gap:7px}
.nw-shortbar .lb .g b{font-size:20px;letter-spacing:-.02em}
.nw-shortbar .tr{height:10px;padding:2px;border-radius:999px;background:#F1EEE8;box-shadow:inset 0 1px 2px rgba(22,32,60,.08)}
.nw-shortbar .tr .g{background:linear-gradient(90deg,#15834F,#0F6B43);border-radius:999px 2px 2px 999px}
.nw-shortbar .tr .a{border-radius:2px 999px 999px 2px;box-shadow:none}
.nw-find.short .nw-fadd:not(.navy){background:linear-gradient(180deg,#15834F,#0F6B43);box-shadow:0 8px 18px rgba(15,107,67,.28),inset 0 1px 0 rgba(255,255,255,.15)}
.nw-find .nw-fadd.navy{background:linear-gradient(180deg,#24305A,#16203C);box-shadow:0 8px 18px rgba(22,32,60,.28),inset 0 1px 0 rgba(255,255,255,.12)}
.nw-find.short .nw-fsec{background:#fff;box-shadow:inset 0 0 0 1.5px var(--rule)}
.nw-read{white-space:nowrap}.nw-read .nw-rw{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* ---- numbers: Your day, the goal, You (5c_numbers.js) ---- */
.nm-top{background:#2A3350;padding-top:calc(14px + var(--safe-area-inset-top))}
.nm-hero{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;border-radius:26px 26px 0 0;padding:10px 18px 18px;display:flex;flex-direction:column;gap:16px}
.nm-handle{align-self:center;width:40px;height:5px;border-radius:999px;background:rgba(255,255,255,.22);flex:none}
.nm-head{display:flex;align-items:center;gap:10px}
.nm-tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm-tt .sx-eyebrow{letter-spacing:.14em}
.nm-card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nm-card-h b{font-size:13px;font-weight:700}
.nm-card-h > span{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap}

/* Your day */
.nm-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.nm-tabs button{border:none;background:none;color:#fff;text-align:left;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;border-radius:16px 0 0 16px}
.nm-tabs button + button{border-left:1px solid rgba(255,255,255,.07);border-radius:0 16px 16px 0}
.nm-tabs button.on{box-shadow:inset 0 -3px 0 #fff}
.nm-tabs button.mint.on{box-shadow:inset 0 -3px 0 var(--mint)}
.nm-tabs .l{font-size:11px;font-weight:700;color:var(--navyInk2)}
.nm-tabs .v{font-size:22px;font-weight:600;letter-spacing:-.03em}
.nm-tabs .mint .v{color:var(--mint)}
.nm-split{display:flex;flex-direction:column;gap:7px}
.nm-split-bar{display:flex;height:12px;gap:2px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06)}
.nm-split-k{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:11px;font-weight:600;color:var(--navyInk)}
.nm-split-k > span{display:flex;flex-direction:column}
.nm-split-k b{font-size:13px;color:#fff}
.nm-row{border:none;background:none;width:100%;text-align:left;grid-template-columns:40px minmax(0,1fr) auto;color:var(--ink)}
.nm-time{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.nm-time .m{font-size:12px;font-weight:600;color:var(--ink2)}
.nm-you{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:999px;background:var(--navy);color:var(--mint)}
.nm-mid{display:flex;flex-direction:column;gap:3px;min-width:0}
.nm-cn{font-size:14px;font-weight:600}
.nm-nm{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;min-width:0}
.nm-acct{color:var(--green);display:flex;flex:none}
.nm-what{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);min-width:0;white-space:nowrap}
.nm-what i{width:7px;height:7px;border-radius:999px;flex:none}
.nm-stage{padding:1px 7px;border-radius:999px;font-weight:700;flex:none}
.nm-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.nm-amt{font-size:14px;font-weight:600;white-space:nowrap}
.nm-amt.in{color:var(--green)}
.nm-pw{font-size:10px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.nm-h-r{font-size:12px;font-weight:600;color:var(--ink3)}
.nm-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nm-tile{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.nm-tile-h{display:flex;align-items:center;justify-content:space-between}
.nm-tile-ic{width:30px;height:30px;border-radius:10px;background:var(--navy);color:var(--mint);display:flex;align-items:center;justify-content:center}
.nm-tile-p{font-size:11px;font-weight:600;color:var(--ink3)}
.nm-tile-v{display:flex;flex-direction:column;gap:1px;min-width:0}
.nm-tile-v .m{font-size:15px;font-weight:600;white-space:nowrap}
.nm-tile-v > span:last-child{font-size:11px;font-weight:600;color:var(--ink3)}
.nm-tile-bar{height:4px;border-radius:999px;background:#F1EEE8;overflow:hidden}
.nm-tile-bar i{display:block;height:100%;background:var(--green)}

/* the goal */
.nm-goal{display:flex;align-items:center;gap:18px}
.nm-goalring{position:relative;width:132px;height:132px;flex:none}
.nm-ringsvg{position:absolute;inset:0;transform:rotate(-90deg)}
.nm-ring{animation:nmRing 1.3s cubic-bezier(.3,.8,.3,1) .2s both}
@keyframes nmRing{from{stroke-dashoffset:var(--c)}}
.nm-goalin{position:absolute;inset:22px;border-radius:999px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nm-goalin .p{font-size:32px;font-weight:600;letter-spacing:-.04em;line-height:1}
.nm-goalin .d{font-size:11px;font-weight:600;color:var(--navyInk2)}
.nm-goalin .d .m{color:#fff}
.nm-goalr{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.nm-big{font-size:25px;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.nm-of{font-size:12px;color:var(--navyInk)}
.nm-of .m{color:#fff}
.nm-pace{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--navyInk2);white-space:nowrap}
.nm-pace i{width:10px;height:3px;border-radius:2px;background:var(--amber);flex:none}
.nm-pace .m{color:#fff}
.nm-chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:rgba(111,220,176,.14);color:var(--mint);font-size:12px;font-weight:700;white-space:nowrap}
.nm-chip.sm{height:24px;padding:0 9px;gap:5px}
.nm-chip.behind{background:rgba(245,178,107,.16);color:var(--amber)}
.nm-nogoal{display:flex;align-items:center;gap:16px;padding:6px 0 4px}
.nm-nogoal b{font-size:17px;line-height:1.25}
.nm-nogoal > span:last-child > span{font-size:13px;color:var(--navyInk)}
.nm-flag{width:84px;height:84px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--navyInk2);box-shadow:inset 0 0 0 6px rgba(255,255,255,.07)}
.nm-chart{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.nm-legend{display:flex;gap:10px}
.nm-legend > span{display:inline-flex;align-items:center;gap:4px}
.nm-legend i{width:8px;height:8px;border-radius:2px}
.nm-legend i.beat{background:var(--navy)}
.nm-legend i.fut{box-shadow:inset 0 0 0 1.5px #C9C4BA}
.nm-legend i.today{background:var(--green)}
.nm-bars{position:relative;height:96px;display:flex;align-items:flex-end}
.nm-bar{flex:1;min-width:0;border-radius:3px 3px 1px 1px;transform-origin:bottom;animation:nmBar .6s cubic-bezier(.3,.8,.3,1) both}
@keyframes nmBar{from{transform:scaleY(0)}}
.nm-bar.beat{background:var(--navy)}
.nm-bar.low{background:#C9C4BA}
.nm-bar.today{background:var(--green);box-shadow:0 0 0 3px rgba(15,107,67,.18)}
.nm-bar.fut{animation:none;box-shadow:inset 0 0 0 1.5px #C9C4BA;background:repeating-linear-gradient(135deg,transparent 0 3px,rgba(201,196,186,.35) 3px 5px)}
.nm-bar.none{animation:none;height:3px;background:#EFECE6}
.nm-tline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--amber);pointer-events:none}
.nm-flabel{position:absolute;right:4px;bottom:8px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.92);font-size:10px;font-weight:700;color:var(--ink3);white-space:nowrap}
.nm-flabel .m{color:var(--ink)}
.nm-axis{position:relative;height:14px;font-size:10px;color:var(--ink3)}
.nm-axis span{position:absolute;top:0;white-space:nowrap}
.nm-axis span.now{color:var(--green);font-weight:600}
.nm-who{display:flex;flex-direction:column;gap:12px}
.nm-share{display:flex;height:12px;gap:2px;border-radius:999px;overflow:hidden}
.nm-who-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
.nm-who-r{display:flex;align-items:center;gap:8px;min-width:0;border:none;background:none;padding:0;text-align:left;color:var(--ink)}
.nm-who-r[disabled]{cursor:default}
.nm-av{width:30px;height:30px;border-radius:999px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.nm-who-t{display:flex;flex-direction:column;min-width:0}
.nm-who-t .ell{font-size:13px;font-weight:700}

@keyframes ordIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes ordFlow{to{background-position:12px 0}}
@keyframes ordTin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ordStamp{0%{transform:rotate(-9deg) scale(1.8);opacity:0}60%{transform:rotate(-9deg) scale(.94);opacity:.95}100%{transform:rotate(-9deg) scale(1);opacity:.88}}
.ord-blink{animation:ordBlink 1.5s ease-in-out infinite}

.ord-photo{position:relative;height:120px;border:none;padding:0;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#DCD6CB,#C9D2DA);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);width:100%}
.ord-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ord-photo img:not([src]),.ord-photo img[src=""]{visibility:hidden}
.ord-photo .cap{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:rgba(22,32,60,.78);color:#fff;font-size:12px;font-weight:700}
.ord-phmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:6px;padding:0 16px;text-align:center;font-size:13px;font-weight:600;color:var(--ink2)}
.ord-photo.wait .ord-phmsg.wait,.ord-photo.fail .ord-phmsg.fail{display:flex}
.ord-photo.fail{height:64px}
.ord-photo.fail .cap,.ord-photo.fail .ex,.ord-photo.fail img{display:none}
.ord-phbig{position:relative;border-radius:16px;overflow:hidden;background:#243052}
.ord-phbig img{display:block;width:100%;height:auto}
.ord-phbig.wait,.ord-phbig.fail{min-height:200px}
.ord-phbig.wait img,.ord-phbig.fail img{display:none}
.ord-phbig .ord-phmsg{color:var(--navyInk)}
.ord-phbig.wait .ord-phmsg.wait,.ord-phbig.fail .ord-phmsg.fail{display:flex}
.ord-photo .ex{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.85);color:var(--navy);display:flex;align-items:center;justify-content:center}
.ord-dock{position:fixed;left:0;right:0;bottom:0;z-index:55;max-width:520px;margin:0 auto;display:flex;gap:8px;padding:18px 16px calc(18px + var(--safe-area-inset-bottom));background:linear-gradient(rgba(247,245,242,0),var(--bg) 40%)}
.ord-sq{width:56px;height:56px;flex:none;border:none;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;color:var(--ink)}
.ord-cta{flex:1;min-width:0;height:56px;border-radius:18px;font-size:16px}

/* tell sheet: WhatsApp's paper */
.sx-sheet.ord-tellsheet{background:#EDE8E0;padding:0;gap:0;height:92vh}
.sx-sheet.ord-tellsheet > .sx-handle{display:none}
.ord-tell{display:flex;flex-direction:column;flex:1;min-height:0}
.ord-tellhead{background:var(--bg);padding:10px 16px 12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 #E2DDD4}
.ord-tellhead .row{display:flex;align-items:center;gap:10px}
.ord-tellhead .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ord-tellhead b{font-size:16px}
.ord-tellhead .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);min-width:0}
.ord-tellhead .tx > b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord-tellhead .dot{width:7px;height:7px;border-radius:999px;flex:none}
.ord-tellhead .dot.on{background:var(--green)}
.ord-tellhead .dot.off{background:#B9B2A6}
.ord-chat{flex:1;min-height:0;overflow:auto;padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px}
.ord-prev{align-self:center;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.7);font-size:11px;font-weight:600;color:var(--ink2)}
.ord-bub{align-self:flex-end;background:#D9FDD3;box-shadow:0 1px 1px rgba(0,0,0,.08);color:#111B21}
.ord-bub.pic{width:262px;max-width:80%;padding:4px;border-radius:14px 14px 4px 14px}
.ord-bub.pic img{display:block;width:100%;border-radius:9px}
.ord-bub.txt{max-width:88%;padding:8px 10px 8px;border-radius:14px 4px 14px 14px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.ord-bub.txt .m{font-weight:600}
.ord-bub.txt.editing{width:88%}
.ord-bub textarea{width:100%;min-height:96px;overflow:hidden;border:none;background:transparent;resize:vertical;font-size:14px;line-height:1.45;color:#111B21;outline:none;padding:0;display:block}
.ord-tellfoot{background:var(--navy);color:#fff;border-radius:26px 26px 0 0;padding:16px 16px calc(22px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 24px rgba(22,32,60,.18)}
.ord-tellfoot .opts{display:flex;align-items:center;gap:8px;min-height:40px}
.ord-sw{height:40px;padding:0 12px 0 6px;border:none;border-radius:999px;background:rgba(255,255,255,.07);color:var(--navyInk);font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.ord-sw i{width:24px;height:24px;border-radius:999px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.ord-sw.on{background:rgba(111,220,176,.14);color:var(--mint);font-weight:700}
.ord-sw.on i{background:var(--mint);color:var(--navy);box-shadow:none}
.ord-note{font-size:12px;font-weight:600;color:var(--navyInk2);flex:1;min-width:0}
.ord-edit{margin-left:auto;height:40px;padding:0 12px;border:none;border-radius:999px;background:transparent;color:var(--navyInk);font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;flex:none}
.ord-tellfoot .sx-slide[aria-disabled="true"] .k{animation:none}

.ord-tp{flex:none;margin-left:auto;padding:1px 6px;border-radius:999px;background:var(--amberSoft);color:var(--amberInk);font-size:11px;font-weight:700;white-space:nowrap}
.ord-invrow{gap:18px}
.ord-invrow > .ord-inv{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ord-invrow > .ord-inv > .icon{vertical-align:-3px;margin-right:6px}
.ord-invrow > .ord-stamp,.ord-stampw > .ord-stamp{flex:none;white-space:nowrap}
.ord-pup{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12px;font-weight:600;color:var(--amberInk)}
.ord-pup s{color:#8A93A3}
.ord-pup .k{padding:1px 6px;border-radius:5px;background:#F4F2EE;font-family:Figtree,system-ui,sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;color:#5F6980}
.ord-pup svg{stroke:var(--amber);flex:none}
.ord-pup em{font-style:normal;padding:1px 6px;border-radius:999px;background:var(--amberSoft);font-size:11px}
.ord-rno{color:var(--ink3);font-weight:600}
.ord-pl.chg .nm{gap:4px;align-items:flex-start}
.ord-pl.chg .q small{font-family:Figtree,system-ui,sans-serif;font-size:12px;font-weight:600;color:#6B7480}
.ord-xchip{padding:1px 7px;border-radius:999px;background:var(--skySoft,#DCEAF8);color:var(--sky,#1A5A8A);font-size:11px;font-weight:700}
.ord-made{display:flex;flex-direction:column;gap:7px;padding:0 0 9px}
.ord-made .bar{display:flex;height:6px;gap:2px;border-radius:999px;overflow:hidden}
.ord-made .bar i,.ord-made .lg i{background:#16203C}
.ord-made .bar i.c,.ord-made .lg i.c{background:#1A5A8A}
.ord-made .bar i.k,.ord-made .lg i.k{background:#9CC3E6}
.ord-made .lg{display:flex;gap:12px;font-size:11px;font-weight:600;color:var(--ink3)}
.ord-made .lg>span{display:inline-flex;align-items:center;gap:5px}
.ord-made .lg i{width:8px;height:8px;border-radius:3px;display:inline-block}
.ord-made .lg .m{color:var(--ink)}
.ord-stamp.cr{color:#1A5A8A;background:rgba(220,234,248,.35)}
.ord-stamp.cr b{font-size:20px}
.ord-pup .ink{color:var(--ink)}
.ord-pup em.ok{background:var(--greenSoft);color:var(--green)}
.ord-pup em.bad{background:var(--crimsonSoft);color:var(--crimson);font-family:Figtree,system-ui,sans-serif;font-weight:700}
.ord-pup em.bad .m{font-weight:600}
.ord-pup .was{font-size:11px;color:#8A93A3;white-space:nowrap}
.ord-pup.under .w{font-family:Figtree,system-ui,sans-serif;color:var(--ink3)}
.ord-pup.sells{margin-top:2px}
.ord-answers{display:flex;flex-direction:column;gap:6px;padding:8px 0 10px;border-top:1px dashed #E2DED6}
.ord-answers .h{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink3)}
.ord-answers .cs{display:flex;gap:6px;flex-wrap:wrap}
.ord-answers .c{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:999px;font-size:11px;font-weight:700}
.ord-answers .c.ok{background:var(--greenSoft);color:var(--green)}
.ord-answers .c.chg{background:var(--skySoft);color:var(--sky)}
.ord-sq.wide{width:92px;font-size:11px}
/* ---- Pay (Take a payment / Choose orders) ---- */
.sx-page[data-type="pay"],.sx-page[data-type="paid"]{padding-bottom:0}
.py-top{display:block;width:100%;height:calc(40px + var(--safe-area-inset-top));border:none;background:transparent;padding:0}
.py-sheet{min-height:calc(100% - 40px - var(--safe-area-inset-top));background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(250px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.py-sheet>.sx-handle{align-self:center}
.py-head{display:flex;align-items:center;gap:10px}
.py-head .sx-av{width:42px;height:42px;font-size:14px}
.py-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.py-nm{font-size:17px;font-weight:700}
.py-amt{display:flex;align-items:baseline;justify-content:center;gap:8px;padding-top:4px;cursor:text}
.py-cur{font-size:15px;font-weight:600;color:var(--ink3)}
.py-inw{position:relative;display:inline-flex;align-items:baseline}
.py-inw input{border:none;outline:none;background:transparent;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.04em;color:var(--ink);text-align:center;padding:0;caret-color:var(--red);max-width:calc(100vw - 90px);transition:font-size .15s}
.py-inw input::placeholder{color:#C9C4BA}
.py-caret{position:absolute;right:-6px;top:18%;width:2px;height:66%;border-radius:2px;background:var(--red);animation:pyCaret 1.1s steps(1) infinite}
.py-inw input:focus+.py-caret{display:none}
@keyframes pyCaret{0%,49%{opacity:1}50%,100%{opacity:0}}
.py-bar{display:flex;flex-direction:column;gap:6px}
.py-track{position:relative;height:8px;border-radius:999px;background:var(--amberSoft);box-shadow:inset 0 0 0 1px rgba(149,83,12,.18);overflow:hidden;display:block}
.py-drain{position:absolute;top:0;bottom:0;left:0;border-radius:999px;background:var(--green);transition:width .35s cubic-bezier(.4,0,.2,1)}
.py-drain.anim{animation:pyDrain 1.1s cubic-bezier(.4,0,.2,1) .45s backwards}
@keyframes pyDrain{from{width:0}}
.py-bl{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;color:var(--ink3)}
.py-bl b{font-weight:600;color:var(--ink)}
#py_after{color:var(--amberInk)} #py_after b{color:inherit}
#py_after.z{color:var(--green)}
.py-modes{display:flex;justify-content:center}
.py-modes:empty{display:none}
.py-seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.py-seg button{flex:none;white-space:nowrap}
.py-paper{margin:2px 4px 0}
.py-paper .sx-paper-in{padding:6px 16px 4px}
.py-hint{font-size:12px;font-weight:600;color:var(--ink3)}
.py-stage{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink2)}
.py-stage:before{content:'';width:8px;height:8px;border-radius:9px;background:var(--c)}
.py-row{width:100%;border:none;background:transparent;font-family:inherit;text-align:left;color:var(--ink);display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;transition:opacity .2s}
.py-row+.py-row{border-top:1px dashed #E2DED6}
button.py-row:active{background:var(--soft)}
.py-n{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;position:relative}
.py-n.on{background:var(--green);color:#fff;animation:sxPop .35s ease-out both}
.py-n.on svg{width:13px;height:13px}
.py-n.off{box-shadow:inset 0 0 0 2px #D9D4CB}
.py-n.part{background:conic-gradient(var(--green) var(--f),#D9EFE2 0);color:var(--green)}
.py-n.part:before{content:'';position:absolute;inset:3px;border-radius:999px;background:#fff}
.py-n.part b{position:relative;font-weight:600}
.py-mid{display:flex;flex-direction:column;gap:2px;min-width:0}
.py-lbl{font-size:14px;font-weight:600}
.py-age{font-size:12px;font-weight:600;color:var(--ink3)}
.py-age.late{color:var(--amberInk)}
.py-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.py-due{font-size:14px;font-weight:600;white-space:nowrap}
.py-row.off .py-lbl,.py-row.off .py-due{color:#8A93A3}
.py-row.off .py-age:not(.late){color:#8A93A3}
.py-tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:.1em;white-space:nowrap}
.py-tag svg{width:12px;height:12px}
.py-tag.ok{color:var(--green)}
.py-tag.ok.pop{animation:pyClr .45s ease-out both}
.py-tag.part,.py-tag.owed{color:var(--amberInk)}
.py-tag .m{letter-spacing:0}
@keyframes pyClr{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
.py-was{margin-left:auto;font-size:12px;color:#8A93A3;text-decoration:line-through}
.py-left{font-size:17px;font-weight:600;color:var(--amberInk)}
.py-left.z{color:var(--green)}
.py-paper .sx-paper-f>span:first-child{margin-right:auto}
.py-note{margin:2px 4px 0;padding:10px 12px;border-radius:12px;background:var(--amberSoft);color:var(--amberInk);font-size:12px;font-weight:600;line-height:1.4}
.py-note.soft{background:var(--soft2);color:var(--ink2)}
.py-dock{padding:16px 16px calc(22px + var(--safe-area-inset-bottom));border-radius:26px 26px 0 0;gap:12px}
.py-methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.py-methods button{height:62px;border:none;border-radius:16px;background:rgba(255,255,255,.07);color:var(--navyInk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;transition:background .15s,color .15s}
.py-methods button[aria-checked="true"]{background:#fff;color:var(--navy);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.py-sws{display:flex;gap:8px;flex-wrap:wrap}
.py-sw{height:36px;padding:0 12px 0 6px;border:none;border-radius:999px;background:rgba(255,255,255,.07);color:var(--navyInk);font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.py-swk{width:24px;height:24px;border-radius:999px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex:none}
.py-swk svg{width:12px;height:12px}
.py-sw.on{background:rgba(111,220,176,.14);color:var(--mint)}
.py-sw.on .py-swk{background:var(--mint);color:var(--navy);box-shadow:none;animation:sxPop .3s ease-out both}
.py-dock .sx-slide .l .m{font-family:var(--mono)}

/* ---- Paid ---- */
.pd{position:relative;min-height:100%;overflow:hidden;color:#fff;padding:calc(64px + var(--safe-area-inset-top)) 20px calc(110px + var(--safe-area-inset-bottom))}
.pd-glow{position:absolute;left:50%;top:20px;width:360px;height:360px;margin-left:-180px;border-radius:999px;background:radial-gradient(circle,rgba(245,178,107,.22) 0%,rgba(245,178,107,0) 62%);animation:pdGlow 3s ease-in-out 1s infinite;pointer-events:none}
.pd-snd{position:absolute;top:calc(18px + var(--safe-area-inset-top));right:16px;width:40px;height:40px;border:none;border-radius:999px;background:rgba(255,255,255,.08);color:var(--navyInk);display:flex;align-items:center;justify-content:center;z-index:2}
.pd-col{position:relative;display:flex;flex-direction:column;align-items:center}
.pd-reg{position:relative;width:150px;height:150px;border:none;background:transparent;padding:0;color:#fff;flex:none}
.pd-coins{position:absolute;left:0;right:0;top:0;height:60px}
.pd-coin{position:absolute;top:0;width:22px;height:22px;border-radius:999px;background:radial-gradient(circle at 35% 30%,#FFE2B0,#F5B26B 60%,#D98C3A);box-shadow:0 2px 6px rgba(0,0,0,.25);opacity:0}
.pd-coin i{position:absolute;inset:4px;border-radius:999px;box-shadow:inset 0 0 0 1.5px rgba(122,74,2,.45)}
.pd-spark{position:absolute;inset:0;opacity:0}
.pd-spark i{position:absolute;width:14px;height:3px;border-radius:3px;background:var(--mint)}
.pd-spark i.v{width:3px;height:12px;background:var(--amber)}
.pd-body{position:absolute;left:25px;right:25px;top:52px;height:52px;border-radius:14px 14px 6px 6px;background:linear-gradient(180deg,#2B3866,#243052);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18),0 10px 24px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;gap:6px;z-index:2}
.pd-till{min-width:40px;height:14px;border-radius:4px;background:#0E1630;box-shadow:inset 0 0 0 1px rgba(111,220,176,.4);display:flex;align-items:center;justify-content:flex-end;padding:0 4px;font-size:9px;color:var(--mint);letter-spacing:0}
.pd-keys{display:grid;grid-template-columns:repeat(3,6px);gap:3px}
.pd-keys i{height:5px;border-radius:2px;background:rgba(255,255,255,.35)}
.pd-keys i.r{background:var(--red)}
.pd-drawer{position:absolute;left:17px;right:17px;top:100px;height:26px;border-radius:6px 6px 12px 12px;background:linear-gradient(180deg,#E8E4DC,#CFC9BE);box-shadow:0 8px 16px rgba(0,0,0,.3);z-index:1;display:flex;align-items:center;justify-content:center}
.pd-drawer span{width:30px;height:4px;border-radius:999px;background:#8D877C}
.pd-badge{position:absolute;right:8px;top:36px;width:38px;height:38px;border-radius:999px;background:var(--mint);color:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--navy);z-index:3}
.pd-badge svg{width:18px;height:18px}
.pd-reg.go .pd-coin{animation:pdCoin .9s cubic-bezier(.5,0,.8,.6) both}
.pd-reg.go .pd-spark{animation:pdSpark 1.4s ease-out .3s both}
.pd-reg.go .pd-drawer{animation:pdDrawer 1.6s cubic-bezier(.3,.8,.3,1) .2s both}
.pd-reg.go .pd-badge{animation:pdBadge 1.5s cubic-bezier(.2,.9,.3,1.2) .2s both}
@keyframes pdDrawer{0%,20%{transform:translateY(0)}35%,70%{transform:translateY(16px)}85%,100%{transform:translateY(0)}}
@keyframes pdCoin{0%{transform:translateY(-70px) rotate(0);opacity:0}15%{opacity:1}70%{transform:translateY(46px) rotate(200deg);opacity:1}100%{transform:translateY(52px) rotate(220deg);opacity:0}}
@keyframes pdSpark{0%,55%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
@keyframes pdBadge{0%,62%{transform:scale(0);opacity:0}78%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
@keyframes pdUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pdGlow{0%,100%{opacity:.35}50%{opacity:.7}}
@keyframes pdDrain{from{transform:scaleX(0)}}
.pd-up{animation:pdUp .6s ease-out both}
.pd-eb{margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--mint)}
.pd-amt{margin-top:4px;display:flex;align-items:baseline;gap:8px;max-width:100%}
.pd-cur{font-size:15px;font-weight:600;color:var(--navyInk2)}
.pd-big{font-size:46px;font-weight:600;letter-spacing:-.04em;white-space:nowrap}
.pd-who{margin-top:8px;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 4px;border-radius:999px;background:rgba(255,255,255,.08);max-width:100%;min-width:0}
.pd-av{width:28px;height:28px;border-radius:999px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pd-nm{font-size:13px;font-weight:600}
.pd-nm.none{color:var(--navyInk);font-weight:500;padding-left:10px}
.pd-how{font-size:12px;color:var(--navyInk);white-space:nowrap;flex:none}
.pd-card{width:100%;border:none;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:#fff;font-family:inherit;text-align:left}
.pd-bal{margin-top:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pd-balt{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.pd-balk{display:flex;flex-direction:column;gap:2px;min-width:0}
.pd-lab{font-size:12px;font-weight:600;color:var(--navyInk)}
.pd-balv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pd-after{font-size:30px;font-weight:600;letter-spacing:-.03em;color:#fff}
.pd-after.z{color:var(--mint)}
.pd-before{font-size:13px;color:var(--navyInk2);text-decoration:line-through}
.pd-clear{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;background:rgba(111,220,176,.16);color:var(--mint);font-size:12px;font-weight:700;flex:none}
.pd-clear svg{width:12px;height:12px}
.pd-track{position:relative;height:8px;border-radius:999px;background:rgba(245,178,107,.28);overflow:hidden;display:block}
.pd-fill{position:absolute;inset:0;border-radius:999px;background:var(--mint);transform-origin:left}
.pd-fill.anim{animation:pdDrain 1.2s cubic-bezier(.4,0,.2,1) 1.4s backwards}
.pd-foot{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--navyInk)}
.pd-foot b{color:#fff;font-weight:600}
.pd-foot b.ok{color:var(--mint)}
.pd-stack{width:100%;display:flex;flex-direction:column}
.pd-stack:empty{display:none}
.pd-rc,.pd-grp{margin-top:10px;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.06);box-shadow:none}
.pd-rc.go,.pd-grp{box-shadow:inset 0 0 0 1px rgba(111,220,176,.3)}
.pd-rc.bad{box-shadow:inset 0 0 0 1px rgba(245,154,146,.4)}
.pd-rc.bad .pd-rct{color:#F59A92}
.pd-rcm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pd-rct{font-size:14px;font-weight:700}
.pd-rcs{font-size:12px;line-height:1.35;color:var(--navyInk)}
.pd-rcs .m{white-space:nowrap}
.pd-rc>.icon,.pd-grp>.icon{color:var(--navyInk2)}
.pd-slip{width:40px;height:50px;flex:none;border-radius:6px;background:#fff;padding:6px 5px;display:flex;flex-direction:column;gap:3px;transform:rotate(-3deg);box-shadow:0 6px 12px rgba(0,0,0,.3);position:relative}
.pd-slip i{height:2px;border-radius:2px;background:#D9D4CB}
.pd-slip i:first-child{height:3px;width:60%;background:var(--navy);margin-bottom:2px}
.pd-slip i:nth-child(3){width:80%}
.pd-slip b{position:absolute;right:3px;bottom:6px;padding:1px 3px;border:1.5px solid var(--green);border-radius:3px;font-size:6px;font-weight:700;letter-spacing:.08em;color:var(--green);transform:rotate(-10deg)}
.pd-st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--navyInk);flex:none}
.pd-st svg{width:16px;height:12px}
.pd-st.sent{color:var(--navyInk)}
.pd-st.sent svg{width:13px;height:13px}
.pd-st.delivered{color:var(--mint)}
.pd-st.read{color:#7CC4FF}
.pd-gi{width:40px;height:40px;border-radius:12px;background:rgba(111,220,176,.14);color:var(--mint);display:flex;align-items:center;justify-content:center;flex:none}
.pd-posted{margin-top:10px;align-self:flex-start;padding-left:4px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--navyInk2)}
.pd-posted svg{width:13px;height:13px;color:var(--mint)}
.pd-acts{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:16px 16px calc(28px + var(--safe-area-inset-bottom));display:flex;gap:8px;background:linear-gradient(180deg,rgba(22,32,60,0),#16203C 30%);z-index:3}
.pd-rcbtn{flex:1;height:56px;border:none;border-radius:18px;background:rgba(255,255,255,.08);font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.pd-done{flex:1.4;height:56px;border:none;border-radius:18px;background:var(--red);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(201,58,48,.35)}
.pd-slipwho{display:flex;flex-direction:column;gap:2px;padding:10px 0 6px;min-width:0}
.pd-slipl{display:grid;grid-template-columns:minmax(0,1fr) auto 70px;gap:10px;align-items:baseline;padding:7px 0;border-top:1px dashed #E2DED6;font-size:13px}
.pd-slipl .py-hint{text-align:right}
.pd-foot>span:first-child{display:flex;flex-wrap:wrap;gap:2px 10px}
.pd-bw{white-space:nowrap}
/* the keyboard is up: the dock keeps only the slide, so what it clears stays in sight */
@media (max-height:520px){.py-dock .py-methods,.py-dock .py-sws{display:none}.py-dock{padding-bottom:12px}}
/* the change to hand back, and who owes what a walk-in leaves */
.py-change{display:flex;align-items:center;gap:12px;margin:10px 4px 0;padding:12px 14px;border-radius:18px;background:var(--greenSoft);color:var(--green)}
.py-change .ico{width:40px;height:40px;border-radius:12px;background:rgba(15,107,67,.12);display:flex;align-items:center;justify-content:center;flex:none}
.py-change .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:12px;font-weight:600;color:var(--ink)}
.py-change .tx b{font-size:12px;letter-spacing:.08em;color:var(--green)}
.py-change .v{font-size:26px;font-weight:600}
.py-owe{display:flex;flex-direction:column;gap:10px;margin:10px 4px 0;padding:12px 14px;border-radius:18px;background:#FEF8F2;box-shadow:inset 0 0 0 1.5px var(--amber)}
.py-owe.set{background:#fff;box-shadow:inset 0 0 0 1.5px var(--green)}
.py-owe .hd{display:flex;align-items:center;gap:10px}
.py-owe .ico{width:34px;height:34px;border-radius:11px;background:var(--amberSoft);color:var(--amberInk);display:flex;align-items:center;justify-content:center;flex:none}
.py-owe .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.py-owe .tx b{font-size:14px}
.py-owe .tx > span{font-size:12px;color:var(--ink2)}
.py-owex{flex:none;height:32px;padding:0 12px;border:none;border-radius:999px;background:var(--soft);color:var(--ink);font-size:12px;font-weight:700}
.py-owein{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule)}
.py-owein input{flex:1;min-width:0;border:none;outline:none;background:transparent;font:inherit;font-size:14px}
.py-owecs{display:flex;gap:6px;overflow-x:auto;margin:0 -14px;padding:0 14px 2px;scrollbar-width:none}
.py-owecs::-webkit-scrollbar{display:none}
.py-owec{flex:none}
.py-owec{max-width:160px;height:36px;padding:0 12px 0 3px;border:none;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-width:0}
.py-owec .sx-av{width:28px;height:28px;font-size:10px}
.py-owec.new{padding:0 12px;box-shadow:inset 0 0 0 1.5px var(--red);color:#A82D24;gap:5px}
.py-all{display:block;margin:8px auto 0;padding:4px 8px;border:none;background:none;color:#B3BCD2;font-size:13px;font-weight:700}
.py-all .m{color:#fff}
.pd-change{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--mint);color:var(--navy)}
.pd-change .ico{width:40px;height:40px;border-radius:12px;background:rgba(22,32,60,.1);display:flex;align-items:center;justify-content:center;flex:none}
.pd-change .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:12px;font-weight:600}
.pd-change .tx b{letter-spacing:.08em}
.pd-change .v{font-size:26px;font-weight:600}
.pd-slipits{display:flex;flex-direction:column;gap:2px;padding:2px 0 8px 10px;border-bottom:1px dashed #E2DED6}
.pd-slipits .r{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;font-size:12px;color:var(--ink2)}
.pd-slipits .r small{font-size:10px;color:var(--ink3)}
.pd-slipits .more{font-size:11px;color:var(--ink3)}
.py-k{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:3px;vertical-align:0}
.py-k.in{background:var(--green)}
.py-k.left{background:var(--amberSoft);box-shadow:inset 0 0 0 1px rgba(149,83,12,.3)}
.pd-slipits .r>span:first-child{white-space:nowrap}
/* NEW-01: the whole sum of a part payment */
.pd-sum{display:flex;flex-direction:column;padding-top:2px}
.pd-sum .r{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed #E2DED6;font-size:13px;color:var(--ink)}
.pd-sum .r>span:first-child{display:flex;flex-direction:column;gap:1px;min-width:0}
.pd-sum .r b{font-weight:600}.pd-sum .r small{font-size:11px;color:var(--ink3)}
.pd-sum .r .m{font-size:14px;font-weight:600}
.pd-sum .r.now{margin:4px -8px;padding:7px 8px;border:none;border-radius:8px;background:var(--greenSoft);color:var(--green)}
.pd-sum .r.now b{font-weight:700}
.pd-sum .r.tot{margin-top:4px;padding-top:8px;border-bottom:none;border-top:1.5px solid var(--ink)}
.pd-sum .r.tot b{font-weight:700}.pd-sum .r.tot .m{font-size:18px}
.pd-sum .bar{display:flex;gap:2px;height:6px;margin:2px 0 6px}
.pd-sum .bar i{background:var(--navy);border-radius:999px 0 0 999px}
.pd-sum .bar i.n{background:var(--green);border-radius:0}
.pd-sum .bar i.l{background:#E2DED6;border-radius:0 999px 999px 0}
.pd-rcpt{width:100%;margin-top:18px;color:var(--ink)}
.pd-rcpt .pd-rno{font-size:12px;font-weight:600;color:var(--green)}
.py-ref{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.py-ref .k{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--navyInk2);white-space:nowrap}
.py-ref input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:var(--mono);font-size:15px;font-weight:600;color:#fff;letter-spacing:.02em}
.py-ref input::placeholder{font-family:Figtree,system-ui,sans-serif;font-weight:500;color:#5C6788}
.py-ref .o{padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;font-weight:600;color:var(--navyInk2)}
.pd-sum .r small.rf{color:var(--green);opacity:.8;font-weight:600}
/* ---- who decides: the Manager's face (Insight's plum, as on the canvas) ---- */
.sx-mgr{border-radius:999px;background:var(--plumSoft);color:var(--plum);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:1;letter-spacing:0}
/* The three answers on a price, each its own shape as well as colour. */
.sx-ptag.chip{gap:6px;padding:3px 9px 3px 3px;border-radius:999px;font-weight:700;max-width:100%;min-width:0;align-self:flex-start}
.sx-ptag.chip.wait{background:var(--amberSoft);color:var(--amberInk)}
.sx-ptag.chip.wait > i{width:6px;height:6px;background:var(--amber)}
.sx-ptag.chip.ok{background:var(--greenSoft);color:var(--green)}
.sx-ptag.chip.chg{background:var(--skySoft);color:var(--sky)}
.sx-ptag.chip.chg{white-space:normal;border-radius:12px;line-height:1.3;align-items:center}
.ord-pl .nm .sx-ptag{margin-top:4px}

/* ---- the order page: a changed price, the old figure struck ---- */
.ord-amts{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.ord-was{font-size:11px;color:#8A93A3;text-decoration:line-through;white-space:nowrap}
.ord-told{display:flex;align-items:center;gap:8px;padding:8px 0 10px;border-top:1px dashed #E2DED6;font-size:12px;font-weight:600;color:var(--green)}

/* ---- the Checking gate: three tiles in the navy head ---- */
.ord-ring{animation:ordRing 1.8s ease-out infinite}
@keyframes ordRing{0%{box-shadow:0 0 0 0 rgba(245,178,107,.55)}70%,100%{box-shadow:0 0 0 7px rgba(245,178,107,0)}}

/* ---- Tell them the new price ---- */
.ord-tellp{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:none;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--sky);text-align:left;color:var(--ink)}
.ord-tellp .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ord-tellp .tx b{font-size:14px}
.ord-tellp .tx span{font-size:12px;font-weight:600;color:var(--ink3)}
.ord-tellp .go{padding:4px 9px;border-radius:999px;background:var(--skySoft);color:var(--sky);font-size:11px;font-weight:700;white-space:nowrap}
.ord-note.c{text-align:center;flex:none}

/* ---- something wrong after the sale: ask the Manager ---- */
.ord-wrong{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border:none;border-radius:14px;background:transparent;color:var(--ink3);font-size:13px;font-weight:600}
.ord-askrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--amber)}
.ord-askrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ord-askrow .tx b{font-size:13px}
.ord-askrow .tx span{font-size:12px;font-weight:600;color:var(--ink3)}
.ord-askx{height:34px;padding:0 12px;border:none;border-radius:999px;background:var(--soft);color:var(--ink);font-size:12px;font-weight:700;white-space:nowrap}
.ord-askdone{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700}
.ord-askdone.accepted{color:var(--green)}
.ord-askdone.declined{color:var(--crimson)}
.ord-fixh{display:flex;align-items:center;gap:12px}
.ord-fixh .fi,.ord-fixopt .fi{width:44px;height:44px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center}
.ord-fixh .tx,.ord-fixopt .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ord-fixh .tx b{font-size:18px;font-weight:700}
.ord-fixh .tx span,.ord-fixopt .tx span{font-size:12px;font-weight:600;color:var(--ink3)}
.ord-fixopt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:none;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px #ECE8E1;text-align:left;color:var(--ink)}
.ord-fixopt .fi{width:42px;height:42px;border-radius:13px}
.ord-fixopt .tx b{font-size:15px}
.ord-fixopt .who{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.ord-fixopt .who small{font-size:10px;font-weight:700;color:var(--ink3)}
.ord-fixnote{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink3);text-align:center}
.ord-lab{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink3);margin-bottom:-6px}
.ord-chips{display:flex;flex-wrap:wrap;gap:8px}
.ord-chips button{height:38px;padding:0 14px;border:none;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-size:13px;font-weight:700}
.ord-chips button[aria-checked="true"]{background:var(--navy);color:#fff;box-shadow:none}
.ord-asknote{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink3)}
.ord-asknote input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:13px;font-weight:600;color:var(--ink)}
.ord-vpair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.ord-vpair > b{font-size:18px;color:var(--crimson)}
.ord-vinv{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.ord-vinv .m{font-size:13px;font-weight:600}
.ord-vinv small{font-size:11px;font-weight:600;color:var(--ink3)}
.ord-vinv .v{font-size:15px}
.ord-vinv.me{background:var(--crimsonSoft);color:var(--crimson);box-shadow:inset 0 0 0 1.5px var(--crimson)}
.ord-vinv.me small{color:var(--crimson)}
.ord-vinv.me .v{text-decoration:line-through}
.ord-owe{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;color:var(--ink3)}
.ord-owe > span:last-child{display:flex;align-items:baseline;gap:8px}
.ord-owe .was{font-size:13px;text-decoration:line-through}
.ord-owe b{font-size:18px;font-weight:600;color:var(--ink)}
.ord-retl{padding:0 14px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px #ECE8E1}
.ord-ret{display:flex;align-items:center;gap:10px;padding:10px 0}
.ord-ret + .ord-ret{border-top:1px dashed #E2DED6}
.ord-ret .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;opacity:.6}
.ord-ret.on .tx{opacity:1}
.ord-ret .tx b{font-size:14px}
.ord-ret .tx span{font-size:12px;font-weight:600;color:var(--ink3)}
.ord-retstep{display:flex;align-items:center;gap:4px;padding:3px;border-radius:12px;background:var(--soft)}
.ord-ret.on .ord-retstep{background:var(--greenSoft)}
.ord-retstep button{width:32px;height:32px;border:none;border-radius:9px;background:#fff;font-size:18px;color:var(--ink)}
.ord-retstep b{width:26px;text-align:center;font-size:16px;font-weight:600;color:var(--ink3)}
.ord-ret.on .ord-retstep b{color:var(--green)}
.ord-credit{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:14px;background:var(--greenSoft);color:var(--green);font-size:13px;font-weight:700}
.ord-credit b{font-size:20px;font-weight:600}

/* ---- the order screen from a WhatsApp message: what they said ---- */
.nw-td.skip{box-shadow:inset 0 0 0 2px rgba(111,220,176,.35)}
.nw-td.skip i{width:9px;height:2px;border-radius:2px;background:rgba(111,220,176,.6)}
.nw-asksaid{padding:10px 12px;border-radius:4px 12px 12px 4px;background:var(--bg);box-shadow:inset 3px 0 0 var(--green);font-size:13px;line-height:1.4;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cht-wwait{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--amberSoft);color:var(--amberInk);font-family:var(--mono);font-size:12px;font-weight:600}
.cht-wsaid{padding:10px 12px;border-radius:4px 14px 14px 4px;background:var(--bg);box-shadow:inset 3px 0 0 var(--green);font-size:14px;line-height:1.45;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cht-wnote{text-align:center;font-size:12px;font-weight:600;color:var(--ink3)}

/* ---- Today: tell them the new price ---- */
.tdy-tell{background:#fff;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(22,32,60,.05),0 8px 22px rgba(22,32,60,.07),inset 0 0 0 1.5px var(--sky);animation:sxUpIn .4s ease both}
.tdy-th{display:flex;align-items:center;gap:10px}
.tdy-th .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tdy-th .tx b{font-size:15px;line-height:1.25}
.tdy-th .tx span{font-size:12px;font-weight:600;color:var(--ink3)}
.tdy-tav{position:relative;width:42px;height:42px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.tdy-tav .b{position:absolute;right:-4px;bottom:-4px;border-radius:999px;box-shadow:0 0 0 2px #fff;display:flex}
.tdy-tchip{padding:4px 9px;border-radius:999px;background:var(--skySoft);color:var(--sky);font-size:11px;font-weight:700;white-space:nowrap}
.tdy-tline{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--soft)}
.tdy-tline .tx{min-width:0;display:flex;flex-direction:column;gap:1px}
.tdy-tline .tx b{font-size:13px;font-weight:700}
.tdy-tline .tx small{font-size:11px;font-weight:600;color:var(--ink3)}
.tdy-tline .was{font-size:13px;color:var(--ink3);text-decoration:line-through}
.tdy-tline .now{font-size:16px;font-weight:600;color:var(--sky)}
.tdy-tmore{font-size:12px;font-weight:600;color:var(--ink3);padding:0 2px}
.tdy-tsum{display:flex;align-items:center;justify-content:space-between;padding:0 2px;font-size:12px;font-weight:600;color:var(--ink3)}

/* ---- the customer: a promise to pay ---- */
.cu-bhb{display:flex;align-items:center;gap:6px}
.cu-prombtn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border:none;border-radius:999px;background:var(--skySoft);color:var(--sky);font-size:13px;font-weight:700}

.cu-prom .n{padding:2px 7px;border-radius:999px;background:var(--crimson);color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
.cu-phead{display:flex;align-items:center;gap:12px}
.cu-pico{width:44px;height:44px;border-radius:14px;background:var(--skySoft);color:var(--sky);display:flex;align-items:center;justify-content:center;flex:none}
.cu-phead .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cu-phead .tx b{font-size:18px}
.cu-phead .tx span{font-size:12px;font-weight:600;color:var(--ink3)}
.cu-pbig{display:flex;align-items:baseline;justify-content:center;gap:8px}
.cu-pbig .u{font-size:13px;font-weight:700;color:var(--ink3)}

.cu-pbig input{width:100%;max-width:240px;border:none;outline:none;background:transparent;text-align:center;font-family:var(--mono);padding:0;border-bottom:2px solid var(--line)}
.cu-pwhat{text-align:center;font-size:12px;font-weight:600;color:var(--ink3);margin-top:-8px}
.cu-pchips{display:flex;gap:8px}
.cu-pchip{flex:1;min-width:0;height:46px;border:none;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}

.cu-pwhen{display:flex;flex-direction:column;gap:6px}
.cu-plab{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink3)}

.cu-pdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cu-pdays button{height:44px;border:none;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
