<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16203C">
<title>Omni-Ware Sales</title>
<!-- The phone app's native layer (apps/sales). Inert in a browser. It
     lives here rather than in the app's own files so a fix to it reaches
     installed phones the same way any change to this page does. -->
<script>
/* The sales page inside the Android app (apps/sales).

   First in <head>, and only does anything inside the app. Four jobs:

   1. Back (Android) closes what is on top -- a photo, a sheet, then the tab
      -- before it ever leaves the app, and leaving only puts it in the
      background so it reopens instantly.
   2. The status bar: the page draws to the top edge, so a strip behind the
      clock takes the colour of whatever is under it, and its icons stay
      readable against it.
   3. The bars' size: Capacitor measures them into --safe-area-inset-*,
      but a page it has not measured (some phones, after a reload) would
      read zero and slide under the clock -- so the last good measurement
      stands in until it does.
   4. Staying current without a store release: the installed app checks the
      live sales.html now and then, keeps a copy of a new one on the phone,
      and switches to it the next time the app goes to the background --
      never in the middle of an order. */
(function(){
  'use strict';
  var C = window.Capacitor;
  if(!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return;
  var P = C.Plugins || {};
  var App = P.App, Bars = P.SystemBars, WebView = P.WebView, Http = P.CapacitorHttp, FS = P.Filesystem;
  var NAVY = '#16203C';
  var root = document.documentElement;
  // The first installs carried this layer as their own native.js. On those
  // it is already running from above, and only the bars' size (3) is new.
  var legacy = !!document.querySelector('script[src="native.js"]');

  window.owHaptic = function(kind){
    var H = P.Haptics;
    if(!H) return;
    (kind === 'success' ? H.notification({ type: 'SUCCESS' }) : H.impact({ style: 'LIGHT' })).catch(function(){});
  };

  /* ---- 1. back ---- */
  // The page keeps its own stack of what is open (window.sxBack): a sheet,
  // then a screen pushed over a tab, then the tab itself back to Today.
  function back(){
    if(typeof window.sxBack === 'function' && window.sxBack()) return;
    if(App) App.minimizeApp();
  }
  if(App && !legacy) App.addListener('backButton', back);

  /* ---- 2. the strip behind the status bar ---- */
  var strip = null, lastStyle = '';
  function paintBar(){
    if(!strip) return;
    var top = strip.offsetHeight;
    var host = document.querySelector('#sx_pages .sx-page:last-child') || document;
    var navy = host.querySelector('[data-navy-top]:not([hidden])');
    var onNavy = !!document.querySelector('.sx-auth') || (navy && navy.getBoundingClientRect().top <= top && navy.getBoundingClientRect().bottom > top);
    strip.style.background = onNavy ? NAVY : 'var(--bg)';
    var style = onNavy || document.querySelector('.sx-scrim') ? 'DARK' : 'LIGHT';
    if(style !== lastStyle && Bars){ lastStyle = style; Bars.setStyle({ style: style }).catch(function(){}); }
  }
  var queued = false;
  function soon(){ if(queued) return; queued = true; requestAnimationFrame(function(){ queued = false; paintBar(); }); }
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(insets, 800);
    setTimeout(insets, 2500);
    window.addEventListener('resize', function(){ setTimeout(insets, 300); });
    if(App) App.addListener('resume', function(){ setTimeout(insets, 300); });
    if(legacy) return;
    strip = document.createElement('div');
    strip.setAttribute('aria-hidden', 'true');
    strip.style.cssText = 'position:fixed;top:0;left:0;right:0;height:var(--safe-t, 0px);z-index:59;pointer-events:none;background:' + NAVY + ';';
    document.body.appendChild(strip);
    new MutationObserver(soon).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class'] });
    document.addEventListener('scroll', soon, { passive: true, capture: true });
    paintBar();
  });


  /* ---- 3. the bars' size ---- */
  var INSETS = 'ow-app-insets';
  function insets(){
    if(typeof C.getPlatform === 'function' && C.getPlatform() !== 'android') return;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:var(--safe-t, 0px);padding-bottom:var(--safe-b, 0px);';
    document.body.appendChild(probe);
    var cs = getComputedStyle(probe), top = parseFloat(cs.paddingTop) || 0, bottom = parseFloat(cs.paddingBottom) || 0;
    probe.remove();
    var measured = root.style.getPropertyValue('--safe-area-inset-top') !== '';
    var last = {};
    try{ last = JSON.parse(localStorage.getItem(INSETS)) || {}; }catch(_e){}
    if(measured && top > 0){
      if(last.top !== top || last.bottom !== bottom){ try{ localStorage.setItem(INSETS, JSON.stringify({ top: top, bottom: bottom, ours: false })); }catch(_e){} }
      return;
    }
    // Measured at zero: Android has laid the page out below its bars itself.
    if(measured || top > 0) return;
    // Not measured, and the page fills the whole screen -- it is under the
    // bars with nothing telling it how tall they are.
    if(!last.top && Math.abs(screen.height - window.innerHeight) > 16) return;
    root.style.setProperty('--safe-area-inset-top', (last.top || 32) + 'px');
    root.style.setProperty('--safe-area-inset-bottom', (last.bottom || 32) + 'px');
  }

  /* ---- 4. staying current ---- */
  if(legacy || !(WebView && Http && FS && App && window.crypto && crypto.subtle)) return;
  var SOURCE = 'https://omni-ware.vercel.app/sales.html';
  var KEY = 'ow-sales-bundle';
  var EVERY = 30 * 60 * 1000;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(_e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_e){} }
  function header(h, name){
    var k = Object.keys(h || {}).filter(function(x){ return x.toLowerCase() === name; })[0];
    return k ? h[k] : '';
  }
  function sha256(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  // A file of the bundle running now, as base64 for the Filesystem plugin.
  function fileB64(name){
    return fetch(name, { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error(name + ': ' + r.status);
      return r.blob();
    }).then(function(blob){
      return new Promise(function(ok, fail){
        var fr = new FileReader();
        fr.onload = function(){ ok(String(fr.result).split(',')[1] || ''); };
        fr.onerror = fail;
        fr.readAsDataURL(blob);
      });
    });
  }
  function current(){ return fetch('bundle.json', { cache: 'no-store' }).then(function(r){ return r.json(); }); }

  // After a switch: make the new copy the one the app opens with, and drop
  // the copies nothing points at any more.
  function settle(){
    var s = load();
    if(!s.staged) return Promise.resolve();
    return WebView.getServerBasePath().then(function(cur){
      if(!cur || cur.path !== s.staged.path) return;
      return WebView.persistServerBasePath().then(function(){
        var keep = s.staged.dir;
        s.etag = s.staged.etag;
        delete s.staged;
        save(s);
        return FS.readdir({ path: 'live', directory: 'DATA' }).then(function(r){
          return Promise.all((r.files || []).map(function(f){
            var n = typeof f === 'string' ? f : f.name;
            return n === keep.split('/').pop() ? null : FS.rmdir({ path: 'live/' + n, directory: 'DATA', recursive: true }).catch(function(){});
          }));
        }).catch(function(){});
      });
    });
  }

  function check(){
    var s = load();
    if(s.staged || Date.now() - (s.checked || 0) < EVERY) return Promise.resolve();
    s.checked = Date.now();
    save(s);
    return Promise.all([current(), Http.request({ url: SOURCE, method: 'GET', responseType: 'text',
      headers: s.etag ? { 'If-None-Match': s.etag } : {} })]).then(function(pair){
      var mine = pair[0], res = pair[1];
      if(res.status !== 200) return;
      var html = typeof res.data === 'string' ? res.data : '';
      // Half a page is worse than an old page.
      if(html.length < 100000 || html.indexOf('</html>') === -1) return;
      var etag = header(res.headers, 'etag');
      return sha256(html).then(function(hash){
        if(hash === mine.source){ s.etag = etag; save(s); return; }
        var dir = 'live/' + hash.slice(0, 16);
        var rest = (mine.files || []).filter(function(f){ return f !== 'index.html' && f !== 'bundle.json'; });
        return FS.writeFile({ path: dir + '/index.html', data: window.owAppTransform(html), directory: 'DATA', encoding: 'utf8', recursive: true })
          .then(function(){
            return rest.reduce(function(p, f){
              return p.then(function(){ return fileB64(f); })
                .then(function(b64){ return FS.writeFile({ path: dir + '/' + f, data: b64, directory: 'DATA', recursive: true }); });
            }, Promise.resolve());
          })
          .then(function(){
            return FS.writeFile({ path: dir + '/bundle.json', data: JSON.stringify({ source: hash, files: mine.files }), directory: 'DATA', encoding: 'utf8', recursive: true });
          })
          .then(function(){ return FS.getUri({ path: dir, directory: 'DATA' }); })
          .then(function(u){
            var s2 = load();
            s2.staged = { dir: dir, path: decodeURI(String(u.uri).replace(/^file:\/\//, '')), etag: etag };
            save(s2);
          });
      });
    }).catch(function(){
      // No signal, or the server is down: the copy already here carries on.
    });
  }

  App.addListener('pause', function(){
    var s = load();
    if(s.staged) WebView.setServerBasePath({ path: s.staged.path }).catch(function(){});
  });
  App.addListener('resume', function(){ check(); });
  settle().catch(function(){}).then(function(){ setTimeout(check, 5000); });
})();
</script>

<!-- The faces load without holding the page up: on a dead connection the
     sheet never lands and the system stack carries on. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F7F5F2; --paper:#FFFFFF; --navy:#16203C; --navy2:#243052; --ink:#1C2233; --ink2:#5F6980; --ink3:#767F91;
  --line:#ECE8E1; --rule:#E6E3DD; --soft:#F4F2EE; --soft2:#EFECE6;
  --red:#C93A30; --mint:#6FDCB0; --amber:#F5B26B; --amberInk:#95530C; --amberSoft:#FDEEE1;
  --green:#0F6B43; --greenSoft:#E4F4EA; --crimson:#8E2A22; --crimsonSoft:#FBE5E2;
  --indigo:#3A3F9B; --indigoSoft:#E4E6FA; --sky:#1A5A8A; --skySoft:#DCEAF8; --plum:#7A3268; --plumSoft:#F6E4F1;
  --navyInk:#B3BCD2; --navyInk2:#8D99B5;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --safe-area-inset-top:env(safe-area-inset-top,0px); --safe-area-inset-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea{font-family:inherit;color:var(--ink)}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- shell ---- */
#sx_app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(96px + var(--safe-area-inset-bottom))}
.sx-view{animation:sxFade .25s ease-out}
@keyframes sxFade{from{opacity:.4}to{opacity:1}}
.sx-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#FFFFFF;box-shadow:0 -1px 0 var(--line),0 -10px 24px rgba(22,32,60,.05);padding:10px 0 calc(12px + var(--safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:start;max-width:520px;margin:0 auto}
.sx-nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink3);font-size:11px;font-weight:600;padding:0;position:relative}
.sx-nav button[aria-current="page"]{color:var(--navy);font-weight:700}
.sx-nav button[aria-current="page"] .icon{fill:var(--navy)}
.sx-nav .sx-plus{justify-self:center;margin-top:-30px;width:64px;height:64px;border-radius:999px;background:var(--red);color:#fff;box-shadow:0 0 0 5px var(--bg),0 10px 24px rgba(201,58,48,.35);justify-content:center}
.sx-nav .sx-plus .icon{width:28px;height:28px;stroke-width:2.6;fill:none!important}
.sx-badge{position:absolute;top:-4px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}

/* ---- navy hero ---- */
.sx-hero{background:radial-gradient(120% 90% at 18% 20%,#26335E 0%,#16203C 60%);color:#fff;border-radius:0 0 28px 28px;padding:calc(14px + var(--safe-area-inset-top)) 18px 20px;display:flex;flex-direction:column;gap:16px}
.sx-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--navyInk2)}
.sx-h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.sx-pagehead{padding:calc(14px + var(--safe-area-inset-top)) 16px 0;display:flex;align-items:center;gap:10px}
.sx-pagehead h1{flex:1;font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.sx-body{padding:14px 16px 0;display:flex;flex-direction:column;gap:12px}
.sx-glass{border-radius:16px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.sx-circle{width:40px;height:40px;border-radius:999px;border:none;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.sx-circle.light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}

/* ---- cards / rows ---- */
.sx-card{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(22,32,60,.05),inset 0 0 0 1px var(--line)}
.sx-card.pad{padding:14px}
.sx-list{padding:0 14px}
.sx-row{display:flex;align-items:center;gap:12px;min-height:60px;border:none;background:none;width:100%;text-align:left;padding:8px 0}
.sx-row + .sx-row{border-top:1px solid #F1EEE8}
.sx-av{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.sx-av.s{width:32px;height:32px;font-size:11px}
.sx-t{font-size:15px;font-weight:700}
.sx-sub{font-size:12px;color:var(--ink3)}
.sx-chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.sx-sec{display:flex;align-items:baseline;justify-content:space-between;padding:4px 4px 0}
.sx-sec b{font-size:14px;font-weight:700}
.sx-sec span{font-size:12px;font-weight:600;color:var(--ink3)}
.sx-empty{padding:28px 16px;text-align:center;color:var(--ink3);font-size:14px}
.sx-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---- buttons ---- */
.sx-btn{height:52px;border-radius:16px;border:none;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.sx-btn.red{background:var(--red);color:#fff;box-shadow:0 10px 22px rgba(201,58,48,.3)}
.sx-btn.navy{background:var(--navy);color:#fff}
.sx-btn.ghost{background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.sx-btn.green{background:var(--green);color:#fff}
.sx-btn[disabled]{opacity:.45;pointer-events:none}
.sx-pill{height:36px;padding:0 14px;border:none;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;flex:none}
.sx-pill[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:none;font-weight:700}
.sx-seg{display:flex;padding:3px;border-radius:999px;background:var(--soft2)}
.sx-seg button{height:34px;padding:0 14px;border:none;border-radius:999px;background:transparent;font-size:13px;font-weight:600;color:var(--ink2)}
.sx-seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(22,32,60,.1)}
.sx-seg.dark{background:rgba(255,255,255,.08)}
.sx-seg.dark button{color:var(--navyInk)}
.sx-seg.dark button[aria-pressed="true"]{background:#fff;color:var(--navy)}

/* ---- search ---- */
.sx-search{display:flex;align-items:center;gap:10px;height:52px;padding:0 10px 0 14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule)}
.sx-search:focus-within{box-shadow:0 0 0 2px var(--navy),0 6px 16px rgba(22,32,60,.08)}
.sx-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px;padding:0}

/* ---- paper slip ---- */
.sx-paper{filter:drop-shadow(0 1px 1px rgba(22,32,60,.08)) drop-shadow(0 6px 14px rgba(22,32,60,.08));margin:0 4px}
.sx-paper:before,.sx-paper:after{content:'';display:block;height:8px}
.sx-paper:before{background:linear-gradient(45deg,transparent 50%,#fff 50%) 0 0/12px 8px repeat-x,linear-gradient(-45deg,transparent 50%,#fff 50%) 0 0/12px 8px repeat-x}
.sx-paper:after{background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/12px 8px repeat-x,linear-gradient(-135deg,#fff 50%,transparent 50%) 0 0/12px 8px repeat-x}
.sx-paper-in{background:#fff;padding:6px 14px 4px}
.sx-paper-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.sx-paper-h .t{font-size:11px;font-weight:700;letter-spacing:.12em}
.sx-paper-f{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 0 8px;border-top:1.5px solid var(--ink)}
.sx-pl{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:9px 0}
.sx-pl + .sx-pl{border-top:1px dashed #E2DED6}
.sx-pl .q{font-family:var(--mono);font-size:13px;font-weight:600}
.sx-pl .q small{font-family:Figtree,sans-serif;font-size:12px;font-weight:600;color:#6B7480}
.sx-pl .n{font-size:14px;font-weight:600}
.sx-pl.struck .q,.sx-pl.struck .n{text-decoration:line-through;color:#8A93A3}
.sx-stamp{padding:6px 12px 5px;border:3px double currentColor;border-radius:10px;opacity:.88;display:inline-flex;flex-direction:column;align-items:center;gap:1px;transform:rotate(-9deg);animation:sxStamp .5s cubic-bezier(.3,1.4,.5,1) .3s both}
.sx-stamp b{font-size:20px;letter-spacing:.2em;line-height:1;padding-left:.2em}
.sx-stamp span{font-size:9px;font-weight:700;letter-spacing:.12em}
@keyframes sxStamp{0%{transform:rotate(-9deg) scale(1.8);opacity:0}60%{transform:rotate(-9deg) scale(.94);opacity:.95}100%{transform:rotate(-9deg) scale(1);opacity:.88}}

/* ---- order draft bands ---- */
.sx-band{display:flex;flex-direction:column;gap:8px;margin:0 -8px;padding:10px 8px;border-radius:12px;border:none;text-align:left;width:calc(100% + 16px);background:#fff}
.sx-band:nth-child(even){background:#FAF8F4}
.sx-band.open{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--navy)}
.sx-band.new{animation:sxNew 1.1s cubic-bezier(.2,.9,.3,1) both}
@keyframes sxNew{0%{opacity:0;transform:translateY(-14px) scale(.97);box-shadow:0 0 0 2px var(--green)}35%{opacity:1;transform:none;box-shadow:0 0 0 2px var(--green)}100%{box-shadow:0 0 0 2px rgba(15,107,67,0)}}
.sx-band .top{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px}
.sx-qb{height:44px;border-radius:10px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.sx-qb b{font-family:var(--mono);font-size:16px;font-weight:600}
.sx-qb small{font-size:10px;font-weight:600;color:var(--navyInk)}
.sx-ctl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.sx-step{display:flex;align-items:center;height:46px;border-radius:12px;background:var(--soft)}
.sx-step button{width:36px;height:46px;border:none;background:transparent;font-size:20px;color:var(--ink2)}
.sx-step input{width:46px;text-align:center;border:none;background:transparent;font-family:var(--mono);font-size:16px;font-weight:600;outline:none;padding:0}
.sx-del{width:46px;height:46px;border:none;border-radius:12px;background:var(--crimsonSoft);color:var(--crimson);display:flex;align-items:center;justify-content:center}

/* ---- bottom sheets ---- */
.sx-scrim{position:fixed;inset:0;z-index:60;background:rgba(10,14,28,.5);animation:sxScrim .25s ease-out}
@keyframes sxScrim{from{opacity:0}}
.sx-sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(22px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sxUp .35s cubic-bezier(.2,.9,.3,1)}
.sx-sheet.navy{background:var(--navy);color:#fff}
@keyframes sxUp{from{transform:translateY(100%)}}
.sx-handle{align-self:center;width:40px;height:5px;border-radius:999px;background:#D9D4CB;flex:none}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  if (!ms) return '';

  const h = Math.round(m / 60); if (h < 24) return h + 'h ago';
  const d = Math.round(h / 24); return d === 1 ? 'yesterday' : d + ' days ago';
}

function dayLabel(iso){ if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }
function initials(name){
  const w = String(name || '?').replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/).filter(Boolean);

/* ==================================================================
   Who is signed in, which shop, and the shop's books as the admin app
   reads them (index.html loadData) -- the same tables, the same
   mapping, so every figure here is the figure on the owner's screen.
   ================================================================== */
const S = {
  user: null, shopId: null, shopName: '', role: null,
  data: null, loadedAt: 0,
  view: 'today', stack: [], sheet: null,
  ordersStage: 'draft', custFilter: 'all', custArea: '', custQuery: '',
  draft: null,
};
window.SX = S;

async function selectAll(table, keyCol){
  keyCol = keyCol || 'id';
  let rows = [], total = null;
  for (;;) {
    let q = sb.from(table).select('*', total === null ? { count: 'exact' } : undefined).eq('shop_id', S.shopId);
    if (rows.length) q = q.gt(keyCol, rows[rows.length - 1][keyCol]);
    const r = await q.order(keyCol, { ascending: true }).limit(1000);
    if (r.error) throw r.error;
    if (total === null) total = (typeof r.count === 'number') ? r.count : null;
    const page = r.data || [];
    rows = rows.concat(page);
    if (!page.length || (total !== null && rows.length >= total)) break;
  }
  return rows;
}
function monthStartISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; }

async function loadAll(){
  const [suppliers, customers, debtLog, products, prices, stock, lots, quotes, links, settingsR, cashR, staff] = await Promise.all([
    selectAll('suppliers'), selectAll('customers'), selectAll('customer_debt_log'), selectAll('products'), selectAll('prices'),
    selectAll('stock', 'key'), selectAll('stock_lots'), selectAll('saved_quotes'), selectAll('product_links').catch(() => []),
    sb.from('app_settings').select('presets').eq('shop_id', S.shopId).maybeSingle(),
    sb.from('cash_txns').select('*').eq('shop_id', S.shopId).gte('date', monthStartISO()).order('id').limit(5000),
    selectAll('staff').catch(() => []),
  ]);
  const presets = (settingsR && settingsR.data && settingsR.data.presets) || {};
  const debtBy = {};
  debtLog.forEach(l => { (debtBy[l.customer_id] ||= []).push({ id: l.id, date: l.date, type: l.type, amount: Number(l.amount) || 0, note: l.note || '', cashTxnId: l.cash_txn_id == null ? null : Number(l.cash_txn_id), quoteId: l.quote_id == null ? null : Number(l.quote_id) }); });
  const stockMap = {}; stock.forEach(s => { stockMap[s.key] = Number(s.qty) || 0; });
  const lotMap = {}; lots.forEach(l => { const lot = { qty: Number(l.qty) || 0, cost: l.cost == null ? null : Number(l.cost) }; (lotMap[l.key] ||= []).push(lot); });
  S.data = {
    suppliers: suppliers.map(s => ({ id: s.id, name: s.name })),
    staff: staff.map(s => ({ id: s.id, name: s.name, userId: s.user_id || null, role: s.role })),
    customers: customers.map(c => ({ id: c.id, name: c.name || '', phone: c.phone || '', phone2: c.phone2 || '', location: c.location || '', notes: c.notes || '', debt: Number(c.debt) || 0, termsDays: c.terms_days ?? null, creditLimit: c.credit_limit ?? null, debtLog: debtBy[c.id] || [] })),
    products: products.map(p => ({ id: p.id, name: p.name || '', type: p.type || 'simple', category: p.category || '', subcategory: p.subcategory || '', image: p.image || null,
      wholesaleMarkupType: p.wholesale_markup_type, wholesaleMarkupValue: Number(p.wholesale_markup_value) || 0,
      retailMarkupType: p.retail_markup_type, retailMarkupValue: Number(p.retail_markup_value) || 0,
      stockWholesaleMarkupType: p.stock_wholesale_markup_type || 'percent', stockWholesaleMarkupValue: Number(p.stock_wholesale_markup_value) || 0,
      stockRetailMarkupType: p.stock_retail_markup_type || 'percent', stockRetailMarkupValue: Number(p.stock_retail_markup_value) || 0,
      variantAttributes: p.variant_attributes || [], variants: p.variants || [] })),
    prices: prices.map(pr => ({ id: pr.id, productId: pr.product_id, variantIdx: pr.variant_idx == null || pr.variant_idx === '' ? null : Number(pr.variant_idx),
      supplierId: pr.supplier_id, wholesale: pr.wholesale == null ? null : Number(pr.wholesale), retail: pr.retail == null ? null : Number(pr.retail),
      unit: pr.unit || '', packUnit: pr.pack_unit || '', packQty: Number(pr.pack_qty) || 0, outOfStock: !!pr.out_of_stock, tiers: Array.isArray(pr.tiers) ? pr.tiers : [] })),
    stock: stockMap, stockLots: lotMap,
    savedQuotes: quotes.map(rowToQuote),
    productLinks: (links || []).map(r => ({ id: r.id, fromId: r.from_id, verb: r.verb, toId: r.to_id, toVariantIdx: r.to_variant_idx == null ? null : Number(r.to_variant_idx), fromVariantIdx: r.from_variant_idx == null ? null : Number(r.from_variant_idx), qty: r.qty == null ? null : Number(r.qty), per: r.per || '', active: r.active !== false })),
    cashTxns: ((cashR && cashR.data) || []).map(t => ({ id: t.id, date: t.date, account: t.account, type: t.type, category: t.category, amount: Number(t.amount) || 0, description: t.description || '', time: t.time || '', quoteId: t.quote_id == null ? null : Number(t.quote_id), enteredBy: t.entered_by || null })),
    presetCreditPct: presets.creditPct != null ? Number(presets.creditPct) : 0,
    presetDefaultMarkup: presets.defaultMarkup || {},
    presetChaseAfterDays: presets.chaseAfterDays != null ? Number(presets.chaseAfterDays) : 7,
    presetCategories: presets.categories || [],
  };
  S.loadedAt = Date.now();
  saveSnapshot();
}
// index.html 45290: the payload is spread over these defaults.
function rowToQuote(q){
  return { id: q.id, status: q.status || 'draft', invoiced: !!q.invoiced, invoicedAt: q.invoiced_at, invoicedTs: q.invoiced_ts ? new Date(q.invoiced_ts).getTime() : null,
    amountPaid: Number(q.amount_paid) || 0, voided: !!q.voided, date: q.date,
    client: { name: '', phone: '' }, items: [], savedAt: null, payments: [], customerId: null, debtCharged: 0, charges: [], credit: null,
    ...(q.payload || {}) };
}
async function refreshQuotes(){
  try { const rows = await selectAll('saved_quotes'); S.data.savedQuotes = rows.map(rowToQuote); S.loadedAt = Date.now(); saveSnapshot(); render(); }
  catch (e) { if (!isNetworkError(e)) console.warn(e); }
}

/* An offline start: the last books this login saw, so a phone that wakes
   on no signal still opens on Today. Never another login's. */
function snapKey(){ return 'ow-sales-snap:' + (S.user && S.user.id); }
function saveSnapshot(){ try { localStorage.setItem(snapKey(), JSON.stringify({ shopId: S.shopId, shopName: S.shopName, role: S.role, at: S.loadedAt, data: S.data })); } catch (_e) {} }
function loadSnapshot(userId){ try { const s = JSON.parse(localStorage.getItem('ow-sales-snap:' + userId)); return s && s.data ? s : null; } catch (_e) { return null; } }

/* ---------------- ids, issued by the server (0034 / 0032) ---------------- */
async function issueRowId(kind, localMax){
  const floors = {}; floors[kind] = localMax;
  const { data, error } = await sb.rpc('next_row_id_blocks', { p_shop_id: S.shopId, p_kinds: [kind], p_count: 1, p_floors: floors });
  if (error) throw error;
  const v = data && data[kind];
  if (v == null) throw new Error('No id came back for ' + kind);
  return Number(v);
}
async function issueCustomerId(){
  const nums = S.data.customers.map(c => Number(String(c.id).replace(/[^0-9]/g, '')) || 0);
  const floor = nums.length ? Math.max(...nums) : 0;
  const { data, error } = await sb.rpc('next_entity_id', { p_shop_id: S.shopId, p_kind: 'customer', p_prefix: 'C', p_pad: 3, p_floor: floor });
  if (error) throw error;
  return String(data);
}

/* ==================================================================
   The shop's rules, carried over from index.html line for line where a
   figure depends on them -- a price here must be the price the owner's
   screen would give. Each function names its original.
   ================================================================== */
const D = () => S.data;
const cmpUnitKey = s => String(s || '').trim().toLowerCase();
function productById(id){ return D().products.find(p => p.id === id) || null; }
function supplierName(id){ if (id === '__stock__') return 'Our stock'; const s = D().suppliers.find(x => x.id === id); return s ? s.name : ''; }
function variantLabel(combo){ return Object.values(combo || {}).join(' / '); }
function productVariantLabel(p, vi){ if (vi == null || vi === '' || !p.variants) return p.name; const v = p.variants[vi]; return v ? `${p.name} — ${variantLabel(v.combo)}` : p.name; }
function stockKey(pid, vi){ return (vi == null || vi === '') ? pid : `${pid}::${vi}`; }
function getStockQty(pid, vi){ return Number(D().stock[stockKey(pid, vi)]) || 0; }

// index.html 55428

// 60097 / 60119

// 59846: a line's selling price, each, in its base unit.
function quoteItemSellPrice(it){
  if (it.sellPrice != null && it.sellPrice !== '') return Number(it.sellPrice) || 0;
  const buy = Number(it.price) || 0;
  const product = productById(it.productId);

// 112191: the shelf's one unit and pack.
function stockUnitFor(pid, vi){
  const rows = productPriceRows(pid, vi == null || vi === '' ? null : Number(vi));
  const packs = r => Number(r.packQty) > 0 && !!r.packUnit && cmpUnitKey(r.packUnit) !== cmpUnitKey(r.unit);
  const packed = rows.filter(r => !r.outOfStock).find(packs) || rows.find(packs) || null;
  const unit = String((packed ? packed.unit : (rows.find(r => r.unit) || {}).unit) || '').trim();
  const packQty = packed ? Number(packed.packQty) : 0, packUnit = packed ? String(packed.packUnit).trim() : '';

/* A line, sourced the way the quote rail and startQuoteForCustomer do
   (index.html 62516-62528, 90729-90740): off the shelf when the shelf
   covers the quantity, else from the supplier cheapest at that quantity.
   Same fields as the item picker's Add (61779). */
function makeLine(pid, vi, qty, opts){
  opts = opts || {};
  const p = productById(pid); if (!p) return null;
  vi = vi == null || vi === '' ? null : Number(vi);
  qty = Math.max(0, Number(qty) || 0);
  const shelf = getStockQty(pid, vi), stockCost = getFIFOUnitCost(pid, vi);
  const ranked = rankedPurchaseRowsAtQty(pid, vi, qty || 1);
  const best = ranked[0] || null;
  const fromShelf = shelf >= qty && shelf > 0;
  const supplierId = fromShelf ? '__stock__' : (best ? best.supplierId : (shelf > 0 ? '__stock__' : ''));
  const refRow = best;
  let price = 0;
  if (supplierId === '__stock__' && stockCost != null) price = Math.round(stockCost);
  else if (refRow) price = Math.round(purchasePriceAtQty(refRow, qty || 1) || 0);
  const su = stockUnitFor(pid, vi);
  const it = { lineId: opts.lineId || 1, productId: pid, variantIdx: vi, productName: productVariantLabel(p, vi),
    unit: (refRow && refRow.unit) || su.unit || '', packUnit: refRow ? (refRow.packUnit || '') : (su.packUnit || ''), packQty: refRow ? (refRow.packQty || 0) : (su.packQty || ''),
    qtyIn: opts.qtyIn || 'unit', qty, supplierId, supplierName: supplierName(supplierId), price, sellPrice: null };
  if (price > 0 && lineHasRule(it)) it.sellPrice = Math.round(quoteItemSellPrice(it));
  return it;
}

/* ---- totals: savedQuoteGoodsTotal 63537 ... savedQuoteTotal 63768 ---- */
function goodsTotal(q){ return (q.items || []).reduce((s, it) => s + (Number(it.qty) || 0) * quoteItemSellPrice(it), 0); }
/* What the salesperson can quote today: lines still to be priced are left
   out and counted, never shown at cost. */
function pricedView(q){ const open = (q.items || []).filter(linePriceToConfirm); const known = { ...q, items: (q.items || []).filter(it => !linePriceToConfirm(it)) }; return { total: quoteTotal(known), cash: cashTotal(known), credit: creditCharge(known), toConfirm: open.length }; }

function chargesTotal(q){ const g = goodsTotal(q); return (q.charges || []).reduce((s, ch) => s + chargeAmount(ch, g), 0); }
function cashTotal(q){ const gross = goodsTotal(q) + chargesTotal(q); return gross - Math.min(Math.max(0, Number(q.discount) || 0), gross); }
function creditTerms(q){ const c = q && q.credit; if (!c || !(Number(c.pct) > 0)) return null; return { pct: Number(c.pct), days: Math.max(0, Number(c.days) || 0) }; }
function creditCharge(q){ const t = creditTerms(q); return t ? Math.round(cashTotal(q) * t.pct / 100) : 0; }
function quoteTotal(q){ const credited = (q.creditNotes || []).reduce((s, cn) => s + (cn && !cn.voided ? Number(cn.amount) || 0 : 0), 0); return cashTotal(q) + creditCharge(q) - credited; }

function invoiceLabel(q){ return 'INV-' + String(q.id).padStart(4, '0'); }
function orderNo(q){ return '#' + String(q.id).padStart(4, '0'); }

/* ---- stages ---- */
const STAGES = [

  { key: 'awaiting_goods', label: 'Buying', short: 'Buying', col: '#3A3F9B' },

function stageOf(q){ return STAGES.find(s => s.key === q.status) || STAGES[0]; }
function stageIdx(q){ return Math.max(0, STAGES.findIndex(s => s.key === q.status)); }
function liveOrders(){ return D().savedQuotes.filter(q => !q.voided && !q.cancelledAt); }

// 64254 / 64282 / 64295: a supplier's yes counts only for the terms it was given.
function orderLineIsBoughtIn(it){ return !!(it && it.supplierId && it.supplierId !== '__stock__'); }
function supplierGroups(q){ const by = {}, order = []; (q.items || []).forEach(it => { const sid = it && it.supplierId; if (!sid || sid === '__stock__') return; const k = String(sid); if (!by[k]) { by[k] = { supplierId: sid, lines: [] }; order.push(k); } by[k].lines.push(it); }); return order.map(k => by[k]); }
function supplierTerms(q, sid){ const g = supplierGroups(q).find(x => String(x.supplierId) === String(sid)); return (g ? g.lines : []).map(it => [it.productId, it.variantIdx == null ? '' : it.variantIdx, Number(it.qty) || 0, Math.round(Number(it.price) || 0)].join(':')).join('|'); }

/* One line's state for the salesperson, in their words. */
function lineState(q, it){
  if (!it.supplierId) return { k: 'wait', word: 'waiting for a supplier', col: '#8A93A3' };
  if (it.supplierId === '__stock__') return { k: 'ok', word: 'on the shelf', col: '#767F91' };

    const c = confirmState(q, it.supplierId);

/* ---- customers ---- */
function customerById(id){ return D().customers.find(c => String(c.id) === String(id)) || null; }
// 65287
function customerOrdersFor(cid){
  const c = customerById(cid), name = c ? String(c.name || '').trim().toLowerCase() : '';

  return D().savedQuotes.filter(q => {
    if (q.voided) return false;

}
// 65468
function outstandingInvoices(cid){ return customerOrdersFor(cid).filter(q => q.invoiced && !q.voided && balanceDue(q) > 0).sort((a, b) => String(a.invoicedAt || a.date || '').localeCompare(String(b.invoicedAt || b.date || ''))); }
// 90541 / 90667
function orderHistory(cid){ return customerOrdersFor(cid).filter(q => q.invoiced && !q.voided).map(q => ({ q, date: q.invoicedAt || q.date || '' })).filter(o => o.date).sort((a, b) => a.date.localeCompare(b.date) || ((a.q.id || 0) - (b.q.id || 0))); }
function usualLines(cid){
  const hist = orderHistory(cid); if (!hist.length) return [];
  const key = it => `${it.productId}|${it.variantIdx == null ? '' : it.variantIdx}`;
  const seen = new Map();
  hist.forEach((o, i) => { const here = new Set(); (o.q.items || []).forEach(it => { if (!it.productId) return; const k = key(it); const e = seen.get(k) || { productId: it.productId, variantIdx: it.variantIdx == null ? null : it.variantIdx, name: it.productName || '', orders: 0, qtys: [], lastAt: -1 }; if (!here.has(k)) { e.orders++; here.add(k); } e.qtys.push(Number(it.qty) || 0); if (i >= e.lastAt) e.lastAt = i; seen.set(k, e); }); });

  const every = dates.length > 1 ? Math.max(1, Math.round(daysBetween(first, last) / (dates.length - 1))) : null;

  return { every, since, last, orders: dates.length, due: every != null && since != null && since >= every, overdue: every != null && since != null && since > every * 2 };

/* ---- what goes with what (93288 / 93432 / 93669) ---- */
const PAIR_REVERSE = { needs: 'with', with: 'with', instead: 'instead', part: 'part' };
const PAIR_WORD = { needs: 'needs', with: 'goes with', part: 'same job' };
function goesWith(pid, vi, lineQty){
  const live = D().productLinks.filter(l => l.active !== false && l.verb !== 'after' && l.verb !== 'instead');
  const fits = l => l.fromVariantIdx == null || l.fromVariantIdx === vi;
  const mine = live.filter(l => l.fromId === pid).filter(fits);
  const said = new Set(mine.map(l => l.verb + ' ' + l.toId));
  live.filter(l => l.toId === pid && l.fromId !== pid).forEach(l => {
    const rev = PAIR_REVERSE[l.verb]; if (!rev) return;
    const r = { verb: rev, fromId: pid, fromVariantIdx: l.toVariantIdx, toId: l.fromId, toVariantIdx: l.fromVariantIdx, qty: null, per: '' };
    if (fits(r) && !said.has(r.verb + ' ' + r.toId)) mine.push(r);
  });
  return mine.filter(l => productById(l.toId)).map(l => ({ toId: l.toId, toVariantIdx: l.toVariantIdx, verb: l.verb, per: l.per,
    qty: (l.qty && lineQty > 0) ? Math.max(1, Math.round(l.qty * lineQty)) : null, rate: l.qty }));
}

    const snap = sid ? loadSnapshot(sid) : null;
    if (isNetworkError(ue) && snap) {
      S.user = sess.session.user; Object.assign(S, { shopId: snap.shopId, shopName: snap.shopName, role: snap.role, data: snap.data, loadedAt: snap.at });
      hideAuth(); start(); toast('Offline — showing what you last saw'); return;
    }
    await authScreen();
    ({ data: u } = await sb.auth.getUser()); user = u && u.user;
    if (!user) return;
  } else if (initialLinkType === 'invite' || initialLinkType === 'recovery') {
    await setPasswordScreen();
  }
  S.user = user;
  const { data: ms, error } = await sb.from('shop_members').select('shop_id, role, shops(name)').eq('user_id', user.id);
  if (error) {
    const snap = loadSnapshot(user.id);
    if (isNetworkError(error) && snap) { Object.assign(S, { shopId: snap.shopId, shopName: snap.shopName, role: snap.role, data: snap.data, loadedAt: snap.at }); hideAuth(); start(); toast('Offline — showing what you last saw'); return; }
    toast('Could not reach the shop: ' + error.message, 6000); return;
  }
  const rows = ms || [];
  // A sales membership first; an owner or admin may open the desk too.
  const pick = rows.find(m => m.role === 'sales') || rows.find(m => ['owner', 'admin', 'manager'].includes(m.role));
  if (!pick) { authScreen('denied'); return; }
  S.shopId = pick.shop_id; S.role = pick.role; S.shopName = (pick.shops && pick.shops.name) || 'The shop';
  hideAuth();
  const snap = loadSnapshot(user.id);
  if (snap && snap.shopId === S.shopId) { S.data = snap.data; S.loadedAt = snap.at; start(); }
  else document.getElementById('sx_main').innerHTML = `<div class="sx-empty" style="padding-top:40vh"><b>Opening the books…</b>${esc(S.shopName)}</div>`;
  try { await loadAll(); if (!S.started) start(); else render(); }
  catch (e) { if (S.data) toast(isNetworkError(e) ? 'Offline — showing what you last saw' : 'Could not refresh: ' + e.message, 5000); else document.getElementById('sx_main').innerHTML = `<div class="sx-empty" style="padding-top:35vh"><b>Could not open the books</b>${esc(e.message || e)}<br><br><button class="sx-btn navy" onclick="location.reload()">Try again</button></div>`; }
}
function start(){

/* ---------------- navigation ---------------- */
function go(view){ S.view = view; S.stack = []; closeSheet(true); render(); window.scrollTo(0, 0); }
function push(type, args){ S.stack.push({ type, args: args || {} }); render(); const p = document.querySelector('.sx-page:last-of-type'); if (p) p.scrollTop = 0; }
function pop(){ S.stack.pop(); render(); }
window.sxBack = function(){
  if (S.sheet) { closeSheet(); return true; }
  if (S.stack.length) { pop(); return true; }
  if (S.view !== 'today') { go('today'); return true; }
  return false;
};
function openSheet(type, args){ S.sheet = { type, args: args || {} }; renderSheet(); }
function closeSheet(silent){ S.sheet = null; if (!silent) renderSheet(); }

function navHTML(){

}
function render(){
  if (!S.data) return;

  main.innerHTML = `<div class="sx-view">${V()}</div>${navHTML()}`;

    return `<div class="sx-page${same ? ' still' : ''}" data-depth="${i}" data-type="${p.type}"${f && f.bg ? ` style="background:${f.bg}"` : ''}>${f ? f(p.args) : ''}</div>`; }).join('');
  [...pages.children].forEach((el, i) => { if (prev[i] && prev[i].type === el.dataset.type) el.scrollTop = prev[i].top; });

function renderSheet(){

const PAGE = {}, SHEET = {}, ACT = {}, AFTER = [];
function afterRender(){ AFTER.forEach(f => { try { f(); } catch (e) { console.warn(e); } }); bindSliders(); }

document.addEventListener('click', e => {

});

/* ---------------- the slide-to-do-it control ---------------- */
function sliderHTML(id, label, opts){
  opts = opts || {};
  const k = opts.money ? ic('cash', 24, 'style="stroke:#16203C"') : ic('chev', 20, 'style="stroke:#fff;stroke-width:2.4"');
  return `<div class="sx-slide ${opts.money ? 'money' : ''}" data-slide="${id}" ${opts.disabled ? 'aria-disabled="true"' : ''} role="button" aria-label="${esc(label)}" tabindex="0"><span class="k">${k}</span><span class="l">${esc(label)}</span></div>`;
}
function bindSliders(){
  document.querySelectorAll('[data-slide]').forEach(el => {
    if (el._bound) return; el._bound = true;
    const k = el.querySelector('.k'); let sx = 0, dx = 0, drag = false;
    const max = () => el.clientWidth - k.clientWidth - 8;
    const done = () => { if (el.getAttribute('aria-disabled') === 'true') return; haptic('success'); const f = ACT['slide:' + el.dataset.slide]; if (f) f(el); };
    el.addEventListener('pointerdown', e => { if (el.getAttribute('aria-disabled') === 'true') return; drag = true; sx = e.clientX; dx = 0; k.style.transition = 'none'; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e => { if (!drag) return; dx = Math.max(0, Math.min(max(), e.clientX - sx)); k.style.transform = `translateX(${dx}px)`; });
    const end = () => { if (!drag) return; drag = false; k.style.transition = ''; if (dx >= max() * 0.82) { k.style.transform = `translateX(${max()}px)`; setTimeout(done, 120); } else k.style.transform = ''; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); done(); } });
  });
}

/* ---------------- Orders ---------------- */
function viewOrders(){
  const live = liveOrders(), today = todayISO();
  const by = k => k === 'completed' ? live.filter(q => q.status === 'completed' && isoOf(stageEnteredMs(q)) === today) : live.filter(q => q.status === k);
  const moving = live.filter(q => q.status !== 'completed');
  const sel = S.ordersStage;
  const tiles = STAGES.map(s => { const on = s.key === sel, n = by(s.key).length;
    return `<button data-act="stage" data-k="${s.key}" aria-pressed="${on}" style="border:none;height:66px;border-radius:16px;${on ? 'background:var(--navy);color:#fff;box-shadow:0 8px 18px rgba(22,32,60,.22)' : 'background:#fff;box-shadow:inset 0 0 0 1px var(--rule)'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0"><span class="m" style="font-size:19px;font-weight:600">${n}</span><span style="font-size:11px;font-weight:700;${on ? '' : 'color:var(--ink2)'}">${s.key === 'completed' ? 'Done today' : s.short}</span><span style="width:18px;height:3px;border-radius:9px;background:${s.col}"></span></button>`; }).join('');
  const list = by(sel).sort((a, b) => stageEnteredMs(a) - stageEnteredMs(b));
  let body = '';
  if (!list.length) body = `<div class="sx-card sx-empty"><b>Nothing ${sel === 'completed' ? 'delivered today yet' : 'here right now'}</b>${sel === 'draft' ? 'New orders wait here while the shop checks suppliers.' : ''}</div>`;
  else if (sel === 'draft') {
    const groups = [['Tell them', '#8E2A22', list.filter(q => orderLineStates(q).some(s => s.k === 'no'))],
      ['Still checking', '#F5B26B', list.filter(q => { const st = orderLineStates(q); return !st.some(s => s.k === 'no') && st.some(s => s.k !== 'ok'); })],
      ['All found', '#0F6B43', list.filter(q => orderLineStates(q).every(s => s.k === 'ok'))]];
    body = groups.filter(g => g[2].length).map(g => `<div class="sx-sec" style="justify-content:flex-start;gap:8px"><i style="width:8px;height:8px;border-radius:9px;background:${g[1]}"></i><b>${g[0]}</b><span class="m">${g[2].length}</span></div>
      <div class="sx-card sx-list">${g[2].map(orderRow).join('')}</div>`).join('');
  } else body = `<div class="sx-card sx-list">${list.map(orderRow).join('')}</div>`;
  const total = moving.reduce((s, q) => s + pricedView(q).total, 0);

  <div class="sx-body"><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px">${tiles}</div>${body}</div>`;

function orderRow(q){

  const pv = pricedView(q);
  let msg = `Hello ${name}, about your order ${orderNo(q)} from ${S.shopName}: `;
  if (q.status === 'pending_delivery') msg += 'it is on the way to you now.';
  else if (q.status === 'completed') msg += 'it has been delivered. Thank you!';
  else if (q.status === 'preparing') msg += 'everything is in and we are packing it.';

/* ==================================================================
   Customers, and one customer: what they owe, how often they come back,
   what they usually take. Every figure is derived from their orders and
   invoices, the way the owner's Customers tab derives it.

function custTerms(c){ return c.termsDays != null ? Number(c.termsDays) : D().presetChaseAfterDays; }
function custOldestAge(c){ const inv = outstandingInvoices(c.id); return inv.length ? daysBetween(inv[0].invoicedAt || inv[0].date, todayISO()) : 0; }
function custOverdue(c){ return c.debt > 0 && custOldestAge(c) > custTerms(c); }
function custMatches(c, q){
  if (!q) return true;
  const hay = (c.name + ' ' + c.phone + ' ' + c.phone2 + ' ' + c.location).toLowerCase();
  const phones = [c.phone, c.phone2].filter(Boolean).map(phoneDigits);
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w) || (/^[0-9+]{4,}$/.test(w) && phones.some(p => p.includes(phoneDigits(w)))));
}

    <label class="sx-search">${ic('search', 20, 'style="stroke:#767F91"')}<input data-in="custq" type="search" placeholder="Name, phone or area" value="${esc(S.custQuery)}" autocomplete="off"></label>
    <div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none">${pill('all', 'All', all.length)}${pill('owe', 'Owe', owe.length)}${pill('due', 'Due back', due.length)}</div>
    <div id="sx_custlist" style="display:flex;flex-direction:column;gap:12px">${custListHTML()}</div>
  </div>`;
}
function custListHTML(){
  let list = D().customers.filter(c => custMatches(c, S.custQuery));
  if (S.custFilter === 'owe') list = list.filter(c => c.debt > 0).sort((a, b) => b.debt - a.debt);
  else if (S.custFilter === 'due') list = list.filter(c => customerRhythm(c.id).due);
  if (!list.length) return `<div class="sx-card sx-empty"><b>${S.custQuery ? 'Nobody by that name' : 'Nobody here'}</b>${S.custQuery ? `<button class="sx-btn navy" data-act="addcust" style="margin:12px auto 0">${ic('plus', 18)}Add “${esc(S.custQuery)}”</button>` : ''}</div>`;
  if (S.custFilter === 'owe') return `<div class="sx-card sx-list">${list.map(custRow).join('')}</div>`;
  const by = {}; list.forEach(c => { const a = (c.location || '').trim() || 'No area'; (by[a] ||= []).push(c); });
  const areas = Object.keys(by).sort((a, b) => a === 'No area' ? 1 : b === 'No area' ? -1 : a.localeCompare(b));
  const cap = 60; let shown = 0, cut = 0;
  const html = areas.map(a => { const rows = by[a].sort((x, y) => x.name.localeCompare(y.name)); const take = rows.slice(0, Math.max(0, cap - shown)); shown += take.length; cut += rows.length - take.length;
    return take.length ? `<div style="display:flex;flex-direction:column;gap:6px"><div class="sx-sec" style="justify-content:flex-start;gap:6px"><span style="color:var(--ink3);display:flex">${ic('pin', 14)}</span><b>${esc(a)}</b><span class="m">${rows.length}</span></div><div class="sx-card sx-list">${take.map(custRow).join('')}</div></div>` : ''; }).join('');
  return html + (cut ? `<div class="sx-empty" style="padding:8px">${cut} more — search to find them</div>` : '');
}
function custRow(c){
  const r = customerRhythm(c.id), late = custOverdue(c);
  const sub = r.every ? `every ${r.every} days · last ${r.since === 0 ? 'today' : r.since + 'd ago'}` : r.orders ? `last bought ${dayLabel(r.last)}` : (c.phone || 'no orders yet');
  const dot = r.overdue ? 'var(--crimson)' : r.due ? 'var(--amber)' : r.every ? 'var(--green)' : '#D9D4CB';
  return `<button class="sx-row" data-act="customer" data-id="${esc(c.id)}">${avatar(c.name)}
    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span class="ell" style="font-size:15px;font-weight:700">${esc(c.name)}</span><span class="ell sx-sub" style="display:flex;align-items:center;gap:6px"><i style="width:7px;height:7px;border-radius:9px;background:${dot};flex:none"></i>${esc(sub)}</span></span>
    ${c.debt > 0 ? `<span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="m" style="font-size:14px;font-weight:600;${late ? 'color:var(--crimson)' : ''}">${n0(c.debt)}</span><span style="font-size:10px;font-weight:700;letter-spacing:.06em;color:${late ? 'var(--crimson)' : 'var(--ink3)'}">${late ? 'LATE' : 'OWES'}</span></span>` : ''}</button>`;
}
ACT.custfilter = t => { S.custFilter = S.custFilter === t.dataset.k && t.dataset.k !== 'all' ? 'all' : t.dataset.k; if (S.view !== 'customers') go('customers'); else render(); };
ACT['in:custq'] = t => { S.custQuery = t.value; const el = document.getElementById('sx_custlist'); if (el) el.innerHTML = custListHTML(); };

/* ---------------- One customer ---------------- */
PAGE.customer = ({ id }) => {
  const c = customerById(id);
  if (!c) return `<div class="sx-empty" style="padding-top:30vh"><b>That customer is not here any more</b><button class="sx-btn navy" data-act="back" style="margin:16px auto 0">Back</button></div>`;
  const r = customerRhythm(c.id), inv = outstandingInvoices(c.id), usual = usualLines(c.id);
  const live = customerOrdersFor(c.id).filter(q => !q.invoiced && q.status !== 'completed' && !q.cancelledAt);
  const late = custOverdue(c), terms = custTerms(c);
  const ringPct = r.every ? Math.min(1, r.since / r.every) : 0;
  const ringCol = r.overdue ? '#F59A92' : r.due ? '#F5B26B' : '#6FDCB0';
  const rhythm = r.every
    ? ring(ringPct, 84, 7, ringCol, `<span class="m" style="font-size:20px;font-weight:600">${r.since}</span><span style="font-size:10px;font-weight:600;color:var(--navyInk2)">of ${r.every} days</span>`)
    : ring(0, 84, 7, ringCol, `<span class="m" style="font-size:20px;font-weight:600">${r.orders}</span><span style="font-size:10px;font-weight:600;color:var(--navyInk2)">order${r.orders === 1 ? '' : 's'}</span>`);
  const rhythmWord = r.every ? (r.overdue ? 'Gone quiet' : r.due ? 'Due back now' : 'On rhythm') : r.orders ? 'One order so far' : 'New customer';
  const rhythmSub = r.every ? `buys every ${r.every} days · last ${dayLabel(r.last)}` : r.orders ? `bought ${dayLabel(r.last)}` : 'no invoiced orders yet';
  const ph = c.phone || c.phone2;
  const limit = Number(c.creditLimit) || 0;
  const invTotal = inv.reduce((s, q) => s + balanceDue(q), 0);
  const billRow = q => { const age = daysBetween(q.invoicedAt || q.date, todayISO()), over = age > terms;
    return `<div class="sx-pl" style="grid-template-columns:auto 1fr auto"><span class="m" style="font-size:12px;font-weight:600;color:var(--ink2)">${invoiceLabel(q)}</span>
      <span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:12px;font-weight:600;color:${over ? 'var(--crimson)' : 'var(--ink3)'}">${dayLabel(isoOf(q.invoicedAt || q.date))} · ${age} day${age === 1 ? '' : 's'}</span><span style="height:4px;border-radius:9px;background:var(--soft2);overflow:hidden;display:block"><span class="sx-grow" style="display:block;height:100%;width:${Math.min(100, Math.round(age / Math.max(1, terms) * 100))}%;background:${over ? 'var(--crimson)' : 'var(--amber)'}"></span></span></span>
      <span class="m" style="font-size:14px;font-weight:600">${n0(balanceDue(q))}</span></div>`; };
  return `<div class="sx-hero" data-navy-top style="border-radius:0 0 26px 26px">
    <div style="display:flex;align-items:center;gap:12px"><button class="sx-circle" data-act="back" aria-label="Back">${ic('back', 18)}</button>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="ell" style="font-size:18px;font-weight:700">${esc(c.name)}</span><span class="ell" style="font-size:12px;color:var(--navyInk);display:flex;align-items:center;gap:4px">${c.location ? ic('pin', 12) + esc(c.location) + ' · ' : ''}${esc(c.phone || 'no phone')}</span></span>
      ${ph ? `<a class="sx-circle" href="tel:${esc(ph)}" aria-label="Call">${ic('phone', 17)}</a><a class="sx-circle" href="https://wa.me/${phoneDigits(ph)}" target="_blank" aria-label="WhatsApp">${ic('chat', 17)}</a>` : ''}</div>
    <div style="display:flex;align-items:center;gap:16px">${rhythm}
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:20px;font-weight:700;color:${ringCol}">${rhythmWord}</span><span style="font-size:12px;font-weight:600;color:var(--navyInk)">${esc(rhythmSub)}</span>
      ${live.length ? `<button data-act="order" data-id="${live[0].id}" style="align-self:flex-start;border:none;margin-top:4px;height:28px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px">${ic('orders', 13)}${live.length} order${live.length > 1 ? 's' : ''} on the move</button>` : ''}</span></div>
  </div>
  <div class="sx-body">
    <div class="sx-card pad" style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:12px;font-weight:700;color:var(--ink3)">${c.debt > 0 ? 'Owes the shop' : 'Owes nothing'}</span><span class="m" style="font-size:24px;font-weight:600;${late ? 'color:var(--crimson)' : c.debt > 0 ? '' : 'color:var(--green)'}">${n0(c.debt)}</span></div>
      ${limit > 0 ? `<span style="display:flex;flex-direction:column;gap:5px"><span style="height:8px;border-radius:999px;background:var(--soft2);overflow:hidden;display:block"><span class="sx-grow" style="display:block;height:100%;width:${Math.min(100, Math.round(c.debt / limit * 100))}%;background:${c.debt > limit ? 'var(--crimson)' : c.debt > limit * 0.8 ? 'var(--amber)' : 'var(--green)'}"></span></span><span style="display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--ink3)"><span>credit used</span><span>limit <b class="m">${n0(limit)}</b></span></span></span>` : ''}
      ${inv.length ? `<div style="display:flex;flex-direction:column">${inv.map(billRow).join('')}</div>` : ''}
      ${c.debt > invTotal && inv.length ? `<span class="sx-sub">+ ${n0(c.debt - invTotal)} not tied to a bill</span>` : ''}
      ${late ? `<span style="font-size:12px;font-weight:700;color:var(--crimson)">Past the ${terms}-day terms</span>` : ''}
    </div>
    ${usual.length ? `<div class="sx-paper"><div class="sx-paper-in"><div class="sx-paper-h"><span class="t">USUALLY TAKES</span><span style="font-size:12px;font-weight:600;color:var(--ink3)">from ${r.orders} order${r.orders === 1 ? '' : 's'}</span></div>
      ${usual.slice(0, 8).map(u => `<div class="sx-pl"><span class="q">${n0(u.qty)}</span><span class="n ell">${esc(u.name)}</span><span style="display:flex;gap:2px">${Array.from({ length: Math.min(u.of, 8) }, (_, i) => `<i style="width:6px;height:6px;border-radius:9px;background:${i < u.orders ? 'var(--green)' : '#E2DED6'}"></i>`).join('')}</span></div>`).join('')}
      <div class="sx-paper-f" style="justify-content:center"><button class="sx-btn ghost" data-act="sellto" data-id="${esc(c.id)}" data-usual="1" style="height:42px;width:100%">${ic('bag', 17)}Start with the usual</button></div></div></div>` : ''}
  </div>
  <div class="sx-dock" style="background:transparent;box-shadow:none;flex-direction:row;padding-top:12px">
    ${c.debt > 0 ? `<button class="sx-btn ghost" style="flex:1;color:var(--green)" data-act="pay" data-id="${esc(c.id)}">${ic('cash', 20)}Take payment</button>` : ''}
    <button class="sx-btn red" style="flex:1" data-act="sellto" data-id="${esc(c.id)}">${ic('bag', 20)}Sell to ${esc(firstWord(c.name))}</button></div>`;
};

/* ==================================================================
   Taking an order: who it is for, then one screen -- search, the usual,
   what goes with it, the slip, and a slide to place it. The order lands
   in saved_quotes exactly as the owner's quote screen saves one, at
   Checking, where the shop prices anything still to price and asks the
   suppliers.
   ================================================================== */
function draftKey(){ return 'ow-sales-draft:' + (S.user && S.user.id); }
function saveDraft(){ try { if (S.draft) localStorage.setItem(draftKey(), JSON.stringify({ ...S.draft, q: '' })); else localStorage.removeItem(draftKey()); } catch (_e) {} }
function restoreDraft(){ try { const d = JSON.parse(localStorage.getItem(draftKey())); if (d && d.client) S.draft = { openLine: null, lastAdded: null, credit: false, items: [], ...d, q: '' }; } catch (_e) {} }
function newDraft(c){ return { client: c ? { name: c.name, phone: c.phone || '' } : { name: 'Walk-in', phone: '' }, customerId: c ? c.id : null, items: [], credit: false, openLine: null, lastAdded: null, q: '' }; }
function draftQuote(){ const d = S.draft || newDraft(null); const pct = shopCreditPct(); return { items: d.items, charges: [], discount: 0, credit: d.credit && pct > 0 ? { pct, days: custTermsDays(), agreedAt: todayISO() } : null }; }
function custTermsDays(){ return Math.max(0, Number(D().presetChaseAfterDays) || 0); }
function lineQtyWords(it){
  const pq = Number(it.packQty) || 0;
  if (it.qtyIn === 'pack' && pq > 0 && it.packUnit) { const n = (Number(it.qty) || 0) / pq; return { n: Math.round(n * 100) / 100, u: it.packUnit }; }
  return { n: Number(it.qty) || 0, u: it.unit || '' };
}
// A link that names no variant of a product that has them is on the order once any of its variants is.
function onOrder(pid, vi){ const p = productById(pid), any = vi == null && p && Array.isArray(p.variants) && p.variants.length; return !!S.draft && S.draft.items.some(it => it.productId === pid && (any || (it.variantIdx == null ? null : it.variantIdx) === (vi == null ? null : vi))); }
function nextLineId(){ return (S.draft.items.reduce((m, it) => Math.max(m, Number(it.lineId) || 0), 0)) + 1; }

/* ---------------- starting an order ---------------- */
ACT.neworder = () => { if (S.draft) openOrderPage(); else openSheet('client', {}); };
function openOrderPage(){ closeSheet(true); renderSheet(); if (S.stack.some(p => p.type === 'placed')) S.stack = []; const top = S.stack[S.stack.length - 1]; if (top && top.type === 'neworder') render(); else push('neworder'); }
ACT.sellto = t => {
  const c = customerById(t.dataset.id); if (!c) return;
  const usual = !!t.dataset.usual;
  if (S.draft && S.draft.items.length && String(S.draft.customerId) !== String(c.id)) { openSheet('switch', { id: c.id, usual }); return; }
  startFor(c, usual, true);
};
function startFor(c, usual, keep){
  const items = keep && S.draft && String(S.draft.customerId) === String(c && c.id) ? S.draft.items : (keep === 'move' && S.draft ? S.draft.items : []);
  S.draft = { ...newDraft(c), items };
  if (usual && c) usualLines(c.id).forEach(u => addLine(u.productId, u.variantIdx, u.qty, 'unit', true));
  saveDraft(); openOrderPage();
}
SHEET.switch = ({ id, usual }) => {
  const c = customerById(id), n = S.draft.items.length, was = firstWord(S.draft.client.name) || 'this';
  return `<div style="display:flex;align-items:center;gap:10px">${avatar(c.name)}<span style="flex:1;display:flex;flex-direction:column"><b style="font-size:16px">Sell to ${esc(c.name)}</b><span class="sx-sub">${was}’s order has ${n} line${n > 1 ? 's' : ''} not placed yet</span></span><button class="sx-circle light" data-act="closesheet" aria-label="Close">${ic('close', 15)}</button></div>
    <button class="sx-btn navy" data-act="switchgo" data-id="${esc(id)}" data-mode="move" ${usual ? 'data-usual="1"' : ''}>Move the ${n} line${n > 1 ? 's' : ''} to ${esc(firstWord(c.name))}</button>
    <button class="sx-btn ghost" data-act="switchgo" data-id="${esc(id)}" data-mode="fresh" ${usual ? 'data-usual="1"' : ''} style="color:var(--crimson)">${ic('trash', 17)}Clear ${esc(was)}’s lines, start fresh</button>`;
};
ACT.switchgo = t => { const c = customerById(t.dataset.id); closeSheet(true); renderSheet(); startFor(c, !!t.dataset.usual, t.dataset.mode === 'move' ? 'move' : false); };

/* ---------------- who is it for ---------------- */
SHEET.client = args => {
  return `<div style="display:flex;align-items:center;gap:10px"><b style="flex:1;font-size:18px">Who is it for?</b><button class="sx-circle light" data-act="closesheet" aria-label="Close">${ic('close', 15)}</button></div>
    <label class="sx-search">${ic('search', 20, 'style="stroke:#767F91"')}<input data-in="clientq" type="search" placeholder="Name, phone or area" autocomplete="off" value="${esc(args.q || '')}"></label>
    <div id="sx_clientlist" class="sx-card sx-list" style="max-height:46vh;overflow:auto">${clientListHTML(args.q || '')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="sx-btn ghost" data-act="pickwalkin">${ic('bag', 18)}Walk-in</button><button class="sx-btn navy" data-act="addcust" data-for="order">${ic('plus', 18)}New customer</button></div>`;
};
function clientListHTML(q){
  let list;
  if (q) list = D().customers.filter(c => custMatches(c, q)).slice(0, 30);
  else {
    // Due back first, then whoever bought most recently.
    const scored = D().customers.map(c => ({ c, r: customerRhythm(c.id) })).filter(x => x.r.orders);
    scored.sort((a, b) => (b.r.due - a.r.due) || String(b.r.last).localeCompare(String(a.r.last)));
    list = scored.slice(0, 12).map(x => x.c);
    if (!list.length) list = D().customers.slice(0, 12);
  }
  if (!list.length) return `<div class="sx-empty"><b>Nobody by that name</b>Add them as a new customer.</div>`;
  return list.map(c => { const r = customerRhythm(c.id);
    return `<button class="sx-row" data-act="pickclient" data-id="${esc(c.id)}">${avatar(c.name, 's')}<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="ell" style="font-size:14px;font-weight:700">${esc(c.name)}</span><span class="ell sx-sub">${esc([c.location, c.phone].filter(Boolean).join(' · '))}</span></span>${r.due ? '<span class="sx-chip" style="background:var(--greenSoft);color:var(--green)">due back</span>' : ''}</button>`; }).join('');
}
ACT['in:clientq'] = t => { S.sheet.args.q = t.value; const el = document.getElementById('sx_clientlist'); if (el) el.innerHTML = clientListHTML(t.value); };
ACT.pickclient = t => {
  const c = customerById(t.dataset.id); if (!c) return;
  if (S.draft && S.draft.items.length) { S.draft.client = { name: c.name, phone: c.phone || '' }; S.draft.customerId = c.id; saveDraft(); openOrderPage(); return; }
  startFor(c, false, false);
};
ACT.pickwalkin = () => { if (S.draft) { S.draft.client = { name: 'Walk-in', phone: '' }; S.draft.customerId = null; } else S.draft = newDraft(null); saveDraft(); openOrderPage(); };
ACT.changeclient = () => openSheet('client', {});

/* ---------------- a new customer ---------------- */
ACT.addcust = t => openSheet('addcust', { for: t.dataset.for || '', name: S.view === 'customers' && S.custQuery && !/^[0-9+ ]+$/.test(S.custQuery) ? S.custQuery : '' });
SHEET.addcust = args => {
  const areas = [...new Set(D().customers.map(c => (c.location || '').trim()).filter(Boolean))];
  const count = a => D().customers.filter(c => (c.location || '').trim() === a).length;
  areas.sort((a, b) => count(b) - count(a));
  return `<div style="display:flex;align-items:center;gap:10px"><b style="flex:1;font-size:18px">New customer</b><button class="sx-circle light" data-act="closesheet" aria-label="Close">${ic('close', 15)}</button></div>
    <label class="sx-search">${ic('me', 19, 'style="stroke:#767F91"')}<input id="sx_nc_name" placeholder="Name" value="${esc(args.name || '')}" autocomplete="off" autofocus></label>
    <label class="sx-search">${ic('phone', 19, 'style="stroke:#767F91"')}<input id="sx_nc_phone" data-in="ncphone" type="tel" inputmode="tel" placeholder="Phone" autocomplete="off"></label>
    <div id="sx_nc_dup"></div>
    <label class="sx-search">${ic('pin', 19, 'style="stroke:#767F91"')}<input id="sx_nc_area" placeholder="Area" autocomplete="off"></label>
    ${areas.length ? `<div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:-4px">${areas.slice(0, 10).map(a => `<button class="sx-pill" data-act="ncarea" data-a="${esc(a)}">${esc(a)}</button>`).join('')}</div>` : ''}
    <span class="sx-sub" style="display:flex;align-items:center;gap:6px">${ic('lock', 13)}Starts owing nothing. Credit limits and terms are set by the owner.</span>
    <button class="sx-btn red" data-act="ncsave">${args.for === 'order' ? 'Add and take the order' : 'Add customer'}</button>`;
};
ACT.ncarea = t => { const el = document.getElementById('sx_nc_area'); if (el) el.value = t.dataset.a; document.querySelectorAll('[data-act=ncarea]').forEach(b => b.setAttribute('aria-pressed', b === t)); };
function phoneTwin(ph){ const d = phoneDigits(ph); if (d.length < 9) return null; return D().customers.find(c => [c.phone, c.phone2].some(p => p && phoneDigits(p) === d)) || null; }
ACT['in:ncphone'] = t => { const twin = phoneTwin(t.value), el = document.getElementById('sx_nc_dup'); if (!el) return;
  el.innerHTML = twin ? `<button class="sx-row" data-act="${S.sheet.args.for === 'order' ? 'pickclient' : 'customer'}" data-id="${esc(twin.id)}" style="min-height:0;padding:10px 12px;border-radius:14px;background:var(--amberSoft)">${avatar(twin.name, 's')}<span style="flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--amberInk)">That number is already <b>${esc(twin.name)}</b></span><span style="font-size:13px;font-weight:700;color:var(--amberInk)">Use them</span></button>` : ''; };
ACT.ncsave = async t => {
  const name = (document.getElementById('sx_nc_name').value || '').trim(), phone = (document.getElementById('sx_nc_phone').value || '').trim(), location = (document.getElementById('sx_nc_area').value || '').trim();
  if (!name) { toast('Type their name'); return; }
  if (phoneTwin(phone)) { toast('That number is already a customer — tap them above'); return; }
  t.disabled = true; t.textContent = 'Adding…';
  try {
    const id = await issueCustomerId();
    const { error } = await sb.from('customers').insert({ id, shop_id: S.shopId, name, phone, location, notes: '', debt: 0 });
    if (error) throw error;
    const c = { id, name, phone, phone2: '', location, notes: '', debt: 0, termsDays: null, creditLimit: null, debtLog: [] };
    D().customers.push(c); saveSnapshot(); haptic('success');
    const forOrder = S.sheet && S.sheet.args.for === 'order';
    closeSheet(true); renderSheet();
    if (forOrder) { if (S.draft && S.draft.items.length) { S.draft.client = { name, phone }; S.draft.customerId = id; saveDraft(); openOrderPage(); } else startFor(c, false, false); }

/* ---------------- search ---------------- */
/* "20 cement", "cement x20", "3 bags cement": numbers are the quantity, a
   word that is the product's pack name counts packs. */
function parseQuery(s){
  const words = String(s || '').toLowerCase().replace(/[×x](\d)/g, ' $1').split(/\s+/).filter(Boolean);
  let qty = null; const rest = [];
  words.forEach(w => { if (qty == null && /^\d+(\.\d+)?$/.test(w)) qty = Number(w); else rest.push(w); });
  return { qty, words: rest };
}
const singular = w => String(w || '').toLowerCase().replace(/(es|s)$/, '');
function searchResults(s){
  const { qty, words } = parseQuery(s);
  if (!words.length) return { qty, list: [] };
  const out = [];
  D().products.forEach(p => {
    const vs = Array.isArray(p.variants) && p.variants.length ? p.variants.map((v, i) => i) : [null];
    vs.forEach(vi => {
      const label = productVariantLabel(p, vi), hay = (label + ' ' + p.category + ' ' + p.subcategory).toLowerCase();
      const su = stockUnitFor(p.id, vi), packWord = singular(su.packUnit);
      const nameWords = words.filter(w => !(packWord && singular(w) === packWord));
      if (!nameWords.length || !nameWords.every(w => hay.includes(w))) return;
      if (!productPriceRows(p.id, vi).length && !getStockQty(p.id, vi)) return;
      const inPacks = su.hasPack && words.some(w => singular(w) === packWord);
      const starts = label.toLowerCase().startsWith(nameWords[0]) ? 0 : 1;
      out.push({ p, vi, label, inPacks, su, rank: starts * 10 + (getStockQty(p.id, vi) > 0 ? 0 : 1) });
    });
  });
  out.sort((a, b) => a.rank - b.rank || a.label.localeCompare(b.label));
  return { qty, list: out.slice(0, 12), more: Math.max(0, out.length - 12) };
}

    <div class="sx-glass sx-upin" style="width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;animation-delay:.5s">
      <span style="padding:12px 8px;display:flex;flex-direction:column;gap:3px"><b class="m" style="font-size:18px">${n}</b><span style="font-size:11px;font-weight:600;color:var(--navyInk)">lines</span></span>
      <span style="padding:12px 8px;display:flex;flex-direction:column;gap:3px;border-left:1px solid rgba(255,255,255,.07)"><b class="m" style="font-size:18px;color:var(--mint)">${shelf}</b><span style="font-size:11px;font-weight:600;color:var(--navyInk)">on the shelf</span></span>
      <span style="padding:12px 8px;display:flex;flex-direction:column;gap:3px;border-left:1px solid rgba(255,255,255,.07)"><b class="m" style="font-size:18px;color:var(--amber)">${n - shelf}</b><span style="font-size:11px;font-weight:600;color:var(--navyInk)">shop checks</span></span></div>
    <span class="sx-upin" style="font-size:13px;color:var(--navyInk);animation-delay:.6s">It is at <b style="color:#fff">Checking</b>. You’ll see each line turn green as the shop confirms it.</span>

ACT.placeddone = () => { S.ordersStage = 'draft'; go('orders'); };
