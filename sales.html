.cu-pdays button .m{font-size:14px;font-weight:600}
.cu-pdays button.on{background:var(--navy);color:#fff;box-shadow:none}
.cu-plater{position:relative;align-self:center;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--sky)}
.cu-plater input{position:absolute;inset:0;opacity:0;width:100%}
.cu-pwho{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink3)}
/* ---- the counter sale: pay and go ---- */
/* where it starts: two doors on the who-is-it-for sheet */
.ct-drafts{flex:none;height:32px;padding:0 10px;border:none;border-radius:999px;background:rgba(255,255,255,.08);color:#B3BCD2;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.ct-drafts .m{color:#fff}
.ct-drafts[aria-pressed="true"]{background:#fff;color:var(--navy)}
.ct-drafts[aria-pressed="true"] .m{color:var(--navy)}
.ct-doors{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ct-door{height:44px;padding:0 12px 0 6px;border:none;border-radius:999px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:#fff;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}

.ct-door b{font-size:14px;font-weight:700;white-space:nowrap}
.ct-door .n{font-size:12px;font-weight:600;color:var(--mint)}
@keyframes ctIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* the counter's own top */
.ct-head{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.ct-back{width:44px;height:44px;flex:none;border:none;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(22,32,60,.06),inset 0 0 0 1px var(--rule);color:var(--ink);display:flex;align-items:center;justify-content:center}

.ct-ttl .ey i{width:6px;height:6px;border-radius:9px;background:var(--green)}
.ct-ttl b{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.ct-ttl > span.ell{font-size:12px;font-weight:600;color:var(--ink3)}
.ct-who{flex:none;max-width:130px;display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 10px 0 4px;border:none;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(22,32,60,.06),inset 0 0 0 1px var(--rule);color:var(--ink);font-family:inherit;font-size:13px;font-weight:700;min-width:0}
.ct-who .ell{min-width:0}
.ct-who .sx-av.s{width:34px;height:34px}

/* an empty counter: the day as a hero, the best seller, the rest ranked */
.ct-hero{position:relative;overflow:hidden;width:100%;display:flex;align-items:flex-end;gap:12px;padding:14px 16px;border:none;border-radius:20px;background:linear-gradient(135deg,#1D2848 0%,var(--navy) 70%);color:#fff;text-align:left;font-family:inherit;box-shadow:0 10px 24px rgba(22,32,60,.22),inset 0 1px 0 rgba(255,255,255,.07)}
.ct-hero .glow{position:absolute;right:-40px;top:-60px;width:160px;height:160px;border-radius:999px;background:radial-gradient(circle,rgba(111,220,176,.18),transparent 70%);pointer-events:none}

.ct-hero .amt{display:flex;align-items:baseline;gap:6px}
.ct-hero .cur{font-size:12px;color:var(--navyInk2)}
.ct-hero .v{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1}
.ct-hero .sub{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--navyInk)}
.ct-hero .sub i{width:6px;height:6px;border-radius:9px;background:var(--mint)}
.ct-hero .sub .m{color:#fff}
.ct-hero .amb{color:var(--amber);font-weight:700}
.ct-hero .ct-bars{position:relative;gap:4px}
.ct-hero .ct-bars i{width:8px;background:rgba(255,255,255,.16)}
.ct-sech{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 0}
.ct-sech b{font-size:15px;letter-spacing:-.01em}
.ct-sech span{font-size:12px;font-weight:600;color:var(--ink3)}
.ct-rank{font-size:11px;font-weight:600;color:#A39C90}
.ct-pill{height:22px;padding:0 8px;border-radius:999px;background:var(--greenSoft);color:var(--green);font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ct-pill.low{background:var(--amberSoft);color:var(--amberInk)}
.ct-addb{width:34px;height:34px;flex:none;border-radius:999px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(22,32,60,.22)}
.ct-addb.s{width:30px;height:30px}
.ct-feat,.ct-tile{border:none;font-family:inherit;color:var(--ink);text-align:left;background:#fff;box-shadow:0 1px 2px rgba(22,32,60,.05),0 8px 18px rgba(22,32,60,.05),inset 0 0 0 1px var(--line);min-width:0}
.ct-feat{width:100%;padding:14px;border-radius:20px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center}
.ct-feat .nw-tile{border-radius:16px}
.ct-feat .tx{min-width:0;display:flex;flex-direction:column;gap:4px}
.ct-feat .eb{display:flex;align-items:center;gap:6px}
.ct-feat .eb b{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--green)}
.ct-feat .nm{font-size:16px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.ct-feat .nm small{font-size:16px;font-weight:600;color:var(--ink3)}
.ct-feat .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ct-feat .wk{font-size:11px;font-weight:600;color:var(--ink3)}
.ct-feat .wk .m{color:var(--ink)}
.ct-feat .pr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ct-feat .pr .v{display:flex;flex-direction:column;align-items:flex-end}
.ct-feat .pr b{font-size:18px;font-weight:600;letter-spacing:-.02em}
.ct-feat .pr small{font-size:11px;font-weight:600;color:var(--ink3)}
.ct-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ct-tile{min-height:118px;padding:12px;border-radius:18px;display:flex;flex-direction:column;gap:8px}
.ct-tile .hd{display:flex;align-items:center;justify-content:space-between}
.ct-tile .nw-tile{border-radius:10px}
.ct-tile .nm{font-size:14px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.ct-tile .nm small{display:block;margin-top:1px;font-size:12px;font-weight:600;color:var(--ink3)}
.ct-tile .nm .ok{color:var(--green)}
.ct-tile .nm .amb{color:var(--amberInk)}
.ct-tile .ft{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.ct-tile .pr{display:flex;flex-direction:column}
.ct-tile .pr b{font-size:15px;font-weight:600;letter-spacing:-.02em}
.ct-tile .pr small{font-size:11px;font-weight:600;color:var(--ink3)}
.ct-today{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);text-align:left;font-family:inherit}
.ct-today .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ct-today .tx b{font-size:13px}
.ct-today .v{font-size:16px;font-weight:600}
.ct-today.dark{position:relative;margin:16px 16px 0;width:auto;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.06);box-shadow:none;color:#fff}
.ct-today.dark .tx{display:block;font-size:12px;font-weight:600;color:#B3BCD2}
.ct-today.dark .tx b{font-size:12px;color:#fff}
.ct-today.dark .v{font-size:15px}
.ct-bars{display:flex;align-items:flex-end;gap:3px;flex:none}
.ct-bars i{display:block;width:6px;border-radius:3px;background:#D9D4CB}
.ct-today.dark .ct-bars i{background:rgba(255,255,255,.18)}
/* the counter, with goods: the receipt slip the order screens use */
.ct-slip{margin:2px 2px 0;filter:drop-shadow(0 1px 1px rgba(22,32,60,.08)) drop-shadow(0 8px 18px rgba(22,32,60,.09))}
.ct-slip::before,.ct-slip::after{content:'';display:block;height:8px}
.ct-slip::before{background:linear-gradient(45deg,transparent 50%,#fff 50%) 0 0/12px 8px repeat-x,linear-gradient(-45deg,transparent 50%,#fff 50%) 0 0/12px 8px repeat-x}
.ct-slip::after{background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/12px 8px repeat-x,linear-gradient(-135deg,#fff 50%,transparent 50%) 0 0/12px 8px repeat-x}
.ct-slipin{background:#fff;padding:6px 16px}
.ct-sliph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1.5px solid var(--ink);font-size:12px;font-weight:600;color:var(--ink3)}
.ct-sliph .t{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink)}
.ct-sliph .ok{color:var(--green)}
.ct-sliph .amb{color:var(--amberInk)}
.ct-sliph .bad{color:var(--crimson)}
.ct-cl{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0}
.ct-cl + .ct-cl{border-top:1px dashed #E2DED6}
.ct-qb{width:46px;height:46px;border-radius:12px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ct-qb b{font-size:16px;font-weight:600}
.ct-qb small{font-size:10px;font-weight:600;color:var(--navyInk);max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-cl .nm{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:0;border:none;background:none;color:var(--ink);text-align:left;font-family:inherit}
.ct-cl .nm b{max-width:100%;font-size:14px;font-weight:700}
.ct-cl .sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--ink3)}

.ct-cl .sub .bad{color:var(--crimson)}
.ct-cl .nm .sx-ptag{margin-top:2px}
.ct-cl .rt{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.ct-cl .am{font-size:15px;font-weight:600}
.ct-stp{display:flex;gap:6px}
.ct-stp button{width:30px;height:30px;border:none;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);display:flex;align-items:center;justify-content:center}
/* the dock */
.ct-slim{position:fixed;left:12px;right:12px;bottom:calc(16px + var(--safe-area-inset-bottom));z-index:55;max-width:496px;margin:0 auto;height:62px;border-radius:22px;background:linear-gradient(180deg,#1D2848,var(--navy));color:#fff;display:flex;align-items:center;gap:12px;padding:0 10px;box-shadow:0 14px 30px rgba(22,32,60,.3),inset 0 1px 0 rgba(255,255,255,.07)}

.ct-slim .tx > span{font-size:12px;color:var(--navyInk)}
.ct-slim .n{height:34px;min-width:34px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:15px;font-weight:600;color:var(--navyInk2);display:flex;align-items:center;justify-content:center}

.ct-dock{background:linear-gradient(180deg,#1D2848 0%,var(--navy) 38%);border-radius:24px 24px 0 0;padding:12px 16px calc(18px + var(--safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;box-shadow:0 -12px 34px rgba(22,32,60,.26),inset 0 1px 0 rgba(255,255,255,.07)}
.ct-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.ct-tot{display:flex;flex-direction:column;gap:3px;min-width:0}
.ct-ey{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--navyInk2)}
.ct-bigw{display:flex;align-items:baseline;gap:6px}
.ct-bigw .cur{font-size:13px;color:var(--navyInk2)}
.ct-big{font-size:26px;font-weight:600;line-height:1;letter-spacing:-.03em}
.ct-chg{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:6px 10px;border-radius:12px;background:rgba(111,220,176,.12);box-shadow:inset 0 0 0 1px rgba(111,220,176,.22)}
.ct-chg .ct-ey{font-size:10px;letter-spacing:.12em;color:var(--mint)}
.ct-chg .m{font-size:18px;font-weight:600;line-height:1;color:var(--mint)}
.ct-chg.none{background:rgba(255,255,255,.05);box-shadow:none}
.ct-chg.none .m,.ct-chg.none .ct-ey{color:#5C6788}
.ct-meth{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ct-meth button{height:38px;border:none;border-radius:12px;background:rgba(255,255,255,.07);color:var(--navyInk);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600}

.ct-gave{display:flex;flex-direction:column;gap:5px}
.ct-gave .ct-ey{font-size:10px}
.ct-chips{display:flex;gap:6px}
.ct-chips button{flex:1;min-width:0;height:34px;border:none;border-radius:10px;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#DDE3F0;font-size:13px;font-weight:700;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
.ct-chips button[aria-checked="true"]{background:#fff;color:var(--navy);box-shadow:0 6px 14px rgba(0,0,0,.22)}
.ct-chips button i{width:6px;height:6px;border-radius:9px;background:var(--green)}
.ct-dock .sx-slide{height:52px}
.ct-dock .sx-slide .k{width:42px;height:42px}
.ct-block{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:rgba(255,255,255,.06);font-size:13px;font-weight:600;color:#DDE3F0}
.ct-block > span{flex:1;min-width:0}
.ct-block button{flex:none;height:34px;padding:0 12px;border:none;border-radius:999px;background:#fff;color:var(--navy);font-size:12px;font-weight:700}
.ct-ask{display:flex;align-items:center;gap:10px}

.ct-ask .tx span{font-size:12px;color:var(--navyInk)}
.ct-face{border-radius:999px;display:inline-flex}
.ct-clock{height:28px;padding:0 10px;border-radius:999px;background:rgba(245,178,107,.14);color:var(--amber);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px}

.ct-ladder small{position:absolute;transform:translateX(-50%);font-size:10px;font-weight:700;white-space:nowrap}
.ct-steps2{display:flex;align-items:center;gap:10px;padding:0 2px}
.ct-steps2 .ln{flex:1;height:2px;background:rgba(255,255,255,.14)}
.ct-steps2 .ln.on{background:var(--mint)}
.ct-step{display:inline-flex;align-items:center;gap:7px;flex:none}
.ct-step .d{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);color:#B3BCD2}

.ct-step .d.now{background:var(--amber);color:var(--navy)}

.ct-rcpt .zz.bot{background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/10px 6px repeat-x,linear-gradient(-135deg,#fff 50%,transparent 50%) 0 0/10px 6px repeat-x}
.ct-rcpt .in{position:relative;background:#fff;color:var(--ink);padding:6px 14px 10px}
.ct-rcpt .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:1.5px solid var(--ink);font-size:10px;font-weight:700;letter-spacing:.12em}

.ct-rcpt .stamp{position:absolute;left:44%;bottom:8px;padding:4px 10px;border:2.5px solid var(--green);border-radius:8px;color:var(--green);font-size:16px;font-weight:700;letter-spacing:.12em;transform:rotate(-9deg);opacity:.85}
.ct-dacts{position:fixed;left:16px;right:16px;bottom:calc(22px + var(--safe-area-inset-bottom));z-index:55;max-width:488px;margin:0 auto;display:flex;gap:10px}
.ct-rbtn{width:120px;height:56px;flex:none;border:none;border-radius:18px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700}

@media (prefers-reduced-motion: reduce){.ct-dtick{animation:none}}

/* ---- a payment recorded wrong: ask Accounts ---- */

/* the tab bar under an open page; a slider tapped, not slid */

function ic(name, size, extra){
  // A style passed in extra joins the size, rather than being a second style attribute the browser drops.
  let st = size ? `width:${size}px;height:${size}px;` : '';
  extra = String(extra || '').replace(/style="([^"]*)"/, (_m, v) => { st += v; return ''; });
  return `<svg class="icon" viewBox="0 0 24 24" ${st ? `style="${st}"` : ''} ${extra} aria-hidden="true">${ICON[name] || ''}</svg>`;
}

function toast(msg, ms){
  let el = document.getElementById('sx_toast');
  if (!el) { el = document.createElement('div'); el.id = 'sx_toast'; el.className = 'sx-toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }

  el.textContent = msg; if (el.removeAttribute) el.removeAttribute('aria-hidden'); el.classList.add('on');

}

/* ==================================================================
   Who is signed in, which shop, and the shop's books as the admin app
   reads them (index.html loadData) -- the same tables, the same
   mapping, so every figure here is the figure on the owner's screen.
   ================================================================== */
const S = {
  user: null, shopId: null, shopName: '', role: null,
  data: null, loadedAt: 0,
  view: 'today', stack: [], sheet: null,
  ordersStage: 'draft', custFilter: 'all', custArea: '', custQuery: '',

window.SX = S;

async function selectAll(table, keyCol, filter){
  keyCol = keyCol || 'id';
  let rows = [], total = null;
  for (;;) {
    let q = sb.from(table).select('*', total === null ? { count: 'exact' } : undefined).eq('shop_id', S.shopId);
    if (filter) q = filter(q);
    if (rows.length) q = q.gt(keyCol, rows[rows.length - 1][keyCol]);
    const r = await q.order(keyCol, { ascending: true }).limit(1000);
    if (r.error) throw r.error;
    if (total === null) total = (typeof r.count === 'number') ? r.count : null;
    const page = r.data || [];
    rows = rows.concat(page);
    if (!page.length || (total !== null && rows.length >= total)) break;
  }
  return rows;
}
function monthStartISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; }

async function loadAll(){
  const [suppliers, customers, debtLog, products, prices, stock, lots, quotes, links, settingsR, cashR, staff, tripsR, targetsR, stmR, membersR, promises, asks, payAsksR, leadsR, switchesR] = await Promise.all([
    selectAll('suppliers'), selectAll('customers'), selectAll('customer_debt_log'), selectAll('products'), selectAll('prices'),
    selectAll('stock', 'key'), selectAll('stock_lots'), selectAll('saved_quotes'), selectAll('product_links').catch(() => []),
    sb.from('app_settings').select('presets').eq('shop_id', S.shopId).maybeSingle(),
    selectAll('cash_txns', 'id', q => q.gte('date', monthStartISO())).then(rows => ({ data: rows })),
    selectAll('staff').catch(() => []),
    // Who is out collecting what (0070); members read.

    sb.from('manager_notes').select('*').eq('shop_id', S.shopId).eq('kind', 'target').eq('status', 'open').limit(50).then(r => r, () => ({ data: [] })),
    // Statements already sent (0101); Sales may add one (statement.send).

    // Who holds which role: the Manager decides prices under the shop's, credit and voids (docs/decision-rights.md).

    // Promises to pay (0089); Sales may add one (promise.record, 0121). null: not on this database.

    // Asks to the Manager for a void or a credit note (0123). null: not on this database, and the button stays away.

    // What Sourcing is finding (0072); Sales adds a request to one (sourcing.ask, 0126 / 0121). null: not on this database.

    sb.from('sourcing_leads').select('id, name, status, voided, product_id, assigned_staff_id, created_at, stage_entered_at, requests, candidates').eq('shop_id', S.shopId).eq('voided', false).limit(1000).then(r => r.error ? null : r.data || [], () => null),
    // Lines the Buyer switched to another item, for Sales to tell the customer (0125 item_switch). A missing table: none.
    switchesQuery().then(r => r || [], () => []),
  ]);
  const presets = (settingsR && settingsR.data && settingsR.data.presets) || {};
  const debtBy = {};
  debtLog.forEach(l => { (debtBy[l.customer_id] ||= []).push({ id: l.id, date: l.date, type: l.type, amount: Number(l.amount) || 0, note: l.note || '', cashTxnId: l.cash_txn_id == null ? null : Number(l.cash_txn_id), quoteId: l.quote_id == null ? null : Number(l.quote_id) }); });
  const stockMap = {}; stock.forEach(s => { stockMap[s.key] = Number(s.qty) || 0; });
  const lotMap = {}; lots.forEach(l => { const lot = { qty: Number(l.qty) || 0, cost: l.cost == null ? null : Number(l.cost) }; (lotMap[l.key] ||= []).push(lot); });
  S.data = {
    suppliers: suppliers.map(s => ({ id: s.id, name: s.name })),
    staff: staff.map(s => ({ id: s.id, name: s.name, userId: s.user_id || null, role: s.role })),
    customers: customers.map(c => ({ id: c.id, name: c.name || '', phone: c.phone || '', phone2: c.phone2 || '', location: c.location || '', notes: c.notes || '', debt: Number(c.debt) || 0, termsDays: c.terms_days ?? null, creditLimit: c.credit_limit ?? null, debtLog: debtBy[c.id] || [] })),
    products: products.map(p => ({ id: p.id, name: p.name || '', type: p.type || 'simple', category: p.category || '', subcategory: p.subcategory || '', image: p.image || null,
      wholesaleMarkupType: p.wholesale_markup_type, wholesaleMarkupValue: Number(p.wholesale_markup_value) || 0,
      retailMarkupType: p.retail_markup_type, retailMarkupValue: Number(p.retail_markup_value) || 0,
      stockWholesaleMarkupType: p.stock_wholesale_markup_type || 'percent', stockWholesaleMarkupValue: Number(p.stock_wholesale_markup_value) || 0,
      stockRetailMarkupType: p.stock_retail_markup_type || 'percent', stockRetailMarkupValue: Number(p.stock_retail_markup_value) || 0,
      variantAttributes: p.variant_attributes || [], variants: p.variants || [] })),

function customerById(id){ return IX().cust.get(String(id)) || null; }

function customerOrdersFor(cid){

// 90541 / 90667
function orderHistory(cid){ return memo('hist', cid, () => customerOrdersFor(cid).filter(q => q.invoiced && !q.voided).map(q => ({ q, date: q.invoicedAt || q.date || '' })).filter(o => o.date).sort((a, b) => a.date.localeCompare(b.date) || ((a.q.id || 0) - (b.q.id || 0)))).slice(); }

function usualLinesNow(cid){
  const hist = orderHistory(cid); if (!hist.length) return [];
  const key = it => `${it.productId}|${it.variantIdx == null ? '' : it.variantIdx}`;
  const seen = new Map();
  hist.forEach((o, i) => { const here = new Set(); (o.q.items || []).forEach(it => { if (!it.productId) return; const k = key(it); const e = seen.get(k) || { productId: it.productId, variantIdx: it.variantIdx == null ? null : it.variantIdx, name: it.productName || '', orders: 0, qtys: [], lastAt: -1 }; if (!here.has(k)) { e.orders++; here.add(k); } e.qtys.push(Number(it.qty) || 0); if (i >= e.lastAt) e.lastAt = i; seen.set(k, e); }); });

/* ---- what goes with what (93288 / 93432 / 93669) ---- */
const PAIR_REVERSE = { needs: 'with', with: 'with', instead: 'instead', part: 'part' };
const PAIR_WORD = { needs: 'needs', with: 'goes with', part: 'same job' };
function goesWith(pid, vi, lineQty){
  const live = D().productLinks.filter(l => l.active !== false && l.verb !== 'after' && l.verb !== 'instead');
  const fits = l => l.fromVariantIdx == null || l.fromVariantIdx === vi;
  const mine = live.filter(l => l.fromId === pid).filter(fits);
  const said = new Set(mine.map(l => l.verb + ' ' + l.toId));
  live.filter(l => l.toId === pid && l.fromId !== pid).forEach(l => {
    const rev = PAIR_REVERSE[l.verb]; if (!rev) return;
    const r = { verb: rev, fromId: pid, fromVariantIdx: l.toVariantIdx, toId: l.fromId, toVariantIdx: l.fromVariantIdx, qty: null, per: '' };
    if (fits(r) && !said.has(r.verb + ' ' + r.toId)) mine.push(r);
  });
  return mine.filter(l => productById(l.toId)).map(l => ({ toId: l.toId, toVariantIdx: l.toVariantIdx, verb: l.verb, per: l.per,
    qty: (l.qty && lineQty > 0) ? Math.max(1, Math.round(l.qty * lineQty)) : null, rate: l.qty }));
}

/* ic() with a size AND a style (ic's own size style would win over a second style attribute). */

/* ---------------- small readers ---------------- */

/* Ages in words a salesperson reads at a glance -- "3 h ago", "2 days ago",

function ordAv(name, size){ const t = tintFor(name); return `<span class="ord-av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .36)}px;background:${t[0]};color:${t[1]}">${esc(initials(name))}</span>`; }

/* A line on one of the shop's collection trips (0070), if any. */
function ordTripFor(q, it){
  return (D().collectionTrips || []).find(t => (t.lines || []).some(l => Number(l.orderId) === Number(q.id) && String(l.lineId) === String(it.lineId))) || null;

/* Who has it on the road: the carrier note first, then the self-carry

/* When each stage was entered, off the order's own log (otStageTimes).

function ordStageTimes(q){
  const log = Array.isArray(q.stageLog) ? q.stageLog : [];

  log.forEach(e => { if (e && e.status && at[e.status] == null) at[e.status] = ordMs(e.at); });
  if (at.draft == null) at.draft = ordMs(q.savedAt) || createdMs(q);

/* When it reached the door: deliveredAt, else when the log says it was

/* ---------------- one line, in the salesperson's words ---------------- */
function ordLineView(q, it){

  const G = '#0F6B43', A = '#95530C', I = '#3A3F9B', M = '#767F91', F = '#8A93A3';

    const s = lineState(q, it);
    if (s.k === 'ok') return { k: 'ok', icon: 'tick', word: shelf ? 'ON THE SHELF' : '', col: M };
    if (s.k === 'no') return { k: 'no', icon: '', word: '', col: '#8E2A22', struck: true };
    if (s.k === 'ask') return { k: 'ask', icon: 'ask', word: 'ASKING', col: A };
    return { k: 'toask', icon: 'hollow', word: it.supplierId ? 'TO ASK' : 'NO SUPPLIER YET', col: F };
  }

    if (shelf || !it.supplierId) return { k: 'in', icon: 'tick', word: 'ON THE SHELF', col: M };
    if (lineReceived(it)) {
      const sh = lineShort(it);
      if (sh > 0) return { k: 'short', icon: 'amber', word: `SHORT · GOT ${qtyText(it.receivedQty)} OF ${n0(qty)}`, col: A };
      const t = ordMs(it.receivedAt);
      return { k: 'in', icon: 'tick', word: 'CAME IN' + (t ? ' · ' + ordClock(t) : ''), col: G };
    }

    if (trip && (trip.status === 'collecting' || trip.status === 'collected')) {
      const who = firstWord(ordStaffName(trip.workerId));
      return { k: 'way', icon: 'truck', word: 'ON THE WAY' + (who ? ' · ' + who.toUpperCase() : ''), col: I, trip };
    }

}
function ordViews(q){ return (q.items || []).map(it => ordLineView(q, it)); }

/* ---------------- Orders ---------------- */
function ordGroups(list){

function ordStrip(views, w){

/* Each stage's orders, read in ONE pass over the books (a shop has

function ordBuckets(){

function ordPagedCard(key, qs, rowFn){

function viewOrders(){

      <span class="bar">${seg(g.tell.length, '#8E2A22')}${seg(g.ask.length + g.mgr.length, '#F5B26B', 'ord-blink')}${seg(g.found.length, '#0F6B43')}</span>

function orderRow(q, tellBtn){

  else if (q.status === 'draft') {

function quoteById(id){ return D().savedQuotes.find(q => Number(q.id) === Number(id)) || null; }

}

/* The stage (v110): its name, n of 6, and one slim bar cut in six -- done
   in mint, the stage it is in its own colour, the rest dim. */
const ORD_NOW = ['Taken', 'Checking', 'Buying', 'Packing', 'On road', 'Delivered'];
const ORD_CUR = { draft: ['#F5B26B', 'lens'], awaiting_goods: ['#9BA3F0', 'bag'], preparing: ['#F5B26B', 'box'], pending_delivery: ['#6FDCB0', 'truck'], completed: ['#6FDCB0', 'tick'] };
function ordStage(q){
  const cur = stageIdx(q) + 1, done = q.status === 'completed', col = (ORD_CUR[q.status] || ORD_CUR.draft)[0], nm = stageOf(q).label;
  const segs = ORD_NOW.map((_, i) => `<i${i < cur || done ? ' class="on"' : i === cur ? ` class="cur${done ? '' : ' sx-blink'}" style="background:${col}"` : ''}></i>`).join('');

/* One chip of the header: ok (mint tick), wait (amber, a blinking dot),

function ordChip(kind, html, who, mgr, label){

  const lead = kind === 'ok' ? ordIc('tick', 10, 'stroke-width:3.2') : kind === 'wait' && who ? '<i class="sx-blink" aria-hidden="true"></i>' : '';
  return `<span class="ord-chip ${kind}${who ? ' who' : ''}"${label ? ` title="${esc(label)}" aria-label="${esc(label)}"` : ''}>${disc}${lead}${html}</span>`;
}
function ordLimitChip(q){
  if (q.status === 'completed') return '';

/* ---------------- what to tell them ---------------- */
function ordTellText(q){
  const name = ordGreet(ordName(q) === 'Walk-in' ? '' : ordName(q)) || 'there';
  const views = ordViews(q), items = q.items || [], tt = ordTotals(q);
  const names = k => items.filter((it, i) => (Array.isArray(k) ? k.includes(views[i].k) : views[i].k === k)).map(ordItemName);
  const total = q.invoiced ? quoteTotal(q) : tt.kept, paid = Number(q.amountPaid) || 0;
  const money = () => { if (!(total > 0)) return ''; if (paid >= total && !(tt.toConfirm && !q.invoiced)) return 'It is paid in full — thank you.'; if (paid >= total) return `${n0(paid)} paid — thank you. Some prices are still to confirm.`; if (paid > 0) return `Total ${n0(total)}, ${n0(paid)} paid, ${n0(total - paid)} ${q.invoiced ? 'still owed' : 'to pay'}.`; return `Total ${n0(total)}${tt.toConfirm ? ' (some prices still to confirm)' : ''}.`; };
  const out = [`Hello ${name}, about your order ${orderNo(q)} from ${S.shopName}:`];
  if (q.status === 'draft') {
    const ok = names('ok'), ask = names(['ask', 'toask']), no = names('no');
    if (ok.length) out.push(ok.length === items.length ? 'everything is ready.' : `${ordList(ok)} ${ok.length > 1 ? 'are' : 'is'} ready.`);
    if (ask.length) out.push(`${ordList(ask)} ${ask.length > 1 ? 'are' : 'is'} being confirmed with the supplier.`);
    if (no.length) out.push(`We could not find ${ordList(no)}, so ${no.length > 1 ? 'they are' : 'it is'} not in the total.`);
    out.push(money());
  } else if (q.status === 'awaiting_goods') {
    const inn = names('in'), way = names('way'), wait = names('wait');
    const shorts = items.filter((it, i) => views[i].k === 'short');
    if (inn.length) out.push(inn.length === items.length ? 'everything is in.' : `${ordList(inn)} ${inn.length > 1 ? 'are' : 'is'} in.`);
    shorts.forEach(it => out.push(`For ${ordItemName(it)} we have ${qtyText(it.receivedQty)} of ${qtyText(it.qty)} so far.`));
    if (way.length) out.push(`${ordList(way)} ${way.length > 1 ? 'are' : 'is'} on the way to the shop now.`);
    if (wait.length) out.push(`${ordList(wait)} ${wait.length > 1 ? 'are' : 'is'} being bought.`);
    out.push(money());
  } else if (q.status === 'preparing') { out.push('everything is in and we are packing it now.'); out.push(money()); }
  else if (q.status === 'pending_delivery') { const cr = ordCarrier(q); out.push(`it is on the way to you now${cr.person ? ' with ' + firstWord(cr.person) : ''}.`); out.push(money()); }
  else {
    out[0] = `Hello ${name}, thank you for your order ${orderNo(q)} from ${S.shopName}.`;
    const d = ordDeliveredMs(q); out.push(`It was delivered${d ? (ordSameDay(d) ? ' today at ' + timeOf(d) : ' on ' + dayLabel(isoOf(d))) : ''}.`);
    if (q.invoiced && balanceDue(q) > 0) out.push(`${invoiceLabel(q)}: ${n0(balanceDue(q))} still owed.`);
    else if (total > 0 && paid >= total && !(tt.toConfirm && !q.invoiced)) out.push('It is paid in full.');
    out.push('We appreciate your business!');
  }
  return out.filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
}

/* ---------------- the order picture ----------------
   Drawn from the order's own lines (index.html waDrawOrderReceipt's
   paper): the shop's letterhead, ORDER #0024, each line with its state,
   and what is to pay. Never an invoice -- a sales login cannot raise one. */

  const views = ordViews(q);

    const v = views[i], qw = ordQty(it), toc = linePriceToConfirm(it);
    if (v.k === 'out') return null;   // settled to nothing: not on the customer's picture
    let tag = '', tagCol = '#95530C';

    else if (v.k === 'ask' || v.k === 'toask') tag = 'BEING CONFIRMED';
    else if (v.k === 'way') { tag = 'ON THE WAY'; tagCol = '#3A3F9B'; }
    else if (v.k === 'wait') tag = 'BEING BOUGHT';
    else if (v.k === 'short') tag = v.word.replace(/^SHORT · /, '');

    // A price the Manager changed shows what it was, struck, beside what it is.
    const r = it.priceReview || {}, was = !toc && v.k !== 'no' && priceReviewState(it) === 'changed' && Number(r.was) > 0 ? (Number(it.qty) || 0) * Number(r.was) : null;

    return { qty: qw.n, unit: qw.u, name: ordItemName(it), tag, tagCol, struck: v.k === 'no', was, amount: v.k === 'no' ? null : toc ? 'to price' : (Number(it.qty) || 0) * quoteItemSellPrice(it) };

  c.textAlign = 'left';

   A line the shop has no selling rule for says so -- never its cost. */
function custUsualRows(cid, usual){

  const key = (p, v) => `${p}|${v == null || v === '' ? '' : Number(v)}`;
  return usual.slice(0, 8).map(u => {
    const k = key(u.productId, u.variantIdx);
    const marks = last.map(o => (o.q.items || []).some(it => key(it.productId, it.variantIdx) === k));
    const it = makeLine(u.productId, u.variantIdx, u.qty);
    const confirm = !it || linePriceToConfirm(it);
    const unit = (it && it.unit) || stockUnitFor(u.productId, u.variantIdx).unit || '';
    return { u, marks, hits: marks.filter(Boolean).length, n, confirm, total: confirm ? 0 : Math.round(quoteItemSellPrice(it) * u.qty), unit };
  });
}

  const bytes = custStmtPdfBytes(st, side);

function phoneTwin(ph){ const d = phoneDigits(ph); if (d.length < 9) return null; return D().customers.find(c => [c.phone, c.phone2].some(p => p && phoneDigits(p) === d)) || null; }

/* ==================================================================

   ================================================================== */
ICON.nwgrid = '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>';

ICON.nwhistory = '<path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 4.5V9H8M12 8v4.5l3 1.8"/>';

const NW = { delta: null, find: null, sent: {}, focusQ: false };

/* ---------------- drafts: the one open, and the ones kept ---------------- */
function draftKey(){ return shopScoped('ow-sales-draft:' + (S.user && S.user.id)); }
function nwDraftsKey(){ return shopScoped('ow-sales-drafts:' + (S.user && S.user.id)); }
function nwKey(){ return 'd' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
function saveDraft(){ try { if (S.draft) localStorage.setItem(draftKey(), JSON.stringify({ ...S.draft, q: '' })); else localStorage.removeItem(draftKey()); } catch (_e) {} }
function restoreDraft(){
  try { const d = JSON.parse(localStorage.getItem(draftKey())); if (d && d.client) S.draft = { openLine: null, lastAdded: null, credit: false, items: [], charges: [], pic: null, ...d, q: '' }; } catch (_e) {}
  if (S.draft && !S.draft.dkey) S.draft.dkey = nwKey();
}
function newDraft(c){ return { dkey: nwKey(), client: c ? { name: c.name, phone: c.phone || '' } : { name: 'Walk-in', phone: '' }, customerId: c ? c.id : null, items: [], charges: [], credit: false, creditWhy: null, pic: null, openLine: null, lastAdded: null, q: '' }; }
// One draft per person: the open order is never listed again beside itself, and a person's older copy gives way to the newer.
function nwWho(d){ if (!d) return ''; if (d.customerId != null && d.customerId !== '') return 'c:' + d.customerId; const ph = phone9(d.client && d.client.phone); return ph ? 'p:' + ph : 'k:' + d.dkey; }
function nwDraftsRaw(){ try { const a = JSON.parse(localStorage.getItem(nwDraftsKey())); return Array.isArray(a) ? a.filter(d => d && d.client && Array.isArray(d.items)) : []; } catch (_e) { return []; } }
function nwDrafts(){ const seen = new Set([S.draft && nwHasLines(S.draft) ? nwWho(S.draft) : '']); return nwDraftsRaw().filter(d => { const w = nwWho(d); if (seen.has(w) || (S.draft && d.dkey === S.draft.dkey)) return false; seen.add(w); return true; }); }
function nwSaveDrafts(a){ try { if (a.length) localStorage.setItem(nwDraftsKey(), JSON.stringify(a.slice(0, 20))); else localStorage.removeItem(nwDraftsKey()); } catch (_e) {} }
function nwHasLines(d){ return !!d && ((d.items || []).length > 0 || (d.charges || []).length > 0); }
// Kept, never lost: an order set aside goes to the drafts list on this phone.
function nwPark(d){ if (!nwHasLines(d)) return false; const w = nwWho(d); const a = nwDraftsRaw().filter(x => x.dkey !== d.dkey && nwWho(x) !== w); a.unshift({ ...d, q: '', openLine: null, fresh: null, savedAt: Date.now() }); nwSaveDrafts(a); return true; }
function nwUnpark(k){ const a = nwDraftsRaw(), d = a.find(x => x.dkey === k); nwSaveDrafts(a.filter(x => x.dkey !== k)); return d ? { openLine: null, lastAdded: null, charges: [], pic: null, ...d, q: '' } : null; }
function nwQuoteOf(d){ const pct = shopCreditPct(); return { items: d.items || [], charges: d.charges || [], discount: 0, credit: d.credit && pct > 0 ? { pct, days: custTermsDays(), agreedAt: todayISO() } : null }; }
function draftQuote(){ return nwQuoteOf(S.draft || newDraft(null)); }
function custTermsDays(){ return Math.max(0, Number(D().presetChaseAfterDays) || 0); }
function nwTotal(){ return S.draft ? pricedLive(draftQuote()).total : 0; }
// A total said honestly: nothing priced yet reads "to price", not "0 + ?".
// noConf: the caller says how many are to be confirmed on a line of its own (the order bar's second line).
// pricedView plus how many prices wait for the Manager (pricedView itself is copied word for word into manager.html).
function nwPv(q){ return { ...pricedLive(q), waiting: pricesWaiting(q).length }; }
function nwForWords(pv){ return [pv.waiting ? `${pv.waiting} for ${esc(mgrName())}` : '', pv.pending ? `${pv.pending} to confirm` : ''].filter(Boolean).join(' · '); }
function nwMoney(pv, noConf){ const w = noConf ? '' : nwForWords(pv), conf = w ? `<span class="nw-amb nw-pconf"> · ${w}</span>` : ''; return pv.total > 0 || !pv.toConfirm ? `<span class="m">${n0(pv.total)}</span>${pv.toConfirm ? ' + ?' : ''}${conf}` : '<span class="nw-amb">to price</span>'; }

/* ---------------- words ---------------- */
function lineQtyWords(it){
  const pq = Number(it.packQty) || 0;
  if (it.qtyIn === 'pack' && pq > 0 && it.packUnit) { const n = (Number(it.qty) || 0) / pq; return { n: Math.round(n * 100) / 100, u: it.packUnit }; }
  return { n: Number(it.qty) || 0, u: it.unit || '' };
}
function nwPlural(w, n){ w = String(w || ''); if (!w || n === 1) return w; if (/(s|x|z|ch|sh)$/i.test(w)) return w + 'es'; if (/[^aeiou]y$/i.test(w)) return w.slice(0, -1) + 'ies'; return w + 's'; }
function nwNum(n){ return qtyText(n); }
function nwPer(unit){ return unit ? 'a ' + unit : 'each'; }
function nwOrdinal(n){ const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function nwAbbr(u){ return String(u || '').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase(); }
function nwRateWords(rate, unit){ const u = unit || 'unit'; rate = Number(rate) || 0; if (!(rate > 0)) return ''; return rate >= 1 ? `${nwNum(rate)} ${nwPer(u)}` : `1 per ${Math.round(1 / rate)} ${nwPlural(u, 2)}`; }
function nwList(names){ const a = [...new Set(names)]; if (a.length <= 1) return a.join(''); if (a.length === 2) return a[0] + ' and ' + a[1]; return a.slice(0, 2).join(', ') + ' and ' + (a.length - 2) + ' more'; }
// A product's own name today, not the name a past line was saved with.
function nwName(pid, vi, fallback){ const p = productById(pid); return nameParts(pid, vi, p ? productVariantLabel(p, vi == null || vi === '' ? null : Number(vi)) : fallback); }
function nwLineKey(it){ return it.productId + '|' + (it.variantIdx == null ? '' : it.variantIdx); }

// A link that names no variant of a product that has them is on the order once any of its variants is.
function onOrder(pid, vi){ const p = productById(pid), any = vi == null && p && Array.isArray(p.variants) && p.variants.length; return !!S.draft && S.draft.items.some(it => it.productId === pid && (any || (it.variantIdx == null ? null : Number(it.variantIdx)) === (vi == null ? null : Number(vi)))); }
function nextLineId(){ return (S.draft.items.reduce((m, it) => Math.max(m, Number(it.lineId) || 0), 0)) + 1; }

/* ---------------- who they are, in one line ---------------- */
// Cash or credit, as they bought last time (the order's frozen credit terms).
function nwHabit(cid){
  if (cid == null || cid === '') return null;
  const list = customerOrdersFor(cid).filter(q => !q.voided).sort((a, b) => (createdMs(b) || 0) - (createdMs(a) || 0));
  return list.length ? (creditTerms(list[0]) ? 'credit' : 'cash') : null;
}
function nwLastOrderMs(cid){ return customerOrdersFor(cid).filter(q => !q.voided).reduce((m, q) => Math.max(m, createdMs(q) || 0), 0); }
function nwAgoDays(ms){ if (!ms) return ''; const d = daysBetween(isoOf(ms), todayISO()); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; }
function nwOverdue(c){ try { return typeof custOverdue === 'function' ? !!custOverdue(c) : false; } catch (_e) { return false; } }
function nwSubOf(c, opts){
  const h = nwHabit(c.id), bits = [];
  if (c.location) bits.push(esc(c.location));
  // Someone who owes is never called "cash": their balance is the truer word.
  // How they usually buy, not terms they were given (SAL-11): the Manager gives credit.
  if (opts && opts.habit) { if (h === 'credit' || (h && c.debt > 0)) bits.push('usually on credit'); else if (h) bits.push('usually cash'); }
  else if (c.debt > 0) bits.push(`owes <span class="m">${opts && opts.full ? n0(c.debt) : short(c.debt)}</span>`);
  else if (opts && opts.full && !(custLimit(c) > 0)) bits.push('cash · <span style="color:var(--amberInk)">no credit limit</span>');
  else if (h) bits.push(h === 'credit' ? 'on credit' : 'cash');
  if (!bits.length && c.phone) bits.push(esc(c.phone));
  return bits.join(' · ');
}
// SAL-11: credit is the Manager's to give -- with no limit set, the order opens on Cash whatever they did last time.
function nwApplyHabit(d, c){ if (c && shopCreditPct() > 0 && nwHabit(c.id) === 'credit' && custLimit(c) > 0) { d.credit = true; d.creditWhy = 'habit'; } else { d.credit = false; d.creditWhy = null; } }
function nwConv(d){
  if (!d || !S.wa) return null;
  if (d.waConvId != null) { const v = S.wa.convs.find(x => String(x.id) === String(d.waConvId)); if (v) return v; }
  const c = d.customerId ? customerById(d.customerId) : null;
  return (c && waConvForCustomer(c)) || (d.client && d.client.phone ? waConvForPhone(d.client.phone) : null);
}
function nwPicPossible(d){ const v = nwConv(d); return !!v && typeof orderPictureBlob === 'function'; }
function nwPicOn(d){ const v = nwConv(d); if (!v || typeof orderPictureBlob !== 'function' || !waWindowInfo(v.last_inbound_at).open) return false; return d.pic == null ? true : !!d.pic; }
function nwAsks(){ try { return typeof waAsks === 'function' ? (waAsks() || []) : []; } catch (_e) { return []; } }
function nwAskFor(d){ return nwAsks().find(a => a && ((a.customer && d.customerId != null && String(a.customer.id) === String(d.customerId)) || (a.conv && d.waConvId != null && String(a.conv.id) === String(d.waConvId)))) || null; }

/* ---------------- starting an order ---------------- */
// The + always asks who it is for; an order already open is one tap away on that sheet.
ACT.neworder = () => openSheet('client', {});
// A counter sale opens its own screen (9c_counter.js); an order, this one.
function openOrderPage(){
  if (S.draft && S.draft.counter && typeof ctOpen === 'function') { ctOpen(); return; }
  closeSheet(true); renderSheet(); if (S.stack.some(p => p.type === 'placed' || p.type === 'counterdone')) S.stack = []; S.stack = S.stack.filter(p => p.type !== 'aisles' && p.type !== 'aisle' && p.type !== 'counter'); const top = S.stack[S.stack.length - 1]; if (top && top.type === 'neworder') render(); else push('neworder');
}
/* mode: true keeps the open order when it is already theirs; 'move' carries
   its lines over; anything else starts clean -- an open order with lines is
   kept in Drafts first, never dropped. */
function startFor(c, usual, mode, opts){
  const prev = S.draft, same = !!prev && String(prev.customerId == null ? '' : prev.customerId) === String(c ? c.id : '');
  if (prev && same && mode === true) {
    if (usual && c) usualLines(c.id).forEach(u => { if (!onOrder(u.productId, u.variantIdx)) addLine(u.productId, u.variantIdx, u.qty, 'unit', true); });
    saveDraft(); if (!(opts && opts.noOpen)) openOrderPage(); return S.draft;
  }
  let items = [], charges = [];
  if (prev && mode === 'move') { items = prev.items || []; charges = prev.charges || []; }
  else if (nwPark(prev)) toast(`${firstWord(prev.client && prev.client.name) || 'The'}’s order is kept in Drafts`);
  S.draft = { ...newDraft(c), items, charges };
  nwApplyHabit(S.draft, c);
  if (usual && c) usualLines(c.id).forEach(u => { if (!onOrder(u.productId, u.variantIdx)) addLine(u.productId, u.variantIdx, u.qty, 'unit', true); });
  NW.find = null; saveDraft();
  if (!(opts && opts.noOpen)) openOrderPage();
  return S.draft;
}
ACT.sellto = t => {
  const c = customerById(t.dataset.id); if (!c) return;
  const usual = !!t.dataset.usual;
  if (S.draft && nwHasLines(S.draft) && String(S.draft.customerId) !== String(c.id)) { openSheet('switch', { sel: c.id, usual }); return; }
  startFor(c, usual, true);
};
ACT.pickclient = t => {
  const c = customerById(t.dataset.id); if (!c) return;
  const same = S.draft && String(S.draft.customerId) === String(c.id);
  startFor(c, !!t.dataset.usual, same ? true : false);
};
ACT.pickwalkin = () => { if (S.draft && !nwHasLines(S.draft)) { S.draft = { ...newDraft(null), dkey: S.draft.dkey }; } else { if (nwPark(S.draft)) toast(`${firstWord(S.draft.client.name) || 'The'}’s order is kept in Drafts`); S.draft = newDraft(null); } saveDraft(); openOrderPage(); };
ACT.changeclient = () => openSheet('switch', {});
ACT.nwcarry = () => openOrderPage();
ACT.nwresume = t => {
  const k = t.dataset.k; if (S.draft && S.draft.dkey === k) { openOrderPage(); return; }
  const d = nwUnpark(k); if (!d) return;
  if (nwPark(S.draft)) toast(`${firstWord(S.draft.client.name) || 'The'}’s order is kept in Drafts`);
  S.draft = d; NW.find = null; saveDraft(); openOrderPage();
};
ACT.nwdropdraft = t => {
  const a = S.sheet && S.sheet.args, k = t.dataset.k; if (!a) return;
  if (a.confirm !== k) { a.confirm = k; renderSheet(); return; }
  nwSaveDrafts(nwDraftsRaw().filter(x => x.dkey !== k)); a.confirm = null; haptic('light'); renderSheet(); toast('Draft removed');
};

/* ---------------- who is it for (ClientPick) ---------------- */
SHEET.client = args => {
  const drafts = nwDrafts(), ctN = typeof ctToday === 'function' ? ctToday().length : 0;
  return `<div class="nw-chead">
      <div class="nw-row"><span class="nw-ttl"><span class="sx-eyebrow">New sale</span><b>Who is it for?</b></span>${drafts.length ? `<button class="ct-drafts" data-act="nwdrafts" aria-pressed="${!!args.drafts}">${ic('nwhistory', 14)}Drafts <span class="m">${drafts.length}</span></button>` : ''}<button class="sx-circle" data-act="closesheet" aria-label="Close">${ic('close', 16, 'style="stroke-width:2.2"')}</button></div>
      <div class="nw-row"><label class="nw-csearch">${ic('search', 20, 'style="stroke:#1C2233"')}<input data-in="clientq" type="search" placeholder="Name, phone or place" aria-label="Customer name, phone or place" autocomplete="off" value="${esc(args.q || '')}"></label>
        <button class="nw-addc" data-act="addcust" data-for="order" aria-label="New customer">${ic('nwadd', 22, 'style="stroke:#fff"')}</button></div>
      <div class="ct-doors"><button class="ct-door mint" data-act="counterstart" aria-label="Counter sale: pay and go, from the shelf${ctN ? ` · ${ctN} today` : ''}"><span class="ico">${ic('cash', 16, 'style="stroke-width:1.9"')}</span><b>Counter sale</b>${ctN ? `<span class="m n">${ctN}</span>` : ''}</button>

      <button class="sx-btn red" data-act="takeorder" data-conv="${c.id}">Take ${esc(first === 'They' ? 'their' : first + '’s')} order${ic('chArrow', 18, 'style="stroke-width:2.4"')}</button>
      <span class="cht-wnote">Opens a new order for ${esc(first === 'They' ? 'them' : first)} · you add what they asked for</span></div>` : '';
  // They say they paid: the figure they name is a pre-fill to check against the money, never a record.
  const paidAmt = msgAmount(a.text);
  const paidCard = cust && a.reads.some(r => r.key === 'paid') ? `<div class="cht-paid"><span class="cht-wico" style="background:var(--skySoft);color:var(--sky)">${ic('cash', 16)}</span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><b style="font-size:14px">${esc(first)} says they paid</b><span class="sx-sub">${paidAmt ? `<span class="m">${n0(paidAmt)}</span> · ` : ''}check, then record</span></span><button class="tdy-cta p" style="border:none" data-act="tdyrecord" data-id="${esc(cust.id)}" data-amt="${paidAmt}" data-m="${chatPaidHow(a.text)}">Record</button></div>` : '';
  // A suggestion only while they are waiting on the shop's answer.
  const sugg = msgs.length && msgs[msgs.length - 1].direction === 'in' ? chatSuggest(c, a, cust) : '';
  const orders = cust ? customerOrdersFor(cust.id) : [];
  // An order is one tap away in any chat, not only when the words read as an ask.
  const chips = [!card ? `<button class="cht-pill" data-act="takeorder" data-conv="${c.id}">${ic('chCart', 14)}Start an order</button>` : '', sugg ? `<button class="cht-pill" data-act="chatsuggest" data-conv="${c.id}" title="${esc(sugg)}">${ic('chSpark', 14, 'style="stroke:var(--green);stroke-width:2"')}<span class="ell" style="max-width:220px">${esc(sugg)}</span></button>` : '',
    cust && typeof openStatement === 'function' ? `<button class="cht-pill" data-act="chatstmt" data-id="${esc(cust.id)}">${ic('chDoc', 14)}Statement</button>` : '',
    orders.length ? `<button class="cht-pill" data-act="chatorders" data-id="${esc(cust.id)}">${ic('orders', 14)}Their orders · ${orders.length}</button>` : ''].filter(Boolean);
  const win = waWindowInfo(c.last_inbound_at), draft = S.chatDraft[c.id] || '', pic = S.chatPic[c.id], stop = !!c.opt_out;
  const canSend = chatCanSend(c, draft, pic);
  // A shut window is no longer a dead end: the reply goes inside the shop's approved reply message.
  const ago = c.last_inbound_at ? chatWait((Date.now() - Date.parse(c.last_inbound_at)) / 60000) : '';
  const shut = stop ? `<div class="cht-shut bad">${ic('lock', 15)}<span style="flex:1;min-width:0">They asked the shop to stop messaging them</span></div>`
    : !win.open ? `<div class="cht-shut">${chatClosedDial()}<span class="cht-shutx"><b>${ago ? `Chat closed · they wrote ${esc(ago)} ago` : 'They haven’t written to the shop yet'}</b><span>Your reply goes as the shop’s reply message</span></span></div>` : '';
  const picRow = pic ? `<div class="cht-picrow"><img src="${esc(pic.url)}" alt=""><span style="flex:1;min-width:0;display:flex;flex-direction:column"><b style="font-size:13px">${win.open ? 'Picture ready' : 'Pictures go only while the chat is open'}</b><span class="sx-sub">${!win.open ? 'Remove it to send the words' : draft.trim() ? 'The message goes with it' : 'Tap send to share it'}</span></span><button class="sx-circle light" data-act="chatpicx" data-conv="${c.id}" aria-label="Remove the picture" style="width:34px;height:34px">${ic('close', 14)}</button></div>` : '';
  return `<div class="cht-page">
    <div class="cht-bar"><button class="cht-back" data-act="back" aria-label="Back to chats">${ic('back', 22, 'style="stroke-width:2"')}</button>
      ${cust ? `<button class="cht-who" data-act="customer" data-id="${esc(cust.id)}">${who}</button>` : `<span class="cht-who">${who}</span>`}
      ${cust ? '' : `<button class="cht-save" data-act="chatsave" data-conv="${c.id}" aria-label="Save +${esc(c.wa_id)} as a customer">${ic('useradd', 16)}Save</button>`}
      <a class="cht-call" href="tel:+${esc(c.wa_id)}" aria-label="Call ${esc(title)}">${ic('phone', 19)}</a></div>
    <div class="cht-thread">${thread}
      <div class="cht-foot">${card}${paidCard}${chips.length ? `<div class="cht-pills">${chips.join('')}</div>` : ''}</div></div>
    <div class="cht-comp">${shut}${picRow}<div class="cht-crow">
      <button class="cht-plus${stop ? ' off' : ''}" data-act="chatadd" data-conv="${c.id}" aria-label="Send a photo, a price or the catalogue" ${stop ? 'disabled' : ''}>${ic('plus', 20)}</button>
      <label class="cht-field"><textarea id="cht_msg" rows="1" data-in="chatdraft" data-conv="${c.id}" aria-label="Message" placeholder="${stop ? 'They asked not to be messaged' : win.open ? `Message · ${win.hoursLeft}h left to reply` : 'Reply'}" autocomplete="off" ${stop ? 'disabled' : ''}>${esc(draft)}</textarea></label>
      <button class="cht-send" data-act="chatsend" data-conv="${c.id}" aria-label="${win.open ? 'Send' : 'Send as the shop’s reply message'}" ${canSend ? '' : 'disabled'}>${ic('chSend', 19, 'style="stroke-width:2"')}</button></div></div>
  </div>`;
};
// The 24 hours, drawn: empty once they have run out.
function chatClosedDial(){ return `<span class="cht-dial" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10.5" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2.5"/><path d="M13 8v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>`; }
function chatCanSend(c, draft, pic){
  if (!c || c.opt_out) return false;
  if (pic) return waWindowInfo(c.last_inbound_at).open;
  return !!String(draft || '').trim();
}
PAGE.chat.bg = '#EFEAE2';

/* A reply the salesperson may send, in the shop's own figures: the
   selling price where the shop has decided one, never a cost. */
function chatSuggest(c, a, cust){
  if (!a.last) return '';
  const name = firstWord(cust ? cust.name : c.profile_name);
  // They want to buy: a thank-you while the order is put together. Prices go on the order picture, not guessed from their words.
  if (a.ask) return `${name ? 'Hello ' + name + ', thank' : 'Thank'} you — I’m putting your order together now and will send it with the prices.`;
  if (a.reads.some(r => r.key === 'paid')) return `Thank you${name ? ' ' + name : ''} — we’re checking it now and will send your receipt.`;
  return '';
}
ACT.chatsuggest = t => {
  const c = chatConvById(t.dataset.conv); if (!c) return;
  const text = chatSuggest(c, chatAbout(c, chatThread(c.id)), chatCust(c.wa_id)); if (!text) return;
  S.chatDraft[c.id] = text; haptic('light');
  // The composer keeps focus across draws, so the suggestion is written into it by hand.
  const i = document.getElementById('cht_msg'); if (i) i.value = text;
  render();
  if (i) { i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch (_e) {} chatFit(); }
};
ACT['in:chatdraft'] = t => {
  S.chatDraft[t.dataset.conv] = t.value; chatFit();
  const page = t.closest('.sx-page'), b = page && page.querySelector('.cht-send'), c = chatConvById(t.dataset.conv);
  if (b && c) b.disabled = !chatCanSend(c, t.value, S.chatPic[c.id]);
};
ACT['ch:chatpic'] = t => {
  const f = t.files && t.files[0]; if (!f) return;
  if (!/^image\//.test(f.type || '')) { toast('That isn’t a picture'); return; }
  const old = S.chatPic[t.dataset.conv]; if (old && old.url) try { URL.revokeObjectURL(old.url); } catch (_e) {}
  S.chatPic[t.dataset.conv] = { file: f, url: URL.createObjectURL(f) };
  if (S.sheet && S.sheet.type === 'chatadd') closeSheet(true);
  renderSheet(); render();
};
ACT.chatpicx = t => { const p = S.chatPic[t.dataset.conv]; if (p && p.url) try { URL.revokeObjectURL(p.url); } catch (_e) {} delete S.chatPic[t.dataset.conv]; render(); };
/* Send: the message is in the thread at once, the composer is free for
   the next one, and the server's answer settles it -- a tick, or the
   reason it did not go, with Try again. Words after the window has shut
   go inside the shop's reply message; a picture cannot. */
ACT.chatsend = t => {
  const id = Number(t.dataset.conv), c = chatConvById(id); if (!c) return;
  const box = document.getElementById('cht_msg'), text = String((box ? box.value : S.chatDraft[id]) || '').trim(), pic = S.chatPic[id];
  if (!chatCanSend(c, text, pic)) return;
  const item = { key: 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), conv: id, text, pic: pic || null, kind: chatKind(c, pic), state: 'sending', err: '' };
  (S.chatOut[id] = S.chatOut[id] || []).push(item);
  S.chatDraft[id] = ''; delete S.chatPic[id]; if (box) box.value = '';
  S.chatSeen[id] = -1; haptic('light');
  render(); chatDeliver(item);
};
function chatKind(c, pic){ return waWindowInfo(c.last_inbound_at).open ? (pic ? 'image' : 'text') : 'template'; }
function chatWhyNot(e, kind){
  const m = String((e && e.message) || e || '');
  if (isNetworkError(e)) return 'No connection — it will go when you try again';
  if (waNeedsUpdate(e)) return kind === 'template' ? 'Replying to a closed chat needs the server update — ask the owner' : 'The server needs an update — ask the owner';
  if (/window is closed/i.test(m)) return 'The chat closed — Try again sends it as the shop’s reply message';
  if (/not connected/i.test(m)) return 'The shop’s WhatsApp number isn’t connected — ask the owner';
  return m || 'WhatsApp refused it';
}
async function chatDeliver(item){
  item.state = 'sending'; item.err = '';
  try {
    if (item.kind === 'image') await waSendImage(item.conv, item.pic.file, item.text);
    else if (item.kind === 'template') { const c = chatConvById(item.conv), cu = c && chatCust(c.wa_id); await waSendReplyTemplate(item.conv, item.text, firstWord(cu ? cu.name : (c && c.profile_name) || '')); }
    else if (item.kind === 'catalog') await waSendCatalog(item.conv);
    else await waSendText(item.conv, item.text);
    S.chatOut[item.conv] = (S.chatOut[item.conv] || []).filter(x => x !== item);
    if (item.pic) try { URL.revokeObjectURL(item.pic.url); } catch (_e) {}
    haptic('success');
  } catch (e) { item.state = 'failed'; item.err = chatWhyNot(e, item.kind); }
  render();
}
function chatOutItem(t){ return (S.chatOut[t.dataset.conv] || []).find(x => x.key === t.dataset.k) || null; }
ACT.chatresend = t => {
  const o = chatOutItem(t), c = o && chatConvById(o.conv); if (!o || !c || o.state === 'sending') return;
  // The window may have shut, or opened, since: the road is chosen again.
  if (o.kind !== 'catalog') {
    const k = chatKind(c, o.pic);
    if (k === 'template' && o.pic) { o.err = 'Pictures go only while the chat is open — take it back and send the words'; render(); return; }
    o.kind = k;
  } else if (!waWindowInfo(c.last_inbound_at).open) { o.err = 'The catalogue goes only while the chat is open'; render(); return; }
  o.state = 'sending'; render(); chatDeliver(o);
};
// Take a failed message back into the composer, to change it or drop it.
ACT.chatedit = t => {
  const o = chatOutItem(t); if (!o) return;
  const id = o.conv; S.chatOut[id] = (S.chatOut[id] || []).filter(x => x !== o);
  if (o.kind !== 'catalog') { S.chatDraft[id] = o.text; if (o.pic) S.chatPic[id] = o.pic; const box = document.getElementById('cht_msg'); if (box) box.value = o.text; }
  render(); chatFocus();
};
function chatFocus(){ setTimeout(() => { const i = document.getElementById('cht_msg'); if (i && !i.disabled) { i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch (_e) {} chatFit(); } }, 60); }

/* ---------------- the + : a photo, a price, the catalogue, a quick reply ---------------- */
const CH_QUICK = ['Yes, we have it in stock.', 'Let me check and come back to you shortly.', 'Thank you, we have received your payment.', 'Your order is on the way.', 'Please send your location for the delivery.', 'Thank you for your order!'];
ACT.chatadd = t => openSheet('chatadd', { conv: Number(t.dataset.conv) });
SHEET.chatadd = ({ conv }) => {

    <div class="cht-atg">

      ${tile('', 'chTag', ['var(--greenSoft)', 'var(--green)'], 'A price', 'From the price list', false, `data-act="chatprodopen" data-conv="${conv}"`)}
      ${tile('', 'chCart', ['var(--indigoSoft)', 'var(--indigo)'], 'Catalogue', open ? 'To browse and cart' : 'Chat open only', !open, `data-act="chatcat" data-conv="${conv}"`)}
      ${cust && typeof openStatement === 'function' ? tile('', 'chDoc', ['var(--plumSoft)', 'var(--plum)'], 'Statement', cust.debt > 0 ? 'Owes ' + short(cust.debt) : 'Their account', false, `data-act="chatstmt" data-id="${esc(cust.id)}"`) : ''}
    </div>

};
// A quick reply or a price is written into the composer, never sent by itself.
function chatAppend(id, line){
  const cur = String(S.chatDraft[id] || '').replace(/\s+$/, '');
  S.chatDraft[id] = cur ? cur + '\n' + line : line;
  const box = document.getElementById('cht_msg'); if (box) box.value = S.chatDraft[id];
}
ACT.chatquick = t => { const id = Number(t.dataset.conv); chatAppend(id, CH_QUICK[Number(t.dataset.i)]); haptic('light'); closeSheet(true); renderSheet(); render(); chatFocus(); };
ACT.chatcat = t => {
  const id = Number(t.dataset.conv), c = chatConvById(id); if (!c || !waWindowInfo(c.last_inbound_at).open) return;
  closeSheet(true); renderSheet();
  const item = { key: 'o' + Date.now().toString(36), conv: id, text: '', pic: null, kind: 'catalog', state: 'sending', err: '' };
  (S.chatOut[id] = S.chatOut[id] || []).push(item); S.chatSeen[id] = -1; haptic('light');
  render(); chatDeliver(item);
};
/* A price from the shop's own list: the selling price where the shop has
   one, "price to confirm" where it has not -- never a cost. Priced at the
   quantity they asked for, so a bulk ask gets the bulk price. */
function chatPriceLine(pid, vi, qty){
  const p = productById(pid); if (!p) return null;
  const n = Number(qty) > 1 ? Number(qty) : 1;
  const label = productVariantLabel(p, vi), ln = makeLine(pid, vi, n), say = (n > 1 ? n0(n) + ' ' : '') + String(label).replace(' — ', ' ');
  if (!ln || linePriceToConfirm(ln)) return { label, price: null, unit: ln && ln.unit, qty: n, text: `${say}: price to confirm` };
  const each = Math.round(quoteItemSellPrice(ln));
  return { label, price: each, unit: ln.unit, qty: n, text: `${say}: ${n0(each)}${ln.unit ? ' a ' + ln.unit : ' each'}` };
}
ACT.chatprodopen = t => openSheet('chatprod', { conv: Number(t.dataset.conv), q: '', added: [] });
SHEET.chatprod = a => {
  const n = a.added.length;
  return `<div style="display:flex;align-items:center;gap:10px"><b style="flex:1;font-size:18px">Send a price</b><button class="sx-circle light" data-act="closesheet" aria-label="Close">${ic('close', 15)}</button></div>
    <label class="sx-search">${ic('search', 20, 'style="stroke:#767F91"')}<input data-in="chatprodq" type="search" placeholder="Cement, iron sheets…" autocomplete="off" value="${esc(a.q || '')}"></label>
    <div id="cht_prodlist">${chatProdListHTML(a)}</div>
    <button class="sx-btn ${n ? 'navy' : 'ghost'}" data-act="chatproddone">${n ? `${ic('tick', 17)}Done · ${n} in the message` : 'Back to the chat'}</button>`;
};
function chatProdListHTML(a){
  const c = chatConvById(a.conv), cust = c && chatCust(c.wa_id), q = String(a.q || '').trim();
  let picks = [], cap = '';
  if (q) { picks = [].concat(...nwSearch(q).groups.map(g => g.hits.map(h => ({ pid: h.p.id, vi: h.vi })))).slice(0, 24); }
  else if (c) {
    const asked = chatAbout(c, chatThread(c.id)).items.map(it => ({ pid: it.productId, vi: it.variantIdx, qty: it.qtySaid ? it.qty : 1 }));

}
ACT['in:chatprodq'] = t => { S.sheet.args.q = t.value; const el = document.getElementById('cht_prodlist'); if (el) morph(el, chatProdListHTML(S.sheet.args)); };

ACT.chatproddone = () => { closeSheet(true); renderSheet(); render(); chatFocus(); };

/* ---------------- a customer's picture, voice note, document ---------------- */
function chatMsgById(id){ const conv = chatOpenId(); return ((conv != null && S.wa.threads[conv]) || []).find(m => m.id === id) || S.wa.msgs.find(m => m.id === id) || null; }
ACT.chatmedia = async t => {
  const id = Number(t.dataset.mid), m = chatMsgById(id); if (!m) return;
  if (S.wa.media[id] && S.wa.media[id].state === 'err') delete S.wa.media[id];
  const p = waMedia(id); render();
  const st = await p; render();
  if (st.state !== 'ok') return;
  if (m.msg_type === 'document') window.open(st.url, '_blank');
  else if (m.msg_type === 'audio') { const el = document.querySelector(`.cht-aud[data-mid="${id}"]`); if (el && el.play) el.play().catch(() => {}); }
};
ACT.chatview = t => { const st = S.wa.media[Number(t.dataset.mid)], m = chatMsgById(Number(t.dataset.mid)), url = (m && m.payload && (m.payload.link || m.payload.media_link)) || (st && st.url); if (url) openSheet('chatview', { url, cap: m ? chatCaption(m) : '' }); };
SHEET.chatview = ({ url, cap }) => `<div style="display:flex;align-items:center;gap:10px"><b style="flex:1;font-size:16px" class="ell">${esc(cap || 'Picture')}</b><button class="sx-circle light" data-act="closesheet" aria-label="Close">${ic('close', 15)}</button></div><img class="cht-full" src="${esc(url)}" alt="Picture">`;
// Pictures open by themselves, newest first, a few at a time; voice notes and files wait for a tap.
let chatAutoBusy = false;
function chatAutoMedia(id){
  if (chatAutoBusy) return;
  const want = chatThread(id).filter(m => (m.msg_type === 'image' || m.msg_type === 'sticker') && !(m.payload && (m.payload.link || m.payload.media_link)) && chatMediaId(m) && !S.wa.media[m.id]).slice(-12).reverse();
  if (!want.length) return;
  chatAutoBusy = true;
  (async () => { try { for (const m of want) { if (chatOpenId() !== id) break; await waMedia(m.id); if (chatOpenId() === id) render(); } } finally { chatAutoBusy = false; } })();
}
ACT.chatstmt = t => { if (typeof openStatement === 'function') openStatement(t.dataset.id); };
ACT.chatorders = t => openSheet('chatorders', { id: t.dataset.id });
SHEET.chatorders = ({ id }) => {

/* ---------------- today at the counter ---------------- */
function ctToday(){ const t = todayISO(); return D().savedQuotes.filter(q => q.counter && !q.voided && q.date === t); }
function ctTodayView(){
  const qs = ctToday(), paid = qs.filter(q => q.status === 'completed'), waiting = qs.filter(q => q.status !== 'completed');
  const sum = paid.reduce((s, q) => s + (Number(q.amountPaid) || 0), 0);
  // By the hour, from the first sale (at most the last eight hours).
  const now = new Date().getHours(), hrs = paid.map(q => new Date(createdMs(q)).getHours());
  const from = Math.max(now - 7, hrs.length ? Math.min(...hrs) : now), bars = [];
  for (let h = from; h <= now; h++) bars.push(paid.filter(q => new Date(createdMs(q)).getHours() === h).reduce((s, q) => s + (Number(q.amountPaid) || 0), 0));
  return { n: qs.length, sum, waiting, bars };
}
function ctBarsHTML(bars, h, last){
  const max = Math.max(1, ...bars);

}

/* ---------------- the shelf's best sellers ---------------- */
// What sells most over the counter, then most of all, then the most on
// the shelf: only what is on our shelf and has the shop's price.
function ctShelfPicks(){ return memo('ctpicks', '', ctShelfPicksNow); }
function ctShelfPicksNow(){
  const sold = nwSold(), cnt = {}, wk = {}, cand = [], since = isoOf(Date.now() - 6 * 864e5);
  D().savedQuotes.forEach(q => { if (!q.counter || q.voided) return; const thisWeek = String(q.date || '') >= since;
    (q.items || []).forEach(it => { const k = nwLineKey(it), n = Number(it.qty) || 0; cnt[k] = (cnt[k] || 0) + n; if (thisWeek) wk[k] = (wk[k] || 0) + n; }); });
  D().products.forEach(p => { (Array.isArray(p.variants) && p.variants.length ? p.variants.map((_, i) => i) : [null]).forEach(vi => {
    const st = shelfAvailable(p.id, vi); if (!(st > 0)) return;
    const k = p.id + '|' + (vi == null ? '' : vi); cand.push({ p, vi, st, k, a: cnt[k] || 0, b: sold[k] || 0, week: wk[k] || 0 }); }); });
  cand.sort((x, y) => y.a - x.a || y.b - x.b || y.st - x.st);
  const out = [];
  for (const c of cand) {
    if (out.length >= 5) break;
    const l = makeLine(c.p.id, c.vi, 1); if (!l || l.supplierId !== '__stock__' || linePriceToConfirm(l)) continue;
    const sell = quoteItemSellPrice(l); if (sell > 0) out.push({ ...c, unit: l.unit, sell });
  }
  return out;
}
function ctOnCounter(pid, vi){ return S.draft && S.draft.items.find(it => it.productId === pid && (it.variantIdx == null ? null : Number(it.variantIdx)) === (vi == null ? null : Number(vi))); }

function ctStockPill(x){ const low = x.st <= 10; return `<span class="ct-pill ${low ? 'low' : ''}"><span class="m">${nwNum(x.st)}</span> ${low ? 'left' : 'on shelf'}</span>`; }
function ctFeatureHTML(x){

    <span class="tx"><span class="eb">${ctRank(1)}<b>${x.a > 0 ? 'BEST SELLER' : 'ON THE SHELF'}</b></span><span class="nm">${esc(np.base)}${np.variant ? ` <small>· ${esc(np.variant)}</small>` : ''}</span>

}

function ctGivenChoices(total){

  return out.sort((a, b) => a - b);
}

/* On the payment's own page: ask, or where the ask is. */
function paRowHTML(txnId){
  if (D().payAsks == null || txnId == null || !paTxn(txnId)) return '';
  const a = paAskFor(txnId), acc = paAccountsName();
  if (a && a.status === 'sent') return `<div class="pa-row wait"><span class="pa-face">${esc(initials(paAccountsFull()))}</span><span class="tx"><b>Asked ${esc(acc)} · ${esc((PA_WHAT.find(x => x[0] === a.what) || [0, 'a fix'])[1].toLowerCase())}</b><span>${esc(paWantWords(a))} · waiting</span></span>${String(a.askedBy) === String(S.user && S.user.id) ? `<button data-act="paback" data-v="${esc(a.id)}">Take back</button>` : ''}</div>`;
  const done = a && (a.status === 'done' || a.status === 'declined') ? `<span class="pa-done ${a.status}">${a.status === 'done' ? ic('tick', 13, 'style="stroke-width:3"') : ''}${esc(a.decidedByName ? firstWord(a.decidedByName) : acc)} ${a.status === 'done' ? 'corrected it' : 'kept it as it was'}</span>` : '';
  return `${done}<button class="pa-wrong" data-act="payask" data-id="${esc(txnId)}">${ic('paSwap', 16)}Something wrong with this payment?</button>`;
}
ACT.payask = t => { const tx = paTxn(t.dataset.id); if (!tx) return; openSheet('payask', { id: tx.id, what: 'method', account: tx.account === 'cash' ? 'momo' : 'cash', amount: '', quoteId: undefined, date: tx.date, note: '' }); };
SHEET.payask = a => {
  const tx = paTxn(a.id); if (!tx) return '';
  const c = typeof payTxnCustomer === 'function' ? payTxnCustomer(tx) : null, q0 = tx.quoteId != null ? quoteById(tx.quoteId) : null;
  const who = (c && c.name) || (q0 && q0.client && q0.client.name) || 'A payment', acc = paAccountsName(), me = S.user && String(tx.enteredBy) === String(S.user.id);
  const by = me ? 'recorded by you' : (() => { const st = (D().staff || []).find(s => s.userId && String(s.userId) === String(tx.enteredBy)); return st ? 'recorded by ' + firstWord(st.name) : 'in the cash book'; })();
  const chip = (k, w) => `<button role="radio" aria-checked="${a.what === k}" data-act="pawhat" data-v="${k}">${w}</button>`;
  let body = '';
  if (a.what === 'method') {
    const day = moneyIn(tx.date, tx.date), sum = k => day.filter(x => x.account === k).reduce((s, x) => s + x.amount, 0), total = day.reduce((s, x) => s + x.amount, 0) || 1;
    const after = k => sum(k) + (k === a.account ? tx.amount : 0) - (k === tx.account ? tx.amount : 0);
    body = `<div class="pa-pair"><span class="pa-was">${esc(PA_ACCT[tx.account] || tx.account)}</span>${ic('chev', 16, 'style="stroke-width:2.4"')}<span class="pa-opts">${Object.keys(PA_ACCT).filter(k => k !== tx.account).map(k => `<button role="radio" aria-checked="${a.account === k}" data-act="paacct" data-v="${k}">${PA_ACCT[k]}</button>`).join('')}</span></div>
      <div class="pa-day"><span class="pa-lab"><span>MONEY IN ${tx.date === todayISO() ? 'TODAY' : 'THAT DAY'}</span><span>total stays <b class="m">${n0(total)}</b></span></span>
        ${[tx.account, a.account].map(k => { const b = sum(k), n = after(k); return `<span class="pa-acc"><span class="k">${PA_ACCT[k]}</span><span class="bar"><i style="width:${Math.round(b / total * 100)}%"></i><i class="n" style="width:${Math.round(n / total * 100)}%"></i></span><span class="m v"><s>${n0(b)}</s> ${n0(n)}</span></span>`; }).join('')}</div>`;
  } else if (a.what === 'amount') {
    const v = Number(String(a.amount || '').replace(/[^0-9]/g, '')) || 0;
    body = `<label class="pa-big"><span>It should be</span><span class="u">UGX</span><input class="m" data-in="paamt" inputmode="numeric" autocomplete="off" value="${v ? n0(v) : ''}" placeholder="${n0(tx.amount)}" aria-label="The right amount"></label>
      ${v ? `<span class="pa-delta">${v > tx.amount ? '+' : '−'}<span class="m">${n0(Math.abs(v - tx.amount))}</span> on ${esc(firstWord(who))}’s account</span>` : ''}`;
  } else if (a.what === 'bill') {
    const bills = c ? outstandingInvoices(c.id).filter(q => String(q.id) !== String(tx.quoteId)) : [];
    const opt = (id, label, sub) => `<button class="pa-bill${String(a.quoteId) === String(id) ? ' on' : ''}" data-act="pabill" data-v="${id == null ? '' : id}"><span class="tx"><b>${esc(label)}</b><small>${sub}</small></span>${String(a.quoteId) === String(id) ? ic('tick', 16, 'style="stroke-width:2.8"') : ''}</button>`;
    body = `<span class="pa-lab"><span>ON ${q0 ? (q0.invoiced ? invoiceLabel(q0) : 'ORDER ' + orderNo(q0)) : 'THEIR ACCOUNT'} NOW · IT SHOULD BE ON</span></span>
      <div class="pa-bills">${bills.slice(0, 5).map(q => opt(q.id, invoiceLabel(q), `<span class="m">${n0(balanceDue(q))}</span> left`)).join('')}${tx.quoteId != null ? opt(null, 'Their account', 'not tied to a bill') : ''}${!bills.length && tx.quoteId == null ? '<span class="pa-none">No other open bill to move it to</span>' : ''}</div>`;
  } else {
    body = `<label class="pa-big"><span>It came in on</span><input type="date" data-ch="padate" value="${esc(a.date || tx.date)}" max="${todayISO()}" aria-label="The right day"></label>`;
  }
  const ready = a.what === 'method' ? !!a.account : a.what === 'amount' ? (Number(String(a.amount || '').replace(/[^0-9]/g, '')) || 0) > 0 && Number(String(a.amount).replace(/[^0-9]/g, '')) !== Math.round(tx.amount)
    : a.what === 'bill' ? a.quoteId !== undefined : !!a.date && a.date !== tx.date;
  return `<div class="pa-head"><span class="pa-ico">${ic('paSwap', 22)}</span><span class="tx"><b>Correct a payment</b><span class="ell">${esc(who)} · ${esc(tx.date === todayISO() ? 'today' : dayLabel(tx.date))}${tx.time ? ' ' + esc(String(tx.time).slice(0, 5)) : ''}</span></span><button class="sx-circle light" data-act="closesheet" aria-label="Close">${ic('close', 15)}</button></div>
    <div class="pa-amt"><b class="m">${n0(tx.amount)}</b><span>${esc(PA_ACCT[tx.account] || tx.account)} · ${esc(by)}</span></div>
    <span class="pa-lab"><span>WHAT’S WRONG</span></span>
    <div class="pa-chips" role="radiogroup" aria-label="What is wrong">${PA_WHAT.map(([k, w]) => chip(k, w)).join('')}</div>
    ${body}
    <label class="pa-note">${ic('pen', 15)}<input data-in="panote" value="${esc(a.note || '')}" placeholder="A word for ${esc(acc)} · the slip number, who paid" aria-label="Note for ${esc(acc)}"></label>
    <button class="sx-btn red" data-act="pasend" ${ready && !S.paAsking ? '' : 'disabled'}>Send to ${esc(acc)}</button>
    <span class="pa-who"><span class="pa-face s">${esc(initials(paAccountsFull()))}</span>${esc(acc)}${acc === 'Accounts' ? '' : ', Accounts,'} corrects it${a.what === 'method' || a.what === 'day' ? ` · ${esc(firstWord(who))}’s bills stay paid` : ''}</span>`;
};
ACT.pawhat = t => { S.sheet.args.what = t.dataset.v; haptic('light'); renderSheet(); };
ACT.paacct = t => { S.sheet.args.account = t.dataset.v; haptic('light'); renderSheet(); };
ACT.pabill = t => { S.sheet.args.quoteId = t.dataset.v === '' ? null : Number(t.dataset.v); haptic('light'); renderSheet(); };
ACT['in:paamt'] = t => { const v = String(t.value).replace(/[^0-9]/g, ''); S.sheet.args.amount = v; const s = v ? n0(Number(v)) : ''; if (t.value !== s) t.value = s; const tx = paTxn(S.sheet.args.id), btn = document.querySelector('[data-act="pasend"]'); if (btn && tx) btn.disabled = !(Number(v) > 0) || Number(v) === Math.round(tx.amount); };
ACT['ch:padate'] = t => { if (t.value) { S.sheet.args.date = t.value; renderSheet(); } };
ACT['in:panote'] = t => { if (S.sheet) S.sheet.args.note = t.value; };
ACT.pasend = async () => {
  if (S.paAsking || !S.sheet || S.sheet.type !== 'payask') return;
  const a = S.sheet.args, tx = paTxn(a.id); if (!tx) return;
  const c = typeof payTxnCustomer === 'function' ? payTxnCustomer(tx) : null;
  const want = a.what === 'method' ? { from: tx.account, account: a.account } : a.what === 'amount' ? { amount: Number(String(a.amount).replace(/[^0-9]/g, '')) || 0 }
    : a.what === 'bill' ? { fromQuoteId: tx.quoteId, quoteId: a.quoteId == null ? null : a.quoteId } : { from: tx.date, date: a.date };
  const row = { shop_id: S.shopId, cash_txn_id: Number(tx.id), customer_id: c ? String(c.id) : null, quote_id: tx.quoteId == null ? null : Number(tx.quoteId), amount: Math.round(tx.amount),
    what: a.what, want, note: String(a.note || '').trim() || null, asked_by: S.user.id, asked_by_name: myName(), asked_role: S.role, status: 'sent' };
  S.paAsking = true; renderSheet();
  try {
    const r = await sb.from('payment_asks').insert(row).select().maybeSingle(); if (r.error) throw r.error;
    (D().payAsks ||= []).push(rowToPayAsk(r.data || { ...row, id: 'local-' + Date.now(), created_at: new Date().toISOString() })); S.loadedAt = Date.now(); saveSnapshot();
    S.paAsking = false; haptic('success'); closeSheet(); toast(`Sent to ${paAccountsName()} — nothing changes until they correct it`); render();
  } catch (e) {
    S.paAsking = false; renderSheet();
    const denied = e && (e.code === '42501' || /row-level security|permission/i.test(String(e.message || '')));
    toast(isNetworkError(e) ? 'No connection — nothing was sent' : denied || /payment_asks/.test(String(e.message || '')) ? 'Asking Accounts needs one update — the owner runs supabase/migrations/0130_counter_sale_and_payment_asks.sql' : 'Not sent: ' + (e.message || e), 7000);
  }
};
ACT.paback = async t => {
  if (S.paAsking) return; S.paAsking = true;
  try { const r = await sb.rpc('withdraw_payment_ask', { p_id: t.dataset.v }); if (r.error) throw r.error;
    const x = (D().payAsks || []).find(k => String(k.id) === String(t.dataset.v)); if (x) x.status = 'withdrawn'; saveSnapshot(); haptic('light'); toast('The ask is taken back'); }
  catch (e) { toast('Not taken back: ' + (e.message || e), 5000); }
  finally { S.paAsking = false; render(); }
};

boot();
</script>
</body>
</html>
