/* ==================================================================
   Taking a payment. The same path as the owner's recordCustomerPayment
   (index.html 65589): the money is spread over the customer's open
   bills oldest first -- each portion a cash receipt, a payment on the
   invoice and the invoice's debt brought back in line -- and whatever
   is left lowers the balance not tied to a bill. There is no RPC for
   this, so the rows are written one by one, each re-read first.
   ================================================================== */
const PAY_METHODS = [['cash', 'Cash', 'cash'], ['momo', 'Mobile money', 'momo'], ['bank', 'Bank', 'bank']];
function payPlan(c, amount){
  let left = Math.max(0, Math.round(Number(amount) || 0));
  const bills = outstandingInvoices(c.id).map(q => { const due = balanceDue(q), pay = Math.min(left, due); left -= pay; return { q, due, pay }; });
  const loose = Math.max(0, c.debt - bills.reduce((s, b) => s + b.due, 0));
  return { bills, rest: left, loose, over: Math.max(0, left - loose) };
}
ACT.pay = t => { const c = customerById(t.dataset.id); if (!c) return; closeSheet(true); renderSheet(); push('pay', { id: c.id, amt: c.debt, method: 'cash' }); };
PAGE.pay = args => {
  const c = customerById(args.id); if (!c) return '';
  const quick = [[c.debt, 'All they owe']].concat(outstandingInvoices(c.id).slice(0, 2).map(q => [balanceDue(q), invoiceLabel(q)])).filter((x, i, a) => x[0] > 0 && a.findIndex(y => y[0] === x[0]) === i);
  return `<div class="sx-hero" data-navy-top style="border-radius:0 0 26px 26px">
    <div style="display:flex;align-items:center;gap:12px"><button class="sx-circle" data-act="back" aria-label="Back">${ic('back', 18)}</button>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column"><span class="sx-eyebrow">Take payment</span><span class="ell" style="font-size:17px;font-weight:700">${esc(c.name)}</span></span>
      <span style="display:flex;flex-direction:column;align-items:flex-end"><span style="font-size:11px;font-weight:600;color:var(--navyInk2)">owes</span><span class="m" style="font-size:15px;font-weight:600">${n0(c.debt)}</span></span></div>
    <label style="display:flex;flex-direction:column;align-items:center;gap:4px"><span class="sx-eyebrow" style="color:var(--mint)">Amount received</span>
      <input id="sx_payamt" data-in="payamt" inputmode="numeric" aria-label="Amount received" value="${args.amt ? n0(args.amt) : ''}" placeholder="0" style="width:100%;border:none;background:transparent;color:#fff;text-align:center;font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:-.03em;outline:none;padding:0"></label>
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">${quick.map(x => `<button data-act="payquick" data-v="${x[0]}" style="height:32px;padding:0 12px;border:none;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-size:12px;font-weight:700">${esc(x[1])} · <span class="m">${short(x[0])}</span></button>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px" role="radiogroup" aria-label="How they paid">${PAY_METHODS.map(m => `<button data-act="paymethod" data-m="${m[0]}" role="radio" aria-checked="${args.method === m[0]}" style="height:64px;border:none;border-radius:16px;${args.method === m[0] ? 'background:#fff;color:var(--navy)' : 'background:rgba(255,255,255,.06);color:var(--navyInk);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700">${ic(m[2], 22)}${m[1]}</button>`).join('')}</div>
  </div>
  <div class="sx-body"><div id="sx_alloc">${allocHTML(c, args.amt)}</div><div style="height:90px"></div></div>
  <div class="sx-dock"><div id="sx_payslide">${sliderHTML('pay', args.amt > 0 ? 'Slide to record ' + n0(args.amt) : 'Type the amount', { money: true, disabled: !(args.amt > 0) || S.paying })}</div></div>`;
};
function allocHTML(c, amt){
  const plan = payPlan(c, amt);
  if (!(amt > 0)) return `<div class="sx-card sx-empty">Type what ${esc(firstWord(c.name))} handed over.</div>`;
  const row = (label, sub, due, pay) => `<div class="sx-pl" style="grid-template-columns:auto 1fr auto"><span style="width:26px;height:26px;border-radius:999px;background:${pay >= due && due > 0 ? 'var(--green)' : pay > 0 ? 'var(--greenSoft)' : 'var(--soft)'};color:${pay >= due ? '#fff' : 'var(--green)'};display:flex;align-items:center;justify-content:center">${pay > 0 ? ic('tick', 13, 'style="stroke-width:3"') : ''}</span>
    <span style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="display:flex;justify-content:space-between;gap:6px"><span class="ell" style="font-size:13px;font-weight:700">${esc(label)}</span><span class="sx-sub">${esc(sub)}</span></span><span style="height:6px;border-radius:9px;background:var(--soft2);overflow:hidden;display:block"><span style="display:block;height:100%;width:${due > 0 ? Math.round(pay / due * 100) : 0}%;background:var(--green);transition:width .3s"></span></span></span>
    <span style="display:flex;flex-direction:column;align-items:flex-end"><span class="m" style="font-size:14px;font-weight:600;color:${pay > 0 ? 'var(--green)' : 'var(--ink3)'}">${pay > 0 ? n0(pay) : '—'}</span><span class="m" style="font-size:10px;color:var(--ink3)">of ${n0(due)}</span></span></div>`;
  const looseRow = plan.loose > 0 ? row('Balance not on a bill', '', plan.loose, Math.min(plan.rest, plan.loose)) : '';
  const after = Math.max(0, c.debt - Math.min(amt, c.debt));
  return `<div class="sx-paper"><div class="sx-paper-in"><div class="sx-paper-h"><span class="t">GOES TO</span><span style="font-size:12px;font-weight:600;color:var(--ink3)">oldest first</span></div>
    ${plan.bills.map(b => row(invoiceLabel(b.q), `${daysBetween(b.q.invoicedAt || b.q.date, todayISO())} days`, b.due, b.pay)).join('')}${looseRow}
    <div class="sx-paper-f"><span style="font-size:13px;font-weight:700">Owes after</span><span class="m" style="font-size:17px;font-weight:600;color:${after === 0 ? 'var(--green)' : 'var(--ink)'}">${n0(after)}</span></div></div></div>
    ${plan.over > 0 ? `<div style="margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--amberSoft);color:var(--amberInk);font-size:12px;font-weight:600">${n0(plan.over)} more than they owe. It is recorded as money in; their balance stops at 0.</div>` : ''}`;
}
function payArgs(){ return S.stack[S.stack.length - 1].args; }
function refreshPay(){
  const a = payArgs(), c = customerById(a.id);
  const al = document.getElementById('sx_alloc'); if (al) al.innerHTML = allocHTML(c, a.amt);
  const sl = document.getElementById('sx_payslide'); if (sl) { sl.innerHTML = sliderHTML('pay', a.amt > 0 ? 'Slide to record ' + n0(a.amt) : 'Type the amount', { money: true, disabled: !(a.amt > 0) || S.paying }); bindSliders(); }
}
ACT['in:payamt'] = t => { const v = Number(String(t.value).replace(/[^0-9]/g, '')) || 0; payArgs().amt = v; const s = v ? n0(v) : ''; if (t.value !== s) t.value = s; refreshPay(); };
ACT.payquick = t => { payArgs().amt = Number(t.dataset.v) || 0; const i = document.getElementById('sx_payamt'); if (i) i.value = n0(payArgs().amt); haptic('light'); refreshPay(); };
ACT.paymethod = t => { payArgs().method = t.dataset.m; haptic('light'); render(); };

/* Columns added after the first set ride only where their migration has
   landed (0105 entered_by, 0107 the debt-log links), as the owner's sync
   guards them; a database without one gets the row without it. */
async function insertRow(table, row, optional){
  let r = await sb.from(table).insert(row);
  if (r.error && optional && /column|schema cache/i.test(r.error.message || '')) { const lean = { ...row }; optional.forEach(k => delete lean[k]); r = await sb.from(table).insert(lean); }
  if (r.error) throw r.error;
}
ACT['slide:pay'] = async () => {
  const a = payArgs(), c0 = customerById(a.id), amount = Math.round(Number(a.amt) || 0);
  if (!c0 || !(amount > 0) || S.paying) return;
  S.paying = true; refreshPay();
  const date = todayISO(), time = new Date().toTimeString().slice(0, 5), method = a.method || 'cash';
  const done = []; let written = 0;
  try {
    // Re-read what they owe and each bill, so two phones cannot spread one payment over stale balances.
    const fresh = await sb.from('customers').select('debt').eq('shop_id', S.shopId).eq('id', c0.id).maybeSingle();
    if (fresh.error) throw fresh.error;
    let debt = Number(fresh.data && fresh.data.debt) || 0; const debt0 = debt;
    const plan = payPlan({ ...c0, debt }, amount);
    let cashMax = D().cashTxns.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0);
    let logMax = D().customers.reduce((m, c) => (c.debtLog || []).reduce((mm, l) => Math.max(mm, Number(l.id) || 0), m), 0);
    const cashRow = async (amt, category, description, quoteId) => {
      const id = await issueRowId('row:cash_txn', cashMax); cashMax = Math.max(cashMax, id);
      await insertRow('cash_txns', { id, shop_id: S.shopId, date, account: method, type: 'receipt', category, amount: amt, description, time, quote_id: quoteId == null ? null : quoteId, entered_by: S.user ? String(S.user.id) : null }, ['entered_by']);
      return id;
    };
    const logRow = async (row) => {
      const id = await issueRowId('row:debt_log', logMax); logMax = Math.max(logMax, id);
      await insertRow('customer_debt_log', { id, shop_id: S.shopId, customer_id: c0.id, date, type: 'payment', ...row }, ['cash_txn_id', 'quote_id']);
    };
    for (const b of plan.bills) {
      if (!(b.pay > 0)) continue;
      const cur = await sb.from('saved_quotes').select('amount_paid, payload').eq('shop_id', S.shopId).eq('id', b.q.id).maybeSingle();
      if (cur.error) throw cur.error;
      const payload = (cur.data && cur.data.payload) || {};
      const q = rowToQuote({ ...b.q, id: b.q.id, invoiced: true, amount_paid: cur.data ? cur.data.amount_paid : b.q.amountPaid, payload });
      q.invoicedAt = b.q.invoicedAt; q.date = b.q.date;
      const pay = Math.min(b.pay, balanceDue(q)); if (!(pay > 0)) continue;
      const label = invoiceLabel(q);
      const cashTxnId = await cashRow(pay, 'Debt Payment', `Payment — ${label}`, q.id); written += pay;
      const payments = (Array.isArray(payload.payments) ? payload.payments : []).concat([{ date, amount: pay, note: '', cashTxnId }]);
      const amountPaid = (Number(q.amountPaid) || 0) + pay;
      // syncInvoiceDebtCharge: the invoice's share of the debt follows its balance.
      const desired = Math.max(0, quoteTotal(q) - amountPaid), current = Number(payload.debtCharged) || 0;
      const before = debt, after = Math.max(0, before + (desired - current)), applied = after - before;
      // A Sales login can only lower a debt; were the bill's share ever to
      // rise here, the baseline is left for the owner's app to settle.
      const up = await sb.from('saved_quotes').update({ amount_paid: amountPaid, payload: { ...payload, payments, debtCharged: applied > 0 ? current : desired, customerId: c0.id } }).eq('shop_id', S.shopId).eq('id', q.id);
      if (up.error) throw up.error;
      if (applied < 0) {
        await logRow({ amount: -applied, note: `Auto-sync — ${label}`, quote_id: q.id, cash_txn_id: null });
        const cu = await sb.from('customers').update({ debt: after }).eq('shop_id', S.shopId).eq('id', c0.id); if (cu.error) throw cu.error;
        debt = after;
      }
      done.push({ label, pay, cleared: pay >= b.due });
    }
    const rest = amount - done.reduce((s, d) => s + d.pay, 0);
    if (rest > 0) {
      const before = debt, after = Math.max(0, before - rest);
      const cashTxnId = await cashRow(rest, 'Debt Payment', `Payment — ${c0.name}`, null); written += rest;
      if (before !== after) {
        const cu = await sb.from('customers').update({ debt: after }).eq('shop_id', S.shopId).eq('id', c0.id); if (cu.error) throw cu.error;
        await logRow({ amount: before - after, note: '', cash_txn_id: cashTxnId, quote_id: null });
        debt = after;
      }
      done.push({ label: 'Balance', pay: rest, cleared: after === 0 });
    }
    S.paying = false;
    S.stack[S.stack.length - 1] = { type: 'paid', args: { id: c0.id, amount, method, bills: done, before: debt0, after: debt, at: Date.now() } };
    S.kaching = true; render();
    loadAll().then(() => { if (S.stack.length && S.stack[S.stack.length - 1].type === 'paid') render(); }).catch(() => {});
  } catch (e) {
    S.paying = false;
    if (written > 0) { toast(`Stopped part-way: ${n0(written)} of ${n0(amount)} was recorded. Tell the owner before trying again.`, 9000); loadAll().then(render).catch(() => {}); }
    else { refreshPay(); toast(isNetworkError(e) ? 'No connection — nothing was recorded. Try again.' : 'Nothing was recorded: ' + (e.message || e), 6000); }
  }
};

/* ---------------- Paid ---------------- */
function kaching(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = kaching.ac || (kaching.ac = new AC()), t0 = ac.currentTime + 0.02;
    const tone = (f, at, dur, type, vol) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, at + dur); o.connect(g).connect(ac.destination); o.start(at); o.stop(at + dur + 0.05); };
    tone(1900, t0, 0.05, 'square', 0.05); tone(1500, t0 + 0.06, 0.05, 'square', 0.05);               // ka
    [2637, 3520, 5274, 1318].forEach((f, i) => tone(f, t0 + 0.14, 1.3 - i * 0.2, 'sine', [0.16, 0.09, 0.05, 0.07][i])); // ching
  } catch (_e) {}
}
AFTER.push(() => { if (S.kaching) { S.kaching = false; kaching(); haptic('success'); } });
PAGE.paid = ({ id, amount, method, bills, before, after }) => {
  const c = customerById(id) || { name: '', phone: '' }, m = PAY_METHODS.find(x => x[0] === method) || PAY_METHODS[0];
  const coins = Array.from({ length: 5 }, (_, i) => `<i style="position:absolute;left:${38 + i * 6}%;top:0;width:26px;height:26px;border-radius:999px;background:radial-gradient(circle at 35% 30%,#FFE9A8,#E7B53C 60%,#B9861C);box-shadow:inset 0 0 0 2px rgba(150,100,10,.35);animation:sxCoin 1.1s cubic-bezier(.4,.1,.6,1) ${(0.15 + i * 0.12).toFixed(2)}s both"></i>`).join('');
  const receipt = `Hello ${firstWord(c.name) || 'there'}, ${S.shopName} received ${n0(amount)} from you today by ${m[1].toLowerCase()}. ${after > 0 ? `You now owe ${n0(after)}.` : 'You are fully paid up.'} Thank you!`;
  return `<div data-navy-top style="position:relative;min-height:100%;background:radial-gradient(120% 70% at 50% 18%,#26335E 0%,#16203C 65%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(36px + var(--safe-area-inset-top)) 20px 150px;gap:16px;text-align:center">
    <span aria-hidden="true" style="position:relative;width:180px;height:120px">${coins}
      <span style="position:absolute;left:30px;right:30px;bottom:0;height:56px;border-radius:12px 12px 16px 16px;background:linear-gradient(180deg,#2F3D6B,#1F2A4D);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);animation:sxDrawer 1.4s ease-in-out .9s both;display:flex;align-items:center;justify-content:center"><span style="width:40px;height:6px;border-radius:9px;background:rgba(255,255,255,.18)"></span></span></span>
    <span class="sx-upin" style="display:flex;flex-direction:column;gap:4px;animation-delay:.4s"><span class="sx-eyebrow" style="color:var(--mint);display:inline-flex;align-items:center;gap:6px;justify-content:center">${ic(m[2], 14)}${esc(m[1])} · ${nowHM()}</span>
      <span class="m" style="font-size:40px;font-weight:600;color:var(--mint);letter-spacing:-.03em">+${n0(amount)}</span><span style="font-size:15px;font-weight:600">from ${esc(c.name)}</span></span>
    <div class="sx-glass sx-upin" style="width:100%;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;animation-delay:.6s">
      <span style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:12px;font-weight:700;color:var(--navyInk2)">Owed</span><span style="display:flex;align-items:baseline;gap:8px"><span class="m" style="font-size:13px;color:var(--navyInk2);text-decoration:line-through">${n0(before)}</span>${ic('chev', 12, 'style="stroke:#8D99B5"')}<span class="m" style="font-size:20px;font-weight:600;${after === 0 ? 'color:var(--mint)' : ''}">${n0(after)}</span></span></span>
      <span style="display:flex;height:8px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08)"><i class="sx-grow" style="flex:${Math.min(amount, before) || 0.0001};background:var(--mint)"></i><i style="flex:${after || 0.0001};background:rgba(255,255,255,.18)"></i></span>
      ${(bills || []).map(b => `<span style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--navyInk)"><span style="display:flex;align-items:center;gap:6px">${b.cleared ? `<span style="color:var(--mint);display:flex">${ic('tick', 13, 'style="stroke-width:3"')}</span>` : '<i style="width:13px"></i>'}${esc(b.label)}${b.cleared ? ' · cleared' : ''}</span><span class="m" style="color:#fff">${n0(b.pay)}</span></span>`).join('')}
    </div>
    ${after === 0 ? `<span class="sx-stamp" style="color:var(--mint);background:rgba(111,220,176,.08)"><b>PAID UP</b><span>${esc(dayLabel(todayISO()).toUpperCase())}</span></span>` : ''}
  </div>
  <div class="sx-dock" style="background:transparent;box-shadow:none;padding-top:12px">
    ${c.phone ? `<a class="sx-btn" style="background:#25D366;color:#fff" target="_blank" href="https://wa.me/${phoneDigits(c.phone)}?text=${encodeURIComponent(receipt)}">${ic('chat', 20)}Send ${esc(firstWord(c.name))} a receipt</a>` : ''}
    <button class="sx-btn" style="background:rgba(255,255,255,.1);color:#fff" data-act="back">Done</button></div>`;
};
PAGE.paid.bg = '#16203C';

boot();
</script>
