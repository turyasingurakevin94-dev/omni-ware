<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E1530">
<title>Omni-Ware Suppliers</title>
<link rel="manifest" href="/manifest-supplier.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap">
<style>
  /* THE SUPPLIER APP — built to the "Supplier app — simple" canvas.
     One job above all: an order comes in, the supplier says what they have
     and swipes it back. Everything else is quiet and one tab away.
     Night heroes with a soft glow, raised white cards on a warm ground,
     one lit red button for the next move, money in tabular mono. Every
     colour answers one question: ground/ink, state (green good, amber needs
     you, crimson none/late), action (red), or what an item is (tile tints). */
  :root{--z:1;--vh:calc(100vh / var(--z));}
  :root{
    --ground:#F4F1EC; --paper:#FFFFFF; --ink:#1C2233; --ink2:#5F6980; --cap:#767F91;
    --hair:#F1EEE8; --rule:#E6E3DD; --sunk:#EAE6DF;
    --night:#0E1530; --navy:#16203C; --night-2:#1F2A52;
    --red:#C93A30; --green:#0F6B43; --amber:#95530C; --amber-ink:#7A4A02; --crimson:#8E2A22;
    --mint:#6FDCB0; --gold:#F5B26B;
    --f:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
    --m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --lift:0 1px 2px rgba(14,21,48,.04),0 14px 28px -16px rgba(14,21,48,.28),inset 0 0 0 1px rgba(14,21,48,.05);
    --float:0 30px 50px -22px rgba(14,21,48,.45),0 8px 18px rgba(14,21,48,.08),inset 0 0 0 1px rgba(14,21,48,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  .app{max-width:480px;margin:0 auto;min-height:var(--vh);position:relative;padding-bottom:110px}
  .app.no-tabs{padding-bottom:28px}
  .app.has-dock{padding-bottom:190px}
  .fig{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .grow{flex:1;min-width:0}
  .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hide{display:none!important}

  /* night hero */
  .hero{position:relative;overflow:hidden;background:var(--night);color:#fff;border-radius:0 0 34px 34px;padding:calc(16px + env(safe-area-inset-top)) 18px 22px;display:flex;flex-direction:column;gap:16px}
  .hero > *{position:relative}
  .hero > .g{position:absolute;border-radius:999px;pointer-events:none;animation:glow 7s ease-in-out infinite}
  .g.a{left:-110px;top:-140px;width:420px;height:420px;background:radial-gradient(circle,rgba(64,82,152,.85) 0%,rgba(64,82,152,0) 65%)}
  .g.b{right:-140px;top:50px;width:360px;height:360px;background:radial-gradient(circle,var(--gb,rgba(201,58,48,.28)) 0%,rgba(0,0,0,0) 65%);animation-delay:1s}
  .hero.tall{padding-bottom:64px}
  .cap{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .cap.dk{color:var(--cap)}
  .h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
  .sub{font-size:13px;font-weight:600;color:rgba(255,255,255,.6)}
  .top{display:flex;align-items:center;gap:12px}
  .glassbtn{width:44px;height:44px;flex:none;border:0;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
  .roundbtn{width:44px;height:44px;flex:none;border:0;border-radius:999px;background:#fff;box-shadow:0 4px 12px -4px rgba(14,21,48,.2),inset 0 0 0 1px rgba(14,21,48,.06);display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
  .av{width:48px;height:48px;flex:none;border:0;border-radius:999px;background:linear-gradient(150deg,#2E3B6A,#1A2448);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 16px rgba(0,0,0,.3);color:#fff;font:700 15px var(--f);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
  .av .on{position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:999px;background:var(--mint);box-shadow:0 0 0 2.5px var(--night)}
  .npill{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(245,178,107,.14);box-shadow:inset 0 0 0 1px rgba(245,178,107,.25);color:var(--gold)}
  .npill.mint{background:rgba(111,220,176,.12);box-shadow:inset 0 0 0 1px rgba(111,220,176,.25);color:var(--mint)}
  .npill.glass{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:rgba(255,255,255,.85);font-weight:600}
  .dot{width:7px;height:7px;border-radius:999px;background:currentColor;flex:none}
  .dot.live{animation:live 2s infinite}
  .shopbadge{width:44px;height:44px;flex:none;border-radius:14px;background:linear-gradient(150deg,#E5483D,#A82D24);box-shadow:0 8px 18px rgba(168,45,36,.35),inset 0 1px 0 rgba(255,255,255,.25);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}

  /* surfaces */
  .pad{padding:14px 14px 0;display:flex;flex-direction:column;gap:10px}
  .pull{margin-top:-46px}
  .card{background:linear-gradient(175deg,#fff 0%,#FBFAF7 100%);border-radius:24px;box-shadow:var(--lift);position:relative}
  .card.float{box-shadow:var(--float);border-radius:26px}
  .card.p{padding:16px}
  .card.dark{background:linear-gradient(150deg,#1A2448,#0E1530);color:#fff;box-shadow:0 14px 28px -14px rgba(14,21,48,.6)}
  .card.ghost{background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(14,21,48,.05)}
  .rows{padding:0 14px}
  .row{display:flex;align-items:center;gap:12px;min-height:64px;width:100%;background:none;border:0;padding:0;text-align:left;font:inherit;cursor:pointer}
  .rows > .row + .row,.rows > .row + a.row{border-top:1px solid var(--hair)}
  .sec{display:flex;align-items:baseline;justify-content:space-between;padding:6px 4px 0}
  .sec .cap{color:var(--cap)}
  .t1{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .t2{font-size:12px;font-weight:600;color:var(--cap)}
  .tile{width:44px;height:44px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(14,21,48,.06)}
  .tile.lg{width:52px;height:52px;border-radius:16px}
  .tile.xl{width:116px;height:116px;border-radius:34px;box-shadow:inset 0 0 0 1px rgba(14,21,48,.06),0 18px 30px -14px rgba(14,21,48,.35),inset 0 2px 0 rgba(255,255,255,.8)}
  .t-sky{background:linear-gradient(160deg,#DCEAF8,#fff 150%);color:#1A5A8A}
  .t-red{background:linear-gradient(160deg,#FDE8E4,#fff 150%);color:#A82D24}
  .t-indigo{background:linear-gradient(160deg,#E4E6FA,#fff 150%);color:#3A3F9B}
  .t-green{background:linear-gradient(160deg,#E4F4EA,#fff 150%);color:#0F6B43}
  .t-amber{background:linear-gradient(160deg,#FDEEE1,#fff 150%);color:#95530C}
  .t-slate{background:linear-gradient(160deg,#EFECE6,#fff 150%);color:#5F6980}
  .chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700}
  .c-amber{background:linear-gradient(180deg,#FEF3E7,#FDEEE1);box-shadow:inset 0 0 0 1px rgba(149,83,12,.2);color:var(--amber-ink)}
  .c-green{background:#E4F4EA;color:var(--green)}
  .c-sky{background:#DCEAF8;color:#1A5A8A}
  .c-crimson{background:#FBE5E2;color:var(--crimson)}
  .c-night{background:var(--night);color:#fff}
  .tag{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--amber-ink);background:#FDEEE1;padding:3px 8px;border-radius:6px}
  .rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
  .rail i{height:4px;border-radius:999px;background:#E9E5DE}
  .rail i.d{background:var(--green)} .rail i.n{background:var(--amber)}
  .trust{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink2)}

  /* buttons */
  .btn{height:56px;border:0;border-radius:18px;font:700 17px var(--f);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 22px;text-decoration:none;flex:none;transition:transform .12s}
  .btn.block{width:100%;display:flex}
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn-red{background:linear-gradient(180deg,#D4443A 0%,#C93A30 55%,#B5332A 100%);color:#fff;box-shadow:0 12px 24px rgba(201,58,48,.38),inset 0 1px 0 rgba(255,255,255,.22)}
  .btn-navy{background:linear-gradient(180deg,#1F2A52,#0E1530);color:#fff;box-shadow:0 14px 28px -12px rgba(14,21,48,.6),inset 0 1px 0 rgba(255,255,255,.12)}
  .btn-white{background:linear-gradient(180deg,#fff,#EEF0F5);color:var(--night);box-shadow:0 14px 30px -12px rgba(0,0,0,.6),inset 0 -1px 0 rgba(14,21,48,.08)}
  .btn-line{background:#fff;color:var(--ink);box-shadow:0 6px 16px -8px rgba(14,21,48,.25),inset 0 0 0 1.5px var(--ink)}
  .btn-green{height:72px;border-radius:22px;font-size:20px;background:linear-gradient(180deg,#17905A 0%,#0F6B43 60%,#0C5C39 100%);color:#fff;box-shadow:0 16px 30px -10px rgba(15,107,67,.55),inset 0 1px 0 rgba(255,255,255,.22)}
  .btn-ghost{background:transparent;color:var(--ink2);height:46px;font-size:14px}
  .btn-glass{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
  .btn-sm{height:42px;padding:0 16px;border-radius:13px;font-size:14px}
  .linkbtn{background:none;border:0;padding:0;font:700 14px var(--f);cursor:pointer}

  /* floating tab bar */
  .tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(350px,calc(100% - 40px));height:66px;border-radius:24px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 18px 36px -14px rgba(14,21,48,.35),inset 0 0 0 1px rgba(14,21,48,.06);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px;z-index:20}
  .tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink2);font-size:11px;font-weight:700;border-radius:18px;position:relative}
  .tabs a[aria-current]{background:var(--night);color:#fff;flex-direction:row;gap:8px;font-size:13px}
  .tabs .badge{position:absolute;top:6px;left:calc(50% + 4px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--amber);color:#fff;box-shadow:0 0 0 2px #fff;font:600 11px var(--m);display:flex;align-items:center;justify-content:center}

  /* order: have / don't-have */
  .seg{display:grid;grid-template-columns:1fr 62px;gap:4px;padding:4px;border-radius:16px;background:var(--ground);box-shadow:inset 0 1px 2px rgba(14,21,48,.08)}
  .seg button{height:46px;border:0;border-radius:12px;background:transparent;color:var(--cap);font:700 15px var(--f);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background .2s,color .2s}
  .seg button.have{background:linear-gradient(180deg,#13804F,#0F6B43);color:#fff;box-shadow:0 4px 10px rgba(15,107,67,.28),inset 0 1px 0 rgba(255,255,255,.2)}
  .seg button.not{background:linear-gradient(180deg,#A2342B,#8E2A22);color:#fff;box-shadow:0 4px 10px rgba(142,42,34,.3),inset 0 1px 0 rgba(255,255,255,.18)}
  .seg button svg{animation:pop .3s ease-out}
  .line{padding:12px;display:flex;flex-direction:column;gap:10px;animation:rise .4s ease-out both}
  .line.out{background:#FBF8F6;box-shadow:inset 0 0 0 1.5px rgba(142,42,34,.28)}
  .line.newp{background:linear-gradient(170deg,#fff,#FFFBF6);box-shadow:0 12px 24px -14px rgba(149,83,12,.35),inset 0 0 0 1.5px rgba(149,83,12,.35)}
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .variant{display:inline-flex;align-items:center;min-height:24px;padding:2px 9px;border-radius:8px;background:var(--ground);box-shadow:inset 0 0 0 1px rgba(14,21,48,.08);font-size:13px;font-weight:600;color:var(--ink2);line-height:1.25}
  .pricebtn{align-self:flex-start;display:flex;align-items:center;gap:6px;min-height:28px;border:0;background:none;padding:0;font:600 13px var(--m);color:var(--ink2);cursor:pointer}
  .pricebtn .q{font-size:15px;color:var(--ink)}
  .pencil{width:22px;height:22px;border-radius:7px;background:var(--ground);display:flex;align-items:center;justify-content:center}
  .newchip{height:22px;padding:0 7px;border-radius:7px;background:linear-gradient(180deg,#FEF3E7,#FDEEE1);box-shadow:inset 0 0 0 1px rgba(149,83,12,.25);color:var(--amber-ink);display:inline-flex;align-items:center}

  /* the dark dock with swipe-to-send */
  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);overflow:hidden;background:var(--night);border-radius:30px 30px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;box-shadow:0 -14px 34px rgba(14,21,48,.22);z-index:20;color:#fff}
  .dock > .g{position:absolute;right:-80px;bottom:-120px;width:300px;height:300px;border-radius:999px;background:radial-gradient(circle,rgba(201,58,48,.3) 0%,rgba(201,58,48,0) 65%);pointer-events:none}
  .dock > *{position:relative}
  .cnt{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:999px;font:600 14px var(--m)}
  .cnt.h{background:rgba(111,220,176,.12);box-shadow:inset 0 0 0 1px rgba(111,220,176,.22);color:var(--mint)}
  .cnt.o{background:rgba(245,178,107,.12);box-shadow:inset 0 0 0 1px rgba(245,178,107,.22);color:var(--gold)}
  .swipe{position:relative;height:64px;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:inset 0 1px 3px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08);padding:6px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
  .swipe .trail{position:absolute;left:0;top:0;bottom:0;width:64px;border-radius:999px;background:linear-gradient(90deg,rgba(111,220,176,.08),rgba(111,220,176,.32))}
  .swipe .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:rgba(255,255,255,.9);pointer-events:none}
  .swipe .thumb{position:relative;z-index:2;width:52px;height:52px;border:0;border-radius:999px;background:linear-gradient(180deg,#E04A3F,#C93A30 55%,#B0322A);box-shadow:0 8px 18px rgba(201,58,48,.45),inset 0 1px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:#fff;cursor:grab;animation:nudge 1.6s ease-in-out infinite}
  .swipe.dragging .thumb{animation:none;cursor:grabbing}
  .swipe.busy{opacity:.6;pointer-events:none}

  /* sheets */
  .scrim{position:fixed;inset:0;background:rgba(11,17,34,.6);z-index:30;animation:fade .2s ease-out}
  .sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#FFFFFF,#F7F5F1);border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));z-index:31;display:flex;flex-direction:column;gap:14px;box-shadow:0 -20px 50px rgba(0,0,0,.4);animation:sheetUp .35s cubic-bezier(.2,.9,.3,1) both}
  .grab{align-self:center;width:42px;height:5px;border-radius:999px;background:#DDD8CF;flex:none}
  .pricecard{position:relative;overflow:hidden;border-radius:24px;background:var(--night);color:#fff;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 34px -16px rgba(14,21,48,.6)}
  .pricecard > .g{position:absolute;right:-70px;top:-90px;width:240px;height:240px;border-radius:999px;background:radial-gradient(circle,rgba(245,178,107,.28) 0%,rgba(245,178,107,0) 65%);pointer-events:none}
  .pricecard > *{position:relative}
  .bigprice{display:flex;align-items:center;gap:6px;font:500 46px var(--m);letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
  .caret{width:2px;height:38px;border-radius:1px;background:var(--gold);animation:caret 1s step-end infinite}
  .kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .kp button{height:54px;border:0;border-radius:16px;background:linear-gradient(180deg,#fff,#FBFAF7);box-shadow:0 1px 0 rgba(14,21,48,.12),inset 0 0 0 1px rgba(14,21,48,.05);font:400 24px var(--m);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .kp button.mut{background:var(--sunk);box-shadow:none;font-size:18px}
  .kp button:active{transform:scale(.96)}
  .quick{display:flex;gap:6px}
  .quick button{flex:1;height:42px;border:0;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px rgba(14,21,48,.08);font:600 13px var(--m);color:var(--ink);cursor:pointer}
  .quick button.on{background:var(--night);color:#fff;box-shadow:0 6px 14px -6px rgba(14,21,48,.5)}

  /* price flashcards */
  .flash{position:relative;margin:18px 14px 0;padding:22px 18px;border-radius:32px;background:linear-gradient(175deg,#fff,#FBFAF7);box-shadow:0 40px 60px -28px rgba(14,21,48,.45),0 10px 24px rgba(14,21,48,.08),inset 0 0 0 1px rgba(14,21,48,.05);display:flex;flex-direction:column;align-items:center;gap:16px;animation:cardIn .45s ease-out both}
  .flash-ghost{position:relative;height:0}
  .flash-ghost i{position:absolute;height:40px;border-radius:30px 30px 0 0}
  .flash-ghost i:nth-child(1){left:34px;right:34px;top:2px;background:#ECE8E1}
  .flash-ghost i:nth-child(2){left:24px;right:24px;top:10px;background:#F7F5F1;box-shadow:inset 0 0 0 1px rgba(14,21,48,.04)}
  .hugeprice{font:400 58px var(--m);letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums}
  .progress{flex:1;display:grid;gap:6px}
  .progress i{height:6px;border-radius:999px;background:#E2DDD4}
  .progress i.d{background:linear-gradient(90deg,#13804F,#0F6B43)}
  .progress i.n{background:var(--night);box-shadow:0 0 10px rgba(14,21,48,.3)}
  .swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  .sw-i{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;cursor:pointer;font:700 12px var(--f);color:var(--ink)}
  .sheetmetal{position:relative;overflow:hidden;width:50px;height:64px;border-radius:12px;box-shadow:0 10px 18px -8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
  .sheetmetal::after{content:'';position:absolute;top:0;bottom:0;width:30%;background:rgba(255,255,255,.3);transform:skewX(-20deg) translateX(-160%);animation:sheen 4s ease-in-out infinite}
  .sw-i.off .sheetmetal{opacity:.3;filter:grayscale(1)}
  .tick{width:24px;height:24px;border-radius:999px;background:linear-gradient(180deg,#13804F,#0F6B43);box-shadow:0 4px 10px rgba(15,107,67,.35);display:flex;align-items:center;justify-content:center;color:#fff;animation:pop .4s ease-out both}
  .sw-i.off .tick{background:#E2DDD4;box-shadow:none;color:#fff}
  .vchip{height:40px;padding:0 14px;border:0;border-radius:12px;background:#E4F4EA;color:var(--green);font:700 13px var(--f);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .vchip.off{background:var(--sunk);color:var(--cap);text-decoration:line-through}
  .field{padding:13px;border-radius:20px;background:#fff;box-shadow:0 1px 2px rgba(14,21,48,.04),inset 0 0 0 1px rgba(14,21,48,.07);display:flex;flex-direction:column;gap:4px;border:0;text-align:left;cursor:pointer;font:inherit;width:100%}
  .field.on{box-shadow:0 14px 26px -14px rgba(14,21,48,.4),inset 0 0 0 2px var(--night)}
  .field .v{font:500 28px var(--m);letter-spacing:-.05em;color:var(--ink);display:flex;align-items:center;gap:3px;min-height:34px}
  .field .v .caret{height:26px;background:var(--red)}
  .carton{position:relative;width:100px;height:80px;flex:none;border-radius:14px;background:linear-gradient(160deg,#EED9B6 0%,#C9A570 70%,#B38D58 100%);box-shadow:0 14px 24px -10px rgba(0,0,0,.6),inset 0 -6px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.4);padding:9px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
  .carton i{border-radius:3px;background:rgba(255,255,255,.88)}

'use strict';
/* ---------------------------------------------------------------------
 * The supplier app.
 *
 * Talks to ONE endpoint — the supplier-portal Edge Function — which is
 * the only thing that knows anything about this shop and hands back
 * fields it has picked one at a time. Nothing here computes a sell price
 * or knows who is buying: there is no code path to show a buyer, a sell
 * price or another supplier, which is the point.
 *
 * The home screen shows ONE next move, in this order: an order to
 * answer, a few prices to check, or all clear. Answering an order is two
 * taps when nothing changed: open it, swipe it back. Every line starts
 * at "Have it" with the supplier's own price filled in.
 *
 * Standalone, like client.html: it shares no script with index.html.
 *
 * DEMO MODE. Opened with ?demo, or with no shop in the link, the app runs
 * on sample data and says so in a tag in the corner. Nothing in demo mode
 * reaches the network.
 * ------------------------------------------------------------------- */
/* ---------------- Which Supabase project this copy talks to ----------
 *
 * There is no build step in this project -- these are single HTML files
 * served exactly as they sit in the repo -- so the project cannot be
 * injected at deploy time. It is chosen at run time, from the host the
 * page was opened on. That is what lets the redesign branch and main
 * carry the SAME file: the host decides which database it reaches, not
 * the checkout, so there is never a line here to resolve when the two
 * merge.
 *
 * The list names the PRODUCTION hosts and everything else falls to
 * staging, never the other way round. A list of staging hosts would mean
 * any host nobody thought of -- a fresh preview URL, a renamed project,
 * an old bookmark -- landing on the real books and writing to them. This
 * way an unrecognised host reads the empty copy and the strip in the
 * corner says so.
 *
 * Until BOTH halves are filled in -- a staging project to point at and at
 * least one production host to tell apart from it -- every host gets
 * production. A half-finished switch is the dangerous one: name the
 * staging project without naming the real site and the real site becomes
 * "everything else". So it stays inert until it is whole, and this block
 * cannot change what the live site does before then.
 */
const OW_ENV = (function () {
  const PRODUCTION = {
    name: 'production',
    url: 'https://hgywjaifdmgrcnwxstxg.supabase.co',
  };
  // Fill both in once the staging Supabase project exists, and commit the
  // same values on every branch.
  const STAGING = {
    name: 'staging',
    url: 'https://lmmyzhqdxixjnkkkgnnu.supabase.co',
  };
  // The hosts that ARE the real shop. Add one the day it starts serving
  // the live site, and not before.
  const PRODUCTION_HOSTS = ['omni-ware.vercel.app', 'omni-ware-preview.turyasingurakevin94.workers.dev'];

  function chosen() {
    if (!STAGING.url || !PRODUCTION_HOSTS.length) return PRODUCTION;
    // The Android shell serves the bundle from localhost, so the hostname
    // says nothing about which database it wants. A shipped APK is the
    // real shop; a staging APK would be a separate build.
    if (typeof window !== 'undefined' && window.Capacitor) return PRODUCTION;
    const host = ((typeof location !== 'undefined' && location.hostname) || '').toLowerCase();
    return PRODUCTION_HOSTS.indexOf(host) === -1 ? STAGING : PRODUCTION;
  }

  const env = chosen();
  if (env.name === 'staging') {
    // Small, fixed, and never in the way of a tap: the point is that
    // nobody spends ten minutes entering real figures into the copy.
    //
    // 899 and not the top of the stack. The drawn dropdown at 900 has to
    // stay the highest layer in the app -- a menu opening behind the
    // modal that owns it is a real bug, and dropdown-menu.test.js pins
    // it -- so the strip goes under that and above everything else.
    const mark = function () {
      if (!document.body || document.getElementById('ow-env-mark')) return;
      const el = document.createElement('div');
      el.id = 'ow-env-mark';
      el.textContent = 'STAGING — test data, not the real books';
      el.style.cssText = 'position:fixed;left:0;bottom:0;z-index:899;'
        + 'pointer-events:none;background:#C93A30;color:#fff;'
        + 'font:600 11px/1.1 system-ui,-apple-system,sans-serif;'
        + 'padding:5px 9px;border-radius:0 6px 0 0';
      document.body.appendChild(el);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mark);
    else mark();
  }
  return env;
})();
const SUPABASE_URL = OW_ENV.url;
const FN_URL = SUPABASE_URL.replace(/\.supabase\.co\/?$/, '.functions.supabase.co') + '/supplier-portal';

const K_TOKEN = 'ow_sup_token';

function store(k, v){
  try{
    if(v === undefined) return localStorage.getItem(k);
    if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);

  }catch(_){ return null; }
}

   suppliers' phones are 360, where everything came out small with half

const ZOOM = Math.min(window.innerWidth || 390, (window.screen && screen.width) || 390) < 430 ? 1.15 : 1;
if(ZOOM !== 1){ document.documentElement.style.zoom = ZOOM; document.documentElement.style.setProperty('--z', ZOOM); }

  let d = store(K_DEV);

    d = Array.from(b, x => x.toString(16).padStart(2,'0')).join('') || String(Date.now());
    store(K_DEV, d);
  }

}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return Math.round(Number(n) || 0).toLocaleString('en-US'); }
function short(n){
  const v = Math.round(Number(n) || 0);
  if(v >= 1e6) return (v/1e6).toFixed(v >= 1e7 ? 1 : 2).replace(/\.?0+$/,'') + 'M';
  if(v >= 1e3) return Math.round(v/1e3) + 'k';

function daysFrom(a, b){ return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDay(iso){ if(!iso) return ''; const p = dayParts(iso); return p.dow + ' ' + p.d + ' ' + p.mon; }
function relDay(iso){
  if(!iso) return '';

  if(n === 0) return 'today'; if(n === 1) return 'tomorrow'; if(n === -1) return 'yesterday';
  if(n > 1 && n < 7) return 'in ' + n + ' days';

}
function clock(ms){ const d = new Date(Number(ms) + 3*3600*1000); return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0'); }
function askedLabel(ms){
  const t = Number(ms); if(!t) return '';
  const mins = Math.round((Date.now() - t) / 60000);
  if(mins < 2) return 'just now';
  if(mins < 6 * 60) return 'asked ' + clock(t);
  return relDay(new Date(t + 3*3600*1000).toISOString().slice(0,10));
}
function hello(){ const h = new Date(Date.now() + 3*3600*1000).getUTCHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function initials(name){ return String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || 'S'; }
function firstName(name){ return String(name||'').split(/\s+/)[0] || ''; }

function edge(dir, color){
  let d = 'M0 ' + (dir === 'top' ? '12H354V9' : '0H354V3');
  for(let x = 354; x > 0; x -= 8){ d += dir === 'top' ? `L${x-4} 1L${x-8} 9` : `L${x-4} 11L${x-8} 3`; }
  return `<svg class="edge" viewBox="0 0 354 12" preserveAspectRatio="none" aria-hidden="true"><path d="${d}Z" fill="${color}"></path></svg>`;
}
function ring(pct, size, stroke, color, track, label){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label||'')}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"></circle><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c*Math.max(0,Math.min(1,pct))).toFixed(1)} ${c.toFixed(1)}" style="transition:stroke-dasharray .3s"></circle></svg>`;
}
function tabbar(active, badge){
  const T = [['#today','Today','sun'],['#prices','Prices','tag'],['#money','Money','wallet']];
  return `<nav class="tabs" aria-label="Supplier app">${T.map(t=> {
    const on = t[0] === active;
    return `<a href="${t[0]}" ${on ? 'aria-current="page"' : ''}>${ic(t[2], on ? 20 : 22, 1.8)}${t[1]}${!on && t[0]==='#prices' && badge ? `<span class="badge">${badge}</span>` : ''}</a>`;
  }).join('')}</nav>`;
}

/* ---------------- the data layer ---------------- */
async function api(action, extra){
  if(DEMO) return demoApi(action, extra || {});
  const shop = shopId();
  let res, data;
  try{
    res = await fetch(FN_URL, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify(Object.assign({ shopId: shop, action, token: store(K_TOKEN) || '' }, extra || {})),
    });
    data = await res.json().catch(()=>({}));
  }catch(_){
    const e = new Error('No connection'); e.offline = true; throw e;
  }
  if(!res.ok || data.error){
    const e = new Error(data.error || ('Something went wrong (' + res.status + ')'));
    e.status = res.status; e.triesLeft = data.triesLeft; throw e;
  }
  return data;
}
/* A write that cannot reach the shop waits on this phone and goes when
   the line comes back. An order answer carries the terms it was given,
   so if the order changed meanwhile the function refuses it and the
   supplier is told. A price is only a proposal the shop checks, so it is
   safe to send late too. */
const QUEUEABLE = ['answer','still','stock','price'];
function queue(){ try{ return JSON.parse(store(K_QUEUE) || '[]'); }catch(_){ return []; } }
function setQueue(q){ store(K_QUEUE, q.length ? JSON.stringify(q) : null); }
async function send(action, extra, label){
  try{ return await api(action, extra); }
  catch(err){
    if(err.offline && QUEUEABLE.includes(action)){
      const q = queue(); q.push({ action, extra, label: label || action, at: Date.now() }); setQueue(q);
      return { ok:true, queued:true };
    }
    throw err;
  }
}
async function flushQueue(){
  const q = queue(); if(!q.length) return;
  const left = [];
  for(const job of q){
    try{ await api(job.action, job.extra); }
    catch(err){ if(err.offline) left.push(job); else left.push(Object.assign({}, job, { failed: err.message })); }
  }
  setQueue(left);
  if(!left.length){ toast('Back online · everything sent'); S.cache = {}; }
  render();
}
window.addEventListener('online', ()=>{ if(queue().length) flushQueue(); else render(); });
window.addEventListener('offline', ()=> render());

const S = {

};
async function load(key, action, extra){
  if(S.cache[key]) return S.cache[key];
  try{
    const d = await api(action, extra);
    S.cache[key] = d; return d;
  }catch(err){
    if(err.status === 401){ store(K_TOKEN, null); location.hash = '#signin'; return new Promise(()=>{}); }
    throw err;
  }
}
function invalidate(...keys){ keys.forEach(k=> delete S.cache[k]); }

/* ---------------- router ---------------- */
const ROUTES = {};
function route(hash){
  const h = (hash || location.hash || '#today').replace(/^#/, '');
  const [name, ...rest] = h.split('/');
  return { name: name || 'today', arg: decodeURIComponent(rest.join('/')) };
}
let renderSeq = 0;
async function render(){
  const app = document.getElementById('app');
  const r = route();
  if(!DEMO && !store(K_TOKEN) && r.name !== 'signin'){ location.hash = '#signin'; return; }
  const fn = ROUTES[r.name] || ROUTES.today;
  const seq = ++renderSeq;
  try{
    const out = fn(r.arg);
    if(out && typeof out.then === 'function'){
      if(fn.skeleton && app.dataset.route !== r.name) app.innerHTML = fn.skeleton();
      const html = await out;
      if(seq !== renderSeq) return;
      paint(html, r.name);
    }else paint(out, r.name);
  }catch(err){
    if(seq !== renderSeq) return;
    paint(failScreen(err), r.name);
  }
}
function paint(html, name){
  const app = document.getElementById('app');
  app.innerHTML = html;
  app.dataset.route = name || '';
  app.classList.toggle('no-tabs', !/class="tabs"/.test(html));
  app.classList.toggle('has-dock', /class="dock"/.test(html));
}
window.addEventListener('hashchange', ()=>{ S.ui.sheet = null; S.ui.me = false; window.scrollTo(0,0); render(); });
function go(h){ if(location.hash === h) render(); else location.hash = h; }

function failScreen(err){
  const offline = err && err.offline;
  return `<header class="hero">${glows('rgba(245,178,107,.24)')}
      <div class="cap">${offline ? 'No connection' : 'Something went wrong'}</div>
      <h1 class="h1">${offline ? 'Can’t reach the shop' : 'That didn’t load'}</h1></header>

      <button class="btn btn-navy block" data-a="retry">${ic('retry',18,2.2)}Try again</button></div></div>` + tabbar('');
}

/* ======================================================================
   ORDER — every line starts at "Have it" with THEIR price filled in.
   Tap ✕ for what they don't have; tap the price only if it changed.
   Swipe to send. A changed price travels two ways: as the answer's own
   words (the shop sees them on the order) and as a price proposal the
   shop checks on the item.
   ====================================================================== */
const OS = {};
function orderState(id){ return OS[id] || (OS[id] = { not:{}, price:{}, sent:null, edit:null }); }
function orderMath(o, st){
  let total = 0, have = 0;
  (o.lines || []).forEach(l=>{ if(!st.not[l.lineId]){ have++; total += l.qty * (st.price[l.lineId] || l.price); } });
  return { total, have, out: (o.lines || []).length - have };
}

        ? `<span class="chip" style="height:20px;width:20px;padding:0;justify-content:center;border-radius:6px;background:rgba(245,178,107,.18);color:var(--gold)">${ic('check',12,3)}</span>Checked. Swipe when ready.`

/* ======================================================================
   PRICES — the gentle daily handful, and the whole list.
   Variants of one product at one price are confirmed in ONE tap.
   ====================================================================== */
function isStale(p){ return !p.outOfStock && !(p.proposal && p.proposal.status === 'pending') && (p.checkedDays == null || p.checkedDays > STALE_DAYS); }
function groupItems(items){
  const g = {};
  items.forEach(p=>{
    const k = [p.productId || p.name, p.unitPrice, p.packPrice, p.unit].join('|');
    (g[k] ||= []).push(p);
  });
  return Object.values(g).map(list=>{
    const names = list.map(p=> p.name);
    let base = names[0];
    if(list.length > 1){
      let i = 0; while(i < base.length && names.every(n=> n[i] === base[i])) i++;
      base = base.slice(0, i).replace(/[\s·,–-]+$/,'').trim() || names[0];
    }
    return { base, items: list, days: Math.max(...list.map(p=> p.checkedDays == null ? 999 : p.checkedDays)), rep: list[0] };
  });
}
const COLOURS = { red:['#C9443A','#A2342B'], maroon:['#8A2E2E','#6E2222'], green:['#3A7A45','#255830'], blue:['#3660A0','#223F6E'], brown:['#7E5A3A','#573B24'], charcoal:['#4A4F59','#2E3139'], grey:['#8A8F99','#6B707A'], gray:['#8A8F99','#6B707A'], black:['#3B3F48','#22252B'], white:['#F2F2F0','#D9D9D4'], silver:['#C8CCD2','#A3A8B0'], cream:['#EDE3CC','#D6C8A8'], orange:['#E07A2E','#B85E1C'], yellow:['#E8C547','#C9A52A'] };
function variantLabel(p, base){ return p.name.slice(base.length).replace(/^[\s·,–-]+/,'').trim() || p.name; }
function colourOf(label){ const w = String(label).toLowerCase().split(/[^a-z]+/).find(x=> COLOURS[x]); return w ? COLOURS[w] : null; }

const CK = { list:null, i:0, off:{}, mode:'card', results:[], edit:null };
function startChecks(items){
  const groups = groupItems(items.filter(isStale)).sort((a,b)=> b.days - a.days).slice(0, DAILY_CHECKS);
  Object.assign(CK, { list: groups, i: 0, off: {}, mode: 'card', results: [], edit: null });
}
ROUTES.check = async function(){

  const g = CK.list[CK.i];

  const n = CK.list.length;

  return `<div style="min-height:var(--vh);display:flex;flex-direction:column;position:relative;overflow:hidden">
    <span aria-hidden="true" style="position:absolute;left:50%;top:120px;width:420px;height:420px;margin-left:-210px;border-radius:999px;background:radial-gradient(circle,rgba(58,63,155,.14) 0%,rgba(58,63,155,0) 65%)"></span>
    <div class="top" style="position:relative;padding:calc(14px + env(safe-area-inset-top)) 16px 0"><a class="roundbtn" href="#today" aria-label="Close">${ic('close',16,2.6)}</a>
      <span class="progress" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${CK.list.map((_, i)=> `<i class="${i < CK.i ? 'd' : i === CK.i ? 'n' : ''}"></i>`).join('')}</span><span class="fig t2" style="font-size:14px">${CK.i + 1}/${n}</span></div>
    <div class="flash-ghost" style="margin:0 14px"><i></i><i></i></div>
    <div class="flash" style="position:relative" key="${CK.i}">
      <span style="align-self:stretch;display:flex;justify-content:space-between;align-items:center"><span class="chip c-amber">${ic('clock',13,2.4)}${g.days >= 999 ? 'never checked' : g.days + ' days old'}</span>${multi ? `<span class="chip c-night"><span class="fig" style="color:var(--mint)">${g.items.length}</span> in one</span>` : ''}</span>
      ${multi ? '' : tile(p.name, 'xl', 58)}
      <span style="display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center"><b style="font-size:23px;letter-spacing:-.02em">${esc(g.base)}</b><span class="t2" style="font-size:14px">per ${esc(per)}</span></span>
      ${multi ? `<div class="swatches">${g.items.map(x=>{ const lab = variantLabel(x, g.base), c = colourOf(lab), off = !!CK.off[x.priceId];
          return c ? `<button class="sw-i ${off?'off':''}" data-a="ckToggle" data-id="${x.priceId}" aria-pressed="${!off}" aria-label="${esc(lab)}${off ? ', left out' : ''}"><span class="sheetmetal" style="background:repeating-linear-gradient(90deg,${c[0]} 0 5px,${c[1]} 5px 9px)"></span><span class="tick">${ic(off ? 'close' : 'check',12,3.4)}</span>${esc(lab)}</button>`
                   : `<button class="vchip ${off?'off':''}" data-a="ckToggle" data-id="${x.priceId}" aria-pressed="${!off}">${ic(off ? 'close' : 'check',14,3)}${esc(lab)}</button>`; }).join('')}</div>` : ''}
      <span style="display:flex;flex-direction:column;align-items:center;gap:2px">${multi ? `<span class="cap dk">each</span>` : ''}<span class="hugeprice">${price != null ? money(price) : '—'}</span></span>
      ${tiers.length ? `<span style="display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:14px;background:var(--ground);box-shadow:inset 0 1px 2px rgba(14,21,48,.06);font-size:13px;font-weight:600;color:var(--ink2)">${ic('bars',16,2)}${esc(tiers[0].from)} or more<span class="fig" style="font-size:15px;color:var(--ink)">${money(tiers[0].price)}</span>each</span>` : ''}
      ${p.packUnit && p.packPrice != null && p.unitPrice != null ? `<span class="t2">1 ${esc(p.packUnit)}: <span class="fig" style="color:var(--ink)">${money(p.packPrice)}</span></span>` : ''}
      ${multi ? `<span class="t2">Tap one to leave it out</span>` : ''}
    </div>
    <div style="margin-top:auto;padding:18px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px">
      <button class="btn btn-line block" data-a="ckChanged">${ic('pencil',20,2)}Changed</button>
      <button class="btn btn-green block" data-a="ckSame" ${on.length ? '' : 'disabled'}>${ic('check',26,2.8)}${multi ? (on.length === g.items.length ? 'All ' + on.length + ' the same' : on.length + ' the same') : 'Still the same'}</button>
      <button class="btn btn-ghost block" data-a="ckOut" style="color:var(--crimson)">${ic('out',16,2.2)}Out of stock now</button>
    </div></div>`;
};

  const items = d.items || [];
  const fresh = items.filter(p=> !isStale(p)).length;

    <span aria-hidden="true" style="position:absolute;border-radius:999px;left:50%;top:40px;width:340px;height:340px;margin-left:-170px;background:radial-gradient(circle,rgba(111,220,176,.24) 0%,rgba(111,220,176,0) 62%)"></span>

      <span style="display:flex;flex-direction:column;align-items:center;gap:6px;animation:rise .6s .3s ease-out both"><b style="font-size:30px;letter-spacing:-.03em">${results.length ? 'Done for today' : 'Nothing to check'}</b><span class="sub" style="font-size:15px">${left ? left + ' more another day' : 'All your prices are fresh'}</span></span>

    </div>` : ''}
    <div style="position:relative;margin-top:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom))"><a class="btn btn-white block" href="#today">Done</a></div></div>`;

/* The editor for one item (or a group of variants at one price): the
   piece price and, if it comes in a carton, the carton price. Bulk
   prices hide behind "Cheaper for many?". One proposal goes per row. */
function priceEditor(g, opt){
  const p = g.rep;
  const ed = CK.edit || (CK.edit = {
    unit: p.unitPrice != null ? String(p.unitPrice) : '',
    pack: p.packPrice != null ? String(p.packPrice) : '',
    tiers: (p.tiers || []).map(t=> ({ from: String(t.from), price: String(t.price) })),
    field: 'unit', tiersOpen: (p.tiers || []).length > 0, touched: false,
  });
  const hasPack = !!(p.packUnit && (p.packQty || p.packPrice != null));
  const hasUnit = p.unitPrice != null || !hasPack;
  const dz = p.packQty && p.packQty % 12 === 0 ? (p.packQty / 12) + ' dozen' : '';
  const fld = (key, label, was)=> {

      <span style="display:flex;justify-content:space-between;align-items:center"><span class="cap dk" style="color:var(--ink)">${esc(label)}</span>${was != null ? `<span class="fig t2" style="${diff ? 'text-decoration:line-through;color:#9AA1AE' : ''}">${money(was)}</span>` : ''}</span>

      ${diff ? `<span class="chip c-amber" style="align-self:flex-start;height:22px;font-family:var(--m);font-weight:600">${diff > 0 ? '▲' : '▼'} ${money(Math.abs(diff))}</span>` : `<span style="height:22px;font-size:11px;font-weight:700;color:var(--green)">${was != null ? 'same' : ''}</span>`}

          ${g.items.length > 1 ? `<span class="fig" style="font-size:12px;color:var(--mint)">for ${g.items.filter(x=> !CK.off[x.priceId]).length} ${plural(g.items.length,'variant')}</span>` : ''}</span>

      <button class="btn btn-navy block" data-a="peSend" data-from="${opt.from}">Send new price${ic('go',18,2.4)}</button>
    </div></div>`;

const PE = { id:null };
ROUTES.price = async function(id){
  const d = await load('products', 'products');
  const p = (d.items || []).find(x=> String(x.priceId) === String(id));
  if(!p) return failScreen(new Error('That item is not on your list.'));
  if(PE.id !== id){ PE.id = id; CK.edit = null; CK.off = {}; }
  const g = groupItems([p])[0];
  return priceEditor(g, { from:'list' });
};

ROUTES.prices = async function(){
  const d = await load('products', 'products');

    const pending = p.proposal && p.proposal.status === 'pending';
    const stale = isStale(p);
    const status = p.outOfStock ? ['out of stock','var(--crimson)','dot']
      : pending ? ['shop is checking','#1A5A8A','clock']
      : stale ? [(p.checkedDays == null ? 'never checked' : p.checkedDays + ' days old'),'var(--amber)','dot']
      : ['fresh','var(--green)','dot'];
    const price = p.unitPrice != null ? p.unitPrice : p.packPrice;

        <span class="grow" style="display:flex;flex-direction:column;gap:3px"><b class="clamp2" style="font-size:14px;line-height:1.25;${p.outOfStock?'color:var(--cap)':''}">${esc(p.name)}</b><span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:${status[1]}">${status[2] === 'dot' ? `<i class="dot" style="background:${status[1]}"></i>` : ic('clock',12,2.6)}${esc(status[0])}</span></span>
        ${p.outOfStock ? '' : `<span style="display:flex;flex-direction:column;align-items:flex-end;gap:1px"><b class="fig" style="font-size:16px;font-weight:600">${price != null ? money(price) : '—'}</b><span class="t2" style="font-size:11px">${p.unitPrice != null ? esc(p.unit) : esc(p.packUnit)}${p.unitPrice != null && p.packPrice != null && p.packUnit ? ' · ' + short(p.packPrice) + ' ' + esc(p.packUnit) : ''}</span></span>`}</a>
      ${p.outOfStock ? `<button class="sw" role="switch" aria-checked="false" aria-label="${esc(p.name)} in stock" data-a="stockToggle" data-id="${p.priceId}"></button>` : ''}
    </div>`;
  };
  return `<header class="hero" style="border-radius:0 0 32px 32px;gap:14px">${glows('rgba(111,220,176,.2)')}
      <div class="top"><span style="position:relative;width:54px;height:54px;flex:none">${ring(items.length ? fresh/items.length : 1, 54, 5, '#6FDCB0', 'rgba(255,255,255,.1)', fresh + ' of ' + items.length + ' fresh')}<b class="fig" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600">${fresh}</b></span>
        <span class="grow"><span class="h1" style="display:block">Prices</span><span class="sub" style="font-size:12px">${fresh} of ${items.length} fresh</span></span>
        <a class="glassbtn" href="#add" aria-label="Add an item">${ic('plus',20,2.2)}</a></div>
      <label class="searchbox dk">${ic('search',18,2)}<input class="search" data-in="prodQ" value="${esc(S.ui.prodQ)}" placeholder="Find an item" aria-label="Find an item"></label></header>
    <div class="pad">
      ${staleN ? `<a href="#check" data-a="checkStart" class="card" style="display:flex;align-items:center;gap:10px;height:58px;padding:0 8px 0 14px;background:linear-gradient(180deg,#FEF3E7,#FDEEE1);color:var(--amber-ink)">${ic('clock',18,2.2)}<b class="grow" style="font-size:15px"><span class="fig">${staleN}</span> getting old</b><span class="btn btn-sm" style="background:linear-gradient(180deg,#A9620F,#95530C);color:#fff">Check</span></a>` : ''}
      ${d.pendingNew ? `<div class="chip c-sky" style="align-self:flex-start;height:32px">${ic('clock',14,2.4)}${d.pendingNew} new ${plural(d.pendingNew,'item')} · shop is checking</div>` : ''}

    </div>${tabbar('#prices')}`;

document.addEventListener('click', (e)=>{

const INPUTS = {
  // Kept here so a PIN tap's redraw does not wipe a number being typed.
  siPhone: (el)=> { SI.phone = el.value; },
  prodQ: (el)=> { S.ui.prodQ = el.value; },
  addQ: (el)=> { S.ui.addQ = el.value; },
  addPrice: (el)=> {
    const s = S.ui.addSel[el.dataset.id]; if(s) s.price = Number(digits(el.value)) || 0;
    // Wake the Send button as the price is typed, not only after the field is left.
    const btn = document.querySelector('[data-a="sendAdd"]'), n = Object.values(S.ui.addSel).filter(x=> Number(x.price) > 0).length;
    if(btn){ btn.disabled = !n; const f = btn.querySelector('.fig'); if(f) f.textContent = n; }
  },
  newName: (el)=> { (S.ui.newItem ||= {}).name = el.value; },
  newPrice: (el)=> { (S.ui.newItem ||= {}).price = Number(digits(el.value)) || 0; },
};
/* Search fields re-render after a short pause and keep their caret;
   other fields re-render when they are left. */
const LIVE = ['prodQ','addQ'];
let typeT = null;
document.addEventListener('input', (e)=>{
  const el = e.target; const k = el.dataset && el.dataset.in; if(!k || !INPUTS[k]) return;
  INPUTS[k](el);
  if(LIVE.includes(k)){ clearTimeout(typeT); typeT = setTimeout(()=> restoreFocus(k), 250); }
});
// Leaving a field by tapping a button fires 'change' mid-tap; redrawing
// then would swap the button out from under the finger and lose the tap,
// so the redraw waits until the finger lifts.
let ptrDown = false, redrawOnUp = false;
document.addEventListener('pointerdown', ()=>{ ptrDown = true; }, true);
const ptrUp = ()=>{ ptrDown = false; if(redrawOnUp){ redrawOnUp = false; setTimeout(render, 0); } };
document.addEventListener('pointerup', ptrUp, true);
document.addEventListener('pointercancel', ptrUp, true);
document.addEventListener('change', (e)=>{
  const el = e.target; const k = el.dataset && el.dataset.in; if(!k || LIVE.includes(k) || k === 'siPhone') return;
  if(ptrDown) redrawOnUp = true; else render();
});
function restoreFocus(k){
  render().then(()=>{
    const el = document.querySelector(`[data-in="${k}"]`);
    if(el){ el.focus(); const v = el.value; el.setSelectionRange && el.setSelectionRange(v.length, v.length); }
  });
}

/* ---------------- swipe to send ----------------
   The thumb follows the finger; past 80% of the track it sends, short of
   that it springs back. */
let drag = null;
document.addEventListener('pointerdown', (e)=>{
  const th = e.target.closest('.swipe .thumb'); if(!th) return;
  const w = th.closest('.swipe'); if(w.classList.contains('busy')) return;
  drag = { w, th, x0: e.clientX, max: w.clientWidth - th.offsetWidth - 12, dx: 0, id: e.pointerId };
  w.classList.add('dragging');
  try{ th.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener('pointermove', (e)=>{
  if(!drag || e.pointerId !== drag.id) return;
  drag.dx = Math.max(0, Math.min(drag.max, (e.clientX - drag.x0) / ZOOM));
  drag.th.style.transform = `translateX(${drag.dx}px)`;
  drag.w.querySelector('.trail').style.width = (drag.dx + 64) + 'px';
  drag.w.querySelector('.lbl').style.opacity = String(1 - drag.dx / drag.max);
});
function endDrag(e){
  if(!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag; drag = null;
  d.w.classList.remove('dragging');
  if(d.dx >= d.max * .8){
    d.th.style.transform = `translateX(${d.max}px)`;
    d.w.classList.add('busy');
    d.th.dataset.dragged = '1';
    doSwipe(d.w.dataset.swipe, d.w.dataset.arg);
  }else{
    if(d.dx > 6) d.th.dataset.dragged = '1';
    d.th.style.transition = 'transform .25s'; d.th.style.transform = '';
    d.w.querySelector('.trail').style.width = ''; d.w.querySelector('.lbl').style.opacity = '';
    setTimeout(()=>{ d.th.style.transition = ''; }, 260);
  }
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
// A drag ends in a click on the thumb; swallow it so it is not read as a tap.
document.addEventListener('click', (e)=>{ const th = e.target.closest('.swipe .thumb'); if(th && th.dataset.dragged){ delete th.dataset.dragged; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
async function doSwipe(action, arg){ if(action === 'sendOrder') return answerOrder(arg); }

/* ---------------- sign-in and answering ---------------- */
async function pinPress(k){
  if(SI.status === 'locked' || SI.busy || SI.pin.length >= PIN_LEN) return;
  if(SI.status === 'wrong'){ SI.status = 'idle'; SI.msg = ''; }
  SI.pin += k;
  if(SI.pin.length < PIN_LEN){ render(); return; }
  const input = document.getElementById('siPhone');
  const phone = input ? input.value : (store(K_PHONE) || '');
  if(!digits(phone)){ SI.pin = ''; SI.msg = 'Type your phone number first'; SI.status = 'wrong'; SI.editPhone = true; render(); return; }
  store(K_PHONE, digits(phone));
  SI.busy = true; render();
  try{
    const r = await api('verify', { phone, pin: SI.pin, deviceId: deviceId() });
    if(r.shopId && !shopId()) store(K_SHOP, r.shopId);
    store(K_TOKEN, r.token); SI.status = 'ok'; SI.name = r.name || ''; SI.msg = ''; SI.busy = false; SI.editPhone = false; render();
    setTimeout(()=> go(setup().seen ? '#today' : '#welcome'), 700);
  }catch(err){
    SI.busy = false; SI.pin = '';
    if(err.status === 429 || err.triesLeft === 0){ SI.status = 'locked'; SI.msg = 'Locked · ask the shop for a new PIN'; }
    else { SI.status = 'wrong'; SI.msg = err.triesLeft != null ? 'Wrong PIN · ' + err.triesLeft + ' ' + plural(err.triesLeft,'try','tries') + ' left' : err.message; }
    render();
  }
}
/* One answer per order: have all, short (the lines they don't have go
   at 0) or none. A changed price rides along in the answer's own words,
   which the shop sees on the order, and as a proposal on the item when
   this phone knows which price row the line came from. */
// An order line's name with its variant, for anywhere it is said in one go.
function fullName(l){ return l.name + (l.variant ? ' · ' + l.variant : ''); }
async function answerOrder(id){
  const o = S.cache['order:' + id]; const st = orderState(id);
  if(!o || o.open === false) return;
  const lines = o.lines || [];
  const outIds = lines.filter(l=> st.not[l.lineId]).map(l=> l.lineId);
  const state = outIds.length === 0 ? 'confirmed' : outIds.length === lines.length ? 'none' : 'short';
  const changes = state === 'short' ? outIds.map(lid=> ({ lineId: lid, have: 0 })) : [];
  const priced = lines.filter(l=> st.price[l.lineId] && !st.not[l.lineId]);
  const note = priced.length ? ('New price: ' + priced.map(l=> fullName(l) + ' ' + money(st.price[l.lineId]) + ' (was ' + money(l.price) + ')').join('; ')).slice(0, 300) : '';
  try{
    const r = await send('answer', { orderId:Number(id), state, terms:o.terms, changes, note }, 'Order #' + id + ' · ' + (state === 'confirmed' ? 'have all' : state === 'none' ? 'none' : outIds.length + ' out'));
    if(priced.length){
      let prods = null;
      try{ prods = await load('products', 'products'); }catch(_){ prods = null; }
      for(const l of priced){
        const row = prods && (prods.items || []).find(p=> l.productId != null && String(p.productId) === String(l.productId) && (p.variantIdx == null ? l.variantIdx == null : Number(p.variantIdx) === Number(l.variantIdx)));
        if(row){ try{ await send('price', { priceId: row.priceId, unitPrice: st.price[l.lineId], lines: [] }, 'New price · ' + fullName(l)); row.proposal = { kind:'price', status:'pending' }; }catch(_){} }
      }
    }
    st.sent = state; st.queued = !!r.queued; st.at = Date.now();
    invalidate('home'); render();
  }catch(err){
    toast(err.message);
    if(err.status === 409){ invalidate('order:' + id); delete OS[id]; }
    render();
  }
}

function demoApi(action, x){
  const t = todayISO();
  const wait = (v)=> new Promise(r=> setTimeout(()=> r(JSON.parse(JSON.stringify(v))), 220));
  const D = demoApi.D || (demoApi.D = demoData(t));
  if(action === 'verify'){
    if(x.pin !== '4829'){ D.tries--; const e = new Error('Wrong PIN'); e.status = D.tries <= 0 ? 429 : 401; e.triesLeft = Math.max(0, D.tries); return new Promise((_,rej)=> setTimeout(()=> rej(e), 300)); }
    return wait({ ok:true, token:'demo', name:'Ronald Ssemanda' });
  }
  if(action === 'order'){ const o = D.orders[x.orderId]; if(!o) return Promise.reject(Object.assign(new Error('That order is not one of yours'), {status:404})); return wait(o); }
  if(action === 'answer'){ D.home.asks.orders = D.home.asks.orders.filter(a=> a.orderId !== x.orderId); return wait({ ok:true, state:x.state }); }
  if(action === 'still'){ D.home.asks.prices = D.home.asks.prices.filter(p=> !x.priceIds.includes(p.priceId)); D.products.items.forEach(p=>{ if(x.priceIds.includes(p.priceId)) p.proposal = { kind:'still', status:'pending' }; }); return wait({ ok:true }); }
  if(action === 'stock'){ (x.priceIds || [x.priceId]).forEach(id=>{ const p = D.products.items.find(i=> i.priceId === id); if(p) p.outOfStock = x.out; }); D.home.asks.prices = D.home.asks.prices.filter(p=> !(x.priceIds||[]).includes(p.priceId)); return wait({ ok:true }); }
  if(action === 'price'){ const p = D.products.items.find(i=> i.priceId === x.priceId); if(p) p.proposal = { kind:'price', status:'pending' }; D.home.asks.prices = D.home.asks.prices.filter(q=> q.priceId !== x.priceId); return wait({ ok:true }); }
  if(action === 'add' || action === 'new'){ D.products.pendingNew += action === 'add' ? x.items.length : 1; return wait({ ok:true }); }
  if(action === 'prefs'){ D.profile.prefs = x.prefs; return wait({ ok:true }); }
  if(action === 'signout' || action === 'ask_pin') return wait({ ok:true });
  if(D[action]) return wait(D[action]);
  return Promise.reject(new Error('Unknown action ' + action));
}
