<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16203C">
<title>Omni-Ware Suppliers</title>
<link rel="manifest" href="/manifest-supplier.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
  /* THE SUPPLIER APP — built to the Omni-Ware Supplier App design canvas.
     Its own language, like client.html's: it shares no token with
     index.html. Navy and ivory, one red for the next move, tabular
     figures, cards that sit a little off the ground. Every colour below
     answers one question: ground/ink, state (green good, amber needs you,
     crimson late), action (red), or identity (teal = you, the supplier). */
  :root{
    --ground:#F7F5F0; --surface:#FFFFFF; --thead:#FAF8F4; --soft:#F1EEE8;
    --ink:#141A2E; --ink2:#3A4256; --cap:#5E6678; --mute:#6F7687;
    --hair:#F0ECE5; --rule:#ECE8E1; --field:#E3DED5;
    --navy:#16203C; --navy-2:#25335E; --on-navy:#FFFFFF; --navy-cap:#AEB7CC; --navy-sub:#C3CADB;
    --red:#C93A30; --red-t:#FDE8E4; --red-ink:#A82D24;
    --green:#0F6B43; --green-t:#E4F4EA; --green-l:#4FBF8A; --green-ll:#7FD8AE;
    --amber:#8A4B08; --amber-t:#FDF1E3; --amber-l:#F2B35E; --amber-row:#FDF7EE;
    --crimson:#8E2A22; --crimson-t:#FBE5E2; --crimson-l:#F0675C;
    --teal:#0E7C7B; --teal-t:#E0F0EF; --teal-ink:#0B5E5D;
    --indigo:#3A3F9B; --indigo-t:#ECEDFA;
    --sky:#1A5A8A; --sky-t:#DCEAF8;
    --clay:#7A4A02; --clay-t:#F3E9DB;
    --slate:#4A5266; --slate-t:#EFECE6;
    --shadow:0 1px 2px rgba(20,26,46,.05),0 10px 28px rgba(20,26,46,.07);
    --raised:0 -12px 48px rgba(12,19,41,.3);
    --tab:rgba(255,255,255,.9); --tab-on:#E9ECF4; --scrim:rgba(12,19,41,.5);
    --card-border:transparent;
    --f:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#0E1424; --surface:#18203A; --thead:#1C2542; --soft:#222C4A;
      --ink:#EEF0F6; --ink2:#C9CEDC; --cap:#A3ABC0; --mute:#A3ABC0;
      --hair:rgba(255,255,255,.06); --rule:rgba(255,255,255,.08); --field:rgba(255,255,255,.14);
      --navy:#18203A; --navy-2:#26335A;
      --red-t:rgba(240,103,92,.16); --red-ink:#FF9A90;
      --green:#4FBF8A; --green-t:rgba(79,191,138,.14);
      --amber:#F2B35E; --amber-t:rgba(242,179,94,.14); --amber-row:rgba(242,179,94,.06);
      --crimson:#FF9A90; --crimson-t:rgba(240,103,92,.14);
      --teal:#5FC7C5; --teal-t:rgba(95,199,197,.14); --teal-ink:#7FD8D6;
      --indigo:#AEB3FF; --indigo-t:rgba(174,179,255,.14);
      --sky:#8EC3EC; --sky-t:rgba(142,195,236,.14);
      --clay:#E9B97A; --clay-t:rgba(233,185,122,.14);
      --slate:#C9CEDC; --slate-t:rgba(255,255,255,.08);
      --shadow:none; --tab:rgba(24,32,58,.92); --tab-on:rgba(255,255,255,.12);
      --card-border:rgba(255,255,255,.06);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ground);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;}
  button,input,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  [hidden]{display:none !important;}
  .app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:96px;background:var(--ground);}
  .app.no-tabs{padding-bottom:24px;}
  @media (min-width:600px){
    body{background:#E9E5DD;}
    .app{margin:24px auto;min-height:calc(100vh - 48px);border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(20,26,46,.18);}
  }
  @media (min-width:600px) and (prefers-color-scheme: dark){ body{background:#070B16;} }

  /* ---- navy header ---- */
  .hdr{position:relative;background:var(--navy);color:var(--on-navy);border-radius:0 0 30px 30px;
    padding:calc(14px + env(safe-area-inset-top)) 20px 18px;display:flex;flex-direction:column;gap:12px;overflow:hidden;}
  .hdr > *{position:relative;}
  .hdr .rings{position:absolute;inset:0;pointer-events:none;}
  .hdr .back{align-self:flex-start;min-height:40px;display:flex;align-items:center;gap:4px;color:var(--navy-sub);font-weight:600;margin-left:-6px;background:none;border:0;cursor:pointer;font-size:15px;padding:0;}
  .cap{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy-cap);}
  .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cap);}
  .h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
  .h1.sm{font-size:26px;}
  .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .fig{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .row-x{display:flex;align-items:center;gap:12px;}
  .grow{flex:1;min-width:0;}
  .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:22px;}
  .icon-btn{width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;position:relative;}
  .avatar{width:44px;height:44px;border-radius:999px;background:var(--teal);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.14);}
  .dot-new{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:999px;background:var(--crimson-l);box-shadow:0 0 0 2px var(--navy);}
  .bar3{display:flex;height:8px;gap:3px;}
  .bar3 i{display:block;border-radius:999px;}
  .legend{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--navy-sub);flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend b{width:8px;height:8px;border-radius:2px;display:inline-block;}
  .seg{display:grid;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.08);}
  .seg button{height:38px;border:0;border-radius:10px;cursor:pointer;font:600 14px var(--f);background:transparent;color:var(--navy-sub);display:flex;align-items:center;justify-content:center;gap:5px;}
  .seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:#fff;color:#16203C;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  .seg .n{font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);color:#fff;}
  .seg button[aria-pressed="true"] .n{background:#16203C;color:#fff;}
  .search{height:46px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;}
  .search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:500 16px var(--f);}
  .search.on-navy{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:var(--navy-cap);}
  .search.on-navy input{color:#fff;} .search.on-navy input::placeholder{color:var(--navy-cap);}
  .search.on-light{background:var(--surface);border:1px solid var(--rule);color:var(--cap);}
  .search.on-light input{color:var(--ink);}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-right:-20px;padding-right:20px;}
  .chips::-webkit-scrollbar{display:none;}
  .chip-btn{flex:none;height:36px;padding:0 14px;border-radius:999px;cursor:pointer;font:600 14px var(--f);border:1px solid rgba(255,255,255,.16);background:transparent;color:#E2E6EF;}
  .chip-btn[aria-pressed="true"]{border:0;background:#fff;color:#16203C;}

  /* ---- body ---- */
  .pad{padding:14px 16px 0;display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--card-border);}
  .card.p{padding:14px;}
  .th{display:grid;align-items:center;gap:8px;min-height:34px;padding:0 14px;background:var(--thead);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--cap);text-transform:uppercase;}
  .tr{display:grid;align-items:center;gap:10px;min-height:56px;padding:0 14px;border-top:1px solid var(--hair);}
  .r{text-align:right;}
  .li{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 10px 0 14px;}
  .li + .li{border-top:1px solid var(--hair);}
  .li-t{font-weight:700;}
  .li-s{font-size:13px;font-weight:600;color:var(--cap);}
  .tile{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;}
  .tile.sm{width:36px;height:36px;border-radius:12px;}
  .t-red{background:var(--red-t);color:var(--red-ink);} .t-amber{background:var(--amber-t);color:var(--amber);}
  .t-green{background:var(--green-t);color:var(--green);} .t-navy{background:var(--tab-on);color:var(--ink);}
  .t-teal{background:var(--teal-t);color:var(--teal);} .t-indigo{background:var(--indigo-t);color:var(--indigo);}
  .t-sky{background:var(--sky-t);color:var(--sky);} .t-clay{background:var(--clay-t);color:var(--clay);}
  .t-slate{background:var(--slate-t);color:var(--slate);}
  .sec{display:flex;align-items:center;gap:8px;padding:0 4px;}
  .sec-t{font-size:18px;font-weight:700;letter-spacing:-.01em;}
  .count{min-width:24px;height:24px;padding:0 7px;border-radius:999px;font:700 13px var(--f);color:#fff;display:flex;align-items:center;justify-content:center;}
  .pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}
  .p-green{background:var(--green-t);color:var(--green);} .p-amber{background:var(--amber-t);color:var(--amber);}
  .p-red{background:var(--crimson-t);color:var(--crimson);} .p-grey{background:var(--soft);color:var(--ink2);}
  .p-indigo{background:var(--indigo-t);color:var(--indigo);}
  .pd{width:7px;height:7px;border-radius:999px;display:inline-block;}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:14px;border:0;cursor:pointer;font:700 15px var(--f);white-space:nowrap;}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn-red{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(201,58,48,.25);}
  .btn-navy{background:#16203C;color:#fff;}
  .btn-soft{background:var(--soft);color:var(--ink);}
  .btn-line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);}
  .btn-ghost{background:transparent;color:var(--cap);font-weight:600;}
  .btn-xl{min-height:58px;font-size:17px;width:100%;}
  .press{transition:transform .12s ease;} .press:active{transform:scale(.97);}

  .sw{position:relative;width:52px;height:32px;border-radius:999px;border:0;padding:0;cursor:pointer;flex:none;transition:background .2s;background:#D9D4CB;}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s cubic-bezier(.2,.8,.2,1);}
  .sw[aria-checked="true"]{background:#0F6B43;}
  .sw[aria-checked="true"]::after{left:23px;}
  .sw.sm{width:48px;height:30px;} .sw.sm::after{width:24px;height:24px;} .sw.sm[aria-checked="true"]::after{left:21px;}

  .field{height:46px;border-radius:14px;border:1px solid var(--field);background:var(--surface);color:var(--ink);padding:0 12px;font:700 17px var(--f);width:100%;outline:none;}
  .field:focus{border:1.5px solid var(--ink);box-shadow:0 0 0 4px rgba(22,32,60,.08);}
  .field.r{text-align:right;}
  .field.want{border:1.5px dashed var(--amber);background:var(--amber-row);}

  .stepper{display:flex;align-items:center;border:1px solid var(--field);border-radius:12px;overflow:hidden;background:var(--surface);}
  .stepper button{width:44px;height:44px;border:0;background:transparent;font:700 20px var(--f);color:var(--ink);cursor:pointer;}
  .stepper b{min-width:40px;text-align:center;font-size:17px;}

  /* ---- tab bar ---- */
  .tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;height:calc(64px + env(safe-area-inset-bottom));
    background:var(--tab);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
    border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px env(safe-area-inset-bottom);z-index:20;}
  @media (min-width:600px){ .tabs{bottom:24px;border-radius:0 0 36px 36px;} }
  .tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--cap);font-size:12px;font-weight:600;}
  .tabs a span{width:56px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;}
  .tabs a[aria-current="page"]{color:var(--ink);font-weight:700;}
  .tabs a[aria-current="page"] span{background:var(--tab-on);}
  .android .tabs{height:calc(80px + env(safe-area-inset-bottom));background:var(--soft);backdrop-filter:none;border-top:0;}
  .android .tabs a span{width:64px;height:32px;}
  .android .tabs a[aria-current="page"] span{background:#D8DCEB;}
  @media (prefers-color-scheme: dark){ .android .tabs a[aria-current="page"] span{background:rgba(255,255,255,.12);} }

  /* ---- sheets, toast ---- */
  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;}
  .sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;max-height:92vh;overflow:auto;background:var(--surface);
    border-radius:30px 30px 0 0;box-shadow:var(--raised);z-index:41;padding:8px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;animation:up .35s cubic-bezier(.2,.8,.2,1) both;}
  .grab{align-self:center;width:40px;height:5px;border-radius:999px;background:#DCD7CE;flex:none;}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));z-index:60;background:#16203C;color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:min(400px,calc(100% - 32px));box-shadow:0 12px 30px rgba(0,0,0,.25);}
  .banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;}
  .demo-tag{position:fixed;left:0;right:0;margin:0 auto;width:max-content;top:calc(2px + env(safe-area-inset-top));z-index:70;background:#F2B35E;color:#3B2203;font:700 10px/1 var(--f);padding:4px 8px;border-radius:999px;letter-spacing:.06em;pointer-events:none;}
  .demo-on .hdr{padding-top:calc(28px + env(safe-area-inset-top));}

  /* ---- motion ---- */
  @keyframes up{from{transform:translate(-50%,48px);opacity:.3}to{transform:translate(-50%,0);opacity:1}}
  @keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  .rise{animation:rise .4s cubic-bezier(.2,.8,.2,1) both;}
  .pop{animation:pop .45s cubic-bezier(.2,.8,.2,1) both;}
  .grow-in{transform-origin:left;animation:grow .7s .1s cubic-bezier(.2,.8,.2,1) both;}
  .shake{animation:shake .42s ease-out;}
  .sk{background:linear-gradient(90deg,var(--rule) 0,var(--hair) 50%,var(--rule) 100%);background-size:400px 100%;animation:shimmer 1.3s linear infinite;border-radius:999px;}
  .sk-d{background:linear-gradient(90deg,rgba(255,255,255,.08) 0,rgba(255,255,255,.18) 50%,rgba(255,255,255,.08) 100%);background-size:400px 100%;animation:shimmer 1.3s linear infinite;border-radius:12px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }
  :focus-visible{outline:2px solid #2A62C9;outline-offset:2px;}
</style>

<body>
<div id="app" class="app" aria-live="polite"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
/* ---------------------------------------------------------------------
 * The supplier app.
 *
 * Talks to ONE endpoint — the supplier-portal Edge Function — which is
 * the only thing that knows anything about this shop and hands back
 * fields it has picked one at a time. Nothing here computes a price or
 * knows who is buying: there is no code path to show a buyer, a sell
 * price or another supplier, which is the point.
 *
 * Standalone, like client.html: it shares no script with index.html.
 *
 * DEMO MODE. Opened with ?demo, or with no shop in the link, the app runs
 * on the sample data from the design canvas and says so in a tag in the
 * corner. Nothing in demo mode reaches the network.
 * ------------------------------------------------------------------- */
/* ---------------- Which Supabase project this copy talks to ----------
 *
 * There is no build step in this project -- these are single HTML files
 * served exactly as they sit in the repo -- so the project cannot be
 * injected at deploy time. It is chosen at run time, from the host the
 * page was opened on. That is what lets the redesign branch and main
 * carry the SAME file: the host decides which database it reaches, not
 * the checkout, so there is never a line here to resolve when the two
 * merge.
 *
 * The list names the PRODUCTION hosts and everything else falls to
 * staging, never the other way round. A list of staging hosts would mean
 * any host nobody thought of -- a fresh preview URL, a renamed project,
 * an old bookmark -- landing on the real books and writing to them. This
 * way an unrecognised host reads the empty copy and the strip in the
 * corner says so.
 *
 * Until BOTH halves are filled in -- a staging project to point at and at
 * least one production host to tell apart from it -- every host gets
 * production. A half-finished switch is the dangerous one: name the
 * staging project without naming the real site and the real site becomes
 * "everything else". So it stays inert until it is whole, and this block
 * cannot change what the live site does before then.
 */
const OW_ENV = (function () {
  const PRODUCTION = {
    name: 'production',
    url: 'https://hgywjaifdmgrcnwxstxg.supabase.co',
  };
  // Fill both in once the staging Supabase project exists, and commit the
  // same values on every branch.
  const STAGING = {
    name: 'staging',
    url: 'https://lmmyzhqdxixjnkkkgnnu.supabase.co',
  };
  // The hosts that ARE the real shop. Add one the day it starts serving
  // the live site, and not before.
  const PRODUCTION_HOSTS = ['omni-ware.vercel.app', 'omni-ware-preview.turyasingurakevin94.workers.dev'];

  function chosen() {
    if (!STAGING.url || !PRODUCTION_HOSTS.length) return PRODUCTION;
    // The Android shell serves the bundle from localhost, so the hostname
    // says nothing about which database it wants. A shipped APK is the
    // real shop; a staging APK would be a separate build.
    if (typeof window !== 'undefined' && window.Capacitor) return PRODUCTION;
    const host = ((typeof location !== 'undefined' && location.hostname) || '').toLowerCase();
    return PRODUCTION_HOSTS.indexOf(host) === -1 ? STAGING : PRODUCTION;
  }

  const env = chosen();
  if (env.name === 'staging') {
    // Small, fixed, and never in the way of a tap: the point is that
    // nobody spends ten minutes entering real figures into the copy.
    //
    // 899 and not the top of the stack. The drawn dropdown at 900 has to
    // stay the highest layer in the app -- a menu opening behind the
    // modal that owns it is a real bug, and dropdown-menu.test.js pins
    // it -- so the strip goes under that and above everything else.
    const mark = function () {
      if (!document.body || document.getElementById('ow-env-mark')) return;
      const el = document.createElement('div');
      el.id = 'ow-env-mark';
      el.textContent = 'STAGING — test data, not the real books';
      el.style.cssText = 'position:fixed;left:0;bottom:0;z-index:899;'
        + 'pointer-events:none;background:#C93A30;color:#fff;'
        + 'font:600 11px/1.1 system-ui,-apple-system,sans-serif;'
        + 'padding:5px 9px;border-radius:0 6px 0 0';
      document.body.appendChild(el);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mark);
    else mark();
  }
  return env;
})();
const SUPABASE_URL = OW_ENV.url;
const FN_URL = SUPABASE_URL.replace(/\.supabase\.co\/?$/, '.functions.supabase.co') + '/supplier-portal';

const K_TOKEN = 'ow_sup_token';
const K_SHOP = 'ow_sup_shop';
const K_DEV = 'ow_sup_device';
const K_QUEUE = 'ow_sup_queue';
const K_SETUP = 'ow_sup_setup';
const K_PHONE = 'ow_sup_phone';

function store(k, v){
  try{
    if(v === undefined) return localStorage.getItem(k);
    if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    return v;
  }catch(_){ return null; }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return Math.round(Number(n) || 0).toLocaleString('en-US'); }
function short(n){
  const v = Math.round(Number(n) || 0);
  if(v >= 1e6) return (v/1e6).toFixed(v >= 1e7 ? 1 : 2).replace(/\.?0+$/,'') + 'M';
  if(v >= 1e3) return Math.round(v/1e3) + 'k';
  return String(v);
}
function plural(n, one, many){ return Number(n) === 1 ? one : (many || one + 's'); }
function todayISO(){ return new Date(Date.now() + 3*3600*1000).toISOString().slice(0,10); }
function addDays(iso, n){ const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function daysFrom(a, b){ return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayParts(iso){ const d = new Date(iso + 'T00:00:00Z'); return { dow: DOW[d.getUTCDay()], d: d.getUTCDate(), mon: MON[d.getUTCMonth()] }; }
function fmtDay(iso){ if(!iso) return ''; const p = dayParts(iso); return p.dow + ' ' + p.d + ' ' + p.mon; }
function fmtShort(iso){ if(!iso) return ''; const p = dayParts(iso); return p.d + ' ' + p.mon; }
function relDay(iso){
  if(!iso) return '';
  const n = daysFrom(todayISO(), iso);
  if(n === 0) return 'today'; if(n === 1) return 'tomorrow'; if(n === -1) return 'yesterday';
  return fmtDay(iso);
}
// askedAt is the owner app's Date.now() at the moment it asked.
function askedLabel(ms){
  const t = Number(ms); if(!t) return '';
  const mins = Math.round((Date.now() - t) / 60000);
  if(mins < 2) return 'just now';
  if(mins < 60) return mins + ' min ago';
  if(mins < 6 * 60) return Math.round(mins / 60) + ' h ago';
  return relDay(new Date(t + 3*3600*1000).toISOString().slice(0,10));
}
function initials(name){ return String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || 'S'; }
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, ms || 2800);
}

/* ---------------- the data layer ---------------- */
async function api(action, extra){
  if(DEMO) return demoApi(action, extra || {});
  const shop = shopId();
  let res, data;
  try{
    res = await fetch(FN_URL, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify(Object.assign({ shopId: shop, action, token: store(K_TOKEN) || '' }, extra || {})),
    });
    data = await res.json().catch(()=>({}));
  }catch(_){
    const e = new Error('No connection'); e.offline = true; throw e;
  }
  if(!res.ok || data.error){
    const e = new Error(data.error || ('Something went wrong (' + res.status + ')'));
    e.status = res.status; e.triesLeft = data.triesLeft; throw e;
  }
  return data;
}
/* A write that cannot reach the shop waits on this phone and goes when
   the line comes back. Only answers that are safe to send late are
   queued: an order answer carries the terms it was given, so if the order
   changed meanwhile the function refuses it and the supplier is told. */
const QUEUEABLE = ['answer','still','stock'];
function queue(){ try{ return JSON.parse(store(K_QUEUE) || '[]'); }catch(_){ return []; } }
function setQueue(q){ store(K_QUEUE, q.length ? JSON.stringify(q) : null); }
async function send(action, extra, label){
  try{ return await api(action, extra); }
  catch(err){
    if(err.offline && QUEUEABLE.includes(action)){
      const q = queue(); q.push({ action, extra, label: label || action, at: Date.now() }); setQueue(q);
      return { ok:true, queued:true };
    }
    throw err;
  }
}
async function flushQueue(){
  const q = queue(); if(!q.length) return;
  const left = [];
  for(const job of q){
    try{ await api(job.action, job.extra); }
    catch(err){ if(err.offline) left.push(job); else left.push(Object.assign({}, job, { failed: err.message })); }
  }
  setQueue(left);
  if(!left.length){ toast('Back online — everything sent'); S.cache = {}; }
  render();
}
window.addEventListener('online', ()=>{ if(queue().length) flushQueue(); else render(); });
window.addEventListener('offline', ()=> render());

const ROUTES = {};
function route(hash){
  const h = (hash || location.hash || '#today').replace(/^#/, '');
  const [name, ...rest] = h.split('/');
  return { name: name || 'today', arg: rest.join('/') };
}
let renderSeq = 0;
async function render(){
  const app = document.getElementById('app');
  const r = route();
  if(!DEMO && !store(K_TOKEN) && r.name !== 'signin'){ location.hash = '#signin'; return; }
  const fn = ROUTES[r.name] || ROUTES.today;
  const seq = ++renderSeq;
  try{
    const out = fn.length ? fn(r.arg) : fn();
    if(out && typeof out.then === 'function'){
      if(fn.skeleton) app.innerHTML = fn.skeleton();
      const html = await out;
      if(seq !== renderSeq) return;
      paint(html);
    }else paint(out);
  }catch(err){
    if(seq !== renderSeq) return;
    paint(failScreen(err));
  }
}

  const app = document.getElementById('app');
  app.innerHTML = html;
  app.classList.toggle('no-tabs', !/class="tabs"/.test(html));
}

      </div>`, ['#today','Today'])}

    </div></div>`;

function prodState(p){
  if(p.outOfStock) return 'out';
  if(p.proposal && p.proposal.status === 'pending') return 'waiting';
  if(p.checkedDays != null && p.checkedDays > 30) return 'check';
  return 'ok';
}
ROUTES.products = async function(){
  const d = await load('products', 'products');
  const u = S.ui;
  const items = d.items || [];
  const cnt = (s)=> items.filter(p=> s === 'all' || prodState(p) === s).length;
  const q = u.prodQ.trim().toLowerCase();
  const shown = items.filter(p=> (u.prodTab === 'all' || prodState(p) === u.prodTab) && (!q || p.name.toLowerCase().includes(q)));
  const checks = items.filter(p=> prodState(p) === 'check');
  const tone = { ok:['var(--green)','var(--ink2)','transparent'], check:['#C98A3A','var(--amber)','var(--amber-t)'], waiting:['var(--indigo)','var(--indigo)','var(--indigo-t)'], out:['var(--crimson)','var(--crimson)','var(--crimson-t)'] };

    const s = prodState(p), t = tone[s];

    </div>`;

  const tabs = [['all','All'],['check','Check'],['waiting','Waiting'],['out','Out']];
  return `${hdr(`<div class="row-x" style="align-items:flex-end"><div class="grow" style="display:flex;flex-direction:column;gap:2px"><div class="cap">${items.filter(p=>!p.outOfStock).length} in stock · ${items.length} items</div><h1 class="h1">Products</h1></div>
      ${DEMO || S.cache.wanted ? `<a href="#wanted" class="btn press" style="height:44px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-size:13px"><span class="count" style="background:var(--amber-l);color:#16203C;min-width:20px;height:20px;font-size:12px">4</span>wanted</a>` : ''}

ROUTES.insights = async function(){
  const per = S.ui.period;
  const d = await load('insights:' + per, 'insights', { period: per });
  const pts = d.series.length ? d.series : [0];
  const W = 350, H = 100, top = 8, pad = 6, max = Math.max(1, ...pts) * 1.06;
  const xy = pts.map((v,i)=> [pad + (pts.length===1 ? (W-2*pad)/2 : i*(W-2*pad)/(pts.length-1)), H - (v/max)*(H-top)]);
  const line = 'M' + xy.map(p=> p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
  const area = line + ` L${xy[xy.length-1][0].toFixed(1)} ${H} L${pad} ${H} Z`;
  const last = xy[xy.length-1];
  const topU = Math.max(1, ...d.best.map(b=> b.units));

      <div class="row-x" style="align-items:flex-end;justify-content:space-between"><div style="display:flex;flex-direction:column;gap:4px"><div class="cap">Sold through us · UGX</div><div class="row-x" style="gap:8px;align-items:baseline"><div class="fig" style="font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1">${short(d.value)}</div>${d.change != null ? `<span class="pill" style="background:rgba(79,191,138,.16);color:var(--green-ll)">${d.change>=0?'▲':'▼'} ${Math.abs(d.change)}%</span>` : ''}</div></div>
      <div class="row-x" style="gap:8px"><div style="position:relative;width:46px;height:46px">${ring(d.agentsTotal ? d.agents/d.agentsTotal : 0,46,4,'var(--green-l)','rgba(255,255,255,.14)',d.agents+' of '+d.agentsTotal+' agents sell your items')}<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">${d.agents}</div></div><div style="font-size:12px;font-weight:600;color:var(--navy-sub);line-height:1.25">of ${d.agentsTotal}<br>agents</div></div></div>
      <div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between" class="cap"><span>Sold each ${esc(d.bucket)}</span><span>${money(d.units)} units</span></div>
      <svg viewBox="0 0 350 110" width="100%" height="110" role="img" aria-label="Units sold, ${d.series.join(', ')}"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FBF8A" stop-opacity=".35"></stop><stop offset="1" stop-color="#4FBF8A" stop-opacity="0"></stop></linearGradient></defs><line x1="0" y1="100" x2="350" y2="100" stroke="#fff" stroke-opacity=".12"></line><line x1="0" y1="55" x2="350" y2="55" stroke="#fff" stroke-opacity=".08" stroke-dasharray="3 5"></line><path d="${area}" fill="url(#ar)"></path><path d="${line}" fill="none" stroke="#4FBF8A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" fill="#4FBF8A" stroke="var(--navy)" stroke-width="2.5"></circle></svg></div>`)}
    <div class="pad"><div class="card"><div class="th" style="grid-template-columns:24px 1fr 60px 64px"><div>#</div><div>Best sellers</div><div class="r">Units</div><div class="r">Change</div></div>

/* Typing re-renders on change (blur / Enter) rather than on every key, so
   the field a supplier is typing in keeps its caret; search lists filter
   live because they re-render after a short pause. */
const LIVE = ['prodQ','invQ','addQ','niCatQ','pePrice'];
let typeT = null;
document.addEventListener('input', (e)=>{
  const el = e.target; const k = el.dataset && el.dataset.in; if(!k || !INPUTS[k]) return;
  INPUTS[k](el);
  if(LIVE.includes(k)){ clearTimeout(typeT); typeT = setTimeout(()=> restoreFocus(k), 250); }
});
document.addEventListener('change', (e)=>{
  const el = e.target; const k = el.dataset && el.dataset.in; if(!k || LIVE.includes(k)) return;
  render();
});
function restoreFocus(k){
  render().then(()=>{
    const el = document.querySelector(`[data-in="${k}"]`);
    if(el){ el.focus(); const v = el.value; el.setSelectionRange && el.setSelectionRange(v.length, v.length); }
  });
}

/* ---------------- sign-in and answering ---------------- */
async function pinPress(k){
  if(SI.status === 'locked' || SI.busy || SI.pin.length >= 4) return;
  SI.pin += k; SI.shake = 0;
  if(SI.pin.length < 4){ render(); return; }
  const phone = (document.getElementById('siPhone')||{}).value || '';
  store(K_PHONE, phone);
  SI.busy = true; render();
  try{
    const r = await api('verify', { phone, pin: SI.pin, deviceId: deviceId() });
    store(K_TOKEN, r.token); SI.status = 'ok'; SI.msg = 'PIN accepted'; SI.busy = false; render();
    const st = JSON.parse(store(K_SETUP) || '{}');
    setTimeout(()=> go(st.seen ? '#today' : '#welcome'), 450);
  }catch(err){
    SI.busy = false; SI.pin = '';
    if(err.status === 429 || err.triesLeft === 0){ SI.status = 'locked'; SI.msg = 'Locked · ask Omni-Ware for a new PIN'; }
    else { SI.status = 'wrong'; SI.shake = Date.now(); SI.msg = err.triesLeft != null ? 'Wrong PIN · ' + err.triesLeft + ' ' + plural(err.triesLeft,'try','tries') + ' left' : err.message; }
    render();
  }
}
async function answerOrder(id, none){
  const o = S.cache['order:' + id]; const st = OS[id];
  if(none) o.lines.forEach(l=> st.have[l.lineId] = 0);
  const shortN = Object.keys(st.have).length;
  const state = none ? 'none' : shortN ? 'short' : 'confirmed';
  const changes = Object.keys(st.have).map(k=> ({ lineId: Number(k), have: st.have[k] }));
  try{
    const r = await send('answer', { orderId:Number(id), state, terms:o.terms, changes }, 'Order ' + id + ' · ' + (state==='confirmed'?'have all':state==='none'?'none':shortN+' short'));
    st.sent = state; st.queued = !!r.queued;
    S.ui.done['o' + id] = state === 'confirmed' ? 'Confirmed' : 'Sent';
    invalidate('home'); render();
  }catch(err){ toast(err.message); if(err.status === 409){ invalidate('order:' + id); render(); } }
}

/* ======================================================================
   DEMO DATA — the design canvas's sample supplier. Never reaches the
   network; every figure here is invented and the corner tag says so.
   ====================================================================== */
function demoApi(action, x){
  const t = todayISO();
  const wait = (v)=> new Promise(r=> setTimeout(()=> r(JSON.parse(JSON.stringify(v))), 220));
  const D = demoApi.D || (demoApi.D = demoData(t));
  if(action === 'verify'){
    if(x.pin !== '4829'){ D.tries--; const e = new Error('Wrong PIN'); e.status = D.tries <= 0 ? 429 : 401; e.triesLeft = Math.max(0, D.tries); return new Promise((_,rej)=> setTimeout(()=> rej(e), 300)); }
    return wait({ ok:true, token:'demo', name:'Mukwano Building Supplies' });
  }
  if(action === 'order'){ const o = D.orders[x.orderId]; if(!o) return Promise.reject(Object.assign(new Error('That order is not one of yours'), {status:404})); return wait(o); }
  if(action === 'answer'){ D.home.asks.orders = D.home.asks.orders.filter(a=> a.orderId !== x.orderId); return wait({ ok:true, state:x.state }); }
  if(action === 'still'){ D.home.asks.prices = D.home.asks.prices.filter(p=> !x.priceIds.includes(p.priceId)); return wait({ ok:true }); }
  if(action === 'stock'){ const p = D.products.items.find(i=> i.priceId === x.priceId); if(p) p.outOfStock = x.out; return wait({ ok:true }); }
  if(action === 'price'){ const p = D.products.items.find(i=> i.priceId === x.priceId); if(p) p.proposal = { kind:'price', status:'pending' }; return wait({ ok:true }); }
  if(action === 'add' || action === 'new'){ D.products.pendingNew += action === 'add' ? x.items.length : 1; return wait({ ok:true }); }
  if(action === 'insights') return wait(D.insights[x.period] || D.insights['30d']);
  if(action === 'prefs'){ D.profile.prefs = x.prefs; return wait({ ok:true }); }
  if(action === 'signout' || action === 'ask_pin') return wait({ ok:true });
  if(D[action]) return wait(D[action]);
  return Promise.reject(new Error('Unknown action ' + action));
}
