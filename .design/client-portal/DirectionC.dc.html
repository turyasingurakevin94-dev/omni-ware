<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap">
  <style>
    *{box-sizing:border-box;}
    body{margin:0;background:#FFFFFF;color:#3A3E42;font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.4;}
    .ph{background:#DFE3E6;border-radius:2px;}
    .cap{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#969CA1;}
  </style>
</helmet>

<div style="width:390px;min-height:844px;background:#EDEFF1;display:flex;flex-direction:column;border:1px dashed #BFC5C9;">

  <div style="padding:14px 18px 12px;background:#FFFFFF;border-bottom:1px dashed #D2D8DC;display:flex;flex-direction:column;gap:3px;">
    <div class="cap">Direction C</div>
    <div style="font-size:19px;font-weight:600;color:#2A2A2A;">Console</div>
    <div style="font-size:12.5px;color:#868C91;">The staff app's own vocabulary, handed to the customer</div>
  </div>

  <!-- Navy chrome bar, as the internal app has -->
  <div style="height:44px;background:#4A4F55;display:flex;align-items:center;padding:0 14px;gap:10px;">
    <div class="ph" style="width:84px;height:9px;background:#7E858C;"></div>
    <div style="flex-grow:1;"></div>
    <div class="ph" style="width:18px;height:18px;background:#7E858C;"></div>
  </div>

  <!-- Dense metric strip, 2x2, hairline dividers, no per-tile borders -->
  <div style="background:#FFFFFF;border-bottom:1px solid #D8DCDF;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));">
    <div style="padding:11px 14px;border-right:1px solid #E8EBED;border-bottom:1px solid #E8EBED;display:flex;flex-direction:column;gap:5px;">
      <div class="ph" style="width:44px;height:7px;"></div>
      <div class="ph" style="width:78px;height:15px;background:#D2D6D9;"></div>
      <div class="ph" style="width:60px;height:6px;"></div>
    </div>
    <div style="padding:11px 14px;border-bottom:1px solid #E8EBED;display:flex;flex-direction:column;gap:5px;">
      <div class="ph" style="width:38px;height:7px;"></div>
      <div class="ph" style="width:66px;height:15px;background:#D2D6D9;"></div>
      <div class="ph" style="width:52px;height:6px;"></div>
    </div>
    <div style="padding:11px 14px;border-right:1px solid #E8EBED;display:flex;flex-direction:column;gap:5px;">
      <div class="ph" style="width:40px;height:7px;"></div>
      <div class="ph" style="width:70px;height:15px;background:#D2D6D9;"></div>
      <div class="ph" style="width:56px;height:6px;"></div>
    </div>
    <div style="padding:11px 14px;display:flex;flex-direction:column;gap:5px;">
      <div class="ph" style="width:46px;height:7px;"></div>
      <div class="ph" style="width:58px;height:15px;background:#D2D6D9;"></div>
      <div class="ph" style="width:48px;height:6px;"></div>
    </div>
  </div>

  <!-- A bordered panel with a 34px header and dense rows -->
  <div style="margin:12px;background:#FFFFFF;border:1px solid #D8DCDF;border-radius:8px;overflow:hidden;">
    <div style="height:34px;background:#F6F8F9;border-bottom:1px solid #E3E7EA;display:flex;align-items:center;padding:0 12px;gap:8px;">
      <div class="ph" style="width:76px;height:8px;"></div>
      <div style="flex-grow:1;"></div>
      <div class="ph" style="width:30px;height:8px;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:0 12px;height:44px;border-bottom:1px solid #EDF0F2;">
      <div class="ph" style="flex-grow:1;height:8px;"></div>
      <div class="ph" style="width:52px;height:10px;background:#D2D6D9;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:0 12px;height:44px;border-bottom:1px solid #EDF0F2;">
      <div class="ph" style="flex-grow:1;height:8px;"></div>
      <div class="ph" style="width:52px;height:10px;background:#D2D6D9;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:0 12px;height:44px;border-bottom:1px solid #EDF0F2;">
      <div class="ph" style="flex-grow:1;height:8px;"></div>
      <div class="ph" style="width:52px;height:10px;background:#D2D6D9;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:0 12px;height:44px;">
      <div class="ph" style="flex-grow:1;height:8px;"></div>
      <div class="ph" style="width:52px;height:10px;background:#D2D6D9;"></div>
    </div>
  </div>

  <div style="margin:0 12px;background:#FFFFFF;border:1px solid #D8DCDF;border-radius:8px;overflow:hidden;">
    <div style="height:34px;background:#F6F8F9;border-bottom:1px solid #E3E7EA;display:flex;align-items:center;padding:0 12px;">
      <div class="ph" style="width:92px;height:8px;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:0 12px;height:44px;border-bottom:1px solid #EDF0F2;">
      <div class="ph" style="flex-grow:1;height:8px;"></div>
      <div class="ph" style="width:44px;height:10px;background:#D2D6D9;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:0 12px;height:44px;">
      <div class="ph" style="flex-grow:1;height:8px;"></div>
      <div class="ph" style="width:44px;height:10px;background:#D2D6D9;"></div>
    </div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="padding:16px 18px;">
    <div style="font-size:12px;color:#868C91;line-height:1.55;"><strong style="color:#5A5A5A;font-weight:600;">Free to build, wrong to look at.</strong> Zero new tokens and one system to maintain &mdash; but a customer handed the staff chrome assumes they are seeing staff data, and a fundi in a yard gets an admin panel.</div>
  </div>

  <div style="height:60px;background:#FFFFFF;border-top:1px solid #D8DCDF;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;">
    <div style="display:flex;justify-content:center;"><div class="ph" style="width:20px;height:20px;background:#BDC3C8;"></div></div>
    <div style="display:flex;justify-content:center;"><div class="ph" style="width:20px;height:20px;"></div></div>
    <div style="display:flex;justify-content:center;"><div class="ph" style="width:20px;height:20px;"></div></div>
    <div style="display:flex;justify-content:center;"><div class="ph" style="width:20px;height:20px;"></div></div>
    <div style="display:flex;justify-content:center;"><div class="ph" style="width:20px;height:20px;"></div></div>
  </div>

</div>
</x-dc>
</body>
</html>
