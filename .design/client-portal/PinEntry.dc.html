<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Public+Sans:wght@400;500;600&display=swap">
  <style>
    *{box-sizing:border-box;}
    body{margin:0;background:#F4F1EA;color:#1A1714;font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
    a{color:#14594A;text-decoration:none;}
    a:hover{color:#0E3F35;}
    .fig{font-family:'Newsreader',Georgia,'Times New Roman',serif;font-variant-numeric:tabular-nums lining;font-feature-settings:'tnum' 1;letter-spacing:-.01em;font-weight:400;}
    .ser{font-family:'Newsreader',Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.01em;}
    .lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#9A9187;}
    .meta{font-size:11.5px;color:#9A9187;line-height:1.4;}
    .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
    .box{width:68px;height:76px;border:1px solid #C7BFB2;border-radius:4px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:30px;}
  </style>
</helmet>

<div style="width:390px;min-height:844px;background:#F4F1EA;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;gap:8px;padding:0 16px 0 6px;min-height:56px;">
    <div style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1714" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div>
  </div>

  <div style="padding:18px 28px 0;display:flex;flex-direction:column;gap:10px;">
    <div class="ser" style="font-size:30px;line-height:1.15;">Enter your PIN</div>
    <div style="font-size:14.5px;color:#6B635A;line-height:1.5;">We sent four figures to <span style="color:#1A1714;font-weight:600;">0772 418 903</span> on WhatsApp.</div>
  </div>

  <!-- Four boxes. No fake keyboard: the real one renders on top of this. -->
  <div style="padding:30px 28px 0;display:flex;gap:12px;">
    <div class="box fig">7</div>
    <div class="box fig">2</div>
    <div class="box" style="border-color:#1A1714;border-width:1.5px;"><span style="width:1.5px;height:30px;background:#1A1714;"></span></div>
    <div class="box"></div>
  </div>

  <div style="padding:16px 28px 0;">
    <div style="font-size:12.5px;color:#6B635A;">This PIN lasts ten minutes. <span class="fig">9:12</span> left.</div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="padding:0 28px 12px;display:flex;flex-direction:column;gap:12px;">
    <div style="display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:4px;background:#14594A;color:#FFFFFF;font-size:15.5px;font-weight:600;">Sign in</div>
    <div style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:4px;border:1px solid #DDD6CA;background:#FFFFFF;font-size:14.5px;color:#9A9187;">Send it again in <span class="fig" style="margin-left:5px;">0:47</span></div>
  </div>

  <div style="padding:6px 28px 22px;display:flex;flex-direction:column;gap:4px;">
    <div style="display:flex;align-items:center;justify-content:center;min-height:44px;"><span style="font-size:13px;color:#6B635A;">Not your number? <span style="color:#14594A;font-weight:600;">Go back and change it</span></span></div>
    <div class="meta" style="text-align:center;line-height:1.5;">We never ask for this PIN on the phone. If somebody rings asking for it, it is not us.</div>
  </div>

</div>
</x-dc>
</body>
</html>
