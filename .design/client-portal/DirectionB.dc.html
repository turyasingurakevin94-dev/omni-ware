<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap">
  <style>
    *{box-sizing:border-box;}
    body{margin:0;background:#FFFFFF;color:#3A3A3A;font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.4;}
    .ph{background:#E6E6E6;border-radius:3px;}
    .cap{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9B9B9B;}
  </style>
</helmet>

<div style="width:390px;min-height:844px;background:#FFFFFF;display:flex;flex-direction:column;border:1px dashed #C4C4C4;">

  <div style="padding:14px 18px 12px;border-bottom:1px dashed #D6D6D6;display:flex;flex-direction:column;gap:3px;">
    <div class="cap">Direction B</div>
    <div style="font-size:19px;font-weight:600;color:#2A2A2A;">Shopfront</div>
    <div style="font-size:12.5px;color:#8A8A8A;">Cards, photos, a tab bar &mdash; the app shape people already know</div>
  </div>

  <!-- Brand band -->
  <div style="height:104px;background:#DCDCDC;display:flex;align-items:center;padding:0 18px;gap:12px;">
    <div class="ph" style="width:40px;height:40px;border-radius:20px;background:#CFCFCF;"></div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div class="ph" style="width:130px;height:11px;background:#CFCFCF;"></div>
      <div class="ph" style="width:88px;height:9px;background:#CFCFCF;"></div>
    </div>
  </div>

  <!-- Overlapping balance card -->
  <div style="padding:0 18px;margin-top:-26px;">
    <div style="background:#FFFFFF;border:1px solid #DEDEDE;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.07);padding:15px;display:flex;flex-direction:column;gap:8px;">
      <div class="cap">Balance</div>
      <div class="ph" style="width:150px;height:24px;"></div>
      <div class="ph" style="width:110px;height:9px;"></div>
    </div>
  </div>

  <!-- Quick action tiles -->
  <div style="padding:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;">
    <div style="border:1px solid #E2E2E2;border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;">
      <div class="ph" style="width:24px;height:24px;border-radius:12px;"></div>
      <div class="ph" style="width:38px;height:8px;"></div>
    </div>
    <div style="border:1px solid #E2E2E2;border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;">
      <div class="ph" style="width:24px;height:24px;border-radius:12px;"></div>
      <div class="ph" style="width:38px;height:8px;"></div>
    </div>
    <div style="border:1px solid #E2E2E2;border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;">
      <div class="ph" style="width:24px;height:24px;border-radius:12px;"></div>
      <div class="ph" style="width:38px;height:8px;"></div>
    </div>
  </div>

  <!-- Product carousel -->
  <div style="padding:0 18px;display:flex;flex-direction:column;gap:11px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="ph" style="width:104px;height:11px;"></div>
      <div style="flex-grow:1;"></div>
      <div class="ph" style="width:44px;height:9px;"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;">
      <div style="border:1px solid #E2E2E2;border-radius:10px;overflow:hidden;">
        <div class="ph" style="height:96px;border-radius:0;"></div>
        <div style="padding:10px;display:flex;flex-direction:column;gap:6px;">
          <div class="ph" style="width:100%;height:9px;"></div>
          <div class="ph" style="width:62px;height:13px;background:#D2D2D2;"></div>
        </div>
      </div>
      <div style="border:1px solid #E2E2E2;border-radius:10px;overflow:hidden;">
        <div class="ph" style="height:96px;border-radius:0;"></div>
        <div style="padding:10px;display:flex;flex-direction:column;gap:6px;">
          <div class="ph" style="width:80%;height:9px;"></div>
          <div class="ph" style="width:62px;height:13px;background:#D2D2D2;"></div>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="padding:16px 18px;">
    <div style="font-size:12px;color:#8A8A8A;line-height:1.55;"><strong style="color:#5A5A5A;font-weight:600;">Reads as a shop.</strong> The price becomes the hero and the balance is a card among cards &mdash; so the thing that actually holds a customer is the thing they scroll past.</div>
  </div>

  <!-- Tab bar -->
  <div style="height:64px;border-top:1px solid #DEDEDE;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;"><div class="ph" style="width:20px;height:20px;background:#BDBDBD;"></div><div class="ph" style="width:26px;height:6px;background:#BDBDBD;"></div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;"><div class="ph" style="width:20px;height:20px;"></div><div class="ph" style="width:26px;height:6px;"></div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;"><div class="ph" style="width:20px;height:20px;"></div><div class="ph" style="width:26px;height:6px;"></div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;"><div class="ph" style="width:20px;height:20px;"></div><div class="ph" style="width:26px;height:6px;"></div></div>
  </div>

</div>
</x-dc>
</body>
</html>
