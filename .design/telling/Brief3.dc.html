<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root{
      --ow-steel-950:#16203C; --ow-steel-800:#243052; --ow-steel-400:#767F91;
      --ow-steel-100:#E0DCD4; --ow-steel-050:#F7F5F2;
      --ow-paper:#FFFFFF; --ow-paper-2:#FCFBF9;
      --ow-oxide:#C93A30; --ow-oxide-deep:#A82D24; --ow-oxide-light:#E5483D; --ow-oxide-soft:#FDE8E4;
      --ow-verdigris:#0F6B43; --ow-verdigris-soft:#E4F4EA;
      --ow-amber:#95530C; --ow-amber-soft:#FDEEE1; --ow-amber-faint:#FEF8F2; --ow-amber-ink:#7A4A02;
      --ow-crimson:#8E2A22; --ow-crimson-soft:#FBE5E2;
      --ow-ink-900:#1C2233; --ow-ink-600:#5F6980; --ow-ink-400:#767F91;
      --ow-rule:#E6E3DD; --ow-rule-soft:#EFECE6;
      --ow-r-sm:4px; --ow-r:6px; --ow-r-lg:8px; --ow-r-pill:999px;
      --ow-lift:0 4px 16px rgba(15,20,25,.14);
      --ow-measure:76ch;
      --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    }
    body{margin:0;font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
      color:var(--ow-ink-900);background:var(--ow-steel-050);-webkit-font-smoothing:antialiased;}
    a{color:var(--ow-oxide);} a:hover{color:var(--ow-oxide-deep);}
    .app{position:relative;background:var(--ow-steel-050);overflow:hidden;}

    /* ---- chrome: navy top bar + rail ---- */
    .topbar{position:absolute;top:0;left:0;right:0;height:54px;background:var(--ow-steel-950);
      display:flex;align-items:center;gap:6px;padding:0 18px 0 20px;color:#fff;
      box-shadow:0 1px 0 rgba(255,255,255,0.07);z-index:3;}
    .brand{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-right:18px;}
    .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ow-oxide);color:#fff;
      display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:13px;}
    .brand .tag{font-family:'Archivo Black',sans-serif;font-size:16.5px;letter-spacing:.4px;line-height:1.15;}
    .tb-where{display:flex;align-items:baseline;gap:7px;font-size:13px;font-weight:600;white-space:nowrap;}
    .tb-where .g{color:#8E9BA8;font-weight:500;}
    .tb-sp{flex:1;}
    .tb-ic{width:18px;height:18px;fill:none;stroke:#C7CFD8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .sidebar{position:absolute;top:54px;left:0;bottom:0;width:220px;background:var(--ow-steel-950);
      padding:14px 10px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;z-index:2;}
    .nav-section-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
      color:#7C8894;padding:12px 12px 6px;}
    .nav-b{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;
      font-size:13.5px;font-weight:500;color:#C7CFD8;white-space:nowrap;}
    .nav-b .nav-icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;flex:none;}
    .nav-b.active{background:var(--ow-oxide);color:#fff;font-weight:700;}
    .nav-badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;
      background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:1px 6px;}
    .nav-b.active .nav-badge{background:rgba(255,255,255,.24);}
    .main{position:absolute;top:54px;left:220px;right:0;bottom:0;padding:26px 40px 32px;box-sizing:border-box;overflow:hidden;}

    /* ---- page header ---- */
    .ow-ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;
      border-bottom:1px solid var(--ow-rule);padding:0 0 12px;margin-bottom:16px;}
    .ow-ph-t{font-family:'Archivo Black',sans-serif;font-size:19px;margin:0;letter-spacing:-.015em;line-height:1.1;}
    .ow-ph-sub{font-size:12px;color:var(--ow-ink-600);margin:0 0 1px;}
    .ow-ph-sp{flex:1;}
    .ow-f{display:flex;flex-direction:column;gap:4px;min-width:0;}
    .ow-f-l{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ow-ink-600);}
    .ow-f-in{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;min-width:124px;box-sizing:border-box;
      border:1px solid var(--ow-rule);border-radius:var(--ow-r);background:var(--ow-paper);}
    .ow-f-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ow-ink-900);}
    .ow-f-u{font-size:11px;color:var(--ow-ink-600);margin-left:auto;}

    /* ---- panels, strip, chips ---- */
    .ow-pan{background:var(--ow-paper);border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);overflow:hidden;}
    .ow-pan-h{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;
      border-bottom:1px solid var(--ow-rule-soft);background:var(--ow-paper-2);}
    .ow-pan-t{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ow-ink-600);}
    .ow-pan-n{font-size:11px;color:var(--ow-ink-600);margin-left:auto;white-space:nowrap;
      font-family:var(--mono);font-variant-numeric:tabular-nums;}
    .ow-mini{font-size:11px;color:var(--ow-ink-600);line-height:1.45;margin:0;padding:8px 12px;
      border-top:1px solid var(--ow-rule-soft);max-width:var(--ow-measure);}
    .ow-empty{padding:32px;text-align:center;color:var(--ow-ink-600);font-size:13px;}

    .ow-strip{display:grid;grid-template-columns:repeat(5,1fr);background:var(--ow-paper);
      border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);overflow:hidden;}
    .ow-mt{padding:10px 16px;border-left:1px solid var(--ow-rule-soft);}
    .ow-mt:first-child{border-left:0;}
    .ow-mt-l{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
      color:var(--ow-ink-600);margin:0 0 4px;}
    .ow-mt-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;
      letter-spacing:-.03em;line-height:1.1;display:block;}
    .ow-mt-s{font-size:11px;color:var(--ow-ink-600);margin:4px 0 0;line-height:1.35;}

    .ow-cp{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.02em;
      height:18px;padding:0 6px;border-radius:var(--ow-r-sm);background:var(--ow-steel-050);
      color:var(--ow-ink-600);white-space:nowrap;flex:none;}
    .ow-cp.ow-good{background:var(--ow-verdigris-soft);color:var(--ow-verdigris);}
    .ow-cp.ow-warn{background:var(--ow-amber-soft);color:var(--ow-amber-ink);}
    .ow-cp.ow-bad{background:var(--ow-crimson-soft);color:var(--ow-crimson);}
    .ow-cp.ow-mg{background:var(--ow-oxide-soft);color:var(--ow-oxide-deep);}
    .ow-cp-d{width:5px;height:5px;border-radius:50%;background:currentColor;}

    .ow-av{width:34px;height:34px;border-radius:var(--ow-r);background:var(--ow-steel-050);
      color:var(--ow-ink-600);font-size:12px;font-weight:600;letter-spacing:.02em;
      display:flex;align-items:center;justify-content:center;flex:none;}

    /* ---- the list row ---- */
    .ow-lr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;
      width:100%;min-height:44px;padding:6px 12px;box-sizing:border-box;
      border-bottom:1px solid var(--ow-rule-soft);border-left:3px solid transparent;background:none;}
    .ow-lr:last-child{border-bottom:0;}
    .ow-lr.ow-on{background:var(--ow-paper-2);border-left-color:var(--ow-steel-950);}
    .ow-lr-n{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:500;line-height:1.3;}
    .ow-lr-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ow-lr-m{grid-column:1;min-width:0;font-size:11px;color:var(--ow-ink-600);line-height:1.35;margin-top:1px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ow-lr-v{grid-column:2;grid-row:1 / span 2;text-align:right;white-space:nowrap;
      font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;letter-spacing:-.02em;}
    .ow-lr-b{display:block;font-family:'Figtree',system-ui,sans-serif;font-size:11px;font-weight:400;
      color:var(--ow-ink-600);letter-spacing:0;margin-top:1px;}

    /* ---- buttons ---- */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
      padding:10px 18px;border-radius:7px;font-size:14px;font-weight:700;box-sizing:border-box;}
    .btn.ow-sm{padding:0 10px;height:28px;font-size:12px;font-weight:600;}
    .btn-accent{background:var(--ow-oxide);color:#fff;}
    .btn-ghost{background:transparent;color:var(--ow-ink-600);border:1px solid var(--ow-rule);}
    .btn .icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;flex:none;}

    /* ---- the message ---- */
    .ow-msg-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
    .ow-msg-t{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ow-ink-600);}
    .ow-msg-to{margin-left:auto;min-width:0;font-size:11px;color:var(--ow-ink-600);
      font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ow-msg{border:1px solid var(--ow-rule);border-radius:var(--ow-r);background:var(--ow-paper-2);
      padding:10px 12px;font-size:13px;line-height:1.46;white-space:pre-wrap;color:var(--ow-ink-900);}
    .ow-msg-n{font-size:11px;color:var(--ow-ink-600);margin:6px 0 0;line-height:1.45;max-width:var(--ow-measure);}

    .ow-q-un{display:inline-flex;align-items:flex-start;gap:7px;font-size:11px;color:var(--ow-amber-ink);
      background:var(--ow-amber-soft);border:1px solid #EBD9B4;border-radius:var(--ow-r-sm);padding:6px 8px;}
    .ow-q-un svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;flex:none;margin-top:1px;}

    .search{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;
      border-bottom:1px solid var(--ow-rule-soft);color:var(--ow-ink-400);font-size:12px;}
    .search svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;flex:none;}

    /* ---- added for the consignment console ---- */
    .ow-grid{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:16px;align-items:start;}
    .ow-side{display:flex;flex-direction:column;gap:16px;}
    .ow-stack{display:flex;flex-direction:column;gap:16px;}
    .ow-ph-i{width:17px;height:17px;border-radius:50%;border:1px solid var(--ow-rule);
      color:var(--ow-ink-400);font-size:11px;font-weight:700;display:inline-flex;
      align-items:center;justify-content:center;align-self:center;margin-left:2px;font-family:'Figtree',sans-serif;}
    .ow-mt.ow-warn .ow-mt-v{color:var(--ow-amber-ink);}
    .ow-mt.ow-good .ow-mt-v{color:var(--ow-verdigris);}
    .ow-mt-v .ow-u{font-size:.55em;color:var(--ow-ink-400);margin-left:.3em;letter-spacing:0;}

    /* the work queue */
    .ow-q{border-bottom:1px solid var(--ow-rule-soft);}
    .ow-q:last-child{border-bottom:0;}
    .ow-q-r{display:grid;grid-template-columns:18px minmax(0,1fr) 152px 128px;align-items:center;
      gap:10px;width:100%;min-height:44px;padding:6px 12px;box-sizing:border-box;border:0;background:none;text-align:left;}
    .ow-q.ow-open .ow-q-r{background:var(--ow-paper-2);}
    .ow-q-cr{width:12px;height:12px;color:var(--ow-ink-400);justify-self:center;
      fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .ow-q.ow-open .ow-q-cr{transform:rotate(90deg);}
    .ow-q-t{min-width:0;font-size:13px;font-weight:500;letter-spacing:-.005em;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ow-q-who{font-weight:600;}
    .ow-q-sep{color:var(--ow-ink-400);margin:0 2px;}
    .ow-q-rest{color:var(--ow-ink-600);}
    .ow-q-m{display:flex;gap:4px;align-items:center;justify-content:flex-end;min-width:0;}
    .ow-q-v{text-align:right;}
    .ow-q-f{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;
      font-weight:600;letter-spacing:-.02em;display:block;}
    .ow-q-b{font-size:11px;color:var(--ow-ink-600);display:block;margin-top:-1px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ow-q-v.ow-zero .ow-q-f{color:var(--ow-ink-400);}
    .ow-q-x{padding:2px 12px 14px 40px;}
    .ow-q-why{font-size:13px;color:var(--ow-ink-600);line-height:1.5;max-width:var(--ow-measure);margin:0 0 10px;}
    .ow-q-a{display:flex;gap:6px;flex-wrap:wrap;}

    /* their goods, inside an open row */
    .cg{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 10px;}
    .cg caption{text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;
      text-transform:uppercase;color:var(--ow-ink-600);padding:0 0 6px;}
    .cg th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
      color:var(--ow-ink-400);text-align:right;padding:0 0 5px 16px;border-bottom:1px solid var(--ow-rule-soft);white-space:nowrap;}
    .cg th.l{text-align:left;padding-left:0;}
    .cg td{padding:7px 0 7px 16px;border-bottom:1px solid var(--ow-rule-soft);
      text-align:right;white-space:nowrap;width:1%;
      font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
    .cg tr:last-child td{border-bottom:0;}
    .cg td.nm{width:auto;padding-left:0;text-align:left;white-space:nowrap;font-family:'Figtree',sans-serif;
      font-weight:500;min-width:0;max-width:0;overflow:hidden;text-overflow:ellipsis;}
    .cg td.w{font-weight:600;}
    .cg td.a{padding-left:14px;}
    .cg td.a .btn{padding:0 9px;height:24px;font-size:11px;font-weight:600;}

    /* the foot of an open row */
    .cf{display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding-top:10px;border-top:1px solid var(--ow-rule-soft);}
    .cf-n{margin:0;font-size:11px;color:var(--ow-ink-600);line-height:1.45;max-width:60ch;}

    /* rail figures */
    .rf{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
      padding:7px 12px;border-top:1px solid var(--ow-rule-soft);}
    .rf-l{font-size:11px;color:var(--ow-ink-600);min-width:0;}
    .rf-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;
      font-weight:600;letter-spacing:-.02em;white-space:nowrap;}
    .rf-v.warn{color:var(--ow-amber-ink);}
    .rl{margin:0;padding:8px 12px 10px;font-size:11px;color:var(--ow-ink-600);line-height:1.5;}
    .rl b{color:var(--ow-ink-900);font-weight:600;}
    .rl + .rl{border-top:1px solid var(--ow-rule-soft);}
    /* ================= THE CLIENT'S PICTURE =================
       Words are labels, never sentences. A photo, a number, a price and
       at most six words a frame -- the four things anybody reads. */
    .b{position:absolute;inset:0;font-family:'Figtree',system-ui,sans-serif;box-sizing:border-box;
      display:flex;flex-direction:column;}
    .b .mk{position:absolute;top:30px;left:34px;display:flex;align-items:center;gap:10px;z-index:2;}
    .b .mk i{width:34px;height:34px;border-radius:9px;background:var(--ow-oxide);color:#fff;
      font-family:'Archivo Black',sans-serif;font-size:13px;font-style:normal;
      display:flex;align-items:center;justify-content:center;}
    .b .mk span{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.4px;}
    .b .t{position:absolute;top:34px;right:34px;font-family:var(--mono);font-size:12px;opacity:.5;z-index:2;}
    .b .w{position:absolute;bottom:26px;left:34px;right:34px;font-family:var(--mono);font-size:12px;
      opacity:.45;letter-spacing:.02em;}

    /* photo -- always the biggest thing on the frame */
    .pho{background:linear-gradient(155deg,#59626B,#252A31);position:relative;overflow:hidden;}
    .pho::after{content:"photo from Media";position:absolute;right:12px;bottom:10px;
      font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.5);}
    .pho.l{background:linear-gradient(155deg,#DCE0E4,#8A939C);}
    .pho.l::after{color:rgba(20,23,27,.4);}

    /* 1 -- who, and what */
    .b1{background:var(--ow-steel-950);color:#fff;align-items:center;justify-content:center;gap:34px;}
    .b1 .mk span{color:#fff;}
    .b1 .pho{width:300px;height:300px;border-radius:24px;}
    .b1 h1{font-family:'Archivo Black',sans-serif;font-size:86px;line-height:.95;margin:0;letter-spacing:-.03em;text-align:center;}
    .b1 h2{font-family:'Archivo Black',sans-serif;font-size:40px;line-height:1;margin:0;
      letter-spacing:.02em;color:var(--ow-oxide-light);text-align:center;}

    /* 2 -- how many, how much */
    .b2{background:var(--ow-paper);color:var(--ow-ink-900);}
    .b2 .pho{height:376px;margin:82px 0 0;}
    .b2 .big{padding:30px 34px 0;}
    .b2 .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:104px;font-weight:600;
      line-height:.9;letter-spacing:-.05em;display:block;}
    .b2 .u{font-family:'Archivo Black',sans-serif;font-size:38px;letter-spacing:.01em;display:block;margin-top:6px;}
    .b2 .p{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:52px;font-weight:500;
      letter-spacing:-.03em;margin-top:26px;display:block;}
    .b2 .p em{font-style:normal;font-family:'Archivo Black',sans-serif;font-size:22px;
      color:var(--ow-ink-600);letter-spacing:.01em;margin-left:10px;}
    .b2 .stamp{position:absolute;right:34px;bottom:86px;display:inline-flex;align-items:center;gap:10px;
      background:var(--ow-verdigris);color:#fff;border-radius:999px;padding:12px 22px 12px 16px;
      font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:.01em;}
    .b2 .stamp svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:3.4;
      stroke-linecap:round;stroke-linejoin:round;}

    /* 3 -- what goes with it */
    .b3{background:var(--ow-paper-2);color:var(--ow-ink-900);padding:96px 34px 0;}
    .b3 h2{font-family:'Archivo Black',sans-serif;font-size:44px;line-height:1;margin:0 0 26px;letter-spacing:.01em;}
    .b3 .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
    .b3 .it{background:var(--ow-paper);border-radius:16px;overflow:hidden;border:1px solid var(--ow-rule-soft);}
    .b3 .it .pho{height:196px;}
    .b3 .it .n{padding:16px 16px 2px;font-family:var(--mono);font-variant-numeric:tabular-nums;
      font-size:42px;font-weight:600;letter-spacing:-.03em;line-height:1;}
    .b3 .it .l{padding:6px 16px 18px;font-family:'Archivo Black',sans-serif;font-size:19px;letter-spacing:.01em;}
    .b3 .ratio{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:18px;
      background:var(--ow-paper);border:1px solid var(--ow-rule-soft);border-radius:14px;padding:18px;}
    .b3 .ratio b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:30px;
      font-weight:600;letter-spacing:-.03em;}
    .b3 .ratio svg{width:34px;height:26px;fill:none;stroke:var(--ow-ink-400);stroke-width:2.6;
      stroke-linecap:round;stroke-linejoin:round;flex:none;}
    .b3 .ratio span{font-family:'Archivo Black',sans-serif;font-size:17px;color:var(--ow-ink-600);}

    /* 4 -- what to do */
    .b4{background:var(--ow-oxide);color:#fff;align-items:center;justify-content:center;gap:34px;text-align:center;}
    .b4 .mk i{background:#fff;color:var(--ow-oxide);}
    .b4 .yes{font-family:'Archivo Black',sans-serif;font-size:104px;line-height:.92;letter-spacing:-.03em;margin:0;}
    .b4 .sub{font-family:'Archivo Black',sans-serif;font-size:30px;letter-spacing:.01em;margin:0;color:#F6E7E3;}
    .b4 .tel{display:inline-flex;align-items:center;gap:16px;background:#fff;color:var(--ow-oxide);
