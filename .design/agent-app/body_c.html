  <div class="ph">
    <div class="bar">
      <span class="wm">OMNI-WARE</span>
      <span class="sp"></span>
      <span class="me">BO</span>
    </div>

    <!-- Built for glare and one hand. Six targets, each 100px tall, and
         nothing else competing. No section headings, no counts, no card
         about anything -- the screen is a way in and nothing more. -->
    <div class="body" style="gap:16px;">
      <div class="find" style="height:56px;font-size:17px;">{{i:search}}<span>Search products</span></div>

      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;">
        <div class="card big-t"><span class="cat-ico">{{i:roofing}}</span><span class="clip" title="Roofing">Roofing</span></div>
        <div class="card big-t"><span class="cat-ico">{{i:fastener}}</span><span class="clip" title="Fasteners">Fasteners</span></div>
        <div class="card big-t"><span class="cat-ico">{{i:plumbing}}</span><span class="clip" title="Plumbing">Plumbing</span></div>
        <div class="card big-t"><span class="cat-ico">{{i:paint}}</span><span class="clip" title="Paint">Paint</span></div>
        <div class="card big-t"><span class="cat-ico">{{i:cement}}</span><span class="clip" title="Cement">Cement</span></div>
        <div class="card big-t"><span class="cat-ico">{{i:tools}}</span><span class="clip" title="Tools">Tools</span></div>
      </div>

      <div style="display:flex;align-items:center;justify-content:center;gap:4px;
                  min-height:44px;font-size:15px;font-weight:500;color:var(--ink-2);">
        All 340 products {{i:right}}
      </div>
    </div>

    <!-- The order rides at the bottom of every screen in this direction,
         always one thumb away, never scrolled off. -->
    <div class="foot" style="padding:10px 12px 12px;">
      <div style="display:flex;align-items:center;gap:12px;background:var(--oxide);
                  color:#fff;border-radius:var(--r);padding:0 8px 0 16px;min-height:56px;">
        <div style="flex:1;min-width:0;">
          <div class="clip" style="font-size:15px;font-weight:600;" title="Ssekitoleko Hardware">Ssekitoleko Hardware</div>
          <div style="font-size:13px;opacity:.85;margin-top:1px;">
            4 items &middot; <span class="fig" style="font-weight:600;">892,000</span>
          </div>
        </div>
        <span style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;">{{i:right}}</span>
      </div>
    </div>

{{tabs:Sell}}
  </div>
