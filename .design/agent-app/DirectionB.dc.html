<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    /* Palette and faces are the shop's own, lifted from index.html's :root.
       Everything else here is new: this is a phone app for someone standing
       in a yard, not a console. No uppercase micro-labels, no hairline
       metric strips, no 11px anything. */
    :root{
      --ink:#14171B;        /* primary text */
      --ink-2:#59626B;      /* secondary text        6.2:1 on paper */
      --ink-3:#6B7480;      /* tertiary, still AA    4.7:1 on paper */
      --line:#E3E7EA;       /* hairline */
      --line-2:#CFD5DA;     /* a border you should see */
      --paper:#FFFFFF;
      --ground:#E9EBED;
      --navy:#14171B;
      --navy-2:#252A31;
      --oxide:#B23A26;
      --good:#1C6B58;  --good-bg:#E2EFEB;
      --warn:#7A4A02;  --warn-bg:#FBEFD9;
      --bad:#7F1D1A;   --bad-bg:#F7E4E2;
      --r:8px;
      --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
      color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;}
    a{color:var(--oxide);} a:hover{color:#8E2C1C;}
    .app{position:relative;background:var(--ground);overflow:hidden;}

    /* ---------- the shell ---------- */
    .ph{position:absolute;inset:0;display:flex;flex-direction:column;
      background:var(--ground);overflow:hidden;}
    .bar{height:44px;flex:none;background:var(--navy);color:#fff;
      display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;}
    .bar .wm{font-family:'Archivo Black',sans-serif;font-size:13px;letter-spacing:.03em;}
    .bar .sp{flex:1;}
    .bar .me{width:30px;height:30px;flex:none;border-radius:999px;background:var(--navy-2);
      color:#C7CFD8;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;}
    .body{flex:1;min-height:0;overflow:hidden;padding:20px 16px 0;
      display:flex;flex-direction:column;gap:20px;}

    /* Cards are white on a grey ground. That is the whole separation --
       no border, no shadow. */
    .card{background:var(--paper);border-radius:var(--r);padding:16px;}
    .card.flush{padding:0;overflow:hidden;}

    h1{font-family:'Archivo Black',sans-serif;font-size:26px;letter-spacing:-.02em;
      line-height:1.15;margin:0;}
    .sub{font-size:15px;color:var(--ink-2);line-height:1.45;margin:6px 0 0;}
    /* A section heading is a sentence, at reading size. Not 11px uppercase
       tracked out -- that is a dashboard tic and it is unreadable outdoors. */
    .head{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;}
    .head .more{margin-left:auto;display:flex;align-items:center;gap:2px;
      font-size:15px;font-weight:500;color:var(--ink-2);}
    .head .more svg{width:16px;height:16px;}
    .stack{display:flex;flex-direction:column;gap:12px;}

    /* ---------- controls ---------- */
    .find{display:flex;align-items:center;gap:11px;height:52px;padding:0 15px;flex:none;
      background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);
      font-size:16px;color:var(--ink-3);}
    .find svg{width:20px;height:20px;flex:none;stroke:var(--ink-3);}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;
      height:50px;border-radius:var(--r);font-size:16px;font-weight:600;}
    .btn.pri{background:var(--oxide);color:#fff;}
    .btn.sec{background:var(--paper);color:var(--ink);border:1px solid var(--line-2);}
    .btn.quiet{background:transparent;color:var(--ink-2);border:1px dashed var(--line-2);}
    .btn svg{width:19px;height:19px;}
    .foot{flex:none;background:var(--paper);border-top:1px solid var(--line);
      padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;}

    /* ---------- figures ---------- */
    .fig{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
    .cur{font-size:.72em;font-weight:500;color:var(--ink-3);margin-right:.28em;letter-spacing:0;}

    /* ---------- the tab bar ---------- */
    .tabs{height:60px;flex:none;background:var(--paper);border-top:1px solid var(--line);
      display:grid;grid-template-columns:repeat(3,1fr);align-items:center;}
    .tab{display:flex;flex-direction:column;align-items:center;gap:4px;
      color:var(--ink-3);font-size:11px;font-weight:600;}
    .tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;}
    .tab.on{color:var(--ink);}
    .tab.on svg{fill:currentColor;stroke:none;}

    /* every mark: 24 box, 1.8 stroke, round joins, set here not on the path.
       A default size too -- an unsized inline <svg> fills its container. */
    svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;}
    .cat-ico svg{width:22px;height:22px;stroke:var(--ink-2);}

    /* ---------- chips ---------- */
    .chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;flex:none;
      border-radius:999px;font-size:13px;font-weight:600;background:var(--ground);color:var(--ink-2);}
    .chip.good{background:var(--good-bg);color:var(--good);}
    .chip.warn{background:var(--warn-bg);color:var(--warn);}
    .chip.bad{background:var(--bad-bg);color:var(--bad);}

    .clip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    /* Direction C's tile: one target, 100px, mark over name. */
    .big-t{min-height:100px;padding:14px;display:flex;flex-direction:column;
      justify-content:space-between;font-size:17px;font-weight:600;}
  </style>
</helmet>
<div class="app" style="width:390px;height:844px">
  <div class="ph">
    <div class="bar">
      <span class="wm">OMNI-WARE</span>
      <span class="sp"></span>
      <span class="me">BO</span>
    </div>

    <div class="body">
      <!-- The tab IS the order. Not a hub you pass through on the way to
           one. Searching and browsing happen in a sheet that slides over
           this, so the order never leaves the screen. -->
      <div>
        <div style="font-size:13px;color:var(--ink-3);">Order for</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:2px;">
          <h1 class="clip" title="Ssekitoleko Hardware">Ssekitoleko Hardware</h1>
          <span style="color:var(--ink-2);"><svg viewBox="0 0 24 24"><path d="M5.5 9L12 15.5 18.5 9"/></svg></span>
        </div>
      </div>

      <div class="card flush">
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);">
          <span class="fig" style="font-size:16px;font-weight:600;min-width:26px;">12</span>
          <span class="clip" style="flex:1;font-size:16px;" title="Iron sheets G28 3m box profile">Iron sheets G28 3m</span>
          <span class="fig" style="font-size:16px;font-weight:600;">504,000</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);">
          <span class="fig" style="font-size:16px;font-weight:600;min-width:26px;">4</span>
          <span class="clip" style="flex:1;font-size:16px;" title="Roofing nails 4 inch">Roofing nails 4 inch</span>
          <span class="fig" style="font-size:16px;font-weight:600;">61,600</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);">
          <span class="fig" style="font-size:16px;font-weight:600;min-width:26px;">8</span>
          <span class="clip" style="flex:1;font-size:16px;" title="Ridge cap 2m plain">Ridge cap 2m plain</span>
          <span class="fig" style="font-size:16px;font-weight:600;">148,800</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;">
          <span class="fig" style="font-size:16px;font-weight:600;min-width:26px;">3</span>
          <span class="clip" style="flex:1;font-size:16px;" title="Roofing timber 4x2 &mdash; 12ft">Roofing timber 4x2</span>
          <span class="fig" style="font-size:16px;font-weight:600;">74,400</span>
        </div>
      </div>

      <span class="btn quiet"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add an item</span>

    </div>

    <!-- The two figures sit with the button that acts on them, so the
         last thing checked before sending is right beside Send. -->
    <div class="foot">
      <div style="display:flex;align-items:baseline;">
        <span style="flex:1;font-size:16px;">Customer pays</span>
        <span class="fig" style="font-size:20px;font-weight:600;"><span class="cur">UGX</span>892,000</span>
      </div>
      <div style="display:flex;align-items:baseline;color:var(--ink-2);margin-top:-4px;">
        <span style="flex:1;font-size:15px;">You earn</span>
        <span class="fig" style="font-size:16px;font-weight:600;">92,400</span>
      </div>
      <span class="btn pri">Send to the shop</span>
    </div>

<div class="tabs">
  <div class="tab on"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M13.4 3.5H5.5A2 2 0 0 0 3.5 5.5v7.9c0 .53.21 1.04.59 1.41l6.1 6.1a2 2 0 0 0 2.82 0l7.9-7.9a2 2 0 0 0 0-2.82l-6.1-6.1A2 2 0 0 0 13.4 3.5zM7.6 9.1a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>Sell</div>
  <div class="tab"><svg viewBox="0 0 24 24"><path d="M9 4.6a3.3 3.3 0 1 1 0 6.6 3.3 3.3 0 0 1 0-6.6z"/><path d="M2.9 20v-.9c0-3.2 2.73-5.4 6.1-5.4s6.1 2.2 6.1 5.4v.9z"/><path d="M17.3 6.1a2.7 2.7 0 1 1 0 5.4 2.7 2.7 0 0 1 0-5.4z"/></svg>Customers</div>
  <div class="tab"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3 6h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm9 3.4a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 0 0 0-5.2z"/></svg>Money</div>
</div>
  </div>
</div>
</x-dc>
</body>
</html>
