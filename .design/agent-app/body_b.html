  <div class="ph">
    <div class="bar">
      <span class="wm">OMNI-WARE</span>
      <span class="sp"></span>
      <span class="me">BO</span>
    </div>

    <div class="body">
      <!-- The tab IS the order. Not a hub you pass through on the way to
           one. Searching and browsing happen in a sheet that slides over
           this, so the order never leaves the screen. -->
      <div>
        <div style="font-size:13px;color:var(--ink-3);">Order for</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:2px;">
          <h1 class="clip" title="Ssekitoleko Hardware">Ssekitoleko Hardware</h1>
          <span style="color:var(--ink-2);">{{i:down}}</span>
        </div>
      </div>

      <div class="card flush">
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);">
          <span class="fig" style="font-size:16px;font-weight:600;min-width:26px;">12</span>
          <span class="clip" style="flex:1;font-size:16px;" title="Iron sheets G28 3m box profile">Iron sheets G28 3m</span>
          <span class="fig" style="font-size:16px;font-weight:600;">504,000</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);">
          <span class="fig" style="font-size:16px;font-weight:600;min-width:26px;">4</span>
          <span class="clip" style="flex:1;font-size:16px;" title="Roofing nails 4 inch">Roofing nails 4 inch</span>
          <span class="fig" style="font-size:16px;font-weight:600;">61,600</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);">
          <span class="fig" style="font-size:16px;font-weight:600;min-width:26px;">8</span>
          <span class="clip" style="flex:1;font-size:16px;" title="Ridge cap 2m plain">Ridge cap 2m plain</span>
          <span class="fig" style="font-size:16px;font-weight:600;">148,800</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;">
          <span class="fig" style="font-size:16px;font-weight:600;min-width:26px;">3</span>
          <span class="clip" style="flex:1;font-size:16px;" title="Roofing timber 4x2 &mdash; 12ft">Roofing timber 4x2</span>
          <span class="fig" style="font-size:16px;font-weight:600;">74,400</span>
        </div>
      </div>

      <span class="btn quiet">{{i:plus}}Add an item</span>

    </div>

    <!-- The two figures sit with the button that acts on them, so the
         last thing checked before sending is right beside Send. -->
    <div class="foot">
      <div style="display:flex;align-items:baseline;">
        <span style="flex:1;font-size:16px;">Customer pays</span>
        <span class="fig" style="font-size:20px;font-weight:600;"><span class="cur">UGX</span>892,000</span>
      </div>
      <div style="display:flex;align-items:baseline;color:var(--ink-2);margin-top:-4px;">
        <span style="flex:1;font-size:15px;">You earn</span>
        <span class="fig" style="font-size:16px;font-weight:600;">92,400</span>
      </div>
      <span class="btn pri">Send to the shop</span>
    </div>

{{tabs:Sell}}
  </div>
