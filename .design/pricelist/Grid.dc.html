<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #B23A26; } a:hover { color: #8E2C1C; }
    .w { width: 600px; height: 800px; box-sizing: border-box; background: #FFFFFF;
         font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden;
         display: flex; flex-direction: column; }
    .mast { background: #14171B; height: 150px; box-sizing: border-box; flex: none;
            padding: 26px 34px 0; display: flex; justify-content: space-between; }
    .ow { display: flex; align-items: center; gap: 10px; height: 34px; }
    .owm { width: 34px; height: 34px; border-radius: 9px; background: #FFFFFF; color: #B23A26;
           font-family: 'Archivo Black', sans-serif; font-size: 13px; display: flex;
           align-items: center; justify-content: center; }
    .owt { font-family: 'Archivo Black', sans-serif; font-size: 15px; color: #FFFFFF; }
    .rt { text-align: right; }
    .kick { font-family: 'Archivo Black', sans-serif; font-size: 13px; letter-spacing: 2.5px;
            color: #C9573F; line-height: 34px; }
    .who { font-family: 'Archivo Black', sans-serif; font-size: 30px; color: #FFFFFF; margin-top: 10px; }
    .day { font-size: 15px; color: #8A939C; margin-top: 8px; }
    .key { height: 4px; background: #B23A26; flex: none; }
    .body { flex: 1; min-height: 0; }
    .foot { flex: none; height: 96px; background: #14171B; display: flex; align-items: center;
            justify-content: space-between; padding: 0 34px; }
    .fy { font-family: 'Archivo Black', sans-serif; font-size: 24px; color: #FFFFFF; }
    .fk { font-family: 'Archivo Black', sans-serif; font-size: 12px; letter-spacing: 1.4px;
          color: #C9573F; margin-top: 6px; }
    .ftel { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 27px; color: #FFFFFF; }

    .g-sec { margin: 22px 34px 10px; font-size: 20px; color: #14171B; }
    .g-tab { width: 532px; margin: 0 34px; border-collapse: collapse; table-layout: fixed; }
    .g-tab th, .g-tab td { border: 1px solid #CFD5DA; padding: 10px; text-align: left;
                           font-size: 14px; color: #14171B; vertical-align: middle; }
    /* The head is one line in every column: a wrapped column name grows
       the row it sits in and, in the tight variant, was clipping. */
    .g-tab th { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: #59626B;
                white-space: nowrap; }
    .g-nm { font-weight: 600; }
    .g-num { text-align: right; font-family: 'IBM Plex Mono', monospace;
             font-variant-numeric: tabular-nums; letter-spacing: -0.02em; font-weight: 600;
             font-size: 17px; }
    .g-was { display: block; text-align: right; font-family: 'IBM Plex Mono', monospace;
             font-size: 13px; color: #8A939C; text-decoration: line-through; margin-top: 4px; }
    .g-save { text-align: right; font-family: 'IBM Plex Mono', monospace;
              font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; color: #1C6B58; }
    .g-take { text-align: right; font-family: 'IBM Plex Mono', monospace;
              font-variant-numeric: tabular-nums; font-size: 15px; color: #59626B; }

    .g-tab tr:nth-child(even) td { background: #F0F1F3; }
    .g-tab th { background: #FFFFFF; border-bottom: 2px solid #8A939C; }

  </style>
</helmet>
<div class="w">
  <div class="mast">
    <div class="ow"><div class="owm">OW</div><div class="owt">OMNI-WARE</div></div>
    <div class="rt">
      <div class="kick">PRICE LIST</div>
      <div class="who">JACKSON</div>
      <div class="day">6 Sept 2026</div>
    </div>
  </div>
  <div class="key"></div>
  <div class="body">

    <div class="g-sec">Price down</div>
    <table class="g-tab">
      <colgroup><col style="width:152px"><col style="width:116px"><col style="width:52px"><col style="width:108px"><col style="width:104px"></colgroup>
      <tr><th>PRODUCT</th><th>PACKING</th><th>PER</th><th style="text-align:right">PRICE</th><th style="text-align:right">YOU SAVE</th></tr>
      <tr><td class="g-nm">Runners</td><td>Sold loose</td><td>Each</td>
          <td class="g-num">75,000<span class="g-was">122,500</span></td>
          <td class="g-save">47,500</td></tr>
    </table>
    <div class="g-sec">You usually take</div>
    <table class="g-tab">
      <colgroup><col style="width:152px"><col style="width:116px"><col style="width:52px"><col style="width:108px"><col style="width:104px"></colgroup>
      <tr><th>PRODUCT</th><th>PACKING</th><th>PER</th><th style="text-align:right">PRICE</th><th style="text-align:right">YOU TAKE</th></tr>
      <tr><td class="g-nm">Black screws</td><td>20 Boxes/Ctn</td><td>Box</td>
          <td class="g-num">15,000</td><td class="g-take">20</td></tr>
      <tr><td class="g-nm">Gold screws</td><td>Sold loose</td><td>Kg</td>
          <td class="g-num">15,000</td><td class="g-take">20</td></tr>
    </table>

  </div>
  <div class="foot">
    <div><div class="fy">REPLY YES</div><div class="fk">AND WE KEEP IT FOR YOU</div></div>
    <div class="ftel">0750016750</div>
  </div>
</div>
</x-dc>
</body>
</html>
