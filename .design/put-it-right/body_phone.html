  <div class="ph">
    <div class="ph-top"><span>Put it right</span></div>
    <div class="ph-body">
      <p class="ph-name">ELEPHANT King — Long / Single Lock</p>
      <p class="ph-sub">28 Aug · Restock <b class="up">+16</b> · Shafik Katwe</p>

      <p class="ph-lbl">What is wrong with it?</p>
      <div class="ph-verbs">
        <sc-for list="{{verbs}}" as="v" hint-placeholder-count="3">
          <button type="button" class="pr-v {{v.cls}} ph-v" onClick="{{v.pick}}">
            <span class="pr-v-h"><span class="pr-v-dot"></span><span class="pr-v-t" style="font-size:15px;">{{v.title}}</span></span>
            <span class="pr-v-s" style="font-size:13px;">{{v.sub}}</span>
          </button>
        </sc-for>
      </div>

      <div class="ow-pan" style="margin-top:16px;">
        <div class="ow-pan-h" style="height:38px;"><span class="ow-pan-t">What this will change</span></div>
        <sc-for list="{{effects}}" as="e" hint-placeholder-count="3">
          <div class="ph-eff">
            <p class="ph-eff-l">{{e.label}}</p>
            <p class="ph-eff-v"><span class="pr-eff-b" style="font-size:14px;">{{e.before}}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A939C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
              <span class="pr-eff-a" style="font-size:15px;color:{{e.col}};">{{e.after}}</span></p>
          </div>
        </sc-for>
      </div>

      <p class="ph-foot">{{footNote}}</p>
      <button type="button" class="btn btn-accent ph-btn">{{cta}}</button>
      <button type="button" class="btn btn-ghost ph-btn">Close</button>
    </div>
  </div>
