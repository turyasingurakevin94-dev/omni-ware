<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root{
      --ow-steel-950:#14171B; --ow-steel-800:#252A31; --ow-steel-400:#8A939C;
      --ow-steel-100:#DCE0E4; --ow-steel-050:#E9EBED;
      --ow-paper:#FFFFFF; --ow-paper-2:#F7F9FB;
      --ow-oxide:#B23A26; --ow-oxide-deep:#8E2C1C; --ow-oxide-light:#C9573F; --ow-oxide-soft:#F6E7E3;
      --ow-verdigris:#1C6B58; --ow-verdigris-soft:#E2EFEB;
      --ow-amber:#B0700A; --ow-amber-soft:#FBEFD9; --ow-amber-faint:#FEFAF2; --ow-amber-ink:#7A4A02;
      --ow-crimson:#7F1D1A; --ow-crimson-soft:#F7E4E2;
      --ow-ink-900:#14171B; --ow-ink-600:#59626B; --ow-ink-400:#8A939C;
      --ow-rule:#CFD5DA; --ow-rule-soft:#E3E7EA;
      --ow-r-sm:4px; --ow-r:6px; --ow-r-lg:8px; --ow-r-pill:999px;
      --ow-lift:0 4px 16px rgba(15,20,25,.14);
      --ow-measure:76ch;
      --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    }
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
      color:var(--ow-ink-900);background:var(--ow-steel-050);-webkit-font-smoothing:antialiased;}
    a{color:var(--ow-oxide);} a:hover{color:var(--ow-oxide-deep);}
    .app{position:relative;background:var(--ow-steel-050);overflow:hidden;}

    /* ---- chrome: navy top bar + rail ---- */
    .topbar{position:absolute;top:0;left:0;right:0;height:54px;background:var(--ow-steel-950);
      display:flex;align-items:center;gap:6px;padding:0 18px 0 20px;color:#fff;
      box-shadow:0 1px 0 rgba(255,255,255,0.07);z-index:3;}
    .brand{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-right:18px;}
    .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ow-oxide);color:#fff;
      display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:13px;}
    .brand .tag{font-family:'Archivo Black',sans-serif;font-size:16.5px;letter-spacing:.4px;line-height:1.15;}
    .tb-where{display:flex;align-items:baseline;gap:7px;font-size:13px;font-weight:600;white-space:nowrap;}
    .tb-where .g{color:#8E9BA8;font-weight:500;}
    .tb-sp{flex:1;}
    .tb-ic{width:18px;height:18px;fill:none;stroke:#C7CFD8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .sidebar{position:absolute;top:54px;left:0;bottom:0;width:220px;background:var(--ow-steel-950);
      padding:14px 10px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;z-index:2;}
    .nav-section-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
      color:#7C8894;padding:12px 12px 6px;}
    .nav-b{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;
      font-size:13.5px;font-weight:500;color:#C7CFD8;white-space:nowrap;}
    .nav-b .nav-icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;flex:none;}
    .nav-b.active{background:var(--ow-oxide);color:#fff;font-weight:700;}
    .nav-badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;
      background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:1px 6px;}
    .nav-b.active .nav-badge{background:rgba(255,255,255,.24);}
    .main{position:absolute;top:54px;left:220px;right:0;bottom:0;padding:26px 40px 32px;box-sizing:border-box;overflow:hidden;}

    /* ---- page header ---- */
    .ow-ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;
      border-bottom:1px solid var(--ow-rule);padding:0 0 12px;margin-bottom:16px;}
    .ow-ph-t{font-family:'Archivo Black',sans-serif;font-size:19px;margin:0;letter-spacing:-.015em;line-height:1.1;}
    .ow-ph-sub{font-size:12px;color:var(--ow-ink-600);margin:0 0 1px;}
    .ow-ph-sp{flex:1;}
    .ow-f{display:flex;flex-direction:column;gap:4px;min-width:0;}
    .ow-f-l{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ow-ink-600);}
    .ow-f-in{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;min-width:124px;box-sizing:border-box;
      border:1px solid var(--ow-rule);border-radius:var(--ow-r);background:var(--ow-paper);}
    .ow-f-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ow-ink-900);}
    .ow-f-u{font-size:11px;color:var(--ow-ink-600);margin-left:auto;}

    /* ---- panels, strip, chips ---- */
    .ow-pan{background:var(--ow-paper);border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);overflow:hidden;}
    .ow-pan-h{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;
      border-bottom:1px solid var(--ow-rule-soft);background:var(--ow-paper-2);}
    .ow-pan-t{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ow-ink-600);}
    .ow-pan-n{font-size:11px;color:var(--ow-ink-600);margin-left:auto;white-space:nowrap;
      font-family:var(--mono);font-variant-numeric:tabular-nums;}
    .ow-mini{font-size:11px;color:var(--ow-ink-600);line-height:1.45;margin:0;padding:8px 12px;
      border-top:1px solid var(--ow-rule-soft);max-width:var(--ow-measure);}
    .ow-empty{padding:32px;text-align:center;color:var(--ow-ink-600);font-size:13px;}

    .ow-strip{display:grid;grid-template-columns:repeat(5,1fr);background:var(--ow-paper);
      border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);overflow:hidden;}
    .ow-mt{padding:10px 16px;border-left:1px solid var(--ow-rule-soft);}
    .ow-mt:first-child{border-left:0;}
    .ow-mt-l{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
      color:var(--ow-ink-600);margin:0 0 4px;}
    .ow-mt-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;
      letter-spacing:-.03em;line-height:1.1;display:block;}
    .ow-mt-s{font-size:11px;color:var(--ow-ink-600);margin:4px 0 0;line-height:1.35;}

    .ow-cp{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.02em;
      height:18px;padding:0 6px;border-radius:var(--ow-r-sm);background:var(--ow-steel-050);
      color:var(--ow-ink-600);white-space:nowrap;flex:none;}
    .ow-cp.ow-good{background:var(--ow-verdigris-soft);color:var(--ow-verdigris);}
    .ow-cp.ow-warn{background:var(--ow-amber-soft);color:var(--ow-amber-ink);}
    .ow-cp.ow-bad{background:var(--ow-crimson-soft);color:var(--ow-crimson);}
    .ow-cp.ow-mg{background:var(--ow-oxide-soft);color:var(--ow-oxide-deep);}
    .ow-cp-d{width:5px;height:5px;border-radius:50%;background:currentColor;}

    .ow-av{width:34px;height:34px;border-radius:var(--ow-r);background:var(--ow-steel-050);
      color:var(--ow-ink-600);font-size:12px;font-weight:600;letter-spacing:.02em;
      display:flex;align-items:center;justify-content:center;flex:none;}

    /* ---- the list row ---- */
    .ow-lr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;
      width:100%;min-height:44px;padding:6px 12px;box-sizing:border-box;
      border-bottom:1px solid var(--ow-rule-soft);border-left:3px solid transparent;background:none;}
    .ow-lr:last-child{border-bottom:0;}
    .ow-lr.ow-on{background:var(--ow-paper-2);border-left-color:var(--ow-steel-950);}
    .ow-lr-n{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:500;line-height:1.3;}
    .ow-lr-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ow-lr-m{grid-column:1;min-width:0;font-size:11px;color:var(--ow-ink-600);line-height:1.35;margin-top:1px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ow-lr-v{grid-column:2;grid-row:1 / span 2;text-align:right;white-space:nowrap;
      font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;letter-spacing:-.02em;}
    .ow-lr-b{display:block;font-family:'Inter',system-ui,sans-serif;font-size:11px;font-weight:400;
      color:var(--ow-ink-600);letter-spacing:0;margin-top:1px;}

    /* ---- buttons ---- */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
      padding:10px 18px;border-radius:7px;font-size:14px;font-weight:700;box-sizing:border-box;}
    .btn.ow-sm{padding:0 10px;height:28px;font-size:12px;font-weight:600;}
    .btn-accent{background:var(--ow-oxide);color:#fff;}
    .btn-ghost{background:transparent;color:var(--ow-ink-600);border:1px solid var(--ow-rule);}
    .btn .icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;flex:none;}

    /* ---- the message ---- */
    .ow-msg-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
    .ow-msg-t{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ow-ink-600);}
    .ow-msg-to{margin-left:auto;min-width:0;font-size:11px;color:var(--ow-ink-600);
      font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ow-msg{border:1px solid var(--ow-rule);border-radius:var(--ow-r);background:var(--ow-paper-2);
      padding:10px 12px;font-size:13px;line-height:1.46;white-space:pre-wrap;color:var(--ow-ink-900);}
    .ow-msg-n{font-size:11px;color:var(--ow-ink-600);margin:6px 0 0;line-height:1.45;max-width:var(--ow-measure);}

    .ow-q-un{display:inline-flex;align-items:flex-start;gap:7px;font-size:11px;color:var(--ow-amber-ink);
      background:var(--ow-amber-soft);border:1px solid #EBD9B4;border-radius:var(--ow-r-sm);padding:6px 8px;}
    .ow-q-un svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;flex:none;margin-top:1px;}

    .search{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;
      border-bottom:1px solid var(--ow-rule-soft);color:var(--ow-ink-400);font-size:12px;}
    .search svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;flex:none;}

    /* ---- added for the consignment console ---- */
    .ow-grid{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:16px;align-items:start;}
    .ow-side{display:flex;flex-direction:column;gap:16px;}
    .ow-stack{display:flex;flex-direction:column;gap:16px;}
    .ow-ph-i{width:17px;height:17px;border-radius:50%;border:1px solid var(--ow-rule);
      color:var(--ow-ink-400);font-size:11px;font-weight:700;display:inline-flex;
      align-items:center;justify-content:center;align-self:center;margin-left:2px;font-family:'Inter',sans-serif;}
    .ow-mt.ow-warn .ow-mt-v{color:var(--ow-amber-ink);}
    .ow-mt.ow-good .ow-mt-v{color:var(--ow-verdigris);}
    .ow-mt-v .ow-u{font-size:.55em;color:var(--ow-ink-400);margin-left:.3em;letter-spacing:0;}

    /* the work queue */
    .ow-q{border-bottom:1px solid var(--ow-rule-soft);}
    .ow-q:last-child{border-bottom:0;}
    .ow-q-r{display:grid;grid-template-columns:18px minmax(0,1fr) 152px 128px;align-items:center;
      gap:10px;width:100%;min-height:44px;padding:6px 12px;box-sizing:border-box;border:0;background:none;text-align:left;}
    .ow-q.ow-open .ow-q-r{background:var(--ow-paper-2);}
    .ow-q-cr{width:12px;height:12px;color:var(--ow-ink-400);justify-self:center;
      fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .ow-q.ow-open .ow-q-cr{transform:rotate(90deg);}
    .ow-q-t{min-width:0;font-size:13px;font-weight:500;letter-spacing:-.005em;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ow-q-who{font-weight:600;}
    .ow-q-sep{color:var(--ow-ink-400);margin:0 2px;}
    .ow-q-rest{color:var(--ow-ink-600);}
    .ow-q-m{display:flex;gap:4px;align-items:center;justify-content:flex-end;min-width:0;}
    .ow-q-v{text-align:right;}
    .ow-q-f{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;
      font-weight:600;letter-spacing:-.02em;display:block;}
    .ow-q-b{font-size:11px;color:var(--ow-ink-600);display:block;margin-top:-1px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ow-q-v.ow-zero .ow-q-f{color:var(--ow-ink-400);}
    .ow-q-x{padding:2px 12px 14px 40px;}
    .ow-q-why{font-size:13px;color:var(--ow-ink-600);line-height:1.5;max-width:var(--ow-measure);margin:0 0 10px;}
    .ow-q-a{display:flex;gap:6px;flex-wrap:wrap;}

    /* their goods, inside an open row */
    .cg{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 10px;}
    .cg caption{text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;
      text-transform:uppercase;color:var(--ow-ink-600);padding:0 0 6px;}
    .cg th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
      color:var(--ow-ink-400);text-align:right;padding:0 0 5px 16px;border-bottom:1px solid var(--ow-rule-soft);white-space:nowrap;}
    .cg th.l{text-align:left;padding-left:0;}
    .cg td{padding:7px 0 7px 16px;border-bottom:1px solid var(--ow-rule-soft);
      text-align:right;white-space:nowrap;width:1%;
      font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
    .cg tr:last-child td{border-bottom:0;}
    .cg td.nm{width:auto;padding-left:0;text-align:left;white-space:nowrap;font-family:'Inter',sans-serif;
      font-weight:500;min-width:0;max-width:0;overflow:hidden;text-overflow:ellipsis;}
    .cg td.w{font-weight:600;}
    .cg td.a{padding-left:14px;}
    .cg td.a .btn{padding:0 9px;height:24px;font-size:11px;font-weight:600;}

    /* the foot of an open row */
    .cf{display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding-top:10px;border-top:1px solid var(--ow-rule-soft);}
    .cf-n{margin:0;font-size:11px;color:var(--ow-ink-600);line-height:1.45;max-width:60ch;}

    /* rail figures */
    .rf{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
      padding:7px 12px;border-top:1px solid var(--ow-rule-soft);}
    .rf-l{font-size:11px;color:var(--ow-ink-600);min-width:0;}
    .rf-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;
      font-weight:600;letter-spacing:-.02em;white-space:nowrap;}
    .rf-v.warn{color:var(--ow-amber-ink);}
    .rl{margin:0;padding:8px 12px 10px;font-size:11px;color:var(--ow-ink-600);line-height:1.5;}
    .rl b{color:var(--ow-ink-900);font-weight:600;}
    .rl + .rl{border-top:1px solid var(--ow-rule-soft);}
    /* Put it right — the correction workbench. Nothing here invents a
       colour or a size: every value is a house token, and the panel,
       field and chip anatomy is the one _chrome.css already carries. */
    .pr-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 6px;}
    .pr-h1{margin:0;font-size:19px;font-family:'Archivo Black',Inter,sans-serif;letter-spacing:-.01em;}
    .pr-sku{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--ow-ink-400);}
    .pr-lede{margin:0 0 16px;font-size:13px;line-height:1.5;color:var(--ow-ink-600);max-width:76ch;}

    /* The movement in its neighbours. A correction made against a row
       shown alone is how the wrong row got picked in the first place. */
    .pr-tl-r{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--ow-rule-soft);}
    .pr-tl-r:last-child{border-bottom:0;}
    .pr-tl-r.here{background:var(--ow-amber-faint);}
    .pr-tl-d{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11px;color:var(--ow-ink-400);width:54px;flex-shrink:0;}
    .pr-tl-t{font-size:12px;color:var(--ow-ink-600);width:70px;flex-shrink:0;}
    .pr-tl-q{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-size:13px;font-weight:600;width:50px;text-align:right;flex-shrink:0;}
    .pr-tl-a{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ow-ink-600);width:42px;text-align:right;flex-shrink:0;}
    .pr-tl-n{font-size:12px;color:var(--ow-ink-600);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .up{color:var(--ow-verdigris);} .dn{color:var(--ow-crimson);}

    /* The three verbs. Selection is INK, not the accent: the accent on
       this screen is the one thing that writes to the books. */
    .pr-verbs{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;margin-bottom:16px;}
    .pr-v{all:unset;cursor:pointer;display:block;padding:12px;border:1px solid var(--ow-rule);border-radius:var(--ow-r-lg);background:var(--ow-paper);min-height:44px;}
    .pr-v.on{border-color:var(--ow-ink-900);background:var(--ow-paper-2);}
    .pr-v-h{display:flex;align-items:center;gap:8px;}
    .pr-v-dot{width:14px;height:14px;border-radius:999px;border:1px solid var(--ow-rule);background:#fff;flex-shrink:0;display:block;}
    .pr-v.on .pr-v-dot{border:4px solid var(--ow-ink-900);}
    .pr-v-t{font-size:13px;font-weight:600;color:var(--ow-ink-900);}
    .pr-v-s{display:block;margin-top:6px;font-size:12px;line-height:1.45;color:var(--ow-ink-600);}

    .pr-pane{padding:14px 16px;border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);margin-bottom:16px;}
    .pr-p{margin:0;font-size:13px;line-height:1.55;max-width:76ch;}
    .pr-p + .pr-p{margin-top:8px;color:var(--ow-ink-600);font-size:12px;}
    .pr-grid2{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px;}

    /* A said-out-loud note. Verdigris where it clears the way, crimson
       where it stops the save; nothing else earns a colour. */
    .pr-note{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:var(--ow-r);margin-top:12px;font-size:12px;line-height:1.5;}
    .pr-note.good{background:var(--ow-verdigris-soft);}
    .pr-note.bad{background:var(--ow-crimson-soft);}
    .pr-note svg{flex-shrink:0;margin-top:1px;}
    .pr-note span{max-width:76ch;}

    /* What this will change — the guard rail. */
    .pr-eff{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--ow-rule-soft);}
    .pr-eff:last-child{border-bottom:0;}
    .pr-eff-l{font-size:12px;color:var(--ow-ink-600);flex:1;min-width:0;}
    .pr-eff-b,.pr-eff-a{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;text-align:right;}
    .pr-eff-b{font-size:13px;color:var(--ow-ink-400);}
    .pr-eff-a{font-size:13px;font-weight:600;min-width:104px;}
    .pr-foot{display:flex;align-items:center;gap:10px;margin-top:16px;}
    .pr-foot-n{font-size:12px;color:var(--ow-ink-400);line-height:1.45;max-width:56ch;}
    .pr-foot-a{margin-left:auto;display:flex;gap:10px;flex-shrink:0;}

    /* THE POPUP ITSELF, at the app's real anatomy: overlay
       rgba(20,26,33,.55) from 48px down, a 14px card at 760px with the
       one house shadow, an 18px/22px head with the uppercase title, and
       a 22px body. Nothing here is a new dialog vocabulary. */
    .pr-ov{position:absolute;inset:0;background:rgba(20,26,33,0.55);display:flex;align-items:flex-start;justify-content:center;padding:48px 20px;overflow:hidden;}
    .pr-modal{background:#fff;border-radius:14px;max-width:760px;width:100%;box-shadow:0 24px 64px rgba(10,15,20,0.3);}
    .pr-mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
    .pr-mh h2{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);font-weight:700;}
    .pr-mx{all:unset;cursor:pointer;color:var(--ink-soft);display:flex;padding:5px;border-radius:6px;}
    .pr-mb{padding:22px;}
    /* Behind the popup: enough of Movements to place it, dimmed by the
       overlay. It is context, not a second design. */
    .pr-behind{padding:24px;}
    .ph{position:absolute;inset:0;background:var(--ow-steel-050);overflow:hidden;
      display:flex;flex-direction:column;}
    .ph-top{height:44px;flex:none;background:var(--ow-steel-950);color:#fff;display:flex;align-items:center;
      gap:10px;padding:0 14px;}
    .ph-top .mk{width:24px;height:24px;border-radius:6px;background:var(--ow-oxide);color:#fff;
      display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:9px;}
    .ph-top .ttl{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ph-top .sp{flex:1;}
    .ph-top svg{width:20px;height:20px;fill:none;stroke:#C7CFD8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}
    .ph-body{flex:1;min-height:0;overflow:hidden;padding:16px 16px 0;display:flex;flex-direction:column;gap:14px;}
    .ph-h1{font-family:'Archivo Black',sans-serif;font-size:26px;margin:0;letter-spacing:-.02em;line-height:1.1;}
    .ph-sub{font-size:13px;color:var(--ow-ink-600);margin:6px 0 0;line-height:1.4;}

    .ph-mt{display:grid;grid-template-columns:1fr 1fr;background:var(--ow-paper);
      border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);overflow:hidden;}
    .ph-mt > div{padding:12px 14px;border-left:1px solid var(--ow-rule-soft);border-top:1px solid var(--ow-rule-soft);}
    .ph-mt > div:nth-child(odd){border-left:0;}
    .ph-mt > div:nth-child(-n+2){border-top:0;}
    .ph-mt-l{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
      color:var(--ow-ink-600);margin:0 0 4px;}
    .ph-mt-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;
      letter-spacing:-.03em;line-height:1.1;}

    .ph-list{display:flex;flex-direction:column;gap:10px;}
    .ph-card{background:var(--ow-paper);border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);
      padding:14px 14px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;}
    .ph-card-n{display:flex;align-items:center;gap:6px;min-width:0;font-size:15px;font-weight:600;}
    .ph-card-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ph-card-v{grid-column:2;grid-row:1 / span 3;text-align:right;white-space:nowrap;
      font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;letter-spacing:-.02em;}
    .ph-card-b{display:block;font-family:'Inter',system-ui,sans-serif;font-size:11px;font-weight:400;
      color:var(--ow-ink-600);letter-spacing:0;margin-top:2px;}
    .ph-card-w{grid-column:1;margin:6px 0 0;font-size:13px;color:var(--ow-ink-600);line-height:1.45;}
    .ph-card-m{grid-column:1;margin:4px 0 0;font-size:11px;color:var(--ow-ink-600);}

    .ow-bk{display:flex;align-items:center;gap:12px;margin:0 16px 10px;
      padding:10px 12px 10px 16px;background:var(--ow-steel-950);color:var(--ow-paper);
      border-radius:var(--ow-r-lg);box-shadow:var(--ow-lift);}
    .ow-bk-say{flex:1;min-width:0;font-size:12px;line-height:1.4;color:var(--ow-steel-100);}
    .ow-bk-b{color:var(--ow-paper);font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    .ph-tab-bar{height:60px;flex:none;background:var(--ow-paper);border-top:1px solid var(--ow-rule);
      display:grid;grid-template-columns:repeat(5,1fr);align-items:center;}
    .ph-tb{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ow-ink-600);font-size:11px;font-weight:600;}
    .ph-tb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .ph-tb.on{color:var(--ow-ink-900);}
    .ph-tb.on svg{fill:var(--ow-ink-900);stroke:var(--ow-ink-900);}

    .ph-who{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--ow-paper);
      border-bottom:1px solid var(--ow-rule-soft);}
    .ph-who .ow-av{width:40px;height:40px;font-size:13px;}
    .ph-who-n{font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ph-who-m{font-size:12px;color:var(--ow-ink-600);font-family:var(--mono);margin-top:2px;}
    .ph-item{padding:14px 16px;border-bottom:1px solid var(--ow-rule-soft);background:var(--ow-paper);}
    .ph-item-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .ph-item-n{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
    .ph-why{margin:5px 0 0;font-size:13px;color:var(--ow-ink-600);line-height:1.45;}
    .ph-scroll{flex:1;min-height:0;overflow:hidden;}
    .ph-sec{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
      color:var(--ow-ink-600);padding:14px 16px 6px;}
    .ph-msg{margin:0 16px;border:1px solid var(--ow-rule);border-radius:var(--ow-r);background:var(--ow-paper);
      padding:12px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
    .ph-note{font-size:12px;color:var(--ow-ink-600);margin:8px 16px 0;line-height:1.45;}
    .ph-foot{flex:none;background:var(--ow-paper);border-top:1px solid var(--ow-rule);padding:10px 16px 14px;
      display:flex;flex-direction:column;gap:8px;}
    .ph-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:7px;
      font-size:15px;font-weight:700;}
    .ph-btn.accent{background:var(--ow-oxide);color:#fff;}
    .ph-btn.ghost{background:transparent;color:var(--ow-ink-600);border:1px solid var(--ow-rule);}
    .ph-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .fig{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em;color:var(--ow-ink-900);}
    .ph-sec{display:flex;align-items:baseline;gap:8px;}
    .ph-sec-n{margin-left:auto;font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ow-ink-600);}
    .ph-msg{font-size:13px;}
    .ph-item{padding:12px 16px;}

    /* ---- added for the debtors phone ----
       The phone job is looking ONE customer up: somebody is standing in
       the yard and you need their figure. So search is the first control
       under the strip, at 44px, and the list below it is worst-aged
       first for when you are working rather than looking up.

       The cards carry no button. The accent lives once, in the docked
       navy bar in the thumb zone -- the pattern Follow-ups already
       ships -- so a screen of ten cards does not become a screen of ten
       oxide buttons. */
    .ph-sb{display:flex;align-items:center;gap:9px;height:44px;padding:0 14px;box-sizing:border-box;
      background:var(--ow-paper);border:1px solid var(--ow-rule);border-radius:var(--ow-r-lg);
      font-size:15px;color:var(--ow-ink-400);}
    .ph-sb svg{width:18px;height:18px;fill:none;stroke:var(--ow-ink-400);stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;flex:none;}
    /* the age bar, phone-side: the bar stays, the five bands become two
       columns because five across 358px is 60px a band and unreadable */
    .ph-ag{background:var(--ow-paper);border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);
      padding:12px 14px 13px;}
    .ph-ag-h{display:flex;align-items:baseline;gap:8px;margin:0 0 9px;}
    .ph-ag-t{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ow-ink-600);}
    .ph-ag-n{margin-left:auto;font-size:11px;color:var(--ow-ink-400);}
    .ph-ag-bar{display:flex;gap:2px;height:14px;border-radius:var(--ow-r-sm);overflow:hidden;
      background:var(--ow-rule-soft);}
    .ph-ag-bar > span{flex-basis:0;min-width:18px;background:var(--age-hue);}
    .ph-ag-lg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:11px;}
    .ph-ag-b{display:flex;align-items:baseline;gap:7px;min-width:0;padding-left:8px;
      border-left:2px solid var(--age-hue);}
    .ph-ag-b-l{font-size:12px;color:var(--ow-ink-600);min-width:0;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap;}
    .ph-ag-b-v{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;
      font-size:12px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;}
    .age-b30{--age-hue:var(--ow-steel-400);}
    .age-b60{--age-hue:var(--ow-amber);}
    .age-b90{--age-hue:var(--ow-crimson);}
    .age-b90p{--age-hue:var(--ow-crimson);}
    .age-unknown{--age-hue:var(--ow-steel-100);}

    .ph-card-b.bad{color:var(--ow-crimson);font-weight:500;}
    .ph-card-b.warn{color:var(--ow-amber-ink);font-weight:500;}
    .ph-card-v{font-size:16px;}
    .ph-card-m b{font-weight:500;color:var(--ow-ink-600);}
    .ph-card-m .never{color:var(--ow-crimson);font-weight:600;}
    .ph-mt-v{font-size:20px;}
    .ph-mt-v .ow-u{font-size:.6em;color:var(--ow-ink-400);margin-left:.3em;letter-spacing:0;}
    .ph-mt > div.bad .ph-mt-v{color:var(--ow-crimson);}
    .ph-mt-s{font-size:11px;color:var(--ow-ink-400);margin:3px 0 0;line-height:1.3;}

    /* ---- the waterline, on the phone ----
       Full bleed across the card list, because on 390px a centred rule
       with text either side has no room for either. Same fact, same
       wording, one column. */
    .ph-wl{padding:10px 14px;background:var(--ow-paper-2);
      border-top:1px dashed var(--ow-rule);border-bottom:1px dashed var(--ow-rule);
      font-size:12px;line-height:1.45;color:var(--ow-ink-600);border-radius:var(--ow-r-lg);}
    .ph-wl b{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
      font-weight:600;color:var(--ow-ink-900);}
    .ph-wl-t{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;
      text-transform:uppercase;color:var(--ow-ink-400);margin-bottom:3px;}
    .ph-card-r{font-size:12px;font-weight:600;margin-top:1px;}
    .ph-card-r.bad{color:var(--ow-crimson);}
    .ph-card-r.warn{color:var(--ow-amber-ink);}
    .ph-card-r.none{color:var(--ow-ink-400);font-weight:500;}

    /* ---- added for the pricing phone ----
       The phone job is not the desk job. At the desk you work down a
       ranked list deciding a day's prices. On a phone you are STANDING
       AT THE SHELF, or a buyer is in front of you asking what you will
       take for the dusty lot in the corner. So: search first, the card
       carries the price you charge and the price that keeps target
       side by side, and the accent lives once in the docked bar. */
    .ph-seg{display:flex;background:var(--ow-paper);border:1px solid var(--ow-rule);
      border-radius:var(--ow-r-lg);overflow:hidden;}
    .ph-seg span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
      height:42px;font-size:14px;font-weight:600;color:var(--ow-ink-600);
      border-left:1px solid var(--ow-rule);}
    .ph-seg span:first-child{border-left:0;}
    .ph-seg span.on{background:var(--ow-steel-950);color:#fff;}
    .ph-seg .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;
      color:var(--ow-ink-400);letter-spacing:-.02em;}
    .ph-seg span.on .n{color:rgba(255,255,255,.72);}

    /* the two prices, side by side, at the size a shelf is read at */
    .ph-pr{grid-column:1;display:flex;align-items:stretch;margin:9px 0 0;
      border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r);overflow:hidden;
      background:var(--ow-paper-2);width:max-content;max-width:100%;}
    .ph-pr > div{padding:6px 13px;border-left:1px solid var(--ow-rule-soft);}
    .ph-pr > div:first-child{border-left:0;}
    .ph-pr-l{font-size:11px;color:var(--ow-ink-600);margin:0 0 1px;white-space:nowrap;}
    .ph-pr-v{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
      font-size:15px;font-weight:600;white-space:nowrap;}
    .ph-pr .now .ph-pr-v{color:var(--ow-crimson);}
    .ph-pr .aim{background:var(--ow-paper);}
    .ph-pr .aim .ph-pr-v{color:var(--ow-verdigris);}
    .ph-card-v .pl{color:var(--ow-ink-400);font-weight:500;}
    .ph-card-b.mth,.ph-card-b.once{color:var(--ow-ink-600);}

    /* The strip, search and segments are FIXED furniture; only the card
       list flexes. Without this the column squashes them to slivers the
       moment the cards are taller than the screen -- which is the normal
       case, since a list of prices is meant to scroll. */
    .ph-body > div:first-child,.ph-mt,.ph-sb,.ph-seg{flex:none;}
    .ph-list{flex:1;min-height:0;overflow:hidden;}

    /* Two prices, not three. At 390px a third cell clips the figure it
       exists to show, and the cost is a supporting fact rather than a
       decision -- so it moves to the meta line under the card. What the
       shelf reads is: what you charge now, and what you should. */
    .ph-card{grid-template-columns:minmax(0,1fr) auto;}
    .ph-card-v{grid-row:1;align-self:start;}
    .ph-card-r{grid-column:1 / -1;}
    .ph-pr{grid-column:1 / -1;}
    .ph-pr > div{flex:1;padding:7px 14px;}
    .ph-card-m{grid-column:1 / -1;}
    .ow-bk{align-items:flex-start;}
    .ow-bk-say{padding:2px 0;}
    .ow-bk,.ph-tab-bar,.ph-foot{flex:none;}

    /* ================= THE INVENTORY PHONE ============================
       The phone job is not the desk job. At the desk you work down a
       list deciding what to fix and what to order. On a phone you are
       STANDING IN THE YARD with a customer in front of you asking
       whether you have it. So: search is the first and biggest thing,
       the count is the biggest figure on the card, and the money is
       secondary -- it is the desk's question, not the yard's.

       No strip. Four tiles of shillings answer a question nobody in a
       yard is asking, and they cost 110px of the six inches a card list
       has. One line carries the position instead.
       ================================================================= */
    .iv-p-sb{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;box-sizing:border-box;
      background:var(--ow-paper);border:1px solid var(--ow-rule);border-radius:var(--ow-r-lg);}
    .iv-p-sb svg{width:20px;height:20px;fill:none;stroke:var(--ow-ink-400);stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;flex:none;}
    .iv-p-sb .v{font-size:16px;color:var(--ow-ink-900);min-width:0;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap;}
    .iv-p-sb .x{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--ow-steel-050);
      display:flex;align-items:center;justify-content:center;flex:none;}
    .iv-p-sb .x svg{width:12px;height:12px;stroke:var(--ow-ink-600);stroke-width:1.8;}
    .iv-p-pos{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:0;
      font-size:12px;color:var(--ow-ink-600);line-height:1.45;}
    .iv-p-pos b{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
      font-weight:600;color:var(--ow-ink-900);}
    .iv-p-pos .w{color:var(--ow-amber-ink);font-weight:600;}

    .iv-p-c{background:var(--ow-paper);border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);
      padding:13px 14px 12px;}
    .iv-p-h{display:flex;align-items:center;gap:7px;min-width:0;}
    .iv-p-n{min-width:0;flex:1;font-size:16px;font-weight:600;line-height:1.3;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .iv-p-m{margin:3px 0 0;font-size:12px;color:var(--ow-ink-600);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    /* The count is the answer to the question in the yard, so it is the
       biggest thing on the card. Money sits beside it at half the size:
       a supporting fact, not the decision. */
    .iv-p-f{display:flex;align-items:flex-end;gap:16px;margin-top:10px;}
    .iv-p-q{min-width:0;}
    .iv-p-q-l,.iv-p-v-l{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
      color:var(--ow-ink-600);margin:0 0 2px;}
    .iv-p-q-v{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em;
      font-size:28px;font-weight:500;line-height:1.05;}
    .iv-p-q-v .u{font-family:'Inter',sans-serif;font-size:13px;font-weight:400;
      color:var(--ow-ink-600);letter-spacing:0;margin-left:4px;}
    .iv-p-q-v.thin{color:var(--ow-amber-ink);}
    .iv-p-q-v.out{color:var(--ow-crimson);}
    .iv-p-v{margin-left:auto;text-align:right;}
    .iv-p-v-v{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
      font-size:15px;font-weight:600;white-space:nowrap;}
    .iv-p-v-v.none{color:var(--ow-ink-600);font-weight:500;}
    .iv-p-b{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--ow-rule-soft);
      font-size:12px;color:var(--ow-ink-600);line-height:1.45;}
    .iv-p-b b{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
      font-weight:600;color:var(--ow-ink-900);}
    .ph-body > .iv-p-sb,.ph-body > .iv-p-pos,.ph-body > div:first-child{flex:none;}

    /* ---- THE PHOTO, ON THE PHONE ----
       44px, which is a real tap target, and here it DOES open the
       lightbox. The desk rule that a row thumb must not be zoomable
       exists because the press would shut the row it is in; a phone
       result card has no press to steal, so the thumbnail can mean
       itself. Same .img-zoomable hook, same overlay. */
    .iv-p-th{width:44px;height:44px;flex:none;border-radius:var(--ow-r);
      background:var(--ow-steel-050);overflow:hidden;display:flex;
      align-items:center;justify-content:center;cursor:zoom-in;}
    .iv-p-th svg{width:100%;height:100%;display:block;}
    .iv-p-th.none{background:var(--ow-paper-2);border:1px dashed var(--ow-rule);
      color:var(--ow-ink-600);cursor:default;}
    .iv-p-th.none svg{width:20px;height:20px;fill:none;stroke:currentColor;
      stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    /* the meta line and the figures clear the thumb rather than wrapping under it */
    .iv-p-m,.iv-p-f,.iv-p-b{margin-left:56px;}
    /* Put it right, on a phone in a yard. 15px body, 48px actions, and
       the same three verbs stacked so each is a thumb-sized target. */
    .ph{width:390px;height:844px;background:var(--ow-steel-050);font-size:15px;overflow:hidden;}
    .ph-top{height:44px;background:var(--ow-steel-950);color:#fff;display:flex;align-items:center;padding:0 16px;font-size:15px;font-weight:600;}
    .ph-body{padding:16px;}
    .ph-name{margin:0;font-size:16px;font-weight:600;line-height:1.3;}
    .ph-sub{margin:4px 0 0;font-size:13px;color:var(--ow-ink-600);}
    .ph-lbl{margin:18px 0 8px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ow-ink-600);}
    .ph-verbs{display:flex;flex-direction:column;gap:10px;}
    .ph-v{padding:14px;min-height:60px;}
    .ph-eff{padding:11px 14px;border-bottom:1px solid var(--ow-rule-soft);}
    .ph-eff:last-child{border-bottom:0;}
    .ph-eff-l{margin:0;font-size:13px;color:var(--ow-ink-600);}
    .ph-eff-v{margin:3px 0 0;display:flex;align-items:center;gap:8px;}
    .ph-foot{margin:14px 0 0;font-size:13px;line-height:1.5;color:var(--ow-ink-600);}
    .ph-btn{display:block;width:100%;margin-top:12px;min-height:48px;line-height:48px;padding:0;font-size:15px;}
  </style>
</helmet>
<div class="app" style="width:390px;height:844px">
  <div class="ph">
    <div class="ph-top"><span>Put it right</span></div>
    <div class="ph-body">
      <p class="ph-name">ELEPHANT King — Long / Single Lock</p>
      <p class="ph-sub">28 Aug · Restock <b class="up">+16</b> · Shafik Katwe</p>

      <p class="ph-lbl">What is wrong with it?</p>
      <div class="ph-verbs">
        <sc-for list="{{verbs}}" as="v" hint-placeholder-count="3">
          <button type="button" class="pr-v {{v.cls}} ph-v" onClick="{{v.pick}}">
            <span class="pr-v-h"><span class="pr-v-dot"></span><span class="pr-v-t" style="font-size:15px;">{{v.title}}</span></span>
            <span class="pr-v-s" style="font-size:13px;">{{v.sub}}</span>
          </button>
        </sc-for>
      </div>

      <div class="ow-pan" style="margin-top:16px;">
        <div class="ow-pan-h" style="height:38px;"><span class="ow-pan-t">What this will change</span></div>
        <sc-for list="{{effects}}" as="e" hint-placeholder-count="3">
          <div class="ph-eff">
            <p class="ph-eff-l">{{e.label}}</p>
            <p class="ph-eff-v"><span class="pr-eff-b" style="font-size:14px;">{{e.before}}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A939C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
              <span class="pr-eff-a" style="font-size:15px;color:{{e.col}};">{{e.after}}</span></p>
          </div>
        </sc-for>
      </div>

      <p class="ph-foot">{{footNote}}</p>
      <button type="button" class="btn btn-accent ph-btn">{{cta}}</button>
      <button type="button" class="btn btn-ghost ph-btn">Close</button>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { verb: 'never' }; }
  renderVals(){
    const s = this.state, INK = '#14171B', DIM = '#8A939C';
    const V = [
      { id:'never',   title:'It never happened',     sub:'Goods I recorded that never arrived.' },
      { id:'figures', title:'The figures are wrong', sub:'The count, cost, supplier or bill.' },
      { id:'shelf',   title:'The shelf disagrees',   sub:'The record is right; the shelf differs.' }
    ];
    const verbs = V.map((v)=> ({ ...v, cls: s.verb === v.id ? 'on' : '', pick: ()=> this.setState({ verb: v.id }) }));
    let effects, cta, footNote;
    if(s.verb === 'never'){
      effects = [
        { label:'On the shelf', before:'16 Ctn', after:'0 Ctn', col: INK },
        { label:'What the stock here is worth', before:'4,960,000', after:'0', col: INK },
        { label:'What you owe Shafik Katwe', before:'nothing', after:'nothing', col: DIM }
      ];
      cta = 'Take it back off';
      footNote = 'Nothing is erased. A reversal is posted and the original row stays, marked.';
    } else if(s.verb === 'figures'){
      effects = [
        { label:'On the shelf', before:'16 Ctn', after:'16 Ctn', col: DIM },
        { label:'What the stock here is worth', before:'4,960,000', after:'4,960,000', col: DIM },
        { label:'What you owe Shafik Katwe', before:'nothing', after:'nothing', col: DIM }
      ];
      cta = 'Save the correction';
      footNote = 'Change a figure and this panel says what it does before you save.';
    } else {
      effects = [
        { label:'On the shelf', before:'16 Ctn', after:'16 Ctn', col: DIM },
        { label:'The movement log', before:'6 rows', after:'7 rows', col: INK }
      ];
      cta = 'Post the count';
      footNote = 'A count never rewrites a purchase — it is its own movement.';
    }
    return { verbs, effects, cta, footNote };
  }
}
</script>
</body>
</html>
