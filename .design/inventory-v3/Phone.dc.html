<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inventory on the phone</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Archivo+Black&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
  <style>
    :root{
      --ow-steel-950:#16203C; --ow-steel-800:#243052; --ow-steel-400:#767F91;
      --ow-steel-300:#B8B3AA; --ow-steel-200:#D6D2CA; --ow-steel-100:#E0DCD4; --ow-steel-050:#F7F5F2;
      --ow-paper:#FFFFFF; --ow-paper-2:#FCFBF9;
      --ow-oxide:#C93A30; --ow-oxide-deep:#A82D24; --ow-oxide-light:#E5483D; --ow-oxide-soft:#FDE8E4;
      --ow-verdigris:#0F6B43; --ow-verdigris-soft:#E4F4EA;
      --ow-amber:#95530C; --ow-amber-soft:#FDEEE1; --ow-amber-faint:#FEF8F2; --ow-amber-ink:#7A4A02;
      --ow-crimson:#8E2A22; --ow-crimson-soft:#FBE5E2; --ow-crimson-faint:#FFF8F7;
      --ow-indigo:#3A3F9B; --ow-indigo-soft:#E4E6FA; --ow-sky:#1A5A8A; --ow-sky-soft:#DCEAF8;
      --ow-plum:#7A3268; --ow-plum-soft:#F6E4F1; --ow-slate:#3E4C63; --ow-slate-soft:#E3E8EF;
      --ow-ink-900:#1C2233; --ow-ink-600:#5F6980; --ow-ink-400:#767F91;
      --ow-rule:#E6E3DD; --ow-rule-soft:#EFECE6;
      --ow-r-sm:8px; --ow-r:9px; --ow-r-lg:12px; --ow-r-pill:999px;
      --ow-lift:0 1px 2px rgba(27,36,56,.06),0 6px 20px rgba(27,36,56,.09);
      --ow-measure:76ch; --ow-tap:44px;
      --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    }
    body{margin:0;font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;line-height:1.35;
      color:var(--ow-ink-900);background:var(--ow-steel-050);-webkit-font-smoothing:antialiased;}
    a{color:var(--ow-ink-900);} a:hover{color:var(--ow-oxide-deep);}
    button{font:inherit;color:inherit;cursor:pointer;}
    .app{position:relative;background:var(--ow-steel-050);overflow:hidden;box-sizing:border-box;}
    .mono,.fig{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
    .icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}

    /* ---- chrome: navy top bar + rail ---- */
    .topbar{position:absolute;top:0;left:0;right:0;height:54px;background:var(--ow-steel-950);
      display:flex;align-items:center;gap:6px;padding:0 18px 0 20px;color:#fff;box-sizing:border-box;z-index:3;}
    .brand{display:flex;align-items:center;gap:10px;flex:none;margin-right:20px;}
    .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ow-oxide);color:#fff;
      display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:13px;}
    .brand .tag{font-family:'Archivo Black',system-ui,sans-serif;font-size:16.5px;letter-spacing:.4px;line-height:1.15;}
    .tb-where{display:flex;align-items:baseline;gap:7px;font-size:13px;font-weight:600;white-space:nowrap;}
    .tb-where .g{color:#8D99B5;font-weight:500;}
    .tb-where .sep{color:#6B7796;font-weight:500;}
    .tb-search{position:relative;width:362px;margin-left:24px;height:32px;border-radius:8px;background:rgba(255,255,255,.08);
      display:flex;align-items:center;gap:8px;padding:0 10px;box-sizing:border-box;border:0;color:#A6B0C8;}
    .tb-search .icon{width:14px;height:14px;stroke:#A6B0C8;stroke-width:2;}
    .tb-search span{font-size:13px;color:#A6B0C8;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;}
    .tb-kbd{margin-left:auto;flex:none;white-space:nowrap;font-family:var(--mono);font-size:10.5px;color:#A6B0C8;
      border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:1px 5px;}
    .tb-sp{flex:1;}
    .tb-ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#C5CDDF;background:none;border:0;}
    .tb-ic .icon{width:18px;height:18px;}
    .tb-ic.on{position:relative;}
    .tb-ic.on::after{content:"";position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--ow-oxide-light);}

    .sidebar{position:absolute;top:54px;left:0;bottom:0;width:220px;background:var(--ow-steel-950);
      padding:10px 10px 12px;box-sizing:border-box;display:flex;flex-direction:column;z-index:2;}
    .navl{display:flex;flex-direction:column;gap:1px;}
    .nav-b{display:flex;align-items:center;gap:11px;width:100%;padding:8px 12px;border-radius:8px;border:0;background:none;text-align:left;
      font-size:13px;font-weight:500;color:#B3BCD2;white-space:nowrap;box-sizing:border-box;}
    .nav-b .nav-icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .nav-b .nav-label{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .nav-b.active{background:var(--ow-paper);color:var(--ow-steel-950);font-weight:700;}
    .nav-badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;
      background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:1px 6px;}
    .nav-b.active .nav-badge{background:var(--ow-oxide-soft);color:var(--ow-oxide-deep);}
    .nav-sl{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px 5px;border:0;background:none;text-align:left;
      font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#8D99B5;white-space:nowrap;box-sizing:border-box;}
    .nav-sl.shut{padding-bottom:9px;}
    .nav-sq{width:20px;height:20px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;
      font-size:10px;font-weight:700;letter-spacing:0;text-transform:none;}
    .nav-sq.se{background:var(--ow-oxide-soft);color:var(--ow-oxide-deep);}
    .nav-sq.bu{background:var(--ow-indigo-soft);color:var(--ow-indigo);}
    .nav-sq.ca{background:var(--ow-verdigris-soft);color:var(--ow-verdigris);}
    .nav-sq.mo{background:var(--ow-sky-soft);color:var(--ow-sky);}
    .nav-sq.in{background:var(--ow-plum-soft);color:var(--ow-plum);}
    .nav-sq.st{background:var(--ow-rule-soft);color:var(--ow-ink-600);}
    .nav-fold{width:11px;height:11px;flex:none;opacity:.55;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transform:rotate(90deg);}
    .nav-sl.shut .nav-fold{transform:none;}
    .nav-cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:0;color:#8D99B5;}
    .nav-foot{margin-top:auto;padding:8px 0 0;border-top:1px solid rgba(255,255,255,.09);}

    .main{position:absolute;top:54px;left:220px;right:0;bottom:0;padding:26px 40px 32px;box-sizing:border-box;overflow:hidden;}

    /* ---- page header ---- */
    .ow-ph{display:flex;align-items:center;gap:12px;padding:0 0 4px;margin-bottom:18px;min-height:44px;}
    .ow-ph-t{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.15;}
    .ow-ph-sub{font-size:12px;color:var(--ow-ink-600);margin:2px 0 0;}
    .ow-ph-sp{flex:1;}
    .ow-ph-i{width:17px;height:17px;border-radius:50%;border:1px solid var(--ow-rule);color:var(--ow-ink-400);font-size:11px;font-weight:700;
      display:inline-flex;align-items:center;justify-content:center;background:none;padding:0;}
    .ow-seg{display:inline-flex;background:var(--ow-paper);border:1px solid var(--ow-rule);border-radius:var(--ow-r);padding:2px;gap:2px;}
    .ow-seg-b{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:0;border-radius:7px;background:none;
      font-size:12px;font-weight:600;color:var(--ow-ink-600);white-space:nowrap;}
    .ow-seg-b.ow-on{background:var(--ow-steel-950);color:#fff;}
    .ow-seg-n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;font-weight:600;letter-spacing:-.02em;opacity:.8;}

    /* ---- buttons: the .btn family and one size ---- */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--ow-r);
      font-size:14px;font-weight:700;box-sizing:border-box;border:1px solid transparent;background:none;white-space:nowrap;}
    .btn.ow-sm{padding:0 10px;height:28px;font-size:12px;font-weight:600;}
    .btn-accent{background:var(--ow-oxide);color:#fff;border-color:var(--ow-oxide);}
    .btn-ghost{background:var(--ow-paper);color:var(--ow-ink-900);border-color:var(--ow-rule);}
    .btn-ghost.quiet{color:var(--ow-ink-600);}
    .btn[disabled]{opacity:.45;}
    .lk{background:none;border:0;padding:0;color:var(--ow-ink-900);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:inherit;}

    /* ---- panels, strip, chips ---- */
    .ow-pan{background:var(--ow-paper);border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);overflow:hidden;}
    .ow-pan-h{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-bottom:1px solid var(--ow-rule-soft);background:var(--ow-paper-2);}
    .ow-pan-t{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ow-ink-600);white-space:nowrap;}
    .ow-pan-n{font-size:11px;color:var(--ow-ink-600);margin-left:auto;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;}
    .ow-pan-a{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ow-ink-900);background:none;border:0;padding:0;white-space:nowrap;}
    .ow-pan-a .icon{width:12px;height:12px;}
    .ow-mini{font-size:11px;color:var(--ow-ink-600);line-height:1.45;margin:0;padding:8px 12px;border-top:1px solid var(--ow-rule-soft);max-width:var(--ow-measure);}
    .ow-mini b{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:600;color:var(--ow-ink-900);}
    .ow-empty{padding:32px;text-align:center;color:var(--ow-ink-600);font-size:13px;}

    .ow-strip{display:grid;background:var(--ow-paper);border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);overflow:hidden;}
    .ow-mt{padding:12px 16px;border-left:1px solid var(--ow-rule-soft);min-width:0;}
    .ow-mt:first-child{border-left:0;}
    .ow-mt-l{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ow-ink-600);margin:0 0 4px;white-space:nowrap;}
    .ow-mt-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1;display:block;}
    .ow-mt-v .ow-u{font-size:.45em;color:var(--ow-ink-400);margin-left:.3em;letter-spacing:0;font-weight:500;}
    .ow-mt-s{font-size:11px;color:var(--ow-ink-600);margin:4px 0 0;line-height:1.35;}
    .ow-mt-s b{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:600;color:var(--ow-ink-900);}
    .ow-mt.ow-warn .ow-mt-v{color:var(--ow-amber-ink);}

    .ow-cp{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.02em;height:18px;padding:0 6px;
      border-radius:var(--ow-r-sm);background:var(--ow-steel-050);color:var(--ow-ink-600);white-space:nowrap;flex:none;}
    .ow-cp.ow-good{background:var(--ow-verdigris-soft);color:var(--ow-verdigris);}
    .ow-cp.ow-warn{background:var(--ow-amber-soft);color:var(--ow-amber-ink);}
    .ow-cp.ow-bad{background:var(--ow-crimson-soft);color:var(--ow-crimson);}
    .ow-cp.ow-mg{background:var(--ow-oxide-soft);color:var(--ow-oxide-deep);}
    .ow-cp.held{background:var(--ow-slate-soft);color:var(--ow-slate);}

    .ow-grid{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:16px;align-items:start;}
    .ow-side{display:flex;flex-direction:column;gap:16px;min-width:0;}
    .ow-stack{display:flex;flex-direction:column;gap:16px;min-width:0;}

    /* ---- the find bar ---- */
    .iv-find{display:flex;align-items:stretch;gap:8px;margin-bottom:8px;}
    .iv-fb{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;box-sizing:border-box;
      background:var(--ow-paper);border:1px solid var(--ow-rule);border-radius:var(--ow-r-lg);}
    .iv-fb .icon{width:18px;height:18px;color:var(--ow-ink-600);}
    .iv-fb input{flex:1;min-width:0;border:0;outline:none;background:none;font:inherit;font-size:14px;color:var(--ow-ink-900);padding:0;}
    .iv-fb input::placeholder{color:var(--ow-ink-600);}
    .iv-fb .x{width:22px;height:22px;border-radius:50%;background:var(--ow-steel-050);border:0;display:flex;align-items:center;justify-content:center;color:var(--ow-ink-600);padding:0;}
    .iv-fb .x .icon{width:12px;height:12px;stroke-width:2.2;}
    .iv-sel{position:relative;display:flex;align-items:center;gap:8px;height:44px;padding:0 34px 0 12px;box-sizing:border-box;
      background:var(--ow-paper);border:1px solid var(--ow-rule);border-radius:var(--ow-r-lg);white-space:nowrap;}
    .iv-sel-l{font-size:12px;color:var(--ow-ink-600);}
    .iv-sel-v{font-size:13px;font-weight:600;color:var(--ow-ink-900);}
    .iv-sel .icon{position:absolute;right:12px;width:14px;height:14px;color:var(--ow-ink-600);stroke-width:2;}
    .iv-tog{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;box-sizing:border-box;background:var(--ow-paper);
      border:1px solid var(--ow-rule);border-radius:var(--ow-r-lg);font-size:13px;color:var(--ow-ink-900);white-space:nowrap;cursor:pointer;}
    .iv-tog.on{border-color:var(--ow-steel-950);background:var(--ow-steel-050);font-weight:600;}
    .iv-tog input{width:16px;height:16px;accent-color:var(--ow-steel-950);margin:0;}
    .iv-find .ow-seg{align-self:center;}
    .iv-fr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;font-size:12px;color:var(--ow-ink-600);line-height:1.45;}
    .iv-fr b{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:600;color:var(--ow-ink-900);}
    .iv-fr .kw{font-family:var(--mono);color:var(--ow-ink-900);}

    /* ---- the repair line ---- */
    .iv-fix{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 12px;box-sizing:border-box;background:var(--ow-amber-faint);
      border:1px solid var(--ow-amber);border-radius:var(--ow-r-lg);margin:14px 0 0;}
    .iv-fix > .icon{color:var(--ow-amber-ink);}
    .iv-fix-t{font-size:12px;font-weight:600;color:var(--ow-amber-ink);white-space:nowrap;}
    .iv-fix-c{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;}
    .iv-chip{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:0 8px;border-radius:var(--ow-r-sm);background:var(--ow-paper);
      border:1px solid var(--ow-amber);font-size:11px;font-weight:500;color:var(--ow-amber-ink);white-space:nowrap;}
    .iv-chip b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em;}
    .iv-fix-sp{flex:1;}
    .iv-fix-o{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ow-amber-ink);background:none;border:0;padding:0;white-space:nowrap;}
    .iv-fix-o .icon{width:12px;height:12px;}

    /* ---- thumbnails ---- */
    .th{width:28px;height:28px;border-radius:6px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;background:#E9EBED;border:0;padding:0;}
    .th svg{width:100%;height:100%;display:block;}
    .th.none{background:none;border:1px dashed var(--ow-steel-100);color:var(--ow-ink-400);}
    .th.none .icon{width:14px;height:14px;}
    .th.lg{width:64px;height:64px;border-radius:var(--ow-r-sm);}

    /* ================= FOUR TILES, ONE PICTURE EACH ================= */
    .kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0 0 20px;}
    .kp{background:var(--ow-paper);border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);padding:16px 18px 14px;min-width:0;display:flex;flex-direction:column;gap:8px;}
    .kp-l{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ow-ink-600);margin:0;display:flex;justify-content:space-between;gap:8px;white-space:nowrap;}
    .kp-l span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--ow-ink-400);}
    .kp-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
    .kp-v small{font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;color:var(--ow-ink-400);letter-spacing:0;}
    .kp-v.bad{color:var(--ow-crimson);} .kp-v.warn{color:var(--ow-amber-ink);}
    .kp-s{font-size:12px;color:var(--ow-ink-600);margin:0;line-height:1.4;}
    .kp-s b{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:600;color:var(--ow-ink-900);}
    .spk{display:block;width:100%;height:34px;margin-top:2px;}
    .spk-c{display:flex;justify-content:space-between;font-size:10px;color:var(--ow-ink-400);font-family:var(--mono);margin:0;}
    .kp-bar{display:flex;gap:3px;height:10px;margin-top:4px;}
    .kp-bar.own{margin-top:8px;}
    .kp-bar i{flex-basis:0;min-width:5px;border-radius:3px;}
    .hs-ok{background:var(--ow-verdigris);} .hs-floor{background:var(--ow-amber);}
    .hs-nocost{background:repeating-linear-gradient(135deg,var(--ow-amber) 0 3px,var(--ow-amber-soft) 3px 6px);} .hs-empty{background:var(--ow-steel-100);}
    .hs-buy{background:var(--ow-crimson);}
    .hs-held{background:repeating-linear-gradient(135deg,var(--ow-slate) 0 3px,var(--ow-slate-soft) 3px 6px);}
    .hs-mine{background:var(--ow-ink-600);} .hs-dead{background:repeating-linear-gradient(135deg,var(--ow-amber) 0 3px,var(--ow-amber-soft) 3px 6px);}
    .kp-k{display:flex;gap:10px;font-size:11px;color:var(--ow-ink-600);flex-wrap:wrap;}
    .kp-k span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
    .kp-k i{width:9px;height:9px;border-radius:3px;flex:none;}
    .kp-k b{font-family:var(--mono);font-weight:600;color:var(--ow-ink-900);letter-spacing:-.02em;}
    .kp-share{height:6px;border-radius:var(--ow-r-pill);background:var(--ow-steel-100);position:relative;margin-top:4px;}
    .kp-share i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--ow-r-pill);}

    /* ================= ONE ROW OF TOOLS ================= */
    .tools{display:flex;gap:10px;align-items:center;margin-bottom:16px;}
    .iv-fb{flex:1;}
    .segf{display:inline-flex;gap:2px;background:var(--ow-paper);border:1px solid var(--ow-rule);border-radius:var(--ow-r-lg);padding:4px;height:44px;box-sizing:border-box;flex:none;}
    .segf button{height:34px;padding:0 12px;border-radius:8px;border:0;background:none;font-size:12px;font-weight:600;color:var(--ow-ink-600);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
    .segf button b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;letter-spacing:-.02em;color:var(--ow-ink-900);}
    .segf button i{width:8px;height:8px;border-radius:50%;flex:none;}
    .segf button.on{background:var(--ow-steel-950);color:#fff;}
    .segf button.on b{color:#fff;}

    /* ================= THE TABLE AND THE OPEN LINE ================= */
    .md{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:16px;align-items:start;}
    .tbl{--cols:36px minmax(0,1fr) 150px 88px 116px 14px;}
    .tbl-h{display:grid;grid-template-columns:var(--cols);gap:14px;padding:0 18px 0 15px;border-left:3px solid transparent;height:38px;align-items:center;

    .ph-lc-m{font-size:12px;color:var(--ow-ink-600);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    .ph-lc-v.none{color:var(--ow-ink-400);font-weight:500;}
    .ph-lc-b{grid-column:1 / -1;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ow-ink-600);margin-top:2px;}
    .ph-lc-b .cv{height:8px;}
    .ph-lc-b .cv-d{font-size:12px;}
    .ow-bk{display:flex;align-items:center;gap:12px;margin:0 16px 10px;padding:10px 12px 10px 16px;background:var(--ow-steel-950);color:var(--ow-paper);
      border-radius:var(--ow-r-lg);box-shadow:var(--ow-lift);flex:none;}
    .ow-bk-say{flex:1;min-width:0;font-size:12px;line-height:1.4;color:var(--ow-steel-100);}
    .ow-bk-b{color:var(--ow-paper);font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ow-bk .fig{color:#fff;font-weight:600;}
    .ph-tab-bar{height:60px;flex:none;background:var(--ow-paper);border-top:1px solid var(--ow-rule);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;}
    .ph-tb{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ow-ink-600);font-size:11px;font-weight:600;background:none;border:0;padding:0;height:100%;justify-content:center;}
    .ph-tb .icon{width:23px;height:23px;}
    .ph-tb.on{color:var(--ow-ink-900);}
    .ph-tb.on .icon{fill:var(--ow-ink-900);stroke:var(--ow-ink-900);}
    /* one line, opened */
    .ph-ln{display:flex;gap:12px;align-items:flex-start;}
    .ph-ln .th{width:56px;height:56px;border-radius:10px;}
    .ph-ln-n{font-size:18px;font-weight:700;line-height:1.25;letter-spacing:-.01em;}
    .ph-ln-m{font-size:12px;color:var(--ow-ink-600);margin-top:3px;}
    .ph-big{display:flex;align-items:baseline;gap:10px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--ow-crimson);}
    .ph-big small{font-family:'Figtree',sans-serif;font-size:13px;font-weight:400;color:var(--ow-ink-600);letter-spacing:0;line-height:1.35;}
    .ph-fl{margin-top:12px;}
    .ph-fl .fl-b{height:12px;}
    .ph-fs{display:grid;grid-template-columns:1fr 1fr;background:var(--ow-paper);border:1px solid var(--ow-rule-soft);border-radius:var(--ow-r-lg);overflow:hidden;}
    .ph-fs div{padding:12px 14px;border-left:1px solid var(--ow-rule-soft);border-top:1px solid var(--ow-rule-soft);}
    .ph-fs div:nth-child(odd){border-left:0;}
    .ph-fs div:nth-child(-n+2){border-top:0;}
    .ph-fs .ph-lc-v{font-size:20px;}
    .ph-act{display:flex;gap:8px;}
    .ph-act .btn{flex:1;height:48px;font-size:15px;}
    .ph-foot{padding:10px 16px 12px;background:var(--ow-paper);border-top:1px solid var(--ow-rule);flex:none;}

  </style>
</helmet>
