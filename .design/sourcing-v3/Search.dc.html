<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Search and pick</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F5F2}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #F7F5F2; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="background: #FFFFFF; border-bottom: 1px solid #E6E3DD; padding: 12px 12px 12px 8px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 6px">
      <a href="QuickPrice.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search items, suppliers, rivals and hunts</label>
      <input id="q" type="search" value="pvc" style="box-sizing: border-box; flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #16203C; font: inherit; font-size: 16px; font-weight: 600">
    </div>
    <span style="align-self: flex-start; margin-left: 50px; padding: 4px 10px; border-radius: 999px; background: #F6E4F1; color: #7A3268; font-size: 12px; font-weight: 700">Picking an item for a rival price</span>
  </div>

  <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #5F6980">{{g.label}}</span>
        <div style="background: #FFFFFF; border: 1px solid #E6E3DD; border-radius: 16px; overflow: hidden">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
            <a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EFECE6">
              <span style="width: 36px; height: 36px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; {{r.well}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
              <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
                <span style="font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
                <span style="font-size: 12px; color: #5F6980">{{r.sub}}</span>
              </span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <a href="NewItem.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; border: 1.5px dashed #C9C4BA; background: #FFFFFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A82D24" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">Not here? Start a hunt for "pvc…"</span>
        <span style="font-size: 12px; color: #5F6980">The words are kept, so the next search finds it</span>
      </span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ITEM = 'M3 7.5 12 3l9 4.5v9L12 21l-9-4.5zM3 7.5 12 12l9-4.5M12 12v9';
    const SUP = 'M3 21V9l9-5 9 5v12M8 21v-7h8v7';
    const groups = [
      { label: 'Items', rows: [
        { name: 'PVC pipe 4" × 6m', sub: 'Plumbing · 2 suppliers', href: 'QuickPrice.dc.html', well: 'background:#F1EEE8;color:#1C2233', icon: ITEM },
        { name: 'Solvent cement 500ml', sub: 'also found as "pvc glue"', href: 'QuickPrice.dc.html', well: 'background:#F1EEE8;color:#1C2233', icon: ITEM },
        { name: 'PVC elbow 4"', sub: 'Plumbing · 1 supplier', href: 'QuickPrice.dc.html', well: 'background:#F1EEE8;color:#1C2233', icon: ITEM }
      ] },
      { label: 'Suppliers', rows: [
        { name: 'Owino Plumbing', sub: 'sells PVC · 7 jobs today', href: 'Supplier.dc.html', well: 'background:#E4E6FA;color:#3A3F9B', icon: SUP }
      ] }
    ];
    return { groups };
  }
}
</script>
</body>
</html>
