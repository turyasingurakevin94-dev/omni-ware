<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing · Search and pick</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Oswald:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* figures in the mono face everywhere, words in Figtree: digits come from Plex Mono */
@font-face{font-family:'OW Figures';font-weight:400;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:500;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:600 700;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3vAOwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
.nm{font-family:Figtree,system-ui,sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#6B7480}
/* rule 10: a drawn size is not the hit area. Every control reaches at least 44 x 44 */
:where(a,button,[role=radio],[role=tab],[role=switch]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative!important}
:where(a,button,[role=radio],[role=tab],[role=switch])::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes owPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.6)}70%{box-shadow:0 0 0 6px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
@keyframes owRingA{0%,100%{box-shadow:0 0 0 3px #19223F,0 0 0 5px rgba(245,178,107,.95)}50%{box-shadow:0 0 0 3px #19223F,0 0 0 8px rgba(245,178,107,.25)}}
@keyframes owUndoRun{to{stroke-dashoffset:62.8}}
@keyframes owGone{to{opacity:0;visibility:hidden}}
@keyframes owChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: 'OW Figures', Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="flex: none; background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 30px 30px; padding: 10px 16px 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="{{backHref}}" aria-label="Back" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: rgba(255,255,255,.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="flex: 1; min-width: 0; text-align: center; font-size: 13px; font-weight: 700; color: #B3BCD2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Search and pick</span>
      <span style="width: 44px; height: 44px; flex: none"></span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3BCD2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.2-4.2"></path></svg><input id="q" type="search" value="pvc" aria-label="Search items, suppliers, rivals and hunts" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600"></label>
    <div role="radiogroup" aria-label="Picking an item for" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 14px; background: rgba(255,255,255,.08)">
      <sc-for list="{{modes}}" as="mo" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{mo.on}}" onClick="{{mo.pick}}" style="{{mo.style}}">{{mo.label}}</button></sc-for>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">{{g.label}}</span>
        <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 6px; display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
        <a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 0 10px; border-radius: 16px">
          <span style="width: 42px; height: 42px; flex: none; border-radius: 13px; display: flex; align-items: center; justify-content: center; {{r.well}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span class="nm" style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">{{r.sub}}</span></span>
          <span style="flex: none; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7480" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></span>
        </a>
        </sc-for>
        </div>
      </div>
    </sc-for>
    <a href="AskNew.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 14px; border-radius: 20px; box-shadow: inset 0 0 0 1.5px #C9C4BA"><span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #FDE8E4; color: #A82D24; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">Not here? Start a hunt for “pvc…”</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">The words are kept, so the next search finds it</span></span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'rival' }; }
  renderVals() {
    const MODES = { rival: { label: 'Rival price', href: 'QuickPrice.dc.html' }, photo: { label: 'Photo', href: 'StampPhoto.dc.html' }, supplier: { label: 'Supplier price', href: 'SupplierPrice.dc.html' } };
    const mode = this.state.mode, go = MODES[mode].href;
    const modes = Object.keys(MODES).map(k => ({
      label: MODES[k].label, on: String(mode === k), pick: () => this.setState({ mode: k }),
      style: 'all:unset;cursor:pointer;box-sizing:border-box;height:38px;border-radius:11px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;' + (mode === k ? 'background:#FFFFFF;color:#16203C' : 'color:#B3BCD2')
    }));
    const ITEM = 'M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5zM3.5 7.5 12 12l8.5-4.5M12 12v9', SUP = 'M3 21V9l9-5 9 5v12M8 21v-7h8v7';
    const P = 'background:#F1EEE8;color:#1C2233', I = 'background:#E4E6FA;color:#3A3F9B';
    const groups = [
      { label: 'Items', rows: [
        { name: 'PVC pipe 4" × 6m', sub: 'Plumbing · 2 suppliers', href: go, well: P, icon: ITEM },
        { name: 'Solvent cement 500ml', sub: 'also found as “pvc glue”', href: go, well: P, icon: ITEM },
        { name: 'PVC elbow 4"', sub: 'Plumbing · 1 supplier', href: go, well: P, icon: ITEM }
      ] },
      { label: 'Suppliers', rows: [
        { name: 'Owino Plumbing', sub: 'sells PVC · 7 jobs today', href: 'Supplier.dc.html', well: I, icon: SUP }
      ] }
    ];
    return { groups, modes, backHref: go };
  }
}
</script>
</body>
</html>
