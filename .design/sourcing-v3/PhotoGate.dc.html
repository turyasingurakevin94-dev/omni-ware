<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Photo gate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#060A16}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #060A16; color: #FFFFFF; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <!-- top bar -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 0">
    <a href="Passport.dc.html" aria-label="Close the camera" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <span style="font-size: 15px; font-weight: 700">Wire mesh BRC A142</span>
    <button type="button" aria-label="{{torchLabel}}" aria-pressed="{{torchOn}}" onClick="{{torch}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; {{torchStyle}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6h3l-7 12 1-8H8z"></path></svg></button>
  </div>

  <!-- the frame, square -->
  <div style="position: relative; margin: 22px auto 0; width: 330px; height: 330px; border-radius: 6px; overflow: hidden; background: repeating-linear-gradient(0deg, transparent 0 26px, rgba(179,188,210,.45) 26px 29px), repeating-linear-gradient(90deg, #2A3350 0 26px, rgba(179,188,210,.45) 26px 29px)">
    <span style="position: absolute; left: 8px; top: 8px; width: 28px; height: 28px; border-left: 3px solid #6FDCB0; border-top: 3px solid #6FDCB0"></span>
    <span style="position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-right: 3px solid #6FDCB0; border-top: 3px solid #6FDCB0"></span>
    <span style="position: absolute; left: 8px; bottom: 8px; width: 28px; height: 28px; border-left: 3px solid #6FDCB0; border-bottom: 3px solid #6FDCB0"></span>
    <span style="position: absolute; right: 8px; bottom: 8px; width: 28px; height: 28px; border-right: 3px solid #6FDCB0; border-bottom: 3px solid #6FDCB0"></span>
    <sc-if value="{{live}}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 4px 10px; border-radius: 999px; background: rgba(6,10,22,.7); font-size: 12px; color: #B3BCD2; white-space: nowrap">Fill the square. A plain wall behind it.</span>
    </sc-if>
  </div>

  <!-- shutter, while live -->
  <sc-if value="{{live}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 60px; display: flex; justify-content: center">
      <button type="button" aria-label="Take the photo" onClick="{{shoot}}" style="all: unset; cursor: pointer; width: 76px; height: 76px; border-radius: 999px; border: 4px solid #FFFFFF; display: flex; align-items: center; justify-content: center">
        <span style="width: 58px; height: 58px; border-radius: 999px; background: #FFFFFF; display: block"></span>
      </button>
    </div>
  </sc-if>

  <!-- the check -->
  <sc-if value="{{shot}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; color: #1C2233; border-radius: 26px 26px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 14px">
      <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #E0DCD4"></span>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 16px; font-weight: 700">Checked on the phone</span>
        <span style="display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #E4F4EA; color: #0F6B43; font-size: 12px; font-weight: 700">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Passes</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{checks}}" as="c" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; {{c.tile}}">
            <span style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700"><span>{{c.label}}</span><span style="font-size: 12px">{{c.v}}</span></span>
            <span style="height: 6px; border-radius: 3px; background: rgba(28,34,51,.08); position: relative; display: block">
              <span style="position: absolute; top: -3px; width: 2px; height: 12px; background: #1C2233; {{c.min}}"></span>
              <span style="display: block; height: 6px; border-radius: 3px; {{c.bar}}"></span>
            </span>
            <span style="font-size: 11px; font-weight: 600">{{c.note}}</span>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #5F6980">Saved as a <span class="m">1200 × 1200</span> square, from a <span class="m">3024</span> px shot. The line on each bar is the pass mark.</span>
      <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px">
        <button type="button" onClick="{{retake}}" style="all: unset; cursor: pointer; text-align: center; padding: 14px 10px; border-radius: 14px; background: #F1EEE8; color: #1C2233; font-size: 15px; font-weight: 700">Retake</button>
        <a href="Passport.dc.html" style="text-align: center; padding: 14px 10px; border-radius: 14px; background: #C93A30; color: #FFFFFF; font-size: 15px; font-weight: 700">Use this photo</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { live: false, torch: false }; }
  renderVals() {
    const OK = 'background:#E4F4EA;color:#0F6B43';
    const WARN = 'background:#FDEEE1;color:#7A4A02';
    const checks = [
      { label: 'Sharp', v: 'clear', pct: 78, min: 35, note: 'no blur', tile: OK, c: '#0F6B43' },
      { label: 'Light', v: 'good', pct: 61, min: 30, note: 'not dark, not blown out', tile: OK, c: '#0F6B43' },
      { label: 'Size', v: 'large', pct: 100, min: 26, note: 'big enough to crop square', tile: OK, c: '#0F6B43' },
      { label: 'Background', v: 'busy', pct: 38, min: 55, note: 'advice only: a plain wall reads better', tile: WARN, c: '#95530C' }
    ].map(c => ({ ...c, bar: 'width:' + c.pct + '%;background:' + c.c, min: 'left:' + c.min + '%' }));
    const live = this.state.live, torchOn = this.state.torch;
    return {
      checks, live, shot: !live,
      shoot: () => this.setState({ live: false }),
      retake: () => this.setState({ live: true }),
      torch: () => this.setState({ torch: !torchOn }),
      torchOn: String(torchOn), torchLabel: torchOn ? 'Torch on' : 'Torch off',
      torchStyle: torchOn ? 'background:#FFFFFF;color:#16203C' : 'background:rgba(255,255,255,.1);color:#FFFFFF'
    };
  }
}
</script>
</body>
</html>
