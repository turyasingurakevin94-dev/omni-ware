<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing · One supplier, or two?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Oswald:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* figures in the mono face everywhere, words in Figtree: digits come from Plex Mono */
@font-face{font-family:'OW Figures';font-weight:400;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:500;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:600 700;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3vAOwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
.nm{font-family:Figtree,system-ui,sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#6B7480}
/* rule 10: a drawn size is not the hit area. Every control reaches at least 44 x 44 */
:where(a,button,[role=radio],[role=tab],[role=switch]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative!important}
:where(a,button,[role=radio],[role=tab],[role=switch])::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes owPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.6)}70%{box-shadow:0 0 0 6px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
@keyframes owRingA{0%,100%{box-shadow:0 0 0 3px #19223F,0 0 0 5px rgba(245,178,107,.95)}50%{box-shadow:0 0 0 3px #19223F,0 0 0 8px rgba(245,178,107,.25)}}
@keyframes owUndoRun{to{stroke-dashoffset:62.8}}
@keyframes owGone{to{opacity:0;visibility:hidden}}
@keyframes owChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: 'OW Figures', Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="flex: none; background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 30px 30px; padding: 10px 16px 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="Suppliers.dc.html" aria-label="Back to Suppliers" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: rgba(255,255,255,.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="flex: 1; min-width: 0; text-align: center; font-size: 13px; font-weight: 700; color: #B3BCD2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">One supplier, or two?</span>
      <span style="width: 44px; height: 44px; flex: none"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px; border-radius: 18px; background: rgba(255,255,255,.07)"><span style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: #E4E6FA; color: #3A3F9B; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">OP</span><span style="font-size: 13px; font-weight: 700; text-align: center">Owino Plumbing</span><span style="font-size: 11px; font-weight: 600; color: #B3BCD2"><span class="m">24</span> lines · <span class="m">22</span> orders</span></span>
      <span style="flex: none; width: 34px; height: 34px; border-radius: 999px; background: rgba(245,178,107,.16); color: #F5B26B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM15 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px; border-radius: 18px; background: rgba(255,255,255,.07)"><span style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: #E4E6FA; color: #3A3F9B; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">OS</span><span style="font-size: 13px; font-weight: 700; text-align: center">Owino Plumbing &amp; Sanitary</span><span style="font-size: 11px; font-weight: 600; color: #B3BCD2"><span class="m">3</span> lines · <span class="m">1</span> order</span></span>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px"><span style="font-size: 13px; font-weight: 700; color: #5F6980">Side by side</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">green: the same</span></div>
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 4px 6px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 6px; align-items: center; min-height: 48px; padding: 0 10px; border-top: {{r.rule}}">
        <span style="font-size: 12px; font-weight: 600; color: #5F6980">{{r.k}}</span>
        <span style="font-size: 13px; font-weight: 600; text-align: right; {{r.ink}}{{r.face}}">{{r.a}}</span>
        <span style="font-size: 13px; font-weight: 600; text-align: right; {{r.ink}}{{r.face}}">{{r.b}}</span>
      </div>
      </sc-for>
    </div>
    <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">If they are one</span>
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 6px; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 0 10px; border-radius: 16px"><span style="width: 42px; height: 42px; flex: none; border-radius: 13px; background: #E4F4EA; color: #0F6B43; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span class="nm" style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Owino Plumbing is kept</span><span style="font-size: 12px; font-weight: 600; color: #5F6980; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">3 lines move across · its prices win where both price</span></span></div>
    </div>
    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px; border-radius: 16px; {{resultStyle}}"><span style="flex: 1; font-size: 13px; font-weight: 700">{{result}}</span><button type="button" onClick="{{undo}}" style="all: unset; cursor: pointer; font-size: 13px; font-weight: 700; color: #16203C">Undo</button></div></sc-if>
  </div>
  <div style="flex: none; padding: 12px 16px 22px; display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px">
    <button type="button" onClick="{{apart}}" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; height: 58px; border-radius: 999px; background: #FFFFFF; color: #16203C; box-shadow: inset 0 0 0 1.5px #E6E3DD; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Two suppliers</button>
    <button type="button" onClick="{{merge}}" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; height: 58px; border-radius: 999px; background: #C93A30; color: #FFFFFF; box-shadow: 0 10px 22px rgba(201,58,48,.26); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Merge into one</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { res: null }; }
  renderVals() {
    const SAME = 'color:#0F6B43';
    const rows = [
      { k: 'Phone', a: 'same', b: 'same', ink: SAME },
      { k: 'Where', a: 'Owino market', b: 'Owino market', ink: SAME },
      { k: 'Lines', a: '24', b: '3', ink: '' },
      { k: 'PPR elbow 25mm', a: '1,200', b: '1,250', ink: '' },
      { k: 'Last order', a: '9 Oct', b: '3 Jun', ink: '' }
    ].map((r, i) => ({ ...r, rule: i ? '1px solid #EFECE6' : 'none', face: /[0-9]/.test(r.a) ? ";font-family:'IBM Plex Mono',monospace" : '' }));
    const res = this.state.res;
    return {
      rows, done: !!res,
      result: res === 'merge' ? 'Merged · one supplier, Owino Plumbing' : 'Kept apart · not offered again',
      resultStyle: res === 'merge' ? 'background:#E4F4EA;color:#0F6B43' : 'background:#F1EEE8;color:#5F6980',
      merge: () => this.setState({ res: 'merge' }), apart: () => this.setState({ res: 'apart' }), undo: () => this.setState({ res: null })
    };
  }
}
</script>
</body>
</html>
