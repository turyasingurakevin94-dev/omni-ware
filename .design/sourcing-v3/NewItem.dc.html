<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing · A new item</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* figures in the mono face everywhere, words in Figtree: digits come from Plex Mono */
@font-face{font-family:'OW Figures';font-weight:400;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:500;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:600 700;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3vAOwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
.nm{font-family:Figtree,system-ui,sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#6B7480}
/* rule 10: a drawn size is not the hit area. Every control reaches at least 44 x 44 */
:where(a,button,[role=radio],[role=tab],[role=switch]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative!important}
:where(a,button,[role=radio],[role=tab],[role=switch])::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes owPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.6)}70%{box-shadow:0 0 0 6px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
@keyframes owRingA{0%,100%{box-shadow:0 0 0 3px #19223F,0 0 0 5px rgba(245,178,107,.95)}50%{box-shadow:0 0 0 3px #19223F,0 0 0 8px rgba(245,178,107,.25)}}
@keyframes owUndoRun{to{stroke-dashoffset:62.8}}
@keyframes owGone{to{opacity:0;visibility:hidden}}
@keyframes owChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: 'OW Figures', Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="flex: none; background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 30px 30px; padding: 10px 16px 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="Capture.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: rgba(255,255,255,.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="flex: 1; min-width: 0; text-align: center; font-size: 13px; font-weight: 700; color: #B3BCD2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">A new item</span>
      <span style="width: 44px; height: 44px; flex: none"></span>

    <div role="radiogroup" aria-label="How you found it" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 14px; background: rgba(255,255,255,.08)">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button></sc-for>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <a href="PhotoGate.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 14px; border-radius: 20px; box-shadow: inset 0 0 0 1.5px #C9C4BA; background: transparent"><span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #F1EEE8; color: #5F6980; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path></svg></span><span style="flex: 1; font-size: 14px; font-weight: 700">Add a photo</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">optional now</span></a>
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="padding: 0 4px; font-size: 13px; font-weight: 700; color: #5F6980">What is it?</span><input value="Grout float, rubber" aria-label="What is it?" style="box-sizing: border-box; height: 52px; padding: 0 14px; border-radius: 16px; border: none; box-shadow: inset 0 0 0 2px #16203C; background: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; color: #1C2233"></label>
    <span style="display: flex; align-items: center; gap: 6px; padding: 0 4px; font-size: 12px; font-weight: 700; color: #0F6B43"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>Not in the catalogue, and no hunt has it yet</span>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 8px 4px 0"><span style="font-size: 13px; font-weight: 700; color: #5F6980">Aisle</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">pick one, or leave it</span></div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{aisles}}" as="a" hint-placeholder-count="3"><button type="button" aria-pressed="{{a.on}}" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button></sc-for>
    <button type="button" onClick="{{toggleMore}}" aria-expanded="{{moreStr}}" style="all: unset; cursor: pointer; box-sizing: border-box; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; {{moreStyle}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.2-4.2"></path></svg>{{moreLabel}}</button></div>
    <sc-if value="{{moreOpen}}" hint-placeholder-val="{{ false }}">
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 10px; display: flex; flex-direction: column; gap: 8px">
      <label style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 14px; box-shadow: inset 0 0 0 2px #16203C; color: #5F6980"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.2-4.2"></path></svg><input value="" placeholder="Find an aisle" aria-label="Find an aisle" style="flex: 1; min-width: 0; height: 44px; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #1C2233"><span style="font-size: 11px; font-weight: 600">all <span class="m">14</span></span></label>
      <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{others}}" as="o" hint-placeholder-count="9"><button type="button" onClick="{{o.pick}}" style="all: unset; cursor: pointer; box-sizing: border-box; height: 36px; padding: 0 12px; border-radius: 999px; background: #F7F5F2; font-size: 13px; font-weight: 700; display: flex; align-items: center">{{o.label}}</button></sc-for></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 16px; background: #F7F5F2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6980" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><input value="Garden & outdoor" aria-label="A new aisle" style="flex: 1; min-width: 0; height: 44px; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #1C2233"><button type="button" onClick="{{newAisle}}" style="all: unset; cursor: pointer; height: 40px; padding: 0 14px; border-radius: 999px; background: #16203C; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center">New aisle</button></div>
      <span style="padding: 0 2px; font-size: 12px; font-weight: 600; color: #5F6980">Not sure? Leave it; you can set it on the passport later</span>
    </div>
    </sc-if>
    <sc-if value="{{seen}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">Where you saw it</span>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{wheres}}" as="w" hint-placeholder-count="3"><button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="{{w.style}}">{{w.label}}</button></sc-for>
    </div>
    <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">Their price, if you have it</span>
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <input value="" placeholder="0" inputmode="numeric" aria-label="Their price" style="box-sizing: border-box; flex: 1; min-width: 0; height: 52px; padding: 0 12px; border-radius: 14px; border: none; box-shadow: inset 0 0 0 1.5px #E6E3DD; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600">
        <span style="font-size: 14px; font-weight: 700; color: #5F6980">per</span>
        <button type="button" onClick="{{toggleUnits}}" aria-expanded="{{unitsStr}}" aria-label="What the price is for" style="all: unset; cursor: pointer; box-sizing: border-box; min-width: 116px; height: 52px; padding: 0 12px; border-radius: 14px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 6px; {{unitBtn}}">{{unitLabel}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      </div>
      <sc-if value="{{unitsOpen}}" hint-placeholder-val="{{ false }}">
      <div role="listbox" aria-label="Units" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{units}}" as="u" hint-placeholder-count="6"><button type="button" role="option" aria-selected="{{u.on}}" onClick="{{u.pick}}" style="{{u.style}}">{{u.label}}</button></sc-for>
        <label style="grid-column: span 3; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 12px; border-radius: 12px; background: #F7F5F2"><span style="flex: 1; font-size: 13px; font-weight: 700">A pack of</span><input value="" placeholder="how many" inputmode="numeric" aria-label="Pieces in a pack" style="width: 92px; height: 36px; border: none; border-radius: 10px; box-shadow: inset 0 0 0 1.5px #E6E3DD; background: #FFFFFF; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600"><button type="button" onClick="{{pickPack}}" style="all: unset; cursor: pointer; height: 36px; padding: 0 12px; border-radius: 999px; background: #16203C; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center">Use</button></label>
      </div>
      </sc-if>
    </div>
    </div>
    </sc-if>
    <sc-if value="{{asked}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">Who asked</span>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{whos}}" as="w" hint-placeholder-count="3"><button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="{{w.style}}">{{w.label}}</button></sc-for>
    </div>
    <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">How many</span>
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 12px 14px"><div style="display: flex; align-items: center; gap: 8px"><button type="button" onClick="{{less}}" aria-label="Fewer" style="all: unset; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 999px; background: #F1EEE8; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><label style="flex: 1; height: 52px; border-radius: 14px; box-shadow: inset 0 0 0 2px #16203C; display: flex; align-items: center; justify-content: center; gap: 6px"><input id="ni_qty" value="{{qty}}" inputmode="numeric" aria-label="How many they want" style="width: 90px; border: none; outline: none; background: transparent; font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; text-align: right; color: #1C2233"><span style="font-size: 13px; font-weight: 700; color: #5F6980">pcs</span></label><button type="button" onClick="{{more}}" aria-label="More" style="all: unset; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 999px; background: #16203C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div></div>
    </div>
    </sc-if>
  </div>
  <div style="flex: none; padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 8px">
    <a href="Funnel.dc.html" style="height: 58px; border-radius: 999px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; {{ctaStyle}}">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: null, aisle: null, where: null, who: null, qty: 0, more: false, unit: null, unitsOpen: false }; }
  renderVals() {
    const { mode, aisle, where, who, qty, more, unit, unitsOpen } = this.state;
    const TOP = ['Tiles & finishing', 'Fasteners', 'Plumbing', 'Steel & mesh', 'Roofing'];
    const shown = !aisle || TOP.includes(aisle) ? TOP : TOP.slice(0, 4).concat([aisle]);
    const seg = (on) => 'all:unset;cursor:pointer;box-sizing:border-box;height:40px;border-radius:11px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;' + (on ? 'background:#FFFFFF;color:#16203C' : 'color:#B3BCD2');
    const chip = (on) => 'all:unset;cursor:pointer;box-sizing:border-box;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;display:flex;align-items:center;' + (on ? 'background:#16203C;color:#FFFFFF' : 'background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #E6E3DD');
    const pickList = (key, cur, labels) => labels.map(label => ({ label, on: String(cur === label), pick: () => this.setState({ [key]: cur === label ? null : label }), style: chip(cur === label) }));
    const modes = [['seen', 'I saw it'], ['asked', 'Someone asked']].map(([k, label]) => ({ label, on: String(mode === k), pick: () => this.setState({ mode: k }), style: seg(mode === k) }));
    const ready = !!mode && (mode === 'seen' || !!who);
    return {
      modes, seen: mode === 'seen', asked: mode === 'asked', qty,
      aisles: pickList('aisle', aisle, shown),
      units: ['piece', 'metre', 'kg', 'roll', 'sheet', 'length'].map(label => ({ label, on: String(unit === label), pick: () => this.setState({ unit: label, unitsOpen: false }),
        style: 'all:unset;cursor:pointer;box-sizing:border-box;height:44px;border-radius:12px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;' + (unit === label ? 'background:#16203C;color:#FFFFFF' : 'background:#F7F5F2;color:#1C2233') })),
      unitsOpen, unitsStr: String(unitsOpen), toggleUnits: () => this.setState({ unitsOpen: !unitsOpen }),
      pickPack: () => this.setState({ unit: 'pack of 12', unitsOpen: false }),
      unitLabel: unit || 'unit', unitBtn: unit ? 'background:#16203C;color:#FFFFFF' : 'background:#FFFFFF;color:#5F6980;box-shadow:inset 0 0 0 1.5px #C9C4BA',
      moreOpen: more, moreStr: String(more), moreLabel: more ? 'Close' : 'Other aisle', toggleMore: () => this.setState({ more: !more }),
      moreStyle: more ? 'background:#16203C;color:#FFFFFF' : 'background:#FFFFFF;color:#16203C;box-shadow:inset 0 0 0 1.5px #C9C4BA',
      others: ['Cement & sand', 'Timber', 'Paint', 'Electrical', 'Tools', 'Doors & locks', 'Gutters', 'Water tanks', 'Safety gear'].map(label => ({ label, pick: () => this.setState({ aisle: label, more: false }) })),
      newAisle: () => this.setState({ aisle: 'Garden & outdoor', more: false }),
      wheres: pickList('where', where, ['Katwe Fabricators', 'At a rival', 'Another supplier']),
      whos: pickList('who', who, ['Ggaba Stores', 'Nansana Hardware', 'Someone else']),
      less: () => this.setState({ qty: Math.max(0, qty - 10) }), more: () => this.setState({ qty: qty + 10 }),
      cta: !mode ? 'Say how you found it' : mode === 'asked' ? (who ? 'Add the ask' : 'Say who asked') : 'Start the hunt',
      ctaStyle: ready ? 'background:#C93A30;color:#FFFFFF;box-shadow:0 10px 22px rgba(201,58,48,.26)' : 'background:#F3D3CF;color:#8E2A22;pointer-events:none'
    };
  }
}
</script>
</body>
