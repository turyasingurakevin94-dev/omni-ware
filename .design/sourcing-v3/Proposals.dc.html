<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing · Supplier proposals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* figures in the mono face everywhere, words in Figtree: digits come from Plex Mono */
@font-face{font-family:'OW Figures';font-weight:400;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:500;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:600 700;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3vAOwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
.nm{font-family:Figtree,system-ui,sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#6B7480}
/* rule 10: a drawn size is not the hit area. Every control reaches at least 44 x 44 */
:where(a,button,[role=radio],[role=tab],[role=switch]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative!important}
:where(a,button,[role=radio],[role=tab],[role=switch])::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes owPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.6)}70%{box-shadow:0 0 0 6px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
@keyframes owRingA{0%,100%{box-shadow:0 0 0 3px #19223F,0 0 0 5px rgba(245,178,107,.95)}50%{box-shadow:0 0 0 3px #19223F,0 0 0 8px rgba(245,178,107,.25)}}
@keyframes owUndoRun{to{stroke-dashoffset:62.8}}
@keyframes owGone{to{opacity:0;visibility:hidden}}
@keyframes owChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: 'OW Figures', Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="flex: none; background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 30px 30px; padding: 10px 16px 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="Prices.dc.html" aria-label="Back to Prices" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: rgba(255,255,255,.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="flex: 1; min-width: 0; text-align: center; font-size: 13px; font-weight: 700; color: #B3BCD2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Supplier proposals</span>
      <span style="width: 44px; height: 44px; flex: none"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="display: flex; align-items: baseline; gap: 8px"><span class="m" style="font-size: 40px; font-weight: 600; line-height: 1">{{left}}</span><span style="font-size: 14px; font-weight: 600; color: #B3BCD2">to answer</span></span>
      <span style="flex: 1"></span>
      <span role="img" aria-label="From Owino Plumbing and Kiseka Steel" style="display: flex"><span style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: #E4E6FA; color: #3A3F9B; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #1D2747">OP</span><span style="margin-left: -8px; display: flex"><span style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: #E4E6FA; color: #3A3F9B; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #1D2747">KS</span></span></span>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px"><span style="font-size: 13px; font-weight: 700; color: #5F6980">Sent from the supplier app</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">newest last</span></div>
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 0 6px">
      <sc-for list="{{props}}" as="p" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 10px; border-top: {{p.rule}}">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 42px; height: 42px; flex: none; border-radius: 999px; background: #E4E6FA; color: #3A3F9B; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.ini}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.item}}</span><span style="font-size: 12px; font-weight: 600; color: #5F6980; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.sup}} · {{p.note}}</span></span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding-left: 54px"><span class="m" style="font-size: 13px; color: #5F6980; text-decoration: line-through">{{p.was}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5F6980" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg><span class="m" style="font-size: 16px; font-weight: 600">{{p.now}}</span><span class="m" style="height: 22px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 600; display: flex; align-items: center; {{p.chip}}">{{p.pct}}</span></div>
        <sc-if value="{{p.open}}" hint-placeholder-val="{{ true }}">
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding-left: 54px">
            <sc-if value="{{p.rise}}" hint-placeholder-val="{{ true }}"><a href="PushBack.dc.html" style="height: 38px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E6E3DD; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">Push back</a></sc-if>
            <sc-if value="{{p.drop}}" hint-placeholder-val="{{ false }}"><span></span></sc-if>
            <button type="button" onClick="{{p.later}}" style="all: unset; cursor: pointer; height: 38px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E6E3DD; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">Not now</button>
            <button type="button" onClick="{{p.accept}}" style="all: unset; cursor: pointer; height: 38px; border-radius: 999px; background: #16203C; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">Accept</button>
          </div>
        </sc-if>
        <sc-if value="{{p.done}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 8px; min-height: 38px; margin-left: 54px; padding: 0 12px; border-radius: 12px; {{p.resultStyle}}"><span style="flex: 1; font-size: 12px; font-weight: 700">{{p.result}}</span><button type="button" onClick="{{p.undo}}" style="all: unset; cursor: pointer; font-size: 12px; font-weight: 700; color: #16203C">Undo</button></div>
        </sc-if>
      </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 20px; box-shadow: inset 0 0 0 1px #E6E3DD"><span style="width: 32px; height: 32px; flex: none; border-radius: 999px; background: #F6E4F1; color: #7A3268; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">RN</span><span style="flex: 1; font-size: 12px; font-weight: 600; color: #5F6980">Accepting a rise tells Ruth about every order line it puts under its sale price</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { prop: {} }; }
  renderVals() {
    const base = [
      { id: 'p1', ini: 'OP', item: 'PVC pipe 4" × 6m', sup: 'Owino Plumbing', was: '42,000', now: '44,000', pct: '+4.8%', rise: true,
        chip: 'background:#FDEEE1;color:#7A4A02', note: 'yesterday 16:05 · we buy ≈60 a month' },
      { id: 'p2', ini: 'KS', item: 'Binding wire 25kg', sup: 'Kiseka Steel', was: '96,000', now: '94,500', pct: '−1.6%', rise: false,
        chip: 'background:#E4F4EA;color:#0F6B43', note: 'today 09:40 · a lower price' }
    ];
    const pres = this.state.prop || {};
    const pset = (id, v) => () => this.setState({ prop: { ...pres, [id]: v } });
    const props = base.map((p, i) => {
      const r = pres[p.id];
      return { ...p, rule: i ? '1px solid #EFECE6' : 'none', drop: !p.rise, open: !r, done: !!r,
        result: r === 'later' ? 'Kept for later · it stays here' : 'Accepted · on the price list now',
        resultStyle: r === 'later' ? 'background:#F1EEE8;color:#5F6980' : 'background:#E4F4EA;color:#0F6B43',
        accept: pset(p.id, 'yes'), later: pset(p.id, 'later'), undo: pset(p.id, undefined) };
    });
    return { props, left: props.filter(p => p.open).length };
  }
}
</script>
</body>
</html>
