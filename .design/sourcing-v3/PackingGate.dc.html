<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">

      <span style="flex: 1; min-width: 0; text-align: center; font-size: 13px; font-weight: 700; color: #B3BCD2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">How it is packed</span>
      <span style="width: 44px; height: 44px; flex: none"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2">Self-drilling screws 10×25</span><span style="font-size: 12px; font-weight: 600; color: #B3BCD2">Template · drawn for screws</span></span>
    </div>
    <div role="img" aria-label="{{chainAria}}" style="display: flex; align-items: center; gap: 4px"><span style="flex: 1; min-width: 0; height: 74px; border-radius: 16px; background: rgba(255,255,255,.07); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><span style="font-size: 11px; font-weight: 700; color: #B3BCD2">Carton</span><span class="m" style="font-size: 20px; font-weight: 600; line-height: 1">× {{boxes}}</span><span style="font-size: 11px; font-weight: 600; color: #B3BCD2">boxes</span></span><span style="flex: none; color: #8D99B5; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></span><span style="flex: 1; min-width: 0; height: 74px; border-radius: 16px; background: rgba(255,255,255,.07); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><span style="font-size: 11px; font-weight: 700; color: #B3BCD2">Box</span><span class="m" style="font-size: 20px; font-weight: 600; line-height: 1">× {{pcs}}</span><span style="font-size: 11px; font-weight: 600; color: #B3BCD2">pieces</span></span><span style="flex: none; color: #8D99B5; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></span><span style="flex: 1; min-width: 0; height: 74px; border-radius: 16px; background: #FFFFFF; color: #16203C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><span style="font-size: 11px; font-weight: 700; color: #5F6980">Piece</span><span class="m" style="font-size: 20px; font-weight: 600; line-height: 1">1</span><span style="font-size: 11px; font-weight: 600; color: #5F6980">we sell</span></span></div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 0 4px; font-size: 13px; font-weight: 700; color: #5F6980">Pieces in a box</span>
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 12px 14px"><div style="display: flex; align-items: center; gap: 8px"><button type="button" onClick="{{lessPcs}}" aria-label="Fewer" style="all: unset; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 999px; background: #F1EEE8; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><label style="flex: 1; height: 52px; border-radius: 14px; box-shadow: inset 0 0 0 2px #16203C; display: flex; align-items: center; justify-content: center; gap: 6px"><input id="pk_pcs" value="{{pcs}}" inputmode="numeric" aria-label="Pieces in a box" style="width: 90px; border: none; outline: none; background: transparent; font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; text-align: right; color: #1C2233"><span style="font-size: 13px; font-weight: 700; color: #5F6980">pcs</span></label><button type="button" onClick="{{morePcs}}" aria-label="More" style="all: unset; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 999px; background: #16203C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div></div>
    <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">Boxes in a carton</span>
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 12px 14px"><div style="display: flex; align-items: center; gap: 8px"><button type="button" onClick="{{lessBox}}" aria-label="Fewer" style="all: unset; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 999px; background: #F1EEE8; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><label style="flex: 1; height: 52px; border-radius: 14px; box-shadow: inset 0 0 0 2px #16203C; display: flex; align-items: center; justify-content: center; gap: 6px"><input id="pk_box" value="{{boxes}}" inputmode="numeric" aria-label="Boxes in a carton" style="width: 90px; border: none; outline: none; background: transparent; font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; text-align: right; color: #1C2233"><span style="font-size: 13px; font-weight: 700; color: #5F6980">boxes</span></label><button type="button" onClick="{{moreBox}}" aria-label="More" style="all: unset; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 999px; background: #16203C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div></div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 16px; box-shadow: inset 0 0 0 1px #E6E3DD; font-size: 13px; font-weight: 700; color: #5F6980">1 carton = <span class="m" style="font-size: 17px; color: #1C2233">{{total}}</span> pieces</div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 8px 4px 0"><span style="font-size: 13px; font-weight: 700; color: #5F6980">Each supplier’s own pack</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">from their price row</span></div>
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 0 6px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 0 10px; border-top: {{r.rule}}">
        <span style="width: 42px; height: 42px; flex: none; border-radius: 999px; background: #E4E6FA; color: #3A3F9B; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.ini}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 700">{{r.name}}</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">sells {{r.pack}}</span></span>
        <span style="flex: none; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; display: flex; align-items: center; {{r.chip}}">{{r.says}}</span>
      </div>
      </sc-for>
    </div>
  </div>
  <div style="flex: none; padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 8px">
    <a href="Passport.dc.html" style="height: 58px; border-radius: 999px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; {{okStyle}}">{{okLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pcs: 100, boxes: 50 }; }
  renderVals() {
    const { pcs, boxes } = this.state;
    const fmt = (n) => n.toLocaleString('en-US');
    // each supplier's pack is read from its own price row (pack_qty), never from ours
    const sup = [
      { ini: 'KF', name: 'Katwe Fabricators', pack: 'a carton of 5,000', of: 5000 },
      { ini: 'NS', name: 'Namanve Sheets', pack: 'roofing screws by the 1,000', of: 1000 }
    ];
    const rows = sup.map((s, i) => {
      const whole = s.of % pcs === 0;
      return { ...s, rule: i ? '1px solid #EFECE6' : 'none', says: whole ? '= ' + fmt(s.of / pcs) + ' boxes' : 'not whole boxes',
        chip: whole ? 'background:#E4F4EA;color:#0F6B43' : 'background:#FDEEE1;color:#7A4A02', fails: !whole };
    });
    const failing = rows.filter(r => r.fails).map(r => r.name.split(' ')[0]);
    const step = (k, d, lo) => () => this.setState({ [k]: Math.max(lo, this.state[k] + d) });
    const ok = failing.length === 0;
    return {
      pcs, boxes, total: fmt(pcs * boxes), rows,
      chainAria: '1 carton holds ' + boxes + ' boxes; 1 box holds ' + pcs + ' pieces; we sell the piece',
      lessPcs: step('pcs', -50, 50), morePcs: step('pcs', 50, 50), lessBox: step('boxes', -10, 10), moreBox: step('boxes', 10, 10),
      okLabel: ok ? 'Packing is right' : failing.length > 1 ? 'Doesn’t fit ' + failing.join(' or ') : 'Doesn’t fit ' + failing[0] + '’s pack',
      okStyle: ok ? 'background:#C93A30;color:#FFFFFF;box-shadow:0 10px 22px rgba(201,58,48,.26)' : 'background:rgba(201,58,48,.45);color:#FFFFFF;pointer-events:none'
    };
  }
}
</script>
</body>
