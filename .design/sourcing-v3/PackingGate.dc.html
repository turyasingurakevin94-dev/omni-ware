<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Packing gate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#2A3350}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #8A90A0; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 56px; background: #FFFFFF; border-radius: 26px 26px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 16px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #E0DCD4"></span>
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 20px; font-weight: 700">How it is packed</span>
        <span style="font-size: 14px; color: #5F6980">Self-drilling screws 10×25</span>
      </div>
      <a href="Funnel.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #F1EEE8; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>

    <!-- nested boxes, drawn from the steppers -->
    <div style="display: flex; align-items: flex-end; justify-content: center; gap: 12px; padding: 6px 0 2px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="width: 112px; height: 92px; border-radius: 10px; background: #E4E6FA; border: 2px solid #3A3F9B; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; color: #3A3F9B">
          <span class="m" style="font-size: 20px; font-weight: 600">× {{boxes}}</span>
          <span style="font-size: 11px; font-weight: 700">boxes</span>
        </div>
        <span style="font-size: 13px; font-weight: 700">Carton</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6980" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-bottom: 52px"><path d="M9 6l6 6-6 6"></path></svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="width: 84px; height: 66px; border-radius: 8px; background: #FDE8E4; border: 2px solid #A82D24; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; color: #A82D24">
          <span class="m" style="font-size: 16px; font-weight: 600">× {{pcs}}</span>
          <span style="font-size: 11px; font-weight: 700">pieces</span>
        </div>
        <span style="font-size: 13px; font-weight: 700">Box <span style="padding: 2px 6px; border-radius: 999px; background: #16203C; color: #FFFFFF; font-size: 11px">we sell</span></span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6980" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-bottom: 52px"><path d="M9 6l6 6-6 6"></path></svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="width: 30px; height: 30px; border-radius: 999px; background: #F1EEE8; border: 2px solid #5F6980"></div>
        <span style="font-size: 13px; font-weight: 700">Piece</span>
      </div>
    </div>

    <!-- steppers -->
    <div style="display: flex; flex-direction: column; border: 1px solid #E6E3DD; border-radius: 16px; overflow: hidden">
      <sc-for list="{{steppers}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #EFECE6">
          <span style="flex: 1; font-size: 15px; font-weight: 600">{{s.label}}</span>
          <button type="button" aria-label="{{s.lessLabel}}" onClick="{{s.less}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 12px; background: #F1EEE8; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"></path></svg></button>
          <span class="m" style="width: 56px; text-align: center; font-size: 20px; font-weight: 600">{{s.v}}</span>
          <button type="button" aria-label="{{s.moreLabel}}" onClick="{{s.more}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 12px; background: #F1EEE8; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg></button>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: #5F6980">
      <span>1 carton</span><span>=</span><span class="m" style="font-size: 16px; font-weight: 600; color: #1C2233">{{total}}</span><span>pieces</span>
    </div>

    <!-- every supplier's own pack must convert -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #5F6980">Each supplier's own pack</span>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; {{r.tile}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.mark}}"></path></svg>
          <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
            <span style="font-size: 14px; font-weight: 700">{{r.name}}</span>
            <span style="font-size: 12px; font-weight: 600">sells {{r.pack}}</span>
          </span>
          <span style="font-size: 13px; font-weight: 600; text-align: right">{{r.says}}</span>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{ok}}" hint-placeholder-val="{{ true }}">
      <a href="Funnel.dc.html" style="margin-top: auto; text-align: center; padding: 15px 10px; border-radius: 14px; background: #C93A30; color: #FFFFFF; font-size: 15px; font-weight: 700">Packing is right</a>
    </sc-if>
    <sc-if value="{{notOk}}" hint-placeholder-val="{{ false }}">
      <button type="button" disabled="disabled" style="all: unset; margin-top: auto; text-align: center; padding: 15px 10px; border-radius: 14px; background: #F1EEE8; color: #5F6980; font-size: 14px; font-weight: 700">{{blocked}}</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pcs: 100, boxes: 50 }; }
  renderVals() {
    const { pcs, boxes } = this.state;
    const fmt = (n) => n.toLocaleString('en-US');
    const OK = { tile: 'background:#E4F4EA;color:#0F6B43', mark: 'M5 12.5l4.5 4.5L19 7.5' };
    const BAD = { tile: 'background:#FDEEE1;color:#7A4A02', mark: 'M12 7v6M12 17v.5' };
    // each supplier's pack is read from its own price row (pack_qty), never from ours
    const sup = [
      { name: 'Kiseka Steel', pack: 'a carton of 5,000', of: 5000 },
      { name: 'Katwe Fabricators', pack: 'by the 1,000', of: 1000 }
    ];
    const rows = sup.map(s => {
      const whole = s.of % pcs === 0;
      return { ...s, says: whole ? '= ' + fmt(s.of / pcs) + ' boxes' : 'not whole boxes', ...(whole ? OK : BAD), fails: !whole };
    });
    const failing = rows.filter(r => r.fails).map(r => r.name);
    const step = (k, d, lo) => () => this.setState({ [k]: Math.max(lo, this.state[k] + d) });
    const steppers = [
      { label: 'Pieces in a box', v: pcs, less: step('pcs', -50, 50), more: step('pcs', 50, 50), lessLabel: 'Fewer pieces', moreLabel: 'More pieces' },
      { label: 'Boxes in a carton', v: boxes, less: step('boxes', -10, 10), more: step('boxes', 10, 10), lessLabel: 'Fewer boxes', moreLabel: 'More boxes' }
    ];
    return {
      pcs, boxes, total: fmt(pcs * boxes), rows, steppers,
      ok: failing.length === 0, notOk: failing.length > 0,
      blocked: 'Doesn’t fit ' + failing.join(' and ') + '’s pack'
    };
  }
}
</script>
</body>
</html>
