<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — On sale</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F5F2}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #F7F5F2; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="background: #16203C; color: #FFFFFF; border-radius: 0 0 28px 28px; padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Funnel.dc.html" aria-label="Back to the Funnel" style="width: 44px; height: 44px; border-radius: 999px; background: #243052; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(111,220,176,.16); color: #6FDCB0; font-size: 12px; font-weight: 700"><i style="width: 7px; height: 7px; border-radius: 999px; background: #6FDCB0; display: inline-block"></i>On sale</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <span role="img" aria-label="All six gates done" style="width: 64px; height: 64px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #6FDCB0">
        <span class="m" style="width: 50px; height: 50px; border-radius: 999px; background: #16203C; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">6/6</span>
      </span>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 20px; font-weight: 700">Wire mesh BRC A142</span>
        <span style="font-size: 13px; color: #B3BCD2">In every app since <span class="m">18:10</span> · priced by Ruth Nakato</span>
      </div>
    </div>
  </div>

  <div style="padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 16px; font-weight: 700">Already told</span>
    <div style="background: #FFFFFF; border: 1px solid #E6E3DD; border-radius: 16px; overflow: hidden">
      <sc-for list="{{told}}" as="t" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #EFECE6">
          <span style="width: 32px; height: 32px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; {{t.av}}">{{t.ini}}</span>
          <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
            <span style="font-size: 14px; font-weight: 700">{{t.name}}</span>
            <span style="font-size: 12px; color: #5F6980">{{t.why}}</span>
          </span>
          <span style="padding: 4px 9px; border-radius: 999px; background: #E4F4EA; color: #0F6B43; font-size: 12px; font-weight: 700">Pushed</span>
        </div>
      </sc-for>
    </div>

    <span style="font-size: 16px; font-weight: 700">The customers who asked</span>
    <div style="background: #FFFFFF; border: 1px solid #E6E3DD; border-radius: 16px; overflow: hidden">
      <sc-for list="{{customers}}" as="c" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #EFECE6">
          <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
            <span style="font-size: 14px; font-weight: 700">{{c.name}}</span>
            <span style="font-size: 12px; color: #5F6980">asked for <span class="m">{{c.q}}</span> · {{c.owner}} tells them</span>
          </span>
        </div>
      </sc-for>
    </div>

    <button type="button" onClick="{{pin}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6E3DD">
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
        <span style="font-size: 15px; font-weight: 700">Ask Ruth to pin it on the agents' feed</span>
        <span style="font-size: 12px; color: #5F6980">{{pinSub}}</span>
      </span>
      <span style="flex: none; padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; {{pinChip}}">{{pinWord}}</span>
    </button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E6E3DD; box-shadow: 0 -8px 24px rgba(22,32,60,.08); padding: 12px 16px 18px">
    <a href="Funnel.dc.html" style="display: block; text-align: center; padding: 15px 10px; border-radius: 14px; background: #16203C; color: #FFFFFF; font-size: 15px; font-weight: 700">Back to the Funnel</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pin: false }; }
  renderVals() {
    const told = [
      { ini: 'GA', name: 'Grace Akello', why: 'Sales · asked for Kato Construction', av: 'background:#DCEAF8;color:#1A5A8A' },
      { ini: 'BO', name: 'Brian Ouma', why: 'Sales · asked for Lubowa Builders', av: 'background:#F6E4F1;color:#7A3268' },
      { ini: 'AN', name: 'Aisha Namutebi', why: 'Agent · asked for Mukono Roofing', av: 'background:#DDF1EE;color:#0E5E57' },
      { ini: 'DO', name: 'Denis Okello', why: 'Buyer · decides the first batch (about 40 suggested)', av: 'background:#E4E6FA;color:#3A3F9B' }
    ];
    const customers = [
      { name: 'Kato Construction', q: '20', owner: 'Grace' },
      { name: 'Lubowa Builders', q: '12', owner: 'Brian' },
      { name: 'Mukono Roofing', q: '8', owner: 'Aisha' }
    ];
    const on = this.state.pin;
    return {
      told, customers,
      pin: () => this.setState({ pin: !on }),
      pinSub: on ? 'Asked · Ruth decides' : 'for 14 days, so agents sell it · the Manager decides',
      pinWord: on ? 'Asked' : 'Ask',
      pinChip: on ? 'background:#E4F4EA;color:#0F6B43' : 'background:#16203C;color:#FFFFFF'
    };
  }
}
</script>
</body>
</html>
