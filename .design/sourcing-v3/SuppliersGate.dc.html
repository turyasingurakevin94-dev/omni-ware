<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Suppliers gate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#8A90A0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #8A90A0; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 48px; background: #FFFFFF; border-radius: 26px 26px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #E0DCD4"></span>
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 20px; font-weight: 700">Who sells it</span>
        <span style="font-size: 14px; color: #5F6980">Wire mesh BRC A142</span>
      </div>
      <a href="Passport.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #F1EEE8; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>

    <!-- target -->
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="display: grid; grid-template-columns: repeat(3, 28px); gap: 4px" aria-label="{{count}} suppliers priced; two is the target">
        <sc-for list="{{slots}}" as="s" hint-placeholder-count="3"><i style="height: 8px; border-radius: 4px; {{s}}"></i></sc-for>
      </div>
      <span style="font-size: 13px; color: #5F6980"><span class="m" style="font-weight: 600; color: #1C2233">{{count}}</span> priced · two is the target, three makes the verdict surer</span>
    </div>

    <sc-for list="{{sups}}" as="s" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; border: 1px solid #E6E3DD">
        <div style="display: flex; align-items: center; gap: 8px">
          <sc-if value="{{s.isLink}}" hint-placeholder-val="{{ true }}">
            <a href="{{s.href}}" style="font-size: 16px; font-weight: 700; flex: 1; min-width: 0">{{s.name}}</a>
          </sc-if>
          <sc-if value="{{s.noLink}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 16px; font-weight: 700; flex: 1; min-width: 0">{{s.name}}</span>
          </sc-if>
          <sc-if value="{{s.cheapest}}" hint-placeholder-val="{{ false }}">
            <span style="padding: 3px 8px; border-radius: 999px; background: #E4F4EA; color: #0F6B43; font-size: 11px; font-weight: 700">Cheapest</span>
          </sc-if>
          <span class="m" style="font-size: 16px; font-weight: 600">{{s.price}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5F6980">Steps</span><span class="m" style="font-size: 13px; font-weight: 600">{{s.steps}}</span></span>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5F6980">Pack</span><span style="font-size: 13px; font-weight: 600">{{s.pack}}</span></span>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5F6980">Delivers in</span><span style="font-size: 13px; font-weight: 600">{{s.lead}}</span></span>
        </div>
        <span style="font-size: 12px; color: #5F6980">{{s.age}}</span>
      </div>
    </sc-for>

    <sc-if value="{{adding}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #F7F5F2">
        <span style="font-size: 14px; font-weight: 700">A price you already have</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <span style="padding: 8px 12px; border-radius: 999px; background: #16203C; color: #FFFFFF; font-size: 13px; font-weight: 700">Namanve Sheets</span>
          <span style="padding: 8px 12px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 700; box-shadow: inset 0 0 0 1px #E6E3DD">Another supplier</span>
        </div>
        <div style="display: flex; gap: 8px; align-items: center">
          <label for="sg_price" style="font-size: 13px; color: #5F6980">A sheet</label>
          <input id="sg_price" type="text" inputmode="numeric" value="124,000" style="box-sizing: border-box; flex: 1; min-width: 0; padding: 11px 12px; border-radius: 12px; border: 1.5px solid #16203C; font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">
          <button type="button" onClick="{{save}}" style="all: unset; cursor: pointer; padding: 12px 14px; border-radius: 12px; background: #16203C; color: #FFFFFF; font-size: 14px; font-weight: 700">Save</button>
        </div>
      </div>
    </sc-if>

    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="NewSupplier.dc.html" style="text-align: center; padding: 14px 8px; border-radius: 14px; background: #F1EEE8; font-size: 14px; font-weight: 700">A new supplier</a>
      <button type="button" onClick="{{add}}" style="all: unset; cursor: pointer; text-align: center; padding: 14px 8px; border-radius: 14px; background: #C93A30; color: #FFFFFF; font-size: 15px; font-weight: 700">Add a price</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { adding: false, third: false }; }
  renderVals() {
    const S = this.state;
    const base = [
      { name: 'Kiseka Steel', href: 'SupplierKiseka.dc.html', price: '118,000', steps: 'one price', pack: 'by the sheet', lead: 'about 3 days', age: 'Priced 2 days ago, at their shop', cheapest: true },
      { name: 'Katwe Fabricators', href: '', price: '121,500', steps: '50+ 119,000', pack: 'bundles of 10', lead: 'about 5 days', age: 'Priced 5 days ago, by phone', cheapest: false }
    ].concat(S.third ? [{ name: 'Namanve Sheets', href: '', price: '124,000', steps: 'one price', pack: 'by the sheet', lead: 'not known yet', age: 'Added just now · saved on this phone', cheapest: false }] : []);
    const sups = base.map(s => ({ ...s, isLink: !!s.href, noLink: !s.href }));
    const count = sups.length;
    return {
      sups, count,
      slots: [0, 1, 2].map(i => i < count ? 'background:#0F6B43' : 'background:#E0DCD4'),
      adding: S.adding && !S.third,
      add: () => this.setState({ adding: true }),
      save: () => this.setState({ third: true, adding: false })
    };
  }
}
</script>
</body>
</html>
