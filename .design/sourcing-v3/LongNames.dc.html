<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Long names</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F5F2}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #F7F5F2; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="background: #16203C; color: #FFFFFF; padding: 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 20px; font-weight: 700">Funnel</span>
    <span style="padding: 6px 12px; border-radius: 999px; background: #243052; font-size: 13px; font-weight: 700; color: #B3BCD2">Wanted <span class="m">1,214</span></span>
  </div>

  <div style="padding: 14px 16px 120px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #FFFFFF; border: 1px solid #E6E3DD; border-radius: 16px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 48px; height: 48px; flex: none; border-radius: 12px; background: #F1EEE8"></span>
          <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1">
            <span title="{{c.name}}" style="font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.name}}</span>
            <span title="{{c.sub}}" style="font-size: 12px; color: #5F6980; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.sub}}</span>
          </span>
          <span class="m" style="flex: none; font-size: 15px; font-weight: 600; white-space: nowrap">{{c.fig}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
          <sc-for list="{{c.pips}}" as="p" hint-placeholder-count="6"><i style="height: 6px; border-radius: 3px; {{p}}"></i></sc-for>
        </div>
      </div>
    </sc-for>
    <span style="font-size: 13px; font-weight: 600; color: #5F6980; padding-left: 4px">+ <span class="m">1,210</span> more in Wanted</span>

    <span style="font-size: 16px; font-weight: 700; margin-top: 6px">Waiting for it</span>
    <div style="background: #FFFFFF; border: 1px solid #E6E3DD; border-radius: 16px; overflow: hidden">
      <sc-for list="{{askers}}" as="a" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #EFECE6">
          <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
            <span title="{{a.name}}" style="font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{a.name}}</span>
            <span style="font-size: 12px; color: #5F6980; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{a.via}}</span>
          </span>
          <span class="m" style="flex: none; font-size: 14px; font-weight: 600; white-space: nowrap">{{a.q}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Sourcing" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E6E3DD; box-shadow: 0 -8px 24px rgba(22,32,60,.08); display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: start; padding: 8px 0 14px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 600; color: #5F6980">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18a6 6 0 0 1 12 0z"></path><path d="M3 18h18M12 4v3M4.9 8.9 7 11M19.1 8.9 17 11"></path></svg>Today</a>
    <a href="LongNames.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 700; color: #1C2233">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"></path></svg>Funnel</a>
    <a href="Capture.dc.html" aria-label="Capture" style="justify-self: center; margin-top: -26px; width: 64px; height: 64px; border-radius: 999px; background: #C93A30; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 4px solid #F7F5F2; box-shadow: 0 6px 20px rgba(201,58,48,.35)">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Prices.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 600; color: #5F6980">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1.5"></circle></svg>Prices</a>
    <a href="Suppliers.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 600; color: #5F6980">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-5 9 5v12"></path><path d="M8 21v-7h8v7"></path></svg>Suppliers</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const PIP = { d: 'background:#0F6B43', g: 'background:#95530C', t: 'background:#E0DCD4' };
    const cards = [
      { name: 'Iron sheet G28 3m box profile, maroon, Namanve finish', sub: 'Kyaligonza & Sons · Mukono Roofing · Lubowa Builders · 4 more', fig: '1,240 sheets', g: 'tddtdt' },
      { name: 'Galvanised gutter bracket, heavy duty, 150mm', sub: '7 searches · 4 named people · last 2 hours ago', fig: '7', g: 'tttttt' },
      { name: 'PPR pipe 25mm × 4m PN20 hot and cold', sub: 'Ggaba Stores · Nansana Hardware', fig: '200', g: 'ttttdt' },
      { name: 'Self-drilling screws 10×25, hex head, galvanised', sub: 'Faith Nambi asked for Kato Construction', fig: '12,000', g: 'dgdtdt' }
    ].map(c => ({ ...c, pips: c.g.split('').map(k => PIP[k]) }));
    const askers = [
      { name: 'Kyaligonza & Sons Construction and Hardware Supplies', via: 'via Brian Ouma', q: '1,000,000' },
      { name: 'Mukono Roofing', via: 'via Aisha Namutebi, agent', q: '120' },
      { name: 'Lubowa Builders', via: 'via Brian Ouma', q: '40' }
    ];
    return { cards, askers };
  }
}
</script>
</body>
</html>
