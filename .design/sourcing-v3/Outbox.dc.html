<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Saved on this phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F5F2}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #F7F5F2; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 4px">
    <a href="Main.dc.html" aria-label="Back to Today" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 16px; font-weight: 700">Saved on this phone</span>
  </div>

  <div style="padding: 8px 16px 120px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; {{banner}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{bannerIcon}}"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
        <span style="font-size: 15px; font-weight: 700">{{bannerTitle}}</span>
        <span style="font-size: 13px">{{bannerSub}}</span>
      </span>
    </div>

    <sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}">
      <div style="background: #FFFFFF; border: 1px solid #E6E3DD; border-radius: 16px; overflow: hidden">
        <sc-for list="{{queue}}" as="q" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EFECE6">
            <span style="width: 36px; height: 36px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; {{q.well}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{q.icon}}"></path></svg></span>
            <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
              <span style="font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{q.what}}</span>
              <span style="font-size: 12px; color: #5F6980">{{q.sub}}</span>
            </span>
            <span class="m" style="font-size: 12px; color: #5F6980">{{q.at}}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E3DD; font-size: 13px; line-height: 1.45; color: #5F6980">
      <span style="font-size: 13px; font-weight: 700; color: #1C2233">If someone changed the same price meanwhile</span>
      <span>The newer one stays on the list. You see both here and pick.</span>
    </div>

    <span style="font-size: 13px; color: #5F6980">Earlier today <span class="m">9</span> captures went up.</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E6E3DD; box-shadow: 0 -8px 24px rgba(22,32,60,.08); padding: 12px 16px 18px">
    <sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{send}}" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; display: block; text-align: center; padding: 15px 10px; border-radius: 14px; font-size: 15px; font-weight: 700; background: #F1EEE8; color: #1C2233">Try now</button>
    </sc-if>
    <sc-if value="{{allUp}}" hint-placeholder-val="{{ false }}">
      <a href="Main.dc.html" style="display: block; text-align: center; padding: 15px 10px; border-radius: 14px; font-size: 15px; font-weight: 700; background: #16203C; color: #FFFFFF">Back to Today</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sent: false }; }
  renderVals() {
    const sent = this.state.sent;
    const queue = [
      { what: 'Wire mesh BRC A142 · 149,000', sub: 'Rival price · Kikuubo Hardware Mart', at: '18:02', well: 'background:#F6E4F1;color:#7A3268',
        icon: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' },
      { what: 'Gate valve ½"', sub: 'Photo · passed the check', at: '18:05', well: 'background:#F1EEE8;color:#1C2233',
        icon: 'M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z' }
    ];
    return {
      queue, waiting: !sent,
      banner: sent ? 'background:#E4F4EA;color:#0F6B43' : 'background:#FDEEE1;color:#7A4A02',
      bannerIcon: sent ? 'M5 12.5l4.5 4.5L19 7.5' : 'M4 9a12 12 0 0 1 16 0M7 12.5a7.5 7.5 0 0 1 10 0M10 16a3 3 0 0 1 4 0M12 19h.01',
      bannerTitle: sent ? 'All up' : '2 waiting for signal',
      bannerSub: sent ? 'Everything you captured is on the shop’s books.' : 'They go up when the phone is back online.',
      send: () => this.setState({ sent: true }),
      allUp: sent
    };
  }
}
</script>
</body>
</html>
