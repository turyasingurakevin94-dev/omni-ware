<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Send to the Manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#8A90A0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #8A90A0; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 70px; background: #FFFFFF; border-radius: 26px 26px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 16px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #E0DCD4"></span>

    <sc-if value="{{confirm}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; gap: 14px">
        <span role="img" aria-label="5 of 6 gates done" style="width: 64px; height: 64px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: conic-gradient(#FFFFFF 0deg 4deg, #0F6B43 4deg 296deg, #FFFFFF 296deg 304deg, #E0DCD4 304deg 356deg, #FFFFFF 356deg 360deg)">
          <span class="m" style="width: 50px; height: 50px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">5/6</span>
        </span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 20px; font-weight: 700">Tile cutter 600mm</span>
          <span style="font-size: 13px; color: #5F6980">Five gates done. The last one is the Manager's.</span>
        </div>
      </div>

      <div style="border: 1px solid #E6E3DD; border-radius: 16px; overflow: hidden">
        <sc-for list="{{gates}}" as="g" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #EFECE6">
            <span style="width: 22px; height: 22px; flex: none; border-radius: 999px; background: #E4F4EA; color: #0F6B43; display: flex; align-items: center; justify-content: center">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
            <span style="font-size: 14px; font-weight: 700; width: 96px; flex: none">{{g.k}}</span>
            <span style="font-size: 14px; color: #5F6980; flex: 1; min-width: 0">{{g.v}}</span>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #F1EEE8">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: #DCEAF8; color: #1A5A8A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">RN</span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
          <span style="font-size: 15px; font-weight: 700">Ruth Nakato, Manager</span>
          <span style="font-size: 13px; color: #5F6980">gets a push, sets the markup and puts it on sale</span>
        </span>
      </div>

      <button type="button" onClick="{{send}}" style="all: unset; cursor: pointer; margin-top: auto; text-align: center; padding: 15px 10px; border-radius: 14px; background: #C93A30; color: #FFFFFF; font-size: 15px; font-weight: 700">Send to Ruth</button>
    </sc-if>

    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 0 6px; text-align: center">
        <span style="width: 72px; height: 72px; border-radius: 999px; background: #E4F4EA; color: #0F6B43; display: flex; align-items: center; justify-content: center">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        <span style="font-size: 20px; font-weight: 700">With the Manager</span>
        <span style="font-size: 14px; color: #5F6980">Ruth was pushed at <span class="m">18:42</span>.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 0; padding: 0 8px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <div style="display: flex; gap: 12px">
            <span style="display: flex; flex-direction: column; align-items: center; width: 18px">
              <span style="width: 14px; height: 14px; border-radius: 999px; {{s.dot}}"></span>
              <span style="width: 2px; flex: 1; min-height: 26px; {{s.line}}"></span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 12px">
              <span style="font-size: 14px; font-weight: 700">{{s.k}}</span>
              <span style="font-size: 12px; color: #5F6980">{{s.v}}</span>
            </span>
          </div>
        </sc-for>
      </div>
      <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px">
        <button type="button" onClick="{{back}}" style="all: unset; cursor: pointer; text-align: center; padding: 14px 8px; border-radius: 14px; background: #F1EEE8; font-size: 14px; font-weight: 700">Take it back</button>
        <a href="Funnel.dc.html" style="text-align: center; padding: 14px 8px; border-radius: 14px; background: #16203C; color: #FFFFFF; font-size: 15px; font-weight: 700">Back to the Funnel</a>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sent: false }; }
  renderVals() {
    const sent = this.state.sent;
    const gates = [
      { k: 'Photo', v: 'passed the check' },
      { k: 'Packing', v: 'by the piece' },
      { k: 'Suppliers', v: '2 priced' },
      { k: 'Verdict', v: 'Per order · sells about 2 a month' },
      { k: 'Name & aisle', v: 'Tools' }
    ];
    const DONE = 'background:#0F6B43', NEXT = 'background:#FFFFFF;box-shadow:inset 0 0 0 2px #95530C', LATER = 'background:#E0DCD4';
    const steps = [
      { k: 'Sent', v: 'by you, 18:42', dot: DONE, line: 'background:#0F6B43' },
      { k: 'Ruth prices it', v: 'the markup is hers', dot: NEXT, line: 'background:#E0DCD4' },
      { k: 'On sale', v: 'in every app at once', dot: LATER, line: 'background:#E0DCD4' },
      { k: 'The askers are told', v: 'a push to whoever asked', dot: LATER, line: 'background:transparent' }
    ];
    return {
      confirm: !sent, sent, gates, steps,
      send: () => this.setState({ sent: true }),
      back: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
