<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Funnel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F5F2}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 1060px; position: relative; overflow: hidden; background: #F7F5F2; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <!-- header -->
  <div style="background: #16203C; color: #FFFFFF; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 20px; font-weight: 700">Funnel</span>
      <div role="group" aria-label="View" style="display: flex; padding: 3px; border-radius: 999px; background: #243052">
        <button type="button" onClick="{{showOpen}}" style="{{openTab}}">Open</button>
        <button type="button" onClick="{{showCertify}}" style="{{certTab}}">Certify</button>
      </div>
    </div>
    <div style="display: flex; gap: 6px; overflow: hidden">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="7">
        <button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}} <span class="m">{{c.n}}</span></button>
      </sc-for>
    </div>
  </div>

  <!-- legend: the six gates, once -->
  <div style="display: flex; justify-content: space-between; padding: 12px 16px 4px; font-size: 11px; font-weight: 600; color: #5F6980">
    <span>Photo</span><span>Packing</span><span>Suppliers</span><span>Verdict</span><span>Name</span><span>Markup</span>
  </div>

  <div style="padding: 6px 16px 120px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <span style="font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #5F6980">{{g.label}}</span>
          <span class="m" style="font-size: 12px; color: #5F6980">{{g.n}}</span>
        </div>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
          <a href="Passport.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #FFFFFF; border: 1px solid #E6E3DD; border-radius: 16px">
            <span style="width: 52px; height: 52px; flex: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; {{it.thumb}}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
            </span>
            <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1">
              <span style="font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.name}}</span>
              <span style="font-size: 12px; color: #5F6980; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.sub}}</span>
              <span style="align-self: flex-start; margin-top: 3px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; {{it.goStyle}}">{{it.go}}</span>
            </span>
            <span role="img" aria-label="{{it.aria}}" style="width: 48px; height: 48px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{it.ring}}">
              <span class="m" style="width: 36px; height: 36px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">{{it.done}}/6</span>
            </span>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <!-- TAB BAR -->
  <nav aria-label="Sourcing" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E6E3DD; display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: start; padding: 8px 0 14px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 600; color: #5F6980">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18a6 6 0 0 1 12 0z"></path><path d="M3 18h18M12 4v3M4.9 8.9 7 11M19.1 8.9 17 11"></path></svg>Today</a>
    <a href="Funnel.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 700; color: #1C2233">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"></path></svg>Funnel</a>
    <a href="Capture.dc.html" aria-label="Capture" style="justify-self: center; margin-top: -26px; width: 64px; height: 64px; border-radius: 999px; background: #C93A30; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 4px solid #F7F5F2; box-shadow: 0 6px 20px rgba(201,58,48,.35)">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Prices.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 600; color: #5F6980">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1.5"></circle></svg>Prices</a>
    <a href="Supplier.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 600; color: #5F6980">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-5 9 5v12"></path><path d="M8 21v-7h8v7"></path></svg>Suppliers</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lane: 'all', view: 'open' }; }
  renderVals() {
    const COL = { d: '#0F6B43', g: '#B86E12', t: '#E0DCD4' };
    const ring = (s) => {
      const parts = [];
      s.split('').forEach((k, i) => {
        const a = i * 60, b = a + 60;
        parts.push('#FFFFFF ' + a + 'deg ' + (a + 4) + 'deg', COL[k] + ' ' + (a + 4) + 'deg ' + (b - 4) + 'deg', '#FFFFFF ' + (b - 4) + 'deg ' + b + 'deg');
      });
      return 'conic-gradient(' + parts.join(',') + ')';
    };
    const ICON = {
      cam: 'M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z',
      box: 'M3 7.5 12 3l9 4.5v9L12 21l-9-4.5zM3 7.5 12 12l9-4.5M12 12v9'
    };
    const DARK = 'background:#16203C;color:#FFFFFF';
    const SOFT = 'background:#F1EEE8;color:#1C2233';
    const RED = 'background:#C93A30;color:#FFFFFF';
    const mk = (name, sub, gates, go, primary) => {
      const done = gates.split('').filter(k => k === 'd').length;
      const has = gates[0] === 'd';
      return {
        name, sub, go, done, ring: ring(gates),
        goStyle: primary ? RED : (go === 'Waiting · 3h' ? 'background:#FDEEE1;color:#7A4A02' : SOFT),
        thumb: has ? 'background:#DCEAF8;color:#1A5A8A' : 'background:#F1EEE8;color:#5F6980',
        icon: has ? ICON.box : ICON.cam,
        aria: done + ' of 6 gates done'
      };
    };
    const open = [
      { key: 'wanted', label: 'Wanted', items: [
        mk('Gutter bracket, galvanised', '7 searches · 4 people', 'tttttt', 'Hunt it'),
        mk('PPR pipe 25mm × 4m', 'Ggaba Stores · Nansana Hardware', 'ttttdt', 'Hunt it')
      ], n: 9 },
      { key: 'hunting', label: 'Hunting', items: [
        mk('Ridge cap G28, maroon', '3 suppliers asked · no answer yet', 'tttgdt', 'Chase 3')
      ], n: 6 },
      { key: 'quoted', label: 'Quoted', items: [
        mk('Wire mesh BRC A142', '2 quotes · 3 customers waiting', 'tddgdt', 'Take the photo', true),
        mk('Self-drilling screws 10×25', '1 quote · Faith Nambi asked', 'dgdtdt', 'Set the packing')
      ], n: 4 },
      { key: 'ready', label: 'Ready', items: [
        mk('Tile cutter 600mm', 'All five gates done', 'dddddt', 'Send to Manager', true)
      ], n: 3 },
      { key: 'manager', label: 'With Manager', items: [
        mk('Paint roller 9"', 'Ruth Nakato · pushed', 'dddddt', 'Waiting · 3h')
      ], n: 2 }
    ];
    const certify = [
      { key: 'certify', label: 'Top sellers with gaps', items: [
        mk('Iron sheet G28, 3m box profile', '#1 by sales · no verdict, no photo', 'tddtdd', 'Take the photo', true),
        mk('Cement 50kg', '#2 by sales · one supplier', 'ddgddd', 'Find a second'),
        mk('Y12 rebar, 12m', '#3 by sales · packing not set', 'dgdddd', 'Set the packing')
      ], n: 59 }
    ];
    const isOpen = this.state.view === 'open';
    const lanes = [['all', 'All', 24], ['wanted', 'Wanted', 9], ['hunting', 'Hunting', 6], ['quoted', 'Quoted', 4], ['ready', 'Ready', 3], ['manager', 'Manager', 2]];
    const chips = isOpen ? lanes.map(([k, label, n]) => ({
      label, n,
      pick: () => this.setState({ lane: k }),
      style: 'all:unset;cursor:pointer;flex:none;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;' +
        (this.state.lane === k ? 'background:#FFFFFF;color:#16203C' : 'background:#243052;color:#B3BCD2')
    })) : [];
    const groups = isOpen ? open.filter(g => this.state.lane === 'all' || g.key === this.state.lane) : certify;
    const tab = (on) => 'all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;' + (on ? 'background:#FFFFFF;color:#16203C' : 'color:#B3BCD2');
    return {
      chips, groups,
      openTab: tab(isOpen), certTab: tab(!isOpen),
      showOpen: () => this.setState({ view: 'open' }),
      showCertify: () => this.setState({ view: 'certify' })
    };
  }
}
</script>
</body>
</html>
