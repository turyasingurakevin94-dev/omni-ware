<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Name and aisle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#8A90A0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #8A90A0; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 48px; background: #FFFFFF; border-radius: 26px 26px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 16px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #E0DCD4"></span>
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 20px; font-weight: 700">Name &amp; aisle</span>
        <span style="font-size: 14px; color: #5F6980">How everyone finds it</span>
      </div>
      <a href="Passport.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #F1EEE8; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="na_name" style="font-size: 12px; font-weight: 700; color: #5F6980">Name</label>
      <input id="na_name" type="text" value="Wire mesh BRC A142" style="box-sizing: border-box; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #E6E3DD; font: inherit; font-size: 16px; font-weight: 600">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #5F6980">Aisle</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{aisles}}" as="a" hint-placeholder-count="5">
          <button type="button" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button>
        </sc-for>
      </div>
    </div>

    <!-- names people search with -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #5F6980">Also found when people search</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{names}}" as="n" hint-placeholder-count="2">
          <span style="display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 999px; background: #E4F4EA; color: #0F6B43; font-size: 13px; font-weight: 700">"{{n.w}}" <span style="font-weight: 500; color: #1C2233">{{n.why}}</span></span>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px">
        <label for="na_teach" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Teach a name</label>
        <input id="na_teach" type="text" placeholder="Teach a name, e.g. welded mesh" style="box-sizing: border-box; flex: 1; min-width: 0; padding: 11px 12px; border-radius: 12px; border: 1px solid #E6E3DD; font: inherit; font-size: 14px">
        <button type="button" onClick="{{teach}}" style="all: unset; cursor: pointer; padding: 11px 14px; border-radius: 12px; background: #16203C; color: #FFFFFF; font-size: 14px; font-weight: 700">Teach</button>
      </div>
    </div>

    <!-- look-alike -->
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 16px; border: 1.5px solid #95530C; background: #FEF8F2">
      <span style="font-size: 12px; font-weight: 700; color: #7A4A02">Looks like an item we already sell</span>
      <div style="display: flex; gap: 12px; align-items: center">
        <span role="img" aria-label="Photo of welded mesh" style="width: 48px; height: 48px; flex: none; border-radius: 10px; background: repeating-linear-gradient(0deg, transparent 0 8px, #6B7480 8px 10px), repeating-linear-gradient(90deg, #E0DCD4 0 8px, #6B7480 8px 10px)"></span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
          <span style="font-size: 15px; font-weight: 700">Welded mesh A142</span>
          <span style="font-size: 12px; color: #5F6980">2.4 × 6.0 m sheet · on sale · Kiseka Steel</span>
        </span>
      </div>
      <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" onClick="{{same}}" style="all: unset; cursor: pointer; text-align: center; padding: 11px; border-radius: 12px; background: #FFFFFF; font-size: 14px; font-weight: 700; box-shadow: inset 0 0 0 1px #E6E3DD">The same item</button>
          <button type="button" onClick="{{diff}}" style="all: unset; cursor: pointer; text-align: center; padding: 11px; border-radius: 12px; background: #16203C; color: #FFFFFF; font-size: 14px; font-weight: 700">Different items</button>
        </div>
      </sc-if>
      <sc-if value="{{decided}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #1C2233">
          <span style="flex: 1">{{result}}</span>
          <button type="button" onClick="{{undo}}" style="all: unset; cursor: pointer; font-size: 13px; font-weight: 700; text-decoration: underline">Undo</button>
        </div>
      </sc-if>
    </div>

    <a href="Passport.dc.html" style="margin-top: auto; text-align: center; padding: 15px 10px; border-radius: 14px; background: #C93A30; color: #FFFFFF; font-size: 15px; font-weight: 700">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { aisle: 'Steel & mesh', taught: false, twin: null }; }
  renderVals() {
    const S = this.state;
    const aisles = ['Steel & mesh', 'Roofing', 'Fasteners', 'Tools', 'Plumbing'].map(label => ({
      label, pick: () => this.setState({ aisle: label }),
      style: 'all:unset;cursor:pointer;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;' +
        (S.aisle === label ? 'background:#16203C;color:#FFFFFF' : 'background:#F1EEE8')
    }));
    const names = [{ w: 'brc mesh', why: '3 searches' }, { w: 'a142', why: '2 searches' }].concat(S.taught ? [{ w: 'welded mesh', why: 'just taught' }] : []);
    return {
      aisles, names,
      teach: () => this.setState({ taught: true }),
      open: !S.twin, decided: !!S.twin,
      result: S.twin === 'same' ? 'One item: this hunt joins Welded mesh A142.' : 'Two items, kept apart. The Buyer sees both.',
      same: () => this.setState({ twin: 'same' }),
      diff: () => this.setState({ twin: 'diff' }),
      undo: () => this.setState({ twin: null })
    };
  }
}
</script>
</body>
</html>
