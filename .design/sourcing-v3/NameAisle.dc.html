<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing · Name & aisle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#9AA1AE}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes owPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.6)}70%{box-shadow:0 0 0 6px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
@keyframes owRingA{0%,100%{box-shadow:0 0 0 3px #19223F,0 0 0 5px rgba(245,178,107,.95)}50%{box-shadow:0 0 0 3px #19223F,0 0 0 8px rgba(245,178,107,.25)}}
@keyframes owUndoRun{to{stroke-dashoffset:62.8}}
@keyframes owGone{to{opacity:0;visibility:hidden}}
@keyframes owChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="flex: none; background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 30px 30px; padding: 10px 16px 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="Passport.dc.html" aria-label="Back to the passport" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: rgba(255,255,255,.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="flex: 1; min-width: 0; text-align: center; font-size: 13px; font-weight: 700; color: #B3BCD2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Name & aisle</span>
      <span style="width: 44px; height: 44px; flex: none"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 52px; height: 52px; flex: none; border-radius: 16px; background: rgba(255,255,255,.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2">Wire mesh BRC A142</span><span style="font-size: 12px; font-weight: 600; color: #B3BCD2">Searched for as · each word finds it</span></span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{names}}" as="n" hint-placeholder-count="2"><span style="height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.08); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px">{{n.w}}<span class="m" style="color: #6FDCB0">{{n.n}}</span></span></sc-for>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 0 4px; font-size: 13px; font-weight: 700; color: #5F6980">Name</span>
    <input value="Wire mesh BRC A142" aria-label="Name" style="box-sizing: border-box; height: 52px; padding: 0 14px; border-radius: 16px; border: none; box-shadow: inset 0 0 0 2px #16203C; background: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; color: #1C2233">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 8px 4px 0"><span style="font-size: 13px; font-weight: 700; color: #5F6980">Aisle</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">{{aisleNote}}</span></div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{aisles}}" as="a" hint-placeholder-count="5"><button type="button" aria-pressed="{{a.on}}" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button></sc-for></div>
    <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">Teach a name people search with</span>
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 20px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E6E3DD">
      <input value="welded mesh" aria-label="Teach a name" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; font-weight: 600">
      <button type="button" onClick="{{teach}}" style="all: unset; cursor: pointer; height: 40px; padding: 0 16px; border-radius: 999px; background: #16203C; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center">{{teachLabel}}</button>
    </div>
    <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">Looks like an item we already sell</span>
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 6px">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 0 10px; border-radius: 16px"><span style="width: 42px; height: 42px; flex: none; border-radius: 13px; background: #FDEEE1; color: #95530C; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM15 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"></path></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Welded mesh A142</span><span style="font-size: 12px; font-weight: 600; color: #5F6980; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">2.4 × 6.0 m sheet · on sale · Kiseka Steel</span></span></div>
      <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 2px 6px 8px">
        <button type="button" onClick="{{same}}" style="all: unset; cursor: pointer; height: 42px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E6E3DD; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">The same item</button>
        <button type="button" onClick="{{diff}}" style="all: unset; cursor: pointer; height: 42px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E6E3DD; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">Different items</button>
      </div>
      </sc-if>
      <sc-if value="{{decided}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 8px; min-height: 42px; margin: 2px 6px 8px; padding: 0 12px; border-radius: 12px; {{resultStyle}}"><span style="flex: 1; font-size: 12px; font-weight: 700">{{result}}</span><button type="button" onClick="{{undo}}" style="all: unset; cursor: pointer; font-size: 12px; font-weight: 700; color: #16203C">Undo</button></div></sc-if>
    </div>
  </div>
  <div style="flex: none; padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 8px">
    <a href="Passport.dc.html" style="height: 58px; border-radius: 999px; background: #C93A30; color: #FFFFFF; box-shadow: 0 10px 22px rgba(201,58,48,.26); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { aisle: 'Steel & mesh', touched: false, taught: false, twin: null }; }
  renderVals() {
    const S = this.state;
    const aisles = ['Steel & mesh', 'Roofing', 'Fasteners', 'Tools', 'Plumbing'].map(label => ({
      label, on: String(S.aisle === label), pick: () => this.setState({ aisle: label, touched: true }),
      style: 'all:unset;cursor:pointer;box-sizing:border-box;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;display:flex;align-items:center;' +
        (S.aisle === label ? (S.touched ? 'background:#16203C;color:#FFFFFF' : 'background:#FFFFFF;color:#0F6B43;box-shadow:inset 0 0 0 1.5px #0F6B43') : 'background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #E6E3DD')
    }));
    const names = [{ w: 'brc mesh', n: '3' }, { w: 'a142', n: '2' }].concat(S.taught ? [{ w: 'welded mesh', n: 'new' }] : []);
    return {
      aisles, names, aisleNote: S.touched ? 'chosen' : 'filled for you · check',
      teach: () => this.setState({ taught: true }), teachLabel: S.taught ? 'Taught' : 'Teach',
      open: !S.twin, decided: !!S.twin,
      result: S.twin === 'same' ? 'One item · this hunt joins Welded mesh A142' : 'Two items, kept apart · Denis sees both',
      resultStyle: S.twin === 'same' ? 'background:#E4F4EA;color:#0F6B43' : 'background:#F1EEE8;color:#5F6980',
      same: () => this.setState({ twin: 'same' }), diff: () => this.setState({ twin: 'diff' }), undo: () => this.setState({ twin: null })
    };
  }
}
</script>
</body>
</html>
