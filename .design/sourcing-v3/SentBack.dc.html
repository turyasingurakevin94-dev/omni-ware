<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Sent back</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F5F2}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 4px">
    <a href="Main.dc.html" aria-label="Back to Today" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 16px; font-weight: 700">Sent back</span>
  </div>

  <div style="padding: 8px 16px 120px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span role="img" aria-label="4 of 6 gates done; the photo needs redoing" style="width: 64px; height: 64px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: conic-gradient(#FFFFFF 0deg 4deg, #95530C 4deg 56deg, #FFFFFF 56deg 64deg, #0F6B43 64deg 296deg, #FFFFFF 296deg 304deg, #E0DCD4 304deg 356deg, #F7F5F2 356deg 360deg)">
        <span class="m" style="width: 50px; height: 50px; border-radius: 999px; background: #F7F5F2; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">4/6</span>
      </span>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 20px; font-weight: 700">Door hinge 4" brass</span>
        <span style="font-size: 13px; color: #5F6980">The photo gate is open again</span>
      </div>
    </div>

    <!-- the Manager's note -->
    <div style="display: flex; gap: 10px; align-items: flex-start">
      <span style="width: 36px; height: 36px; flex: none; border-radius: 999px; background: #DCEAF8; color: #1A5A8A; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">RN</span>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 4px 16px 16px 16px; background: #FFFFFF; border: 1px solid #E6E3DD">
        <span style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 13px; font-weight: 700">Ruth Nakato</span>
          <span class="m" style="font-size: 12px; color: #5F6980">16:20</span>
          <span style="padding: 2px 8px; border-radius: 999px; background: #FDEEE1; color: #7A4A02; font-size: 11px; font-weight: 700">Photo</span>
        </span>
        <span style="font-size: 14px; line-height: 1.45">The brass looks brown. Take it again in daylight.</span>
      </div>
    </div>

    <!-- the old photo and why -->
    <div style="display: flex; gap: 12px; padding: 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6E3DD">
      <span role="img" aria-label="The old photo, too dark" style="width: 96px; height: 96px; flex: none; border-radius: 12px; background: radial-gradient(circle at 50% 45%, #4A3A22 0%, #241C12 60%, #120E09 100%)"></span>
      <div style="display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0">
        <span style="font-size: 13px; font-weight: 700">Light</span>
        <span style="height: 6px; border-radius: 3px; background: #EFECE6; position: relative; display: block">
          <span style="position: absolute; top: -3px; left: 30%; width: 2px; height: 12px; background: #1C2233"></span>
          <span style="display: block; width: 22%; height: 6px; border-radius: 3px; background: #95530C"></span>
        </span>
        <span style="font-size: 12px; color: #5F6980">Below the pass mark. Stand by the door or a window.</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5F6980">
      <span>When the new photo passes, it goes back to Ruth with one tap.</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E6E3DD; box-shadow: 0 -8px 24px rgba(22,32,60,.08); padding: 12px 16px 18px">
    <a href="PhotoGate.dc.html" style="display: block; text-align: center; padding: 15px 10px; border-radius: 14px; background: #C93A30; color: #FFFFFF; font-size: 15px; font-weight: 700">Retake photo</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
