<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing · Their price</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* figures in the mono face everywhere, words in Figtree: digits come from Plex Mono */
@font-face{font-family:'OW Figures';font-weight:400;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:500;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:600 700;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3vAOwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
.nm{font-family:Figtree,system-ui,sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#6B7480}
/* rule 10: a drawn size is not the hit area. Every control reaches at least 44 x 44 */
:where(a,button,[role=radio],[role=tab],[role=switch]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative!important}
:where(a,button,[role=radio],[role=tab],[role=switch])::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes owPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.6)}70%{box-shadow:0 0 0 6px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
@keyframes owRingA{0%,100%{box-shadow:0 0 0 3px #19223F,0 0 0 5px rgba(245,178,107,.95)}50%{box-shadow:0 0 0 3px #19223F,0 0 0 8px rgba(245,178,107,.25)}}
@keyframes owUndoRun{to{stroke-dashoffset:62.8}}
@keyframes owGone{to{opacity:0;visibility:hidden}}
@keyframes owChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: 'OW Figures', Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="flex: none; background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 30px 30px; padding: 10px 16px 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="Visit.dc.html" aria-label="Back to the visit" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: rgba(255,255,255,.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="flex: 1; min-width: 0; text-align: center; font-size: 13px; font-weight: 700; color: #B3BCD2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Their price</span>
      <span style="width: 44px; height: 44px; flex: none"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 52px; height: 52px; flex: none; border-radius: 999px; background: #E4E6FA; color: #3A3F9B; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">OP</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span class="nm" style="font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2">PPR pipe 25mm × 4m</span><span style="font-size: 12px; font-weight: 600; color: #B3BCD2">Owino Plumbing · our first price for it</span></span>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: center; gap: 10px; padding: 4px 0 2px">
      <span class="m" style="font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -.03em">{{shown}}</span><span style="font-size: 14px; font-weight: 600; color: #B3BCD2">{{unitWord}}</span>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 0 4px; font-size: 13px; font-weight: 700; color: #5F6980">Do they have it?</span>
    <div role="radiogroup" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 14px; background: #F1EEE8"><sc-for list="{{haves}}" as="h" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{h.on}}" onClick="{{h.pick}}" style="{{h.style}}">{{h.label}}</button></sc-for></div>
    <sc-if value="{{has}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">Sold by</span>
    <div role="radiogroup" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 14px; background: #F1EEE8"><sc-for list="{{units}}" as="u" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{u.on}}" onClick="{{u.pick}}" style="{{u.style}}">{{u.label}}</button></sc-for></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <button type="button" aria-label="{{k.aria}}" onClick="{{k.press}}" style="all: unset; cursor: pointer; height: 48px; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E6E3DD; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{k.isText}}" hint-placeholder-val="{{ true }}">{{k.label}}</sc-if>
          <sc-if value="{{k.isBack}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7zM13 10l4 4M17 10l-4 4"></path></svg></sc-if>
        </button>
      </sc-for>
    </div>
    <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">Cheaper when you buy more</span>
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 6px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 10px">
          <span style="flex: 1; font-size: 13px; font-weight: 600; color: #5F6980"><span class="m" style="color: #1C2233">{{s.from}}</span> or more</span>
          <span style="width: 70px; height: 6px; border-radius: 3px; background: #EFECE6; display: block"><span style="display: block; height: 6px; border-radius: 3px; background: #3A3F9B; {{s.w}}"></span></span>
          <span class="m" style="width: 70px; text-align: right; font-size: 15px; font-weight: 600">{{s.price}}</span>
        </div>
      </sc-for>
      <button type="button" onClick="{{addStep}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 10px; color: #3A3F9B; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a step</button>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 8px 4px 0"><span style="font-size: 13px; font-weight: 700; color: #5F6980">Delivers in</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">optional</span></div>
    <div style="display: flex; gap: 6px"><sc-for list="{{lead}}" as="l" hint-placeholder-count="3"><button type="button" aria-pressed="{{l.on}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button></sc-for></div>
    </div>
    </sc-if>
    <sc-if value="{{hasNot}}" hint-placeholder-val="{{ false }}">
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 6px; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 0 10px; border-radius: 16px"><span style="width: 42px; height: 42px; flex: none; border-radius: 13px; background: #F1EEE8; color: #5F6980; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span class="nm" style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Owino Plumbing doesn’t sell it</span><span style="font-size: 12px; font-weight: 600; color: #5F6980; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nobody asks them again for 90 days</span></span></div>
    </div>
    </sc-if>
  </div>
  <div style="flex: none; padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 8px">
    <sc-if value="{{notSaved}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{save}}" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; height: 58px; border-radius: 999px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; {{ctaStyle}}">{{cta}}</button>
    </sc-if>
    <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; border-radius: 16px; background: #16203C; color: #FFFFFF; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FDCB0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg><span style="flex: 1">{{savedWord}}</span><button type="button" onClick="{{undo}}" style="all: unset; cursor: pointer; padding: 6px 8px; color: #6FDCB0; font-weight: 700">Undo</button></div>
      <a href="Visit.dc.html" style="height: 58px; border-radius: 999px; background: #FFFFFF; color: #16203C; box-shadow: inset 0 0 0 1.5px #E6E3DD; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Back to the visit</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { has: null, unit: null, lead: null, extra: false, v: '', saved: false }; }
  renderVals() {
    const { has, unit, lead, extra, v, saved } = this.state;
    const n = Number(v || 0), fmt = (x) => x.toLocaleString('en-US');
    const seg = (on) => 'all:unset;cursor:pointer;box-sizing:border-box;height:40px;border-radius:11px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;' + (on ? 'background:#FFFFFF;color:#1C2233;box-shadow:0 1px 3px rgba(22,32,60,.12)' : 'color:#5F6980');
    const chip = (on) => 'all:unset;cursor:pointer;box-sizing:border-box;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;display:flex;align-items:center;' + (on ? 'background:#16203C;color:#FFFFFF' : 'background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #E6E3DD');
    const haves = [[true, 'They have it'], [false, 'They don’t']].map(([k, label]) => ({ label, on: String(has === k), pick: () => this.setState({ has: k }), style: seg(has === k) }));
    const units = ['a length', 'a bundle of 10'].map(label => ({ label, on: String(unit === label), pick: () => this.setState({ unit: label }), style: seg(unit === label) }));
    const leadOpts = ['Same day', '2 d', '7 d'].map(label => ({ label, on: String(lead === label), pick: () => this.setState({ lead: lead === label ? null : label }), style: chip(lead === label) }));
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '000', '0', 'back'].map(label => ({
      label, isText: label !== 'back', isBack: label === 'back', aria: label === 'back' ? 'Delete a digit' : label,
      press: () => this.setState({ v: label === 'back' ? v.slice(0, -1) : (v + label).replace(/^0+/, '').slice(0, 9) })
    }));
    const raw = [{ from: '1', p: n }, { from: '10', p: 13800 }].concat(extra ? [{ from: '50', p: 13200 }] : []);
    const top = Math.max(...raw.map(s => s.p), 1);
    const steps = raw.map(s => ({ from: s.from, price: fmt(s.p), w: 'width:' + Math.round(s.p / top * 100) + '%' }));
    const ready = has === false || (has === true && n > 0 && !!unit);
    const cta = has === null ? 'Do they have it?' : has === false ? 'Save: they don’t sell it' : !n ? 'Type their price' : !unit ? 'Pick how they sell it' : 'Save ' + fmt(n) + ' ' + unit;
    return {
      haves, units, lead: leadOpts, steps, keys, has: has === true, hasNot: has === false,
      shown: n ? fmt(n) : '0', unitWord: unit || '',
      addStep: () => this.setState({ extra: true }),
      saved, notSaved: !saved, cta,
      ctaStyle: ready ? 'background:#C93A30;color:#FFFFFF;box-shadow:0 10px 22px rgba(201,58,48,.26)' : 'background:#F3D3CF;color:#8E2A22',
      save: () => { if (ready) this.setState({ saved: true }); },
      undo: () => this.setState({ saved: false }),
      savedWord: has ? 'Saved · ' + fmt(n) + ' ' + (unit || '') : 'Saved · Owino doesn’t sell it'
    };
  }
}
</script>
</body>
</html>
