<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Sort the asks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F5F2}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #F7F5F2; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="background: #16203C; color: #FFFFFF; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Main.dc.html" aria-label="Back to Today" style="width: 44px; height: 44px; border-radius: 999px; background: #243052; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="font-size: 20px; font-weight: 700; flex: 1">New asks</span>
      <span class="m" style="font-size: 14px; color: #B3BCD2">{{left}} left</span>
    </div>
    <div style="display: flex; gap: 4px" aria-label="{{left}} of 3 still to sort">
      <sc-for list="{{pips}}" as="p" hint-placeholder-count="3"><i style="flex: 1; height: 6px; border-radius: 3px; {{p}}"></i></sc-for>
    </div>
  </div>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{asks}}" as="a" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid #E6E3DD; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; {{a.tag}}">{{a.kind}}</span>
          <span style="font-size: 12px; color: #5F6980; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{a.from}}</span>
          <span style="font-size: 12px; color: #5F6980">{{a.when}}</span>
        </div>
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px">
          <span style="font-size: 16px; font-weight: 700; line-height: 1.25">{{a.what}}</span>
          <span class="m" style="font-size: 15px; font-weight: 600; white-space: nowrap">{{a.qty}}</span>
        </div>
        <sc-if value="{{a.hasHint}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #E4F4EA; color: #0F6B43; font-size: 13px; font-weight: 600">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path></svg>
            <span style="flex: 1">{{a.hint}}</span>
          </div>
        </sc-if>
        <sc-if value="{{a.open}}" hint-placeholder-val="{{ true }}">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <button type="button" onClick="{{a.aside}}" style="all: unset; cursor: pointer; text-align: center; padding: 12px; border-radius: 12px; background: #F1EEE8; font-size: 14px; font-weight: 700">{{a.asideLabel}}</button>
            <button type="button" onClick="{{a.go}}" style="all: unset; cursor: pointer; text-align: center; padding: 12px; border-radius: 12px; background: #16203C; color: #FFFFFF; font-size: 14px; font-weight: 700">{{a.goLabel}}</button>
          </div>
        </sc-if>
        <sc-if value="{{a.done}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; {{a.doneStyle}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            <span style="flex: 1">{{a.result}}</span>
            <button type="button" onClick="{{a.undo}}" style="all: unset; cursor: pointer; font-size: 13px; font-weight: 700; text-decoration: underline">Undo</button>
          </div>
        </sc-if>
      </div>
    </sc-for>

    <a href="Funnel.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 14px; border: 1px solid #E6E3DD; background: #FFFFFF; font-size: 14px; font-weight: 700">See all <span class="m">9</span> in Wanted</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { res: {} }; }
  renderVals() {
    const res = this.state.res;
    const set = (id, v) => () => this.setState({ res: { ...res, [id]: v } });
    const base = [
      { id: 'a', kind: 'Ask', tag: 'background:#FDE8E4;color:#A82D24', from: 'Grace Akello for Kato Construction', when: '10:42',
        what: 'Door closer, medium', qty: '× 6', asideLabel: 'Set aside', goLabel: 'Hunt it',
        out: { hunt: 'Hunting — in the Funnel', aside: 'Set aside — Grace is told' } },
      { id: 'b', kind: 'Agent', tag: 'background:#FDE8E4;color:#A82D24', from: 'Peter Sserwadda, agent', when: '09:15',
        what: 'Shower mixer, chrome', qty: '× 4', asideLabel: 'Set aside', goLabel: 'Hunt it',
        out: { hunt: 'Hunting — Peter is told', aside: 'Set aside — Peter is told' } },
      { id: 'c', kind: 'Search', tag: 'background:#F1EEE8;color:#5F6980', from: '5 searches · 3 named people', when: 'this week',
        what: '"pvc glue"', qty: '', hint: 'We sell Solvent cement 500ml. Teach it this name?', asideLabel: 'Set the words aside', goLabel: 'Teach the name',
        out: { hunt: 'Taught — "pvc glue" now finds Solvent cement 500ml', aside: 'Set aside — these words stop showing' } }
    ];
    const asks = base.map(a => {
      const r = res[a.id];
      return {
        ...a, hasHint: !!a.hint, open: !r, done: !!r,
        result: r ? a.out[r] : '',
        doneStyle: r === 'hunt' ? 'background:#E4F4EA;color:#0F6B43' : 'background:#F1EEE8;color:#5F6980',
        go: set(a.id, 'hunt'), aside: set(a.id, 'aside'), undo: set(a.id, undefined)
      };
    });
    const left = asks.filter(a => a.open).length;
    const pips = asks.map(a => a.open ? 'background:#2A3350' : 'background:#6FDCB0');
    return { asks, left, pips };
  }
}
</script>
</body>
</html>
