<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing · Today’s walk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* figures in the mono face everywhere, words in Figtree: digits come from Plex Mono */
@font-face{font-family:'OW Figures';font-weight:400;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:500;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:600 700;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3vAOwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
.nm{font-family:Figtree,system-ui,sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#6B7480}
/* rule 10: a drawn size is not the hit area. Every control reaches at least 44 x 44 */
:where(a,button,[role=radio],[role=tab],[role=switch]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative!important}
:where(a,button,[role=radio],[role=tab],[role=switch])::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes owPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.6)}70%{box-shadow:0 0 0 6px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
@keyframes owRingA{0%,100%{box-shadow:0 0 0 3px #19223F,0 0 0 5px rgba(245,178,107,.95)}50%{box-shadow:0 0 0 3px #19223F,0 0 0 8px rgba(245,178,107,.25)}}
@keyframes owUndoRun{to{stroke-dashoffset:62.8}}
@keyframes owGone{to{opacity:0;visibility:hidden}}
@keyframes owChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: 'OW Figures', Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="flex: none; background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 30px 30px; padding: 10px 16px 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="Main.dc.html" aria-label="Back to Today" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: rgba(255,255,255,.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="flex: 1; min-width: 0; text-align: center; font-size: 13px; font-weight: 700; color: #B3BCD2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Today’s walk</span>
      <span style="width: 44px; height: 44px; flex: none"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="display: flex; align-items: baseline; gap: 8px"><span class="m" style="font-size: 40px; font-weight: 600; line-height: 1">{{doneN}}</span><span class="m" style="font-size: 18px; font-weight: 600; color: #B3BCD2">/ 16</span><span style="font-size: 14px; font-weight: 600; color: #B3BCD2">things done on today’s walk</span></span>
      <span style="display: block; height: 8px; border-radius: 999px; background: rgba(255,255,255,.14)"><span style="display: block; height: 8px; border-radius: 999px; background: #6FDCB0; {{doneBar}}"></span></span>
    </div>
    <div role="img" aria-label="{{routeAria}}" style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <span style="position: absolute; top: 21px; left: 16.7%; width: 33.3%; height: 2px; background: rgba(255,255,255,.3)"></span>
      <span style="position: absolute; top: 21px; left: 50%; width: 33.3%; height: 0; border-top: 2px dashed rgba(255,255,255,.3)"></span>
      <sc-for list="{{route}}" as="r" hint-placeholder-count="3">
        <span style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
          <span style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; {{r.dot}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 1px"><span class="nm" style="font-size: 13px; font-weight: 700">{{r.short}}</span><span style="font-size: 11px; font-weight: 600; {{r.ink}}">{{r.word}}</span></span>
        </span>
      </sc-for>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{areas}}" as="ar" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 8px 4px 0"><span style="font-size: 13px; font-weight: 700; color: #5F6980">{{ar.name}}</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">{{ar.sub}}</span></div>
        <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 0 6px">
        <sc-for list="{{ar.stops}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 0 10px; border-top: {{s.rule}}">
          <a href="{{s.href}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px">
            <span class="m" style="width: 42px; height: 42px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; {{s.well}}">{{s.n}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
              <span class="nm" style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
              <span style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap"><sc-for list="{{s.tags}}" as="t" hint-placeholder-count="2"><span style="height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; {{t.style}}">{{t.label}}</span></sc-for></span>
            </span>
          </a>
          <button type="button" role="checkbox" aria-checked="{{s.on}}" aria-label="{{s.doneAria}}" onClick="{{s.toggle}}" style="all: unset; cursor: pointer; width: 32px; height: 32px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; {{s.box}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></button>
        </div>
        </sc-for>
        </div>
      </div>
    </sc-for>
    <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">Off the walk</span>
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 6px; display: flex; flex-direction: column; gap: 2px">
      <a href="AskConfirm.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 0 10px; border-radius: 16px"><span style="width: 42px; height: 42px; flex: none; border-radius: 13px; background: #E4E6FA; color: #3A3F9B; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10v18H7zM11 18h2"></path></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span class="nm" style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Kiseka Steel · 5 old prices</span><span style="font-size: 12px; font-weight: 600; color: #5F6980; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Visited 2 days ago · ask in their app, no trip</span></span><span style="flex: none; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7480" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></span></a>
    </div>
  </div>
  <div style="flex: none; padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 8px">
    <a href="{{goHref}}" style="height: 58px; border-radius: 999px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; {{goStyle}}">{{goLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { done: {} }; }
  renderVals() {
    const D = this.state.done;
    const SUP = 'background:#E4E6FA;color:#3A3F9B', RIV = 'background:#F6E4F1;color:#7A3268', OK = 'background:#E4F4EA;color:#0F6B43', NEUT = 'background:#F1EEE8;color:#1C2233';
    // ordered by area, then by jobs: downtown first, Nateete last. Kiseka is off today's walk: asked in its app instead
    const stops = [
      { id: 'o', n: 1, area: 'Kikuubo and Owino', name: 'Owino Plumbing', kind: 'sup', jobs: 7, href: 'Visit.dc.html', tags: [['3 prices to check', NEUT], ['1 item to ask for', NEUT], ['1 offer to answer', SUP], ['2 photos', NEUT]] },
      { id: 'k', n: 2, area: 'Kikuubo and Owino', name: 'Kikuubo Hardware Mart', kind: 'riv', jobs: 5, href: 'RivalRun.dc.html', tags: [['5 prices to check', RIV], ['3 are top sellers', NEUT]] },
      { id: 'n', n: 3, area: 'Nateete', name: 'Nateete Builders’ Centre', kind: 'riv', jobs: 4, href: 'RivalRun.dc.html', tags: [['4 prices to check', RIV], ['wire mesh among them', NEUT]] }
    ].map(s => {
      const on = !!D[s.id];
      return { ...s, on: String(on), doneAria: 'Mark ' + s.name + ' done', well: on ? OK : (s.kind === 'sup' ? SUP : RIV),
        tags: on ? [{ label: 'done', style: OK }] : s.tags.map(([label, style]) => ({ label, style })),
        box: on ? 'background:#0F6B43;color:#FFFFFF' : 'background:#FFFFFF;color:transparent;box-shadow:inset 0 0 0 1.5px #C9C4BA',
        toggle: () => this.setState({ done: { ...D, [s.id]: !D[s.id] } }) };
    });
    const jobs = (l) => l.filter(s => s.on !== 'true').reduce((t, s) => t + s.jobs, 0);
    const areas = ['Kikuubo and Owino', 'Nateete'].map(name => {
      const l = stops.filter(s => s.area === name).map((s, i) => ({ ...s, rule: i ? '1px solid #EFECE6' : 'none' }));
      return { name, stops: l, sub: l.length + (l.length === 1 ? ' stop' : ' stops') + ' · ' + jobs(l) + ' things left' };
    });
    const SHORT = { o: 'Owino', k: 'Kikuubo', n: 'Nateete' };
    const ICON = { sup: 'M3 21V9l9-5 9 5v12M8 21v-7h8v7', riv: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' };
    const firstOpen = stops.find(s => s.on !== 'true');
    const route = stops.map(s => {
      const done = s.on === 'true', next = firstOpen && s.id === firstOpen.id;
      return { short: SHORT[s.id], icon: done ? 'M5 12.5l4.5 4.5L19 7.5' : ICON[s.kind],
        word: done ? 'done' : (next ? 'start · ' : '') + s.jobs + (s.kind === 'sup' ? ' · our supplier' : ' · a rival'),
        ink: done ? 'color:#6FDCB0' : next ? 'color:#F5B26B' : 'color:#B3BCD2',
        dot: done ? 'background:#6FDCB0;color:#16203C' : (s.kind === 'sup' ? 'background:#E4E6FA;color:#3A3F9B' : 'background:#F6E4F1;color:#7A3268') + (next ? ';box-shadow:0 0 0 3px #19223F,0 0 0 5px #F5B26B' : '') };
    });
    const next = stops.find(s => s.on !== 'true');
    return {
      areas, route, jobsLeft: jobs(stops), doneN: 16 - jobs(stops), doneBar: 'width:' + ((16 - jobs(stops)) / 16 * 100).toFixed(1) + '%', routeAria: stops.map(s => s.n + ' ' + s.name + (s.on === 'true' ? ', done' : '')).join('; '),
      goHref: next ? next.href : 'Main.dc.html', goLabel: next ? (Object.values(D).some(Boolean) ? 'Next: ' : 'Start at ') + next.name : 'Walk finished · back to Today',
      goStyle: next ? 'background:#C93A30;color:#FFFFFF;box-shadow:0 10px 22px rgba(201,58,48,.26)' : 'background:#E4F4EA;color:#0F6B43'
    };
  }
}
</script>
</body>
</html>
