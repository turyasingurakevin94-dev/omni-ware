<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Today's walk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F5F2}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="background: #16203C; color: #FFFFFF; border-radius: 0 0 28px 28px; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Main.dc.html" aria-label="Back to Today" style="width: 44px; height: 44px; border-radius: 999px; background: #243052; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #B3BCD2">Today's walk</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px">
      <span class="m" style="font-size: 28px; font-weight: 600; line-height: 1">{{jobsLeft}}</span>
      <span style="font-size: 15px; color: #B3BCD2">jobs left · <span class="m" style="color: #FFFFFF">4</span> stops · <span class="m" style="color: #FFFFFF">2</span> areas</span>
    </div>

    <!-- the route: one dot per stop, joined -->
    <div role="img" aria-label="{{routeAria}}" style="display: flex; align-items: center">
      <sc-for list="{{route}}" as="r" hint-placeholder-count="4">
        <span style="display: flex; align-items: center; flex: 1">
          <span style="flex: none; width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; {{r.dot}}">{{r.n}}</span>
          <sc-if value="{{r.join}}" hint-placeholder-val="{{ true }}"><span style="flex: 1; height: 3px; margin: 0 4px; border-radius: 2px; {{r.line}}"></span></sc-if>
        </span>
      </sc-for>
    </div>
    <div style="display: flex; gap: 14px; font-size: 12px; color: #B3BCD2">
      <span style="display: flex; align-items: center; gap: 6px"><i style="width: 10px; height: 10px; border-radius: 999px; background: #A9AEF0; display: inline-block"></i>supplier</span>
      <span style="display: flex; align-items: center; gap: 6px"><i style="width: 10px; height: 10px; border-radius: 999px; background: #E7A6D6; display: inline-block"></i>rival shop</span>
      <span style="display: flex; align-items: center; gap: 6px"><i style="width: 10px; height: 10px; border-radius: 999px; background: #6FDCB0; display: inline-block"></i>done</span>
    </div>
  </div>

  <div style="padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{areas}}" as="ar" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <span style="font-size: 16px; font-weight: 700">{{ar.name}}</span>
          <span style="font-size: 12px; color: #5F6980">{{ar.sub}}</span>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #E6E3DD; border-radius: 16px; overflow: hidden">
          <sc-for list="{{ar.stops}}" as="s" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EFECE6">
              <a href="{{s.href}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px">
                <span class="m" style="width: 36px; height: 36px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; {{s.well}}">{{s.n}}</span>
                <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1">
                  <span style="font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.name}}</span>
                  <span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
                    <sc-for list="{{s.tags}}" as="t" hint-placeholder-count="2"><span style="padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; {{t.style}}">{{t.label}}</span></sc-for>
                  </span>
                </span>
              </a>
              <button type="button" role="checkbox" aria-checked="{{s.on}}" aria-label="{{s.doneAria}}" onClick="{{s.toggle}}" style="all: unset; cursor: pointer; width: 32px; height: 32px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; {{s.box}}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <!-- off the walk: ask in the app instead -->
    <a href="AskConfirm.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #E4E6FA; color: #3A3F9B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"></rect><path d="M11 18h2"></path></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 14px; font-weight: 700; color: #1C2233">Kiseka Steel has <span class="m">5</span> old prices</span>
        <span style="font-size: 12px">ask them in the supplier app, not at the counter</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E6E3DD; box-shadow: 0 -8px 24px rgba(22,32,60,.08); padding: 12px 16px 18px">
    <a href="{{goHref}}" style="display: block; text-align: center; padding: 15px 10px; border-radius: 14px; font-size: 15px; font-weight: 700; {{goStyle}}">{{goLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { done: {} }; }
  renderVals() {
    const D = this.state.done;
    const SUP = 'background:#E4E6FA;color:#3A3F9B', RIV = 'background:#F6E4F1;color:#7A3268', OK = 'background:#E4F4EA;color:#0F6B43';
    const NEUT = 'background:#F1EEE8;color:#1C2233';
    // ordered by area, then by jobs: the downtown pair first, Nateete last
    const stops = [
      { id: 'o', n: 1, area: 'Kikuubo and Owino', name: 'Owino Plumbing', kind: 'sup', jobs: 7, href: 'Visit.dc.html',
        tags: [['3 prices', NEUT], ['1 wanted', NEUT], ['1 proposal', SUP], ['2 photos', NEUT]] },
      { id: 'k', n: 2, area: 'Kikuubo and Owino', name: 'Kikuubo Hardware Mart', kind: 'riv', jobs: 5, href: 'RivalRun.dc.html',
        tags: [['5 to check', RIV], ['3 are top sellers', NEUT]] },
      { id: 's', n: 3, area: 'Kikuubo and Owino', name: 'Kiseka Steel', kind: 'sup', jobs: 3, href: 'SupplierKiseka.dc.html',
        tags: [['2 wanted', NEUT], ['1 photo', NEUT]] },
      { id: 'n', n: 4, area: 'Nateete', name: 'Nateete Builders’ Centre', kind: 'riv', jobs: 4, href: 'RivalRun.dc.html',
        tags: [['4 to check', RIV], ['wire mesh among them', NEUT]] }
    ].map(s => {
      const on = !!D[s.id];
      return {
        ...s, on: String(on), doneAria: 'Mark ' + s.name + ' done',
        well: on ? OK : (s.kind === 'sup' ? SUP : RIV),
        tags: on ? [{ label: 'done', style: OK }] : s.tags.map(([label, style]) => ({ label, style })),
        box: on ? 'background:#0F6B43;color:#FFFFFF' : 'background:#FFFFFF;color:transparent;box-shadow:inset 0 0 0 1.5px #C9C4BA',
        toggle: () => this.setState({ done: { ...D, [s.id]: !D[s.id] } })
      };
    });
    const areaOf = (name) => stops.filter(s => s.area === name);
    const jobs = (list) => list.filter(s => s.on !== 'true').reduce((t, s) => t + s.jobs, 0);
    const areas = ['Kikuubo and Owino', 'Nateete'].map(name => {
      const list = areaOf(name);
      return { name, stops: list, sub: list.length + (list.length === 1 ? ' stop' : ' stops') + ' · ' + jobs(list) + ' jobs left' };
    });
    const route = stops.map((s, i) => ({
      n: s.n, join: i < stops.length - 1,
      dot: s.on === 'true' ? 'background:#6FDCB0;color:#16203C' : s.kind === 'sup' ? 'background:#A9AEF0;color:#16203C' : 'background:#E7A6D6;color:#16203C',
      line: i === 2 ? 'background:transparent;border-top:3px dashed #2A3350;height:0' : (s.on === 'true' ? 'background:#6FDCB0' : 'background:#2A3350')
    }));
    const next = stops.find(s => s.on !== 'true');
    return {
      areas, route, jobsLeft: jobs(stops),
      routeAria: stops.map(s => s.n + ' ' + s.name + (s.on === 'true' ? ', done' : '')).join('; '),
      goHref: next ? next.href : 'Main.dc.html',
      goLabel: next ? 'Start at ' + next.name : 'Walk finished · back to Today',
      goStyle: next ? 'background:#C93A30;color:#FFFFFF' : 'background:#E4F4EA;color:#0F6B43'
    };
  }
}
</script>
</body>
</html>
