<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#2A3350}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #8A90A0; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <!-- dimmed Today behind -->
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 300px; background: #16203C; border-radius: 0 0 28px 28px; opacity: .55"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 26px 26px 0 0; padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #E0DCD4"></span>
    <span style="font-size: 20px; font-weight: 700">What did you find?</span>

    <!-- where am I -->
    <a href="Visit.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #16203C; color: #FFFFFF">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #243052; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
        <span style="font-size: 15px; font-weight: 700">At a supplier? Start a visit</span>
        <span style="font-size: 12px; color: #B3BCD2">Every job for that shop on one list</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
        <a href="{{k.href}}" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; min-height: 112px; {{k.tile}}">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.icon}}"></path></svg></span>
          <span style="font-size: 15px; font-weight: 700">{{k.label}}</span>
          <span style="font-size: 12px; font-weight: 600; opacity: .85">{{k.sub}}</span>
        </a>
      </sc-for>
    </div>

    <a href="Funnel.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 1px solid #E6E3DD">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A82D24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"></path></svg>
      <span style="flex: 1; font-size: 15px; font-weight: 700">Someone asked for an item</span>
      <span style="font-size: 12px; color: #5F6980">joins its hunt</span>
    </a>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5F6980">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      <span>No signal? It saves on the phone and sends itself later.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const kinds = [
      { label: 'Supplier price', sub: 'price, tiers, packing', href: 'Visit.dc.html', tile: 'background:#E4E6FA;color:#3A3F9B',
        icon: 'M3 12V4h8l10 10-8 8zM7.5 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z' },
      { label: 'Rival price', sub: 'what a rival charges', href: 'QuickPrice.dc.html', tile: 'background:#F6E4F1;color:#7A3268',
        icon: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' },
      { label: 'New item seen', sub: 'starts a hunt', href: 'Passport.dc.html', tile: 'background:#E4F4EA;color:#0F6B43',
        icon: 'M12 3l2.6 5.6 6 .6-4.5 4 1.3 6L12 16.2 6.6 19.2l1.3-6-4.5-4 6-.6z' },
      { label: 'Photo', sub: 'for an item that needs one', href: 'PhotoGate.dc.html', tile: 'background:#DCEAF8;color:#1A5A8A',
        icon: 'M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z' }
    ];
    return { kinds };
  }
}
</script>
</body>
</html>
