<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing · Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* figures in the mono face everywhere, words in Figtree: digits come from Plex Mono */
@font-face{font-family:'OW Figures';font-weight:400;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:500;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:600 700;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3vAOwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
.nm{font-family:Figtree,system-ui,sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#6B7480}
/* rule 10: a drawn size is not the hit area. Every control reaches at least 44 x 44 */
:where(a,button,[role=radio],[role=tab],[role=switch]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative!important}
:where(a,button,[role=radio],[role=tab],[role=switch])::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes owPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.6)}70%{box-shadow:0 0 0 6px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
@keyframes owRingA{0%,100%{box-shadow:0 0 0 3px #19223F,0 0 0 5px rgba(245,178,107,.95)}50%{box-shadow:0 0 0 3px #19223F,0 0 0 8px rgba(245,178,107,.25)}}
@keyframes owUndoRun{to{stroke-dashoffset:62.8}}
@keyframes owGone{to{opacity:0;visibility:hidden}}
@keyframes owChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: 'OW Figures', Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 0%, #2B3866 0%, #16203C 60%, #111A33 100%); color: #FFFFFF; display: flex; flex-direction: column; padding: 56px 24px 26px; box-sizing: border-box">
    <div style="display: flex; flex-direction: column; gap: 18px">
      <span style="width: 64px; height: 64px; border-radius: 20px; background: #C93A30; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 26px rgba(201,58,48,.4)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #6FDCB0">Omni-Ware · Sourcing</span><span style="font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15">Find it, price it,<br>put it on sale</span></span>
    </div>
    <div style="flex: 1"></div>
    <div style="display: flex; flex-direction: column; gap: 14px">
      <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #B3BCD2">Email</span><span style="display: flex; align-items: center; gap: 8px; height: 54px; padding: 0 6px 0 16px; border-radius: 16px; background: rgba(255,255,255,.08); box-shadow: {{fieldRing}}"><input value="moses@mukasahardware.co.ug" type="email" autocomplete="username" aria-label="Email" style="flex: 1; min-width: 0; height: 44px; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; font-weight: 600; color: #FFFFFF"></span></label>
      <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #B3BCD2">Password</span><span style="display: flex; align-items: center; gap: 8px; height: 54px; padding: 0 6px 0 16px; border-radius: 16px; background: rgba(255,255,255,.08); box-shadow: {{fieldRing}}"><input value="{{pwVal}}" type="{{pwType}}" autocomplete="current-password" aria-label="Password" style="flex: 1; min-width: 0; height: 44px; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; font-weight: 600; color: #FFFFFF"><button type="button" onClick="{{toggleShow}}" aria-label="{{showAria}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 12px; color: #B3BCD2; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg></button></span></label>
      <sc-if value="{{hasMsg}}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 16px; {{msgStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{msgIcon}}"></path></svg><span style="flex: 1; font-size: 13px; font-weight: 700">{{msg}}</span></div></sc-if>
      <button type="button" onClick="{{forgot}}" style="all: unset; cursor: pointer; align-self: flex-end; height: 32px; padding: 0 4px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #B3BCD2">Forgot password?</button>
    </div>
    <div style="height: 18px"></div>
    <sc-if value="{{first}}" hint-placeholder-val="{ true }"><button type="button" onClick="{{go}}" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; height: 58px; border-radius: 999px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; {{goStyle}}">Sign in</button></sc-if>
    <sc-if value="{{again}}" hint-placeholder-val="{ false }"><a href="Welcome.dc.html" style="box-sizing: border-box; width: 100%; height: 58px; border-radius: 999px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; {{goStyle}}">Sign in</a></sc-if>
    <span style="margin-top: 14px; text-align: center; font-size: 12px; font-weight: 600; color: #B3BCD2">No account? Ask Joseph to add you as Sourcing</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'form', show: false }; }
  renderVals() {
    const S = this.state, m = S.mode;
    const MSG = {
      wrong: ['That email and password don’t match · try again, or reset it', 'background:rgba(245,178,107,.14);color:#F5B26B', 'M12 8v5M12 16.5h.01M12 3 2.5 20h19z'],
      sent: ['A reset link is on its way to moses@…co.ug', 'background:rgba(111,220,176,.14);color:#6FDCB0', 'M4 6h16v12H4zM4 7l8 6 8-6']
    }[m];
    return {
      hasMsg: !!MSG, msg: MSG ? MSG[0] : '', msgStyle: MSG ? MSG[1] : '', msgIcon: MSG ? MSG[2] : '',
      fieldRing: m === 'wrong' ? 'inset 0 0 0 1.5px #F5B26B' : 'inset 0 0 0 1px rgba(255,255,255,.14)',
      pwVal: 'kiseka-118', pwType: S.show ? 'text' : 'password', showAria: S.show ? 'Hide the password' : 'Show the password',
      toggleShow: () => this.setState({ show: !S.show }),
      forgot: () => this.setState({ mode: 'sent' }),
      go: () => this.setState({ mode: 'wrong' }), first: m === 'form', again: m !== 'form',
      goStyle: 'background:#C93A30;color:#FFFFFF;box-shadow:0 10px 24px rgba(201,58,48,.35)'
    };
  }
}
</script>
</body>
</html>
