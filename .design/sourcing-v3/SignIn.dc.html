<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* figures in the mono face everywhere, words in Figtree: digits come from Plex Mono */
@font-face{font-family:'OW Figures';font-weight:400;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:500;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:600 700;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3vAOwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
.nm{font-family:Figtree,system-ui,sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#6B7480}
/* rule 10: a drawn size is not the hit area. Every control reaches at least 44 x 44 */
:where(a,button,[role=radio],[role=tab],[role=switch]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative!important}
:where(a,button,[role=radio],[role=tab],[role=switch])::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes owPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.6)}70%{box-shadow:0 0 0 6px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
@keyframes owRingA{0%,100%{box-shadow:0 0 0 3px #19223F,0 0 0 5px rgba(245,178,107,.95)}50%{box-shadow:0 0 0 3px #19223F,0 0 0 8px rgba(245,178,107,.25)}}
@keyframes owUndoRun{to{stroke-dashoffset:62.8}}
@keyframes owGone{to{opacity:0;visibility:hidden}}
@keyframes owChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
@keyframes owFloatA{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-8px) rotate(-6deg)}}@keyframes owFloatB{0%,100%{transform:translateY(0) rotate(5deg)}50%{transform:translateY(-10px) rotate(6deg)}}@keyframes owFloatC{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(-3deg)}}@keyframes owGlow{0%,100%{opacity:.55}50%{opacity:.9}}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: 'OW Figures', Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="position: absolute; inset: 0; background: radial-gradient(90% 55% at 50% 30%, #34447A 0%, #1C2747 55%, #111A33 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
    <div style="position: relative; flex: none; height: 380px"><span aria-hidden="true" style="position: absolute; left: 50%; top: 210px; width: 360px; height: 360px; margin: -180px 0 0 -180px; border-radius: 999px; background: radial-gradient(circle, rgba(111,220,176,.22) 0%, rgba(111,220,176,0) 62%); animation: owGlow 5s ease-in-out infinite"></span><div style="position: absolute; left: 24px; top: 34px; display: flex; align-items: center; gap: 10px"><span style="width: 40px; height: 40px; border-radius: 13px; background: #C93A30; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(201,58,48,.45)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"></path></svg></span><span style="font-size: 14px; font-weight: 700">Omni-Ware <span style="color: #6FDCB0">Sourcing</span></span></div><div aria-hidden="true" style="position: absolute; left: 18px; top: 96px; width: 220px; box-sizing: border-box; padding: 12px 14px; border-radius: 20px; background: #FFFFFF; color: #1C2233; box-shadow: 0 18px 40px rgba(0,0,0,.35); white-space: nowrap; display: flex; align-items: center; gap: 12px; animation: owFloatA 6s ease-in-out infinite"><span style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: conic-gradient(#0F6B43 0 300deg, #EFECE6 300deg 360deg); display: flex; align-items: center; justify-content: center"><span class="m" style="width: 30px; height: 30px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600">5/6</span></span><span style="display: flex; flex-direction: column; gap: 2px"><span class="nm" style="font-size: 13px; font-weight: 700">Wire mesh BRC A142</span><span style="font-size: 11px; font-weight: 600; color: #0F6B43">Ready for Ruth</span></span></div><div aria-hidden="true" style="position: absolute; right: 14px; top: 196px; width: 236px; box-sizing: border-box; padding: 12px 14px; border-radius: 20px; background: #FFFFFF; color: #1C2233; box-shadow: 0 18px 40px rgba(0,0,0,.35); white-space: nowrap; display: flex; align-items: center; gap: 12px; animation: owFloatB 6s ease-in-out infinite"><span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #E4E6FA; color: #3A3F9B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8zM7.5 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span class="m" style="font-size: 17px; font-weight: 600">118,000</span><span style="font-size: 11px; font-weight: 600; color: #5F6980">Kiseka · same price</span></span><span style="margin-left: auto; width: 26px; height: 26px; border-radius: 999px; background: #0F6B43; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span></div><div aria-hidden="true" style="position: absolute; left: 40px; top: 292px; width: 226px; box-sizing: border-box; padding: 12px 14px; border-radius: 20px; background: #26335E; color: #FFFFFF; box-shadow: 0 18px 40px rgba(0,0,0,.35); white-space: nowrap; display: flex; align-items: center; gap: 12px; animation: owFloatC 6s ease-in-out infinite"><span style="display: flex"><span style="width: 30px; height: 30px; border-radius: 999px; background: #DCEAF8; color: #1A5A8A; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #1C2747">GA</span><span style="width: 30px; height: 30px; margin-left: -8px; border-radius: 999px; background: #F6E4F1; color: #7A3268; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #1C2747">BO</span><span style="width: 30px; height: 30px; margin-left: -8px; border-radius: 999px; background: #DDF1EE; color: #0E5E57; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #1C2747">AN</span></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700">On sale</span><span style="font-size: 11px; font-weight: 600; color: #B3BCD2">3 askers told</span></span><span style="margin-left: auto; width: 8px; height: 8px; border-radius: 999px; background: #6FDCB0; box-shadow: 0 0 0 4px rgba(111,220,176,.2)"></span></div></div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 0 24px 26px">
      <sc-if value="{{back}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="width: 52px; height: 52px; flex: none; border-radius: 999px; background: #DCEAF8; color: #1A5A8A; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #16203C, 0 0 0 5px rgba(111,220,176,.6)">ML</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 24px; font-weight: 700; letter-spacing: -.02em">Welcome back, Moses</span><span style="font-size: 12px; font-weight: 600; color: #B3BCD2">moses@mukasahardware.co.ug</span></span>
        <button type="button" onClick="{{notMe}}" style="all: unset; cursor: pointer; flex: none; height: 32px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.1); font-size: 12px; font-weight: 700; display: flex; align-items: center">Not you?</button>
      </div>
      </sc-if>
      <sc-if value="{{other}}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 26px; font-weight: 700; letter-spacing: -.02em">Sign in to Sourcing</span>
      <label style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 6px 0 16px; border-radius: 16px; background: rgba(255,255,255,.08); box-shadow: {{fieldRing}}"><input value="" placeholder="Your work email" type="email" autocomplete="username" aria-label="Email" style="flex: 1; min-width: 0; height: 44px; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; font-weight: 600; color: #FFFFFF"></label>
      </sc-if>
      <label style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 6px 0 16px; border-radius: 16px; background: rgba(255,255,255,.08); box-shadow: {{fieldRing}}"><input value="{{pwVal}}" type="{{pwType}}" autocomplete="current-password" aria-label="Password" placeholder="Password" style="flex: 1; min-width: 0; height: 44px; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; font-weight: 600; color: #FFFFFF"><button type="button" onClick="{{toggleShow}}" aria-label="{{showAria}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 12px; color: #B3BCD2; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg></button></label>
      <sc-if value="{{hasMsg}}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border-radius: 14px; {{msgStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{msgIcon}}"></path></svg><span style="flex: 1; font-size: 13px; font-weight: 700">{{msg}}</span></div></sc-if>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #B3BCD2"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z"></path></svg>Stays signed in on this phone</span>
        <button type="button" onClick="{{forgot}}" style="all: unset; cursor: pointer; height: 32px; padding: 0 4px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #FFFFFF">Forgot password?</button>
      </div>
      <sc-if value="{{first}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{go}}" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; height: 58px; border-radius: 999px; background: #C93A30; color: #FFFFFF; box-shadow: 0 12px 28px rgba(201,58,48,.45); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Sign in<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button></sc-if>
      <sc-if value="{{again}}" hint-placeholder-val="{{ false }}"><a href="Welcome.dc.html" style="box-sizing: border-box; width: 100%; height: 58px; border-radius: 999px; background: #C93A30; color: #FFFFFF; box-shadow: 0 12px 28px rgba(201,58,48,.45); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Sign in<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a></sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'form', who: 'back', show: false }; }
  renderVals() {
    const S = this.state, m = S.mode;
    const MSG = {
      wrong: ['That password doesn’t match · try again, or reset it', 'background:rgba(245,178,107,.14);color:#F8C994', 'M12 8v5M12 16.5h.01M12 3 2.5 20h19z'],
      sent: ['A reset link is on its way to your email', 'background:rgba(111,220,176,.14);color:#6FDCB0', 'M4 6h16v12H4zM4 7l8 6 8-6']
    }[m];
    return {
      back: S.who === 'back', other: S.who === 'other', notMe: () => this.setState({ who: 'other', mode: 'form' }),
      hasMsg: !!MSG, msg: MSG ? MSG[0] : '', msgStyle: MSG ? MSG[1] : '', msgIcon: MSG ? MSG[2] : '',
      fieldRing: m === 'wrong' ? 'inset 0 0 0 1.5px #F5B26B' : 'inset 0 0 0 1px rgba(255,255,255,.14)',
      pwVal: S.who === 'back' ? 'kiseka-118' : '', pwType: S.show ? 'text' : 'password', showAria: S.show ? 'Hide the password' : 'Show the password',
      toggleShow: () => this.setState({ show: !S.show }),
      forgot: () => this.setState({ mode: 'sent' }),
      go: () => this.setState({ mode: 'wrong' }), first: m === 'form', again: m !== 'form'
    };
  }
}
</script>
</body>
