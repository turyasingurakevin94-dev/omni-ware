<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Market list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,500&amp;family=Caveat:wght@500;700&amp;family=Oswald:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.hw{font-family:Caveat,'Figtree',cursive}
.os{font-family:Oswald,'Figtree',sans-serif}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
input::placeholder{color:#6B7480}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4EFE6; font-family: Figtree, system-ui, sans-serif; color: #1C2233">
  <div style="position: absolute; inset: 0 0 84px 0; overflow-y: auto">
    <div style="background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 32px 32px; padding: 14px 20px 70px; color: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="display: flex; flex-direction: column; gap: 3px"><span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 20px; font-weight: 700">Market list</span><span class="os" style="height: 22px; padding: 0 7px; border-radius: 5px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); font-size: 11px; font-weight: 700; letter-spacing: .14em; display: flex; align-items: center">FIND</span></span><span style="font-size: 12px; font-weight: 600; color: #B3BCD2">{{headSub}}</span></span>
        <span style="display: flex; gap: 8px">
          <button type="button" aria-label="Print the list" onClick="{{print}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"></path></svg></button>
          <button type="button" aria-label="Send the list to WhatsApp" onClick="{{wa}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 3 10.5l7 2.5 2.5 7zM10 13 21 3"></path></svg></button>
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px"><span class="m" style="font-size: 30px; font-weight: 600; line-height: 1">{{doneN}}<span style="font-size: 16px; color: #B3BCD2">{{total}}</span></span><span style="flex: 1; height: 8px; border-radius: 999px; background: rgba(255,255,255,.14); display: block"><span style="display: block; height: 8px; border-radius: 999px; background: #6FDCB0; {{bar}}"></span></span></div>
    </div>
    <div style="margin: -56px 14px 24px; position: relative; border-radius: 4px 4px 10px 10px; background: #FFFDF7; box-shadow: 0 20px 40px rgba(22,32,60,.16), 0 2px 0 #E6DECB; padding: 0 0 22px; overflow: hidden">
      <div aria-hidden="true" style="height: 22px; background: radial-gradient(circle at 50% 11px, #2B3866 0 4.5px, transparent 5px) 0 0 / 22px 22px repeat-x, linear-gradient(#F3EEE2, #FFFDF7)"></div>
      <i aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 42px; width: 1px; background: #E7A3A0"></i>
      <i aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 45px; width: 1px; background: #E7A3A0"></i>
      <div style="position: relative; height: 44px; border-bottom: 1px solid #C9D9EA; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 14px 5px 56px"><span class="hw" style="font-size: 20px; color: #1F4FA0">{{dateLine}}</span></div>
      <sc-for list="{{stops}}" as="s" hint-placeholder-count="3">
        <div style="position: relative; {{s.dim}}">
          <div style="height: 44px; border-bottom: 1px solid #C9D9EA; display: flex; align-items: flex-end; gap: 8px; padding: 0 12px 4px 0">
            <span style="width: 42px; flex: none; display: flex; justify-content: center; padding-bottom: 1px"><span class="hw" style="width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; transform: rotate(-4deg); {{s.dot}}">{{s.n}}</span></span>
            <span style="flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; padding-left: 10px; white-space: nowrap; overflow: hidden"><span class="hw" style="flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 23px; font-weight: 700; line-height: 1.1; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; {{s.nameStyle}}">{{s.name}}</span><span style="flex: 0 100 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 11px; font-weight: 700; {{s.kindInk}}">{{s.kind}}</span></span>
            <span class="hw" style="flex: none; font-size: 20px; font-weight: 700; line-height: 1">{{s.count}}</span>
            <sc-if value="{{s.board}}" hint-placeholder-val="{{ false }}"><a href="BoardPhone.dc.html" style="flex: none; height: 32px; padding: 0 0 0 6px; display: flex; align-items: flex-end; gap: 3px; font-size: 12px; font-weight: 700; color: #7A3268">Board<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a></sc-if>
          </div>
          <sc-if value="{{s.skipped}}" hint-placeholder-val="{{ false }}">
            <div style="height: 44px; border-bottom: 1px solid #C9D9EA; display: flex; align-items: flex-end; gap: 8px; padding: 0 12px 6px 56px"><span class="hw" style="flex: 1; font-size: 20px; color: #95530C">moved to Monday · {{s.left}} lines</span><button type="button" onClick="{{s.unskip}}" style="all: unset; cursor: pointer; flex: none; height: 32px; display: flex; align-items: flex-end; font-size: 13px; font-weight: 700; color: #16203C">Undo</button></div>
          </sc-if>
          <sc-if value="{{s.open}}" hint-placeholder-val="{{ true }}">
            <sc-for list="{{s.lines}}" as="l" hint-placeholder-count="4">
              <div>
                <div style="height: 44px; border-bottom: 1px solid #C9D9EA; display: flex; align-items: flex-end">
                  <span style="width: 42px; flex: none; height: 44px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; box-sizing: border-box">
                    <button type="button" role="checkbox" aria-checked="{{l.on}}" aria-label="{{l.tickAria}}" onClick="{{l.tick}}" style="all: unset; cursor: pointer; position: relative; width: 19px; height: 19px; flex: none; box-sizing: border-box; border: 2px solid #2A2F3A; border-radius: 3px 4px 3px 5px; transform: rotate(-3deg); {{l.box}}"><svg width="28" height="26" viewBox="0 0 28 26" aria-hidden="true" style="position: absolute; left: -3px; top: -11px"><path d="M4 15c2.5 1.8 4.3 4 5.6 6.6C13 13.8 18 7 25 2.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
                  </span>
                  <button type="button" aria-expanded="{{l.isOpen}}" aria-label="{{l.openAria}}" onClick="{{l.toggle}}" style="all: unset; cursor: pointer; flex: 1; min-width: 0; height: 44px; box-sizing: border-box; display: flex; align-items: flex-end; gap: 8px; padding: 0 12px 4px 12px">
                    <span class="hw" style="flex: 1; min-width: 0; font-size: 22px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1C2233; padding-bottom: 1px; {{l.text}}">{{l.label}}</span>
                    <sc-if value="{{l.hasDelta}}" hint-placeholder-val="{{ false }}"><span class="hw" style="flex: none; padding: 0 6px; border-radius: 50%; font-size: 17px; font-weight: 700; line-height: 1.2; transform: rotate(-4deg); {{l.deltaStyle}}">{{l.delta}}</span></sc-if>
                    <span class="hw" style="flex: none; font-size: 22px; line-height: 1; font-weight: 700; padding-bottom: 1px; {{l.rightStyle}}">{{l.right}}</span>
                  </button>
                </div>
                <sc-if value="{{l.isOpen}}" hint-placeholder-val="{{ false }}">
                  <div style="margin: 8px 12px 10px 54px; padding: 10px; border-radius: 4px; background: #FFF7C9; box-shadow: 0 8px 18px rgba(22,32,60,.14); transform: rotate(-.6deg); display: flex; flex-direction: column; gap: 8px">
                    <span style="font-size: 12px; font-weight: 600; color: #5F6980">{{l.lastText}}</span>
                    <sc-if value="{{l.isPrice}}" hint-placeholder-val="{{ false }}">
                      <div style="display: flex; gap: 6px">
                        <input inputmode="numeric" aria-label="{{l.inputAria}}" placeholder="{{l.inputHint}}" value="{{typed}}" onInput="{{typeIt}}" class="m" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; border: 0; border-radius: 8px; background: #FFFFFF; font-size: 16px; font-weight: 600; color: #1C2233; outline: none">
                        <button type="button" onClick="{{l.write}}" aria-disabled="{{typedEmpty}}" style="all: unset; cursor: pointer; flex: none; height: 44px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 700; display: flex; align-items: center; {{writeStyle}}">Write it</button>
                      </div>
                    </sc-if>
                    <div style="display: flex; flex-wrap: wrap; gap: 6px">
                      <sc-for list="{{l.acts}}" as="a" hint-placeholder-count="2">
                        <button type="button" onClick="{{a.go}}" style="all: unset; cursor: pointer; flex: none; height: 44px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 700; display: flex; align-items: center; {{a.style}}">{{a.label}}</button>
                      </sc-for>
                      <sc-for list="{{l.links}}" as="a" hint-placeholder-count="1">
                        <a href="{{a.href}}" style="flex: none; height: 44px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px; background: #FFFFFF; color: #16203C; box-shadow: inset 0 0 0 1.5px #16203C">{{a.label}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
                      </sc-for>
                    </div>
                  </div>
                </sc-if>
              </div>
            </sc-for>
            <sc-if value="{{s.adding}}" hint-placeholder-val="{{ false }}">
              <div style="height: 44px; border-bottom: 1px solid #C9D9EA; display: flex; align-items: flex-end; gap: 6px; padding: 0 12px 3px 54px">
                <input aria-label="{{s.addAria}}" placeholder="{{s.addHint}}" value="{{newLine}}" onInput="{{typeLine}}" class="hw" style="flex: 1; min-width: 0; height: 38px; box-sizing: border-box; padding: 0; border: 0; background: transparent; font-size: 22px; color: #1F4FA0; outline: none">
                <button type="button" onClick="{{s.addIt}}" style="all: unset; cursor: pointer; flex: none; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 700; display: flex; align-items: center; margin-bottom: 3px; {{addStyle}}">Add</button>
              </div>
            </sc-if>
            <div style="height: 44px; border-bottom: 1px solid #C9D9EA; display: flex; align-items: flex-end; gap: 4px; padding: 0 12px 2px 52px">
              <button type="button" onClick="{{s.startAdd}}" style="all: unset; cursor: pointer; height: 40px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; gap: 5px; font-size: 12px; font-weight: 700; color: #1F4FA0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{s.addLabel}}</button>
              <span style="flex: 1"></span>
              <sc-if value="{{s.canSkip}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{s.skip}}" style="all: unset; cursor: pointer; height: 40px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; gap: 5px; font-size: 12px; font-weight: 700; color: #5F6980">Skip this stop<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h13M12 7l5 5-5 5M20 5v14"></path></svg></button></sc-if>
            </div>
          </sc-if>
          <div aria-hidden="true" style="height: 44px; border-bottom: 1px solid #C9D9EA"></div>
        </div>
      </sc-for>
      <div style="height: 44px; border-bottom: 1px solid #C9D9EA; display: flex; align-items: flex-end; padding: 0 12px 6px 56px"><span class="hw" style="font-size: 19px; color: #5F6980; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{offList}}</span></div>
    </div>
  </div>
  <nav aria-label="Sourcing" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E3DACB; display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: start; padding-top: 8px; box-sizing: border-box">
    <a href="Rooms.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 52px; justify-content: center; color: #6B7480; font-size: 12px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2zM9 8h6M9 12h6"></path></svg>Passports</a>
    <a href="ShelfPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 52px; justify-content: center; color: #6B7480; font-size: 12px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18M3 19h18M6 10V5h4v5M14 19v-6h4v6"></path></svg>New-in</a>
    <a href="AskNew.dc.html" aria-label="Capture a new ask" style="justify-self: center; margin-top: -26px; width: 64px; height: 64px; border-radius: 999px; background: #16203C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(22,32,60,.3); border: 4px solid #F4EFE6; box-sizing: content-box"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="ListPhone.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 52px; justify-content: center; color: #1C2233; font-size: 12px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h3"></path></svg>Market</a>
    <a href="BoardPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 52px; justify-content: center; color: #6B7480; font-size: 12px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8zM7.5 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"></path></svg>Prices</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { done: { o1: 'same', o2: '19,000', o3: 'same', o4: 'has it', o5: 'pushed back', o6: 'done', k1: 'same', k2: 'same' },
      open: '', typed: '', skipped: {}, adding: '', newLine: '', extra: {}, sent: '' };
  }
  renderVals() {
    const S = this.state, D = S.done;
    const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const num = t => +String(t).replace(/[^\d]/g, '');
    // kind: price (our supplier), rival, ask, answer, photo · last: what is on record, and how old
    const STOPS = [
      { id: 'o', n: 1, name: 'Owino Plumbing', kind: 'our supplier', sup: true, lines: [
        ['o1', 'PPR elbow 25mm', 'price', 3500, '9 days', 'piece'], ['o2', 'Gate valve ½"', 'price', 18000, '41 days', 'piece'], ['o3', 'Ball valve ¾"', 'price', 24000, '12 days', 'piece'],
        ['o4', 'Ask: PPR pipe 25mm', 'ask'], ['o5', 'Answer: PVC pipe offer', 'answer'], ['o6', 'Photos × 2', 'photo'] ] },
      { id: 'k', n: 2, name: 'Kikuubo Hardware Mart', kind: 'a rival · price check', board: true, lines: [
        ['k1', 'Cement 50kg', 'rival', 36000, '6 days', 'bag'], ['k2', 'Iron sheet G28', 'rival', 36000, '6 days', 'sheet'], ['k3', 'Wire mesh A142', 'rival', 149000, '4 days', 'sheet'],
        ['k4', 'Y12 rebar', 'rival', 42000, '22 days', 'length'], ['k5', 'Hoop iron', 'rival', 25000, '31 days', 'roll'] ] },
      { id: 'n', n: 3, name: 'Nateete Builders’ Centre', kind: 'a rival · across town', lines: [
        ['n1', 'Wire mesh A142', 'rival', 152000, '9 days', 'sheet'], ['n2', 'Iron sheet G28', 'rival', 35500, '9 days', 'sheet'], ['n3', 'Binding wire', 'rival', 110000, '30 days', 'roll'], ['n4', 'Cement 50kg', 'rival', 35000, '9 days', 'bag'] ] }
    ];
    const put = (id, v) => this.setState({ done: { ...D, [id]: v }, open: '', typed: '' });
    const clear = id => { const d = { ...D }; delete d[id]; this.setState({ done: d }); };
    const BTN = { main: 'background:#16203C;color:#FFFFFF', line: 'background:#FFFFFF;color:#16203C;box-shadow:inset 0 0 0 1.5px #16203C', quiet: 'background:#F4EFE6;color:#5F6980' };
    const ACTS = {
      ask: id => [{ label: 'Has it', style: BTN.main, go: () => put(id, 'has it') }, { label: 'Doesn’t', style: BTN.line, go: () => put(id, 'doesn’t') }],
      answer: id => [{ label: 'Accept 9,800', style: BTN.main, go: () => put(id, 'accepted') }, { label: 'Not now', style: BTN.quiet, go: () => put(id, 'not now') }],
      photo: id => [{ label: 'Both taken', style: BTN.main, go: () => put(id, 'done') }]
    };
    const LINKS = { ask: [{ label: 'Packing and prices', href: 'StampSource.dc.html' }], photo: [{ label: 'Camera', href: 'StampPhoto.dc.html' }] };
    const LAST = { ask: 'Grace’s customer wants 40 lengths · does Owino stock it?', answer: 'Owino offered PVC pipe 4" at 9,800 a length (we pay 10,500 at Kiseka)', photo: 'Tile spacers and the PPR tee · square, on a plain wall' };
    let doneN = 0, total = 0;
    const offs = ['Kiseka Steel · asked in their app'];
    const stops = STOPS.map(s => {
      const raw = s.lines.concat((S.extra[s.id] || []).map((name, i) => [s.id + 'x' + i, name, s.sup ? 'price' : 'rival', 0, '', 'piece']));
      const skipped = !!S.skipped[s.id];
      const lines = raw.map(([id, label, kind, last, age, unit]) => {
        const per = unit ? '/' + unit : '';
        const v = D[id], on = !!v, priced = kind === 'price' || kind === 'rival', isOpen = S.open === id;
        const shown = v === 'same' ? fmt(last) : v;
        const dv = priced && v && v !== 'same' && v !== 'out' && last ? (num(v) - last) / last * 100 : 0;
        const acts = priced ? [{ label: last ? 'Same · ' + fmt(last) + per : 'Same', style: BTN.line, go: () => last && put(id, 'same') }, { label: 'Out today', style: BTN.quiet, go: () => put(id, 'out') }] : ACTS[kind](id);
        if (on) acts.push({ label: 'Clear', style: BTN.quiet, go: () => clear(id) });
        return { label, on: String(on), isOpen, isPrice: priced, acts, links: LINKS[kind] || [],
          tickAria: label + (on ? ', done' : ', mark done'), openAria: 'Open ' + label, inputAria: 'New price for ' + label,
          lastText: priced ? (last ? (kind === 'rival' ? s.name.split(' ')[0] + ' last said ' : 'We pay ') + fmt(last) + per + ' · ' + age + ' ago' : 'Never checked here') : LAST[kind],
          tick: () => on ? clear(id) : priced ? (last ? put(id, 'same') : this.setState({ open: id })) : this.setState({ open: isOpen ? '' : id }),
          toggle: () => this.setState({ open: isOpen ? '' : id, typed: '' }),
          write: () => S.typed && put(id, fmt(num(S.typed))),
          right: on ? shown + (priced && v !== 'out' ? per : '') : priced && last ? fmt(last) + per : '', inputHint: 'New price ' + per,
          rightStyle: on ? (v === 'out' || v === 'doesn’t' ? 'color:#95530C' : 'color:#1F4FA0') : 'color:#5F6980;font-weight:500;font-size:18px',
          hasDelta: Math.abs(dv) >= 0.5, delta: (dv > 0 ? '+' : '') + dv.toFixed(1) + '%',
          deltaStyle: dv > 0 ? 'box-shadow:inset 0 0 0 1.5px #C47A1E;color:#95530C' : 'box-shadow:inset 0 0 0 1.5px #0F6B43;color:#0F6B43',
          box: on ? 'color:#1F4FA0' : 'color:transparent',
          text: on ? 'text-decoration:line-through;text-decoration-color:#1F4FA0;text-decoration-thickness:2px;color:#5F6980' : '' };
      });
      const n = raw.filter(([id]) => D[id]).length, left = raw.length - n, all = !left;
      if (!skipped) { doneN += n + (s.id === 'o' && D.o6 ? 1 : 0); total += raw.length + (s.id === 'o' ? 1 : 0); }
      else offs.push(s.name.split(' ')[0] + ' · moved to Monday');
      const adding = S.adding === s.id;
      return { n: s.n, name: s.name, kind: s.kind, board: !!s.board, lines, count: n + '/' + raw.length, skipped, open: !skipped, left,
        dim: skipped ? 'opacity:.75' : '', nameStyle: skipped ? 'text-decoration:line-through;color:#5F6980' : '',
        kindInk: s.sup ? 'color:#3A3F9B' : 'color:#7A3268',
        dot: all ? 'box-shadow:inset 0 0 0 2px #1F4FA0;color:#1F4FA0;background:rgba(31,79,160,.08)' : n ? 'box-shadow:inset 0 0 0 2px #C47A1E;color:#95530C' : 'box-shadow:inset 0 0 0 2px #1C2233;color:#1C2233',
        canSkip: !all, skip: () => this.setState({ skipped: { ...S.skipped, [s.id]: true }, open: '' }),
        unskip: () => { const k = { ...S.skipped }; delete k[s.id]; this.setState({ skipped: k }); },
        adding, addLabel: adding ? 'Cancel' : s.sup ? 'Add a line they sell' : 'Add a line to check',
        addHint: s.sup ? 'An item to ask Owino about' : 'An item on their shelf', addAria: 'Add a line at ' + s.name,
        startAdd: () => this.setState({ adding: adding ? '' : s.id, newLine: '' }),
        addIt: () => { const t = S.newLine.trim(); if (t) this.setState({ extra: { ...S.extra, [s.id]: (S.extra[s.id] || []).concat(t) }, adding: '', newLine: '' }); } };
    });
    return { stops, doneN, total: '/' + total, typed: S.typed, newLine: S.newLine, typedEmpty: String(!S.typed),
      typeIt: e => this.setState({ typed: e.target.value.replace(/[^\d,]/g, '') }), typeLine: e => this.setState({ newLine: e.target.value }),
      writeStyle: S.typed ? 'background:#16203C;color:#FFFFFF' : 'background:#E3DACB;color:#5F6980',
      addStyle: S.newLine.trim() ? 'background:#16203C;color:#FFFFFF' : 'background:#E3DACB;color:#5F6980',
      offList: 'off the list: ' + offs.join(' · '), dateLine: 'Sat 17 Oct',
      headSub: S.sent || 'Sat 17 Oct · three stops', print: () => this.setState({ sent: 'Sent to the shop printer · 10:02' }), wa: () => this.setState({ sent: 'Sent to your WhatsApp · 10:02' }),
      bar: 'width:' + (total ? doneN / total * 100 : 0).toFixed(0) + '%' };
  }
}
</script>
