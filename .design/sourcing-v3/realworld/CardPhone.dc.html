<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owInk{0%{transform:scale(1.4) rotate(-20deg);opacity:0}60%{transform:scale(.95) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="flex: none; height: 150px; background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 32px 32px; padding: 10px 16px 0; color: #FFFFFF; box-sizing: border-box">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="DeskPhone.dc.html" aria-label="Back to the desk" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="font-size: 13px; font-weight: 700; color: #B3BCD2">On my desk · card <span class="m">0412</span></span>
      <span style="width: 44px; height: 44px"></span>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; margin-top: -84px; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="position: relative; border-radius: 24px; background: #FFFFFF; box-shadow: 0 20px 40px rgba(22,32,60,.18); padding: 22px 18px 20px; display: flex; flex-direction: column; gap: 18px">
      <span aria-hidden="true" style="position: absolute; left: 18px; right: 18px; top: 0; height: 9px; background: radial-gradient(circle at 6px 0, #1C2747 5px, transparent 5.5px) 0 0 / 15px 9px repeat-x"></span>
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 22px; font-weight: 700; letter-spacing: -.01em">Wire mesh BRC A142</span><span style="font-size: 13px; font-weight: 600; color: #5F6980">3 customers want <span class="m" style="color: #1C2233">40</span> sheets</span></span>
        <span role="img" aria-label="{{inkedN}} of 6 stamped" class="m" style="flex: none; width: 56px; height: 56px; border-radius: 999px; background: #F7F5F2; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{inkedN}}/6</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 8px">
        <sc-for list="{{stamps}}" as="s" hint-placeholder-count="6">
          <button type="button" onClick="{{s.tap}}" aria-label="{{s.aria}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 7px">
            <span style="width: 86px; height: 86px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; {{s.look}}">
              <span style="font-size: 10px; font-weight: 700; letter-spacing: .08em">{{s.top}}</span>
              <span style="font-size: 13px; font-weight: 700; {{s.face}}">{{s.mid}}</span>
            </span>
            <span style="font-size: 12px; font-weight: 700; {{s.ink}}">{{s.label}}</span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 14px; justify-content: center; font-size: 11px; font-weight: 700; color: #5F6980">
        <span style="display: flex; align-items: center; gap: 5px"><i style="width: 12px; height: 12px; border-radius: 999px; box-shadow: inset 0 0 0 2px #0F6B43"></i>inked</span>
        <span style="display: flex; align-items: center; gap: 5px"><i style="width: 12px; height: 12px; border-radius: 999px; box-sizing: border-box; border: 1.5px dashed #6B7480"></i>pencil · tap to ink</span>
        <span style="display: flex; align-items: center; gap: 5px"><i style="width: 12px; height: 12px; border-radius: 999px; box-sizing: border-box; border: 1.5px dashed #95530C"></i>missing</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E6E3DD">
      <span style="width: 42px; height: 42px; flex: none; border-radius: 13px; background: #E4F4EA; color: #0F6B43; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-5 9 5v12M8 21v-7h8v7"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 700">Kiseka <span class="m">118,000</span> · Katwe <span class="m">121,500</span></span><span style="font-size: 12px; font-weight: 600; color: #0F6B43">31,000 under Kikuubo · strong room</span></span>
    </div>
  </div>
  <div style="flex: none; padding: 12px 16px 22px">
    <button type="button" onClick="{{go}}" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; height: 58px; border-radius: 999px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; {{goStyle}}">{{goLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { got: {}, sent: false }; }
  renderVals() {
    const S = this.state;
    // start: supplier inked; pack and aisle pencilled; photo and hold missing; price is Ruth's
    const BASE = [
      { k: 'photo', label: 'Photo', start: 'g', top: 'PHOTO', mid: 'take it', done: 'sharp' },
      { k: 'pack', label: 'Pack', start: 'p', top: 'BY THE', mid: 'sheet', done: 'sheet' },
      { k: 'sup', label: 'Supplier', start: 'd', top: 'KISEKA', mid: '118,000', done: '118,000' },
      { k: 'hold', label: 'Hold', start: 'g', top: 'HOLD', mid: 'choose', done: 'Stock' },
      { k: 'aisle', label: 'Aisle', start: 'p', top: 'STEEL &', mid: 'mesh', done: 'mesh' },
      { k: 'price', label: 'Price', start: 'r', top: 'RUTH', mid: 'her price', done: 'her price' }
    ];
    const INKED = 'border-radius:999px;background:rgba(15,107,67,.08);box-shadow:inset 0 0 0 3px #0F6B43,inset 0 0 0 7px rgba(15,107,67,.06),inset 0 0 0 8.5px #0F6B43;color:#0F6B43;transform:rotate(-12deg);animation:owInk .4s ease-out';
    const LOOK = {
      d: INKED,
      p: 'border-radius:999px;border:2px dashed #6B7480;color:#4A5163;font-style:italic',
      g: 'border-radius:999px;border:2.5px dashed #95530C;color:#95530C',
      r: 'border-radius:18px;background:#F6E4F1;box-shadow:inset 0 0 0 2px #7A3268;color:#7A3268'
    };
    const INK = { d: 'color:#0F6B43', p: 'color:#4A5163', g: 'color:#7A4A02', r: 'color:#7A3268' };
    const WORD = { d: 'stamped', p: 'pencilled, tap to ink', g: 'missing, tap to fill', r: 'Ruth stamps last' };
    const stamps = BASE.map(b => {
      const st = S.got[b.k] ? 'd' : b.start;
      return { label: b.label, top: b.top, mid: st === 'd' && b.start !== 'd' ? b.done : b.mid, look: LOOK[st], ink: INK[st],
        face: b.k === 'sup' || (b.k === 'photo' && st === 'd') ? "font-family:'IBM Plex Mono',monospace;font-weight:600" : '',
        aria: b.label + ': ' + WORD[st],
        tap: () => { if (st === 'p' || st === 'g') this.setState({ got: { ...S.got, [b.k]: true } }); } };
    });
    const pencils = BASE.filter(b => b.start === 'p' && !S.got[b.k]).length;
    const gaps = BASE.filter(b => b.start === 'g' && !S.got[b.k]);
    const inkedN = BASE.filter(b => b.start === 'd' || S.got[b.k]).length;
    const ready = !pencils && !gaps.length;
    return {
      stamps, inkedN,
      go: () => { if (pencils) this.setState({ got: { ...S.got, pack: true, aisle: true } }); else if (ready) this.setState({ sent: true }); },
      goLabel: S.sent ? 'In Ruth’s tray · she was told' : pencils ? 'Ink the ' + pencils + ' pencilled' : gaps.length ? 'Fill ' + gaps.length + ' missing: ' + gaps.map(g => g.label.toLowerCase()).join(', ') : 'Put it in Ruth’s tray',
      goStyle: S.sent ? 'background:#E4F4EA;color:#0F6B43' : gaps.length && !pencils ? 'background:#F3D3CF;color:#8E2A22' : 'background:#C93A30;color:#FFFFFF;box-shadow:0 10px 22px rgba(201,58,48,.26)'
    };
  }
}
</script>
</body>
</html>
