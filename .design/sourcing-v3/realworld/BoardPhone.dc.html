<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Price board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chalk{color:#F2EFE6;text-shadow:0 0 1px rgba(242,239,230,.6),0 0 6px rgba(242,239,230,.12)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="flex: none; background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 30px 30px; padding: 10px 16px 18px; color: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="ListPhone.dc.html" aria-label="Back to the market list" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="flex: 1; text-align: center; font-size: 13px; font-weight: 700; color: #B3BCD2">Stop 2 of 3</span>
      <span style="width: 44px; height: 44px"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 52px; height: 52px; flex: none; border-radius: 999px; background: #F6E4F1; color: #7A3268; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 22px; font-weight: 700; letter-spacing: -.01em">Kikuubo Hardware Mart</span><span style="font-size: 12px; font-weight: 600; color: #B3BCD2">a rival · read their board</span></span>
      <span class="m" style="flex: none; font-size: 20px; font-weight: 600">{{doneN}}<span style="font-size: 13px; color: #B3BCD2">/5</span></span>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 14px 20px">
    <div style="border-radius: 14px; background: #6E5135; padding: 8px; box-shadow: 0 16px 32px rgba(22,32,60,.22)">
      <div style="border-radius: 8px; background: radial-gradient(120% 90% at 30% 10%, #2E3B34 0%, #1F2B26 60%, #18221E 100%); padding: 6px 12px 10px">
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: {{l.rule}}">
            <div style="display: flex; align-items: baseline; gap: 10px">
              <span class="chalk" style="flex: 1; min-width: 0; font-size: 16px; font-weight: 600">{{l.name}}</span>
              <span class="chalk m" style="flex: none; font-size: 22px; font-weight: 600; {{l.figStyle}}">{{l.fig}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; background: #FFFFFF; transform: rotate(-1.5deg); box-shadow: 0 3px 8px rgba(0,0,0,.35)"><i style="width: 7px; height: 7px; border-radius: 999px; background: #C93A30"></i><span class="m" style="font-size: 11px; font-weight: 600">cost {{l.cost}}</span><span style="font-size: 10px; font-weight: 700; {{l.roomInk}}">{{l.room}}</span></span></span>
              <sc-if value="{{l.open}}" hint-placeholder-val="{{ true }}"><span style="flex: none; display: flex; gap: 6px"><button type="button" onClick="{{l.same}}" style="all: unset; cursor: pointer; height: 36px; padding: 0 12px; border-radius: 999px; background: #F2EFE6; color: #1F2B26; font-size: 12px; font-weight: 700; display: flex; align-items: center">Same</button><button type="button" onClick="{{l.edit}}" style="all: unset; cursor: pointer; height: 36px; padding: 0 12px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px rgba(242,239,230,.6); color: #F2EFE6; font-size: 12px; font-weight: 700; display: flex; align-items: center">New</button></span></sc-if>
              <sc-if value="{{l.done}}" hint-placeholder-val="{{ false }}"><span style="flex: none; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: #6FDCB0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>{{l.doneWord}}</span></sc-if>
            </div>
            <sc-if value="{{l.editing}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 8px"><input value="{{l.guess}}" inputmode="numeric" aria-label="Their new price" class="m" style="flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 10px; border: none; background: rgba(242,239,230,.1); box-shadow: inset 0 0 0 1.5px rgba(242,239,230,.5); color: #F2EFE6; font-size: 18px; font-weight: 600"><button type="button" onClick="{{l.save}}" style="all: unset; cursor: pointer; height: 44px; padding: 0 16px; border-radius: 999px; background: #F2EFE6; color: #1F2B26; font-size: 13px; font-weight: 700; display: flex; align-items: center">Chalk it</button></div></sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="flex: none; padding: 12px 16px 22px">
    <a href="ListPhone.dc.html" style="height: 58px; border-radius: 999px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; {{goStyle}}">{{goLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { res: { c: 'same', i: 'same' }, editing: null }; }
  renderVals() {
    const S = this.state;
    const BASE = [
      { id: 'c', name: 'Cement 50kg', last: '36,000', cost: '34,500', room: '1,500 under · thin', thin: true },
      { id: 'i', name: 'Iron sheet G28', last: '36,000', cost: '34,200', room: '1,800 under · thin', thin: true },
      { id: 'w', name: 'Wire mesh A142', last: '149,000', cost: '118,000', room: '31,000 under · strong', thin: false, newFig: '149,000' },
      { id: 'y', name: 'Y12 rebar, 12m', last: '43,000', cost: '41,500', room: '1,500 under · thin', thin: true, newFig: '42,000' },
      { id: 'h', name: 'Hoop iron 0.5mm', last: '25,000', cost: '23,500', room: '1,500 under · thin', thin: true, newFig: '25,000' }
    ];
    const lines = BASE.map((l, i) => {
      const r = S.res[l.id], ed = S.editing === l.id;
      return { ...l, rule: i < BASE.length - 1 ? '1px dashed rgba(242,239,230,.18)' : 'none',
        fig: r === 'new' ? (l.newFig || l.last) : l.last, figStyle: r ? '' : 'opacity:.55',
        roomInk: l.thin ? 'color:#95530C' : 'color:#0F6B43',
        open: !r && !ed, editing: ed, done: !!r, doneWord: r === 'new' ? 'new price' : 'same',
        guess: l.newFig || l.last,
        same: () => this.setState({ res: { ...S.res, [l.id]: 'same' } }),
        edit: () => this.setState({ editing: l.id }),
        save: () => this.setState({ res: { ...S.res, [l.id]: 'new' }, editing: null }) };
    });
    const doneN = Object.keys(S.res).length;
    const all = doneN === BASE.length;
    return {
      lines, doneN,
      goLabel: all ? 'Board read · next stop: Nateete' : (BASE.length - doneN) + ' lines left on the board',
      goStyle: all ? 'background:#C93A30;color:#FFFFFF;box-shadow:0 10px 22px rgba(201,58,48,.26)' : 'background:#FFFFFF;color:#16203C;box-shadow:inset 0 0 0 1.5px #E6E3DD'
    };
  }
}
</script>
</body>
</html>
