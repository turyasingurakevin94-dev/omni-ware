<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The hold stamp</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owFillRing{from{stroke-dashoffset:276}to{stroke-dashoffset:0}}
@keyframes owInk{0%{transform:scale(1.4) rotate(-20deg);opacity:0}60%{transform:scale(.95) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="flex: none; background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 30px 30px; padding: 10px 16px 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="CardPhone.dc.html" aria-label="Back to the card" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="font-size: 13px; font-weight: 700; color: #B3BCD2">Card <span class="m">0412</span> · stamp 4 of 6</span>
      <span style="width: 44px; height: 44px"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <span role="img" aria-label="Score 68 of 100, Stock recommended" style="position: relative; width: 84px; height: 48px; flex: none; overflow: hidden"><span style="position: absolute; left: 0; top: 0; width: 84px; height: 84px; border-radius: 999px; background: conic-gradient(from 270deg, #6FDCB0 0deg 122deg, rgba(255,255,255,.14) 122deg 180deg, transparent 180deg)"></span><span style="position: absolute; left: 12px; top: 12px; width: 60px; height: 60px; border-radius: 999px; background: #1C2747"></span><span class="m" style="position: absolute; left: 0; right: 0; top: 22px; text-align: center; font-size: 20px; font-weight: 600">68</span></span>
      <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 22px; font-weight: 700">Stock is recommended</span><span style="font-size: 12px; font-weight: 600; color: #B3BCD2">sells in ≈ 16 days · Kiseka takes 3 days</span></span>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <span style="padding: 0 4px; font-size: 13px; font-weight: 700; color: #5F6980">1 · Your call</span>
    <div role="radiogroup" aria-label="How we hold it" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="{{o.style}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg>
          <span style="font-size: 14px; font-weight: 700">{{o.label}}</span>
          <span style="font-size: 11px; font-weight: 600; {{o.subInk}}">{{o.sub}}</span>
        </button>
      </sc-for>
    </div>
    <sc-if value="{{needWhy}}" hint-placeholder-val="{{ false }}">
    <span style="padding: 4px 4px 0; font-size: 13px; font-weight: 700; color: #7A4A02">You differ from the app · say why</span>
    <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{whys}}" as="w" hint-placeholder-count="4"><button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="{{w.style}}">{{w.label}}</button></sc-for></div>
    </sc-if>
    <span style="padding: 4px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">2 · Ink it</span>
    <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 8px 20px rgba(22,32,60,.08); {{inkBoxStyle}}">
      <button type="button" onClick="{{press}}" aria-label="Press and hold to ink the hold stamp" style="all: unset; cursor: pointer; position: relative; width: 96px; height: 96px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center">
        <svg width="96" height="96" viewBox="0 0 104 104" aria-hidden="true" style="position: absolute; inset: 0"><circle cx="52" cy="52" r="44" fill="none" stroke="#EFECE6" stroke-width="8"></circle><sc-if value="{{holding}}" hint-placeholder-val="{{ false }}"><circle cx="52" cy="52" r="44" fill="none" stroke="#0F6B43" stroke-width="8" stroke-linecap="round" stroke-dasharray="276" transform="rotate(-90 52 52)" style="animation: owFillRing .9s linear forwards"></circle></sc-if></svg>
        <span style="width: 70px; height: 70px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; {{knob}}">hold</span>
      </button>
      <span style="flex: 1; font-size: 13px; font-weight: 700; line-height: 1.35">{{inkHint}}</span>
    </div>
    </sc-if>
    <sc-if value="{{inked}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 8px 20px rgba(22,32,60,.08)">
      <span style="width: 76px; height: 76px; flex: none; border-radius: 999px; background: rgba(15,107,67,.08); box-shadow: inset 0 0 0 3px #0F6B43, inset 0 0 0 7px rgba(15,107,67,.06), inset 0 0 0 8.5px #0F6B43; transform: rotate(-12deg); color: #0F6B43; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: owInk .4s ease-out"><span style="font-size: 9px; font-weight: 700; letter-spacing: .08em">HOLD</span><span style="font-size: 14px; font-weight: 700">{{pickLabel}}</span></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 700; color: #0F6B43">Inked · Denis is told</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">{{why}}</span></span>
    </div>
    </sc-if>
  </div>
  <div style="flex: none; padding: 12px 16px 22px">
    <a href="RuthTray.dc.html" style="height: 58px; border-radius: 999px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; {{nextStyle}}">{{nextLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: null, why: null, holding: false, inked: false }; }
  renderVals() {
    const S = this.state;
    const OPTS = [
      ['Stock', 'recommended', 'M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5zM3.5 7.5 12 12l8.5-4.5M12 12v9'],
      ['Per order', 'buy when asked', 'M4 5h16v11H8l-4 4z'],
      ['Consign', 'needs Kiseka', 'M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3']
    ];
    const opts = OPTS.map(([label, sub, icon]) => {
      const on = S.pick === label;
      return { label, sub, icon, on: String(on), pick: () => this.setState({ pick: label, why: null, inked: false }),
        subInk: on ? 'color:#B3BCD2' : label === 'Stock' ? 'color:#0F6B43' : 'color:#5F6980',
        style: 'all:unset;cursor:pointer;box-sizing:border-box;height:104px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;' +
          (on ? 'background:#16203C;color:#FFFFFF' : 'background:#FFFFFF;color:#1C2233;box-shadow:inset 0 0 0 1.5px #E6E3DD') };
    });
    const differs = !!S.pick && S.pick !== 'Stock';
    const whys = ['Kiseka now delivers next day', 'Not sure it will sell', 'Cash is tight this month', 'Kiseka offered to consign'].map(label => ({
      label, on: String(S.why === label), pick: () => this.setState({ why: label }),
      style: 'all:unset;cursor:pointer;box-sizing:border-box;height:36px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;display:flex;align-items:center;' + (S.why === label ? 'background:#95530C;color:#FFFFFF' : 'background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #F3DCC4;color:#7A4A02') }));
    const can = !!S.pick && (!differs || !!S.why);
    return {
      opts, whys, needWhy: differs, open: !S.inked, inked: S.inked, holding: S.holding, pickLabel: S.pick || '',
      why: differs ? 'your reason: ' + (S.why || '').toLowerCase() : 'the app’s pick, kept',
      inkBoxStyle: can ? '' : 'opacity:.6',
      knob: can ? 'background:#0F6B43;color:#FFFFFF' : 'background:#EFECE6;color:#5F6980',
      inkHint: !S.pick ? 'Pick how we hold it first' : differs && !S.why ? 'Say why you differ, then hold' : 'Hold for a second to ink ' + S.pick,
      press: () => { if (!can || S.holding) return; this.setState({ holding: true }); setTimeout(() => this.setState({ holding: false, inked: true }), 900); },
      nextLabel: S.inked ? '5 of 6 · into Ruth’s tray' : 'Ruth’s tray waits for this stamp',
      nextStyle: S.inked ? 'background:#C93A30;color:#FFFFFF;box-shadow:0 10px 22px rgba(201,58,48,.26)' : 'background:#F3D3CF;color:#8E2A22;pointer-events:none'
    };
  }
}
</script>
</body>
</html>
