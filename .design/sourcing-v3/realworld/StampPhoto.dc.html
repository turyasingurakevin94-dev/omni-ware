<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The photo stamp</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owInk{0%{transform:scale(1.4) rotate(-20deg);opacity:0}60%{transform:scale(.95) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
@keyframes owScan{0%{top:0}100%{top:calc(100% - 3px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B1122; font-family: Figtree, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column">
  <div style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px">
    <a href="CardPhone.dc.html" aria-label="Back to the card" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <span style="font-size: 13px; font-weight: 700; color: #B3BCD2">Photo stamp · wire mesh</span>
    <span style="width: 44px; height: 44px"></span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 20px">
    <div style="position: relative; width: 300px; height: 300px; border-radius: 22px; overflow: hidden; background: #2A3044">
      <sc-if value="{{shot}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; inset: 0; background: #E9E5DE; display: flex; align-items: center; justify-content: center"><span style="width: 210px; height: 210px; border-radius: 6px; background-color: #F6F3EE; background-image: repeating-linear-gradient(0deg, #6B7480 0 2px, transparent 2px 21px), repeating-linear-gradient(90deg, #6B7480 0 2px, transparent 2px 21px); box-shadow: 0 10px 24px rgba(22,32,60,.18)"></span></span></sc-if>
      <sc-if value="{{aiming}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #B3BCD2">One sheet, filling the square</span></sc-if>
      <span aria-hidden="true" style="position: absolute; inset: 14px; border-radius: 14px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.7)"></span>
      <sc-if value="{{checking}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: 0; right: 0; height: 3px; background: #6FDCB0; box-shadow: 0 0 16px #6FDCB0; animation: owScan 1s ease-in-out infinite alternate"></span></sc-if>
      <sc-if value="{{passed}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 14px; bottom: 14px; width: 96px; height: 96px; border-radius: 999px; background: rgba(255,255,255,.92); box-shadow: inset 0 0 0 3px #0F6B43, inset 0 0 0 7px rgba(15,107,67,.06), inset 0 0 0 8.5px #0F6B43; transform: rotate(-12deg); color: #0F6B43; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: owInk .4s ease-out"><span style="font-size: 9px; font-weight: 700; letter-spacing: .1em">PHOTO</span><span style="font-size: 13px; font-weight: 700">passed</span><span class="m" style="font-size: 10px">10:51</span></span></sc-if>
    </div>
    <div role="list" aria-label="The four checks" style="width: 300px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{checks}}" as="c" hint-placeholder-count="4">
        <div role="listitem" style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 14px; {{c.style}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
          <span style="flex: 1; font-size: 13px; font-weight: 700">{{c.label}}</span>
          <span class="m" style="font-size: 12px; font-weight: 600">{{c.read}}</span>
        </div>
      </sc-for>
    </div>
    <span style="font-size: 12px; font-weight: 600; color: #B3BCD2; text-align: center">{{hint}}</span>
  </div>
  <div style="flex: none; padding: 12px 16px 26px; display: flex; justify-content: center">
    <sc-if value="{{aiming}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{shoot}}" aria-label="Take the photo" style="all: unset; cursor: pointer; width: 76px; height: 76px; border-radius: 999px; box-shadow: inset 0 0 0 4px #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="width: 60px; height: 60px; border-radius: 999px; background: #FFFFFF"></span></button></sc-if>
    <sc-if value="{{passed}}" hint-placeholder-val="{{ false }}"><a href="CardPhone.dc.html" style="width: 100%; height: 58px; border-radius: 999px; background: #C93A30; color: #FFFFFF; box-shadow: 0 10px 22px rgba(201,58,48,.35); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">Next: choose the hold</a></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: 'aim' }; }
  renderVals() {
    const st = this.state.step;
    const WAIT = 'background:rgba(255,255,255,.06);color:#B3BCD2', OK = 'background:rgba(111,220,176,.14);color:#6FDCB0';
    const TICK = 'm5 12.5 4.5 4.5L19 7.5', DOT = 'M12 12h.01';
    const checks = [['Sharp', '214'], ['Bright', '61%'], ['Square', '1,200'], ['Plain behind', 'yes']].map(([label, read]) => ({
      label, read: st === 'passed' ? read : '', style: st === 'passed' ? OK : WAIT, icon: st === 'passed' ? TICK : DOT }));
    return {
      checks, aiming: st === 'aim', shot: st !== 'aim', checking: st === 'checking', passed: st === 'passed',
      hint: st === 'aim' ? 'The stamp inks itself only if all four pass' : st === 'checking' ? 'Checking on the phone…' : 'All four passed · the stamp is inked, the photo is kept',
      shoot: () => { this.setState({ step: 'checking' }); setTimeout(() => this.setState({ step: 'passed' }), 1100); }
    };
  }
}
</script>
</body>
</html>
