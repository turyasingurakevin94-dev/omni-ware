<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Today, a new shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F5F2}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #F7F5F2; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="background: #16203C; color: #FFFFFF; border-radius: 0 0 28px 28px; padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 15px; font-weight: 600">Sat 17 Oct</span>
      <span style="width: 44px; height: 44px; border-radius: 999px; background: #243052; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">ML</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #B3BCD2">The funnel</span>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end" aria-label="The funnel is empty">
        <sc-for list="{{lanes}}" as="l" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <span class="m" style="font-size: 20px; font-weight: 600; color: #B3BCD2">0</span>
            <div style="width: 100%; height: 8px; border-radius: 6px 6px 2px 2px; border: 1.5px dashed #6B7480"></div>
            <span style="font-size: 11px; font-weight: 600; color: #B3BCD2; white-space: nowrap">{{l}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <span style="font-size: 14px; color: #B3BCD2">Nothing to show yet. Three steps fill it.</span>
  </div>

  <div style="padding: 18px 16px 120px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 16px; font-weight: 700">Start here</span>
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <a href="{{s.href}}" style="display: flex; align-items: center; gap: 14px; padding: 14px; background: #FFFFFF; border: 1px solid #E6E3DD; border-radius: 16px">
        <span class="m" style="width: 36px; height: 36px; flex: none; border-radius: 999px; background: #F1EEE8; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{s.n}}</span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
          <span style="font-size: 15px; font-weight: 700">{{s.title}}</span>
          <span style="font-size: 13px; color: #5F6980">{{s.sub}}</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6980" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </sc-for>
    <span style="font-size: 13px; color: #5F6980; padding: 4px">Asks arrive by themselves when Sales, agents or the website search for something we don't sell.</span>
    <a href="NewSupplier.dc.html" style="margin-top: 6px; text-align: center; padding: 15px 10px; border-radius: 14px; background: #C93A30; color: #FFFFFF; font-size: 15px; font-weight: 700">Add your first supplier</a>
  </div>

  <nav aria-label="Sourcing" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E6E3DD; box-shadow: 0 -8px 24px rgba(22,32,60,.08); display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: start; padding: 8px 0 14px">
    <a href="EmptyToday.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 700; color: #1C2233">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18a6 6 0 0 1 12 0z"></path><path fill="none" d="M3 18h18M12 4v3M4.9 8.9 7 11M19.1 8.9 17 11"></path></svg>Today</a>
    <a href="Funnel.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 600; color: #5F6980">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"></path></svg>Funnel</a>
    <a href="Capture.dc.html" aria-label="Capture" style="justify-self: center; margin-top: -26px; width: 64px; height: 64px; border-radius: 999px; background: #16203C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 4px solid #F7F5F2">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Prices.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 600; color: #5F6980">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1.5"></circle></svg>Prices</a>
    <a href="Suppliers.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 600; color: #5F6980">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-5 9 5v12"></path><path d="M8 21v-7h8v7"></path></svg>Suppliers</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      lanes: ['Wanted', 'Hunting', 'Quoted', 'Ready', 'Manager', 'Live'],
      steps: [
        { n: '1', title: 'Add your suppliers', sub: 'snap their cards, say what they sell', href: 'NewSupplier.dc.html' },
        { n: '2', title: 'Visit one and capture prices', sub: 'each price fills the price list', href: 'Capture.dc.html' },
        { n: '3', title: 'Certify your top sellers', sub: 'photo, packing, verdict for each', href: 'Funnel.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
