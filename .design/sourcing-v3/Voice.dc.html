<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing · Say it</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* figures in the mono face everywhere, words in Figtree: digits come from Plex Mono */
@font-face{font-family:'OW Figures';font-weight:400;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:500;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:600 700;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3vAOwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
.nm{font-family:Figtree,system-ui,sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#6B7480}
/* rule 10: a drawn size is not the hit area. Every control reaches at least 44 x 44 */
:where(a,button,[role=radio],[role=tab],[role=switch]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative!important}
:where(a,button,[role=radio],[role=tab],[role=switch])::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes owPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.6)}70%{box-shadow:0 0 0 6px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
@keyframes owRingA{0%,100%{box-shadow:0 0 0 3px #19223F,0 0 0 5px rgba(245,178,107,.95)}50%{box-shadow:0 0 0 3px #19223F,0 0 0 8px rgba(245,178,107,.25)}}
@keyframes owUndoRun{to{stroke-dashoffset:62.8}}
@keyframes owGone{to{opacity:0;visibility:hidden}}
@keyframes owChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: 'OW Figures', Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="flex: none; background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 30px 30px; padding: 10px 16px 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="Capture.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: rgba(255,255,255,.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="flex: 1; min-width: 0; text-align: center; font-size: 13px; font-weight: 700; color: #B3BCD2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Say it</span>
      <span style="width: 44px; height: 44px; flex: none"></span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 0 2px">
      <button type="button" onClick="{{toggle}}" aria-label="{{micAria}}" aria-pressed="{{listeningStr}}" style="all: unset; cursor: pointer; position: relative; width: 120px; height: 120px; border-radius: 999px; display: flex; align-items: center; justify-content: center; {{ringStyle}}">
        <span style="width: 84px; height: 84px; border-radius: 999px; display: flex; align-items: center; justify-content: center; {{micStyle}}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6v11H9zM5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></span>
      </button>
      <div aria-hidden="true" style="display: flex; align-items: center; gap: 3px; height: 24px"><sc-for list="{{level}}" as="b" hint-placeholder-count="15"><i style="width: 4px; border-radius: 2px; {{b}}"></i></sc-for></div>
      <span style="font-size: 12px; font-weight: 600; color: #B3BCD2">{{hint}}</span>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{heard}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="padding: 4px 4px 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3">“Kiseka, wire mesh, one eighteen”</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
          <a href="{{c.href}}" style="min-height: 64px; padding: 10px 12px; border-radius: 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 3px; {{c.style}}"><span style="font-size: 11px; font-weight: 700">{{c.k}}</span><span style="font-size: 15px; font-weight: 700; color: #1C2233; {{c.face}}">{{c.v}}</span></a>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 16px; background: #E4F4EA; color: #0F6B43; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg><span>Same as <span class="m">2</span> days ago · saves as “Same price”</span></div>
    </div>
    </sc-if>
    <sc-if value="{{notHeard}}" hint-placeholder-val="{{ false }}">
    <span style="padding: 0 4px; font-size: 13px; font-weight: 700; color: #5F6980">Say it like</span>
    <div style="background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px #E6E3DD, 0 4px 14px rgba(22,32,60,.05); padding: 6px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{examples}}" as="e" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 10px"><span style="width: 10px; height: 10px; flex: none; border-radius: 999px; {{e.dot}}"></span><span style="flex: 1; font-size: 14px; font-weight: 700">“{{e.say}}”</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">{{e.kind}}</span></div>
      </sc-for>
    </div>
    </sc-if>
    <span style="display: flex; align-items: center; gap: 6px; padding: 0 4px; font-size: 12px; font-weight: 600; color: #5F6980"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10v18H7zM11 18h2"></path></svg>Some phones need signal to hear you · what it heard is kept</span>
  </div>
  <div style="flex: none; padding: 12px 16px 22px">
    <sc-if value="{{heard}}" hint-placeholder-val="{{ true }}"><a href="Main.dc.html" style="height: 58px; border-radius: 999px; background: #C93A30; color: #FFFFFF; box-shadow: 0 10px 22px rgba(201,58,48,.26); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Save · same price</a></sc-if>
    <sc-if value="{{notHeard}}" hint-placeholder-val="{{ false }}"><a href="SupplierPrice.dc.html" style="height: 58px; border-radius: 999px; background: #FFFFFF; color: #16203C; box-shadow: inset 0 0 0 1.5px #E6E3DD; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Type it instead</a></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'heard' }; }
  renderVals() {
    const mode = this.state.mode, listening = mode === 'listening', heard = mode === 'heard';
    const H = [6, 10, 16, 22, 14, 24, 18, 24, 12, 20, 16, 10, 22, 14, 8];
    const level = H.map(h => 'height:' + (listening ? h : 4) + 'px;background:' + (listening ? '#F0A39B' : 'rgba(255,255,255,.18)'));
    const SUP = 'background:#E4E6FA;color:#3A3F9B', NEUT = 'background:#FFFFFF;color:#5F6980;box-shadow:inset 0 0 0 1.5px #E6E3DD', MONO = "font-family:'IBM Plex Mono',monospace;font-weight:600";
    const chips = [
      { k: 'Supplier', v: 'Kiseka Steel', style: SUP, face: '', href: 'Search.dc.html' },
      { k: 'Item', v: 'Wire mesh BRC A142', style: NEUT, face: '', href: 'Search.dc.html' },
      { k: 'Price', v: '118,000', style: NEUT, face: MONO, href: 'SupplierPrice.dc.html' },
      { k: 'For', v: 'a sheet', style: NEUT, face: '', href: 'SupplierPrice.dc.html' }
    ];
    const examples = [
      { say: 'Kiseka, wire mesh, one eighteen', kind: 'supplier price', dot: 'background:#3A3F9B' },
      { say: 'Kikuubo, cement, thirty-four', kind: 'rival price', dot: 'background:#7A3268' },
      { say: 'Owino, gate valve, same', kind: 'same price', dot: 'background:#0F6B43' }
    ];
    return {
      heard, notHeard: !heard, listeningStr: String(listening), level, chips, examples,
      toggle: () => this.setState({ mode: listening ? 'heard' : 'listening' }),
      micAria: listening ? 'Stop listening' : 'Hold to talk',
      hint: listening ? 'Listening… let go when you are done' : heard ? 'Tap a box to fix it · hold to say it again' : 'Hold to talk',
      ringStyle: listening ? 'background:rgba(201,58,48,.18);box-shadow:0 0 0 12px rgba(201,58,48,.08)' : 'background:rgba(255,255,255,.07)',
      micStyle: listening ? 'background:#C93A30;color:#FFFFFF' : 'background:#FFFFFF;color:#16203C'
    };
  }
}
</script>
</body>
</html>
