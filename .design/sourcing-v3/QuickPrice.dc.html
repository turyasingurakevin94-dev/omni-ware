<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — Rival price</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #FFFFFF; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 4px">
    <a href="Capture.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 16px; font-weight: 700">Rival price</span>
  </div>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px">
      <a href="Search.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 14px; background: #F6E4F1">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #7A3268">Rival shop</span>
        <span style="font-size: 14px; font-weight: 700; line-height: 1.25">Kikuubo Hardware Mart</span>
      </a>
      <a href="Search.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 14px; background: #F1EEE8">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #5F6980">Item</span>
        <span style="font-size: 14px; font-weight: 700; line-height: 1.25">Wire mesh BRC A142</span>
      </a>
    </div>

    <!-- the figure -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 0 4px">
      <span class="m" style="font-size: 44px; font-weight: 600; line-height: 1">{{shown}}</span>
      <div style="display: flex; gap: 6px">
        <sc-for list="{{units}}" as="u" hint-placeholder-count="2">
          <button type="button" onClick="{{u.pick}}" style="{{u.style}}">{{u.label}}</button>
        </sc-for>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5F6980">last seen <span class="m">147,000</span> on 8 Oct
        <sc-if value="{{hasDelta}}" hint-placeholder-val="{{ true }}">
          <span style="display: inline-flex; align-items: center; gap: 2px; color: #1C2233; font-weight: 600">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{arrow}}"></path></svg><span class="m">{{delta}}</span></span>
        </sc-if>
      </span>
    </div>

    <span style="font-size: 12px; font-weight: 700; color: #5F6980">Do they have it?</span>
    <div role="radiogroup" aria-label="Do they have it?" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{stock}}" as="s" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px">
      <span style="font-size: 12px; font-weight: 700; color: #5F6980">Last seen here</span>
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: baseline; gap: 8px; font-size: 13px">
          <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.item}}</span>
          <span class="m" style="font-weight: 600">{{r.p}}</span>
          <span style="color: #5F6980; width: 48px; text-align: right">{{r.when}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- keypad -->
  <div style="margin-top: auto; padding: 10px 16px 18px; display: flex; flex-direction: column; gap: 10px; background: #F7F5F2; border-top: 1px solid #E6E3DD">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <button type="button" aria-label="{{k.aria}}" onClick="{{k.press}}" style="all: unset; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 12px; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; box-shadow: inset 0 0 0 1px #E6E3DD">
          <sc-if value="{{k.isText}}" hint-placeholder-val="{{ true }}">{{k.label}}</sc-if>
          <sc-if value="{{k.isBack}}" hint-placeholder-val="{{ false }}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z"></path><path d="M13 10l4 4M17 10l-4 4"></path></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>
    <a href="Main.dc.html" style="text-align: center; padding: 15px 10px; border-radius: 14px; background: #C93A30; color: #FFFFFF; font-size: 15px; font-weight: 700">Save the price</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { v: '149000', stock: 'Yes', unit: 'a sheet' }; }
  renderVals() {
    const { v, unit } = this.state;
    const n = Number(v || 0);
    const fmt = (x) => x.toLocaleString('en-US');
    const d = n - 147000;
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '000', '0', 'back'].map(label => ({
      label, isText: label !== 'back', isBack: label === 'back', aria: label === 'back' ? 'Delete a digit' : label,
      press: () => this.setState({ v: label === 'back' ? v.slice(0, -1) : (v + label).replace(/^0+/, '').slice(0, 9) })
    }));
    const pill = (on) => 'all:unset;cursor:pointer;text-align:center;padding:12px 6px;border-radius:12px;font-size:14px;font-weight:700;' +
      (on ? 'background:#16203C;color:#FFFFFF' : 'background:#FFFFFF;color:#1C2233;box-shadow:inset 0 0 0 1px #E6E3DD');
    const stock = ['Yes', 'A few', 'No'].map(label => ({
      label, on: String(this.state.stock === label), pick: () => this.setState({ stock: label }), style: pill(this.state.stock === label)
    }));
    const units = ['a sheet', 'a bundle of 10'].map(label => ({
      label, pick: () => this.setState({ unit: label }),
      style: 'all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;' + (unit === label ? 'background:#16203C;color:#FFFFFF' : 'background:#F1EEE8')
    }));
    const recent = [
      { item: 'Gate valve ½"', p: '19,500', when: '14 Oct' },
      { item: 'Y12 rebar, 12m', p: '47,500', when: '10 Oct' },
      { item: 'Iron sheet G28, 3m', p: '36,000', when: '9 Oct' }
    ];
    return {
      shown: n ? fmt(n) : '0', keys, stock, units, recent,
      hasDelta: !!n && d !== 0 && unit === 'a sheet',
      delta: fmt(Math.abs(d)),
      arrow: d > 0 ? 'M12 19V5M6 11l6-6 6 6' : 'M12 5v14M6 13l6 6 6-6'
    };
  }
}
</script>
</body>
</html>
