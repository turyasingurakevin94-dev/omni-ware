<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing — A new supplier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #FFFFFF; color: #1C2233; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 4px">
    <a href="Suppliers.dc.html" aria-label="Back to Suppliers" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 16px; font-weight: 700">A new supplier</span>
  </div>

  <div style="padding: 4px 16px 120px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" onClick="{{read}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 14px; background: #E4E6FA; color: #3A3F9B">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10h6M7 14h4"></path></svg>
        <span style="font-size: 14px; font-weight: 700; color: #1C2233">Snap their card</span>
        <span style="font-size: 12px; color: #5F6980">fills the fields below</span>
      </button>
      <button type="button" onClick="{{read}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 14px; background: #F1EEE8">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.7-3.6 3.6-6 7-6s6.3 2.4 7 6"></path></svg>
        <span style="font-size: 14px; font-weight: 700">From contacts</span>
        <span style="font-size: 12px; color: #5F6980">name and phone</span>
      </button>
    </div>

    <sc-if value="{{filled}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #E4F4EA; color: #0F6B43; font-size: 13px; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        Read from the card. Check each field.</div>
    </sc-if>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ns_name" style="font-size: 12px; font-weight: 700; color: #5F6980">Name</label>
      <input id="ns_name" type="text" value="Katwe Fabricators Ltd" style="box-sizing: border-box; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #E6E3DD; font: inherit; font-size: 16px; font-weight: 600">
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ns_phone" style="font-size: 12px; font-weight: 700; color: #5F6980">Phone</label>
        <input id="ns_phone" type="tel" value="0772 418 230" style="box-sizing: border-box; width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid #95530C; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ns_where" style="font-size: 12px; font-weight: 700; color: #5F6980">Where</label>
        <input id="ns_where" type="text" value="Katwe" style="box-sizing: border-box; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #E6E3DD; font: inherit; font-size: 15px">
      </div>
    </div>

    <!-- look-alike -->
    <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #FDEEE1; color: #7A4A02">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="5"></circle><circle cx="15" cy="12" r="5"></circle></svg>
          Katwe Fabricators already has this phone</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <a href="Suppliers.dc.html" style="text-align: center; padding: 11px; border-radius: 12px; background: #FFFFFF; color: #1C2233; font-size: 14px; font-weight: 700">Use that one</a>
          <button type="button" onClick="{{different}}" style="all: unset; cursor: pointer; text-align: center; padding: 11px; border-radius: 12px; background: #16203C; color: #FFFFFF; font-size: 14px; font-weight: 700">A different one</button>
        </div>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #5F6980">What they sell</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{tags}}" as="t" hint-placeholder-count="5">
          <button type="button" onClick="{{t.toggle}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #5F6980">Days of credit</span>
      <div style="display: flex; gap: 6px">
        <sc-for list="{{credit}}" as="c" hint-placeholder-count="4">
          <button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E6E3DD; box-shadow: 0 -8px 24px rgba(22,32,60,.08); padding: 12px 16px 18px">
    <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
      <a href="Suppliers.dc.html" style="display: block; text-align: center; padding: 15px 10px; border-radius: 14px; background: #C93A30; color: #FFFFFF; font-size: 15px; font-weight: 700">Add the supplier</a>
    </sc-if>
    <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
      <button type="button" disabled="disabled" style="all: unset; box-sizing: border-box; width: 100%; display: block; text-align: center; padding: 15px 10px; border-radius: 14px; background: #F1EEE8; color: #5F6980; font-size: 14px; font-weight: 700">Answer the look-alike first</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { diff: false, tags: { Fabrication: true, Mesh: true }, credit: 'Cash', filled: false }; }
  renderVals() {
    const S = this.state;
    const chip = (on) => 'all:unset;cursor:pointer;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;' + (on ? 'background:#16203C;color:#FFFFFF' : 'background:#F1EEE8');
    const tags = ['Fabrication', 'Mesh', 'Fasteners', 'Hoop iron', 'Gutters'].map(label => ({
      label, style: chip(!!S.tags[label]),
      toggle: () => this.setState({ tags: { ...S.tags, [label]: !S.tags[label] } })
    }));
    const credit = ['Cash', '7', '14', '30'].map(label => ({ label, style: chip(S.credit === label), pick: () => this.setState({ credit: label }) }));
    return { tags, credit, open: !S.diff, ready: S.diff, different: () => this.setState({ diff: true }), filled: S.filled, read: () => this.setState({ filled: true }) };
  }
}
</script>
</body>
</html>
