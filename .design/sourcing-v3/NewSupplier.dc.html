<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourcing · A new supplier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* figures in the mono face everywhere, words in Figtree: digits come from Plex Mono */
@font-face{font-family:'OW Figures';font-weight:400;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:500;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
@font-face{font-family:'OW Figures';font-weight:600 700;src:url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3vAOwlBFgg.woff2) format('woff2');unicode-range:U+0030-0039}
.nm{font-family:Figtree,system-ui,sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#6B7480}
/* rule 10: a drawn size is not the hit area. Every control reaches at least 44 x 44 */
:where(a,button,[role=radio],[role=tab],[role=switch]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative!important}
:where(a,button,[role=radio],[role=tab],[role=switch])::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@keyframes owPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes owPulseA{0%{box-shadow:0 0 0 0 rgba(245,178,107,.6)}70%{box-shadow:0 0 0 6px rgba(245,178,107,0)}100%{box-shadow:0 0 0 0 rgba(245,178,107,0)}}
@keyframes owRingA{0%,100%{box-shadow:0 0 0 3px #19223F,0 0 0 5px rgba(245,178,107,.95)}50%{box-shadow:0 0 0 3px #19223F,0 0 0 8px rgba(245,178,107,.25)}}
@keyframes owUndoRun{to{stroke-dashoffset:62.8}}
@keyframes owGone{to{opacity:0;visibility:hidden}}
@keyframes owChev{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F2; font-family: 'OW Figures', Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column">
  <div style="flex: none; background: radial-gradient(130% 90% at 50% 0%, #2B3866 0%, #16203C 65%); border-radius: 0 0 30px 30px; padding: 10px 16px 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="Suppliers.dc.html" aria-label="Back to Suppliers" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: rgba(255,255,255,.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="flex: 1; min-width: 0; text-align: center; font-size: 13px; font-weight: 700; color: #B3BCD2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">A new supplier</span>
      <span style="width: 44px; height: 44px; flex: none"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button type="button" onClick="{{read}}" style="all: unset; cursor: pointer; box-sizing: border-box; height: 84px; border-radius: 18px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); padding: 12px; display: flex; flex-direction: column; justify-content: space-between"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path></svg><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 700">Snap their card</span><span style="font-size: 11px; font-weight: 600; color: #B3BCD2">fills the fields</span></span></button><button type="button" onClick="{{read}}" style="all: unset; cursor: pointer; box-sizing: border-box; height: 84px; border-radius: 18px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); padding: 12px; display: flex; flex-direction: column; justify-content: space-between"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"></path></svg><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 700">From contacts</span><span style="font-size: 11px; font-weight: 600; color: #B3BCD2">name and phone</span></span></button></div>
    <sc-if value="{{filled}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #6FDCB0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>Read from the card · check each field</span></sc-if>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E6E3DD"><span style="width: 54px; font-size: 12px; font-weight: 700; color: #5F6980">Name</span><input value="{{nameVal}}" aria-label="Name" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; font-weight: 600"></label>
    <label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E6E3DD"><span style="width: 54px; font-size: 12px; font-weight: 700; color: #5F6980">Phone</span><input value="{{phoneVal}}" aria-label="Phone" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; font-weight: 600; font-family: IBM Plex Mono, monospace"></label>
    <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
    <div style="border-radius: 20px; background: #FFFBF6; box-shadow: inset 0 0 0 1.5px #F3DCC4; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <span style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; flex: none; border-radius: 999px; background: #E4E6FA; color: #3A3F9B; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">KF</span><span style="flex: 1; font-size: 13px; font-weight: 700; color: #7A4A02">Katwe Fabricators already has this phone</span></span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <a href="Suppliers.dc.html" style="height: 42px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E6E3DD; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">Use that one</a>
        <button type="button" onClick="{{different}}" style="all: unset; cursor: pointer; height: 42px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E6E3DD; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">A different one</button>
      </div>
    </div>
    </sc-if>
    <label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E6E3DD"><span style="width: 54px; font-size: 12px; font-weight: 700; color: #5F6980">Where</span><input value="{{whereVal}}" aria-label="Where" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; font-weight: 600"></label>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 8px 4px 0"><span style="font-size: 13px; font-weight: 700; color: #5F6980">What they sell</span><span style="font-size: 12px; font-weight: 600; color: #5F6980">pick any</span></div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{tags}}" as="t" hint-placeholder-count="4"><button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for></div>
    <span style="padding: 8px 4px 0; font-size: 13px; font-weight: 700; color: #5F6980">Days of credit</span>
    <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{credit}}" as="t" hint-placeholder-count="4"><button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for></div>
  </div>
  <div style="flex: none; padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="all: unset; cursor: pointer; box-sizing: border-box; width: 100%; height: 58px; border-radius: 999px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; {{ctaStyle}}">{{cta}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { diff: false, tags: {}, credit: null, filled: false }; }
  renderVals() {
    const S = this.state;
    const chip = (on) => 'all:unset;cursor:pointer;box-sizing:border-box;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;display:flex;align-items:center;' + (on ? 'background:#16203C;color:#FFFFFF' : 'background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #E6E3DD');
    const tags = ['Fabrication', 'Mesh', 'Fasteners', 'Hoop iron', 'Gutters'].map(label => ({ label, on: String(!!S.tags[label]), style: chip(!!S.tags[label]), pick: () => this.setState({ tags: { ...S.tags, [label]: !S.tags[label] } }) }));
    const credit = ['Cash', '7 d', '14 d', '30 d'].map(label => ({ label, on: String(S.credit === label), style: chip(S.credit === label), pick: () => this.setState({ credit: label }) }));
    const ready = S.diff && !!S.credit;
    return {
      tags, credit, open: !S.diff && S.filled, filled: S.filled,
      different: () => this.setState({ diff: true }),
      read: () => this.setState({ filled: true, tags: { Fabrication: true, Mesh: true } }),
      nameVal: S.filled ? 'Kawempe Metal Works' : '', phoneVal: S.filled ? '0772 418 220' : '', whereVal: S.filled ? 'Kawempe, by the market' : '',
      cta: !S.filled ? 'Snap their card, or type' : !S.diff ? 'Answer the look-alike first' : !S.credit ? 'Pick their credit days' : 'Add the supplier',
      ctaStyle: ready ? 'background:#C93A30;color:#FFFFFF;box-shadow:0 10px 22px rgba(201,58,48,.26)' : 'background:#F3D3CF;color:#8E2A22'
    };
  }
}
</script>
</body>
</html>
