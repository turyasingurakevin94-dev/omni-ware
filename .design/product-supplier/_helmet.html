<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    *{box-sizing:border-box;}
    body{margin:0;background:#E9EBED;color:#14171B;
      font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:13px;
      -webkit-font-smoothing:antialiased;}
    a{color:#14171B;} a:hover{color:#B23A26;}
    .ic{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;
      stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;
      font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
    .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
    .pan{background:#FFFFFF;border:1px solid #CFD5DA;border-radius:8px;}
    .pan-h{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;
      border-bottom:1px solid #E3E7EA;}
    .pan-t{font-size:12px;font-weight:600;letter-spacing:.01em;}
    .pan-n{font-size:11px;color:#8A939C;}
    .lbl{font-size:11px;font-weight:600;letter-spacing:.09em;color:#8A939C;}
    .cap{font-size:11px;color:#8A939C;line-height:1.35;}
    .note{font-size:12px;color:#59626B;line-height:1.5;}
    .hd{font-family:'Archivo Black',sans-serif;letter-spacing:-.015em;line-height:1.1;margin:0;}
  </style>
</helmet>
