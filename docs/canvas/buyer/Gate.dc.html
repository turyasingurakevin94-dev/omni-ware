<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buyer sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0} a{color:#16203C}a:hover{color:#C93A30}</style>
</helmet>
<div style="width: 2040px; height: 1000px; box-sizing: border-box; padding: 40px; background: #F7F5F2; font-family: Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; align-items: center; gap: 16px; height: 64px">
    <span style="font-size: 28px; font-weight: 800">Sign in</span>
    <span style="height: 32px; padding: 0 14px; border-radius: 999px; background: #16203C; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center">Before Today · once per phone</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5F6980">2 fields · 1 button · the phone keeps you signed in</span>
  </div>
  <div style="display: flex; gap: 40px">
    <sc-for list="{{phones}}" as="ph" hint-placeholder-count="4">
      <div style="width: 360px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #5F6980">{{ph.label}}</span>
        <div style="width: 360px; height: 780px; box-sizing: border-box; border-radius: 32px; border: 1px solid #E6E3DD; overflow: hidden; background: #F7F5F2; display: flex; flex-direction: column">
          <div style="background: #16203C; color: #fff; border-radius: 0 0 28px 28px; padding: 56px 24px 36px; display: flex; flex-direction: column; gap: 18px">
            <div style="display: flex; align-items: center; gap: 12px">
              <span style="width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6FDCB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h13v10H3z"></path><path d="M16 10h3l2 3v4h-5"></path><circle cx="7" cy="18" r="1.6"></circle><circle cx="18" cy="18" r="1.6"></circle></svg>
              </span>
              <div style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #B3BCD2">Mukasa Hardware</span>
                <span style="font-size: 26px; font-weight: 800">Buyer</span>
              </div>
            </div>
            <span style="font-size: 15px; font-weight: 600; color: #B3BCD2">Ask suppliers · plan the trip · hand in</span>
          </div>
          <form style="margin: 20px 16px 0; background: #fff; border: 1px solid #E6E3DD; border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #5F6980">Email
              <input type="email" value="{{ph.email}}" style="height: 48px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid {{ph.emailLine}}; padding: 0 14px; font: 600 16px Figtree, sans-serif; color: #1C2233; background: #fff"/>
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #5F6980">Password
              <input type="password" value="{{ph.pass}}" style="height: 48px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid {{ph.passLine}}; padding: 0 14px; font: 600 16px Figtree, sans-serif; color: #1C2233; background: #fff"/>
            </label>
            <sc-if value="{{ph.err}}" hint-placeholder-val="{{ false }}">
              <div role="alert" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border-radius: 12px; background: {{ph.errBg}}; color: {{ph.errFg}}; font-size: 14px; font-weight: 700">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
                {{ph.errText}}
              </div>
            </sc-if>
            <button type="button" style="height: 56px; border: none; border-radius: 999px; background: {{ph.btnBg}}; color: {{ph.btnFg}}; font: 700 16px Figtree, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">{{ph.btn}}</button>
          </form>
          <span style="margin: 16px 24px 0; font-size: 13px; font-weight: 600; color: #5F6980; text-align: center">No login yet? Ask the shop for one</span>
        </div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F6980">{{ph.note}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2040,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const base = { email: '', pass: '', emailLine: '#E6E3DD', passLine: '#E6E3DD', err: false, errBg: '', errFg: '', errText: '', btn: 'Sign in', btnBg: '#16203C', btnFg: '#fff' };
    const phones = [
      { ...base, label: '1 · Default', note: '1 tap · then Today' },
      { ...base, label: '2 · Signing in', email: 'denis@mukasa.ug', pass: '••••••••', emailLine: '#16203C', btn: 'Signing in…', btnBg: '#243052', btnFg: '#B3BCD2', note: 'sending · the button waits' },
      { ...base, label: '3 · Error', email: 'denis@mukasa.ug', pass: '••••', passLine: '#8E2A22', err: true, errBg: '#FBE5E2', errFg: '#8E2A22', errText: 'Wrong email or password', note: 'error · type it again' },
      { ...base, label: '4 · Offline', email: 'denis@mukasa.ug', pass: '••••••••', err: true, errBg: '#FDEEE1', errFg: '#7A4A02', errText: 'No signal · try when you have signal', btnBg: '#C9C4BA', btnFg: '#fff', note: 'offline · the button waits for signal' },
    ];
    return { phones };
  }
}
</script>
</body>
</html>
