<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supplier phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1240px; height: 1000px; box-sizing: border-box; padding: 40px; background: #F7F5F2; font-family: Figtree, system-ui, sans-serif; color: #1C2233; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; align-items: center; gap: 16px; height: 64px">
    <span style="font-size: 28px; font-weight: 800">Drawn for the build · 2</span>
    <span style="height: 32px; padding: 0 14px; border-radius: 999px; background: #16203C; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center">The fix sheet's Phone tab</span>
  </div>
  <div style="display: flex; gap: 40px">
    <sc-for list="{{phones}}" as="ph" hint-placeholder-count="3">
      <div style="width: 360px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #5F6980">{{ph.label}}</span>
        <div style="width: 360px; height: 780px; box-sizing: border-box; border-radius: 32px; border: 1px solid #E6E3DD; overflow: hidden; background: rgba(12,19,38,.72); position: relative">
          <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 64px; background: #fff; border-radius: 26px 26px 0 0; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 14px">
            <div style="height: 24px; display: flex; justify-content: center; align-items: center"><span style="width: 40px; height: 5px; border-radius: 999px; background: #C9C4BA"></span></div>
            <div style="display: flex; align-items: center; gap: 12px">
              <span style="width: 44px; height: 44px; border-radius: 12px; background: #F1EEE8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">KF</span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 17px">Katwe Fabricators</b><span style="font-size: 12px; font-weight: 600; color: #5F6980">Katwe · supplier</span></span>
              <span style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E6E3DD; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C2233" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></span>
            </div>
            <div style="height: 48px; border-radius: 999px; background: #F1EEE8; padding: 4px; display: flex; box-sizing: border-box">
              <span style="flex: 1; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700; color: #5F6980">Price</span>
              <span style="flex: 1; border-radius: 999px; background: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C2233" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>Phone</span>
            </div>
            <div style="border-radius: 14px; background: #F1EEE8; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between">
              <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #5F6980">On the list</span><b style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; color: #5F6980">0782 554 017</b></span>
              <span style="height: 28px; padding: 0 10px; border-radius: 999px; background: #E4F4EA; color: #0F6B43; font-size: 12px; font-weight: 700; display: flex; align-items: center">WhatsApp</span>
            </div>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #5F6980">New number
              <span style="height: 56px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid {{ph.line}}; display: flex; align-items: center; padding: 0 14px; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: #1C2233; letter-spacing: normal; text-transform: none">{{ph.number}}</span>
            </label>
            
            <sc-if value="{{ph.done}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border-radius: 12px; background: #E4F4EA; color: #0F6B43; font-size: 14px; font-weight: 700">Sent · Moses checks it, then the list changes</div>
            </sc-if>
            <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: #5F6980">
              <span style="width: 32px; height: 32px; border-radius: 999px; background: #16203C; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">DO</span>
              <span style="flex: 1; border-top: 2px dashed #C9C4BA"></span>
              <span style="width: 32px; height: 32px; border-radius: 999px; background: #FDEEE1; color: #7A4A02; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">ML</span>
              <span>Moses sees it · <b style="color: #1C2233">a suggestion</b></span>
            </div>
            <button type="button" style="height: 56px; border: none; border-radius: 999px; background: {{ph.btnBg}}; color: {{ph.btnFg}}; font: 700 16px Figtree, sans-serif">{{ph.btn}}</button>
          </div>
        </div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F6980">{{ph.note}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1240,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const phones = [
      { label: 'F · Phone · empty', number: '', line: '#E6E3DD', done: false, btn: 'Send to Moses', btnBg: '#C9C4BA', btnFg: '#fff', note: 'disabled until a full number' },
      { label: 'G · Phone · typed', number: '0782 554 019', line: '#16203C', done: false, btn: 'Send to Moses', btnBg: '#16203C', btnFg: '#fff', note: '1 tap · a phone is Sourcing\'s to change' },
      { label: 'H · Phone · sent', number: '0782 554 019', line: '#E6E3DD', done: true, btn: 'Done', btnBg: '#16203C', btnFg: '#fff', note: 'success · the sheet closes on Done' },
    ];
    return { phones };
  }
}
</script>
</body>
</html>
